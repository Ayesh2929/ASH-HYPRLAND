# ══════════════════════════════════════════════════════════════════════════════
#  🟡 STATUS — Current state of the issue/PR
# ══════════════════════════════════════════════════════════════════════════════

- name: "⏳ status: pending triage"
  color: "fbbf24"
  description: "Awaiting initial review and categorization"

- name: "✅ status: confirmed"
  color: "16a34a"
  description: "Issue confirmed and accepted for work"

- name: "🚧 status: in progress"
  color: "0891b2"
  description: "Actively being worked on"

- name: "👀 status: needs review"
  color: "7c3aed"
  description: "Ready for code review"

- name: "🔄 status: changes requested"
  color: "ea580c"
  description: "Changes requested by reviewer"

- name: "✔️ status: approved"
  color: "15803d"
  description: "Approved and ready to merge"

- name: "🚫 status: blocked"
  color: "b91c1c"
  description: "Blocked by another issue or external factor"

- name: "⏸️ status: on hold"
  color: "78716c"
  description: "Temporarily paused"

- name: "❓ status: needs info"
  color: "f59e0b"
  description: "Waiting for more information from reporter"

- name: "🔁 status: needs rebase"
  color: "a16207"
  description: "PR needs to be rebased on latest main"

- name: "💡 status: idea"
  color: "c4b5fd"
  description: "Interesting idea under consideration"

- name: "🗓️ status: backlog"
  color: "94a3b8"
  description: "Accepted but not yet scheduled"

- name: "🎯 status: next release"
  color: "0d9488"
  description: "Targeted for the next release"


# ══════════════════════════════════════════════════════════════════════════════
#  🔵 PRIORITY — How urgently does this need attention?
# ══════════════════════════════════════════════════════════════════════════════

- name: "🔴 priority: critical"
  color: "7f1d1d"
  description: "Drop everything — fix immediately"

- name: "🟠 priority: high"
  color: "c2410c"
  description: "Address in current sprint/milestone"

- name: "🟡 priority: medium"
  color: "a16207"
  description: "Address soon but not blocking"

- name: "🟢 priority: low"
  color: "166534"
  description: "Nice to have — address when bandwidth allows"

- name: "⚪ priority: none"
  color: "6b7280"
  description: "No priority assigned yet"


