# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.1.0 — REPOSITORY SETTINGS                        ║
# ║           Managed via github-settings app                                  ║
# ║           Install: https://github.com/apps/settings                        ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

repository:
  name: ash-dots
  description: "🚀 The most complete Hyprland dotfiles — Dynamic themes, AI colors, Music reactive, Health score"
  homepage: https://yourusername.github.io/ash-dots
  topics:
    - hyprland
    - dotfiles
    - wayland
    - arch-linux
    - rice
    - theming
    - catppuccin
    - neovim
    - waybar
    - fish-shell
  private: false
  has_issues: true
  has_projects: true
  has_wiki: false
  has_downloads: true
  has_discussions: true
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: true
  allow_auto_merge: false
  delete_branch_on_merge: true
  enable_vulnerability_alerts: true
  enable_automated_security_fixes: true

labels:
  # Type labels
  - name: bug
    color: 'd73a4a'
    description: Something isn't working
  - name: enhancement
    color: 'a2eeef'
    description: New feature or request
  - name: documentation
    color: '0075ca'
    description: Improvements or additions to documentation
  - name: performance
    color: 'e4e669'
    description: Performance improvements
  - name: security
    color: 'ee0701'
    description: Security related issue
  - name: refactor
    color: 'cfd3d7'
    description: Code refactoring (no new features)
  - name: ci
    color: '0052cc'
    description: CI/CD related changes

  # Priority labels
  - name: priority:critical
    color: 'b60205'
    description: Needs immediate attention
  - name: priority:high
    color: 'd93f0b'
    description: High priority
  - name: priority:medium
    color: 'e4e669'
    description: Medium priority
  - name: priority:low
    color: '0e8a16'
    description: Low priority

  # Status labels
  - name: needs-triage
    color: 'e11d48'
    description: Needs initial review and categorization
  - name: needs-discussion
    color: 'd876e3'
    description: Requires community discussion
  - name: needs-reproduction
    color: 'f9d0c4'
    description: Cannot reproduce — more info needed
  - name: in-progress
    color: 'fbca04'
    description: Currently being worked on
  - name: blocked
    color: 'e4e669'
    description: Blocked by another issue or PR
  - name: wontfix
    color: 'ffffff'
    description: This will not be worked on
  - name: duplicate
    color: 'cfd3d7'
    description: This issue or PR already exists

  # Component labels
  - name: hyprland
    color: '00aabb'
    description: Hyprland configuration
  - name: waybar
    color: '1d76db'
    description: Waybar status bar
  - name: rofi
    color: '6f42c1'
    description: Rofi launcher
  - name: fish
    color: '0075ca'
    description: Fish shell
  - name: neovim
    color: '57a55e'
    description: Neovim IDE
  - name: theme-engine
    color: 'e99695'
    description: Dynamic theme system
  - name: unique-feature
    color: 'ffd700'
    description: One of the 9 unique features
  - name: ci-cd
    color: '0052cc'
    description: CI/CD pipeline

  # Other
  - name: good-first-issue
    color: '7057ff'
    description: Good for newcomers
  - name: help-wanted
    color: '008672'
    description: Extra attention is needed
  - name: automated
    color: 'bfd4f2'
    description: Created by automation
  - name: dependencies
    color: '0366d6'
    description: Pull requests that update dependencies

milestones:
  - title: v3.2.0
    description: "Light mode, theme store, SDDM theming"
    state: open
  - title: v3.3.0
    description: "Cloud sync, voice control, GUI settings"
    state: open
  - title: v4.0.0
    description: "Plugin system, multi-distro support"
    state: open

branches:
  - name: main
    protection:
      required_status_checks:
        strict: true
        contexts:
          - "🚀 CI Pipeline / ⚙️ Setup & Cache"
          - "🚀 CI Pipeline / 🔍 Lint (shellcheck)"
          - "🚀 CI Pipeline / 📋 Validate (required-files)"
          - "🚀 CI Pipeline / 📋 Validate (unique-features)"
          - "🚀 CI Pipeline / 🔒 Security (secrets)"
          - "🚀 CI Pipeline / ✅ CI Status"
      enforce_admins: false
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
      restrictions: null
      allow_force_pushes: false
      allow_deletions: false
      required_linear_history: true
      required_conversation_resolution: true

  - name: dev
    protection:
      required_status_checks:
        strict: false
        contexts:
          - "🚀 CI Pipeline / ✅ CI Status"
      enforce_admins: false
      required_pull_request_reviews:
        required_approving_review_count: 0
      allow_force_pushes: true
      allow_deletions: false