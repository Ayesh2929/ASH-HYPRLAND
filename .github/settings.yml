    permission: push

  - username: ash-release-bot
    permission: maintain


# ── ENVIRONMENTS ──────────────────────────────────────────────────────────────
# Deployment environments with protection rules
environments:

  - name: production
    wait_timer: 0
    reviewers:
      - type: Team
        id: core-maintainers
    deployment_branch_policy:
      protected_branches: true
      custom_branch_policies: false

  - name: staging
    wait_timer: 0
    reviewers:
      - type: Team
        id: devops
    deployment_branch_policy:
      protected_branches: false
      custom_branch_policies: true
      # Only from main, develop, and release/*
      name_patterns:
        - "main"
        - "develop"
        - "release/*"

  - name: preview
    wait_timer: 0
    reviewers: []
    deployment_branch_policy:
      protected_branches: false
      custom_branch_policies: true
      name_patterns:
        - "feature/*"
        - "fix/*"
        - "chore/*"