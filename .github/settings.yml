# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ⚙️  ASH DOTFILES v5.0 OMEGA — REPOSITORY SETTINGS                         ║
# ║  Managed by the Settings GitHub App                                         ║
# ║  https://github.com/apps/settings                                           ║
# ║  Apply changes via PR — never change settings directly on GitHub            ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ── REPOSITORY METADATA ───────────────────────────────────────────────────────
repository:
  # Repository display name
  name: ash-dotfiles

  # SEO-optimized description
  description: >-
    🌊 ASH Dotfiles v5.0 OMEGA — The most advanced Hyprland dotfiles ever
    created. 250+ themes, 150+ plugins, AI-powered theming, REST API,
    web dashboard, mobile app & more. Production-grade dotfiles for power users.

  # Repository website
  homepage: https://ash-dotfiles.dev

  # Topics for discoverability (max 20)
  topics:
    - dotfiles
    - hyprland
    - wayland
    - linux
    - arch-linux
    - ricing
    - neovim
    - fish-shell
    - theming
    - waybar
    - rofi
    - catppuccin
    - tokyo-night
    - hyprlock
    - fastfetch
    - kitty
    - ags
    - customization
    - workflow
    - productivity

  # Visibility
  private: false

  # ── FEATURE FLAGS ────────────────────────────────────────────────────────────
  has_issues: true
  has_projects: true
  has_wiki: true
  has_downloads: true
  has_discussions: true

  # ── DEFAULT BRANCH ───────────────────────────────────────────────────────────
  default_branch: main

  # ── MERGE STRATEGY ───────────────────────────────────────────────────────────
  # Only allow squash merging — keeps history clean
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: true

  # Auto-delete branches after PR merge
  delete_branch_on_merge: true

  # ── SECURITY FEATURES ────────────────────────────────────────────────────────
  # Enable vulnerability alerts
  enable_vulnerability_alerts: true

  # Enable automated security fixes
  enable_automated_security_fixes: true

  # ── SQUASH MERGE DEFAULTS ────────────────────────────────────────────────────
  # Use PR title as default squash commit message
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY

  # ── MERGE COMMIT DEFAULTS ────────────────────────────────────────────────────
  merge_commit_title: PR_TITLE
  merge_commit_message: PR_BODY

  # ── ALLOW FORKING ────────────────────────────────────────────────────────────
  allow_forking: true


# ── BRANCH PROTECTION RULES ───────────────────────────────────────────────────
branches:

  # ── MAIN BRANCH — Strictest protection ────────────────────────────────────
  - name: main
    protection:
      # Require PR before merging
      required_pull_request_reviews:
        # Number of approvals required
        required_approving_review_count: 2
        # Dismiss stale reviews when new commits are pushed
        dismiss_stale_reviews: true
        # Require review from code owners (CODEOWNERS file)
        require_code_owner_reviews: true
        # Restrict who can dismiss reviews
        dismissal_restrictions:
          users: []
          teams:
            - core-maintainers
        # Pull request review bypass (emergency only)
        bypass_pull_request_allowances:
          users: []
          teams:
            - core-maintainers
          apps: []

      # Required status checks
      required_status_checks:
        # Require branches to be up to date before merging
        strict: true
        contexts:
          # Lint checks
          - "lint / shellcheck"
          - "lint / luacheck"
          - "lint / yamllint"
          - "lint / markdownlint"
          - "lint / eslint-typescript"

          # Security checks
          - "security / gitleaks"
          - "security / codeql"
          - "security / trivy-scan"
          - "security / secret-scanning"

          # Test checks
          - "test / unit-tests"
          - "test / integration-tests"
          - "test / schema-validation"
          - "test / config-validation"

          # Build checks
          - "build / build-docker"
          - "build / build-docs"

      # Enforce branch restrictions
      enforce_admins: true

      # Do not allow force pushes
      allow_force_pushes: false

      # Do not allow branch deletion
      allow_deletions: false

      # Require signed commits
      required_signatures: true

      # Require linear history (no merge commits)
      required_linear_history: true

      # Lock branch (prevent any pushes) — false for active development
      lock_branch: false

      # Allow fork syncing
      allow_fork_syncing: true

      # Require conversation resolution before merging
      required_conversation_resolution: true

      # Require deployments to succeed before merging
      required_deployments:
        environments:
          - staging

      # Require merge queue
      required_merge_queue:
        merge_method: squash
        min_entries_to_merge: 1
        max_entries_to_merge: 5
        grouping_strategy: ALLGREEN


  # ── DEVELOP BRANCH — Standard protection ──────────────────────────────────
  - name: develop
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
        bypass_pull_request_allowances:
          teams:
            - core-maintainers
            - devops

      required_status_checks:
        strict: false
        contexts:
          - "lint / shellcheck"
          - "lint / yamllint"
          - "security / gitleaks"
          - "test / unit-tests"

      enforce_admins: false
      allow_force_pushes: false
      allow_deletions: false
      required_signatures: false
      required_linear_history: false
      required_conversation_resolution: true


  # ── RELEASE BRANCHES — Semi-strict protection ──────────────────────────────
  - name: "release/*"
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 2
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
        bypass_pull_request_allowances:
          teams:
            - core-maintainers

      required_status_checks:
        strict: true
        contexts:
          - "lint / shellcheck"
          - "security / gitleaks"
          - "security / trivy-scan"
          - "test / unit-tests"
          - "test / integration-tests"

      enforce_admins: true
      allow_force_pushes: false
      allow_deletions: false
      required_signatures: true
      required_linear_history: true
      required_conversation_resolution: true


  # ── HOTFIX BRANCHES — Expedited but protected ──────────────────────────────
  - name: "hotfix/*"
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: false
        require_code_owner_reviews: true
        bypass_pull_request_allowances:
          teams:
            - core-maintainers

      required_status_checks:
        strict: false
        contexts:
          - "security / gitleaks"
          - "test / unit-tests"

      enforce_admins: false
      allow_force_pushes: false
      allow_deletions: true
      required_signatures: false
      required_conversation_resolution: false


