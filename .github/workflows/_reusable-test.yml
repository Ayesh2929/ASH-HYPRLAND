name: "🧪 Test"
on:
  workflow_call:
    inputs:
      api_exists:
        type: string
        required: true
      has_api:
        type: string
        required: true
      web_exists:
        type: string
        required: true
      web_lock_exists:
        type: string
        required: true
      has_web:
        type: string
        required: true
      run_full:
        type: string
        required: true


jobs:
  test-shell:
    name: "🧪 Shell Unit Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y bats jq --no-install-recommends
      - run: |
          mkdir -p tests/helpers
          git clone --depth=1 https://github.com/bats-core/bats-support.git tests/helpers/bats-support
          git clone --depth=1 https://github.com/bats-core/bats-assert.git tests/helpers/bats-assert
      - run: |
          if [[ -d tests/unit ]]; then bats --formatter tap tests/unit/test-*.sh || true; fi

  test-theme-engine:
    name: "🎨 Theme Engine Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.12
      - run: pip install Pillow --quiet
      - name: "🎨 Validate theme color files"
        run: |
          set -euo pipefail
          ERRORS=0
          TESTED=0
          REQUIRED_KEYS='["background","foreground","accent"]'

          for colors_file in $(find themes/presets -name "colors.json" 2>/dev/null); do
            TESTED=$((TESTED + 1))
            THEME=$(basename "$(dirname "$colors_file")")

            # 1. Valid JSON
            if ! jq empty "$colors_file" 2>/dev/null; then
              echo "❌ $THEME: Invalid JSON"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # 2. Required keys present
            for key in background foreground accent; do
              if ! jq -e ".$key" "$colors_file" >/dev/null 2>&1; then
                echo "❌ $THEME: Missing required key '$key'"
                ERRORS=$((ERRORS + 1))
              fi
            done

            # 3. Valid hex color format
            for key in $(jq -r 'keys[]' "$colors_file"); do
              val=$(jq -r ".$key" "$colors_file")
              if [[ "$val" =~ ^# ]] && [[ ! "$val" =~ ^#[0-9a-fA-F]{6}$ ]]; then
                echo "⚠️ $THEME: Invalid hex color '$key': $val"
              fi
            done
          done

          echo "## 🎨 Theme Engine Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "Tested $TESTED themes, $ERRORS errors" >> "$GITHUB_STEP_SUMMARY"
          [[ $ERRORS -gt 0 ]] && exit 1 || echo "✅ All theme colors valid"

  test-plugins:
    name: "🔌 Plugin Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: |
          find plugins -name "plugin.json" -print0 | xargs -0 jq -r '.name' || true

  test-api:
    name: "🌐 API Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: inputs.api_exists == 'true' && (inputs.has_api == 'true' || inputs.run_full == 'true')
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.12
      - working-directory: api
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov pytest-timeout httpx fakeredis --quiet
      - working-directory: api
        env:
          ASH_ENV: test
          ASH_SECRET_KEY: ci-test-key-not-for-production
          REDIS_URL: redis://localhost:6379
          API_BASE_URL: http://localhost:8000
        run: |
          python server.py &
          sleep 5
          pytest tests/ --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=70 --junit-xml=pytest-results.xml --timeout=30 --tb=short -v

  test-web:
    name: "🌐 Web Dashboard Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: inputs.web_exists == 'true' && (inputs.has_web == 'true' || inputs.run_full == 'true')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - working-directory: web
        run: npm ci --prefer-offline || npm install --prefer-offline
      - working-directory: web
        run: npx vitest run --reporter=verbose --reporter=junit --outputFile=vitest-results.xml || true
