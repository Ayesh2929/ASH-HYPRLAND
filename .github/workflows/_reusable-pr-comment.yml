name: "💬 PR Comment"
on:
  workflow_call:
    inputs:
      lint_result:
        type: string
        required: false
        default: 'skipped'
      test_result:
        type: string
        required: false
        default: 'skipped'
      security_result:
        type: string
        required: false
        default: 'skipped'
      build_result:
        type: string
        required: false
        default: 'skipped'
      benchmark_result:
        type: string
        required: false
        default: 'skipped'
      screenshots_result:
        type: string
        required: false
        default: 'skipped'
      deploy_result:
        type: string
        required: false
        default: 'skipped'
      preview_url:
        type: string
        required: false
        default: ''

jobs:
  pr-comment:
    name: "💬 Post CI Status"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: "📊 Build status comment"
        id: comment
        run: |
          set -euo pipefail
          
          status_emoji() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              *) echo "⏳" ;;
            esac
          }
          
          cat > /tmp/pr-comment.md << 'HEADER'
          ## 🚀 ASH Dotfiles CI/CD Status
          
          | Stage | Status | Details |
          |-------|--------|---------|  
          HEADER
          
          echo "| ✅ Lint | $(status_emoji '${{ inputs.lint_result }}') ${{ inputs.lint_result }} | ShellCheck, Luacheck, ESLint, Ruff |" >> /tmp/pr-comment.md
          echo "| 🔒 Security | $(status_emoji '${{ inputs.security_result }}') ${{ inputs.security_result }} | Gitleaks, Trivy, CodeQL |" >> /tmp/pr-comment.md
          echo "| 🧪 Tests | $(status_emoji '${{ inputs.test_result }}') ${{ inputs.test_result }} | BATS, pytest, Vitest |" >> /tmp/pr-comment.md
          echo "| 🏗️ Build | $(status_emoji '${{ inputs.build_result }}') ${{ inputs.build_result }} | Web, Docker, Nix |" >> /tmp/pr-comment.md
          echo "| 📊 Benchmarks | $(status_emoji '${{ inputs.benchmark_result }}') ${{ inputs.benchmark_result }} | Hyperfine performance |" >> /tmp/pr-comment.md
          echo "| 🖼️ Screenshots | $(status_emoji '${{ inputs.screenshots_result }}') ${{ inputs.screenshots_result }} | Theme rendering |" >> /tmp/pr-comment.md
          echo "| 🚀 Deploy | $(status_emoji '${{ inputs.deploy_result }}') ${{ inputs.deploy_result }} | Preview deployment |" >> /tmp/pr-comment.md
          
          echo '' >> /tmp/pr-comment.md
          
          if [[ -n '${{ inputs.preview_url }}' ]]; then
            echo '### 🔮 Preview' >> /tmp/pr-comment.md
            echo '🌐 **[View Preview](${{ inputs.preview_url }})**' >> /tmp/pr-comment.md
            echo '' >> /tmp/pr-comment.md
          fi
          
          echo '<details><summary>📋 Pipeline Details</summary>' >> /tmp/pr-comment.md
          echo '' >> /tmp/pr-comment.md
          echo "- **Commit**: \`${GITHUB_SHA::8}\`" >> /tmp/pr-comment.md
          echo "- **Workflow**: [Run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> /tmp/pr-comment.md
          echo "- **Pipeline**: ASH Dotfiles CI/CD v7.0 SUPERNOVA" >> /tmp/pr-comment.md
          echo '' >> /tmp/pr-comment.md
          echo '</details>' >> /tmp/pr-comment.md

      - name: "💬 Post comment"
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-status
          path: /tmp/pr-comment.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
