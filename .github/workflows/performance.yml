# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.1.0 — PERFORMANCE BENCHMARKS                     ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

name: ⚡ Performance

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 3'   # Wednesday 4am
  workflow_dispatch:

jobs:

  benchmark-scripts:
    name: ⚡ Script Performance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: 🔧 Setup tools
        run: sudo apt-get install -y time bc imagemagick jq

      - name: ⚡ Benchmark syntax checks
        run: |
          echo "## ⚡ Performance Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmark | Time | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------|--------|" >> $GITHUB_STEP_SUMMARY

          # Benchmark: bash -n on all scripts
          START=$(date +%s%N)
          find . -name "*.sh" -not -path "./.git/*" | \
              xargs -I{} bash -n {} 2>/dev/null
          END=$(date +%s%N)
          ELAPSED=$(echo "scale=3; ($END - $START) / 1000000" | bc)
          echo "  Bash syntax check: ${ELAPSED}ms"
          echo "| All scripts syntax | ${ELAPSED}ms | ✅ |" >> $GITHUB_STEP_SUMMARY

      - name: ⚡ Benchmark JSON parsing
        run: |
          START=$(date +%s%N)
          find . -name "*.json" -not -path "./.git/*" | \
              xargs -I{} python3 -m json.tool {} > /dev/null 2>&1 || true
          END=$(date +%s%N)
          ELAPSED=$(echo "scale=3; ($END - $START) / 1000000" | bc)
          echo "  JSON parsing: ${ELAPSED}ms"
          echo "| JSON file parsing | ${ELAPSED}ms | ✅ |" >> $GITHUB_STEP_SUMMARY

      - name: ⚡ Benchmark color extraction
        run: |
          # Create test wallpaper
          convert -size 800x600 gradient:"#cba6f7-#1e1e2e" /tmp/bench-wall.png

          # Time color extraction
          START=$(date +%s%N)
          for i in {1..5}; do
              convert /tmp/bench-wall.png \
                  -filter Lanczos \
                  -resize 200x200^ \
                  -quantize transparent \
                  -colors 24 \
                  -unique-colors \
                  -format "%[hex:u]\n" \
                  info: > /dev/null 2>&1
          done
          END=$(date +%s%N)
          ELAPSED=$(echo "scale=1; ($END - $START) / 1000000 / 5" | bc)
          echo "  Color extraction: ${ELAPSED}ms per run (5 runs avg)"
          echo "| Color extraction (avg) | ${ELAPSED}ms | ✅ |" >> $GITHUB_STEP_SUMMARY

      - name: 📊 File count analysis
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Repository Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY

          SCRIPTS=$(find . -name "*.sh" -not -path "./.git/*" | wc -l)
          LUA=$(find . -name "*.lua" -not -path "./.git/*" | wc -l)
          CONF=$(find . -name "*.conf" -not -path "./.git/*" | wc -l)
          CSS=$(find . -name "*.css" -o -name "*.scss" -not -path "./.git/*" | wc -l)
          FISH=$(find . -name "*.fish" -not -path "./.git/*" | wc -l)
          TOTAL=$(find config -type f -not -path "./.git/*" | wc -l)

          echo "| Shell Scripts | $SCRIPTS |" >> $GITHUB_STEP_SUMMARY
          echo "| Lua Files | $LUA |" >> $GITHUB_STEP_SUMMARY
          echo "| Config Files | $CONF |" >> $GITHUB_STEP_SUMMARY
          echo "| CSS/SCSS | $CSS |" >> $GITHUB_STEP_SUMMARY
          echo "| Fish Files | $FISH |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Config** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY

  benchmark-history:
    name: 📈 Track History
    needs: benchmark-scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: 📈 Update benchmark history
        run: |
          DATE=$(date +%Y-%m-%d)
          SCRIPTS=$(find . -name "*.sh" -not -path "./.git/*" | wc -l)
          TOTAL=$(find config -type f 2>/dev/null | wc -l)

          echo "${DATE}: scripts=${SCRIPTS} total=${TOTAL}" >> .github/benchmark-history.txt 2>/dev/null || true
          echo "📈 Benchmark logged: ${DATE}"