# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.1.0 — ADVANCED SECURITY SCANNING                 ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

name: 🔒 Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'   # Monday 6am
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:

  scan-secrets:
    name: 🔑 Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Scan for hardcoded secrets
        run: |
          python3 - << 'PYEOF'
          import re, sys
          from pathlib import Path

          # Patterns that indicate secrets
          SECRET_PATTERNS = [
              (r'password\s*[=:]\s*["\'][^"\']{8,}["\']', 'Hardcoded password'),
              (r'api[_-]?key\s*[=:]\s*["\'][^"\']{10,}["\']', 'API key'),
              (r'secret\s*[=:]\s*["\'][^"\']{8,}["\']', 'Secret value'),
              (r'token\s*[=:]\s*["\'][^"\']{10,}["\']', 'Token'),
              (r'BEGIN RSA PRIVATE KEY', 'RSA private key'),
              (r'BEGIN OPENSSH PRIVATE KEY', 'SSH private key'),
              (r'ghp_[A-Za-z0-9]{36}', 'GitHub token'),
              (r'ghs_[A-Za-z0-9]{36}', 'GitHub secret'),
              (r'sk-[A-Za-z0-9]{48}', 'OpenAI key'),
              (r'xoxb-[A-Za-z0-9-]+', 'Slack token'),
              (r'AIza[0-9A-Za-z\-_]{35}', 'Google API key'),
          ]

          # Safe patterns (these are OK)
          SAFE_PATTERNS = [
              r'your-password-here',
              r'example',
              r'placeholder',
              r'\$\{.*\}',
              r'YOUR_.*_HERE',
              r'<your',
          ]

          issues = []
          extensions = {'.sh', '.lua', '.js', '.py', '.conf', '.json', '.toml', '.fish'}

          for filepath in Path('.').rglob('*'):
              if '.git' in str(filepath):
                  continue
              if filepath.suffix not in extensions:
                  continue
              if not filepath.is_file():
                  continue

              try:
                  content = filepath.read_text(errors='ignore')
              except:
                  continue

              for pattern, desc in SECRET_PATTERNS:
                  matches = re.findall(pattern, content, re.IGNORECASE)
                  for match in matches:
                      # Check if it's a safe pattern
                      is_safe = any(re.search(safe, match, re.IGNORECASE)
                                   for safe in SAFE_PATTERNS)
                      if not is_safe:
                          issues.append(f"  ⚠️  {filepath}: {desc}: {match[:40]}...")

          if issues:
              print("🚨 Potential secrets found:")
              for issue in issues:
                  print(issue)
              sys.exit(1)
          print("✅ No hardcoded secrets detected")
          PYEOF

      - name: 🔍 Check .gitignore coverage
        run: |
          python3 - << 'PYEOF'
          from pathlib import Path
          import sys

          gitignore = Path('.gitignore').read_text()

          MUST_IGNORE = [
              'UserOverrides',
              '*.pem',
              '*.key',
              '.env',
              '*.secret',
              'backups/',
              '*.log',
              'thumbnails/',
          ]

          issues = 0
          for pattern in MUST_IGNORE:
              if pattern in gitignore:
                  print(f"  ✅ Covered: {pattern}")
              else:
                  print(f"  ❌ NOT in .gitignore: {pattern}")
                  issues += 1

          if issues:
              print(f"\n❌ {issues} sensitive patterns not in .gitignore")
              sys.exit(1)
          print(f"\n✅ All sensitive patterns covered in .gitignore")
          PYEOF

      - name: 🔍 Check no personal data committed
        run: |
          # Check for common personal data patterns
          PATTERNS=(
              "id_rsa"
              "id_ed25519"
              ".ssh/config"
              "\.face$"
              "wallet\.dat"
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
              if git ls-files | grep -qE "${pattern}"; then
                  echo "⚠️  Personal file may be tracked: ${pattern}"
                  git ls-files | grep -E "${pattern}"
                  FOUND=$((FOUND+1))
              fi
          done

          [[ $FOUND -eq 0 ]] && echo "✅ No personal data files tracked"

  trivy-scan:
    name: 🛡️ Trivy Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: 🛡️ Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: 📤 Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  codeql-analysis:
    name: 🔬 CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: 🔬 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript
          queries: security-extended

      - name: 🔬 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  permission-audit:
    name: 🔐 Permission Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: 🔐 Audit file permissions
        run: |
          python3 - << 'PYEOF'
          import os, sys
          from pathlib import Path

          issues = 0

          # Scripts SHOULD be executable
          for script in Path('.').rglob('*.sh'):
              if '.git' in str(script):
                  continue
              if not os.access(str(script), os.X_OK):
                  print(f"  ⚠️  Not executable: {script}")
                  issues += 1

          # Config files should NOT be executable
          dangerous_exts = {'.json', '.conf', '.css', '.lua', '.rasi', '.toml'}
          for filepath in Path('.').rglob('*'):
              if '.git' in str(filepath):
                  continue
              if filepath.suffix in dangerous_exts and filepath.is_file():
                  mode = oct(os.stat(str(filepath)).st_mode)
                  if mode.endswith('5') or mode.endswith('7'):
                      print(f"  ⚠️  Config file is executable: {filepath}")

          if issues > 0:
              print(f"\n⚠️  {issues} script(s) not executable")
              print("Fix: find . -name '*.sh' -exec chmod +x {} \\;")
          else:
              print("✅ Permission audit passed")
          PYEOF