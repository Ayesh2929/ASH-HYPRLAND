# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.1.0 — AUTOMATED RELEASE PIPELINE                 ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

name: 🚀 Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v3.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
      draft:
        description: 'Create as draft'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:

  validate:
    name: ✅ Validation
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  test:
    name: 🧪 Tests
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  security:
    name: 🔒 Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  prepare-release:
    name: 📦 Prepare Release
    runs-on: ubuntu-latest
    needs: [validate, test, security]
    timeout-minutes: 20

    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.content }}
      file-count: ${{ steps.stats.outputs.file_count }}
      line-count: ${{ steps.stats.outputs.line_count }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              VERSION="${{ github.event.inputs.version }}"
          else
              VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "🏷️ Version: ${VERSION}"

      - name: 📋 Generate changelog
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")

          if [[ -n "${PREV_TAG}" ]]; then
              COMMITS=$(git log "${PREV_TAG}..HEAD" \
                  --pretty=format:"- %s (%h)" \
                  --no-merges 2>/dev/null)
          else
              COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges | head -30)
          fi

          # Categorize
          FEATURES=$(echo "$COMMITS" | grep "^- feat" || true)
          FIXES=$(echo "$COMMITS" | grep "^- fix" || true)
          PERF=$(echo "$COMMITS" | grep "^- perf" || true)
          DOCS=$(echo "$COMMITS" | grep "^- docs" || true)
          OTHER=$(echo "$COMMITS" | grep -v "^- feat\|^- fix\|^- perf\|^- docs\|^- chore" || true)

          CHANGELOG=""
          [[ -n "$FEATURES" ]] && CHANGELOG+="### ✨ New Features\n$FEATURES\n\n"
          [[ -n "$FIXES" ]]    && CHANGELOG+="### 🐛 Bug Fixes\n$FIXES\n\n"
          [[ -n "$PERF" ]]     && CHANGELOG+="### ⚡ Performance\n$PERF\n\n"
          [[ -n "$DOCS" ]]     && CHANGELOG+="### 📚 Documentation\n$DOCS\n\n"
          [[ -n "$OTHER" ]]    && CHANGELOG+="### 🔧 Other\n$OTHER\n\n"

          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 📊 Generate stats
        id: stats
        run: |
          FILE_COUNT=$(find config -type f 2>/dev/null | wc -l)
          SCRIPT_COUNT=$(find . -name "*.sh" 2>/dev/null | wc -l)
          LINE_COUNT=$(find . -type f \( -name "*.sh" -o -name "*.lua" \
              -o -name "*.conf" -o -name "*.css" -o -name "*.fish" \) \
              -not -path "./.git/*" 2>/dev/null | \
              xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}')

          echo "file_count=${FILE_COUNT}" >> $GITHUB_OUTPUT
          echo "line_count=${LINE_COUNT}" >> $GITHUB_OUTPUT

          echo "📊 Stats:"
          echo "  Files: $FILE_COUNT"
          echo "  Scripts: $SCRIPT_COUNT"
          echo "  Lines: $LINE_COUNT"

      - name: 📦 Build release archives
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Clean archive (exclude generated files + git)
          git archive \
              --format=tar.gz \
              --prefix="ash-dots-${VERSION}/" \
              --output="/tmp/ash-dots-${VERSION}.tar.gz" \
              HEAD

          git archive \
              --format=zip \
              --prefix="ash-dots-${VERSION}/" \
              --output="/tmp/ash-dots-${VERSION}.zip" \
              HEAD

          # Generate checksums
          cd /tmp
          sha256sum "ash-dots-${VERSION}.tar.gz" > "ash-dots-${VERSION}.sha256"
          sha256sum "ash-dots-${VERSION}.zip"    >> "ash-dots-${VERSION}.sha256"
          md5sum    "ash-dots-${VERSION}.tar.gz" > "ash-dots-${VERSION}.md5"
          md5sum    "ash-dots-${VERSION}.zip"    >> "ash-dots-${VERSION}.md5"

          echo "📦 Archives:"
          ls -lh "ash-dots-${VERSION}".*

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "🚀 ASH Dotfiles ${{ steps.version.outputs.version }}"
          prerelease: ${{ github.event.inputs.prerelease == true }}
          draft: ${{ github.event.inputs.draft == true }}
          files: |
            /tmp/ash-dots-${{ steps.version.outputs.version }}.tar.gz
            /tmp/ash-dots-${{ steps.version.outputs.version }}.zip
            /tmp/ash-dots-${{ steps.version.outputs.version }}.sha256
            /tmp/ash-dots-${{ steps.version.outputs.version }}.md5
          body: |
            # 🚀 ASH Dotfiles ${{ steps.version.outputs.version }}

            > **The most complete, feature-rich Hyprland dotfiles system.**
            > *${{ steps.stats.outputs.file_count }}+ files • ${{ steps.stats.outputs.line_count }}+ lines • 10 unique features • 0 known bugs*

            ## 📊 Release Statistics
            | Metric | Value |
            |--------|-------|
            | Config Files | ${{ steps.stats.outputs.file_count }}+ |
            | Lines of Code | ${{ steps.stats.outputs.line_count }}+ |
            | Unique Features | 10 |
            | Supported Apps | 38+ |

            ## 🌟 Unique Features
            | Feature | Command |
            |---------|---------|
            | 🎵 Music Reactive Theme | `ash music enable` |
            | 🏥 Desktop Health Score | `ash score` |
            | 📁 Workspace Profiles | `ash workspace apply coding` |
            | 🌤️ Smart Wallpapers | `ash smart enable` |
            | 📊 Desktop Analytics | `ash analytics show` |
            | 🤖 AI Theme Generation | `ash theme ai "cyberpunk purple"` |
            | ↩️ Theme Undo History | `ash theme undo` |
            | ☀️🌙 Light/Dark Mode | `ash theme mode toggle` |
            | 🎭 Context Theming | `ash context enable` |
            | 📌 Enhanced Clipboard | `ash` (pin, search, categories) |

            ## 🔄 What's Changed
            ${{ steps.changelog.outputs.content }}

            ## 🚀 Installation
            ```bash
            # Fresh install
            bash <(curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/quickstart.sh)

            # Update existing
            ash update

            # Verify
            ash doctor
            ```

            ## 🔐 Verify Download
            ```bash
            sha256sum -c ash-dots-${{ steps.version.outputs.version }}.sha256
            ```

            ---
            *Full docs: [README.md](README.md) | [KEYBINDS.md](docs/KEYBINDS.md) | [THEMING.md](docs/THEMING.md)*

  post-release:
    name: 📢 Post Release
    needs: prepare-release
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: 🎉 Release summary
        run: |
          echo "## 🎉 Release Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.prepare-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Stats:**" >> $GITHUB_STEP_SUMMARY
          echo "- Files: ${{ needs.prepare-release.outputs.file-count }}+" >> $GITHUB_STEP_SUMMARY
          echo "- Lines: ${{ needs.prepare-release.outputs.line-count }}+" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Install:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "bash <(curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/quickstart.sh)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY