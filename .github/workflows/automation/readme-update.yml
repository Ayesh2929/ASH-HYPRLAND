      - name: "📝 Inject all sections into README"
        id: inject
        run: |
          python3 << 'INJECT_EOF'
          import json
          import os
          import re
          import hashlib
          from pathlib import Path
          from datetime import datetime, timezone

          WORKSPACE  = Path(os.environ["GITHUB_WORKSPACE"])
          WORK       = Path(os.environ["WORK_DIR"])
          SECTIONS_D = WORK / "sections"
          DRY_RUN    = os.environ.get("DRY_RUN","false") == "true"
          SECTIONS   = os.environ.get("SECTIONS","all")
          FORCE      = os.environ.get("FORCE_REBUILD","false") == "true"
          TARGET_FILES = os.environ.get("TARGET_FILES","README.md").split(",")

          # Section marker pattern
          def get_section(marker):
              """Extract section content from sections dir."""
              f = SECTIONS_D / f"{marker.lower()}.md"
              return f.read_text() if f.exists() else None

          # Map: marker_name → file in sections/
          SECTION_MAP = {
              "BADGES":       "badges",
              "STATS_TABLE":  "stats-table",
              "GALLERY":      "gallery",
              "PERFORMANCE":  "performance",
              "CONTRIBUTORS": "contributors",
              "FEATURES":     "features",
              "NAV":          "nav",
          }

          def should_update(marker):
              if SECTIONS == "all" or FORCE: return True
              return marker.lower().replace("_","-") in SECTIONS

          total_changes = 0

          for target_file in TARGET_FILES:
              target_file = target_file.strip()
              readme_path = WORKSPACE / target_file

              if not readme_path.exists():
                  print(f"  ⚠️ {target_file} not found — creating skeleton")
                  # Create minimal README if missing
                  readme_path.write_text(
                      f"# ASH Dotfiles v5.0 OMEGA\n\n"
                      f"<!-- BADGES_START -->\n<!-- BADGES_END -->\n\n"
                      f"<!-- STATS_TABLE_START -->\n<!-- STATS_TABLE_END -->\n\n"
                      f"<!-- GALLERY_START -->\n<!-- GALLERY_END -->\n\n"
                      f"<!-- PERFORMANCE_START -->\n<!-- PERFORMANCE_END -->\n\n"
                      f"<!-- CONTRIBUTORS_START -->\n<!-- CONTRIBUTORS_END -->\n\n"
                      f"<!-- FEATURES_START -->\n<!-- FEATURES_END -->\n\n"
                      f"<!-- NAV_START -->\n<!-- NAV_END -->\n"
                  )

              content = readme_path.read_text()
              original_hash = hashlib.md5(content.encode()).hexdigest()
              changes_made = 0

              # Inject each section
              for marker, section_file in SECTION_MAP.items():
                  if not should_update(marker): continue

                  new_content = get_section(section_file)
                  if not new_content: continue

                  start_tag = f"<!-- {marker}_START -->"
                  end_tag   = f"<!-- {marker}_END -->"
                  pattern   = f"{re.escape(start_tag)}.*?{re.escape(end_tag)}"

                  if re.search(pattern, content, flags=re.DOTALL):
                      updated = re.sub(pattern, new_content, content, flags=re.DOTALL)
                      if updated != content:
                          content = updated
                          changes_made += 1
                          print(f"  ✅ Updated: {marker}")
                      else:
                          print(f"  ⏭️ No change: {marker}")
                  else:
                      print(f"  ⚠️ Marker not found: {marker} in {target_file}")

              # Check if content actually changed
              new_hash = hashlib.md5(content.encode()).hexdigest()
              if new_hash == original_hash and not FORCE:
                  print(f"\n  ℹ️ {target_file}: No changes needed")
                  continue

              if DRY_RUN:
                  print(f"\n  [DRY RUN] Would update {target_file} ({changes_made} sections)")
                  (WORK / f"{target_file}.preview").write_text(content)
              else:
                  readme_path.write_text(content)
                  print(f"\n  ✅ {target_file} updated ({changes_made} sections changed)")
                  total_changes += changes_made

          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"total_changes={total_changes}\n")

          print(f"\n  📊 Total changes: {total_changes}")
          INJECT_EOF

      - name: "💾 Commit README updates"
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail

          git config user.name  "ash-readme-bot[bot]"
          git config user.email "ash-readme-bot@users.noreply.github.com"

          # Add all modified README files
          IFS=',' read -ra FILES <<< "${TARGET_FILES}"
          for f in "${FILES[@]}"; do
            git add "${f// /}" 2>/dev/null || true
          done

          if git diff --cached --quiet; then
            echo "  ℹ️ No README changes to commit"
            exit 0
          fi

          # Build commit message
          STARS="${{ needs.collect-data.outputs.stars }}"
          FORKS="${{ needs.collect-data.outputs.forks }}"
          THEMES="${{ needs.collect-data.outputs.theme_count }}"
          PLUGINS="${{ needs.collect-data.outputs.plugin_count }}"
          VERSION="${{ needs.collect-data.outputs.version }}"

          CUSTOM_MSG="${CUSTOM_COMMIT}"
          if [[ -z "${CUSTOM_MSG}" ]]; then
            COMMIT_MSG="📖 chore(readme): auto-update ${SECTIONS} sections [skip ci]

          Stats: ⭐${STARS} · 🔀${FORKS} · 🎨${THEMES} themes · 🔌${PLUGINS} plugins
          Version: ${VERSION}
          Session: ${SESSION_ID}
          Sections: ${SECTIONS}

          Generated by ASH v5.0 OMEGA README Engine"
          else
            COMMIT_MSG="${CUSTOM_MSG} [skip ci]"
          fi

          git commit -m "${COMMIT_MSG}"
          git push
          echo "  ✅ README committed and pushed"

      - name: "📤 Upload section artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: "readme-sections-${{ needs.collect-data.outputs.session_id }}"
          path: "${{ env.WORK_DIR }}/sections/"
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — Validate README after update
  # ───────────────────────────────────────────────────────────────────────────
  validate-readme:
    name: "✅ Validate · README Quality Check"
    needs: [collect-data, generate-sections]
    if: always() && env.DRY_RUN != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          ref: main

      - name: "📦 Install validators"
        run: |
          pip3 install --quiet --user \
            requests==2.32.3 \
            rich==13.9.2 \
            2>/dev/null || true
          npm install -g markdownlint-cli 2>/dev/null || true

      - name: "✅ Validate README structure"
        run: |
          python3 << 'VALIDATE_EOF'
          import re
          import os
          import sys
          from pathlib import Path

          TARGET_FILES = os.environ.get("TARGET_FILES","README.md").split(",")

          all_ok = True
          for target in TARGET_FILES:
              target = target.strip()
              readme = Path(os.environ["GITHUB_WORKSPACE"]) / target
              if not readme.exists():
                  print(f"  ❌ {target}: NOT FOUND")
                  all_ok = False
                  continue

              content = readme.read_text()
              issues  = []

              # Check required sections exist
              REQUIRED_SECTIONS = [
                  ("<!-- BADGES_START -->",        "Badge section"),
                  ("<!-- STATS_TABLE_START -->",   "Stats table"),
                  ("<!-- GALLERY_START -->",       "Theme gallery"),
                  ("<!-- PERFORMANCE_START -->",   "Performance table"),
                  ("<!-- CONTRIBUTORS_START -->",  "Contributors section"),
                  ("<!-- NAV_START -->",           "Navigation section"),
              ]

              for marker, name in REQUIRED_SECTIONS:
                  if marker not in content:
                      issues.append(f"Missing: {name} ({marker})")

              # Check for unclosed markers
              starts = re.findall(r'<!-- (\w+)_START -->', content)
              ends   = re.findall(r'<!-- (\w+)_END -->',   content)
              for s in starts:
                  if s not in ends:
                      issues.append(f"Unclosed section marker: {s}")

              # Check for broken image links
              broken_imgs = re.findall(r'!\[([^\]]*)\]\(([^)]+)\)', content)
              for alt, url in broken_imgs[:5]:  # Sample check
                  if "PLACEHOLDER" in url or "undefined" in url.lower():
                      issues.append(f"Possibly broken image: {url[:60]}")

              # Check README is not too short
              if len(content) < 5000:
                  issues.append(f"README seems too short ({len(content)} chars)")

              # Report
              if issues:
                  print(f"\n  ⚠️ {target}: {len(issues)} issue(s)")
                  for issue in issues:
                      print(f"     ❌ {issue}")
                  all_ok = False
              else:
                  print(f"  ✅ {target}: All checks passed ({len(content):,} chars)")

          sys.exit(0 if all_ok else 1)
          VALIDATE_EOF

      - name: "📊 README summary"
        if: always()
        run: |
          README_FILE="${{ github.event.inputs.target_files || 'README.md' }}"
          README_SIZE=$(wc -c < "${GITHUB_WORKSPACE}/${README_FILE}" 2>/dev/null || echo "0")
          README_LINES=$(wc -l < "${GITHUB_WORKSPACE}/${README_FILE}" 2>/dev/null || echo "0")
          README_KB=$(echo "scale=1; ${README_SIZE}/1024" | bc 2>/dev/null || echo "?")

          cat >> "${GITHUB_STEP_SUMMARY}" << EOF
          # 📖 README Update Complete

          > Session: \`${{ needs.collect-data.outputs.session_id }}\`

          ## 📊 Results

          | Metric | Value |
          |--------|-------|
          | 📄 File | \`${README_FILE}\` |
          | 📏 Size | \`${README_KB}KB\` |
          | 📋 Lines | \`${README_LINES}\` |
          | 🎨 Themes | \`${{ needs.collect-data.outputs.theme_count }}\` |
          | 🔌 Plugins | \`${{ needs.collect-data.outputs.plugin_count }}\` |
          | ⭐ Stars | \`${{ needs.collect-data.outputs.stars }}\` |
          | 🔧 Sections | \`${SECTIONS}\` |
          | 🚫 Dry Run | \`${DRY_RUN}\` |

          ---
          *📖 ASH v5.0 OMEGA README Engine · [View README](https://github.com/${{ github.repository }})*
          EOF