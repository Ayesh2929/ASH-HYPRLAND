name: "📖 README Update · Ultra Auto-Documentation Engine"

on:
  # ── Stats/theme/content changes ────────────────────────────────────────────
  push:
    branches: [main]
    paths:
      - "themes/presets/**"
      - "plugins/**"
      - "CHANGELOG.md"
      - "version.json"
      - "assets/screenshots/**"
      - "assets/badges/**"
      - "data/stats/**"
      - ".github/workflows/automation/readme-update.yml"

  # ── Release triggers full README regeneration ────────────────────────────
  release:
    types: [published]

  # ── Benchmark results update performance table ────────────────────────────
  workflow_run:
    workflows:
      - "⚡ Benchmark · Theme Apply Performance"
      - "🚀 Benchmark · Startup Time Performance"
      - "📊 Stats Update · Ultra Analytics Engine"
    types: [completed]

  # ── Manual control ────────────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      sections:
        description: "Sections to update"
        required: false
        default: "all"
        type: choice
        options:
          - all              # All sections
          - stats-only       # Stats table & badges
          - gallery-only     # Theme gallery
          - badges-only      # Badge row
          - benchmarks-only  # Perf table
          - contributors-only# Contributors grid
          - changelog-only   # Changelog preview
          - hero-only        # Hero banner
          - features-only    # Feature matrix
          - nav-only         # Quick nav links

      target_files:
        description: "README files to update (comma-separated)"
        required: false
        default: "README.md"
        type: string

      dry_run:
        description: "Preview changes without committing"
        required: false
        default: false
        type: boolean

      force_rebuild:
        description: "Force full rebuild (ignore content hash)"
        required: false
        default: false
        type: boolean

      commit_message:
        description: "Custom commit message"
        required: false
        default: ""
        type: string

  # ── Scheduled weekly refresh ──────────────────────────────────────────────
  schedule:
    - cron: "30 1 * * 1"      # Weekly Monday 01:30 UTC — full README refresh
    - cron: "0 0 * * *"       # Daily midnight — stats & badges only

# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: "readme-update-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

# ─────────────────────────────────────────────────────────────────────────────
env:
  README_VERSION: "5.0.0"
  WORK_DIR: "${{ github.workspace }}/.readme-engine"
  REPO_URL: "https://github.com/${{ github.repository }}"
  DOCS_URL: "https://ash-dotfiles.dev/docs"
  DISCORD_URL: "https://discord.gg/ash-dotfiles"
  INSTALL_URL: "https://ash.dev/install"

  # ── Inputs ─────────────────────────────────────────────────────────────────
  SECTIONS: "${{ github.event.inputs.sections || 'all' }}"
  DRY_RUN: "${{ github.event.inputs.dry_run || 'false' }}"
  FORCE_REBUILD: "${{ github.event.inputs.force_rebuild || 'false' }}"
  CUSTOM_COMMIT: "${{ github.event.inputs.commit_message || '' }}"
  TARGET_FILES: "${{ github.event.inputs.target_files || 'README.md' }}"

# ═════════════════════════════════════════════════════════════════════════════
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Collect all data sources
  # ───────────────────────────────────────────────────────────────────────────
  collect-data:
    name: "📥 Collect · All README Data Sources"
    runs-on: ubuntu-24.04
    outputs:
      stars:         ${{ steps.github.outputs.stars }}
      forks:         ${{ steps.github.outputs.forks }}
      contributors:  ${{ steps.github.outputs.contributors }}
      theme_count:   ${{ steps.local.outputs.theme_count }}
      plugin_count:  ${{ steps.local.outputs.plugin_count }}
      version:       ${{ steps.version.outputs.tag }}
      session_id:    ${{ steps.session.outputs.id }}
      content_hash:  ${{ steps.hash.outputs.hash }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🆔 Session"
        id: session
        run: |
          echo "id=readme-$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: "📦 Install tools"
        run: |
          pip3 install --quiet --user \
            requests==2.32.3 \
            jinja2==3.1.4 \
            markdown==3.7 \
            rich==13.9.2 \
            2>/dev/null || true
          sudo apt-get install -y --no-install-recommends \
            jq bc curl 2>/dev/null || true
          mkdir -p "${WORK_DIR}"

      - name: "⭐ Fetch GitHub stats"
        id: github
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const [repo, contribs, releases] = await Promise.all([
              github.rest.repos.get({
                owner: context.repo.owner, repo: context.repo.repo
              }),
              github.paginate(github.rest.repos.listContributors, {
                owner: context.repo.owner, repo: context.repo.repo,
                per_page: 100,
              }).catch(() => []),
              github.paginate(github.rest.repos.listReleases, {
                owner: context.repo.owner, repo: context.repo.repo,
                per_page: 20,
              }).catch(() => []),
            ]);

            const R  = repo.data;
            const totalDL = releases.reduce((s,r)=>
              s+r.assets.reduce((ss,a)=>ss+a.download_count,0), 0
            );
            const closedIssues = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:closed`
            }).catch(()=>({data:{total_count:0}}));
            const mergedPRs = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:pr is:merged`
            }).catch(()=>({data:{total_count:0}}));

            // Top contributors with avatars
            const topContribs = contribs.slice(0,20).map(c=>({
              login: c.login,
              contributions: c.contributions,
              avatar: c.avatar_url,
              url:    c.html_url,
            }));

            const data = {
              stars:          R.stargazers_count,
              forks:          R.forks_count,
              watchers:       R.subscribers_count,
              open_issues:    R.open_issues_count,
              contributors:   contribs.length,
              top_contributors: topContribs,
              total_downloads: totalDL,
              latest_release: releases[0]?.tag_name || "v5.0.0",
              total_releases: releases.length,
              closed_issues:  closedIssues.data.total_count,
              merged_prs:     mergedPRs.data.total_count,
              size_kb:        R.size,
              language:       R.language || "Shell",
              license:        R.license?.spdx_id || "MIT",
              description:    R.description || "",
              topics:         R.topics || [],
            };

            require("fs").mkdirSync(process.env.WORK_DIR, { recursive: true });
            require("fs").writeFileSync(
              `${process.env.WORK_DIR}/github.json`,
              JSON.stringify(data, null, 2)
            );

            core.setOutput("stars",        String(data.stars));
            core.setOutput("forks",        String(data.forks));
            core.setOutput("contributors", String(data.contributors));
            core.setOutput("downloads",    String(data.total_downloads));
            core.setOutput("latest",       data.latest_release);

            console.log(`  ⭐ Stars: ${data.stars.toLocaleString()}`);
            console.log(`  🔀 Forks: ${data.forks.toLocaleString()}`);
            console.log(`  👥 Contributors: ${data.contributors}`);

      - name: "📊 Collect local stats"
        id: local
        run: |
          python3 << 'LOCAL_EOF'
          import json
          import os
          from pathlib import Path

          ROOT = Path(os.environ["GITHUB_WORKSPACE"])
          WORK = Path(os.environ["WORK_DIR"])

          # Themes
          theme_dirs = list((ROOT/"themes/presets").glob("*/*"))
          theme_dirs = [d for d in theme_dirs if d.is_dir()]
          themes_by_cat = {}
          for td in theme_dirs:
              cat = td.parent.name
              themes_by_cat[cat] = themes_by_cat.get(cat,0) + 1

          # Plugins
          plugin_jsons = list((ROOT/"plugins").glob("*/plugin.json")) + \
                         list((ROOT/"plugins").glob("*/*/plugin.json"))
          plugin_count = len(plugin_jsons)
          plugins_by_cat = {}
          for pf in plugin_jsons:
              try:
                  with open(pf) as f: pm = json.load(f)
                  cat = pm.get("category","core")
                  plugins_by_cat[cat] = plugins_by_cat.get(cat,0) + 1
              except Exception: pass

          # Wallpapers
          wp_count = len([f for f in (ROOT/"wallpapers").rglob("*")
                          if f.suffix in (".jpg",".jpeg",".png",".webp")
                          and ".optimized" not in str(f)])

          # Scripts
          scripts = list((ROOT/"scripts").rglob("*.sh"))
          # Workflows
          workflows = list((ROOT/".github/workflows").rglob("*.yml"))
          # Config files
          configs = list((ROOT/"config").rglob("*"))
          configs = [c for c in configs if c.is_file()]

          data = {
              "theme_count":  len(theme_dirs),
              "themes_by_category": themes_by_cat,
              "plugin_count": plugin_count,
              "plugins_by_category": plugins_by_cat,
              "wallpaper_count": wp_count,
              "script_count":   len(scripts),
              "workflow_count": len(workflows),
              "config_count":   len(configs),
          }

          with open(WORK/"local.json","w") as f:
              json.dump(data, f, indent=2)

          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"theme_count={len(theme_dirs)}\n")
              out.write(f"plugin_count={plugin_count}\n")
              out.write(f"wallpaper_count={wp_count}\n")

          print(f"  🎨 Themes:    {len(theme_dirs)}")
          print(f"  🔌 Plugins:   {plugin_count}")
          print(f"  🖼️  Wallpapers: {wp_count}")
          LOCAL_EOF

      - name: "🏷️ Resolve version"
        id: version
        run: |
          VERSION_FILE="${GITHUB_WORKSPACE}/version.json"
          if [[ -f "${VERSION_FILE}" ]]; then
            TAG=$(jq -r '.version // "5.0.0"' "${VERSION_FILE}" 2>/dev/null || echo "5.0.0")
          else
            TAG="${{ github.event.release.tag_name || 'v5.0.0' }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "  🏷️ Version: ${TAG}"

      - name: "📋 Extract CHANGELOG preview"
        run: |
          CHANGELOG="${GITHUB_WORKSPACE}/CHANGELOG.md"
          OUTPUT="${WORK_DIR}/changelog-preview.md"

          if [[ -f "${CHANGELOG}" ]]; then
            # Extract latest 3 sections (between ## headers)
            python3 << 'CHANGE_EOF'
          import re
          from pathlib import Path

          CHANGELOG = Path("${GITHUB_WORKSPACE}/CHANGELOG.md")
          OUTPUT    = Path("${WORK_DIR}/changelog-preview.md")

          try:
              content = CHANGELOG.read_text()
              # Split by ## version headers
              sections = re.split(r'^## ', content, flags=re.MULTILINE)
              # Take first 3 version sections
              preview_sections = sections[1:4]  # Skip first empty
              preview = "\n\n## ".join(preview_sections)
              # Truncate to 1500 chars
              if len(preview) > 1500:
                  preview = preview[:1500] + "\n\n> [Full Changelog →](CHANGELOG.md)"
              OUTPUT.write_text(preview)
              print(f"  ✅ Changelog preview: {len(preview)} chars")
          except Exception as e:
              print(f"  ⚠️ Changelog: {e}")
              OUTPUT.write_text("See [CHANGELOG.md](CHANGELOG.md) for details.")
          CHANGE_EOF
          else
            echo "No CHANGELOG.md found." > "${OUTPUT}"
          fi

      - name: "🔢 Compute content hash"
        id: hash
        run: |
          # Hash key input files to detect if README update is needed
          HASH=$(cat \
            "${WORK_DIR}/github.json" \
            "${WORK_DIR}/local.json" \
            "${GITHUB_WORKSPACE}/version.json" \
            "${GITHUB_WORKSPACE}/CHANGELOG.md" \
            2>/dev/null | \
            md5sum | cut -d' ' -f1)

          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "  🔢 Content hash: ${HASH}"

      - name: "📤 Upload data"
        uses: actions/upload-artifact@v6
        with:
          name: "readme-data-${{ steps.session.outputs.id }}"
          path: "${{ env.WORK_DIR }}/"
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Generate all README sections
  # ───────────────────────────────────────────────────────────────────────────
  generate-sections:
    name: "✍️ Generate · README Sections"
    needs: collect-data
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      SESSION_ID: ${{ needs.collect-data.outputs.session_id }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: "📦 Install tools"
        run: |
          pip3 install --quiet --user \
            jinja2==3.1.4 \
            matplotlib==3.9.2 \
            numpy==2.1.2 \
            rich==13.9.2 \
            2>/dev/null || true
          sudo apt-get install -y --no-install-recommends \
            jq bc imagemagick webp 2>/dev/null || true
          mkdir -p "${WORK_DIR}/sections"

      - name: "📥 Download data"
        uses: actions/download-artifact@v7
        with:
          name: "readme-data-${{ needs.collect-data.outputs.session_id }}"
          path: "${{ env.WORK_DIR }}"

      - name: "🏅 Generate badge section"
        id: badges
        run: |
          python3 << 'BADGE_EOF'
          import json
          import os
          from pathlib import Path

          WORK     = Path(os.environ["WORK_DIR"]) / "sections"
          WORK.mkdir(parents=True, exist_ok=True)
          REPO     = os.environ.get("GITHUB_REPOSITORY","ash/dotfiles")
          REPO_URL = os.environ.get("REPO_URL","https://github.com/ash/dotfiles")

          GH = json.loads(Path(os.environ["WORK_DIR"],"github.json").read_text())
          LO = json.loads(Path(os.environ["WORK_DIR"],"local.json").read_text())
          VERSION = "${{ needs.collect-data.outputs.version }}"

          def shield(label, msg, color, logo=None, style="flat-square"):
              label_enc = label.replace(" ","%20").replace("-","--")
              msg_enc   = str(msg).replace(" ","%20").replace("-","--")
              url = f"https://img.shields.io/badge/{label_enc}-{msg_enc}-{color}?style={style}"
              if logo: url += f"&logo={logo}&logoColor=white"
              return url

          def badge_md(alt, url, link=None):
              img = f"![{alt}]({url})"
              return f"[{img}]({link})" if link else img

          def fmt_num(n):
              return f"{n/1000:.1f}k" if n >= 1000 else str(n)

          badges = [
              # Row 1: Core stats
              badge_md("Version", shield("version", VERSION, "74c7ec", "tag"), f"{REPO_URL}/releases"),
              badge_md("Stars",   shield("stars",   f"⭐ {fmt_num(GH['stars'])}", "ffd700","github"), REPO_URL),
              badge_md("Forks",   shield("forks",   f"🔀 {fmt_num(GH['forks'])}", "84b6eb","github"), f"{REPO_URL}/network"),
              badge_md("Contributors", shield("contributors",f"👥 {GH['contributors']}","a6e3a1","github"), f"{REPO_URL}/graphs/contributors"),
              badge_md("Downloads", shield("downloads",f"📦 {fmt_num(GH['total_downloads'])}","fab387","download"), f"{REPO_URL}/releases"),
              badge_md("License", shield("license","MIT","a6e3a1","open-source-initiative"), f"{REPO_URL}/blob/main/LICENSE"),
              badge_md("CI",      shield("CI","passing ✅","a6e3a1","github-actions"), f"{REPO_URL}/actions"),
          ]
          row1 = " ".join(badges[:4])
          row2 = " ".join(badges[4:])

          # Row 2: Feature badges
          feature_badges = [
              badge_md("Themes", shield("themes",f"🎨 {LO['theme_count']}+","cba6f7","paintbrush"), f"{REPO_URL}/tree/main/themes"),
              badge_md("Plugins",shield("plugins",f"🔌 {LO['plugin_count']}+","89b4fa"), f"{REPO_URL}/tree/main/plugins"),
              badge_md("Wayland",shield("Wayland","native 🖥️","89b4fa","linux"), None),
              badge_md("Hyprland",shield("Hyprland","powered 🎮","cba6f7"), None),
              badge_md("Performance",shield("theme-apply","⚡ <300ms","f9e2af","lightning"), f"{REPO_URL}/actions"),
              badge_md("AI-Native",shield("AI","native 🤖","a6e3a1"), None),
              badge_md("Discord",shield("Discord","Join! 💬","5865F2","discord"), "https://discord.gg/ash-dotfiles"),
          ]

          content = f"""<!-- BADGES_START -->
          <div align="center">

          {row1}

          {" ".join(feature_badges[:4])}

          {" ".join(feature_badges[4:])}

          </div>
          <!-- BADGES_END -->"""

          (WORK/"badges.md").write_text(content)
          print("  ✅ Badge section generated")
          BADGE_EOF

      - name: "📊 Generate stats table section"
        id: stats_table
        run: |
          python3 << 'STATS_EOF'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          WORK = Path(os.environ["WORK_DIR"]) / "sections"
          GH   = json.loads(Path(os.environ["WORK_DIR"],"github.json").read_text())
          LO   = json.loads(Path(os.environ["WORK_DIR"],"local.json").read_text())

          VERSION = "${{ needs.collect-data.outputs.version }}"
          NOW     = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          REPO_URL= os.environ["REPO_URL"]

          def fmt(n): return f"{int(n):,}" if isinstance(n,int) else str(n)

          content = f"""<!-- STATS_TABLE_START -->
          <div align="center">

          ### 📊 Live Repository Statistics

          | 🔢 Metric | 📈 Value | 🔢 Metric | 📈 Value |
          |:----------|----------:|:----------|----------:|
          | ⭐ **Stars** | `{fmt(GH['stars'])}` | 🔀 **Forks** | `{fmt(GH['forks'])}` |
          | 👥 **Contributors** | `{fmt(GH['contributors'])}` | 👁️ **Watchers** | `{fmt(GH['watchers'])}` |
          | 🎨 **Themes** | `{LO['theme_count']}+` | 🔌 **Plugins** | `{LO['plugin_count']}+` |
          | 📦 **Downloads** | `{fmt(GH['total_downloads'])}` | 🏷️ **Version** | `{VERSION}` |
          | 🐛 **Closed Issues** | `{fmt(GH['closed_issues'])}` | ✅ **PRs Merged** | `{fmt(GH['merged_prs'])}` |
          | 🖼️ **Wallpapers** | `{LO['wallpaper_count']}+` | 📜 **Scripts** | `{LO['script_count']}+` |
          | ⚙️ **Workflows** | `{LO['workflow_count']}` | ⚡ **Theme Apply** | `<300ms` |

          *🕐 Last updated: `{NOW}` · Auto-generated by [README Engine]({REPO_URL}/actions)*

          </div>
          <!-- STATS_TABLE_END -->"""

          (WORK/"stats-table.md").write_text(content)
          print("  ✅ Stats table generated")
          STATS_EOF

      - name: "🎨 Generate theme gallery section"
        id: gallery
        run: |
          python3 << 'GALLERY_EOF'
          import json
          import os
          from pathlib import Path

          WORK     = Path(os.environ["WORK_DIR"]) / "sections"
          ROOT     = Path(os.environ["GITHUB_WORKSPACE"])
          LO       = json.loads(Path(os.environ["WORK_DIR"],"local.json").read_text())
          REPO     = os.environ.get("GITHUB_REPOSITORY","ash/dotfiles")
          REPO_URL = os.environ["REPO_URL"]

          # Featured themes to display
          FEATURED = [
