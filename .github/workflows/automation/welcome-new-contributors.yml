name: "🎉 Welcome · Intelligent Contributor Onboarding"

on:
  # ── Issue events ─────────────────────────────────────────────────────────────
  issues:
    types: [opened]

  # ── PR events ─────────────────────────────────────────────────────────────────
  pull_request_target:
    types: [opened]

  # ── Discussion events ─────────────────────────────────────────────────────────
  discussion:
    types: [created]

  # ── Manual batch welcome ──────────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      mode:
        description: "Welcome mode"
        required: false
        default: "standard"
        type: choice
        options:
          - standard          # Normal personalized welcome
          - celebration       # Extra festive (milestone, hacktoberfest)
          - minimal           # Short welcome only
          - report            # Generate contributor report only
          - dry-run           # Preview without posting
          - leaderboard       # Post monthly leaderboard
      target_username:
        description: "Target username (empty = auto from event)"
        required: false
        default: ""
        type: string
      force_first_time:
        description: "Treat as first-time contributor"
        required: false
        default: false
        type: boolean
      language:
        description: "Welcome language override"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - en
          - es
          - de
          - fr
          - ja
          - zh
          - pt
          - ko
          - ru
          - ar
          - hi
          - it
          - nl
          - pl
          - tr

  # ── Scheduled events ──────────────────────────────────────────────────────────
  schedule:
    - cron: "0 10 1 * *"     # Monthly leaderboard on 1st
    - cron: "0 9 * * 1"      # Weekly contributor digest (Monday)

# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: "welcome-${{ github.event.sender.login || github.actor }}-${{ github.event.number || github.run_id }}"
  cancel-in-progress: false

permissions:
  issues: write
  pull-requests: write
  discussions: write
  contents: read
  repository-projects: read
  actions: read

# ─────────────────────────────────────────────────────────────────────────────
env:
  WELCOME_VERSION: "5.0.0"
  WORK_DIR: "${{ github.workspace }}/.welcome-engine"
  DRY_RUN: "${{ github.event.inputs.mode == 'dry-run' && 'true' || 'false' }}"
  WELCOME_MODE: "${{ github.event.inputs.mode || 'standard' }}"
  FORCE_FIRST_TIME: "${{ github.event.inputs.force_first_time || 'false' }}"
  LANG_OVERRIDE: "${{ github.event.inputs.language || 'auto' }}"

  # ── Community links ────────────────────────────────────────────────────────
  DISCORD_INVITE: "https://discord.gg/ash-dotfiles"
  DOCS_URL: "https://ash-dotfiles.dev/docs"
  CONTRIBUTING_URL: "https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md"
  CODE_OF_CONDUCT_URL: "https://github.com/${{ github.repository }}/blob/main/CODE_OF_CONDUCT.md"
  DISCUSSIONS_URL: "https://github.com/${{ github.repository }}/discussions"

  # ── Hacktoberfest detection ────────────────────────────────────────────────
  HACKTOBERFEST_MONTHS: "10"   # October

# ═════════════════════════════════════════════════════════════════════════════
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Contributor analysis & classification
  # ───────────────────────────────────────────────────────────────────────────
  analyze-contributor:
    name: "🔍 Analyze · Contributor Profile"
    runs-on: ubuntu-24.04
    if: |
      github.event_name != 'schedule' &&
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.mode != 'leaderboard'
    outputs:
      is_first_time:      ${{ steps.profile.outputs.is_first_time }}
      contribution_count: ${{ steps.profile.outputs.contribution_count }}
      contributor_tier:   ${{ steps.profile.outputs.tier }}
      context_type:       ${{ steps.context.outputs.type }}
      component:          ${{ steps.context.outputs.component }}
      detected_language:  ${{ steps.language.outputs.code }}
      username:           ${{ steps.user.outputs.username }}
      display_name:       ${{ steps.user.outputs.display_name }}
      is_hacktoberfest:   ${{ steps.events.outputs.hacktoberfest }}
      achievements:       ${{ steps.achievements.outputs.list }}
      session_id:         ${{ steps.session.outputs.id }}
      item_number:        ${{ steps.item.outputs.number }}
      item_type:          ${{ steps.item.outputs.type }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🆔 Session & item info"
        id: session
        run: |
          echo "id=welcome-$(date +%Y%m%d%H%M%S)-$$" >> "$GITHUB_OUTPUT"

      - name: "📋 Resolve item details"
        id: item
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr    = context.payload.pull_request;
            const issue = context.payload.issue;
            const disc  = context.payload.discussion;

            let num  = 0;
            let type = "unknown";

            if (pr)    { num = pr.number;    type = "pr";         }
            else if (issue) { num = issue.number;  type = "issue";      }
            else if (disc)  { num = disc.number;   type = "discussion"; }

            core.setOutput("number", String(num));
            core.setOutput("type",   type);

      - name: "👤 Resolve contributor identity"
        id: user
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const forceName = "${{ github.event.inputs.target_username }}";
            let username = forceName || context.actor;

            // Fetch public profile
            const profile = await github.rest.users.getByUsername({
              username,
            }).catch(() => ({ data: {} }));

            const displayName = profile.data.name || username;
            const location    = profile.data.location || "";
            const bio         = profile.data.bio || "";
            const followers   = profile.data.followers || 0;
            const publicRepos = profile.data.public_repos || 0;
            const company     = profile.data.company || "";

            core.setOutput("username",     username);
            core.setOutput("display_name", displayName);
            core.setOutput("location",     location);
            core.setOutput("bio",          bio.slice(0, 100));
            core.setOutput("followers",    String(followers));
            core.setOutput("public_repos", String(publicRepos));

            console.log(`  👤 ${displayName} (@${username})`);
            console.log(`  📍 ${location || "Unknown location"}`);
            console.log(`  ⭐ ${followers} followers · ${publicRepos} repos`);

      - name: "📊 Analyze contribution history"
        id: profile
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const username     = "${{ steps.user.outputs.username }}";
            const FORCE_FIRST  = process.env.FORCE_FIRST_TIME === "true";

            // Count all contributions to this repo
            const [issueSearch, prSearch, commitSearch] = await Promise.all([
              github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} author:${username} is:issue`,
              }).catch(() => ({ data: { total_count: 0 } })),
              github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} author:${username} is:pr`,
              }).catch(() => ({ data: { total_count: 0 } })),
              github.rest.repos.listCommits({
                owner:  context.repo.owner,
                repo:   context.repo.repo,
                author: username,
                per_page: 1,
              }).catch(() => ({ data: [] })),
            ]);

            const issueCount  = issueSearch.data.total_count || 0;
            const prCount     = prSearch.data.total_count    || 0;
            const hasCommits  = commitSearch.data.length > 0;
            const totalContrib = issueCount + prCount + (hasCommits ? 5 : 0);

            // Current item (subtract 1 — this is the opening event)
            const adjustedTotal = Math.max(0, totalContrib - 1);
            const isFirst = FORCE_FIRST || adjustedTotal === 0;

            // Tier classification
            let tier = "newcomer";
            if      (adjustedTotal >= 50)  tier = "core-maintainer";
            else if (adjustedTotal >= 20)  tier = "active-contributor";
            else if (adjustedTotal >= 10)  tier = "regular-contributor";
            else if (adjustedTotal >= 3)   tier = "established-contributor";
            else if (adjustedTotal >= 1)   tier = "returning-contributor";
            else                           tier = "newcomer";

            const TIER_DISPLAY = {
              "newcomer":              { emoji: "🌱", label: "Newcomer" },
              "returning-contributor": { emoji: "🔄", label: "Returning Contributor" },
              "established-contributor":{ emoji: "⭐", label: "Established Contributor" },
              "regular-contributor":   { emoji: "🌟", label: "Regular Contributor" },
              "active-contributor":    { emoji: "💫", label: "Active Contributor" },
              "core-maintainer":       { emoji: "🏆", label: "Core Maintainer" },
            };

            const tierInfo = TIER_DISPLAY[tier];
            console.log(`  📊 @${username}: ${adjustedTotal} contributions → ${tierInfo.emoji} ${tierInfo.label}`);
            console.log(`  🆕 First time: ${isFirst}`);

            core.setOutput("is_first_time",      String(isFirst));
            core.setOutput("contribution_count",  String(adjustedTotal));
            core.setOutput("tier",                tier);
            core.setOutput("tier_emoji",          tierInfo.emoji);
            core.setOutput("tier_label",          tierInfo.label);
            core.setOutput("issue_count",         String(issueCount));
            core.setOutput("pr_count",            String(prCount));

      - name: "🎨 Classify contribution context"
        id: context
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr    = context.payload.pull_request;
            const issue = context.payload.issue;

            const item   = pr || issue || {};
            const title  = item.title  || "";
            const body   = item.body   || "";
            const labels = (item.labels || []).map(l => l.name);
            const files  = pr ? await github.paginate(
              github.rest.pulls.listFiles,
              { owner: context.repo.owner, repo: context.repo.repo,
                pull_number: pr.number, per_page: 100 }
            ).catch(() => []) : [];

            // Determine item type context
            let contextType = "general";
            let component   = "general";

            if (labels.includes("bug"))               contextType = "bug";
            else if (labels.includes("feature-request")) contextType = "feature";
            else if (labels.includes("documentation"))   contextType = "docs";
            else if (labels.includes("theme-submission")) contextType = "theme";
            else if (labels.includes("plugin-submission")) contextType = "plugin";
            else if (labels.includes("security"))         contextType = "security";
            else if (labels.includes("performance"))      contextType = "performance";
            else if (/bug|crash|error|broken/i.test(title)) contextType = "bug";
            else if (/feat|add|implement/i.test(title))      contextType = "feature";
            else if (/docs?|readme|wiki/i.test(title))       contextType = "docs";
            else if (/theme/i.test(title))                   contextType = "theme";
            else if (/plugin/i.test(title))                  contextType = "plugin";

            // Detect component from files (PR only)
            if (files.length) {
              const paths = files.map(f => f.filename);
              if (paths.some(p => /^themes\//.test(p)))       component = "theme";
              else if (paths.some(p => /^config\/nvim\//.test(p)))  component = "neovim";
              else if (paths.some(p => /^config\/hypr\//.test(p)))  component = "hyprland";
              else if (paths.some(p => /^config\/fish\//.test(p)))  component = "shell";
              else if (paths.some(p => /^config\/waybar\//.test(p)))component = "waybar";
              else if (paths.some(p => /^plugins\//.test(p)))       component = "plugin";
              else if (paths.some(p => /^api\//.test(p)))           component = "api";
              else if (paths.some(p => /^ash-cli\//.test(p)))       component = "cli";
              else if (paths.some(p => /^docs?\//.test(p)))         component = "docs";
              else if (paths.some(p => /^\.github\//.test(p)))      component = "ci";
              else if (paths.some(p => /^nix\//.test(p)))           component = "nix";
              else if (paths.some(p => /^tests?\//.test(p)))        component = "testing";
            }

            console.log(`  🎨 Context: ${contextType} | Component: ${component}`);
            core.setOutput("type",      contextType);
            core.setOutput("component", component);

      - name: "🌍 Detect contributor language"
        id: language
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const OVERRIDE = process.env.LANG_OVERRIDE;
            if (OVERRIDE && OVERRIDE !== "auto") {
              core.setOutput("code", OVERRIDE);
              return;
            }

            const location = "${{ steps.user.outputs.location }}".toLowerCase();
            const bio      = "${{ steps.user.outputs.bio }}".toLowerCase();
            const body     = (context.payload.pull_request?.body ||
                              context.payload.issue?.body || "").toLowerCase();

            // Simple heuristic language detection
            const LANG_MAP = [
              { lang: "ja", signals: ["japan","tokyo","osaka","日本","japanese"] },
              { lang: "zh", signals: ["china","beijing","shanghai","中国","chinese","台灣","taiwan"] },
              { lang: "ko", signals: ["korea","seoul","한국","korean"] },
              { lang: "de", signals: ["germany","deutschland","berlin","münchen","german","österreich"] },
              { lang: "fr", signals: ["france","paris","french","français"] },
              { lang: "es", signals: ["spain","españa","mexico","argentina","spanish","español"] },
              { lang: "pt", signals: ["brazil","brasil","portugal","portuguese"] },
              { lang: "ru", signals: ["russia","moscow","russian","россия"] },
              { lang: "ar", signals: ["arabic","saudi","egypt","arab","عربي"] },
              { lang: "hi", signals: ["india","hindi","mumbai","delhi","bangalore"] },
              { lang: "it", signals: ["italy","italia","rome","milan","italian"] },
              { lang: "nl", signals: ["netherlands","holland","amsterdam","dutch"] },
              { lang: "pl", signals: ["poland","polska","warsaw","polish"] },
              { lang: "tr", signals: ["turkey","türkiye","istanbul","turkish"] },
            ];

            const combined = `${location} ${bio} ${body}`;
            let detected   = "en";

            for (const { lang, signals } of LANG_MAP) {
              if (signals.some(s => combined.includes(s))) {
                detected = lang;
                break;
              }
            }

            console.log(`  🌍 Language detected: ${detected}`);
            core.setOutput("code", detected);

      - name: "🎪 Detect special events"
        id: events
        run: |
          MONTH=$(date +%-m)
          IS_HACKTOBERFEST="false"
          [[ "${MONTH}" == "${HACKTOBERFEST_MONTHS}" ]] && IS_HACKTOBERFEST="true"

          # Check for milestone events
          STARS=$(curl -sf \
            "https://api.github.com/repos/${{ github.repository }}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" | \
            jq '.stargazers_count // 0' 2>/dev/null || echo "0")

          IS_MILESTONE="false"
          for milestone in 100 500 1000 2500 5000 10000; do
            if [[ "${STARS}" -ge "${milestone}" && "${STARS}" -lt $((milestone + 50)) ]]; then
              IS_MILESTONE="true"
              break
            fi
          done

          echo "hacktoberfest=${IS_HACKTOBERFEST}" >> "$GITHUB_OUTPUT"
          echo "is_milestone=${IS_MILESTONE}"       >> "$GITHUB_OUTPUT"
          echo "repo_stars=${STARS}"                >> "$GITHUB_OUTPUT"

          echo "  🎪 Hacktoberfest: ${IS_HACKTOBERFEST}"
          echo "  ⭐ Repo stars: ${STARS} (milestone: ${IS_MILESTONE})"

      - name: "🏅 Compute achievement badges"
        id: achievements
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const username    = "${{ steps.user.outputs.username }}";
            const prCount     = parseInt("${{ steps.profile.outputs.pr_count }}") || 0;
            const issueCount  = parseInt("${{ steps.profile.outputs.issue_count }}") || 0;
            const totalContrib= parseInt("${{ steps.profile.outputs.contribution_count }}") || 0;
            const isFirst     = "${{ steps.profile.outputs.is_first_time }}" === "true";
            const followers   = parseInt("${{ steps.user.outputs.followers }}") || 0;
            const isHackto    = "${{ steps.events.outputs.hacktoberfest }}" === "true";
            const contextType = "${{ steps.context.outputs.type }}";

            const earned = [];

            // Achievement definitions
            if (isFirst)          earned.push({ badge: "🌱", name: "First Step",    desc: "First contribution to ASH!" });
            if (prCount >= 1)     earned.push({ badge: "🔀", name: "Code Sharer",   desc: "Submitted first PR" });
            if (prCount >= 5)     earned.push({ badge: "💻", name: "Code Wizard",   desc: "5+ pull requests" });
            if (prCount >= 25)    earned.push({ badge: "🏆", name: "PR Champion",   desc: "25+ merged PRs" });
            if (issueCount >= 5)  earned.push({ badge: "🐛", name: "Bug Hunter",    desc: "Reported 5+ issues" });
            if (issueCount >= 20) earned.push({ badge: "🔭", name: "Issue Legend",  desc: "20+ issues reported" });
            if (totalContrib >= 50) earned.push({ badge: "💫", name: "Power User",  desc: "50+ contributions" });
            if (followers >= 100) earned.push({ badge: "⭐", name: "Influencer",    desc: "100+ GitHub followers" });
            if (isHackto)         earned.push({ badge: "🎃", name: "Hacktoberfest", desc: "Contributing in October!" });
            if (contextType === "security") earned.push({ badge: "🔒", name: "Security Guard", desc: "Security contributor" });
            if (contextType === "docs")     earned.push({ badge: "📚", name: "Doc Writer",    desc: "Documentation contributor" });
            if (contextType === "theme")    earned.push({ badge: "🎨", name: "Theme Artist",   desc: "Theme contributor" });
            if (contextType === "plugin")   earned.push({ badge: "🔌", name: "Plugin Creator", desc: "Plugin contributor" });

            const achievementStr = JSON.stringify(earned);
            core.setOutput("list",  achievementStr);
            core.setOutput("count", String(earned.length));

            console.log(`  🏅 Achievements earned: ${earned.length}`);
            earned.forEach(a => console.log(`     ${a.badge} ${a.name}`));

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Post personalized welcome message
  # ───────────────────────────────────────────────────────────────────────────
  post-welcome:
    name: "🎉 Welcome · Post Personalized Message"
    needs: analyze-contributor
    if: |
      needs.analyze-contributor.outputs.is_first_time == 'true' ||
      github.event.inputs.force_first_time == 'true' ||
      github.event.inputs.mode == 'celebration'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📦 Setup"
        run: |
          mkdir -p "${WORK_DIR}"
          pip3 install --quiet --user rich==13.9.2 2>/dev/null || true

      - name: "🎉 Generate & post welcome message"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const DRY_RUN      = process.env.DRY_RUN === "true";
            const WELCOME_MODE = process.env.WELCOME_MODE || "standard";

            // Contributor data
            const username     = "${{ needs.analyze-contributor.outputs.username }}";
            const displayName  = "${{ needs.analyze-contributor.outputs.display_name }}";
            const tier         = "${{ needs.analyze-contributor.outputs.contributor_tier }}";
            const contextType  = "${{ needs.analyze-contributor.outputs.context_type }}";
            const component    = "${{ needs.analyze-contributor.outputs.component }}";
            const lang         = "${{ needs.analyze-contributor.outputs.detected_language }}";
            const itemType     = "${{ needs.analyze-contributor.outputs.item_type }}";
            const itemNum      = parseInt("${{ needs.analyze-contributor.outputs.item_number }}");
            const isHackto     = "${{ needs.analyze-contributor.outputs.is_hacktoberfest }}" === "true";
            const repoStars    = "${{ needs.analyze-contributor.outputs.repo_stars || '0' }}";

            let achievements = [];
            try {
              achievements = JSON.parse(`${{ needs.analyze-contributor.outputs.achievements }}`);
            } catch(e) { achievements = []; }

            // ── Multi-language greeting ────────────────────────────────
            const GREETINGS = {
              en: `Welcome to ASH Dotfiles`,
              es: `¡Bienvenido/a a ASH Dotfiles`,
              de: `Willkommen bei ASH Dotfiles`,
              fr: `Bienvenue sur ASH Dotfiles`,
              ja: `ASH Dotfiles へようこそ`,
              zh: `欢迎来到 ASH Dotfiles`,
              pt: `Bem-vindo(a) ao ASH Dotfiles`,
              ko: `ASH Dotfiles에 오신 것을 환영합니다`,
              ru: `Добро пожаловать в ASH Dotfiles`,
              ar: `مرحباً بك في ASH Dotfiles`,
              hi: `ASH Dotfiles में आपका स्वागत है`,
              it: `Benvenuto/a in ASH Dotfiles`,
              nl: `Welkom bij ASH Dotfiles`,
              pl: `Witaj w ASH Dotfiles`,
              tr: `ASH Dotfiles'a Hoş Geldiniz`,
            };

            const THANKS_BY_LANG = {
              en: "Thank you for your first contribution",
              es: "Gracias por tu primera contribución",
              de: "Danke für Ihren ersten Beitrag",
              fr: "Merci pour votre première contribution",
              ja: "初めての貢献をありがとうございます",
              zh: "感谢您的第一次贡献",
              pt: "Obrigado(a) pela sua primeira contribuição",
              ko: "첫 번째 기여에 감사합니다",
              ru: "Спасибо за ваш первый вклад",
              ar: "شكراً على مساهمتك الأولى",
              hi: "आपके पहले योगदान के लिए धन्यवाद",
              it: "Grazie per il tuo primo contributo",
              nl: "Bedankt voor uw eerste bijdrage",
              pl: "Dziękujemy za pierwszy wkład",
              tr: "İlk katkınız için teşekkürler",
            };

            const greeting  = GREETINGS[lang]  || GREETINGS.en;
            const thanksMsg = THANKS_BY_LANG[lang] || THANKS_BY_LANG.en;

            // ── Context-specific guidance ──────────────────────────────
            const CONTEXT_GUIDES = {
              bug: {
                emoji: "🐛",
                title: "Bug Report Guidance",
                tips: [
                  "Include your ASH version: `ash --version`",
                  "Add your distro & GPU info",
                  "Paste relevant error output",
                  "Describe exact reproduction steps",
                  "Run `ash doctor` and share the output",
                ],
                docs: `${process.env.DOCS_URL}/troubleshooting/common-issues`,
              },
              feature: {
                emoji: "✨",
                title: "Feature Request Tips",
                tips: [
                  "Describe the use case clearly",
                  "Explain why existing solutions don't work",
                  "Share mockups or examples if possible",
                  "Consider implementation complexity",
                ],
                docs: `${process.env.DOCS_URL}/contributing/feature-requests`,
              },
              theme: {
                emoji: "🎨",
                title: "Theme Submission Guide",
                tips: [
                  "Include preview screenshots (desktop + neovim)",
                  "Provide complete `colors.json` with all 26 colors",
                  "Ensure WCAG AA contrast ratios",
                  "Test with `ash theme validate`",
                  "Add metadata.json with author info",
                ],
                docs: `${process.env.DOCS_URL}/guides/theme-creation`,
              },
              plugin: {
                emoji: "🔌",
                title: "Plugin Development Guide",
                tips: [
                  "Follow the plugin schema in `plugins/schema/`",
                  "Include `plugin.json` manifest",
                  "Add enable/disable/status scripts",
                  "Write tests in `tests/`",
                  "Document with README.md",
                ],
                docs: `${process.env.DOCS_URL}/guides/plugin-development`,
              },
              docs: {
                emoji: "📚",
                title: "Documentation Tips",
                tips: [
                  "Follow existing docs structure",
                  "Use clear, concise language",
                  "Include code examples where helpful",
                  "Check for broken links",
                  "Run `markdownlint` before submitting",
                ],
                docs: `${process.env.DOCS_URL}/contributing`,
              },
              security: {
                emoji: "🔒",
                title: "Security Report",
                tips: [
                  "**Do not share details publicly**",
                  "Use GitHub Security Advisories",
                  "Include impact assessment",
                  "Provide proof-of-concept if safe to do so",
                  "We'll respond within 24 hours",
                ],
                docs: `${process.env.DOCS_URL}/security`,
              },
              general: {
                emoji: "💡",
                title: "Getting Started",
                tips: [
                  "Read our [Contributing Guide](" + process.env.CONTRIBUTING_URL + ")",
                  "Check existing issues to avoid duplicates",
                  "Join our Discord community",
                  "Run `ash doctor` for system health",
                ],
                docs: process.env.CONTRIBUTING_URL,
              },
            };

            const guide = CONTEXT_GUIDES[contextType] || CONTEXT_GUIDES.general;

            // ── Component-specific docs ────────────────────────────────
            const COMPONENT_DOCS = {
              theme:    `${process.env.DOCS_URL}/guides/theme-creation`,
              neovim:   `${process.env.DOCS_URL}/guides/neovim-ide-guide`,
              hyprland: `${process.env.DOCS_URL}/guides/gaming-setup`,
              shell:    `${process.env.DOCS_URL}/guides/fish-shell-guide`,
              waybar:   `${process.env.DOCS_URL}/guides/waybar-customization`,
              plugin:   `${process.env.DOCS_URL}/guides/plugin-development`,
              api:      `${process.env.DOCS_URL}/guides/api-guide`,
              cli:      `${process.env.DOCS_URL}/reference/ash-cli-reference`,
              docs:     `${process.env.DOCS_URL}/contributing`,
              ci:       `${process.env.DOCS_URL}/contributing/testing`,
              nix:      `${process.env.DOCS_URL}/guides/nixos-setup`,
              testing:  `${process.env.DOCS_URL}/contributing/testing`,
            };

            const componentDoc = COMPONENT_DOCS[component] || process.env.DOCS_URL;

            // ── Achievement display ────────────────────────────────────
            const achievementBadges = achievements.length
              ? achievements.map(a => `\`${a.badge} ${a.name}\``).join(" · ")
              : "";

            // ── Hacktoberfest bonus ────────────────────────────────────
            const hacktofestSection = isHackto ? [
              ``,
              `### 🎃 Hacktoberfest ${new Date().getFullYear()}`,
              ``,
              `You're contributing during **Hacktoberfest**! 🎉`,
              `Make sure your PR follows the [Hacktoberfest guidelines](https://hacktoberfest.com).`,
              `Quality contributions here count toward your Hacktoberfest progress!`,
            ].join("\n") : "";

            // ── PR checklist (PR only) ─────────────────────────────────
            const prChecklist = itemType === "pr" ? [
              ``,
              `### ✅ PR Checklist`,
              ``,
              `Please verify before requesting review:`,
              ``,
              `- [ ] 🧪 Tests pass locally`,
              `- [ ] 📝 Documentation updated if needed`,
              `- [ ] 🎨 Code follows project style (run \`shellcheck\`)`,
              `- [ ] 🔍 Self-reviewed the diff`,
              `- [ ] 💬 Added meaningful commit messages`,
              `- [ ] 🚀 No debug code or secrets included`,
              component === "theme"  ? "- [ ] 🎨 Theme validated with `ash theme validate`"    : null,
              component === "plugin" ? "- [ ] 🔌 Plugin schema validated"                       : null,
              component === "shell"  ? "- [ ] 🐚 ShellCheck passes with 0 errors"              : null,
              component === "neovim" ? "- [ ] 📝 Luacheck passes"                              : null,
            ].filter(Boolean).join("\n") : "";

            // ── Build the full welcome message ─────────────────────────
            const tierEmojis = {
              "newcomer":              "🌱",
              "returning-contributor": "🔄",
              "established-contributor":"⭐",
              "regular-contributor":   "🌟",
              "active-contributor":    "💫",
              "core-maintainer":       "🏆",
            };
            const tierEmoji = tierEmojis[tier] || "👋";

            const CELEBRATION_HEADER = WELCOME_MODE === "celebration"
              ? "🎊🎉🎊🎉🎊🎉🎊\n\n"
              : "";

            const lines = [
              `${CELEBRATION_HEADER}## ${tierEmoji} ${greeting}, @${displayName || username}!`,
              ``,
              `${thanksMsg} to **ASH Dotfiles v5.0 OMEGA**! 🎉`,
              ``,
              `We're thrilled to have you here. This project is built by and for the`,
              `Linux ricing community — your contribution makes it better for everyone.`,
              ``,
              achievementBadges ? `### 🏅 Your Achievements\n\n${achievementBadges}\n` : "",
              `### ${guide.emoji} ${guide.title}`,
              ``,
              `Here are some tips specific to your **${contextType}** contribution:`,
              ``,
              ...guide.tips.map(tip => `- ${tip}`),
              ``,
              `📖 **Relevant Docs:** [${contextType} guide](${guide.docs})`,
              component !== "general" ? `📦 **Component Docs:** [${component} documentation](${componentDoc})` : "",
              hacktofestSection,
              prChecklist,
              ``,
              `### 🔗 Essential Resources`,
              ``,
              `| Resource | Link |`,
              `|----------|------|`,
              `| 📖 Documentation | [ash-dotfiles.dev](${process.env.DOCS_URL}) |`,
              `| 💬 Discord Community | [Join us!](${process.env.DISCORD_INVITE}) |`,
              `| 📋 Contributing Guide | [CONTRIBUTING.md](${process.env.CONTRIBUTING_URL}) |`,
              `| 💡 Discussions | [GitHub Discussions](${process.env.DISCUSSIONS_URL}) |`,
              `| 🐛 ASH Doctor | Run \`ash doctor\` for diagnostics |`,
              `| ⭐ Star the repo | [If you find it useful!](https://github.com/${context.repo.owner}/${context.repo.repo}) |`,
              ``,
              `### ⚡ Quick Commands`,
              ``,
              `\`\`\`bash`,
              `# Install ASH (if you haven't yet)`,
              `bash <(curl -fsSL https://ash.dev/install)`,
              ``,
              `# Check your setup`,
              `ash doctor`,
              ``,
              `# Apply a theme`,
              `ash theme apply catppuccin-mocha`,
              ``,
              `# Browse 250+ themes`,
              `ash theme pick`,
              `\`\`\``,
              ``,
              `---`,
              ``,
              `💌 **A maintainer will review your ${itemType} soon.** We aim to respond within:`,
              `- 🚨 Security issues: **4 hours**`,
              `- 🔴 Critical bugs: **24 hours**`,
              `- 🟡 General: **72 hours**`,
              ``,
              `Thank you for making ASH better! 🙏`,
              ``,
              `---`,
              `*🤖 ASH v5.0 OMEGA Onboarding Engine · Session \`${{ needs.analyze-contributor.outputs.session_id }}\`*`,
            ].filter(l => l !== "").join("\n");

            if (DRY_RUN) {
              console.log("[DRY RUN] Would post:\n" + lines.slice(0, 300));
              return;
            }

            if (!itemNum) {
              core.warning("No item number to post to");
              return;
            }

            await github.rest.issues.createComment({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              issue_number: itemNum,
              body:        lines,
            }).catch(e => core.error(`Welcome comment failed: ${e.message}`));

            console.log(`  ✅ Welcome posted to ${itemType} #${itemNum}`);

      - name: "🏷️ Apply first-contributor label"
        if: env.DRY_RUN != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const itemNum = parseInt("${{ needs.analyze-contributor.outputs.item_number }}");
            if (!itemNum) return;

            // Ensure label exists
            await github.rest.issues.createLabel({
              owner: context.repo.owner, repo: context.repo.repo,
              name: "first-contribution", color: "e6f3ff",
              description: "🎉 First contribution from this contributor",
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              issue_number: itemNum,
              labels:      ["first-contribution", "needs-triage"],
            }).catch(e => core.warning(`Label failed: ${e.message}`));

            console.log("  ✅ first-contribution label applied");

      - name: "🔔 Discord new contributor notification"
        if: env.DRY_RUN != 'true'
        continue-on-error: true
        run: |
          USERNAME="${{ needs.analyze-contributor.outputs.username }}"
          DISPLAY_NAME="${{ needs.analyze-contributor.outputs.display_name }}"
          ITEM_TYPE="${{ needs.analyze-contributor.outputs.item_type }}"
          ITEM_NUM="${{ needs.analyze-contributor.outputs.item_number }}"
          CONTEXT="${{ needs.analyze-contributor.outputs.context_type }}"
          TIER="${{ needs.analyze-contributor.outputs.contributor_tier }}"
          IS_HACKTO="${{ needs.analyze-contributor.outputs.is_hacktoberfest }}"
          REPO="${{ github.repository }}"

          [[ -z "${DISCORD_WEBHOOK_WELCOME:-}" ]] && exit 0

          HACKTO_FIELD=""
          [[ "${IS_HACKTO}" == "true" ]] && \
            HACKTO_FIELD='{"name":"🎃 Hacktoberfest","value":"Contributing in October!","inline":true},'

          ITEM_URL="https://github.com/${REPO}/${ITEM_TYPE}s/${ITEM_NUM}"
          [[ "${ITEM_TYPE}" == "pr" ]] && ITEM_URL="https://github.com/${REPO}/pull/${ITEM_NUM}"

          PAYLOAD=$(cat << EOF
          {
            "username": "ASH Onboarding Bot",
            "avatar_url": "https://raw.githubusercontent.com/${REPO}/main/assets/brand/logos/ash-logo-256.png",
            "content": "🎉 **New contributor spotted!**",
            "embeds": [{
              "title": "🌱 Welcome @${USERNAME}!",
              "description": "A new contributor has joined the ASH Dotfiles community!",
              "url": "${ITEM_URL}",
              "color": 10181046,
              "thumbnail": {
                "url": "https://github.com/${USERNAME}.png?size=128"
              },
              "fields": [
                {"name": "👤 Contributor", "value": "@${USERNAME}", "inline": true},
                {"name": "📋 Type",        "value": "\`${ITEM_TYPE} #${ITEM_NUM}\`", "inline": true},
                {"name": "🎨 Context",     "value": "\`${CONTEXT}\`", "inline": true},
                ${HACKTO_FIELD}
                {"name": "📖 Tier",        "value": "\`${TIER}\`", "inline": true},
                {"name": "🔗 View",        "value": "[Open ${ITEM_TYPE^^} #${ITEM_NUM}](${ITEM_URL})", "inline": false}
              ],
              "footer": {"text": "ASH Dotfiles v5.0 OMEGA · Contributor Onboarding"},
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          EOF
          )

          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${DISCORD_WEBHOOK_WELCOME}" && \
            echo "  ✅ Discord notified" || \
            echo "  ⚠️ Discord notification failed"
        env:
          DISCORD_WEBHOOK_WELCOME: ${{ secrets.DISCORD_WEBHOOK_WELCOME }}

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — Returning contributor milestone messages
  # ───────────────────────────────────────────────────────────────────────────
  milestone-message:
    name: "🏆 Milestone · Contribution Achievement"
    needs: analyze-contributor
    if: |
      needs.analyze-contributor.outputs.is_first_time == 'false' &&
      (
        needs.analyze-contributor.outputs.contribution_count == '5'  ||
        needs.analyze-contributor.outputs.contribution_count == '10' ||
        needs.analyze-contributor.outputs.contribution_count == '25' ||
        needs.analyze-contributor.outputs.contribution_count == '50' ||
        needs.analyze-contributor.outputs.contribution_count == '100'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "🏆 Post milestone congratulations"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const DRY_RUN     = process.env.DRY_RUN === "true";
            const username    = "${{ needs.analyze-contributor.outputs.username }}";
            const count       = parseInt("${{ needs.analyze-contributor.outputs.contribution_count }}");
            const tier        = "${{ needs.analyze-contributor.outputs.contributor_tier }}";
            const itemNum     = parseInt("${{ needs.analyze-contributor.outputs.item_number }}");
            const itemType    = "${{ needs.analyze-contributor.outputs.item_type }}";

            if (!itemNum) return;

            const MILESTONES = {
              5:   { emoji: "⭐", title: "Rising Star!",       msg: "You've made 5 contributions to ASH! You're becoming a valued community member." },
              10:  { emoji: "🌟", title: "Double Digits!",     msg: "10 contributions — you're now an established contributor! Your impact is growing." },
              25:  { emoji: "💫", title: "25 Contributions!",  msg: "Quarter-century milestone! You're a core community member and we appreciate everything you do." },
              50:  { emoji: "🏆", title: "50 Contributions!",  msg: "Incredible! 50 contributions makes you one of our top contributors. You're amazing!" },
              100: { emoji: "👑", title: "Centennial Legend!", msg: "100 CONTRIBUTIONS! You have achieved legendary status in the ASH community. Thank you!" },
            };

            const milestone = MILESTONES[count];
            if (!milestone) return;

            const TIER_UPGRADES = {
              "established-contributor": "You've been promoted to **⭐ Established Contributor**!",
              "regular-contributor":     "You've been promoted to **🌟 Regular Contributor**!",
              "active-contributor":      "You've been promoted to **💫 Active Contributor**!",
              "core-maintainer":         "You've been promoted to **🏆 Core Maintainer**!",
            };
            const upgrade = TIER_UPGRADES[tier] || "";

            const body = [
              `## ${milestone.emoji} Milestone Achieved — ${milestone.title}`,
              ``,
              `@${username} — **${milestone.msg}**`,
              ``,
              upgrade ? `🎯 ${upgrade}` : "",
              ``,
              `| Achievement | Value |`,
              `|-------------|-------|`,
              `| 📊 Total Contributions | \`${count}\` |`,
              `| 🏅 Current Tier | \`${tier}\` |`,
              `| 🙏 Thank you | From the entire ASH team |`,
              ``,
              `Keep up the amazing work! The ASH community is better because of you. 🚀`,
              ``,
              `---`,
              `*🤖 ASH v5.0 OMEGA Milestone Engine*`,
            ].filter(Boolean).join("\n");

            if (!DRY_RUN) {
              await github.rest.issues.createComment({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                issue_number: itemNum,
                body,
              }).catch(e => core.warning(`Milestone comment failed: ${e.message}`));
              console.log(`  🏆 Milestone comment posted for #${count}`);
            } else {
              console.log("[DRY] Milestone comment preview generated");
            }

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4 — Monthly contributor leaderboard
  # ───────────────────────────────────────────────────────────────────────────
  monthly-leaderboard:
    name: "📊 Leaderboard · Monthly Contributor Rankings"
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.mode == 'leaderboard'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: "📊 Generate monthly leaderboard"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const now      = new Date();
            const monthAgo = new Date(now.getTime() - 30 * 24 * 3600000);
            const monthStr = now.toLocaleString("en-US", { month: "long", year: "numeric" });

            // Fetch recent PRs and issues
            const [recentPRs, recentIssues] = await Promise.all([
              github.paginate(github.rest.pulls.list, {
                owner:    context.repo.owner,
                repo:     context.repo.repo,
                state:    "all",
                per_page: 100,
                sort:     "updated",
                direction:"desc",
              }),
              github.paginate(github.rest.issues.listForRepo, {
                owner:    context.repo.owner,
                repo:     context.repo.repo,
                state:    "all",
                per_page: 100,
                sort:     "updated",
                direction:"desc",
              }),
            ]);

            // Count contributions per user
            const stats = {};
            const addStat = (user, type) => {
              if (!user || user === "github-actions[bot]" || user.includes("[bot]")) return;
              if (!stats[user]) stats[user] = { prs: 0, issues: 0, total: 0, merged: 0 };
              stats[user][type]++;
              stats[user].total++;
            };

            for (const pr of recentPRs) {
              if (new Date(pr.created_at) < monthAgo) continue;
              addStat(pr.user?.login, "prs");
              if (pr.merged_at) {
                if (!stats[pr.user?.login]) continue;
                stats[pr.user.login].merged++;
              }
            }

            for (const issue of recentIssues) {
              if (issue.pull_request) continue;
              if (new Date(issue.created_at) < monthAgo) continue;
              addStat(issue.user?.login, "issues");
            }

            const ranked = Object.entries(stats)
              .sort(([,a],[,b]) => b.total - a.total)
              .slice(0, 10);

            if (!ranked.length) {
              console.log("  ℹ️ No contributions this month");
              return;
            }

            const MEDALS = ["🥇","🥈","🥉","4️⃣","5️⃣","6️⃣","7️⃣","8️⃣","9️⃣","🔟"];
            const rows = ranked.map(([user, s], i) =>
              `| ${MEDALS[i]} | @${user} | \`${s.prs}\` | \`${s.merged}\` | \`${s.issues}\` | **\`${s.total}\`** |`
            ).join("\n");

            const leaderboard = [
              `# 🏆 ASH Dotfiles — Monthly Contributor Leaderboard`,
              ``,
              `> **${monthStr}** · Top contributors this month`,
              ``,
              `| Rank | Contributor | PRs | Merged | Issues | Total |`,
              `|------|-------------|-----|--------|--------|-------|`,
              rows,
              ``,
              `---`,
              ``,
              `🙏 **Thank you to every contributor!** Each issue, PR, and discussion`,
              `makes ASH better for the entire Linux ricing community.`,
              ``,
              `💬 [Join our Discord](${process.env.DISCORD_INVITE}) · `,
              `📖 [Read the Docs](${process.env.DOCS_URL}) · `,
              `⭐ [Star the Repo](https://github.com/${context.repo.owner}/${context.repo.repo})`,
              ``,
              `---`,
              `*📊 ASH v5.0 OMEGA · Auto-generated monthly leaderboard*`,
            ].join("\n");

            require("fs").writeFileSync(process.env.GITHUB_STEP_SUMMARY, leaderboard);

            // Post as discussion (if discussions enabled)
            console.log("  ✅ Leaderboard generated");
            console.log(leaderboard.slice(0, 500));

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 5 — Generate step summary
  # ───────────────────────────────────────────────────────────────────────────
  summary:
    name: "📊 Summary · Onboarding Report"
    needs: [analyze-contributor, post-welcome]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: "📊 Write step summary"
        run: |
          USERNAME="${{ needs.analyze-contributor.outputs.username }}"
          TIER="${{ needs.analyze-contributor.outputs.contributor_tier }}"
          IS_FIRST="${{ needs.analyze-contributor.outputs.is_first_time }}"
          CONTEXT="${{ needs.analyze-contributor.outputs.context_type }}"
          LANG="${{ needs.analyze-contributor.outputs.detected_language }}"
          COUNT="${{ needs.analyze-contributor.outputs.contribution_count }}"

          cat >> "${GITHUB_STEP_SUMMARY}" << EOF
          # 🎉 Contributor Onboarding Summary

          | Field | Value |
          |-------|-------|
          | 👤 Contributor | @${USERNAME} |
          | 🆕 First Time | \`${IS_FIRST}\` |
          | 📊 Total Contributions | \`${COUNT}\` |
          | 🏅 Tier | \`${TIER}\` |
          | 🎨 Context | \`${CONTEXT}\` |
          | 🌍 Language | \`${LANG}\` |
          | 🤖 Mode | \`${WELCOME_MODE}\` |

          ---
          *🎉 ASH v5.0 OMEGA Onboarding Engine*
          EOF