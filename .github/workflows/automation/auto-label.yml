name: "🏷️ Auto-Label · Intelligent Classification Engine"

on:
  issues:
    types:
      - opened
      - edited
      - reopened

  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - ready_for_review
      - converted_to_draft

  issue_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      target_number:
        description: "Issue/PR number to re-label (0 = all open)"
        required: false
        default: "0"
        type: string
      dry_run:
        description: "Dry run — preview labels without applying"
        required: false
        default: false
        type: boolean
      mode:
        description: "Labeling mode"
        required: false
        default: "full"
        type: choice
        options:
          - full          # All strategies
          - path-only     # File path rules only
          - content-only  # Title/body analysis only
          - size-only     # PR size only
          - triage        # Focus on triage labels

# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: "auto-label-${{ github.event.number || github.event.issue.number || 'batch' }}"
  cancel-in-progress: true

permissions:
  issues: write
  pull-requests: write
  contents: read
  repository-projects: read

# ─────────────────────────────────────────────────────────────────────────────
env:
  LABELER_VERSION: "5.0.0"
  DRY_RUN: "${{ github.event.inputs.dry_run || 'false' }}"
  LABEL_MODE: "${{ github.event.inputs.mode || 'full' }}"

# ═════════════════════════════════════════════════════════════════════════════
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Bootstrap label ecosystem
  # ───────────────────────────────────────────────────────────────────────────
  bootstrap-labels:
    name: "🏗️ Bootstrap · Label Ecosystem"
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' ||
      github.event_name == 'pull_request_target'
    timeout-minutes: 5

    steps:
      - name: "🏗️ Ensure all required labels exist"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // ── Complete label registry ──────────────────────────────────
            const LABELS = [
              // ── Type ─────────────────────────────────────────────────
              { name: "bug",               color: "d73a4a", desc: "🐛 Something isn't working" },
              { name: "feature-request",   color: "a2eeef", desc: "✨ New feature or request" },
              { name: "enhancement",       color: "84b6eb", desc: "🚀 Improvement to existing" },
              { name: "question",          color: "d876e3", desc: "❓ Further information requested" },
              { name: "documentation",     color: "0075ca", desc: "📚 Documentation changes" },
              { name: "performance",       color: "ffd700", desc: "⚡ Performance related" },
              { name: "security",          color: "ee0701", desc: "🔒 Security vulnerability" },
              { name: "refactor",          color: "e4e669", desc: "🔨 Code refactoring" },
              { name: "test",              color: "bfd4f2", desc: "🧪 Test coverage" },
              { name: "ci-cd",             color: "0e8a16", desc: "⚙️ CI/CD changes" },
              { name: "dependency",        color: "0366d6", desc: "📦 Dependency update" },
              { name: "chore",             color: "ededed", desc: "🔧 Maintenance task" },
              { name: "regression",        color: "b60205", desc: "📉 Performance regression" },

              // ── Component ────────────────────────────────────────────
              { name: "component:theme",   color: "cba6f7", desc: "🎨 Theme engine" },
              { name: "component:plugin",  color: "89b4fa", desc: "🔌 Plugin system" },
              { name: "component:shell",   color: "a6e3a1", desc: "🐚 Fish/Bash shell" },
              { name: "component:neovim",  color: "74c7ec", desc: "📝 Neovim config" },
              { name: "component:hyprland",color: "f5c2e7", desc: "🖥️ Hyprland WM" },
              { name: "component:waybar",  color: "fab387", desc: "📊 Waybar" },
              { name: "component:rofi",    color: "f9e2af", desc: "🚀 Rofi launcher" },
              { name: "component:api",     color: "94e2d5", desc: "🌐 REST API" },
              { name: "component:cli",     color: "89dceb", desc: "⌨️ CLI tool" },
              { name: "component:docs",    color: "b4befe", desc: "📖 Documentation" },
              { name: "component:install", color: "eba0ac", desc: "💿 Installation" },
              { name: "component:config",  color: "f38ba8", desc: "⚙️ Configuration" },
              { name: "component:mobile",  color: "f2cdcd", desc: "📱 Mobile app" },
              { name: "component:web",     color: "cdd6f4", desc: "🌐 Web dashboard" },
              { name: "component:ci",      color: "a6adc8", desc: "⚙️ CI/CD" },
              { name: "component:assets",  color: "bac2de", desc: "🖼️ Assets/media" },

              // ── Priority ─────────────────────────────────────────────
              { name: "priority:critical", color: "b60205", desc: "🚨 Critical — ASAP" },
              { name: "priority:high",     color: "e4e669", desc: "🔴 High priority" },
              { name: "priority:medium",   color: "ffd700", desc: "🟡 Medium priority" },
              { name: "priority:low",      color: "0e8a16", desc: "🟢 Low priority" },

              // ── PR Size ──────────────────────────────────────────────
              { name: "size:XS",    color: "3cbf00", desc: "📐 XS: <10 lines"      },
              { name: "size:S",     color: "5d9801", desc: "📐 S:  10-49 lines"    },
              { name: "size:M",     color: "7f7203", desc: "📐 M:  50-249 lines"   },
              { name: "size:L",     color: "b45a04", desc: "📐 L:  250-999 lines"  },
              { name: "size:XL",    color: "c73205", desc: "📐 XL: 1000-2999 lines"},
              { name: "size:XXL",   color: "ee0701", desc: "📐 XXL: 3000+ lines"   },

              // ── Status ───────────────────────────────────────────────
              { name: "needs-triage",      color: "e4e669", desc: "🔍 Needs triage" },
              { name: "needs-info",        color: "d4c5f9", desc: "❓ Needs more information" },
              { name: "needs-repro",       color: "ffa500", desc: "🔄 Needs reproduction" },
              { name: "needs-review",      color: "0075ca", desc: "👀 Needs review" },
              { name: "needs-decision",    color: "c2e0c6", desc: "🤔 Awaiting decision" },
              { name: "in-progress",       color: "1d76db", desc: "🔄 Work in progress" },
              { name: "ready-to-merge",    color: "0e8a16", desc: "✅ Ready to merge" },
              { name: "blocked",           color: "b60205", desc: "🚫 Blocked by dependency" },
              { name: "on-hold",           color: "c5def5", desc: "⏸️ On hold" },
              { name: "wontfix",           color: "ffffff", desc: "🚫 Won't fix" },
              { name: "duplicate",         color: "cfd3d7", desc: "♻️ Duplicate issue" },
              { name: "invalid",           color: "e4e669", desc: "❌ Invalid issue" },

              // ── Platform / Distro ─────────────────────────────────────
              { name: "distro:arch",       color: "1793d1", desc: "🐧 Arch Linux" },
              { name: "distro:fedora",     color: "294172", desc: "🎩 Fedora" },
              { name: "distro:nixos",      color: "5277c3", desc: "❄️ NixOS" },
              { name: "distro:opensuse",   color: "73ba25", desc: "🦎 openSUSE" },
              { name: "distro:debian",     color: "a80030", desc: "🌀 Debian" },
              { name: "distro:ubuntu",     color: "e95420", desc: "🟠 Ubuntu" },
              { name: "distro:void",       color: "478061", desc: "🕳️ Void Linux" },
              { name: "distro:gentoo",     color: "54487a", desc: "🧬 Gentoo" },

              // ── GPU ───────────────────────────────────────────────────
              { name: "gpu:nvidia",        color: "76b900", desc: "🟢 NVIDIA GPU" },
              { name: "gpu:amd",           color: "ed1c24", desc: "🔴 AMD GPU" },
              { name: "gpu:intel",         color: "0071c5", desc: "🔵 Intel GPU" },

              // ── Community ─────────────────────────────────────────────
              { name: "good first issue",  color: "7057ff", desc: "👶 Good for newcomers" },
              { name: "help wanted",       color: "008672", desc: "🙋 Extra attention needed" },
              { name: "hacktoberfest",     color: "ff7518", desc: "🎃 Hacktoberfest" },
              { name: "first-contribution",color: "e6f3ff", desc: "🎉 First contribution" },

              // ── Meta ──────────────────────────────────────────────────
              { name: "pinned",            color: "0075ca", desc: "📌 Pinned — keep open" },
              { name: "funded",            color: "ffd700", desc: "💰 Funded issue" },
              { name: "wip",               color: "fbca04", desc: "🚧 Work in progress" },
              { name: "breaking-change",   color: "b60205", desc: "💥 Breaking change" },
              { name: "theme-submission",  color: "cba6f7", desc: "🎨 Theme submission" },
              { name: "plugin-submission", color: "89b4fa", desc: "🔌 Plugin submission" },
              { name: "wallpaper-submission",color:"f5c2e7",desc: "🖼️ Wallpaper submission"},
              { name: "do-not-close",      color: "0075ca", desc: "🔒 Do not close" },
              { name: "automated",         color: "ededed", desc: "🤖 Automated action" },
            ];

            let created = 0, updated = 0, skipped = 0;

            for (const label of LABELS) {
              try {
                const existing = await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  name:  label.name,
                }).catch(() => null);

                if (existing) {
                  // Update if color/description differs
                  if (existing.data.color !== label.color ||
                      existing.data.description !== label.desc) {
                    await github.rest.issues.updateLabel({
                      owner:       context.repo.owner,
                      repo:        context.repo.repo,
                      name:        label.name,
                      color:       label.color,
                      description: label.desc,
                    });
                    updated++;
                  } else {
                    skipped++;
                  }
                } else {
                  await github.rest.issues.createLabel({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    name:        label.name,
                    color:       label.color,
                    description: label.desc,
                  });
                  created++;
                }
              } catch (e) {
                core.warning(`Label '${label.name}': ${e.message}`);
              }
            }

            console.log(`✅ Labels — created: ${created}  updated: ${updated}  skipped: ${skipped}`);

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Smart label issues based on content analysis
  # ───────────────────────────────────────────────────────────────────────────
  label-issues:
    name: "🏷️ Label · Issue Analysis"
    needs: bootstrap-labels
    if: |
      github.event_name == 'issues' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.mode != 'path-only' &&
       github.event.inputs.mode != 'size-only')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "🏷️ Intelligent issue labeling"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const DRY_RUN    = process.env.DRY_RUN === "true";
            const LABEL_MODE = process.env.LABEL_MODE || "full";

            // Determine target issue
            const targetNum = parseInt("${{ github.event.inputs.target_number || '0' }}");
            let issues = [];

            if (targetNum > 0) {
              const item = await github.rest.issues.get({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                issue_number: targetNum,
              });
              issues = [item.data];
            } else if (context.payload.issue) {
              issues = [context.payload.issue];
            } else {
              // Batch mode: fetch all open issues
              issues = await github.paginate(github.rest.issues.listForRepo, {
                owner:    context.repo.owner,
                repo:     context.repo.repo,
                state:    "open",
                per_page: 100,
              });
              issues = issues.filter(i => !i.pull_request);
            }

            // ── Label rule definitions ─────────────────────────────────
            const TITLE_RULES = [
              // ── Type detection ────────────────────────────────────────
              { pattern: /\b(bug|error|crash|fail|broken|exception|traceback|panic|segfault)\b/i,
                labels: ["bug", "needs-triage"] },
              { pattern: /\b(feat(ure)?|add|implement|support|request|wish|want|would like)\b/i,
                labels: ["feature-request"] },
              { pattern: /\b(docs?|documentation|readme|wiki|guide|tutorial|typo|spelling)\b/i,
                labels: ["documentation", "component:docs"] },
              { pattern: /\b(question|how\s+to|how\s+do|help|assist|confused|understand)\b/i,
                labels: ["question"] },
              { pattern: /\b(perf(ormance)?|slow|fast(er)?|speed|latency|optimize|benchmark)\b/i,
                labels: ["performance"] },
              { pattern: /\b(security|vuln(erability)?|CVE|exploit|XSS|injection|auth)\b/i,
                labels: ["security", "priority:critical"] },
              { pattern: /\b(refactor|cleanup|clean.?up|restructure|reorganize|rewrite)\b/i,
                labels: ["refactor"] },
              { pattern: /\b(test(s|ing)?|spec|coverage|unit|integration|e2e)\b/i,
                labels: ["test"] },
              { pattern: /\b(CI|CD|pipeline|workflow|action|github.?action|lint)\b/i,
                labels: ["ci-cd", "component:ci"] },
              { pattern: /\b(dep(endency|endencies)|upgrade|update|bump|version)\b/i,
                labels: ["dependency"] },
              { pattern: /\b(breaking|break|bc|incompatible|migration)\b/i,
                labels: ["breaking-change"] },
              { pattern: /\b(regression|regress|broke.after|worked.before)\b/i,
                labels: ["regression", "bug"] },

              // ── Component detection ───────────────────────────────────
              { pattern: /\b(theme|color|palette|wallpaper|rice|look|appearance)\b/i,
                labels: ["component:theme"] },
              { pattern: /\b(plugin|extension|module|addon)\b/i,
                labels: ["component:plugin"] },
              { pattern: /\b(fish|bash|zsh|shell|prompt|starship|abbrev)\b/i,
                labels: ["component:shell"] },
              { pattern: /\b(nvim|neovim|vim|lua|lsp|mason|treesitter|cmp)\b/i,
                labels: ["component:neovim"] },
              { pattern: /\b(hypr(land)?|wayland|compositor|wm|window.?manager)\b/i,
                labels: ["component:hyprland"] },
              { pattern: /\b(waybar|bar|statusbar|status.?bar|panel)\b/i,
                labels: ["component:waybar"] },
              { pattern: /\b(rofi|launcher|dmenu|runner|app.?launcher)\b/i,
                labels: ["component:rofi"] },
              { pattern: /\b(api|rest|endpoint|http|websocket|server)\b/i,
                labels: ["component:api"] },
              { pattern: /\b(cli|command|ash\s+\w+|terminal.?app)\b/i,
                labels: ["component:cli"] },
              { pattern: /\b(install(ation)?|setup|bootstrap|deploy|uninstall)\b/i,
                labels: ["component:install"] },
              { pattern: /\b(config(uration)?|settings?|hyprland\.conf|fish\.conf)\b/i,
                labels: ["component:config"] },
              { pattern: /\b(mobile|android|ios|flutter|phone|tablet)\b/i,
                labels: ["component:mobile"] },
              { pattern: /\b(web|dashboard|browser|frontend|react|next\.?js)\b/i,
                labels: ["component:web"] },

              // ── Distro detection ──────────────────────────────────────
              { pattern: /\b(arch|archlinux|arch.?linux|paru|yay|pacman|aur)\b/i,
                labels: ["distro:arch"] },
              { pattern: /\b(fedora|dnf|rpm|rhel)\b/i,
                labels: ["distro:fedora"] },
              { pattern: /\b(nixos|nix|flake|home.?manager)\b/i,
                labels: ["distro:nixos"] },
              { pattern: /\b(opensuse|zypper|suse)\b/i,
                labels: ["distro:opensuse"] },
              { pattern: /\b(debian|apt|dpkg)\b/i,
                labels: ["distro:debian"] },
              { pattern: /\b(ubuntu|snap)\b/i,
                labels: ["distro:ubuntu"] },
              { pattern: /\b(void|xbps)\b/i,
                labels: ["distro:void"] },
              { pattern: /\b(gentoo|emerge|portage)\b/i,
                labels: ["distro:gentoo"] },

              // ── GPU detection ──────────────────────────────────────────
              { pattern: /\b(nvidia|rtx|gtx|cuda|proprietary.?driver)\b/i,
                labels: ["gpu:nvidia"] },
              { pattern: /\b(amd|radeon|rx\s*\d|vega|rocm|mesa)\b/i,
                labels: ["gpu:amd"] },
              { pattern: /\b(intel.?gpu|iris|arc\s*\d|i\d+.?g\d+)\b/i,
                labels: ["gpu:intel"] },

              // ── Submission types ──────────────────────────────────────
              { pattern: /\b(theme.?submission|submit.?theme|new.?theme)\b/i,
                labels: ["theme-submission"] },
              { pattern: /\b(plugin.?submission|submit.?plugin|new.?plugin)\b/i,
                labels: ["plugin-submission"] },
              { pattern: /\b(wallpaper.?submission|submit.?wallpaper)\b/i,
                labels: ["wallpaper-submission"] },
            ];

            const BODY_RULES = [
              // ── Severity signals ───────────────────────────────────────
              { pattern: /\b(crash|panic|data.?loss|corruption|security|CVE)\b/i,
                labels: ["priority:critical"] },
              { pattern: /\b(cannot|can'?t|unable.to|doesn'?t.work|broken)\b/i,
                labels: ["priority:high"] },
              { pattern: /\b(steps.to.reproduce|reproduction|repro.?steps)\b/i,
                labels: ["needs-repro"] },
              { pattern: /\b(additional.?info|more.?info|more.?details)\b/i,
                labels: [] },

              // ── Distro in body ─────────────────────────────────────────
              { pattern: /EndeavourOS|Manjaro|Garuda/i,
                labels: ["distro:arch"] },

              // ── Wayland ───────────────────────────────────────────────
              { pattern: /\bXWayland|XDG.portal|wlroots\b/i,
                labels: ["component:hyprland"] },

              // ── Hardware ──────────────────────────────────────────────
              { pattern: /\b(ThinkPad|Framework|ASUS.ROG|Razer.Blade)\b/i,
                labels: [] },  // Hardware context only — no label needed

              // ── Error patterns ─────────────────────────────────────────
              { pattern: /\bsegmentation.fault|SIGSEGV\b/i,
                labels: ["bug", "priority:high"] },
              { pattern: /\bnull.?pointer|nil.?pointer\b/i,
                labels: ["bug"] },
            ];

            // ── Priority escalation rules ─────────────────────────────────
            function scorePriority(title, body) {
              const text = `${title} ${body}`.toLowerCase();
              let score  = 0;
              if (/security|exploit|vuln|CVE/i.test(text))         score += 100;
              if (/crash|panic|segfault|data.?loss/i.test(text))   score += 80;
              if (/broken|cannot|can't|doesn't.work/i.test(text))  score += 40;
              if (/regression|worked.before|broke.after/i.test(text)) score += 60;
              if (/performance|slow|latency/i.test(text))           score += 20;
              if (/improvement|enhance|nice.to.have/i.test(text))  score += 5;
              return score;
            }

            function priorityFromScore(score) {
              if (score >= 80)  return "priority:critical";
              if (score >= 50)  return "priority:high";
              if (score >= 20)  return "priority:medium";
              return "priority:low";
            }

            // ── Detect template type from body ─────────────────────────────
            function detectTemplate(body) {
              if (!body) return null;
              if (/steps to reproduce/i.test(body))                return "bug";
              if (/feature request|use case|proposal/i.test(body)) return "feature-request";
              if (/documentation issue/i.test(body))               return "documentation";
              if (/distro.*compatibility/i.test(body))             return "distro";
              if (/theme.?submission/i.test(body))                 return "theme-submission";
              if (/plugin.?submission/i.test(body))                return "plugin-submission";
              if (/security.?vulnerability/i.test(body))           return "security";
              return null;
            }

            // ── Detect code block languages ────────────────────────────────
            function detectLanguages(body) {
              if (!body) return [];
              const langs = new Set();
              const codeBlocks = body.matchAll(/```(\w+)/g);
              for (const match of codeBlocks) {
                const lang = match[1].toLowerCase();
                const langMap = {
                  lua:    "component:neovim",
                  fish:   "component:shell",
                  bash:   "component:shell",
                  sh:     "component:shell",
                  nix:    "distro:nixos",
                  python: null,
                  ts:     "component:api",
                  js:     "component:web",
                };
                if (langMap[lang]) langs.add(langMap[lang]);
              }
              return [...langs];
            }

            // ── Apply labels ───────────────────────────────────────────────
            async function applyLabels(issueNum, labelsToAdd, labelsToRemove = []) {
              if (!labelsToAdd.length && !labelsToRemove.length) return;

              if (DRY_RUN) {
                console.log(`  [DRY] #${issueNum} +[${labelsToAdd.join(", ")}]`);
                return;
              }

              // Add new labels
              if (labelsToAdd.length) {
                await github.rest.issues.addLabels({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  issue_number: issueNum,
                  labels:      labelsToAdd,
                }).catch(e => core.warning(`addLabels #${issueNum}: ${e.message}`));
              }

              // Remove conflicting labels
              for (const label of labelsToRemove) {
                await github.rest.issues.removeLabel({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  issue_number: issueNum,
                  name:        label,
                }).catch(() => {});
              }
            }

            // ── Check if first-time contributor ────────────────────────────
            async function isFirstContributor(author) {
              try {
                const prs = await github.rest.search.issuesAndPullRequests({
                  q: `repo:${context.repo.owner}/${context.repo.repo} ` +
                     `author:${author} is:merged`,
                });
                return prs.data.total_count === 0;
              } catch {
                return false;
              }
            }

            // ── Main labeling loop ─────────────────────────────────────────
            let totalLabeled = 0;

            for (const issue of issues) {
              const title  = issue.title || "";
              const body   = issue.body  || "";
              const author = issue.user?.login || "";
              const num    = issue.number;
              const existingLabels = (issue.labels || []).map(l => l.name);
              const newLabels  = new Set();
              const conflicts  = [];

              console.log(`\n  ─── Issue #${num}: ${title.slice(0,55)}...`);

              // ── Template detection ──────────────────────────────────────
              const templateType = detectTemplate(body);
              if (templateType) {
                const templateMap = {
                  "bug":              ["bug", "needs-triage"],
                  "feature-request":  ["feature-request"],
                  "documentation":    ["documentation", "component:docs"],
                  "distro":           ["needs-triage"],
                  "theme-submission": ["theme-submission", "component:theme"],
                  "plugin-submission":["plugin-submission", "component:plugin"],
                  "security":         ["security", "priority:critical"],
                };
                (templateMap[templateType] || []).forEach(l => newLabels.add(l));
                console.log(`  📋 Template: ${templateType}`);
              }

              // ── Title rules ─────────────────────────────────────────────
              for (const rule of TITLE_RULES) {
                if (rule.pattern.test(title)) {
                  rule.labels.forEach(l => newLabels.add(l));
                }
              }

              // ── Body rules ──────────────────────────────────────────────
              if (LABEL_MODE !== "path-only") {
                for (const rule of BODY_RULES) {
                  if (rule.pattern.test(body)) {
                    rule.labels.forEach(l => newLabels.add(l));
                  }
                }
              }

              // ── Language detection from code blocks ─────────────────────
              detectLanguages(body).forEach(l => newLabels.add(l));

              // ── Priority scoring ────────────────────────────────────────
              const priorityScore = scorePriority(title, body);
              const detectedPriority = priorityFromScore(priorityScore);
              const hasExplicitPriority = existingLabels.some(l => l.startsWith("priority:"));
              if (!hasExplicitPriority && priorityScore >= 20) {
                newLabels.add(detectedPriority);
                // Remove lower priorities if adding higher
                const PRIORITY_ORDER = ["priority:critical","priority:high","priority:medium","priority:low"];
                const newPIdx = PRIORITY_ORDER.indexOf(detectedPriority);
                PRIORITY_ORDER.slice(newPIdx + 1).forEach(p => {
                  if (existingLabels.includes(p)) conflicts.push(p);
                });
              }

              // ── First-time contributor ──────────────────────────────────
              if (author && !existingLabels.includes("first-contribution")) {
                const isFirst = await isFirstContributor(author);
                if (isFirst) {
                  newLabels.add("first-contribution");
                  console.log(`  🎉 First-time contributor: @${author}`);
                }
              }

              // ── Add needs-triage if no type label yet ────────────────────
              const TYPE_LABELS = ["bug","feature-request","documentation","question",
                                   "enhancement","security","performance","refactor","test"];
              const hasType = existingLabels.some(l => TYPE_LABELS.includes(l)) ||
                              [...newLabels].some(l => TYPE_LABELS.includes(l));
              if (!hasType) {
                newLabels.add("needs-triage");
              }

              // ── Filter already-applied labels ────────────────────────────
              const labelsToApply = [...newLabels].filter(l => !existingLabels.includes(l));

              if (labelsToApply.length > 0 || conflicts.length > 0) {
                console.log(`  ✅ +[${labelsToApply.join(", ")}]`);
                if (conflicts.length) console.log(`  🗑️ -[${conflicts.join(", ")}]`);
                await applyLabels(num, labelsToApply, conflicts);
                totalLabeled++;
              } else {
                console.log(`  ⏭️ No new labels needed`);
              }
            }

            console.log(`\n  📊 Total issues labeled: ${totalLabeled}`);
            core.setOutput("total_labeled", totalLabeled);

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — Smart PR labeling (size + path + content)
  # ───────────────────────────────────────────────────────────────────────────
  label-prs:
    name: "🏷️ Label · PR Classification"
    needs: bootstrap-labels
    if: |
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.target_number != '0')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "📏 Classify PR size & apply path labels"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const DRY_RUN = process.env.DRY_RUN === "true";

            // Get PR data
            const pr = context.payload.pull_request;
            if (!pr) {
              core.notice("No PR in payload");
              return;
            }
            const prNum = pr.number;

            // ── Fetch full PR diff stats ────────────────────────────────
            const prData = await github.rest.pulls.get({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              pull_number: prNum,
            });

            const additions  = prData.data.additions  || 0;
            const deletions  = prData.data.deletions  || 0;
            const changedFiles = prData.data.changed_files || 0;
            const totalLines = additions + deletions;
            const isDraft    = prData.data.draft;
            const title      = prData.data.title || "";
            const body       = prData.data.body  || "";
            const author     = prData.data.user?.login || "";
            const existingLabels = (prData.data.labels || []).map(l => l.name);

            console.log(`\n  📊 PR #${prNum}: ${title.slice(0,50)}`);
            console.log(`  📏 +${additions} / -${deletions} lines · ${changedFiles} files`);
            console.log(`  📝 Draft: ${isDraft}`);

            const newLabels = new Set();
            const toRemove  = [];

            // ── PR size classification ──────────────────────────────────
            const SIZE_THRESHOLDS = [
              [10,   "size:XS"],
              [50,   "size:S"],
              [250,  "size:M"],
              [1000, "size:L"],
              [3000, "size:XL"],
              [Infinity, "size:XXL"],
            ];
            let sizeLabel = "size:XS";
            for (const [threshold, label] of SIZE_THRESHOLDS) {
              if (totalLines < threshold) {
                sizeLabel = label;
                break;
              }
            }

            // Remove all old size labels
            const SIZE_LABELS = ["size:XS","size:S","size:M","size:L","size:XL","size:XXL"];
            SIZE_LABELS.forEach(l => {
              if (l !== sizeLabel && existingLabels.includes(l)) toRemove.push(l);
            });
            newLabels.add(sizeLabel);
            console.log(`  📐 Size: ${sizeLabel} (${totalLines} lines)`);

            // ── Draft status ────────────────────────────────────────────
            if (isDraft) {
              newLabels.add("wip");
              toRemove.push("ready-to-merge", "needs-review");
            } else if (context.payload.action === "ready_for_review") {
              newLabels.add("needs-review");
              toRemove.push("wip");
            }

            // ── Fetch changed files for path-based labeling ─────────────
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              pull_number: prNum,
              per_page:    100,
            });

            const filePaths = files.map(f => f.filename);
            console.log(`  📁 Files: ${filePaths.slice(0,5).join(", ")}${filePaths.length > 5 ? " ..." : ""}`);

            // ── Path-based label rules ──────────────────────────────────
            const PATH_RULES = [
              // Themes
              { pattern: /^themes\//,                    labels: ["component:theme"] },
              { pattern: /^config\/hypr\//,              labels: ["component:hyprland"] },
              { pattern: /^config\/waybar\//,            labels: ["component:waybar"] },
              { pattern: /^config\/rofi\//,              labels: ["component:rofi"] },
              { pattern: /^config\/kitty\//,             labels: ["component:shell"] },
              { pattern: /^config\/nvim\//,              labels: ["component:neovim"] },
              { pattern: /^config\/fish\//,              labels: ["component:shell"] },
              { pattern: /^plugins\//,                   labels: ["component:plugin"] },
              { pattern: /^wallpapers\//,                labels: ["component:assets"] },
              { pattern: /^assets\//,                    labels: ["component:assets"] },
              { pattern: /^api\//,                       labels: ["component:api"] },
              { pattern: /^web\//,                       labels: ["component:web"] },
              { pattern: /^mobile\//,                    labels: ["component:mobile"] },
              { pattern: /^ash-cli\//,                   labels: ["component:cli"] },
              { pattern: /^scripts\//,                   labels: ["component:cli"] },
              { pattern: /^docs?\//,                     labels: ["documentation", "component:docs"] },
              { pattern: /^\.github\/workflows\//,       labels: ["ci-cd", "component:ci"] },
              { pattern: /^\.github\//,                  labels: ["ci-cd"] },
              { pattern: /^nix\//,                       labels: ["distro:nixos"] },
              { pattern: /^docker\//,                    labels: ["ci-cd"] },
              { pattern: /^packaging\//,                 labels: ["ci-cd"] },
              { pattern: /^tests?\//,                    labels: ["test"] },
              { pattern: /^benchmarks?\//,               labels: ["performance"] },
              { pattern: /^systemd\//,                   labels: ["component:config"] },
              { pattern: /^config\/gtk/,                 labels: ["component:theme"] },
              { pattern: /README\.md$/i,                 labels: ["documentation"] },
              { pattern: /CHANGELOG\.md$/i,              labels: ["documentation"] },
              { pattern: /\.github\/ISSUE_TEMPLATE\//,   labels: ["documentation"] },
              { pattern: /\.(png|jpg|svg|webp|gif|ico)$/i, labels: ["component:assets"] },
              { pattern: /\.sh$/,                        labels: ["component:cli"] },
              { pattern: /\.fish$/,                      labels: ["component:shell"] },
              { pattern: /\.lua$/,                       labels: ["component:neovim"] },
              { pattern: /\.nix$/,                       labels: ["distro:nixos"] },
              { pattern: /flake\.(nix|lock)$/,           labels: ["distro:nixos"] },
              { pattern: /PKGBUILD|\.SRCINFO/,           labels: ["distro:arch"] },
              { pattern: /\.spec$/,                      labels: ["distro:fedora"] },
            ];

            for (const rule of PATH_RULES) {
              const matches = filePaths.some(fp => rule.pattern.test(fp));
              if (matches) {
                rule.labels.forEach(l => newLabels.add(l));
              }
            }

            // ── Title/body analysis (same as issues) ─────────────────────
            const TITLE_CONTENT_RULES = [
              { pattern: /\b(fix|bug|crash|error|broken)\b/i,    labels: ["bug"] },
              { pattern: /\b(feat|add|implement|new)\b/i,        labels: ["enhancement"] },
              { pattern: /\b(docs?|documentation)\b/i,           labels: ["documentation"] },
              { pattern: /\b(perf|optimize|speed|latency)\b/i,   labels: ["performance"] },
              { pattern: /\b(refactor|cleanup)\b/i,              labels: ["refactor"] },
              { pattern: /\b(test(s|ing)?)\b/i,                  labels: ["test"] },
              { pattern: /\b(chore|bump|update|dep)\b/i,         labels: ["chore"] },
              { pattern: /\b(breaking|break)\b/i,                labels: ["breaking-change"] },
              { pattern: /\b(security|vuln|CVE)\b/i,             labels: ["security", "priority:critical"] },
              { pattern: /^(fix|chore|feat|docs|test|refactor|perf|ci|style|build)(\(.+\))?:/i,
                labels: [] },  // Conventional commit prefix — no label
            ];

            for (const rule of TITLE_CONTENT_RULES) {
              if (rule.pattern.test(title)) {
                rule.labels.forEach(l => newLabels.add(l));
              }
            }

            // ── Large PR warning ────────────────────────────────────────
            if (totalLines > 1000) {
              console.log(`  ⚠️ Large PR detected: ${totalLines} lines`);
            }

            // ── Apply labels ─────────────────────────────────────────────
            const labelsToApply = [...newLabels].filter(l => !existingLabels.includes(l));

            if (labelsToApply.length > 0 || toRemove.length > 0) {
              if (!DRY_RUN) {
                if (labelsToApply.length) {
                  await github.rest.issues.addLabels({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    issue_number: prNum,
                    labels:      labelsToApply,
                  }).catch(e => core.warning(`addLabels: ${e.message}`));
                }
                for (const label of toRemove) {
                  await github.rest.issues.removeLabel({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    issue_number: prNum,
                    name:        label,
                  }).catch(() => {});
                }
              }
              console.log(`  ✅ Applied: [${labelsToApply.join(", ")}]`);
              if (toRemove.length) console.log(`  🗑️ Removed: [${toRemove.join(", ")}]`);
            } else {
              console.log(`  ⏭️ No label changes needed`);
            }

            // ── Post helpful PR comment for large PRs ────────────────────
            if (totalLines > 1000 && !DRY_RUN && context.payload.action === "opened") {
              await github.rest.issues.createComment({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                issue_number: prNum,
                body: [
                  `## 📐 Large PR Notice`,
                  ``,
                  `This PR modifies **${totalLines} lines** across **${changedFiles} files**.`,
                  ``,
                  `To speed up the review process, consider:`,
                  `- 🔪 Breaking it into smaller, focused PRs`,
                  `- 📝 Adding a detailed description of changes`,
                  `- 🧪 Ensuring tests cover the major changes`,
                  `- 📸 Including before/after screenshots for visual changes`,
                  ``,
                  `*🤖 ASH v5.0 OMEGA auto-labeler*`,
                ].join("\n"),
              }).catch(() => {});
            }

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4 — Triage automation (first response)
  # ───────────────────────────────────────────────────────────────────────────
  triage-response:
    name: "👋 Triage · First Response"
    needs: [label-issues, label-prs]
    if: |
      always() &&
      github.event_name == 'issues' &&
      github.event.action == 'opened'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "👋 Post intelligent triage response"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue  = context.payload.issue;
            if (!issue) return;

            const num    = issue.number;
            const title  = issue.title || "";
            const body   = issue.body  || "";
            const author = issue.user?.login || "";
            const labels = (issue.labels || []).map(l => l.name);

            // ── First-time contributor check ────────────────────────────
            const searchResult = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} author:${author}`,
            }).catch(() => ({ data: { total_count: 0 } }));

            const isFirst = searchResult.data.total_count <= 1;

            // ── Detect issue type ───────────────────────────────────────
            const isBug      = labels.some(l => l === "bug") || /bug|crash|error/i.test(title);
            const isSecurity = labels.some(l => l === "security");
            const isQuestion = labels.some(l => l === "question");
            const isFeature  = labels.some(l => l === "feature-request");
            const isThemeSub = labels.some(l => l === "theme-submission");
            const isPluginSub= labels.some(l => l === "plugin-submission");
            const isCritical = labels.some(l => l === "priority:critical");

            // ── Build contextual response ───────────────────────────────
            const welcomePart = isFirst ? [
              `## 🎉 Welcome to ASH Dotfiles!`,
              ``,
              `Thanks for opening your first issue, @${author}! 🙏`,
              `We're excited to have you here.`,
              ``,
            ] : [
              `## 👋 Thanks for the report, @${author}!`,
              ``,
            ];

            let specificPart = [];

            if (isSecurity || isCritical) {
              specificPart = [
                `> ⚠️ **Security/Critical Issue Detected**`,
                `> `,
                `> This has been flagged as a high-priority issue.`,
                `> A maintainer will review this as soon as possible.`,
                ``,
                `If this is a **security vulnerability**, please also consider:`,
                `- Reporting via [GitHub Security Advisories](../../security/advisories/new)`,
                `- Sending an email to the security contact listed in [SECURITY.md](../../blob/main/SECURITY.md)`,
                ``,
              ];
            } else if (isBug) {
              specificPart = [
                `We've automatically classified this as a **bug report** 🐛`,
                ``,
                `### Checklist for faster resolution:`,
                `- [ ] ✅ ASH version: \`ash --version\``,
                `- [ ] 🐧 Linux distro & version`,
                `- [ ] 🖥️ Hyprland version: \`hyprctl version\``,
                `- [ ] 🐚 Shell: \`echo $SHELL\``,
                `- [ ] 🎮 GPU: \`lspci | grep -i vga\``,
                `- [ ] 📋 Relevant error logs`,
                `- [ ] 🔄 Steps to reproduce`,
                ``,
              ];
            } else if (isFeature) {
              specificPart = [
                `Thanks for the **feature request** ✨`,
                ``,
                `To help us evaluate this:`,
                `- **Use case:** What problem does this solve?`,
                `- **Alternatives:** Have you considered other approaches?`,
                `- **Implementation:** Any ideas on how to implement this?`,
                ``,
              ];
            } else if (isQuestion) {
              specificPart = [
                `Got a question? We're happy to help! 💬`,
                ``,
                `While you wait, check out:`,
                `- 📖 [Documentation](../../blob/main/docs/README.md)`,
                `- 🔍 [FAQ](../../blob/main/docs/getting-started/faq.md)`,
                `- 💬 [Discussions](../../discussions)`,
                ``,
              ];
            } else if (isThemeSub) {
              specificPart = [
                `🎨 Thank you for submitting a **theme**!`,
                ``,
                `Our team will review your theme for:`,
                `- 🎨 Color harmony & accessibility (WCAG contrast)`,
                `- 📋 Complete metadata & documentation`,
                `- 🖼️ Preview screenshots`,
                `- ⚡ Performance impact`,
                ``,
              ];
            } else if (isPluginSub) {
              specificPart = [
                `🔌 Thank you for submitting a **plugin**!`,
                ``,
                `Our review process checks:`,
                `- 📋 Plugin manifest completeness`,
                `- 🔒 Security & permissions audit`,
                `- 📖 Documentation quality`,
                `- 🧪 Test coverage`,
                ``,
              ];
            }

            const footerPart = [
              `### 🔗 Useful Links`,
              ``,
              `| Resource | Link |`,
              `|----------|------|`,
              `| 📖 Docs | [Documentation](../../blob/main/docs/README.md) |`,
              `| 💬 Discord | [Join our server](https://discord.gg/ash-dotfiles) |`,
              `| 🐛 Doctor | \`ash doctor\` — diagnose issues |`,
              `| 📋 Logs | \`ash --log-level=debug ...\` |`,
              ``,
              `A maintainer will review this issue as soon as possible.`,
              ``,
              `---`,
              `*🤖 ASH v5.0 OMEGA triage bot*`,
            ];

            const commentBody = [
              ...welcomePart,
              ...specificPart,
              ...footerPart,
            ].join("\n");

            await github.rest.issues.createComment({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              issue_number: num,
              body:        commentBody,
            }).catch(e => core.warning(`Triage comment failed: ${e.message}`));

            console.log(`  ✅ Triage response posted to #${num}`);

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 5 — PR path-based labeling using labeler action
  # ───────────────────────────────────────────────────────────────────────────
  labeler-action:
    name: "🗂️ Path Labeler · File Rules"
    needs: bootstrap-labels
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🗂️ Create labeler configuration"
        run: |
          mkdir -p .github
          cat > /tmp/labeler-config.yml << 'LABELER_EOF'
          # ASH Dotfiles v5.0 — Path-based Label Rules
          # ────────────────────────────────────────────

          "component:theme":
            - changed-files:
              - any-glob-to-any-file:
                - "themes/**"
                - "config/gtk*/**"
                - "config/Kvantum/**"
                - "**/*.template"

          "component:hyprland":
            - changed-files:
              - any-glob-to-any-file:
                - "config/hypr/**"

          "component:waybar":
            - changed-files:
              - any-glob-to-any-file:
                - "config/waybar/**"

          "component:rofi":
            - changed-files:
              - any-glob-to-any-file:
                - "config/rofi/**"

          "component:neovim":
            - changed-files:
              - any-glob-to-any-file:
                - "config/nvim/**"
                - "**/*.lua"

          "component:shell":
            - changed-files:
              - any-glob-to-any-file:
                - "config/fish/**"
                - "config/starship/**"
                - "**/*.fish"
                - "**/*.sh"

          "component:plugin":
            - changed-files:
              - any-glob-to-any-file:
                - "plugins/**"

          "component:api":
            - changed-files:
              - any-glob-to-any-file:
                - "api/**"

          "component:web":
            - changed-files:
              - any-glob-to-any-file:
                - "web/**"
                - "browser-extension/**"

          "component:mobile":
            - changed-files:
              - any-glob-to-any-file:
                - "mobile/**"

          "component:cli":
            - changed-files:
              - any-glob-to-any-file:
                - "ash-cli/**"
                - "scripts/**"

          "component:assets":
            - changed-files:
              - any-glob-to-any-file:
                - "assets/**"
                - "wallpapers/**"
                - "**/*.png"
                - "**/*.jpg"
                - "**/*.svg"
                - "**/*.webp"

          "documentation":
            - changed-files:
              - any-glob-to-any-file:
                - "docs/**"
                - "*.md"
                - ".github/ISSUE_TEMPLATE/**"
                - ".github/PULL_REQUEST_TEMPLATE/**"

          "ci-cd":
            - changed-files:
              - any-glob-to-any-file:
                - ".github/**"
                - "docker/**"
                - "nix/**"
                - "packaging/**"
                - "Makefile"
                - "Justfile"
                - "Taskfile.yml"

          "distro:nixos":
            - changed-files:
              - any-glob-to-any-file:
                - "nix/**"
                - "**/*.nix"
                - "**/flake.lock"

          "distro:arch":
            - changed-files:
              - any-glob-to-any-file:
                - "packaging/aur/**"
                - "**/PKGBUILD"

          "test":
            - changed-files:
              - any-glob-to-any-file:
                - "tests/**"
                - "**/*.test.*"
                - "**/*.spec.*"

          "performance":
            - changed-files:
              - any-glob-to-any-file:
                - "benchmarks/**"
                - ".github/workflows/performance/**"
          LABELER_EOF
          echo "  ✅ Labeler config created"

      - name: "🗂️ Apply path-based labels"
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: /tmp/labeler-config.yml
          sync-labels: false
          dot: true
        continue-on-error: true

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 6 — Generate labeling report
  # ───────────────────────────────────────────────────────────────────────────
  report:
    name: "📊 Report · Labeling Summary"
    needs: [label-issues, label-prs, triage-response]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "📊 Generate labeling summary"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Fetch label statistics
            const labels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner:    context.repo.owner,
              repo:     context.repo.repo,
              per_page: 100,
            });

            const labelStats = labels
              .sort((a, b) => b.issues_count - a.issues_count)
              .slice(0, 30);

            const tableRows = labelStats.map(l =>
              `| \`${l.name}\` | ${l.issues_count} | \`#${l.color}\` |`
            ).join("\n");

            const summary = [
              `# 🏷️ ASH Auto-Label Report`,
              ``,
              `> Mode: \`${process.env.LABEL_MODE}\`  ·  Dry Run: \`${process.env.DRY_RUN}\``,
              ``,
              `## 📊 Label Usage Statistics (Top 30)`,
              ``,
              `| Label | Open Issues | Color |`,
              `|-------|-------------|-------|`,
              tableRows,
              ``,
              `---`,
              `*Generated by ASH v5.0 OMEGA Auto-Label Engine*`,
            ].join("\n");

            const summaryFile = process.env.GITHUB_STEP_SUMMARY;
            require("fs").writeFileSync(summaryFile, summary);
            console.log(`  ✅ Report written (${labels.length} labels)`);