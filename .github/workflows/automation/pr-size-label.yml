name: "📐 PR Size · Ultra Classification Engine"

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

  issue_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to classify (0 = all open)"
        required: false
        default: "0"
        type: string
      dry_run:
        description: "Preview classification without labels"
        required: false
        default: false
        type: boolean
      override_size:
        description: "Force size override (empty = auto)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "size:XS"
          - "size:S"
          - "size:M"
          - "size:L"
          - "size:XL"
          - "size:XXL"
      scoring_mode:
        description: "Scoring algorithm"
        required: false
        default: "composite"
        type: choice
        options:
          - composite    # Weighted multi-dimensional
          - lines-only   # Simple line count
          - files-only   # File count only
          - semantic     # Semantic complexity

# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: "pr-size-${{ github.event.pull_request.number || github.event.issue.number || 'batch' }}"
  cancel-in-progress: true

permissions:
  pull-requests: write
  issues: write
  contents: read
  checks: write
  statuses: write

# ─────────────────────────────────────────────────────────────────────────────
env:
  SIZER_VERSION: "5.0.0"
  DRY_RUN: "${{ github.event.inputs.dry_run || 'false' }}"
  SCORING_MODE: "${{ github.event.inputs.scoring_mode || 'composite' }}"
  OVERRIDE_SIZE: "${{ github.event.inputs.override_size || '' }}"

  # ── Size tier thresholds (composite score) ────────────────────────────────
  THRESHOLD_XS:  "10"
  THRESHOLD_S:   "50"
  THRESHOLD_M:   "250"
  THRESHOLD_L:   "1000"
  THRESHOLD_XL:  "3000"

  # ── Scoring weights (must sum to 1.0) ─────────────────────────────────────
  WEIGHT_LINES:      "0.35"
  WEIGHT_FILES:      "0.20"
  WEIGHT_SEMANTIC:   "0.15"
  WEIGHT_COMPONENTS: "0.10"
  WEIGHT_CHURN:      "0.10"
  WEIGHT_DEPTH:      "0.10"

  # ── File type complexity multipliers ─────────────────────────────────────
  COMPLEXITY_SH:    "1.5"
  COMPLEXITY_LUA:   "1.4"
  COMPLEXITY_PY:    "1.3"
  COMPLEXITY_TS:    "1.3"
  COMPLEXITY_CONF:  "0.8"
  COMPLEXITY_MD:    "0.5"
  COMPLEXITY_JSON:  "0.6"
  COMPLEXITY_CSS:   "0.7"
  COMPLEXITY_IMG:   "0.1"

  # ── Limits ────────────────────────────────────────────────────────────────
  XXL_BLOCK_MERGE: "true"
  XL_WARN: "true"
  MAX_FILES_WITHOUT_WARNING: "30"

# ═════════════════════════════════════════════════════════════════════════════
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Pre-flight & command detection
  # ───────────────────────────────────────────────────────────────────────────
  preflight:
    name: "🔍 Preflight · Classify Trigger"
    runs-on: ubuntu-24.04
    outputs:
      pr_number:     ${{ steps.resolve.outputs.pr_number }}
      should_run:    ${{ steps.gate.outputs.should_run }}
      is_override:   ${{ steps.override.outputs.is_override }}
      override_size: ${{ steps.override.outputs.size }}
      session_id:    ${{ steps.session.outputs.id }}

    steps:
      - name: "🆔 Session"
        id: session
        run: |
          echo "id=size-$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: "🔍 Resolve PR number"
        id: resolve
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let prNum = 0;

            if (context.payload.pull_request?.number) {
              prNum = context.payload.pull_request.number;
            } else if (context.payload.issue?.pull_request) {
              prNum = context.payload.issue.number;
            } else if ("${{ github.event.inputs.pr_number }}" !== "0") {
              prNum = parseInt("${{ github.event.inputs.pr_number }}");
            }

            core.setOutput("pr_number", String(prNum));
            console.log(`  📋 PR #${prNum}`);

      - name: "⚡ Detect size override command"
        id: override
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body   = context.payload.comment?.body?.trim() || "";
            const sender = context.payload.comment?.user?.login || "";

            // Check maintainer permission
            const perm = await github.rest.repos.getCollaboratorPermissionLevel({
              owner:    context.repo.owner,
              repo:     context.repo.repo,
              username: sender,
            }).catch(() => ({ data: { permission: "none" } }));

            const canOverride = ["admin","maintain","write"].includes(perm.data.permission);
            if (!canOverride) {
              core.setOutput("is_override", "false");
              return;
            }

            const SIZES = ["size:XS","size:S","size:M","size:L","size:XL","size:XXL"];
            const match  = body.match(/\/size\s+(size:(?:XS|S|M|L|XL|XXL))/i);
            const splitCmd = body.toLowerCase().startsWith("/size split");
            const rerunCmd = body.toLowerCase().startsWith("/size rerun");
            const bypassCmd = body.toLowerCase().startsWith("/size bypass-xxl");

            if (match) {
              core.setOutput("is_override", "true");
              core.setOutput("size", match[1].toLowerCase().replace("size:","size:"));
              console.log(`  ⚡ Size override: ${match[1]} by @${sender}`);
            } else if (splitCmd || rerunCmd || bypassCmd) {
              core.setOutput("is_override", "true");
              core.setOutput("size", splitCmd ? "split" : rerunCmd ? "rerun" : "bypass");
            } else {
              core.setOutput("is_override", "false");
              core.setOutput("size", "");
            }

      - name: "🚦 Gate"
        id: gate
        run: |
          PR="${{ steps.resolve.outputs.pr_number }}"
          EVENT="${{ github.event_name }}"

          SHOULD="false"
          [[ "${PR}" != "0" && "${PR}" != "" ]] && SHOULD="true"
          [[ "${EVENT}" == "workflow_dispatch" ]] && SHOULD="true"

          # Comment events: only if override detected
          if [[ "${EVENT}" == "issue_comment" ]]; then
            SHOULD="${{ steps.override.outputs.is_override || 'false' }}"
          fi

          echo "should_run=${SHOULD}" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Comprehensive size analysis
  # ───────────────────────────────────────────────────────────────────────────
  analyze-size:
    name: "📊 Analyze · Multi-Dimensional Size Scoring"
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      size_label:      ${{ steps.classify.outputs.size_label }}
      composite_score: ${{ steps.classify.outputs.composite_score }}
      total_lines:     ${{ steps.classify.outputs.total_lines }}
      file_count:      ${{ steps.classify.outputs.file_count }}
      review_hours:    ${{ steps.classify.outputs.review_hours }}
      complexity_tier: ${{ steps.classify.outputs.complexity_tier }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "📦 Install analysis tools"
        run: |
          pip3 install --quiet --user \
            matplotlib==3.9.2 \
            numpy==2.1.2 \
            rich==13.9.2 \
            2>/dev/null || true
          sudo apt-get install -y --no-install-recommends \
            jq bc cloc 2>/dev/null || true

      - name: "🔍 Collect PR diff metrics"
        id: metrics
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNum = parseInt("${{ needs.preflight.outputs.pr_number }}");
            if (!prNum) { core.warning("No PR number"); return; }

            // Fetch PR details
            const pr = await github.rest.pulls.get({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              pull_number: prNum,
            });

            const data = pr.data;

            // Fetch all changed files
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              pull_number: prNum,
              per_page:    100,
            });

            // ── Compute raw metrics ─────────────────────────────────────
            const additions  = data.additions  || 0;
            const deletions  = data.deletions  || 0;
            const totalLines = additions + deletions;
            const fileCount  = data.changed_files || 0;
            const isDraft    = data.draft || false;
            const author     = data.user?.login || "";

            // ── Churn analysis ──────────────────────────────────────────
            const newFiles     = files.filter(f => f.status === "added").length;
            const modFiles     = files.filter(f => f.status === "modified").length;
            const delFiles     = files.filter(f => f.status === "removed").length;
            const renamedFiles = files.filter(f => f.status === "renamed").length;
            const churnRate    = fileCount > 0 ? (modFiles + delFiles) / fileCount : 0;

            // ── Directory analysis ──────────────────────────────────────
            const dirPaths = new Set(
              files.map(f => f.filename.split("/").slice(0, -1).join("/") || "root")
            );
            const uniqueDirs   = dirPaths.size;
            const maxDepth     = Math.max(...files.map(f =>
              f.filename.split("/").length - 1
            ), 0);
            const topLevelDirs = new Set(
              files.map(f => f.filename.split("/")[0])
            );

            // ── Component detection ─────────────────────────────────────
            const COMPONENT_PATTERNS = {
              "theme":    /^(themes|config\/gtk|config\/Kvantum)\//,
              "hyprland": /^config\/hypr\//,
              "waybar":   /^config\/waybar\//,
              "neovim":   /^config\/nvim\//,
              "shell":    /^config\/fish\//,
              "plugin":   /^plugins\//,
              "api":      /^api\//,
              "web":      /^web\//,
              "mobile":   /^mobile\//,
              "cli":      /^ash-cli\//,
              "docs":     /^docs?\//,
              "ci":       /^\.github\//,
              "scripts":  /^scripts\//,
              "assets":   /^(assets|wallpapers)\//,
              "nix":      /^nix\//,
              "tests":    /^tests?\//,
            };

            const touchedComponents = new Set();
            for (const file of files) {
              for (const [comp, pattern] of Object.entries(COMPONENT_PATTERNS)) {
                if (pattern.test(file.filename)) {
                  touchedComponents.add(comp);
                }
              }
            }

            // ── File type breakdown ─────────────────────────────────────
            const typeBreakdown = {};
            const COMPLEXITY_MAP = {
              sh:   1.5, fish: 1.5, bash: 1.5,
              lua:  1.4, py:   1.3, ts:   1.3,
              js:   1.2, rs:   1.4, go:   1.3,
              cpp:  1.4, c:    1.4, java: 1.3,
              conf: 0.8, ini:  0.8, toml: 0.9,
              json: 0.6, yaml: 0.7, yml:  0.7,
              md:   0.5, txt:  0.4, rst:  0.5,
              css:  0.7, scss: 0.8,
              png:  0.1, jpg:  0.1, svg:  0.3,
              gif:  0.1, webp: 0.1, ico:  0.1,
              nix:  1.3, kdl:  0.9, rasi: 0.9,
            };

            let weightedLines = 0;
            for (const file of files) {
              const ext = file.filename.split(".").pop()?.toLowerCase() || "other";
              if (!typeBreakdown[ext]) typeBreakdown[ext] = { files: 0, lines: 0 };
              typeBreakdown[ext].files++;
              typeBreakdown[ext].lines += (file.additions || 0) + (file.deletions || 0);
              const multiplier = COMPLEXITY_MAP[ext] || 1.0;
              weightedLines += ((file.additions || 0) + (file.deletions || 0)) * multiplier;
            }

            // ── Test coverage signal ────────────────────────────────────
            const testFiles = files.filter(f =>
              /test|spec|__tests__|\.test\.|\.spec\./.test(f.filename)
            ).length;
            const testRatio = fileCount > 0 ? testFiles / fileCount : 0;

            // Collect all metrics
            const metricsObj = {
              pr_number:   prNum,
              title:       data.title,
              author,
              is_draft:    isDraft,
              additions,
              deletions,
              total_lines: totalLines,
              file_count:  fileCount,
              new_files:      newFiles,
              modified_files: modFiles,
              deleted_files:  delFiles,
              renamed_files:  renamedFiles,
              churn_rate:     Math.round(churnRate * 100) / 100,
              unique_dirs:    uniqueDirs,
              max_depth:      maxDepth,
              top_level_dirs: [...topLevelDirs],
              touched_components: [...touchedComponents],
              component_count: touchedComponents.size,
              weighted_lines: Math.round(weightedLines),
              test_files:   testFiles,
              test_ratio:   Math.round(testRatio * 100) / 100,
              type_breakdown: typeBreakdown,
              pr_age_hours: Math.floor(
                (Date.now() - new Date(data.created_at)) / 3600000
              ),
              commits: data.commits || 0,
            };

            require("fs").mkdirSync(process.env.GITHUB_WORKSPACE + "/.size-engine", { recursive: true });
            require("fs").writeFileSync(
              process.env.GITHUB_WORKSPACE + "/.size-engine/metrics.json",
              JSON.stringify(metricsObj, null, 2)
            );

            // Set outputs
            for (const [key, value] of Object.entries(metricsObj)) {
              if (typeof value === "number" || typeof value === "string" || typeof value === "boolean") {
                core.setOutput(key, String(value));
              }
            }

            console.log("\n  📊 PR Metrics:");
            console.log(`     Total lines:    ${totalLines}`);
            console.log(`     Files:          ${fileCount}`);
            console.log(`     Weighted lines: ${Math.round(weightedLines)}`);
            console.log(`     Components:     ${touchedComponents.size} [${[...touchedComponents].join(", ")}]`);
            console.log(`     Churn rate:     ${Math.round(churnRate * 100)}%`);
            console.log(`     Test ratio:     ${Math.round(testRatio * 100)}%`);
            console.log(`     Unique dirs:    ${uniqueDirs}`);

      - name: "🧮 Compute composite size score"
        id: classify
        run: |
          METRICS_FILE="${GITHUB_WORKSPACE}/.size-engine/metrics.json"
          [[ -f "${METRICS_FILE}" ]] || echo '{"total_lines":0,"file_count":0}' > "${METRICS_FILE}"

          python3 << 'PYTHON_EOF'
          import json
          import math
          import os
          from pathlib import Path

          WORK_DIR = Path(os.environ["GITHUB_WORKSPACE"]) / ".size-engine"
          WORK_DIR.mkdir(parents=True, exist_ok=True)

          with open(WORK_DIR / "metrics.json") as f:
              m = json.load(f)

          # ── Raw inputs ─────────────────────────────────────────────────
          total_lines  = m.get("total_lines", 0)
          file_count   = m.get("file_count", 0)
          weighted     = m.get("weighted_lines", total_lines)
          components   = m.get("component_count", 1)
          churn_rate   = m.get("churn_rate", 0.5)
          unique_dirs  = m.get("unique_dirs", 1)
          max_depth    = m.get("max_depth", 1)
          test_ratio   = m.get("test_ratio", 0)
          is_draft     = m.get("is_draft", False)

          # ── Scoring mode ────────────────────────────────────────────────
          SCORING_MODE = os.environ.get("SCORING_MODE", "composite")

          # ── Threshold definitions ───────────────────────────────────────
          THRESHOLDS = {
              "size:XS":  float(os.environ.get("THRESHOLD_XS",  "10")),
              "size:S":   float(os.environ.get("THRESHOLD_S",   "50")),
              "size:M":   float(os.environ.get("THRESHOLD_M",   "250")),
              "size:L":   float(os.environ.get("THRESHOLD_L",   "1000")),
              "size:XL":  float(os.environ.get("THRESHOLD_XL",  "3000")),
              "size:XXL": float("inf"),
          }

          # ── Dimension scores (each normalized to ~0-100 scale) ──────────
          def score_lines(n):
              """Log scale: 0=0, 10=20, 100=60, 1000=100"""
              if n <= 0: return 0
              return min(100, math.log10(n + 1) * 40)

          def score_files(n):
              if n <= 0: return 0
              return min(100, math.log10(n + 1) * 50)

          def score_semantic(weighted_lines):
              return score_lines(weighted_lines)

          def score_components(n):
              return min(100, n * 12)

          def score_churn(rate):
              return rate * 100

          def score_depth(dirs, depth):
              dir_score  = min(100, dirs * 8)
              depth_score = min(100, depth * 10)
              return (dir_score + depth_score) / 2

          # ── Compute dimensional scores ──────────────────────────────────
          dim_lines      = score_lines(total_lines)
          dim_files      = score_files(file_count)
          dim_semantic   = score_semantic(weighted)
          dim_components = score_components(components)
          dim_churn      = score_churn(churn_rate)
          dim_depth      = score_depth(unique_dirs, max_depth)

          # ── Apply weights ────────────────────────────────────────────────
          W_LINES  = float(os.environ.get("WEIGHT_LINES",      "0.35"))
          W_FILES  = float(os.environ.get("WEIGHT_FILES",      "0.20"))
          W_SEM    = float(os.environ.get("WEIGHT_SEMANTIC",   "0.15"))
          W_COMP   = float(os.environ.get("WEIGHT_COMPONENTS", "0.10"))
          W_CHURN  = float(os.environ.get("WEIGHT_CHURN",      "0.10"))
          W_DEPTH  = float(os.environ.get("WEIGHT_DEPTH",      "0.10"))

          if SCORING_MODE == "lines-only":
              composite = dim_lines
          elif SCORING_MODE == "files-only":
              composite = dim_files
          elif SCORING_MODE == "semantic":
              composite = dim_semantic
          else:
              # Full composite
              composite = (
                  dim_lines      * W_LINES  +
                  dim_files      * W_FILES  +
                  dim_semantic   * W_SEM    +
                  dim_components * W_COMP   +
                  dim_churn      * W_CHURN  +
                  dim_depth      * W_DEPTH
              )

          # ── Test coverage bonus (reduces effective size) ─────────────────
          # Good test coverage suggests more reviewable code
          if test_ratio > 0.3:
              composite *= 0.90   # -10% for well-tested PRs
          elif test_ratio > 0.1:
              composite *= 0.95   # -5% for some tests

          composite = round(composite, 2)

          # ── Map composite score → size tier ─────────────────────────────
          # Percentile-based thresholds (composite score 0-100)
          SIZE_SCORE_THRESHOLDS = [
              (15,  "size:XS"),
              (30,  "size:S"),
              (50,  "size:M"),
              (72,  "size:L"),
              (88,  "size:XL"),
              (101, "size:XXL"),
          ]

          # Also check raw line thresholds as hard floor
          RAW_LINE_OVERRIDES = [
              (10,   "size:XS"),
              (50,   "size:S"),
              (250,  "size:M"),
              (1000, "size:L"),
              (3000, "size:XL"),
          ]

          # Determine from composite score
          size_label = "size:XXL"
          for threshold, label in SIZE_SCORE_THRESHOLDS:
              if composite < threshold:
                  size_label = label
                  break

          # Raw line count override (can only increase, never decrease tier)
          raw_size = "size:XXL"
          for threshold, label in RAW_LINE_OVERRIDES:
              if total_lines < threshold:
                  raw_size = label
                  break

          SIZE_ORDER = ["size:XS","size:S","size:M","size:L","size:XL","size:XXL"]
          composite_idx = SIZE_ORDER.index(size_label)
          raw_idx       = SIZE_ORDER.index(raw_size)
          # Take the larger of composite or raw classification
          final_label   = SIZE_ORDER[max(composite_idx, raw_idx)]

          # ── Complexity tier ─────────────────────────────────────────────
          complexity_tier = (
              "trivial"  if composite < 20  else
              "simple"   if composite < 40  else
              "moderate" if composite < 60  else
              "complex"  if composite < 80  else
              "very-complex"
          )

          # ── Review effort estimate ───────────────────────────────────────
          # Based on complexity, ~200 meaningful lines per hour for complex code
          REVIEW_RATES = {
              "trivial":      500,
              "simple":       300,
              "moderate":     200,
              "complex":      120,
              "very-complex":  80,
          }
          rate           = REVIEW_RATES[complexity_tier]
          effective_lines = weighted if weighted > 0 else total_lines
          review_hours   = round(effective_lines / rate, 1)
          review_hours   = max(0.25, min(review_hours, 40))

          # ── Dimensions breakdown ─────────────────────────────────────────
          dimensions = {
              "lines":      round(dim_lines, 2),
              "files":      round(dim_files, 2),
              "semantic":   round(dim_semantic, 2),
              "components": round(dim_components, 2),
              "churn":      round(dim_churn, 2),
              "depth":      round(dim_depth, 2),
          }

          # ── Write results ────────────────────────────────────────────────
          results = {
              "size_label":      final_label,
              "composite_score": composite,
              "complexity_tier": complexity_tier,
              "review_hours":    review_hours,
              "dimensions":      dimensions,
              "scoring_mode":    SCORING_MODE,
              "total_lines":     total_lines,
              "file_count":      file_count,
          }

          with open(WORK_DIR / "classification.json", "w") as f:
              json.dump(results, f, indent=2)

          # GitHub Outputs
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"size_label={final_label}\n")
              out.write(f"composite_score={composite}\n")
              out.write(f"complexity_tier={complexity_tier}\n")
              out.write(f"review_hours={review_hours}\n")
              out.write(f"total_lines={total_lines}\n")
              out.write(f"file_count={file_count}\n")

          print(f"\n  ═{'═'*50}")
          print(f"  📐 SIZE CLASSIFICATION RESULT")
          print(f"  ═{'═'*50}")
          print(f"  Mode:            {SCORING_MODE}")
          print(f"  Composite score: {composite:.2f} / 100")
          print(f"  Size label:      {final_label}")
          print(f"  Complexity:      {complexity_tier}")
          print(f"  Review effort:   ~{review_hours}h")
          print(f"  ─{'─'*50}")
          print(f"  Dim scores:")
          for k, v in dimensions.items():
              bar_len = int(v / 5)
              bar     = "█" * bar_len + "░" * (20 - bar_len)
              print(f"    {k:14s} [{bar}] {v:.1f}")
          print(f"  ═{'═'*50}")
          PYTHON_EOF

      - name: "🏷️ Apply size labels"
        id: apply_labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNum      = parseInt("${{ needs.preflight.outputs.pr_number }}");
            const DRY_RUN    = process.env.DRY_RUN === "true";
            const OVERRIDE   = process.env.OVERRIDE_SIZE || "${{ needs.preflight.outputs.override_size }}";

            let finalSize = "${{ steps.classify.outputs.size_label }}";
            if (OVERRIDE && OVERRIDE.startsWith("size:")) {
              finalSize = OVERRIDE;
              console.log(`  ⚡ Override applied: ${finalSize}`);
            }

            const ALL_SIZE_LABELS = ["size:XS","size:S","size:M","size:L","size:XL","size:XXL"];

            // Ensure all size labels exist with correct colors
            const LABEL_CONFIG = {
              "size:XS":  { color: "3cbf00", desc: "📐 XS: <10 net lines — Trivial" },
              "size:S":   { color: "5d9801", desc: "📐 S:  <50 net lines — Small" },
              "size:M":   { color: "7f7203", desc: "📐 M:  <250 net lines — Medium" },
              "size:L":   { color: "b45a04", desc: "📐 L:  <1000 net lines — Large" },
              "size:XL":  { color: "c73205", desc: "📐 XL: <3000 net lines — X-Large" },
              "size:XXL": { color: "ee0701", desc: "📐 XXL: 3000+ net lines — Mega" },
            };

            for (const [name, cfg] of Object.entries(LABEL_CONFIG)) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                name,
                color: cfg.color,
                description: cfg.desc,
              }).catch(() => {});
            }

            if (DRY_RUN) {
              console.log(`  [DRY] Would apply: ${finalSize}`);
              core.setOutput("applied_label", finalSize);
              return;
            }

            // Get existing labels on PR
            const prData = await github.rest.issues.get({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              issue_number: prNum,
            });
            const existingLabels = (prData.data.labels || []).map(l => l.name);

            // Remove all existing size labels
            for (const label of ALL_SIZE_LABELS) {
              if (existingLabels.includes(label) && label !== finalSize) {
                await github.rest.issues.removeLabel({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  issue_number: prNum,
                  name:        label,
                }).catch(() => {});
              }
            }

            // Add new size label
            if (!existingLabels.includes(finalSize)) {
              await github.rest.issues.addLabels({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                issue_number: prNum,
                labels:      [finalSize],
              });
            }

            console.log(`  ✅ Applied: ${finalSize}`);
            core.setOutput("applied_label", finalSize);

      - name: "💬 Post rich analysis comment"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const prNum = parseInt("${{ needs.preflight.outputs.pr_number }}");
            if (!prNum) return;

            const DRY_RUN = process.env.DRY_RUN === "true";

            // Load data
            const WORK_DIR = `${process.env.GITHUB_WORKSPACE}/.size-engine`;
            let metrics = {}, classification = {};
            try {
              metrics        = JSON.parse(fs.readFileSync(`${WORK_DIR}/metrics.json`,"utf8"));
              classification = JSON.parse(fs.readFileSync(`${WORK_DIR}/classification.json`,"utf8"));
            } catch(e) {
              core.warning("Could not load analysis files");
              return;
            }

            const {
              size_label, composite_score, complexity_tier,
              review_hours, dimensions, total_lines, file_count,
            } = classification;

            const {
              additions, deletions, new_files, modified_files,
              deleted_files, renamed_files, churn_rate,
              touched_components, component_count,
              type_breakdown, commits, test_ratio, unique_dirs, max_depth,
            } = metrics;

            // ── Size tier metadata ─────────────────────────────────────
            const TIER_META = {
              "size:XS":  { emoji: "🟢", name: "Trivial",    color: "3cbf00", advice: "Excellent! Quick review." },
              "size:S":   { emoji: "🟢", name: "Small",      color: "5d9801", advice: "Focused & reviewable. 👍" },
              "size:M":   { emoji: "🟡", name: "Medium",     color: "7f7203", advice: "Reasonable scope. Consider breaking if complex." },
              "size:L":   { emoji: "🟠", name: "Large",      color: "b45a04", advice: "⚠️ Consider splitting into focused PRs." },
              "size:XL":  { emoji: "🔴", name: "X-Large",    color: "c73205", advice: "🚨 Strongly recommend splitting this PR." },
              "size:XXL": { emoji: "🚨", name: "Mega",       color: "ee0701", advice: "❌ PR is too large. Please split before merging." },
            };
            const tier = TIER_META[size_label] || TIER_META["size:M"];

            // ── ASCII bar chart ────────────────────────────────────────
            function bar(value, max, width = 20) {
              const filled = Math.round((value / max) * width);
              const pct    = Math.round((value / max) * 100);
              return `[${"█".repeat(filled)}${"░".repeat(width - filled)}] ${pct}%`;
            }

            const maxDim = 100;
            const dimsChart = Object.entries(dimensions).map(([k, v]) =>
              `  ${k.padEnd(12)} ${bar(v, maxDim, 18)} ${v.toFixed(1)}`
            ).join("\n");

            // ── File type table ────────────────────────────────────────
            const typeTable = Object.entries(type_breakdown || {})
              .sort(([,a],[,b]) => b.lines - a.lines)
              .slice(0, 8)
              .map(([ext, data]) =>
                `| \`${ext.padEnd(8)}\` | ${data.files} | ${data.lines} |`
              ).join("\n");

            // ── Review effort estimate ─────────────────────────────────
            const effortEmoji = review_hours <= 0.5 ? "⚡"
                             : review_hours <= 1   ? "🟢"
                             : review_hours <= 3   ? "🟡"
                             : review_hours <= 8   ? "🟠"
                             : "🔴";

            // ── Complexity badge ────────────────────────────────────────
            const complexityEmoji = {
              trivial:      "⚪",
              simple:       "🟢",
              moderate:     "🟡",
              complex:      "🟠",
              "very-complex":"🔴",
            }[complexity_tier] || "🟡";

            // ── Splitting suggestions for large PRs ─────────────────────
            const splitSuggestions = [];
            if (["size:XL","size:XXL"].includes(size_label) && touched_components?.length > 1) {
              for (const comp of (touched_components || [])) {
                splitSuggestions.push(`  - \`${comp}\` changes → separate PR`);
              }
            }

            // ── Compose comment ─────────────────────────────────────────
            const commentLines = [
              `## ${tier.emoji} PR Size Analysis — \`${size_label}\``,
              ``,
              `> ${tier.advice}`,
              ``,
              `### 📊 Size Classification`,
              ``,
              `| Metric | Value |`,
              `|--------|-------|`,
              `| 📐 **Size Tier** | **\`${size_label}\`** — ${tier.name} |`,
              `| 🧠 **Composite Score** | \`${composite_score.toFixed(1)} / 100\` |`,
              `| ${complexityEmoji} **Complexity** | \`${complexity_tier}\` |`,
              `| ${effortEmoji} **Review Effort** | ~\`${review_hours}h\` estimated |`,
              `| 📝 **Scoring Mode** | \`${classification.scoring_mode}\` |`,
              ``,
              `### 📏 Change Metrics`,
              ``,
              `| Dimension | Value |`,
              `|-----------|-------|`,
              `| ➕ Additions | \`${additions?.toLocaleString()}\` lines |`,
              `| ➖ Deletions | \`${deletions?.toLocaleString()}\` lines |`,
              `| 📋 **Total Changed** | **\`${(total_lines||0).toLocaleString()}\` lines** |`,
              `| 📁 Files Changed | \`${file_count}\` |`,
              `| 🆕 New Files | \`${new_files || 0}\` |`,
              `| ✏️ Modified | \`${modified_files || 0}\` |`,
              `| 🗑️ Deleted | \`${deleted_files || 0}\` |`,
              `| 📛 Renamed | \`${renamed_files || 0}\` |`,
              `| 🔁 Churn Rate | \`${Math.round((churn_rate||0) * 100)}%\` |`,
              `| 📦 Components | \`${component_count || 0}\` (${(touched_components||[]).slice(0,4).join(", ")}${(touched_components||[]).length > 4 ? "..." : ""}) |`,
              `| 📂 Unique Dirs | \`${unique_dirs || 0}\` |`,
              `| 📉 Max Depth | \`${max_depth || 0}\` |`,
              `| 🧪 Test Ratio | \`${Math.round((test_ratio||0)*100)}%\` |`,
              `| 💾 Commits | \`${commits || 0}\` |`,
              ``,
              `### 📈 Dimensional Score Breakdown`,
              ``,
              `\`\`\``,
              `  Dimension    Score (0-100)         Value`,
              `  ─────────────────────────────────────────`,
              dimsChart,
              `  ─────────────────────────────────────────`,
              `  COMPOSITE    ${bar(composite_score, 100, 18)} ${composite_score.toFixed(1)}`,
              `\`\`\``,
            ];

            // File type breakdown
            if (typeTable) {
              commentLines.push(
                ``,
                `### 🗂️ File Type Breakdown`,
                ``,
                `| Extension | Files | Lines |`,
                `|-----------|-------|-------|`,
                typeTable,
              );
            }

            // Split suggestions for large PRs
            if (splitSuggestions.length > 0) {
              commentLines.push(
                ``,
                `### ✂️ Suggested Split Strategy`,
                ``,
                `This PR touches **${component_count}** components. Consider splitting:`,
                ``,
                ...splitSuggestions,
                ``,
                `> 💡 Smaller, focused PRs are reviewed faster and more thoroughly.`,
              );
            }

            // XXL blocking notice
            if (size_label === "size:XXL" && process.env.XXL_BLOCK_MERGE === "true") {
              commentLines.push(
                ``,
                `### 🚨 Merge Block Active`,
                ``,
                `> This PR is classified as **XXL** and requires maintainer override.`,
                ``,
                `To bypass: comment \`/size bypass-xxl\` (requires write permission).`,
              );
            }

            // Commands reference
            commentLines.push(
              ``,
              `### 📋 Size Commands`,
              ``,
              `\`\`\``,
              `/size size:XS     — Override classification`,
              `/size bypass-xxl  — Bypass XXL merge block`,
              `/size rerun       — Re-analyze this PR`,
              `/size split       — Get split recommendations`,
              `\`\`\``,
              ``,
              `---`,
              `*📐 ASH v5.0 OMEGA PR Size Engine · Composite scoring (${classification.scoring_mode})*`,
            );

            const commentBody = commentLines.join("\n");

            if (DRY_RUN) {
              console.log("[DRY] Would post comment:\n" + commentBody.slice(0, 200) + "...");
              return;
            }

            // Find existing size comment to update
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              issue_number: prNum,
              per_page:    100,
            });

            const existing = comments.find(c =>
              c.user.type === "Bot" &&
              c.body.includes("PR Size Analysis")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body:       commentBody,
              });
              console.log("  ✅ Updated existing size comment");
            } else {
              await github.rest.issues.createComment({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                issue_number: prNum,
                body:        commentBody,
              });
              console.log("  ✅ Created size analysis comment");
            }

      - name: "🚨 Create GitHub Check for size"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sizeLabel    = "${{ steps.classify.outputs.size_label }}";
            const composite    = parseFloat("${{ steps.classify.outputs.composite_score || '0' }}");
            const reviewHours  = "${{ steps.classify.outputs.review_hours }}";
            const complexity   = "${{ steps.classify.outputs.complexity_tier }}";
            const totalLines   = "${{ steps.classify.outputs.total_lines }}";
            const fileCount    = "${{ steps.classify.outputs.file_count }}";
            const XXL_BLOCK    = process.env.XXL_BLOCK_MERGE === "true";
            const DRY_RUN      = process.env.DRY_RUN === "true";

            if (DRY_RUN) return;

            const isXXL         = sizeLabel === "size:XXL";
            const isXL          = sizeLabel === "size:XL";
            const conclusion    = isXXL && XXL_BLOCK ? "failure"
                                : isXL ? "neutral"
                                : "success";

            const titleMap = {
              "size:XS":  "✅ XS — Trivial change",
              "size:S":   "✅ S — Small change",
              "size:M":   "✅ M — Medium change",
              "size:L":   "⚠️ L — Large change",
              "size:XL":  "⚠️ XL — Very large change",
              "size:XXL": "❌ XXL — Mega change (merge blocked)",
            };

            const prNum = parseInt("${{ needs.preflight.outputs.pr_number }}");
            if (!prNum) return;

            const pr = await github.rest.pulls.get({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              pull_number: prNum,
            });

            await github.rest.checks.create({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              name:       "📐 PR Size Classification",
              head_sha:   pr.data.head.sha,
              status:     "completed",
              conclusion,
              output: {
                title:   titleMap[sizeLabel] || sizeLabel,
                summary: [
                  `**Size:** \`${sizeLabel}\``,
                  `**Score:** \`${composite.toFixed(1)}/100\``,
                  `**Complexity:** \`${complexity}\``,
                  `**Review effort:** ~\`${reviewHours}h\``,
                  `**Lines:** \`${parseInt(totalLines).toLocaleString()}\``,
                  `**Files:** \`${fileCount}\``,
                ].join("\n"),
                text: isXXL && XXL_BLOCK
                  ? "This PR exceeds the XXL size limit. Please split into smaller PRs or request override with `/size bypass-xxl`."
                  : `PR classified as \`${sizeLabel}\`. Composite score: ${composite.toFixed(1)}/100.`,
              },
            }).catch(e => core.warning(`Check failed: ${e.message}`));

            console.log(`  ✅ GitHub Check created: ${conclusion}`);

      - name: "📤 Upload analysis artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "pr-size-analysis-${{ needs.preflight.outputs.pr_number }}-${{ needs.preflight.outputs.session_id }}"
          path: "${{ github.workspace }}/.size-engine/"
          retention-days: 30
          compression-level: 6

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — Handle override commands
  # ───────────────────────────────────────────────────────────────────────────
  handle-override:
    name: "⚡ Override · ${{ needs.preflight.outputs.override_size }}"
    needs: [preflight, analyze-size]
    if: |
      needs.preflight.outputs.is_override == 'true' &&
      needs.preflight.outputs.override_size != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "⚡ Process size override command"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const overrideCmd = "${{ needs.preflight.outputs.override_size }}";
            const issueNum    = context.payload.issue?.number;
            const sender      = context.payload.comment?.user?.login || "unknown";

            if (!issueNum) return;

            async function react(emoji) {
              await github.rest.reactions.createForIssueComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: context.payload.comment.id,
                content:    emoji,
              }).catch(() => {});
            }

            async function comment(body) {
              await github.rest.issues.createComment({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                issue_number: issueNum,
                body,
              });
            }

            switch (overrideCmd) {

              case "bypass": {
                await github.rest.issues.removeLabel({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  issue_number: issueNum,
                  name:        "size:XXL",
                }).catch(() => {});
                await github.rest.issues.addLabels({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  issue_number: issueNum,
                  labels:      ["size:XL","size-bypass:approved"],
                }).catch(() => {});
                await comment(
                  `✅ **XXL Merge Block Bypassed** by @${sender}.\n\n`+
                  `⚠️ This PR is very large. Please ensure:\n`+
                  `- [ ] All changes have been reviewed thoroughly\n`+
                  `- [ ] Tests have been added/updated\n`+
                  `- [ ] Documentation is updated\n`+
                  `- [ ] Breaking changes are documented\n\n`+
                  `_Please consider splitting this PR in the future._`
                );
                await react("rocket");
                break;
              }

              case "rerun": {
                await comment(
                  `🔄 **Re-analysis requested** by @${sender}.\n\n`+
                  `The PR size workflow will be triggered shortly.`
                );
                await react("+1");
                break;
              }

              case "split": {
                await comment([
                  `## ✂️ PR Split Recommendations`,
                  ``,
                  `@${sender} — here are suggestions for splitting this PR:`,
                  ``,
                  `### Strategy 1: By Component`,
                  `Split changes into one PR per touched component.`,
                  ``,
                  `### Strategy 2: By Change Type`,
                  `- PR 1: Bug fixes only`,
                  `- PR 2: Feature additions`,
                  `- PR 3: Refactoring`,
                  ``,
                  `### Strategy 3: By Risk Level`,
                  `- PR 1: Low-risk changes (docs, configs)`,
                  `- PR 2: Medium-risk changes`,
                  `- PR 3: High-risk changes (core logic)`,
                  ``,
                  `> 💡 Aim for PRs under 250 lines for optimal review speed.`,
                ].join("\n"));
                await react("eyes");
                break;
              }

              default: {
                // Size label override
                if (overrideCmd.startsWith("size:")) {
                  const ALL_SIZE_LABELS = ["size:XS","size:S","size:M","size:L","size:XL","size:XXL"];
                  for (const label of ALL_SIZE_LABELS) {
                    await github.rest.issues.removeLabel({
                      owner:       context.repo.owner,
                      repo:        context.repo.repo,
                      issue_number: issueNum,
                      name:        label,
                    }).catch(() => {});
                  }
                  await github.rest.issues.addLabels({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    issue_number: issueNum,
                    labels:      [overrideCmd, "size:override"],
                  });
                  await comment(
                    `📐 **Size Overridden** to \`${overrideCmd}\` by @${sender}.\n\n`+
                    `_Note: This overrides the automatic classification._`
                  );
                  await react("+1");
                }
                break;
              }
            }

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4 — Generate step summary report
  # ───────────────────────────────────────────────────────────────────────────
  size-summary:
    name: "📊 Summary · Size Report"
    needs: [preflight, analyze-size]
    if: always() && needs.analyze-size.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "📊 Write Step Summary"
        run: |
          SIZE="${{ needs.analyze-size.outputs.size_label }}"
          SCORE="${{ needs.analyze-size.outputs.composite_score }}"
          LINES="${{ needs.analyze-size.outputs.total_lines }}"
          FILES="${{ needs.analyze-size.outputs.file_count }}"
          HOURS="${{ needs.analyze-size.outputs.review_hours }}"
          COMPLEXITY="${{ needs.analyze-size.outputs.complexity_tier }}"
          PR="${{ needs.preflight.outputs.pr_number }}"

          SCORE_INT=$(echo "${SCORE:-0}" | cut -d. -f1)
          BAR_FILLED=$(( SCORE_INT / 5 ))
          BAR_EMPTY=$(( 20 - BAR_FILLED ))
          BAR=$(printf '█%.0s' $(seq 1 ${BAR_FILLED} 2>/dev/null || true))
          BAR+=$(printf '░%.0s' $(seq 1 ${BAR_EMPTY} 2>/dev/null || true))

          cat >> "${GITHUB_STEP_SUMMARY}" << EOF
          # 📐 PR Size Classification — \`${SIZE}\`

          > **PR #${PR}** · Composite Score: \`${SCORE}\`

          ## Results

          | Metric | Value |
          |--------|-------|
          | 📐 Size Tier | \`${SIZE}\` |
          | 🧠 Composite | \`${SCORE}/100\` |
          | 📝 Lines | \`${LINES:-0}\` |
          | 📁 Files | \`${FILES:-0}\` |
          | ⏰ Review | ~\`${HOURS}h\` |
          | 🔮 Complexity | \`${COMPLEXITY}\` |

          \`\`\`
          Score: [${BAR}] ${SCORE}
          \`\`\`

          ---
          *📐 ASH v5.0 OMEGA PR Size Engine*
          EOF

          echo "  ✅ Step summary written"