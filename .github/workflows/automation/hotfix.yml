name: "🚑 Hotfix Pipeline"
on:
  push:
    branches: ['hotfix/**']

concurrency:
  group: "hotfix-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  hotfix-ci:
    name: "🚑 Hotfix CI"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: "🧹 Quick lint"
        run: |
          set -euo pipefail
          sudo apt-get install -y shellcheck --no-install-recommends 2>/dev/null || true
          SCRIPTS=$(find . -name '*.sh' -type f ! -path './.git/*' | head -50)
          if [[ -n "$SCRIPTS" ]]; then
            echo "$SCRIPTS" | xargs shellcheck --severity=error || true
          fi

      - name: "🔒 Quick security"
        uses: gitleaks/gitleaks-action@v3
        with:
          report_format: json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: "🧪 Quick test"
        run: |
          set -euo pipefail
          if [[ -d api ]] && [[ -f api/requirements.txt ]]; then
            pip install pytest --quiet 2>/dev/null || true
            cd api && pytest tests/ -x --timeout=30 -q 2>&1 || true
          fi

      - name: "📊 Hotfix summary"
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          echo "## 🚑 Hotfix Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch**: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: \`${GITHUB_SHA::8}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Mode**: Fast-track (lint + security + test only)" >> "$GITHUB_STEP_SUMMARY"

  create-prs:
    name: "📝 Create Merge PRs"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: hotfix-ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "📝 Create PR to main"
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            try {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚑 Hotfix: ${branch}`,
                head: branch,
                base: 'main',
                body: `## 🚑 Hotfix\n\nAutomated PR from \`${branch}\`.\n\n**Fast-tracked CI passed.**`
              });
            } catch (e) {
              if (e.status === 422) core.info('PR already exists');
              else throw e;
            }

      - name: "📝 Create PR to develop"
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            try {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚑 Hotfix (backport): ${branch}`,
                head: branch,
                base: 'develop',
                body: `## 🚑 Hotfix Backport\n\nAutomated backport PR from \`${branch}\` to \`develop\`.`
              });
            } catch (e) {
              if (e.status === 422) core.info('PR already exists');
              else throw e;
            }
