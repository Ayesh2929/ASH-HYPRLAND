name: "🔔 Discord Notify · Ultra Notification Engine"

on:
  # ── Release events ────────────────────────────────────────────────────────
  release:
    types: [published, prereleased, edited]

  # ── Push events ───────────────────────────────────────────────────────────
  push:
    branches: [main, develop]
    paths:
      - "themes/presets/**"
      - "plugins/**"
      - "version.json"
      - "CHANGELOG.md"

  # ── PR events ─────────────────────────────────────────────────────────────
  pull_request:
    types: [closed]
    branches: [main]

  # ── Issue events ──────────────────────────────────────────────────────────
  issues:
    types: [opened, closed, labeled]

  # ── Security advisories ───────────────────────────────────────────────────
  repository_vulnerability_alert:
    types: [create, dismiss, resolve]

  # ── CI failures (workflow_run) ────────────────────────────────────────────
  workflow_run:
    workflows:
      - "⚡ Benchmark · Theme Apply Performance"
      - "🧠 Benchmark · Memory Usage Profiling"
      - "📉 Regression Detection · Performance Guard"
    types: [completed]

  # ── Discussion events ─────────────────────────────────────────────────────
  discussion:
    types: [created, answered]

  # ── Manual notification ───────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      notification_type:
        description: "Notification type"
        required: true
        default: "announcement"
        type: choice
        options:
          - announcement      # Major announcement
          - release           # Release notification
          - theme-drop        # New themes added
          - plugin-drop       # New plugins added
          - security-alert    # Security advisory
          - ci-failure        # CI failure alert
          - milestone         # Stars/contributor milestone
          - benchmark-alert   # Performance regression
          - maintenance       # Maintenance window
          - community         # Community update
          - custom            # Custom message

      channel:
        description: "Target Discord channel webhook"
        required: false
        default: "general"
        type: choice
        options:
          - general
          - releases
          - theme-drops
          - plugin-drops
          - security
          - ci-alerts
          - benchmarks
          - announcements
          - community
          - dev-feed

      title:
        description: "Notification title"
        required: false
        default: ""
        type: string

      message:
        description: "Notification message body"
        required: false
        default: ""
        type: string

      mention_role:
        description: "Discord role to mention (empty = none)"
        required: false
        default: ""
        type: string

      color:
        description: "Embed color (hex without #, or preset)"
        required: false
        default: "auto"
        type: string

      include_stats:
        description: "Include current repository stats"
        required: false
        default: true
        type: boolean

      dry_run:
        description: "Preview notification without sending"
        required: false
        default: false
        type: boolean

# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: "discord-notify-${{ github.event_name }}-${{ github.sha || github.run_id }}"
  cancel-in-progress: false    # Never cancel — all notifications must fire

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

# ─────────────────────────────────────────────────────────────────────────────
env:
  NOTIFY_VERSION: "5.0.0"
  WORK_DIR: "${{ github.workspace }}/.notify-engine"
  DRY_RUN: "${{ github.event.inputs.dry_run || 'false' }}"
  BOT_NAME: "ASH Dotfiles"
  BOT_AVATAR: "https://raw.githubusercontent.com/${{ github.repository }}/main/assets/brand/logos/ash-logo-256.png"

  # ── Discord color codes (decimal) ──────────────────────────────────────────
  COLOR_SUCCESS: "10681994"     # #a6e3a1 green
  COLOR_ERROR: "16007085"       # #f38ba8 red
  COLOR_WARNING: "16367145"     # #f9e2af yellow
  COLOR_INFO: "9007290"         # #89b4fa blue
  COLOR_RELEASE: "10485230"     # #cba6f7 mauve
  COLOR_THEME: "10485230"       # #cba6f7 mauve
  COLOR_PLUGIN: "9007290"       # #89b4fa blue
  COLOR_SECURITY: "16007085"    # #f38ba8 red
  COLOR_BENCHMARK: "16367145"   # #f9e2af yellow
  COLOR_COMMUNITY: "6869773"    # #94e2d5 teal
  COLOR_ANNOUNCEMENT: "10485230"# #cba6f7 mauve

# ═════════════════════════════════════════════════════════════════════════════
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Classify event & build notification payload
  # ───────────────────────────────────────────────────────────────────────────
  classify-event:
    name: "🔍 Classify · Event Analysis & Routing"
    runs-on: ubuntu-24.04
    outputs:
      should_notify:    ${{ steps.gate.outputs.should_notify }}
      notification_type:${{ steps.classify.outputs.type }}
      channel:          ${{ steps.classify.outputs.channel }}
      severity:         ${{ steps.classify.outputs.severity }}
      color:            ${{ steps.classify.outputs.color }}
      session_id:       ${{ steps.session.outputs.id }}
      payload_json:     ${{ steps.payload.outputs.json }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: "🆔 Session"
        id: session
        run: |
          echo "id=notify-$(date +%Y%m%d%H%M%S)-$$" >> "$GITHUB_OUTPUT"

      - name: "🔍 Classify event type"
        id: classify
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const event  = context.eventName;
            const action = context.payload.action || "";
            const manual = "${{ github.event.inputs.notification_type }}" || "";

            const CHANNEL_MAP = {
              release:         "releases",
              theme_drop:      "theme-drops",
              plugin_drop:     "plugin-drops",
              security:        "security",
              ci_failure:      "ci-alerts",
              benchmark_alert: "benchmarks",
              announcement:    "announcements",
              milestone:       "community",
              community:       "community",
              pr_merged:       "dev-feed",
              issue:           "general",
              maintenance:     "announcements",
              custom:          "${{ github.event.inputs.channel || 'general' }}",
            };

            const COLOR_MAP = {
              release:         process.env.COLOR_RELEASE,
              theme_drop:      process.env.COLOR_THEME,
              plugin_drop:     process.env.COLOR_PLUGIN,
              security:        process.env.COLOR_SECURITY,
              ci_failure:      process.env.COLOR_ERROR,
              benchmark_alert: process.env.COLOR_BENCHMARK,
              announcement:    process.env.COLOR_ANNOUNCEMENT,
              milestone:       process.env.COLOR_COMMUNITY,
              community:       process.env.COLOR_COMMUNITY,
              pr_merged:       process.env.COLOR_SUCCESS,
              issue:           process.env.COLOR_INFO,
              maintenance:     process.env.COLOR_WARNING,
              custom:          process.env.COLOR_INFO,
            };

            const SEVERITY_MAP = {
              release:         "high",
              theme_drop:      "medium",
              plugin_drop:     "medium",
              security:        "critical",
              ci_failure:      "high",
              benchmark_alert: "high",
              announcement:    "high",
              milestone:       "medium",
              pr_merged:       "low",
              issue:           "low",
              maintenance:     "high",
              custom:          "medium",
            };

            let notifType = "general";
            let channel   = "general";

            if (manual) {
              notifType = manual;
              channel   = CHANNEL_MAP[manual] || "${{ github.event.inputs.channel || 'general' }}";
            } else {
              switch (event) {
                case "release":
                  notifType = "release";
                  break;
                case "push": {
                  const paths = context.payload.commits
                    ?.flatMap(c => [...(c.added||[]),...(c.modified||[])])
                    .join(",") || "";
                  if (/themes\/presets/.test(paths))  notifType = "theme_drop";
                  else if (/plugins\//.test(paths))   notifType = "plugin_drop";
                  else if (/CHANGELOG/.test(paths))   notifType = "announcement";
                  else                                 notifType = "pr_merged";
                  break;
                }
                case "pull_request":
                  notifType = context.payload.pull_request?.merged ? "pr_merged" : "issue";
                  break;
                case "issues":
                  notifType = "issue";
                  break;
                case "repository_vulnerability_alert":
                  notifType = "security";
                  break;
                case "workflow_run": {
                  const conclusion = context.payload.workflow_run?.conclusion;
                  notifType = conclusion === "failure" ? "ci_failure" : "benchmark_alert";
                  break;
                }
                case "discussion":
                  notifType = "community";
                  break;
                default:
                  notifType = "general";
              }
              channel = CHANNEL_MAP[notifType] || "general";
            }

            const color    = COLOR_MAP[notifType]    || process.env.COLOR_INFO;
            const severity = SEVERITY_MAP[notifType] || "low";

            core.setOutput("type",     notifType);
            core.setOutput("channel",  channel);
            core.setOutput("color",    color);
            core.setOutput("severity", severity);

            console.log(`  🔔 Type: ${notifType}`);
            console.log(`  📡 Channel: #${channel}`);
            console.log(`  🎨 Color: ${color}`);
            console.log(`  ⚠️  Severity: ${severity}`);

      - name: "🚦 Notification gate"
        id: gate
        run: |
          TYPE="${{ steps.classify.outputs.type }}"
          SEVERITY="${{ steps.classify.outputs.severity }}"
          EVENT="${{ github.event_name }}"

          SHOULD="true"

          # Skip low-severity push events in PR context
          if [[ "${EVENT}" == "push" && "${TYPE}" == "pr_merged" ]]; then
            # Only notify for pushes to main with meaningful changes
            COMMITS=$(git log --oneline -3 2>/dev/null | wc -l)
            [[ "${COMMITS}" -lt 1 ]] && SHOULD="false"
          fi

          # Always notify for critical
          [[ "${SEVERITY}" == "critical" ]] && SHOULD="true"

          # Manual always fires
          [[ "${EVENT}" == "workflow_dispatch" ]] && SHOULD="true"

          # Release always fires
          [[ "${EVENT}" == "release" ]] && SHOULD="true"

          echo "should_notify=${SHOULD}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Gate::should_notify=${SHOULD} (${TYPE})"

      - name: "📦 Build notification payload"
        id: payload
        if: steps.gate.outputs.should_notify == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs   = require("fs");
            const path = require("path");
            const event  = context.eventName;
            const type   = "${{ steps.classify.outputs.type }}";
            const color  = parseInt("${{ steps.classify.outputs.color }}");
            const severity = "${{ steps.classify.outputs.severity }}";
            const NOW    = new Date().toISOString();
            const REPO   = `${context.repo.owner}/${context.repo.repo}`;
            const REPO_URL = `https://github.com/${REPO}`;
            const BOT_NAME  = process.env.BOT_NAME;
            const BOT_AVATAR = process.env.BOT_AVATAR;

            // ── Helper functions ─────────────────────────────────
            const truncate = (s, n=1024) => s && s.length > n
              ? s.slice(0,n-3)+"..." : (s||"");

            const formatDate = (d) => d
              ? new Date(d).toLocaleDateString("en-US",
                  {year:"numeric",month:"short",day:"numeric"})
              : "Unknown";

            const escapeMd = (s) => (s||"")
              .replace(/\*/g,"\\*").replace(/_/g,"\\_")
              .replace(/~/g,"\\~").replace(/`/g,"\\`");

            const severityEmoji = {
              critical: "🚨", high: "🔴", medium: "🟡",
              low: "🟢", info: "🔵"
            }[severity] || "📋";

            // ── Fetch repo stats ──────────────────────────────────
            const repo = await github.rest.repos.get({
              owner: context.repo.owner,
              repo:  context.repo.repo,
            }).catch(() => ({ data: {} }));
            const R = repo.data;
            const stars = (R.stargazers_count || 0).toLocaleString();
            const forks = (R.forks_count || 0).toLocaleString();

            // ── Build embed per event type ────────────────────────
            let embed = {
              color,
              timestamp: NOW,
              footer: {
                text: `ASH Dotfiles v5.0 OMEGA · ${REPO}`,
                icon_url: BOT_AVATAR,
              },
            };

            let content = "";
            let mention  = "${{ github.event.inputs.mention_role || '' }}";

            // ─────────────────────────────────────────────────────
            // RELEASE
            // ─────────────────────────────────────────────────────
            if (type === "release") {
              const rel = context.payload.release || {};
              const isPre  = rel.prerelease;
              const isLatest = !isPre;
              const tag    = rel.tag_name || "v?";
              const name   = rel.name || tag;
              const body   = truncate(rel.body || "No release notes.", 800);
              const dl_url = rel.html_url;
              const assets = rel.assets || [];
              const totalDL= assets.reduce((s,a)=>s+a.download_count,0);

              content = isLatest
                ? `## 🚀 ASH Dotfiles ${tag} is out! @everyone`
                : `## 🧪 Pre-release ${tag} available`;

              embed = {
                ...embed,
                title: `${isPre?"🧪":"🚀"} ${name}`,
                url:   dl_url,
                description: [
                  `> ${isPre ? "⚠️ Pre-release — not recommended for production" : "✅ Stable release"}`,
                  "",
                  "### 📋 Release Notes",
                  body,
                ].join("\n"),
                thumbnail: { url: BOT_AVATAR },
                author: {
                  name: rel.author?.login ? `@${rel.author.login}` : "ASH Team",
                  url:  rel.author?.html_url || REPO_URL,
                  icon_url: rel.author?.avatar_url || BOT_AVATAR,
                },
                fields: [
                  { name: "🏷️ Version",     value: `\`${tag}\``,        inline: true },
                  { name: "📅 Date",         value: formatDate(rel.published_at), inline: true },
                  { name: "📦 Type",         value: isPre?"Pre-release":"Stable", inline: true },
                  { name: "⬇️ Downloads",    value: `\`${totalDL.toLocaleString()}\``, inline: true },
                  { name: "📁 Assets",       value: `\`${assets.length}\``, inline: true },
                  { name: "⭐ Repo Stars",   value: `\`${stars}\``,       inline: true },
                  { name: "🔗 Install",      value: `\`bash <(curl -fsSL https://ash.dev/install)\``, inline: false },
                ],
                image: {
                  url: `https://raw.githubusercontent.com/${REPO}/main/assets/screenshots/brand/hero-banner.webp`,
                },
              };
              if (isLatest) mention = "@everyone";

            // ─────────────────────────────────────────────────────
            // THEME DROP
            // ─────────────────────────────────────────────────────
            } else if (type === "theme_drop") {
              const commits = context.payload.commits || [];
              const addedThemes = [];
              for (const commit of commits) {
                for (const f of (commit.added||[])) {
                  const m = f.match(/themes\/presets\/(\w+)\/([\w-]+)\/theme\.conf/);
                  if (m) addedThemes.push({ category: m[1], name: m[2] });
                }
              }

              const themeList = addedThemes.slice(0,8).map(t =>
                `\`${t.name}\` (${t.category})`
              ).join(" · ");

              embed = {
                ...embed,
                title: `🎨 ${addedThemes.length} New Theme${addedThemes.length>1?"s":""} Added!`,
                url:   `${REPO_URL}/tree/main/themes/presets`,
                description: [
                  addedThemes.length > 0
                    ? `**${themeList}**${addedThemes.length > 8 ? ` +${addedThemes.length-8} more` : ""}`
                    : "Theme files updated",
                  "",
                  "Browse all 250+ themes with `ash theme pick`",
                ].join("\n"),
                thumbnail: { url: BOT_AVATAR },
                fields: [
                  { name: "🎨 New Themes",  value: `\`${addedThemes.length}\``,  inline: true },
                  { name: "📦 Total",       value: "`250+`",                      inline: true },
                  { name: "⚡ Apply",       value: "`ash theme apply <name>`",     inline: false },
                  { name: "🔍 Browse",      value: "`ash theme pick`",             inline: true },
                  { name: "🎲 Random",      value: "`ash theme random`",           inline: true },
                ],
              };

            // ─────────────────────────────────────────────────────
            // PLUGIN DROP
            // ─────────────────────────────────────────────────────
            } else if (type === "plugin_drop") {
              const commits = context.payload.commits || [];
              const addedPlugins = [];
              for (const commit of commits) {
                for (const f of (commit.added||[])) {
                  const m = f.match(/plugins\/([\w-]+)\/plugin\.json/);
                  if (m) addedPlugins.push(m[1]);
                }
              }

              embed = {
                ...embed,
                title: `🔌 ${addedPlugins.length} New Plugin${addedPlugins.length>1?"s":""} Available!`,
                url:   `${REPO_URL}/tree/main/plugins`,
                description: addedPlugins.length > 0
                  ? `New plugins: **${addedPlugins.slice(0,5).join("**, **")}**${addedPlugins.length>5?` +${addedPlugins.length-5} more`:""}`
                  : "Plugin ecosystem updated",
                thumbnail: { url: BOT_AVATAR },
                fields: [
                  { name: "🔌 New Plugins", value: `\`${addedPlugins.length}\``, inline: true },
                  { name: "📦 Total",       value: "`150+`",                      inline: true },
                  { name: "🔍 Browse",      value: "`ash plugin browse`",          inline: false },
                  { name: "⚡ Install",     value: "`ash plugin install <name>`",  inline: true },
                ],
              };

            // ─────────────────────────────────────────────────────
            // SECURITY
            // ─────────────────────────────────────────────────────
            } else if (type === "security") {
              const alert = context.payload.alert || {};
              const vuln  = alert.security_vulnerability || {};
              const pkg   = vuln.package?.name || "Unknown";
              const sev   = alert.security_advisory?.severity || "unknown";
              const ghsaId= alert.security_advisory?.ghsa_id || "";

              content = `## 🔒 Security Advisory @here`;
              embed = {
                ...embed,
                title: `🔒 Security Alert: ${pkg}`,
                url:   alert.html_url || `${REPO_URL}/security/advisories`,
                description: [
                  `> 🚨 **A security vulnerability has been detected**`,
                  "",
                  `**Severity:** ${sev.toUpperCase()}`,
                  `**Package:** \`${pkg}\``,
                  ghsaId ? `**Advisory:** [${ghsaId}](https://github.com/advisories/${ghsaId})` : "",
                  "",
                  "⚡ Update your dependencies immediately.",
                ].filter(Boolean).join("\n"),
                fields: [
                  { name: "⚠️ Severity",   value: `\`${sev.toUpperCase()}\``, inline: true },
                  { name: "📦 Package",    value: `\`${pkg}\``,              inline: true },
                  { name: "🔧 Fix",        value: "`ash update system`",      inline: false },
                ],
              };
              mention = "@here";

            // ─────────────────────────────────────────────────────
            // CI FAILURE
            // ─────────────────────────────────────────────────────
            } else if (type === "ci_failure") {
              const wfRun = context.payload.workflow_run || {};
              const wfName = wfRun.name || "Unknown Workflow";
              const branch = wfRun.head_branch || "main";
              const sha    = (wfRun.head_sha || "").slice(0,7);
              const runUrl = wfRun.html_url || `${REPO_URL}/actions`;
              const actor  = wfRun.triggering_actor?.login || "unknown";

              embed = {
                ...embed,
                title: `❌ CI Failure: ${wfName}`,
                url:   runUrl,
                description: [
                  `> ❌ A CI workflow has failed and needs attention`,
                  "",
                  `**Workflow:** \`${wfName}\``,
                  `**Branch:** \`${branch}\``,
                  `**Commit:** [\`${sha}\`](${REPO_URL}/commit/${wfRun.head_sha})`,
                  `**Triggered by:** @${actor}`,
                ].join("\n"),
                author: {
                  name:     `@${actor}`,
                  icon_url: wfRun.triggering_actor?.avatar_url || BOT_AVATAR,
                },
                fields: [
                  { name: "🔴 Status",    value: "`FAILURE`",    inline: true },
                  { name: "🌿 Branch",    value: `\`${branch}\``,inline: true },
                  { name: "🔑 Commit",    value: `\`${sha}\``,   inline: true },
                  { name: "👤 Actor",     value: `@${actor}`,    inline: true },
                  { name: "🔗 View Run",  value: `[Open →](${runUrl})`, inline: false },
                ],
              };

            // ─────────────────────────────────────────────────────
            // PR MERGED
            // ─────────────────────────────────────────────────────
            } else if (type === "pr_merged") {
              const pr     = context.payload.pull_request || {};
              const merged = pr.merged;
              if (!merged) {
                core.setOutput("json", "{}");
                return;
              }
              const prNum  = pr.number;
              const title  = truncate(pr.title || "Untitled PR", 100);
              const body   = truncate(pr.body  || "", 300);
              const author = pr.user?.login || "unknown";
              const labels = (pr.labels||[]).map(l=>l.name).join(", ");
              const adds   = pr.additions || 0;
              const dels   = pr.deletions || 0;

              embed = {
                ...embed,
                title: `🔀 PR Merged: #${prNum} ${escapeMd(title)}`,
                url:   pr.html_url || REPO_URL,
                description: body || "No description provided.",
                author: {
                  name:     `@${author}`,
                  url:      pr.user?.html_url || REPO_URL,
                  icon_url: pr.user?.avatar_url || BOT_AVATAR,
                },
                fields: [
                  { name: "✅ Status",   value: "`MERGED`",           inline: true },
                  { name: "📊 Changes", value: `\`+${adds}/-${dels}\``, inline: true },
                  { name: "🏷️ Labels",  value: labels||"none",         inline: true },
                  { name: "🔗 View PR", value: `[#${prNum}](${pr.html_url||REPO_URL})`, inline: false },
                ],
              };

            // ─────────────────────────────────────────────────────
            // MANUAL / ANNOUNCEMENT / CUSTOM
            // ─────────────────────────────────────────────────────
            } else {
              const manualTitle   = "${{ github.event.inputs.title || '' }}" ||
                                    `📣 ASH Dotfiles Update`;
              const manualMessage = "${{ github.event.inputs.message || '' }}" ||
                                    "An update has been made to ASH Dotfiles.";
              const inclStats = "${{ github.event.inputs.include_stats }}" === "true";

              embed = {
                ...embed,
                title: manualTitle,
                url:   REPO_URL,
                description: manualMessage,
                thumbnail: { url: BOT_AVATAR },
                fields: inclStats ? [
                  { name: "⭐ Stars",  value: `\`${stars}\``, inline: true },
                  { name: "🔀 Forks", value: `\`${forks}\``, inline: true },
                  { name: "🎨 Themes",value: "`250+`",         inline: true },
                ] : [],
              };
            }

            // ── Assemble final payload ────────────────────────────
            const payload = {
              username:   BOT_NAME,
              avatar_url: BOT_AVATAR,
              content:    mention ? `${mention} ${content}`.trim() : content || undefined,
              embeds:     [embed],
              allowed_mentions: mention
                ? { parse: mention.includes("@everyone") ? ["everyone"]
                         : mention.includes("@here")     ? ["here"]
                         : ["roles"], roles: [] }
                : { parse: [] },
            };

            const payloadStr = JSON.stringify(payload, null, 2);
            require("fs").mkdirSync(process.env.WORK_DIR, { recursive: true });
            require("fs").writeFileSync(
              `${process.env.WORK_DIR}/payload.json`, payloadStr
            );

            core.setOutput("json", payloadStr);
            console.log(`\n  📦 Payload built for type: ${type}`);

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Send notification with retry & rate limiting
  # ───────────────────────────────────────────────────────────────────────────
  send-notification:
    name: "📡 Send · ${{ needs.classify-event.outputs.notification_type }} → #${{ needs.classify-event.outputs.channel }}"
    needs: classify-event
    if: needs.classify-event.outputs.should_notify == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      NOTIF_TYPE: ${{ needs.classify-event.outputs.notification_type }}
      CHANNEL:    ${{ needs.classify-event.outputs.channel }}
      SEVERITY:   ${{ needs.classify-event.outputs.severity }}
      SESSION_ID: ${{ needs.classify-event.outputs.session_id }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📦 Install tools"
        run: |
          pip3 install --quiet --user \
            requests==2.32.3 \
            rich==13.9.2 \
            2>/dev/null || true
          sudo apt-get install -y --no-install-recommends \
            curl jq bc 2>/dev/null || true
          mkdir -p "${WORK_DIR}"

      - name: "🔑 Resolve webhook URL"
        id: webhook
        run: |
          CHANNEL="${CHANNEL}"

          # Map channel to secret name
          case "${CHANNEL}" in
            releases)      SECRET_NAME="DISCORD_WEBHOOK_RELEASES"    ;;
            theme-drops)   SECRET_NAME="DISCORD_WEBHOOK_THEMES"      ;;
            plugin-drops)  SECRET_NAME="DISCORD_WEBHOOK_PLUGINS"     ;;
            security)      SECRET_NAME="DISCORD_WEBHOOK_SECURITY"    ;;
            ci-alerts)     SECRET_NAME="DISCORD_WEBHOOK_CI"          ;;
            benchmarks)    SECRET_NAME="DISCORD_WEBHOOK_BENCHMARK"   ;;
            announcements) SECRET_NAME="DISCORD_WEBHOOK_ANNOUNCE"    ;;
            community)     SECRET_NAME="DISCORD_WEBHOOK_COMMUNITY"   ;;
            dev-feed)      SECRET_NAME="DISCORD_WEBHOOK_DEV"         ;;
            *)             SECRET_NAME="DISCORD_WEBHOOK_GENERAL"     ;;
          esac

          echo "secret_name=${SECRET_NAME}" >> "$GITHUB_OUTPUT"
          echo "  🔑 Webhook secret: ${SECRET_NAME}"

      - name: "📡 Send to #releases"
        if: needs.classify-event.outputs.channel == 'releases'
        continue-on-error: true
        run: |
          bash .github/actions/notify-discord/notify.sh \
            "${WORK_DIR}/payload.json" || true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}

      - name: "📡 Send to #theme-drops"
        if: needs.classify-event.outputs.channel == 'theme-drops'
        continue-on-error: true
        run: |
          bash .github/actions/notify-discord/notify.sh \
            "${WORK_DIR}/payload.json" || true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_THEMES }}

      - name: "📡 Send to #security"
        if: needs.classify-event.outputs.channel == 'security'
        continue-on-error: true
        run: |
          bash .github/actions/notify-discord/notify.sh \
            "${WORK_DIR}/payload.json" || true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_SECURITY }}

      - name: "📡 Send to #ci-alerts"
        if: needs.classify-event.outputs.channel == 'ci-alerts'
        continue-on-error: true
        run: |
          bash .github/actions/notify-discord/notify.sh \
            "${WORK_DIR}/payload.json" || true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_CI }}

      - name: "📡 Send to #benchmarks"
        if: needs.classify-event.outputs.channel == 'benchmarks'
        continue-on-error: true
        run: |
          bash .github/actions/notify-discord/notify.sh \
            "${WORK_DIR}/payload.json" || true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_BENCHMARK }}

      - name: "📡 Send to #general / fallback"
        if: |
          needs.classify-event.outputs.channel != 'releases' &&
          needs.classify-event.outputs.channel != 'theme-drops' &&
          needs.classify-event.outputs.channel != 'security' &&
          needs.classify-event.outputs.channel != 'ci-alerts' &&
          needs.classify-event.outputs.channel != 'benchmarks'
        continue-on-error: true
        run: |
          python3 << 'SEND_EOF'
          import json
          import os
          import time
          import sys

          try:
              import requests
          except ImportError:
              print("  ⚠️ requests not available")
              sys.exit(0)

          PAYLOAD_FILE = f"{os.environ['WORK_DIR']}/payload.json"
          DRY_RUN      = os.environ.get("DRY_RUN","false") == "true"
          SESSION_ID   = os.environ.get("SESSION_ID","?")
          NOTIF_TYPE   = os.environ.get("NOTIF_TYPE","general")
          CHANNEL      = os.environ.get("CHANNEL","general")

          # Resolve webhook per channel
          WEBHOOKS = {
              "announcements": os.environ.get("DISCORD_WEBHOOK_ANNOUNCE",""),
              "community":     os.environ.get("DISCORD_WEBHOOK_COMMUNITY",""),
              "dev-feed":      os.environ.get("DISCORD_WEBHOOK_DEV",""),
              "plugin-drops":  os.environ.get("DISCORD_WEBHOOK_PLUGINS",""),
              "general":       os.environ.get("DISCORD_WEBHOOK_GENERAL",""),
          }
          WEBHOOK_URL = (
              WEBHOOKS.get(CHANNEL,"") or
              os.environ.get("DISCORD_WEBHOOK_GENERAL","") or
              os.environ.get("DISCORD_WEBHOOK_URL","")
          )

          if not WEBHOOK_URL:
              print(f"  ℹ️ No webhook configured for #{CHANNEL}")
              sys.exit(0)

          try:
              with open(PAYLOAD_FILE) as f:
                  payload = json.load(f)
          except Exception as e:
              print(f"  ⚠️ Payload load failed: {e}")
              sys.exit(0)

          if DRY_RUN:
              print(f"  [DRY RUN] Would send to #{CHANNEL}:")
              print(json.dumps(payload, indent=2)[:500])
              sys.exit(0)

          print(f"\n  📡 Sending to #{CHANNEL} ({NOTIF_TYPE})")
          print(f"  🆔 Session: {SESSION_ID}")

          # Retry with exponential backoff
          MAX_RETRIES = 3
          BACKOFF     = [1, 2, 4]

          for attempt in range(MAX_RETRIES):
              try:
                  resp = requests.post(
                      WEBHOOK_URL,
                      json=payload,
                      headers={"Content-Type": "application/json"},
                      timeout=15,
                  )

                  if resp.status_code == 204:
                      print(f"  ✅ Notification sent (attempt {attempt+1})")
                      break
                  elif resp.status_code == 429:
                      retry_after = float(resp.json().get("retry_after", 2))
                      print(f"  ⏳ Rate limited — waiting {retry_after:.1f}s")
                      time.sleep(retry_after)
                  elif resp.status_code in (400, 401, 403, 404):
                      print(f"  ❌ Fatal error: HTTP {resp.status_code}")
                      print(f"     {resp.text[:200]}")
                      break
                  else:
                      wait = BACKOFF[min(attempt, len(BACKOFF)-1)]
                      print(f"  ⚠️ HTTP {resp.status_code} — retry in {wait}s")
                      time.sleep(wait)

              except requests.exceptions.Timeout:
                  wait = BACKOFF[min(attempt, len(BACKOFF)-1)]
                  print(f"  ⏱️ Timeout — retry {attempt+1}/{MAX_RETRIES} in {wait}s")
                  time.sleep(wait)
              except Exception as e:
                  print(f"  ❌ Exception: {e}")
                  break
          else:
              print(f"  ❌ All {MAX_RETRIES} attempts failed")
          SEND_EOF
        env:
          DISCORD_WEBHOOK_GENERAL:  ${{ secrets.DISCORD_WEBHOOK_GENERAL }}
          DISCORD_WEBHOOK_ANNOUNCE: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCE }}
          DISCORD_WEBHOOK_COMMUNITY:${{ secrets.DISCORD_WEBHOOK_COMMUNITY }}
          DISCORD_WEBHOOK_DEV:      ${{ secrets.DISCORD_WEBHOOK_DEV }}
          DISCORD_WEBHOOK_PLUGINS:  ${{ secrets.DISCORD_WEBHOOK_PLUGINS }}

      - name: "📊 Step summary"
        if: always()
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" << EOF
          # 🔔 Discord Notification

          | Field | Value |
          |-------|-------|
          | 📡 Type | \`${NOTIF_TYPE}\` |
          | 🔔 Channel | \`#${CHANNEL}\` |
          | ⚠️ Severity | \`${SEVERITY}\` |
          | 🆔 Session | \`${SESSION_ID}\` |
          | 🚫 Dry Run | \`${DRY_RUN}\` |

          *🔔 ASH v5.0 OMEGA Notification Engine*
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — Special release celebration notification
  # ───────────────────────────────────────────────────────────────────────────
  release-celebration:
    name: "🎊 Celebrate · Major Release Fanfare"
    needs: [classify-event, send-notification]
    if: |
      needs.classify-event.outputs.notification_type == 'release' &&
      github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "🎊 Send celebration embed"
        continue-on-error: true
        run: |
          set -euo pipefail

          TAG="${{ github.event.release.tag_name }}"
          NAME="${{ github.event.release.name }}"
          REPO="${{ github.repository }}"
          REPO_URL="https://github.com/${REPO}"

          [[ -z "${DISCORD_WEBHOOK_RELEASES:-}" ]] && exit 0

          # Confetti-style multi-embed celebration
          PAYLOAD=$(cat << EOF
          {
            "username": "ASH Dotfiles",
            "avatar_url": "${BOT_AVATAR}",
            "content": "# 🎉🎊🎉 ASH Dotfiles ${TAG} Released! 🎉🎊🎉\n@everyone",
            "embeds": [
              {
                "title": "🚀 ${NAME:-${TAG}} Is Here!",
                "url": "${REPO_URL}/releases/tag/${TAG}",
                "description": "The most advanced dotfiles repository just got even better!\n\n**What's new in ${TAG}?** Check the release notes for the full changelog.\n\n🔥 250+ themes · 150+ plugins · 0 limits",
                "color": 10485230,
                "thumbnail": {"url": "${BOT_AVATAR}"},
                "image": {"url": "https://raw.githubusercontent.com/${REPO}/main/assets/screenshots/brand/hero-banner.webp"},
                "fields": [
                  {"name": "📦 Install / Update",  "value": "\`\`\`bash\nbash <(curl -fsSL https://ash.dev/install)\n\`\`\`", "inline": false},
                  {"name": "📖 What's New",        "value": "[View Changelog](${REPO_URL}/blob/main/CHANGELOG.md)", "inline": true},
                  {"name": "💬 Discord",           "value": "[Join Community](https://discord.gg/ash-dotfiles)", "inline": true},
                  {"name": "⭐ Star on GitHub",    "value": "[Give us a star!](${REPO_URL})", "inline": true}
                ],
                "footer": {"text": "ASH Dotfiles v5.0 OMEGA · Thank you to all contributors! 🙏"},
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
            ]
          }
          EOF
          )

          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${DISCORD_WEBHOOK_RELEASES}" && \
            echo "  🎊 Celebration sent!" || \
            echo "  ⚠️ Celebration failed"
        env:
          DISCORD_WEBHOOK_RELEASES: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}