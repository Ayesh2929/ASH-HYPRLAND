name: "🧹 Stale · Intelligent Issue & PR Management"

on:
  schedule:
    # ── Primary sweep — daily at 06:00 UTC ─────────────────────────────
    - cron: "0 6 * * *"
    # ── Deep scan — weekly Sunday 08:00 UTC ────────────────────────────
    - cron: "0 8 * * 0"
    # ── Lock sweep — bi-weekly Saturday 04:00 UTC ──────────────────────
    - cron: "0 4 * * 6"

  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode"
        required: false
        default: "standard"
        type: choice
        options:
          - standard        # Normal stale sweep
          - aggressive      # Shorter timeouts for backlog clearance
          - gentle          # Longer timeouts, more warnings
          - dry-run         # Simulate without making changes
          - report-only     # Generate report without any modifications
          - revive-check    # Check recently closed for revival signals
          - lock-old        # Lock only — no staleness changes
          - digest          # Generate weekly digest only
      days_stale_issues:
        description: "Days before issues marked stale"
        required: false
        default: "60"
        type: string
      days_stale_prs:
        description: "Days before PRs marked stale"
        required: false
        default: "30"
        type: string
      days_close:
        description: "Days after stale before close"
        required: false
        default: "14"
        type: string
      exempt_labels:
        description: "Comma-separated exempt labels"
        required: false
        default: "pinned,security,funded,wip,blocked,in-progress"
        type: string
      notify_discord:
        description: "Send Discord notification"
        required: false
        default: true
        type: boolean
      generate_digest:
        description: "Generate weekly digest"
        required: false
        default: false
        type: boolean

  # ── Manual trigger from issue comments ─────────────────────────────────
  issue_comment:
    types: [created]

  # ── Re-open detection ────────────────────────────────────────────────────
  issues:
    types: [reopened, unlocked]

  pull_request_target:
    types: [reopened, review_requested, ready_for_review]

# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: "stale-management-${{ github.event_name }}"
  cancel-in-progress: false

permissions:
  issues: write
  pull-requests: write
  contents: read
  actions: read
  repository-projects: read

# ─────────────────────────────────────────────────────────────────────────────
env:
  STALE_VERSION: "5.0.0"
  WORK_DIR: "${{ github.workspace }}/.stale-engine"
  DB_PATH: "${{ github.workspace }}/.stale-engine/stale.db"

  # ── Operational mode ──────────────────────────────────────────────────────
  MODE: "${{ github.event.inputs.mode || 'standard' }}"
  DRY_RUN: "${{ github.event.inputs.mode == 'dry-run' && 'true' || 'false' }}"

  # ── Staleness timings (days) ──────────────────────────────────────────────
  DAYS_STALE_ISSUES: "${{ github.event.inputs.days_stale_issues || '60' }}"
  DAYS_STALE_PRS: "${{ github.event.inputs.days_stale_prs || '30' }}"
  DAYS_CLOSE: "${{ github.event.inputs.days_close || '14' }}"
  DAYS_LOCK: "180"
  DAYS_WARN_BEFORE_STALE: "7"

  # ── Category-specific overrides (days) ───────────────────────────────────
  DAYS_BUG_STALE: "90"
  DAYS_FEATURE_STALE: "60"
  DAYS_QUESTION_STALE: "30"
  DAYS_DOCS_STALE: "45"
  DAYS_SECURITY_STALE: "999"
  DAYS_CRITICAL_STALE: "999"
  DAYS_PR_DRAFT_STALE: "60"
  DAYS_PR_REVIEW_STALE: "14"

  # ── Labels ────────────────────────────────────────────────────────────────
  LABEL_STALE: "stale"
  LABEL_WARN: "stale:warning"
  LABEL_EXEMPT_LIST: "pinned,security,funded,wip,blocked,in-progress,hold,do-not-close,priority:critical,priority:high"
  LABEL_CLOSE_REASON: "stale:closed"
  LABEL_LOCKED: "stale:locked"

# ═════════════════════════════════════════════════════════════════════════════
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Pre-flight & smart comment trigger detection
  # ───────────────────────────────────────────────────────────────────────────
  preflight:
    name: "🔍 Preflight · Trigger Analysis"
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      run_mode: ${{ steps.mode.outputs.mode }}
      triggered_by_comment: ${{ steps.comment_check.outputs.triggered }}
      comment_command: ${{ steps.comment_check.outputs.command }}
      session_id: ${{ steps.session.outputs.id }}

    steps:
      - name: "🆔 Generate session"
        id: session
        run: |
          ID="stale-$(date +%Y%m%d%H%M%S)"
          echo "id=${ID}" >> "$GITHUB_OUTPUT"

      - name: "📝 Detect comment command trigger"
        id: comment_check
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body   = context.payload.comment?.body?.trim() || "";
            const sender = context.payload.comment?.user?.login || "";

            // Only respond to maintainers
            const maintainerResp = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              username: sender,
            }).catch(() => ({ data: { permission: "none" } }));

            const permission = maintainerResp.data.permission;
            const isMaintainer = ["admin","maintain","write"].includes(permission);

            const COMMANDS = {
              "/stale force":   "force_stale",
              "/stale exempt":  "exempt",
              "/stale unexempt":"unexempt",
              "/stale close":   "close",
              "/stale keep":    "keep_open",
              "/stale ping":    "ping_author",
              "/stale lock":    "lock",
              "/stale unlock":  "unlock",
            };

            let command = "";
            for (const [trigger, cmd] of Object.entries(COMMANDS)) {
              if (body.toLowerCase().startsWith(trigger)) {
                command = cmd;
                break;
              }
            }

            if (command && isMaintainer) {
              core.setOutput("triggered", "true");
              core.setOutput("command", command);
              console.log(`✅ Command detected: ${command} by ${sender}`);
            } else {
              core.setOutput("triggered", "false");
              core.setOutput("command", "");
            }

      - name: "🚦 Gate — determine if workflow should run"
        id: gate
        run: |
          EVENT="${{ github.event_name }}"
          MODE="${MODE}"
          TRIGGERED="${{ steps.comment_check.outputs.triggered }}"

          SHOULD_RUN="true"

          # For comment events, only run if a valid command was detected
          if [[ "${EVENT}" == "issue_comment" && "${TRIGGERED}" != "true" ]]; then
            SHOULD_RUN="false"
          fi

          # Report-only never gates
          [[ "${MODE}" == "report-only" ]] && SHOULD_RUN="true"

          echo "should_run=${SHOULD_RUN}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Gate::should_run=${SHOULD_RUN} mode=${MODE}"

      - name: "🎛️ Resolve effective mode"
        id: mode
        run: |
          INPUT_MODE="${MODE}"
          SCHEDULE="${{ github.event.schedule }}"

          # Override mode based on schedule pattern
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            case "${SCHEDULE}" in
              "0 8 * * 0") INPUT_MODE="standard"    ;;  # Deep scan Sunday
              "0 4 * * 6") INPUT_MODE="lock-old"    ;;  # Lock sweep Saturday
              *)            INPUT_MODE="standard"    ;;
            esac
          fi

          echo "mode=${INPUT_MODE}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Mode::${INPUT_MODE}"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Handle comment commands immediately
  # ───────────────────────────────────────────────────────────────────────────
  handle-command:
    name: "⚡ Command · ${{ needs.preflight.outputs.comment_command }}"
    needs: preflight
    if: |
      needs.preflight.outputs.triggered_by_comment == 'true' &&
      needs.preflight.outputs.comment_command != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "⚡ Execute maintainer command"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const command   = "${{ needs.preflight.outputs.comment_command }}";
            const issueNum  = context.payload.issue?.number;
            const isPR      = !!context.payload.issue?.pull_request;
            const itemType  = isPR ? "PR" : "issue";
            const sender    = context.payload.comment?.user?.login;

            if (!issueNum) {
              core.warning("No issue number found");
              return;
            }

            const reactions = {
              success: "+1",
              error:   "-1",
              info:    "eyes",
            };

            async function addReaction(reaction) {
              await github.rest.reactions.createForIssueComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: context.payload.comment.id,
                content:    reaction,
              }).catch(() => {});
            }

            async function addLabel(label) {
              try {
                // Ensure label exists
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  name:  label,
                }).catch(async () => {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo:  context.repo.repo,
                    name:  label,
                    color: "ededed",
                  });
                });
                await github.rest.issues.addLabels({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  issue_number: issueNum,
                  labels:      [label],
                });
              } catch (e) {
                core.warning(`Failed to add label '${label}': ${e.message}`);
              }
            }

            async function removeLabel(label) {
              await github.rest.issues.removeLabel({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                issue_number: issueNum,
                name:        label,
              }).catch(() => {});
            }

            async function postComment(body) {
              await github.rest.issues.createComment({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                issue_number: issueNum,
                body,
              });
            }

            // ── Execute command ─────────────────────────────────────────
            try {
              switch (command) {

                case "force_stale":
                  await addLabel("stale");
                  await removeLabel("stale:warning");
                  await postComment(
                    `🧹 **Stale Override**\n\n`+
                    `This ${itemType} has been manually marked as stale by @${sender}.\n`+
                    `It will be closed in ${process.env.DAYS_CLOSE} days if there is no activity.\n\n`+
                    `> To keep this open, comment \`/stale keep\` or add activity.`
                  );
                  await addReaction(reactions.success);
                  break;

                case "exempt":
                  await addLabel("pinned");
                  await removeLabel("stale");
                  await removeLabel("stale:warning");
                  await postComment(
                    `📌 **Stale Exemption Applied**\n\n`+
                    `This ${itemType} has been exempted from staleness by @${sender}.\n`+
                    `It has been pinned and will not be automatically closed.`
                  );
                  await addReaction(reactions.success);
                  break;

                case "unexempt":
                  await removeLabel("pinned");
                  await postComment(
                    `📌 **Stale Exemption Removed**\n\n`+
                    `This ${itemType} is now subject to normal staleness rules again.`
                  );
                  await addReaction(reactions.info);
                  break;

                case "close":
                  await github.rest.issues.update({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    issue_number: issueNum,
                    state:       "closed",
                    state_reason: "not_planned",
                  });
                  await addLabel("stale:closed");
                  await postComment(
                    `🔒 **Manually Closed**\n\n`+
                    `This ${itemType} was closed by @${sender}.\n`+
                    `If you believe this was closed in error, please reopen with additional context.`
                  );
                  await addReaction(reactions.success);
                  break;

                case "keep_open":
                  await removeLabel("stale");
                  await removeLabel("stale:warning");
                  await postComment(
                    `🔄 **Kept Open**\n\n`+
                    `Stale status cleared by @${sender}. The staleness timer has been reset.\n`+
                    `Please update this ${itemType} with current status when possible.`
                  );
                  await addReaction(reactions.success);
                  break;

                case "ping_author": {
                  const issue = await github.rest.issues.get({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    issue_number: issueNum,
                  });
                  const author = issue.data.user?.login;
                  await postComment(
                    `👋 @${author} — This ${itemType} has been flagged as potentially stale.\n\n`+
                    `Could you please provide an update on the current status? Any of the following would help:\n\n`+
                    `- ✅ Confirm this is still relevant\n`+
                    `- 🔄 Provide an update on progress\n`+
                    `- ❌ Close if no longer needed\n\n`+
                    `_Pinged by @${sender}_`
                  );
                  await addReaction(reactions.info);
                  break;
                }

                case "lock":
                  await github.rest.issues.lock({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    issue_number: issueNum,
                    lock_reason: "resolved",
                  });
                  await postComment(
                    `🔒 **Locked**\n\n`+
                    `This ${itemType} has been locked by @${sender}.`
                  );
                  await addReaction(reactions.success);
                  break;

                case "unlock":
                  await github.rest.issues.unlock({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    issue_number: issueNum,
                  });
                  await postComment(
                    `🔓 **Unlocked**\n\n`+
                    `This ${itemType} has been unlocked by @${sender}.`
                  );
                  await addReaction(reactions.success);
                  break;

                default:
                  core.warning(`Unknown command: ${command}`);
                  await addReaction(reactions.error);
              }
            } catch (err) {
              core.error(`Command execution failed: ${err.message}`);
              await addReaction(reactions.error);
            }

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — Core stale management engine
  # ───────────────────────────────────────────────────────────────────────────
  stale-engine:
    name: "🧹 Engine · Stale Sweep (${{ needs.preflight.outputs.run_mode }})"
    needs: preflight
    if: |
      needs.preflight.outputs.should_run == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📦 Setup Python analytics"
        run: |
          pip3 install --quiet --user \
            PyGithub==2.4.0 \
            matplotlib==3.9.2 \
            pandas==2.2.3 \
            rich==13.9.2 \
            tabulate==0.9.0 \
            2>/dev/null || true

          sudo apt-get install -y --no-install-recommends \
            jq sqlite3 2>/dev/null || true

          mkdir -p "${WORK_DIR}"

      - name: "🏗️ Initialize analytics database"
        run: |
          sqlite3 "${DB_PATH}" << 'SQL'
          CREATE TABLE IF NOT EXISTS stale_actions (
            id           TEXT PRIMARY KEY,
            session_id   TEXT,
            item_type    TEXT,
            item_number  INTEGER,
            item_title   TEXT,
            action       TEXT,
            reason       TEXT,
            labels_before TEXT,
            labels_after TEXT,
            days_inactive INTEGER,
            priority     TEXT,
            category     TEXT,
            author       TEXT,
            dry_run      INTEGER DEFAULT 0,
            created_at   TEXT DEFAULT (datetime('now'))
          );
          CREATE TABLE IF NOT EXISTS stale_sessions (
            id           TEXT PRIMARY KEY,
            mode         TEXT,
            issues_scanned INTEGER DEFAULT 0,
            prs_scanned  INTEGER DEFAULT 0,
            marked_stale INTEGER DEFAULT 0,
            warned       INTEGER DEFAULT 0,
            closed       INTEGER DEFAULT 0,
            locked       INTEGER DEFAULT 0,
            exempted     INTEGER DEFAULT 0,
            duration_s   INTEGER DEFAULT 0,
            created_at   TEXT DEFAULT (datetime('now'))
          );
          SQL
          echo "  ✅ Database ready: ${DB_PATH}"

      - name: "🧹 Execute intelligent stale sweep"
        id: sweep
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require("child_process");
            const fs   = require("fs");
            const path = require("path");

            const MODE     = process.env.MODE || "standard";
            const DRY_RUN  = process.env.DRY_RUN === "true";
            const WORK_DIR = process.env.WORK_DIR;

            // ── Configuration ─────────────────────────────────────────────
            const CONFIG = {
              standard: {
                daysStaleIssues: parseInt(process.env.DAYS_STALE_ISSUES || "60"),
                daysStalesPRs:   parseInt(process.env.DAYS_STALE_PRS    || "30"),
                daysClose:       parseInt(process.env.DAYS_CLOSE         || "14"),
                daysLock:        parseInt(process.env.DAYS_LOCK          || "180"),
              },
              aggressive: {
                daysStaleIssues: 30,
                daysStalesPRs:   14,
                daysClose:       7,
                daysLock:        90,
              },
              gentle: {
                daysStaleIssues: 90,
                daysStalesPRs:   60,
                daysClose:       21,
                daysLock:        365,
              },
            };

            const cfg = CONFIG[MODE] || CONFIG.standard;

            // Category-specific stale days
            const CATEGORY_DAYS = {
              bug:           parseInt(process.env.DAYS_BUG_STALE      || "90"),
              "feature-request": parseInt(process.env.DAYS_FEATURE_STALE || "60"),
              question:      parseInt(process.env.DAYS_QUESTION_STALE || "30"),
              documentation: parseInt(process.env.DAYS_DOCS_STALE     || "45"),
              security:      999,
              critical:      999,
            };

            // Exempt labels
            const EXEMPT_LABELS = new Set([
              "pinned","security","funded","wip","blocked","in-progress",
              "hold","do-not-close","priority:critical","priority:high",
              "good first issue","help wanted","priority:urgent",
              "needs-decision","stale:locked",
            ]);

            const STALE_MESSAGES = {
              issue: (days) =>
                `## 🧹 Stale Issue Notice\n\n`+
                `This issue has been automatically marked as **stale** because it has had `+
                `no activity for **${days} days**.\n\n`+
                `### What happens next?\n`+
                `- ⏳ It will be **closed in ${process.env.DAYS_CLOSE} days** if there is no further activity\n`+
                `- 💬 Any comment will reset the staleness timer\n`+
                `- 📌 Add the \`pinned\` label to prevent automatic closure\n\n`+
                `### Still relevant?\n`+
                `If this issue is still relevant, please:\n`+
                `1. Leave a comment confirming it's still needed\n`+
                `2. Provide any updates or additional context\n`+
                `3. Add \`in-progress\` label if you're working on it\n\n`+
                `---\n`+
                `*🤖 This message was generated by the ASH v5.0 OMEGA stale management engine.*`,

              pr: (days) =>
                `## 🧹 Stale Pull Request Notice\n\n`+
                `This PR has been automatically marked as **stale** because it has had `+
                `no activity for **${days} days**.\n\n`+
                `### What happens next?\n`+
                `- ⏳ It will be **closed in ${process.env.DAYS_CLOSE} days** if there is no further activity\n`+
                `- 🔄 Pushing new commits will reset the staleness timer\n`+
                `- 👀 Requesting a review will reset the timer\n\n`+
                `### To keep this PR alive:\n`+
                `1. Rebase on latest \`main\` branch\n`+
                `2. Address any review comments\n`+
                `3. Comment with a status update\n\n`+
                `---\n`+
                `*🤖 ASH v5.0 OMEGA stale management engine*`,

              close_issue: () =>
                `## 🔒 Issue Closed — Inactivity\n\n`+
                `This issue has been automatically closed due to prolonged inactivity.\n\n`+
                `### 🔄 Need to reopen?\n`+
                `If this issue is still relevant, please reopen it with:\n`+
                `- 📋 Updated reproduction steps\n`+
                `- 🔖 Current version information  \n`+
                `- 💡 Any new context or findings\n\n`+
                `We review all reopened issues. Thank you for your patience! 🙏\n\n`+
                `---\n`+
                `*🤖 ASH v5.0 OMEGA stale management engine*`,

              close_pr: () =>
                `## 🔒 Pull Request Closed — Inactivity\n\n`+
                `This PR has been automatically closed due to prolonged inactivity.\n\n`+
                `### 🔄 Want to continue this work?\n`+
                `1. Checkout a new branch from latest \`main\`\n`+
                `2. Cherry-pick or rebase your commits\n`+
                `3. Open a new PR with updated changes\n\n`+
                `Thank you for your contribution! 🙏\n\n`+
                `---\n`+
                `*🤖 ASH v5.0 OMEGA stale management engine*`,
            };

            // ── Utility functions ──────────────────────────────────────────
            function daysSince(dateStr) {
              const date = new Date(dateStr);
              return Math.floor((Date.now() - date.getTime()) / 86400000);
            }

            function getCategory(labels) {
              const labelNames = labels.map(l => l.name.toLowerCase());
              if (labelNames.some(l => l.includes("bug")))           return "bug";
              if (labelNames.some(l => l.includes("feature")))       return "feature-request";
              if (labelNames.some(l => l.includes("question")))      return "question";
              if (labelNames.some(l => l.includes("doc")))           return "documentation";
              if (labelNames.some(l => l.includes("security")))      return "security";
              if (labelNames.some(l => l.includes("critical")))      return "critical";
              return "general";
            }

            function getStaleDays(labels, isIssue) {
              const cat  = getCategory(labels);
              const base = isIssue ? cfg.daysStaleIssues : cfg.daysStalesPRs;
              return CATEGORY_DAYS[cat] || base;
            }

            function isExempt(labels) {
              return labels.some(l => EXEMPT_LABELS.has(l.name.toLowerCase()));
            }

            function getPriority(labels) {
              const names = labels.map(l => l.name.toLowerCase());
              if (names.includes("priority:critical")) return "critical";
              if (names.includes("priority:high"))     return "high";
              if (names.includes("priority:medium"))   return "medium";
              return "low";
            }

            async function ensureLabel(name, color = "ededed", description = "") {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  name,
                });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  name,
                  color,
                  description,
                }).catch(() => {});
              }
            }

            // ── Pre-create labels ──────────────────────────────────────────
            await ensureLabel("stale",         "e4e669", "🧹 No activity for a while");
            await ensureLabel("stale:warning",  "f5a623", "⚠️ Approaching stale threshold");
            await ensureLabel("stale:closed",   "b60205", "🔒 Closed due to inactivity");
            await ensureLabel("stale:locked",   "222222", "🔓 Locked after closure");

            // ── Statistics tracking ────────────────────────────────────────
            const stats = {
              issues_scanned: 0,
              prs_scanned: 0,
              marked_stale: 0,
              warned: 0,
              closed: 0,
              locked: 0,
              exempted: 0,
              skipped: 0,
              actions: [],
            };

            const SESSION_ID = `stale-${Date.now()}`;

            // ── Fetch all open issues and PRs ─────────────────────────────
            console.log("━".repeat(60));
            console.log("  🧹 ASH Stale Engine — Mode: " + MODE.toUpperCase());
            console.log("  📊 Config:", JSON.stringify(cfg, null, 2));
            console.log("  🚫 Dry Run:", DRY_RUN);
            console.log("━".repeat(60));

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo:  context.repo.repo,
                state: "open",
                per_page: 100,
              }
            );

            console.log(`\n  📋 Fetched ${issues.length} open items`);

            for (const item of issues) {
              const isPR      = !!item.pull_request;
              const itemType  = isPR ? "pr" : "issue";
              const lastUpdate= item.updated_at;
              const daysOld   = daysSince(lastUpdate);
              const labels    = item.labels || [];
              const labelNames= labels.map(l => l.name);
              const staleDays = getStaleDays(labels, !isPR);
              const category  = getCategory(labels);
              const priority  = getPriority(labels);
              const exempt    = isExempt(labels);

              if (isPR) stats.prs_scanned++;
              else      stats.issues_scanned++;

              const logPrefix = `  [${item.number.toString().padStart(5)}] ${isPR?"PR":"IS"}`;

              // ── Skip exempted items ─────────────────────────────────────
              if (exempt) {
                stats.exempted++;
                console.log(`${logPrefix} ⏭️  EXEMPT — ${item.title?.slice(0,50)}`);
                continue;
              }

              const isAlreadyStale = labelNames.includes("stale");
              const warnThreshold  = staleDays - parseInt(process.env.DAYS_WARN_BEFORE_STALE || "7");

              // ── Lock old closed issues ──────────────────────────────────
              if (MODE === "lock-old") {
                // Skip — handled separately
                continue;
              }

              // ── Close stale items ──────────────────────────────────────
              if (isAlreadyStale && daysOld >= staleDays + cfg.daysClose) {
                console.log(`${logPrefix} 🔒 CLOSING — ${daysOld}d stale — ${item.title?.slice(0,40)}`);
                if (!DRY_RUN) {
                  await github.rest.issues.createComment({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    issue_number: item.number,
                    body: STALE_MESSAGES[isPR ? "close_pr" : "close_issue"](),
                  }).catch(e => core.warning(`Comment failed: ${e.message}`));

                  await github.rest.issues.update({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    issue_number: item.number,
                    state:       "closed",
                    state_reason: "not_planned",
                  }).catch(e => core.warning(`Close failed: ${e.message}`));

                  await github.rest.issues.addLabels({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    issue_number: item.number,
                    labels:      ["stale:closed"],
                  }).catch(() => {});

                  await github.rest.issues.removeLabel({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    issue_number: item.number,
                    name:        "stale",
                  }).catch(() => {});
                }
                stats.closed++;
                stats.actions.push({
                  type:     itemType,
                  number:   item.number,
                  action:   "closed",
                  days_old: daysOld,
                  title:    item.title,
                  category, priority,
                });
                continue;
              }

              // ── Mark as stale ──────────────────────────────────────────
              if (!isAlreadyStale && daysOld >= staleDays) {
                console.log(`${logPrefix} ⚠️  STALE   — ${daysOld}d > ${staleDays}d — ${item.title?.slice(0,40)}`);
                if (!DRY_RUN) {
                  await github.rest.issues.addLabels({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    issue_number: item.number,
                    labels:      ["stale"],
                  }).catch(() => {});

                  await github.rest.issues.removeLabel({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    issue_number: item.number,
                    name:        "stale:warning",
                  }).catch(() => {});

                  await github.rest.issues.createComment({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    issue_number: item.number,
                    body: STALE_MESSAGES[itemType](staleDays),
                  }).catch(e => core.warning(`Comment failed: ${e.message}`));
                }
                stats.marked_stale++;
                stats.actions.push({
                  type: itemType, number: item.number,
                  action: "stale", days_old: daysOld,
                  title: item.title, category, priority,
                });
                continue;
              }

              // ── Warn approaching stale ─────────────────────────────────
              if (!isAlreadyStale && daysOld >= warnThreshold &&
                  !labelNames.includes("stale:warning")) {
                const daysLeft = staleDays - daysOld;
                console.log(`${logPrefix} 💛 WARNING — ${daysLeft}d until stale — ${item.title?.slice(0,40)}`);
                if (!DRY_RUN) {
                  await github.rest.issues.addLabels({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    issue_number: item.number,
                    labels:      ["stale:warning"],
                  }).catch(() => {});
                }
                stats.warned++;
                stats.actions.push({
                  type: itemType, number: item.number,
                  action: "warned", days_old: daysOld,
                  title: item.title, category, priority,
                });
                continue;
              }

              // ── Remove stale if recently updated ───────────────────────
              if (isAlreadyStale && daysOld < staleDays - 2) {
                console.log(`${logPrefix} ✅ REVIVED — ${daysOld}d < ${staleDays}d — ${item.title?.slice(0,40)}`);
                if (!DRY_RUN) {
                  await github.rest.issues.removeLabel({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    issue_number: item.number,
                    name:        "stale",
                  }).catch(() => {});
                  await github.rest.issues.removeLabel({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    issue_number: item.number,
                    name:        "stale:warning",
                  }).catch(() => {});
                }
                stats.actions.push({
                  type: itemType, number: item.number,
                  action: "revived", days_old: daysOld,
                  title: item.title, category, priority,
                });
                continue;
              }

              stats.skipped++;
              console.log(`${logPrefix} ⏭️  SKIP    — ${daysOld}d / ${staleDays}d — ${item.title?.slice(0,40)}`);
            }

            // ── Lock closed items ─────────────────────────────────────────
            if (["standard","lock-old"].includes(MODE)) {
              const closedItems = await github.paginate(
                github.rest.issues.listForRepo,
                {
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  state: "closed",
                  per_page: 100,
                }
              );

              for (const item of closedItems) {
                if (item.locked) continue;
                const daysClosed = daysSince(item.closed_at || item.updated_at);
                if (daysClosed < cfg.daysLock) continue;
                const labelNames = (item.labels || []).map(l => l.name);
                if (labelNames.includes("stale:locked")) continue;

                console.log(`  [${item.number}] 🔒 LOCKING — closed ${daysClosed}d ago`);
                if (!DRY_RUN) {
                  await github.rest.issues.lock({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    issue_number: item.number,
                    lock_reason: "resolved",
                  }).catch(e => core.warning(`Lock failed #${item.number}: ${e.message}`));

                  await github.rest.issues.addLabels({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    issue_number: item.number,
                    labels:      ["stale:locked"],
                  }).catch(() => {});
                }
                stats.locked++;
              }
            }

            // ── Summary ───────────────────────────────────────────────────
            console.log("\n" + "═".repeat(60));
            console.log("  📊 SWEEP COMPLETE");
            console.log("═".repeat(60));
            console.log(`  Issues scanned:  ${stats.issues_scanned}`);
            console.log(`  PRs scanned:     ${stats.prs_scanned}`);
            console.log(`  Marked stale:    ${stats.marked_stale}`);
            console.log(`  Warned:          ${stats.warned}`);
            console.log(`  Closed:          ${stats.closed}`);
            console.log(`  Locked:          ${stats.locked}`);
            console.log(`  Exempted:        ${stats.exempted}`);
            console.log(`  Skipped:         ${stats.skipped}`);
            console.log("═".repeat(60));

            // Write stats to env
            const statsFile = `${WORK_DIR}/stats.json`;
            fs.mkdirSync(WORK_DIR, { recursive: true });
            fs.writeFileSync(statsFile, JSON.stringify({
              session_id:     SESSION_ID,
              mode:           MODE,
              dry_run:        DRY_RUN,
              ...stats,
              timestamp:      new Date().toISOString(),
            }, null, 2));

            core.setOutput("issues_scanned",  stats.issues_scanned);
            core.setOutput("prs_scanned",     stats.prs_scanned);
            core.setOutput("marked_stale",    stats.marked_stale);
            core.setOutput("warned",          stats.warned);
            core.setOutput("closed",          stats.closed);
            core.setOutput("locked",          stats.locked);
            core.setOutput("session_id",      SESSION_ID);

      - name: "📊 Generate analytics report"
        run: |
          STATS_FILE="${WORK_DIR}/stats.json"
          [[ -f "${STATS_FILE}" ]] || echo '{}' > "${STATS_FILE}"

          python3 << 'PYTHON_EOF'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          WORK_DIR = Path(os.environ["WORK_DIR"])

          try:
              with open(WORK_DIR / "stats.json") as f:
                  stats = json.load(f)
          except Exception:
              stats = {}

          mode    = stats.get("mode","standard")
          dry_run = stats.get("dry_run", False)

          md = [
              f"# 🧹 ASH Stale Management Report",
              f"",
              f"> **Mode:** `{mode.upper()}`  "
              f"{'&nbsp;·&nbsp; 🔵 **DRY RUN**' if dry_run else ''}  "
              f"&nbsp;·&nbsp;  `{stats.get('timestamp','')}`",
              f"",
              f"## 📊 Sweep Summary",
              f"",
              f"| Category | Count |",
              f"|----------|-------|",
              f"| 🔍 Issues Scanned  | `{stats.get('issues_scanned',0)}` |",
              f"| 🔍 PRs Scanned     | `{stats.get('prs_scanned',0)}` |",
              f"| ⚠️  Marked Stale   | `{stats.get('marked_stale',0)}` |",
              f"| 💛 Warned          | `{stats.get('warned',0)}` |",
              f"| 🔒 Closed          | `{stats.get('closed',0)}` |",
              f"| 🔐 Locked          | `{stats.get('locked',0)}` |",
              f"| 📌 Exempted        | `{stats.get('exempted',0)}` |",
              f"",
          ]

          actions = stats.get("actions", [])
          if actions:
              md += [
                  f"## 📋 Actions Taken",
                  f"",
                  f"| # | Type | Action | Days | Priority | Category |",
                  f"|---|------|--------|------|----------|----------|",
              ]
              ACTION_ICON = {
                  "stale":   "⚠️",
                  "warned":  "💛",
                  "closed":  "🔒",
                  "revived": "✅",
                  "locked":  "🔐",
              }
              for a in actions[:50]:
                  icon = ACTION_ICON.get(a.get("action",""), "📋")
                  md.append(
                      f"| `#{a.get('number','')}` "
                      f"| `{a.get('type','?')}` "
                      f"| {icon} `{a.get('action','')}` "
                      f"| `{a.get('days_old',0)}d` "
                      f"| `{a.get('priority','?')}` "
                      f"| `{a.get('category','?')}` |"
                  )
              md.append("")

          md += [
              f"---",
              f"",
              f"*Generated by ASH v5.0 OMEGA Stale Management Engine*",
          ]

          report = "\n".join(md)
          with open(WORK_DIR / "report.md", "w") as f:
              f.write(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "w") as f:
              f.write(report)

          print("  ✅ Report generated")
          PYTHON_EOF

      - name: "🔔 Discord notification"
        if: |
          github.event.inputs.notify_discord != 'false' &&
          steps.sweep.outputs.marked_stale != '0' ||
          steps.sweep.outputs.closed != '0'
        continue-on-error: true
        run: |
          STALE="${{ steps.sweep.outputs.marked_stale }}"
          CLOSED="${{ steps.sweep.outputs.closed }}"
          LOCKED="${{ steps.sweep.outputs.locked }}"
          WARNED="${{ steps.sweep.outputs.warned }}"
          MODE="${MODE}"

          [[ -z "${DISCORD_WEBHOOK_STALE:-}" ]] && {
            echo "  ℹ️ DISCORD_WEBHOOK_STALE not set"
            exit 0
          }

          PAYLOAD=$(cat << EOF
          {
            "username": "ASH Stale Manager",
            "avatar_url": "https://raw.githubusercontent.com/${{ github.repository }}/main/assets/brand/logos/ash-logo-256.png",
            "embeds": [{
              "title": "🧹 Stale Sweep Complete — ${MODE^^}",
              "color": 14987585,
              "fields": [
                {"name": "⚠️ Marked Stale", "value": "\`${STALE}\`",  "inline": true},
                {"name": "💛 Warned",        "value": "\`${WARNED}\`", "inline": true},
                {"name": "🔒 Closed",        "value": "\`${CLOSED}\`", "inline": true},
                {"name": "🔐 Locked",        "value": "\`${LOCKED}\`", "inline": true},
                {"name": "📅 Mode",          "value": "\`${MODE}\`",   "inline": true}
              ],
              "footer": {"text": "ASH Dotfiles v5.0 OMEGA"},
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          EOF
          )

          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${DISCORD_WEBHOOK_STALE}" && \
            echo "  ✅ Discord notified" || \
            echo "  ⚠️ Discord failed"
        env:
          DISCORD_WEBHOOK_STALE: ${{ secrets.DISCORD_WEBHOOK_STALE }}

      - name: "📤 Upload report"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "stale-report-${{ needs.preflight.outputs.session_id }}"
          path: "${{ env.WORK_DIR }}/"
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4 — Handle issue/PR reopening (remove stale labels)
  # ───────────────────────────────────────────────────────────────────────────
  handle-reopen:
    name: "🔄 Revival · Clear Stale on Reopen"
    needs: preflight
    if: |
      github.event_name == 'issues' ||
      github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "🔄 Remove stale labels on revival"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const eventName = context.eventName;
            const action    = context.payload.action;
            const item      = context.payload.issue || context.payload.pull_request;

            if (!item) return;

            const labelsToRemove = ["stale", "stale:warning", "stale:closed"];
            const currentLabels  = (item.labels || []).map(l => l.name);

            console.log(`  🔄 ${action.toUpperCase()} — #${item.number}`);
            console.log(`  📋 Current labels: ${currentLabels.join(", ")}`);

            for (const label of labelsToRemove) {
              if (currentLabels.includes(label)) {
                await github.rest.issues.removeLabel({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  issue_number: item.number,
                  name:        label,
                }).catch(e => core.warning(`Could not remove '${label}': ${e.message}`));
                console.log(`  ✅ Removed label: ${label}`);
              }
            }

            // Post welcome back comment if it was stale
            if (action === "reopened" && currentLabels.includes("stale:closed")) {
              await github.rest.issues.createComment({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                issue_number: item.number,
                body: [
                  `## 🎉 Welcome Back!`,
                  ``,
                  `This ${item.pull_request ? "PR" : "issue"} has been reopened.`,
                  `Stale labels have been automatically cleared.`,
                  ``,
                  `Please provide any relevant updates to help us triage this efficiently.`,
                  ``,
                  `Thank you for your continued contribution! 🙏`,
                ].join("\n"),
              }).catch(() => {});
            }