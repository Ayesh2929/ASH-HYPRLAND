name: "🛡️ Push Protection"
on:
  push:
    branches: [main, develop, 'release/**']

permissions:
  contents: read

jobs:
  push-guard:
    name: "🛡️ Push Guard"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: "🚫 Block WIP commits on main"
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -iE '\[WIP\]|fixup!|squash!|HACK|TODO:.*fix' > /dev/null; then
            echo "❌ WIP/fixup commits are not allowed on main"
            echo "Commit message: $COMMIT_MSG"
            exit 1
          fi
          echo "✅ Commit message is clean"

      - name: "📏 Check file sizes"
        run: |
          set -euo pipefail
          MAX_SIZE_KB=5120
          OVERSIZED=$(find . -type f -not -path './.git/*' -size +${MAX_SIZE_KB}k 2>/dev/null || true)
          if [[ -n "$OVERSIZED" ]]; then
            echo "⚠️ Files exceeding ${MAX_SIZE_KB}KB:" >> "$GITHUB_STEP_SUMMARY"
            echo "$OVERSIZED" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "🔒 Check for binary files in unexpected paths"
        run: |
          set -euo pipefail
          ALLOWED_BINARY_PATHS="assets/|themes/presets/.*/wallpaper|docker/"
          BINARIES=$(git diff --name-only HEAD~1 HEAD --diff-filter=A 2>/dev/null | while read f; do
            if [[ -f "$f" ]] && file "$f" 2>/dev/null | grep -qE 'executable|binary|ELF|Mach-O'; then
              if ! echo "$f" | grep -qE "$ALLOWED_BINARY_PATHS"; then
                echo "$f"
              fi
            fi
          done || true)
          if [[ -n "$BINARIES" ]]; then
            echo "⚠️ Unexpected binary files added:" >> "$GITHUB_STEP_SUMMARY"
            echo "$BINARIES" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "📊 Push summary"
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | wc -l || echo 0)
          ADDED=$(git diff --name-only HEAD~1 HEAD --diff-filter=A 2>/dev/null | wc -l || echo 0)
          DELETED=$(git diff --name-only HEAD~1 HEAD --diff-filter=D 2>/dev/null | wc -l || echo 0)
          echo "## 🛡️ Push Protection" >> "$GITHUB_STEP_SUMMARY"
          echo "- Changed files: $CHANGED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Added: $ADDED, Deleted: $DELETED" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ All checks passed" >> "$GITHUB_STEP_SUMMARY"
