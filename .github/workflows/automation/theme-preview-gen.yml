          W = 100
          H = 10

          # Background bar
          ax.add_patch(patches.Rectangle(
              (0,0), W, H, facecolor=h("mantle"), edgecolor="none"
          ))

          def pill(x, y, w, h_box, color, text, text_color=None, icon=None):
              if text_color is None: text_color = h("text")
              box = patches.FancyBboxPatch(
                  (x, y), w, h_box,
                  boxstyle="round,pad=0.3",
                  facecolor=color, edgecolor="none",
