          # ── Left section: workspaces ──────────────────────────────
          WS_DATA = [
              (1, True),  (2, False), (3, True),
              (4, False), (5, False),
          ]
          x = 1.0
          for ws_num, active in WS_DATA:
              bg_col = h("mauve") if active else h("surface0")
              tc_col = h("crust") if active else h("text")
              pill(x, 1.5, 3.2, 7, bg_col, str(ws_num), tc_col)
              x += 3.6
          # Active window
          pill(x+0.5, 1.5, 16, 7, h("surface0"), "  kitty — ~/dotfiles", h("text"))

          # ── Center: clock ─────────────────────────────────────────
          now = datetime.datetime.now()
          time_str = now.strftime("%H:%M")
          date_str = now.strftime("%a %d %b")
          pill(38, 1.5, 24, 7, h("surface0"),
               f"📅 {date_str}    🕐 {time_str}", h("text"))

          # ── Right section: system indicators ─────────────────────
          STATUS_ITEMS = [
