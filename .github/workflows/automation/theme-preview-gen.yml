              (h("green"),  "🔋 85%",   "Bat"),
              (h("mauve"),  "💻 12%",   "CPU"),
              (h("sapphire"),"🧠 4.2G", "RAM"),
              (h("teal"),   "🌐 Up",    "Net"),
              (h("yellow"), "🎮 Default","Mode"),
              (h("peach"),  THEME_NAME[:12], "🎨"),
          ]
          x = 63.0
          for color, text, label in STATUS_ITEMS:
              w_pill = max(5, len(text) * 0.9)
              if x + w_pill > 99: break
              pill(x, 1.5, w_pill, 7, color + "30", text, color)
              x += w_pill + 0.6

          plt.tight_layout(pad=0)
          plt.savefig(OUTPUT, dpi=200, bbox_inches="tight",
                      facecolor=h("mantle"))
          plt.close()
          print(f"  ✅ Waybar preview saved: {OUTPUT}")
          WAYBAR_EOF

