name: "🎨 Theme Preview · Ultra Generation Engine"

on:
  # ── Theme changes ─────────────────────────────────────────────────────────
  push:
    branches: [main, develop]
    paths:
      - "themes/presets/**"
      - "themes/schema/**"
      - ".github/workflows/automation/theme-preview-gen.yml"

  pull_request:
    branches: [main]
    paths:
      - "themes/presets/**"

  # ── Manual generation ─────────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      theme_filter:
        description: "Theme name filter (empty = all changed)"
        required: false
        default: ""
        type: string
      preview_types:
        description: "Preview types to generate"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - swatch-only
          - terminal-only
          - desktop-only
          - card-only
          - accessibility-only
          - animated-only
      quality:
        description: "Output quality preset"
        required: false
        default: "production"
        type: choice
        options:
          - draft       # Fast, lower quality
          - standard    # Balanced
          - production  # Full quality
          - ultra       # Maximum detail
      force_regenerate:
        description: "Force regenerate all (ignore cache)"
        required: false
        default: false
        type: boolean
      commit_previews:
        description: "Commit generated previews to repo"
        required: false
        default: true
        type: boolean
      upload_cdn:
        description: "Upload to CDN/Release assets"
        required: false
        default: false
        type: boolean

  # ── Scheduled regeneration ────────────────────────────────────────────────
  schedule:
    - cron: "0 5 * * 0"      # Weekly Sunday 05:00 UTC — full regeneration

# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: "theme-preview-${{ github.ref }}-${{ github.event_name }}"
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

# ─────────────────────────────────────────────────────────────────────────────
env:
  PREVIEW_VERSION: "5.0.0"
  WORK_DIR: "${{ github.workspace }}/.preview-engine"
  OUTPUT_DIR: "${{ github.workspace }}/assets/screenshots/previews"
  THEME_DIR: "${{ github.workspace }}/themes/presets"

  # ── Quality presets ────────────────────────────────────────────────────────
  QUALITY_PRESET: "${{ github.event.inputs.quality || 'production' }}"
  PREVIEW_TYPES: "${{ github.event.inputs.preview_types || 'all' }}"
  FORCE_REGEN: "${{ github.event.inputs.force_regenerate || 'false' }}"
  COMMIT_PREVIEWS: "${{ github.event.inputs.commit_previews || 'true' }}"
  THEME_FILTER: "${{ github.event.inputs.theme_filter || '' }}"

  # ── Image dimensions per quality ──────────────────────────────────────────
  SWATCH_W: "1200"
  SWATCH_H: "800"
  TERMINAL_W: "1400"
  TERMINAL_H: "900"
  DESKTOP_W: "2560"
  DESKTOP_H: "1440"
  CARD_W: "600"
  CARD_H: "400"
  WAYBAR_W: "2560"
  WAYBAR_H: "60"

  # ── WebP quality ──────────────────────────────────────────────────────────
  WEBP_QUALITY_DRAFT: "60"
  WEBP_QUALITY_STANDARD: "80"
  WEBP_QUALITY_PRODUCTION: "90"
  WEBP_QUALITY_ULTRA: "100"

# ═════════════════════════════════════════════════════════════════════════════
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Detect changed themes & build generation matrix
  # ───────────────────────────────────────────────────────────────────────────
  detect-themes:
    name: "🔍 Detect · Changed Themes"
    runs-on: ubuntu-24.04
    outputs:
      themes_json: ${{ steps.matrix.outputs.themes }}
      theme_count: ${{ steps.matrix.outputs.count }}
      has_themes:  ${{ steps.matrix.outputs.has_themes }}
      session_id:  ${{ steps.session.outputs.id }}
      webp_quality: ${{ steps.quality.outputs.webp_q }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🆔 Session"
        id: session
        run: |
          echo "id=preview-$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: "🎚️ Resolve quality settings"
        id: quality
        run: |
          case "${QUALITY_PRESET}" in
            draft)      WEBP_Q="${WEBP_QUALITY_DRAFT}"      ;;
            standard)   WEBP_Q="${WEBP_QUALITY_STANDARD}"   ;;
            production) WEBP_Q="${WEBP_QUALITY_PRODUCTION}" ;;
            ultra)      WEBP_Q="${WEBP_QUALITY_ULTRA}"      ;;
            *)          WEBP_Q="${WEBP_QUALITY_PRODUCTION}" ;;
          esac
          echo "webp_q=${WEBP_Q}" >> "$GITHUB_OUTPUT"
          echo "  🎚️ Quality: ${QUALITY_PRESET} → WebP q${WEBP_Q}"

      - name: "🔍 Detect changed or filtered themes"
        id: matrix
        run: |
          set -euo pipefail

          THEME_FILTER_INPUT="${THEME_FILTER}"
          FORCE="${FORCE_REGEN}"
          ALL_THEMES=()
          CHANGED_THEMES=()

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🔍 Scanning theme directories..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Discover all themes
          if [[ -d "${THEME_DIR}" ]]; then
            while IFS= read -r -d '' theme_conf; do
              THEME_PATH=$(dirname "${theme_conf}")
              THEME_NAME=$(basename "${THEME_PATH}")
              THEME_CATEGORY=$(basename "$(dirname "${THEME_PATH}")")
              ALL_THEMES+=("${THEME_CATEGORY}/${THEME_NAME}")
            done < <(find "${THEME_DIR}" -name "theme.conf" -print0 2>/dev/null)
          fi

          echo "  📦 Total themes found: ${#ALL_THEMES[@]}"

          # Apply filter
          if [[ -n "${THEME_FILTER_INPUT}" ]]; then
            for theme in "${ALL_THEMES[@]}"; do
              [[ "${theme}" == *"${THEME_FILTER_INPUT}"* ]] && \
                CHANGED_THEMES+=("${theme}")
            done
            echo "  🎯 Filtered to: ${#CHANGED_THEMES[@]} themes"
          elif [[ "${FORCE}" == "true" ]]; then
            CHANGED_THEMES=("${ALL_THEMES[@]}")
            echo "  ⚡ Force regenerate: ALL ${#CHANGED_THEMES[@]} themes"
          else
            # Detect git changes
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || \
              git diff --name-only HEAD 2>/dev/null || echo "")

            for theme in "${ALL_THEMES[@]}"; do
              THEME_DIR_REL="themes/presets/${theme}"
              if echo "${CHANGED_FILES}" | grep -q "${THEME_DIR_REL}"; then
                CHANGED_THEMES+=("${theme}")
              fi
            done

            # If no themes changed but workflow files changed, regen sample
            if [[ ${#CHANGED_THEMES[@]} -eq 0 ]]; then
              if [[ "${{ github.event_name }}" == "schedule" ]]; then
                CHANGED_THEMES=("${ALL_THEMES[@]}")
              else
                # Take first 5 themes as sample
                CHANGED_THEMES=("${ALL_THEMES[@]:0:5}")
              fi
            fi

            echo "  📝 Changed themes: ${#CHANGED_THEMES[@]}"
          fi

          # Limit for PR events (max 10 to avoid timeout)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ ${#CHANGED_THEMES[@]} -gt 10 ]]; then
              CHANGED_THEMES=("${CHANGED_THEMES[@]:0:10}")
              echo "  ⚠️ Limited to 10 themes for PR event"
            fi
          fi

          # Build JSON matrix
          if [[ ${#CHANGED_THEMES[@]} -eq 0 ]]; then
            THEMES_JSON='[]'
            HAS_THEMES="false"
          else
            # Build JSON array with theme metadata
            THEMES_JSON="["
            FIRST=true
            for theme in "${CHANGED_THEMES[@]}"; do
              CATEGORY="${theme%%/*}"
              NAME="${theme#*/}"
              CONF_FILE="${THEME_DIR}/${CATEGORY}/${NAME}/theme.conf"
              COLORS_FILE="${THEME_DIR}/${CATEGORY}/${NAME}/colors.json"

              # Read accent color if available
              ACCENT="#cba6f7"
              if [[ -f "${COLORS_FILE}" ]]; then
                ACCENT=$(jq -r '.accent // .mauve // "#cba6f7"' "${COLORS_FILE}" 2>/dev/null || echo "#cba6f7")
              fi

              [[ "${FIRST}" == "false" ]] && THEMES_JSON+=","
              THEMES_JSON+="{\"name\":\"${NAME}\",\"category\":\"${CATEGORY}\",\"accent\":\"${ACCENT}\",\"path\":\"themes/presets/${CATEGORY}/${NAME}\"}"
              FIRST="false"
            done
            THEMES_JSON+="]"
            HAS_THEMES="true"
          fi

          echo "themes=${THEMES_JSON}"  >> "$GITHUB_OUTPUT"
          echo "count=${#CHANGED_THEMES[@]}"  >> "$GITHUB_OUTPUT"
          echo "has_themes=${HAS_THEMES}" >> "$GITHUB_OUTPUT"

          echo ""
          echo "  ✅ Matrix built: ${#CHANGED_THEMES[@]} themes"
          for t in "${CHANGED_THEMES[@]:0:10}"; do
            echo "     • ${t}"
          done

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Generate previews (parallel matrix per theme)
  # ───────────────────────────────────────────────────────────────────────────
  generate-previews:
    name: "🖼️ Generate · ${{ matrix.theme.category }}/${{ matrix.theme.name }}"
    needs: detect-themes
    if: needs.detect-themes.outputs.has_themes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        theme: ${{ fromJson(needs.detect-themes.outputs.themes_json) }}

    env:
      THEME_NAME:     ${{ matrix.theme.name }}
      THEME_CATEGORY: ${{ matrix.theme.category }}
      THEME_PATH:     ${{ matrix.theme.path }}
      THEME_ACCENT:   ${{ matrix.theme.accent }}
      WEBP_Q:         ${{ needs.detect-themes.outputs.webp_quality }}
      SESSION_ID:     ${{ needs.detect-themes.outputs.session_id }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📦 Install image generation stack"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3 \
            python3-pip \
            imagemagick \
            libwebp-dev \
            webp \
            ghostscript \
            fonts-noto \
            fonts-noto-color-emoji \
            fonts-liberation \
            gifsicle \
            pngquant \
            optipng \
            jq \
            bc \
            2>/dev/null || true

          pip3 install --quiet --user \
            Pillow==11.0.0 \
            pillow-avif-plugin==1.4.3 \
            matplotlib==3.9.2 \
            numpy==2.1.2 \
            cairosvg==2.7.1 \
            rich==13.9.2 \
            colormath==3.0.0 \
            2>/dev/null || true

          echo "  ✅ Image stack ready"
          echo "  ✅ Pillow: $(python3 -c 'import PIL; print(PIL.__version__)' 2>/dev/null)"
          echo "  ✅ ImageMagick: $(convert --version | head -1)"

      - name: "🎨 Load theme colors"
        id: colors
        run: |
          set -euo pipefail

          COLORS_FILE="${GITHUB_WORKSPACE}/${THEME_PATH}/colors.json"
          CONF_FILE="${GITHUB_WORKSPACE}/${THEME_PATH}/theme.conf"

          # Create comprehensive default palette if missing
          mkdir -p "${GITHUB_WORKSPACE}/${THEME_PATH}"

          if [[ ! -f "${COLORS_FILE}" ]]; then
            echo "  ⚠️ No colors.json found — generating defaults for ${THEME_NAME}"

            python3 << PALETTE_EOF
          import json, os, re

          # Catppuccin-Mocha defaults
          DEFAULTS = {
              "catppuccin-mocha":     {"base":"#1e1e2e","mantle":"#181825","crust":"#11111b","text":"#cdd6f4","subtext0":"#a6adc8","overlay0":"#6c7086","surface0":"#313244","blue":"#89b4fa","lavender":"#b4befe","sapphire":"#74c7ec","sky":"#89dceb","teal":"#94e2d5","green":"#a6e3a1","yellow":"#f9e2af","peach":"#fab387","maroon":"#eba0ac","red":"#f38ba8","mauve":"#cba6f7","pink":"#f5c2e7","flamingo":"#f2cdcd","rosewater":"#f5e0dc","accent":"#cba6f7"},
              "tokyo-night":          {"base":"#1a1b26","mantle":"#16161e","crust":"#13131a","text":"#c0caf5","subtext0":"#a9b1d6","overlay0":"#565f89","surface0":"#292e42","blue":"#7aa2f7","lavender":"#b4befe","sapphire":"#2ac3de","sky":"#7dcfff","teal":"#1abc9c","green":"#9ece6a","yellow":"#e0af68","peach":"#ff9e64","maroon":"#db4b4b","red":"#f7768e","mauve":"#bb9af7","pink":"#ff007c","flamingo":"#f7768e","rosewater":"#f7768e","accent":"#7aa2f7"},
              "gruvbox-dark":         {"base":"#282828","mantle":"#1d2021","crust":"#141617","text":"#ebdbb2","subtext0":"#d5c4a1","overlay0":"#928374","surface0":"#3c3836","blue":"#83a598","lavender":"#d3869b","sapphire":"#8ec07c","sky":"#76d7c4","teal":"#8ec07c","green":"#b8bb26","yellow":"#fabd2f","peach":"#fe8019","maroon":"#cc241d","red":"#fb4934","mauve":"#d3869b","pink":"#d3869b","flamingo":"#fb4934","rosewater":"#fabd2f","accent":"#fabd2f"},
              "nord":                 {"base":"#2e3440","mantle":"#272c36","crust":"#1f232c","text":"#eceff4","subtext0":"#d8dee9","overlay0":"#4c566a","surface0":"#3b4252","blue":"#5e81ac","lavender":"#81a1c1","sapphire":"#88c0d0","sky":"#8fbcbb","teal":"#88c0d0","green":"#a3be8c","yellow":"#ebcb8b","peach":"#d08770","maroon":"#bf616a","red":"#bf616a","mauve":"#b48ead","pink":"#b48ead","flamingo":"#bf616a","rosewater":"#ebcb8b","accent":"#5e81ac"},
              "dracula":              {"base":"#282a36","mantle":"#21222c","crust":"#191a21","text":"#f8f8f2","subtext0":"#ccccc7","overlay0":"#6272a4","surface0":"#343746","blue":"#6272a4","lavender":"#bd93f9","sapphire":"#8be9fd","sky":"#8be9fd","teal":"#50fa7b","green":"#50fa7b","yellow":"#f1fa8c","peach":"#ffb86c","maroon":"#ff5555","red":"#ff5555","mauve":"#bd93f9","pink":"#ff79c6","flamingo":"#ff79c6","rosewater":"#f1fa8c","accent":"#bd93f9"},
          }

          name    = os.environ.get("THEME_NAME","catppuccin-mocha").lower().replace(" ","-")
          colors  = DEFAULTS.get(name, DEFAULTS["catppuccin-mocha"])
          outfile = f"{os.environ['GITHUB_WORKSPACE']}/{os.environ['THEME_PATH']}/colors.json"
          os.makedirs(os.path.dirname(outfile), exist_ok=True)
          with open(outfile,"w") as f:
              json.dump(colors, f, indent=2)
          print(f"  ✅ Generated color palette for {name}")
          PALETTE_EOF
          fi

          # Export colors as env vars
          python3 << EXPORT_EOF
          import json, os, sys

          colors_file = f"{os.environ['GITHUB_WORKSPACE']}/{os.environ['THEME_PATH']}/colors.json"
          try:
              with open(colors_file) as f:
                  colors = json.load(f)
          except Exception as e:
              print(f"  ⚠️ {e}", file=sys.stderr)
              colors = {"base":"#1e1e2e","text":"#cdd6f4","accent":"#cba6f7","surface0":"#313244","mauve":"#cba6f7"}

          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              for key, val in colors.items():
                  safe_key = key.replace("-","_").replace(" ","_")
                  out.write(f"color_{safe_key}={val}\n")
              out.write(f"accent={colors.get('accent', colors.get('mauve','#cba6f7'))}\n")
              out.write(f"base={colors.get('base','#1e1e2e')}\n")
              out.write(f"text={colors.get('text','#cdd6f4')}\n")

          print(f"  ✅ {len(colors)} colors loaded for {os.environ['THEME_NAME']}")
          EXPORT_EOF

          echo "colors_loaded=true" >> "$GITHUB_OUTPUT"

      - name: "🎨 Generate color swatch preview"
        id: swatch
        run: |
          mkdir -p "${WORK_DIR}/previews/${THEME_NAME}"
          OUTPUT="${WORK_DIR}/previews/${THEME_NAME}/swatch.png"

          python3 << 'SWATCH_EOF'
          import json
          import os
          import math
          from pathlib import Path

          import matplotlib
          matplotlib.use('Agg')
          import matplotlib.pyplot as plt
          import matplotlib.patches as patches
          import matplotlib.gridspec as gridspec
          import numpy as np

          WORK_DIR    = os.environ["WORK_DIR"]
          THEME_NAME  = os.environ["THEME_NAME"]
          THEME_CAT   = os.environ["THEME_CATEGORY"]
          THEME_PATH  = Path(os.environ["GITHUB_WORKSPACE"]) / os.environ["THEME_PATH"]
          OUTPUT      = f"{WORK_DIR}/previews/{THEME_NAME}/swatch.png"

          # Load colors
          with open(THEME_PATH / "colors.json") as f:
              colors = json.load(f)

          def hex_to_rgb(h):
              h = h.lstrip('#')
              return tuple(int(h[i:i+2],16)/255 for i in (0,2,4))

          def luminance(r, g, b):
              def lin(c): return c/12.92 if c<=0.04045 else ((c+0.055)/1.055)**2.4
              return 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b)

          def contrast_ratio(c1, c2):
              l1, l2 = luminance(*c1), luminance(*c2)
              lighter = max(l1,l2); darker = min(l1,l2)
              return (lighter+0.05)/(darker+0.05)

          def wcag_grade(ratio):
              if ratio >= 7.0: return "AAA", "#a6e3a1"
              if ratio >= 4.5: return "AA",  "#f9e2af"
              if ratio >= 3.0: return "A",   "#fab387"
              return "✗", "#f38ba8"

          base_rgb    = hex_to_rgb(colors.get("base","#1e1e2e"))
          text_rgb    = hex_to_rgb(colors.get("text","#cdd6f4"))
          accent_hex  = colors.get("accent", colors.get("mauve","#cba6f7"))

          # ── Layout ──────────────────────────────────────────────────
          fig = plt.figure(figsize=(20, 14))
          fig.patch.set_facecolor(colors.get("base","#1e1e2e"))

          gs = gridspec.GridSpec(4, 1, hspace=0.25,
                                 left=0.04, right=0.96,
                                 top=0.88, bottom=0.04)

          # Row heights
          ax_title  = fig.add_subplot(gs[0])
          ax_base   = fig.add_subplot(gs[1])
          ax_accent = fig.add_subplot(gs[2])
          ax_info   = fig.add_subplot(gs[3])

          def setup_ax(ax):
              ax.set_facecolor(colors.get("base","#1e1e2e"))
              ax.axis("off")

          for ax in [ax_title, ax_base, ax_accent, ax_info]:
              setup_ax(ax)

          # ── Title section ─────────────────────────────────────────
          ax_title.text(0.5, 0.70,
              f"🎨 {THEME_NAME.replace('-',' ').title()}",
              transform=ax_title.transAxes,
              ha="center", va="center",
              color=colors.get("text","#cdd6f4"),
              fontsize=36, fontweight="bold",
              fontfamily="sans-serif"
          )
          ax_title.text(0.5, 0.25,
              f"{THEME_CAT.upper()} · ASH Dotfiles v5.0 OMEGA · 26 Colors",
              transform=ax_title.transAxes,
              ha="center", va="center",
              color=colors.get("subtext0","#a6adc8"),
              fontsize=14,
          )

          # ── Base palette (background colors) ──────────────────────
          BASE_KEYS = ["crust","mantle","base","surface0","surface1","surface2",
                       "overlay0","overlay1","overlay2","subtext0","subtext1","text"]
          n_base = len([k for k in BASE_KEYS if k in colors])

          x_pos = 0.0
          w_each = 1.0 / max(n_base, 1)
          for key in BASE_KEYS:
              if key not in colors: continue
              hex_val = colors[key]
              rgb     = hex_to_rgb(hex_val)
              cr      = contrast_ratio(rgb, base_rgb)
              grade, grade_color = wcag_grade(cr)

              rect = patches.FancyBboxPatch(
                  (x_pos + 0.005, 0.1), w_each - 0.012, 0.80,
                  boxstyle="round,pad=0.01",
                  facecolor=hex_val,
                  edgecolor=colors.get("surface2","#585b70"),
                  linewidth=0.5,
                  transform=ax_base.transAxes,
              )
              ax_base.add_patch(rect)

              # Color name
              ax_base.text(
                  x_pos + w_each/2, 0.82, key,
                  transform=ax_base.transAxes,
                  ha="center", va="center",
                  color=colors.get("text","#cdd6f4"),
                  fontsize=max(6, 9 - max(0, n_base-10)),
                  fontweight="bold",
              )
              # Hex value
              ax_base.text(
                  x_pos + w_each/2, 0.60, hex_val.upper(),
                  transform=ax_base.transAxes,
                  ha="center", va="center",
                  color=colors.get("subtext0","#a6adc8"),
                  fontsize=max(5.5, 8 - max(0, n_base-10)),
                  fontfamily="monospace",
              )
              # WCAG grade
              ax_base.text(
                  x_pos + w_each/2, 0.25, f"WCAG {grade}",
                  transform=ax_base.transAxes,
                  ha="center", va="center",
                  color=grade_color,
                  fontsize=7,
              )
              x_pos += w_each

          ax_base.text(0.01, 0.92, "BASE PALETTE",
              transform=ax_base.transAxes,
              color=colors.get("overlay0","#6c7086"),
              fontsize=8, fontweight="bold", va="top"
          )

          # ── Accent palette ────────────────────────────────────────
          ACCENT_KEYS = ["rosewater","flamingo","pink","mauve","red","maroon",
                         "peach","yellow","green","teal","sky","sapphire","blue","lavender"]
          n_acc = len([k for k in ACCENT_KEYS if k in colors])

          x_pos = 0.0
          w_each = 1.0 / max(n_acc, 1)
          for key in ACCENT_KEYS:
              if key not in colors: continue
              hex_val = colors[key]
              rgb     = hex_to_rgb(hex_val)
              cr      = contrast_ratio(rgb, base_rgb)
              grade, grade_color = wcag_grade(cr)

              # Circle-based display for accent colors
              cx = x_pos + w_each/2
              circle = plt.Circle(
                  (cx, 0.5),
                  radius=0.38/max(n_acc/14, 1),
                  color=hex_val,
                  transform=ax_accent.transAxes + ax_accent.transData.inverted(),
                  zorder=3,
              )

              rect = patches.FancyBboxPatch(
                  (x_pos + 0.003, 0.08), w_each - 0.006, 0.84,
                  boxstyle="round,pad=0.01",
                  facecolor=hex_val + "20",   # 12% opacity bg
                  edgecolor=hex_val,
                  linewidth=1.5,
                  transform=ax_accent.transAxes,
              )
              ax_accent.add_patch(rect)

              # Color block
              rect_solid = patches.FancyBboxPatch(
                  (x_pos + 0.010, 0.55), w_each - 0.020, 0.30,
                  boxstyle="round,pad=0.008",
                  facecolor=hex_val,
                  edgecolor="none",
                  transform=ax_accent.transAxes,
              )
              ax_accent.add_patch(rect_solid)

              ax_accent.text(
                  x_pos + w_each/2, 0.44, key,
                  transform=ax_accent.transAxes,
                  ha="center", va="center",
                  color=colors.get("text","#cdd6f4"),
                  fontsize=max(5.5, 8.5 - max(0, n_acc-10)),
                  fontweight="bold",
              )
              ax_accent.text(
                  x_pos + w_each/2, 0.28, hex_val.upper(),
                  transform=ax_accent.transAxes,
                  ha="center", va="center",
                  color=hex_val,
                  fontsize=max(5, 7.5 - max(0, n_acc-10)),
                  fontfamily="monospace",
              )
              ax_accent.text(
                  x_pos + w_each/2, 0.14, f"{cr:.1f}:1",
                  transform=ax_accent.transAxes,
                  ha="center", va="center",
                  color=grade_color,
                  fontsize=6.5,
              )
              x_pos += w_each

          ax_accent.text(0.01, 0.97, "ACCENT PALETTE",
              transform=ax_accent.transAxes,
              color=colors.get("overlay0","#6c7086"),
              fontsize=8, fontweight="bold", va="top"
          )

          # ── Info bar ──────────────────────────────────────────────
          info_items = [
              ("🎨", "Theme",       THEME_NAME.replace('-',' ').title()),
              ("📁", "Category",    THEME_CAT.title()),
              ("🎯", "Accent",      accent_hex.upper()),
              ("🖤", "Base",        colors.get("base","#1e1e2e").upper()),
              ("📝", "Text",        colors.get("text","#cdd6f4").upper()),
              ("🎨", "Colors",      str(len(colors))),
          ]
          x_step = 1.0 / len(info_items)
          for i, (emoji, label, value) in enumerate(info_items):
              x = i * x_step + x_step/2
              ax_info.text(x, 0.75, emoji,
                  transform=ax_info.transAxes,
                  ha="center", fontsize=18
              )
              ax_info.text(x, 0.45, label,
                  transform=ax_info.transAxes,
                  ha="center", va="center",
                  color=colors.get("overlay0","#6c7086"),
                  fontsize=9, fontweight="bold"
              )
              ax_info.text(x, 0.18, value,
                  transform=ax_info.transAxes,
                  ha="center", va="center",
                  color=colors.get("text","#cdd6f4"),
                  fontsize=10, fontfamily="monospace",
                  fontweight="bold"
              )

          fig.suptitle(
              "ASH Dotfiles v5.0 OMEGA · Theme Color Palette",
              color=colors.get("overlay0","#6c7086"),
              fontsize=11, y=0.96
          )

          plt.savefig(OUTPUT, dpi=150, bbox_inches="tight",
                      facecolor=colors.get("base","#1e1e2e"))
          plt.close()
          print(f"  ✅ Swatch saved: {OUTPUT}")
          SWATCH_EOF

