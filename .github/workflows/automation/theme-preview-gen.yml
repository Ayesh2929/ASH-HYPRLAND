      - name: "♿ Generate accessibility report"
        id: accessibility
        run: |
          mkdir -p "${WORK_DIR}/previews/${THEME_NAME}"
          OUTPUT="${WORK_DIR}/previews/${THEME_NAME}/accessibility.png"
          COLORS_FILE="${GITHUB_WORKSPACE}/${THEME_PATH}/colors.json"

          python3 << 'A11Y_EOF'
          import json, os, math
          import matplotlib
          matplotlib.use('Agg')
          import matplotlib.pyplot as plt
          import matplotlib.colors as mcolors
          import numpy as np

          THEME_NAME = os.environ["THEME_NAME"]
          WORK_DIR   = os.environ["WORK_DIR"]
          OUTPUT     = f"{WORK_DIR}/previews/{THEME_NAME}/accessibility.png"

          with open(os.environ["COLORS_FILE"]) as f:
              C = json.load(f)

          def h(k, d="#888"): return C.get(k, d)

          def hex_to_rgb_linear(hex_color):
              hex_color = hex_color.lstrip('#')
              r,g,b = (int(hex_color[i:i+2],16)/255 for i in (0,2,4))
              def lin(c): return c/12.92 if c<=0.04045 else ((c+0.055)/1.055)**2.4
              return lin(r), lin(g), lin(b)

          def relative_luminance(hex_color):
              r,g,b = hex_to_rgb_linear(hex_color)
              return 0.2126*r + 0.7152*g + 0.0722*b

          def contrast_ratio(c1, c2):
              l1,l2 = relative_luminance(c1), relative_luminance(c2)
              lt,ld = max(l1,l2), min(l1,l2)
              return (lt+0.05)/(ld+0.05)

          def wcag_level(ratio):
              if ratio >= 7.0:  return "AAA", "#a6e3a1", 3
              if ratio >= 4.5:  return "AA",  "#f9e2af", 2
              if ratio >= 3.0:  return "A",   "#fab387", 1
              return "Fail", "#f38ba8", 0

          # Foreground colors (things you read)
          FG_COLORS = {
              k:v for k,v in C.items()
              if k in ["text","subtext0","subtext1","overlay0","overlay1","overlay2"]
          }
          # Background colors
          BG_COLORS = {
              k:v for k,v in C.items()
              if k in ["base","mantle","crust","surface0","surface1","surface2"]
          }

          if not FG_COLORS or not BG_COLORS:
              FG_COLORS = {"text": C.get("text","#cdd6f4")}
              BG_COLORS = {"base": C.get("base","#1e1e2e")}

          fg_keys = list(FG_COLORS.keys())
          bg_keys = list(BG_COLORS.keys())
          n_fg    = len(fg_keys)
          n_bg    = len(bg_keys)

          fig = plt.figure(figsize=(16, 12))
          fig.patch.set_facecolor(h("base"))
          gs  = plt.GridSpec(2, 2, hspace=0.35, wspace=0.30,
                              left=0.08, right=0.97,
                              top=0.88,  bottom=0.05)

          ax1 = fig.add_subplot(gs[0,:])  # Contrast matrix
          ax2 = fig.add_subplot(gs[1,0])  # WCAG pass/fail bars
          ax3 = fig.add_subplot(gs[1,1])  # Score gauge

          for ax in [ax1,ax2,ax3]:
              ax.set_facecolor(h("surface0"))
              for sp in ax.spines.values():
                  sp.set_edgecolor(h("surface2"))
                  sp.set_alpha(0.5)
              ax.tick_params(colors=h("text"), labelsize=8.5)

          # ── Contrast matrix heatmap ───────────────────────────────
          matrix = np.zeros((n_fg, n_bg))
          labels = np.empty((n_fg, n_bg), dtype=object)
          for i, fg_k in enumerate(fg_keys):
              for j, bg_k in enumerate(bg_keys):
                  ratio = contrast_ratio(FG_COLORS[fg_k], BG_COLORS[bg_k])
                  matrix[i,j] = ratio
                  level, _, _ = wcag_level(ratio)
                  labels[i,j] = f"{ratio:.1f}\n{level}"

          cmap = mcolors.LinearSegmentedColormap.from_list(
              "wcag",
              [(0,"#f38ba8"),(3/21,"#fab387"),(4.5/21,"#f9e2af"),
               (7/21,"#a6e3a1"),(1,"#94e2d5")]
          )
          im = ax1.imshow(matrix, cmap=cmap, aspect="auto",
                          vmin=1, vmax=21)

          for i in range(n_fg):
              for j in range(n_bg):
                  ratio = matrix[i,j]
                  txt_col = h("crust") if ratio > 7 else h("text")
                  ax1.text(j, i, labels[i,j],
                      ha="center", va="center",
                      color=txt_col, fontsize=9, fontweight="bold"
                  )

          ax1.set_xticks(range(n_bg))
          ax1.set_xticklabels([f"BG: {k}" for k in bg_keys],
              color=h("text"), fontsize=8.5)
          ax1.set_yticks(range(n_fg))
          ax1.set_yticklabels([f"FG: {k}" for k in fg_keys],
              color=h("text"), fontsize=8.5)
          ax1.set_title(f"♿ WCAG Contrast Matrix — {THEME_NAME}",
              color=h("text"), fontsize=13, fontweight="bold", pad=12)

          cbar = plt.colorbar(im, ax=ax1, shrink=0.8, pad=0.01)
          cbar.set_label("Contrast Ratio", color=h("text"), fontsize=9)
          cbar.ax.tick_params(colors=h("text"))
          for l in cbar.ax.get_yticklabels():
              l.set_color(h("text"))
          cbar.ax.axhline(4.5/21, color=h("yellow"), lw=1.5, ls="--", label="AA")
          cbar.ax.axhline(7.0/21, color=h("green"),  lw=1.5, ls="--", label="AAA")

          # ── WCAG pass/fail breakdown ──────────────────────────────
          all_ratios = matrix.flatten()
          counts = {
              "AAA (≥7.0)": sum(1 for r in all_ratios if r >= 7.0),
              "AA (≥4.5)":  sum(1 for r in all_ratios if 4.5 <= r < 7.0),
              "A (≥3.0)":   sum(1 for r in all_ratios if 3.0 <= r < 4.5),
              "Fail (<3.0)": sum(1 for r in all_ratios if r < 3.0),
          }
          bar_colors = [h("green"), h("yellow"), h("peach"), h("red")]
          bars = ax2.bar(list(counts.keys()), list(counts.values()),
                         color=bar_colors, alpha=0.82, width=0.55,
                         edgecolor=h("base"), linewidth=1.5, zorder=3)
          for bar, val in zip(bars, counts.values()):
              ax2.text(bar.get_x() + bar.get_width()/2,
                       bar.get_height() + max(counts.values())*0.03,
                       str(val), ha="center", va="bottom",
                       color=h("text"), fontsize=11, fontweight="bold")
          ax2.set_ylabel("Count", color=h("text"), fontsize=10)
          ax2.set_title("WCAG Level Distribution", color=h("text"),
                        fontsize=11, fontweight="bold", pad=10)
          ax2.grid(True, alpha=0.1, color=h("text"), axis="y", zorder=1)

          # ── Accessibility score gauge ─────────────────────────────
          ax3.set_facecolor(h("surface0"))
          ax3.axis("off")

          total   = len(all_ratios)
          passing = sum(1 for r in all_ratios if r >= 4.5)
          score   = round(passing / total * 100) if total > 0 else 0
          avg_ratio = round(np.mean(all_ratios), 2) if total > 0 else 0

          theta   = np.linspace(np.pi, 0, 200)
          ax3.plot(0.5 + 0.38*np.cos(theta), 0.58+0.38*np.sin(theta),
              color=h("surface2"), linewidth=24, solid_capstyle="round",
              alpha=0.5, transform=ax3.transAxes)

          score_col = (h("green") if score >= 90 else
                       h("teal")  if score >= 70 else
                       h("yellow")if score >= 50 else h("red"))
          fill_end  = np.pi - (score/100)*np.pi
          theta_fill= np.linspace(np.pi, max(fill_end,0), 100)
          ax3.plot(0.5+0.38*np.cos(theta_fill), 0.58+0.38*np.sin(theta_fill),
              color=score_col, linewidth=24, solid_capstyle="round",
              alpha=0.9, transform=ax3.transAxes)

          ax3.text(0.5, 0.48, f"{score}%",
              transform=ax3.transAxes, ha="center",
              color=score_col, fontsize=28, fontweight="bold")
          ax3.text(0.5, 0.32, "WCAG AA Pass Rate",
              transform=ax3.transAxes, ha="center",
              color=h("subtext0"), fontsize=10)
          ax3.text(0.5, 0.22, f"Avg contrast: {avg_ratio}:1",
              transform=ax3.transAxes, ha="center",
              color=h("text"), fontsize=10)
          ax3.text(0.5, 0.10,
              "♿ Accessible" if score >= 90 else
              "⚠️ Needs Work" if score >= 70 else "❌ Poor",
              transform=ax3.transAxes, ha="center",
              color=score_col, fontsize=12, fontweight="bold")
          ax3.set_title("Accessibility Score",
              color=h("text"), fontsize=11, fontweight="bold", pad=10)

          fig.suptitle(
              f"♿ Accessibility Report — {THEME_NAME.replace('-',' ').title()}\n"
              f"WCAG AA: {passing}/{total} pairs passing ({score}%)",
              color=h("text"), fontsize=13, fontweight="bold", y=0.97
          )

          plt.savefig(OUTPUT, dpi=150, bbox_inches="tight",
                      facecolor=h("base"))
          plt.close()
          print(f"  ✅ Accessibility report saved: {OUTPUT}")
          A11Y_EOF

      - name: "🔄 Convert to WebP & optimize"
        run: |
          set -euo pipefail

          PREVIEW_DIR="${WORK_DIR}/previews/${THEME_NAME}"
          OUTPUT_FINAL="${WORK_DIR}/final/${THEME_NAME}"
          mkdir -p "${OUTPUT_FINAL}"

          echo "  🔄 Converting to WebP (quality=${WEBP_Q})..."

          for png_file in "${PREVIEW_DIR}"/*.png; do
            [[ -f "${png_file}" ]] || continue
            BASENAME=$(basename "${png_file}" .png)
            WEBP_FILE="${OUTPUT_FINAL}/${BASENAME}.webp"

            # Convert to WebP
            cwebp -q "${WEBP_Q}" \
              -m 6 \
              -mt \
              -alpha_q 100 \
              "${png_file}" \
              -o "${WEBP_FILE}" \
              2>/dev/null || \
            # Fallback: use ImageMagick
            convert "${png_file}" \
              -quality "${WEBP_Q}" \
              -define webp:lossless=false \
              -define webp:method=6 \
              "${WEBP_FILE}" 2>/dev/null || \
            # Last resort: keep PNG
            cp "${png_file}" "${OUTPUT_FINAL}/${BASENAME}.png"

            # Report sizes
            PNG_SIZE=$(wc -c < "${png_file}" 2>/dev/null || echo 0)
            WEBP_SIZE=$(wc -c < "${WEBP_FILE}" 2>/dev/null || echo ${PNG_SIZE})
            SAVED=$(echo "scale=1; (1 - ${WEBP_SIZE}/${PNG_SIZE}) * 100" | bc 2>/dev/null || echo "0")

            echo "    ${BASENAME}: $(numfmt --to=iec ${PNG_SIZE}) → $(numfmt --to=iec ${WEBP_SIZE}) (-${SAVED}%)"
          done

          # Generate checksum manifest
          cat > "${OUTPUT_FINAL}/manifest.json" << EOF
          {
            "theme": "${THEME_NAME}",
            "category": "${THEME_CATEGORY}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "session_id": "${SESSION_ID}",
            "quality": "${QUALITY_PRESET}",
            "webp_quality": ${WEBP_Q},
            "files": {
              "swatch":        "swatch.webp",
              "terminal":      "terminal.webp",
              "waybar":        "waybar.webp",
              "card":          "card.webp",
              "accessibility": "accessibility.webp"
            }
          }
          EOF

          echo ""
          echo "  ✅ Conversion complete for ${THEME_NAME}"
          ls -la "${OUTPUT_FINAL}/"

      - name: "📤 Upload preview artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: "theme-preview-${{ matrix.theme.name }}-${{ needs.detect-themes.outputs.session_id }}"
          path: "${{ env.WORK_DIR }}/final/${{ matrix.theme.name }}/"
          retention-days: 30
          compression-level: 1    # WebP already compressed

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — Commit previews & generate index
  # ───────────────────────────────────────────────────────────────────────────
  commit-and-index:
    name: "💾 Commit · Previews & Generate Index"
    needs: [detect-themes, generate-previews]
    if: |
      always() &&
      needs.generate-previews.result != 'skipped' &&
      env.COMMIT_PREVIEWS == 'true' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: "📥 Download all preview artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: "theme-preview-*-${{ needs.detect-themes.outputs.session_id }}"
          path: "${{ env.WORK_DIR }}/downloaded"
          merge-multiple: true

      - name: "📁 Organize preview files"
        run: |
          set -euo pipefail

          mkdir -p "${OUTPUT_DIR}"

          echo "  📁 Organizing preview files..."

          # Move all downloaded previews to output directory
          find "${WORK_DIR}/downloaded" \
            -name "*.webp" -o -name "*.png" -o -name "manifest.json" | \
          while read -r file; do
            # Determine theme name from path
            THEME_DIR_NAME=$(basename "$(dirname "${file}")")
            mkdir -p "${OUTPUT_DIR}/${THEME_DIR_NAME}"
            cp "${file}" "${OUTPUT_DIR}/${THEME_DIR_NAME}/"
          done

          echo "  ✅ Files organized"
          find "${OUTPUT_DIR}" -type f | wc -l | xargs echo "  📊 Total files:"

      - name: "📊 Generate preview index"
        run: |
          pip3 install --quiet --user jinja2==3.1.4 2>/dev/null || true

          python3 << 'INDEX_EOF'
          import json
          import os
          import glob
          from pathlib import Path
          from datetime import datetime, timezone

          OUTPUT_DIR = Path(os.environ["OUTPUT_DIR"])
          THEME_DIR  = Path(os.environ["THEME_DIR"])

          # Collect all theme previews
          previews = []
          for manifest_file in sorted(OUTPUT_DIR.glob("*/manifest.json")):
              try:
                  with open(manifest_file) as f:
                      data = json.load(f)
                  previews.append(data)
              except Exception as e:
                  print(f"  ⚠️ {manifest_file}: {e}")

          # Generate HTML index
          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>ASH Theme Gallery — {len(previews)} Themes</title>
            <style>
              :root {{
                --base: #1e1e2e; --surface: #313244; --text: #cdd6f4;
                --accent: #cba6f7; --subtext: #a6adc8;
              }}
              * {{ box-sizing: border-box; margin: 0; padding: 0; }}
              body {{ background: var(--base); color: var(--text);
                      font-family: 'JetBrains Mono', monospace; padding: 2rem; }}
              h1 {{ color: var(--accent); font-size: 2rem; margin-bottom: 0.5rem; }}
              .subtitle {{ color: var(--subtext); margin-bottom: 2rem; }}
              .grid {{ display: grid;
                       grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                       gap: 1.5rem; }}
              .card {{ background: var(--surface); border-radius: 12px;
                       overflow: hidden; transition: transform 0.2s;
                       border: 1px solid #45475a; }}
              .card:hover {{ transform: translateY(-4px); }}
              .card img {{ width: 100%; display: block; }}
              .card-body {{ padding: 1rem; }}
              .theme-name {{ font-size: 1.1rem; font-weight: bold;
                             color: var(--accent); margin-bottom: 0.25rem; }}
              .theme-meta {{ color: var(--subtext); font-size: 0.8rem; }}
              .previews {{ display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap; }}
              .preview-link {{ background: #45475a; color: var(--text);
                               padding: 0.2rem 0.6rem; border-radius: 6px;
                               text-decoration: none; font-size: 0.75rem; }}
              .preview-link:hover {{ background: var(--accent); color: #1e1e2e; }}
              .stats {{ background: var(--surface); border-radius: 12px;
                        padding: 1.5rem; margin-bottom: 2rem;
                        display: flex; gap: 3rem; align-items: center; }}
              .stat {{ text-align: center; }}
              .stat-val {{ font-size: 2rem; font-weight: bold; color: var(--accent); }}
              .stat-lbl {{ color: var(--subtext); font-size: 0.85rem; }}
            </style>
          </head>
          <body>
            <h1>🎨 ASH Theme Gallery</h1>
            <p class="subtitle">v5.0 OMEGA · {len(previews)} themes · Generated {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}</p>
            <div class="stats">
              <div class="stat"><div class="stat-val">{len(previews)}</div><div class="stat-lbl">Themes</div></div>
              <div class="stat"><div class="stat-val">250+</div><div class="stat-lbl">Total Available</div></div>
              <div class="stat"><div class="stat-val">5</div><div class="stat-lbl">Preview Types</div></div>
              <div class="stat"><div class="stat-val">WebP</div><div class="stat-lbl">Format</div></div>
            </div>
            <div class="grid">
          """

          for p in previews:
              theme   = p.get("theme","?")
              cat     = p.get("category","?")
              files   = p.get("files",{})
              card_img= files.get("card","card.webp")

              html += f"""
              <div class="card">
                <img src="{theme}/{card_img}" alt="{theme} preview" loading="lazy">
                <div class="card-body">
                  <div class="theme-name">🎨 {theme.replace('-',' ').title()}</div>
                  <div class="theme-meta">📁 {cat.upper()} · 26 colors</div>
                  <div class="previews">
                    <a class="preview-link" href="{theme}/swatch.webp">🌈 Swatch</a>
                    <a class="preview-link" href="{theme}/terminal.webp">🖥️ Terminal</a>
                    <a class="preview-link" href="{theme}/waybar.webp">📊 Waybar</a>
                    <a class="preview-link" href="{theme}/accessibility.webp">♿ A11y</a>
                  </div>
                </div>
              </div>"""

          html += """
            </div>
          </body>
          </html>"""

          with open(OUTPUT_DIR / "index.html", "w") as f:
              f.write(html)

          # JSON index
          index = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "total_themes": len(previews),
              "themes": previews,
          }
          with open(OUTPUT_DIR / "index.json", "w") as f:
              json.dump(index, f, indent=2)

          print(f"  ✅ Index generated: {len(previews)} themes")
          INDEX_EOF

      - name: "💾 Commit preview files"
        run: |
          set -euo pipefail

          git config user.name  "ash-preview-bot[bot]"
          git config user.email "ash-preview-bot@users.noreply.github.com"

          git add "${OUTPUT_DIR}/" 2>/dev/null || true
          git add "assets/screenshots/previews/" 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "  ℹ️ No preview changes to commit"
          else
            THEME_COUNT="${{ needs.detect-themes.outputs.theme_count }}"
            git commit -m "🎨 chore(previews): regenerate ${THEME_COUNT} theme previews [skip ci]

          Session: ${{ needs.detect-themes.outputs.session_id }}
          Quality: ${QUALITY_PRESET}
          Themes:  ${THEME_COUNT}

          Generated by ASH v5.0 OMEGA Theme Preview Engine"

            git push
            echo "  ✅ Previews committed and pushed"
          fi

      - name: "📊 Generate step summary"
        if: always()
        run: |
          THEME_COUNT="${{ needs.detect-themes.outputs.theme_count }}"
          SESSION="${{ needs.detect-themes.outputs.session_id }}"

          cat >> "${GITHUB_STEP_SUMMARY}" << EOF
          # 🎨 Theme Preview Generation Complete

          > Session: \`${SESSION}\` · Quality: \`${QUALITY_PRESET}\`

          ## 📊 Results

          | Metric | Value |
          |--------|-------|
          | 🎨 Themes Processed | \`${THEME_COUNT}\` |
          | 🖼️ Preview Types | swatch · terminal · waybar · card · accessibility |
          | 📦 Format | WebP (quality ${WEBP_QUALITY_PRODUCTION}) |
          | 💾 Committed | \`${COMMIT_PREVIEWS}\` |

          ---
          *🎨 ASH v5.0 OMEGA Theme Preview Engine*
          EOF
