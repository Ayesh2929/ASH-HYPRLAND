name: "👥 Auto-Assign · Intelligent Routing Engine"

on:
  # ── Issue events ────────────────────────────────────────────────────────────
  issues:
    types:
      - opened
      - labeled
      - reopened
      - transferred

  # ── PR events ───────────────────────────────────────────────────────────────
  pull_request_target:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
      - labeled
      - review_requested

  # ── Comment commands ─────────────────────────────────────────────────────────
  issue_comment:
    types: [created]

  # ── Review events ────────────────────────────────────────────────────────────
  pull_request_review:
    types: [submitted]

  # ── Scheduled reminders ──────────────────────────────────────────────────────
  schedule:
    - cron: "0 9 * * 1-5"     # Weekday mornings — review reminders
    - cron: "0 14 * * 3"      # Wednesday afternoon — rotation check

  # ── Manual override ──────────────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode"
        required: false
        default: "assign"
        type: choice
        options:
          - assign          # Standard assignment
          - rebalance       # Rebalance all open item assignments
          - report          # Generate workload report only
          - remind          # Send review reminders
          - rotate          # Execute team rotation
          - dry-run         # Preview assignments without applying
      target_number:
        description: "Issue/PR number (0 = process all)"
        required: false
        default: "0"
        type: string
      force_assignee:
        description: "Force specific assignee (GitHub username)"
        required: false
        default: ""
        type: string
      notify_discord:
        description: "Send Discord notification"
        required: false
        default: true
        type: boolean

# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: "auto-assign-${{ github.event.number || github.event.issue.number || 'global' }}"
  cancel-in-progress: false

permissions:
  issues: write
  pull-requests: write
  contents: read
  actions: read
  repository-projects: read

# ─────────────────────────────────────────────────────────────────────────────
env:
  ASSIGN_VERSION: "5.0.0"
  WORK_DIR: "${{ github.workspace }}/.assign-engine"
  DRY_RUN: "${{ github.event.inputs.mode == 'dry-run' && 'true' || 'false' }}"
  OP_MODE: "${{ github.event.inputs.mode || 'assign' }}"

  # ── Team configuration ────────────────────────────────────────────────────
  # Format: comma-separated GitHub usernames
  TEAM_LEADS: "ash-lead,ash-core"
  TEAM_CORE: "ash-lead,ash-core,ash-dev1,ash-dev2"
  TEAM_ALL: "ash-lead,ash-core,ash-dev1,ash-dev2,ash-contrib1"
  SECURITY_TEAM: "ash-lead,ash-security"

  # ── Capacity limits ───────────────────────────────────────────────────────
  MAX_ISSUES_PER_PERSON: "10"
  MAX_PRS_PER_PERSON: "5"
  MAX_REVIEWERS_PER_PR: "2"

  # ── Review deadline (hours) ───────────────────────────────────────────────
  REVIEW_DEADLINE_CRITICAL: "4"
  REVIEW_DEADLINE_HIGH: "24"
  REVIEW_DEADLINE_MEDIUM: "72"
  REVIEW_DEADLINE_LOW: "168"

# ═════════════════════════════════════════════════════════════════════════════
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Detect trigger type & validate environment
  # ───────────────────────────────────────────────────────────────────────────
  preflight:
    name: "🔍 Preflight · Trigger Classification"
    runs-on: ubuntu-24.04
    outputs:
      trigger_type: ${{ steps.classify.outputs.trigger_type }}
      item_number:  ${{ steps.classify.outputs.item_number }}
      item_type:    ${{ steps.classify.outputs.item_type }}
      is_command:   ${{ steps.command.outputs.is_command }}
      command:      ${{ steps.command.outputs.command }}
      command_args: ${{ steps.command.outputs.args }}
      should_assign:${{ steps.gate.outputs.should_assign }}
      session_id:   ${{ steps.session.outputs.id }}

    steps:
      - name: "🆔 Session ID"
        id: session
        run: |
          echo "id=assign-$(date +%Y%m%d%H%M%S)-$$" >> "$GITHUB_OUTPUT"

      - name: "🔍 Classify trigger"
        id: classify
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const event  = context.eventName;
            const action = context.payload.action || "";
            const pr     = context.payload.pull_request;
            const issue  = context.payload.issue;
            const review = context.payload.review;

            let triggerType = "unknown";
            let itemNumber  = 0;
            let itemType    = "unknown";

            if (pr) {
              itemNumber  = pr.number;
              itemType    = "pr";
              triggerType = `pr_${action}`;
            } else if (issue) {
              itemNumber  = issue.number;
              itemType    = issue.pull_request ? "pr" : "issue";
              triggerType = `issue_${action}`;
            } else if (review) {
              itemNumber  = context.payload.pull_request?.number || 0;
              itemType    = "pr";
              triggerType = `review_${action}`;
            } else if (event === "schedule") {
              triggerType = "scheduled";
            } else if (event === "workflow_dispatch") {
              triggerType = "manual";
              itemNumber  = parseInt("${{ github.event.inputs.target_number || '0' }}");
            }

            core.setOutput("trigger_type", triggerType);
            core.setOutput("item_number",  String(itemNumber));
            core.setOutput("item_type",    itemType);

            console.log(`  🔍 Trigger: ${triggerType}`);
            console.log(`  📋 Item:    ${itemType} #${itemNumber}`);

      - name: "💬 Detect comment command"
        id: command
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body   = (context.payload.comment?.body || "").trim();
            const sender = context.payload.comment?.user?.login || "";

            // Verify sender has write+ permission
            const perm = await github.rest.repos.getCollaboratorPermissionLevel({
              owner:    context.repo.owner,
              repo:     context.repo.repo,
              username: sender,
            }).catch(() => ({ data: { permission: "none" } }));

            const canAssign = ["admin","maintain","write"].includes(perm.data.permission);
            if (!canAssign) {
              core.setOutput("is_command", "false");
              return;
            }

            const CMDS = {
              "/assign":    "assign",
              "/unassign":  "unassign",
              "/reassign":  "reassign",
              "/review":    "request_review",
              "/remind":    "remind",
              "/delegate":  "delegate",
              "/escalate":  "escalate",
              "/claim":     "claim",
              "/unclaim":   "unclaim",
              "/balance":   "balance",
            };

            let matched = false;
            for (const [trigger, cmd] of Object.entries(CMDS)) {
              if (body.toLowerCase().startsWith(trigger)) {
                const args = body.slice(trigger.length).trim();
                core.setOutput("is_command", "true");
                core.setOutput("command", cmd);
                core.setOutput("args", args);
                console.log(`  ⚡ Command: ${cmd} args="${args}" by @${sender}`);
                matched = true;
                break;
              }
            }
            if (!matched) {
              core.setOutput("is_command", "false");
              core.setOutput("command", "");
              core.setOutput("args", "");
            }

      - name: "🚦 Assignment gate"
        id: gate
        run: |
          TRIGGER="${{ steps.classify.outputs.trigger_type }}"
          IS_CMD="${{ steps.command.outputs.is_command }}"
          MODE="${OP_MODE}"

          # Always assign for direct issue/PR events
          SHOULD="true"

          # Skip assignment for review submissions (handled separately)
          [[ "${TRIGGER}" == "review_"* ]] && SHOULD="false"

          # Comment events: only if valid command
          if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            [[ "${IS_CMD}" != "true" ]] && SHOULD="false"
          fi

          # Scheduled: always run for reminders
          [[ "${TRIGGER}" == "scheduled" ]] && SHOULD="true"
          [[ "${MODE}" == "report" ]]       && SHOULD="true"
          [[ "${MODE}" == "remind" ]]       && SHOULD="true"

          echo "should_assign=${SHOULD}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Gate::should_assign=${SHOULD}"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Core assignment engine
  # ───────────────────────────────────────────────────────────────────────────
  assign-engine:
    name: "🧠 Engine · Smart Assignment (${{ needs.preflight.outputs.trigger_type }})"
    needs: preflight
    if: |
      needs.preflight.outputs.should_assign == 'true' &&
      (github.event_name == 'issues' ||
       github.event_name == 'pull_request_target' ||
       github.event_name == 'workflow_dispatch' ||
       needs.preflight.outputs.is_command == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "📦 Install dependencies"
        run: |
          pip3 install --quiet --user \
            PyGithub==2.4.0 \
            rich==13.9.2 \
            tabulate==0.9.0 \
            2>/dev/null || true
          sudo apt-get install -y --no-install-recommends \
            jq sqlite3 bc 2>/dev/null || true
          mkdir -p "${WORK_DIR}"

      - name: "🧠 Execute intelligent assignment"
        id: assign
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const DRY_RUN    = process.env.DRY_RUN === "true";
            const OP_MODE    = process.env.OP_MODE || "assign";
            const WORK_DIR   = process.env.WORK_DIR;
            const SESSION_ID = "${{ needs.preflight.outputs.session_id }}";
            const fs         = require("fs");

            // ══════════════════════════════════════════════════════════════
            // TEAM CONFIGURATION
            // ══════════════════════════════════════════════════════════════
            const TEAM = {
              leads:    ["ash-lead", "ash-core"],
              core:     ["ash-lead", "ash-core", "ash-dev1", "ash-dev2"],
              all:      ["ash-lead", "ash-core", "ash-dev1", "ash-dev2", "ash-contrib1"],
              security: ["ash-lead", "ash-security"],
            };

            // Component → expert mapping
            const COMPONENT_EXPERTS = {
              "component:theme":    { assignees: ["ash-dev1"], reviewers: ["ash-lead","ash-dev1"] },
              "component:plugin":   { assignees: ["ash-dev2"], reviewers: ["ash-core","ash-dev2"] },
              "component:shell":    { assignees: ["ash-dev1"], reviewers: ["ash-dev1","ash-core"] },
              "component:neovim":   { assignees: ["ash-dev2"], reviewers: ["ash-dev2","ash-lead"] },
              "component:hyprland": { assignees: ["ash-lead"],  reviewers: ["ash-lead","ash-core"] },
              "component:waybar":   { assignees: ["ash-dev1"], reviewers: ["ash-dev1"] },
              "component:rofi":     { assignees: ["ash-dev1"], reviewers: ["ash-dev1"] },
              "component:api":      { assignees: ["ash-dev2"], reviewers: ["ash-dev2","ash-core"] },
              "component:cli":      { assignees: ["ash-core"],  reviewers: ["ash-core","ash-lead"] },
              "component:docs":     { assignees: ["ash-contrib1"], reviewers: ["ash-core"] },
              "component:install":  { assignees: ["ash-core"],  reviewers: ["ash-core","ash-lead"] },
              "component:config":   { assignees: ["ash-lead"],  reviewers: ["ash-lead"] },
              "component:mobile":   { assignees: ["ash-dev2"], reviewers: ["ash-dev2"] },
              "component:web":      { assignees: ["ash-dev2"], reviewers: ["ash-dev2","ash-core"] },
              "component:assets":   { assignees: ["ash-contrib1"], reviewers: ["ash-core"] },
              "component:ci":       { assignees: ["ash-core"],  reviewers: ["ash-lead","ash-core"] },
              "documentation":      { assignees: ["ash-contrib1"], reviewers: ["ash-core"] },
              "security":           { assignees: TEAM.security, reviewers: TEAM.security },
              "performance":        { assignees: ["ash-core"],  reviewers: ["ash-lead","ash-core"] },
              "bug":                { assignees: ["ash-core"],  reviewers: ["ash-core"] },
              "feature-request":    { assignees: ["ash-lead"],  reviewers: TEAM.core },
              "ci-cd":              { assignees: ["ash-core"],  reviewers: ["ash-lead","ash-core"] },
              "regression":         { assignees: ["ash-lead"],  reviewers: TEAM.leads },
              "priority:critical":  { assignees: TEAM.leads,   reviewers: TEAM.leads },
              "priority:high":      { assignees: TEAM.core,    reviewers: TEAM.core },
              "theme-submission":   { assignees: ["ash-dev1"], reviewers: ["ash-lead","ash-dev1"] },
              "plugin-submission":  { assignees: ["ash-dev2"], reviewers: ["ash-lead","ash-dev2"] },
            };

            // ══════════════════════════════════════════════════════════════
            // WORKLOAD TRACKING
            // ══════════════════════════════════════════════════════════════
            async function getCurrentWorkload() {
              const workload = {};
              for (const user of TEAM.all) {
                workload[user] = { issues: 0, prs: 0, total: 0 };
              }

              // Fetch open issues assigned to each user
              const openItems = await github.paginate(
                github.rest.issues.listForRepo,
                {
                  owner:    context.repo.owner,
                  repo:     context.repo.repo,
                  state:    "open",
                  per_page: 100,
                }
              );

              for (const item of openItems) {
                for (const assignee of (item.assignees || [])) {
                  const login = assignee.login;
                  if (workload[login]) {
                    if (item.pull_request) workload[login].prs++;
                    else workload[login].issues++;
                    workload[login].total++;
                  }
                }
              }

              return workload;
            }

            // ══════════════════════════════════════════════════════════════
            // TIMEZONE AVAILABILITY
            // ══════════════════════════════════════════════════════════════
            const USER_TIMEZONES = {
              "ash-lead":     { tz: "America/New_York",  utcOffset: -5, workHours: [9, 17] },
              "ash-core":     { tz: "Europe/London",     utcOffset: 0,  workHours: [8, 16] },
              "ash-dev1":     { tz: "Europe/Berlin",     utcOffset: 1,  workHours: [9, 18] },
              "ash-dev2":     { tz: "Asia/Tokyo",        utcOffset: 9,  workHours: [10, 19] },
              "ash-contrib1": { tz: "America/Los_Angeles",utcOffset:-8, workHours: [9, 17] },
              "ash-security": { tz: "Europe/London",     utcOffset: 0,  workHours: [8, 16] },
            };

            function isUserAvailable(username) {
              const tz = USER_TIMEZONES[username];
              if (!tz) return true;
              const utcHour = new Date().getUTCHours();
              const localHour = (utcHour + tz.utcOffset + 24) % 24;
              return localHour >= tz.workHours[0] && localHour < tz.workHours[1];
            }

            // ══════════════════════════════════════════════════════════════
            // EXPERT SELECTION ALGORITHM
            // ══════════════════════════════════════════════════════════════
            async function selectBestAssignee(candidates, workload, itemType, excludeUser) {
              const MAX_ISSUES = parseInt(process.env.MAX_ISSUES_PER_PERSON || "10");
              const MAX_PRS    = parseInt(process.env.MAX_PRS_PER_PERSON    || "5");

              // Filter out author (can't self-assign PRs)
              const eligible = candidates.filter(u => {
                if (u === excludeUser) return false;
                const load = workload[u] || { issues: 0, prs: 0 };
                if (itemType === "pr" && load.prs >= MAX_PRS)       return false;
                if (itemType === "issue" && load.issues >= MAX_ISSUES) return false;
                return true;
              });

              if (!eligible.length) {
                // Fallback: ignore capacity, pick lowest loaded
                return candidates
                  .filter(u => u !== excludeUser)
                  .sort((a,b) => (workload[a]?.total||0) - (workload[b]?.total||0))[0]
                  || candidates[0];
              }

              // Score each candidate
              const scored = eligible.map(u => {
                const load     = workload[u] || { total: 0 };
                const available = isUserAvailable(u) ? 5 : 0;  // +5 if in work hours
                const capacity  = 10 - (load.total || 0);      // Higher = less loaded
                return { user: u, score: available + capacity };
              });

              scored.sort((a, b) => b.score - a.score);
              console.log(`  🧠 Candidate scores: ${JSON.stringify(scored)}`);
              return scored[0].user;
            }

            // ══════════════════════════════════════════════════════════════
            // LABEL → ROUTING
            // ══════════════════════════════════════════════════════════════
            function getRoutingFromLabels(labels) {
              const labelNames = labels.map(l =>
                typeof l === "string" ? l : l.name
              );

              let bestAssignees = null;
              let bestReviewers = null;
              let bestPriority  = 999;

              const PRIORITY_ORDER = [
                "priority:critical", "security", "regression",
                "priority:high", "bug", "performance",
                "feature-request", "enhancement",
                "component:theme", "component:plugin", "component:shell",
                "component:neovim", "component:hyprland", "component:waybar",
                "component:rofi", "component:api", "component:cli",
                "component:docs", "component:install", "component:config",
                "component:mobile", "component:web", "component:assets",
                "component:ci", "documentation", "ci-cd",
                "theme-submission", "plugin-submission",
                "priority:medium", "priority:low",
              ];

              for (let i = 0; i < PRIORITY_ORDER.length; i++) {
                const rule = PRIORITY_ORDER[i];
                if (labelNames.includes(rule) && COMPONENT_EXPERTS[rule]) {
                  if (i < bestPriority) {
                    bestPriority  = i;
                    bestAssignees = COMPONENT_EXPERTS[rule].assignees;
                    bestReviewers = COMPONENT_EXPERTS[rule].reviewers;
                  }
                }
              }

              return {
                assignees: bestAssignees || TEAM.core,
                reviewers: bestReviewers || TEAM.core,
              };
            }

            // ══════════════════════════════════════════════════════════════
            // APPLY ASSIGNMENT
            // ══════════════════════════════════════════════════════════════
            async function applyAssignment(itemNumber, assignees, reviewers, isPR, author) {
              const MAX_R = parseInt(process.env.MAX_REVIEWERS_PER_PR || "2");

              // Filter out author from all lists
              const filteredAssignees = assignees
                .filter(u => u !== author)
                .slice(0, 1);

              const filteredReviewers = isPR
                ? reviewers.filter(u => u !== author).slice(0, MAX_R)
                : [];

              if (DRY_RUN) {
                console.log(`  [DRY] #${itemNumber} → assignees:[${filteredAssignees}] reviewers:[${filteredReviewers}]`);
                return { assignees: filteredAssignees, reviewers: filteredReviewers };
              }

              // Apply assignees
              if (filteredAssignees.length) {
                await github.rest.issues.addAssignees({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  issue_number: itemNumber,
                  assignees:   filteredAssignees,
                }).catch(e => core.warning(`addAssignees #${itemNumber}: ${e.message}`));
              }

              // Request reviewers for PRs
              if (isPR && filteredReviewers.length) {
                await github.rest.pulls.requestReviewers({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  pull_number: itemNumber,
                  reviewers:   filteredReviewers,
                }).catch(e => core.warning(`requestReviewers #${itemNumber}: ${e.message}`));
              }

              return { assignees: filteredAssignees, reviewers: filteredReviewers };
            }

            // ══════════════════════════════════════════════════════════════
            // POST ASSIGNMENT COMMENT
            // ══════════════════════════════════════════════════════════════
            async function postAssignmentComment(itemNumber, assignees, reviewers, isPR, priority) {
              const DEADLINE_MAP = {
                "priority:critical": process.env.REVIEW_DEADLINE_CRITICAL || "4",
                "priority:high":     process.env.REVIEW_DEADLINE_HIGH     || "24",
                "priority:medium":   process.env.REVIEW_DEADLINE_MEDIUM   || "72",
                "priority:low":      process.env.REVIEW_DEADLINE_LOW      || "168",
              };
              const deadline = DEADLINE_MAP[priority] || "72";

              const assigneeMentions  = assignees.map(u => `@${u}`).join(", ");
              const reviewerMentions  = reviewers.map(u => `@${u}`).join(", ");

              const lines = [
                `## 👥 Assignment Notification`,
                ``,
                `This ${isPR ? "pull request" : "issue"} has been automatically routed.`,
                ``,
                `| Role | Assigned To | Deadline |`,
                `|------|-------------|----------|`,
                assignees.length ? `| 🔨 **Assignee** | ${assigneeMentions} | — |` : null,
                isPR && reviewers.length ? `| 👀 **Reviewer** | ${reviewerMentions} | ⏰ ${deadline}h |` : null,
              ].filter(Boolean).join("\n");

              const footer = [
                ``,
                `### 📋 Reviewer Commands`,
                `\`\`\``,
                `/assign @username       — Assign to specific person`,
                `/reassign @username     — Reassign to different person`,
                `/review @username       — Request specific reviewer`,
                `/escalate               — Escalate to leads`,
                `/claim                  — Self-assign this item`,
                `/remind @username [24h] — Set review reminder`,
                `\`\`\``,
                ``,
                `---`,
                `*🤖 ASH v5.0 OMEGA assignment engine · Session \`${SESSION_ID}\`*`,
              ].join("\n");

              await github.rest.issues.createComment({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                issue_number: itemNumber,
                body:        lines + footer,
              }).catch(e => core.warning(`Comment failed: ${e.message}`));
            }

            // ══════════════════════════════════════════════════════════════
            // PROCESS ITEMS
            // ══════════════════════════════════════════════════════════════
            const workload = await getCurrentWorkload();

            console.log("\n" + "═".repeat(60));
            console.log(`  👥 ASH Assignment Engine — ${OP_MODE.toUpperCase()}`);
            console.log("═".repeat(60));
            console.log("  📊 Current workload:");
            for (const [user, load] of Object.entries(workload)) {
              console.log(`     ${user.padEnd(18)} issues:${load.issues} prs:${load.prs} total:${load.total}`);
            }
            console.log("═".repeat(60));

            const stats = {
              processed: 0, assigned: 0, skipped: 0,
              reviewers_requested: 0, errors: 0,
            };

            // ── Collect items to process ─────────────────────────────────
            let items = [];

            const targetNum = parseInt("${{ needs.preflight.outputs.item_number || '0' }}");

            if (targetNum > 0) {
              const item = await github.rest.issues.get({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                issue_number: targetNum,
              }).catch(() => null);
              if (item) items.push(item.data);
            } else if (OP_MODE === "rebalance") {
              items = await github.paginate(github.rest.issues.listForRepo, {
                owner:    context.repo.owner,
                repo:     context.repo.repo,
                state:    "open",
                per_page: 100,
              });
            } else if (context.payload.issue) {
              items.push(context.payload.issue);
            } else if (context.payload.pull_request) {
              // Wrap PR as issue-like object
              const prData = await github.rest.pulls.get({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                pull_number: context.payload.pull_request.number,
              });
              items.push({ ...prData.data, pull_request: true });
            }

            // Force assignee override
            const forceAssignee = "${{ github.event.inputs.force_assignee || '' }}".trim();

            // ── Process each item ─────────────────────────────────────────
            for (const item of items) {
              const itemNum  = item.number;
              const isPR     = !!item.pull_request;
              const labels   = item.labels || [];
              const author   = item.user?.login || "";
              const existing = (item.assignees || []).map(a => a.login);

              // Skip if already assigned (unless rebalancing)
              if (existing.length > 0 && OP_MODE !== "rebalance") {
                console.log(`  ⏭️  #${itemNum} already assigned to [${existing.join(", ")}]`);
                stats.skipped++;
                continue;
              }

              console.log(`\n  ─── ${isPR?"PR":"Issue"} #${itemNum}: ${item.title?.slice(0,50)}`);
              console.log(`  📋 Labels: [${labels.map(l=>l.name).join(", ")}]`);
              console.log(`  👤 Author: @${author}`);

              stats.processed++;

              // ── Get routing ─────────────────────────────────────────────
              const routing = getRoutingFromLabels(labels);
              const labelNames = labels.map(l => l.name);
              const priority = labelNames.find(l => l.startsWith("priority:")) || "priority:medium";

              let finalAssignee;
              if (forceAssignee) {
                finalAssignee = forceAssignee;
                console.log(`  ⚡ Force assignee: @${forceAssignee}`);
              } else {
                finalAssignee = await selectBestAssignee(
                  routing.assignees, workload, isPR ? "pr" : "issue", author
                );
              }

              const finalReviewers = isPR
                ? routing.reviewers.filter(u => u !== author && u !== finalAssignee)
                : [];

              console.log(`  ✅ Assignee: @${finalAssignee}`);
              if (finalReviewers.length) console.log(`  👀 Reviewers: [${finalReviewers.join(", ")}]`);

              // ── Apply ────────────────────────────────────────────────────
              const result = await applyAssignment(
                itemNum,
                [finalAssignee],
                finalReviewers,
                isPR,
                author
              );

              // ── Update workload tracking ─────────────────────────────────
              if (workload[finalAssignee]) {
                if (isPR) workload[finalAssignee].prs++;
                else      workload[finalAssignee].issues++;
                workload[finalAssignee].total++;
              }

              // ── Post comment ─────────────────────────────────────────────
              if (result.assignees.length || result.reviewers.length) {
                await postAssignmentComment(
                  itemNum,
                  result.assignees,
                  result.reviewers,
                  isPR,
                  priority
                );
                stats.assigned++;
                if (result.reviewers.length) stats.reviewers_requested++;
              }

              // ── Set deadline label ───────────────────────────────────────
              const DEADLINE_LABELS = {
                "priority:critical": "deadline:4h",
                "priority:high":     "deadline:24h",
                "priority:medium":   "deadline:72h",
                "priority:low":      "deadline:7d",
              };
              const deadlineLabel = DEADLINE_LABELS[priority];
              if (deadlineLabel && !DRY_RUN) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  name:  deadlineLabel,
                  color: "ffd700",
                  description: `⏰ Review deadline: ${deadlineLabel.replace("deadline:","")}`,
                }).catch(() => {});
                await github.rest.issues.addLabels({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  issue_number: itemNum,
                  labels:      [deadlineLabel],
                }).catch(() => {});
              }
            }

            // ── Final summary ─────────────────────────────────────────────
            console.log("\n" + "═".repeat(60));
            console.log("  📊 ASSIGNMENT COMPLETE");
            console.log("═".repeat(60));
            console.log(`  Processed:  ${stats.processed}`);
            console.log(`  Assigned:   ${stats.assigned}`);
            console.log(`  Reviewers:  ${stats.reviewers_requested}`);
            console.log(`  Skipped:    ${stats.skipped}`);
            console.log("═".repeat(60));

            // Save stats
            fs.mkdirSync(WORK_DIR, { recursive: true });
            fs.writeFileSync(`${WORK_DIR}/stats.json`, JSON.stringify({
              session_id:  SESSION_ID,
              mode:        OP_MODE,
              dry_run:     DRY_RUN,
              workload,
              stats,
              timestamp:   new Date().toISOString(),
            }, null, 2));

            core.setOutput("assigned",   String(stats.assigned));
            core.setOutput("skipped",    String(stats.skipped));
            core.setOutput("processed",  String(stats.processed));

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — Handle comment commands (/assign /claim /escalate etc.)
  # ───────────────────────────────────────────────────────────────────────────
  handle-command:
    name: "⚡ Command · ${{ needs.preflight.outputs.command }}"
    needs: preflight
    if: needs.preflight.outputs.is_command == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "⚡ Execute assignment command"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const command = "${{ needs.preflight.outputs.command }}";
            const args    = "${{ needs.preflight.outputs.command_args }}".trim();
            const sender  = context.payload.comment?.user?.login || "";
            const issueNum= context.payload.issue?.number;
            const isPR    = !!context.payload.issue?.pull_request;

            if (!issueNum) return;

            async function react(emoji) {
              await github.rest.reactions.createForIssueComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: context.payload.comment.id,
                content:    emoji,
              }).catch(() => {});
            }

            async function comment(body) {
              await github.rest.issues.createComment({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                issue_number: issueNum,
                body,
              }).catch(() => {});
            }

            // Parse @username from args
            const targetUser = args.match(/@?(\w[\w-]+)/)?.[1] || sender;

            console.log(`  ⚡ Command: ${command}  args: "${args}"  sender: @${sender}`);

            switch (command) {

              case "assign": {
                await github.rest.issues.addAssignees({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  issue_number: issueNum,
                  assignees:   [targetUser],
                });
                if (isPR) {
                  await github.rest.pulls.requestReviewers({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    pull_number: issueNum,
                    reviewers:   [targetUser],
                  }).catch(() => {});
                }
                await comment(
                  `👥 **Assigned** @${targetUser} by @${sender}.\n\n`+
                  `@${targetUser} — you've been assigned this ${isPR?"PR":"issue"}. `+
                  `Please acknowledge by reacting to this comment. 🙏`
                );
                await react("+1");
                break;
              }

              case "unassign": {
                await github.rest.issues.removeAssignees({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  issue_number: issueNum,
                  assignees:   [targetUser],
                });
                await comment(`👤 **Unassigned** @${targetUser} by @${sender}.`);
                await react("+1");
                break;
              }

              case "reassign": {
                // Get current assignees, remove all, add new one
                const item = await github.rest.issues.get({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  issue_number: issueNum,
                });
                const current = (item.data.assignees || []).map(a => a.login);
                if (current.length) {
                  await github.rest.issues.removeAssignees({
                    owner:       context.repo.owner,
                    repo:        context.repo.repo,
                    issue_number: issueNum,
                    assignees:   current,
                  });
                }
                await github.rest.issues.addAssignees({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  issue_number: issueNum,
                  assignees:   [targetUser],
                });
                await comment(
                  `🔄 **Reassigned** from [${current.map(u=>`@${u}`).join(", ")}] `+
                  `to @${targetUser} by @${sender}.`
                );
                await react("+1");
                break;
              }

              case "claim": {
                await github.rest.issues.addAssignees({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  issue_number: issueNum,
                  assignees:   [sender],
                });
                await comment(
                  `✋ @${sender} has **claimed** this ${isPR?"PR":"issue"}.\n\n`+
                  `_Taking ownership and will provide updates._`
                );
                await react("+1");
                break;
              }

              case "unclaim": {
                await github.rest.issues.removeAssignees({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  issue_number: issueNum,
                  assignees:   [sender],
                });
                await comment(`✋ @${sender} has **unclaimed** this item.`);
                await react("-1");
                break;
              }

              case "escalate": {
                const LEADS = process.env.TEAM_LEADS?.split(",") || [];
                await github.rest.issues.addAssignees({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  issue_number: issueNum,
                  assignees:   LEADS,
                });
                await github.rest.issues.addLabels({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  issue_number: issueNum,
                  labels:      ["priority:critical"],
                }).catch(() => {});
                await comment(
                  `🚨 **Escalated** to leads by @${sender}.\n\n`+
                  `${LEADS.map(u=>`@${u}`).join(" ")} — urgent review requested.`
                );
                await react("rocket");
                break;
              }

              case "request_review": {
                if (!isPR) {
                  await comment("⚠️ Review requests only work on Pull Requests.");
                  break;
                }
                await github.rest.pulls.requestReviewers({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  pull_number: issueNum,
                  reviewers:   [targetUser],
                });
                await comment(
                  `👀 **Review requested** from @${targetUser} by @${sender}.\n\n`+
                  `@${targetUser} — please review when available! ⏰`
                );
                await react("+1");
                break;
              }

              case "remind": {
                // Parse duration from args (e.g., "24h", "2d")
                const durationMatch = args.match(/(\d+)(h|d|m)/);
                const duration = durationMatch
                  ? `${durationMatch[1]}${durationMatch[2]}`
                  : "24h";
                await comment(
                  `⏰ **Reminder set** by @${sender}: @${targetUser} please review in ${duration}.\n\n`+
                  `_This is a manual reminder — automated follow-up will be sent if needed._`
                );
                await react("eyes");
                break;
              }

              case "delegate": {
                // Transfer assignment to another team member
                await github.rest.issues.removeAssignees({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  issue_number: issueNum,
                  assignees:   [sender],
                }).catch(() => {});
                await github.rest.issues.addAssignees({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  issue_number: issueNum,
                  assignees:   [targetUser],
                });
                await comment(
                  `📤 @${sender} **delegated** to @${targetUser}.\n\n`+
                  `@${targetUser} — this item has been transferred to you.`
                );
                await react("+1");
                break;
              }

              case "balance": {
                await comment(
                  `⚖️ @${sender} requested workload rebalance.\n\n`+
                  `Running rebalance workflow... check Actions for progress.`
                );
                await react("eyes");
                break;
              }

              default:
                core.warning(`Unknown command: ${command}`);
                await react("-1");
            }

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4 — Scheduled review reminders
  # ───────────────────────────────────────────────────────────────────────────
  review-reminders:
    name: "⏰ Reminders · Overdue Review Detection"
    needs: preflight
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.mode == 'remind'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: "⏰ Send overdue review reminders"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const DEADLINE_HOURS = {
              "priority:critical": 4,
              "priority:high":     24,
              "priority:medium":   72,
              "priority:low":      168,
              "default":           72,
            };

            // Fetch open PRs with pending reviews
            const prs = await github.paginate(github.rest.pulls.list, {
              owner:    context.repo.owner,
              repo:     context.repo.repo,
              state:    "open",
              per_page: 100,
            });

            let reminders = 0;
            const now = Date.now();

            for (const pr of prs) {
              if (pr.draft) continue;

              const labels     = (pr.labels || []).map(l => l.name);
              const priorLabel = labels.find(l => l.startsWith("priority:")) || "default";
              const deadline   = DEADLINE_HOURS[priorLabel] || 72;
              const ageHours   = (now - new Date(pr.updated_at).getTime()) / 3600000;

              if (ageHours < deadline) continue;

              // Get requested reviewers
              const reviews = await github.rest.pulls.listRequestedReviewers({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                pull_number: pr.number,
              }).catch(() => ({ data: { users: [] } }));

              const pending = (reviews.data.users || []).map(u => u.login);
              if (!pending.length) continue;

              const ageRounded = Math.floor(ageHours);
              const overduePct  = Math.floor((ageHours / deadline - 1) * 100);

              console.log(`  ⏰ PR #${pr.number} overdue by ${overduePct}% — reviewers: [${pending.join(", ")}]`);

              await github.rest.issues.createComment({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                issue_number: pr.number,
                body: [
                  `## ⏰ Review Reminder`,
                  ``,
                  `This PR has been waiting for review for **${ageRounded} hours** `+
                  `(deadline: ${deadline}h · ${overduePct}% overdue).`,
                  ``,
                  `${pending.map(u=>`@${u}`).join(" ")} — your review is requested.`,
                  ``,
                  `| Metric | Value |`,
                  `|--------|-------|`,
                  `| ⏳ Age | ${ageRounded}h |`,
                  `| 🎯 Deadline | ${deadline}h |`,
                  `| 📊 Priority | \`${priorLabel}\` |`,
                  `| 📋 PR Size | ${pr.additions + pr.deletions} lines |`,
                  ``,
                  `_If unable to review, please use \`/delegate @username\` to reassign._`,
                  ``,
                  `---`,
                  `*⏰ ASH v5.0 OMEGA automated reminder*`,
                ].join("\n"),
              }).catch(e => core.warning(`Reminder failed #${pr.number}: ${e.message}`));

              reminders++;
            }

            console.log(`\n  ⏰ Sent ${reminders} review reminders`);
            core.setOutput("reminders_sent", String(reminders));

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 5 — Workload report & Discord notification
  # ───────────────────────────────────────────────────────────────────────────
  workload-report:
    name: "📊 Report · Team Workload Analytics"
    needs: [preflight, assign-engine]
    if: |
      always() &&
      (github.event_name == 'schedule' ||
       github.event.inputs.mode == 'report' ||
       github.event.inputs.mode == 'rebalance')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "📊 Generate workload report"
        id: report
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const TEAM = ["ash-lead","ash-core","ash-dev1","ash-dev2","ash-contrib1"];

            // Fetch all open items
            const allItems = await github.paginate(github.rest.issues.listForRepo, {
              owner:    context.repo.owner,
              repo:     context.repo.repo,
              state:    "open",
              per_page: 100,
            });

            const workload = {};
            for (const u of TEAM) {
              workload[u] = {
                issues: [], prs: [], critical: 0, high: 0, oldest_days: 0,
              };
            }

            const now = Date.now();
            for (const item of allItems) {
              const ageDays = Math.floor((now - new Date(item.updated_at)) / 86400000);
              const labels  = (item.labels || []).map(l => l.name);
              const isPR    = !!item.pull_request;

              for (const a of (item.assignees || [])) {
                if (!workload[a.login]) continue;
                if (isPR) workload[a.login].prs.push(item.number);
                else      workload[a.login].issues.push(item.number);
                if (labels.includes("priority:critical")) workload[a.login].critical++;
                if (labels.includes("priority:high"))     workload[a.login].high++;
                if (ageDays > workload[a.login].oldest_days) workload[a.login].oldest_days = ageDays;
              }
            }

            // Build markdown report
            const tableRows = TEAM.map(u => {
              const w = workload[u] || { issues: [], prs: [], critical: 0, high: 0, oldest_days: 0 };
              const total  = w.issues.length + w.prs.length;
              const status = total > 12 ? "🔴 Overloaded"
                           : total > 7  ? "🟡 Heavy"
                           : total > 3  ? "🟢 Normal"
                           : "⚪ Light";
              return `| @${u} | ${w.issues.length} | ${w.prs.length} | **${total}** | ${w.critical} | ${w.high} | ${w.oldest_days}d | ${status} |`;
            });

            const report = [
              `# 📊 ASH Team Workload Report`,
              ``,
              `> Generated: \`${new Date().toISOString()}\``,
              ``,
              `## 👥 Team Capacity`,
              ``,
              `| Maintainer | Issues | PRs | Total | 🚨 Critical | 🔴 High | Oldest | Status |`,
              `|------------|--------|-----|-------|-------------|---------|--------|--------|`,
              ...tableRows,
              ``,
              `## 📈 Summary`,
              ``,
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Total open items | \`${allItems.length}\` |`,
              `| Unassigned | \`${allItems.filter(i => !i.assignees?.length).length}\` |`,
              `| Critical open | \`${allItems.filter(i => i.labels?.some(l=>l.name==="priority:critical")).length}\` |`,
              ``,
              `---`,
              `*📊 ASH v5.0 OMEGA workload analytics*`,
            ].join("\n");

            require("fs").writeFileSync(process.env.GITHUB_STEP_SUMMARY, report);
            core.setOutput("report", report.slice(0, 1000));

            console.log("  ✅ Workload report generated");

      - name: "🔔 Discord workload notification"
        if: |
          github.event_name == 'schedule' &&
          github.event.inputs.notify_discord != 'false'
        continue-on-error: true
        run: |
          [[ -z "${DISCORD_WEBHOOK_ASSIGN:-}" ]] && exit 0

          PAYLOAD=$(cat << 'EOF'
          {
            "username": "ASH Assignment Engine",
            "avatar_url": "https://raw.githubusercontent.com/${{ github.repository }}/main/assets/brand/logos/ash-logo-256.png",
            "embeds": [{
              "title": "📊 Weekly Workload Report",
              "description": "Team assignment summary for ASH Dotfiles",
              "color": 5793266,
              "fields": [
                {"name": "📋 Open Items", "value": "See GitHub Summary", "inline": true},
                {"name": "📅 Schedule",   "value": "Weekly rotation",    "inline": true}
              ],
              "footer": {"text": "ASH Dotfiles v5.0 OMEGA"},
              "timestamp": "${{ github.run_started_at }}"
            }]
          }
          EOF
          )
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${DISCORD_WEBHOOK_ASSIGN}" || true
        env:
          DISCORD_WEBHOOK_ASSIGN: ${{ secrets.DISCORD_WEBHOOK_ASSIGN }}