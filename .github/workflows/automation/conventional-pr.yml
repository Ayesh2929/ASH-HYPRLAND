name: "🚀 PR Title Validation"

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches:
      - main
      - develop

permissions:
  pull-requests: write

jobs:
  validate:
    name: "Validate PR Title"
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            themes
            plugins
            api
            web
            scripts
            config
            docker
            nix
            ci
            docs
            hyprland
            waybar
            rofi
            kitty
            fish
            dunst
          requireScope: false
