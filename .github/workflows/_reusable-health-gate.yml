name: "🩺 Health Gate"
on:
  workflow_call:
    inputs:
      deploy_url:
        type: string
        required: true
      health_endpoint:
        type: string
        required: false
        default: '/health'
      check_duration_seconds:
        type: string
        required: false
        default: '300'
      check_interval_seconds:
        type: string
        required: false
        default: '30'
      max_failures:
        type: string
        required: false
        default: '3'
    outputs:
      healthy:
        value: ${{ jobs.monitor.outputs.healthy }}
      checks_passed:
        value: ${{ jobs.monitor.outputs.checks_passed }}
      checks_failed:
        value: ${{ jobs.monitor.outputs.checks_failed }}

jobs:
  monitor:
    name: "🩺 Health Monitor"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      healthy: ${{ steps.monitor.outputs.healthy }}
      checks_passed: ${{ steps.monitor.outputs.checks_passed }}
      checks_failed: ${{ steps.monitor.outputs.checks_failed }}
    steps:
      - name: "🩺 Monitor deployment health"
        id: monitor
        env:
          URL: ${{ inputs.deploy_url }}${{ inputs.health_endpoint }}
          DURATION: ${{ inputs.check_duration_seconds }}
          INTERVAL: ${{ inputs.check_interval_seconds }}
          MAX_FAIL: ${{ inputs.max_failures }}
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          CONSECUTIVE_FAIL=0
          END_TIME=$(( $(date +%s) + DURATION ))

          echo "## 🩺 Health Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "Monitoring $URL for ${DURATION}s (every ${INTERVAL}s, max ${MAX_FAIL} consecutive failures)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Time | Status | Response |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|----------|" >> "$GITHUB_STEP_SUMMARY"

          while [[ $(date +%s) -lt $END_TIME ]]; do
            TIMESTAMP=$(date +%H:%M:%S)
            HTTP_CODE=$(curl -sSo /dev/null -w '%{http_code}' --max-time 10 "$URL" 2>/dev/null || echo "000")

            if [[ "$HTTP_CODE" =~ ^2[0-9]{2}$ ]]; then
              PASSED=$((PASSED + 1))
              CONSECUTIVE_FAIL=0
              echo "| $TIMESTAMP | ✅ $HTTP_CODE | Healthy |" >> "$GITHUB_STEP_SUMMARY"
            else
              FAILED=$((FAILED + 1))
              CONSECUTIVE_FAIL=$((CONSECUTIVE_FAIL + 1))
              echo "| $TIMESTAMP | ❌ $HTTP_CODE | Unhealthy |" >> "$GITHUB_STEP_SUMMARY"

              if [[ $CONSECUTIVE_FAIL -ge $MAX_FAIL ]]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "**❌ UNHEALTHY: $CONSECUTIVE_FAIL consecutive failures exceeded threshold ($MAX_FAIL)**" >> "$GITHUB_STEP_SUMMARY"
                echo "healthy=false" >> "$GITHUB_OUTPUT"
                echo "checks_passed=$PASSED" >> "$GITHUB_OUTPUT"
                echo "checks_failed=$FAILED" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            fi
            sleep "$INTERVAL"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          TOTAL=$((PASSED + FAILED))
          RATE=$( [[ $TOTAL -gt 0 ]] && echo "$((PASSED * 100 / TOTAL))" || echo "0" )
          echo "**✅ HEALTHY: $PASSED/$TOTAL checks passed ($RATE% success rate)**" >> "$GITHUB_STEP_SUMMARY"
          echo "healthy=true" >> "$GITHUB_OUTPUT"
          echo "checks_passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "checks_failed=$FAILED" >> "$GITHUB_OUTPUT"
