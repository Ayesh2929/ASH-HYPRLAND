name: "🔒 Security"
on:
  workflow_call:
    inputs:
      web_exists:
        type: string
        required: true
      web_lock_exists:
        type: string
        required: true
      api_exists:
        type: string
        required: true
      matrix_languages:
        type: string
        required: true


jobs:
  sec-secrets:
    name: "🔍 Secret Scanning"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - name: "📥 Checkout (full history)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "🔍 Gitleaks"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: "🔍 TruffleHog OSS"
        uses: trufflesecurity/trufflehog@v3.82.0
        with:
          path: "./"
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: "--only-verified --json"
      - name: "📊 Upload reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "sec-secrets-${{ github.run_id }}"
          path: |
            gitleaks-report.json
            trufflehog-report.json
          retention-days: 30
          if-no-files-found: ignore

  sec-deps:
    name: "🛡️ Dependency Audit"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: "🔍 NPM audit"
        if: inputs.web_exists == 'true'
        working-directory: web
        run: |
          npm audit --audit-level=moderate --json > npm-audit.json 2>&1 || true
          CRIT=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit.json)
          [[ "$CRIT" -gt 0 ]] && exit 1 || true
      - name: "🔍 Trivy FS scan"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: "🐍 Safety (Python)"
        if: inputs.api_exists == 'true'
        working-directory: api
        run: |
          pip install safety --quiet
          safety check --file requirements.txt --json --output safety-report.json --continue-on-error || true

  sec-codeql:
    name: "🔬 CodeQL"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: inputs.matrix_languages != '[]' && inputs.matrix_languages != ''
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.matrix_languages) }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
      - name: "🔬 Init CodeQL"
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: "🏗️ Autobuild"
        uses: github/codeql-action/autobuild@v4
      - name: "🔍 Analyze"
        uses: github/codeql-action/analyze@v4
        with:
          category: "codeql-${{ matrix.language }}"

  sec-permissions:
    name: "🔐 Permissions Audit"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
      - name: "🔐 Check executable permissions"
        run: |
          set -euo pipefail
          ISSUES=0
          # Scripts should be executable
          while IFS= read -r -d '' f; do
            if [[ ! -x "$f" ]]; then (( ISSUES++ )) || true; fi
          done < <(find . -name "*.sh" ! -path "./.git/*" ! -path "./node_modules/*" -print0)
          # Non-scripts should NOT be executable
          while IFS= read -r -d '' f; do
            if [[ -x "$f" ]]; then (( ISSUES++ )) || true; fi
          done < <(find . \( -name "*.json" -o -name "*.yaml" -o -name "*.yml" -o -name "*.toml" -o -name "*.md" \) ! -path "./.git/*" ! -path "./node_modules/*" -print0)
          [[ $ISSUES -gt 20 ]] && exit 1 || echo "Permissions OK"
