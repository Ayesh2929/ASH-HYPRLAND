# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.1.0 — PULL REQUEST QUALITY GATES                 ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

name: 🔎 PR Check

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:

  pr-title:
    name: 📝 PR Title
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Validate conventional commit format
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|chore|ci|revert)(\(.+\))?: .{1,72}$"

          if echo "$TITLE" | grep -qE "$PATTERN"; then
              echo "✅ PR title valid: $TITLE"
          else
              echo "❌ PR title doesn't follow Conventional Commits format"
              echo ""
              echo "Expected: <type>(<scope>): <description>"
              echo "Example:  feat(waybar): add GPU temperature module"
              echo ""
              echo "Types: feat|fix|docs|style|refactor|perf|test|chore|ci|revert"
              echo "Scopes: hypr|waybar|rofi|fish|nvim|theme|cli|docs|scripts"
              exit 1
          fi

  pr-size:
    name: 📏 PR Size Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📏 Analyze PR size
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null | wc -l)
          ADDITIONS=$(git diff --stat origin/${{ github.base_ref }}...HEAD 2>/dev/null | \
              tail -1 | grep -oP '\d+(?= insertion)' || echo "0")
          DELETIONS=$(git diff --stat origin/${{ github.base_ref }}...HEAD 2>/dev/null | \
              tail -1 | grep -oP '\d+(?= deletion)' || echo "0")

          echo "📊 PR Statistics:"
          echo "  Files changed: $FILES"
          echo "  Lines added:   $ADDITIONS"
          echo "  Lines removed: $DELETIONS"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📏 PR Size" >> $GITHUB_STEP_SUMMARY
          echo "- Files changed: **$FILES**" >> $GITHUB_STEP_SUMMARY
          echo "- Lines added: **$ADDITIONS**" >> $GITHUB_STEP_SUMMARY
          echo "- Lines removed: **$DELETIONS**" >> $GITHUB_STEP_SUMMARY

          if [[ $FILES -gt 100 ]]; then
              echo "::warning::Very large PR ($FILES files). Consider splitting."
          elif [[ $FILES -gt 50 ]]; then
              echo "::notice::Large PR ($FILES files). Consider splitting if possible."
          fi

  pr-safety:
    name: 🛡️ PR Safety
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Check for generated files
        run: |
          GENERATED=(
              "config/hypr/themes/active.conf"
              "config/hypr/UserOverrides/user.conf"
              "config/kitty/themes/current.conf"
              "config/waybar/styles/colors.css"
              "config/rofi/themes/ash-dynamic.rasi"
              "config/fish/themes/current.fish"
              "config/dunst/dunstrc"
          )

          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null)

          for gen in "${GENERATED[@]}"; do
              if echo "$CHANGED" | grep -qF "$gen"; then
                  echo "::warning file=${gen}::This file is auto-generated by theme-engine.sh"
              fi
          done

      - name: 🔍 Check UserOverrides not committed
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null)
          if echo "$CHANGED" | grep -q "UserOverrides/user.conf"; then
              echo "::error::UserOverrides/user.conf must NOT be committed — it's in .gitignore"
              exit 1
          fi
          echo "✅ UserOverrides not in PR"

      - name: 🔍 Validate changed scripts
        run: |
          FAILED=0
          CHANGED_SCRIPTS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null \
              | grep '\.sh$' || true)

          if [[ -z "$CHANGED_SCRIPTS" ]]; then
              echo "No shell scripts changed"
              exit 0
          fi

          while IFS= read -r script; do
              [[ -z "$script" ]] && continue
              [[ ! -f "$script" ]] && continue

              if bash -n "$script" 2>/dev/null; then
                  echo "  ✅ $script"
              else
                  echo "  ❌ Syntax error: $script"
                  bash -n "$script" 2>&1 | head -5
                  FAILED=$((FAILED+1))
              fi
          done <<< "$CHANGED_SCRIPTS"

          [[ $FAILED -gt 0 ]] && exit 1
          echo "✅ All changed scripts have valid syntax"

  auto-label:
    name: 🏷️ Auto Label
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

  review-reminder:
    name: 💬 Review Reminder
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'

    steps:
      - name: 💬 Add welcome comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🎉 Thank you for your contribution!

            ### 📋 PR Checklist
            Before this can be merged, please ensure:
            - [ ] PR title follows Conventional Commits format
            - [ ] Shell scripts have \`set -euo pipefail\`
            - [ ] No hardcoded paths (use \`\${HOME}\` not \`/home/user\`)
            - [ ] Generated files NOT committed
            - [ ] \`UserOverrides/user.conf\` NOT committed
            - [ ] Tested locally with \`ash doctor\`
            - [ ] Documentation updated if needed

            ### 🔍 Automated Checks
            CI will automatically check:
            - Syntax validation (bash, lua, json, fish)
            - ShellCheck linting
            - Security scanning
            - File count verification

            ### 🚀 After Merge
            Users can update with: \`ash update\`

            *ASH Dotfiles CI/CD — Automated message*`
            })