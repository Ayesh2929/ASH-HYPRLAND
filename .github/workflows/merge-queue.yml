name: "🚀 Merge Queue Validation"

on:
  merge_group:

concurrency:
  group: "merge-queue-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: QUICK LINT
  # ────────────────────────────────────────────────────────────────────────────
  quick-lint:
    name: "🧹 Quick Lint"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: "🧹 Run ShellCheck on Changed Files"
        run: |
          changed_sh=$(git diff --name-only HEAD~1 | grep '\.sh$' || true)
          if [ -n "$changed_sh" ]; then
            shellcheck $changed_sh
          else
            echo "No shell scripts changed."
          fi
      
      - name: "🧹 Run Yamllint on Changed Files"
        run: |
          sudo apt-get install -y yamllint
          changed_yaml=$(git diff --name-only HEAD~1 | grep -E '\.ya?ml$' || true)
          if [ -n "$changed_yaml" ]; then
            yamllint $changed_yaml
          else
            echo "No YAML files changed."
          fi
          
      - name: "🧹 Validate Changed JSON Files"
        run: |
          changed_json=$(git diff --name-only HEAD~1 | grep '\.json$' || true)
          if [ -n "$changed_json" ]; then
            for file in $changed_json; do
              if [ -f "$file" ]; then
                jq empty "$file" || exit 1
              fi
            done
          else
            echo "No JSON files changed."
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: QUICK SECURITY
  # ────────────────────────────────────────────────────────────────────────────
  quick-security:
    name: "🔒 Quick Security Scan"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🔑 Gitleaks Scan"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: "📦 Dependency Check (NPM & Pip)"
        run: |
          if [ -f "package.json" ]; then
            npm audit --audit-level=high
          fi
          if [ -f "requirements.txt" ]; then
            pip install pip-audit
            pip-audit -r requirements.txt
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: QUICK TEST
  # ────────────────────────────────────────────────────────────────────────────
  quick-test:
    name: "🧪 Quick Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🧪 Run Pytest Smoke"
        run: |
          if [ -d "api/tests" ]; then
            pip install pytest
            pytest api/tests/ --timeout=30 -x
          else
            echo "No api/tests directory found, skipping pytest."
          fi
          
      - name: "🧪 Run Vitest"
        run: |
          if [ -f "package.json" ] && grep -q '"vitest"' package.json; then
            npm ci
            npx vitest run
          else
            echo "Vitest not configured, skipping."
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: VALIDATE CONFIGS
  # ────────────────────────────────────────────────────────────────────────────
  validate-configs:
    name: "⚙️ Validate Configs"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Check Hyprland Brace Balance"
        run: |
          for conf in $(find . -name "*.conf"); do
            open=$(grep -o "{" "$conf" | wc -l)
            close=$(grep -o "}" "$conf" | wc -l)
            if [ "$open" -ne "$close" ]; then
              echo "❌ Brace mismatch in $conf: {=$open, }=$close"
              exit 1
            fi
          done
          echo "✅ Hyprland brace balance OK."
          
      - name: "🎨 Check Theme JSON Schemas"
        run: |
          if [ -d "themes" ]; then
            for theme in themes/*.json; do
              if [ -f "$theme" ]; then
                jq empty "$theme" || exit 1
              fi
            done
            echo "✅ Theme JSON syntax OK."
          fi
