name: "🩺 Post-Deploy Monitor"
on:
  workflow_call:
    inputs:
      deploy_url:
        type: string
        required: true
      service:
        type: string
        required: true
      rollback_on_failure:
        type: string
        required: false
        default: 'true'

jobs:
  monitor:
    name: "🩺 Post-Deploy Monitor (${{ inputs.service }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "🩺 Health monitoring"
        id: health
        env:
          URL: ${{ inputs.deploy_url }}
        run: |
          set -euo pipefail
          PASSED=0
          FAILED=0
          CONSECUTIVE_FAIL=0
          MAX_FAIL=3
          DURATION=300
          INTERVAL=30
          END_TIME=$(( $(date +%s) + DURATION ))

          echo "## 🩺 Post-Deploy Monitor: ${{ inputs.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Monitoring ${URL}/health for ${DURATION}s" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          while [[ $(date +%s) -lt $END_TIME ]]; do
            HTTP_CODE=$(curl -sSo /dev/null -w '%{http_code}' --max-time 10 "${URL}/health" 2>/dev/null || echo "000")
            if [[ "$HTTP_CODE" =~ ^2[0-9]{2}$ ]]; then
              PASSED=$((PASSED + 1))
              CONSECUTIVE_FAIL=0
            else
              FAILED=$((FAILED + 1))
              CONSECUTIVE_FAIL=$((CONSECUTIVE_FAIL + 1))
              if [[ $CONSECUTIVE_FAIL -ge $MAX_FAIL ]]; then
                echo "❌ **UNHEALTHY**: $CONSECUTIVE_FAIL consecutive failures" >> "$GITHUB_STEP_SUMMARY"
                echo "healthy=false" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            fi
            sleep "$INTERVAL"
          done

          TOTAL=$((PASSED + FAILED))
          echo "✅ **HEALTHY**: $PASSED/$TOTAL checks passed" >> "$GITHUB_STEP_SUMMARY"
          echo "healthy=true" >> "$GITHUB_OUTPUT"

  auto-rollback:
    name: "⏪ Auto-Rollback"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: monitor
    if: failure() && inputs.rollback_on_failure == 'true'
    steps:
      - name: "⏪ Trigger rollback"
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '_reusable-rollback.yml',
              ref: 'main',
              inputs: {
                service: '${{ inputs.service }}',
                target_version: 'previous',
                reason: 'Auto-rollback: health check failed after deployment'
              }
            });
            core.notice('⏪ Auto-rollback triggered due to health check failure');

      - name: "📋 Create incident"
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Auto-Rollback: ${{ inputs.service }} health check failed`,
              body: `## Incident\n- **Service**: ${{ inputs.service }}\n- **Action**: Auto-rollback triggered\n- **Run**: [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n- **Time**: ${new Date().toISOString()}`,
              labels: ['incident', 'auto-rollback', 'priority: critical']
            });
