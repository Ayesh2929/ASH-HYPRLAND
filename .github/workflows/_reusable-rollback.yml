name: "⏪ Rollback"
on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true
        description: "Service to rollback: api, web, docker, all"
      target_version:
        type: string
        required: false
        default: 'previous'
        description: "Tag/version to rollback to, or 'previous'"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to rollback"
        required: true
        type: choice
        options:
          - api
          - web
          - docker
          - all
      target_version:
        description: "Tag to rollback to (or 'previous')"
        required: false
        default: 'previous'
        type: string
      reason:
        description: "Reason for rollback"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  deployments: write
  issues: write

jobs:
  determine-target:
    name: "🔍 Determine Rollback Target"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api_tag: ${{ steps.resolve.outputs.api_tag }}
      docker_tag: ${{ steps.resolve.outputs.docker_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "🔍 Resolve version"
        id: resolve
        env:
          TARGET: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == "previous" ]]; then
            PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
            [[ -z "$PREV_TAG" ]] && PREV_TAG=$(git rev-parse HEAD~1)
          else
            PREV_TAG="$TARGET"
          fi
          echo "api_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "docker_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "## ⏪ Rollback Target: $PREV_TAG" >> "$GITHUB_STEP_SUMMARY"

  rollback-api:
    name: "🌐 Rollback API"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: determine-target
    if: inputs.service == 'api' || inputs.service == 'all'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: "⏪ Deploy previous API version"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TARGET_TAG: ${{ needs.determine-target.outputs.api_tag }}
        run: |
          set -euo pipefail
          cd api
          echo "Rolling back API to $TARGET_TAG"
          flyctl deploy --image ghcr.io/${{ github.repository }}/api:${TARGET_TAG} --remote-only 2>&1 || {
            echo "Image-based rollback failed, deploying from git tag"
            git checkout "$TARGET_TAG" -- api/
            flyctl deploy --remote-only
          }
      - name: "🩺 Post-rollback health check"
        run: |
          set -euo pipefail
          sleep 10
          for i in $(seq 1 5); do
            if curl -sSf "https://api.ash-dotfiles.dev/health" > /dev/null 2>&1; then
              echo "✅ API healthy after rollback (attempt $i)"
              exit 0
            fi
            sleep 5
          done
          echo "❌ API health check failed after rollback"
          exit 1

  rollback-docker:
    name: "🐳 Rollback Docker"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: determine-target
    if: inputs.service == 'docker' || inputs.service == 'all'
    steps:
      - name: "🔐 Login to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "⏪ Re-tag previous image as latest"
        env:
          TARGET_TAG: ${{ needs.determine-target.outputs.docker_tag }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}"
          echo "Pulling $IMAGE:$TARGET_TAG"
          docker pull "$IMAGE:$TARGET_TAG" || { echo "❌ Tag not found"; exit 1; }
          docker tag "$IMAGE:$TARGET_TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          echo "✅ Rolled back Docker image to $TARGET_TAG" >> "$GITHUB_STEP_SUMMARY"

  create-incident:
    name: "📋 Create Incident Issue"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [rollback-api, rollback-docker]
    if: always() && (needs.rollback-api.result == 'success' || needs.rollback-docker.result == 'success')
    steps:
      - name: "📋 Create rollback incident"
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⏪ Rollback: ${context.payload.inputs?.service || 'unknown'} → ${context.payload.inputs?.target_version || 'previous'}`;
            const body = [
              `## Rollback Incident`,
              `- **Service**: ${context.payload.inputs?.service || 'unknown'}`,
              `- **Target Version**: ${context.payload.inputs?.target_version || 'previous'}`,
              `- **Reason**: ${context.payload.inputs?.reason || 'Not specified'}`,
              `- **Triggered by**: @${context.actor}`,
              `- **Workflow Run**: [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              `- **Time**: ${new Date().toISOString()}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body,
              labels: ['incident', 'rollback', 'priority: critical']
            });

  notify:
    name: "💬 Notify"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [rollback-api, rollback-docker, create-incident]
    if: always()
    steps:
      - name: "💬 Discord notification"
        if: env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail
          curl -sSf -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"⏪ Rollback Executed\",
              \"color\": 15548997,
              \"fields\": [
                {\"name\": \"Service\", \"value\": \"${{ inputs.service }}\", \"inline\": true},
                {\"name\": \"Target\", \"value\": \"${{ inputs.target_version }}\", \"inline\": true},
                {\"name\": \"Reason\", \"value\": \"${{ inputs.reason || 'Auto-rollback' }}\", \"inline\": false}
              ],
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" "$DISCORD_WEBHOOK" || true
