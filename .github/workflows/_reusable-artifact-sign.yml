name: "🔏 Artifact Sign"
on:
  workflow_call:
    inputs:
      image_digest:
        type: string
        required: true
        description: "Docker image digest to sign"
      image_name:
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  sign:
    name: "🔏 Sign & Attest"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: "🔏 Install Cosign"
        uses: sigstore/cosign-installer@v3

      - name: "🔐 Login to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔏 Sign image (keyless)"
        env:
          DIGEST: ${{ inputs.image_digest }}
          IMAGE: ${{ inputs.image_name || format('ghcr.io/{0}', github.repository) }}
        run: |
          set -euo pipefail
          echo "Signing $IMAGE@$DIGEST"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "## 🔏 Artifact Signing" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Digest**: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Signed**: ✅ Keyless (Sigstore OIDC)" >> "$GITHUB_STEP_SUMMARY"

      - name: "✅ Verify signature"
        env:
          DIGEST: ${{ inputs.image_digest }}
          IMAGE: ${{ inputs.image_name || format('ghcr.io/{0}', github.repository) }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}" || echo "⚠️ Verification failed (expected on first run)"
