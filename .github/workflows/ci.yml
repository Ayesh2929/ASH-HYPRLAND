name: "🚀 ASH Dotfiles — Ultra CI/CD v5.0"

# ══════════════════════════════════════════════════════════════════════════════
#  TRIGGERS
# ══════════════════════════════════════════════════════════════════════════════
on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
      - "feature/**"
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "docs/changelog/**"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"

  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, ready_for_review]

  pull_request_target:
    branches: [main]
    types: [labeled]

  workflow_dispatch:
    inputs:
      pipeline_mode:
        description: "🎛️ Pipeline Mode"
        required: true
        default: "standard"
        type: choice
        options:
          - standard
          - full
          - screenshots-only
          - security-only
          - benchmark-only
          - deploy-only
          - lint-only
          - dry-run

      target_themes:
        description: "🎨 Themes (comma-separated or 'all')"
        required: false
        default: "dark-rosepine,light-catppuccin"
        type: string

      enable_benchmarks:
        description: "📊 Run benchmarks"
        required: false
        default: false
        type: boolean

      deploy_preview:
        description: "🌐 Deploy preview"
        required: false
        default: false
        type: boolean

      debug_mode:
        description: "🐛 Debug output"
        required: false
        default: false
        type: boolean

      notify_discord:
        description: "💬 Send Discord notification"
        required: false
        default: true
        type: boolean

  schedule:
    # Nightly full pipeline — 02:00 UTC
    - cron: "0 2 * * *"
    # Weekly security deep-scan — Monday 04:00 UTC
    - cron: "0 4 * * 1"
    # Monthly benchmark baseline — 1st 06:00 UTC
    - cron: "0 6 1 * *"

# ══════════════════════════════════════════════════════════════════════════════
#  CONCURRENCY — cancel redundant runs except on main
# ══════════════════════════════════════════════════════════════════════════════
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ══════════════════════════════════════════════════════════════════════════════
#  GLOBAL ENVIRONMENT
# ══════════════════════════════════════════════════════════════════════════════
env:
  # ── Versioning ─────────────────────────────────────────────────────────────
  ASH_VERSION:             "5.0.0-omega"
  ASH_PIPELINE_VERSION:   "3.0.0"
  ASH_ENV:                "ci"

  # ── Tooling versions ────────────────────────────────────────────────────────
  NODE_VERSION:            "20.x"
  PYTHON_VERSION:          "3.12"
  GO_VERSION:              "1.22"
  RUST_VERSION:            "stable"
  RESVG_VERSION:           "0.42.0"

  # ── Asset quality ───────────────────────────────────────────────────────────
  WEBP_QUALITY:            "92"
  WEBP_METHOD:             "6"
  AVIF_MIN:                "20"
  AVIF_MAX:                "35"
  THUMB_W:                 "640"
  THUMB_H:                 "360"
  SHOT_W:                  "2560"
  SHOT_H:                  "1440"

  # ── Performance thresholds ──────────────────────────────────────────────────
  MAX_STARTUP_MS:          "500"
  MAX_WEBP_KB:             "250"
  MAX_THUMB_KB:            "45"
  MAX_BUNDLE_KB:           "512"

  # ── Paths ──────────────────────────────────────────────────────────────────
  SHOTS_DIR:               "assets/screenshots/desktop"
  SVG_DIR:                 "assets/brand/svg-masters"
  THEMES_DIR:              "themes/presets"

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

# ══════════════════════════════════════════════════════════════════════════════
#  JOBS
# ══════════════════════════════════════════════════════════════════════════════
jobs:

# ┌─────────────────────────────────────────────────────────────────────────────
# │  STAGE 00 — 🧠 INTELLIGENCE & MATRIX BUILDER
# └─────────────────────────────────────────────────────────────────────────────
  intelligence:
    name: "🧠 Pipeline Intelligence"
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      pull-requests: read

    outputs:
      # Change flags
      has_screenshots:   ${{ steps.filter.outputs.screenshots }}
      has_themes:        ${{ steps.filter.outputs.themes }}
      has_plugins:       ${{ steps.filter.outputs.plugins }}
      has_scripts:       ${{ steps.filter.outputs.scripts }}
      has_nvim:          ${{ steps.filter.outputs.nvim }}
      has_fish:          ${{ steps.filter.outputs.fish }}
      has_waybar:        ${{ steps.filter.outputs.waybar }}
      has_hypr:          ${{ steps.filter.outputs.hypr }}
      has_api:           ${{ steps.filter.outputs.api }}
      has_web:           ${{ steps.filter.outputs.web }}
      web_exists:        ${{ steps.web.outputs.exists }}
      web_lock_exists:   ${{ steps.web.outputs.lock_exists }}
      api_exists:        ${{ steps.api.outputs.exists }}
      # Pipeline decisions
      run_full:          ${{ steps.decide.outputs.run_full }}
      run_screenshots:   ${{ steps.decide.outputs.run_screenshots }}
      run_security:      ${{ steps.decide.outputs.run_security }}
      run_benchmarks:    ${{ steps.decide.outputs.run_benchmarks }}
      run_deploy:        ${{ steps.decide.outputs.run_deploy }}
      is_release:        ${{ steps.decide.outputs.is_release }}
      is_nightly:        ${{ steps.decide.outputs.is_nightly }}
      pipeline_mode:     ${{ steps.decide.outputs.pipeline_mode }}
      # Matrices (JSON strings)
      matrix_themes:     ${{ steps.matrices.outputs.themes }}
      matrix_distros:    ${{ steps.matrices.outputs.distros }}
      matrix_platforms:  ${{ steps.matrices.outputs.platforms }}
      matrix_languages:  ${{ steps.matrices.outputs.languages }}

    steps:
      - name: "📥 Sparse checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            .github
            web
            api
            themes
            assets
            plugins

      - name: "🔎 Detect web project"
        id: web
        run: |
          [[ -f web/package.json ]] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"
          [[ -f web/package-lock.json ]] && echo "lock_exists=true" >> "$GITHUB_OUTPUT" || echo "lock_exists=false" >> "$GITHUB_OUTPUT"

      - name: "🔎 Detect API project"
        id: api
        run: |
          [[ -f api/requirements.txt ]] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: "🔍 Path filter"
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            screenshots:
              - 'assets/screenshots/**'
              - 'assets/brand/svg-masters/**'
            themes:
              - 'themes/**'
              - 'ash-cli/engines/color-engine/**'
            plugins:
              - 'plugins/**'
            scripts:
              - 'scripts/**'
              - 'ash-cli/**'
            nvim:
              - 'config/nvim/**'
            fish:
              - 'config/fish/**'
            waybar:
              - 'config/waybar/**'
            hypr:
              - 'config/hypr/**'
            api:
              - 'api/**'
            web:
              - 'web/**'

      - name: "🤔 Decision engine"
        id: decide
        env:
          _EVENT:  ${{ github.event_name }}
          _BRANCH: ${{ github.ref_name }}
          _MODE:   ${{ github.event.inputs.pipeline_mode || 'standard' }}
          _CRON:   ${{ github.event.schedule || '' }}
          _BENCH:  ${{ github.event.inputs.enable_benchmarks || 'false' }}
        run: |
          set -euo pipefail

          RUN_FULL="false"
          RUN_SCREENSHOTS="false"
          RUN_SECURITY="false"
          RUN_BENCHMARKS="$_BENCH"
          RUN_DEPLOY="false"
          IS_RELEASE="false"
          IS_NIGHTLY="false"
          MODE="$_MODE"

          # Schedule logic
          if [[ "$_EVENT" == "schedule" ]]; then
            case "$_CRON" in
              "0 2 * * *")
                IS_NIGHTLY="true"; MODE="full"
                RUN_FULL="true"; RUN_SCREENSHOTS="true"
                RUN_SECURITY="true"; RUN_BENCHMARKS="true"
                ;;
              "0 4 * * 1")
                MODE="security-only"; RUN_SECURITY="true"
                ;;
              "0 6 1 * *")
                MODE="benchmark-only"; RUN_BENCHMARKS="true"
                ;;
            esac
          fi

          # Release branch logic
          if [[ "$_BRANCH" =~ ^release/ ]]; then
            IS_RELEASE="true"
            RUN_FULL="true"; RUN_SCREENSHOTS="true"
            RUN_SECURITY="true"; RUN_BENCHMARKS="true"
            RUN_DEPLOY="true"
          fi

          # Main branch push
          if [[ "$_BRANCH" == "main" && "$_EVENT" == "push" ]]; then
            RUN_SCREENSHOTS="true"; RUN_SECURITY="true"; RUN_DEPLOY="true"
          fi

          # Manual mode overrides
          case "$MODE" in
            full)
              RUN_FULL="true"; RUN_SCREENSHOTS="true"
              RUN_SECURITY="true"; RUN_BENCHMARKS="true"
              ;;
            screenshots-only) RUN_SCREENSHOTS="true" ;;
            security-only)    RUN_SECURITY="true"    ;;
            benchmark-only)   RUN_BENCHMARKS="true"  ;;
            deploy-only)      RUN_DEPLOY="true"       ;;
            lint-only)        : ;;
          esac

          {
            echo "run_full=$RUN_FULL"
            echo "run_screenshots=$RUN_SCREENSHOTS"
            echo "run_security=$RUN_SECURITY"
            echo "run_benchmarks=$RUN_BENCHMARKS"
            echo "run_deploy=$RUN_DEPLOY"
            echo "is_release=$IS_RELEASE"
            echo "is_nightly=$IS_NIGHTLY"
            echo "pipeline_mode=$MODE"
          } >> "$GITHUB_OUTPUT"

          printf '\n  ╔══════════════════════════════════════╗\n'
          printf '  ║  🧠 Pipeline Decisions                ║\n'
          printf '  ╠══════════════════════════════════════╣\n'
          printf '  ║  Mode:        %-22s║\n' "$MODE"
          printf '  ║  Full:        %-22s║\n' "$RUN_FULL"
          printf '  ║  Screenshots: %-22s║\n' "$RUN_SCREENSHOTS"
          printf '  ║  Security:    %-22s║\n' "$RUN_SECURITY"
          printf '  ║  Benchmarks:  %-22s║\n' "$RUN_BENCHMARKS"
          printf '  ║  Deploy:      %-22s║\n' "$RUN_DEPLOY"
          printf '  ║  Release:     %-22s║\n' "$IS_RELEASE"
          printf '  ║  Nightly:     %-22s║\n' "$IS_NIGHTLY"
          printf '  ╚══════════════════════════════════════╝\n'

      - name: "📐 Build matrices"
        id: matrices
        env:
          _TARGET: ${{ github.event.inputs.target_themes || 'all' }}
          _RUN_FULL: ${{ steps.decide.outputs.run_full }}
          _HAS_API: ${{ steps.filter.outputs.api }}
          _HAS_WEB: ${{ steps.filter.outputs.web }}
          _WEB_EXISTS: ${{ steps.web.outputs.exists }}
        run: |
          set -euo pipefail

          if [[ "$_TARGET" == "all" ]]; then
            THEMES_JSON='["dark-rosepine","light-catppuccin","dark-catppuccin",
              "dark-tokyonight","dark-gruvbox","dark-nord","dark-dracula",
              "dark-onedark","dark-everforest","dark-kanagawa","neon-cyberpunk",
              "neon-synthwave","nature-forest","nature-ocean","space-nebula",
              "retro-vaporwave","anime-evangelion"]'
          else
            THEMES_JSON="["
            first=true
            IFS=',' read -ra LIST <<< "$_TARGET"
            for t in "${LIST[@]}"; do
              t="${t// /}"
              [[ "$first" == "true" ]] && first=false || THEMES_JSON+=","
              THEMES_JSON+="\"$t\""
            done
            THEMES_JSON+="]"
          fi

          DISTROS_JSON='[
            {"name":"arch",     "image":"archlinux:latest",          "pkg":"pacman"},
            {"name":"fedora",   "image":"fedora:40",                 "pkg":"dnf"},
            {"name":"ubuntu",   "image":"ubuntu:24.04",              "pkg":"apt"},
            {"name":"opensuse", "image":"opensuse/tumbleweed:latest","pkg":"zypper"}
          ]'

          PLATFORMS_JSON='["linux/amd64","linux/arm64"]'

          LANGUAGES_JSON='[]'
          if [[ "$_RUN_FULL" == "true" || "$_HAS_API" == "true" ]]; then
            LANGUAGES_JSON=$(echo "$LANGUAGES_JSON" | jq '. + ["python"]')
          fi
          if [[ "$_WEB_EXISTS" == "true" && ("$_RUN_FULL" == "true" || "$_HAS_WEB" == "true") ]]; then
            LANGUAGES_JSON=$(echo "$LANGUAGES_JSON" | jq '. + ["javascript-typescript"]')
          fi

          {
            echo "themes=$(echo "$THEMES_JSON"   | jq -c .)"
            echo "distros=$(echo "$DISTROS_JSON"  | jq -c .)"
            echo "platforms=$(echo "$PLATFORMS_JSON" | jq -c .)"
            echo "languages=$(echo "$LANGUAGES_JSON" | jq -c .)"
          } >> "$GITHUB_OUTPUT"

          THEME_COUNT=$(echo "$THEMES_JSON" | jq 'length')
          echo "  Theme matrix:    $THEME_COUNT themes"
          echo "  Distro matrix:   $(echo "$DISTROS_JSON"  | jq 'length') distros"
          echo "  Lang matrix:     $(echo "$LANGUAGES_JSON" | jq 'length') languages"


# ┌─────────────────────────────────────────────────────────────────────────────
# │  STAGE 01 — 🔒 SECURITY GATE  (always runs first)
# └─────────────────────────────────────────────────────────────────────────────

  # ── Secret scanning ──────────────────────────────────────────────────────────
  sec-secrets:
    name: "🔍 Secret Scanning"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    needs: intelligence
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: read

    steps:
      - name: "📥 Checkout (full history)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔍 Gitleaks"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: "🔍 TruffleHog OSS"
        uses: trufflesecurity/trufflehog@v3.82.0
        with:
          path: "./"
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: "--only-verified --json"

      - name: "📊 Upload reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "sec-secrets-${{ github.run_id }}"
          path: |
            gitleaks-report.json
            trufflehog-report.json
          retention-days: 30
          if-no-files-found: ignore

  # ── Dependency audit ─────────────────────────────────────────────────────────
  sec-deps:
    name: "🛡️ Dependency Audit"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: intelligence
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Node.js"
        if: needs.intelligence.outputs.web_exists == 'true' && needs.intelligence.outputs.web_lock_exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: "🟢 Node.js"
        if: needs.intelligence.outputs.web_exists == 'true' && needs.intelligence.outputs.web_lock_exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "🔍 NPM audit"
        if: needs.intelligence.outputs.web_exists == 'true'
        working-directory: web
        run: |
          npm audit --audit-level=moderate --json \
            > npm-audit.json 2>&1 || true

          CRIT=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit.json)
          HIGH=$(jq '.metadata.vulnerabilities.high     // 0' npm-audit.json)
          echo "  Critical: $CRIT  High: $HIGH"
          [[ "$CRIT" -gt 0 ]] && { echo "  FAIL — critical vulns"; exit 1; } || true

      - name: "🔍 Trivy FS scan"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: "📤 Upload Trivy SARIF"
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: "🚦 Enforce Trivy policy"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: "🐍 Safety (Python)"
        if: needs.intelligence.outputs.api_exists == 'true'
        working-directory: api
        run: |
          pip install safety --quiet
          safety check \
            --file requirements.txt \
            --json \
            --output safety-report.json \
            --continue-on-error || true
          VULNS=$(jq 'length' safety-report.json 2>/dev/null || echo 0)
          echo "  Python vulns: $VULNS"

      - name: "📊 Upload reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "sec-deps-${{ github.run_id }}"
          path: |
            web/npm-audit.json
            trivy-fs.sarif
            api/safety-report.json
          retention-days: 30
          if-no-files-found: ignore

  # ── CodeQL analysis ──────────────────────────────────────────────────────────
  sec-codeql:
    name: "🔬 CodeQL (${{ matrix.language }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: intelligence
    if: |
      needs.intelligence.outputs.matrix_languages != '[]' &&
      needs.intelligence.outputs.matrix_languages != ''
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.intelligence.outputs.matrix_languages) }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🔬 Init CodeQL"
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: "🏗️ Autobuild"
        uses: github/codeql-action/autobuild@v4

      - name: "🔍 Analyze"
        uses: github/codeql-action/analyze@v4
        with:
          category: "codeql-${{ matrix.language }}"
          output: codeql-results
          upload: never
          upload-database: false

      - name: "📊 Upload CodeQL SARIF artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "codeql-${{ matrix.language }}-${{ github.run_id }}"
          path: codeql-results/
          retention-days: 30
          if-no-files-found: ignore

  # ── Permissions audit ────────────────────────────────────────────────────────
  sec-permissions:
    name: "🔐 Permissions Audit"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: intelligence
    permissions:
      contents: read

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🔐 Check executable permissions"
        run: |
          set -euo pipefail
          ISSUES=0

          # Scripts should be executable
          while IFS= read -r -d '' f; do
            if [[ ! -x "$f" ]]; then
              echo "  WARN not executable: $f"
              (( ISSUES++ )) || true
            fi
          done < <(find . \
            -name "*.sh" \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            -print0)

          # Non-scripts should NOT be executable
          while IFS= read -r -d '' f; do
            if [[ -x "$f" ]]; then
              echo "  WARN executable non-script: $f"
              (( ISSUES++ )) || true
            fi
          done < <(find . \
            \( -name "*.json" -o -name "*.yaml" -o -name "*.yml" \
               -o -name "*.toml" -o -name "*.md" \) \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            -print0)

          echo "  Permission issues: $ISSUES"
          [[ $ISSUES -gt 20 ]] && exit 1 || echo "  Permissions OK"

      - name: "🔐 Secrets file guard"
        run: |
          # Ensure no actual secrets committed
          if find secrets/ -name "*.enc" -newer secrets/.gitignore \
               2>/dev/null | grep -q .; then
            echo "  WARN: New encrypted files detected in secrets/"
          fi
          echo "  Secrets guard passed"


# ┌─────────────────────────────────────────────────────────────────────────────
# │  STAGE 02 — ✅ LINTING & CODE QUALITY
# └─────────────────────────────────────────────────────────────────────────────

  lint-shell:
    name: "🐚 ShellCheck"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    needs: [intelligence, sec-secrets]
    if: |
      needs.intelligence.outputs.has_scripts == 'true' ||
      needs.intelligence.outputs.run_full    == 'true'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install ShellCheck"
        run: |
          sudo apt-get install -y shellcheck --no-install-recommends
          shellcheck --version

      - name: "🔍 ShellCheck scan"
        id: scan
        run: |
          set -euo pipefail
          FAILED=0; PASSED=0; WARNED=0
          declare -a FAILED_FILES=()

          mapfile -t SCRIPTS < <(
            find . -type f \( -name "*.sh" -o -name "*.bash" \) \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              ! -path "./.vendor/*" \
              | sort
          )

          echo "  Scanning ${#SCRIPTS[@]} scripts..."

          for script in "${SCRIPTS[@]}"; do
            OUT=$(shellcheck \
              --shell=bash \
              --severity=warning \
              --format=gcc \
              --exclude=SC1091,SC2034,SC2155,SC2317 \
              "$script" 2>&1) || true

            if echo "$OUT" | grep -q " error:"; then
              echo "  ❌ $(basename "$script")"
              echo "$OUT" | grep " error:" | head -3 | sed 's/^/     /'
              FAILED_FILES+=("$script")
              (( FAILED++ )) || true
            elif echo "$OUT" | grep -q " warning:"; then
              echo "  ⚠️  $(basename "$script")"
              (( WARNED++ )) || true
            else
              (( PASSED++ )) || true
            fi
          done

          {
            echo "passed=$PASSED"
            echo "warned=$WARNED"
            echo "failed=$FAILED"
            echo "total=${#SCRIPTS[@]}"
          } >> "$GITHUB_OUTPUT"

          printf '\n  ┌────────────────────────────────┐\n'
          printf '  │  ShellCheck Results             │\n'
          printf '  ├────────────────────────────────┤\n'
          printf '  │  ✅ Passed:   %-16d│\n' "$PASSED"
          printf '  │  ⚠️  Warned:   %-16d│\n' "$WARNED"
          printf '  │  ❌ Failed:   %-16d│\n' "$FAILED"
          printf '  │  📄 Total:    %-16d│\n' "${#SCRIPTS[@]}"
          printf '  └────────────────────────────────┘\n'

          if [[ $FAILED -gt 0 ]]; then
            echo "  Failed files:"
            for f in "${FAILED_FILES[@]}"; do echo "    • $f"; done
            exit 1
          fi

      - name: "📊 Annotate PR"
        if: github.event_name == 'pull_request' && failure()
        run: |
          echo "::error::ShellCheck found ${{ steps.scan.outputs.failed }} error(s) in shell scripts"

  lint-lua:
    name: "🌙 Luacheck"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [intelligence, sec-secrets]
    if: |
      needs.intelligence.outputs.has_nvim == 'true' ||
      needs.intelligence.outputs.run_full == 'true'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install Luacheck"
        run: |
          sudo apt-get install -y lua-check || {
            sudo apt-get install -y lua5.4 luarocks --no-install-recommends
            sudo luarocks install luacheck
          }
          luacheck --version

      - name: "🔍 Luacheck"
        run: |
          luacheck config/nvim/ \
            --config .luacheckrc \
            --formatter plain \
            --max-line-length 120 \
            --globals vim \
            --no-unused-args \
            --codes \
            2>&1 | tee luacheck-out.txt

          ERRS=$(grep -c " E[0-9]" luacheck-out.txt || true)
          WARNS=$(grep -c " W[0-9]" luacheck-out.txt || true)
          echo "  Errors: $ERRS  Warnings: $WARNS"
          [[ "$ERRS" -gt 0 ]] && exit 1 || echo "  Luacheck passed"

      - name: "📊 Upload"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "luacheck-${{ github.run_id }}"
          path: luacheck-out.txt
          retention-days: 7

  lint-configs:
    name: "📋 Config Validation"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [intelligence, sec-secrets]

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "⚙️ Install tools"
        run: |
          npm install -g ajv-cli @taplo/cli --silent
          pip install yamllint --quiet
          echo "  Tools ready"

      - name: "🔍 JSON validation"
        run: |
          set -euo pipefail
          FAILED=0; PASSED=0

          while IFS= read -r -d '' f; do
            if python3 -c "
          import json, sys
          try:
              json.load(open('$f'))
          except Exception as e:
              print('FAIL: $f:', e)
              sys.exit(1)
          " 2>&1; then
              (( PASSED++ )) || true
            else
              (( FAILED++ )) || true
            fi
          done < <(find . \
            -name "*.json" \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            ! -path "./data/analytics/*" \
            ! -name "*.min.json" \
            -print0)

          echo "  JSON: $PASSED passed  $FAILED failed"
          [[ $FAILED -gt 0 ]] && exit 1 || true

      - name: "🔍 JSONC validation"
        run: |
          set -euo pipefail
          FAILED=0

          while IFS= read -r -d '' f; do
            STRIPPED=$(sed \
              -e 's|//[^"]*$||g' \
              -e '/^[[:space:]]*\/\//d' \
              "$f" 2>/dev/null || cat "$f")

            if ! echo "$STRIPPED" | python3 -c \
              "import json,sys; json.load(sys.stdin)" 2>/dev/null; then
              echo "  FAIL JSONC: $f"
              (( FAILED++ )) || true
            fi
          done < <(find . -name "*.jsonc" ! -path "./.git/*" -print0)

          echo "  JSONC: $FAILED failures"
          [[ $FAILED -gt 0 ]] && exit 1 || echo "  JSONC valid"

      - name: "🔍 YAML validation"
        run: |
          YAML_FILES=()
          while IFS= read -r file; do
            YAML_FILES+=("$file")
          done < <(
            find . \
              -path "./.git" -prune -o \
              -path "./node_modules" -prune -o \
              \( -name "*.yml" -o -name "*.yaml" \) \
              -print | head -300
          )

          if [[ "${#YAML_FILES[@]}" -eq 0 ]]; then
            echo "  YAML: no files found"
            exit 0
          fi

          yamllint \
            --config-file .yamllint.yml \
            --format colored \
            "${YAML_FILES[@]}" \
            2>&1 | tee yamllint-out.txt || true

          ERRS=$(sed -E 's/\x1B\[[0-9;]*[mK]//g' yamllint-out.txt \
            | grep -Ec '(^|[[:space:]:\[])error([][:space:]]|$)' || true)
          echo "  YAML errors: $ERRS"
          [[ "$ERRS" -gt 0 ]] && exit 1 || echo "  YAML valid"

      - name: "🔍 TOML validation"
        run: |
          FAILED=0
          while IFS= read -r -d '' f; do
            taplo check "$f" 2>/dev/null || {
              echo "  FAIL TOML: $f"
              (( FAILED++ )) || true
            }
          done < <(find . -name "*.toml" \
            ! -path "./.git/*" ! -path "./node_modules/*" -print0)
          echo "  TOML: $FAILED failures"
          [[ $FAILED -gt 0 ]] && exit 1 || echo "  TOML valid"

      - name: "🔍 Theme schema validation"
        run: |
          set -euo pipefail
          FAILED=0; PASSED=0

          while IFS= read -r -d '' cf; do
            THEME=$(basename "$(dirname "$cf")")
            if [[ -f "themes/schema/colors-schema.json" ]]; then
              ajv validate \
                --spec=draft2020 \
                -s themes/schema/colors-schema.json \
                -d "$cf" 2>&1 || {
                  echo "  FAIL schema: $THEME"
                  (( FAILED++ )) || true
                  continue
                }
            fi

            # Field-level validation
            for field in bg fg accent red green blue yellow purple orange aqua; do
              val=$(jq -r ".${field} // empty" "$cf" 2>/dev/null)
              if [[ -z "$val" ]]; then
                echo "  MISS field '$field' in $THEME"
                (( FAILED++ )) || true
              elif ! echo "$val" | grep -qE '^#[0-9a-fA-F]{6}$'; then
                echo "  BAD  '$field'='$val' in $THEME"
                (( FAILED++ )) || true
              fi
            done
            (( PASSED++ )) || true
          done < <(find themes/presets -name "colors.json" -print0 2>/dev/null || true)

          echo "  Theme schemas: $PASSED valid  $FAILED failed"
          [[ $FAILED -gt 0 ]] && exit 1 || true

      - name: "📊 Upload"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "lint-configs-${{ github.run_id }}"
          path: |
            yamllint-out.txt
          retention-days: 7

  lint-typescript:
    name: "💙 TypeScript & ESLint"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [intelligence, sec-secrets]
    if: needs.intelligence.outputs.web_exists == 'true' && (needs.intelligence.outputs.has_web == 'true' || needs.intelligence.outputs.run_full == 'true')

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Node.js"
        if: needs.intelligence.outputs.web_lock_exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: "🟢 Node.js"
        if: needs.intelligence.outputs.web_lock_exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "📦 Install"
        working-directory: web
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --prefer-offline
          else
            npm install --prefer-offline
          fi

      - name: "🔍 TypeScript"
        working-directory: web
        run: |
          npx tsc --noEmit --strict --pretty 2>&1 | tee ts-out.txt
          ERRS=$(grep -c "error TS" ts-out.txt || true)
          echo "  TS errors: $ERRS"
          [[ "$ERRS" -gt 0 ]] && exit 1 || echo "  TypeScript OK"

      - name: "🔍 ESLint"
        working-directory: web
        run: |
          npx eslint \
            --ext .ts,.tsx \
            --format stylish \
            --max-warnings 10 \
            --report-unused-disable-directives \
            src/ 2>&1 | tee eslint-out.txt

          ERRS=$(grep -c " error " eslint-out.txt || true)
          echo "  ESLint errors: $ERRS"
          [[ "$ERRS" -gt 0 ]] && exit 1 || echo "  ESLint OK"

      - name: "🔍 Prettier"
        working-directory: web
        run: |
          npx prettier \
            --check \
            --log-level warn \
            "src/**/*.{ts,tsx,css}" 2>&1 || {
              echo "  ⚠️ Formatting issues (run: npx prettier --write)"
            }

      - name: "📊 Upload"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "lint-ts-${{ github.run_id }}"
          path: |
            web/ts-out.txt
            web/eslint-out.txt
          retention-days: 7

  lint-python:
    name: "🐍 Python Lint"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [intelligence, sec-secrets]
    if: |
      needs.intelligence.outputs.api_exists == 'true' &&
      (
        needs.intelligence.outputs.has_api == 'true' ||
        needs.intelligence.outputs.run_full == 'true'
      )

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: "📦 Install"
        run: pip install ruff mypy black bandit --quiet

      - name: "🔍 Ruff"
        working-directory: api
        run: |
          ruff check \
            --output-format=github \
            --statistics \
            . 2>&1 | tee ruff-out.txt
          ERRS=$(grep -c "^E" ruff-out.txt || true)
          echo "  Ruff errors: $ERRS"
          [[ "$ERRS" -gt 5 ]] && exit 1 || echo "  Ruff OK"

      - name: "🔍 MyPy"
        working-directory: api
        run: |
          mypy \
            --ignore-missing-imports \
            --strict \
            --pretty \
            . 2>&1 | tee mypy-out.txt || true
          echo "  MyPy done"

      - name: "🔍 Bandit"
        working-directory: api
        run: |
          bandit \
            -r . -ll \
            -f json \
            -o bandit-out.json \
            --exclude ./.venv 2>&1 || true

          HIGH=$(python3 -c "
          import json, sys
          try:
              d = json.load(open('bandit-out.json'))
              n = sum(1 for r in d.get('results',[])
                      if r.get('issue_severity') == 'HIGH')
              print(n)
          except Exception:
              print(0)
          " 2>/dev/null || echo 0)

          echo "  Bandit HIGH: $HIGH"
          [[ "$HIGH" -gt 3 ]] && { echo "  FAIL bandit"; exit 1; } || true

      - name: "🔍 Black"
        working-directory: api
        run: |
          black --check --diff --quiet . 2>&1 | head -60 || true
          echo "  Black checked"

      - name: "📊 Upload"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "lint-python-${{ github.run_id }}"
          path: |
            api/ruff-out.txt
            api/mypy-out.txt
            api/bandit-out.json
          retention-days: 7

  lint-hyprland:
    name: "🪟 Hyprland Config Lint"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: [intelligence, sec-secrets]
    if: |
      needs.intelligence.outputs.has_hypr == 'true' ||
      needs.intelligence.outputs.run_full == 'true'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🔍 Hyprland conf syntax"
        run: |
          set -euo pipefail
          FAILED=0

          while IFS= read -r -d '' f; do
            # Check balanced braces
            OPEN=$(grep -o '{' "$f" | wc -l || true)
            CLOSE=$(grep -o '}' "$f" | wc -l || true)
            if [[ "$OPEN" != "$CLOSE" ]]; then
              echo "  FAIL unbalanced braces in: $f (open=$OPEN close=$CLOSE)"
              (( FAILED++ )) || true
            fi

            # Check for duplicate keys (common mistake)
            DUP=$(grep -E '^[[:space:]]*[a-z_]+ *= *' "$f" \
              | sed 's/=.*//' | sed 's/[[:space:]]//g' \
              | sort | uniq -d | head -3 || true)
            if [[ -n "$DUP" ]]; then
              echo "  WARN possible duplicate keys in $(basename "$f"): $DUP"
            fi
          done < <(find config/hypr -name "*.conf" -print0 2>/dev/null || true)

          echo "  Hyprland lint: $FAILED failures"
          [[ $FAILED -gt 0 ]] && exit 1 || echo "  Hyprland configs OK"

  lint-fish:
    name: "🐟 Fish Lint"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: [intelligence, sec-secrets]
    if: |
      needs.intelligence.outputs.has_fish == 'true' ||
      needs.intelligence.outputs.run_full == 'true'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install Fish"
        run: |
          sudo apt-get install -y fish --no-install-recommends
          fish --version

      - name: "🔍 Fish syntax check"
        run: |
          set -euo pipefail
          FAILED=0; PASSED=0

          while IFS= read -r -d '' f; do
            if fish --no-execute "$f" 2>&1; then
              (( PASSED++ )) || true
            else
              echo "  FAIL: $f"
              (( FAILED++ )) || true
            fi
          done < <(find config/fish -name "*.fish" -print0 2>/dev/null || true)

          echo "  Fish: $PASSED OK  $FAILED failed"
          [[ $FAILED -gt 0 ]] && exit 1 || true


# ┌─────────────────────────────────────────────────────────────────────────────
# │  STAGE 03 — 🖼️  SCREENSHOT ASSET PIPELINE
# └─────────────────────────────────────────────────────────────────────────────

  shots-validate-svg:
    name: "🎨 SVG Validation"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [intelligence, lint-configs]
    if: |
      needs.intelligence.outputs.has_screenshots == 'true'  ||
      needs.intelligence.outputs.run_screenshots == 'true'  ||
      needs.intelligence.outputs.run_full        == 'true'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install tools"
        run: |
          sudo apt-get install -y libxml2-utils --no-install-recommends
          npm install -g svgo --silent
          echo "  XMLlint: $(xmllint --version 2>&1 | head -1)"
          echo "  SVGO:    $(svgo --version)"

      - name: "🔍 XML validity"
        run: |
          set -euo pipefail
          FAILED=0; PASSED=0

          while IFS= read -r -d '' svg; do
            if xmllint --noout "$svg" 2>/dev/null; then
              (( PASSED++ )) || true
            else
              echo "  FAIL XML: $svg"
              (( FAILED++ )) || true
            fi
          done < <(find "$SVG_DIR" -name "*.svg" -print0 2>/dev/null || true)

          echo "  SVG XML: $PASSED valid  $FAILED invalid"
          [[ $FAILED -gt 0 ]] && exit 1 || echo "  All SVGs valid XML"

      - name: "⚡ SVGO size analysis"
        run: |
          while IFS= read -r -d '' svg; do
            ORIG=$(wc -c < "$svg")
            OPT=$(svgo --input "$svg" --output /dev/stdout 2>/dev/null | wc -c || echo 0)
            if [[ $ORIG -gt 0 && $OPT -gt 0 ]]; then
              PCT=$(( (ORIG - OPT) * 100 / ORIG ))
              printf '  %-40s  %d%%\n' "$(basename "$svg")" "$PCT"
            fi
          done < <(find "$SVG_DIR" -name "*.svg" -print0 2>/dev/null || true)
          echo "  SVGO analysis done"

  shots-generate:
    name: "📸 ${{ matrix.theme }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [intelligence, shots-validate-svg]
    if: |
      needs.intelligence.outputs.has_screenshots == 'true'  ||
      needs.intelligence.outputs.run_screenshots == 'true'  ||
      needs.intelligence.outputs.run_full        == 'true'

    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        theme: ${{ fromJSON(needs.intelligence.outputs.matrix_themes) }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install render stack"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            librsvg2-bin imagemagick webp libavif-bin \
            optipng pngquant --no-install-recommends

          # resvg — fast, accurate SVG renderer
          curl --retry 5 --retry-delay 5 --retry-connrefused -fsSL \
            "https://github.com/RazrFalcon/resvg/releases/download/v${RESVG_VERSION}/resvg-linux-x86_64.zip" \
            -o /tmp/resvg.zip 2>/dev/null || true
          if [[ -f /tmp/resvg.zip ]]; then
            unzip -q /tmp/resvg.zip -d /tmp/resvg-bin || true
            sudo mv /tmp/resvg-bin/resvg /usr/local/bin/ 2>/dev/null || true
            chmod +x /usr/local/bin/resvg 2>/dev/null || true
          fi

          echo "  resvg:        $(command -v resvg       && resvg --version       || echo 'fallback')"
          echo "  rsvg-convert: $(command -v rsvg-convert && echo 'available'     || echo 'missing')"
          echo "  cwebp:        $(command -v cwebp        && cwebp --version | head -1 || echo 'missing')"
          echo "  convert:      $(command -v convert      && convert --version | head -1 || echo 'missing')"

      - name: "🎨 Load palette"
        id: pal
        env:
          _THEME: ${{ matrix.theme }}
        run: |
          set -euo pipefail
          COLORS="$THEMES_DIR/${_THEME}/colors.json"

          if [[ -f "$COLORS" ]]; then
            BG=$(jq -r     '.bg     // "#1e1e2e"' "$COLORS")
            FG=$(jq -r     '.fg     // "#cdd6f4"' "$COLORS")
            ACCENT=$(jq -r '.accent // "#89b4fa"' "$COLORS")
            GREEN=$(jq -r  '.green  // "#a6e3a1"' "$COLORS")
            BLUE=$(jq -r   '.blue   // "#89b4fa"' "$COLORS")
            RED=$(jq -r    '.red    // "#f38ba8"' "$COLORS")
            YELLOW=$(jq -r '.yellow // "#f9e2af"' "$COLORS")
            PURPLE=$(jq -r '.purple // "#cba6f7"' "$COLORS")
          else
            # Hardcoded palette fallbacks
            case "$_THEME" in
              dark-rosepine)
                BG="#191724";FG="#e0def4";ACCENT="#c4a7e7"
                GREEN="#31748f";BLUE="#9ccfd8";RED="#eb6f92"
                YELLOW="#f6c177";PURPLE="#c4a7e7"
                ;;
              light-catppuccin)
                BG="#eff1f5";FG="#4c4f69";ACCENT="#1e66f5"
                GREEN="#40a02b";BLUE="#1e66f5";RED="#d20f39"
                YELLOW="#df8e1d";PURPLE="#8839ef"
                ;;
              dark-catppuccin)
                BG="#1e1e2e";FG="#cdd6f4";ACCENT="#89b4fa"
                GREEN="#a6e3a1";BLUE="#89b4fa";RED="#f38ba8"
                YELLOW="#f9e2af";PURPLE="#cba6f7"
                ;;
              dark-tokyonight)
                BG="#1a1b26";FG="#c0caf5";ACCENT="#7aa2f7"
                GREEN="#9ece6a";BLUE="#7aa2f7";RED="#f7768e"
                YELLOW="#e0af68";PURPLE="#bb9af7"
                ;;
              dark-gruvbox)
                BG="#282828";FG="#ebdbb2";ACCENT="#fabd2f"
                GREEN="#b8bb26";BLUE="#83a598";RED="#fb4934"
                YELLOW="#fabd2f";PURPLE="#d3869b"
                ;;
              dark-nord)
                BG="#2e3440";FG="#eceff4";ACCENT="#88c0d0"
                GREEN="#a3be8c";BLUE="#88c0d0";RED="#bf616a"
                YELLOW="#ebcb8b";PURPLE="#b48ead"
                ;;
              *)
                BG="#1e1e2e";FG="#cdd6f4";ACCENT="#89b4fa"
                GREEN="#a6e3a1";BLUE="#89b4fa";RED="#f38ba8"
                YELLOW="#f9e2af";PURPLE="#cba6f7"
                ;;
            esac
          fi

          {
            echo "bg=$BG"; echo "fg=$FG"; echo "accent=$ACCENT"
            echo "green=$GREEN"; echo "blue=$BLUE"; echo "red=$RED"
            echo "yellow=$YELLOW"; echo "purple=$PURPLE"
          } >> "$GITHUB_OUTPUT"

          printf '  Theme: %-24s BG: %s  Accent: %s\n' \
            "$_THEME" "$BG" "$ACCENT"

      - name: "🖼️ Generate SVG"
