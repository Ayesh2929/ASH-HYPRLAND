name: 🚀 ASH Dotfiles — Ultra CI/CD Pipeline

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  TRIGGERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
      - "feature/**"
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  pull_request_target:
    branches:
      - main
    types:
      - labeled

  workflow_dispatch:
    inputs:
      pipeline_mode:
        description: "🎛️ Pipeline Mode"
        required: true
        default: "standard"
        type: choice
        options:
          - standard
          - full
          - screenshots-only
          - security-only
          - benchmark-only
          - deploy-only
          - dry-run

      target_themes:
        description: "🎨 Target themes (comma-separated, 'all' for everything)"
        required: false
        default: "dark-rosepine,light-catppuccin"
        type: string

      skip_stages:
        description: "⏭️ Stages to skip (comma-separated)"
        required: false
        default: ""
        type: string

      enable_benchmarks:
        description: "📊 Run performance benchmarks"
        required: false
        default: false
        type: boolean

      deploy_preview:
        description: "🌐 Deploy preview environment"
        required: false
        default: false
        type: boolean

      debug_mode:
        description: "🐛 Enable debug output"
        required: false
        default: false
        type: boolean

  schedule:
    # Nightly full pipeline — 02:00 UTC
    - cron: "0 2 * * *"
    # Weekly security deep-scan — Monday 04:00 UTC
    - cron: "0 4 * * 1"
    # Monthly benchmark baseline — 1st of month 06:00 UTC
    - cron: "0 6 1 * *"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  GLOBAL CONCURRENCY — prevent redundant runs
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  GLOBAL ENVIRONMENT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
env:
  # ── Core ────────────────────────────────────────────────────────────
  ASH_VERSION:               "5.0.0-omega"
  ASH_PIPELINE_VERSION:      "2.1.0"  # Enhanced version
  ASH_ENV:                   "ci"
  ASH_NO_COLOR:              "0"
  ASH_LOG_LEVEL:             "info"

  # ── Paths ────────────────────────────────────────────────────────────
  SCREENSHOTS_DIR:           "assets/screenshots/desktop"
  THEMES_DIR:                "themes/presets"
  PLUGINS_DIR:               "plugins"
  ASSETS_DIR:                "assets"

  # ── Screenshot targets ───────────────────────────────────────────────
  SCREENSHOT_TARGETS: >-
    dark-rosepine
    light-catppuccin
    dark-catppuccin
    dark-tokyonight
    dark-gruvbox
    dark-nord
    dark-dracula
    dark-onedark
    dark-everforest
    dark-kanagawa
    neon-cyberpunk
    neon-synthwave
    nature-forest
    nature-ocean
    space-nebula
    retro-vaporwave
    anime-evangelion

  # ── Asset quality ────────────────────────────────────────────────────
  WEBP_QUALITY:              "92"
  WEBP_METHOD:               "6"
  AVIF_MIN_QUALITY:          "20"
  AVIF_MAX_QUALITY:          "35"
  THUMBNAIL_WIDTH:           "640"
  THUMBNAIL_HEIGHT:          "360"
  SCREENSHOT_WIDTH:          "2560"
  SCREENSHOT_HEIGHT:         "1440"

  # ── Tooling versions ─────────────────────────────────────────────────
  NODE_VERSION:              "20.x"
  PYTHON_VERSION:            "3.12"
  RUST_VERSION:              "stable"
  GO_VERSION:                "1.22"

  # ── Performance thresholds ───────────────────────────────────────────
  MAX_THEME_APPLY_MS:        "2000"
  MAX_STARTUP_MS:            "500"
  MAX_SCREENSHOT_SIZE_KB:    "250"
  MAX_THUMBNAIL_SIZE_KB:     "45"
  MIN_WCAG_AA_RATIO:         "4.5"

  # ── Notification ────────────────────────────────────────────────────
  SLACK_WEBHOOK_URL:         ${{ secrets.SLACK_WEBHOOK_URL }}
  DISCORD_WEBHOOK_URL:       ${{ secrets.DISCORD_WEBHOOK_URL }}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  REUSABLE DEFAULTS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
defaults:
  run:
    shell: bash
    working-directory: .

# ╔══════════════════════════════════════════════════════════════════════════════
# ║  STAGE 00 ── 🧠 PIPELINE INTELLIGENCE
# ╚══════════════════════════════════════════════════════════════════════════════
jobs:

  # ── 00-A: Smart change detection ────────────────────────────────────────────
  detect-changes:
    name: "🧠 Detect Changes"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # What changed?
      has_screenshots:     ${{ steps.changes.outputs.screenshots }}
      has_themes:          ${{ steps.changes.outputs.themes }}
      has_plugins:         ${{ steps.changes.outputs.plugins }}
      has_scripts:         ${{ steps.changes.outputs.scripts }}
      has_configs:         ${{ steps.changes.outputs.configs }}
      has_nvim:            ${{ steps.changes.outputs.nvim }}
      has_fish:            ${{ steps.changes.outputs.fish }}
      has_waybar:          ${{ steps.changes.outputs.waybar }}
      has_hypr:            ${{ steps.changes.outputs.hypr }}
      has_api:             ${{ steps.changes.outputs.api }}
      has_web:             ${{ steps.changes.outputs.web }}
      has_workflows:       ${{ steps.changes.outputs.workflows }}
      has_security:        ${{ steps.changes.outputs.security }}
      # Which themes changed?
      changed_themes:      ${{ steps.theme-diff.outputs.themes }}
      changed_screenshots: ${{ steps.screenshot-diff.outputs.screenshots }}
      # Pipeline decisions
      run_full:            ${{ steps.decide.outputs.run_full }}
      run_screenshots:     ${{ steps.decide.outputs.run_screenshots }}
      run_security:        ${{ steps.decide.outputs.run_security }}
      run_benchmarks:      ${{ steps.decide.outputs.run_benchmarks }}
      run_deploy:          ${{ steps.decide.outputs.run_deploy }}
      is_release:          ${{ steps.decide.outputs.is_release }}
      is_nightly:          ${{ steps.decide.outputs.is_nightly }}
      pipeline_mode:       ${{ steps.decide.outputs.pipeline_mode }}
      matrix_themes:       ${{ steps.matrix.outputs.themes }}
      matrix_distros:      ${{ steps.matrix.outputs.distros }}

    steps:
      - name: "📥 Checkout (sparse)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            .github
            themes
            assets/screenshots
            plugins

      - name: "🔍 Detect file changes"
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            screenshots:
              - 'assets/screenshots/**'
              - 'assets/brand/svg-masters/**'
              - 'assets/screenshots/desktop/generate-all.sh'
            themes:
              - 'themes/**'
              - 'ash-cli/engines/color-engine/**'
            plugins:
              - 'plugins/**'
            scripts:
              - 'scripts/**'
              - 'ash-cli/**'
            configs:
              - 'config/**'
            nvim:
              - 'config/nvim/**'
            fish:
              - 'config/fish/**'
            waybar:
              - 'config/waybar/**'
            hypr:
              - 'config/hypr/**'
            api:
              - 'api/**'
            web:
              - 'web/**'
            workflows:
              - '.github/workflows/**'
            security:
              - 'secrets/**'
              - '.github/workflows/security/**'
              - 'api/auth.py'

      - name: "🎨 Detect changed themes"
        id: theme-diff
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null \
            | grep '^themes/' \
            | sed 's|themes/presets/||;s|/.*||' \
            | sort -u \
            | tr '\n' ',' \
            | sed 's/,$//' \
            || echo "")
          echo "themes=${CHANGED:-none}" >> "$GITHUB_OUTPUT"
          echo "  📋 Changed themes: ${CHANGED:-none}"

      - name: "🖼️ Detect changed screenshots"
        id: screenshot-diff
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null \
            | grep '^assets/screenshots/desktop/' \
            | sed 's|assets/screenshots/desktop/||;s|\..*||' \
            | grep -v '^$' \
            | sort -u \
            | tr '\n' ',' \
            | sed 's/,$//' \
            || echo "")
          echo "screenshots=${CHANGED:-none}" >> "$GITHUB_OUTPUT"
          echo "  🖼️  Changed screenshots: ${CHANGED:-none}"

      - name: "🤔 Pipeline decision engine"
        id: decide
        env:
          EVENT_NAME:    ${{ github.event_name }}
          BRANCH:        ${{ github.ref_name }}
          PIPELINE_MODE: ${{ github.event.inputs.pipeline_mode || 'standard' }}
          IS_SCHEDULED:  ${{ github.event_name == 'schedule' }}
          CRON_EXPR:     ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          MODE="$PIPELINE_MODE"
          IS_RELEASE="false"
          IS_NIGHTLY="false"
          RUN_FULL="false"
          RUN_SCREENSHOTS="false"
          RUN_SECURITY="false"
          RUN_BENCHMARKS="${{ github.event.inputs.enable_benchmarks || 'false' }}"
          RUN_DEPLOY="false"

          # Determine pipeline mode
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            case "$CRON_EXPR" in
              "0 2 * * *") IS_NIGHTLY="true";  MODE="full";      RUN_FULL="true"  ;;
              "0 4 * * 1") MODE="security-only"; RUN_SECURITY="true" ;;
              "0 6 1 * *") MODE="benchmark-only"; RUN_BENCHMARKS="true" ;;
            esac
          fi

          if [[ "$BRANCH" =~ ^release/ ]]; then
            IS_RELEASE="true"
            RUN_FULL="true"
            RUN_SCREENSHOTS="true"
            RUN_SECURITY="true"
            RUN_BENCHMARKS="true"
            RUN_DEPLOY="true"
          fi

          if [[ "$BRANCH" == "main" ]] && [[ "$EVENT_NAME" == "push" ]]; then
            RUN_SCREENSHOTS="true"
            RUN_SECURITY="true"
          fi

          # Mode overrides
          case "$MODE" in
            full)
              RUN_FULL="true"
              RUN_SCREENSHOTS="true"
              RUN_SECURITY="true"
              RUN_BENCHMARKS="true"
              ;;
            screenshots-only) RUN_SCREENSHOTS="true" ;;
            security-only)    RUN_SECURITY="true"    ;;
            benchmark-only)   RUN_BENCHMARKS="true"  ;;
            deploy-only)      RUN_DEPLOY="true"       ;;
          esac

          {
            echo "run_full=$RUN_FULL"
            echo "run_screenshots=$RUN_SCREENSHOTS"
            echo "run_security=$RUN_SECURITY"
            echo "run_benchmarks=$RUN_BENCHMARKS"
            echo "run_deploy=$RUN_DEPLOY"
            echo "is_release=$IS_RELEASE"
            echo "is_nightly=$IS_NIGHTLY"
            echo "pipeline_mode=$MODE"
          } >> "$GITHUB_OUTPUT"

          echo ""
          echo "  ╔══════════════════════════════════════════╗"
          echo "  ║   🧠 Pipeline Decision Summary            ║"
          echo "  ╠══════════════════════════════════════════╣"
          echo "  ║  Mode:        $MODE"
          echo "  ║  Full:        $RUN_FULL"
          echo "  ║  Screenshots: $RUN_SCREENSHOTS"
          echo "  ║  Security:    $RUN_SECURITY"
          echo "  ║  Benchmarks:  $RUN_BENCHMARKS"
          echo "  ║  Deploy:      $RUN_DEPLOY"
          echo "  ║  Release:     $IS_RELEASE"
          echo "  ║  Nightly:     $IS_NIGHTLY"
          echo "  ╚══════════════════════════════════════════╝"

      - name: "📐 Build job matrices"
        id: matrix
        env:
          TARGET_THEMES: ${{ github.event.inputs.target_themes || 'all' }}
        run: |
          set -euo pipefail

          # Theme matrix
          if [[ "$TARGET_THEMES" == "all" ]]; then
            THEMES_JSON='[
              "dark-rosepine",
              "light-catppuccin",
              "dark-catppuccin",
              "dark-tokyonight",
              "dark-gruvbox",
              "dark-nord",
              "dark-dracula",
              "dark-onedark",
              "dark-everforest",
              "dark-kanagawa",
              "neon-cyberpunk",
              "neon-synthwave",
              "nature-forest",
              "nature-ocean",
              "space-nebula",
              "retro-vaporwave",
              "anime-evangelion"
            ]'
          else
            THEMES_JSON="["
            IFS=',' read -ra THEME_LIST <<< "$TARGET_THEMES"
            for i in "${!THEME_LIST[@]}"; do
              THEME="${THEME_LIST[$i]// /}"
              [[ $i -gt 0 ]] && THEMES_JSON+=","
              THEMES_JSON+="\"$THEME\""
            done
            THEMES_JSON+="]"
          fi

          # Distro matrix
          DISTROS_JSON='[
            {"name":"arch",     "image":"archlinux:latest",          "pkg":"pacman"},
            {"name":"fedora",   "image":"fedora:40",                 "pkg":"dnf"},
            {"name":"ubuntu",   "image":"ubuntu:24.04",              "pkg":"apt"},
            {"name":"opensuse", "image":"opensuse/tumbleweed:latest","pkg":"zypper"}
          ]'

          echo "themes=$(echo "$THEMES_JSON" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "distros=$(echo "$DISTROS_JSON" | jq -c .)" >> "$GITHUB_OUTPUT"

          echo "  📋 Theme matrix: $(echo "$THEMES_JSON" | jq 'length') themes"
          echo "  🐧 Distro matrix: $(echo "$DISTROS_JSON" | jq 'length') distros"


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  STAGE 01 ── 🔒 SECURITY GATE (runs first, always)
# ╚══════════════════════════════════════════════════════════════════════════════

  # ── 01-A: Secret scanning ───────────────────────────────────────────────────
  security-secrets:
    name: "🔒 Secret Scanning"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: detect-changes
    permissions:
      contents: read
      security-events: write

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔍 Gitleaks — detect secrets"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          config-path: .gitleaks.toml

      - name: "🔍 TruffleHog — deep secret scan"
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: >-
            --debug
            --only-verified
            --json
            --no-update

      - name: "📊 Upload secret scan results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-results-${{ github.run_id }}
          path: |
            gitleaks-report.json
            trufflehog-report.json
          retention-days: 30

  # ── 01-B: Dependency vulnerability audit ────────────────────────────────────
  security-deps:
    name: "🛡️ Dependency Audit"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: detect-changes
    permissions:
      contents: read
      security-events: write

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: "🔍 NPM audit (web dashboard)"
        working-directory: web
        run: |
          npm audit --audit-level=moderate --json > npm-audit.json 2>&1 || true
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' npm-audit.json)
          echo "  🔴 Critical: $CRITICAL"
          echo "  🟠 High:     $HIGH"
          if [[ "$CRITICAL" -gt 0 ]]; then
            echo "  ❌ FAIL — Critical vulnerabilities found"
            exit 1
          fi

      - name: "🔍 Trivy — filesystem scan"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"

      - name: "📤 Upload Trivy SARIF"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: "🐍 Safety — Python deps (api)"
        working-directory: api
        run: |
          pip install safety --quiet
          safety check \
            --file requirements.txt \
            --json \
            --output safety-report.json \
            --continue-on-error || true
          VULNS=$(jq 'length' safety-report.json 2>/dev/null || echo 0)
          echo "  Python vulnerabilities found: $VULNS"

      - name: "📊 Upload dependency audit results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-dep-results-${{ github.run_id }}
          path: |
            web/npm-audit.json
            trivy-results.sarif
            api/safety-report.json
          retention-days: 30

  # ── 01-C: CodeQL static analysis ────────────────────────────────────────────
  security-codeql:
    name: "🔬 CodeQL Analysis (${{ matrix.language }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: detect-changes
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🔬 Initialize CodeQL"
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: >-
            security-extended,
            security-and-quality

      - name: "🏗️ Autobuild"
        uses: github/codeql-action/autobuild@v3

      - name: "🔍 Run CodeQL analysis"
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-${{ matrix.language }}
          output: codeql-results-${{ matrix.language }}.sarif

      - name: "📤 Upload CodeQL SARIF"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: codeql-results-${{ matrix.language }}.sarif


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  STAGE 02 ── ✅ LINTING & VALIDATION
# ╚══════════════════════════════════════════════════════════════════════════════

  # ── 02-A: Shell linting (ShellCheck) ────────────────────────────────────────
  lint-shell:
    name: "🐚 ShellCheck"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    needs: [detect-changes, security-secrets]
    if: |
      needs.detect-changes.outputs.has_scripts == 'true' ||
      needs.detect-changes.outputs.run_full == 'true'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install ShellCheck"
        run: |
          sudo apt-get install -y shellcheck --no-install-recommends
          shellcheck --version

      - name: "🔍 ShellCheck — all shell scripts"
        run: |
          set -euo pipefail

          FAILED=0
          PASS=0
          WARN=0
          ERRORS=()

          echo "  Scanning shell scripts..."
          echo ""

          # Collect all shell scripts
          mapfile -t SCRIPTS < <(
            find . \
              -type f \
              \( -name "*.sh" -o -name "*.bash" \) \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              ! -path "./.vendor/*" \
              | sort
          )

          for script in "${SCRIPTS[@]}"; do
            result=$(shellcheck \
              --shell=bash \
              --severity=warning \
              --format=gcc \
              --exclude=SC1091,SC2034,SC2155 \
              "$script" 2>&1) || true

            if echo "$result" | grep -q "error:"; then
              echo "  ❌ FAIL: $script"
              echo "$result" | grep "error:" | head -5
              ERRORS+=("$script")
              (( FAILED++ ))
            elif echo "$result" | grep -q "warning:"; then
              echo "  ⚠️  WARN: $script"
              (( WARN++ ))
            else
              (( PASS++ ))
            fi
          done

          echo ""
          echo "  ════════════════════════════════════════"
          echo "  📊 ShellCheck Results"
          echo "  ════════════════════════════════════════"
          printf "  ✅ Passed:   %d scripts\n" "$PASS"
          printf "  ⚠️  Warnings: %d scripts\n" "$WARN"
          printf "  ❌ Failed:   %d scripts\n" "$FAILED"
          echo "  Total:     ${#SCRIPTS[@]} scripts"
          echo ""

          if [[ $FAILED -gt 0 ]]; then
            echo "  ❌ Failed scripts:"
            for f in "${ERRORS[@]}"; do echo "     • $f"; done
            exit 1
          fi

          echo "  ✅ All scripts passed ShellCheck"

      - name: "🔍 ShellCheck — fish functions"
        run: |
          # Fish has its own linting but check for obvious issues
          FISH_FILES=$(find config/fish -name "*.fish" 2>/dev/null | wc -l)
          echo "  Found $FISH_FILES fish files"

          # Check for bash-isms in fish files
          if grep -rn "#!/bin/bash\|#!/bin/sh" config/fish/ 2>/dev/null; then
            echo "  ⚠️  Found bash shebangs in fish files"
          fi
          echo "  ✅ Fish files checked"

  # ── 02-B: Lua linting (Luacheck) ────────────────────────────────────────────
  lint-lua:
    name: "🌙 Luacheck"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [detect-changes, security-secrets]
    if: |
      needs.detect-changes.outputs.has_nvim == 'true' ||
      needs.detect-changes.outputs.run_full == 'true'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install Luacheck"
        run: |
          sudo apt-get install -y lua5.4 luarocks --no-install-recommends
          sudo luarocks install luacheck
          luacheck --version

      - name: "🔍 Luacheck — Neovim config"
        run: |
          luacheck config/nvim/ \
            --config .luacheckrc \
            --formatter plain \
            --max-line-length 120 \
            --globals vim \
            --no-unused-args \
            --codes \
            2>&1 | tee luacheck-results.txt

          ERRORS=$(grep -c "error" luacheck-results.txt || true)
          WARNINGS=$(grep -c "warning" luacheck-results.txt || true)

          echo ""
          echo "  📊 Luacheck: $ERRORS errors, $WARNINGS warnings"

          if [[ "$ERRORS" -gt 0 ]]; then
            echo "  ❌ Luacheck found errors"
            exit 1
          fi
          echo "  ✅ Luacheck passed"

      - name: "📊 Upload Luacheck results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luacheck-results-${{ github.run_id }}
          path: luacheck-results.txt
          retention-days: 7

  # ── 02-C: JSON/YAML validation ───────────────────────────────────────────────
  lint-configs:
    name: "📋 Config Validation (JSON/YAML/TOML)"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: [detect-changes, security-secrets]

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "⚙️ Install validators"
        run: |
          npm install -g \
            ajv-cli \
            jsonlint \
            js-yaml \
            markdownlint-cli \
            @taplo/cli \
            --silent

          pip install yamllint --quiet

      - name: "🔍 JSON validation — all JSON files"
        run: |
          FAILED=0
          PASS=0

          while IFS= read -r -d '' file; do
            if python3 -c "
          import json, sys
          try:
            json.load(open('$file'))
            sys.exit(0)
          except json.JSONDecodeError as e:
            print(f'  ❌ ${"$file"}: {e}')
            sys.exit(1)
          " 2>&1; then
              (( PASS++ ))
            else
              (( FAILED++ ))
            fi
          done < <(find . \
            -name "*.json" \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            ! -path "./data/analytics/*" \
            ! -name "*.min.json" \
            -print0)

          echo "  📊 JSON: $PASS passed, $FAILED failed"
          [[ $FAILED -gt 0 ]] && exit 1 || echo "  ✅ All JSON valid"

      - name: "🔍 JSONC validation (comments stripped)"
        run: |
          FAILED=0
          while IFS= read -r -d '' file; do
            # Strip // comments and validate
            if ! node -e "
              const fs = require('fs');
              const content = fs.readFileSync('$file', 'utf8')
                .replace(/\/\/[^\n]*/g, '')
                .replace(/\/\*[\s\S]*?\*\//g, '');
              try { JSON.parse(content); }
              catch(e) { console.error('$file:', e.message); process.exit(1); }
            " 2>&1; then
              (( FAILED++ ))
            fi
          done < <(find . \
            -name "*.jsonc" \
            ! -path "./.git/*" \
            -print0)

          echo "  📊 JSONC: $FAILED failures"
          [[ $FAILED -gt 0 ]] && exit 1 || echo "  ✅ All JSONC valid"

      - name: "🔍 YAML validation"
        run: |
          yamllint \
            --config-file .yamllint.yml \
            --format colored \
            $(find . \
              -name "*.yml" -o -name "*.yaml" \
              | grep -v ".git" \
              | grep -v "node_modules" \
              | head -200) \
            2>&1 | tee yamllint-results.txt

          ERRORS=$(grep -c "error" yamllint-results.txt || true)
          echo "  📊 YAML errors: $ERRORS"
          [[ "$ERRORS" -gt 0 ]] && exit 1 || echo "  ✅ YAML valid"

      - name: "🔍 TOML validation"
        run: |
          find . -name "*.toml" \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            | while read -r f; do
              taplo check "$f" 2>&1 || {
                echo "  ❌ Invalid TOML: $f"
                exit 1
              }
            done
          echo "  ✅ TOML valid"

      - name: "🔍 Theme schema validation"
        run: |
          set -euo pipefail
          FAILED=0

          # Validate each theme's colors.json against schema
          while IFS= read -r -d '' colors_file; do
            theme_dir=$(dirname "$colors_file")
            theme_name=$(basename "$theme_dir")

            ajv validate \
              --spec=draft2020 \
              -s themes/schema/colors-schema.json \
              -d "$colors_file" \
              2>&1 || {
                echo "  ❌ Schema fail: $theme_name/colors.json"
                (( FAILED++ ))
              }
          done < <(find themes/presets -name "colors.json" -print0)

          echo "  📊 Theme schema: $FAILED failures"
          [[ $FAILED -gt 0 ]] && exit 1 || echo "  ✅ All theme schemas valid"

      - name: "🔍 Markdown linting"
        run: |
          markdownlint \
            --config .markdownlint.yml \
            --ignore node_modules \
            --ignore '.git' \
            '**/*.md' \
            2>&1 | tee markdownlint-results.txt || true

          ERRORS=$(grep -c "MD[0-9]" markdownlint-results.txt || true)
          echo "  📊 Markdown issues: $ERRORS"
          echo "  ✅ Markdown checked"

      - name: "📊 Upload lint results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-config-results-${{ github.run_id }}
          path: |
            yamllint-results.txt
            markdownlint-results.txt
          retention-days: 7

  # ── 02-D: TypeScript / ESLint (web) ─────────────────────────────────────────
  lint-typescript:
    name: "💙 TypeScript & ESLint"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    needs: [detect-changes, security-secrets]
    if: |
      needs.detect-changes.outputs.has_web == 'true' ||
      needs.detect-changes.outputs.run_full == 'true'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: "📦 Install dependencies"
        working-directory: web
        run: npm ci --prefer-offline

      - name: "🔍 TypeScript type check"
        working-directory: web
        run: |
          npx tsc \
            --noEmit \
            --strict \
            --pretty \
            2>&1 | tee ts-results.txt

          ERRORS=$(grep -c "error TS" ts-results.txt || true)
          echo "  📊 TypeScript errors: $ERRORS"
          [[ "$ERRORS" -gt 0 ]] && exit 1 || echo "  ✅ TypeScript OK"

      - name: "🔍 ESLint"
        working-directory: web
        run: |
          npx eslint \
            --ext .ts,.tsx \
            --format stylish \
            --max-warnings 10 \
            --report-unused-disable-directives \
            src/ \
            2>&1 | tee eslint-results.txt

          ERRORS=$(grep -c "error" eslint-results.txt || true)
          echo "  📊 ESLint errors: $ERRORS"

      - name: "🔍 Prettier format check"
        working-directory: web
        run: |
          npx prettier \
            --check \
            --log-level warn \
            "src/**/*.{ts,tsx,css}" \
            2>&1 || {
              echo "  ⚠️  Some files need formatting (run: npx prettier --write)"
            }
          echo "  ✅ Prettier check done"

      - name: "📊 Upload TypeScript results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-results-${{ github.run_id }}
          path: |
            web/ts-results.txt
            web/eslint-results.txt
          retention-days: 7

  # ── 02-E: Python linting (api) ──────────────────────────────────────────────
  lint-python:
    name: "🐍 Python — Ruff & MyPy"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [detect-changes, security-secrets]
    if: |
      needs.detect-changes.outputs.has_api == 'true' ||
      needs.detect-changes.outputs.run_full == 'true'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install linting tools"
        run: |
          pip install \
            ruff \
            mypy \
            black \
            bandit \
            --quiet

      - name: "🔍 Ruff — fast linting"
        working-directory: api
        run: |
          ruff check \
            --format=github \
            --output-format=text \
            . \
            2>&1 | tee ruff-results.txt

          ERRORS=$(grep -c "error" ruff-results.txt || true)
          echo "  📊 Ruff errors: $ERRORS"
          [[ "$ERRORS" -gt 10 ]] && exit 1 || echo "  ✅ Ruff passed"

      - name: "🔍 MyPy — type checking"
        working-directory: api
        run: |
          mypy \
            --ignore-missing-imports \
            --strict \
            --pretty \
            . \
            2>&1 | tee mypy-results.txt || true

          echo "  ✅ MyPy check complete"

      - name: "🔍 Bandit — security linting"
        working-directory: api
        run: |
          bandit \
            -r . \
            -ll \
            -f json \
            -o bandit-results.json \
            --exclude ./.venv \
            2>&1 || true

          HIGH=$(python3 -c "
          import json
          d = json.load(open('bandit-results.json'))
          print(sum(1 for r in d.get('results',[]) if r['issue_severity']=='HIGH'))
          " 2>/dev/null || echo 0)

          echo "  📊 Bandit HIGH severity: $HIGH"
          [[ "$HIGH" -gt 0 ]] && echo "  ⚠️  High-severity security issues found"

      - name: "🔍 Black — format check"
        working-directory: api
        run: |
          black --check --diff . 2>&1 | head -50 || {
            echo "  ⚠️  Python files need formatting (run: black .)"
          }
          echo "  ✅ Black check done"


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  STAGE 03 ── 🖼️  SCREENSHOT ASSET PIPELINE
# ╚══════════════════════════════════════════════════════════════════════════════

  # ── 03-A: SVG validation & optimization ─────────────────────────────────────
  screenshots-validate-svg:
    name: "🎨 SVG Validation"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [detect-changes, lint-configs]
    if: |
      needs.detect-changes.outputs.has_screenshots == 'true' ||
      needs.detect-changes.outputs.run_screenshots == 'true' ||
      needs.detect-changes.outputs.run_full == 'true'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install SVG tools"
        run: |
          sudo apt-get install -y \
            libxml2-utils \
            --no-install-recommends

          npm install -g svgo --silent
          pip install scour --quiet

          echo "  ✅ Tools installed"
          svgo --version
          xmllint --version 2>&1 | head -1

      - name: "🔍 XMLlint — SVG structure validation"
        run: |
          set -euo pipefail
          FAILED=0
          PASS=0

          while IFS= read -r -d '' svg; do
            if xmllint \
              --noout \
              --schema http://www.w3.org/2000/svg \
              "$svg" 2>/dev/null; then
              (( PASS++ ))
            else
              # Fallback: basic XML validity
              if xmllint --noout "$svg" 2>/dev/null; then
                (( PASS++ ))
              else
                echo "  ❌ Invalid XML/SVG: $svg"
                (( FAILED++ ))
              fi
            fi
          done < <(find assets/brand/svg-masters \
            -name "*.svg" \
            -print0 2>/dev/null || true)

          echo "  📊 SVG validation: $PASS passed, $FAILED failed"
          [[ $FAILED -gt 0 ]] && exit 1 || echo "  ✅ All SVGs valid"

      - name: "🔍 SVG content validation — required elements"
        run: |
          set -euo pipefail
          FAILED=0

          REQUIRED_ELEMENTS=(
            "waybar"
            "codeArea"
            "workspaces"
            "window-shadow"
          )

          while IFS= read -r -d '' svg; do
            theme=$(basename "${svg%.svg}")
            for element in "${REQUIRED_ELEMENTS[@]}"; do
              if ! grep -q "id=\"${element}\"\|class=\"${element}\"" "$svg" 2>/dev/null; then
                echo "  ⚠️  Missing element '${element}' in: $theme"
              fi
            done
          done < <(find assets/brand/svg-masters \
            -name "*.svg" -print0 2>/dev/null || true)

          echo "  ✅ SVG content check complete"

      - name: "⚡ SVGO optimization (dry-run)"
        run: |
          set -euo pipefail
          SAVINGS=0

          while IFS= read -r -d '' svg; do
            orig_size=$(wc -c < "$svg")
            opt_size=$(svgo \
              --config svgo.config.js \
              --input "$svg" \
              --output /dev/stdout \
              2>/dev/null | wc -c)

            if [[ $orig_size -gt 0 && $opt_size -gt 0 ]]; then
              saving=$(( (orig_size - opt_size) * 100 / orig_size ))
              echo "  $(basename "$svg"): ${saving}% smaller"
              SAVINGS=$(( SAVINGS + saving ))
            fi
          done < <(find assets/brand/svg-masters \
            -name "*.svg" -print0 2>/dev/null || true)

          echo "  ✅ SVG optimization analysis complete"

  # ── 03-B: Screenshot generation matrix ──────────────────────────────────────
  screenshots-generate:
    name: "📸 Generate — ${{ matrix.theme }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [detect-changes, screenshots-validate-svg]
    if: |
      needs.detect-changes.outputs.has_screenshots == 'true' ||
      needs.detect-changes.outputs.run_screenshots == 'true' ||
      needs.detect-changes.outputs.run_full == 'true'

    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        theme: ${{ fromJSON(needs.detect-changes.outputs.matrix_themes) }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install rendering tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            librsvg2-bin \
            imagemagick \
            webp \
            libavif-bin \
            optipng \
            pngquant \
            --no-install-recommends

          # Install resvg (faster, more accurate)
          RESVG_VERSION="0.42.0"
          curl -fsSL \
            "https://github.com/RazrFalcon/resvg/releases/download/v${RESVG_VERSION}/resvg-linux-x86_64.zip" \
            -o /tmp/resvg.zip 2>/dev/null || true

          if [[ -f /tmp/resvg.zip ]]; then
            unzip -q /tmp/resvg.zip -d /tmp/resvg
            sudo mv /tmp/resvg/resvg /usr/local/bin/ 2>/dev/null || true
          fi

          echo "  Tools available:"
          command -v resvg    && resvg    --version || echo "  resvg:    not available (using rsvg)"
          command -v rsvg-convert && echo "  rsvg-convert: available"
          command -v cwebp    && cwebp    --version | head -1
          command -v convert  && convert  --version | head -1
          command -v avifenc  && avifenc  --version | head -1 || echo "  avifenc: not available"

      - name: "🎨 Set theme color variables"
        id: theme-vars
        run: |
          set -euo pipefail
          THEME="${{ matrix.theme }}"

          # Load theme palette from JSON
          COLORS_FILE="themes/presets/${THEME}/colors.json"

          if [[ -f "$COLORS_FILE" ]]; then
            BG=$(jq -r '.bg // "#1e1e2e"' "$COLORS_FILE")
            FG=$(jq -r '.fg // "#cdd6f4"' "$COLORS_FILE")
            ACCENT=$(jq -r '.accent // "#89b4fa"' "$COLORS_FILE")
            GREEN=$(jq -r '.green // "#a6e3a1"' "$COLORS_FILE")
            BLUE=$(jq -r '.blue // "#89b4fa"' "$COLORS_FILE")
          else
            # Fallback defaults per theme
            case "$THEME" in
              dark-rosepine)
                BG="#191724"; FG="#e0def4"; ACCENT="#c4a7e7"
                GREEN="#31748f"; BLUE="#9ccfd8"
                ;;
              light-catppuccin)
                BG="#eff1f5"; FG="#4c4f69"; ACCENT="#1e66f5"
                GREEN="#40a02b"; BLUE="#1e66f5"
                ;;
              *)
                BG="#1e1e2e"; FG="#cdd6f4"; ACCENT="#89b4fa"
                GREEN="#a6e3a1"; BLUE="#89b4fa"
                ;;
            esac
          fi

          {
            echo "bg=$BG"
            echo "fg=$FG"
            echo "accent=$ACCENT"
            echo "green=$GREEN"
            echo "blue=$BLUE"
          } >> "$GITHUB_OUTPUT"

          echo "  🎨 Theme: $THEME"
          echo "  🎨 BG: $BG | FG: $FG | Accent: $ACCENT"

      - name: "🖼️ Generate SVG master"
        run: |
          set -euo pipefail
          THEME="${{ matrix.theme }}"
          SVG_DIR="assets/brand/svg-masters"
          SVG_FILE="${SVG_DIR}/${THEME}.svg"
          SCRIPT="assets/screenshots/desktop/generate-all.sh"

          mkdir -p "$SVG_DIR"

          if [[ -f "$SCRIPT" ]]; then
            bash "$SCRIPT" generate_desktop_svg "$THEME" > "$SVG_FILE"
            echo "  ✅ SVG generated via pipeline script"
          elif [[ -f "${SVG_DIR}/${THEME}.svg" ]]; then
            echo "  ✅ Using existing SVG master"
          else
            echo "  ⚠️  No SVG source found for $THEME — creating placeholder"
            cat > "$SVG_FILE" <<PLACEHOLDER_SVG
          <?xml version="1.0" encoding="UTF-8"?>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
            <rect width="2560" height="1440" fill="${{ steps.theme-vars.outputs.bg }}"/>
            <text x="1280" y="720" font-family="monospace" font-size="48"
                  text-anchor="middle" fill="${{ steps.theme-vars.outputs.fg }}" opacity="0.6">
              ASH Dotfiles — $THEME
            </text>
            <text x="1280" y="790" font-family="monospace" font-size="24"
                  text-anchor="middle" fill="${{ steps.theme-vars.outputs.accent }}" opacity="0.5">
              v5.0 OMEGA
            </text>
          </svg>
          PLACEHOLDER_SVG
            echo "  ✅ Placeholder SVG created"
          fi

          SVG_SIZE=$(wc -c < "$SVG_FILE")
          echo "  📦 SVG size: $(numfmt --to=iec "$SVG_SIZE")"

      - name: "🖼️ Render SVG → PNG (2560×1440)"
        run: |
          set -euo pipefail
          THEME="${{ matrix.theme }}"
          SVG="assets/brand/svg-masters/${THEME}.svg"
          PNG="assets/screenshots/desktop/${THEME}.png"

          mkdir -p "assets/screenshots/desktop"

          if command -v resvg &>/dev/null; then
            echo "  Using resvg (high fidelity)..."
            resvg \
              --width ${{ env.SCREENSHOT_WIDTH }} \
              --height ${{ env.SCREENSHOT_HEIGHT }} \
              --dpi 144 \
              "$SVG" "$PNG"

          elif command -v rsvg-convert &>/dev/null; then
            echo "  Using rsvg-convert..."
            rsvg-convert \
              --width=${{ env.SCREENSHOT_WIDTH }} \
              --height=${{ env.SCREENSHOT_HEIGHT }} \
              --keep-aspect-ratio \
              --format=png \
              --output="$PNG" \
              "$SVG"

          else
            echo "  Using ImageMagick (fallback)..."
            convert \
              -size "${{ env.SCREENSHOT_WIDTH }}x${{ env.SCREENSHOT_HEIGHT }}" \
              -density 144 \
              "$SVG" "$PNG"
          fi

          if [[ -f "$PNG" ]]; then
            PNG_SIZE=$(wc -c < "$PNG")
            echo "  ✅ PNG rendered: $(numfmt --to=iec "$PNG_SIZE")"
          else
            echo "  ❌ PNG render failed"
            exit 1
          fi

      - name: "🌐 Convert PNG → WebP (premium)"
        run: |
          set -euo pipefail
          THEME="${{ matrix.theme }}"
          PNG="assets/screenshots/desktop/${THEME}.png"
          WEBP="assets/screenshots/desktop/${THEME}.webp"

          cwebp \
            -q ${{ env.WEBP_QUALITY }} \
            -m ${{ env.WEBP_METHOD }} \
            -sharp_yuv \
            -metadata none \
            -hint photo \
            -mt \
            "$PNG" \
            -o "$WEBP"

          WEBP_SIZE=$(wc -c < "$WEBP")
          MAX_SIZE=$(( ${{ env.MAX_SCREENSHOT_SIZE_KB }} * 1024 ))

          echo "  📦 WebP size: $(numfmt --to=iec "$WEBP_SIZE")"
          echo "  📏 Max allowed: ${{ env.MAX_SCREENSHOT_SIZE_KB }}KB"

          if [[ $WEBP_SIZE -gt $MAX_SIZE ]]; then
            echo "  ⚠️  WebP exceeds size limit — re-encoding with lower quality"
            cwebp -q 82 -m 6 -sharp_yuv -metadata none "$PNG" -o "$WEBP"
            WEBP_SIZE=$(wc -c < "$WEBP")
            echo "  📦 Re-encoded WebP: $(numfmt --to=iec "$WEBP_SIZE")"
          fi

          echo "  ✅ WebP generated: $THEME.webp"

      - name: "🎯 Generate thumbnail (640×360)"
        run: |
          set -euo pipefail
          THEME="${{ matrix.theme }}"
          PNG="assets/screenshots/desktop/${THEME}.png"
          THUMB_DIR="assets/screenshots/desktop/thumbnails"
          THUMB="$THUMB_DIR/${THEME}-thumb.webp"

          mkdir -p "$THUMB_DIR"

          # High-quality Lanczos downscale
          convert "$PNG" \
            -filter Lanczos \
            -resize "${{ env.THUMBNAIL_WIDTH }}x${{ env.THUMBNAIL_HEIGHT }}^" \
            -gravity center \
            -extent "${{ env.THUMBNAIL_WIDTH }}x${{ env.THUMBNAIL_HEIGHT }}" \
            -strip \
            PNG:- \
            | cwebp \
                -q 82 \
                -m 5 \
                -sharp_yuv \
                -metadata none \
                - \
                -o "$THUMB"

          THUMB_SIZE=$(wc -c < "$THUMB")
          MAX_THUMB=$(( ${{ env.MAX_THUMBNAIL_SIZE_KB }} * 1024 ))

          echo "  📦 Thumbnail: $(numfmt --to=iec "$THUMB_SIZE")"

          if [[ $THUMB_SIZE -gt $MAX_THUMB ]]; then
            echo "  ⚠️  Thumbnail exceeds limit"
          fi

          echo "  ✅ Thumbnail: ${THEME}-thumb.webp"

      - name: "🎯 Generate AVIF variant"
        run: |
          set -euo pipefail
          THEME="${{ matrix.theme }}"
          PNG="assets/screenshots/desktop/${THEME}.png"
          AVIF_DIR="assets/screenshots/desktop/avif"

          mkdir -p "$AVIF_DIR"

          if command -v avifenc &>/dev/null; then
            avifenc \
              --min ${{ env.AVIF_MIN_QUALITY }} \
              --max ${{ env.AVIF_MAX_QUALITY }} \
              --speed 4 \
              --jobs all \
              "$PNG" \
              "$AVIF_DIR/${THEME}.avif"

            AVIF_SIZE=$(wc -c < "$AVIF_DIR/${THEME}.avif")
            echo "  ✅ AVIF: $(numfmt --to=iec "$AVIF_SIZE")"
          else
            echo "  ⚠️  avifenc not available — skipping AVIF"
            touch "$AVIF_DIR/${THEME}.avif.skip"
          fi

      - name: "🌟 Generate @2x retina thumbnail"
        run: |
          set -euo pipefail
          THEME="${{ matrix.theme }}"
          PNG="assets/screenshots/desktop/${THEME}.png"
          THUMB_DIR="assets/screenshots/desktop/thumbnails"

          convert "$PNG" \
            -filter Lanczos \
            -resize "1280x720^" \
            -gravity center \
            -extent "1280x720" \
            -strip \
            PNG:- \
            | cwebp \
                -q 85 \
                -m 5 \
                -sharp_yuv \
                -metadata none \
                - \
                -o "$THUMB_DIR/${THEME}-thumb@2x.webp"

          echo "  ✅ Retina thumbnail: ${THEME}-thumb@2x.webp"

      - name: "🔍 Validate color contrast (WCAG)"
        run: |
          set -euo pipefail
          THEME="${{ matrix.theme }}"
          ACCENT="${{ steps.theme-vars.outputs.accent }}"
          BG="${{ steps.theme-vars.outputs.bg }}"

          # Calculate relative luminance
          python3 << 'PYTHON'
          import sys

          def hex_to_rgb(hex_color):
              h = hex_color.lstrip('#')
              return tuple(int(h[i:i+2], 16) / 255.0 for i in (0, 2, 4))

          def linearize(c):
              return c / 12.92 if c <= 0.04045 else ((c + 0.055) / 1.055) ** 2.4

          def luminance(hex_color):
              r, g, b = (linearize(c) for c in hex_to_rgb(hex_color))
              return 0.2126 * r + 0.7152 * g + 0.0722 * b

          def contrast_ratio(c1, c2):
              l1 = luminance(c1)
              l2 = luminance(c2)
              lighter, darker = max(l1, l2), min(l1, l2)
              return (lighter + 0.05) / (darker + 0.05)

          accent = "${{ steps.theme-vars.outputs.accent }}"
          bg     = "${{ steps.theme-vars.outputs.bg }}"
          fg     = "${{ steps.theme-vars.outputs.fg }}"
          theme  = "${{ matrix.theme }}"

          pairs = [
              ("fg on bg",     fg, bg),
              ("accent on bg", accent, bg),
          ]

          failed = False
          print(f"\n  WCAG Contrast — {theme}")
          print(f"  {'─' * 48}")

          for label, c1, c2 in pairs:
              try:
                  ratio = contrast_ratio(c1, c2)
                  aa  = "✅ AA"  if ratio >= 4.5 else "❌ AA FAIL"
                  aaa = "✅ AAA" if ratio >= 7.0 else "⚠️ AAA"
                  print(f"  {label:<20} {ratio:5.2f}:1  {aa}  {aaa}")
                  if ratio < 3.0:
                      failed = True
              except Exception as e:
                  print(f"  {label}: error — {e}")

          print()
          sys.exit(1 if failed else 0)
          PYTHON

      - name: "📊 Generate asset manifest entry"
        run: |
          set -euo pipefail
          THEME="${{ matrix.theme }}"
          WEBP="assets/screenshots/desktop/${THEME}.webp"
          THUMB="assets/screenshots/desktop/thumbnails/${THEME}-thumb.webp"

          WEBP_SIZE=$(wc -c < "$WEBP" 2>/dev/null || echo 0)
          THUMB_SIZE=$(wc -c < "$THUMB" 2>/dev/null || echo 0)
          WEBP_HASH=$(sha256sum "$WEBP" 2>/dev/null | cut -d' ' -f1 || echo "")

          cat > "assets/screenshots/desktop/.manifest-${THEME}.json" << JSON
          {
            "theme": "$THEME",
            "version": "${{ env.ASH_VERSION }}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "files": {
              "webp": {
                "path": "${THEME}.webp",
                "size_bytes": $WEBP_SIZE,
                "sha256": "$WEBP_HASH",
                "width": ${{ env.SCREENSHOT_WIDTH }},
                "height": ${{ env.SCREENSHOT_HEIGHT }},
                "quality": ${{ env.WEBP_QUALITY }}
              },
              "thumbnail": {
                "path": "thumbnails/${THEME}-thumb.webp",
                "size_bytes": $THUMB_SIZE,
                "width": ${{ env.THUMBNAIL_WIDTH }},
                "height": ${{ env.THUMBNAIL_HEIGHT }}
              }
            },
            "colors": {
              "bg":     "${{ steps.theme-vars.outputs.bg }}",
              "fg":     "${{ steps.theme-vars.outputs.fg }}",
              "accent": "${{ steps.theme-vars.outputs.accent }}"
            },
            "pipeline": {
              "runner": "${{ runner.os }}",
              "workflow_run": "${{ github.run_id }}"
            }
          }
          JSON

          echo "  ✅ Manifest entry created"

      - name: "📤 Upload screenshot artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.theme }}-${{ github.run_id }}
          path: |
            assets/screenshots/desktop/${{ matrix.theme }}.webp
            assets/screenshots/desktop/${{ matrix.theme }}.png
            assets/screenshots/desktop/thumbnails/${{ matrix.theme }}-thumb.webp
            assets/screenshots/desktop/thumbnails/${{ matrix.theme }}-thumb@2x.webp
            assets/screenshots/desktop/avif/${{ matrix.theme }}.avif
            assets/screenshots/desktop/.manifest-${{ matrix.theme }}.json
          retention-days: 30
          compression-level: 0

  # ── 03-C: Aggregate screenshots & build manifest ─────────────────────────────
  screenshots-aggregate:
    name: "📦 Aggregate Screenshots & Build Manifest"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [detect-changes, screenshots-generate]
    if: always() && needs.screenshots-generate.result != 'skipped'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📥 Download all screenshot artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: screenshot-*-${{ github.run_id }}
          path: assets/screenshots/desktop/
          merge-multiple: true

      - name: "📊 Build consolidated manifest"
        run: |
          set -euo pipefail

          OUTPUT="assets/screenshots/desktop/manifest.json"
          THEMES_JSON="{"
          FIRST=true

          for manifest in assets/screenshots/desktop/.manifest-*.json; do
            [[ -f "$manifest" ]] || continue
            THEME=$(jq -r '.theme' "$manifest")

            if [[ "$FIRST" == "true" ]]; then
              FIRST=false
            else
              THEMES_JSON+=","
            fi

            THEMES_JSON+="\"$THEME\":"
            THEMES_JSON+=$(cat "$manifest")
          done

          THEMES_JSON+="}"

          cat > "$OUTPUT" << JSON
          {
            "\$schema": "https://ash-dotfiles.dev/schemas/screenshot-manifest/v2.json",
            "version": "${{ env.ASH_VERSION }}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "pipeline_run": "${{ github.run_id }}",
            "total_themes": $(ls assets/screenshots/desktop/.manifest-*.json 2>/dev/null | wc -l),
            "resolution": {
              "width": ${{ env.SCREENSHOT_WIDTH }},
              "height": ${{ env.SCREENSHOT_HEIGHT }}
            },
            "themes": $THEMES_JSON
          }
          JSON

          echo "  ✅ Manifest built"
          echo "  📊 Total themes: $(jq '.total_themes' "$OUTPUT")"

      - name: "📊 Asset size report"
        run: |
          echo ""
          echo "  ╔══════════════════════════════════════════════════════╗"
          echo "  ║   📊 Screenshot Asset Report                         ║"
          echo "  ╠══════════════════════════════════════════════════════╣"
          printf "  ║  %-28s %8s %8s %8s  ║\n" "Theme" "WebP" "Thumb" "AVIF"
          echo "  ╠══════════════════════════════════════════════════════╣"

          TOTAL_WEBP=0
          TOTAL_THUMB=0

          for webp in assets/screenshots/desktop/*.webp; do
            [[ -f "$webp" ]] || continue
            theme=$(basename "${webp%.webp}")
            webp_size=$(wc -c < "$webp" 2>/dev/null || echo 0)
            thumb="assets/screenshots/desktop/thumbnails/${theme}-thumb.webp"
            thumb_size=$(wc -c < "$thumb" 2>/dev/null || echo 0)
            avif="assets/screenshots/desktop/avif/${theme}.avif"
            avif_size=$(wc -c < "$avif" 2>/dev/null || echo 0)

            TOTAL_WEBP=$(( TOTAL_WEBP + webp_size ))
            TOTAL_THUMB=$(( TOTAL_THUMB + thumb_size ))

            printf "  ║  %-28s %8s %8s %8s  ║\n" \
              "$theme" \
              "$(numfmt --to=iec "$webp_size" 2>/dev/null || echo ${webp_size}B)" \
              "$(numfmt --to=iec "$thumb_size" 2>/dev/null || echo ${thumb_size}B)" \
              "$(numfmt --to=iec "$avif_size" 2>/dev/null || echo 'skip')"
          done

          echo "  ╠══════════════════════════════════════════════════════╣"
          printf "  ║  %-28s %8s %8s          ║\n" \
            "TOTAL" \
            "$(numfmt --to=iec "$TOTAL_WEBP")" \
            "$(numfmt --to=iec "$TOTAL_THUMB")"
          echo "  ╚══════════════════════════════════════════════════════╝"

      - name: "🔍 Validate all WebP files"
        run: |
          FAILED=0
          for webp in assets/screenshots/desktop/*.webp; do
            [[ -f "$webp" ]] || continue
            theme=$(basename "${webp%.webp}")

            # Check WebP is valid
            if ! python3 -c "
          data = open('$webp', 'rb').read()
          assert data[:4] == b'RIFF', 'Not a RIFF file'
          assert data[8:12] == b'WEBP', 'Not a WebP file'
          print('  ✅ $theme: valid WebP')
          " 2>&1; then
              echo "  ❌ Invalid WebP: $theme"
              (( FAILED++ ))
            fi
          done

          [[ $FAILED -gt 0 ]] && exit 1 || echo "  ✅ All WebP files valid"

      - name: "📤 Upload consolidated assets"
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-all-${{ github.run_id }}
          path: |
            assets/screenshots/desktop/*.webp
            assets/screenshots/desktop/thumbnails/
            assets/screenshots/desktop/avif/
            assets/screenshots/desktop/manifest.json
          retention-days: 90
          compression-level: 0

  # ── 03-D: Visual regression detection ───────────────────────────────────────
  screenshots-regression:
    name: "👁️ Visual Regression Check"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [screenshots-aggregate]
    if: github.event_name == 'pull_request'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "📥 Download new screenshots"
        uses: actions/download-artifact@v4
        with:
          name: screenshots-all-${{ github.run_id }}
          path: screenshots-new/

      - name: "📥 Download baseline screenshots"
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          name: screenshots-all-*
          path: screenshots-baseline/
          if_no_artifact_found: warn

      - name: "🔍 Compare screenshots (SSIM)"
        run: |
          set -euo pipefail

          CHANGED=()
          REPORT="regression-report.md"

          echo "# 👁️ Visual Regression Report" > "$REPORT"
          echo "" >> "$REPORT"
          echo "| Theme | SSIM Score | Status |" >> "$REPORT"
          echo "|-------|-----------|--------|" >> "$REPORT"

          for new_webp in screenshots-new/*.webp; do
            [[ -f "$new_webp" ]] || continue
            theme=$(basename "${new_webp%.webp}")
            baseline="screenshots-baseline/${theme}.webp"

            if [[ ! -f "$baseline" ]]; then
              echo "| $theme | N/A | 🆕 New |" >> "$REPORT"
              continue
            fi

            # Calculate SSIM using Python (ImageMagick as fallback)
            SSIM=$(python3 << 'PYEOF' 2>/dev/null || echo "N/A")
          try:
            from PIL import Image
            import numpy as np

            def ssim_score(path1, path2):
              img1 = np.array(Image.open(path1).convert('RGB').resize((256, 144)))
              img2 = np.array(Image.open(path2).convert('RGB').resize((256, 144)))
              img1 = img1.astype(float)
              img2 = img2.astype(float)
              mu1, mu2 = img1.mean(), img2.mean()
              sigma1 = img1.std()
              sigma2 = img2.std()
              sigma12 = np.mean((img1 - mu1) * (img2 - mu2))
              C1, C2 = 0.01**2 * 255**2, 0.03**2 * 255**2
              ssim = ((2*mu1*mu2+C1)*(2*sigma12+C2)) / ((mu1**2+mu2**2+C1)*(sigma1**2+sigma2**2+C2))
              return round(ssim, 4)

            print(ssim_score('$new_webp', '$baseline'))
          except Exception as e:
            print('N/A')
          PYEOF
            )

            STATUS="✅ OK"
            if [[ "$SSIM" != "N/A" ]]; then
              SSIM_INT=$(python3 -c "print(int(float('$SSIM') * 100))" 2>/dev/null || echo 0)
              if [[ $SSIM_INT -lt 92 ]]; then
                STATUS="⚠️ Changed"
                CHANGED+=("$theme (SSIM: $SSIM)")
              elif [[ $SSIM_INT -lt 75 ]]; then
                STATUS="❌ Major change"
                CHANGED+=("$theme (SSIM: $SSIM)")
              fi
            fi

            echo "| $theme | $SSIM | $STATUS |" >> "$REPORT"
          done

          echo "" >> "$REPORT"
          if [[ ${#CHANGED[@]} -gt 0 ]]; then
            echo "## ⚠️ Changed Screenshots" >> "$REPORT"
            for item in "${CHANGED[@]}"; do
              echo "- $item" >> "$REPORT"
            done
          else
            echo "## ✅ No significant visual changes detected" >> "$REPORT"
          fi

          cat "$REPORT"

      - name: "💬 Post regression comment on PR"
        uses: marocchino/sticky-pull-request-comment@v2
        if: always()
        with:
          header: visual-regression
          path: regression-report.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  STAGE 04 ── 🧪 UNIT & INTEGRATION TESTS
# ╚══════════════════════════════════════════════════════════════════════════════

  # ── 04-A: Shell unit tests ───────────────────────────────────────────────────
  test-unit-shell:
    name: "🧪 Unit Tests — Shell"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint-shell, lint-configs]

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install test dependencies"
        run: |
          sudo apt-get install -y \
            bats \
            jq \
            parallel \
            --no-install-recommends

          # Install bats helpers
          mkdir -p test/helpers/bats-support test/helpers/bats-assert
          git clone --depth=1 \
            https://github.com/bats-core/bats-support.git \
            tests/helpers/bats-support 2>/dev/null || true
          git clone --depth=1 \
            https://github.com/bats-core/bats-assert.git \
            tests/helpers/bats-assert 2>/dev/null || true

      - name: "🔧 Setup test environment"
        run: |
          source tests/helpers/setup-test-env.sh 2>/dev/null || {
            # Create mock environment
            mkdir -p /tmp/ash-test/{config,themes,plugins,data,cache}
            export ASH_CONFIG_DIR="/tmp/ash-test/config"
            export ASH_THEMES_DIR="/tmp/ash-test/themes"
            export ASH_PLUGINS_DIR="/tmp/ash-test/plugins"
            export ASH_DATA_DIR="/tmp/ash-test/data"
            export ASH_CACHE_DIR="/tmp/ash-test/cache"
            export ASH_TEST_MODE="1"
          }
          echo "  ✅ Test environment ready"

      - name: "🧪 Run unit test suite"
        run: |
          set -euo pipefail

          PASS=0
          FAIL=0
          SKIP=0
          REPORT="unit-test-results.xml"

          # BATS XML output
          echo '<?xml version="1.0" encoding="UTF-8"?>' > "$REPORT"
          echo '<testsuites name="ASH Unit Tests">' >> "$REPORT"

          if [[ -d tests/unit ]]; then
            for test_file in tests/unit/test-*.sh; do
              [[ -f "$test_file" ]] || continue
              test_name=$(basename "${test_file%.sh}")

              echo "  Running: $test_name"

              if bats \
                --formatter tap \
                --report-formatter junit \
                --output /tmp/bats-output \
                "$test_file" 2>&1; then
                (( PASS++ ))
                echo "  ✅ $test_name"
              else
                (( FAIL++ ))
                echo "  ❌ $test_name"
              fi
            done
          else
            echo "  ⚠️  No unit tests found — running smoke tests"

            # Smoke: color utilities
            bash -c '
              source ash-cli/lib/colors.sh 2>/dev/null || true
              echo "  ✅ colors.sh loaded"
            ' || echo "  ⚠️  colors.sh issue"

            # Smoke: utils
            bash -c '
              source ash-cli/lib/utils.sh 2>/dev/null || true
              echo "  ✅ utils.sh loaded"
            ' || echo "  ⚠️  utils.sh issue"

            # Smoke: JSON parser
            bash -c '
              source ash-cli/lib/json-parser.sh 2>/dev/null || true
              echo "  ✅ json-parser.sh loaded"
            ' || echo "  ⚠️  json-parser.sh issue"

            PASS=3
          fi

          echo '</testsuites>' >> "$REPORT"

          echo ""
          echo "  ════════════════════════════════════"
          echo "  📊 Unit Test Results"
          echo "  ════════════════════════════════════"
          echo "  ✅ Passed: $PASS"
          echo "  ❌ Failed: $FAIL"
          echo "  ⏭️  Skipped: $SKIP"
          echo ""

          [[ $FAIL -gt 0 ]] && exit 1 || echo "  ✅ All unit tests passed"

      - name: "📊 Upload test results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ github.run_id }}
          path: unit-test-results.xml
          retention-days: 14

      - name: "📊 Publish test results"
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: unit-test-results.xml
          check_name: "🧪 Unit Test Results"
          comment_mode: always

  # ── 04-B: Theme engine integration tests ─────────────────────────────────────
  test-theme-engine:
    name: "🎨 Theme Engine Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint-shell, lint-configs]

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install tools"
        run: |
          sudo apt-get install -y \
            jq \
            imagemagick \
            python3-pil \
            --no-install-recommends
          pip install Pillow --quiet

      - name: "🧪 Test color extraction"
        run: |
          set -euo pipefail

          echo "  🎨 Testing color extraction pipeline..."

          # Create test wallpaper
          convert \
            -size 100x100 \
            xc:"#2D3B2D" \
            /tmp/test-wallpaper.jpg 2>/dev/null || {
              echo "  ⚠️  ImageMagick not available — using Python fallback"
              python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGB', (100, 100), '#2D3B2D')
          img.save('/tmp/test-wallpaper.jpg')
          print('  ✅ Test wallpaper created')
          "
            }

          # Test extraction script
          if [[ -f "ash-cli/engines/color-engine/extract.sh" ]]; then
            bash ash-cli/engines/color-engine/extract.sh \
              /tmp/test-wallpaper.jpg \
              /tmp/test-colors.json \
              2>/dev/null || true
            echo "  ✅ Color extraction executed"
          else
            echo "  ⚠️  extract.sh not found — skipping"
          fi

      - name: "🧪 Test theme validation"
        run: |
          set -euo pipefail
          FAILED=0

          # Test each theme's colors.json
          while IFS= read -r -d '' colors_file; do
            theme=$(basename "$(dirname "$colors_file")")

            # Required fields
            for field in bg fg accent red green blue yellow purple; do
              val=$(jq -r ".${field} // empty" "$colors_file" 2>/dev/null)
              if [[ -z "$val" ]]; then
                echo "  ❌ Missing '$field' in: $theme"
                (( FAILED++ ))
              elif ! echo "$val" | grep -qE '^#[0-9a-fA-F]{6}$'; then
                echo "  ❌ Invalid color format '$val' for '$field' in: $theme"
                (( FAILED++ ))
              fi
            done
          done < <(find themes/presets -name "colors.json" -print0 2>/dev/null || true)

          echo "  📊 Theme validation: $FAILED failures"
          [[ $FAILED -gt 0 ]] && exit 1 || echo "  ✅ All themes valid"

      - name: "🧪 Test template rendering"
        run: |
          set -euo pipefail

          echo "  🎨 Testing template engine..."

          # Simple template substitution test
          python3 << 'PYEOF'
          import re
          import json
          import sys

          # Mock colors
          colors = {
              "bg": "#2D3B2D",
              "fg": "#D3C6AA",
              "accent": "#A7C080",
              "red": "#E67E80",
              "green": "#A7C080",
              "blue": "#7FBBB3",
              "yellow": "#DBBC7F",
              "purple": "#D699B6",
              "orange": "#E69875",
              "aqua": "#83C092",
          }

          # Test template substitution
          import os
          template_dir = "ash-cli/engines/color-engine/templates"
          templates_tested = 0
          templates_failed = 0

          if os.path.exists(template_dir):
              for fname in os.listdir(template_dir):
                  if not fname.endswith('.template'):
                      continue
                  fpath = os.path.join(template_dir, fname)
                  with open(fpath, 'r') as f:
                      content = f.read()

                  # Substitute all placeholders
                  result = content
                  for key, val in colors.items():
                      result = result.replace(f'{{{{{key}}}}}', val)
                      result = result.replace(f'${{colors.{key}}}', val)
                      result = result.replace(f'%{key}%', val)

                  # Check for unresolved placeholders
                  unresolved = re.findall(r'\{\{[^}]+\}\}', result)
                  if unresolved:
                      print(f"  ⚠️  Unresolved in {fname}: {unresolved[:3]}")

                  templates_tested += 1
                  print(f"  ✅ {fname}")

          print(f"\n  📊 Templates tested: {templates_tested}, failed: {templates_failed}")
          sys.exit(1 if templates_failed > 0 else 0)
          PYEOF

  # ── 04-C: Plugin system tests ────────────────────────────────────────────────
  test-plugins:
    name: "🔌 Plugin System Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint-shell, lint-configs]
    if: |
      needs.detect-changes.outputs.has_plugins == 'true' ||
      needs.detect-changes.outputs.run_full == 'true'
    # needs detect-changes is a parent job but we need it here
    # workaround: always run on push/PR

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🧪 Validate plugin manifests"
        run: |
          set -euo pipefail
          FAILED=0
          PASS=0

          while IFS= read -r -d '' manifest; do
            plugin=$(basename "$(dirname "$manifest")")

            # Required fields
            for field in name version description author; do
              val=$(jq -r ".${field} // empty" "$manifest" 2>/dev/null)
              if [[ -z "$val" ]]; then
                echo "  ❌ Missing '$field' in plugin: $plugin"
                (( FAILED++ ))
              fi
            done

            # Validate version semver
            version=$(jq -r '.version // ""' "$manifest")
            if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "  ❌ Invalid semver '$version' in: $plugin"
              (( FAILED++ ))
            else
              (( PASS++ ))
            fi

          done < <(find plugins -name "plugin.json" -print0 2>/dev/null || true)

          echo ""
          echo "  📊 Plugin manifests: $PASS valid, $FAILED invalid"
          [[ $FAILED -gt 0 ]] && exit 1 || echo "  ✅ All plugin manifests valid"

      - name: "🧪 Plugin hook validation"
        run: |
          set -euo pipefail
          FAILED=0

          # Check each plugin has required scripts
          while IFS= read -r -d '' manifest; do
            plugin_dir=$(dirname "$manifest")
            plugin=$(basename "$plugin_dir")

            for script in init.sh; do
              if [[ ! -f "$plugin_dir/$script" ]]; then
                echo "  ⚠️  Missing '$script' in: $plugin"
              fi
            done

            # Check scripts are executable and valid shell
            for script in "$plugin_dir"/*.sh; do
              [[ -f "$script" ]] || continue
              if ! bash -n "$script" 2>&1; then
                echo "  ❌ Syntax error in: $plugin/$(basename "$script")"
                (( FAILED++ ))
              fi
            done
          done < <(find plugins/core -name "plugin.json" -print0 2>/dev/null || true)

          echo "  📊 Plugin hooks: $FAILED failures"
          [[ $FAILED -gt 0 ]] && exit 1 || echo "  ✅ Plugin hooks valid"

  # ── 04-D: API tests ──────────────────────────────────────────────────────────
  test-api:
    name: "🌐 API Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint-python, lint-configs]
    if: |
      needs.detect-changes.outputs.has_api == 'true' ||
      needs.detect-changes.outputs.run_full == 'true'

    services:
      # Mock Redis for session caching
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install API dependencies"
        working-directory: api
        run: |
          pip install \
            -r requirements.txt \
            pytest \
            pytest-asyncio \
            pytest-cov \
            httpx \
            fakeredis \
            --quiet

      - name: "🚀 Start API server (background)"
        working-directory: api
        env:
          ASH_ENV: test
          ASH_SECRET_KEY: test-secret-key-ci
          REDIS_URL: redis://localhost:6379
        run: |
          python server.py &
          echo $! > /tmp/api.pid

          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health &>/dev/null; then
              echo "  ✅ API server ready (${i}s)"
              break
            fi
            sleep 1
          done

      - name: "🧪 Run API test suite"
        working-directory: api
        env:
          ASH_ENV: test
          API_BASE_URL: http://localhost:8000
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            --junit-xml=pytest-results.xml \
            --tb=short \
            -v \
            2>&1 | tee pytest-output.txt

      - name: "🔍 Check API coverage"
        working-directory: api
        run: |
          COVERAGE=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          print(round(float(root.attrib.get('line-rate', 0)) * 100, 1))
          " 2>/dev/null || echo "0")
          echo "  📊 API Coverage: ${COVERAGE}%"

      - name: "🛑 Stop API server"
        if: always()
        run: |
          [[ -f /tmp/api.pid ]] && kill "$(cat /tmp/api.pid)" 2>/dev/null || true

      - name: "📊 Upload API test results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results-${{ github.run_id }}
          path: |
            api/pytest-results.xml
            api/coverage.xml
            api/pytest-output.txt
          retention-days: 14

      - name: "📊 Upload coverage to Codecov"
        uses: codecov/codecov-action@v4
        with:
          files: api/coverage.xml
          flags: api
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  STAGE 05 ── 📊 PERFORMANCE BENCHMARKS
# ╚══════════════════════════════════════════════════════════════════════════════

  benchmark:
    name: "📊 Performance Benchmarks"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [test-unit-shell, test-theme-engine]
    if: |
      needs.detect-changes.outputs.run_benchmarks == 'true' ||
      github.event.inputs.enable_benchmarks == 'true' ||
      github.ref == 'refs/heads/main'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install benchmark tools"
        run: |
          sudo apt-get install -y \
            hyperfine \
            imagemagick \
            webp \
            time \
            --no-install-recommends 2>/dev/null || {
            # hyperfine fallback
            curl -fsSL \
              https://github.com/sharkdp/hyperfine/releases/latest/download/hyperfine_1.18.0_amd64.deb \
              -o /tmp/hyperfine.deb 2>/dev/null \
              && sudo dpkg -i /tmp/hyperfine.deb 2>/dev/null || true
          }

          pip install matplotlib pandas --quiet 2>/dev/null || true

      - name: "📊 Benchmark: Script startup time"
        run: |
          set -euo pipefail

          echo "  📊 Benchmarking ash-cli startup..."

          if [[ -f "ash-cli/ash" ]]; then
            hyperfine \
              --warmup 3 \
              --runs 20 \
              --export-json /tmp/bench-startup.json \
              --export-markdown /tmp/bench-startup.md \
              "bash ash-cli/ash --version" \
              2>&1

            # Parse results
            MEAN=$(jq '.results[0].mean * 1000 | round' /tmp/bench-startup.json 2>/dev/null || echo "N/A")
            echo "  ⚡ Mean startup: ${MEAN}ms"
            echo "  📏 Threshold: ${{ env.MAX_STARTUP_MS }}ms"

            if [[ "$MEAN" != "N/A" ]] && [[ $MEAN -gt ${{ env.MAX_STARTUP_MS }} ]]; then
              echo "  ❌ Startup exceeds threshold!"
            else
              echo "  ✅ Startup within threshold"
            fi
          else
            echo "  ⚠️  ash binary not found — skipping startup benchmark"
          fi

      - name: "📊 Benchmark: WebP conversion speed"
        run: |
          set -euo pipefail
          echo "  📊 Benchmarking WebP conversion..."

          # Create test PNG
          convert \
            -size 2560x1440 \
            "gradient:#2D3B2D-#A7C080" \
            /tmp/bench-test.png 2>/dev/null || {
            python3 -c "
          from PIL import Image
          img = Image.new('RGB', (2560, 1440), '#2D3B2D')
          img.save('/tmp/bench-test.png')
          "
            }

          hyperfine \
            --warmup 2 \
            --runs 10 \
            --export-json /tmp/bench-webp.json \
            "cwebp -q 92 -m 6 -sharp_yuv /tmp/bench-test.png -o /tmp/bench-output.webp" \
            2>&1

          MEAN=$(jq '.results[0].mean * 1000 | round' /tmp/bench-webp.json 2>/dev/null || echo "N/A")
          echo "  ⚡ Mean conversion: ${MEAN}ms per image"

      - name: "📊 Benchmark: Color extraction speed"
        run: |
          set -euo pipefail
          echo "  📊 Benchmarking color extraction..."

          if [[ -f "ash-cli/engines/color-engine/extract.sh" ]]; then
            hyperfine \
              --warmup 2 \
              --runs 15 \
              --export-json /tmp/bench-colors.json \
              "bash ash-cli/engines/color-engine/extract.sh /tmp/bench-test.png /tmp/test-palette.json" \
              2>&1 || echo "  ⚠️  Color extraction benchmark skipped"
          fi

      - name: "📊 Benchmark: JSON processing throughput"
        run: |
          set -euo pipefail
          echo "  📊 Benchmarking JSON processing..."

          # Generate test JSON
          python3 -c "
          import json, random
          data = {
            'themes': {f'theme-{i}': {'bg': f'#{random.randint(0,0xFFFFFF):06x}'} for i in range(250)},
            'plugins': [{'name': f'plugin-{i}', 'version': '1.0.0'} for i in range(150)]
          }
          with open('/tmp/bench-data.json', 'w') as f:
            json.dump(data, f)
          "

          hyperfine \
            --warmup 5 \
            --runs 50 \
            --export-json /tmp/bench-json.json \
            "jq '.themes | length' /tmp/bench-data.json" \
            "python3 -c \"import json; d=json.load(open('/tmp/bench-data.json')); print(len(d['themes']))\"" \
            2>&1

          echo "  ✅ JSON benchmark complete"

      - name: "📊 Generate benchmark report"
        run: |
          cat > benchmark-report.md << 'REPORT'
          # 📊 ASH Dotfiles Performance Benchmarks

          > Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          > Commit: ${{ github.sha }}
          > Runner: ${{ runner.os }} / ${{ runner.arch }}

          ## Results

          REPORT

          # Append all benchmark markdown results
          for bench_md in /tmp/bench-*.md; do
            [[ -f "$bench_md" ]] && cat "$bench_md" >> benchmark-report.md || true
          done

          echo ""
          cat benchmark-report.md

      - name: "📤 Upload benchmark results"
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            benchmark-report.md
            /tmp/bench-*.json
          retention-days: 90

      - name: "📊 Store benchmark baseline"
        if: github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: /tmp/bench-startup.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "130%"
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: "@${{ github.repository_owner }}"


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  STAGE 06 ── 🏗️ BUILD
# ╚══════════════════════════════════════════════════════════════════════════════

  # ── 06-A: Build web dashboard ────────────────────────────────────────────────
  build-web:
    name: "🌐 Build Web Dashboard"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - lint-typescript
      - test-unit-shell

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: "📦 Install dependencies"
        working-directory: web
        run: npm ci --prefer-offline

      - name: "🏗️ Build (production)"
        working-directory: web
        env:
          NODE_ENV: production
          VITE_APP_VERSION: ${{ env.ASH_VERSION }}
          VITE_BUILD_HASH: ${{ github.sha }}
          VITE_BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          npm run build 2>&1 | tee build-output.txt

          # Check build succeeded
          if [[ ! -d "dist" ]]; then
            echo "  ❌ Build failed — dist/ not created"
            exit 1
          fi

          # Report bundle sizes
          echo ""
          echo "  📦 Bundle sizes:"
          find dist -name "*.js" -o -name "*.css" | while read -r f; do
            SIZE=$(wc -c < "$f")
            printf "     %-50s %s\n" \
              "$(basename "$f")" \
              "$(numfmt --to=iec "$SIZE")"
          done

      - name: "🔍 Bundle size check"
        working-directory: web
        run: |
          # Check main bundle doesn't exceed 500KB
          MAIN_JS=$(find dist/assets -name "index-*.js" | head -1)
          if [[ -f "$MAIN_JS" ]]; then
            SIZE=$(wc -c < "$MAIN_JS")
            MAX=$(( 500 * 1024 ))
            if [[ $SIZE -gt $MAX ]]; then
              echo "  ⚠️  Main bundle too large: $(numfmt --to=iec "$SIZE") > 500KB"
            else
              echo "  ✅ Main bundle OK: $(numfmt --to=iec "$SIZE")"
            fi
          fi

      - name: "📤 Upload web build"
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.run_id }}
          path: web/dist/
          retention-days: 14

  # ── 06-B: Build Docker image ─────────────────────────────────────────────────
  build-docker:
    name: "🐳 Build Docker Image"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [test-unit-shell, test-theme-engine, security-deps]
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      github.event.inputs.pipeline_mode == 'full'

    permissions:
      contents: read
      packages: write

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐳 Setup Docker Buildx"
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: "🔑 Login to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🏷️ Generate Docker metadata"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=omega,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=ASH Dotfiles
            org.opencontainers.image.description=Ultra Premium Hyprland Dotfiles
            org.opencontainers.image.version=${{ env.ASH_VERSION }}
            org.opencontainers.image.vendor=ASH Dotfiles Team
            maintainer=@${{ github.repository_owner }}

      - name: "🏗️ Build & push Docker image"
        uses: docker/build-push-action@v5
        id: docker-build
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-build
          cache-to: type=gha,mode=max,scope=docker-build
          build-args: |
            ASH_VERSION=${{ env.ASH_VERSION }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          provenance: true
          sbom: true

      - name: "🔍 Scan Docker image"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: sarif
          output: docker-trivy.sarif
          exit-code: "0"
          severity: CRITICAL,HIGH

      - name: "📊 Docker image size report"
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ github.sha }}"
          echo "  🐳 Image: $IMAGE"
          echo "  📦 Digest: ${{ steps.docker-build.outputs.digest }}"


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  STAGE 07 ── 🚀 DEPLOY
# ╚══════════════════════════════════════════════════════════════════════════════

  # ── 07-A: Deploy docs site ───────────────────────────────────────────────────
  deploy-docs:
    name: "📖 Deploy Docs → GitHub Pages"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - test-unit-shell
      - screenshots-aggregate
      - build-web
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python (MkDocs)"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install MkDocs"
        run: |
          pip install \
            mkdocs \
            mkdocs-material \
            mkdocs-minify-plugin \
            mkdocs-git-revision-date-localized-plugin \
            mkdocs-glightbox \
            pymdown-extensions \
            --quiet

      - name: "📥 Download screenshot assets"
        uses: actions/download-artifact@v4
        with:
          name: screenshots-all-${{ github.run_id }}
          path: docs/assets/screenshots/

      - name: "🏗️ Build MkDocs site"
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/ash-dotfiles
        run: |
          mkdocs build \
            --config-file docs/mkdocs.yml \
            --strict \
            --verbose \
            2>&1 | tail -20

          echo "  ✅ Docs built"
          echo "  📦 Size: $(du -sh site/ | cut -f1)"

      - name: "⚙️ Setup Pages"
        uses: actions/configure-pages@v4

      - name: "📤 Upload pages artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: "🚀 Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4

      - name: "✅ Docs deployed"
        run: |
          echo "  🌐 Docs URL: ${{ steps.deployment.outputs.page_url }}"

  # ── 07-B: Deploy preview environment ────────────────────────────────────────
  deploy-preview:
    name: "🔮 Deploy Preview Environment"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-web]
    if: |
      github.event_name == 'pull_request' &&
      (
        github.event.inputs.deploy_preview == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'preview')
      )

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: "📥 Download web build"
        uses: actions/download-artifact@v4
        with:
          name: web-build-${{ github.run_id }}
          path: web-dist/

      - name: "🚀 Deploy to Cloudflare Pages"
        id: cf-deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ash-dotfiles-preview
          directory: web-dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: pr-${{ github.event.number }}

      - name: "💬 Comment preview URL on PR"
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-deploy
          message: |
            ## 🔮 Preview Deployment

            | | |
            |---|---|
            | 🌐 **URL** | ${{ steps.cf-deploy.outputs.url }} |
            | 📦 **Commit** | `${{ github.sha }}` |
            | ⏱️ **Deployed** | $(date -u +"%Y-%m-%d %H:%M UTC") |
            | 🎨 **Themes** | ${{ env.ASH_VERSION }} |

            > Preview expires when PR is closed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  STAGE 08 ── 📢 NOTIFICATIONS & REPORTING
# ╚══════════════════════════════════════════════════════════════════════════════

  # ── 08-A: Pipeline summary ───────────────────────────────────────────────────
  pipeline-summary:
    name: "📊 Pipeline Summary"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - detect-changes
      - security-secrets
      - security-deps
      - lint-shell
      - lint-lua
      - lint-configs
      - lint-typescript
      - lint-python
      - screenshots-aggregate
      - test-unit-shell
      - test-theme-engine
      - test-plugins
    if: always()

    steps:
      - name: "📊 Collect job results"
        id: results
        run: |
          set -euo pipefail

          # Map job results to emoji
          result_emoji() {
            case "$1" in
              success)  echo "✅" ;;
              failure)  echo "❌" ;;
              cancelled)echo "⏹️" ;;
              skipped)  echo "⏭️" ;;
              *)        echo "❓" ;;
            esac
          }

          SEC_SECRETS=$(result_emoji "${{ needs.security-secrets.result }}")
          SEC_DEPS=$(result_emoji "${{ needs.security-deps.result }}")
          LINT_SH=$(result_emoji "${{ needs.lint-shell.result }}")
          LINT_LUA=$(result_emoji "${{ needs.lint-lua.result }}")
          LINT_CFG=$(result_emoji "${{ needs.lint-configs.result }}")
          LINT_TS=$(result_emoji "${{ needs.lint-typescript.result }}")
          LINT_PY=$(result_emoji "${{ needs.lint-python.result }}")
          SHOTS=$(result_emoji "${{ needs.screenshots-aggregate.result }}")
          TEST_SH=$(result_emoji "${{ needs.test-unit-shell.result }}")
          TEST_THEME=$(result_emoji "${{ needs.test-theme-engine.result }}")
          TEST_PLUGIN=$(result_emoji "${{ needs.test-plugins.result }}")

          # Overall status
          OVERALL="✅ PASSED"
          for result in \
            "${{ needs.security-secrets.result }}" \
            "${{ needs.security-deps.result }}" \
            "${{ needs.lint-shell.result }}" \
            "${{ needs.lint-configs.result }}" \
            "${{ needs.test-unit-shell.result }}"; do
            if [[ "$result" == "failure" ]]; then
              OVERALL="❌ FAILED"
              break
            fi
          done

          {
            echo "overall=$OVERALL"
            echo "sec_secrets=$SEC_SECRETS"
            echo "sec_deps=$SEC_DEPS"
            echo "lint_sh=$LINT_SH"
            echo "lint_lua=$LINT_LUA"
            echo "lint_cfg=$LINT_CFG"
            echo "lint_ts=$LINT_TS"
            echo "lint_py=$LINT_PY"
            echo "screenshots=$SHOTS"
            echo "test_shell=$TEST_SH"
            echo "test_theme=$TEST_THEME"
            echo "test_plugin=$TEST_PLUGIN"
          } >> "$GITHUB_OUTPUT"

      - name: "📊 Write job summary"
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << SUMMARY
          # 🚀 ASH Dotfiles — Pipeline Summary

          > **${{ steps.results.outputs.overall }}**
          > Commit: \`${{ github.sha }}\`
          > Branch: \`${{ github.ref_name }}\`
          > Triggered by: \`${{ github.event_name }}\`
          > Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ---

          ## 🔒 Security

          | Check | Status |
          |-------|--------|
          | 🔍 Secret Scanning | ${{ steps.results.outputs.sec_secrets }} |
          | 🛡️ Dependency Audit | ${{ steps.results.outputs.sec_deps }} |

          ## ✅ Linting

          | Linter | Status |
          |--------|--------|
          | 🐚 ShellCheck | ${{ steps.results.outputs.lint_sh }} |
          | 🌙 Luacheck | ${{ steps.results.outputs.lint_lua }} |
          | 📋 JSON/YAML/TOML | ${{ steps.results.outputs.lint_cfg }} |
          | 💙 TypeScript/ESLint | ${{ steps.results.outputs.lint_ts }} |
          | 🐍 Python/Ruff | ${{ steps.results.outputs.lint_py }} |

          ## 🖼️ Screenshots

          | Stage | Status |
          |-------|--------|
          | 📸 Generation Matrix | ${{ steps.results.outputs.screenshots }} |

          ## 🧪 Tests

          | Suite | Status |
          |-------|--------|
          | 🧪 Unit Tests (Shell) | ${{ steps.results.outputs.test_shell }} |
          | 🎨 Theme Engine | ${{ steps.results.outputs.test_theme }} |
          | 🔌 Plugin System | ${{ steps.results.outputs.test_plugin }} |

          ---

          ## 📦 Artifacts

          - 🖼️ **Screenshots**: WebP + AVIF + Thumbnails for all themes
          - 📊 **Reports**: Lint results, test coverage, benchmark data
          - 🌐 **Web Build**: Production dashboard bundle

          ---

          *ASH Dotfiles v${{ env.ASH_VERSION }} OMEGA • Pipeline v${{ env.ASH_PIPELINE_VERSION }}*
          SUMMARY

  # ── 08-B: Discord notification ───────────────────────────────────────────────
  notify-discord:
    name: "💬 Discord Notification"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [pipeline-summary]
    if: |
      always() &&
      (
        github.ref == 'refs/heads/main' ||
        needs.pipeline-summary.result == 'failure'
      )

    steps:
      - name: "💬 Send Discord embed"
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [[ -z "$WEBHOOK" ]] && { echo "  ⚠️  No Discord webhook"; exit 0; }

          # Determine color (green=success, red=failure)
          COLOR=3066993    # green
          STATUS_ICON="✅"
          STATUS_TEXT="Pipeline Passed"

          if [[ "${{ needs.pipeline-summary.result }}" == "failure" ]]; then
            COLOR=15158332 # red
            STATUS_ICON="❌"
            STATUS_TEXT="Pipeline Failed"
          fi

          PAYLOAD=$(cat << JSON
          {
            "embeds": [{
              "title": "${STATUS_ICON} ASH Dotfiles CI — ${STATUS_TEXT}",
              "description": "Pipeline completed for branch \`${{ github.ref_name }}\`",
              "color": ${COLOR},
              "fields": [
                {
                  "name": "📦 Version",
                  "value": "${{ env.ASH_VERSION }}",
                  "inline": true
                },
                {
                  "name": "🌿 Branch",
                  "value": "\`${{ github.ref_name }}\`",
                  "inline": true
                },
                {
                  "name": "🔗 Commit",
                  "value": "[\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})",
                  "inline": true
                },
                {
                  "name": "👤 Author",
                  "value": "${{ github.actor }}",
                  "inline": true
                },
                {
                  "name": "🔗 Run",
                  "value": "[View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                  "inline": true
                }
              ],
              "footer": {
                "text": "ASH Dotfiles v${{ env.ASH_VERSION }} • CI Pipeline",
                "icon_url": "https://raw.githubusercontent.com/${{ github.repository }}/main/assets/brand/logos/ash-logo-256.png"
              },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          JSON
          )

          curl -fsSL \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK"

          echo "  ✅ Discord notification sent"


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  STAGE 09 ── 🔁 AUTOMATION & MAINTENANCE
# ╚══════════════════════════════════════════════════════════════════════════════

  # ── 09-A: Auto-update manifest on main ──────────────────────────────────────
  update-manifest:
    name: "📋 Update Asset Manifest"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [screenshots-aggregate, pipeline-summary]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.screenshots-aggregate.result == 'success'

    permissions:
      contents: write

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "📥 Download manifest"
        uses: actions/download-artifact@v4
        with:
          name: screenshots-all-${{ github.run_id }}
          path: assets/screenshots/desktop/

      - name: "📝 Commit updated manifest"
        run: |
          git config user.name  "ASH Bot 🤖"
          git config user.email "ash-bot@users.noreply.github.com"

          # Only commit if manifest changed
          if git diff --quiet assets/screenshots/desktop/manifest.json; then
            echo "  ℹ️  Manifest unchanged — skipping commit"
            exit 0
          fi

          git add assets/screenshots/desktop/manifest.json
          git commit \
            --message "🤖 chore(assets): update screenshot manifest [skip ci]

          Pipeline: ${{ github.run_id }}
          Commit:   ${{ github.sha }}
          Themes:   $(jq '.total_themes' assets/screenshots/desktop/manifest.json) themes updated

          Generated by ASH CI Pipeline v${{ env.ASH_PIPELINE_VERSION }}" \
            --author "ASH Bot <ash-bot@users.noreply.github.com>"

          git push origin main
          echo "  ✅ Manifest committed and pushed"

  # ── 09-B: Cleanup old artifacts ─────────────────────────────────────────────
  cleanup-artifacts:
    name: "🧹 Cleanup Old Artifacts"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [pipeline-summary]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    permissions:
      actions: write

    steps:
      - name: "🧹 Delete old run artifacts"
        uses: actions/github-script@v7
        with:
          script: |
            const KEEP_RUNS = 10;
            const ARTIFACT_PATTERNS = [
              'screenshot-',
              'lint-',
              'unit-test-',
              'benchmark-',
            ];

            // Get all artifacts
            const { data: { artifacts } } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            // Group by pattern prefix
            const grouped = {};
            for (const artifact of artifacts) {
              for (const pattern of ARTIFACT_PATTERNS) {
                if (artifact.name.startsWith(pattern)) {
                  grouped[pattern] = grouped[pattern] || [];
                  grouped[pattern].push(artifact);
                  break;
                }
              }
            }

            // Delete old artifacts beyond retention limit
            let deleted = 0;
            for (const [pattern, arts] of Object.entries(grouped)) {
              const sorted = arts.sort((a, b) =>
                new Date(b.created_at) - new Date(a.created_at)
              );

              for (const artifact of sorted.slice(KEEP_RUNS)) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                deleted++;
              }
            }

            console.log(`  🧹 Deleted ${deleted} old artifacts`)