              "Waybar":      ("generate_waybar",   True),
              "Rofi":        ("generate_rofi",     True),
              "Fish Shell":  ("generate_fish",     True),
              "Dunst":       ("generate_dunst",    True),
              "SwayNC":      ("generate_swaync",   True),
              "Hyprlock":    ("generate_hyprlock", True),
              "GTK 3/4":     ("generate_gtk",      True),
              "VSCode":      ("generate_vscode",   True),
              "Firefox":     ("generate_firefox",  True),
              "SDDM":        ("generate_sddm",     False),  # Optional
          }

          table = Table(title="🎨 App Theme Support",
                        show_header=True, header_style="bold blue")
          table.add_column("Application", style="cyan")
          table.add_column("Generator Function")
          table.add_column("Required", justify="center")
          table.add_column("Status", justify="center")

          missing_required = 0
          for app, (func, required) in APPS.items():
              has_func = f"{func}()" in content
              req_str = "✅ Yes" if required else "⚠️ Optional"
              status = "✅ Present" if has_func else ("❌ MISSING" if required else "⚠️ Optional")

              if required and not has_func:
                  missing_required += 1
                  table.add_row(app, func, req_str, status, style="red")
              elif has_func:
                  table.add_row(app, func, req_str, status, style="green")
              else:
                  table.add_row(app, func, req_str, status, style="yellow")

          console.print(table)

          # Check specific app color variables used
          console.print("\n[bold]Checking color variable usage...[/bold]")
          VARS = ["BASE", "PRIMARY", "SECONDARY", "TERTIARY", "TEXT",
                  "SUCCESS", "WARNING", "ERR", "INFO", "SURFACE0"]

          for var in VARS:
              if f"${{{var}}}" in content or f"${var}" in content:
                  console.print(f"  [green]✓[/green] Variable: {var}")
              else:
                  console.print(f"  [red]✗[/red] Variable missing: {var}")
                  missing_required += 1

          if missing_required > 0:
              console.print(f"\n[red bold]❌ {missing_required} required item(s) missing[/red bold]")
              sys.exit(1)

          console.print(f"\n[green bold]✅ All required app generators present[/green bold]")
          PYEOF

      # ── File Structure ─────────────────────────────────────────────────────
      - name: ✅ File structure validation
        if: matrix.type == 'file-structure'
        run: |
          python3 - << 'PYEOF'
          import sys
          from pathlib import Path
          from rich.console import Console
          from rich.tree import Tree

          console = Console()

          REQUIRED_DIRS = [
              "config/hypr/core",
              "config/hypr/modules",
              "config/hypr/rules",
              "config/hypr/scripts/theme",
              "config/hypr/scripts/media",
              "config/hypr/scripts/system",
              "config/hypr/scripts/hardware",
              "config/hypr/scripts/network",
              "config/hypr/scripts/utils",
              "config/hypr/scripts/analytics",
              "config/hypr/assets/shaders",
              "config/hypr/themes",
              "config/hypr/UserOverrides",
              "config/waybar/configs",
              "config/waybar/styles",
              "config/waybar/scripts/hardware",
              "config/waybar/scripts/system",
              "config/waybar/scripts/media",
              "config/waybar/scripts/utils",
              "config/rofi/themes",
              "config/rofi/scripts",
              "config/fish/conf.d",
              "config/fish/functions",
              "config/fish/completions",
              "config/nvim/lua/core",
              "config/nvim/lua/plugins",
              "config/nvim/lua/lsp",
              "config/nvim/lua/themes",
              "config/nvim/snippets",
              "config/ags/modules",
              "config/ags/services",
              "config/eww/dashboard",
              "config/btop/themes",
              "bin",
              "docs",
              "scripts/core",
              "scripts/health",
              "scripts/setup",
          ]

          console.print("\n[bold cyan]📁 Checking directory structure...[/bold cyan]\n")

          missing = 0
          for dir_path in REQUIRED_DIRS:
              p = Path(dir_path)
              if p.is_dir():
                  count = len(list(p.iterdir()))
                  console.print(f"  [green]✓[/green] {dir_path}/ ({count} files)")
              else:
                  console.print(f"  [red]✗[/red] {dir_path}/ [red bold]← MISSING[/red bold]")
                  missing += 1

          # Count stats
          total_sh = len(list(Path('.').rglob('*.sh')))
          total_lua = len(list(Path('.').rglob('*.lua')))
          total_conf = len(list(Path('.').rglob('*.conf')))
          total_files = len(list(Path('config').rglob('*')))

          console.print(f"\n[bold]📊 File Statistics:[/bold]")
          console.print(f"  Shell scripts: {total_sh}")
          console.print(f"  Lua files:     {total_lua}")
          console.print(f"  Config files:  {total_conf}")
