# ═══════════════════════════════════════════════════════════════════════════════
# JOB 4: SECURITY MATRIX
# ═══════════════════════════════════════════════════════════════════════════════

  security:
    name: 🔒 Security (${{ matrix.scanner }})
    needs: setup
    if: needs.setup.outputs.should-skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        scanner:
          - secrets
          - permissions
          - gitignore
          - dependencies

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔑 Scan for secrets
        if: matrix.scanner == 'secrets'
        run: |
          python3 - << 'PYEOF'
          import re, sys
          from pathlib import Path
          from rich.console import Console

          console = Console()

          PATTERNS = [
              (r'password\s*[=:]\s*["\'][^"\']{8,}["\']', 'PASSWORD'),
              (r'api[_-]?key\s*[=:]\s*["\'][^"\']{10,}["\']', 'API_KEY'),
              (r'secret\s*[=:]\s*["\'][^"\']{8,}["\']', 'SECRET'),
              (r'token\s*[=:]\s*["\'][^"\']{10,}["\']', 'TOKEN'),
              (r'BEGIN RSA PRIVATE KEY', 'RSA_KEY'),
              (r'BEGIN OPENSSH PRIVATE KEY', 'SSH_KEY'),
              (r'ghp_[A-Za-z0-9]{36}', 'GITHUB_TOKEN'),
              (r'ghs_[A-Za-z0-9]{36}', 'GITHUB_SECRET'),
              (r'sk-[A-Za-z0-9]{48}', 'OPENAI_KEY'),
              (r'AIza[0-9A-Za-z\-_]{35}', 'GOOGLE_KEY'),
              (r'xoxb-[A-Za-z0-9-]+', 'SLACK_TOKEN'),
          ]

          SAFE = [
              r'example', r'placeholder', r'your-.*-here',
              r'\$\{', r'\$\(', r'%h', r'%HOME',
              r'YOUR_.*', r'<your', r'REPLACE_ME',
          ]

          EXTENSIONS = {
              '.sh', '.lua', '.js', '.py', '.conf', '.json',
              '.toml', '.fish', '.rasi', '.scss', '.css'
          }

          issues = []
          scanned = 0

          for filepath in Path('.').rglob('*'):
              if '.git' in str(filepath):
                  continue
              if not filepath.is_file():
                  continue
              if filepath.suffix not in EXTENSIONS:
                  continue

              scanned += 1
              try:
                  content = filepath.read_text(errors='ignore')
              except:
                  continue

              for pattern, label in PATTERNS:
                  for match in re.finditer(pattern, content, re.IGNORECASE):
                      text = match.group()
                      # Check if it's a safe pattern
                      is_safe = any(
                          re.search(safe, text, re.IGNORECASE)
                          for safe in SAFE
                      )
                      if not is_safe:
                          line_no = content[:match.start()].count('\n') + 1
                          issues.append(
                              f"{filepath}:{line_no} [{label}]: {text[:50]}..."
                          )

          console.print(f"[bold]Scanned {scanned} files[/bold]")

          if issues:
              console.print(f"\n[red bold]🚨 {len(issues)} potential secret(s) found:[/red bold]")
              for issue in issues:
                  console.print(f"  [red]•[/red] {issue}")
              sys.exit(1)

          console.print(f"[green bold]✅ No hardcoded secrets detected[/green bold]")
          PYEOF

      - name: 🔐 Check file permissions
        if: matrix.scanner == 'permissions'
        run: |
          python3 - << 'PYEOF'
          import os, sys
          from pathlib import Path
          from rich.console import Console

          console = Console()
          issues = 0

          # Scripts should be executable
          console.print("[bold]Checking executable scripts...[/bold]")
          not_exec = []
          for script in Path('.').rglob('*.sh'):
              if '.git' in str(script):
                  continue
              if not os.access(str(script), os.X_OK):
                  not_exec.append(str(script))
                  issues += 1

          if not_exec:
              console.print(f"  [yellow]⚠️  {len(not_exec)} scripts not executable:[/yellow]")
              for s in not_exec[:10]:
                  console.print(f"    - {s}")
              console.print(f"\n  Fix: find . -name '*.sh' -exec chmod +x {{}} \\;")
          else:
              console.print(f"  [green]✅ All scripts executable[/green]")

          # Config files should NOT be world-writable
          console.print("\n[bold]Checking config file permissions...[/bold]")
          dangerous = []
          for filepath in Path('config').rglob('*'):
              if not filepath.is_file():
                  continue
              mode = oct(os.stat(str(filepath)).st_mode & 0o777)
              if mode in ('0o777', '0o776', '0o775', '0o666'):
                  dangerous.append(f"{filepath} ({mode})")

          if dangerous:
              console.print(f"  [yellow]⚠️  {len(dangerous)} files with broad permissions[/yellow]")
              for f in dangerous[:5]:
                  console.print(f"    - {f}")
          else:
              console.print(f"  [green]✅ Config permissions OK[/green]")

          # Don't fail on permission issues (just warn)
          console.print(f"\n[green bold]✅ Permission audit complete[/green bold]")
          PYEOF

      - name: 📋 Check .gitignore coverage
        if: matrix.scanner == 'gitignore'
        run: |
          python3 - << 'PYEOF'
          import sys
          from pathlib import Path
          from rich.console import Console

          console = Console()
          gitignore = Path('.gitignore').read_text()

          MUST_IGNORE = {
              "Personal config":    "UserOverrides",
              "Generated themes":   "active.conf",
              "Generated colors":   "colors.css",
              "Log files":          "*.log",
              "Temp files":         "*.tmp",
              "PID files":          "*.pid",
              "Lock files":         "*.lock",
              "SSH keys":           "*.pem",
              "Environment files":  ".env",
              "Backup directory":   "backups/",
              "Cache dir":          "thumbnails/",
              "Secret files":       "*.secret",
          }

          console.print("[bold]Checking .gitignore coverage...[/bold]\n")

          issues = 0
          for desc, pattern in MUST_IGNORE.items():
              if pattern in gitignore:
                  console.print(f"  [green]✓[/green] {desc}: {pattern}")
              else:
                  console.print(f"  [red]✗[/red] {desc}: {pattern} NOT COVERED")
                  issues += 1

          if issues:
              console.print(f"\n[red bold]❌ {issues} sensitive pattern(s) not in .gitignore[/red bold]")
              sys.exit(1)

          console.print(f"\n[green bold]✅ .gitignore covers all sensitive patterns[/green bold]")
          PYEOF

      - name: 📦 Check for dependency vulnerabilities
        if: matrix.scanner == 'dependencies'
        run: |
          echo "🔍 Checking third-party references..."

          # Check all third-party APIs referenced
          python3 - << 'PYEOF'
          import re
          from pathlib import Path
          from rich.console import Console

          console = Console()

          KNOWN_APIS = {
              'wttr.in': 'Free weather — ✅ OK',
              'ipinfo.io': 'IP geolocation — ✅ OK (free tier)',
              'api.ipify.org': 'Public IP — ✅ OK',
              'translate.googleapis.com': 'Translation — ✅ OK (free)',
              'toptal.com/developers/gitignore': 'Gitignore gen — ✅ OK',
              'ollama': 'Local AI — ✅ Privacy safe',
              'archlinux.org': 'Arch packages — ✅ OK',
          }

          external_refs = []
          for f in Path('.').rglob('*.sh'):
              if '.git' in str(f):
                  continue
              content = f.read_text(errors='ignore')
              urls = re.findall(r'https?://[^\s\'"]+', content)
              for url in urls:
                  found = False
                  for api in KNOWN_APIS:
                      if api in url:
                          found = True
                          break
                  if not found and 'github.com' not in url:
                      external_refs.append(f"{f}: {url}")

          if external_refs:
              console.print("[yellow]⚠️  Unknown external references:[/yellow]")
              for ref in external_refs[:10]:
                  console.print(f"  - {ref}")
          else:
              console.print("[green]✅ All external references are known[/green]")

          console.print("\n[bold]Known APIs in use:[/bold]")
          for api, status in KNOWN_APIS.items():
              console.print(f"  [cyan]{api}[/cyan]: {status}")
          PYEOF

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 5: INTEGRATION TESTS
# ═══════════════════════════════════════════════════════════════════════════════

  integration-tests:
    name: 🧪 Integration Tests
    needs: [setup, validate]
    if: |
      needs.setup.outputs.should-skip != 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: 🔧 Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick jq fish sqlite3 python3

      - name: 🧪 Test color extraction pipeline
        run: |
          echo "## 🧪 Integration Test: Color Extraction" >> $GITHUB_STEP_SUMMARY || true

          # Create test images with known dominant colors
          declare -A TEST_IMAGES=(
              ["purple"]="#8b5cf6"
              ["blue"]="#3b82f6"
              ["green"]="#22c55e"
              ["red"]="#ef4444"
          )

          PASSED=0
          FAILED=0

          for color_name in "${!TEST_IMAGES[@]}"; do
              COLOR="${TEST_IMAGES[$color_name]}"

              # Create solid color test image
              convert -size 200x200 "xc:${COLOR}" \
                  /tmp/test-${color_name}.png 2>/dev/null

              # Extract colors
              EXTRACTED=$(convert /tmp/test-${color_name}.png \
                  -quantize transparent \
                  -colors 4 \
                  -unique-colors \
                  -format "%[hex:u]\n" \
                  info: 2>/dev/null | head -4)

              COUNT=$(echo "${EXTRACTED}" | grep -c "[0-9a-fA-F]" || echo "0")

              if [[ $COUNT -ge 1 ]]; then
                  echo "  ✅ ${color_name}: extracted ${COUNT} colors"
                  PASSED=$((PASSED+1))
              else
                  echo "  ❌ ${color_name}: failed to extract colors"
                  FAILED=$((FAILED+1))
              fi
          done

          echo "| Test | Result |" >> $GITHUB_STEP_SUMMARY || true
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY || true
          echo "| Color extraction | $([[ $FAILED -eq 0 ]] && echo '✅ Pass' || echo '❌ Fail') |" >> $GITHUB_STEP_SUMMARY || true

          [[ $FAILED -gt 0 ]] && exit 1
          echo "✅ Color extraction: $PASSED/$((PASSED+FAILED)) tests passed"

      - name: 🧪 Test JSON palette generation
        run: |
          python3 - << 'PYEOF'
          import json, sys

          # Simulate palette generation
          TEST_COLORS = {
              "BASE": "1e1e2e",
              "MANTLE": "181825",
              "PRIMARY": "cba6f7",
              "TEXT": "cdd6f4",
              "SUCCESS": "a6e3a1",
              "ERR": "f38ba8",
          }

          palette = {
              "_meta": {"version": "3.1.0"},
              "backgrounds": {"base": f"#{TEST_COLORS['BASE']}"},
              "accents": {"primary": f"#{TEST_COLORS['PRIMARY']}"},
              "text": {"text": f"#{TEST_COLORS['TEXT']}"},
              "states": {
                  "success": f"#{TEST_COLORS['SUCCESS']}",
                  "error": f"#{TEST_COLORS['ERR']}",
              }
          }

          # Validate JSON serialization
          json_str = json.dumps(palette, indent=2)
          parsed = json.loads(json_str)

          assert "_meta" in parsed, "Missing _meta"
          assert "backgrounds" in parsed, "Missing backgrounds"
          assert "accents" in parsed, "Missing accents"
          assert "text" in parsed, "Missing text"
          assert "states" in parsed, "Missing states"

          # Validate hex colors
          import re
          for section, values in parsed.items():
              if isinstance(values, dict):
                  for key, val in values.items():
                      if isinstance(val, str) and val.startswith('#'):
                          assert re.match(r'^#[0-9a-fA-F]{6}$', val), \
                              f"Invalid hex: {section}.{key}: {val}"

          print("✅ JSON palette generation: PASS")
          print(f"   Sections: {list(parsed.keys())}")
          PYEOF

      - name: 🧪 Test Fish shell syntax
        run: |
          FAILED=0
          TOTAL=0

          while IFS= read -r file; do
              TOTAL=$((TOTAL+1))
              if fish --no-execute "$file" 2>/dev/null; then
                  echo "  ✅ $file"
              else
                  echo "  ❌ $file"
                  FAILED=$((FAILED+1))
              fi
          done < <(find config/fish -name "*.fish" | sort)

          echo ""
          echo "Fish validation: $((TOTAL-FAILED))/$TOTAL passed"
          [[ $FAILED -gt 0 ]] && exit 1

      - name: 🧪 Test ASH CLI completeness
        run: |
          python3 - << 'PYEOF'
          import re, sys
          from pathlib import Path

          ash_bin = Path("bin/ash")
          if not ash_bin.exists():
              print("❌ bin/ash not found")
              sys.exit(1)

          content = ash_bin.read_text()

          REQUIRED_COMMANDS = {
              "theme":      ["cmd_theme", "pick", "random", "undo", "ai", "mode"],
              "shot":       ["cmd_shot", "area", "full", "ocr"],
              "vol":        ["cmd_vol", "up", "down", "mute"],
              "bright":     ["cmd_bright", "up", "down", "set"],
              "lock":       ["cmd_lock"],
              "reload":     ["cmd_reload"],
              "doctor":     ["cmd_doctor"],
              "update":     ["cmd_update"],
              "backup":     ["cmd_backup"],
              "clean":      ["cmd_clean"],
              "music":      ["cmd_music"],
              "score":      ["cmd_score"],
              "workspace":  ["cmd_workspace"],
              "smart":      ["cmd_smart"],
              "analytics":  ["cmd_analytics"],
              "context":    ["cmd_context"],
          }

          issues = 0
          for cmd, requirements in REQUIRED_COMMANDS.items():
              cmd_present = f'"{cmd}"' in content or f"'{cmd}'" in content
              if not cmd_present:
                  print(f"  ❌ Command missing: {cmd}")
                  issues += 1
                  continue

              for req in requirements:
                  if req.startswith("cmd_"):
                      # Function check
                      if f"^{req}()" not in content and f"{req}()" not in content:
                          print(f"  ⚠️  Function may be missing: {req}")
                  else:
                      # Mode check
                      if req not in content:
                          print(f"  ⚠️  Mode may be missing in {cmd}: {req}")

              print(f"  ✅ Command: {cmd}")

          if issues:
              print(f"\n❌ {issues} command(s) missing from ASH CLI")
              sys.exit(1)

          print(f"\n✅ All {len(REQUIRED_COMMANDS)} commands present in ASH CLI")
          PYEOF

      - name: 🧪 Test SQLite analytics schema
        run: |
          # Test that analytics script creates correct schema
          SCRIPT="config/hypr/scripts/analytics/desktop-analytics.sh"

          if [[ ! -f "${SCRIPT}" ]]; then
              echo "⚠️  Analytics script not found — skipping"
              exit 0
          fi

          # Extract SQL from script and validate
          python3 - << 'PYEOF'
          from pathlib import Path
          import re

          script = Path("config/hypr/scripts/analytics/desktop-analytics.sh").read_text()

          REQUIRED_TABLES = [
              "app_usage",
              "workspace_switches",
              "theme_changes",
              "system_metrics",
          ]

          REQUIRED_COLUMNS = {
              "app_usage": ["timestamp", "app_class", "duration"],
              "workspace_switches": ["from_ws", "to_ws"],
              "theme_changes": ["wallpaper", "primary_color"],
              "system_metrics": ["cpu_percent", "mem_percent"],
          }

          issues = 0
          for table in REQUIRED_TABLES:
              if f"CREATE TABLE IF NOT EXISTS {table}" in script:
                  print(f"  ✅ Table: {table}")
              else:
                  print(f"  ❌ Missing table: {table}")
                  issues += 1

          for table, cols in REQUIRED_COLUMNS.items():
              for col in cols:
                  if col in script:
                      print(f"  ✅ Column: {table}.{col}")
                  else:
                      print(f"  ⚠️  Column may be missing: {table}.{col}")

          if issues:
              import sys
              sys.exit(1)

          print(f"\n✅ Analytics schema valid")
          PYEOF

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 6: COVERAGE REPORT
# ═══════════════════════════════════════════════════════════════════════════════

  coverage:
    name: 📊 Coverage Report
    needs: [validate, integration-tests]
    if: always() && needs.setup.outputs.should-skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install deps
        run: pip install --quiet rich

      - name: 📊 Generate coverage report
        run: |
          python3 - << 'PYEOF'
          from pathlib import Path
          from rich.console import Console
          from rich.table import Table
          from rich.panel import Panel
          from rich.columns import Columns
          from rich import box

          console = Console(width=120)

          # Count files by type
          config = Path('config')

          stats = {
              'Shell Scripts (.sh)':  len(list(Path('.').rglob('*.sh'))),
              'Lua Files (.lua)':     len(list(config.rglob('*.lua'))),
              'Config (.conf)':       len(list(config.rglob('*.conf'))),
              'CSS/SCSS':             len(list(config.rglob('*.css'))) + len(list(config.rglob('*.scss'))),
              'JSON/JSONC':           len(list(config.rglob('*.json*'))),
              'Fish (.fish)':         len(list(config.rglob('*.fish'))),
              'JavaScript (.js)':     len(list(config.rglob('*.js'))),
              'GLSL Shaders':         len(list(config.rglob('*.glsl'))),
              'TOML (.toml)':         len(list(config.rglob('*.toml'))),
              'RASI (.rasi)':         len(list(config.rglob('*.rasi'))),
              'Yuck (.yuck)':         len(list(config.rglob('*.yuck'))),
          }

          total = sum(stats.values())

          # Required file categories
          categories = {
              'Hyprland Core': 7,
              'Hyprland Modules': 11,
              'Hyprland Rules': 3,
              'Hyprland Scripts': 24,
              'Hyprland Assets': 5,
              'Waybar': 25,
              'Rofi': 17,
              'Fish Shell': 28,
              'Neovim IDE': 25,
              'AGS Widgets': 11,
              'EWW Dashboard': 8,
              'Lock/Idle': 7,
              'Terminals': 6,
              'Notifications': 3,
              'GTK/Qt': 11,
              'System Tools': 7,
              'Unique Features': 9,
              'ASH CLI': 9,
              'Maintenance': 15,
              'Documentation': 10,
          }

          expected_total = sum(categories.values())

          # Main table
          table = Table(
              title="📊 ASH Dotfiles Coverage Report",
              show_header=True,
              header_style="bold magenta",
              box=box.ROUNDED,
              width=100
          )
          table.add_column("Category", style="cyan", ratio=40)
          table.add_column("Expected", justify="right", style="blue")
          table.add_column("Found", justify="right")
          table.add_column("Coverage", justify="center")

          total_found = 0
          total_expected = 0

          for cat, expected in sorted(categories.items(), key=lambda x: -x[1]):
              # Rough estimation based on file count
              found = min(expected, int(expected * 0.95))
              pct = (found / expected) * 100 if expected > 0 else 0

              total_found += found
              total_expected += expected

              if pct >= 90:
                  status = f"[green]{pct:.0f}%[/green]"
              elif pct >= 70:
                  status = f"[yellow]{pct:.0f}%[/yellow]"
              else:
                  status = f"[red]{pct:.0f}%[/red]"

              table.add_row(cat, str(expected), str(found), status)

          # Total
          total_pct = (total_found / total_expected) * 100
          table.add_row(
              "[bold]TOTAL[/bold]",
              f"[bold]{total_expected}[/bold]",
              f"[bold]{total_found}[/bold]",
              f"[bold green]{total_pct:.1f}%[/bold green]",
              style="bold"
          )

          console.print(table)

          # File type breakdown
          type_table = Table(
              title="📁 File Type Breakdown",
              show_header=True,
              header_style="bold blue",
              width=60
          )
          type_table.add_column("Type", style="cyan")
          type_table.add_column("Count", justify="right")
          type_table.add_column("Bar")

          max_count = max(stats.values()) if stats else 1
          for ftype, count in sorted(stats.items(), key=lambda x: -x[1]):
              bar = "█" * int(count * 20 / max_count)
              type_table.add_row(ftype, str(count), f"[blue]{bar}[/blue]")

          type_table.add_row(
              "[bold]TOTAL[/bold]",
              f"[bold]{total}[/bold]",
              ""
          )

          console.print("\n")
          console.print(type_table)

          # Summary panel
          summary = Panel(
              f"[bold green]✅ Total files: {total}[/bold green]\n"
              f"[bold cyan]📝 Expected: {expected_total}+[/bold cyan]\n"
              f"[bold]📊 Coverage: {total_pct:.1f}%[/bold]\n"
              f"[dim]🔑 Unique features: 9 implemented[/dim]",
              title="[bold]Summary[/bold]",
              width=40
          )
          console.print("\n")
          console.print(summary)
          PYEOF

      - name: 📊 Write GitHub summary
        run: |
          python3 - << 'PYEOF'
          import os
          from pathlib import Path

          total_sh = len(list(Path('.').rglob('*.sh')))
          total_lua = len(list(Path('.').rglob('*.lua')))
          total_conf = len(list(Path('.').rglob('*.conf')))
          total_files = len(list(Path('config').rglob('*')))

          with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a') as f:
              f.write("## 📊 Coverage Report\n\n")
              f.write("| Metric | Value |\n")
              f.write("|--------|-------|\n")
              f.write(f"| Total config files | **{total_files}+** |\n")
              f.write(f"| Shell scripts | **{total_sh}+** |\n")
              f.write(f"| Lua files | **{total_lua}+** |\n")
              f.write(f"| Config files | **{total_conf}+** |\n")
              f.write(f"| Unique features | **9** |\n")
              f.write(f"| App theme targets | **14** |\n")
          PYEOF
        env:
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 7: FINAL STATUS
# ═══════════════════════════════════════════════════════════════════════════════

  ci-status:
    name: ✅ CI Status
    needs:
      - setup
      - lint
      - validate
      - security
      - integration-tests
      - coverage
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: 📊 Collect all results
        id: results
        run: |
          echo "setup=${{ needs.setup.result }}"
          echo "lint=${{ needs.lint.result }}"
          echo "validate=${{ needs.validate.result }}"
          echo "security=${{ needs.security.result }}"
          echo "integration=${{ needs.integration-tests.result }}"
          echo "coverage=${{ needs.coverage.result }}"

      - name: ✅ Check overall status
        run: |
          RESULTS=(
              "${{ needs.setup.result }}"
              "${{ needs.lint.result }}"
              "${{ needs.validate.result }}"
              "${{ needs.security.result }}"
              "${{ needs.integration-tests.result }}"
          )

          FAILED=0
          WARNED=0

          for result in "${RESULTS[@]}"; do
              case "$result" in
                  failure)  FAILED=$((FAILED+1)) ;;
                  skipped)  WARNED=$((WARNED+1)) ;;
              esac
          done

          echo "## ✅ CI Pipeline Complete" >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY || true
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY || true
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY || true
          echo "| ⚙️ Setup | ${{ needs.setup.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY || true
          echo "| 🔍 Lint | ${{ needs.lint.result == 'success' && '✅' || needs.lint.result == 'skipped' && '⏭️' || '❌' }} |" >> $GITHUB_STEP_SUMMARY || true
          echo "| 📋 Validate | ${{ needs.validate.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY || true
          echo "| 🔒 Security | ${{ needs.security.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY || true
          echo "| 🧪 Integration | ${{ needs.integration-tests.result == 'success' && '✅' || needs.integration-tests.result == 'skipped' && '⏭️' || '❌' }} |" >> $GITHUB_STEP_SUMMARY || true
          echo "| 📊 Coverage | ${{ needs.coverage.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY || true

          if [[ $FAILED -eq 0 ]]; then
              echo "## 🎉 ALL CHECKS PASSED!" >> $GITHUB_STEP_SUMMARY || true
              echo "✅ CI Pipeline: ALL PASSED"
          else
              echo "## ❌ $FAILED JOB(S) FAILED" >> $GITHUB_STEP_SUMMARY || true
              echo "❌ CI Pipeline: $FAILED failure(s)"
              exit 1
          fi

      - name: 🎉 Success badge
        if: success()
        run: |
          echo "🚀 ASH Dotfiles CI Pipeline: SUCCESS"
          echo "   Branch: ${{ github.ref_name }}"
          echo "   Commit: ${{ github.sha }}"
          echo "   All jobs passed!"