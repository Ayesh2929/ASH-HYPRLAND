            </text>
          </svg>
          SVGEOF
            echo "  Placeholder SVG created: $SVG"
          fi

          echo "  SVG size: $(wc -c < "$SVG") bytes"

      - name: "🖼️ Render PNG"
        env:
          _THEME: ${{ matrix.theme }}
        run: |
          set -euo pipefail
          SVG="$SVG_DIR/${_THEME}.svg"
          PNG="$SHOTS_DIR/${_THEME}.png"

          if command -v resvg &>/dev/null; then
            resvg \
              --width  "$SHOT_W" \
              --height "$SHOT_H" \
              --dpi 144 \
              "$SVG" "$PNG"
            echo "  Rendered via resvg"
          elif command -v rsvg-convert &>/dev/null; then
            rsvg-convert \
              --width="$SHOT_W" \
              --height="$SHOT_H" \
              --keep-aspect-ratio \
              --format=png \
              --output="$PNG" \
              "$SVG"
            echo "  Rendered via rsvg-convert"
          elif command -v convert &>/dev/null; then
            convert \
              -size "${SHOT_W}x${SHOT_H}" \
              -density 144 \
              "$SVG" "$PNG"
            echo "  Rendered via ImageMagick"
          else
            echo "  ERROR: No SVG renderer available"
            exit 1
          fi

          [[ -f "$PNG" ]] || { echo "  PNG not created"; exit 1; }
          echo "  PNG: $(numfmt --to=iec "$(wc -c < "$PNG")")"

      - name: "🌐 PNG → WebP"
        env:
          _THEME: ${{ matrix.theme }}
        run: |
          set -euo pipefail
          PNG="$SHOTS_DIR/${_THEME}.png"
          WEBP="$SHOTS_DIR/${_THEME}.webp"

          cwebp \
            -q  "$WEBP_QUALITY" \
            -m  "$WEBP_METHOD"  \
            -sharp_yuv \
            -metadata none \
            -hint photo \
            -mt \
            "$PNG" -o "$WEBP"

          WEBP_SIZE=$(wc -c < "$WEBP")
          MAX_BYTES=$(( MAX_WEBP_KB * 1024 ))
          echo "  WebP: $(numfmt --to=iec "$WEBP_SIZE")  limit: ${MAX_WEBP_KB}KB"

          if [[ $WEBP_SIZE -gt $MAX_BYTES ]]; then
            echo "  Re-encoding at q=82..."
            cwebp -q 82 -m 6 -sharp_yuv -metadata none "$PNG" -o "$WEBP"
            echo "  Re-encoded: $(numfmt --to=iec "$(wc -c < "$WEBP")")"
          fi

      - name: "🎯 Thumbnail (640×360)"
        env:
          _THEME: ${{ matrix.theme }}
        run: |
          set -euo pipefail
          PNG="$SHOTS_DIR/${_THEME}.png"
          THUMB_DIR="$SHOTS_DIR/thumbnails"
          mkdir -p "$THUMB_DIR"
          TMP_THUMB="$(mktemp --suffix=.png)"
          trap 'rm -f "$TMP_THUMB"' EXIT

          convert "$PNG" \
            -filter Lanczos \
            -resize "${THUMB_W}x${THUMB_H}^" \
            -gravity center \
            -extent "${THUMB_W}x${THUMB_H}" \
            -strip \
            "$TMP_THUMB"

          cwebp \
            -q 82 -m 5 -sharp_yuv -metadata none \
            "$TMP_THUMB" -o "$THUMB_DIR/${_THEME}-thumb.webp"

          echo "  Thumb: $(numfmt --to=iec "$(wc -c < "$THUMB_DIR/${_THEME}-thumb.webp")")"

      - name: "🌟 Retina thumbnail (@2x)"
        env:
          _THEME: ${{ matrix.theme }}
        run: |
          set -euo pipefail
          THUMB_DIR="$SHOTS_DIR/thumbnails"
          mkdir -p "$THUMB_DIR"
          TMP_THUMB_2X="$(mktemp --suffix=.png)"
          trap 'rm -f "$TMP_THUMB_2X"' EXIT

          convert "$SHOTS_DIR/${_THEME}.png" \
            -filter Lanczos \
            -resize "1280x720^" \
            -gravity center \
            -extent "1280x720" \
            -strip \
            "$TMP_THUMB_2X"

          cwebp -q 85 -m 5 -sharp_yuv -metadata none \
            "$TMP_THUMB_2X" -o "$THUMB_DIR/${_THEME}-thumb@2x.webp"
          echo "  @2x: done"

      - name: "🎯 AVIF variant"
        env:
          _THEME: ${{ matrix.theme }}
        run: |
          AVIF_DIR="$SHOTS_DIR/avif"
          mkdir -p "$AVIF_DIR"

          if command -v avifenc &>/dev/null; then
            avifenc \
              --min "$AVIF_MIN" \
              --max "$AVIF_MAX" \
              --speed 4 \
              --jobs all \
              "$SHOTS_DIR/${_THEME}.png" \
              "$AVIF_DIR/${_THEME}.avif"
            echo "  AVIF: $(numfmt --to=iec "$(wc -c < "$AVIF_DIR/${_THEME}.avif")")"
          else
            echo "  avifenc unavailable — creating skip marker"
            touch "$AVIF_DIR/${_THEME}.skip"
          fi

      - name: "🔍 WCAG contrast"
        env:
          _THEME:  ${{ matrix.theme }}
          _BG:     ${{ steps.pal.outputs.bg }}
          _FG:     ${{ steps.pal.outputs.fg }}
          _ACCENT: ${{ steps.pal.outputs.accent }}
        run: |
          python3 << 'PYEOF'
          import sys

          def hex_to_rgb(h):
              h = h.lstrip('#')
              return tuple(int(h[i:i+2], 16) / 255.0 for i in (0, 2, 4))

          def linearize(c):
              return c / 12.92 if c <= 0.04045 else ((c + 0.055) / 1.055) ** 2.4

          def lum(h):
              r, g, b = (linearize(c) for c in hex_to_rgb(h))
              return 0.2126 * r + 0.7152 * g + 0.0722 * b

          def cr(a, b):
              la, lb = lum(a), lum(b)
              return (max(la,lb)+0.05)/(min(la,lb)+0.05)

          import os
          bg     = os.environ['_BG']
          fg     = os.environ['_FG']
          accent = os.environ['_ACCENT']
          theme  = os.environ['_THEME']

          pairs = [("fg on bg", fg, bg), ("accent on bg", accent, bg)]
          failed = False

          print("  WCAG — " + theme)
          print("  " + "─" * 48)

          for label, c1, c2 in pairs:
              try:
                  ratio = cr(c1, c2)
                  aa  = "PASS AA"   if ratio >= 4.5 else "FAIL AA"
                  aaa = "PASS AAA"  if ratio >= 7.0 else "info AAA"
                  print("  " + label.ljust(16) + str(round(ratio,2)) + ":1  " + aa + "  " + aaa)
                  if ratio < 3.0:
                      failed = True
              except Exception as exc:
                  print("  " + label + ": error — " + str(exc))

          sys.exit(1 if failed else 0)
          PYEOF

      - name: "🔍 WebP integrity"
        env:
          _THEME: ${{ matrix.theme }}
        run: |
          python3 << 'PYEOF'
          import os, sys
          theme = os.environ['_THEME']
          shots = os.environ['SHOTS_DIR']
          path  = shots + '/' + theme + '.webp'
          data  = open(path, 'rb').read()
          assert data[:4]  == b'RIFF', 'Not RIFF: ' + path
          assert data[8:12] == b'WEBP', 'Not WebP: ' + path
          sz = os.path.getsize(path)
          print('  OK: ' + theme + '.webp  (' + str(round(sz/1024,1)) + 'KB)')
          PYEOF

      - name: "📊 Manifest entry"
        env:
          _THEME:   ${{ matrix.theme }}
          _BG:      ${{ steps.pal.outputs.bg }}
          _FG:      ${{ steps.pal.outputs.fg }}
          _ACCENT:  ${{ steps.pal.outputs.accent }}
          _RUN_ID:  ${{ github.run_id }}
          _SHA:     ${{ github.sha }}
          _RUNNER:  ${{ runner.os }}
        run: |
          set -euo pipefail
          WEBP="$SHOTS_DIR/${_THEME}.webp"
          THUMB="$SHOTS_DIR/thumbnails/${_THEME}-thumb.webp"
          AVIF="$SHOTS_DIR/avif/${_THEME}.avif"

          WEBP_SZ=$(wc -c < "$WEBP"  2>/dev/null || echo 0)
          WEBP_H=$(sha256sum "$WEBP"  2>/dev/null | cut -d' ' -f1 || echo "")
          THUMB_SZ=$(wc -c < "$THUMB" 2>/dev/null || echo 0)
          AVIF_SZ=$(wc -c < "$AVIF"   2>/dev/null || echo 0)
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          cat > "$SHOTS_DIR/.manifest-${_THEME}.json" << JSONEOF
          {
            "theme":        "${_THEME}",
            "version":      "${ASH_VERSION}",
            "generated_at": "${TS}",
            "commit":       "${_SHA}",
            "files": {
              "webp":      { "size_bytes": ${WEBP_SZ},  "sha256": "${WEBP_H}",
                             "width": ${SHOT_W}, "height": ${SHOT_H},
                             "quality": ${WEBP_QUALITY} },
              "thumbnail": { "size_bytes": ${THUMB_SZ},
                             "width": ${THUMB_W}, "height": ${THUMB_H} },
              "avif":      { "size_bytes": ${AVIF_SZ} }
            },
            "colors": { "bg": "${_BG}", "fg": "${_FG}", "accent": "${_ACCENT}" },
            "pipeline": { "runner": "${_RUNNER}", "run_id": "${_RUN_ID}" }
          }
          JSONEOF
          echo "  Manifest entry written"

      - name: "📤 Upload"
        uses: actions/upload-artifact@v4
        with:
          name: "shot-${{ matrix.theme }}-${{ github.run_id }}"
          path: |
            ${{ env.SHOTS_DIR }}/${{ matrix.theme }}.webp
            ${{ env.SHOTS_DIR }}/${{ matrix.theme }}.png
            ${{ env.SHOTS_DIR }}/thumbnails/${{ matrix.theme }}-thumb.webp
            ${{ env.SHOTS_DIR }}/thumbnails/${{ matrix.theme }}-thumb@2x.webp
            ${{ env.SHOTS_DIR }}/avif/${{ matrix.theme }}.avif
            ${{ env.SHOTS_DIR }}/.manifest-${{ matrix.theme }}.json
          retention-days: 30
          compression-level: 0

  shots-aggregate:
    name: "📦 Aggregate Screenshots"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [intelligence, shots-generate]
    if: always() && needs.shots-generate.result != 'skipped'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📥 Download all shot artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: "shot-*-${{ github.run_id }}"
          path: "${{ env.SHOTS_DIR }}/"
          merge-multiple: true

      - name: "📊 Build manifest"
        env:
          _SHA:    ${{ github.sha }}
          _BRANCH: ${{ github.ref_name }}
          _RUN:    ${{ github.run_id }}
        run: |
          set -euo pipefail
          OUT="$SHOTS_DIR/manifest.json"
          THEMES_OBJ="{"
          FIRST=true
          TOTAL=0

          for m in "$SHOTS_DIR"/.manifest-*.json; do
            [[ -f "$m" ]] || continue
            T=$(jq -r '.theme' "$m")
            if [[ "$FIRST" == "true" ]]; then FIRST=false; else THEMES_OBJ+=","; fi
            THEMES_OBJ+="\"$T\":"
            THEMES_OBJ+=$(cat "$m")
            (( TOTAL++ )) || true
          done
          THEMES_OBJ+="}"
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          cat > "$OUT" << JSONEOF
          {
            "version":      "${ASH_VERSION}",
            "generated_at": "${TS}",
            "commit":       "${_SHA}",
            "branch":       "${_BRANCH}",
            "pipeline_run": "${_RUN}",
            "total_themes": ${TOTAL},
            "resolution":   { "width": ${SHOT_W}, "height": ${SHOT_H} },
            "themes":       ${THEMES_OBJ}
          }
          JSONEOF
          echo "  Manifest: $TOTAL themes"

      - name: "📊 Size report"
        run: |
          printf '\n  ╔══════════════════════════════════════════════════════╗\n'
          printf   '  ║   📊 Screenshot Asset Report                         ║\n'
          printf   '  ╠══════════════════════════════════════════════════════╣\n'
          printf   '  ║  %-26s  %8s  %8s  %8s  ║\n' "Theme" "WebP" "Thumb" "AVIF"
          printf   '  ╠══════════════════════════════════════════════════════╣\n'

          TW=0; TT=0; TA=0

          for webp in "$SHOTS_DIR"/*.webp; do
            [[ -f "$webp" ]] || continue
            N=$(basename "${webp%.webp}")
            WS=$(wc -c < "$webp" 2>/dev/null || echo 0)
            THUMB="$SHOTS_DIR/thumbnails/${N}-thumb.webp"
            TS=$(wc -c < "$THUMB" 2>/dev/null || echo 0)
            AVIF="$SHOTS_DIR/avif/${N}.avif"
            AS=$(wc -c < "$AVIF" 2>/dev/null || echo 0)
            TW=$(( TW + WS )); TT=$(( TT + TS )); TA=$(( TA + AS ))
            printf '  ║  %-26s  %8s  %8s  %8s  ║\n' "$N" \
              "$(numfmt --to=iec "$WS"  2>/dev/null || echo "${WS}B")" \
              "$(numfmt --to=iec "$TS"  2>/dev/null || echo "${TS}B")" \
              "$(numfmt --to=iec "$AS"  2>/dev/null || echo "skip")"
          done

          printf '  ╠══════════════════════════════════════════════════════╣\n'
          printf '  ║  %-26s  %8s  %8s  %8s  ║\n' "TOTAL" \
            "$(numfmt --to=iec "$TW")" \
            "$(numfmt --to=iec "$TT")" \
            "$(numfmt --to=iec "$TA")"
          printf '  ╚══════════════════════════════════════════════════════╝\n'

      - name: "🔍 Validate all WebP"
        run: |
          FAILED=0
          for webp in "$SHOTS_DIR"/*.webp; do
            [[ -f "$webp" ]] || continue
            N=$(basename "${webp%.webp}")
            python3 -c "
          import sys
          data = open('$webp', 'rb').read()
          assert data[:4]   == b'RIFF', 'bad RIFF'
          assert data[8:12] == b'WEBP', 'bad WEBP'
          print('  OK: $N')
          " || { echo "  FAIL: $N"; (( FAILED++ )) || true; }
          done
          echo "  WebP validation: $FAILED failures"
          [[ $FAILED -gt 0 ]] && exit 1 || true

      - name: "📤 Upload consolidated"
        uses: actions/upload-artifact@v4
        with:
          name: "shots-all-${{ github.run_id }}"
          path: |
            ${{ env.SHOTS_DIR }}/*.webp
            ${{ env.SHOTS_DIR }}/thumbnails/
            ${{ env.SHOTS_DIR }}/avif/
            ${{ env.SHOTS_DIR }}/manifest.json
          retention-days: 90
          compression-level: 0

  shots-regression:
    name: "👁️ Visual Regression"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [shots-aggregate]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📥 New screenshots"
        uses: actions/download-artifact@v4
        with:
          name: "shots-all-${{ github.run_id }}"
          path: shots-new/

      - name: "📥 Baseline screenshots"
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ci.yml
          branch: main
          name: "shots-all-*"
          path: shots-baseline/
          if_no_artifact_found: warn
          search_artifacts: true

      - name: "🔍 SSIM diff"
        id: ssim
        run: |
          pip install Pillow numpy --quiet 2>/dev/null || true

          REPORT="regression-report.md"
          CHANGED=0

          cat > "$REPORT" << 'MDEOF'
          # 👁️ Visual Regression Report

          | Theme | SSIM | Status |
          |-------|------|--------|
          MDEOF

          for new_webp in shots-new/*.webp; do
            [[ -f "$new_webp" ]] || continue
            THEME=$(basename "${new_webp%.webp}")
            BASE="shots-baseline/${THEME}.webp"

            if [[ ! -f "$BASE" ]]; then
              echo "| $THEME | N/A | 🆕 New |" >> "$REPORT"
              continue
            fi

            SSIM=$(python3 << PYEOF 2>/dev/null || echo "N/A"
          try:
              from PIL import Image
              import numpy as np

              def ssim(p1, p2):
                  sz = (256, 144)
                  a = np.array(Image.open(p1).convert('RGB').resize(sz)).astype(float)
                  b = np.array(Image.open(p2).convert('RGB').resize(sz)).astype(float)
                  mu_a, mu_b   = a.mean(), b.mean()
                  sig_a, sig_b = a.std(),  b.std()
                  sig_ab = np.mean((a - mu_a) * (b - mu_b))
                  C1, C2 = (0.01*255)**2, (0.03*255)**2
                  num = (2*mu_a*mu_b+C1) * (2*sig_ab+C2)
                  den = (mu_a**2+mu_b**2+C1) * (sig_a**2+sig_b**2+C2)
                  print(round(num/den, 4))
          except Exception:
              print('N/A')
          PYEOF
              p1='${new_webp}'; p2='${BASE}'
            )

            STATUS="✅ OK"
            if [[ "$SSIM" != "N/A" ]]; then
              SSIM_INT=$(python3 -c "print(int(float('$SSIM') * 100))" 2>/dev/null || echo 0)
              if [[ $SSIM_INT -lt 75 ]]; then
                STATUS="❌ Major change"
                (( CHANGED++ )) || true
              elif [[ $SSIM_INT -lt 92 ]]; then
                STATUS="⚠️ Changed"
                (( CHANGED++ )) || true
              fi
            fi

            echo "| $THEME | $SSIM | $STATUS |" >> "$REPORT"
          done

          echo "" >> "$REPORT"
          echo "**Total changed: $CHANGED**" >> "$REPORT"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

          cat "$REPORT"

      - name: "📝 Ensure regression report"
        if: always()
        run: |
          if [[ ! -s regression-report.md ]]; then
            cat > regression-report.md << 'MDEOF'
          # Visual Regression Report

          Visual regression report was not generated. Check the screenshot comparison logs for details.
          MDEOF
          fi

      - name: "💬 PR comment"
        uses: marocchino/sticky-pull-request-comment@v2
        continue-on-error: true
        if: always()
        with:
          header: visual-regression
          path: regression-report.md
          ignore_empty: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


# ┌─────────────────────────────────────────────────────────────────────────────
# │  STAGE 04 — 🧪 TESTS
# └─────────────────────────────────────────────────────────────────────────────

  test-shell:
    name: "🧪 Shell Unit Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint-shell, lint-configs]

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "💾 Cache BATS helpers"
        id: cache-bats
        uses: actions/cache@v4
        with:
          path: |
            tests/helpers/bats-support
            tests/helpers/bats-assert
          key: bats-helpers-v1

      - name: "⚙️ Install bats"
        run: |
          sudo apt-get install -y bats jq --no-install-recommends

          retry() {
            local n=1
            local max=5
            local delay=3
            while true; do
              "$@" && break || {
                if [[ $n -lt $max ]]; then
                  ((n++))
                  echo "Command failed. Attempt $n/$max in ${delay}s..."
                  sleep $delay
                else
                  echo "The command has failed after $n attempts."
                  return 1
                fi
              }
            done
          }

          if [[ ! -d tests/helpers/bats-support ]]; then
            retry git clone --depth=1 https://github.com/bats-core/bats-support.git tests/helpers/bats-support
          fi
          if [[ ! -d tests/helpers/bats-assert ]]; then
            retry git clone --depth=1 https://github.com/bats-core/bats-assert.git tests/helpers/bats-assert
          fi

      - name: "🔧 Test env"
        run: |
          mkdir -p /tmp/ash-test/{config,themes,plugins,data,cache,logs}
          cat > /tmp/ash-test-env.sh << 'ENVEOF'
          export ASH_CONFIG_DIR="/tmp/ash-test/config"
          export ASH_THEMES_DIR="/tmp/ash-test/themes"
          export ASH_PLUGINS_DIR="/tmp/ash-test/plugins"
          export ASH_DATA_DIR="/tmp/ash-test/data"
          export ASH_CACHE_DIR="/tmp/ash-test/cache"
          export ASH_LOG_DIR="/tmp/ash-test/logs"
          export ASH_TEST_MODE="1"
          export ASH_NO_COLOR="1"
          ENVEOF
          echo "  Test env ready"

      - name: "🧪 Run BATS"
        id: bats
        run: |
          set -euo pipefail
          source /tmp/ash-test-env.sh
          PASS=0; FAIL=0

          if [[ -d tests/unit ]]; then
            for tf in tests/unit/test-*.sh; do
              [[ -f "$tf" ]] || continue
              NAME=$(basename "${tf%.sh}")
              if bats --formatter tap "$tf" 2>&1; then
                echo "  ✅ $NAME"; (( PASS++ )) || true
              else
                echo "  ❌ $NAME"; (( FAIL++ )) || true
              fi
            done
          else
            echo "  No BATS tests found — smoke testing library files"
            for lib in colors utils json-parser validator logger semver; do
              F="ash-cli/lib/${lib}.sh"
              if [[ -f "$F" ]]; then
                bash -n "$F" 2>&1 \
                  && { echo "  ✅ $lib syntax OK"; (( PASS++ )) || true; } \
                  || { echo "  ❌ $lib syntax FAIL"; (( FAIL++ )) || true; }
              fi
            done
          fi

          echo "  Results: $PASS passed  $FAIL failed"
          echo "passed=$PASS" >> "$GITHUB_OUTPUT"
          echo "failed=$FAIL" >> "$GITHUB_OUTPUT"
          [[ $FAIL -gt 0 ]] && exit 1 || true

  test-theme-engine:
    name: "🎨 Theme Engine Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint-shell, lint-configs]

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "📦 Install"
        run: pip install Pillow --quiet

      - name: "🧪 Color palette generator"
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          from PIL import Image
          import json, os, sys

          # Create test wallpaper
          img = Image.new('RGB', (200, 200), '#2D3B2D')
          img.save('/tmp/test-wall.png')
          print('  test wallpaper created')

          # Simple dominant color extractor (mocked)
          def dominant_color(path):
              img = Image.open(path).convert('RGB')
              img = img.resize((50, 50), Image.LANCZOS)
              pixels = list(img.getdata())
              avg = tuple(int(sum(c[i] for c in pixels)/len(pixels)) for i in range(3))
              return '#{:02x}{:02x}{:02x}'.format(*avg)

          color = dominant_color('/tmp/test-wall.png')
          print('  dominant color: ' + color)
          assert color.startswith('#'), 'Expected hex color'
          print('  color extraction OK')
          PYEOF

      - name: "🧪 Theme validation"
        run: |
          set -euo pipefail
          FAILED=0; PASSED=0

          while IFS= read -r -d '' cf; do
            THEME=$(basename "$(dirname "$cf")")
            OK=true
            for field in bg fg accent red green blue yellow purple orange aqua; do
              val=$(jq -r ".${field} // empty" "$cf" 2>/dev/null)
              if [[ -z "$val" ]]; then
                echo "  MISS $field in $THEME"
                OK=false
              elif ! echo "$val" | grep -qE '^#[0-9a-fA-F]{6}$'; then
                echo "  BAD  '$field'='$val' in $THEME"
                OK=false
              fi
            done
            if [[ "$OK" == "true" ]]; then
              (( PASSED++ )) || true
            else
              (( FAILED++ )) || true
            fi
          done < <(find themes/presets -name "colors.json" -print0 2>/dev/null || true)

          echo "  Theme validation: $PASSED OK  $FAILED failed"
          [[ $FAILED -gt 0 ]] && exit 1 || true

      - name: "🧪 Template engine"
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import re, os, sys

          colors = {
              "bg": "#2D3B2D", "fg": "#D3C6AA", "accent": "#A7C080",
              "red": "#E67E80", "green": "#A7C080", "blue": "#7FBBB3",
              "yellow": "#DBBC7F", "purple": "#D699B6",
              "orange": "#E69875", "aqua": "#83C092",
          }

          tdir = "ash-cli/engines/color-engine/templates"
          tested = 0; failed = 0

          if os.path.isdir(tdir):
              for fname in sorted(os.listdir(tdir)):
                  if not fname.endswith(".template"):
                      continue
                  fpath = os.path.join(tdir, fname)
                  with open(fpath) as f:
                      content = f.read()
                  result = content
                  for key, val in colors.items():
                      result = result.replace("{{" + key + "}}", val)
                      result = result.replace("${colors." + key + "}", val)
                      result = result.replace("%" + key + "%", val)
                  unresolved = re.findall(r"\{\{[^}]+\}\}", result)
                  if unresolved:
                      print("  WARN unresolved in " + fname + ": " + str(unresolved[:3]))
                  tested += 1
                  print("  OK: " + fname)
          else:
              print("  template_dir not found — skipping")

          print("  Tested: " + str(tested) + "  Failed: " + str(failed))
          sys.exit(1 if failed > 0 else 0)
          PYEOF

      - name: "🧪 Color contrast batch"
        run: |
          python3 << 'PYEOF'
          import os, sys, json

          def hex_to_linear(h):
              h = h.lstrip('#')
              rgb = [int(h[i:i+2], 16)/255.0 for i in (0,2,4)]
              return [c/12.92 if c<=0.04045 else ((c+0.055)/1.055)**2.4 for c in rgb]

          def lum(h):
              r, g, b = hex_to_linear(h)
              return 0.2126*r + 0.7152*g + 0.0722*b

          def cr(a, b):
              la, lb = lum(a), lum(b)
              return (max(la,lb)+0.05)/(min(la,lb)+0.05)

          themes_dir = "themes/presets"
          issues = 0; checked = 0

          if os.path.isdir(themes_dir):
              for cat in os.listdir(themes_dir):
                  cat_path = os.path.join(themes_dir, cat)
                  if not os.path.isdir(cat_path):
                      continue
                  cf = os.path.join(cat_path, "colors.json")
                  if not os.path.isfile(cf):
                      continue
                  with open(cf) as f:
                      c = json.load(f)
                  bg = c.get('bg', '#1e1e2e')
                  fg = c.get('fg', '#cdd6f4')
                  try:
                      ratio = cr(fg, bg)
                      checked += 1
                      status = "OK" if ratio >= 4.5 else "WARN"
                      print("  " + status + " " + cat.ljust(24) + str(round(ratio,2)) + ":1")
                      if ratio < 3.0:
                          issues += 1
                  except Exception as e:
                      print("  ERR " + cat + ": " + str(e))

          print("\n  Checked: " + str(checked) + "  Issues: " + str(issues))
          sys.exit(0)
          PYEOF

  test-plugins:
    name: "🔌 Plugin Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint-shell, lint-configs]

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🧪 Plugin manifest validation"
        run: |
          set -euo pipefail
          FAILED=0; PASSED=0

          while IFS= read -r -d '' m; do
            PLUGIN=$(basename "$(dirname "$m")")
            OK=true
            for field in name version description author; do
              val=$(jq -r ".${field} // empty" "$m" 2>/dev/null)
              if [[ -z "$val" ]]; then
                echo "  MISS '$field' in: $PLUGIN"; OK=false
              fi
            done
            VER=$(jq -r '.version // ""' "$m")
            if ! echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "  BAD semver '$VER' in: $PLUGIN"; OK=false
            fi
            if [[ "$OK" == "true" ]]; then (( PASSED++ )) || true
            else (( FAILED++ )) || true; fi
          done < <(find plugins -name "plugin.json" -print0 2>/dev/null || true)

          echo "  Plugins: $PASSED valid  $FAILED invalid"
          [[ $FAILED -gt 0 ]] && exit 1 || true

      - name: "🧪 Plugin script syntax"
        run: |
          set -euo pipefail
          FAILED=0

          while IFS= read -r -d '' m; do
            PDIR=$(dirname "$m")
            for script in "$PDIR"/*.sh; do
              [[ -f "$script" ]] || continue
              if ! bash -n "$script" 2>&1; then
                echo "  FAIL syntax: $script"
                (( FAILED++ )) || true
              fi
            done
          done < <(find plugins/core -name "plugin.json" -print0 2>/dev/null || true)

          echo "  Plugin scripts: $FAILED syntax failures"
          [[ $FAILED -gt 0 ]] && exit 1 || echo "  All plugin scripts valid"

  test-api:
    name: "🌐 API Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [lint-python, lint-configs]
    if: |
      needs.intelligence.outputs.api_exists == 'true' &&
      (
        needs.intelligence.outputs.has_api == 'true' ||
        needs.intelligence.outputs.run_full == 'true'
      )

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: "📦 Install"
        working-directory: api
        run: |
          pip install \
            -r requirements.txt \
            pytest pytest-asyncio pytest-cov pytest-timeout \
            httpx fakeredis \
            --quiet

      - name: "🚀 Start API"
        working-directory: api
        env:
          ASH_ENV: test
          ASH_SECRET_KEY: ci-test-key-not-for-production
          REDIS_URL: redis://localhost:6379
        run: |
          python server.py &
          echo $! > /tmp/api.pid
          echo "  Waiting for API..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health &>/dev/null && {
              echo "  API ready (${i}s)"; break
            }
            sleep 1
            [[ $i -eq 30 ]] && { echo "  API timeout"; exit 1; }
          done

      - name: "🧪 pytest"
        working-directory: api
        env:
          ASH_ENV: test
          API_BASE_URL: http://localhost:8000
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --junit-xml=pytest-results.xml \
            --timeout=30 \
            --tb=short -v \
            2>&1 | tee pytest-out.txt

      - name: "🛑 Stop API"
        if: always()
        run: |
          [[ -f /tmp/api.pid ]] && kill "$(cat /tmp/api.pid)" 2>/dev/null || true

      - name: "📊 Upload"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "api-tests-${{ github.run_id }}"
          path: |
            api/pytest-results.xml
            api/coverage.xml
            api/pytest-out.txt
          retention-days: 14

      - name: "📊 Codecov"
        uses: codecov/codecov-action@v4
        with:
          files: api/coverage.xml
          flags: api
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-web:
    name: "🌐 Web Dashboard Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [intelligence, lint-typescript]
    if: needs.intelligence.outputs.web_exists == 'true' && (needs.intelligence.outputs.has_web == 'true' || needs.intelligence.outputs.run_full == 'true')

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Node.js"
        if: needs.intelligence.outputs.web_lock_exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: "🟢 Node.js"
        if: needs.intelligence.outputs.web_lock_exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "📦 Install"
        working-directory: web
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --prefer-offline
          else
            npm install --prefer-offline
          fi

      - name: "🧪 Unit tests (Vitest)"
        working-directory: web
        run: |
          npx vitest run \
            --reporter=verbose \
            --reporter=junit \
            --outputFile=vitest-results.xml \
            2>&1 | tee vitest-out.txt || true
          echo "  Vitest done"

      - name: "📊 Upload"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "web-tests-${{ github.run_id }}"
          path: |
            web/vitest-results.xml
            web/vitest-out.txt
          retention-days: 7


# ┌─────────────────────────────────────────────────────────────────────────────
# │  STAGE 05 — 📊 BENCHMARKS
# └─────────────────────────────────────────────────────────────────────────────

  benchmark:
    name: "📊 Benchmarks"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [test-shell, test-theme-engine]
    if: |
      needs.intelligence.outputs.run_benchmarks == 'true' ||
      github.event.inputs.enable_benchmarks     == 'true' ||
      github.ref == 'refs/heads/main'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install"
        run: |
          sudo apt-get install -y imagemagick webp time --no-install-recommends
          # hyperfine
          HF_VER="1.18.0"
          curl --retry 5 --retry-delay 5 --retry-connrefused -fsSL \
            "https://github.com/sharkdp/hyperfine/releases/download/v${HF_VER}/hyperfine_${HF_VER}_amd64.deb" \
            -o /tmp/hf.deb 2>/dev/null \
            && sudo dpkg -i /tmp/hf.deb 2>/dev/null || true
          command -v hyperfine && hyperfine --version || echo "  hyperfine unavailable"
          pip install matplotlib pandas --quiet 2>/dev/null || true

      - name: "🖼️ Setup test image"
        run: |
          python3 -c "
          from PIL import Image
          Image.new('RGB', (2560, 1440), '#2D3B2D').save('/tmp/bench.png')
          print('  Test image ready')
          " 2>/dev/null || \
          convert -size 2560x1440 gradient:'#2D3B2D-#A7C080' /tmp/bench.png

      - name: "📊 Bench: startup"
        run: |
          if [[ -f "ash-cli/ash" ]]; then
            hyperfine \
              --warmup 3 --runs 20 \
              --export-json /tmp/bench-startup.json \
              --export-markdown /tmp/bench-startup.md \
              "bash ash-cli/ash --version" 2>&1 || true
            MEAN=$(jq '.results[0].mean * 1000 | round' \
              /tmp/bench-startup.json 2>/dev/null || echo "N/A")
            echo "  Startup: ${MEAN}ms  (limit: ${MAX_STARTUP_MS}ms)"
          else
            echo "  No ash binary — skip"
            echo '{"results":[{"mean":0}]}' > /tmp/bench-startup.json
          fi

      - name: "📊 Bench: WebP encode"
        run: |
          hyperfine \
            --warmup 2 --runs 10 \
            --export-json /tmp/bench-webp.json \
            --export-markdown /tmp/bench-webp.md \
            "cwebp -q 92 -m 6 -sharp_yuv /tmp/bench.png -o /tmp/bench-out.webp" \
            2>&1 || true
          MEAN=$(jq '.results[0].mean * 1000 | round' \
            /tmp/bench-webp.json 2>/dev/null || echo "N/A")
          echo "  WebP encode: ${MEAN}ms"

      - name: "📊 Bench: JSON throughput"
        run: |
          python3 -c "
          import json, random
          data = {
            'themes':  {'t' + str(i): {'bg': '#' + format(random.randint(0,0xFFFFFF),'06x')} for i in range(250)},
            'plugins': [{'name': 'p' + str(i), 'version': '1.0.0'} for i in range(150)]
          }
          json.dump(data, open('/tmp/bench-data.json','w'))
          print('  bench data ready')
          "
          hyperfine \
            --warmup 5 --runs 50 \
            --export-json /tmp/bench-json.json \
            "jq '.themes | length' /tmp/bench-data.json" \
            2>&1 || true
          echo "  JSON bench done"

      - name: "📊 Generate report"
        run: |
          {
            echo "# ASH Benchmark Report"
            echo ""
            echo "> Commit: ${{ github.sha }}"
            echo "> Runner: ${{ runner.os }} / ${{ runner.arch }}"
            echo "> Date: $(date -u)"
            echo ""
            for md in /tmp/bench-*.md; do
              [[ -f "$md" ]] && cat "$md" || true
              echo ""
            done
          } > bench-report.md
          cat bench-report.md

      - name: "📤 Upload"
        uses: actions/upload-artifact@v4
        with:
          name: "benchmarks-${{ github.run_id }}"
          path: |
            bench-report.md
            /tmp/bench-*.json
          retention-days: 90

      - name: "📊 Baseline (main only)"
        if: github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: /tmp/bench-startup.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "130%"
          comment-on-alert: true
          fail-on-alert: false


# ┌─────────────────────────────────────────────────────────────────────────────
# │  STAGE 06 — 🏗️  BUILD
# └─────────────────────────────────────────────────────────────────────────────

  build-web:
    name: "🌐 Build Web"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [intelligence, lint-typescript, test-shell]
    if: needs.intelligence.outputs.web_exists == 'true'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Node.js"
        if: needs.intelligence.outputs.web_lock_exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: "🟢 Node.js"
        if: needs.intelligence.outputs.web_lock_exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "📦 Install"
        working-directory: web
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --prefer-offline
          else
            npm install --prefer-offline
          fi

      - name: "🏗️ Build"
        working-directory: web
        env:
          NODE_ENV: production
          VITE_APP_VERSION: ${{ env.ASH_VERSION }}
          VITE_BUILD_HASH: ${{ github.sha }}
        run: |
          npm run build 2>&1 | tee build-out.txt
          [[ -d dist ]] || { echo "  Build failed — dist/ missing"; exit 1; }
          echo "  Built: $(du -sh dist/ | cut -f1)"

      - name: "🔍 Bundle size"
        working-directory: web
        run: |
          MAX=$(( MAX_BUNDLE_KB * 1024 ))
          for js in dist/assets/index-*.js; do
            [[ -f "$js" ]] || continue
            SZ=$(wc -c < "$js")
            echo "  Main bundle: $(numfmt --to=iec "$SZ")  limit: ${MAX_BUNDLE_KB}KB"
            [[ $SZ -gt $MAX ]] && echo "  ⚠️ Exceeds limit" || echo "  ✅ Within limit"
          done

      - name: "📤 Upload"
        uses: actions/upload-artifact@v4
        with:
          name: "web-dist-${{ github.run_id }}"
          path: web/dist/
          retention-days: 14

  build-docker:
    name: "🐳 Docker (${{ matrix.platform }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    needs: [test-shell, test-theme-engine, sec-deps]
    if: |
      github.ref == 'refs/heads/main'                    ||
      startsWith(github.ref, 'refs/heads/release/')      ||
      github.event.inputs.pipeline_mode == 'full'

    permissions:
      actions: read
      contents: read
      packages: write
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐳 Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🔑 GHCR login"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🏷️ Metadata"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=ASH Dotfiles
            org.opencontainers.image.version=${{ env.ASH_VERSION }}

      - name: "🏗️ Build & push"
        id: docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: "type=gha,scope=docker-${{ matrix.platform }}"
          cache-to:   "type=gha,mode=max,scope=docker-${{ matrix.platform }}"
          build-args: |
            ASH_VERSION=${{ env.ASH_VERSION }}
            VCS_REF=${{ github.sha }}
          provenance: true
          sbom: true

      - name: "🔍 Trivy image scan"
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: "📤 Upload image SARIF"
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: "trivy-image-${{ matrix.platform }}"

  build-nix:
    name: "❄️ Nix Flake Check"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint-configs]
    if: |
      needs.intelligence.outputs.run_full == 'true' ||
      github.ref == 'refs/heads/main'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "❄️ Install Nix"
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-unstable

      - name: "🔍 Flake check"
        run: |
          if [[ -f nix/flake.nix ]]; then
            nix flake check nix/ --no-build 2>&1 | head -50 || {
              echo "  Flake check issues (non-blocking)"
            }
          else
            echo "  No flake.nix found — skipping"
          fi


# ┌─────────────────────────────────────────────────────────────────────────────
# │  STAGE 07 — 🚀 DEPLOY
# └─────────────────────────────────────────────────────────────────────────────

  deploy-docs:
    name: "📖 Deploy Docs"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [test-shell, shots-aggregate, build-web]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: "📦 MkDocs"
        run: |
          pip install \
            mkdocs mkdocs-material \
            mkdocs-minify-plugin \
            mkdocs-git-revision-date-localized-plugin \
            mkdocs-glightbox \
            pymdown-extensions \
            --quiet

      - name: "📥 Screenshots"
        uses: actions/download-artifact@v4
        with:
          name: "shots-all-${{ github.run_id }}"
          path: docs/assets/screenshots/
        continue-on-error: true

      - name: "🏗️ Build"
        env:
          SITE_URL: "https://${{ github.repository_owner }}.github.io/ash-dotfiles"
        run: |
          mkdocs build \
            --config-file docs/mkdocs.yml \
            --strict 2>&1 | tail -20 || {
              echo "  MkDocs issues — trying without strict"
              mkdocs build --config-file docs/mkdocs.yml 2>&1 | tail -20
            }
          echo "  Site: $(du -sh site/ | cut -f1)"

      - name: "⚙️ Setup Pages"
        uses: actions/configure-pages@v4

      - name: "📤 Upload pages"
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: "🚀 Deploy"
        id: pages
        uses: actions/deploy-pages@v4

  deploy-preview:
    name: "🔮 PR Preview"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-web]
    if: |
      github.event_name == 'pull_request' &&
      (
        github.event.inputs.deploy_preview == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'preview')
      )

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: "📥 Web dist"
        uses: actions/download-artifact@v4
        with:
          name: "web-dist-${{ github.run_id }}"
          path: web-dist/

      - name: "🚀 Cloudflare Pages"
        id: cf
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ash-dotfiles-preview
          directory: web-dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: "pr-${{ github.event.number }}"

      - name: "💬 Comment"
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-deploy
          message: |
            ## 🔮 Preview Deployment Ready

            | | |
            |---|---|
            | 🌐 **URL** | ${{ steps.cf.outputs.url }} |
            | 📦 **Commit** | `${{ github.sha }}` |
            | 🎨 **Version** | `${{ env.ASH_VERSION }}` |
            | 🕐 **Deployed** | $(date -u "+%Y-%m-%d %H:%M UTC") |

            > Expires when PR is closed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  deploy-api:
    name: "🌐 Deploy API"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [test-api, sec-deps]
    if: |
      needs.intelligence.outputs.api_exists == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    permissions:
      contents: read

    environment:
      name: api-production
      url: https://api.ash-dotfiles.dev

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🔍 Check Fly token availability"
        id: fly_token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [[ -n "${FLY_API_TOKEN:-}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "  ✅ FLY_API_TOKEN detected"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "  ⚠️ FLY_API_TOKEN not set — deploy will be skipped"
          fi

      - name: "⚙️ Setup Flyctl"
        if: steps.fly_token.outputs.present == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@v1.5.1

      - name: "🚀 Deploy"
        if: steps.fly_token.outputs.present == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          cd api
          flyctl deploy \
            --remote-only \
            --build-arg ASH_VERSION="${{ env.ASH_VERSION }}" \
            --build-arg VCS_REF="${{ github.sha }}" \
            2>&1 | tail -30
          echo "  ✅ API deployed"

      - name: "⏭️ Skip deploy notice"
        if: steps.fly_token.outputs.present != 'true'
        run: |
          echo "  ⏭️ Skipping API deploy because FLY_API_TOKEN is not configured"


# ┌─────────────────────────────────────────────────────────────────────────────
# │  STAGE 08 — 📋 MANIFEST UPDATE
# └─────────────────────────────────────────────────────────────────────────────

  update-manifest:
    name: "📋 Commit Manifest"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [shots-aggregate, test-shell]
    if: |
      github.ref == 'refs/heads/main'   &&
      github.event_name == 'push'       &&
      needs.shots-aggregate.result == 'success'

    permissions:
      contents: write

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "📥 Manifest"
        uses: actions/download-artifact@v4
        with:
          name: "shots-all-${{ github.run_id }}"
          path: "${{ env.SHOTS_DIR }}/"
        continue-on-error: true

      - name: "📝 Commit"
        env:
          _SHA: ${{ github.sha }}
          _RUN: ${{ github.run_id }}
        run: |
          git config user.name  "ASH Bot 🤖"
          git config user.email "ash-bot@users.noreply.github.com"

          MANIFEST="$SHOTS_DIR/manifest.json"
          if git diff --quiet "$MANIFEST" 2>/dev/null; then
            echo "  Manifest unchanged — skip commit"
            exit 0
          fi

          TOTAL=$(jq '.total_themes // 0' "$MANIFEST" 2>/dev/null || echo 0)

          git add "$MANIFEST"
          git commit \
            --message "chore(assets): update screenshot manifest [skip ci]

          Run:    ${_RUN}
          Commit: ${_SHA}
          Themes: ${TOTAL} updated
          Ver:    ${ASH_VERSION}" \
            --author "ASH Bot <ash-bot@users.noreply.github.com>"

          git push origin main
          echo "  Manifest pushed ($TOTAL themes)"


# ┌─────────────────────────────────────────────────────────────────────────────
# │  STAGE 09 — 📊 SUMMARY, NOTIFY & CLEANUP
# └─────────────────────────────────────────────────────────────────────────────

  summary:
    name: "📊 Pipeline Summary"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: always()
    needs:
      - intelligence
      - sec-secrets
      - sec-deps
      - sec-codeql
      - sec-permissions
      - lint-shell
      - lint-lua
      - lint-configs
      - lint-typescript
      - lint-python
      - lint-hyprland
      - lint-fish
      - shots-aggregate
      - test-shell
      - test-theme-engine
      - test-plugins
      - benchmark
      - build-web
      - build-docker

    outputs:
      overall: ${{ steps.compute.outputs.overall }}
      color:   ${{ steps.compute.outputs.color }}

    steps:
      - name: "📊 Compute result"
        id: compute
        env:
          R_SEC_SECRETS:    ${{ needs.sec-secrets.result }}
          R_SEC_DEPS:       ${{ needs.sec-deps.result }}
          R_SEC_CODEQL:     ${{ needs.sec-codeql.result }}
          R_SEC_PERMS:      ${{ needs.sec-permissions.result }}
          R_LINT_SH:        ${{ needs.lint-shell.result }}
          R_LINT_LUA:       ${{ needs.lint-lua.result }}
          R_LINT_CFG:       ${{ needs.lint-configs.result }}
          R_LINT_TS:        ${{ needs.lint-typescript.result }}
          R_LINT_PY:        ${{ needs.lint-python.result }}
          R_LINT_HYPR:      ${{ needs.lint-hyprland.result }}
          R_LINT_FISH:      ${{ needs.lint-fish.result }}
          R_SHOTS:          ${{ needs.shots-aggregate.result }}
          R_TEST_SH:        ${{ needs.test-shell.result }}
          R_TEST_THEME:     ${{ needs.test-theme-engine.result }}
          R_TEST_PLUGIN:    ${{ needs.test-plugins.result }}
          R_BENCH:          ${{ needs.benchmark.result }}
          R_BUILD_WEB:      ${{ needs.build-web.result }}
          R_BUILD_DOCKER:   ${{ needs.build-docker.result }}
        run: |
          set -euo pipefail

          e() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "⏹️" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "❓" ;;
            esac
          }

          # Critical jobs — failures block overall
          OVERALL="success"
          CRITICAL=(
            "$R_SEC_SECRETS" "$R_SEC_DEPS"
            "$R_LINT_SH" "$R_LINT_CFG"
            "$R_TEST_SH" "$R_BUILD_WEB"
          )
          for r in "${CRITICAL[@]}"; do
            [[ "$r" == "failure" ]] && { OVERALL="failure"; break; }
          done

          LABEL="✅ PASSED"
          COLOR="3066993"
          [[ "$OVERALL" == "failure" ]] && { LABEL="❌ FAILED"; COLOR="15158332"; }

          {
            echo "overall=$LABEL"
            echo "color=$COLOR"
            echo "e_sec_secrets=$(e "$R_SEC_SECRETS")"
            echo "e_sec_deps=$(e "$R_SEC_DEPS")"
            echo "e_sec_codeql=$(e "$R_SEC_CODEQL")"
            echo "e_sec_perms=$(e "$R_SEC_PERMS")"
            echo "e_lint_sh=$(e "$R_LINT_SH")"
            echo "e_lint_lua=$(e "$R_LINT_LUA")"
            echo "e_lint_cfg=$(e "$R_LINT_CFG")"
            echo "e_lint_ts=$(e "$R_LINT_TS")"
            echo "e_lint_py=$(e "$R_LINT_PY")"
            echo "e_lint_hypr=$(e "$R_LINT_HYPR")"
            echo "e_lint_fish=$(e "$R_LINT_FISH")"
            echo "e_shots=$(e "$R_SHOTS")"
            echo "e_test_sh=$(e "$R_TEST_SH")"
            echo "e_test_theme=$(e "$R_TEST_THEME")"
            echo "e_test_plugin=$(e "$R_TEST_PLUGIN")"
            echo "e_bench=$(e "$R_BENCH")"
            echo "e_build_web=$(e "$R_BUILD_WEB")"
            echo "e_build_docker=$(e "$R_BUILD_DOCKER")"
          } >> "$GITHUB_OUTPUT"

      - name: "📋 Job summary"
        env:
          _OVERALL:       ${{ steps.compute.outputs.overall }}
          _SHA:           ${{ github.sha }}
          _BRANCH:        ${{ github.ref_name }}
          _RUN:           ${{ github.run_id }}
          _REPO:          ${{ github.repository }}
          _SERVER:        ${{ github.server_url }}
          _EVENT:         ${{ github.event_name }}
          _ACTOR:         ${{ github.actor }}
          _SEC_SECRETS:   ${{ steps.compute.outputs.e_sec_secrets }}
          _SEC_DEPS:      ${{ steps.compute.outputs.e_sec_deps }}
          _SEC_CODEQL:    ${{ steps.compute.outputs.e_sec_codeql }}
          _SEC_PERMS:     ${{ steps.compute.outputs.e_sec_perms }}
          _LINT_SH:       ${{ steps.compute.outputs.e_lint_sh }}
          _LINT_LUA:      ${{ steps.compute.outputs.e_lint_lua }}
          _LINT_CFG:      ${{ steps.compute.outputs.e_lint_cfg }}
          _LINT_TS:       ${{ steps.compute.outputs.e_lint_ts }}
          _LINT_PY:       ${{ steps.compute.outputs.e_lint_py }}
          _LINT_HYPR:     ${{ steps.compute.outputs.e_lint_hypr }}
          _LINT_FISH:     ${{ steps.compute.outputs.e_lint_fish }}
          _SHOTS:         ${{ steps.compute.outputs.e_shots }}
          _TEST_SH:       ${{ steps.compute.outputs.e_test_sh }}
          _TEST_THEME:    ${{ steps.compute.outputs.e_test_theme }}
          _TEST_PLUGIN:   ${{ steps.compute.outputs.e_test_plugin }}
          _BENCH:         ${{ steps.compute.outputs.e_bench }}
          _BUILD_WEB:     ${{ steps.compute.outputs.e_build_web }}
          _BUILD_DOCKER:  ${{ steps.compute.outputs.e_build_docker }}
        run: |
          SHORT_SHA="${_SHA:0:7}"
          RUN_URL="${_SERVER}/${_REPO}/actions/runs/${_RUN}"

          cat >> "$GITHUB_STEP_SUMMARY" << MDEOF
          # 🚀 ASH Dotfiles v${ASH_VERSION} — Pipeline Summary

          ## ${_OVERALL}

          | | |
          |---|---|
          | **Branch** | \`${_BRANCH}\` |
          | **Commit** | \`${SHORT_SHA}\` |
          | **Trigger** | ${_EVENT} by @${_ACTOR} |
          | **Run** | [${_RUN}](${RUN_URL}) |

          ---

          ## 🔒 Security

          | Job | Status |
          |-----|--------|
          | Secret Scanning   | ${_SEC_SECRETS}  |
          | Dependency Audit  | ${_SEC_DEPS}     |
          | CodeQL Analysis   | ${_SEC_CODEQL}   |
          | Permissions Audit | ${_SEC_PERMS}    |

          ## ✅ Linting

          | Job | Status |
          |-----|--------|
          | ShellCheck    | ${_LINT_SH}   |
          | Luacheck      | ${_LINT_LUA}  |
          | JSON/YAML/TOML| ${_LINT_CFG}  |
          | TypeScript    | ${_LINT_TS}   |
          | Python (Ruff) | ${_LINT_PY}   |
          | Hyprland Conf | ${_LINT_HYPR} |
          | Fish Shell    | ${_LINT_FISH} |

          ## 🖼️ Screenshots

          | Job | Status |
          |-----|--------|
          | Generation + Aggregation | ${_SHOTS} |

          ## 🧪 Tests

          | Job | Status |
          |-----|--------|
          | Shell Unit Tests    | ${_TEST_SH}     |
          | Theme Engine        | ${_TEST_THEME}  |
          | Plugin System       | ${_TEST_PLUGIN} |

          ## 📊 Performance

          | Job | Status |
          |-----|--------|
          | Benchmarks | ${_BENCH} |

          ## 🏗️ Build

          | Job | Status |
          |-----|--------|
          | Web Dashboard | ${_BUILD_WEB}    |
          | Docker Image  | ${_BUILD_DOCKER} |

          ---

          *ASH Dotfiles v${ASH_VERSION} OMEGA • Pipeline v${ASH_PIPELINE_VERSION}*
          MDEOF

  notify:
    name: "💬 Notifications"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: [summary]
    if: |
      always() &&
      (
        github.ref == 'refs/heads/main'  ||
        needs.summary.outputs.overall == '❌ FAILED' ||
        github.event.inputs.notify_discord == 'true'
      )

    steps:
      - name: "💬 Discord"
        env:
          WEBHOOK:  ${{ secrets.DISCORD_WEBHOOK_URL }}
          OVERALL:  ${{ needs.summary.outputs.overall }}
          COLOR:    ${{ needs.summary.outputs.color }}
          _SHA:     ${{ github.sha }}
          _BRANCH:  ${{ github.ref_name }}
          _ACTOR:   ${{ github.actor }}
          _RUN:     ${{ github.run_id }}
          _REPO:    ${{ github.repository }}
          _SERVER:  ${{ github.server_url }}
        run: |
          [[ -z "${WEBHOOK:-}" ]] && { echo "  No webhook"; exit 0; }

          SHORT_SHA="${_SHA:0:7}"
          RUN_URL="${_SERVER}/${_REPO}/actions/runs/${_RUN}"
          COMMIT_URL="${_SERVER}/${_REPO}/commit/${_SHA}"
          ASH_VER="${ASH_VERSION}"

          ICON="✅"
          TEXT="Pipeline Passed"
          [[ "$OVERALL" == *"FAILED"* ]] && { ICON="❌"; TEXT="Pipeline Failed"; }

          python3 << PYEOF
          import json, urllib.request, os

          payload = {
            "embeds": [{
              "title": "${ICON} ASH Dotfiles CI — ${TEXT}",
              "description": "Pipeline completed for branch \`${_BRANCH}\`",
              "color": int("${COLOR}"),
              "fields": [
                {"name": "📦 Version",  "value": "${ASH_VER}",                      "inline": True},
                {"name": "🌿 Branch",   "value": "\`${_BRANCH}\`",                  "inline": True},
                {"name": "🔗 Commit",   "value": "[${SHORT_SHA}](${COMMIT_URL})",   "inline": True},
                {"name": "👤 Author",   "value": "${_ACTOR}",                       "inline": True},
                {"name": "📊 Result",   "value": "${OVERALL}",                      "inline": True},
                {"name": "🔗 Run",      "value": "[View Details](${RUN_URL})",      "inline": True},
              ],
              "footer": {
                "text": "ASH Dotfiles v${ASH_VER} OMEGA • CI/CD Pipeline v${ASH_PIPELINE_VERSION}"
              },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }

          data = json.dumps(payload).encode('utf-8')
          req  = urllib.request.Request(
              "${WEBHOOK}",
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as r:
                  print("  Discord: " + str(r.status))
          except Exception as exc:
              print("  Discord error: " + str(exc))
          PYEOF

      - name: "📧 Slack (failures only)"
        if: needs.summary.outputs.overall == '❌ FAILED'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          _BRANCH:       ${{ github.ref_name }}
          _ACTOR:        ${{ github.actor }}
          _RUN:          ${{ github.run_id }}
          _REPO:         ${{ github.repository }}
          _SERVER:       ${{ github.server_url }}
        run: |
          [[ -z "${SLACK_WEBHOOK:-}" ]] && { echo "  No Slack webhook"; exit 0; }

          RUN_URL="${_SERVER}/${_REPO}/actions/runs/${_RUN}"

          python3 << PYEOF
          import json, urllib.request

          payload = {
            "text": ":x: *ASH Dotfiles CI FAILED*",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": (":x: *ASH Dotfiles CI FAILED*\n"
                           "Branch: \`${_BRANCH}\`  |  Actor: ${_ACTOR}\n"
                           "<${RUN_URL}|View run details>")
                }
              }
            ]
          }

          data = json.dumps(payload).encode('utf-8')
          req  = urllib.request.Request(
              "${SLACK_WEBHOOK}",
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as r:
                  print("  Slack: " + str(r.status))
          except Exception as exc:
              print("  Slack error: " + str(exc))
          PYEOF

  cleanup:
    name: "🧹 Cleanup"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [summary]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    permissions:
      actions: write

    steps:
      - name: "🧹 Prune old artifacts"
        uses: actions/github-script@v7
        with:
          script: |
            const KEEP   = 10;
            const PRUNE  = ['shot-', 'sec-', 'lint-', 'api-tests-',
                            'web-tests-', 'benchmarks-', 'luacheck-',
                            'lint-configs-', 'lint-ts-', 'lint-python-'];

            const { data: { artifacts } } = await github.rest.actions
              .listArtifactsForRepo({
                owner:    context.repo.owner,
                repo:     context.repo.repo,
                per_page: 100,
              });

            const grouped = {};
            for (const a of artifacts) {
              for (const p of PRUNE) {
                if (a.name.startsWith(p)) {
                  (grouped[p] = grouped[p] || []).push(a);
                  break;
                }
              }
            }

            let deleted = 0;
            for (const [prefix, arts] of Object.entries(grouped)) {
              const sorted = [...arts].sort((a, b) =>
                new Date(b.created_at) - new Date(a.created_at));
              for (const a of sorted.slice(KEEP)) {
                await github.rest.actions.deleteArtifact({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  artifact_id: a.id,
                });
                deleted++;
              }
            }
            core.info('Deleted ' + deleted + ' old artifacts');

      - name: "🧹 Cancel stale runs"
        uses: actions/github-script@v7
        with:
          script: |
            const { data: { workflow_runs } } = await github.rest.actions
              .listWorkflowRunsForRepo({
                owner:    context.repo.owner,
                repo:     context.repo.repo,
                status:   'in_progress',
                per_page: 50,
              });

            const current = context.runId;
            let cancelled = 0;

            for (const run of workflow_runs) {
              if (run.id !== current &&
                  run.head_branch === context.ref.replace('refs/heads/', '') &&
                  run.workflow_id === context.workflow) {
                await github.rest.actions.cancelWorkflowRun({
                  owner:  context.repo.owner,
                  repo:   context.repo.repo,
                  run_id: run.id,
                });
                cancelled++;
              }
            }
            core.info('Cancelled ' + cancelled + ' stale runs');
