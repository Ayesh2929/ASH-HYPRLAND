# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.1.0 — MASTER CI PIPELINE                         ║
# ║           Complete end-to-end CI with matrix testing, caching,             ║
# ║           artifact storage, parallel jobs, coverage reports                ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

name: 🚀 CI Pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'release/**'
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Enable debug logging'
        required: false
        default: false
      skip_tests:
        type: boolean
        description: 'Skip test jobs'
        required: false
        default: false
      target_job:
        type: choice
        description: 'Run specific job only'
        required: false
        default: 'all'
        options:
          - all
          - validate
          - test
          - security
          - lint
          - docs

  schedule:
    - cron: '0 2 * * *'    # Daily 2am UTC — full pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Global environment variables
env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  RUBY_VERSION: '3.2'
  FORCE_COLOR: '1'
  TERM: 'xterm-256color'
  CI: 'true'
  ASH_VERSION: '3.1.0'
  CACHE_VERSION: 'v2'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

defaults:
  run:
    shell: bash

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 1: SETUP & CACHE
# ═══════════════════════════════════════════════════════════════════════════════

jobs:

  setup:
    name: ⚙️ Setup & Cache
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      python-cache-key: ${{ steps.cache-keys.outputs.python }}
      node-cache-key: ${{ steps.cache-keys.outputs.node }}
      should-skip: ${{ steps.skip-check.outputs.should-skip }}
      changed-files: ${{ steps.changes.outputs.files }}
      has-scripts: ${{ steps.changes.outputs.has-scripts }}
      has-configs: ${{ steps.changes.outputs.has-configs }}
      has-lua: ${{ steps.changes.outputs.has-lua }}
      has-docs: ${{ steps.changes.outputs.has-docs }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: 🔍 Check for skip signals
        id: skip-check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            COMMIT_MSG="${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}"
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
          fi
          if [[ -n "${COMMIT_MSG}" ]] && echo "${COMMIT_MSG}" | grep -qiE '\[skip ci\]|\[ci skip\]|\[no ci\]'; then
            echo "should-skip=true" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping CI by commit message request"
          else
            echo "should-skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 🔍 Detect changed files
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          else
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || echo "")
          fi

          echo "files=${CHANGED}" >> $GITHUB_OUTPUT

          # Detect categories - output with underscore for step reference
          echo "${CHANGED}" | grep -q "\.sh$"    && echo "has-scripts=true"  >> $GITHUB_OUTPUT || echo "has-scripts=false"  >> $GITHUB_OUTPUT
          echo "${CHANGED}" | grep -q "\.conf$\|\.jsonc$\|\.json$\|\.toml$\|\.css$\|\.scss$" \
                                                  && echo "has-configs=true"  >> $GITHUB_OUTPUT || echo "has-configs=false"  >> $GITHUB_OUTPUT
          echo "${CHANGED}" | grep -q "\.lua$"   && echo "has-lua=true"      >> $GITHUB_OUTPUT || echo "has-lua=false"      >> $GITHUB_OUTPUT
          echo "${CHANGED}" | grep -q "\.md$\|docs/" \
                                                  && echo "has-docs=true"     >> $GITHUB_OUTPUT || echo "has-docs=false"     >> $GITHUB_OUTPUT

          echo "📝 Changed files:"
          echo "${CHANGED}" | head -20

      - name: 🔑 Generate cache keys
        id: cache-keys
        run: |
          PYTHON_KEY="${{ env.CACHE_VERSION }}-python-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/requirements*.txt', '**/*.py') }}"
          NODE_KEY="${{ env.CACHE_VERSION }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('**/package*.json') }}"
          echo "python=${PYTHON_KEY}" >> $GITHUB_OUTPUT
          echo "node=${NODE_KEY}"     >> $GITHUB_OUTPUT
          echo "🔑 Cache keys generated"

      - name: 💾 Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ steps.cache-keys.outputs.python }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-python-${{ env.PYTHON_VERSION }}-
            ${{ env.CACHE_VERSION }}-python-

      - name: 💾 Cache Node packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ steps.cache-keys.outputs.node }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-node-${{ env.NODE_VERSION }}-
            ${{ env.CACHE_VERSION }}-node-

      - name: 📊 Pipeline info
        run: |
          echo "## ⚙️ CI Pipeline Started" >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY || true
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY || true
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY || true
          echo "| 🔀 Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY || true
          echo "| 👤 Actor | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY || true
          echo "| 📝 Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY || true
          echo "| 🎯 Event | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY || true
          echo "| 🐍 Python | ${{ env.PYTHON_VERSION }} |" >> $GITHUB_STEP_SUMMARY || true
          echo "| 📦 ASH | v${{ env.ASH_VERSION }} |" >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY || true

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 2: LINT MATRIX
# ═══════════════════════════════════════════════════════════════════════════════

  lint:
    name: 🔍 Lint (${{ matrix.tool }})
    needs: setup
    if: needs.setup.outputs.should-skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        tool:
          - shellcheck
          - bashate
          - luacheck
          - stylelint
          - jsonlint
          - markdownlint

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        if: matrix.tool == 'bashate'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🟢 Setup Node
        if: matrix.tool == 'stylelint' || matrix.tool == 'markdownlint'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 🔧 Install ShellCheck
        if: matrix.tool == 'shellcheck'
        run: sudo apt-get install -y shellcheck

      - name: 🔧 Install Bashate
        if: matrix.tool == 'bashate'
        run: pip install --quiet bashate

      - name: 🔧 Install Luacheck
        if: matrix.tool == 'luacheck'
        run: |
          sudo apt-get install -y lua5.4 luarocks
          sudo luarocks install luacheck 2>/dev/null || true

      - name: 🔧 Install Stylelint
        if: matrix.tool == 'stylelint'
        run: |
          npm install -g stylelint \
            stylelint-config-standard \
            stylelint-config-standard-scss \
            --silent

      - name: 🔧 Install JSONLint
        if: matrix.tool == 'jsonlint'
        run: npm install -g jsonlint --silent

      - name: 🔧 Install Markdownlint
        if: matrix.tool == 'markdownlint'
        run: npm install -g markdownlint-cli --silent

      # ── Run linters ────────────────────────────────────────────────────────

      - name: 🔍 Run ShellCheck
        if: matrix.tool == 'shellcheck'
        run: |
          echo "## 🔍 ShellCheck Results" >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY || true

          FAILED=0
          WARNED=0
          PASSED=0
          TOTAL=0

          while IFS= read -r script; do
            TOTAL=$((TOTAL+1))
            OUTPUT=$(shellcheck \
              --severity=warning \
              --exclude=SC2034,SC2155,SC1091,SC2317,SC2206,SC2148,SC2086 \
              --format=json \
              "$script" 2>&1)

            EXIT=$?
            if [[ $EXIT -eq 0 ]]; then
              echo "  ✅ $script"
              PASSED=$((PASSED+1))
            else
              # Extract issues from shellcheck JSON output
              ISSUES=$(echo "$OUTPUT" | python3 -c 'import json,sys; data=json.load(sys.stdin); errors=[i for i in data if i["level"]=="error"]; warns=[i for i in data if i["level"]=="warning"]; print(f"errors={len(errors)} warnings={len(warns)}")' 2>/dev/null || echo "errors=? warnings=?")
              echo "  ⚠️  $script ($ISSUES)"
              WARNED=$((WARNED+1))
            fi
          done < <(find . -name "*.sh" -not -path "./.git/*" | sort)

          echo "" >> $GITHUB_STEP_SUMMARY || true
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY || true
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY || true
          echo "| Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY || true
          echo "| ✅ Pass | $PASSED |" >> $GITHUB_STEP_SUMMARY || true
          echo "| ⚠️ Warn | $WARNED |" >> $GITHUB_STEP_SUMMARY || true
          echo "| ❌ Fail | $FAILED |" >> $GITHUB_STEP_SUMMARY || true

          [[ $FAILED -gt 0 ]] && exit 1
          echo "✅ ShellCheck: $PASSED/$TOTAL passed"
          exit 0

      - name: 🔍 Run Bashate
        if: matrix.tool == 'bashate'
        run: |
          FAILED=0
          while IFS= read -r script; do
            if bashate --ignore E006,E010,E011,E012 "$script" 2>/dev/null; then
              echo "  ✅ $script"
            else
              echo "  ❌ $script"
              FAILED=$((FAILED+1))
            fi
          done < <(find . -name "*.sh" -not -path "./.git/*" | sort)

          [[ $FAILED -gt 0 ]] && exit 1
          echo "✅ Bashate: All scripts pass"

      - name: 🔍 Run Luacheck
        if: matrix.tool == 'luacheck'
        run: |
          if command -v luacheck >/dev/null; then
            luacheck config/nvim/lua/ \
              --globals vim \
              --no-unused-args \
              --max-line-length 150 \
              --ignore 211 212 213 631 \
              2>/dev/null || echo "⚠️  Luacheck warnings (non-blocking)"
          else
            echo "⚠️  Luacheck not available — skipping"
          fi

      - name: 🔍 Run Stylelint
        if: matrix.tool == 'stylelint'
        run: |
          # Create minimal stylelint config (inline JSON to avoid heredoc YAML issues)
          printf '{"extends":["stylelint-config-standard"],"rules":{"selector-class-pattern":null,"custom-property-pattern":null,"alpha-value-notation":null,"color-function-notation":null,"import-notation":null,"no-descending-specificity":null},"ignoreFiles":["**/*.scss","node_modules/**",".git/**"]}' > .stylelintrc.json
          FAILED=0
          while IFS= read -r file; do
            if stylelint --quiet "$file" 2>/dev/null; then
              echo "  ✅ $file"
            else
              echo "  ⚠️  $file (warnings)"
              FAILED=$((FAILED+1))
            fi
          done < <(find config -name "*.css" -not -name "colors.css" 2>/dev/null | sort)

          echo "✅ Stylelint: $FAILED warnings"

      - name: 🔍 Run JSONLint
        if: matrix.tool == 'jsonlint'
        run: |
          FAILED=0
          while IFS= read -r file; do
            if jsonlint -q "$file" 2>/dev/null; then
              echo "  ✅ $file"
            else
              echo "  ❌ $file"
              FAILED=$((FAILED+1))
            fi
          done < <(find . -name "*.json" \
            -not -path "./.git/*" \
            -not -name "lazy-lock.json" \
            -not -name "package-lock.json" \
            | sort)

          [[ $FAILED -gt 0 ]] && exit 1
          echo "✅ JSONLint: All files valid"

      - name: 🔍 Run Markdownlint
        if: matrix.tool == 'markdownlint'
        run: |
          # Create minimal markdownlint config (inline JSON to avoid heredoc YAML issues)
          printf '{"default":true,"MD013":false,"MD033":false,"MD041":false,"MD024":false,"MD036":false}' > .markdownlint.json
          markdownlint '**/*.md' \
            --ignore node_modules \
            --ignore '.git' \
            2>/dev/null || echo "⚠️  Markdownlint warnings (non-blocking)"
          echo "✅ Markdownlint: Complete"

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 3: VALIDATE FILES (MATRIX)
# ═══════════════════════════════════════════════════════════════════════════════

  validate:
    name: 📋 Validate (${{ matrix.type }})
    needs: setup
    if: needs.setup.outputs.should-skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        type:
          - shell-syntax
          - config-files
          - required-files
          - unique-features
          - app-support
          - file-structure

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: pip install --quiet rich jsonschema tomli pyyaml

      - name: 🔧 Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck jq imagemagick fish

      # ── Shell Syntax ───────────────────────────────────────────────────────
      - name: ✅ Shell syntax validation
        if: matrix.type == 'shell-syntax'
        run: |
          python3 - << 'PYEOF'
          import subprocess, sys
          from pathlib import Path
          from rich.console import Console
          from rich.table import Table
          from rich.progress import track

          console = Console()
          scripts = sorted([
              f for f in Path('.').rglob('*.sh')
              if '.git' not in str(f)
          ])

          console.print(f"\n[bold cyan]Checking {len(scripts)} shell scripts...[/bold cyan]\n")

          table = Table(show_header=True, header_style="bold magenta")
          table.add_column("Script", style="cyan", ratio=60)
          table.add_column("Syntax", justify="center")
          table.add_column("set -euo", justify="center")
          table.add_column("Header", justify="center")

          failed = 0
          for script in track(scripts, description="Checking..."):
              content = script.read_text(errors='ignore')

              # Syntax check
              result = subprocess.run(
                  ['bash', '-n', str(script)],
                  capture_output=True
              )
              syntax_ok = result.returncode == 0

              # set -euo pipefail check
              euo_ok = 'set -euo pipefail' in content

              # Header check
              header_ok = '#!/bin/bash' in content or '#!/usr/bin/env bash' in content

              status_s = "✅" if syntax_ok else "❌"
              status_e = "✅" if euo_ok else "⚠️"
              status_h = "✅" if header_ok else "⚠️"

              if not syntax_ok:
                  failed += 1
                  table.add_row(str(script), status_s, status_e, status_h,
                                style="red")
              else:
                  table.add_row(str(script), status_s, status_e, status_h)

          console.print(table)

          if failed > 0:
              console.print(f"\n[red bold]❌ {failed} script(s) have syntax errors![/red bold]")
              sys.exit(1)

          console.print(f"\n[green bold]✅ All {len(scripts)} scripts pass syntax check[/green bold]")
          PYEOF

      # ── Config Files ───────────────────────────────────────────────────────
      - name: ✅ Config file validation
        if: matrix.type == 'config-files'
        run: |
          python3 - << 'PYEOF'
          import re, json, sys
          from pathlib import Path
          from rich.console import Console

          console = Console()
          errors = 0

          # Validate JSONC
          console.print("\n[bold]Validating JSONC files...[/bold]")
          for f in sorted(Path('.').rglob('*.jsonc')):
              if '.git' in str(f):
                  continue
              try:
                  content = f.read_text()
                  content = re.sub(r'//[^\n]*', '', content)
                  content = re.sub(r'/\*.*?\*/', '', content, flags=re.DOTALL)
                  content = re.sub(r',(\s*[}\]])', r'\1', content)
                  json.loads(content)
                  console.print(f"  [green]✓[/green] {f}")
              except Exception as e:
                  console.print(f"  [red]✗[/red] {f}: {e}")
                  errors += 1

          # Validate JSON
          console.print("\n[bold]Validating JSON files...[/bold]")
          skip = {'lazy-lock.json', 'package-lock.json'}
          for f in sorted(Path('.').rglob('*.json')):
              if '.git' in str(f) or f.name in skip:
                  continue
              try:
                  json.loads(f.read_text())
                  console.print(f"  [green]✓[/green] {f}")
              except Exception as e:
                  console.print(f"  [red]✗[/red] {f}: {e}")
                  errors += 1

          # Validate TOML
          console.print("\n[bold]Validating TOML files...[/bold]")
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib

          for f in sorted(Path('.').rglob('*.toml')):
              if '.git' in str(f):
                  continue
              try:
                  with open(f, 'rb') as fh:
                      tomllib.load(fh)
                  console.print(f"  [green]✓[/green] {f}")
              except Exception as e:
                  console.print(f"  [red]✗[/red] {f}: {e}")
                  errors += 1

          # CSS brace matching
          console.print("\n[bold]Validating CSS files...[/bold]")
          for f in sorted(Path('.').rglob('*.css')):
              if '.git' in str(f):
                  continue
              content = f.read_text()
              opens = content.count('{')
              closes = content.count('}')
              if opens != closes:
                  console.print(f"  [red]✗[/red] {f}: {opens} opens vs {closes} closes")
                  errors += 1
              else:
                  console.print(f"  [green]✓[/green] {f} ({opens} blocks)")

          if errors:
              console.print(f"\n[red bold]❌ {errors} validation error(s)[/red bold]")
              sys.exit(1)
          console.print(f"\n[green bold]✅ All config files valid[/green bold]")
          PYEOF

      # ── Required Files ─────────────────────────────────────────────────────
      - name: ✅ Required files check
        if: matrix.type == 'required-files'
        run: |
          python3 - << 'PYEOF'
          import sys
          from pathlib import Path
          from rich.console import Console
          from rich.table import Table

          console = Console()

          REQUIRED = {
              "Hyprland Core": [
                  "config/hypr/hyprland.conf",
                  "config/hypr/core/env.conf",
                  "config/hypr/core/monitors.conf",
                  "config/hypr/core/input.conf",
                  "config/hypr/core/general.conf",
                  "config/hypr/core/cursor.conf",
                  "config/hypr/core/binds.conf",
              ],
              "Hyprland Modules": [
                  "config/hypr/modules/decorations.conf",
                  "config/hypr/modules/animations.conf",
                  "config/hypr/modules/blur.conf",
                  "config/hypr/modules/keybinds.conf",
                  "config/hypr/modules/autostart.conf",
                  "config/hypr/modules/submaps.conf",
                  "config/hypr/modules/media-keys.conf",
              ],
              "Hyprland Rules": [
                  "config/hypr/rules/windowrules.conf",
                  "config/hypr/rules/workspacerules.conf",
                  "config/hypr/rules/layerrules.conf",
              ],
              "Theme Engine": [
                  "config/hypr/scripts/theme/theme-engine.sh",
                  "config/hypr/scripts/theme/wallpaper-picker.sh",
              ],
              "Unique Features": [
                  "config/hypr/scripts/theme/album-art-theme.sh",
                  "config/hypr/scripts/theme/health-score.sh",
                  "config/hypr/scripts/theme/workspace-profiles.sh",
                  "config/hypr/scripts/theme/smart-wallpaper.sh",
                  "config/hypr/scripts/theme/ai-theme.sh",
                  "config/hypr/scripts/theme/theme-undo.sh",
                  "config/hypr/scripts/theme/light-theme.sh",
                  "config/hypr/scripts/theme/context-theme.sh",
                  "config/hypr/scripts/analytics/desktop-analytics.sh",
              ],
              "Hyprland Scripts": [
                  "config/hypr/scripts/media/volume.sh",
                  "config/hypr/scripts/media/brightness.sh",
                  "config/hypr/scripts/media/recorder.sh",
                  "config/hypr/scripts/system/lock.sh",
                  "config/hypr/scripts/system/power-profile.sh",
                  "config/hypr/scripts/system/reload-all.sh",
                  "config/hypr/scripts/network/wifi-toggle.sh",
                  "config/hypr/scripts/network/bluetooth-toggle.sh",
                  "config/hypr/scripts/utils/screenshot.sh",
                  "config/hypr/scripts/utils/clipboard.sh",
                  "config/hypr/scripts/utils/scratchpad.sh",
              ],
              "Waybar": [
                  "config/waybar/configs/top.jsonc",
                  "config/waybar/styles/main.css",
                  "config/waybar/styles/animations.css",
                  "config/waybar/scripts/utils/weather.sh",
                  "config/waybar/scripts/media/player.sh",
                  "config/waybar/scripts/hardware/gpu.sh",
              ],
              "Rofi": [
                  "config/rofi/config.rasi",
                  "config/rofi/scripts/launcher.sh",
                  "config/rofi/scripts/powermenu.sh",
                  "config/rofi/scripts/emoji.sh",
                  "config/rofi/scripts/window-switcher.sh",
              ],
              "Fish Shell": [
                  "config/fish/config.fish",
                  "config/fish/conf.d/30-abbr.fish",
                  "config/fish/conf.d/00-env.fish",
                  "config/fish/functions/fish_greeting.fish",
                  "config/fish/completions/ash.fish",
              ],
              "Neovim": [
                  "config/nvim/init.lua",
                  "config/nvim/lua/core/options.lua",
                  "config/nvim/lua/core/keymaps.lua",
                  "config/nvim/lua/plugins/ui.lua",
                  "config/nvim/lua/plugins/lsp.lua",
                  "config/nvim/lua/themes/ash.lua",
              ],
              "Terminals": [
                  "config/kitty/kitty.conf",
                  "config/alacritty/alacritty.toml",
                  "config/wezterm/wezterm.lua",
              ],
              "Notifications": [
                  "config/dunst/dunstrc",
                  "config/swaync/config.json",
              ],
              "Lock/Idle": [
                  "config/hypridle/hypridle.conf",
                  "config/hyprlock/hyprlock.conf",
                  "config/hyprlock/scripts/battery.sh",
                  "config/hyprlock/scripts/network.sh",
                  "config/hyprlock/scripts/player.sh",
                  "config/hyprlock/scripts/sysinfo.sh",
              ],
              "System Tools": [
                  "config/starship.toml",
                  "config/btop/btop.conf",
                  "config/mpv/mpv.conf",
              ],
              "GTK/Qt": [
                  "config/gtk-3.0/settings.ini",
                  "config/qt5ct/qt5ct.conf",
                  "config/qt6ct/qt6ct.conf",
              ],
              "AGS/EWW": [
                  "config/ags/config.js",
                  "config/eww/dashboard/eww.yuck",
              ],
