name: 🚀 ASH Dotfiles — Ultra CI/CD Pipeline

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  TRIGGERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
      - "feature/**"
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  pull_request_target:
    branches:
      - main
    types:
      - labeled

  workflow_dispatch:
    inputs:
      pipeline_mode:
        description: "🎛️ Pipeline Mode"
        required: true
        default: "standard"
        type: choice
        options:
          - standard
          - full
          - screenshots-only
          - security-only
          - benchmark-only
          - deploy-only
          - dry-run

      target_themes:
        description: "🎨 Target themes (comma-separated, 'all' for everything)"
        required: false
        default: "dark-rosepine,light-catppuccin"
        type: string

      skip_stages:
        description: "⏭️ Stages to skip (comma-separated)"
        required: false
        default: ""
        type: string

      enable_benchmarks:
        description: "📊 Run performance benchmarks"
        required: false
        default: false
        type: boolean

      deploy_preview:
        description: "🌐 Deploy preview environment"
        required: false
        default: false
        type: boolean

      debug_mode:
        description: "🐛 Enable debug output"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "0 2 * * *"
    - cron: "0 4 * * 1"
    - cron: "0 6 1 * *"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  GLOBAL CONCURRENCY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  GLOBAL ENVIRONMENT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
env:
  ASH_VERSION:               "5.0.0-omega"
  ASH_PIPELINE_VERSION:      "2.0.0"
  ASH_ENV:                   "ci"
  ASH_NO_COLOR:              "0"
  ASH_LOG_LEVEL:             "info"
  SCREENSHOTS_DIR:           "assets/screenshots/desktop"
  THEMES_DIR:                "themes/presets"
  PLUGINS_DIR:               "plugins"
  ASSETS_DIR:                "assets"
  SCREENSHOT_TARGETS: >-
    dark-rosepine
    light-catppuccin
    dark-catppuccin
    dark-tokyonight
    dark-gruvbox
    dark-nord
    dark-dracula
    dark-onedark
    dark-everforest
    dark-kanagawa
    neon-cyberpunk
    neon-synthwave
    nature-forest
    nature-ocean
    space-nebula
    retro-vaporwave
    anime-evangelion
  WEBP_QUALITY:              "92"
  WEBP_METHOD:               "6"
  AVIF_MIN_QUALITY:          "20"
  AVIF_MAX_QUALITY:          "35"
  THUMBNAIL_WIDTH:           "640"
  THUMBNAIL_HEIGHT:          "360"
  SCREENSHOT_WIDTH:          "2560"
  SCREENSHOT_HEIGHT:         "1440"
  NODE_VERSION:              "20.x"
  PYTHON_VERSION:            "3.12"
  RUST_VERSION:              "stable"
  GO_VERSION:                "1.22"
  MAX_THEME_APPLY_MS:        "2000"
  MAX_STARTUP_MS:            "500"
  MAX_SCREENSHOT_SIZE_KB:    "250"
  MAX_THUMBNAIL_SIZE_KB:     "45"
  MIN_WCAG_AA_RATIO:         "4.5"
  SLACK_WEBHOOK_URL:         ${{ secrets.SLACK_WEBHOOK_URL }}
  DISCORD_WEBHOOK_URL:       ${{ secrets.DISCORD_WEBHOOK_URL }}

defaults:
  run:
    shell: bash
    working-directory: .

# ╔══════════════════════════════════════════════════════════════════════════════
# ║  STAGE 00 ── 🧠 PIPELINE INTELLIGENCE
# ╚══════════════════════════════════════════════════════════════════════════════
jobs:

  detect-changes:
    name: "🧠 Detect Changes"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      has_screenshots:     ${{ steps.changes.outputs.screenshots }}
      has_themes:          ${{ steps.changes.outputs.themes }}
      has_plugins:         ${{ steps.changes.outputs.plugins }}
      has_scripts:         ${{ steps.changes.outputs.scripts }}
      has_configs:         ${{ steps.changes.outputs.configs }}
      has_nvim:            ${{ steps.changes.outputs.nvim }}
      has_fish:            ${{ steps.changes.outputs.fish }}
      has_waybar:          ${{ steps.changes.outputs.waybar }}
      has_hypr:            ${{ steps.changes.outputs.hypr }}
      has_api:             ${{ steps.changes.outputs.api }}
      has_web:             ${{ steps.changes.outputs.web }}
      has_workflows:       ${{ steps.changes.outputs.workflows }}
      has_security:        ${{ steps.changes.outputs.security }}
      changed_themes:      ${{ steps.theme-diff.outputs.themes }}
      changed_screenshots: ${{ steps.screenshot-diff.outputs.screenshots }}
      run_full:            ${{ steps.decide.outputs.run_full }}
      run_screenshots:     ${{ steps.decide.outputs.run_screenshots }}
      run_security:        ${{ steps.decide.outputs.run_security }}
      run_benchmarks:      ${{ steps.decide.outputs.run_benchmarks }}
      run_deploy:          ${{ steps.decide.outputs.run_deploy }}
      is_release:          ${{ steps.decide.outputs.is_release }}
      is_nightly:          ${{ steps.decide.outputs.is_nightly }}
      pipeline_mode:       ${{ steps.decide.outputs.pipeline_mode }}
      matrix_themes:       ${{ steps.matrix.outputs.themes }}
      matrix_distros:      ${{ steps.matrix.outputs.distros }}

    steps:
      - name: "📥 Checkout (sparse)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            .github
            themes
            assets/screenshots
            plugins

      - name: "🔍 Detect file changes"
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            screenshots:
              - 'assets/screenshots/**'
              - 'assets/brand/svg-masters/**'
              - 'assets/screenshots/desktop/generate-all.sh'
            themes:
              - 'themes/**'
              - 'ash-cli/engines/color-engine/**'
            plugins:
              - 'plugins/**'
            scripts:
              - 'scripts/**'
              - 'ash-cli/**'
            configs:
              - 'config/**'
            nvim:
              - 'config/nvim/**'
            fish:
              - 'config/fish/**'
            waybar:
              - 'config/waybar/**'
            hypr:
              - 'config/hypr/**'
            api:
              - 'api/**'
            web:
              - 'web/**'
            workflows:
              - '.github/workflows/**'
            security:
              - 'secrets/**'
              - '.github/workflows/security/**'
              - 'api/auth.py'

      - name: "🎨 Detect changed themes"
        id: theme-diff
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null \
            | grep '^themes/' \
            | sed 's|themes/presets/||;s|/.*||' \
            | sort -u \
            | tr '\n' ',' \
            | sed 's/,$//' \
            || echo "")
          echo "themes=${CHANGED:-none}" >> "$GITHUB_OUTPUT"
          echo "  Changed themes: ${CHANGED:-none}"

      - name: "🖼️ Detect changed screenshots"
        id: screenshot-diff
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null \
            | grep '^assets/screenshots/desktop/' \
            | sed 's|assets/screenshots/desktop/||;s|\..*||' \
            | grep -v '^$' \
            | sort -u \
            | tr '\n' ',' \
            | sed 's/,$//' \
            || echo "")
          echo "screenshots=${CHANGED:-none}" >> "$GITHUB_OUTPUT"
          echo "  Changed screenshots: ${CHANGED:-none}"

      - name: "🤔 Pipeline decision engine"
        id: decide
        env:
          EVENT_NAME:    ${{ github.event_name }}
          BRANCH:        ${{ github.ref_name }}
          PIPELINE_MODE: ${{ github.event.inputs.pipeline_mode || 'standard' }}
          CRON_EXPR:     ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          MODE="$PIPELINE_MODE"
          IS_RELEASE="false"
          IS_NIGHTLY="false"
          RUN_FULL="false"
          RUN_SCREENSHOTS="false"
          RUN_SECURITY="false"
          RUN_BENCHMARKS="${{ github.event.inputs.enable_benchmarks || 'false' }}"
          RUN_DEPLOY="false"

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            case "${CRON_EXPR:-}" in
              "0 2 * * *") IS_NIGHTLY="true"; MODE="full";          RUN_FULL="true"         ;;
              "0 4 * * 1") MODE="security-only";                     RUN_SECURITY="true"     ;;
              "0 6 1 * *") MODE="benchmark-only";                    RUN_BENCHMARKS="true"   ;;
            esac
          fi

          if [[ "$BRANCH" =~ ^release/ ]]; then
            IS_RELEASE="true"
            RUN_FULL="true"
            RUN_SCREENSHOTS="true"
            RUN_SECURITY="true"
            RUN_BENCHMARKS="true"
            RUN_DEPLOY="true"
          fi

          if [[ "$BRANCH" == "main" ]] && [[ "$EVENT_NAME" == "push" ]]; then
            RUN_SCREENSHOTS="true"
            RUN_SECURITY="true"
          fi

          case "$MODE" in
            full)
              RUN_FULL="true"
              RUN_SCREENSHOTS="true"
              RUN_SECURITY="true"
              RUN_BENCHMARKS="true"
              ;;
            screenshots-only) RUN_SCREENSHOTS="true" ;;
            security-only)    RUN_SECURITY="true"    ;;
            benchmark-only)   RUN_BENCHMARKS="true"  ;;
            deploy-only)      RUN_DEPLOY="true"       ;;
          esac

          {
            echo "run_full=$RUN_FULL"
            echo "run_screenshots=$RUN_SCREENSHOTS"
            echo "run_security=$RUN_SECURITY"
            echo "run_benchmarks=$RUN_BENCHMARKS"
            echo "run_deploy=$RUN_DEPLOY"
            echo "is_release=$IS_RELEASE"
            echo "is_nightly=$IS_NIGHTLY"
            echo "pipeline_mode=$MODE"
          } >> "$GITHUB_OUTPUT"

          echo ""
          echo "  ╔═══════════════════════════════════╗"
          echo "  ║  Pipeline Decision Summary         ║"
          echo "  ╠═══════════════════════════════════╣"
          echo "  ║  Mode:        $MODE"
          echo "  ║  Full:        $RUN_FULL"
          echo "  ║  Screenshots: $RUN_SCREENSHOTS"
          echo "  ║  Security:    $RUN_SECURITY"
          echo "  ║  Benchmarks:  $RUN_BENCHMARKS"
          echo "  ║  Deploy:      $RUN_DEPLOY"
          echo "  ║  Release:     $IS_RELEASE"
          echo "  ║  Nightly:     $IS_NIGHTLY"
          echo "  ╚═══════════════════════════════════╝"

      - name: "📐 Build job matrices"
        id: matrix
        env:
          TARGET_THEMES: ${{ github.event.inputs.target_themes || 'all' }}
        run: |
          set -euo pipefail

          if [[ "$TARGET_THEMES" == "all" ]]; then
            THEMES_JSON='[
              "dark-rosepine",
              "light-catppuccin",
              "dark-catppuccin",
              "dark-tokyonight",
              "dark-gruvbox",
              "dark-nord",
              "dark-dracula",
              "dark-onedark",
              "dark-everforest",
              "dark-kanagawa",
              "neon-cyberpunk",
              "neon-synthwave",
              "nature-forest",
              "nature-ocean",
              "space-nebula",
              "retro-vaporwave",
              "anime-evangelion"
            ]'
          else
            THEMES_JSON="["
            IFS=',' read -ra THEME_LIST <<< "$TARGET_THEMES"
            for i in "${!THEME_LIST[@]}"; do
              THEME="${THEME_LIST[$i]// /}"
              [[ $i -gt 0 ]] && THEMES_JSON+=","
              THEMES_JSON+="\"$THEME\""
            done
            THEMES_JSON+="]"
          fi

          DISTROS_JSON='[
            {"name":"arch",     "image":"archlinux:latest",           "pkg":"pacman"},
            {"name":"fedora",   "image":"fedora:40",                  "pkg":"dnf"},
            {"name":"ubuntu",   "image":"ubuntu:24.04",               "pkg":"apt"},
            {"name":"opensuse", "image":"opensuse/tumbleweed:latest",  "pkg":"zypper"}
          ]'

          echo "themes=$(echo "$THEMES_JSON"  | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "distros=$(echo "$DISTROS_JSON" | jq -c .)" >> "$GITHUB_OUTPUT"

          echo "  Theme matrix:  $(echo "$THEMES_JSON"  | jq 'length') themes"
          echo "  Distro matrix: $(echo "$DISTROS_JSON" | jq 'length') distros"


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  STAGE 01 ── 🔒 SECURITY GATE
# ╚══════════════════════════════════════════════════════════════════════════════

  security-secrets:
    name: "🔒 Secret Scanning"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: detect-changes
    permissions:
      contents: read
      security-events: write

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔍 Gitleaks"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          config-path: .gitleaks.toml

      - name: "🔍 TruffleHog"
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: >-
            --debug
            --only-verified
            --json
            --no-update

      - name: "📊 Upload secret scan results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-results-${{ github.run_id }}
          path: |
            gitleaks-report.json
            trufflehog-report.json
          retention-days: 30

  security-deps:
    name: "🛡️ Dependency Audit"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: detect-changes
    permissions:
      contents: read
      security-events: write

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: "🔍 NPM audit"
        working-directory: web
        run: |
          npm audit --audit-level=moderate --json > npm-audit.json 2>&1 || true
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit.json)
          HIGH=$(jq '.metadata.vulnerabilities.high     // 0' npm-audit.json)
          echo "  Critical: $CRITICAL"
          echo "  High:     $HIGH"
          if [[ "$CRITICAL" -gt 0 ]]; then
            echo "  FAIL — critical vulnerabilities found"
            exit 1
          fi

      - name: "🔍 Trivy filesystem scan"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"

      - name: "📤 Upload Trivy SARIF"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: "🐍 Safety — Python deps"
        working-directory: api
        run: |
          pip install safety --quiet
          safety check \
            --file requirements.txt \
            --json \
            --output safety-report.json \
            --continue-on-error || true
          VULNS=$(jq 'length' safety-report.json 2>/dev/null || echo 0)
          echo "  Python vulnerabilities: $VULNS"

      - name: "📊 Upload results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-dep-results-${{ github.run_id }}
          path: |
            web/npm-audit.json
            trivy-results.sarif
            api/safety-report.json
          retention-days: 30

  security-codeql:
    name: "🔬 CodeQL (${{ matrix.language }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: detect-changes
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🔬 Initialize CodeQL"
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: "🏗️ Autobuild"
        uses: github/codeql-action/autobuild@v3

      - name: "🔍 Analyze"
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-${{ matrix.language }}


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  STAGE 02 ── ✅ LINTING & VALIDATION
# ╚══════════════════════════════════════════════════════════════════════════════

  lint-shell:
    name: "🐚 ShellCheck"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    needs: [detect-changes, security-secrets]
    if: |
      needs.detect-changes.outputs.has_scripts == 'true' ||
      needs.detect-changes.outputs.run_full    == 'true'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install ShellCheck"
        run: |
          sudo apt-get install -y shellcheck --no-install-recommends
          shellcheck --version

      - name: "🔍 ShellCheck — all scripts"
        run: |
          set -euo pipefail
          FAILED=0; PASS=0; WARN=0
          ERRORS=()

          mapfile -t SCRIPTS < <(
            find . \
              -type f \( -name "*.sh" -o -name "*.bash" \) \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              | sort
          )

          for script in "${SCRIPTS[@]}"; do
            result=$(shellcheck \
              --shell=bash \
              --severity=warning \
              --format=gcc \
              --exclude=SC1091,SC2034,SC2155 \
              "$script" 2>&1) || true

            if echo "$result" | grep -q "error:"; then
              echo "  FAIL: $script"
              echo "$result" | grep "error:" | head -5
              ERRORS+=("$script")
              (( FAILED++ ))
            elif echo "$result" | grep -q "warning:"; then
              (( WARN++ ))
            else
              (( PASS++ ))
            fi
          done

          echo ""
          echo "  ShellCheck: $PASS passed  $WARN warnings  $FAILED failed"
          echo "  Total: ${#SCRIPTS[@]} scripts"

          if [[ $FAILED -gt 0 ]]; then
            for f in "${ERRORS[@]}"; do echo "  FAIL: $f"; done
            exit 1
          fi
          echo "  All scripts passed"

  lint-lua:
    name: "🌙 Luacheck"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [detect-changes, security-secrets]
    if: |
      needs.detect-changes.outputs.has_nvim == 'true' ||
      needs.detect-changes.outputs.run_full == 'true'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install Luacheck"
        run: |
          sudo apt-get install -y lua5.4 luarocks --no-install-recommends
          sudo luarocks install luacheck
          luacheck --version

      - name: "🔍 Luacheck"
        run: |
          luacheck config/nvim/ \
            --config .luacheckrc \
            --formatter plain \
            --max-line-length 120 \
            --globals vim \
            --no-unused-args \
            --codes \
            2>&1 | tee luacheck-results.txt

          ERRORS=$(grep -c "error" luacheck-results.txt || true)
          echo "  Luacheck: $ERRORS errors"
          [[ "$ERRORS" -gt 0 ]] && exit 1 || echo "  Passed"

      - name: "📊 Upload results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luacheck-results-${{ github.run_id }}
          path: luacheck-results.txt
          retention-days: 7

  lint-configs:
    name: "📋 Config Validation (JSON/YAML/TOML)"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: [detect-changes, security-secrets]

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "⚙️ Install validators"
        run: |
          npm install -g \
            ajv-cli \
            jsonlint \
            js-yaml \
            markdownlint-cli \
            @taplo/cli \
            --silent
          pip install yamllint --quiet

      - name: "🔍 JSON validation"
        run: |
          FAILED=0; PASS=0
          while IFS= read -r -d '' file; do
            if python3 -c "
          import json, sys
          try:
              json.load(open('$file'))
          except json.JSONDecodeError as e:
              print('FAIL: $file:', e)
              sys.exit(1)
          " 2>&1; then
              (( PASS++ ))
            else
              (( FAILED++ ))
            fi
          done < <(find . \
            -name "*.json" \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            ! -path "./data/analytics/*" \
            ! -name "*.min.json" \
            -print0)
          echo "  JSON: $PASS passed  $FAILED failed"
          [[ $FAILED -gt 0 ]] && exit 1 || echo "  All JSON valid"

      - name: "🔍 JSONC validation"
        run: |
          FAILED=0
          while IFS= read -r -d '' file; do
            if ! node -e "
              const fs = require('fs');
              const content = fs.readFileSync('$file', 'utf8')
                .replace(/\/\/[^\n]*/g, '')
                .replace(/\/\*[\s\S]*?\*\//g, '');
              try { JSON.parse(content); }
              catch(e) { console.error('$file:', e.message); process.exit(1); }
            " 2>&1; then
              (( FAILED++ ))
            fi
          done < <(find . -name "*.jsonc" ! -path "./.git/*" -print0)
          echo "  JSONC: $FAILED failures"
          [[ $FAILED -gt 0 ]] && exit 1 || echo "  All JSONC valid"

      - name: "🔍 YAML validation"
        run: |
          yamllint \
            --config-file .yamllint.yml \
            --format colored \
            $(find . \( -name "*.yml" -o -name "*.yaml" \) \
              | grep -v ".git" \
              | grep -v "node_modules" \
              | head -200) \
            2>&1 | tee yamllint-results.txt
          ERRORS=$(grep -c "error" yamllint-results.txt || true)
          echo "  YAML errors: $ERRORS"
          [[ "$ERRORS" -gt 0 ]] && exit 1 || echo "  YAML valid"

      - name: "🔍 TOML validation"
        run: |
          find . -name "*.toml" ! -path "./.git/*" ! -path "./node_modules/*" \
            | while read -r f; do
              taplo check "$f" 2>&1 || { echo "  FAIL: $f"; exit 1; }
            done
          echo "  TOML valid"

      - name: "🔍 Theme schema validation"
        run: |
          FAILED=0
          while IFS= read -r -d '' colors_file; do
            theme_name=$(basename "$(dirname "$colors_file")")
            ajv validate \
              --spec=draft2020 \
              -s themes/schema/colors-schema.json \
              -d "$colors_file" \
              2>&1 || {
                echo "  Schema fail: $theme_name"
                (( FAILED++ ))
              }
          done < <(find themes/presets -name "colors.json" -print0)
          echo "  Theme schemas: $FAILED failures"
          [[ $FAILED -gt 0 ]] && exit 1 || echo "  All schemas valid"

      - name: "🔍 Markdown lint"
        run: |
          markdownlint \
            --config .markdownlint.yml \
            --ignore node_modules \
            --ignore '.git' \
            '**/*.md' 2>&1 | tee markdownlint-results.txt || true
          echo "  Markdown checked"

      - name: "📊 Upload results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-config-results-${{ github.run_id }}
          path: |
            yamllint-results.txt
            markdownlint-results.txt
          retention-days: 7

  lint-typescript:
    name: "💙 TypeScript & ESLint"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    needs: [detect-changes, security-secrets]
    if: |
      needs.detect-changes.outputs.has_web == 'true' ||
      needs.detect-changes.outputs.run_full == 'true'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: "📦 Install"
        working-directory: web
        run: npm ci --prefer-offline

      - name: "🔍 TypeScript type check"
        working-directory: web
        run: |
          npx tsc --noEmit --strict --pretty 2>&1 | tee ts-results.txt
          ERRORS=$(grep -c "error TS" ts-results.txt || true)
          echo "  TypeScript errors: $ERRORS"
          [[ "$ERRORS" -gt 0 ]] && exit 1 || echo "  TypeScript OK"

      - name: "🔍 ESLint"
        working-directory: web
        run: |
          npx eslint \
            --ext .ts,.tsx \
            --format stylish \
            --max-warnings 10 \
            --report-unused-disable-directives \
            src/ 2>&1 | tee eslint-results.txt
          ERRORS=$(grep -c "error" eslint-results.txt || true)
          echo "  ESLint errors: $ERRORS"

      - name: "🔍 Prettier check"
        working-directory: web
        run: |
          npx prettier \
            --check \
            --log-level warn \
            "src/**/*.{ts,tsx,css}" 2>&1 || true
          echo "  Prettier checked"

      - name: "📊 Upload results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-results-${{ github.run_id }}
          path: |
            web/ts-results.txt
            web/eslint-results.txt
          retention-days: 7

  lint-python:
    name: "🐍 Python — Ruff & MyPy"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [detect-changes, security-secrets]
    if: |
      needs.detect-changes.outputs.has_api == 'true' ||
      needs.detect-changes.outputs.run_full == 'true'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install linting tools"
        run: pip install ruff mypy black bandit --quiet

      - name: "🔍 Ruff"
        working-directory: api
        run: |
          ruff check --format=github --output-format=text . 2>&1 | tee ruff-results.txt
          ERRORS=$(grep -c "error" ruff-results.txt || true)
          echo "  Ruff errors: $ERRORS"
          [[ "$ERRORS" -gt 10 ]] && exit 1 || echo "  Ruff passed"

      - name: "🔍 MyPy"
        working-directory: api
        run: |
          mypy --ignore-missing-imports --strict --pretty . 2>&1 | tee mypy-results.txt || true
          echo "  MyPy done"

      - name: "🔍 Bandit"
        working-directory: api
        run: |
          bandit -r . -ll -f json -o bandit-results.json --exclude ./.venv 2>&1 || true
          HIGH=$(python3 -c "
          import json, sys
          try:
              d = json.load(open('bandit-results.json'))
              print(sum(1 for r in d.get('results', []) if r['issue_severity'] == 'HIGH'))
          except Exception:
              print(0)
          " 2>/dev/null || echo 0)
          echo "  Bandit HIGH: $HIGH"
          [[ "$HIGH" -gt 0 ]] && echo "  High-severity issues found"

      - name: "🔍 Black"
        working-directory: api
        run: |
          black --check --diff . 2>&1 | head -50 || true
          echo "  Black checked"


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  STAGE 03 ── 🖼️  SCREENSHOT ASSET PIPELINE
# ╚══════════════════════════════════════════════════════════════════════════════

  screenshots-validate-svg:
    name: "🎨 SVG Validation"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [detect-changes, lint-configs]
    if: |
      needs.detect-changes.outputs.has_screenshots == 'true' ||
      needs.detect-changes.outputs.run_screenshots == 'true' ||
      needs.detect-changes.outputs.run_full        == 'true'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install SVG tools"
        run: |
          sudo apt-get install -y libxml2-utils --no-install-recommends
          npm install -g svgo --silent
          pip install scour --quiet
          echo "  svgo: $(svgo --version)"

      - name: "🔍 XMLlint validation"
        run: |
          FAILED=0; PASS=0
          while IFS= read -r -d '' svg; do
            if xmllint --noout "$svg" 2>/dev/null; then
              (( PASS++ ))
            else
              echo "  FAIL: $svg"
              (( FAILED++ ))
            fi
          done < <(find assets/brand/svg-masters -name "*.svg" -print0 2>/dev/null || true)
          echo "  SVG: $PASS passed  $FAILED failed"
          [[ $FAILED -gt 0 ]] && exit 1 || echo "  All SVGs valid"

      - name: "⚡ SVGO dry-run"
        run: |
          while IFS= read -r -d '' svg; do
            ORIG=$(wc -c < "$svg")
            OPT=$(svgo \
              --input "$svg" \
              --output /dev/stdout 2>/dev/null | wc -c)
            if [[ $ORIG -gt 0 && $OPT -gt 0 ]]; then
              SAVING=$(( (ORIG - OPT) * 100 / ORIG ))
              echo "  $(basename "$svg"): ${SAVING}% savings"
            fi
          done < <(find assets/brand/svg-masters -name "*.svg" -print0 2>/dev/null || true)
          echo "  SVG optimization analysis done"

  screenshots-generate:
    name: "📸 Generate — ${{ matrix.theme }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [detect-changes, screenshots-validate-svg]
    if: |
      needs.detect-changes.outputs.has_screenshots == 'true' ||
      needs.detect-changes.outputs.run_screenshots == 'true' ||
      needs.detect-changes.outputs.run_full        == 'true'

    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        theme: ${{ fromJSON(needs.detect-changes.outputs.matrix_themes) }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install rendering tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            librsvg2-bin \
            imagemagick \
            webp \
            libavif-bin \
            optipng \
            pngquant \
            --no-install-recommends

          RESVG_VERSION="0.42.0"
          curl -fsSL \
            "https://github.com/RazrFalcon/resvg/releases/download/v${RESVG_VERSION}/resvg-linux-x86_64.zip" \
            -o /tmp/resvg.zip 2>/dev/null || true
          if [[ -f /tmp/resvg.zip ]]; then
            unzip -q /tmp/resvg.zip -d /tmp/resvg || true
            sudo mv /tmp/resvg/resvg /usr/local/bin/ 2>/dev/null || true
          fi

          command -v resvg       && resvg       --version || echo "  resvg: unavailable"
          command -v rsvg-convert && echo "  rsvg-convert: ok"
          command -v cwebp        && cwebp --version | head -1

      - name: "🎨 Load theme palette"
        id: palette
        run: |
          set -euo pipefail
          THEME="${{ matrix.theme }}"
          COLORS="themes/presets/${THEME}/colors.json"

          if [[ -f "$COLORS" ]]; then
            BG=$(jq -r '.bg     // "#1e1e2e"' "$COLORS")
            FG=$(jq -r '.fg     // "#cdd6f4"' "$COLORS")
            ACCENT=$(jq -r '.accent // "#89b4fa"' "$COLORS")
            GREEN=$(jq -r  '.green  // "#a6e3a1"' "$COLORS")
            BLUE=$(jq -r   '.blue   // "#89b4fa"' "$COLORS")
          else
            case "$THEME" in
              dark-rosepine)
                BG="#191724"; FG="#e0def4"; ACCENT="#c4a7e7"
                GREEN="#31748f"; BLUE="#9ccfd8" ;;
              light-catppuccin)
                BG="#eff1f5"; FG="#4c4f69"; ACCENT="#1e66f5"
                GREEN="#40a02b"; BLUE="#1e66f5" ;;
              *)
                BG="#1e1e2e"; FG="#cdd6f4"; ACCENT="#89b4fa"
                GREEN="#a6e3a1"; BLUE="#89b4fa" ;;
            esac
          fi

          { echo "bg=$BG"; echo "fg=$FG"; echo "accent=$ACCENT"
            echo "green=$GREEN"; echo "blue=$BLUE"; } >> "$GITHUB_OUTPUT"
          echo "  Theme: $THEME | BG: $BG | Accent: $ACCENT"

      - name: "🖼️ Generate SVG master"
        run: |
          set -euo pipefail
          THEME="${{ matrix.theme }}"
          SVG_DIR="assets/brand/svg-masters"
          SVG_FILE="${SVG_DIR}/${THEME}.svg"
          SCRIPT="assets/screenshots/desktop/generate-all.sh"
          mkdir -p "$SVG_DIR"

          if [[ -f "$SCRIPT" ]]; then
            bash "$SCRIPT" generate_desktop_svg "$THEME" > "$SVG_FILE"
            echo "  SVG via pipeline script"
          elif [[ -f "$SVG_FILE" ]]; then
            echo "  Using existing SVG"
          else
            echo "  Creating placeholder SVG"
            BG="${{ steps.palette.outputs.bg }}"
            FG="${{ steps.palette.outputs.fg }}"
            ACCENT="${{ steps.palette.outputs.accent }}"
            cat > "$SVG_FILE" << SVGEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
            <rect width="2560" height="1440" fill="${BG}"/>
            <text x="1280" y="720" font-family="monospace" font-size="48"
                  text-anchor="middle" fill="${FG}" opacity="0.6">
              ASH Dotfiles — ${THEME}
            </text>
            <text x="1280" y="790" font-family="monospace" font-size="24"
                  text-anchor="middle" fill="${ACCENT}" opacity="0.5">
              v5.0 OMEGA
            </text>
          </svg>
          SVGEOF
          fi
          echo "  SVG size: $(wc -c < "$SVG_FILE") bytes"

      - name: "🖼️ Render SVG → PNG"
        run: |
          set -euo pipefail
          THEME="${{ matrix.theme }}"
          SVG="assets/brand/svg-masters/${THEME}.svg"
          PNG="assets/screenshots/desktop/${THEME}.png"
          mkdir -p "assets/screenshots/desktop"

          W="${{ env.SCREENSHOT_WIDTH }}"
          H="${{ env.SCREENSHOT_HEIGHT }}"

          if command -v resvg &>/dev/null; then
            resvg --width "$W" --height "$H" --dpi 144 "$SVG" "$PNG"
          elif command -v rsvg-convert &>/dev/null; then
            rsvg-convert --width="$W" --height="$H" \
              --keep-aspect-ratio --format=png --output="$PNG" "$SVG"
          else
            convert -size "${W}x${H}" -density 144 "$SVG" "$PNG"
          fi

          [[ -f "$PNG" ]] || { echo "  PNG render failed"; exit 1; }
          echo "  PNG: $(wc -c < "$PNG") bytes"

      - name: "🌐 Convert PNG → WebP"
        run: |
          set -euo pipefail
          THEME="${{ matrix.theme }}"
          PNG="assets/screenshots/desktop/${THEME}.png"
          WEBP="assets/screenshots/desktop/${THEME}.webp"

          cwebp \
            -q "${{ env.WEBP_QUALITY }}" \
            -m "${{ env.WEBP_METHOD }}" \
            -sharp_yuv \
            -metadata none \
            -hint photo \
            -mt \
            "$PNG" -o "$WEBP"

          WEBP_SIZE=$(wc -c < "$WEBP")
          MAX=$(( ${{ env.MAX_SCREENSHOT_SIZE_KB }} * 1024 ))
          echo "  WebP: $(numfmt --to=iec "$WEBP_SIZE")"

          if [[ $WEBP_SIZE -gt $MAX ]]; then
            echo "  Re-encoding at lower quality..."
            cwebp -q 82 -m 6 -sharp_yuv -metadata none "$PNG" -o "$WEBP"
            echo "  Re-encoded: $(numfmt --to=iec "$(wc -c < "$WEBP")")"
          fi

      - name: "🎯 Generate thumbnail"
        run: |
          set -euo pipefail
          THEME="${{ matrix.theme }}"
          PNG="assets/screenshots/desktop/${THEME}.png"
          THUMB_DIR="assets/screenshots/desktop/thumbnails"
          mkdir -p "$THUMB_DIR"

          W="${{ env.THUMBNAIL_WIDTH }}"
          H="${{ env.THUMBNAIL_HEIGHT }}"

          convert "$PNG" \
            -filter Lanczos \
            -resize "${W}x${H}^" \
            -gravity center \
            -extent "${W}x${H}" \
            -strip \
            PNG:- \
            | cwebp -q 82 -m 5 -sharp_yuv -metadata none - \
                -o "$THUMB_DIR/${THEME}-thumb.webp"

          echo "  Thumbnail: $(numfmt --to=iec "$(wc -c < "$THUMB_DIR/${THEME}-thumb.webp")")"

      - name: "🎯 Generate AVIF"
        run: |
          THEME="${{ matrix.theme }}"
          PNG="assets/screenshots/desktop/${THEME}.png"
          AVIF_DIR="assets/screenshots/desktop/avif"
          mkdir -p "$AVIF_DIR"

          if command -v avifenc &>/dev/null; then
            avifenc \
              --min "${{ env.AVIF_MIN_QUALITY }}" \
              --max "${{ env.AVIF_MAX_QUALITY }}" \
              --speed 4 \
              --jobs all \
              "$PNG" "$AVIF_DIR/${THEME}.avif"
            echo "  AVIF: $(numfmt --to=iec "$(wc -c < "$AVIF_DIR/${THEME}.avif")")"
          else
            echo "  avifenc unavailable — skipping"
            touch "$AVIF_DIR/${THEME}.avif.skip"
          fi

      - name: "🌟 Retina thumbnail (@2x)"
        run: |
          THEME="${{ matrix.theme }}"
          PNG="assets/screenshots/desktop/${THEME}.png"
          THUMB_DIR="assets/screenshots/desktop/thumbnails"

          convert "$PNG" \
            -filter Lanczos \
            -resize "1280x720^" \
            -gravity center \
            -extent "1280x720" \
            -strip \
            PNG:- \
            | cwebp -q 85 -m 5 -sharp_yuv -metadata none - \
                -o "$THUMB_DIR/${THEME}-thumb@2x.webp"
          echo "  @2x thumbnail done"

      - name: "🔍 WCAG contrast check"
        run: |
          THEME="${{ matrix.theme }}"
          ACCENT="${{ steps.palette.outputs.accent }}"
          BG="${{ steps.palette.outputs.bg }}"
          FG="${{ steps.palette.outputs.fg }}"

          python3 << PYEOF
          import sys

          def hex_to_rgb(h):
              h = h.lstrip('#')
              return tuple(int(h[i:i+2], 16) / 255.0 for i in (0, 2, 4))

          def linearize(c):
              return c / 12.92 if c <= 0.04045 else ((c + 0.055) / 1.055) ** 2.4

          def luminance(h):
              r, g, b = (linearize(c) for c in hex_to_rgb(h))
              return 0.2126 * r + 0.7152 * g + 0.0722 * b

          def contrast(c1, c2):
              l1, l2 = luminance(c1), luminance(c2)
              lighter, darker = max(l1, l2), min(l1, l2)
              return (lighter + 0.05) / (darker + 0.05)

          accent = "${ACCENT}"
          bg     = "${BG}"
          fg     = "${FG}"
          theme  = "${THEME}"

          pairs = [("fg on bg", fg, bg), ("accent on bg", accent, bg)]
          failed = False

          print("  WCAG Contrast — " + theme)
          print("  " + "-" * 48)

          for label, c1, c2 in pairs:
              try:
                  ratio = contrast(c1, c2)
                  aa  = "OK AA"   if ratio >= 4.5 else "FAIL AA"
                  aaa = "OK AAA"  if ratio >= 7.0 else "warn AAA"
                  print("  " + label + "  " + str(round(ratio, 2)) + ":1  " + aa + "  " + aaa)
                  if ratio < 3.0:
                      failed = True
              except Exception as e:
                  print("  " + label + ": error — " + str(e))

          sys.exit(1 if failed else 0)
          PYEOF

      - name: "📊 Asset manifest entry"
        run: |
          set -euo pipefail
          THEME="${{ matrix.theme }}"
          WEBP="assets/screenshots/desktop/${THEME}.webp"
          THUMB="assets/screenshots/desktop/thumbnails/${THEME}-thumb.webp"

          WEBP_SIZE=$(wc -c < "$WEBP"  2>/dev/null || echo 0)
          THUMB_SIZE=$(wc -c < "$THUMB" 2>/dev/null || echo 0)
          WEBP_HASH=$(sha256sum "$WEBP"  2>/dev/null | cut -d' ' -f1 || echo "")
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RUN_ID="${{ github.run_id }}"
          COMMIT="${{ github.sha }}"
          W="${{ env.SCREENSHOT_WIDTH }}"
          H="${{ env.SCREENSHOT_HEIGHT }}"
          Q="${{ env.WEBP_QUALITY }}"
          TW="${{ env.THUMBNAIL_WIDTH }}"
          TH="${{ env.THUMBNAIL_HEIGHT }}"
          OS="${{ runner.os }}"

          cat > "assets/screenshots/desktop/.manifest-${THEME}.json" << JSONEOF
          {
            "theme":        "$THEME",
            "version":      "${{ env.ASH_VERSION }}",
            "generated_at": "$TS",
            "commit":       "$COMMIT",
            "files": {
              "webp": {
                "path":       "${THEME}.webp",
                "size_bytes": $WEBP_SIZE,
                "sha256":     "$WEBP_HASH",
                "width":      $W,
                "height":     $H,
                "quality":    $Q
              },
              "thumbnail": {
                "path":       "thumbnails/${THEME}-thumb.webp",
                "size_bytes": $THUMB_SIZE,
                "width":      $TW,
                "height":     $TH
              }
            },
            "colors": {
              "bg":     "${{ steps.palette.outputs.bg }}",
              "fg":     "${{ steps.palette.outputs.fg }}",
              "accent": "${{ steps.palette.outputs.accent }}"
            },
            "pipeline": {
              "runner":       "$OS",
              "workflow_run": "$RUN_ID"
            }
          }
          JSONEOF
          echo "  Manifest written"

      - name: "📤 Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.theme }}-${{ github.run_id }}
          path: |
            assets/screenshots/desktop/${{ matrix.theme }}.webp
            assets/screenshots/desktop/${{ matrix.theme }}.png
            assets/screenshots/desktop/thumbnails/${{ matrix.theme }}-thumb.webp
            assets/screenshots/desktop/thumbnails/${{ matrix.theme }}-thumb@2x.webp
            assets/screenshots/desktop/avif/${{ matrix.theme }}.avif
            assets/screenshots/desktop/.manifest-${{ matrix.theme }}.json
          retention-days: 30
          compression-level: 0

  screenshots-aggregate:
    name: "📦 Aggregate Screenshots"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [detect-changes, screenshots-generate]
    if: always() && needs.screenshots-generate.result != 'skipped'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📥 Download all artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: screenshot-*-${{ github.run_id }}
          path: assets/screenshots/desktop/
          merge-multiple: true

      - name: "📊 Build consolidated manifest"
        run: |
          set -euo pipefail
          OUTPUT="assets/screenshots/desktop/manifest.json"
          THEMES_JSON="{"
          FIRST=true

          for manifest in assets/screenshots/desktop/.manifest-*.json; do
            [[ -f "$manifest" ]] || continue
            THEME=$(jq -r '.theme' "$manifest")
            if [[ "$FIRST" == "true" ]]; then FIRST=false; else THEMES_JSON+=","; fi
            THEMES_JSON+="\"$THEME\":"
            THEMES_JSON+=$(cat "$manifest")
          done
          THEMES_JSON+="}"

          TOTAL=$(ls assets/screenshots/desktop/.manifest-*.json 2>/dev/null | wc -l)
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"
          RUN_ID="${{ github.run_id }}"
          W="${{ env.SCREENSHOT_WIDTH }}"
          H="${{ env.SCREENSHOT_HEIGHT }}"

          cat > "$OUTPUT" << JSONEOF
          {
            "version":      "${{ env.ASH_VERSION }}",
            "generated_at": "$TS",
            "commit":       "$COMMIT",
            "branch":       "$BRANCH",
            "pipeline_run": "$RUN_ID",
            "total_themes": $TOTAL,
            "resolution":   { "width": $W, "height": $H },
            "themes":       $THEMES_JSON
          }
          JSONEOF

          echo "  Manifest: $TOTAL themes"

      - name: "📊 Asset size report"
        run: |
          echo ""
          echo "  ╔══════════════════════════════════════════════════╗"
          echo "  ║   Screenshot Asset Report                         ║"
          echo "  ╠══════════════════════════════════════════════════╣"
          printf "  ║  %-28s %8s %8s ║\n" "Theme" "WebP" "Thumb"
          echo "  ╠══════════════════════════════════════════════════╣"

          TOTAL_WEBP=0; TOTAL_THUMB=0

          for webp in assets/screenshots/desktop/*.webp; do
            [[ -f "$webp" ]] || continue
            theme=$(basename "${webp%.webp}")
            ws=$(wc -c < "$webp" 2>/dev/null || echo 0)
            thumb="assets/screenshots/desktop/thumbnails/${theme}-thumb.webp"
            ts=$(wc -c < "$thumb" 2>/dev/null || echo 0)
            TOTAL_WEBP=$(( TOTAL_WEBP + ws ))
            TOTAL_THUMB=$(( TOTAL_THUMB + ts ))
            printf "  ║  %-28s %8s %8s ║\n" \
              "$theme" \
              "$(numfmt --to=iec "$ws"  2>/dev/null || echo "${ws}B")" \
              "$(numfmt --to=iec "$ts"  2>/dev/null || echo "${ts}B")"
          done

          echo "  ╠══════════════════════════════════════════════════╣"
          printf "  ║  %-28s %8s %8s ║\n" \
            "TOTAL" \
            "$(numfmt --to=iec "$TOTAL_WEBP")" \
            "$(numfmt --to=iec "$TOTAL_THUMB")"
          echo "  ╚══════════════════════════════════════════════════╝"

      - name: "🔍 Validate WebP files"
        run: |
          FAILED=0
          for webp in assets/screenshots/desktop/*.webp; do
            [[ -f "$webp" ]] || continue
            theme=$(basename "${webp%.webp}")
            python3 -c "
          data = open('$webp', 'rb').read()
          assert data[:4] == b'RIFF', 'Not RIFF'
          assert data[8:12] == b'WEBP', 'Not WebP'
          print('  OK: $theme')
          " 2>&1 || { echo "  FAIL: $theme"; (( FAILED++ )); }
          done
          [[ $FAILED -gt 0 ]] && exit 1 || echo "  All WebP valid"

      - name: "📤 Upload consolidated assets"
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-all-${{ github.run_id }}
          path: |
            assets/screenshots/desktop/*.webp
            assets/screenshots/desktop/thumbnails/
            assets/screenshots/desktop/avif/
            assets/screenshots/desktop/manifest.json
          retention-days: 90
          compression-level: 0

  screenshots-regression:
    name: "👁️ Visual Regression"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [screenshots-aggregate]
    if: github.event_name == 'pull_request'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "📥 Download new screenshots"
        uses: actions/download-artifact@v4
        with:
          name: screenshots-all-${{ github.run_id }}
          path: screenshots-new/

      - name: "📥 Download baseline screenshots"
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          name: screenshots-all-*
          path: screenshots-baseline/
          if_no_artifact_found: warn

      - name: "🔍 SSIM comparison"
        run: |
          set -euo pipefail
          REPORT="regression-report.md"

          echo "# Visual Regression Report" > "$REPORT"
          echo "" >> "$REPORT"
          echo "| Theme | SSIM | Status |" >> "$REPORT"
          echo "|-------|------|--------|" >> "$REPORT"

          for new_webp in screenshots-new/*.webp; do
            [[ -f "$new_webp" ]] || continue
            theme=$(basename "${new_webp%.webp}")
            baseline="screenshots-baseline/${theme}.webp"

            if [[ ! -f "$baseline" ]]; then
              echo "| $theme | N/A | New |" >> "$REPORT"
              continue
            fi

            SSIM=$(python3 << PYEOF 2>/dev/null || echo "N/A"
          try:
              from PIL import Image
              import numpy as np

              def ssim(p1, p2):
                  i1 = np.array(Image.open(p1).convert('RGB').resize((256, 144))).astype(float)
                  i2 = np.array(Image.open(p2).convert('RGB').resize((256, 144))).astype(float)
                  mu1, mu2 = i1.mean(), i2.mean()
                  s1, s2   = i1.std(),  i2.std()
                  s12 = np.mean((i1 - mu1) * (i2 - mu2))
                  C1, C2 = (0.01*255)**2, (0.03*255)**2
                  return round(((2*mu1*mu2+C1)*(2*s12+C2))/((mu1**2+mu2**2+C1)*(s1**2+s2**2+C2)), 4)

              print(ssim('${new_webp}', '${baseline}'))
          except Exception:
              print('N/A')
          PYEOF
            )

            STATUS="OK"
            if [[ "$SSIM" != "N/A" ]]; then
              SSIM_INT=$(python3 -c "print(int(float('$SSIM') * 100))" 2>/dev/null || echo 0)
              [[ $SSIM_INT -lt 75  ]] && STATUS="Major change"
              [[ $SSIM_INT -lt 92 && $SSIM_INT -ge 75 ]] && STATUS="Changed"
            fi
            echo "| $theme | $SSIM | $STATUS |" >> "$REPORT"
          done

          cat "$REPORT"

      - name: "💬 Post PR comment"
        uses: marocchino/sticky-pull-request-comment@v2
        if: always()
        with:
          header: visual-regression
          path: regression-report.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  STAGE 04 ── 🧪 TESTS
# ╚══════════════════════════════════════════════════════════════════════════════

  test-unit-shell:
    name: "🧪 Unit Tests — Shell"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint-shell, lint-configs]

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install bats"
        run: |
          sudo apt-get install -y bats jq parallel --no-install-recommends
          git clone --depth=1 \
            https://github.com/bats-core/bats-support.git \
            tests/helpers/bats-support 2>/dev/null || true
          git clone --depth=1 \
            https://github.com/bats-core/bats-assert.git \
            tests/helpers/bats-assert 2>/dev/null || true

      - name: "🧪 Run unit tests"
        run: |
          set -euo pipefail
          PASS=0; FAIL=0

          if [[ -d tests/unit ]]; then
            for test_file in tests/unit/test-*.sh; do
              [[ -f "$test_file" ]] || continue
              test_name=$(basename "${test_file%.sh}")
              if bats --formatter tap "$test_file" 2>&1; then
                echo "  PASS: $test_name"; (( PASS++ ))
              else
                echo "  FAIL: $test_name"; (( FAIL++ ))
              fi
            done
          else
            echo "  No unit tests found — running smoke tests"
            for lib in colors utils json-parser; do
              bash -c "source ash-cli/lib/${lib}.sh 2>/dev/null && echo '  OK: ${lib}'" \
                || echo "  WARN: ${lib}"
              (( PASS++ ))
            done
          fi

          echo "  Results: $PASS passed  $FAIL failed"
          [[ $FAIL -gt 0 ]] && exit 1 || echo "  All unit tests passed"

  test-theme-engine:
    name: "🎨 Theme Engine Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint-shell, lint-configs]

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install tools"
        run: |
          sudo apt-get install -y jq imagemagick python3-pil --no-install-recommends
          pip install Pillow --quiet

      - name: "🧪 Color extraction smoke test"
        run: |
          set -euo pipefail
          python3 -c "
          from PIL import Image
          img = Image.new('RGB', (100, 100), '#2D3B2D')
          img.save('/tmp/test-wallpaper.jpg')
          print('  Test wallpaper created')
          "
          if [[ -f "ash-cli/engines/color-engine/extract.sh" ]]; then
            bash ash-cli/engines/color-engine/extract.sh \
              /tmp/test-wallpaper.jpg /tmp/test-colors.json 2>/dev/null || true
            echo "  Color extraction executed"
          else
            echo "  extract.sh not found — skipping"
          fi

      - name: "🧪 Theme colors.json validation"
        run: |
          set -euo pipefail
          FAILED=0
          while IFS= read -r -d '' colors_file; do
            theme=$(basename "$(dirname "$colors_file")")
            for field in bg fg accent red green blue yellow purple; do
              val=$(jq -r ".${field} // empty" "$colors_file" 2>/dev/null)
              if [[ -z "$val" ]]; then
                echo "  MISS $field in: $theme"; (( FAILED++ ))
              elif ! echo "$val" | grep -qE '^#[0-9a-fA-F]{6}$'; then
                echo "  BAD  $field='$val' in: $theme"; (( FAILED++ ))
              fi
            done
          done < <(find themes/presets -name "colors.json" -print0 2>/dev/null || true)
          echo "  Theme validation: $FAILED failures"
          [[ $FAILED -gt 0 ]] && exit 1 || echo "  All themes valid"

      - name: "🧪 Template rendering"
        run: |
          set -euo pipefail
          echo "  Testing template engine..."

          python3 << 'PYEOF'
          import re
          import os
          import sys

          colors = {
              "bg":     "#2D3B2D",
              "fg":     "#D3C6AA",
              "accent": "#A7C080",
              "red":    "#E67E80",
              "green":  "#A7C080",
              "blue":   "#7FBBB3",
              "yellow": "#DBBC7F",
              "purple": "#D699B6",
              "orange": "#E69875",
              "aqua":   "#83C092",
          }

          template_dir = "ash-cli/engines/color-engine/templates"
          tested = 0
          failed = 0

          if os.path.exists(template_dir):
              for fname in os.listdir(template_dir):
                  if not fname.endswith(".template"):
                      continue
                  fpath = os.path.join(template_dir, fname)
                  with open(fpath, "r") as f:
                      content = f.read()

                  result = content
                  for key, val in colors.items():
                      result = result.replace("{{" + key + "}}", val)
                      result = result.replace("${colors." + key + "}", val)
                      result = result.replace("%" + key + "%", val)

                  unresolved = re.findall(r"\{\{[^}]+\}\}", result)
                  if unresolved:
                      print("  WARN unresolved in " + fname + ": " + str(unresolved[:3]))

                  tested += 1
                  print("  OK: " + fname)
          else:
              print("  SKIP: template_dir not found")

          print("  Tested: " + str(tested) + "  Failed: " + str(failed))
          sys.exit(1 if failed > 0 else 0)
          PYEOF

  test-plugins:
    name: "🔌 Plugin Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint-shell, lint-configs]

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🧪 Plugin manifest validation"
        run: |
          set -euo pipefail
          FAILED=0; PASS=0

          while IFS= read -r -d '' manifest; do
            plugin=$(basename "$(dirname "$manifest")")
            for field in name version description author; do
              val=$(jq -r ".${field} // empty" "$manifest" 2>/dev/null)
              if [[ -z "$val" ]]; then
                echo "  MISS $field in: $plugin"; (( FAILED++ ))
              fi
            done
            version=$(jq -r '.version // ""' "$manifest")
            if echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              (( PASS++ ))
            else
              echo "  BAD semver '$version' in: $plugin"; (( FAILED++ ))
            fi
          done < <(find plugins -name "plugin.json" -print0 2>/dev/null || true)

          echo "  Plugin manifests: $PASS valid  $FAILED invalid"
          [[ $FAILED -gt 0 ]] && exit 1 || echo "  All manifests valid"

      - name: "🧪 Plugin script syntax"
        run: |
          set -euo pipefail
          FAILED=0
          while IFS= read -r -d '' manifest; do
            plugin_dir=$(dirname "$manifest")
            for script in "$plugin_dir"/*.sh; do
              [[ -f "$script" ]] || continue
              bash -n "$script" 2>&1 || {
                echo "  Syntax error: $script"
                (( FAILED++ ))
              }
            done
          done < <(find plugins/core -name "plugin.json" -print0 2>/dev/null || true)
          echo "  Plugin scripts: $FAILED failures"
          [[ $FAILED -gt 0 ]] && exit 1 || echo "  All scripts valid"

  test-api:
    name: "🌐 API Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint-python, lint-configs]
    if: |
      needs.detect-changes.outputs.has_api == 'true' ||
      needs.detect-changes.outputs.run_full == 'true'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install dependencies"
        working-directory: api
        run: |
          pip install \
            -r requirements.txt \
            pytest pytest-asyncio pytest-cov \
            httpx fakeredis \
            --quiet

      - name: "🚀 Start API"
        working-directory: api
        env:
          ASH_ENV: test
          ASH_SECRET_KEY: test-secret-key-ci
          REDIS_URL: redis://localhost:6379
        run: |
          python server.py &
          echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health &>/dev/null && {
              echo "  API ready (${i}s)"; break
            }
            sleep 1
          done

      - name: "🧪 Run pytest"
        working-directory: api
        env:
          ASH_ENV: test
          API_BASE_URL: http://localhost:8000
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            --junit-xml=pytest-results.xml \
            --tb=short -v \
            2>&1 | tee pytest-output.txt

      - name: "🛑 Stop API"
        if: always()
        run: |
          [[ -f /tmp/api.pid ]] && kill "$(cat /tmp/api.pid)" 2>/dev/null || true

      - name: "📊 Upload results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results-${{ github.run_id }}
          path: |
            api/pytest-results.xml
            api/coverage.xml
            api/pytest-output.txt
          retention-days: 14

      - name: "📊 Codecov"
        uses: codecov/codecov-action@v4
        with:
          files: api/coverage.xml
          flags: api
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  STAGE 05 ── 📊 BENCHMARKS
# ╚══════════════════════════════════════════════════════════════════════════════

  benchmark:
    name: "📊 Performance Benchmarks"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [test-unit-shell, test-theme-engine]
    if: |
      needs.detect-changes.outputs.run_benchmarks == 'true' ||
      github.event.inputs.enable_benchmarks       == 'true' ||
      github.ref == 'refs/heads/main'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install tools"
        run: |
          sudo apt-get install -y imagemagick webp --no-install-recommends 2>/dev/null || true
          curl -fsSL \
            "https://github.com/sharkdp/hyperfine/releases/download/v1.18.0/hyperfine_1.18.0_amd64.deb" \
            -o /tmp/hyperfine.deb 2>/dev/null \
            && sudo dpkg -i /tmp/hyperfine.deb 2>/dev/null || true
          pip install matplotlib pandas --quiet 2>/dev/null || true

      - name: "📊 Benchmark: startup"
        run: |
          if [[ -f "ash-cli/ash" ]]; then
            hyperfine \
              --warmup 3 --runs 20 \
              --export-json /tmp/bench-startup.json \
              --export-markdown /tmp/bench-startup.md \
              "bash ash-cli/ash --version" 2>&1
            MEAN=$(jq '.results[0].mean * 1000 | round' /tmp/bench-startup.json 2>/dev/null || echo "N/A")
            echo "  Mean startup: ${MEAN}ms  (threshold: ${{ env.MAX_STARTUP_MS }}ms)"
          else
            echo "  ash binary not found — skipping"
          fi

      - name: "📊 Benchmark: WebP conversion"
        run: |
          python3 -c "
          from PIL import Image
          Image.new('RGB', (2560, 1440), '#2D3B2D').save('/tmp/bench.png')
          " 2>/dev/null || \
          convert -size 2560x1440 "gradient:#2D3B2D-#A7C080" /tmp/bench.png 2>/dev/null || true

          hyperfine \
            --warmup 2 --runs 10 \
            --export-json /tmp/bench-webp.json \
            "cwebp -q 92 -m 6 -sharp_yuv /tmp/bench.png -o /tmp/bench-out.webp" 2>&1 || true

          MEAN=$(jq '.results[0].mean * 1000 | round' /tmp/bench-webp.json 2>/dev/null || echo "N/A")
          echo "  Mean WebP: ${MEAN}ms"

      - name: "📊 Benchmark: JSON throughput"
        run: |
          python3 -c "
          import json, random
          data = {
            'themes':  {('t-' + str(i)): {'bg': '#' + format(random.randint(0, 0xFFFFFF), '06x')} for i in range(250)},
            'plugins': [{'name': 'p-' + str(i), 'version': '1.0.0'} for i in range(150)]
          }
          with open('/tmp/bench-data.json', 'w') as f:
            json.dump(data, f)
          "
          hyperfine \
            --warmup 5 --runs 50 \
            --export-json /tmp/bench-json.json \
            "jq '.themes | length' /tmp/bench-data.json" \
            "python3 -c \"import json; print(len(json.load(open('/tmp/bench-data.json'))['themes']))\"" \
            2>&1 || true
          echo "  JSON benchmark done"

      - name: "📤 Upload results"
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: /tmp/bench-*.json
          retention-days: 90


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  STAGE 06 ── 🏗️ BUILD
# ╚══════════════════════════════════════════════════════════════════════════════

  build-web:
    name: "🌐 Build Web Dashboard"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - lint-typescript
      - test-unit-shell

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: "📦 Install"
        working-directory: web
        run: npm ci --prefer-offline

      - name: "🏗️ Build"
        working-directory: web
        env:
          NODE_ENV: production
          VITE_APP_VERSION: ${{ env.ASH_VERSION }}
          VITE_BUILD_HASH: ${{ github.sha }}
          VITE_BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          npm run build 2>&1 | tee build-output.txt
          [[ -d "dist" ]] || { echo "  Build failed"; exit 1; }
          echo "  Build size: $(du -sh dist/ | cut -f1)"

      - name: "🔍 Bundle size check"
        working-directory: web
        run: |
          MAIN_JS=$(find dist/assets -name "index-*.js" | head -1)
          if [[ -f "$MAIN_JS" ]]; then
            SIZE=$(wc -c < "$MAIN_JS")
            MAX=$(( 500 * 1024 ))
            [[ $SIZE -gt $MAX ]] \
              && echo "  WARN: main bundle $(numfmt --to=iec "$SIZE") > 500KB" \
              || echo "  OK: main bundle $(numfmt --to=iec "$SIZE")"
          fi

      - name: "📤 Upload build"
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.run_id }}
          path: web/dist/
          retention-days: 14

  build-docker:
    name: "🐳 Build Docker Image"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [test-unit-shell, test-theme-engine, security-deps]
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      github.event.inputs.pipeline_mode == 'full'

    permissions:
      contents: read
      packages: write

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐳 Setup Buildx"
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: "🔑 Login GHCR"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🏷️ Docker metadata"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=ASH Dotfiles
            org.opencontainers.image.description=Ultra Premium Hyprland Dotfiles
            org.opencontainers.image.version=${{ env.ASH_VERSION }}

      - name: "🏗️ Build & push"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-build
          cache-to: type=gha,mode=max,scope=docker-build
          build-args: |
            ASH_VERSION=${{ env.ASH_VERSION }}
            VCS_REF=${{ github.sha }}
          provenance: true
          sbom: true


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  STAGE 07 ── 🚀 DEPLOY
# ╚══════════════════════════════════════════════════════════════════════════════

  deploy-docs:
    name: "📖 Deploy Docs"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - test-unit-shell
      - screenshots-aggregate
      - build-web
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install MkDocs"
        run: |
          pip install \
            mkdocs mkdocs-material \
            mkdocs-minify-plugin \
            mkdocs-git-revision-date-localized-plugin \
            mkdocs-glightbox pymdown-extensions \
            --quiet

      - name: "📥 Download screenshots"
        uses: actions/download-artifact@v4
        with:
          name: screenshots-all-${{ github.run_id }}
          path: docs/assets/screenshots/

      - name: "🏗️ Build MkDocs"
        run: |
          mkdocs build --config-file docs/mkdocs.yml --strict 2>&1 | tail -20
          echo "  Site size: $(du -sh site/ | cut -f1)"

      - name: "⚙️ Setup Pages"
        uses: actions/configure-pages@v4

      - name: "📤 Upload pages"
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: "🚀 Deploy"
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-preview:
    name: "🔮 Deploy Preview"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-web]
    if: |
      github.event_name == 'pull_request' &&
      (
        github.event.inputs.deploy_preview == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'preview')
      )

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: "📥 Download web build"
        uses: actions/download-artifact@v4
        with:
          name: web-build-${{ github.run_id }}
          path: web-dist/

      - name: "🚀 Deploy to Cloudflare Pages"
        id: cf-deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ash-dotfiles-preview
          directory: web-dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: pr-${{ github.event.number }}

      - name: "💬 PR comment"
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-deploy
          message: |
            ## 🔮 Preview Deployment

            | | |
            |---|---|
            | 🌐 **URL** | ${{ steps.cf-deploy.outputs.url }} |
            | 📦 **Commit** | `${{ github.sha }}` |
            | 🎨 **Version** | `${{ env.ASH_VERSION }}` |
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  STAGE 08 ── 📢 SUMMARY & NOTIFICATIONS
# ╚══════════════════════════════════════════════════════════════════════════════

  pipeline-summary:
    name: "📊 Pipeline Summary"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - detect-changes
      - security-secrets
      - security-deps
      - lint-shell
      - lint-lua
      - lint-configs
      - lint-typescript
      - lint-python
      - screenshots-aggregate
      - test-unit-shell
      - test-theme-engine
      - test-plugins
    if: always()

    steps:
      - name: "📊 Collect results"
        id: results
        run: |
          emoji() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "⏹️" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "❓" ;;
            esac
          }

          OVERALL="✅ PASSED"
          for r in \
            "${{ needs.security-secrets.result }}" \
            "${{ needs.security-deps.result }}" \
            "${{ needs.lint-shell.result }}" \
            "${{ needs.lint-configs.result }}" \
            "${{ needs.test-unit-shell.result }}"; do
            [[ "$r" == "failure" ]] && { OVERALL="❌ FAILED"; break; }
          done

          {
            echo "overall=$OVERALL"
            echo "sec_secrets=$(emoji "${{ needs.security-secrets.result }}")"
            echo "sec_deps=$(emoji "${{ needs.security-deps.result }}")"
            echo "lint_sh=$(emoji "${{ needs.lint-shell.result }}")"
            echo "lint_lua=$(emoji "${{ needs.lint-lua.result }}")"
            echo "lint_cfg=$(emoji "${{ needs.lint-configs.result }}")"
            echo "lint_ts=$(emoji "${{ needs.lint-typescript.result }}")"
            echo "lint_py=$(emoji "${{ needs.lint-python.result }}")"
            echo "screenshots=$(emoji "${{ needs.screenshots-aggregate.result }}")"
            echo "test_shell=$(emoji "${{ needs.test-unit-shell.result }}")"
            echo "test_theme=$(emoji "${{ needs.test-theme-engine.result }}")"
            echo "test_plugin=$(emoji "${{ needs.test-plugins.result }}")"
          } >> "$GITHUB_OUTPUT"

      - name: "📊 Job summary"
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << SUMMARY
          # 🚀 ASH Dotfiles — Pipeline Summary

          > **${{ steps.results.outputs.overall }}**
          > Commit: \`${{ github.sha }}\`  Branch: \`${{ github.ref_name }}\`
          > Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ## 🔒 Security
          | Check | Status |
          |-------|--------|
          | Secret Scanning  | ${{ steps.results.outputs.sec_secrets }} |
          | Dependency Audit | ${{ steps.results.outputs.sec_deps }}    |

          ## ✅ Linting
          | Linter | Status |
          |--------|--------|
          | ShellCheck       | ${{ steps.results.outputs.lint_sh }}  |
          | Luacheck         | ${{ steps.results.outputs.lint_lua }} |
          | JSON/YAML/TOML   | ${{ steps.results.outputs.lint_cfg }} |
          | TypeScript/ESLint| ${{ steps.results.outputs.lint_ts }}  |
          | Python/Ruff      | ${{ steps.results.outputs.lint_py }}  |

          ## 🖼️ Screenshots
          | Stage | Status |
          |-------|--------|
          | Generation & Aggregation | ${{ steps.results.outputs.screenshots }} |

          ## 🧪 Tests
          | Suite | Status |
          |-------|--------|
          | Unit (Shell)  | ${{ steps.results.outputs.test_shell }}  |
          | Theme Engine  | ${{ steps.results.outputs.test_theme }}  |
          | Plugin System | ${{ steps.results.outputs.test_plugin }} |

          ---
          *ASH Dotfiles v${{ env.ASH_VERSION }} OMEGA*
          SUMMARY

  notify-discord:
    name: "💬 Discord Notification"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [pipeline-summary]
    if: |
      always() &&
      (
        github.ref == 'refs/heads/main' ||
        needs.pipeline-summary.result == 'failure'
      )

    steps:
      - name: "💬 Send embed"
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESULT:  ${{ needs.pipeline-summary.result }}
          BRANCH:  ${{ github.ref_name }}
          ACTOR:   ${{ github.actor }}
          SHA:     ${{ github.sha }}
          RUN_ID:  ${{ github.run_id }}
          REPO:    ${{ github.repository }}
          SERVER:  ${{ github.server_url }}
        run: |
          [[ -z "$WEBHOOK" ]] && { echo "  No webhook configured"; exit 0; }

          COLOR=3066993
          ICON="✅"
          TEXT="Pipeline Passed"
          if [[ "$RESULT" == "failure" ]]; then
            COLOR=15158332; ICON="❌"; TEXT="Pipeline Failed"
          fi

          SHORT_SHA="${SHA:0:7}"
          RUN_URL="${SERVER}/${REPO}/actions/runs/${RUN_ID}"
          COMMIT_URL="${SERVER}/${REPO}/commit/${SHA}"

          python3 - << PYEOF
          import json, urllib.request

          payload = {
            "embeds": [{
              "title": "${ICON} ASH Dotfiles CI — ${TEXT}",
              "description": "Pipeline completed for branch \`${BRANCH}\`",
              "color": ${COLOR},
              "fields": [
                {"name": "Version",  "value": "${{ env.ASH_VERSION }}", "inline": True},
                {"name": "Branch",   "value": "\`${BRANCH}\`",          "inline": True},
                {"name": "Commit",   "value": "[${SHORT_SHA}](${COMMIT_URL})", "inline": True},
                {"name": "Author",   "value": "${ACTOR}",               "inline": True},
                {"name": "Run",      "value": "[Details](${RUN_URL})",  "inline": True},
              ],
              "footer": {
                "text": "ASH Dotfiles v${{ env.ASH_VERSION }} OMEGA"
              },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }

          data = json.dumps(payload).encode()
          req  = urllib.request.Request("${WEBHOOK}", data=data,
                   headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req)
          print("  Discord notification sent")
          PYEOF


# ╔══════════════════════════════════════════════════════════════════════════════
# ║  STAGE 09 ── 🔁 MAINTENANCE
# ╚══════════════════════════════════════════════════════════════════════════════

  update-manifest:
    name: "📋 Update Asset Manifest"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [screenshots-aggregate, pipeline-summary]
    if: |
      github.ref == 'refs/heads/main'     &&
      github.event_name == 'push'         &&
      needs.screenshots-aggregate.result == 'success'

    permissions:
      contents: write

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "📥 Download manifest"
        uses: actions/download-artifact@v4
        with:
          name: screenshots-all-${{ github.run_id }}
          path: assets/screenshots/desktop/

      - name: "📝 Commit"
        run: |
          git config user.name  "ASH Bot"
          git config user.email "ash-bot@users.noreply.github.com"

          git diff --quiet assets/screenshots/desktop/manifest.json && {
            echo "  Manifest unchanged"
            exit 0
          }

          TOTAL=$(jq '.total_themes' assets/screenshots/desktop/manifest.json)
          RUN_ID="${{ github.run_id }}"
          SHA="${{ github.sha }}"
          VER="${{ env.ASH_VERSION }}"

          git add assets/screenshots/desktop/manifest.json
          git commit \
            --message "chore(assets): update screenshot manifest [skip ci]

          Pipeline: ${RUN_ID}
          Commit:   ${SHA}
          Themes:   ${TOTAL} updated
          Version:  ${VER}" \
            --author "ASH Bot <ash-bot@users.noreply.github.com>"

          git push origin main
          echo "  Manifest pushed"

  cleanup-artifacts:
    name: "🧹 Cleanup Artifacts"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [pipeline-summary]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    permissions:
      actions: write

    steps:
      - name: "🧹 Delete old artifacts"
        uses: actions/github-script@v7
        with:
          script: |
            const KEEP = 10;
            const PATTERNS = ['screenshot-', 'lint-', 'unit-test-', 'benchmark-'];

            const { data: { artifacts } } = await github.rest.actions
              .listArtifactsForRepo({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                per_page: 100,
              });

            const grouped = {};
            for (const a of artifacts) {
              for (const p of PATTERNS) {
                if (a.name.startsWith(p)) {
                  (grouped[p] = grouped[p] || []).push(a);
                  break;
                }
              }
            }

            let deleted = 0;
            for (const arts of Object.values(grouped)) {
              const sorted = arts.sort((a, b) =>
                new Date(b.created_at) - new Date(a.created_at));
              for (const a of sorted.slice(KEEP)) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  artifact_id: a.id,
                });
                deleted++;
              }
            }
            console.log('Deleted ' + deleted + ' old artifacts');