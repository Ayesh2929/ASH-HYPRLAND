                  "bin/ash",
              ],
              "Maintenance": [
                  "install.sh",
                  "quickstart.sh",
                  "scripts/health/doctor.sh",
                  "scripts/health/validate.sh",
                  "scripts/core/backup.sh",
                  "scripts/core/update.sh",
              ],
              "Documentation": [
                  "README.md",
                  "LICENSE",
                  "ATTRIBUTION.md",
                  "docs/KEYBINDS.md",
                  "docs/THEMING.md",
                  "docs/TROUBLESHOOTING.md",
              ],
          }

          total_required = 0
          total_missing = 0
          total_present = 0

          for category, files in REQUIRED.items():
              console.print(f"\n[bold cyan]━━━ {category} ━━━[/bold cyan]")
              cat_missing = 0
              for f in sorted(files):
                  total_required += 1
                  if Path(f).exists():
                      console.print(f"  [green]✓[/green] {f}")
                      total_present += 1
                  else:
                      console.print(f"  [red]✗[/red] {f} [red bold]← MISSING[/red bold]")
                      total_missing += 1
                      cat_missing += 1

              status = "[green]✅ Complete[/green]" if cat_missing == 0 else f"[red]❌ {cat_missing} missing[/red]"
              console.print(f"  → Category: {status}")

          # Summary
          console.print(f"\n[bold]{'='*60}[/bold]")
          console.print(f"[bold]Total Required: {total_required}[/bold]")
          console.print(f"[green bold]✅ Present: {total_present}[/green bold]")
          if total_missing > 0:
              console.print(f"[red bold]❌ Missing: {total_missing}[/red bold]")
              sys.exit(1)
          else:
              console.print(f"[green bold]🎉 All {total_required} required files present![/green bold]")
          PYEOF

      # ── Unique Features ────────────────────────────────────────────────────
      - name: ✅ Unique features validation
        if: matrix.type == 'unique-features'
        run: |
          python3 - << 'PYEOF'
          import subprocess, sys, re
          from pathlib import Path
          from rich.console import Console
          from rich.table import Table

          console = Console()

          FEATURES = {
              "🎵 Music Reactive Theme": {
                  "script": "config/hypr/scripts/theme/album-art-theme.sh",
                  "required_functions": [
                      "get_album_art_url",
