              },
          }

          table = Table(title="🌟 Unique Features Validation",
                        show_header=True, header_style="bold magenta")
          table.add_column("Feature", style="cyan", ratio=30)
          table.add_column("Script", ratio=35)
          table.add_column("Functions", justify="center")
          table.add_column("Modes", justify="center")
          table.add_column("Syntax", justify="center")
          table.add_column("Status", justify="center")

          total_issues = 0

          for feature, config in FEATURES.items():
              script_path = Path(config["script"])
              issues = []

              # Script exists?
              if not script_path.exists():
                  table.add_row(feature, config["script"],
                                "❌", "❌", "❌", "❌ MISSING",
                                style="red")
                  total_issues += 1
                  continue

              content = script_path.read_text()

              # Check syntax
              result = subprocess.run(['bash', '-n', str(script_path)],
                                      capture_output=True)
              syntax_ok = result.returncode == 0

              # Check functions
              funcs_ok = all(
                  re.search(rf'^{re.escape(f)}\(\)', content, re.MULTILINE)
                  for f in config["required_functions"]
              )

              # Check modes
              modes_ok = all(
                  f'"{mode}"' in content or f"'{mode}'" in content
                  for mode in config["required_modes"]
              )

              if not (syntax_ok and funcs_ok and modes_ok):
                  total_issues += 1

              # Find missing
              missing_funcs = [
                  f for f in config["required_functions"]
                  if not re.search(rf'^{re.escape(f)}\(\)', content, re.MULTILINE)
              ]
              missing_modes = [
                  m for m in config["required_modes"]
                  if f'"{m}"' not in content and f"'{m}'" not in content
              ]

              if missing_funcs:
                  issues.append(f"Missing functions: {', '.join(missing_funcs)}")
              if missing_modes:
                  issues.append(f"Missing modes: {', '.join(missing_modes)}")

              row_style = "red" if issues or not syntax_ok else ""
              table.add_row(
                  feature,
                  config["script"][-40:],
                  "✅" if funcs_ok else f"❌ ({len(missing_funcs)} missing)",
                  "✅" if modes_ok else f"❌ ({len(missing_modes)} missing)",
                  "✅" if syntax_ok else "❌",
                  "✅ OK" if not issues and syntax_ok else f"❌ {len(issues)} issues",
                  style=row_style
              )

          console.print(table)

          if total_issues > 0:
              console.print(f"\n[red bold]❌ {total_issues} feature(s) have issues[/red bold]")
              sys.exit(1)

          console.print(f"\n[green bold]✅ All {len(FEATURES)} unique features validated![/green bold]")
          PYEOF

      # ── App Support ────────────────────────────────────────────────────────
      - name: ✅ Application support check
        if: matrix.type == 'app-support'
        run: |
          python3 - << 'PYEOF'
          import sys
