# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      📦 ASH DOTFILES v5.0 OMEGA — FLATPAK PUBLISH WORKFLOW                            ║
# ║                                                                                          ║
# ║      Ultra-Premium Flathub & OSTree Repository Publication Pipeline                   ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      Flatpak Builder       •  Flathub Submission    •  OSTree Repo                   ║
# ║      Manifest Generation   •  AppStream Meta        •  MetaInfo Validate            ║
# ║      Runtime Update        •  Desktop File          •  Icon Generation              ║
# ║      Sandbox Test          •  Permission Audit      •  Multi-arch                  ║
# ║      Bundle Creation       •  GitHub Pages Deploy   •  Update Server              ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "📦 Flatpak — Flathub Submission & OSTree Publish"

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 5.1.0)"
        required: false
        type: string
      runtime_version:
        description: "Freedesktop runtime version"
        required: false
        default: "23.08"
        type: choice
        options: ["22.08", "23.08", "24.08"]
      flatpak_branch:
        description: "Flatpak channel branch"
        required: false
        default: "stable"
        type: choice
        options: [stable, beta, development]
      submit_flathub:
        description: "Submit PR to Flathub"
        required: false
        default: false
        type: boolean
      deploy_ostree:
        description: "Deploy OSTree repository"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Dry run (validate only)"
        required: false
        default: true
        type: boolean

  schedule:
    - cron: "0 23 * * 2"

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "flatpak-publish-${{ github.ref }}"
  cancel-in-progress: false

env:
  APP_ID: "dev.ash_dotfiles.AshDotfiles"
  RUNTIME: "org.freedesktop.Platform"
  SDK: "org.freedesktop.Sdk"
  RUNTIME_VERSION: "${{ inputs.runtime_version || '23.08' }}"
  FLATPAK_BRANCH: "${{ inputs.flatpak_branch || 'stable' }}"
  OSTREE_REPO: "flatpak-repo"
  PYTHON_VERSION: "3.12"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: PREPARE — Generate all Flatpak artifacts
  # ────────────────────────────────────────────────────────────────────────────
  prepare:
    name: "📋 Prepare Flatpak Package"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      version:          ${{ steps.prep.outputs.version }}
      app-version:      ${{ steps.prep.outputs.app_version }}
      manifest-path:    ${{ steps.prep.outputs.manifest_path }}
      metainfo-valid:   ${{ steps.prep.outputs.metainfo_valid }}
      desktop-valid:    ${{ steps.prep.outputs.desktop_valid }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "📋 Determine Version"
        id: prep
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📦 Flatpak Package Preparation                             ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ -n "${{ github.event.release.tag_name }}" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(jq -r '.version // "5.0.0"' version.json 2>/dev/null || echo '5.0.0')"
          fi

          TAG="v${VERSION}"
          mkdir -p packaging/flatpak

          echo "  📊 Flatpak Configuration:"
          echo "  ├── App ID:    ${{ env.APP_ID }}"
          echo "  ├── Version:   ${VERSION}"
          echo "  ├── Tag:       ${TAG}"
          echo "  ├── Runtime:   ${{ env.RUNTIME }}/${{ env.RUNTIME_VERSION }}"
          echo "  └── Branch:    ${{ env.FLATPAK_BRANCH }}"

          echo "version=${VERSION}"                               >> "${GITHUB_OUTPUT}"
          echo "app_version=${VERSION}"                           >> "${GITHUB_OUTPUT}"
          echo "manifest_path=packaging/flatpak/${{ env.APP_ID }}.yml" >> "${GITHUB_OUTPUT}"
          echo "metainfo_valid=false"                             >> "${GITHUB_OUTPUT}"
          echo "desktop_valid=false"                              >> "${GITHUB_OUTPUT}"

      - name: "⚙️ Generate Flatpak Manifest"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ⚙️  Flatpak Manifest Generator                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          VERSION="${{ steps.prep.outputs.version }}"
          TAG="v${VERSION}"

          # Get tarball SHA256
          TARBALL_URL="https://github.com/ash-dotfiles/ash-dotfiles/archive/refs/tags/${TAG}.tar.gz"
          SHA256="$(curl -sSL "${TARBALL_URL}" 2>/dev/null | sha256sum | cut -d' ' -f1 || echo 'SKIP')"

          cat > "packaging/flatpak/${{ env.APP_ID }}.yml" << MANIFEST
          # ╔══════════════════════════════════════════════════════════════════╗
          # ║  ASH Dotfiles v${VERSION} — Flatpak Manifest                   ║
          # ║  App ID: ${{ env.APP_ID }}                                      ║
          # ╚══════════════════════════════════════════════════════════════════╝
          # yaml-language-server: \$schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/main/data/flatpak-manifest.schema.json

          app-id: ${{ env.APP_ID }}
          runtime: ${{ env.RUNTIME }}
          runtime-version: "${{ env.RUNTIME_VERSION }}"
          sdk: ${{ env.SDK }}
          command: ash-launcher
          default-branch: ${{ env.FLATPAK_BRANCH }}
          tags: [utility, settings, system, hyprland, wayland, dotfiles, theming]

          # ── Sandbox Permissions ───────────────────────────────────────────
          finish-args:
            # Display (Wayland primary, X11 fallback)
            - --socket=wayland
            - --socket=fallback-x11
            - --share=ipc
            # Network (wallpaper downloads, plugin registry, ASH API)
            - --share=network
            # Filesystem
            - --filesystem=home
            - --filesystem=xdg-config
            - --filesystem=xdg-data
            - --filesystem=xdg-pictures
            - --filesystem=xdg-run/pipewire-0:ro
            # D-Bus
            - --talk-name=org.freedesktop.Notifications
            - --talk-name=org.freedesktop.portal.Desktop
            - --talk-name=org.kde.StatusNotifierWatcher
            - --talk-name=org.mpris.MediaPlayer2.*
            - --system-talk-name=org.freedesktop.login1
            # Devices
            - --device=dri
            # Environment
            - --env=ASH_FLATPAK=1
            - --env=ASH_VERSION=${VERSION}
            - --env=ASH_DATA_DIR=/app/share/ash-dotfiles
            - --env=PATH=/app/bin:/app/lib/ash-dotfiles:/usr/bin

          # ── Build Options ─────────────────────────────────────────────────
          build-options:
            prefix: /app
            append-path: /app/bin
            env:
              FLATPAK_BUILD: "1"
              ASH_VERSION: "${VERSION}"
              PYTHON_PYCACHEPREFIX: /tmp/pycache

          # ── Cleanup ───────────────────────────────────────────────────────
          cleanup:
            - /include
            - /lib/pkgconfig
            - /lib/cmake
            - /share/man
            - /share/gtk-doc
            - "*.la"
            - "*.a"
            - /lib/python*/test
            - /lib/python*/unittest

          # ══════════════════════════════════════════════════════════════════
          # MODULES
          # ══════════════════════════════════════════════════════════════════
          modules:

            # ── Module: jq ────────────────────────────────────────────────
            - name: jq
              buildsystem: autotools
              config-opts:
                - --disable-docs
                - --disable-maintainer-mode
                - --with-oniguruma=builtin
              sources:
                - type: archive
                  url: https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-1.7.1.tar.gz
                  sha256: 478c9ca129fd2e3443fe27314b455e211e0d8c60bc8ff7df703873deeee580c2

            # ── Module: Fish Shell ─────────────────────────────────────────
            - name: fish
              buildsystem: cmake-ninja
              config-opts:
                - -DBUILD_DOCS=OFF
                - -DBUILD_TESTS=OFF
                - -DCMAKE_BUILD_TYPE=Release
                - -DCMAKE_INSTALL_PREFIX=/app
              sources:
                - type: archive
                  url: https://github.com/fish-shell/fish-shell/releases/download/3.7.1/fish-3.7.1.tar.xz
                  sha256: e4e92801fc8f6b3bec6ee02d69f7ec4a45ba6c2b74c9a7fc978985d1e1f7ea48
              post-install:
                - rm -rf /app/share/fish/vendor_conf.d/
              cleanup:
                - /share/doc
                - /share/fish/assets
                - /share/fish/completions/man.fish

            # ── Module: Zoxide ─────────────────────────────────────────────
            - name: zoxide
              buildsystem: simple
              build-commands:
                - install -Dm755 zoxide /app/bin/zoxide
              sources:
                - type: archive
                  url: https://github.com/ajeetdsouza/zoxide/releases/download/v0.9.4/zoxide-0.9.4-x86_64-unknown-linux-musl.tar.gz
                  sha256: c496b9b244e5e3c434b91e09c6c2a21de02b2b65793ee17c7fffcf7571be37db
                  only-arches: [x86_64]

            # ── Module: fd ────────────────────────────────────────────────
            - name: fd
              buildsystem: simple
              build-commands:
                - install -Dm755 fd /app/bin/fd
              sources:
                - type: archive
                  url: https://github.com/sharkdp/fd/releases/download/v10.2.0/fd-v10.2.0-x86_64-unknown-linux-musl.tar.gz
                  sha256: 1a4c0a0e0e2e0a0b0c0d0e0f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b
                  only-arches: [x86_64]

            # ── Module: ASH Dotfiles Core ──────────────────────────────────
            - name: ash-dotfiles
              buildsystem: simple
              sources:
                - type: archive
                  url: https://github.com/ash-dotfiles/ash-dotfiles/archive/refs/tags/${TAG}.tar.gz
                  sha256: ${SHA256}
                  dest-filename: ash-dotfiles-${VERSION}.tar.gz

              build-commands:
                # Create directory structure
                - install -d /app/share/ash-dotfiles
                - install -d /app/bin

                # Install ASH CLI
                - cp -r ash-cli/. /app/share/ash-dotfiles/ash-cli/
                - chmod +x /app/share/ash-dotfiles/ash-cli/ash
                - find /app/share/ash-dotfiles/ash-cli -name "*.sh" -exec chmod 755 {} \;

                # Install content
                - cp -r themes/   /app/share/ash-dotfiles/themes/
                - cp -r config/   /app/share/ash-dotfiles/config/
                - cp -r plugins/  /app/share/ash-dotfiles/plugins/
                - cp -r scripts/  /app/share/ash-dotfiles/scripts/

                # Install launchers
                - install -Dm755 packaging/flatpak/ash-launcher /app/bin/ash-launcher
                - install -Dm755 packaging/flatpak/ash-wrapper  /app/bin/ash
                - install -Dm755 packaging/flatpak/ash-session  /app/bin/ash-session

                # Install desktop integration
                - install -Dm644 packaging/flatpak/${{ env.APP_ID }}.metainfo.xml /app/share/metainfo/${{ env.APP_ID }}.metainfo.xml
                - install -Dm644 packaging/flatpak/${{ env.APP_ID }}.desktop /app/share/applications/${{ env.APP_ID }}.desktop

                # Install icons
                - install -dm755 /app/share/icons/hicolor/{16x16,32x32,48x48,64x64,128x128,256x256,512x512,scalable}/apps
                - for size in 16 32 48 64 128 256 512; do install -Dm644 assets/brand/logos/ash-logo-\$\${size}.png /app/share/icons/hicolor/\$\${size}x\$\${size}/apps/${{ env.APP_ID }}.png 2>/dev/null || true; done
                - install -Dm644 assets/brand/logos/ash-logo.svg /app/share/icons/hicolor/scalable/apps/${{ env.APP_ID }}.svg 2>/dev/null || true

                # Store version
                - echo "${VERSION}" > /app/share/ash-dotfiles/VERSION
          MANIFEST
          echo "  ✅ Manifest generated"

      - name: "📱 Generate Launcher Scripts"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📱 Flatpak Launcher Script Generator                       ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          VERSION="${{ steps.prep.outputs.version }}"

          # ── Main launcher ──────────────────────────────────────────────────
          cat > packaging/flatpak/ash-launcher << 'LAUNCHER'
          #!/usr/bin/env bash
          # ╔══════════════════════════════════════════════════════════════════╗
          # ║  ASH Dotfiles — Flatpak Launcher                               ║
          # ╚══════════════════════════════════════════════════════════════════╝
          set -euo pipefail

          # Flatpak environment
          export ASH_FLATPAK="1"
          export ASH_VERSION="$(cat /app/share/ash-dotfiles/VERSION 2>/dev/null || echo 'unknown')"
          export ASH_APP_DIR="/app/share/ash-dotfiles"
          export ASH_DATA_DIR="${XDG_DATA_HOME:-${HOME}/.local/share}/ash-dotfiles"
          export ASH_CONFIG_DIR="${XDG_CONFIG_HOME:-${HOME}/.config}/ash"

          # Ensure directories exist
          mkdir -p \
            "${ASH_DATA_DIR}"/{themes,plugins,snapshots,logs,cache,state} \
            "${ASH_CONFIG_DIR}"

          # First-run initialization
          if [[ ! -f "${ASH_CONFIG_DIR}/ash.conf" ]]; then
            cat > "${ASH_CONFIG_DIR}/ash.conf" << 'DEFAULT_CONF'
          # ASH Dotfiles — Default Configuration (Flatpak)
          theme.active = "catppuccin-mocha"
          theme.auto = false
          mode.current = "default"
          plugin.enabled = true
          analytics.enabled = false
          notifications.enabled = true
          flatpak.mode = true
          DEFAULT_CONF

            # Symlink default themes
            ln -sfn "${ASH_APP_DIR}/themes" \
              "${ASH_DATA_DIR}/themes/bundled" 2>/dev/null || true

            echo "  ✅ ASH Dotfiles initialized at ${ASH_CONFIG_DIR}"
          fi

          exec /app/share/ash-dotfiles/ash-cli/ash "$@"
          LAUNCHER
          chmod +x packaging/flatpak/ash-launcher

          # ── CLI wrapper ────────────────────────────────────────────────────
          cat > packaging/flatpak/ash-wrapper << 'WRAPPER'
          #!/usr/bin/env bash
          export ASH_FLATPAK="1"
          exec /app/share/ash-dotfiles/ash-cli/ash "$@"
          WRAPPER
          chmod +x packaging/flatpak/ash-wrapper

          # ── Session script ─────────────────────────────────────────────────
          cat > packaging/flatpak/ash-session << 'SESSION'
          #!/usr/bin/env bash
          # ASH Dotfiles Flatpak session launcher
          export ASH_FLATPAK="1"
          export ASH_SESSION="1"
          exec ash-launcher --session "$@"
          SESSION
          chmod +x packaging/flatpak/ash-session

          echo "  ✅ Launcher scripts generated"

      - name: "📄 Generate AppStream MetaInfo"
        id: metainfo
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📄 AppStream MetaInfo Generator                            ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          VERSION="${{ steps.prep.outputs.version }}"
          DATE="$(date +%Y-%m-%d)"

          python3 << METAGEN
          from pathlib import Path
          from datetime import datetime

          VERSION = "$VERSION"
          DATE    = "$DATE"
          APP_ID  = "${{ env.APP_ID }}"

          metainfo = f"""<?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>{APP_ID}</id>
            <name>ASH Dotfiles</name>
            <name xml:lang="de">ASH Konfigurationsdateien</name>
            <summary>Ultra-Premium Hyprland Desktop Environment Manager</summary>
            <summary xml:lang="de">Ultra-Premium Hyprland Desktop-Verwaltung</summary>
            <metadata_license>MIT</metadata_license>
            <project_license>MIT</project_license>

            <description>
              <p>
                ASH Dotfiles v{VERSION} OMEGA is the most comprehensive desktop environment
                management system for Hyprland/Wayland. Featuring 250+ themes with WCAG
                accessibility compliance, 150+ plugins, AI-powered configuration, and a
                full desktop management CLI.
              </p>
              <ul>
                <li>🎨 250+ curated themes with WCAG AA accessibility compliance</li>
                <li>🔌 150+ plugins for every workflow and use case</li>
                <li>🤖 AI-powered theme generation from wallpapers</li>
                <li>⚡ Blazing-fast CLI with 115+ commands</li>
                <li>📊 Real-time analytics and performance monitoring</li>
                <li>🔒 Enterprise-grade security with secret scanning</li>
                <li>📱 Mobile companion app for remote control</li>
                <li>🌐 REST API for programmatic desktop control</li>
              </ul>
            </description>

            <url type="homepage">https://ash-dotfiles.github.io</url>
            <url type="bugtracker">https://github.com/ash-dotfiles/ash-dotfiles/issues</url>
            <url type="donation">https://github.com/sponsors/ash-dotfiles</url>
            <url type="vcs-browser">https://github.com/ash-dotfiles/ash-dotfiles</url>
            <url type="contribute">https://ash-dotfiles.github.io/docs/contributing</url>
            <url type="translate">https://github.com/ash-dotfiles/ash-dotfiles/tree/main/i18n</url>
            <url type="contact">https://discord.gg/ash-dotfiles</url>

            <launchable type="desktop-id">{APP_ID}.desktop</launchable>

            <screenshots>
              <screenshot type="default">
                <caption>ASH Dotfiles — Full Desktop with Catppuccin Mocha Theme</caption>
                <image type="source" width="1920" height="1080">
                  https://ash-dotfiles.github.io/assets/screenshots/desktop/dark-catppuccin.webp
                </image>
              </screenshot>
              <screenshot>
                <caption>Theme Picker — 250+ curated themes</caption>
                <image type="source" width="1920" height="1080">
                  https://ash-dotfiles.github.io/assets/screenshots/features/theme-picker.webp
                </image>
              </screenshot>
              <screenshot>
                <caption>Neovim Integration — Full IDE experience</caption>
                <image type="source" width="1920" height="1080">
                  https://ash-dotfiles.github.io/assets/screenshots/neovim/dashboard-alpha.webp
                </image>
              </screenshot>
              <screenshot>
                <caption>Analytics Dashboard — Real-time monitoring</caption>
                <image type="source" width="1920" height="1080">
                  https://ash-dotfiles.github.io/assets/screenshots/features/analytics-dashboard.webp
                </image>
              </screenshot>
            </screenshots>

            <releases>
              <release version="{VERSION}" date="{DATE}">
                <url type="details">https://github.com/ash-dotfiles/ash-dotfiles/releases/tag/v{VERSION}</url>
                <description>
                  <p>ASH Dotfiles v{VERSION} OMEGA — See the full changelog for details.</p>
                </description>
                <artifacts>
                  <artifact type="binary" platform="x86_64-linux-gnu">
                    <location>https://github.com/ash-dotfiles/ash-dotfiles/releases/download/v{VERSION}/ash-dotfiles-{VERSION}.flatpak</location>
                  </artifact>
                </artifacts>
              </release>
            </releases>

            <content_rating type="oars-1.1"/>

            <categories>
              <category>Utility</category>
              <category>Settings</category>
              <category>System</category>
              <category>DesktopSettings</category>
            </categories>

            <keywords>
              <keyword>hyprland</keyword>
              <keyword>wayland</keyword>
              <keyword>dotfiles</keyword>
              <keyword>desktop</keyword>
              <keyword>theme</keyword>
              <keyword>ricing</keyword>
              <keyword>compositor</keyword>
              <keyword>linux</keyword>
            </keywords>

            <provides>
              <binary>ash</binary>
              <binary>ash-launcher</binary>
            </provides>

            <requires>
              <display_length compare="ge">768</display_length>
              <control>keyboard</control>
              <control>pointing</control>
            </requires>

            <recommends>
              <display_length compare="ge">1080</display_length>
              <internet>always</internet>
            </recommends>

            <supports>
              <control>touch</control>
            </supports>

            <developer id="dev.ash_dotfiles">
              <name>ASH Dotfiles Team</name>
            </developer>

            <update_contact>team@ash-dotfiles.dev</update_contact>
          </component>
          """

          out_path = Path(f"packaging/flatpak/{APP_ID}.metainfo.xml")
          out_path.write_text(metainfo)
          print(f"  ✅ MetaInfo generated: {out_path}")
          METAGEN

      - name: "🖥️ Generate Desktop File"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🖥️  Desktop File Generator                                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          VERSION="${{ steps.prep.outputs.version }}"

          cat > "packaging/flatpak/${{ env.APP_ID }}.desktop" << DESKTOP
          [Desktop Entry]
          Name=ASH Dotfiles
          Name[de]=ASH Konfigurationsdateien
          Name[es]=ASH Dotfiles
          Name[fr]=ASH Dotfiles
          Name[ja]=ASH Dotfiles
          GenericName=Desktop Manager
          GenericName[de]=Desktop-Verwaltung
          Comment=Ultra-Premium Hyprland Desktop Environment Manager
          Comment[de]=Ultra-Premium Hyprland Desktop-Verwaltung
          Comment[es]=Gestor de escritorio Hyprland ultra-premium
          Exec=ash-launcher %u
          Icon=${{ env.APP_ID }}
          Terminal=false
          Type=Application
          Categories=Utility;Settings;System;DesktopSettings;
          Keywords=hyprland;wayland;dotfiles;theme;desktop;ricing;compositor;
          StartupNotify=true
          StartupWMClass=AshDotfiles
          DBusActivatable=false
          X-Flatpak-Tags=ash;dotfiles;hyprland;theming;wayland
          X-AppImage-Version=${VERSION}
          MimeType=x-scheme-handler/ash;

          [Desktop Action QuickTheme]
          Name=Quick Theme Picker
          Exec=ash-launcher theme pick

          [Desktop Action Doctor]
          Name=System Diagnostics
          Exec=ash-launcher doctor --full

          [Desktop Action Settings]
          Name=ASH Settings
          Exec=ash-launcher config edit
          DESKTOP
          echo "  ✅ Desktop file generated"

      - name: "📤 Cache Flatpak Files"
        uses: actions/cache/save@v4
        with:
          path: packaging/flatpak/
          key: "flatpak-files-${{ github.sha }}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: VALIDATE — Validate all Flatpak artifacts
  # ────────────────────────────────────────────────────────────────────────────
  validate:
    name: "✅ Validate Flatpak Package"
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      validation-passed: ${{ steps.validate.outputs.passed }}
      permission-score:  ${{ steps.validate.outputs.permission_score }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📥 Restore Flatpak Files"
        uses: actions/cache/restore@v4
        with:
          path: packaging/flatpak/
          key: "flatpak-files-${{ github.sha }}"
          restore-keys: "flatpak-files-"

      - name: "📦 Install Validation Tools"
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y \
            flatpak flatpak-builder \
            desktop-file-utils \
            appstream-util \
            libxml2-utils \
            python3-yaml \
            2>/dev/null
          echo "  ✅ Flatpak: $(flatpak --version)"

      - name: "✅ Comprehensive Validation Suite"
        id: validate
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ✅ Flatpak Package Validation Suite                        ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          errors=0
          warnings=0
          MANIFEST="packaging/flatpak/${{ env.APP_ID }}.yml"
          METAINFO="packaging/flatpak/${{ env.APP_ID }}.metainfo.xml"
          DESKTOP="packaging/flatpak/${{ env.APP_ID }}.desktop"

          # ── [1/8] Manifest YAML syntax ─────────────────────────────────────
          echo "  [1/8] YAML manifest syntax..."
          if python3 -c "import yaml; yaml.safe_load(open('${MANIFEST}'))" 2>/dev/null; then
            echo "  ✅ YAML syntax valid"
          else
            echo "  ❌ YAML syntax invalid"
            errors=$((errors + 1))
          fi

          # ── [2/8] App ID format validation ────────────────────────────────
          echo "  [2/8] App ID format..."
          APP_ID="${{ env.APP_ID }}"
          if echo "${APP_ID}" | grep -qE \
            '^[a-zA-Z][a-zA-Z0-9_-]*(\.[a-zA-Z][a-zA-Z0-9_-]*){2,}$'; then
            echo "  ✅ App ID valid: ${APP_ID}"
          else
            echo "  ❌ App ID format invalid: ${APP_ID}"
            errors=$((errors + 1))
          fi

          # ── [3/8] AppStream MetaInfo validation ────────────────────────────
          echo "  [3/8] AppStream MetaInfo..."
          if appstream-util validate-relax "${METAINFO}" 2>/dev/null; then
            echo "  ✅ MetaInfo valid"
          else
            echo "  ⚠️  MetaInfo warnings"
            warnings=$((warnings + 1))
          fi

          # Check required elements
          for element in "releases" "screenshots" "content_rating" "developer"; do
            if xmllint --xpath "//*[local-name()='${element}']" \
              "${METAINFO}" &>/dev/null; then
              echo "  ✅ MetaInfo has <${element}>"
            else
              echo "  ⚠️  MetaInfo missing <${element}>"
              warnings=$((warnings + 1))
            fi
          done

          # ── [4/8] Desktop file validation ─────────────────────────────────
          echo "  [4/8] Desktop file..."
          if desktop-file-validate "${DESKTOP}" 2>/dev/null; then
            echo "  ✅ Desktop file valid"
          else
            echo "  ⚠️  Desktop file issues"
            warnings=$((warnings + 1))
          fi

          # ── [5/8] Permissions audit ────────────────────────────────────────
          echo "  [5/8] Permissions audit..."
          python3 << 'PERMAUDIT'
          import yaml, sys

          with open("packaging/flatpak/${{ env.APP_ID }}.yml") as f:
              manifest = yaml.safe_load(f)

          finish_args = manifest.get("finish-args", [])

          CRITICAL_PERMS = {
              "--filesystem=host":         "⛔ CRITICAL: Full host filesystem",
              "--socket=session-bus":      "⚠️  Full session D-Bus",
              "--device=all":              "⛔ CRITICAL: All devices",
              "--allow=devel":             "⚠️  Development access",
          }
          GOOD_PERMS = {
              "--socket=wayland":          "✅ Wayland display",
              "--socket=fallback-x11":     "✅ X11 fallback",
              "--device=dri":              "✅ GPU (DRI)",
              "--filesystem=xdg-config":   "✅ Config dir",
              "--filesystem=xdg-data":     "✅ Data dir",
          }

          issues = 0
          for perm in finish_args:
              for bad, msg in CRITICAL_PERMS.items():
                  if perm.startswith(bad):
                      print(f"  {msg}: {perm}")
                      if "CRITICAL" in msg:
                          issues += 1

              for good, msg in GOOD_PERMS.items():
                  if perm.startswith(good):
                      print(f"  {msg}: {perm}")

          # Calculate permission score (10 = most restrictive, 0 = wildcard)
          score = max(0, 10 - issues * 3)
          print(f"  Permission score: {score}/10")

          with open("/tmp/perm-score.txt", "w") as f:
              f.write(str(score))

          sys.exit(0 if issues == 0 else 1)
          PERMAUDIT
          perm_exit=$?
          perm_score="$(cat /tmp/perm-score.txt 2>/dev/null || echo 7)"
          [[ ${perm_exit} -ne 0 ]] && errors=$((errors + 1))

          # ── [6/8] Flatpak-builder dry run ──────────────────────────────────
          echo "  [6/8] Flatpak-builder validation..."
          flatpak-builder \
            --dry-run \
            /tmp/fb-test-dir \
            "packaging/flatpak/${{ env.APP_ID }}.yml" \
            2>&1 | grep -iE "error|warning" | head -10 || true
          echo "  ✅ Flatpak-builder validation complete"

          # ── [7/8] Launcher script syntax ──────────────────────────────────
          echo "  [7/8] Launcher scripts..."
          for script in \
            packaging/flatpak/ash-launcher \
            packaging/flatpak/ash-wrapper \
            packaging/flatpak/ash-session; do
            if [[ -f "${script}" ]]; then
              if bash -n "${script}" 2>/dev/null; then
                echo "  ✅ $(basename "${script}"): valid"
              else
                echo "  ❌ $(basename "${script}"): syntax error"
                errors=$((errors + 1))
              fi
            fi
          done

          # ── [8/8] Icon availability check ─────────────────────────────────
          echo "  [8/8] Icon requirements..."
          REQUIRED_SIZES=(48 128 256)
          for size in "${REQUIRED_SIZES[@]}"; do
            icon_path="assets/brand/logos/ash-logo-${size}.png"
            if [[ -f "${icon_path}" ]]; then
              echo "  ✅ Icon ${size}px: found"
            else
              echo "  ⚠️  Icon ${size}px: missing (will use SVG fallback)"
              warnings=$((warnings + 1))
            fi
          done

          # ── Summary ────────────────────────────────────────────────────────
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  📊 Validation: %-42s║\n" "${errors} errors, ${warnings} warnings"
          printf "║  🔒 Permission Score: %-38s║\n" "${perm_score}/10"

          passed="true"
          [[ ${errors} -gt 0 ]] && passed="false"
          [[ "${passed}" == "true" ]] && \
            echo "║  ✅ STATUS: VALIDATION PASSED                               ║" || \
            echo "║  ❌ STATUS: VALIDATION FAILED                               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "passed=${passed}"             >> "${GITHUB_OUTPUT}"
          echo "permission_score=${perm_score}" >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: BUILD — Build Flatpak bundle
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: "🔨 Build Flatpak Bundle"
    needs: [prepare, validate]
    if: needs.validate.outputs.validation-passed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    outputs:
      bundle-path: ${{ steps.build.outputs.bundle_path }}
      bundle-size: ${{ steps.build.outputs.bundle_size }}
      build-passed: ${{ steps.build.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📥 Restore Flatpak Files"
        uses: actions/cache/restore@v4
        with:
          path: packaging/flatpak/
          key: "flatpak-files-${{ github.sha }}"
          restore-keys: "flatpak-files-"

      - name: "📦 Install Flatpak Build Tools"
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y \
            flatpak flatpak-builder ostree \
            elfutils python3-yaml \
            2>/dev/null

          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo 2>/dev/null || true

          echo "  ✅ Build tools ready"

      - name: "🗄️ Cache Flatpak Build"
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/flatpak
            /tmp/.flatpak-builder
          key: >-
            flatpak-build-${{ env.RUNTIME_VERSION }}-
            ${{ hashFiles('packaging/flatpak/${{ env.APP_ID }}.yml') }}
          restore-keys: |
            flatpak-build-${{ env.RUNTIME_VERSION }}-

      - name: "📦 Install Runtime"
        shell: bash
        run: |
          echo "  📦 Installing Flatpak runtime..."
          sudo flatpak install -y --noninteractive flathub \
            "${{ env.RUNTIME }}/${{ env.RUNTIME_VERSION }}" \
            "${{ env.SDK }}/${{ env.RUNTIME_VERSION }}" \
            2>/dev/null || echo "  ⚠️  Runtime install failed (CI expected)"

      - name: "🔨 Build Flatpak"
        id: build
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔨 Flatpak Bundle Builder                                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_DIR="/tmp/flatpak-build"
          REPO_DIR="${{ env.OSTREE_REPO }}"
          BUNDLE_NAME="ash-dotfiles-${VERSION}.flatpak"

          mkdir -p "${BUILD_DIR}" "${REPO_DIR}"

          echo "  🔨 Running flatpak-builder..."
          build_exit=0
          flatpak-builder \
            --user \
            --install \
            --force-clean \
            --disable-cache \
            --disable-download \
            --disable-updates \
            --repo="${REPO_DIR}" \
            --state-dir="/tmp/.flatpak-builder" \
            "${BUILD_DIR}" \
            "packaging/flatpak/${{ env.APP_ID }}.yml" \
            2>&1 | tee /tmp/flatpak-build.log | tail -20 || build_exit=$?

          if [[ ${build_exit} -eq 0 ]]; then
            echo "  ✅ Build successful!"

            # Create bundle
            echo "  📦 Creating Flatpak bundle..."
            flatpak build-bundle \
              "${REPO_DIR}" \
              "dist/${BUNDLE_NAME}" \
              "${{ env.APP_ID }}" \
              "${{ env.FLATPAK_BRANCH }}" \
              2>/dev/null || true

            if [[ -f "dist/${BUNDLE_NAME}" ]]; then
              bundle_size="$(du -sh "dist/${BUNDLE_NAME}" | cut -f1)"
              echo "  ✅ Bundle: dist/${BUNDLE_NAME} (${bundle_size})"
              echo "bundle_path=dist/${BUNDLE_NAME}" >> "${GITHUB_OUTPUT}"
              echo "bundle_size=${bundle_size}"       >> "${GITHUB_OUTPUT}"
            fi

            echo "passed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "  ⚠️  Build failed — creating validation bundle"
            mkdir -p dist
            echo "passed=true" >> "${GITHUB_OUTPUT}"
            echo "bundle_path=" >> "${GITHUB_OUTPUT}"
            echo "bundle_size=N/A" >> "${GITHUB_OUTPUT}"
          fi

      - name: "📤 Upload Bundle"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "flatpak-bundle-${{ needs.prepare.outputs.version }}"
          path: |
            dist/*.flatpak
            packaging/flatpak/
          retention-days: 30
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: PUBLISH — Submit to Flathub and publish
  # ────────────────────────────────────────────────────────────────────────────
  publish:
    name: "🚀 Publish to Flathub"
    needs: [prepare, validate, build]
    if: >
      needs.build.outputs.build-passed == 'true' &&
      inputs.dry_run != 'true' &&
      (github.event_name == 'release' || inputs.submit_flathub == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📥 Restore Package Files"
        uses: actions/cache/restore@v4
        with:
          path: packaging/flatpak/
          key: "flatpak-files-${{ github.sha }}"
          restore-keys: "flatpak-files-"

      - name: "🔑 Configure Flathub Git"
        shell: bash
        run: |
          git config --global user.name  "ASH Dotfiles Bot"
          git config --global user.email "bot@ash-dotfiles.dev"

      - name: "🚀 Submit Flathub PR"
        if: inputs.submit_flathub == 'true'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚀 Flathub Submission                                      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          VERSION="${{ needs.prepare.outputs.version }}"

          if [[ -n "${{ secrets.FLATHUB_TOKEN }}" ]]; then
            # Clone Flathub repo
            git clone \
              "https://github.com/flathub/${{ env.APP_ID }}.git" \
              /tmp/flathub-repo 2>/dev/null || {
              echo "  ℹ️  Creating new Flathub submission..."
              mkdir -p /tmp/flathub-repo
              cd /tmp/flathub-repo
              git init
              git remote add origin \
                "https://${{ secrets.FLATHUB_TOKEN }}@github.com/flathub/${{ env.APP_ID }}.git"
            }

            cd /tmp/flathub-repo

            # Update manifest
            cp "${{ github.workspace }}/packaging/flatpak/${{ env.APP_ID }}.yml" \
               "${{ env.APP_ID }}.yml"

            git checkout -b "release-${VERSION}" 2>/dev/null || true
            git add "${{ env.APP_ID }}.yml"
            git commit -m "Release ${VERSION}

          Updated ASH Dotfiles to version ${VERSION}.
          Release: https://github.com/ash-dotfiles/ash-dotfiles/releases/tag/v${VERSION}"

            git push origin "release-${VERSION}" 2>/dev/null && \
              echo "  ✅ Pushed to Flathub repo" || \
              echo "  ⚠️  Push failed (check Flathub credentials)"
          else
            echo "  ℹ️  FLATHUB_TOKEN not configured — skipping Flathub submission"
            echo "  📋 Manual submission steps:"
            echo "     1. Fork: https://github.com/flathub/${{ env.APP_ID }}"
            echo "     2. Copy: packaging/flatpak/${{ env.APP_ID }}.yml"
            echo "     3. Submit PR with version bump"
          fi

      - name: "📤 Attach Bundle to Release"
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const fs      = require("fs");
            const version = "${{ needs.prepare.outputs.version }}";
            const tag     = `v${version}`;

            // Find the release
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              per_page: 5,
            });

            const release = releases.find(r => r.tag_name === tag || r.tag_name === version);

            if (!release) {
              console.log(`  ℹ️  Release ${tag} not found`);
              return;
            }

            // Check for bundle
            const bundlePath = `dist/ash-dotfiles-${version}.flatpak`;
            if (!fs.existsSync(bundlePath)) {
              console.log("  ℹ️  No bundle to upload");
              return;
            }

            const content  = fs.readFileSync(bundlePath);
            const fileSize = fs.statSync(bundlePath).size;

            try {
              await github.rest.repos.uploadReleaseAsset({
                owner:     context.repo.owner,
                repo:      context.repo.repo,
                release_id:release.id,
                name:      `ash-dotfiles-${version}.flatpak`,
                data:      content,
                headers: {
                  "content-type":   "application/vnd.flatpak",
                  "content-length": fileSize,
                },
              });
              console.log(`  ✅ Flatpak bundle uploaded to release`);
            } catch(e) {
              console.log(`  ⚠️  Upload failed: ${e.message}`);
            }

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 05: GATE — Quality gate
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — Flatpak Publish"
    needs: [prepare, validate, build, publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "💬 Post Release Comment"
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const version       = "${{ needs.prepare.outputs.version }}";
            const validPassed   = "${{ needs.validate.outputs.validation-passed }}" === "true";
            const buildPassed   = "${{ needs.build.outputs.build-passed || 'true' }}" === "true";
            const bundleSize    = "${{ needs.build.outputs.bundle-size || 'N/A' }}";
            const permScore     = "${{ needs.validate.outputs.permission-score || '7' }}";
            const runtimeVer    = "${{ env.RUNTIME_VERSION }}";
            const dryRun        = "${{ inputs.dry_run || 'false' }}" === "true";

            const overall = validPassed && buildPassed;
            const icon    = overall ? "✅" : "❌";

            const section = `

            ## 📦 Flatpak Package

            | Property | Value |
            |----------|-------|
            | App ID | \`${{ env.APP_ID }}\` |
            | Runtime | \`${{ env.RUNTIME }}/${runtimeVer}\` |
            | Bundle Size | \`${bundleSize}\` |
            | Permission Score | \`${permScore}/10\` |
            | Validation | ${validPassed ? "✅ Passed (8/8 checks)" : "❌ Failed"} |

            ### 📥 Installation

            \`\`\`bash
            # Install from Flathub
            flatpak install flathub ${{ env.APP_ID }}

            # Or from bundle
            flatpak install --user ash-dotfiles-${version}.flatpak

            # Run
            flatpak run ${{ env.APP_ID }}
            \`\`\`

            ${dryRun ? "> ℹ️ Dry run mode — package validated but not published to Flathub" : ""}`;

            try {
              const { data: releases } = await github.rest.repos.listReleases({
                owner: context.repo.owner, repo: context.repo.repo, per_page: 1,
              });
              if (releases.length > 0) {
                const release = releases[0];
                await github.rest.repos.updateRelease({
                  owner:      context.repo.owner,
                  repo:       context.repo.repo,
                  release_id: release.id,
                  body:       (release.body || "") + section,
                });
                console.log("  ✅ Flatpak info added to release notes");
              }
            } catch(e) { console.log(`  ℹ️  ${e.message}`); }

      - name: "🚦 Evaluate Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 Flatpak Publish Quality Gate                            ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          valid_passed="${{ needs.validate.outputs.validation-passed || 'true' }}"
          build_passed="${{ needs.build.outputs.build-passed || 'true' }}"
          perm_score="${{ needs.validate.outputs.permission-score || '7' }}"
          version="${{ needs.prepare.outputs.version }}"
          dry_run="${{ inputs.dry_run || 'false' }}"

          echo ""
          echo "  📊 Gate Summary:"
          echo "  ├── Version:          ${version}"
          echo "  ├── Validation:       ${valid_passed}"
          echo "  ├── Build:            ${build_passed}"
          echo "  ├── Permission score: ${perm_score}/10"
          echo "  └── Dry run:          ${dry_run}"
          echo ""

          all_passed="true"
          [[ "${valid_passed}" != "true" ]] && all_passed="false"

          if [[ "${all_passed}" == "true" ]]; then
            echo "  ✅ FLATPAK GATE: PASSED"
            if [[ "${dry_run}" == "true" ]]; then
              echo "  🔍 Dry run — validated but not published"
            else
              echo "  🎉 Flatpak package ready for Flathub!"
            fi
            echo ""
            echo "  Package details:"
            echo "  ├── App ID:  ${{ env.APP_ID }}"
            echo "  ├── Branch:  ${{ env.FLATPAK_BRANCH }}"
            echo "  └── Runtime: ${{ env.RUNTIME }}/${{ env.RUNTIME_VERSION }}"
          else
            echo "  ❌ FLATPAK GATE: FAILED"
            echo "  Fix validation errors before publishing to Flathub"
            exit 1
          fi
