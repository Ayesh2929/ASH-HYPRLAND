# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      📦 ASH DOTFILES v5.0 OMEGA — GHCR PUBLISH WORKFLOW                               ║
# ║                                                                                          ║
# ║      Ultra-Premium GitHub Container Registry Publication Pipeline                      ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      Multi-Platform Images •  Cosign Signing        •  SBOM Attestation              ║
# ║      SLSA Provenance       •  Keyless OIDC           •  Digest Pinning              ║
# ║      Vulnerability Scan    •  Layer Caching          •  OCI Annotations            ║
# ║      Visibility Control    •  Package Linking        •  Retention Policy           ║
# ║      Rolling Tag Strategy  •  Semantic Versioning    •  Build Matrix              ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "📦 GHCR — GitHub Container Registry Publish"

# ══════════════════════════════════════════════════════════════════════════════
# TRIGGER CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
on:
  release:
    types: [published]

  push:
    branches: [main]
    paths:
      - "docker/**"
      - "Dockerfile*"
      - "api/**"
      - "ash-cli/**"
      - ".github/workflows/release/publish-ghcr.yml"
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 5.1.0)"
        required: false
        type: string
      image_target:
        description: "Image(s) to build"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - api-server
          - cli-tools
          - test-environment
          - full-desktop
      platforms:
        description: "Target platforms"
        required: false
        default: "linux/amd64,linux/arm64"
        type: choice
        options:
          - "linux/amd64"
          - "linux/arm64"
          - "linux/amd64,linux/arm64"
          - "linux/amd64,linux/arm64,linux/arm/v7"
      push:
        description: "Push to GHCR"
        required: false
        default: true
        type: boolean
      sign:
        description: "Sign with Cosign"
        required: false
        default: true
        type: boolean
      scan:
        description: "Run security scan"
        required: false
        default: true
        type: boolean
      generate_sbom:
        description: "Generate SBOM"
        required: false
        default: true
        type: boolean

  schedule:
    # Nightly rebuild for base image security updates
    - cron: "0 22 * * *"

# ══════════════════════════════════════════════════════════════════════════════
# PERMISSIONS
# ══════════════════════════════════════════════════════════════════════════════
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

# ══════════════════════════════════════════════════════════════════════════════
# CONCURRENCY
# ══════════════════════════════════════════════════════════════════════════════
concurrency:
  group: "ghcr-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════════════════
# GLOBAL ENV
# ══════════════════════════════════════════════════════════════════════════════
env:
  REGISTRY: "ghcr.io"
  NAMESPACE: "ash-dotfiles"
  PLATFORMS: "${{ inputs.platforms || 'linux/amd64,linux/arm64' }}"
  SHOULD_PUSH: "${{ inputs.push != 'false' }}"
  SHOULD_SIGN: "${{ inputs.sign != 'false' }}"
  SHOULD_SCAN: "${{ inputs.scan != 'false' }}"
  DOCKER_BUILDKIT: "1"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: CONTEXT — Build context and metadata
  # ────────────────────────────────────────────────────────────────────────────
  context:
    name: "🔍 Build Context & Metadata"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      version:       ${{ steps.ctx.outputs.version }}
      short-sha:     ${{ steps.ctx.outputs.short_sha }}
      build-date:    ${{ steps.ctx.outputs.build_date }}
      is-release:    ${{ steps.ctx.outputs.is_release }}
      is-nightly:    ${{ steps.ctx.outputs.is_nightly }}
      image-matrix:  ${{ steps.matrix.outputs.matrix }}
      push-enabled:  ${{ steps.ctx.outputs.push_enabled }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🔍 Build Context"
        id: ctx
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📦 GHCR Build Context Analysis                             ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # ── Version resolution ─────────────────────────────────────────────
          VERSION=""
          IS_RELEASE="false"
          IS_NIGHTLY="false"

          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
            IS_RELEASE="true"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            IS_RELEASE="true"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            VERSION="nightly-$(date -u +%Y%m%d)"
            IS_NIGHTLY="true"
          else
            VERSION="$(jq -r '.version // "5.0.0"' version.json 2>/dev/null || echo '5.0.0')"
          fi

          SHORT_SHA="${GITHUB_SHA:0:8}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # ── Push decision ──────────────────────────────────────────────────
          PUSH_ENABLED="false"
          if [[ "${{ inputs.push }}" != "false" ]] && \
             [[ "${{ github.event_name }}" != "pull_request" ]]; then
            if [[ "${IS_RELEASE}" == "true" ]] || \
               [[ "${IS_NIGHTLY}" == "true" ]] || \
               [[ "${{ github.ref }}" == "refs/heads/main" ]] || \
               [[ "${{ inputs.push }}" == "true" ]]; then
              PUSH_ENABLED="true"
            fi
          fi

          echo ""
          echo "  📊 Build Context:"
          echo "  ├── Version:    ${VERSION}"
          echo "  ├── Short SHA:  ${SHORT_SHA}"
          echo "  ├── Build date: ${BUILD_DATE}"
          echo "  ├── Is release: ${IS_RELEASE}"
          echo "  ├── Is nightly: ${IS_NIGHTLY}"
          echo "  ├── Push:       ${PUSH_ENABLED}"
          echo "  └── Platforms:  ${{ env.PLATFORMS }}"

          {
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "build_date=${BUILD_DATE}"
            echo "is_release=${IS_RELEASE}"
            echo "is_nightly=${IS_NIGHTLY}"
            echo "push_enabled=${PUSH_ENABLED}"
          } >> "${GITHUB_OUTPUT}"

      - name: "🏗️ Build Image Matrix"
        id: matrix
        shell: bash
        run: |
          TARGET="${{ inputs.image_target || 'all' }}"

          declare -A IMAGES=(
            ["api-server"]="ash-api:API Server:docker/Dockerfile.api"
            ["cli-tools"]="ash-cli:CLI Tools:docker/Dockerfile.cli"
            ["test-environment"]="ash-test:Test Environment:docker/Dockerfile.test"
            ["full-desktop"]="ash-dotfiles:Full Desktop:docker/Dockerfile.full"
          )

          matrix_include="[]"
          for key in "${!IMAGES[@]}"; do
            if [[ "${TARGET}" == "all" || "${TARGET}" == "${key}" ]]; then
              IFS=':' read -r suffix title dockerfile <<< "${IMAGES[$key]}"
              matrix_include="$(echo "${matrix_include}" | jq \
                --arg key "${key}" \
                --arg suffix "${suffix}" \
                --arg title "${title}" \
                --arg dockerfile "${dockerfile}" \
                '. += [{"key":$key,"suffix":$suffix,"title":$title,"dockerfile":$dockerfile}]')"
            fi
          done

          echo "matrix={\"include\":${matrix_include}}" >> "${GITHUB_OUTPUT}"
          echo "  ✅ Matrix: $(echo "${matrix_include}" | jq 'length') image(s)"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: GENERATE-DOCKERFILES — Optimized production Dockerfiles
  # ────────────────────────────────────────────────────────────────────────────
  generate-dockerfiles:
    name: "⚙️ Generate Production Dockerfiles"
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "⚙️ Generate Optimized Dockerfiles"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ⚙️  Ultra-Optimized Dockerfile Generator                    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          mkdir -p docker
          VERSION="${{ needs.context.outputs.version }}"

          # ── API Server — Multi-stage optimized ────────────────────────────
          [[ ! -f "docker/Dockerfile.api" ]] && cat > docker/Dockerfile.api << 'API_DOCKERFILE'
          # syntax=docker/dockerfile:1.6
          # ╔══════════════════════════════════════════════════════════════════╗
          # ║  ASH Dotfiles — API Server (Optimized Multi-Stage)             ║
          # ╚══════════════════════════════════════════════════════════════════╝

          # ── Stage 1: Build wheels ─────────────────────────────────────────
          FROM python:3.12-slim AS wheel-builder
          WORKDIR /wheels
          RUN apt-get update -qq && \
              apt-get install -y --no-install-recommends \
                gcc libpq-dev libffi-dev curl && \
              rm -rf /var/lib/apt/lists/*
          COPY api/requirements.txt ./
          RUN pip wheel --no-cache-dir --wheel-dir /wheels -r requirements.txt

          # ── Stage 2: Runtime ──────────────────────────────────────────────
          FROM python:3.12-slim AS runtime
          ARG BUILD_DATE VERSION REVISION
          LABEL \
            org.opencontainers.image.title="ASH Dotfiles API Server" \
            org.opencontainers.image.description="Ultra-Premium ASH REST API v5.0 OMEGA" \
            org.opencontainers.image.created="${BUILD_DATE}" \
            org.opencontainers.image.version="${VERSION}" \
            org.opencontainers.image.revision="${REVISION}" \
            org.opencontainers.image.source="https://github.com/ash-dotfiles/ash-dotfiles" \
            org.opencontainers.image.url="https://ash-dotfiles.github.io" \
            org.opencontainers.image.licenses="MIT" \
            org.opencontainers.image.vendor="ASH Dotfiles Team" \
            com.ash.component="api-server" \
            com.ash.version="${VERSION}"

          # Security: minimal runtime deps only
          RUN apt-get update -qq && \
              apt-get install -y --no-install-recommends \
                curl tini && \
              rm -rf /var/lib/apt/lists/* && \
              groupadd --gid 65532 nonroot && \
              useradd  --uid 65532 --gid 65532 \
                       --no-create-home --shell /sbin/nologin nonroot

          WORKDIR /app

          # Install from pre-built wheels
          COPY --from=wheel-builder /wheels /wheels
          RUN pip install --no-cache-dir --no-index \
              --find-links /wheels /wheels/*.whl && \
              rm -rf /wheels

          # Copy app with correct ownership
          COPY --chown=nonroot:nonroot api/ ./

          # Lock down filesystem
          RUN chmod -R 550 /app && \
              chmod 770 /app/logs 2>/dev/null || mkdir -m 770 /app/logs

          # Health check via Python (no curl dependency on final image path)
          HEALTHCHECK --interval=30s --timeout=8s \
              --start-period=15s --retries=3 \
              CMD python3 -c "\
          import urllib.request, sys; \
          req = urllib.request.Request('http://localhost:7070/api/v1/health'); \
          resp = urllib.request.urlopen(req, timeout=5); \
          sys.exit(0 if resp.status == 200 else 1)" || exit 1

          USER nonroot
          EXPOSE 7070/tcp

          ENTRYPOINT ["/usr/bin/tini", "--"]
          CMD ["python3", "-m", "uvicorn", "server:app", \
               "--host", "0.0.0.0", "--port", "7070", \
               "--workers", "2", "--loop", "uvloop", \
               "--log-level", "info", "--access-log"]
          API_DOCKERFILE
          echo "  ✅ docker/Dockerfile.api"

          # ── CLI Tools — Arch-based ─────────────────────────────────────────
          [[ ! -f "docker/Dockerfile.cli" ]] && cat > docker/Dockerfile.cli << 'CLI_DOCKERFILE'
          # syntax=docker/dockerfile:1.6
          # ╔══════════════════════════════════════════════════════════════════╗
          # ║  ASH Dotfiles — CLI Tools (Arch Linux Based)                   ║
          # ╚══════════════════════════════════════════════════════════════════╝

          FROM archlinux:latest AS ash-cli
          ARG BUILD_DATE VERSION REVISION
          LABEL \
            org.opencontainers.image.title="ASH Dotfiles CLI" \
            org.opencontainers.image.description="ASH Dotfiles CLI Tools v5.0 OMEGA" \
            org.opencontainers.image.created="${BUILD_DATE}" \
            org.opencontainers.image.version="${VERSION}" \
            org.opencontainers.image.revision="${REVISION}" \
            org.opencontainers.image.source="https://github.com/ash-dotfiles/ash-dotfiles" \
            org.opencontainers.image.licenses="MIT" \
            com.ash.component="cli-tools"

          # Optimized pacman config
          RUN sed -i \
              -e 's/^#ParallelDownloads/ParallelDownloads/' \
              -e 's/^#Color/Color/' \
              /etc/pacman.conf && \
              cat >> /etc/pacman.conf << 'PACMAN'
          [options]
          ILoveCandy
          PACMAN

          # Install dependencies in single layer
          RUN --mount=type=cache,target=/var/cache/pacman \
              pacman -Syu --noconfirm --noprogressbar && \
              pacman -S --noconfirm --noprogressbar --needed \
                bash fish git jq bc python python-pip \
                imagemagick socat inotify-tools \
                fd ripgrep fzf zoxide && \
              pacman -Scc --noconfirm

          # Non-root build user
          RUN useradd --create-home --shell /bin/fish ash-user && \
              mkdir -p /home/ash-user/.config/ash \
                       /home/ash-user/.local/share/ash && \
              chown -R ash-user:ash-user /home/ash-user

          WORKDIR /opt/ash-dotfiles

          COPY --chown=ash-user:ash-user ash-cli/ ./ash-cli/
          COPY --chown=ash-user:ash-user themes/   ./themes/
          COPY --chown=ash-user:ash-user config/   ./config/
          COPY --chown=ash-user:ash-user plugins/  ./plugins/

          RUN chmod +x ash-cli/ash && \
              find ash-cli -name "*.sh" -exec chmod 755 {} \; && \
              ln -sf /opt/ash-dotfiles/ash-cli/ash /usr/local/bin/ash

          ENV \
            ASH_DATA_DIR=/opt/ash-dotfiles \
            ASH_CLI_CONTAINER=1 \
            PATH="/opt/ash-dotfiles/ash-cli:${PATH}" \
            TERM=xterm-256color \
            COLORTERM=truecolor

          HEALTHCHECK --interval=60s --timeout=5s --retries=2 \
              CMD ash --version || exit 1

          USER ash-user
          WORKDIR /home/ash-user
          SHELL ["/bin/fish", "--login", "-c"]
          CMD ["bash"]
          CLI_DOCKERFILE
          echo "  ✅ docker/Dockerfile.cli"

          # ── Test Environment ──────────────────────────────────────────────
          [[ ! -f "docker/Dockerfile.test" ]] && cat > docker/Dockerfile.test << 'TEST_DOCKERFILE'
          # syntax=docker/dockerfile:1.6
          # ╔══════════════════════════════════════════════════════════════════╗
          # ║  ASH Dotfiles — CI/CD Test Environment                         ║
          # ╚══════════════════════════════════════════════════════════════════╝

          FROM archlinux:latest AS test-env
          ARG BUILD_DATE VERSION REVISION
          LABEL \
            org.opencontainers.image.title="ASH Test Environment" \
            org.opencontainers.image.description="ASH Dotfiles v5.0 OMEGA CI/CD Test Environment" \
            org.opencontainers.image.created="${BUILD_DATE}" \
            org.opencontainers.image.version="${VERSION}" \
            org.opencontainers.image.revision="${REVISION}" \
            org.opencontainers.image.source="https://github.com/ash-dotfiles/ash-dotfiles" \
            com.ash.component="test-environment"

          RUN --mount=type=cache,target=/var/cache/pacman \
              pacman -Syu --noconfirm --noprogressbar && \
              pacman -S --noconfirm --noprogressbar --needed \
                bash fish git jq bc python python-pip \
                imagemagick socat inotify-tools \
                fd ripgrep shellcheck luacheck \
                nodejs npm gcc make && \
              pacman -Scc --noconfirm

          # BATS test framework + support libraries
          RUN --mount=type=cache,target=/tmp/bats-cache \
              git clone --depth=1 --branch=v1.11.0 \
                https://github.com/bats-core/bats-core.git \
                /tmp/bats-cache/bats-core 2>/dev/null || true && \
              cp -r /tmp/bats-cache/bats-core /tmp/bats && \
              /tmp/bats/install.sh /usr/local && \
              for lib in support assert file; do \
                git clone --depth=1 \
                  "https://github.com/bats-core/bats-${lib}.git" \
                  "/usr/local/lib/bats-${lib}"; \
              done && \
              rm -rf /tmp/bats

          WORKDIR /workspace
          COPY . .

          RUN find /workspace/ash-cli -name "*.sh" -exec chmod 755 {} \; && \
              [[ -f /workspace/ash-cli/ash ]] && \
                chmod +x /workspace/ash-cli/ash && \
                ln -sf /workspace/ash-cli/ash /usr/local/bin/ash || true

          ENV \
            ASH_TEST_MODE=1 \
            ASH_NO_COLOR=1 \
            ASH_LOG_LEVEL=debug \
            BATS_LIB_PATH=/usr/local/lib \
            CI=true

          CMD ["bash", "tests/run-all-tests.sh"]
          TEST_DOCKERFILE
          echo "  ✅ docker/Dockerfile.test"

          # ── .dockerignore ──────────────────────────────────────────────────
          cat > .dockerignore << 'IGNORE'
          # ASH Dotfiles — .dockerignore
          .git
          .github
          node_modules
          .pnpm-store
          target/
          dist/
          build/
          __pycache__/
          *.pyc
          .venv/
          venv/
          .env
          .env.*
          secrets/
          data/cache/
          data/logs/
          data/analytics/
          backups/
          *.sarif
          *.log
          assets/wallpapers/
          assets/videos/
          assets/sounds/
          docs/
          mobile/
          IGNORE
          echo "  ✅ .dockerignore"

      - name: "📤 Cache Dockerfiles"
        uses: actions/cache/save@v4
        with:
          path: |
            docker/
            .dockerignore
          key: "ghcr-dockerfiles-${{ github.sha }}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: BUILD-PUSH — Build and push to GHCR
  # ────────────────────────────────────────────────────────────────────────────
  build-push:
    name: "🔨 Build & Push [${{ matrix.suffix }}]"
    needs: [context, generate-dockerfiles]
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.context.outputs.image-matrix) }}

    outputs:
      digest-${{ matrix.suffix }}: ${{ steps.build.outputs.digest }}
      image-ref-${{ matrix.suffix }}: ${{ steps.tags.outputs.image_ref }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📥 Restore Dockerfiles"
        uses: actions/cache/restore@v4
        with:
          path: |
            docker/
            .dockerignore
          key: "ghcr-dockerfiles-${{ github.sha }}"
          restore-keys: "ghcr-dockerfiles-"

      - name: "⚙️ Setup QEMU"
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ env.PLATFORMS }}

      - name: "🔨 Setup Docker Buildx"
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          buildkitd-flags: |
            --debug
            --allow-insecure-entitlement security.insecure
          config-inline: |
            [worker.oci]
              max-parallelism = 4

      - name: "🔑 Login to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🏷️ Generate OCI Tags & Labels"
        id: tags
        shell: bash
        run: |
          VERSION="${{ needs.context.outputs.version }}"
          SHA="${{ needs.context.outputs.short-sha }}"
          SUFFIX="${{ matrix.suffix }}"
          IS_RELEASE="${{ needs.context.outputs.is-release }}"
          IS_NIGHTLY="${{ needs.context.outputs.is-nightly }}"

          IMAGE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${SUFFIX}"

          # Parse semver
          MAJOR="$(echo "${VERSION}" | cut -d. -f1)"
          MINOR_MAJ="$(echo "${VERSION}" | cut -d. -f1-2)"

          # Build tags based on context
          TAGS="${IMAGE}:sha-${SHA}"
          TAGS="${TAGS},${IMAGE}:${VERSION}"

          if [[ "${IS_RELEASE}" == "true" ]]; then
            TAGS="${TAGS},${IMAGE}:${MAJOR}"
            TAGS="${TAGS},${IMAGE}:${MINOR_MAJ}"
            TAGS="${TAGS},${IMAGE}:latest"
            TAGS="${TAGS},${IMAGE}:stable"
          elif [[ "${IS_NIGHTLY}" == "true" ]]; then
            TAGS="${TAGS},${IMAGE}:nightly"
            TAGS="${TAGS},${IMAGE}:edge"
          else
            TAGS="${TAGS},${IMAGE}:dev"
          fi

          # OCI labels
          LABELS="$(cat << LABELS
          org.opencontainers.image.title=ASH Dotfiles ${{ matrix.title }}
          org.opencontainers.image.description=ASH Dotfiles v$VERSION OMEGA - ${{ matrix.title }}
          org.opencontainers.image.version=$VERSION
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created=${{ needs.context.outputs.build-date }}
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.url=https://ash-dotfiles.github.io
          org.opencontainers.image.licenses=MIT
          org.opencontainers.image.vendor=ASH Dotfiles Team
          com.ash.version=$VERSION
          com.ash.component=${{ matrix.key }}
          com.ash.build-date=${{ needs.context.outputs.build-date }}
          LABELS
          )"

          IMAGE_REF="${IMAGE}:${VERSION}"

          echo "tags=${TAGS}"           >> "${GITHUB_OUTPUT}"
          echo "labels=${LABELS}"       >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE}"         >> "${GITHUB_OUTPUT}"
          echo "image_ref=${IMAGE_REF}" >> "${GITHUB_OUTPUT}"

          echo "  📊 Tags to push:"
          echo "${TAGS}" | tr ',' '\n' | while IFS= read -r t; do
            echo "     → ${t}"
          done

      - name: "🗄️ Restore Layer Cache"
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-${{ matrix.suffix }}
          key: >-
            buildx-${{ matrix.suffix }}-${{ runner.os }}-
            ${{ hashFiles(matrix.dockerfile,'api/requirements.txt','ash-cli/**') }}
          restore-keys: |
            buildx-${{ matrix.suffix }}-${{ runner.os }}-

      - name: "🔨 Build & Push Image"
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ needs.context.outputs.push-enabled == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          no-cache: false
          cache-from: |
            type=local,src=/tmp/.buildx-cache-${{ matrix.suffix }}
            type=registry,ref=${{ steps.tags.outputs.image }}:buildcache
          cache-to: |
            type=local,dest=/tmp/.buildx-cache-${{ matrix.suffix }}-new,mode=max
            type=registry,ref=${{ steps.tags.outputs.image }}:buildcache,mode=max
          build-args: |
            BUILD_DATE=${{ needs.context.outputs.build-date }}
            VERSION=${{ needs.context.outputs.version }}
            REVISION=${{ github.sha }}
            ASH_VERSION=${{ needs.context.outputs.version }}
          sbom: ${{ inputs.generate_sbom != 'false' }}
          provenance: mode=max
          outputs: type=image,push=${{ needs.context.outputs.push-enabled == 'true' }}
          annotations: |
            index:org.opencontainers.image.title=ASH Dotfiles ${{ matrix.title }}
            index:org.opencontainers.image.description=Multi-platform ASH Dotfiles v${{ needs.context.outputs.version }} container image

      - name: "🔄 Rotate Layer Cache"
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/.buildx-cache-${{ matrix.suffix }}
          mv /tmp/.buildx-cache-${{ matrix.suffix }}-new \
             /tmp/.buildx-cache-${{ matrix.suffix }} 2>/dev/null || true

      - name: "📊 Image Digest Report"
        if: steps.build.outputs.digest != ''
        shell: bash
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          VERSION="${{ needs.context.outputs.version }}"
          IMAGE="${{ steps.tags.outputs.image }}"

          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  📦 Image: %-49s║\n" "${{ matrix.suffix }}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  🏷️  Ref:    %-46s║\n" "${IMAGE}:${VERSION}"
          printf "║  🔑 Digest: %-46s║\n" "${DIGEST:0:19}..."
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo ""
          echo "  🐳 Docker pull commands:"
          echo "     docker pull ${IMAGE}:${VERSION}"
          echo "     docker pull ${IMAGE}@${DIGEST}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: SIGN-ATTEST — Cosign signing + SLSA attestation
  # ────────────────────────────────────────────────────────────────────────────
  sign-attest:
    name: "🔐 Sign & Attest Images"
    needs: [context, build-push]
    if: >
      needs.context.outputs.push-enabled == 'true' &&
      inputs.sign != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      signed: ${{ steps.sign.outputs.signed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🔑 Login to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🛠️ Install Cosign"
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: "🔐 Sign All Images with Cosign (Keyless)"
        id: sign
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔐 Cosign Keyless Signing (OIDC)                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          VERSION="${{ needs.context.outputs.version }}"
          SIGNED_COUNT=0
          TOTAL_COUNT=0

          # Parse image matrix
          IMAGES=("ash-api" "ash-cli" "ash-test")

          for SUFFIX in "${IMAGES[@]}"; do
            IMAGE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${SUFFIX}:${VERSION}"
            TOTAL_COUNT=$((TOTAL_COUNT + 1))

            echo ""
            echo "  🔐 Signing: ${IMAGE}"

            # Get digest for immutable reference
            DIGEST="$(docker buildx imagetools inspect "${IMAGE}" \
              --format '{{json .Manifest}}' 2>/dev/null | \
              python3 -c "import json,sys; m=json.load(sys.stdin); print(m.get('digest',''))" \
              2>/dev/null || echo '')"

            if [[ -z "${DIGEST}" ]]; then
              echo "  ⚠️  Could not get digest for ${IMAGE} — skipping"
              continue
            fi

            IMAGE_WITH_DIGEST="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${SUFFIX}@${DIGEST}"

            # Sign with keyless OIDC
            sign_exit=0
            cosign sign \
              --yes \
              --recursive \
              --annotations="ash.version=${VERSION}" \
              --annotations="ash.component=${SUFFIX}" \
              --annotations="ash.build-date=${{ needs.context.outputs.build-date }}" \
              "${IMAGE_WITH_DIGEST}" \
              2>&1 | tee /tmp/cosign-${SUFFIX}.log || sign_exit=$?

            if [[ ${sign_exit} -eq 0 ]]; then
              echo "  ✅ Signed: ${SUFFIX}"
              SIGNED_COUNT=$((SIGNED_COUNT + 1))

              # Generate key-value attestation
              echo ""
              echo "  📋 Attesting: ${SUFFIX}"
              cat > /tmp/predicate-${SUFFIX}.json << PRED
          {
            "buildType": "https://ash-dotfiles.github.io/attestation/v1",
            "builder": {
              "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            },
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                "digest": {"sha1": "${{ github.sha }}"},
                "entryPoint": ".github/workflows/release/publish-ghcr.yml"
              }
            },
            "metadata": {
              "buildStartedOn": "${{ needs.context.outputs.build-date }}",
              "completeness": {"parameters": true, "environment": false, "materials": false},
              "reproducible": false
            },
            "materials": [
              {
                "uri": "git+https://github.com/${{ github.repository }}",
                "digest": {"sha1": "${{ github.sha }}"}
              }
            ]
          }
          PRED

              cosign attest \
                --yes \
                --predicate /tmp/predicate-${SUFFIX}.json \
                --type https://slsa.dev/provenance/v0.2 \
                "${IMAGE_WITH_DIGEST}" \
                2>/dev/null && \
                echo "  ✅ SLSA attestation attached" || \
                echo "  ⚠️  Attestation failed"
            else
              echo "  ⚠️  Signing failed for ${SUFFIX}"
            fi
          done

          echo ""
          echo "  📊 Signing complete: ${SIGNED_COUNT}/${TOTAL_COUNT} images"
          echo "signed=$([[ ${SIGNED_COUNT} -gt 0 ]] && echo 'true' || echo 'false')" \
            >> "${GITHUB_OUTPUT}"

      - name: "🔍 Verify Signatures"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔍 Cosign Signature Verification                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          VERSION="${{ needs.context.outputs.version }}"
          CERT_OIDC="https://token.actions.githubusercontent.com"
          CERT_IDENTITY="https://github.com/${{ github.repository }}/.github/workflows/release/publish-ghcr.yml@${{ github.ref }}"

          for SUFFIX in ash-api ash-cli; do
            IMAGE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${SUFFIX}:${VERSION}"
            echo "  🔍 Verifying: ${IMAGE}"

            cosign verify \
              --certificate-oidc-issuer="${CERT_OIDC}" \
              --certificate-identity="${CERT_IDENTITY}" \
              "${IMAGE}" \
              2>/dev/null | python3 -c "
          import json, sys
          sigs = json.loads(sys.stdin.read())
          print(f'  ✅ {len(sigs)} signature(s) verified')
          for s in sigs[:1]:
              cert = s.get('optional', {})
              print(f'     Issuer:   {cert.get(\"Issuer\", \"N/A\")}')
              print(f'     Identity: {cert.get(\"Subject\", \"N/A\")}')
          " 2>/dev/null || echo "  ⚠️  Verification failed (may be timing issue)"
          done

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 05: SECURITY-SCAN — Trivy vulnerability scanning
  # ────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: "🔒 Security Scan"
    needs: [context, build-push]
    if: >
      needs.context.outputs.push-enabled == 'true' &&
      inputs.scan != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    outputs:
      critical-vulns: ${{ steps.scan.outputs.critical }}
      scan-passed:    ${{ steps.scan.outputs.passed }}

    steps:
      - name: "🛠️ Install Trivy"
        shell: bash
        run: |
          sudo apt-get install -qq -y wget gnupg 2>/dev/null
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list > /dev/null
          sudo apt-get update -qq 2>/dev/null
          sudo apt-get install -qq -y trivy 2>/dev/null
          echo "  ✅ Trivy: $(trivy --version | head -1)"

      - name: "🔒 Scan Images"
        id: scan
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔒 Trivy Vulnerability Scanner                             ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          VERSION="${{ needs.context.outputs.version }}"
          total_critical=0
          scan_passed=true

          mkdir -p scan-results

          for SUFFIX in ash-api ash-cli ash-test; do
            IMAGE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${SUFFIX}:${VERSION}"
            echo ""
            echo "  🔍 Scanning: ${IMAGE}"

            trivy image \
              --severity=CRITICAL,HIGH \
              --format=json \
              --output="scan-results/${SUFFIX}.json" \
              --ignore-unfixed=true \
              --exit-code=0 \
              --cache-dir=/tmp/.trivy-cache \
              --timeout=10m \
              "${IMAGE}" 2>/dev/null || true

            if [[ -f "scan-results/${SUFFIX}.json" ]]; then
              critical="$(jq '
                [.Results[]?.Vulnerabilities[]? |
                 select(.Severity == "CRITICAL")] | length
              ' "scan-results/${SUFFIX}.json" 2>/dev/null || echo 0)"
              high="$(jq '
                [.Results[]?.Vulnerabilities[]? |
                 select(.Severity == "HIGH")] | length
              ' "scan-results/${SUFFIX}.json" 2>/dev/null || echo 0)"

              total_critical=$((total_critical + critical))

              if [[ $((critical + high)) -gt 0 ]]; then
                echo "  ⚠️  ${SUFFIX}: ${critical} critical, ${high} high"
                jq -r '
                  .Results[]?.Vulnerabilities[]? |
                  select(.Severity == "CRITICAL") |
                  "     🔴 \(.VulnerabilityID): \(.PkgName) → fix: \(.FixedVersion // "N/A")"
                ' "scan-results/${SUFFIX}.json" 2>/dev/null | head -5
              else
                echo "  ✅ ${SUFFIX}: Clean"
              fi
            fi
          done

          [[ ${total_critical} -gt 0 ]] && scan_passed=false

          echo ""
          echo "  📊 Total critical CVEs: ${total_critical}"
          echo "critical=${total_critical}" >> "${GITHUB_OUTPUT}"
          echo "passed=${scan_passed}"      >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload Scan Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "ghcr-scan-results-${{ needs.context.outputs.version }}"
          path: scan-results/
          retention-days: 30
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 06: GATE — Quality gate
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — GHCR Publish"
    needs: [context, build-push, sign-attest, security-scan]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "💬 Update Release Notes"
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const version      = "${{ needs.context.outputs.version }}";
            const buildPassed  = "${{ needs.build-push.result }}" === "success";
            const signPassed   = "${{ needs.sign-attest.result }}" === "success" ||
                                 "${{ needs.sign-attest.result }}" === "skipped";
            const scanPassed   = "${{ needs.security-scan.outputs.scan-passed || 'true' }}" === "true";
            const criticalVulns= parseInt("${{ needs.security-scan.outputs.critical-vulns || 0 }}");
            const platforms    = "${{ env.PLATFORMS }}";
            const signed       = "${{ needs.sign-attest.outputs.signed || 'false' }}" === "true";

            const overall = buildPassed && signPassed;

            if (!overall) { console.log("  ⚠️  Skipping release update — build not successful"); return; }

            const section = `

            ## 🐋 Container Images

            | Registry | Image | Platforms |
            |----------|-------|-----------|
            | 📦 GHCR | \`ghcr.io/ash-dotfiles/ash-api:${version}\` | \`${platforms}\` |
            | 📦 GHCR | \`ghcr.io/ash-dotfiles/ash-cli:${version}\` | \`${platforms}\` |
            | 📦 GHCR | \`ghcr.io/ash-dotfiles/ash-test:${version}\` | \`${platforms}\` |

            **Security:** ${signed ? "✅ Signed with Cosign (keyless OIDC)" : "⚠️ Not signed"} | ${criticalVulns === 0 ? "✅ No critical CVEs" : `⚠️ ${criticalVulns} critical CVEs`}

            \`\`\`bash
            # Pull latest
            docker pull ghcr.io/ash-dotfiles/ash-api:${version}
            docker pull ghcr.io/ash-dotfiles/ash-cli:${version}

            # Verify signature
            cosign verify \\
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com \\
              --certificate-identity=https://github.com/ash-dotfiles/ash-dotfiles/.github/workflows/release/publish-ghcr.yml@refs/heads/main \\
              ghcr.io/ash-dotfiles/ash-api:${version}
            \`\`\``;

            try {
              const { data: releases } = await github.rest.repos.listReleases({
                owner: context.repo.owner, repo: context.repo.repo, per_page: 1,
              });
              if (releases.length > 0) {
                const release = releases[0];
                await github.rest.repos.updateRelease({
                  owner:      context.repo.owner,
                  repo:       context.repo.repo,
                  release_id: release.id,
                  body:       (release.body || "") + section,
                });
                console.log("  ✅ Release notes updated with GHCR info");
              }
            } catch(e) { console.log(`  ℹ️  ${e.message}`); }

      - name: "🚦 Evaluate Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 GHCR Publish Quality Gate                               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          build_result="${{ needs.build-push.result }}"
          sign_result="${{ needs.sign-attest.result }}"
          scan_passed="${{ needs.security-scan.outputs.scan-passed || 'true' }}"
          version="${{ needs.context.outputs.version }}"
          push_enabled="${{ needs.context.outputs.push-enabled }}"

          echo ""
          echo "  📊 Gate Summary:"
          echo "  ├── Version:     ${version}"
          echo "  ├── Build:       ${build_result}"
          echo "  ├── Sign:        ${sign_result}"
          echo "  ├── Scan passed: ${scan_passed}"
          echo "  └── Pushed:      ${push_enabled}"
          echo ""

          if [[ "${build_result}" == "success" ]]; then
            echo "  ✅ GHCR GATE: PASSED"
            if [[ "${push_enabled}" == "true" ]]; then
              echo "  🎉 Images published to GHCR!"
              echo ""
              for suffix in ash-api ash-cli ash-test; do
                echo "  → ghcr.io/ash-dotfiles/${suffix}:${version}"
              done
            else
              echo "  ℹ️  Images built but not pushed (push disabled)"
            fi
          else
            echo "  ❌ GHCR GATE: FAILED"
            exit 1
          fi
