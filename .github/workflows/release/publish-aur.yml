# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🏔️  ASH DOTFILES v5.0 OMEGA — AUR PUBLISH WORKFLOW                               ║
# ║                                                                                          ║
# ║      Ultra-Premium Arch User Repository Package Publication Pipeline                   ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      PKGBUILD Generation   •  .SRCINFO Build       •  Checksum Verify               ║
# ║      makepkg Validation    •  namcap Quality Check •  AUR SSH Push                 ║
# ║      Multi-Package Support •  VCS Package Sync     •  Version Bump                ║
# ║      Dependency Resolution •  AUR API Check        •  Package Diff               ║
# ║      Build Test            •  Install Test         •  Rollback Guard             ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🏔️ AUR — Publish Arch User Repository Package"

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 5.1.0)"
        required: true
        type: string
      pkgrel:
        description: "Package release number"
        required: false
        default: "1"
        type: string
      packages:
        description: "Packages to publish"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - ash-dotfiles
          - ash-dotfiles-git
          - ash-dotfiles-bin
      dry_run:
        description: "Dry run (validate but don't push)"
        required: false
        default: true
        type: boolean
      force_push:
        description: "Force push (overwrite existing)"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "0 18 * * 1"

permissions:
  contents: read

concurrency:
  group: "aur-publish-${{ github.ref }}"
  cancel-in-progress: false

env:
  AUR_USER: "ash-dotfiles-bot"
  AUR_HOST: "aur.archlinux.org"
  PACKAGER: "ASH Dotfiles Team <team@ash-dotfiles.dev>"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: PREPARE — Generate PKGBUILDs and metadata
  # ────────────────────────────────────────────────────────────────────────────
  prepare:
    name: "📋 Prepare AUR Packages"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      version:      ${{ steps.prep.outputs.version }}
      pkgrel:       ${{ steps.prep.outputs.pkgrel }}
      sha256:       ${{ steps.prep.outputs.sha256 }}
      pkg-matrix:   ${{ steps.prep.outputs.pkg_matrix }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "📋 Prepare Package Data"
        id: prep
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🏔️  AUR Package Preparation                                 ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Determine version
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ -n "${{ github.event.release.tag_name }}" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(jq -r '.version // "5.0.0"' version.json 2>/dev/null || echo '5.0.0')"
          fi

          PKGREL="${{ inputs.pkgrel || '1' }}"

          # Get SHA256 of release tarball
          TAG="v${VERSION}"
          TARBALL_URL="https://github.com/ash-dotfiles/ash-dotfiles/archive/refs/tags/${TAG}.tar.gz"

          echo "  📥 Fetching release tarball checksum..."
          SHA256="$(curl -sSL "${TARBALL_URL}" | sha256sum | cut -d' ' -f1 2>/dev/null || \
            echo 'SKIP')"

          echo "  📊 Package Configuration:"
          echo "  ├── Version:  ${VERSION}"
          echo "  ├── pkgrel:   ${PKGREL}"
          echo "  ├── SHA256:   ${SHA256:0:16}..."
          echo "  └── Tag:      ${TAG}"

          # Build package matrix
          PKG_TARGET="${{ inputs.packages || 'all' }}"
          matrix_include="[]"

          declare -A PKG_NAMES=(
            ["ash-dotfiles"]="stable release"
            ["ash-dotfiles-git"]="git VCS"
            ["ash-dotfiles-bin"]="binary"
          )

          for pkg in "${!PKG_NAMES[@]}"; do
            if [[ "${PKG_TARGET}" == "all" || "${PKG_TARGET}" == "${pkg}" ]]; then
              matrix_include="$(echo "${matrix_include}" | jq \
                --arg pkg "${pkg}" \
                --arg desc "${PKG_NAMES[$pkg]}" \
                '. += [{"package": $pkg, "description": $desc}]')"
            fi
          done

          {
            echo "version=${VERSION}"
            echo "pkgrel=${PKGREL}"
            echo "sha256=${SHA256}"
            echo "pkg_matrix={\"include\": ${matrix_include}}"
          } >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: BUILD-PKGBUILDS — Generate all PKGBUILD files
  # ────────────────────────────────────────────────────────────────────────────
  build-pkgbuilds:
    name: "🔨 Build PKGBUILD [${{ matrix.package }}]"
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.pkg-matrix) }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🔨 Generate PKGBUILD"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔨 PKGBUILD Generator [${{ matrix.package }}]              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          PKG="${{ matrix.package }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          PKGREL="${{ needs.prepare.outputs.pkgrel }}"
          SHA256="${{ needs.prepare.outputs.sha256 }}"
          TAG="v${VERSION}"

          mkdir -p "aur-packages/${PKG}"

          case "${PKG}" in
            ash-dotfiles)
              cat > "aur-packages/${PKG}/PKGBUILD" << PKGBUILD
          # Maintainer: ASH Dotfiles Team <team@ash-dotfiles.dev>
          # Co-Maintainer: ASH Dotfiles Bot <bot@ash-dotfiles.dev>

          pkgname=ash-dotfiles
          pkgver=${VERSION}
          pkgrel=${PKGREL}
          pkgdesc="ASH Dotfiles v5.0 OMEGA — Ultra-Premium Hyprland Desktop Environment"
          arch=('x86_64' 'aarch64')
          url="https://github.com/ash-dotfiles/ash-dotfiles"
          license=('MIT')
          depends=(
            'bash>=5.0'     'fish'          'hyprland'
            'waybar'        'rofi-wayland'  'dunst'
            'kitty'         'swww'          'python'
            'jq'            'imagemagick'   'git'
            'socat'         'inotify-tools' 'fd'
            'ripgrep'       'fzf'           'zoxide'
          )
          optdepends=(
            'hyprlock: lock screen integration'
            'hypridle: idle session management'
            'wlogout: graphical logout menu'
            'neovim: editor integration'
            'starship: enhanced shell prompt'
            'atuin: shell history sync'
            'btop: system performance monitor'
            'fastfetch: system information display'
            'cava: audio visualizer'
            'yazi: file manager integration'
            'ags: alternative bar widgets'
            'swaynotificationcenter: notification center'
            'python-pip: plugin Python dependencies'
            'nodejs: web dashboard support'
          )
          makedepends=('git' 'python')
          conflicts=('ash-dotfiles-git' 'ash-dotfiles-bin')
          provides=('ash-dotfiles')
          install=ash-dotfiles.install
          changelog=CHANGELOG.md
          backup=(
            'etc/ash-dotfiles/defaults.conf'
          )

          source=("ash-dotfiles-\${pkgver}.tar.gz::https://github.com/ash-dotfiles/ash-dotfiles/archive/refs/tags/${TAG}.tar.gz")
          sha256sums=('${SHA256}')
          b2sums=('SKIP')

          pkgver() {
            echo "${VERSION}"
          }

          prepare() {
            cd "\${srcdir}/ash-dotfiles-\${pkgver}"
            # Verify essential structure
            for dir in ash-cli themes config scripts plugins; do
              [[ -d "\${dir}" ]] || { echo "ERROR: Missing directory: \${dir}"; exit 1; }
            done
            python3 -c "import sys; sys.exit(0 if tuple(map(int, sys.version_info[:2])) >= (3,11) else 1)" || {
              echo "ERROR: Python >= 3.11 required"
              exit 1
            }
          }

          build() {
            cd "\${srcdir}/ash-dotfiles-\${pkgver}"
            # Pre-compile Python files for faster startup
            python3 -m compileall ash-cli/ scripts/ 2>/dev/null || true
          }

          check() {
            cd "\${srcdir}/ash-dotfiles-\${pkgver}"
            # Validate shell scripts
            bash -n ash-cli/ash || { echo "ERROR: ash-cli syntax error"; exit 1; }
            # Validate JSON files
            for json_file in ash-cli/data/*.json; do
              python3 -c "import json; json.load(open('\${json_file}'))" || {
                echo "ERROR: Invalid JSON: \${json_file}"
                exit 1
              }
            done
          }

          package() {
            cd "\${srcdir}/ash-dotfiles-\${pkgver}"

            # Directory structure
            local SHARE="\${pkgdir}/usr/share/ash-dotfiles"
            local BIN="\${pkgdir}/usr/bin"
            local SYSCONF="\${pkgdir}/etc/ash-dotfiles"
            local LICENSES="\${pkgdir}/usr/share/licenses/ash-dotfiles"
            local DOCS="\${pkgdir}/usr/share/doc/ash-dotfiles"
            local SYSTEMD="\${pkgdir}/usr/lib/systemd/user"
            local BASH_COMP="\${pkgdir}/usr/share/bash-completion/completions"
            local FISH_COMP="\${pkgdir}/usr/share/fish/vendor_completions.d"
            local ZSH_COMP="\${pkgdir}/usr/share/zsh/site-functions"

            install -dm755 "\${SHARE}/"{ash-cli,config,themes,plugins,scripts}
            install -dm755 "\${BIN}" "\${SYSCONF}" "\${LICENSES}" "\${DOCS}"
            install -dm755 "\${SYSTEMD}"
            install -dm755 "\${BASH_COMP}" "\${FISH_COMP}" "\${ZSH_COMP}"

            # ASH CLI
            cp -r ash-cli/. "\${SHARE}/ash-cli/"
            chmod +x "\${SHARE}/ash-cli/ash"
            find "\${SHARE}/ash-cli" -name "*.sh" -exec chmod 755 {} \;
            ln -sf /usr/share/ash-dotfiles/ash-cli/ash "\${BIN}/ash"

            # Configuration
            cp -r config/. "\${SHARE}/config/"
            install -Dm644 ash-cli/data/defaults.conf "\${SYSCONF}/defaults.conf"

            # Themes library
            cp -r themes/. "\${SHARE}/themes/"

            # Plugin library
            cp -r plugins/. "\${SHARE}/plugins/"

            # Scripts
            cp -r scripts/. "\${SHARE}/scripts/"
            find "\${SHARE}/scripts" -name "*.sh" -exec chmod 755 {} \;

            # Systemd user services
            install -m644 systemd/user/*.service "\${SYSTEMD}/" 2>/dev/null || true
            install -m644 systemd/user/*.timer   "\${SYSTEMD}/" 2>/dev/null || true

            # Shell completions
            [[ -f ash-cli/commands/completion/ash.bash ]] && \
              install -Dm644 ash-cli/commands/completion/ash.bash "\${BASH_COMP}/ash"
            [[ -f ash-cli/commands/completion/ash.fish ]] && \
              install -Dm644 ash-cli/commands/completion/ash.fish "\${FISH_COMP}/ash.fish"
            [[ -f ash-cli/commands/completion/ash.zsh ]] && \
              install -Dm644 ash-cli/commands/completion/ash.zsh "\${ZSH_COMP}/_ash"

            # Documentation
            install -m644 README.md    "\${DOCS}/"
            install -m644 CHANGELOG.md "\${DOCS}/" 2>/dev/null || true

            # License
            install -m644 LICENSE "\${LICENSES}/"
          }
          PKGBUILD

              # ── install file ───────────────────────────────────────────────
              cat > "aur-packages/${PKG}/ash-dotfiles.install" << 'INSTALL'
          post_install() {
            printf '\n'
            printf '  \033[1;35m⚡ ASH Dotfiles Installed Successfully!\033[0m\n'
            printf '  \033[0;36m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
            printf '\n'
            printf '  \033[1mQuick Start:\033[0m\n'
            printf '    1. Start Hyprland from TTY\n'
            printf '    2. Apply a theme:  \033[0;32mash theme apply catppuccin-mocha\033[0m\n'
            printf '    3. Browse themes:  \033[0;32mash theme pick\033[0m\n'
            printf '    4. Get help:       \033[0;32mash --help\033[0m\n'
            printf '\n'
            printf '  \033[1mDocumentation:\033[0m https://ash-dotfiles.github.io/docs\n'
            printf '  \033[1mCommunity:\033[0m     https://discord.gg/ash-dotfiles\n'
            printf '\n'
          }

          post_upgrade() {
            printf '\n'
            printf '  \033[1;35m⚡ ASH Dotfiles Updated!\033[0m\n'
            printf '  Run: \033[0;32mash update --apply\033[0m to refresh your configuration\n'
            printf '\n'
          }

          pre_remove() {
            printf '\n'
            printf '  \033[0;33mℹ️  Your config in ~/.config/ash is preserved.\033[0m\n'
            printf '  Backup: \033[0;32mash snapshot create --name pre-remove\033[0m\n'
            printf '\n'
          }
          INSTALL
              ;;

            ash-dotfiles-git)
              cat > "aur-packages/${PKG}/PKGBUILD" << PKGBUILD
          # Maintainer: ASH Dotfiles Team <team@ash-dotfiles.dev>
          # VCS package tracking development HEAD

          pkgname=ash-dotfiles-git
          pkgver=${VERSION}.r0.gabcdef0
          pkgrel=${PKGREL}
          pkgdesc="ASH Dotfiles OMEGA (git, development HEAD)"
          arch=('x86_64' 'aarch64')
          url="https://github.com/ash-dotfiles/ash-dotfiles"
          license=('MIT')
          provides=('ash-dotfiles')
          conflicts=('ash-dotfiles' 'ash-dotfiles-bin')
          depends=(
            'bash>=5.0' 'fish' 'hyprland' 'waybar' 'rofi-wayland'
            'dunst' 'kitty' 'swww' 'python' 'jq' 'imagemagick'
            'git' 'socat' 'inotify-tools' 'fd' 'ripgrep' 'fzf' 'zoxide'
          )
          makedepends=('git')

          source=("ash-dotfiles::git+https://github.com/ash-dotfiles/ash-dotfiles.git")
          sha256sums=('SKIP')

          pkgver() {
            cd "\${srcdir}/ash-dotfiles"
            printf "%s.r%s.g%s" \
              "\$(git describe --tags --abbrev=0 | sed 's/^v//' || echo '${VERSION}')" \
              "\$(git rev-list --count HEAD)" \
              "\$(git rev-parse --short HEAD)"
          }

          prepare() {
            cd "\${srcdir}/ash-dotfiles"
            for dir in ash-cli themes config scripts plugins; do
              [[ -d "\${dir}" ]] || { echo "ERROR: Missing: \${dir}"; exit 1; }
            done
          }

          package() {
            cd "\${srcdir}/ash-dotfiles"
            local SHARE="\${pkgdir}/usr/share/ash-dotfiles"
            local BIN="\${pkgdir}/usr/bin"

            install -dm755 "\${SHARE}" "\${BIN}"
            cp -r ash-cli/. "\${SHARE}/ash-cli/"
            chmod +x "\${SHARE}/ash-cli/ash"
            find "\${SHARE}/ash-cli" -name "*.sh" -exec chmod 755 {} \;
            ln -sf /usr/share/ash-dotfiles/ash-cli/ash "\${BIN}/ash"
            cp -r config themes plugins scripts "\${SHARE}/"
            install -Dm644 LICENSE "\${pkgdir}/usr/share/licenses/ash-dotfiles-git/LICENSE"
            install -Dm644 README.md "\${pkgdir}/usr/share/doc/ash-dotfiles-git/README.md"
          }
          PKGBUILD
              ;;

            ash-dotfiles-bin)
              cat > "aur-packages/${PKG}/PKGBUILD" << PKGBUILD
          # Maintainer: ASH Dotfiles Team <team@ash-dotfiles.dev>
          # Binary package for faster installation

          pkgname=ash-dotfiles-bin
          pkgver=${VERSION}
          pkgrel=${PKGREL}
          pkgdesc="ASH Dotfiles OMEGA — Pre-built binary package"
          arch=('x86_64' 'aarch64')
          url="https://github.com/ash-dotfiles/ash-dotfiles"
          license=('MIT')
          provides=('ash-dotfiles')
          conflicts=('ash-dotfiles' 'ash-dotfiles-git')
          depends=(
            'bash>=5.0' 'fish' 'python' 'jq' 'imagemagick'
            'socat' 'inotify-tools' 'fd' 'ripgrep' 'fzf' 'zoxide'
          )

          source_x86_64=("ash-dotfiles-\${pkgver}-x86_64.tar.gz::https://github.com/ash-dotfiles/ash-dotfiles/releases/download/${TAG}/ash-dotfiles-${VERSION}.tar.gz")
          sha256sums_x86_64=('${SHA256}')

          package() {
            cd "\${srcdir}"
            local SHARE="\${pkgdir}/usr/share/ash-dotfiles"
            local BIN="\${pkgdir}/usr/bin"

            install -dm755 "\${SHARE}" "\${BIN}"
            [[ -d ash-dotfiles-* ]] && cp -r ash-dotfiles-*/. "\${SHARE}/" || \
              cp -r . "\${SHARE}/"
            chmod +x "\${SHARE}/ash-cli/ash" 2>/dev/null || true
            ln -sf /usr/share/ash-dotfiles/ash-cli/ash "\${BIN}/ash"
            install -Dm644 "\${SHARE}/LICENSE" \
              "\${pkgdir}/usr/share/licenses/ash-dotfiles-bin/LICENSE"
          }
          PKGBUILD
              ;;
          esac

          echo "  ✅ PKGBUILD generated for ${PKG}"

      - name: "📋 Generate .SRCINFO"
        shell: bash
        run: |
          echo "  📋 Generating .SRCINFO..."

          PKG="${{ matrix.package }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          PKGREL="${{ needs.prepare.outputs.pkgrel }}"
          SHA256="${{ needs.prepare.outputs.sha256 }}"
          TAG="v${VERSION}"

          python3 << SRCINFOGENS
          import re
          from pathlib import Path

          PKG_DIR = Path(f"aur-packages/$PKG")
          pkgbuild = (PKG_DIR / "PKGBUILD").read_text()

          def extract(key):
              # Handle single values
              m = re.search(rf'^{key}=(.+)$', pkgbuild, re.M)
              if m:
                  val = m.group(1).strip().strip("'\"")
                  return [val]
              # Handle arrays
              m = re.search(rf'^{key}=\((.+?)\)', pkgbuild, re.M | re.S)
              if m:
                  vals = re.findall(r"['\"]?([^'\")\s]+)['\"]?", m.group(1))
                  return [v for v in vals if v]
              return []

          pkgname    = extract("pkgname")
          pkgver     = extract("pkgver")
          pkgrel     = extract("pkgrel")
          pkgdesc    = extract("pkgdesc")
          url        = extract("url")
          arch       = extract("arch")
          license    = extract("license")
          depends    = extract("depends")
          makedepends= extract("makedepends")
          optdepends = extract("optdepends")
          provides   = extract("provides")
          conflicts  = extract("conflicts")
          source     = extract("source")
          sha256sums = extract("sha256sums")

          lines = [f"pkgbase = {pkgname[0] if pkgname else '$PKG'}"]
          for field, vals in [
              ("pkgver",     pkgver),
              ("pkgrel",     pkgrel),
              ("pkgdesc",    pkgdesc),
              ("url",        url),
              ("arch",       arch),
              ("license",    license),
              ("makedepends",makedepends),
              ("depends",    depends),
              ("optdepends", optdepends),
              ("provides",   provides),
              ("conflicts",  conflicts),
              ("source",     source),
              ("sha256sums", sha256sums),
          ]:
              for v in vals:
                  lines.append(f"\t{field} = {v}")

          lines.append("")
          lines.append(f"pkgname = {pkgname[0] if pkgname else '$PKG'}")

          srcinfo = "\n".join(lines) + "\n"
          (PKG_DIR / ".SRCINFO").write_text(srcinfo)
          print(f"  ✅ .SRCINFO generated")
          SRCINFOGENS

      - name: "📤 Upload Package Files"
        uses: actions/upload-artifact@v4
        with:
          name: "aur-package-${{ matrix.package }}"
          path: aur-packages/${{ matrix.package }}/
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: VALIDATE — Validate PKGBUILDs in Arch container
  # ────────────────────────────────────────────────────────────────────────────
  validate:
    name: "✅ Validate [${{ matrix.package }}]"
    needs: [prepare, build-pkgbuilds]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: archlinux:latest
      options: --user root

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.pkg-matrix) }}

    outputs:
      validation-passed: ${{ steps.validate.outputs.passed }}

    steps:
      - name: "📥 Download Package Files"
        uses: actions/download-artifact@v4
        with:
          name: "aur-package-${{ matrix.package }}"
          path: /tmp/pkg/

      - name: "⚙️ Setup Arch Environment"
        shell: bash
        run: |
          # Configure pacman
          sed -i 's/^#ParallelDownloads/ParallelDownloads/' /etc/pacman.conf
          cat >> /etc/pacman.d/mirrorlist << 'MIRRORS'
          Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
          Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
          MIRRORS
          pacman -Syu --noconfirm --noprogressbar 2>/dev/null
          pacman -S --noconfirm --noprogressbar --needed \
            base-devel namcap shellcheck git 2>/dev/null
          useradd -m -G wheel builduser
          echo "builduser ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

      - name: "✅ Validate PKGBUILD"
        id: validate
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ✅ AUR Package Validation [${{ matrix.package }}]           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          PKG_DIR="/tmp/pkg"
          errors=0

          # ── 1. Bash syntax ─────────────────────────────────────────────────
          echo "  [1/5] PKGBUILD bash syntax..."
          if bash -n "${PKG_DIR}/PKGBUILD" 2>/dev/null; then
            echo "  ✅ Syntax valid"
          else
            echo "  ❌ Syntax error"; errors=$((errors + 1))
          fi

          # ── 2. namcap PKGBUILD check ───────────────────────────────────────
          echo "  [2/5] namcap analysis..."
          namcap_output="$(namcap "${PKG_DIR}/PKGBUILD" 2>&1)"
          namcap_errors="$(echo "${namcap_output}" | grep -cE "^E:" || echo 0)"
          namcap_warnings="$(echo "${namcap_output}" | grep -cE "^W:" || echo 0)"

          if [[ ${namcap_errors} -gt 0 ]]; then
            echo "  ❌ namcap errors:"
            echo "${namcap_output}" | grep "^E:" | head -5
            errors=$((errors + namcap_errors))
          else
            echo "  ✅ namcap: ${namcap_errors} errors, ${namcap_warnings} warnings"
          fi

          # ── 3. ShellCheck ──────────────────────────────────────────────────
          echo "  [3/5] ShellCheck analysis..."
          sc_errors="$(shellcheck \
            --severity=error \
            --shell=bash \
            "${PKG_DIR}/PKGBUILD" 2>&1 | wc -l || echo 0)"
          if [[ ${sc_errors} -eq 0 ]]; then
            echo "  ✅ ShellCheck: clean"
          else
            echo "  ⚠️  ShellCheck: ${sc_errors} issues"
          fi

          # ── 4. Required sections ───────────────────────────────────────────
          echo "  [4/5] Required fields..."
          REQUIRED=(pkgname pkgver pkgrel pkgdesc arch url license source sha256sums)
          for field in "${REQUIRED[@]}"; do
            if grep -q "^${field}=" "${PKG_DIR}/PKGBUILD" || \
               grep -q "^${field}=(" "${PKG_DIR}/PKGBUILD"; then
              printf "  ✅ %-15s present\n" "${field}:"
            else
              echo "  ❌ Missing: ${field}"; errors=$((errors + 1))
            fi
          done

          # ── 5. .SRCINFO validation ─────────────────────────────────────────
          echo "  [5/5] .SRCINFO validation..."
          if [[ -f "${PKG_DIR}/.SRCINFO" ]]; then
            if grep -q "^pkgbase" "${PKG_DIR}/.SRCINFO" && \
               grep -q "^pkgname" "${PKG_DIR}/.SRCINFO"; then
              echo "  ✅ .SRCINFO structure valid"
            else
              echo "  ❌ .SRCINFO missing required fields"
              errors=$((errors + 1))
            fi
          else
            echo "  ❌ .SRCINFO missing"
            errors=$((errors + 1))
          fi

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  📊 Validation: %-42s║\n" "${errors} errors"

          passed="true"
          [[ ${errors} -gt 0 ]] && passed="false"
          [[ "${passed}" == "true" ]] && \
            echo "║  ✅ STATUS: VALIDATION PASSED                               ║" || \
            echo "║  ❌ STATUS: VALIDATION FAILED                               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: PUBLISH — Push to AUR
  # ────────────────────────────────────────────────────────────────────────────
  publish:
    name: "🚀 Publish [${{ matrix.package }}] to AUR"
    needs: [prepare, build-pkgbuilds, validate]
    if: >
      needs.validate.outputs.validation-passed == 'true' &&
      inputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.prepare.outputs.pkg-matrix) }}

    steps:
      - name: "📥 Download Package Files"
        uses: actions/download-artifact@v4
        with:
          name: "aur-package-${{ matrix.package }}"
          path: /tmp/pkg/

      - name: "🔑 Configure SSH for AUR"
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write SSH key
          if [[ -n "${{ secrets.AUR_SSH_PRIVATE_KEY }}" ]]; then
            echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur_key
            chmod 600 ~/.ssh/aur_key
          else
            echo "  ⚠️  AUR_SSH_PRIVATE_KEY not configured"
            # Create placeholder for dry-run
            ssh-keygen -t ed25519 -f ~/.ssh/aur_key -N "" -C "aur@ash-dotfiles" &>/dev/null
          fi

          # Configure SSH
          cat > ~/.ssh/config << 'SSHCONFIG'
          Host aur.archlinux.org
            HostName aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            ServerAliveInterval 30
          SSHCONFIG
          chmod 600 ~/.ssh/config

          # Add AUR host key
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          echo "  ✅ SSH configured for AUR"

      - name: "🚀 Publish to AUR"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚀 AUR Package Publication [${{ matrix.package }}]          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          PKG="${{ matrix.package }}"
          VERSION="${{ needs.prepare.outputs.version }}"

          # Configure git
          git config --global user.name  "ASH Dotfiles Bot"
          git config --global user.email "bot@ash-dotfiles.dev"

          # Clone AUR repo
          AUR_REPO="ssh://aur@aur.archlinux.org/${PKG}.git"
          WORK_DIR="/tmp/aur-${PKG}"

          echo "  📥 Cloning AUR repository..."
          if git clone "${AUR_REPO}" "${WORK_DIR}" 2>/dev/null; then
            echo "  ✅ Existing AUR repo cloned"
          else
            echo "  ℹ️  Creating new AUR repo..."
            mkdir -p "${WORK_DIR}"
            cd "${WORK_DIR}"
            git init
            git remote add origin "${AUR_REPO}"
          fi

          # Copy package files
          cp /tmp/pkg/PKGBUILD  "${WORK_DIR}/"
          cp /tmp/pkg/.SRCINFO  "${WORK_DIR}/"
          [[ -f "/tmp/pkg/${PKG}.install" ]] && \
            cp "/tmp/pkg/${PKG}.install" "${WORK_DIR}/" || true
          [[ -f "/tmp/pkg/CHANGELOG.md" ]] && \
            cp "/tmp/pkg/CHANGELOG.md" "${WORK_DIR}/" || true

          cd "${WORK_DIR}"

          # Show diff
          echo ""
          echo "  📋 Changes to publish:"
          git diff --stat HEAD 2>/dev/null || git status --short

          # Stage and commit
          git add PKGBUILD .SRCINFO *.install 2>/dev/null || git add .
          COMMIT_MSG="$(cat << COMMITMSG
          Update to ${VERSION}

          Auto-published by ASH Dotfiles release pipeline.
          Release: https://github.com/ash-dotfiles/ash-dotfiles/releases/tag/v${VERSION}
          COMMITMSG
          )"

          git commit -m "${COMMIT_MSG}" || {
            echo "  ℹ️  Nothing to commit (package may already be up to date)"
            exit 0
          }

          # Push to AUR
          if [[ "${{ inputs.force_push || 'false' }}" == "true" ]]; then
            git push --force origin master 2>&1
          else
            git push origin master 2>&1
          fi

          echo ""
          echo "  ✅ Package published to AUR!"
          echo "  🔗 https://aur.archlinux.org/packages/${PKG}"

      - name: "✅ Verify AUR Publication"
        shell: bash
        run: |
          PKG="${{ matrix.package }}"
          VERSION="${{ needs.prepare.outputs.version }}"

          echo "  🔍 Verifying AUR package..."
          sleep 30  # Wait for AUR index

          AUR_API="https://aur.archlinux.org/rpc/v5/info/${PKG}"
          aur_version="$(curl -sf "${AUR_API}" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(d['results'][0]['Version'].split('-')[0])" \
            2>/dev/null || echo 'unknown')"

          if [[ "${aur_version}" == "${VERSION}" ]]; then
            echo "  ✅ AUR version verified: ${aur_version}"
          else
            echo "  ⚠️  AUR shows: ${aur_version} (expected: ${VERSION})"
            echo "  ℹ️  AUR indexing may take a few minutes"
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 05: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — AUR Publish"
    needs: [prepare, validate, publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "🚦 Evaluate Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 AUR Publish Quality Gate                                ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          validation="${{ needs.validate.outputs.validation-passed || 'true' }}"
          publish_result="${{ needs.publish.result }}"
          dry_run="${{ inputs.dry_run || 'false' }}"
          version="${{ needs.prepare.outputs.version }}"

          echo ""
          echo "  📊 Gate Summary:"
          echo "  ├── Version:    ${version}"
          echo "  ├── Validation: ${validation}"
          echo "  ├── Publish:    ${publish_result}"
          echo "  └── Dry run:    ${dry_run}"
          echo ""

          if [[ "${validation}" == "true" ]]; then
            if [[ "${dry_run}" == "true" ]]; then
              echo "  ✅ AUR GATE: PASSED (dry run)"
              echo "  ℹ️  Packages validated but not published (dry-run mode)"
            elif [[ "${publish_result}" == "success" || "${publish_result}" == "skipped" ]]; then
              echo "  ✅ AUR GATE: PASSED"
              echo "  🎉 AUR packages published successfully!"
            else
              echo "  ❌ AUR GATE: FAILED"
              exit 1
            fi
          else
            echo "  ❌ AUR GATE: FAILED — Validation errors"
            exit 1
          fi