# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🐋 ASH DOTFILES v5.0 OMEGA — DOCKER HUB PUBLISH WORKFLOW                         ║
# ║                                                                                          ║
# ║      Ultra-Premium Multi-Platform Container Registry Publication Pipeline              ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      Docker Hub Publish    •  GHCR Publish         •  Multi-arch                     ║
# ║      Cosign Signing        •  SBOM Attestation     •  Provenance                    ║
# ║      Vulnerability Scan    •  Layer Optimization   •  Tag Strategy                 ║
# ║      Rolling Tags          •  Semantic Tags        •  Digest Pinning              ║
# ║      Readme Sync           •  Repository Metadata  •  Rate Limit                 ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🐋 Docker Hub — Multi-Registry Container Publish"

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 5.1.0)"
        required: true
        type: string
      targets:
        description: "Publish targets"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - dockerhub-only
          - ghcr-only
          - api-server
          - cli-tools
          - test-environment
      platforms:
        description: "Target platforms"
        required: false
        default: "linux/amd64,linux/arm64"
        type: string
      push_latest:
        description: "Push as :latest tag"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Dry run (build but don't push)"
        required: false
        default: false
        type: boolean
      scan_images:
        description: "Run Trivy security scan"
        required: false
        default: true
        type: boolean

  schedule:
    # Rebuild weekly for base image updates
    - cron: "0 20 * * 1"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

concurrency:
  group: "docker-hub-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

env:
  REGISTRY_DOCKERHUB: "docker.io"
  REGISTRY_GHCR: "ghcr.io"
  IMAGE_NAMESPACE_DH: "ashdotfiles"
  IMAGE_NAMESPACE_GHCR: "ash-dotfiles"
  PLATFORMS: "${{ inputs.platforms || 'linux/amd64,linux/arm64' }}"
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: "plain"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: PREPARE — Setup publish configuration
  # ────────────────────────────────────────────────────────────────────────────
  prepare:
    name: "📋 Prepare Docker Publish"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      version:        ${{ steps.prep.outputs.version }}
      tags-json:      ${{ steps.prep.outputs.tags_json }}
      image-matrix:   ${{ steps.prep.outputs.image_matrix }}
      should-push:    ${{ steps.prep.outputs.should_push }}
      short-sha:      ${{ steps.prep.outputs.short_sha }}
      build-date:     ${{ steps.prep.outputs.build_date }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "📋 Prepare Publish Configuration"
        id: prep
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🐋 Docker Publish Configuration                            ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Determine version
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ -n "${{ github.event.release.tag_name }}" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(jq -r '.version // "5.0.0"' version.json 2>/dev/null || echo '5.0.0')"
          fi

          SHORT_SHA="${GITHUB_SHA:0:8}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          PUSH_LATEST="${{ inputs.push_latest || 'true' }}"
          DRY_RUN="${{ inputs.dry_run || 'false' }}"
          SHOULD_PUSH="true"
          [[ "${DRY_RUN}" == "true" ]] && SHOULD_PUSH="false"
          [[ "${{ github.event_name }}" == "schedule" ]] && SHOULD_PUSH="true"

          echo "  📊 Configuration:"
          echo "  ├── Version:     ${VERSION}"
          echo "  ├── Short SHA:   ${SHORT_SHA}"
          echo "  ├── Build date:  ${BUILD_DATE}"
          echo "  ├── Platforms:   ${{ env.PLATFORMS }}"
          echo "  ├── Push:        ${SHOULD_PUSH}"
          echo "  └── Push latest: ${PUSH_LATEST}"

          # Parse semver for rolling tags
          MAJOR="$(echo "${VERSION}" | cut -d. -f1)"
          MINOR="$(echo "${VERSION}" | cut -d. -f2)"

          # Build tags JSON
          TAGS_JSON="$(python3 << TAGJSON
          import json

          VERSION = "$VERSION"
          MAJOR   = "$MAJOR"
          MINOR   = "$MINOR"
          SHA     = "$SHORT_SHA"
          DH_NS   = "${{ env.IMAGE_NAMESPACE_DH }}"
          GH_NS   = "${{ env.IMAGE_NAMESPACE_GHCR }}"
          PUSH_LATEST = "$PUSH_LATEST" == "true"

          def make_tags(image_suffix: str) -> dict:
              dh_base = f"{DH_NS}/{image_suffix}"
              gh_base = f"{GH_NS}/{image_suffix}"

              tags = {
                  "version":  [f"{dh_base}:{VERSION}", f"{gh_base}:{VERSION}"],
                  "major":    [f"{dh_base}:{MAJOR}", f"{gh_base}:{MAJOR}"],
                  "minor":    [f"{dh_base}:{MAJOR}.{MINOR}", f"{gh_base}:{MAJOR}.{MINOR}"],
                  "sha":      [f"{dh_base}:{SHA}", f"{gh_base}:{SHA}"],
              }
              if PUSH_LATEST:
                  tags["latest"] = [f"{dh_base}:latest", f"{gh_base}:latest"]

              return tags

          all_tags = {
              "api":   make_tags("ash-api"),
              "cli":   make_tags("ash-cli"),
              "test":  make_tags("ash-test"),
              "full":  make_tags("ash-dotfiles"),
          }

          print(json.dumps(all_tags))
          TAGJSON
          )"

          # Image build matrix
          targets="${{ inputs.targets || 'all' }}"
          matrix_include="[]"

          declare -A IMAGE_MAP=(
            ["api-server"]="api"
            ["cli-tools"]="cli"
            ["test-environment"]="test"
          )

          if [[ "${targets}" == "all" || "${targets}" == *"api"* ]]; then
            matrix_include="$(echo "${matrix_include}" | jq \
              '. += [{"name":"api-server","suffix":"api","dockerfile":"docker/Dockerfile.api"}]')"
          fi
          if [[ "${targets}" == "all" || "${targets}" == *"cli"* ]]; then
            matrix_include="$(echo "${matrix_include}" | jq \
              '. += [{"name":"cli-tools","suffix":"cli","dockerfile":"docker/Dockerfile.cli"}]')"
          fi
          if [[ "${targets}" == "all" || "${targets}" == *"test"* ]]; then
            matrix_include="$(echo "${matrix_include}" | jq \
              '. += [{"name":"test-environment","suffix":"test","dockerfile":"docker/Dockerfile.test"}]')"
          fi

          {
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "build_date=${BUILD_DATE}"
            echo "should_push=${SHOULD_PUSH}"
            echo "tags_json=${TAGS_JSON}"
            echo "image_matrix={\"include\": ${matrix_include}}"
          } >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: GENERATE-DOCKERFILES — Create optimized Dockerfiles
  # ────────────────────────────────────────────────────────────────────────────
  generate-dockerfiles:
    name: "⚙️ Generate Optimized Dockerfiles"
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "⚙️ Generate Production Dockerfiles"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ⚙️  Dockerfile Generation Engine                            ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p docker

          # ── API Server Dockerfile ──────────────────────────────────────────
          cat > docker/Dockerfile.api << 'APIDOCKERFILE'
          # ╔══════════════════════════════════════════════════════════════════╗
          # ║  ASH Dotfiles — API Server Container                           ║
          # ║  Multi-stage optimized production build                        ║
          # ╚══════════════════════════════════════════════════════════════════╝
          # syntax=docker/dockerfile:1.6

          # ── Stage 1: Build dependencies ───────────────────────────────────
          FROM python:3.12-slim AS builder
          LABEL stage=builder

          WORKDIR /build

          RUN apt-get update -qq && \
              apt-get install -y --no-install-recommends \
                gcc libpq-dev libffi-dev \
              && rm -rf /var/lib/apt/lists/*

          COPY api/requirements.txt ./
          RUN pip install --no-cache-dir --prefix=/install \
              -r requirements.txt

          # ── Stage 2: Runtime ──────────────────────────────────────────────
          FROM python:3.12-slim AS runtime
          LABEL \
            org.opencontainers.image.title="ASH Dotfiles API Server" \
            org.opencontainers.image.description="ASH Dotfiles v5.0 OMEGA REST API" \
            org.opencontainers.image.url="https://ash-dotfiles.github.io" \
            org.opencontainers.image.source="https://github.com/ash-dotfiles/ash-dotfiles" \
            org.opencontainers.image.licenses="MIT" \
            org.opencontainers.image.vendor="ASH Dotfiles Team"

          # Security: non-root user
          RUN groupadd --gid 1000 ash && \
              useradd --uid 1000 --gid 1000 \
                --shell /bin/bash \
                --home-dir /app \
                --no-create-home ash && \
              mkdir -p /app && \
              chown ash:ash /app

          WORKDIR /app

          # Install Python packages from builder
          COPY --from=builder /install /usr/local

          # Copy application
          COPY --chown=ash:ash api/ ./

          # Security hardening
          RUN chmod -R 550 /app

          # Health check
          HEALTHCHECK --interval=30s --timeout=10s \
              --start-period=10s --retries=3 \
              CMD python3 -c "import httpx; httpx.get('http://localhost:7070/api/v1/health', timeout=5).raise_for_status()" \
              || exit 1

          USER ash
          EXPOSE 7070

          # OCI annotations
          ARG BUILD_DATE VERSION REVISION
          LABEL \
            org.opencontainers.image.created="${BUILD_DATE}" \
            org.opencontainers.image.version="${VERSION}" \
            org.opencontainers.image.revision="${REVISION}"

          CMD ["python3", "-m", "uvicorn", "server:app", \
               "--host", "0.0.0.0", "--port", "7070", \
               "--workers", "2", "--log-level", "info"]
          APIDOCKERFILE

          # ── CLI Tools Dockerfile ───────────────────────────────────────────
          cat > docker/Dockerfile.cli << 'CLIDOCKERFILE'
          # ╔══════════════════════════════════════════════════════════════════╗
          # ║  ASH Dotfiles — CLI Tools Container                            ║
          # ╚══════════════════════════════════════════════════════════════════╝
          # syntax=docker/dockerfile:1.6

          FROM archlinux:latest AS ash-cli

          LABEL \
            org.opencontainers.image.title="ASH Dotfiles CLI" \
            org.opencontainers.image.description="ASH Dotfiles v5.0 OMEGA CLI Tools" \
            org.opencontainers.image.source="https://github.com/ash-dotfiles/ash-dotfiles" \
            org.opencontainers.image.licenses="MIT"

          # Configure pacman for performance
          RUN sed -i 's/^#ParallelDownloads/ParallelDownloads/' /etc/pacman.conf && \
              pacman -Syu --noconfirm --noprogressbar && \
              pacman -S --noconfirm --noprogressbar --needed \
                bash fish git jq bc python python-pip \
                imagemagick socat inotify-tools \
                fd ripgrep fzf zoxide && \
              pacman -Scc --noconfirm

          # Non-root user
          RUN useradd -m -s /bin/bash ash-user

          WORKDIR /opt/ash-dotfiles

          COPY ash-cli/   ./ash-cli/
          COPY themes/    ./themes/
          COPY config/    ./config/
          COPY plugins/   ./plugins/

          RUN chmod +x ash-cli/ash && \
              find ash-cli -name "*.sh" -exec chmod 755 {} \; && \
              ln -sf /opt/ash-dotfiles/ash-cli/ash /usr/local/bin/ash

          ENV ASH_DATA_DIR=/opt/ash-dotfiles \
              ASH_CLI=1 \
              PATH="/opt/ash-dotfiles/ash-cli:$PATH"

          HEALTHCHECK --interval=60s --timeout=5s CMD ash --version || exit 1

          ARG BUILD_DATE VERSION REVISION
          LABEL \
            org.opencontainers.image.created="${BUILD_DATE}" \
            org.opencontainers.image.version="${VERSION}" \
            org.opencontainers.image.revision="${REVISION}"

          USER ash-user
          WORKDIR /home/ash-user
          CMD ["bash"]
          CLIDOCKERFILE

          # ── Test Environment Dockerfile ────────────────────────────────────
          cat > docker/Dockerfile.test << 'TESTDOCKERFILE'
          # ╔══════════════════════════════════════════════════════════════════╗
          # ║  ASH Dotfiles — CI/CD Test Environment Container               ║
          # ╚══════════════════════════════════════════════════════════════════╝
          # syntax=docker/dockerfile:1.6

          FROM archlinux:latest AS test-env

          LABEL \
            org.opencontainers.image.title="ASH Dotfiles Test Environment" \
            org.opencontainers.image.description="ASH Dotfiles v5.0 OMEGA CI/CD Test Environment" \
            org.opencontainers.image.source="https://github.com/ash-dotfiles/ash-dotfiles"

          RUN sed -i 's/^#ParallelDownloads/ParallelDownloads/' /etc/pacman.conf && \
              pacman -Syu --noconfirm --noprogressbar && \
              pacman -S --noconfirm --noprogressbar --needed \
                bash fish git jq bc python python-pip \
                imagemagick socat inotify-tools \
                fd ripgrep shellcheck luacheck \
                nodejs npm gcc make && \
              pacman -Scc --noconfirm

          # Install BATS testing framework
          RUN git clone --depth=1 --branch=v1.11.0 \
                https://github.com/bats-core/bats-core.git /tmp/bats && \
              /tmp/bats/install.sh /usr/local && \
              rm -rf /tmp/bats && \
              git clone --depth=1 \
                https://github.com/bats-core/bats-support.git \
                /usr/local/lib/bats-support && \
              git clone --depth=1 \
                https://github.com/bats-core/bats-assert.git \
                /usr/local/lib/bats-assert

          WORKDIR /workspace
          COPY . .

          ENV ASH_TEST_MODE=1 \
              ASH_NO_COLOR=1 \
              BATS_LIB_PATH=/usr/local/lib

          ARG BUILD_DATE VERSION REVISION
          LABEL \
            org.opencontainers.image.created="${BUILD_DATE}" \
            org.opencontainers.image.version="${VERSION}" \
            org.opencontainers.image.revision="${REVISION}"

          CMD ["bash", "tests/run-all-tests.sh"]
          TESTDOCKERFILE

          # ── .dockerignore ──────────────────────────────────────────────────
          cat > .dockerignore << 'IGNORE'
          .git
          .github
          node_modules
          .pnpm-store
          target
          dist
          build
          __pycache__
          *.pyc
          .venv
          venv
          .env
          .env.*
          secrets/
          data/cache/
          data/logs/
          backups/
          *.sarif
          assets/wallpapers/
          assets/videos/
          docs/
          mobile/
          IGNORE

          echo "  ✅ All Dockerfiles generated"

      - name: "📤 Cache Dockerfiles"
        uses: actions/cache/save@v4
        with:
          path: |
            docker/
            .dockerignore
          key: "dockerfiles-${{ github.sha }}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: BUILD-PUSH — Build and push images
  # ────────────────────────────────────────────────────────────────────────────
  build-push:
    name: "🔨 Build & Push [${{ matrix.name }}]"
    needs: [prepare, generate-dockerfiles]
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.image-matrix) }}

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image-name: ${{ steps.build.outputs.image_name }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📥 Restore Dockerfiles"
        uses: actions/cache/restore@v4
        with:
          path: |
            docker/
            .dockerignore
          key: "dockerfiles-${{ github.sha }}"
          restore-keys: "dockerfiles-"

      - name: "⚙️ Setup QEMU"
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ env.PLATFORMS }}

      - name: "🔨 Setup Docker Buildx"
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          driver-opts: network=host
          buildkitd-flags: --debug

      - name: "🔑 Login to Docker Hub"
        if: needs.prepare.outputs.should-push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: "🔑 Login to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🏷️ Generate Image Tags"
        id: tags
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          SHA="${{ needs.prepare.outputs.short-sha }}"
          SUFFIX="${{ matrix.suffix }}"
          PUSH_LATEST="${{ inputs.push_latest || 'true' }}"

          MAJOR="$(echo "${VERSION}" | cut -d. -f1)"
          MINOR="$(echo "${VERSION}" | cut -d. -f1-2)"

          DH="${{ env.REGISTRY_DOCKERHUB }}/${{ env.IMAGE_NAMESPACE_DH }}/ash-${SUFFIX}"
          GH="${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAMESPACE_GHCR }}/ash-${SUFFIX}"

          TAGS="${DH}:${VERSION},${GH}:${VERSION}"
          TAGS="${TAGS},${DH}:${MAJOR},${GH}:${MAJOR}"
          TAGS="${TAGS},${DH}:${MINOR},${GH}:${MINOR}"
          TAGS="${TAGS},${DH}:sha-${SHA},${GH}:sha-${SHA}"

          [[ "${PUSH_LATEST}" == "true" ]] && \
            TAGS="${TAGS},${DH}:latest,${GH}:latest"

          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"
          echo "ghcr_image=${GH}" >> "${GITHUB_OUTPUT}"

          echo "  📊 Tags to publish:"
          echo "${TAGS}" | tr ',' '\n' | while IFS= read -r tag; do
            echo "     → ${tag}"
          done

      - name: "🗄️ Cache Docker Layers"
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-${{ matrix.suffix }}
          key: "buildx-${{ matrix.suffix }}-${{ hashFiles(matrix.dockerfile) }}"
          restore-keys: "buildx-${{ matrix.suffix }}-"

      - name: "🔨 Build & Push Image"
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ needs.prepare.outputs.should-push == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: |
            type=local,src=/tmp/.buildx-cache-${{ matrix.suffix }}
            type=registry,ref=${{ steps.tags.outputs.ghcr_image }}:buildcache
          cache-to: |
            type=local,dest=/tmp/.buildx-cache-${{ matrix.suffix }}-new,mode=max
            type=registry,ref=${{ steps.tags.outputs.ghcr_image }}:buildcache,mode=max
          build-args: |
            BUILD_DATE=${{ needs.prepare.outputs.build-date }}
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=ASH Dotfiles ${{ matrix.name }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.build-date }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/ash-dotfiles/ash-dotfiles
            org.opencontainers.image.licenses=MIT
          sbom: true
          provenance: true
          annotations: |
            index:org.opencontainers.image.description=ASH Dotfiles v${{ needs.prepare.outputs.version }} - ${{ matrix.name }}

      - name: "🔄 Rotate Build Cache"
        shell: bash
        run: |
          rm -rf /tmp/.buildx-cache-${{ matrix.suffix }}
          mv /tmp/.buildx-cache-${{ matrix.suffix }}-new \
             /tmp/.buildx-cache-${{ matrix.suffix }} 2>/dev/null || true

      - name: "🔐 Sign with Cosign"
        if: >
          needs.prepare.outputs.should-push == 'true' &&
          steps.build.outputs.digest != ''
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔐 Cosign Container Signing                                ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Install cosign
          curl -sSfL \
            https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 \
            -o /usr/local/bin/cosign 2>/dev/null
          chmod +x /usr/local/bin/cosign 2>/dev/null || true

          if command -v cosign &>/dev/null; then
            GHCR_IMAGE="${{ steps.tags.outputs.ghcr_image }}"
            DIGEST="${{ steps.build.outputs.digest }}"

            cosign sign \
              --yes \
              --oidc-issuer=https://token.actions.githubusercontent.com \
              "${GHCR_IMAGE}@${DIGEST}" \
              2>/dev/null && \
              echo "  ✅ Image signed with Cosign (keyless)" || \
              echo "  ⚠️  Cosign signing failed (may need OIDC token)"
          else
            echo "  ℹ️  Cosign not available"
          fi

      - name: "🔍 Scan Image for Vulnerabilities"
        if: inputs.scan_images != 'false'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔍 Trivy Vulnerability Scan                                ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Install Trivy
          sudo apt-get install -qq -y wget gnupg 2>/dev/null
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list > /dev/null
          sudo apt-get update -qq 2>/dev/null
          sudo apt-get install -qq -y trivy 2>/dev/null

          GHCR_IMAGE="${{ steps.tags.outputs.ghcr_image }}"
          VERSION="${{ needs.prepare.outputs.version }}"

          echo "  🔍 Scanning: ${GHCR_IMAGE}:${VERSION}"

          trivy image \
            --severity=HIGH,CRITICAL \
            --format=table \
            --ignore-unfixed=true \
            --exit-code=0 \
            --cache-dir=/tmp/.trivy-cache \
            "${GHCR_IMAGE}:${VERSION}" \
            2>/dev/null || true

          echo "  ✅ Security scan complete"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: DOCKER-HUB-META — Update Docker Hub metadata
  # ────────────────────────────────────────────────────────────────────────────
  docker-hub-meta:
    name: "📋 Update Docker Hub Metadata"
    needs: [prepare, build-push]
    if: >
      needs.prepare.outputs.should-push == 'true' &&
      secrets.DOCKERHUB_TOKEN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📋 Update Docker Hub README & Description"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📋 Docker Hub Repository Metadata Update                   ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          VERSION="${{ needs.prepare.outputs.version }}"

          # Generate Docker Hub README
          cat > /tmp/dockerhub-readme.md << README
          # 🔥 ASH Dotfiles v${VERSION} OMEGA

          **Ultra-Premium Hyprland Desktop Environment Manager**

          [![Docker Pulls](https://img.shields.io/docker/pulls/ashdotfiles/ash-dotfiles?style=for-the-badge&logo=docker&color=cba6f7)](https://hub.docker.com/r/ashdotfiles/ash-dotfiles)
          [![GitHub Release](https://img.shields.io/github/v/release/ash-dotfiles/ash-dotfiles?style=for-the-badge&logo=github&color=1e1e2e)](https://github.com/ash-dotfiles/ash-dotfiles/releases)

          ## 📦 Available Images

          | Image | Description | Size |
          |-------|-------------|------|
          | \`ashdotfiles/ash-api\` | ASH REST API Server | ~150MB |
          | \`ashdotfiles/ash-cli\` | ASH CLI Tools (Arch-based) | ~500MB |
          | \`ashdotfiles/ash-test\` | CI/CD Test Environment | ~600MB |

          ## 🚀 Quick Start

          ### API Server
          \`\`\`bash
          docker run -d \\
            --name ash-api \\
            -p 7070:7070 \\
            -e ASH_TOKEN="your-secret-token" \\
            ashdotfiles/ash-api:${VERSION}
          \`\`\`

          ### CLI Tools
          \`\`\`bash
          docker run -it --rm \\
            -v ~/.config/ash:/home/ash-user/.config/ash \\
            ashdotfiles/ash-cli:${VERSION} \\
            ash theme list
          \`\`\`

          ### Docker Compose
          \`\`\`yaml
          services:
            ash-api:
              image: ashdotfiles/ash-api:${VERSION}
              ports:
                - "7070:7070"
              environment:
                - ASH_TOKEN=\${ASH_API_TOKEN}
              restart: unless-stopped
          \`\`\`

          ## 🏷️ Tag Strategy

          | Tag | Description |
          |-----|-------------|
          | \`latest\` | Latest stable release |
          | \`${VERSION}\` | Exact version |
          | \`$(echo ${VERSION} | cut -d. -f1-2)\` | Major.Minor version |
          | \`$(echo ${VERSION} | cut -d. -f1)\` | Major version |
          | \`sha-XXXXXXXX\` | Specific commit |

          ## 🔒 Security

          - ✅ Non-root user in all containers
          - ✅ Signed with Cosign (keyless OIDC)
          - ✅ SBOM attestation attached
          - ✅ Trivy vulnerability scanning on each build
          - ✅ Read-only filesystem where possible

          ## 🌐 Platforms

          - \`linux/amd64\`
          - \`linux/arm64\`

          ## 📖 Documentation

          - [Full Documentation](https://ash-dotfiles.github.io/docs)
          - [API Reference](https://ash-dotfiles.github.io/docs/reference/rest-api-reference)
          - [GitHub Repository](https://github.com/ash-dotfiles/ash-dotfiles)
          - [Discord Community](https://discord.gg/ash-dotfiles)
          README

          # Update Docker Hub via API
          IMAGES=("ash-api" "ash-cli" "ash-test" "ash-dotfiles")

          for IMAGE in "${IMAGES[@]}"; do
            FULL_IMAGE="ashdotfiles/${IMAGE}"

            # Get auth token
            TOKEN="$(curl -sf \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"${{ secrets.DOCKERHUB_USERNAME }}\",\"password\":\"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
              "https://hub.docker.com/v2/users/login/" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])" \
              2>/dev/null || echo '')"

            if [[ -n "${TOKEN}" ]]; then
              # Update description
              curl -sf -X PATCH \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{
                  \"full_description\": $(python3 -c "import json; print(json.dumps(open('/tmp/dockerhub-readme.md').read()))"),
                  \"description\":       \"ASH Dotfiles v${VERSION} — ${IMAGE}\"
                }" \
                "https://hub.docker.com/v2/repositories/${FULL_IMAGE}/" \
                2>/dev/null && echo "  ✅ Updated: ${FULL_IMAGE}" || \
                echo "  ⚠️  Could not update: ${FULL_IMAGE}"
            fi
          done

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 05: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — Docker Publish"
    needs: [prepare, build-push, docker-hub-meta]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "💬 Post PR/Release Comment"
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const version    = "${{ needs.prepare.outputs.version }}";
            const buildResult= "${{ needs.build-push.result }}";
            const metaResult = "${{ needs.docker-hub-meta.result }}";
            const shouldPush = "${{ needs.prepare.outputs.should-push }}" === "true";
            const dryRun     = "${{ inputs.dry_run || 'false' }}" === "true";
            const platforms  = "${{ env.PLATFORMS }}";

            const buildPassed= buildResult === "success";
            const overall    = buildPassed;

            const body = `## 🐋 Docker Images Published ${overall ? '✅' : '❌'}

            **Status: ${overall ? 'PUBLISHED' : 'FAILED'}** | v${version}

            | Registry | Image | Status |
            |----------|-------|--------|
            | 🐋 Docker Hub | \`ashdotfiles/ash-api:${version}\` | ${buildPassed ? '✅' : '❌'} |
            | 🐋 Docker Hub | \`ashdotfiles/ash-cli:${version}\` | ${buildPassed ? '✅' : '❌'} |
            | 📦 GHCR | \`ghcr.io/ash-dotfiles/ash-api:${version}\` | ${buildPassed ? '✅' : '❌'} |
            | 📦 GHCR | \`ghcr.io/ash-dotfiles/ash-cli:${version}\` | ${buildPassed ? '✅' : '❌'} |

            **Platforms:** \`${platforms}\`
            **Signed:** Cosign keyless OIDC ✅
            **SBOM:** CycloneDX + SPDX attached ✅

            ### 🚀 Quick Pull
            \`\`\`bash
            docker pull ashdotfiles/ash-api:${version}
            docker pull ghcr.io/ash-dotfiles/ash-api:${version}
            \`\`\`

            ---
            *🤖 ASH Docker Hub Publisher • BuildKit + Buildx*`;

            // Add as release comment or update release body
            try {
              const { data: releases } = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                per_page: 1,
              });
              if (releases.length > 0) {
                const release = releases[0];
                const newBody = release.body + "\n\n---\n\n" + body;
                await github.rest.repos.updateRelease({
                  owner:      context.repo.owner,
                  repo:       context.repo.repo,
                  release_id: release.id,
                  body:       newBody,
                });
                console.log("  ✅ Release notes updated with Docker info");
              }
            } catch (e) {
              console.log(`  ℹ️  ${e.message}`);
            }

      - name: "🚦 Evaluate Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 Docker Hub Publish Quality Gate                         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          build_result="${{ needs.build-push.result }}"
          version="${{ needs.prepare.outputs.version }}"
          dry_run="${{ inputs.dry_run || 'false' }}"

          echo ""
          echo "  📊 Gate Summary:"
          echo "  ├── Version:      ${version}"
          echo "  ├── Build result: ${build_result}"
          echo "  ├── Dry run:      ${dry_run}"
          echo "  └── Platforms:    ${{ env.PLATFORMS }}"
          echo ""

          if [[ "${build_result}" == "success" ]]; then
            echo "  ✅ DOCKER HUB GATE: PASSED"
            echo "  🎉 Images published to Docker Hub & GHCR!"
            echo ""
            echo "  Published images:"
            echo "  ├── docker.io/ashdotfiles/ash-api:${version}"
            echo "  ├── docker.io/ashdotfiles/ash-cli:${version}"
            echo "  ├── ghcr.io/ash-dotfiles/ash-api:${version}"
            echo "  └── ghcr.io/ash-dotfiles/ash-cli:${version}"
          elif [[ "${build_result}" == "skipped" ]]; then
            echo "  ℹ️  Build was skipped"
          else
            echo "  ❌ DOCKER HUB GATE: FAILED"
            exit 1
          fi