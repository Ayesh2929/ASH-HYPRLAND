      - name: "📤 Update GitHub Release"
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const notes = fs.readFileSync("RELEASE_NOTES.md", "utf8");
            const version = "${{ needs.release-please.outputs.version }}";
            const tag = "${{ needs.release-please.outputs.tag_name }}";

            // Find the release
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo:  context.repo.repo,
            });

            const release = releases.find(r => r.tag_name === tag);

            if (release) {
              // Get existing body (changelog from release-please)
              const existingBody = release.body || "";

              // Prepend our enhanced header
              const headerEnd = existingBody.indexOf("## What's Changed");
              const changelog = headerEnd >= 0
                ? existingBody.slice(headerEnd)
                : existingBody;

              const fullBody = notes + "\n\n---\n\n" + changelog;

              await github.rest.repos.updateRelease({
                owner:     context.repo.owner,
                repo:      context.repo.repo,
                release_id:release.id,
                body:      fullBody,
                name:      `🔥 ASH Dotfiles v${version} OMEGA`,
                draft:     false,
                prerelease:false,
              });

              console.log(`  ✅ Release ${tag} notes updated`);
            } else {
              console.log(`  ⚠️  Release ${tag} not found`);
            }

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 05: ANNOUNCE — Post release announcements
  # ────────────────────────────────────────────────────────────────────────────
  announce:
    name: "📢 Release Announcements"
    needs: [release-please, post-release, release-notes]
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "📢 Post Discord Announcement"
        if: secrets.DISCORD_WEBHOOK_URL != ''
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📢 Discord Release Announcement                            ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          VERSION="${{ needs.release-please.outputs.version }}"
          TAG="${{ needs.release-please.outputs.tag_name }}"
          HTML_URL="${{ needs.release-please.outputs.html-url }}"

          PAYLOAD="$(cat << DISCORD
          {
            "username": "ASH Dotfiles Release Bot",
            "avatar_url": "https://ash-dotfiles.github.io/assets/brand/logos/ash-logo-256.png",
            "embeds": [{
              "title": "🔥 ASH Dotfiles v${VERSION} OMEGA Released!",
              "description": "A new version of ASH Dotfiles is now available!\\n\\nUpdate now:\\n\`\`\`bash\\nyay -Syu ash-dotfiles\\n\`\`\`",
              "url": "${HTML_URL}",
              "color": 13288695,
              "fields": [
                { "name": "🏷️ Version", "value": "\`${VERSION}\`", "inline": true },
                { "name": "📋 Tag", "value": "\`${TAG}\`", "inline": true },
                { "name": "🎨 Themes", "value": "250+", "inline": true },
                { "name": "🔌 Plugins", "value": "150+", "inline": true }
              ],
              "footer": {
                "text": "ASH Dotfiles v5.0 OMEGA • $(date -u +%Y-%m-%dT%H:%M:%SZ)",
                "icon_url": "https://ash-dotfiles.github.io/assets/brand/logos/ash-logo-16.png"
              },
              "thumbnail": {
                "url": "https://ash-dotfiles.github.io/assets/brand/logos/ash-logo-256.png"
              }
            }]
          }
          DISCORD
          )"

          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            2>/dev/null && echo "  ✅ Discord announcement sent" || \
            echo "  ⚠️  Discord announcement failed"

      - name: "🎉 Release Summary"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🎉 RELEASE COMPLETE                                        ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  🏷️  Tag:     %-44s║\n" "${{ needs.release-please.outputs.tag_name }}"
          printf "║  📦 Version: %-44s║\n" "${{ needs.release-please.outputs.version }}"
          printf "║  🌐 URL:     %-44s║\n" "${{ needs.release-please.outputs.html-url }}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  ✅ Version files updated                                   ║"
          echo "║  ✅ GitHub release notes enhanced                           ║"
          echo "║  ✅ Downstream builds triggered                             ║"
          echo "║  ✅ Announcements posted                                    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"