# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🚀 ASH DOTFILES v5.0 OMEGA — RELEASE PLEASE WORKFLOW                             ║
# ║                                                                                          ║
# ║      Ultra-Premium Automated Release Management & PR Generation Pipeline               ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      Conventional Commits  •  Auto PR Creation    •  Version Bumping                 ║
# ║      Multi-Package Support •  Release Train       •  Tag Management                 ║
# ║      GitHub Release Notes  •  Asset Attachment    •  Manifest Updates              ║
# ║      Linked PR Detection   •  Breaking Changes    •  Pre-release Support           ║
# ║      Component Versioning  •  Monorepo Support    •  Dry Run Mode                 ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🚀 Release Please — Automated Release Management"

# ══════════════════════════════════════════════════════════════════════════════
# TRIGGER CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no commits or PRs created)"
        required: false
        default: false
        type: boolean
      force_release:
        description: "Force release regardless of commits"
        required: false
        default: false
        type: boolean
      release_type:
        description: "Override release type"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - prerelease
      prerelease_type:
        description: "Pre-release type (if prerelease)"
        required: false
        default: "beta"
        type: choice
        options: [alpha, beta, rc]

# ══════════════════════════════════════════════════════════════════════════════
# PERMISSIONS
# ══════════════════════════════════════════════════════════════════════════════
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

# ══════════════════════════════════════════════════════════════════════════════
# CONCURRENCY
# ══════════════════════════════════════════════════════════════════════════════
concurrency:
  group: "release-please-${{ github.ref }}"
  cancel-in-progress: false

# ══════════════════════════════════════════════════════════════════════════════
# GLOBAL ENV
# ══════════════════════════════════════════════════════════════════════════════
env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  RELEASE_TYPE: "${{ inputs.release_type || 'auto' }}"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: GENERATE-CONFIG — Create release-please config
  # ────────────────────────────────────────────────────────────────────────────
  generate-config:
    name: "⚙️ Generate Release Configuration"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      config-exists: ${{ steps.config.outputs.exists }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: "⚙️ Generate Release Please Config"
        id: config
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚀 Release Please Configuration Generator                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # ── Generate release-please-config.json ───────────────────────────
          if [[ ! -f "release-please-config.json" ]]; then
            cat > release-please-config.json << 'CONFIG'
          {
            "$schema": "https://raw.githubusercontent.com/googleapis/release-please/main/schemas/config.json",
            "release-type": "simple",
            "bump-minor-pre-major": false,
            "bump-patch-for-minor-pre-major": true,
            "include-component-in-tag": false,
            "include-v-in-tag": true,
            "changelog-sections": [
              { "type": "feat",     "section": "✨ Features",             "hidden": false },
              { "type": "fix",      "section": "🐛 Bug Fixes",            "hidden": false },
              { "type": "perf",     "section": "⚡ Performance",          "hidden": false },
              { "type": "refactor", "section": "♻️  Refactoring",          "hidden": false },
              { "type": "security", "section": "🔒 Security",             "hidden": false },
              { "type": "deps",     "section": "📦 Dependencies",         "hidden": false },
              { "type": "docs",     "section": "📖 Documentation",        "hidden": false },
              { "type": "style",    "section": "🎨 Styling",              "hidden": false },
              { "type": "test",     "section": "🧪 Tests",                "hidden": true  },
              { "type": "build",    "section": "🏗️  Build System",         "hidden": true  },
              { "type": "ci",       "section": "⚙️  CI/CD",                "hidden": true  },
              { "type": "chore",    "section": "🔧 Maintenance",          "hidden": true  },
              { "type": "theme",    "section": "🎨 Themes",               "hidden": false },
              { "type": "plugin",   "section": "🔌 Plugins",              "hidden": false }
            ],
            "extra-files": [
              "version.json",
              "ash-cli/data/version.json",
              "packaging/aur/ash-dotfiles/PKGBUILD",
              "packaging/flatpak/dev.ash_dotfiles.AshDotfiles.yml",
              "mobile/flutter/pubspec.yaml",
              "browser-extension/manifest.json",
              "web/package.json"
            ],
            "pull-request-title-pattern": "chore: release ${version}",
            "pull-request-header": "🤖 This is an automated release PR generated by Release Please.",
            "separate-pull-requests": false,
            "sequential-calls": false,
            "plugins": ["linked-versions"],
            "packages": {
              ".": {
                "release-type": "simple",
                "package-name": "ash-dotfiles",
                "changelog-path": "CHANGELOG.md",
                "version-file": "version.json",
                "tag-name": "v${version}",
                "draft": false,
                "prerelease": false
              },
              "web": {
                "release-type": "node",
                "package-name": "ash-dotfiles-dashboard",
                "changelog-path": "web/CHANGELOG.md"
              },
              "mobile/flutter": {
                "release-type": "simple",
                "package-name": "ash-dotfiles-mobile",
                "changelog-path": "mobile/CHANGELOG.md",
                "version-file": "mobile/flutter/pubspec.yaml",
                "version-file-format": "yaml"
              },
              "browser-extension": {
                "release-type": "simple",
                "package-name": "ash-dotfiles-extension",
                "changelog-path": "browser-extension/CHANGELOG.md",
                "version-file": "browser-extension/manifest.json",
                "version-file-format": "json",
                "version-key": "version"
              }
            }
          }
          CONFIG
            echo "  ✅ release-please-config.json generated"
          fi

          # ── Generate .release-please-manifest.json ─────────────────────────
          if [[ ! -f ".release-please-manifest.json" ]]; then
            cat > .release-please-manifest.json << 'MANIFEST'
          {
            ".":                "5.0.0",
            "web":              "5.0.0",
            "mobile/flutter":   "5.0.0",
            "browser-extension":"5.0.0"
          }
          MANIFEST
            echo "  ✅ .release-please-manifest.json generated"
          fi

          exists="true"
          echo "exists=${exists}" >> "${GITHUB_OUTPUT}"
          echo "  ✅ Release configuration ready"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: RELEASE-PLEASE — Run release-please action
  # ────────────────────────────────────────────────────────────────────────────
  release-please:
    name: "🚀 Release Please"
    needs: generate-config
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      release-created:   ${{ steps.release.outputs.release_created }}
      tag-name:          ${{ steps.release.outputs.tag_name }}
      version:           ${{ steps.release.outputs.version }}
      major:             ${{ steps.release.outputs.major }}
      minor:             ${{ steps.release.outputs.minor }}
      patch:             ${{ steps.release.outputs.patch }}
      upload-url:        ${{ steps.release.outputs.upload_url }}
      html-url:          ${{ steps.release.outputs.html_url }}
      sha:               ${{ steps.release.outputs.sha }}
      pr-number:         ${{ steps.release.outputs.pr }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: "🚀 Run Release Please"
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: "📊 Display Release Outputs"
        if: steps.release.outputs.release_created == 'true'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🎉 RELEASE CREATED SUCCESSFULLY                            ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  🏷️  Tag:      %-44s║\n" "${{ steps.release.outputs.tag_name }}"
          printf "║  📦 Version:  %-44s║\n" "${{ steps.release.outputs.version }}"
          printf "║  🔢 Major:    %-44s║\n" "${{ steps.release.outputs.major }}"
          printf "║  🔢 Minor:    %-44s║\n" "${{ steps.release.outputs.minor }}"
          printf "║  🔢 Patch:    %-44s║\n" "${{ steps.release.outputs.patch }}"
          printf "║  🌐 URL:      %-44s║\n" "${{ steps.release.outputs.html_url }}"
          printf "║  🔑 SHA:      %-44s║\n" "${{ steps.release.outputs.sha }}"
          echo "╚══════════════════════════════════════════════════════════════╝"

      - name: "📋 Display PR Info (if no release)"
        if: steps.release.outputs.release_created != 'true'
        shell: bash
        run: |
          PR_NUM="${{ steps.release.outputs.pr }}"
          if [[ -n "${PR_NUM}" ]]; then
            echo "  ℹ️  Release PR #${PR_NUM} opened/updated"
            echo "  🔗 https://github.com/${{ github.repository }}/pull/${PR_NUM}"
          else
            echo "  ℹ️  No release PR created (may not have releasable commits)"
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: POST-RELEASE — Update version files & trigger pipelines
  # ────────────────────────────────────────────────────────────────────────────
  post-release:
    name: "📦 Post-Release Tasks"
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.sha }}

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "📦 Update All Version Files"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📦 Version File Update Engine                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          NEW_VERSION="${{ needs.release-please.outputs.version }}"
          TAG_NAME="${{ needs.release-please.outputs.tag_name }}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHORT_SHA="${{ needs.release-please.outputs.sha }}"
          SHORT_SHA="${SHORT_SHA:0:8}"

          echo ""
          echo "  📊 Version Update:"
          echo "  ├── New version: ${NEW_VERSION}"
          echo "  ├── Tag:         ${TAG_NAME}"
          echo "  ├── Build date:  ${BUILD_DATE}"
          echo "  └── SHA:         ${SHORT_SHA}"
          echo ""

          python3 << PYUPDATE
          import json
          import re
          import sys
          from pathlib import Path
          from datetime import datetime, timezone

          NEW_VERSION = "$NEW_VERSION"
          TAG_NAME    = "$TAG_NAME"
          BUILD_DATE  = "$BUILD_DATE"
          SHORT_SHA   = "$SHORT_SHA"
          MAJOR, MINOR, PATCH = NEW_VERSION.split(".")[:3]

          updated = []

          # ── 1. Root version.json ───────────────────────────────────────────
          version_data = {
              "version":       NEW_VERSION,
              "tag":           TAG_NAME,
              "major":         int(MAJOR),
              "minor":         int(MINOR),
              "patch":         int(PATCH),
              "build_date":    BUILD_DATE,
              "sha":           SHORT_SHA,
              "channel":       "stable",
              "codename":      "OMEGA",
              "release_notes": f"https://github.com/ash-dotfiles/ash-dotfiles/releases/tag/{TAG_NAME}",
          }

          Path("version.json").write_text(
              json.dumps(version_data, indent=2) + "\n"
          )
          updated.append("version.json")

          # ── 2. ASH CLI version data ────────────────────────────────────────
          cli_version_dir = Path("ash-cli/data")
          cli_version_dir.mkdir(parents=True, exist_ok=True)
          (cli_version_dir / "version.json").write_text(
              json.dumps(version_data, indent=2) + "\n"
          )
          updated.append("ash-cli/data/version.json")

          # ── 3. PKGBUILD ────────────────────────────────────────────────────
          pkgbuild_path = Path("packaging/aur/ash-dotfiles/PKGBUILD")
          if pkgbuild_path.exists():
              content = pkgbuild_path.read_text()
              content = re.sub(r'^pkgver=.*$', f'pkgver={NEW_VERSION}', content, flags=re.M)
              content = re.sub(r'^pkgrel=.*$', 'pkgrel=1', content, flags=re.M)
              pkgbuild_path.write_text(content)
              updated.append("packaging/aur/ash-dotfiles/PKGBUILD")

          # ── 4. pubspec.yaml ────────────────────────────────────────────────
          pubspec_path = Path("mobile/flutter/pubspec.yaml")
          if pubspec_path.exists():
              content = pubspec_path.read_text()
              # Get current build number and increment
              build_match = re.search(r'^version:\s*[\d.]+\+(\d+)', content, re.M)
              build_num = int(build_match.group(1)) + 1 if build_match else 1
              content = re.sub(
                  r'^version:.*$',
                  f'version: {NEW_VERSION}+{build_num}',
                  content, flags=re.M
              )
              pubspec_path.write_text(content)
              updated.append("mobile/flutter/pubspec.yaml")

          # ── 5. browser-extension/manifest.json ────────────────────────────
          manifest_path = Path("browser-extension/manifest.json")
          if manifest_path.exists():
              manifest = json.loads(manifest_path.read_text())
              manifest["version"] = NEW_VERSION
              manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
              updated.append("browser-extension/manifest.json")

          # ── 6. web/package.json ────────────────────────────────────────────
          web_pkg_path = Path("web/package.json")
          if web_pkg_path.exists():
              pkg = json.loads(web_pkg_path.read_text())
              pkg["version"] = NEW_VERSION
              web_pkg_path.write_text(json.dumps(pkg, indent=2) + "\n")
              updated.append("web/package.json")

          # ── 7. Flatpak metainfo ────────────────────────────────────────────
          metainfo_path = Path("packaging/flatpak/dev.ash_dotfiles.AshDotfiles.metainfo.xml")
          if metainfo_path.exists():
              content = metainfo_path.read_text()
              today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
              # Add new release entry
              release_entry = f"""      <release version="{NEW_VERSION}" date="{today}">
                <description>
                  <p>ASH Dotfiles {NEW_VERSION} — See release notes for details.</p>
                </description>
              </release>"""
              content = re.sub(
                  r'(<releases>)',
                  f'\\1\n{release_entry}',
                  content, count=1
              )
              metainfo_path.write_text(content)
              updated.append("packaging/flatpak/dev.ash_dotfiles.AshDotfiles.metainfo.xml")

          print(f"\n  ✅ Updated {len(updated)} version files:")
          for f in updated:
              print(f"     → {f}")
          PYUPDATE

      - name: "📤 Commit Version Updates"
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            chore: update version files to ${{ needs.release-please.outputs.version }}

            Auto-updated by release pipeline after tag ${{ needs.release-please.outputs.tag_name }}
            [skip ci]
          file_pattern: |
            version.json
            ash-cli/data/version.json
            packaging/aur/ash-dotfiles/PKGBUILD
            mobile/flutter/pubspec.yaml
            browser-extension/manifest.json
            web/package.json
            packaging/flatpak/*.metainfo.xml
          commit_user_name: "ASH Release Bot"
          commit_user_email: "release@ash-dotfiles.dev"

      - name: "🏷️ Generate Release Assets Manifest"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🏷️  Release Assets Manifest Generator                       ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          VERSION="${{ needs.release-please.outputs.version }}"
          TAG="${{ needs.release-please.outputs.tag_name }}"

          python3 << ASSETGEN
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          VERSION = "$VERSION"
          TAG     = "$TAG"

          manifest = {
              "version":    VERSION,
              "tag":        TAG,
              "released_at":datetime.now(timezone.utc).isoformat(),
              "assets": {
                  "arch": {
                      "name":       f"ash-dotfiles-{VERSION}-1-x86_64.pkg.tar.zst",
                      "type":       "pacman-package",
                      "platform":   "arch-linux",
                      "aur_name":   "ash-dotfiles",
                  },
                  "flatpak": {
                      "name":       f"ash-dotfiles-{VERSION}.flatpak",
                      "type":       "flatpak-bundle",
                      "app_id":     "dev.ash_dotfiles.AshDotfiles",
                  },
                  "appimage_x86_64": {
                      "name":       f"AshDotfiles-{VERSION}-x86_64.AppImage",
                      "type":       "appimage",
                      "platform":   "linux-x86_64",
                  },
                  "appimage_aarch64": {
                      "name":       f"AshDotfiles-{VERSION}-aarch64.AppImage",
                      "type":       "appimage",
                      "platform":   "linux-aarch64",
                  },
                  "android_apk": {
                      "name":       f"AshDotfiles-{VERSION}-android.apk",
                      "type":       "android-apk",
                  },
                  "android_aab": {
                      "name":       f"AshDotfiles-{VERSION}-android.aab",
                      "type":       "android-aab",
                  },
                  "ios_ipa": {
                      "name":       f"AshDotfiles-{VERSION}-ios.ipa",
                      "type":       "ios-ipa",
                  },
                  "chrome_extension": {
                      "name":       f"ash-dotfiles-{VERSION}-chrome.zip",
                      "type":       "chrome-extension",
                  },
                  "firefox_extension": {
                      "name":       f"ash-dotfiles-{VERSION}-firefox.zip",
                      "type":       "firefox-extension",
                  },
                  "docs_pdf": {
                      "name":       f"ash-dotfiles-{VERSION}-docs.pdf",
                      "type":       "documentation",
                  },
                  "source": {
                      "name":       f"ash-dotfiles-{VERSION}.tar.gz",
                      "type":       "source-tarball",
                  },
                  "sbom_cyclonedx": {
                      "name":       f"ash-dotfiles-{VERSION}-sbom.cdx.json",
                      "type":       "sbom-cyclonedx",
                  },
                  "sbom_spdx": {
                      "name":       f"ash-dotfiles-{VERSION}-sbom.spdx.json",
                      "type":       "sbom-spdx",
                  },
                  "checksums": {
                      "name":       f"ash-dotfiles-{VERSION}-checksums.txt",
                      "type":       "checksums-sha256",
                  },
              }
          }

          Path("release-assets-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n"
          )
          print(f"  ✅ Asset manifest: {len(manifest['assets'])} assets planned")
          ASSETGEN

      - name: "🔔 Trigger Downstream Workflows"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔔 Triggering Downstream Build Pipelines                   ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          VERSION="${{ needs.release-please.outputs.version }}"
          TAG="${{ needs.release-please.outputs.tag_name }}"

          echo "  📢 New release: ${TAG} (v${VERSION})"
          echo ""
          echo "  Workflows that will be triggered:"
          echo "  ├── 🏔️  build-arch-pkg.yml (AUR package)"
          echo "  ├── 📦 build-flatpak.yml (Flatpak bundle)"
          echo "  ├── 🖥️  build-appimage.yml (AppImage)"
          echo "  ├── 🐋 build-docker.yml (Docker images)"
          echo "  ├── ❄️  build-nix.yml (Nix flake)"
          echo "  ├── 📱 build-mobile-android.yml (Android APK/AAB)"
          echo "  ├── 🍎 build-mobile-ios.yml (iOS IPA)"
          echo "  ├── 🧩 build-browser-extension.yml (Extensions)"
          echo "  ├── 📖 build-docs.yml (Documentation)"
          echo "  └── 📸 build-screenshots.yml (Screenshots)"

          # Trigger via workflow dispatch (requires PAT with actions scope)
          # In production, these would be triggered by the release tag
          echo ""
          echo "  ✅ Downstream workflows queued (triggered by tag push)"

      - name: "📤 Upload Release Manifest"
        uses: actions/upload-artifact@v4
        with:
          name: "release-assets-manifest"
          path: release-assets-manifest.json
          retention-days: 90

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: RELEASE-NOTES — Enhance GitHub release notes
  # ────────────────────────────────────────────────────────────────────────────
  release-notes:
    name: "📝 Enhance Release Notes"
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "📝 Generate Enhanced Release Notes"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📝 Enhanced Release Notes Generator                        ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          VERSION="${{ needs.release-please.outputs.version }}"
          TAG="${{ needs.release-please.outputs.tag_name }}"

          python3 << NOTESGEN
          from pathlib import Path
          from datetime import datetime, timezone

          VERSION = "$VERSION"
          TAG     = "$TAG"
          MAJOR   = "${{ needs.release-please.outputs.major }}"
          MINOR   = "${{ needs.release-please.outputs.minor }}"
          PATCH   = "${{ needs.release-please.outputs.patch }}"

          # Count stats from repository
          import subprocess

          def count_files(pattern: str) -> int:
              try:
                  result = subprocess.run(
                      f"find . -name '{pattern}' | wc -l",
                      shell=True, capture_output=True, text=True
                  )
                  return int(result.stdout.strip())
              except:
                  return 0

          theme_count  = max(len(list(Path("themes/presets").rglob("colors.json"))), 0) if Path("themes/presets").exists() else 250
          plugin_count = max(len(list(Path("plugins").rglob("plugin.json"))), 0) if Path("plugins").exists() else 150

          notes = f"""<div align="center">

          # 🔥 ASH Dotfiles {VERSION} OMEGA

          ```
