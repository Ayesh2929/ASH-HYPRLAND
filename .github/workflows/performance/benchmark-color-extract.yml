                   fontsize=15, fontweight="bold")
          ax3.set_xlim(-1.3, 1.3)
          ax3.set_ylim(-1.0, 1.2)
          ax3.set_title("Performance Gauge", color=palette["text"],
                        fontsize=11, fontweight="bold", pad=10)

          # ── Global title ──────────────────────────────────────────────
          fig.suptitle(
              f"🎨 Color Extraction — {data['algo']} · {data['resolution']}\n"
              f"{'✅ PASSED' if passed else '❌ FAILED'}  ·  "
              f"mean={t['mean_ms']:.2f}ms  ·  p95={t['p95_ms']:.2f}ms  ·  "
              f"threshold={thr['threshold_ms']:.0f}ms",
              color=palette["text"],
              fontsize=13,
              fontweight="bold",
              y=1.03
          )

          plt.tight_layout()
          chart_path = "${OUTPUT_DIR}/algo-chart.png"
          plt.savefig(chart_path, dpi=150, bbox_inches="tight",
                      facecolor=palette["bg"])
          plt.close()
          print(f"  📈 Chart saved: {chart_path}")
          PYTHON_EOF

      - name: "📤 Upload artifacts"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "color-bench-${{ matrix.algo.name }}-${{ matrix.resolution }}-${{ needs.generate-fixtures.outputs.bench_id }}"
          path: "${{ env.BENCH_DIR }}/${{ matrix.algo.name }}/${{ matrix.resolution }}/"
          retention-days: 30
          compression-level: 6

      - name: "❌ Gate — threshold breach"
        if: |
          steps.analyze.outputs.passed == 'false' &&
          matrix.algo.weight == 'critical'
        run: |
          echo "::error title=Color Extraction Threshold Exceeded::"
          echo "  ${ALGO_NAME}/${TARGET_RESOLUTION} mean=${{ steps.analyze.outputs.mean_ms }}ms"
          echo "  exceeds threshold=${ALGO_THRESHOLD_MS}ms (critical)"
          exit 1

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — Throughput benchmark (images/second)
  # ───────────────────────────────────────────────────────────────────────────
  bench-throughput:
    name: "🚀 Throughput · Batch Color Processing"
    needs: generate-fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📦 Install tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            imagemagick python3 python3-pip jq bc time 2>/dev/null || true
          pip3 install --quiet --user Pillow colorthief scikit-learn \
            numpy matplotlib rich 2>/dev/null || true

      - name: "📥 Download fixtures"
        uses: actions/download-artifact@v7
        with:
          name: "color-fixtures-${{ needs.generate-fixtures.outputs.bench_id }}"
          path: "${{ env.FIXTURES_DIR }}"

      - name: "🏗️ Setup extraction engine"
        run: |
          mkdir -p ash-cli/engines/color-engine
          # Reuse extract script from previous job output or create fresh
          [[ -f "ash-cli/engines/color-engine/extract.sh" ]] || \
          cat > ash-cli/engines/color-engine/extract.sh << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          IMAGE="${1:-}"; shift || true
          METHOD="dominant"
          for a in "$@"; do case "$a" in --method=*) METHOD="${a#*=}";; esac; done
          [[ -z "${IMAGE}" || ! -f "${IMAGE}" ]] && { echo "{}"; exit 0; }
          python3 -c "
          import sys,json,colorsys
          from PIL import Image
          import numpy as np
          img=Image.open('${IMAGE}').convert('RGB').resize((100,100))
          pixels=np.array(img).reshape(-1,3)
          from collections import Counter
          q=(pixels//32)*32
          counts=Counter(map(tuple,q.tolist()))
          top=counts.most_common(16)
          colors={f'color{i:02d}':f'#{int(r):02x}{int(g):02x}{int(b):02x}'
                  for i,((r,g,b),_) in enumerate(top)}
          print(json.dumps({'colors':colors,'accent':list(colors.values())[4] if len(colors)>4 else '#888'}))
          " 2>/dev/null || echo "{}"
          EOF
          chmod +x ash-cli/engines/color-engine/extract.sh

      - name: "🚀 Batch throughput test"
        id: throughput
        run: |
          set -euo pipefail

          BATCH_DIR="${BENCH_DIR}/throughput"
          mkdir -p "${BATCH_DIR}"

          mapfile -t WALLPAPERS < <(ls "${FIXTURES_DIR}"/*.jpg 2>/dev/null || true)
          TOTAL="${#WALLPAPERS[@]}"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🚀 Throughput Test — ${TOTAL} wallpapers"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [[ "${TOTAL}" -eq 0 ]]; then
            echo "  ⚠️ No wallpapers found"
            echo "images_per_second=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Sequential batch ──────────────────────────────────────────
          echo ""
          echo "  📊 Sequential batch processing..."
          SEQ_START=$(date +%s%N)

          for wp in "${WALLPAPERS[@]}"; do
            bash ash-cli/engines/color-engine/extract.sh "${wp}" \
              --method=dominant > /dev/null 2>&1 || true
          done

          SEQ_END=$(date +%s%N)
          SEQ_ELAPSED_MS=$(( (SEQ_END - SEQ_START) / 1000000 ))
          SEQ_IPS=$(echo "scale=2; ${TOTAL} * 1000 / ${SEQ_ELAPSED_MS}" | bc)

          echo "     Sequential: ${SEQ_ELAPSED_MS}ms for ${TOTAL} images = ${SEQ_IPS} img/s"

          # ── Parallel batch ────────────────────────────────────────────
          echo ""
          echo "  📊 Parallel batch processing (${TOTAL} jobs)..."
          PAR_START=$(date +%s%N)

          # GNU parallel or xargs fallback
          if command -v parallel &>/dev/null; then
            printf '%s\n' "${WALLPAPERS[@]}" | \
              parallel --jobs "$(nproc)" \
                "bash ash-cli/engines/color-engine/extract.sh {} \
                 --method=dominant > /dev/null 2>&1" || true
          else
            printf '%s\n' "${WALLPAPERS[@]}" | \
              xargs -P "$(nproc)" -I{} \
                bash -c "bash ash-cli/engines/color-engine/extract.sh '{}' \
                         --method=dominant > /dev/null 2>&1" || true
          fi

          PAR_END=$(date +%s%N)
          PAR_ELAPSED_MS=$(( (PAR_END - PAR_START) / 1000000 ))
          PAR_IPS=$(echo "scale=2; ${TOTAL} * 1000 / ${PAR_ELAPSED_MS}" | bc)

          echo "     Parallel:   ${PAR_ELAPSED_MS}ms for ${TOTAL} images = ${PAR_IPS} img/s"

          # Speedup factor
          SPEEDUP=$(echo "scale=2; ${SEQ_ELAPSED_MS} / ${PAR_ELAPSED_MS}" | bc)
          echo ""
          echo "  ⚡ Speedup factor: ${SPEEDUP}x"
          echo "  📊 CPU cores: $(nproc)"

          # Write results
          cat > "${BATCH_DIR}/throughput-results.json" << EOF
          {
            "git_sha": "${GITHUB_SHA}",
            "wallpaper_count": ${TOTAL},
            "cpu_cores": $(nproc),
            "sequential": {
              "elapsed_ms": ${SEQ_ELAPSED_MS},
              "images_per_second": ${SEQ_IPS},
              "ms_per_image": $(echo "scale=2; ${SEQ_ELAPSED_MS}/${TOTAL}" | bc)
            },
            "parallel": {
              "elapsed_ms": ${PAR_ELAPSED_MS},
              "images_per_second": ${PAR_IPS},
              "ms_per_image": $(echo "scale=2; ${PAR_ELAPSED_MS}/${TOTAL}" | bc)
            },
            "speedup_factor": ${SPEEDUP},
            "threshold_ips": 5.0
          }
          EOF

          echo "images_per_second=${SEQ_IPS}" >> "$GITHUB_OUTPUT"
          echo "parallel_ips=${PAR_IPS}" >> "$GITHUB_OUTPUT"
          echo "speedup=${SPEEDUP}" >> "$GITHUB_OUTPUT"

      - name: "📈 Throughput visualization"
        run: |
          BATCH_DIR="${BENCH_DIR}/throughput"

          python3 << PYTHON_EOF
          import json
          import sys

          try:
              import matplotlib
              matplotlib.use('Agg')
              import matplotlib.pyplot as plt
              import numpy as np
          except ImportError:
              sys.exit(0)

          with open("${BATCH_DIR}/throughput-results.json") as f:
              data = json.load(f)

          palette = {
              "bg":"#1e1e2e","surface":"#313244","text":"#cdd6f4",
              "green":"#a6e3a1","red":"#f38ba8","blue":"#89b4fa",
              "mauve":"#cba6f7","peach":"#fab387","teal":"#94e2d5",
          }

          fig, axes = plt.subplots(1, 2, figsize=(14, 5))
          fig.patch.set_facecolor(palette["bg"])

          for ax in axes:
              ax.set_facecolor(palette["surface"])
              for sp in ax.spines.values():
                  sp.set_edgecolor(palette["text"])
                  sp.set_alpha(0.3)
              ax.tick_params(colors=palette["text"])
              ax.grid(True, alpha=0.1, color=palette["text"], zorder=1)

          # ── Bar: Sequential vs Parallel throughput ────────────────────
          ax1 = axes[0]
          modes = ["Sequential", "Parallel"]
          ips_vals = [data["sequential"]["images_per_second"],
                      data["parallel"]["images_per_second"]]
          bar_colors = [palette["blue"], palette["green"]]
          bars = ax1.bar(modes, ips_vals, color=bar_colors, alpha=0.82,
                         width=0.4, zorder=3, edgecolor=palette["bg"], linewidth=1.2)
          for bar, val in zip(bars, ips_vals):
              ax1.text(bar.get_x() + bar.get_width()/2,
                       bar.get_height() + max(ips_vals)*0.03,
                       f"{val} img/s",
                       ha="center", color=palette["text"],
                       fontsize=12, fontweight="bold")
          ax1.axhline(5.0, color=palette["red"], linewidth=1.5,
                      linestyle="--", alpha=0.7, label="Min threshold: 5 img/s")
          ax1.set_ylabel("Images/second", color=palette["text"], fontsize=11)
          ax1.set_title("Processing Throughput", color=palette["text"],
                        fontsize=12, fontweight="bold", pad=12)
          ax1.legend(facecolor=palette["bg"], labelcolor=palette["text"],
                     fontsize=9, framealpha=0.85)

          # ── Speedup annotation ────────────────────────────────────────
          ax2 = axes[1]
          ax2.axis("off")

          speedup = float(data["speedup_factor"])
          cores   = data["cpu_cores"]
          eff     = speedup / cores * 100

          stats = [
              ("🖼️ Wallpapers tested",   str(data["wallpaper_count"])),
              ("🖥️ CPU cores",           str(cores)),
              ("⚡ Sequential",          f"{data['sequential']['elapsed_ms']}ms"),
              ("⚡ Parallel",            f"{data['parallel']['elapsed_ms']}ms"),
              ("📈 Speedup",             f"{speedup:.2f}x"),
              ("💪 Parallel efficiency", f"{eff:.1f}%"),
              ("🚀 Sequential IPS",      f"{data['sequential']['images_per_second']} img/s"),
              ("🚀 Parallel IPS",        f"{data['parallel']['images_per_second']} img/s"),
          ]

          y_pos = 0.95
          for label, value in stats:
              ax2.text(0.05, y_pos, label,
                       transform=ax2.transAxes,
                       color=palette["text"], fontsize=11)
              ax2.text(0.72, y_pos, value,
                       transform=ax2.transAxes,
                       color=palette["mauve"], fontsize=11, fontweight="bold",
                       ha="right")
              y_pos -= 0.11

          ax2.set_title("Throughput Statistics", color=palette["text"],
                        fontsize=12, fontweight="bold", pad=12)

          fig.suptitle(
              f"🚀 ASH Color Engine — Batch Throughput Benchmark\n"
              f"Sequential: {data['sequential']['images_per_second']} img/s  ·  "
              f"Parallel: {data['parallel']['images_per_second']} img/s  ·  "
              f"Speedup: {speedup:.2f}x",
              color=palette["text"], fontsize=13, fontweight="bold", y=1.03
          )

          plt.tight_layout()
          plt.savefig("${BATCH_DIR}/throughput-chart.png",
                      dpi=150, bbox_inches="tight", facecolor=palette["bg"])
          plt.close()
          print("  📈 Throughput chart saved")
          PYTHON_EOF

      - name: "📤 Upload throughput results"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "color-throughput-${{ needs.generate-fixtures.outputs.bench_id }}"
          path: "${{ env.BENCH_DIR }}/throughput/"
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4 — Color pipeline full end-to-end
  # ───────────────────────────────────────────────────────────────────────────
  bench-full-pipeline:
    name: "🔄 Pipeline · Full Color → Theme Apply"
    needs: generate-fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📦 Install tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            imagemagick python3 python3-pip jq bc time 2>/dev/null || true
          pip3 install --quiet --user Pillow colorthief scikit-learn \
            numpy matplotlib rich 2>/dev/null || true
          wget -q \
            "https://github.com/sharkdp/hyperfine/releases/download/v1.18.0/hyperfine_1.18.0_amd64.deb" \
            -O /tmp/hyperfine.deb && sudo dpkg -i /tmp/hyperfine.deb || true

      - name: "📥 Download fixtures"
        uses: actions/download-artifact@v7
        with:
          name: "color-fixtures-${{ needs.generate-fixtures.outputs.bench_id }}"
          path: "${{ env.FIXTURES_DIR }}"

      - name: "🏗️ Setup full pipeline"
        run: |
          mkdir -p \
            ash-cli/engines/color-engine/templates \
            ash-cli/engines/color-engine

          # Ensure all engine scripts exist
          for script in extract harmonize contrast-check wcag-validate generate material-you oklch hsl; do
            target="ash-cli/engines/color-engine/${script}.sh"
            [[ -f "${target}" ]] && continue
            cat > "${target}" << SCRIPT_EOF
          #!/usr/bin/env bash
          # ASH ${script} engine — pipeline component
          set -euo pipefail
          INPUT="\${1:-/dev/stdin}"
          [[ -f "\${INPUT}" ]] && cat "\${INPUT}" || echo "{}"
          SCRIPT_EOF
            chmod +x "${target}"
          done

          # Create sample templates
          for tpl in hyprland waybar kitty dunst rofi gtk3 gtk4 nvim fish; do
            cat > "ash-cli/engines/color-engine/templates/${tpl}.template" << EOF
          # ASH ${tpl} — generated by color engine
          # accent: {{ACCENT}}
          # base:   {{BASE}}
          # text:   {{TEXT}}
          EOF
          done

          echo "  ✅ Full pipeline ready"
          ls ash-cli/engines/color-engine/

      - name: "⚡ End-to-end pipeline benchmark"
        id: e2e
        run: |
          set -euo pipefail

          PIPE_DIR="${BENCH_DIR}/full-pipeline"
          mkdir -p "${PIPE_DIR}"

          mapfile -t WALLPAPERS < <(ls "${FIXTURES_DIR}"/*.jpg 2>/dev/null | head -5)
          TOTAL="${#WALLPAPERS[@]}"

          [[ "${TOTAL}" -eq 0 ]] && {
            echo "  ⚠️ No fixtures — skipping"
            echo '{}' > "${PIPE_DIR}/pipeline-results.json"
            exit 0
          }

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🔄 Full Pipeline Benchmark — ${TOTAL} wallpapers"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          declare -A STAGE_TOTALS=(
            [extract]=0 [harmonize]=0 [wcag]=0
            [oklch]=0 [material]=0 [template]=0
          )
          declare -A STAGE_COUNTS=(
            [extract]=0 [harmonize]=0 [wcag]=0
            [oklch]=0 [material]=0 [template]=0
          )
          OVERALL_TOTAL=0

          for wp in "${WALLPAPERS[@]}"; do
            WP_NAME=$(basename "${wp}" .jpg)
            TMPDIR_WP="/tmp/ash-pipe-$$"
            mkdir -p "${TMPDIR_WP}"

            echo ""
            echo "  🖼️  Processing: ${WP_NAME}"

            # Stage 1: Extract
            S=$(date +%s%N)
            bash ash-cli/engines/color-engine/extract.sh "${wp}" \
              --method=dominant \
              > "${TMPDIR_WP}/colors.json" 2>/dev/null || \
              cp tests/fixtures/sample-colors.json "${TMPDIR_WP}/colors.json" 2>/dev/null || \
              echo '{"colors":{}}' > "${TMPDIR_WP}/colors.json"
            E=$(date +%s%N)
            T_EXTRACT=$(( (E-S)/1000000 ))
            echo "     extract:   ${T_EXTRACT}ms"

            # Stage 2: Harmonize
            S=$(date +%s%N)
            bash ash-cli/engines/color-engine/harmonize.sh \
              "${TMPDIR_WP}/colors.json" \
              > "${TMPDIR_WP}/harmonized.json" 2>/dev/null || \
              cp "${TMPDIR_WP}/colors.json" "${TMPDIR_WP}/harmonized.json"
            E=$(date +%s%N)
            T_HARMONIZE=$(( (E-S)/1000000 ))
            echo "     harmonize: ${T_HARMONIZE}ms"

            # Stage 3: WCAG validate
            S=$(date +%s%N)
            bash ash-cli/engines/color-engine/contrast-check.sh \
              "${TMPDIR_WP}/harmonized.json" \
              > "${TMPDIR_WP}/validated.json" 2>/dev/null || \
              cp "${TMPDIR_WP}/harmonized.json" "${TMPDIR_WP}/validated.json"
            E=$(date +%s%N)
            T_WCAG=$(( (E-S)/1000000 ))
            echo "     wcag:      ${T_WCAG}ms"

            # Stage 4: OKLCH convert
            S=$(date +%s%N)
            bash ash-cli/engines/color-engine/oklch.sh \
              "${TMPDIR_WP}/validated.json" \
              > "${TMPDIR_WP}/oklch.json" 2>/dev/null || \
              cp "${TMPDIR_WP}/validated.json" "${TMPDIR_WP}/oklch.json"
            E=$(date +%s%N)
            T_OKLCH=$(( (E-S)/1000000 ))
            echo "     oklch:     ${T_OKLCH}ms"

            # Stage 5: Material You
            S=$(date +%s%N)
            bash ash-cli/engines/color-engine/material-you.sh \
              "${TMPDIR_WP}/oklch.json" \
              > "${TMPDIR_WP}/material.json" 2>/dev/null || \
              cp "${TMPDIR_WP}/oklch.json" "${TMPDIR_WP}/material.json"
            E=$(date +%s%N)
            T_MATERIAL=$(( (E-S)/1000000 ))
            echo "     material:  ${T_MATERIAL}ms"

            # Stage 6: Template render (all targets)
            S=$(date +%s%N)
            TEMPLATE_DIR="ash-cli/engines/color-engine/templates"
            if [[ -d "${TEMPLATE_DIR}" ]]; then
              for tpl in "${TEMPLATE_DIR}"/*.template; do
                [[ -f "${tpl}" ]] || continue
                TARGET=$(basename "${tpl}" .template)
                sed \
                  "s|{{ACCENT}}|$(jq -r '.accent // "#888888"' "${TMPDIR_WP}/material.json")|g" \
                  "${tpl}" > "${TMPDIR_WP}/${TARGET}.out" 2>/dev/null || true
              done
            fi
            E=$(date +%s%N)
            T_TEMPLATE=$(( (E-S)/1000000 ))
            echo "     template:  ${T_TEMPLATE}ms"

            TOTAL_WP=$((T_EXTRACT+T_HARMONIZE+T_WCAG+T_OKLCH+T_MATERIAL+T_TEMPLATE))
            echo "     ── TOTAL:  ${TOTAL_WP}ms"

            # Accumulate
            STAGE_TOTALS[extract]=$(( STAGE_TOTALS[extract]+T_EXTRACT ))
            STAGE_TOTALS[harmonize]=$(( STAGE_TOTALS[harmonize]+T_HARMONIZE ))
            STAGE_TOTALS[wcag]=$(( STAGE_TOTALS[wcag]+T_WCAG ))
            STAGE_TOTALS[oklch]=$(( STAGE_TOTALS[oklch]+T_OKLCH ))
            STAGE_TOTALS[material]=$(( STAGE_TOTALS[material]+T_MATERIAL ))
            STAGE_TOTALS[template]=$(( STAGE_TOTALS[template]+T_TEMPLATE ))
            OVERALL_TOTAL=$(( OVERALL_TOTAL+TOTAL_WP ))

            rm -rf "${TMPDIR_WP}"
          done

          # Compute averages
          MEAN_EXTRACT=$(( STAGE_TOTALS[extract]/TOTAL ))
          MEAN_HARMONIZE=$(( STAGE_TOTALS[harmonize]/TOTAL ))
          MEAN_WCAG=$(( STAGE_TOTALS[wcag]/TOTAL ))
          MEAN_OKLCH=$(( STAGE_TOTALS[oklch]/TOTAL ))
          MEAN_MATERIAL=$(( STAGE_TOTALS[material]/TOTAL ))
          MEAN_TEMPLATE=$(( STAGE_TOTALS[template]/TOTAL ))
          MEAN_TOTAL=$(( OVERALL_TOTAL/TOTAL ))

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  📊 Pipeline Averages (${TOTAL} wallpapers):"
          echo "     extract:   ${MEAN_EXTRACT}ms"
          echo "     harmonize: ${MEAN_HARMONIZE}ms"
          echo "     wcag:      ${MEAN_WCAG}ms"
          echo "     oklch:     ${MEAN_OKLCH}ms"
          echo "     material:  ${MEAN_MATERIAL}ms"
          echo "     template:  ${MEAN_TEMPLATE}ms"
          echo "  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "     TOTAL:     ${MEAN_TOTAL}ms"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Write JSON
          cat > "${PIPE_DIR}/pipeline-results.json" << EOF
          {
            "git_sha": "${GITHUB_SHA}",
            "wallpaper_count": ${TOTAL},
            "mean_total_ms": ${MEAN_TOTAL},
            "threshold_ms": ${THRESHOLD_FULL_PIPELINE_MS},
            "passed": $([ "${MEAN_TOTAL}" -le "${THRESHOLD_FULL_PIPELINE_MS}" ] && echo "true" || echo "false"),
            "stages": {
              "extract_ms":   ${MEAN_EXTRACT},
              "harmonize_ms": ${MEAN_HARMONIZE},
              "wcag_ms":      ${MEAN_WCAG},
              "oklch_ms":     ${MEAN_OKLCH},
              "material_ms":  ${MEAN_MATERIAL},
              "template_ms":  ${MEAN_TEMPLATE}
            }
          }
          EOF

          echo "mean_total_ms=${MEAN_TOTAL}" >> "$GITHUB_OUTPUT"
          echo "passed=$([ "${MEAN_TOTAL}" -le "${THRESHOLD_FULL_PIPELINE_MS}" ] && echo "true" || echo "false")" \
            >> "$GITHUB_OUTPUT"

      - name: "📈 Pipeline waterfall chart"
        run: |
          PIPE_DIR="${BENCH_DIR}/full-pipeline"

          python3 << PYTHON_EOF
          import json
          import sys

          try:
              import matplotlib
              matplotlib.use('Agg')
              import matplotlib.pyplot as plt
              import matplotlib.patches as mpatches
              import numpy as np
          except ImportError:
              sys.exit(0)

          with open("${PIPE_DIR}/pipeline-results.json") as f:
              data = json.load(f)

          palette = {
              "bg":"#1e1e2e","surface":"#313244","surface2":"#585b70",
              "text":"#cdd6f4","subtext":"#a6adc8",
              "green":"#a6e3a1","red":"#f38ba8","blue":"#89b4fa",
              "mauve":"#cba6f7","peach":"#fab387","yellow":"#f9e2af",
              "teal":"#94e2d5","sky":"#89dceb","pink":"#f5c2e7",
          }

          stages    = data["stages"]
          stage_names = list(stages.keys())
          stage_vals  = list(stages.values())
          stage_colors = [
              palette["blue"], palette["teal"], palette["sky"],
              palette["mauve"], palette["peach"], palette["green"]
          ]
          total_ms  = data["mean_total_ms"]
          threshold = data["threshold_ms"]
          passed    = data["passed"]

          fig, (ax1, ax2) = plt.subplots(1, 2, figsize=(16, 6))
          fig.patch.set_facecolor(palette["bg"])

          for ax in [ax1, ax2]:
              ax.set_facecolor(palette["surface"])
              for sp in ax.spines.values():
                  sp.set_edgecolor(palette["surface2"])
                  sp.set_alpha(0.5)
              ax.tick_params(colors=palette["text"], labelsize=9)

          # ── Waterfall chart ───────────────────────────────────────────
          cumulative = 0
          for i, (name, val) in enumerate(zip(stage_names, stage_vals)):
              clean = name.replace("_ms","").replace("_"," ").title()
              ax1.barh(
                  [i], [val], left=[cumulative],
                  color=stage_colors[i % len(stage_colors)],
                  alpha=0.85, height=0.6,
                  edgecolor=palette["bg"], linewidth=1,
                  zorder=3
              )
              ax1.text(
                  cumulative + val/2, i,
                  f"{val}ms",
                  ha="center", va="center",
                  color=palette["bg"], fontsize=9, fontweight="bold"
              )
              ax1.text(
                  -5, i, clean,
                  ha="right", va="center",
                  color=palette["text"], fontsize=9
              )
              cumulative += val

          ax1.axvline(threshold, color=palette["red"],
                      linewidth=1.5, linestyle="--", alpha=0.7,
                      label=f"Threshold: {threshold}ms")
          ax1.axvline(total_ms, color=palette["green"] if passed else palette["red"],
                      linewidth=2.0, linestyle="-", alpha=0.9,
                      label=f"Total: {total_ms}ms")

          ax1.set_yticks([])
          ax1.set_xlabel("Cumulative Time (ms)", color=palette["text"], fontsize=10)
          ax1.set_title("Pipeline Waterfall", color=palette["text"],
                        fontsize=12, fontweight="bold", pad=12)
          ax1.legend(facecolor=palette["bg"], labelcolor=palette["text"],
                     fontsize=9, framealpha=0.85)
          ax1.grid(True, alpha=0.1, color=palette["text"], axis="x", zorder=1)

          # ── Pie: Stage breakdown ──────────────────────────────────────
          wedge_props = {"linewidth": 2, "edgecolor": palette["bg"]}
          wedges, texts, autotexts = ax2.pie(
              stage_vals,
              colors=stage_colors,
              autopct=lambda p: f"{p:.1f}%" if p > 5 else "",
              startangle=90,
              wedgeprops=wedge_props,
              pctdistance=0.75,
          )
          for at in autotexts:
              at.set_color(palette["bg"])
              at.set_fontsize(9)
              at.set_fontweight("bold")

          legend_labels = [
              f"{n.replace('_ms','').title()}: {v}ms"
              for n, v in zip(stage_names, stage_vals)
          ]
          ax2.legend(
              wedges, legend_labels,
              facecolor=palette["bg"],
              labelcolor=palette["text"],
              fontsize=8.5,
              loc="lower center",
              bbox_to_anchor=(0.5, -0.15),
              ncol=2,
              framealpha=0.85,
          )

          status_icon = "✅" if passed else "❌"
          ax2.set_title(
              f"Stage Distribution ({status_icon} {total_ms}ms total)",
              color=palette["text"], fontsize=12, fontweight="bold", pad=12
          )

          fig.suptitle(
              f"🔄 ASH Color → Theme Pipeline Benchmark\n"
              f"{'✅ PASSED' if passed else '❌ FAILED'}  ·  "
              f"total={total_ms}ms  ·  threshold={threshold}ms  ·  "
              f"{data['wallpaper_count']} wallpapers",
              color=palette["text"], fontsize=13, fontweight="bold", y=1.04
          )

          plt.tight_layout()
          plt.savefig("${PIPE_DIR}/pipeline-chart.png",
                      dpi=150, bbox_inches="tight", facecolor=palette["bg"])
          plt.close()
          print("  📈 Pipeline waterfall chart saved")
          PYTHON_EOF

      - name: "📤 Upload pipeline results"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "color-pipeline-${{ needs.generate-fixtures.outputs.bench_id }}"
          path: "${{ env.BENCH_DIR }}/full-pipeline/"
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 5 — Consolidated report
  # ───────────────────────────────────────────────────────────────────────────
  color-report:
    name: "📊 Report · Color Benchmark Summary"
    needs: [generate-fixtures, bench-algorithm, bench-throughput, bench-full-pipeline]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🔧 Install tools"
        run: |
          sudo apt-get install -y --no-install-recommends \
            jq python3 python3-pip 2>/dev/null || true
          pip3 install --quiet --user matplotlib pandas rich tabulate

      - name: "📥 Download all artifacts"
        uses: actions/download-artifact@v7
        with:
          pattern: "color-*-${{ needs.generate-fixtures.outputs.bench_id }}"
          path: "${{ env.BENCH_DIR }}/collected"
          merge-multiple: true

      - name: "📊 Consolidate & generate report"
        id: report
        run: |
          mkdir -p "${REPORTS_DIR}"

          python3 << PYTHON_EOF
          import json
          import glob
          import os
          from datetime import datetime, timezone

          collected = "${BENCH_DIR}/collected"
          reports   = "${REPORTS_DIR}"

          analyses   = []
          throughput = {}
          pipeline   = {}

          for f in glob.glob(f"{collected}/**/analysis.json", recursive=True):
              try:
                  with open(f) as fp: analyses.append(json.load(fp))
              except Exception: pass

          try:
              tp_files = glob.glob(f"{collected}/**/throughput-results.json", recursive=True)
              if tp_files:
                  with open(tp_files[0]) as f: throughput = json.load(f)
          except Exception: pass

          try:
              pp_files = glob.glob(f"{collected}/**/pipeline-results.json", recursive=True)
              if pp_files:
                  with open(pp_files[0]) as f: pipeline = json.load(f)
          except Exception: pass

          passed_all = (
              all(a.get("threshold",{}).get("passed", True) for a in analyses) and
              pipeline.get("passed", True)
          )
          total  = len(analyses)
          failed = sum(1 for a in analyses if not a.get("threshold",{}).get("passed",True))

          consolidated = {
              "bench_id": "${{ needs.generate-fixtures.outputs.bench_id }}",
              "git_sha": "${GITHUB_SHA}",
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "overall_pass": passed_all,
              "summary": {"total":total,"passed":total-failed,"failed":failed},
              "algorithm_results": analyses,
              "throughput": throughput,
              "pipeline": pipeline,
          }

          with open(f"{reports}/color-consolidated.json","w") as f:
              json.dump(consolidated, f, indent=2)

          # Markdown report
          status = "✅ PASSED" if passed_all else "❌ FAILED"
          md = [
              f"# 🎨 Color Extraction Benchmark Report",
              f"",
              f"> **{status}**  ·  SHA `{consolidated['git_sha'][:8]}`  ·  {consolidated['timestamp']}",
              f"",
              f"## 📊 Algorithm Results",
              f"",
              f"| Algorithm | Resolution | Mean | p95 | Threshold | Accuracy | Status |",
              f"|-----------|------------|------|-----|-----------|----------|--------|",
          ]

          for a in sorted(analyses, key=lambda x: x.get("algo","")):
              t    = a.get("timing", {})
              thr  = a.get("threshold", {})
              icon = "✅" if thr.get("passed") else "❌"
              md.append(
                  f"| `{a.get('algo','—')}` "
                  f"| `{a.get('resolution','—')}` "
                  f"| `{t.get('mean_ms','—')}ms` "
                  f"| `{t.get('p95_ms','—')}ms` "
                  f"| `{thr.get('threshold_ms','—')}ms` "
                  f"| — "
                  f"| {icon} |"
              )

          if throughput:
              md += [
                  f"",
                  f"## 🚀 Throughput",
                  f"- Sequential: `{throughput.get('sequential',{}).get('images_per_second','—')} img/s`",
                  f"- Parallel:   `{throughput.get('parallel',{}).get('images_per_second','—')} img/s`",
                  f"- Speedup:    `{throughput.get('speedup_factor','—')}x`",
              ]

          if pipeline:
              pp_icon = "✅" if pipeline.get("passed") else "❌"
              md += [
                  f"",
                  f"## 🔄 Full Pipeline: {pp_icon} `{pipeline.get('mean_total_ms','—')}ms`",
                  f"",
                  f"| Stage | Time |",
                  f"|-------|------|",
              ]
              for k, v in pipeline.get("stages", {}).items():
                  md.append(f"| `{k}` | `{v}ms` |")

          md += ["", "---", "*Generated by ASH v5.0 Omega Color Benchmark*"]

          report_content = "\n".join(md)
          with open(f"{reports}/color-report.md","w") as f:
              f.write(report_content)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"w") as f:
              f.write(report_content)

          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"overall_pass={'true' if passed_all else 'false'}\n")

          print(f"  {status} — {total-failed}/{total} algorithms passed")
          PYTHON_EOF

      - name: "💬 Post PR comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let content = '';
            try { content = fs.readFileSync('${{ env.REPORTS_DIR }}/color-report.md','utf8'); }
            catch(e) { content = '> Color benchmark report unavailable.'; }
            const passed = '${{ steps.report.outputs.overall_pass }}' === 'true';
            const body = [
              `## 🎨 Color Extraction Benchmark Results`,
              ``,
              `${passed ? '✅ All color benchmarks passed' : '❌ Some benchmarks failed'}`,
              ``,
              `<details><summary>📊 Full Report</summary>`,
              ``,
              content,
              `</details>`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Color Extraction Benchmark')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: "📤 Upload final report"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "color-report-${{ needs.generate-fixtures.outputs.bench_id }}"
          path: "${{ env.REPORTS_DIR }}/"
          retention-days: 90