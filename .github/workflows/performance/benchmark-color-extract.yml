          # Create OKLCH converter
          cat > ash-cli/engines/color-engine/oklch.sh << 'OKLCH_EOF'
          #!/usr/bin/env bash
          # ASH OKLCH Color Space Engine v5.0
          set -euo pipefail
          INPUT="${1:-/dev/stdin}"
          python3 - "${INPUT}" << 'PYEOF'
          import sys, json, math

          def srgb_to_linear(c):
              return c/12.92 if c <= 0.04045 else ((c+0.055)/1.055)**2.4

          def linear_to_oklab(r,g,b):
              l = 0.4122214708*r + 0.5363325363*g + 0.0514459929*b
              m = 0.2119034982*r + 0.6806995451*g + 0.1073969566*b
              s = 0.0883024619*r + 0.2817188376*g + 0.6299787005*b
              l_,m_,s_ = l**(1/3), m**(1/3), s**(1/3)
              return (
                  0.2104542553*l_+0.7936177850*m_-0.0040720468*s_,
                  1.9779984951*l_-2.4285922050*m_+0.4505937099*s_,
                  0.0259040371*l_+0.7827717662*m_-0.8086757660*s_
              )

          def hex_to_oklch(hex_color):
              h = hex_color.lstrip('#')
              r,g,b = int(h[0:2],16)/255, int(h[2:4],16)/255, int(h[4:6],16)/255
              rl,gl,bl = srgb_to_linear(r), srgb_to_linear(g), srgb_to_linear(b)
              L,a,b_val = linear_to_oklab(rl,gl,bl)
              C = math.sqrt(a**2+b_val**2)
              H = math.degrees(math.atan2(b_val,a)) % 360
              return round(L,4), round(C,4), round(H,2)

          try:
              with open(sys.argv[1]) as f: data = json.load(f)
          except Exception:
              data = json.loads(sys.stdin.read())

          oklch_colors = {}
          for name, hex_color in data.get("colors", {}).items():
              try:
                  L,C,H = hex_to_oklch(hex_color)
                  oklch_colors[name] = {"hex":hex_color,"L":L,"C":C,"H":H,
                                         "oklch":f"oklch({L} {C} {H}deg)"}
              except Exception as e:
                  oklch_colors[name] = {"hex":hex_color,"error":str(e)}

          data["oklch"] = oklch_colors
          print(json.dumps(data, indent=2))
          PYEOF
