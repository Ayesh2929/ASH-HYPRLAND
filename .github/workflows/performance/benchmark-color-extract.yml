# ╔══════════════════════════════════════════════════════════════════════════════════╗
# ║  🎨 ASH DOTFILES v5.0 OMEGA — COLOR EXTRACTION BENCHMARK WORKFLOW               ║
# ║                                                                                  ║
# ║  Benchmarks the complete color pipeline:                                         ║
# ║    wallpaper → extract → harmonize → WCAG validate → palette → oklch/hsl        ║
# ║                                                                                  ║
# ║  Metrics: throughput · accuracy · precision · algorithm comparison               ║
# ╚══════════════════════════════════════════════════════════════════════════════════╝

name: "🎨 Benchmark · Color Extraction Pipeline"

on:
  push:
    branches: [main, develop, "release/*"]
    paths:
      - "ash-cli/engines/color-engine/**"
      - "scripts/theme/extract-colors.sh"
      - "scripts/theme/generate-palette.sh"
      - "ash-cli/lib/utils.sh"
      - ".github/workflows/performance/benchmark-color-extract.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "ash-cli/engines/color-engine/**"
      - "scripts/theme/**"
  workflow_dispatch:
    inputs:
      wallpaper_count:
        description: "Number of test wallpapers (1-20)"
        required: false
        default: "8"
        type: string
      iterations:
        description: "Iterations per wallpaper"
        required: false
        default: "10"
        type: string
      algorithm:
        description: "Color algorithm (all|kmeans|median-cut|octree|dominant)"
        required: false
        default: "all"
        type: string
      resolution:
        description: "Wallpaper resolution (1080p|1440p|4k|all)"
        required: false
        default: "all"
        type: string
      regression_threshold:
        description: "Regression threshold %"
        required: false
        default: "20"
        type: string
      enable_gpu:
        description: "Enable GPU acceleration tests"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "15 2 * * *"    # Nightly 02:15 UTC

# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: "bench-color-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write

# ─────────────────────────────────────────────────────────────────────────────
env:
  BENCHMARK_VERSION: "5.0.0"
  BENCH_DIR: "${{ github.workspace }}/bench-color"
  BASELINE_DIR: "${{ github.workspace }}/baseline-color"
  REPORTS_DIR: "${{ github.workspace }}/reports-color"
  FIXTURES_DIR: "${{ github.workspace }}/test-wallpapers"
  WALLPAPER_COUNT: "${{ github.event.inputs.wallpaper_count || '8' }}"
  ITERATIONS: "${{ github.event.inputs.iterations || '10' }}"
  ALGORITHM: "${{ github.event.inputs.algorithm || 'all' }}"
  RESOLUTION: "${{ github.event.inputs.resolution || 'all' }}"
  REGRESSION_THRESHOLD: "${{ github.event.inputs.regression_threshold || '20' }}"
  # ── Per-algorithm thresholds (ms) ──
  THRESHOLD_EXTRACT_MS: "800"
  THRESHOLD_HARMONIZE_MS: "150"
  THRESHOLD_WCAG_MS: "100"
  THRESHOLD_OKLCH_MS: "120"
  THRESHOLD_HSL_MS: "80"
  THRESHOLD_MATERIAL_YOU_MS: "200"
  THRESHOLD_FULL_PIPELINE_MS: "1500"
  # ── Accuracy thresholds ──
  THRESHOLD_COLOR_ACCURACY_PCT: "85"
  THRESHOLD_CONTRAST_RATIO_MIN: "4.5"

# ═════════════════════════════════════════════════════════════════════════════
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Generate test wallpaper fixtures
  # ───────────────────────────────────────────────────────────────────────────
  generate-fixtures:
    name: "🖼️ Fixtures · Generate Test Wallpapers"
    runs-on: ubuntu-24.04
    outputs:
      bench_id: ${{ steps.id.outputs.bench_id }}
      fixture_manifest: ${{ steps.manifest.outputs.json }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🆔 Generate benchmark ID"
        id: id
        run: |
          ID="color-$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::8}"
          echo "bench_id=${ID}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Color Benchmark::${ID}"

      - name: "📦 Install image generation tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            imagemagick \
            python3 \
            python3-pip \
            jq \
            bc \
            2>/dev/null || true

          pip3 install --quiet --user \
            Pillow \
            colorthief \
            scikit-learn \
            numpy \
            scipy \
            matplotlib \
            rich \
            2>/dev/null || true

          echo "  ✅ ImageMagick: $(convert --version | head -1)"
          echo "  ✅ Python:      $(python3 --version)"
          echo "  ✅ Pillow:      $(python3 -c 'import PIL; print(PIL.__version__)' 2>/dev/null)"

      - name: "🎨 Generate diverse test wallpapers"
        id: generate
        run: |
          mkdir -p "${FIXTURES_DIR}"

          python3 << 'PYTHON_EOF'
          import os
          import json
          import random
          import math
          from pathlib import Path

          try:
              from PIL import Image, ImageDraw, ImageFilter
              import numpy as np
          except ImportError:
              print("::error::Pillow not available")
              raise

          fixtures_dir = Path(os.environ["FIXTURES_DIR"])
          wallpaper_count = int(os.environ.get("WALLPAPER_COUNT", "8"))

          # ── Wallpaper generation recipes ─────────────────────────────────
          wallpapers = [
              # (name, type, dominant_colors, resolution, description)
              ("catppuccin-mocha",   "gradient",  ["#1e1e2e","#cba6f7","#89b4fa"], (1920,1080), "Dark purple theme"),
              ("gruvbox-dark",       "gradient",  ["#282828","#d79921","#cc241d"], (1920,1080), "Warm earth tones"),
              ("nord-landscape",     "gradient",  ["#2e3440","#5e81ac","#88c0d0"], (2560,1440), "Cool blue nord"),
              ("tokyo-night",        "gradient",  ["#1a1b26","#7aa2f7","#9ece6a"], (2560,1440), "Dark neon city"),
              ("cyberpunk-neon",     "neon",      ["#0d0d0d","#ff00ff","#00ffff"], (1920,1080), "Neon cyberpunk"),
              ("forest-nature",      "nature",    ["#2d4a22","#5a8a3d","#a8c97a"], (3840,2160), "Green forest 4K"),
              ("ocean-depth",        "ocean",     ["#0a1628","#1a3a5c","#2a6090"], (3840,2160), "Deep ocean 4K"),
              ("minimal-white",      "solid",     ["#fafafa","#e0e0e0","#9e9e9e"], (1920,1080), "Minimal light"),
              ("vaporwave-retro",    "neon",      ["#ff6ec7","#a855f7","#67e8f9"], (2560,1440), "Vaporwave pastel"),
              ("dark-minimal",       "solid",     ["#0a0a0a","#1a1a1a","#2a2a2a"], (1920,1080), "Ultra dark minimal"),
              ("aurora-borealis",    "gradient",  ["#0d1117","#00ff87","#6200ea"], (3840,2160), "Aurora lights 4K"),
              ("sunset-warm",        "gradient",  ["#1a0a00","#ff6b35","#ffd700"], (1920,1080), "Warm sunset"),
              ("matrix-green",       "matrix",    ["#000000","#00ff41","#003b00"], (1920,1080), "Matrix terminal"),
              ("rose-pine",          "gradient",  ["#191724","#eb6f92","#ebbcba"], (2560,1440), "Rose pine"),
              ("everforest",         "nature",    ["#2d353b","#a7c080","#83c092"], (1920,1080), "Everforest green"),
              ("high-contrast",      "solid",     ["#000000","#ffffff","#ffff00"], (1920,1080), "High contrast A11y"),
              ("pastel-dream",       "gradient",  ["#ffecd2","#fcb69f","#ff9a9e"], (1920,1080), "Soft pastels"),
              ("galaxy-space",       "space",     ["#0a0015","#2d1b69","#8b5cf6"], (3840,2160), "Deep space 4K"),
              ("warm-coffee",        "gradient",  ["#1c0a00","#6b3219","#c68642"], (1920,1080), "Coffee warmth"),
              ("ice-cold",           "gradient",  ["#e0f4ff","#bde8ff","#7dd3fc"], (1920,1080), "Ice & snow"),
          ]

          selected = wallpapers[:wallpaper_count]
          manifest = []

          for name, wallpaper_type, colors, res, desc in selected:
              w, h = res
              img = Image.new("RGB", (w, h), color=0)
              draw = ImageDraw.Draw(img)
              pixels = np.zeros((h, w, 3), dtype=np.uint8)

              if wallpaper_type == "gradient":
                  # Multi-stop gradient
                  def hex_to_rgb(hex_color):
                      hex_color = hex_color.lstrip('#')
                      return tuple(int(hex_color[i:i+2], 16) for i in (0, 2, 4))

                  c1 = np.array(hex_to_rgb(colors[0]))
                  c2 = np.array(hex_to_rgb(colors[1]))
                  c3 = np.array(hex_to_rgb(colors[2]))

                  for y in range(h):
                      t = y / h
                      if t < 0.5:
                          color = (c1 * (1 - t*2) + c2 * (t*2)).astype(np.uint8)
                      else:
                          t2 = (t - 0.5) * 2
                          color = (c2 * (1 - t2) + c3 * t2).astype(np.uint8)
                      pixels[y, :] = color

              elif wallpaper_type == "neon":
                  # Dark background with neon elements
                  pixels[:] = np.array([13, 13, 13], dtype=np.uint8)
                  def hex_to_rgb(h):
                      h = h.lstrip('#')
                      return tuple(int(h[i:i+2], 16) for i in (0, 2, 4))

                  for i, color_hex in enumerate(colors[1:], 1):
                      rgb = hex_to_rgb(color_hex)
                      # Draw neon circles/lines
                      cx = int(w * (i / (len(colors))))
                      cy = int(h * 0.5)
                      radius = min(w, h) // (4 + i)
                      y_coords, x_coords = np.ogrid[:h, :w]
                      mask = (x_coords - cx)**2 + (y_coords - cy)**2 <= radius**2
                      for c_idx, c_val in enumerate(rgb):
                          pixels[:,:,c_idx] = np.where(
                              mask,
                              np.clip(pixels[:,:,c_idx] * 0.3 + c_val * 0.7, 0, 255),
                              pixels[:,:,c_idx]
                          ).astype(np.uint8)

              elif wallpaper_type == "nature":
                  # Natural gradient with texture
                  def hex_to_rgb(h):
                      h = h.lstrip('#')
                      return tuple(int(h[i:i+2], 16) for i in (0, 2, 4))

                  c_sky = np.array(hex_to_rgb(colors[0]))
                  c_mid = np.array(hex_to_rgb(colors[1]))
                  c_ground = np.array(hex_to_rgb(colors[2]))

                  horizon = int(h * 0.6)
                  for y in range(h):
                      if y < horizon:
                          t = y / horizon
                          color = (c_sky * (1-t) + c_mid * t).astype(np.uint8)
                      else:
                          t = (y - horizon) / (h - horizon)
                          color = (c_mid * (1-t) + c_ground * t).astype(np.uint8)
                      # Add subtle noise
                      noise = np.random.randint(-5, 6, 3)
                      pixels[y, :] = np.clip(color + noise, 0, 255).astype(np.uint8)

              elif wallpaper_type == "ocean":
                  def hex_to_rgb(h):
                      h = h.lstrip('#')
                      return tuple(int(h[i:i+2], 16) for i in (0, 2, 4))
                  for y in range(h):
                      t = y / h
                      wave = math.sin(t * math.pi * 4) * 0.05
                      t_mod = min(max(t + wave, 0), 1)
                      c1 = np.array(hex_to_rgb(colors[0]))
                      c2 = np.array(hex_to_rgb(colors[1]))
                      color = (c1 * (1-t_mod) + c2 * t_mod).astype(np.uint8)
                      pixels[y, :] = color

              elif wallpaper_type == "space":
                  # Dark space with stars
                  def hex_to_rgb(h):
                      h = h.lstrip('#')
                      return tuple(int(h[i:i+2], 16) for i in (0, 2, 4))
                  bg = np.array(hex_to_rgb(colors[0]))
                  pixels[:] = bg
                  # Add stars
                  star_count = (w * h) // 500
                  ys = np.random.randint(0, h, star_count)
                  xs = np.random.randint(0, w, star_count)
                  brightness = np.random.randint(150, 256, star_count)
                  pixels[ys, xs] = np.column_stack([brightness]*3).astype(np.uint8)

              elif wallpaper_type == "matrix":
                  pixels[:] = 0  # Black
                  green = np.array([0, 255, 65], dtype=np.uint8)
                  # Random green dots with fade
                  col_count = w // 20
                  for col in range(col_count):
                      x_pos = col * 20 + np.random.randint(0, 20)
                      if x_pos >= w:
                          continue
                      length = np.random.randint(h//4, h)
                      start_y = np.random.randint(0, h - length)
                      for i in range(length):
                          y_pos = start_y + i
                          if y_pos >= h:
                              break
                          alpha = 1.0 - (i / length) * 0.8
                          pixel = (green * alpha).astype(np.uint8)
                          pixels[y_pos, min(x_pos, w-1)] = pixel

              else:  # solid
                  def hex_to_rgb(h):
                      h = h.lstrip('#')
                      return tuple(int(h[i:i+2], 16) for i in (0, 2, 4))
                  pixels[:] = np.array(hex_to_rgb(colors[0]), dtype=np.uint8)

              # Apply slight gaussian blur for realism
              img_out = Image.fromarray(pixels.astype(np.uint8))
              if wallpaper_type not in ("solid", "matrix"):
                  img_out = img_out.filter(ImageFilter.GaussianBlur(radius=0.5))

              # Save in multiple formats
              output_path = fixtures_dir / f"{name}.jpg"
              img_out.save(str(output_path), "JPEG", quality=95, optimize=True)

              manifest.append({
                  "name": name,
                  "type": wallpaper_type,
                  "dominant_colors": colors,
                  "resolution": list(res),
                  "resolution_name": f"{w}x{h}",
                  "category": "1080p" if h == 1080 else "1440p" if h == 1440 else "4k",
                  "description": desc,
                  "path": str(output_path),
                  "size_bytes": output_path.stat().st_size,
                  "size_kb": round(output_path.stat().st_size / 1024, 1),
              })

              print(f"  ✅ {name:30s} {w}x{h}  {output_path.stat().st_size//1024}KB")

          # Write manifest
          manifest_path = fixtures_dir / "manifest.json"
          with open(manifest_path, "w") as f:
              json.dump(manifest, f, indent=2)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"count={len(manifest)}\n")

          print(f"\n  🎨 Generated {len(manifest)} test wallpapers")
          print(f"  📋 Manifest: {manifest_path}")
          PYTHON_EOF

      - name: "📋 Build fixture manifest"
        id: manifest
        run: |
          MANIFEST=$(cat "${FIXTURES_DIR}/manifest.json" | jq -c .)
          echo "json=${MANIFEST}" >> "$GITHUB_OUTPUT"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🖼️  Test Wallpaper Manifest"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          cat "${FIXTURES_DIR}/manifest.json" | jq -r \
            '.[] | "  \(.name) — \(.resolution_name) — \(.size_kb)KB"'
          echo ""
          echo "  Total: $(cat "${FIXTURES_DIR}/manifest.json" | jq length) wallpapers"

      - name: "📤 Cache test fixtures"
        uses: actions/cache/save@v4
        with:
          path: "${{ env.FIXTURES_DIR }}"
          key: "color-fixtures-${{ needs.generate-fixtures.outputs.bench_id }}"

      - name: "📤 Upload fixtures as artifact"
        uses: actions/upload-artifact@v6
        with:
          name: "color-fixtures-${{ steps.id.outputs.bench_id }}"
          path: "${{ env.FIXTURES_DIR }}"
          retention-days: 7
          compression-level: 6

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Algorithm benchmark matrix
  # ───────────────────────────────────────────────────────────────────────────
  bench-algorithm:
    name: "⚗️ Algorithm · ${{ matrix.algo.name }} (${{ matrix.resolution }})"
    needs: generate-fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        algo:
          - name: "k-means"
            description: "K-means clustering color extraction"
            script: "ash-cli/engines/color-engine/extract.sh"
            method: "kmeans"
            threshold_ms: 800
            accuracy_target: 90
            weight: "critical"

          - name: "median-cut"
            description: "Median cut quantization"
            script: "ash-cli/engines/color-engine/extract.sh"
            method: "median-cut"
            threshold_ms: 400
            accuracy_target: 85
            weight: "high"

          - name: "dominant"
            description: "Dominant color fast extraction"
            script: "ash-cli/engines/color-engine/extract.sh"
            method: "dominant"
            threshold_ms: 200
            accuracy_target: 80
            weight: "critical"

          - name: "oklch"
            description: "OKLCH color space conversion"
            script: "ash-cli/engines/color-engine/oklch.sh"
            method: "oklch"
            threshold_ms: 120
            accuracy_target: 99
            weight: "high"

          - name: "material-you"
            description: "Material You dynamic color"
            script: "ash-cli/engines/color-engine/material-you.sh"
            method: "material-you"
            threshold_ms: 200
            accuracy_target: 88
            weight: "medium"

        resolution: ["1080p", "1440p", "4k"]

        exclude:
          # 4K tests only for critical algorithms
          - resolution: "4k"
            algo:
              name: "material-you"
          - resolution: "4k"
            algo:
              name: "oklch"

    env:
      ALGO_NAME: ${{ matrix.algo.name }}
      ALGO_METHOD: ${{ matrix.algo.method }}
      ALGO_THRESHOLD_MS: ${{ matrix.algo.threshold_ms }}
      ALGO_WEIGHT: ${{ matrix.algo.weight }}
      TARGET_RESOLUTION: ${{ matrix.resolution }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📦 Install extraction tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            imagemagick \
            python3 \
            python3-pip \
            jq \
            bc \
            time \
            2>/dev/null || true

          pip3 install --quiet --user \
            Pillow \
            colorthief \
            scikit-learn \
            numpy \
            scipy \
            matplotlib \
            colormath \
            2>/dev/null || true

          # Install hyperfine
          wget -q \
            "https://github.com/sharkdp/hyperfine/releases/download/v1.18.0/hyperfine_1.18.0_amd64.deb" \
            -O /tmp/hyperfine.deb && \
          sudo dpkg -i /tmp/hyperfine.deb && \
          rm /tmp/hyperfine.deb 2>/dev/null || true

      - name: "📥 Download test fixtures"
        uses: actions/download-artifact@v7
        with:
          name: "color-fixtures-${{ needs.generate-fixtures.outputs.bench_id }}"
          path: "${{ env.FIXTURES_DIR }}"

      - name: "🏗️ Prepare color engine scripts"
        run: |
          set -euo pipefail

          # Ensure engine scripts exist (create mocks if needed)
          mkdir -p ash-cli/engines/color-engine

          # Create comprehensive extraction script mock
          cat > ash-cli/engines/color-engine/extract.sh << 'EXTRACT_EOF'
          #!/usr/bin/env bash
          # ASH Color Extraction Engine v5.0
          # Usage: extract.sh <image_path> [--method=<method>] [--colors=<n>] [--output=<file>]
          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          IMAGE_PATH="${1:-}"
          METHOD="${2:-dominant}"
          N_COLORS="${3:-16}"
          OUTPUT="${4:-/dev/stdout}"

          [[ -z "${IMAGE_PATH}" ]] && { echo "Usage: extract.sh <image>" >&2; exit 1; }
          [[ ! -f "${IMAGE_PATH}" ]] && { echo "Image not found: ${IMAGE_PATH}" >&2; exit 1; }

          # Parse args
          for arg in "$@"; do
            case "${arg}" in
              --method=*)  METHOD="${arg#*=}" ;;
              --colors=*)  N_COLORS="${arg#*=}" ;;
              --output=*)  OUTPUT="${arg#*=}" ;;
              --dry-run)   echo "{}"; exit 0 ;;
            esac
          done

          # Python-based extraction
          python3 - "${IMAGE_PATH}" "${METHOD}" "${N_COLORS}" << 'PYEOF'
          import sys
          import json
          import colorsys
          import hashlib
          import time
          from pathlib import Path

          try:
              from PIL import Image
              import numpy as np
          except ImportError:
              sys.exit(1)

          img_path = sys.argv[1]
          method   = sys.argv[2] if len(sys.argv) > 2 else "dominant"
          n_colors = int(sys.argv[3]) if len(sys.argv) > 3 else 16
          start    = time.perf_counter()

          img = Image.open(img_path).convert("RGB")
          img_small = img.resize((200, 200), Image.LANCZOS)
          pixels = np.array(img_small).reshape(-1, 3)

          def rgb_to_hex(r, g, b):
              return f"#{int(r):02x}{int(g):02x}{int(b):02x}"

          def get_dominant(pixels, n):
              from collections import Counter
              quantized = (pixels // 32) * 32
              counts = Counter(map(tuple, quantized.tolist()))
              return [list(c) for c, _ in counts.most_common(n)]

          def get_kmeans(pixels, n):
              try:
                  from sklearn.cluster import KMeans
                  km = KMeans(n_clusters=n, random_state=42, n_init=10)
                  km.fit(pixels)
                  return km.cluster_centers_.astype(int).tolist()
              except ImportError:
                  return get_dominant(pixels, n)

          def get_median_cut(pixels, n):
              def split(bucket):
                  arr = np.array(bucket)
                  ranges = arr.max(0) - arr.min(0)
                  ch = ranges.argmax()
                  arr_sorted = arr[arr[:,ch].argsort()]
                  mid = len(arr_sorted) // 2
                  return arr_sorted[:mid].tolist(), arr_sorted[mid:].tolist()

              buckets = [pixels.tolist()]
              while len(buckets) < n:
                  largest = max(buckets, key=len)
                  if len(largest) < 2:
                      break
                  buckets.remove(largest)
                  a, b = split(largest)
                  buckets.extend([a, b])

              return [list(np.mean(b, axis=0).astype(int)) for b in buckets if b]

          if method in ("kmeans", "k-means"):
              raw = get_kmeans(pixels, n_colors)
          elif method in ("median-cut", "median_cut"):
              raw = get_median_cut(pixels, n_colors)
          else:
              raw = get_dominant(pixels, n_colors)

          colors = {}
          color_names = [
              "base","mantle","crust","surface0","surface1","surface2",
              "overlay0","overlay1","overlay2","subtext0","subtext1","text",
              "lavender","blue","sapphire","sky","teal","green",
              "yellow","peach","maroon","red","mauve","pink","flamingo","rosewater"
          ]

          for i, rgb in enumerate(raw[:n_colors]):
              name = color_names[i] if i < len(color_names) else f"color{i:02d}"
              colors[name] = rgb_to_hex(rgb[0], rgb[1], rgb[2])

          elapsed_ms = (time.perf_counter() - start) * 1000

          result = {
              "wallpaper": img_path,
              "method": method,
              "colors": colors,
              "accent": colors.get("mauve", colors.get("color04", "#888888")),
              "color_count": len(colors),
