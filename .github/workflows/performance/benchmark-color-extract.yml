      - name: "🎯 Accuracy validation"
        id: accuracy
        if: steps.bench.outputs.skipped != 'true'
        run: |
          OUTPUT_DIR="${BENCH_DIR}/${ALGO_NAME}/${TARGET_RESOLUTION}"
          ACCURACY_OUT="${OUTPUT_DIR}/accuracy.json"

          python3 << PYTHON_EOF
          import json
          import os
          import math

          # Load fixture manifest
          try:
              with open("${FIXTURES_DIR}/manifest.json") as f:
                  manifest = json.load(f)
          except Exception:
              manifest = []

          TARGET_RES = "${TARGET_RESOLUTION}"
          wallpapers = [m for m in manifest if m.get("category") == TARGET_RES][:4]

          accuracy_results = []
          target_accuracy = float("${{ matrix.algo.accuracy_target }}")

          for wp in wallpapers:
              try:
                  import subprocess
                  result = subprocess.run(
                      ["bash", "ash-cli/engines/color-engine/extract.sh",
                       wp["path"], f"--method=${ALGO_METHOD}"],
                      capture_output=True, text=True, timeout=60
                  )

                  extracted = json.loads(result.stdout) if result.returncode == 0 else {}
                  extracted_colors = list(extracted.get("colors", {}).values())
                  expected_colors  = wp.get("dominant_colors", [])

                  # Color distance check (delta E simplified)
                  def hex_to_rgb(h):
                      h = h.lstrip('#')
                      return [int(h[i:i+2],16) for i in (0,2,4)]

                  def color_distance(c1_hex, c2_hex):
                      c1 = hex_to_rgb(c1_hex)
                      c2 = hex_to_rgb(c2_hex)
                      return math.sqrt(sum((a-b)**2 for a,b in zip(c1,c2)))

                  # Check if expected dominant colors are "close" to extracted
                  close_count = 0
                  for exp_color in expected_colors:
                      min_dist = min(
                          (color_distance(exp_color, ext_c)
                           for ext_c in extracted_colors),
                          default=255*math.sqrt(3)
                      )
                      if min_dist < 80:  # Within ~30% color distance
                          close_count += 1

                  accuracy_pct = (close_count / len(expected_colors) * 100) \
                      if expected_colors else 100

                  accuracy_results.append({
                      "wallpaper": wp["name"],
                      "expected_colors": expected_colors,
                      "extracted_count": len(extracted_colors),
                      "matched_count": close_count,
                      "accuracy_pct": round(accuracy_pct, 1),
                      "extraction_ms": extracted.get("extraction_ms", 0),
                  })

              except Exception as e:
                  accuracy_results.append({
                      "wallpaper": wp.get("name","?"),
                      "error": str(e),
                      "accuracy_pct": 0,
                  })

          avg_accuracy = (
              sum(r.get("accuracy_pct", 0) for r in accuracy_results)
              / len(accuracy_results)
          ) if accuracy_results else 0

          passed = avg_accuracy >= target_accuracy

          result = {
              "algo": "${ALGO_NAME}",
              "resolution": "${TARGET_RESOLUTION}",
              "per_wallpaper": accuracy_results,
              "avg_accuracy_pct": round(avg_accuracy, 1),
              "target_accuracy_pct": target_accuracy,
              "passed": passed,
          }

          with open("${ACCURACY_OUT}", "w") as f:
              json.dump(result, f, indent=2)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"accuracy_pct={round(avg_accuracy,1)}\n")
              out.write(f"accuracy_passed={'true' if passed else 'false'}\n")

          status = "✅" if passed else "❌"
          print(f"  {status} Accuracy: {round(avg_accuracy,1)}% "
                f"(target={target_accuracy}%)")
          PYTHON_EOF

