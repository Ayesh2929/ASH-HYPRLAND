              h = hex_color.lstrip('#')
              r,g,b = int(h[0:2],16)/255, int(h[2:4],16)/255, int(h[4:6],16)/255
              return colorsys.rgb_to_hsv(r,g,b)

          def hsv_to_hex(h,s,v):
              r,g,b = colorsys.hsv_to_rgb(h,s,v)
              return f"#{int(r*255):02x}{int(g*255):02x}{int(b*255):02x}"

          def generate_tonal_palette(seed_hex, n_tones=13):
              h,s,v = hex_to_hsv(seed_hex)
              tones = [10,20,30,40,50,60,70,80,90,95,99,100,0]
              return {t: hsv_to_hex(h, s*(1-t/200), t/100) for t in tones}

          try:
              with open(sys.argv[1]) as f: data = json.load(f)
          except Exception:
              data = {"colors":{"mauve":"#cba6f7"}}

          accent = data.get("accent", data.get("colors",{}).get("mauve","#888888"))
