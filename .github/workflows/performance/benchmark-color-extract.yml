          jq '.results | length' "${OUTPUT_DIR}/hyperfine-results.json"

      - name: "📊 Process + statistical analysis"
        id: analyze
        if: steps.bench.outputs.skipped != 'true'
        run: |
          OUTPUT_DIR="${BENCH_DIR}/${ALGO_NAME}/${TARGET_RESOLUTION}"
          PROCESSED="${OUTPUT_DIR}/analysis.json"

          python3 << PYTHON_EOF
          import json
          import os
          import statistics
          import math

          with open("${OUTPUT_DIR}/hyperfine-results.json") as f:
              raw = json.load(f)

          results = raw.get("results", [])
          if not results:
              print("  ⚠️ No results to analyze")
              analysis = {"algo":"${ALGO_NAME}","resolution":"${TARGET_RESOLUTION}","error":"no_data"}
              with open("${PROCESSED}", "w") as f:
                  json.dump(analysis, f)
              exit(0)

          # Aggregate across all wallpapers
          all_times_ms = []
          per_wallpaper = []

          for r in results:
              times_ms = [t * 1000 for t in r.get("times", [r.get("mean", 0)])]
              all_times_ms.extend(times_ms)
              per_wallpaper.append({
                  "name": r.get("command", "unknown"),
                  "mean_ms": round(r.get("mean", 0) * 1000, 3),
                  "min_ms":  round(r.get("min", 0) * 1000, 3),
                  "max_ms":  round(r.get("max", 0) * 1000, 3),
                  "stddev_ms": round(r.get("stddev", 0) * 1000, 3),
              })

          n = len(all_times_ms)
          mean_ms   = statistics.mean(all_times_ms)
          median_ms = statistics.median(all_times_ms)
          stddev_ms = statistics.stdev(all_times_ms) if n > 1 else 0
          min_ms    = min(all_times_ms)
          max_ms    = max(all_times_ms)
          cv_pct    = (stddev_ms / mean_ms * 100) if mean_ms > 0 else 0

          sorted_t = sorted(all_times_ms)
          p90 = sorted_t[min(int(n*0.90), n-1)]
          p95 = sorted_t[min(int(n*0.95), n-1)]
          p99 = sorted_t[min(int(n*0.99), n-1)]

          threshold_ms = float("${ALGO_THRESHOLD_MS}")
          passed = mean_ms <= threshold_ms

          analysis = {
              "algo": "${ALGO_NAME}",
              "method": "${ALGO_METHOD}",
              "description": "${{ matrix.algo.description }}",
              "resolution": "${TARGET_RESOLUTION}",
              "weight": "${ALGO_WEIGHT}",
              "git_sha": "${GITHUB_SHA}",
              "wallpaper_count": len(results),
              "total_samples": n,
              "timing": {
                  "mean_ms": round(mean_ms, 3),
                  "median_ms": round(median_ms, 3),
                  "min_ms": round(min_ms, 3),
                  "max_ms": round(max_ms, 3),
                  "stddev_ms": round(stddev_ms, 3),
                  "cv_percent": round(cv_pct, 2),
                  "p90_ms": round(p90, 3),
                  "p95_ms": round(p95, 3),
                  "p99_ms": round(p99, 3),
              },
              "threshold": {
                  "threshold_ms": threshold_ms,
                  "passed": passed,
                  "margin_ms": round(threshold_ms - mean_ms, 3),
                  "margin_pct": round((threshold_ms - mean_ms)/threshold_ms*100, 2),
              },
              "per_wallpaper": per_wallpaper,
          }

          with open("${PROCESSED}", "w") as f:
              json.dump(analysis, f, indent=2)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"mean_ms={round(mean_ms,3)}\n")
              out.write(f"p95_ms={round(p95,3)}\n")
              out.write(f"passed={'true' if passed else 'false'}\n")
              out.write(f"cv_percent={round(cv_pct,2)}\n")

          status = "✅" if passed else "❌"
          print(f"\n  {status} {round(mean_ms,1)}ms mean  p95={round(p95,1)}ms  "
                f"cv={round(cv_pct,1)}%  passed={passed}")
