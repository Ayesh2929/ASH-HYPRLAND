              --arg res "${TARGET_RESOLUTION}" \
              '.[] | select(.category == $res) | .path' \
              "${MANIFEST}" 2>/dev/null | head -4)
          fi

          # Fallback: use all available wallpapers
          if [[ ${#WALLPAPERS[@]} -eq 0 ]]; then
