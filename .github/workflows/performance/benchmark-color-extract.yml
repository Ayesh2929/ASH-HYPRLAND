          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ⚗️  Algorithm: ${ALGO_NAME} | Resolution: ${TARGET_RESOLUTION}"
          echo "  🖼️  Wallpapers: ${#WALLPAPERS[@]} images"
          echo "  🔁  Iterations: ${ITERATIONS}"
          echo "  ⏱️  Threshold:  ${ALGO_THRESHOLD_MS}ms"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [[ ${#WALLPAPERS[@]} -eq 0 ]]; then
            echo "  ⚠️ No ${TARGET_RESOLUTION} wallpapers found — skipping"
            echo '{"results":[{"mean":0,"stddev":0,"times":[]}]}' \
              > "${OUTPUT_DIR}/hyperfine-results.json"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skipped=false" >> "$GITHUB_OUTPUT"

          # Build hyperfine commands — one per wallpaper
          HYPERFINE_CMDS=()
          for wp in "${WALLPAPERS[@]}"; do
            WP_NAME=$(basename "${wp}" .jpg)
            HYPERFINE_CMDS+=(
              "--command-name=${ALGO_NAME}/${WP_NAME}"
              "bash ash-cli/engines/color-engine/extract.sh '${wp}' --method=${ALGO_METHOD}"
            )
          done

          # Run hyperfine with multiple commands
          hyperfine \
            --runs "${ITERATIONS}" \
            --warmup 2 \
            --time-unit millisecond \
            --export-json "${OUTPUT_DIR}/hyperfine-results.json" \
            --export-markdown "${OUTPUT_DIR}/hyperfine-results.md" \
            --export-csv "${OUTPUT_DIR}/hyperfine-results.csv" \
            --shell bash \
            "${HYPERFINE_CMDS[@]}" || {
              echo "::warning::hyperfine failed — using manual timing"
              echo '{"results":[]}' > "${OUTPUT_DIR}/hyperfine-results.json"
