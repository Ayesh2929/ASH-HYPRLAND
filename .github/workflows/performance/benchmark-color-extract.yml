          # ── Panel 2: Statistics summary radar/bar ─────────────────────
          ax2 = axes[1]
          style_ax(ax2)
          stats = {
              "min":    t["min_ms"],
              "mean":   t["mean_ms"],
              "median": t["median_ms"],
              "p90":    t["p90_ms"],
