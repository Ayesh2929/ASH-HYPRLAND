          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 5 — Consolidated report & regression detection
  # ───────────────────────────────────────────────────────────────────────────
  api-report:
    name: "📊 Report · API Benchmark Consolidation"
    needs: [api-server, bench-endpoints, bench-load, bench-websocket]
    if: always() && needs.api-server.outputs.server_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "📦 Install tools"
        run: |
          pip install --quiet \
            matplotlib==3.9.2 \
            pandas==2.2.3 \
            numpy==2.1.2 \
            scipy==1.14.1 \
            jinja2==3.1.4 \
            tabulate==0.9.0 \
            rich==13.9.2
          sudo apt-get install -y --no-install-recommends jq 2>/dev/null || true

      - name: "📥 Download all artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: "api-*-${{ needs.api-server.outputs.bench_id }}"
          path: "${{ env.BENCH_DIR }}/collected"
          merge-multiple: true

      - name: "📦 Restore baseline"
        uses: actions/cache@v4
        with:
          path: "${{ env.BASELINE_DIR }}"
          key: "bench-baseline-api-${{ github.base_ref || 'main' }}"
          restore-keys: |
            bench-baseline-api-main
            bench-baseline-api-

      - name: "📊 Consolidate all results"
        id: consolidate
        run: |
          mkdir -p "${REPORTS_DIR}"

          python3 << PYTHON_EOF
          import json
          import glob
          import os
          import statistics
          from datetime import datetime, timezone

          collected  = "${BENCH_DIR}/collected"
          reports    = "${REPORTS_DIR}"
          bench_id   = "${{ needs.api-server.outputs.bench_id }}"
          git_sha    = "${GITHUB_SHA}"
          git_ref    = "${GITHUB_REF}"
          baseline_d = "${BASELINE_DIR}"

          # ── Collect endpoint metrics ──────────────────────────────────
          endpoint_metrics = []
          for f in glob.glob(f"{collected}/**/metrics.json", recursive=True):
              try:
                  with open(f) as fp: endpoint_metrics.append(json.load(fp))
              except Exception: pass

          # ── Collect load test results ─────────────────────────────────
          load_results = []
          for f in glob.glob(f"{collected}/**/load-results.json", recursive=True):
              try:
                  with open(f) as fp: load_results.append(json.load(fp))
              except Exception: pass

          # ── Collect WebSocket results ─────────────────────────────────
          ws_results = {}
          ws_files = glob.glob(f"{collected}/**/ws-results.json", recursive=True)
          if ws_files:
              try:
                  with open(ws_files[0]) as f: ws_results = json.load(f)
              except Exception: pass

          # ── Baseline comparison ───────────────────────────────────────
          regressions = []
          baseline_file = f"{baseline_d}/api-baseline.json"
          if os.path.exists(baseline_file):
              try:
                  with open(baseline_file) as f: baseline = json.load(f)
                  baseline_eps = {
                      ep["endpoint"]: ep
                      for ep in baseline.get("endpoint_metrics", [])
                  }
                  thresh_pct = float("${REGRESSION_THRESHOLD}")
                  for ep in endpoint_metrics:
                      name    = ep.get("endpoint","")
                      cur_p95 = ep.get("percentiles",{}).get("p95_ms", 0)
                      if name in baseline_eps:
                          bas_p95 = baseline_eps[name].get(
                              "percentiles",{}).get("p95_ms", cur_p95)
                          change  = ((cur_p95 - bas_p95) / max(bas_p95, 0.001)) * 100
                          if change > thresh_pct:
                              regressions.append({
                                  "endpoint": name,
                                  "baseline_p95_ms": round(bas_p95, 3),
                                  "current_p95_ms":  round(cur_p95, 3),
                                  "change_pct": round(change, 2),
                              })
              except Exception as e:
                  print(f"  ⚠️ Baseline comparison failed: {e}")

          # ── Overall pass/fail ─────────────────────────────────────────
          ep_pass   = all(e.get("threshold",{}).get("passed", True) for e in endpoint_metrics)
          load_pass = all(l.get("thresholds",{}).get("overall_pass", True) for l in load_results)
          ws_pass   = ws_results.get("overall_pass", True) if ws_results else True
          reg_pass  = len(regressions) == 0
          overall   = ep_pass and load_pass and ws_pass and reg_pass

          # ── Aggregate endpoint statistics ─────────────────────────────
          if endpoint_metrics:
              all_means = [e["timing"]["mean_ms"] for e in endpoint_metrics
                           if "timing" in e]
              all_p95s  = [e["percentiles"]["p95_ms"] for e in endpoint_metrics
                           if "percentiles" in e]
              ep_summary = {
                  "total": len(endpoint_metrics),
                  "passed": sum(1 for e in endpoint_metrics
                                if e.get("threshold",{}).get("passed",True)),
                  "failed": sum(1 for e in endpoint_metrics
                                if not e.get("threshold",{}).get("passed",True)),
                  "mean_of_means_ms": round(statistics.mean(all_means),3) if all_means else 0,
                  "mean_of_p95s_ms": round(statistics.mean(all_p95s),3) if all_p95s else 0,
                  "fastest_endpoint": min(endpoint_metrics,
                      key=lambda e: e["timing"]["mean_ms"],
                      default={}).get("endpoint","—"),
                  "slowest_endpoint": max(endpoint_metrics,
                      key=lambda e: e["timing"]["mean_ms"],
                      default={}).get("endpoint","—"),
              }
          else:
              ep_summary = {"total":0,"passed":0,"failed":0}

          consolidated = {
              "bench_id": bench_id,
              "git_sha": git_sha[:8],
              "git_ref": git_ref,
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "overall_pass": overall,
              "endpoint_summary": ep_summary,
              "load_summary": {
                  "scenarios": len(load_results),
                  "all_passed": load_pass,
              },
              "websocket_summary": {
                  "tested": bool(ws_results),
                  "passed": ws_pass,
                  "connect_ms": ws_results.get("connect_latency",{}).get("mean",0),
                  "rtt_ms": ws_results.get("ping_pong_rtt",{}).get("mean",0),
              },
              "regressions": regressions,
              "endpoint_metrics": endpoint_metrics,
              "load_results": load_results,
          }

          with open(f"{reports}/api-consolidated.json","w") as f:
              json.dump(consolidated, f, indent=2)

          # ── Markdown report ───────────────────────────────────────────
          status = "✅ PASSED" if overall else "❌ FAILED"
          md = [
              f"# 🌐 ASH REST API Benchmark Report",
              f"",
              f"> **{status}**  &nbsp;·&nbsp;  SHA `{git_sha[:8]}`"
              f"  &nbsp;·&nbsp;  `{consolidated['timestamp']}`",
              f"",
              f"## 📊 Overall Results",
              f"",
              f"| Category | Status | Details |",
              f"|----------|--------|---------|",
              f"| ⚡ Endpoint Latency | {'✅' if ep_pass else '❌'} | "
              f"{ep_summary.get('passed',0)}/{ep_summary.get('total',0)} endpoints passed |",
              f"| 💪 Load Tests | {'✅' if load_pass else '❌'} | "
              f"{len(load_results)} scenarios |",
              f"| 📡 WebSocket | {'✅' if ws_pass else '❌'} | "
              f"connect={ws_results.get('connect_latency',{}).get('mean',0):.1f}ms "
              f"rtt={ws_results.get('ping_pong_rtt',{}).get('mean',0):.1f}ms |",
              f"| 📈 Regressions | {'✅' if reg_pass else '❌'} | "
              f"{len(regressions)} regression(s) detected |",
              f"",
              f"## ⚡ Endpoint Latency",
              f"",
              f"| Endpoint | Group | Mean | p50 | p95 | p99 | Apdex | SLO | Status |",
              f"|----------|-------|------|-----|-----|-----|-------|-----|--------|",
          ]

          for ep in sorted(endpoint_metrics,
                           key=lambda e: e.get("timing",{}).get("mean_ms",0)):
              t   = ep.get("timing",{})
              pct = ep.get("percentiles",{})
              thr = ep.get("threshold",{})
              q   = ep.get("quality",{})
              icon = "✅" if thr.get("passed") else "❌"
              md.append(
                  f"| `{ep.get('endpoint','—')}` "
                  f"| `{ep.get('group','—')}` "
                  f"| `{t.get('mean_ms','—')}ms` "
                  f"| `{pct.get('p50_ms','—')}ms` "
                  f"| `{pct.get('p95_ms','—')}ms` "
                  f"| `{pct.get('p99_ms','—')}ms` "
                  f"| `{q.get('apdex','—')}` "
                  f"| `{thr.get('threshold_ms','—')}ms` "
                  f"| {icon} |"
              )

          if load_results:
              md += [
                  f"",
                  f"## 💪 Load Test Results",
                  f"",
                  f"| Scenario | Users | RPS | Error% | p95 | p99 | Status |",
                  f"|----------|-------|-----|--------|-----|-----|--------|",
              ]
              for lr in load_results:
                  icon = "✅" if lr.get("thresholds",{}).get("overall_pass") else "❌"
                  lat  = lr.get("latency",{})
                  reqs = lr.get("requests",{})
                  md.append(
                      f"| `{lr.get('scenario','—')}` "
                      f"| `{lr.get('users','—')}` "
                      f"| `{reqs.get('rps','—')}` "
                      f"| `{reqs.get('error_rate_pct','—')}%` "
                      f"| `{lat.get('p95_ms','—')}ms` "
                      f"| `{lat.get('p99_ms','—')}ms` "
                      f"| {icon} |"
                  )

          if regressions:
              md += [
                  f"",
                  f"## ⚠️ Performance Regressions Detected",
                  f"",
                  f"| Endpoint | Baseline p95 | Current p95 | Change |",
                  f"|----------|-------------|-------------|--------|",
              ]
              for r in regressions:
                  md.append(
                      f"| `{r['endpoint']}` "
                      f"| `{r['baseline_p95_ms']}ms` "
                      f"| `{r['current_p95_ms']}ms` "
                      f"| `+{r['change_pct']}%` ⚠️ |"
                  )

          md += ["","---","*Generated by ASH v5.0 OMEGA API Benchmark*"]
          report_content = "\n".join(md)

          with open(f"{reports}/api-report.md","w") as f:
              f.write(report_content)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"w") as f:
              f.write(report_content)

          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"overall_pass={'true' if overall else 'false'}\n")
              out.write(f"regression_count={len(regressions)}\n")
              out.write(f"ep_failed={ep_summary.get('failed',0)}\n")

          print(f"\n  {status}")
          print(f"  Endpoints: {ep_summary.get('passed',0)}/{ep_summary.get('total',0)} passed")
          print(f"  Load:      {'✅' if load_pass else '❌'}")
          print(f"  WebSocket: {'✅' if ws_pass else '❌'}")
          print(f"  Regressions: {len(regressions)}")
          PYTHON_EOF

      - name: "📈 API performance comparison heatmap"
        run: |
          python3 << PYTHON_EOF
          import json
          import glob
          import sys

          try:
              import matplotlib
              matplotlib.use('Agg')
              import matplotlib.pyplot as plt
              import matplotlib.colors as mcolors
              import numpy as np
          except ImportError:
              sys.exit(0)

          # Load endpoint metrics
          metrics = []
          for f in glob.glob("${BENCH_DIR}/collected/**/metrics.json", recursive=True):
              try:
                  with open(f) as fp: metrics.append(json.load(fp))
              except Exception: pass

          if len(metrics) < 2:
              print("  ⚠️ Not enough data for heatmap")
              sys.exit(0)

          palette = {
              "bg":      "#1e1e2e",
              "surface": "#313244",
              "surface2":"#585b70",
              "text":    "#cdd6f4",
              "subtext": "#a6adc8",
              "green":   "#a6e3a1",
              "red":     "#f38ba8",
              "blue":    "#89b4fa",
              "mauve":   "#cba6f7",
              "peach":   "#fab387",
              "yellow":  "#f9e2af",
          }

          # Sort by group then name
          metrics.sort(key=lambda m: (m.get("group",""), m.get("endpoint","")))

          names     = [m["endpoint"] for m in metrics]
          groups    = [m.get("group","?") for m in metrics]
          means     = [m["timing"]["mean_ms"] for m in metrics]
          p95s      = [m["percentiles"]["p95_ms"] for m in metrics]
          p99s      = [m["percentiles"]["p99_ms"] for m in metrics]
          cvs       = [m["timing"]["cv_percent"] for m in metrics]
          apdexes   = [m["quality"]["apdex"] for m in metrics]
          thresholds= [m["threshold"]["threshold_ms"] for m in metrics]
          passed    = [m["threshold"]["passed"] for m in metrics]

          fig, axes = plt.subplots(1, 2, figsize=(22, max(6, len(names) * 0.45 + 3)))
          fig.patch.set_facecolor(palette["bg"])

          # ── Left: Grouped bar chart ───────────────────────────────────
          ax1 = axes[0]
          ax1.set_facecolor(palette["surface"])
          for sp in ax1.spines.values():
              sp.set_edgecolor(palette["surface2"])
              sp.set_alpha(0.4)
          ax1.tick_params(colors=palette["text"], labelsize=8)
          ax1.grid(True, alpha=0.08, color=palette["text"],
                   axis="x", zorder=1)

          y    = np.arange(len(names))
          h    = 0.28
          bars_mean = ax1.barh(y + h, means, h,
                               color=[palette["blue"] if p else palette["red"]
                                      for p in passed],
                               alpha=0.82, zorder=3, label="Mean",
                               edgecolor=palette["bg"], linewidth=0.8)
          bars_p95  = ax1.barh(y, p95s, h,
                               color=palette["peach"], alpha=0.72,
                               zorder=3, label="p95",
                               edgecolor=palette["bg"], linewidth=0.8)
          bars_p99  = ax1.barh(y - h, p99s, h,
                               color=palette["mauve"], alpha=0.62,
                               zorder=3, label="p99",
                               edgecolor=palette["bg"], linewidth=0.8)

          # Threshold markers
          for i, (thr, p) in enumerate(zip(thresholds, passed)):
              ax1.axvline(thr, color=palette["red"] if not p else palette["yellow"],
                          linewidth=0.6, alpha=0.4, zorder=2)

          ax1.set_yticks(y)
          ax1.set_yticklabels(
              [f"{'✅' if p else '❌'} {n}" for n, p in zip(names, passed)],
              color=palette["text"], fontsize=7.5
          )
          ax1.set_xlabel("Latency (ms)", color=palette["text"], fontsize=10)
          ax1.set_title("Endpoint Latency Overview",
                        color=palette["text"], fontsize=12, fontweight="bold", pad=12)
          ax1.legend(facecolor=palette["bg"], labelcolor=palette["text"],
                     fontsize=8.5, framealpha=0.9)

          # ── Right: Apdex heatmap ──────────────────────────────────────
          ax2 = axes[1]
          ax2.set_facecolor(palette["surface"])
          ax2.tick_params(colors=palette["text"], labelsize=8)
          for sp in ax2.spines.values():
              sp.set_edgecolor(palette["surface2"])
              sp.set_alpha(0.4)

          # Custom colormap: red → yellow → green
          cmap = mcolors.LinearSegmentedColormap.from_list(
              "apdex",
              [(0.0, "#f38ba8"), (0.5, "#f9e2af"),
               (0.85, "#94e2d5"), (1.0, "#a6e3a1")]
          )

          apdex_arr = np.array(apdexes).reshape(-1, 1)
          im = ax2.imshow(apdex_arr, cmap=cmap, aspect="auto",
                          vmin=0, vmax=1.0,
                          extent=[-0.5, 0.5, len(names)-0.5, -0.5])

          for i, (apdex, name) in enumerate(zip(apdexes, names)):
              text_color = palette["bg"] if apdex > 0.5 else palette["text"]
              ax2.text(0, i, f"{apdex:.3f}",
                       ha="center", va="center",
                       color=text_color,
                       fontsize=8.5, fontweight="bold")

          ax2.set_yticks(range(len(names)))
          ax2.set_yticklabels(
              [f"{g}/{n[:18]}" for g, n in zip(groups, names)],
              color=palette["text"], fontsize=7.5
          )
          ax2.set_xticks([])
          ax2.set_title("Apdex Score Heatmap",
                        color=palette["text"], fontsize=12, fontweight="bold", pad=12)

          cbar = plt.colorbar(im, ax=ax2, shrink=0.8, pad=0.02)
          cbar.ax.tick_params(colors=palette["text"], labelsize=8)
          cbar.set_label("Apdex Score", color=palette["text"], fontsize=9)
          for label in cbar.ax.get_yticklabels():
              label.set_color(palette["text"])

          # Zone lines
          for threshold_val, label_text in [(0.70,"Fair"), (0.85,"Good"), (0.94,"Excellent")]:
              ax2.axhline(
                  -0.5 + threshold_val * len(names),
                  color=palette["surface2"], linewidth=0.8, alpha=0.4
              )

          fig.suptitle(
              f"🌐 ASH API Benchmark Overview  ·  {len(names)} endpoints\n"
              f"SHA {git_sha[:8]}  ·  "
              f"{sum(passed)}/{len(passed)} passed",
              color=palette["text"],
              fontsize=13,
              fontweight="bold",
              y=1.01
          )
          plt.tight_layout()
          plt.savefig("${REPORTS_DIR}/api-overview-chart.png",
                      dpi=155, bbox_inches="tight",
                      facecolor=palette["bg"])
          plt.close()
          print("  📈 API overview heatmap saved")
          PYTHON_EOF
          git_sha="${GITHUB_SHA}"

      - name: "💬 Post PR comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let content = '';
            try {
              content = fs.readFileSync(
                '${{ env.REPORTS_DIR }}/api-report.md', 'utf8'
              );
            } catch(e) {
              content = '> API benchmark report unavailable.';
            }

            const overallPass   = '${{ steps.consolidate.outputs.overall_pass }}' === 'true';
            const regressions   = parseInt('${{ steps.consolidate.outputs.regression_count }}' || '0');
            const epFailed      = parseInt('${{ steps.consolidate.outputs.ep_failed }}' || '0');

            const statusLine = overallPass
              ? '✅ All API benchmarks passed'
              : `❌ ${epFailed} endpoint(s) failed SLO` +
                (regressions > 0 ? `, ${regressions} regression(s)` : '');

            const body = [
              `## 🌐 REST API Benchmark Results`,
              ``,
              statusLine,
              ``,
              regressions > 0
                ? `> ⚠️ **${regressions} performance regression(s)** detected vs baseline`
                : '',
              ``,
              `<details>`,
              `<summary>📊 Full API Benchmark Report (click to expand)</summary>`,
              ``,
              content,
              ``,
              `</details>`,
            ].filter(l => l !== undefined).join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('REST API Benchmark Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log('✅ Updated existing PR comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log('✅ Created new PR comment');
            }

      - name: "💾 Save as new baseline"
        if: |
          github.ref == 'refs/heads/main' &&
          steps.consolidate.outputs.overall_pass == 'true'
        run: |
          mkdir -p "${BASELINE_DIR}"
          cp "${REPORTS_DIR}/api-consolidated.json" \
             "${BASELINE_DIR}/api-baseline.json"
          echo "  ✅ Baseline updated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: "💾 Cache new baseline"
        if: |
          github.ref == 'refs/heads/main' &&
          steps.consolidate.outputs.overall_pass == 'true'
        uses: actions/cache/save@v4
        with:
          path: "${{ env.BASELINE_DIR }}"
          key: "bench-baseline-api-main"

      - name: "📤 Upload final report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "api-report-final-${{ needs.api-server.outputs.bench_id }}"
          path: |
            ${{ env.REPORTS_DIR }}/
          retention-days: 90
          compression-level: 9

      - name: "🚨 Notify on regressions"
        if: steps.consolidate.outputs.regression_count != '0'
        uses: ./.github/actions/notify-discord
        continue-on-error: true
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_BENCHMARK }}
          message: |
            ⚠️ **API Performance Regression** on `${{ github.ref }}`
            ${{ steps.consolidate.outputs.regression_count }} endpoint(s) regressed
            SHA: `${{ github.sha }}`
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: "❌ Final gate"
        if: steps.consolidate.outputs.overall_pass == 'false'
        run: |
          EP_FAILED="${{ steps.consolidate.outputs.ep_failed }}"
          REGRESSIONS="${{ steps.consolidate.outputs.regression_count }}"
          echo "::error title=API Benchmark Failed::"
          echo "  ${EP_FAILED} endpoint(s) exceeded SLO"
          echo "  ${REGRESSIONS} regression(s) detected"
          exit 1