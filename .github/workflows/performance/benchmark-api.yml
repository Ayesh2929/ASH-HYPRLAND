          # ── WebSocket ──────────────────────────────────────────────────
          @app.websocket("/ws/events")
          async def ws_events(websocket: WebSocket):
              """Real-time event stream via WebSocket."""
              await websocket.accept()
              WS_CONNECTIONS.append(websocket)
              try:
                  await websocket.send_json({
                      "type": "connected",
                      "message": "ASH WebSocket v5.0",
                      "timestamp": datetime.now(timezone.utc).isoformat(),
                      "session_id": str(uuid.uuid4())[:8],
                  })
                  while True:
                      data = await asyncio.wait_for(
                          websocket.receive_json(), timeout=30.0
                      )
                      msg_type = data.get("type", "ping")
                      if msg_type == "ping":
                          await websocket.send_json({
                              "type": "pong",
                              "timestamp": datetime.now(timezone.utc).isoformat(),
                              "server_time_ms": round((time.time() - START_TIME) * 1000, 2),
                          })
                      elif msg_type == "subscribe":
                          channel = data.get("channel", "all")
                          await websocket.send_json({
                              "type": "subscribed",
                              "channel": channel,
                              "timestamp": datetime.now(timezone.utc).isoformat(),
                          })
                      elif msg_type == "theme_change":
                          await websocket.send_json({
                              "type": "theme_changed",
                              "theme": data.get("theme", "unknown"),
                              "timestamp": datetime.now(timezone.utc).isoformat(),
                          })
                      else:
                          await websocket.send_json({
                              "type": "ack",
                              "original_type": msg_type,
                              "timestamp": datetime.now(timezone.utc).isoformat(),
                          })
              except (WebSocketDisconnect, asyncio.TimeoutError):
                  pass
              finally:
                  if websocket in WS_CONNECTIONS:
                      WS_CONNECTIONS.remove(websocket)

          @app.websocket("/ws/live-reload")
          async def ws_live_reload(websocket: WebSocket):
              """Live reload notification stream."""
              await websocket.accept()
              WS_CONNECTIONS.append(websocket)
              try:
                  while True:
                      await asyncio.sleep(5)
                      await websocket.send_json({
                          "type": "heartbeat",
                          "timestamp": datetime.now(timezone.utc).isoformat(),
                      })
              except WebSocketDisconnect:
                  pass
              finally:
                  if websocket in WS_CONNECTIONS:
                      WS_CONNECTIONS.remove(websocket)

