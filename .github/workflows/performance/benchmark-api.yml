          @app.post("/api/v1/themes/apply", response_model=ThemeApplyResponse, tags=["themes"])
          async def themes_apply(
              request: ThemeApplyRequest,
              background_tasks: BackgroundTasks,
              user: str = Depends(_get_current_user),
          ):
              """Apply a theme to the desktop."""
              if request.theme_name not in THEMES_DB:
                  raise HTTPException(status_code=404, detail="Theme not found")
              start = time.perf_counter()
              if not request.dry_run:
                  # Simulate hot-reload propagation
                  targets = request.targets if request.targets != ["all"] else [
                      "hyprland", "waybar", "kitty", "dunst", "gtk", "nvim"
                  ]
                  await asyncio.sleep(0.050 * len(targets) / 6)
              elapsed_ms = (time.perf_counter() - start) * 1000
              return ThemeApplyResponse(
                  success=True,
                  theme=request.theme_name,
                  applied_targets=request.targets,
                  duration_ms=round(elapsed_ms, 2),
                  timestamp=datetime.now(timezone.utc).isoformat(),
              )

