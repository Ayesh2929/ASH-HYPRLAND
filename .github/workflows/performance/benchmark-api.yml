          )
          ax2.legend(facecolor=palette["bg"], labelcolor=palette["text"],
                     fontsize=8.5, framealpha=0.9)

          # ── Summary stats ─────────────────────────────────────────────
          ax3 = axes[2]
          ax3.set_facecolor(palette["surface"])
          ax3.axis("off")

          mps      = data["throughput"]["messages_per_second"]
          mps_pass = data["throughput"]["passed"]
          mps_thr  = data["throughput"]["threshold_mps"]
          conc_ms  = data["concurrent"]["total_ms"]

          rows = [
              ("🔌 Connect mean",   f"{conn_stat['mean']:.2f}ms"),
              ("🔌 Connect p95",    f"{conn_stat['p95']:.2f}ms"),
              ("🎯 Connect SLO",    f"{conn_stat['threshold_ms']:.0f}ms"),
              ("🔌 Connect pass",   "✅" if conn_stat["passed"] else "❌"),
              ("─" * 22,           "─" * 10),
              ("🏓 RTT mean",       f"{rtt_stat['mean']:.2f}ms"),
              ("🏓 RTT p95",        f"{rtt_stat['p95']:.2f}ms"),
              ("🎯 RTT SLO",        f"{rtt_stat['threshold_ms']:.0f}ms"),
              ("🏓 RTT pass",       "✅" if rtt_stat["passed"] else "❌"),
              ("─" * 22,           "─" * 10),
              ("🚀 Throughput",     f"{mps:.1f} msg/s"),
              ("🎯 MPS threshold",  f"{mps_thr:.0f} msg/s"),
              ("🚀 Throughput pass","✅" if mps_pass else "❌"),
              ("─" * 22,           "─" * 10),
              ("🌊 10 concurrent",  f"{conc_ms:.1f}ms"),
              ("🏆 Overall",        "✅ PASS" if passed else "❌ FAIL"),
          ]

          y_pos = 0.97
          row_h = 1.0 / (len(rows) + 1)
          for label, value in rows:
              if label.startswith("─"):
                  ax3.axhline(y_pos - row_h * 0.2,
                              xmin=0.02, xmax=0.98,
                              color=palette["surface2"],
                              linewidth=0.8, alpha=0.6,
                              transform=ax3.transAxes)
                  y_pos -= row_h * 0.6
                  continue

              val_color = palette["text"]
              if "pass" in label.lower() or "Overall" in label:
                  val_color = palette["green"] if "✅" in value else palette["red"]

              ax3.text(0.03, y_pos, label, transform=ax3.transAxes,
                       color=palette["subtext"], fontsize=9, va="top")
              ax3.text(0.97, y_pos, value, transform=ax3.transAxes,
                       color=val_color, fontsize=9,
                       fontweight="bold", ha="right", va="top")
              y_pos -= row_h

          ax3.set_title("WebSocket Summary", color=palette["text"],
                        fontsize=11, fontweight="bold", pad=10)

          fig.suptitle(
              f"📡 ASH WebSocket Latency Benchmark\n"
              f"{'✅ PASSED' if passed else '❌ FAILED'}  ·  "
              f"connect={conn_stat['mean']:.1f}ms  ·  "
              f"rtt={rtt_stat['mean']:.1f}ms  ·  "
              f"throughput={mps:.0f}msg/s",
              color=palette["text"],
              fontsize=12.5,
              fontweight="bold",
              y=1.02
          )

          plt.tight_layout()
          plt.savefig("${WS_DIR}/websocket-chart.png",
                      dpi=155, bbox_inches="tight",
                      facecolor=palette["bg"])
          plt.close()
          print(f"  📈 WebSocket chart saved")
          PYTHON_EOF

      - name: "📤 Upload WebSocket artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
