          ax1.set_xlabel("Connection #", color=palette["text"], fontsize=9.5)
          ax1.set_ylabel("Connect Time (ms)", color=palette["text"], fontsize=9.5)
          ax1.set_title(
              f"🔌 Connect Latency\n"
              f"{'✅' if conn_stat['passed'] else '❌'} mean={conn_stat['mean']:.1f}ms",
              color=palette["text"], fontsize=11, fontweight="bold", pad=10
          )
          ax1.legend(facecolor=palette["bg"], labelcolor=palette["text"],
                     fontsize=8.5, framealpha=0.9)

          # ── RTT time series ───────────────────────────────────────────
          ax2 = axes[1]
          style(ax2)
          rtt_times = data["raw"].get("rtt_times_ms", [])
          rtt_stat  = data["ping_pong_rtt"]
          if rtt_times:
              x = np.arange(1, len(rtt_times)+1)
              ax2.fill_between(x, rtt_times, rtt_stat["mean"],
                               alpha=0.12, color=palette["teal"])
              ax2.plot(x, rtt_times, color=palette["teal"],
                       linewidth=1.5, zorder=3)
              ax2.scatter(x, rtt_times, color=palette["teal"],
                          s=20, alpha=0.7, zorder=4)
              ax2.axhline(rtt_stat["mean"], color=palette["mauve"],
                          linewidth=1.8, linestyle="--", zorder=4,
                          label=f"Mean: {rtt_stat['mean']:.1f}ms")
              ax2.axhline(rtt_stat["threshold_ms"], color=palette["red"],
                          linewidth=1.5, linestyle="-", alpha=0.6, zorder=4,
                          label=f"SLO: {rtt_stat['threshold_ms']:.0f}ms")
          ax2.set_xlabel("Message #", color=palette["text"], fontsize=9.5)
          ax2.set_ylabel("RTT (ms)", color=palette["text"], fontsize=9.5)
          ax2.set_title(
              f"🏓 Ping-Pong RTT\n"
              f"{'✅' if rtt_stat['passed'] else '❌'} mean={rtt_stat['mean']:.1f}ms",
