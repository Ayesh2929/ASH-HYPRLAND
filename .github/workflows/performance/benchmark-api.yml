          # ── Theme endpoints ────────────────────────────────────────────
          @app.get("/api/v1/themes", tags=["themes"])
          async def themes_list(
              category: Optional[str] = None,
              search: Optional[str] = None,
              page: int = Query(default=1, ge=1),
              limit: int = Query(default=20, ge=1, le=100),
              sort: str = "name",
              user: str = Depends(_get_current_user),
          ):
              """List all available themes with filtering and pagination."""
              themes = list(THEMES_DB.values())
              if category:
                  themes = [t for t in themes if t.metadata.category == category]
              if search:
                  sl = search.lower()
                  themes = [t for t in themes if sl in t.metadata.name.lower()
                             or sl in t.metadata.description.lower()]
              if sort == "downloads":
                  themes.sort(key=lambda t: t.metadata.downloads, reverse=True)
              elif sort == "stars":
                  themes.sort(key=lambda t: t.metadata.stars, reverse=True)
              else:
                  themes.sort(key=lambda t: t.metadata.name)
              total = len(themes)
              start = (page - 1) * limit
              paginated = themes[start:start + limit]
              return {
                  "themes": [t.model_dump() for t in paginated],
                  "pagination": {
                      "page": page, "limit": limit,
                      "total": total, "pages": (total + limit - 1) // limit,
                  },
                  "meta": {"categories": CATEGORIES, "total_all": len(THEMES_DB)},
              }

