          ):
              """Get theme color palette in requested format."""
              if theme_name not in THEMES_DB:
                  raise HTTPException(status_code=404, detail="Theme not found")
              colors = THEMES_DB[theme_name].colors.model_dump()
              if format == "rgb":
                  def hex_to_rgb(h):
                      h = h.lstrip("#")
                      return {"r": int(h[0:2],16), "g": int(h[2:4],16), "b": int(h[4:6],16)}
                  colors = {k: hex_to_rgb(v) for k, v in colors.items()}
              return {"format": format, "colors": colors, "theme": theme_name}

