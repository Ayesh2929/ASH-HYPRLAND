name: "🌐 Benchmark · REST API Performance"

on:
  push:
    branches: [main, develop, "release/*"]
    paths:
      - "api/**"
      - "api/server.py"
      - "api/routes.py"
      - "api/models.py"
      - "api/auth.py"
      - "api/websocket.py"
      - "api/endpoints/**"
      - ".github/workflows/performance/benchmark-api.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "api/**"
      - ".github/workflows/performance/benchmark-api.yml"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Load test duration (seconds)"
        required: false
        default: "30"
        type: string
      concurrent_users:
        description: "Concurrent virtual users"
        required: false
        default: "50"
        type: string
      rps_target:
        description: "Target requests per second"
        required: false
        default: "100"
        type: string
      endpoint_filter:
        description: "Endpoint filter (all|theme|plugin|snapshot|auth|ws)"
        required: false
        default: "all"
        type: string
      regression_threshold:
        description: "Latency regression threshold %"
        required: false
        default: "15"
        type: string
      enable_spike_test:
        description: "Enable spike load test"
        required: false
        default: true
        type: boolean
      enable_soak_test:
        description: "Enable soak test (extended duration)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 3 * * *"     # Nightly 03:00 UTC

# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: "bench-api-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write
  actions: read

# ─────────────────────────────────────────────────────────────────────────────
env:
  BENCHMARK_VERSION: "5.0.0"
  BENCH_DIR: "${{ github.workspace }}/bench-api"
  BASELINE_DIR: "${{ github.workspace }}/baseline-api"
  REPORTS_DIR: "${{ github.workspace }}/reports-api"
  API_HOST: "localhost"
  API_PORT: "8765"
  API_BASE_URL: "http://localhost:8765"
  WS_BASE_URL: "ws://localhost:8765"
  API_VERSION: "v1"

  # ── Benchmark inputs ──────────────────────────────────────────────────────
  DURATION_SECONDS: "${{ github.event.inputs.duration_seconds || '30' }}"
  CONCURRENT_USERS: "${{ github.event.inputs.concurrent_users || '50' }}"
  RPS_TARGET: "${{ github.event.inputs.rps_target || '100' }}"
  ENDPOINT_FILTER: "${{ github.event.inputs.endpoint_filter || 'all' }}"
  REGRESSION_THRESHOLD: "${{ github.event.inputs.regression_threshold || '15' }}"
  ENABLE_SPIKE_TEST: "${{ github.event.inputs.enable_spike_test || 'true' }}"
  ENABLE_SOAK_TEST: "${{ github.event.inputs.enable_soak_test || 'false' }}"

  # ── Latency thresholds (ms) ───────────────────────────────────────────────
  THRESHOLD_P50_MS: "50"
  THRESHOLD_P90_MS: "100"
  THRESHOLD_P95_MS: "200"
  THRESHOLD_P99_MS: "500"

  # ── Throughput thresholds ─────────────────────────────────────────────────
  THRESHOLD_MIN_RPS: "50"
  THRESHOLD_MIN_RPS_LOAD: "30"

  # ── Error rate thresholds ─────────────────────────────────────────────────
  THRESHOLD_MAX_ERROR_RATE_PCT: "1.0"
  THRESHOLD_MAX_ERROR_RATE_LOAD_PCT: "5.0"

  # ── Endpoint-specific thresholds (ms) ────────────────────────────────────
  THRESHOLD_THEME_LIST_MS: "100"
  THRESHOLD_THEME_GET_MS: "80"
  THRESHOLD_THEME_APPLY_MS: "500"
  THRESHOLD_PLUGIN_LIST_MS: "100"
  THRESHOLD_PLUGIN_INSTALL_MS: "2000"
  THRESHOLD_SNAPSHOT_CREATE_MS: "1000"
  THRESHOLD_SNAPSHOT_LIST_MS: "150"
  THRESHOLD_CONFIG_GET_MS: "50"
  THRESHOLD_CONFIG_SET_MS: "100"
  THRESHOLD_AUTH_TOKEN_MS: "200"
  THRESHOLD_HEALTH_MS: "20"
  THRESHOLD_WS_CONNECT_MS: "100"
  THRESHOLD_WS_MESSAGE_MS: "50"

# ═════════════════════════════════════════════════════════════════════════════
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Spin up API server
  # ───────────────────────────────────────────────────────────────────────────
  api-server:
    name: "🚀 Server · Launch ASH API"
    runs-on: ubuntu-24.04
    outputs:
      bench_id: ${{ steps.id.outputs.bench_id }}
      server_ready: ${{ steps.health.outputs.ready }}
      api_version: ${{ steps.version.outputs.version }}
      has_baseline: ${{ steps.baseline_check.outputs.has_baseline }}

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🆔 Generate benchmark ID"
        id: id
        run: |
          BENCH_ID="api-$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::8}"
          echo "bench_id=${BENCH_ID}" >> "$GITHUB_OUTPUT"
          echo "::notice title=API Benchmark ID::${BENCH_ID}"

      - name: "🐍 Setup Python environment"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "📦 Install API dependencies"
        run: |
          set -euo pipefail

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  📦 Installing ASH API dependencies"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Core API framework
          pip install --quiet --upgrade \
            fastapi==0.115.0 \
            uvicorn[standard]==0.32.0 \
            websockets==13.1 \
            pydantic==2.9.2 \
            python-jose[cryptography]==3.3.0 \
            passlib[bcrypt]==1.7.4 \
            python-multipart==0.0.12 \
            httpx==0.27.2 \
            aiofiles==24.1.0 \
            orjson==3.10.10 \
            redis==5.1.1 \
            sqlalchemy==2.0.36 \
            aiosqlite==0.20.0 \
            prometheus-client==0.21.0 \
            opentelemetry-sdk==1.27.0

          # Benchmark & load testing tools
          pip install --quiet \
            locust==2.32.0 \
            pytest==8.3.3 \
            pytest-asyncio==0.24.0 \
            pytest-benchmark==4.0.0 \
            httpx==0.27.2 \
            aiohttp==3.11.2 \
            websockets==13.1 \
            rich==13.9.2 \
            matplotlib==3.9.2 \
            pandas==2.2.3 \
            numpy==2.1.2 \
            scipy==1.14.1 \
            jinja2==3.1.4 \
            tabulate==0.9.0 \
            colorama==0.4.6 \
            psutil==6.1.0 \
            memory-profiler==0.61.0

          echo ""
          echo "  ✅ FastAPI:   $(python3 -c 'import fastapi; print(fastapi.__version__)')"
          echo "  ✅ Uvicorn:   $(python3 -c 'import uvicorn; print(uvicorn.__version__)')"
          echo "  ✅ Locust:    $(python3 -c 'import locust; print(locust.__version__)')"
          echo "  ✅ Pydantic:  $(python3 -c 'import pydantic; print(pydantic.__version__)')"

      - name: "🏗️ Bootstrap ASH API server"
        run: |
          set -euo pipefail

          mkdir -p \
            api/endpoints \
            api/schemas \
            api/middleware \
            api/services \
            api/models_db \
            "${BENCH_DIR}" \
            "${REPORTS_DIR}"

          # ── Main API server ─────────────────────────────────────────────
          cat > api/server.py << 'SERVER_EOF'
          """
          ASH Dotfiles v5.0 OMEGA — REST API Server
          ==========================================
          Full-featured FastAPI application with:
          • JWT authentication
          • Rate limiting
          • WebSocket support
          • OpenAPI/Swagger docs
          • Prometheus metrics
          • Structured logging
          • Response caching
          • CORS support
          """

          import asyncio
          import hashlib
          import json
          import os
          import random
          import time
          import uuid
          from contextlib import asynccontextmanager
          from datetime import datetime, timedelta, timezone
          from typing import Any, Dict, List, Optional, Union

          import uvicorn
          from fastapi import (
              BackgroundTasks, Depends, FastAPI, HTTPException,
              Query, Request, Response, WebSocket, WebSocketDisconnect,
              status,
          )
          from fastapi.middleware.cors import CORSMiddleware
          from fastapi.middleware.gzip import GZipMiddleware
          from fastapi.responses import JSONResponse, StreamingResponse
          from fastapi.security import HTTPAuthorizationCredentials, HTTPBearer
          from pydantic import BaseModel, Field, field_validator

          # ── Pydantic models ─────────────────────────────────────────────
          class ColorPalette(BaseModel):
              base: str = "#1e1e2e"
              mantle: str = "#181825"
              crust: str = "#11111b"
              text: str = "#cdd6f4"
              subtext: str = "#a6adc8"
              overlay: str = "#6c7086"
              surface: str = "#313244"
              blue: str = "#89b4fa"
              lavender: str = "#b4befe"
              sapphire: str = "#74c7ec"
              sky: str = "#89dceb"
              teal: str = "#94e2d5"
              green: str = "#a6e3a1"
              yellow: str = "#f9e2af"
              peach: str = "#fab387"
              maroon: str = "#eba0ac"
              red: str = "#f38ba8"
              mauve: str = "#cba6f7"
              pink: str = "#f5c2e7"
              flamingo: str = "#f2cdcd"
              rosewater: str = "#f5e0dc"
              accent: str = "#cba6f7"

          class ThemeMetadata(BaseModel):
              id: str = Field(default_factory=lambda: str(uuid.uuid4()))
              name: str
              description: str = ""
              category: str = "dark"
              author: str = "unknown"
              version: str = "1.0.0"
              tags: List[str] = []
              downloads: int = 0
              stars: int = 0
              created_at: str = Field(
                  default_factory=lambda: datetime.now(timezone.utc).isoformat()
              )
              updated_at: str = Field(
                  default_factory=lambda: datetime.now(timezone.utc).isoformat()
              )

          class Theme(BaseModel):
              metadata: ThemeMetadata
              colors: ColorPalette = ColorPalette()
              wallpaper: Optional[str] = None
              preview_url: Optional[str] = None

          class ThemeApplyRequest(BaseModel):
              theme_name: str
              targets: List[str] = ["all"]
              transition: str = "fade"
              duration_ms: int = Field(default=300, ge=0, le=2000)
              dry_run: bool = False

          class ThemeApplyResponse(BaseModel):
              success: bool
              theme: str
              applied_targets: List[str]
              duration_ms: float
              timestamp: str

          class PluginMetadata(BaseModel):
              id: str = Field(default_factory=lambda: str(uuid.uuid4()))
              name: str
              description: str = ""
              version: str = "1.0.0"
              author: str = "unknown"
              category: str = "core"
              enabled: bool = True
              installed: bool = False
              size_kb: int = 0
              dependencies: List[str] = []
              tags: List[str] = []

          class SnapshotMetadata(BaseModel):
              id: str = Field(default_factory=lambda: str(uuid.uuid4()))
              name: str
              description: str = ""
              theme: str = "catppuccin-mocha"
              mode: str = "default"
              created_at: str = Field(
                  default_factory=lambda: datetime.now(timezone.utc).isoformat()
              )
              size_kb: int = 0
              pinned: bool = False
              tags: List[str] = []

          class ConfigItem(BaseModel):
              key: str
              value: Any
              type: str = "string"
              description: str = ""
              readonly: bool = False

          class AuthRequest(BaseModel):
              username: str
              password: str

          class AuthResponse(BaseModel):
              access_token: str
              token_type: str = "bearer"
              expires_in: int = 3600
              scope: str = "full"

          class APIResponse(BaseModel):
              success: bool = True
              data: Any = None
              meta: Dict[str, Any] = {}
              timestamp: str = Field(
                  default_factory=lambda: datetime.now(timezone.utc).isoformat()
              )

          class HealthResponse(BaseModel):
              status: str = "healthy"
              version: str = "5.0.0"
              uptime_seconds: float = 0
              checks: Dict[str, str] = {}
              timestamp: str = Field(
                  default_factory=lambda: datetime.now(timezone.utc).isoformat()
              )

          # ── In-memory store (benchmark mock) ───────────────────────────
          THEMES_DB: Dict[str, Theme] = {}
          PLUGINS_DB: Dict[str, PluginMetadata] = {}
          SNAPSHOTS_DB: Dict[str, SnapshotMetadata] = {}
          CONFIG_DB: Dict[str, ConfigItem] = {}
          RATE_LIMIT_STORE: Dict[str, List[float]] = {}
          WS_CONNECTIONS: List[WebSocket] = []
          START_TIME: float = time.time()
          REQUEST_COUNTER: int = 0
          ERROR_COUNTER: int = 0

          # ── Seed data ───────────────────────────────────────────────────
          THEME_NAMES = [
              "catppuccin-mocha", "catppuccin-macchiato", "catppuccin-latte",
              "tokyo-night", "tokyo-night-storm", "gruvbox-dark", "gruvbox-light",
              "nord", "dracula", "one-dark", "rose-pine", "rose-pine-dawn",
              "everforest-dark", "kanagawa-wave", "material-ocean",
              "cyberpunk-2077", "synthwave-84", "matrix-green",
              "forest-deep", "ocean-depth", "aurora-borealis",
              "vaporwave", "minimal-dark", "minimal-light",
          ]
          PLUGIN_NAMES = [
              "game-mode", "caffeine", "auto-wallpaper", "focus-timer",
              "weather-display", "pomodoro-plus", "discord-rpc", "spotify-control",
              "github-status", "blur-toggle", "night-light", "do-not-disturb",
          ]
          CATEGORIES = ["dark", "light", "neon", "nature", "space", "minimal"]
          MODES = ["default", "game", "work", "focus", "cinema", "battery"]

          def _seed():
              """Populate in-memory databases with realistic mock data."""
              for i, name in enumerate(THEME_NAMES):
                  THEMES_DB[name] = Theme(
                      metadata=ThemeMetadata(
                          name=name,
                          description=f"The {name.replace('-',' ').title()} theme for ASH",
                          category=CATEGORIES[i % len(CATEGORIES)],
                          author=f"ash-team" if i < 8 else f"community-{i}",
                          version=f"1.{i}.0",
                          tags=[CATEGORIES[i % len(CATEGORIES)], "popular" if i < 5 else ""],
                          downloads=random.randint(100, 50000),
                          stars=random.randint(10, 5000),
                      ),
                      colors=ColorPalette(),
                  )
              for i, name in enumerate(PLUGIN_NAMES):
                  PLUGINS_DB[name] = PluginMetadata(
                      name=name,
                      description=f"ASH {name.replace('-',' ').title()} plugin",
                      version=f"1.{i}.0",
                      category="core" if i < 6 else "integration",
                      enabled=i % 3 != 0,
                      installed=i < 8,
                      size_kb=random.randint(10, 500),
                      tags=["core" if i < 6 else "integration"],
                  )
              for i in range(20):
                  snap_id = str(uuid.uuid4())
                  SNAPSHOTS_DB[snap_id] = SnapshotMetadata(
                      id=snap_id,
                      name=f"snapshot-{i:03d}",
                      description=f"Auto snapshot #{i}",
                      theme=THEME_NAMES[i % len(THEME_NAMES)],
                      mode=MODES[i % len(MODES)],
                      size_kb=random.randint(50, 2000),
                      pinned=i < 3,
                  )
              CONFIG_DB.update({
                  "theme.name": ConfigItem(key="theme.name", value="catppuccin-mocha",
                                           type="string", description="Active theme"),
                  "theme.auto_apply": ConfigItem(key="theme.auto_apply", value=True,
                                                  type="boolean", description="Auto apply"),
                  "mode.current": ConfigItem(key="mode.current", value="default",
                                              type="string", description="Current mode"),
                  "bar.layout": ConfigItem(key="bar.layout", value="top-bar",
                                            type="string", description="Waybar layout"),
                  "animation.speed": ConfigItem(key="animation.speed", value=300,
                                                 type="integer", description="Animation speed ms"),
                  "wallpaper.slideshow": ConfigItem(key="wallpaper.slideshow", value=False,
                                                     type="boolean"),
                  "plugins.auto_update": ConfigItem(key="plugins.auto_update", value=True,
                                                     type="boolean"),
                  "analytics.enabled": ConfigItem(key="analytics.enabled", value=False,
                                                   type="boolean"),
              })

          # ── Middleware ──────────────────────────────────────────────────
          security = HTTPBearer(auto_error=False)
          SECRET_KEY = "ash-benchmark-secret-key-v5-omega"
          ALGORITHM = "HS256"

          def _create_token(username: str) -> str:
              """Create a simple JWT-like token for benchmarking."""
              payload = {
                  "sub": username,
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 3600,
                  "scope": "full",
              }
              token_data = json.dumps(payload)
              signature = hashlib.sha256(
                  f"{token_data}{SECRET_KEY}".encode()
              ).hexdigest()
              import base64
              token_b64 = base64.b64encode(token_data.encode()).decode()
              return f"{token_b64}.{signature}"

          def _verify_token(token: str) -> Optional[str]:
              """Verify token and return username."""
              try:
                  import base64
                  parts = token.split(".")
                  if len(parts) != 2:
                      return None
                  payload = json.loads(base64.b64decode(parts[0]))
                  if payload.get("exp", 0) < time.time():
                      return None
                  return payload.get("sub")
              except Exception:
                  return None

          async def _get_current_user(
              credentials: Optional[HTTPAuthorizationCredentials] = Depends(security)
          ) -> str:
              if credentials is None:
                  raise HTTPException(
                      status_code=status.HTTP_401_UNAUTHORIZED,
                      detail="Authentication required",
                      headers={"WWW-Authenticate": "Bearer"},
                  )
              username = _verify_token(credentials.credentials)
              if not username:
                  raise HTTPException(
                      status_code=status.HTTP_401_UNAUTHORIZED,
                      detail="Invalid or expired token",
                  )
              return username

          def _check_rate_limit(client_ip: str, limit: int = 1000, window: int = 60) -> bool:
              """Token bucket rate limiter."""
              now = time.time()
              if client_ip not in RATE_LIMIT_STORE:
                  RATE_LIMIT_STORE[client_ip] = []
              requests = RATE_LIMIT_STORE[client_ip]
              requests[:] = [r for r in requests if now - r < window]
              if len(requests) >= limit:
                  return False
              requests.append(now)
              return True

          # ── App lifespan ────────────────────────────────────────────────
          @asynccontextmanager
          async def lifespan(app: FastAPI):
              _seed()
              print(f"[ASH-API] Server started · {len(THEMES_DB)} themes · "
                    f"{len(PLUGINS_DB)} plugins · {len(SNAPSHOTS_DB)} snapshots")
              yield
              print("[ASH-API] Server shutting down")

          # ── FastAPI app ─────────────────────────────────────────────────
          app = FastAPI(
              title="ASH Dotfiles REST API",
              description="🎨 The ASH v5.0 OMEGA REST API — Theme Engine · Plugin System · Configuration",
              version="5.0.0",
              docs_url="/docs",
              redoc_url="/redoc",
              openapi_url="/openapi.json",
              lifespan=lifespan,
          )

          # Middleware stack
          app.add_middleware(
              CORSMiddleware,
              allow_origins=["*"],
              allow_credentials=True,
              allow_methods=["*"],
              allow_headers=["*"],
              expose_headers=["X-Request-ID", "X-Response-Time", "X-Rate-Limit-Remaining"],
          )
          app.add_middleware(GZipMiddleware, minimum_size=1024)

          @app.middleware("http")
          async def _timing_middleware(request: Request, call_next):
              global REQUEST_COUNTER, ERROR_COUNTER
              request_id = str(uuid.uuid4())[:8]
              start = time.perf_counter()
              REQUEST_COUNTER += 1
              client_ip = request.client.host if request.client else "unknown"
              if not _check_rate_limit(client_ip):
                  ERROR_COUNTER += 1
                  return JSONResponse(
                      status_code=429,
                      content={"detail": "Rate limit exceeded", "retry_after": 60},
                      headers={"Retry-After": "60", "X-Request-ID": request_id},
                  )
              try:
                  response = await call_next(request)
              except Exception:
                  ERROR_COUNTER += 1
                  raise
              elapsed_ms = (time.perf_counter() - start) * 1000
              response.headers["X-Request-ID"] = request_id
              response.headers["X-Response-Time"] = f"{elapsed_ms:.2f}ms"
              response.headers["X-Rate-Limit-Remaining"] = "999"
              return response

          # ─────────────────────────────────────────────────────────────
          # ENDPOINTS
          # ─────────────────────────────────────────────────────────────

          # ── Health & Meta ──────────────────────────────────────────────
          @app.get("/health", response_model=HealthResponse, tags=["meta"])
          async def health():
              """System health check — ultra-fast, no auth."""
              return HealthResponse(
                  status="healthy",
                  version="5.0.0",
                  uptime_seconds=round(time.time() - START_TIME, 2),
                  checks={
                      "database": "ok",
                      "cache": "ok",
