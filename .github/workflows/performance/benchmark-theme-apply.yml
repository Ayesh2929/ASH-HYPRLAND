# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ⚡ ASH DOTFILES v5.0 OMEGA — THEME APPLY BENCHMARK WORKFLOW                ║
# ║  Measures theme application performance across all targets                  ║
# ║  Tracks regressions, generates reports, posts PR comments                   ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: "⚡ Benchmark · Theme Apply Performance"

on:
  push:
    branches: [main, develop, "release/*"]
    paths:
      - "ash-cli/engines/color-engine/**"
      - "ash-cli/engines/hot-reload-engine/**"
      - "ash-cli/commands/theme/**"
      - "themes/**"
      - "scripts/theme/**"
      - ".github/workflows/performance/benchmark-theme-apply.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "ash-cli/engines/color-engine/**"
      - "ash-cli/engines/hot-reload-engine/**"
      - "ash-cli/commands/theme/**"
      - "themes/**"
      - "scripts/theme/**"
  workflow_dispatch:
    inputs:
      theme_count:
        description: "Number of themes to benchmark"
        required: false
        default: "10"
        type: string
      iterations:
        description: "Iterations per theme"
        required: false
        default: "5"
        type: string
      regression_threshold:
        description: "Regression threshold percentage"
        required: false
        default: "15"
        type: string
      upload_artifacts:
        description: "Upload benchmark artifacts"
        required: false
        default: true
        type: boolean
  schedule:
    # Nightly benchmark at 02:00 UTC
    - cron: "0 2 * * *"

# ─────────────────────────────────────────────────────────────────────────────
# Concurrency — cancel stale runs on same branch
# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: "bench-theme-apply-${{ github.ref }}"
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Permissions
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: read
  issues: write

# ─────────────────────────────────────────────────────────────────────────────
# Global environment
# ─────────────────────────────────────────────────────────────────────────────
env:
  BENCHMARK_VERSION: "5.0.0"
  BENCHMARK_DIR: "${{ github.workspace }}/benchmark-results"
  BASELINE_DIR: "${{ github.workspace }}/baseline-results"
  REPORTS_DIR: "${{ github.workspace }}/reports"
  THEME_COUNT: "${{ github.event.inputs.theme_count || '10' }}"
  ITERATIONS: "${{ github.event.inputs.iterations || '5' }}"
  REGRESSION_THRESHOLD: "${{ github.event.inputs.regression_threshold || '15' }}"
  ASH_BENCHMARK_MODE: "ci"
  ASH_NO_COLOR: "1"
  ASH_LOG_LEVEL: "warn"
  # Performance tuning
  BENCH_WARMUP_RUNS: "2"
  BENCH_COOLDOWN_MS: "500"
  BENCH_CPU_GOVERNOR: "performance"

# ═════════════════════════════════════════════════════════════════════════════
# JOBS
# ═════════════════════════════════════════════════════════════════════════════
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Pre-flight checks
  # ───────────────────────────────────────────────────────────────────────────
  preflight:
    name: "🔍 Pre-flight · Validate Environment"
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      theme_list: ${{ steps.themes.outputs.list }}
      baseline_exists: ${{ steps.baseline.outputs.exists }}
      runner_info: ${{ steps.runner.outputs.info }}
      bench_id: ${{ steps.id.outputs.bench_id }}

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: "🆔 Generate benchmark ID"
        id: id
        run: |
          BENCH_ID="bench-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}"
          echo "bench_id=${BENCH_ID}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Benchmark ID::${BENCH_ID}"

      - name: "🚦 Gate · Determine if benchmark should run"
        id: gate
        run: |
          SHOULD_RUN="true"

          # Skip if commit message contains [skip-bench] or [skip-ci]
          COMMIT_MSG=$(git log -1 --format="%s" 2>/dev/null || echo "")
          if echo "${COMMIT_MSG}" | grep -qE '\[(skip-bench|skip-ci|no-bench)\]'; then
            echo "::notice::Skipping benchmark — commit message opt-out detected"
            SHOULD_RUN="false"
          fi

          # Skip if only docs changed (for push events)
          if [[ "${{ github.event_name }}" == "push" ]]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            if echo "${CHANGED}" | grep -qvE '^(docs/|\.md$|\.txt$|assets/screenshots/)'; then
              : # Non-doc files changed, proceed
            else
              echo "::notice::Skipping benchmark — only documentation changed"
              SHOULD_RUN="false"
            fi
          fi

          echo "should_run=${SHOULD_RUN}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Gate Decision::should_run=${SHOULD_RUN}"

      - name: "🎨 Enumerate benchmark themes"
        id: themes
        if: steps.gate.outputs.should_run == 'true'
        run: |
          # Select diverse set of themes for benchmarking
          THEME_DIRS=(
            "themes/presets/dark/catppuccin-mocha"
            "themes/presets/dark/tokyo-night"
            "themes/presets/dark/gruvbox-dark"
            "themes/presets/dark/nord"
            "themes/presets/dark/dracula"
            "themes/presets/light/catppuccin-latte"
            "themes/presets/light/rose-pine-dawn"
            "themes/presets/neon/cyberpunk-2077"
            "themes/presets/nature/forest-deep"
            "themes/presets/minimal/pure-black"
          )

          # Respect THEME_COUNT input
          MAX_COUNT="${THEME_COUNT}"
          SELECTED=()
          for dir in "${THEME_DIRS[@]}"; do
            [[ -d "${dir}" ]] && SELECTED+=("${dir}")
            [[ "${#SELECTED[@]}" -ge "${MAX_COUNT}" ]] && break
          done

          # Emit as JSON array
          THEME_JSON=$(printf '%s\n' "${SELECTED[@]}" | jq -R . | jq -s -c .)
          echo "list=${THEME_JSON}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Themes Selected::${#SELECTED[@]} themes queued"

      - name: "📊 Check for baseline data"
        id: baseline
        if: steps.gate.outputs.should_run == 'true'
        run: |
          EXISTS="false"
          if gh api \
            "repos/${{ github.repository }}/actions/caches" \
            --jq '.actions_caches[].key' 2>/dev/null | \
            grep -q "bench-baseline-theme-apply"; then
            EXISTS="true"
          fi
          echo "exists=${EXISTS}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Baseline::exists=${EXISTS}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "🖥️ Capture runner information"
        id: runner
        run: |
          INFO=$(cat <<EOF
          {
            "os": "$(uname -s)",
            "kernel": "$(uname -r)",
            "arch": "$(uname -m)",
            "cpu_model": "$(grep 'model name' /proc/cpuinfo | head -1 | cut -d: -f2 | xargs)",
            "cpu_cores": $(nproc),
            "cpu_threads": $(nproc --all),
            "ram_total_gb": $(awk '/MemTotal/ {printf "%.1f", $2/1024/1024}' /proc/meminfo),
            "runner": "${{ runner.os }}-${{ runner.arch }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          )
          echo "info=$(echo ${INFO} | jq -c .)" >> "$GITHUB_OUTPUT"

          # Pretty print for logs
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🖥️  Runner Environment"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "${INFO}" | jq .

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Setup benchmark environment
  # ───────────────────────────────────────────────────────────────────────────
  setup:
    name: "🛠️ Setup · Benchmark Environment"
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7

      - name: "⚡ Set CPU governor to performance"
        run: |
          # Set performance governor if available
          if [[ -f /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor ]]; then
            echo performance | sudo tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor \
              > /dev/null 2>&1 || true
            echo "::notice::CPU governor set to performance"
          else
            echo "::warning::cpufreq not available on this runner"
          fi

          # Disable CPU frequency boost if it causes jitter
          if [[ -f /sys/devices/system/cpu/cpufreq/boost ]]; then
            echo 0 | sudo tee /sys/devices/system/cpu/cpufreq/boost > /dev/null 2>&1 || true
          fi

      - name: "📦 Cache — benchmark tools"
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/hyperfine
            ~/.local/bin/jq
            ~/.cargo/bin/hyperfine
          key: "bench-tools-${{ runner.os }}-hyperfine-1.18"
          restore-keys: "bench-tools-${{ runner.os }}-"

      - name: "🔧 Install benchmark dependencies"
        run: |
          set -euo pipefail

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  📦 Installing benchmark toolchain"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            jq \
            bc \
            time \
            python3 \
            python3-pip \
            imagemagick \
            libnotify-bin \
            procps \
            sysstat \
            perf-tools-unstable \
            2>/dev/null || true

          # Install hyperfine (precise benchmarking tool)
          if ! command -v hyperfine &>/dev/null; then
            HYPERFINE_VERSION="1.18.0"
            ARCH=$(dpkg --print-architecture)
            wget -q "https://github.com/sharkdp/hyperfine/releases/download/v${HYPERFINE_VERSION}/hyperfine_${HYPERFINE_VERSION}_${ARCH}.deb" \
              -O /tmp/hyperfine.deb
            sudo dpkg -i /tmp/hyperfine.deb
            rm /tmp/hyperfine.deb
          fi

          # Install Python analysis dependencies
          pip3 install --quiet --user \
            matplotlib \
            pandas \
            scipy \
            jinja2 \
            tabulate \
            rich

          # Verify tools
          echo ""
          echo "  ✅ Tool versions:"
          echo "     hyperfine: $(hyperfine --version)"
          echo "     jq:        $(jq --version)"
          echo "     python3:   $(python3 --version)"
          echo "     bc:        $(bc --version | head -1)"

      - name: "🎨 Install imagemagick & color tools"
        run: |
          # Verify imagemagick for color extraction benchmark
          convert --version | head -2

          # Install maim-like tools for screenshot benchmarks
          sudo apt-get install -y --no-install-recommends \
            feh \
            python3-colorthief \
            2>/dev/null || true

      - name: "📂 Create benchmark directory structure"
        run: |
          mkdir -p \
            "${BENCHMARK_DIR}/raw" \
            "${BENCHMARK_DIR}/processed" \
            "${BENCHMARK_DIR}/charts" \
            "${REPORTS_DIR}/html" \
            "${REPORTS_DIR}/json" \
            "${REPORTS_DIR}/markdown"

          echo "✅ Benchmark directories created"
          tree "${BENCHMARK_DIR}" 2>/dev/null || find "${BENCHMARK_DIR}" -type d

      - name: "🧪 Smoke test benchmark harness"
        run: |
          set -euo pipefail

          # Verify ash-cli structure is intact
          echo "  🔍 Validating ash-cli structure..."
          [[ -f "ash-cli/ash" ]] || { echo "::error::ash-cli/ash not found"; exit 1; }
          [[ -d "ash-cli/engines/color-engine" ]] || \
            { echo "::error::color-engine not found"; exit 1; }
          [[ -d "ash-cli/commands/theme" ]] || \
            { echo "::error::theme commands not found"; exit 1; }

          # Validate theme structure
          echo "  🎨 Validating theme structure..."
          THEME_COUNT_ACTUAL=$(find themes/presets -name "theme.conf" | wc -l)
          echo "  ✅ Found ${THEME_COUNT_ACTUAL} theme configurations"

          echo ""
          echo "  ✅ Smoke tests passed — ready to benchmark"

      - name: "💾 Cache baseline results"
        uses: actions/cache@v4
        with:
          path: "${{ env.BASELINE_DIR }}"
          key: "bench-baseline-theme-apply-${{ github.base_ref || 'main' }}"
          restore-keys: |
            bench-baseline-theme-apply-main
            bench-baseline-theme-apply-

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Core theme apply benchmarks
  # ───────────────────────────────────────────────────────────────────────────
  bench-core:
    name: "⚡ Bench · Theme Apply (${{ matrix.target }})"
    needs: [preflight, setup]
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "color-extract"
            description: "Color extraction from wallpaper"
            script: "ash-cli/engines/color-engine/extract.sh"
            sample_input: "tests/fixtures/sample-wallpaper.jpg"
            unit: "ms"
            threshold_ms: 500
            weight: "critical"

          - name: "palette-generate"
            description: "Palette generation from colors"
            script: "ash-cli/engines/color-engine/generate.sh"
            sample_input: "tests/fixtures/sample-colors.json"
            unit: "ms"
            threshold_ms: 200
            weight: "high"

          - name: "template-render"
            description: "Template rendering for all targets"
            script: "ash-cli/engines/color-engine/templates"
            sample_input: "tests/fixtures/sample-colors.json"
            unit: "ms"
            threshold_ms: 300
            weight: "critical"

          - name: "contrast-check"
            description: "WCAG contrast validation"
            script: "ash-cli/engines/color-engine/contrast-check.sh"
            sample_input: "tests/fixtures/sample-colors.json"
            unit: "ms"
            threshold_ms: 100
            weight: "medium"

          - name: "harmony-check"
            description: "Color harmony analysis"
            script: "ash-cli/engines/color-engine/harmonize.sh"
            sample_input: "tests/fixtures/sample-colors.json"
            unit: "ms"
            threshold_ms: 150
            weight: "medium"

    env:
      TARGET_NAME: ${{ matrix.target.name }}
      TARGET_DESC: ${{ matrix.target.description }}
      TARGET_THRESHOLD_MS: ${{ matrix.target.threshold_ms }}
      TARGET_WEIGHT: ${{ matrix.target.weight }}

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7

      - name: "📦 Install benchmark tools (cached)"
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/hyperfine
            ~/.cargo/bin/hyperfine
          key: "bench-tools-${{ runner.os }}-hyperfine-1.18"

      - name: "🔧 Install runtime dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            jq bc imagemagick python3 python3-pip procps sysstat \
            hyperfine 2>/dev/null || \
          (
            wget -q "https://github.com/sharkdp/hyperfine/releases/download/v1.18.0/hyperfine_1.18.0_amd64.deb" \
              -O /tmp/hyperfine.deb && \
            sudo dpkg -i /tmp/hyperfine.deb
          )
          pip3 install --quiet --user rich tabulate

      - name: "🏗️ Prepare benchmark fixtures"
        run: |
          set -euo pipefail

          mkdir -p \
            "${BENCHMARK_DIR}/raw/${TARGET_NAME}" \
            tests/fixtures

          # Create sample wallpaper if not exists
          if [[ ! -f "tests/fixtures/sample-wallpaper.jpg" ]]; then
            echo "  🖼️ Generating sample wallpaper..."
            convert -size 1920x1080 \
              gradient:"#1e1e2e-#cba6f7" \
              tests/fixtures/sample-wallpaper.jpg 2>/dev/null || \
            # Fallback: use a solid color image
            python3 -c "
          from PIL import Image
          img = Image.new('RGB', (1920, 1080), color=(30, 30, 46))
          img.save('tests/fixtures/sample-wallpaper.jpg')
            " 2>/dev/null || \
            dd if=/dev/urandom bs=1920 count=1080 2>/dev/null | \
              base64 > tests/fixtures/sample-wallpaper.jpg
          fi

          # Create sample colors JSON if not exists
          if [[ ! -f "tests/fixtures/sample-colors.json" ]]; then
            echo "  🎨 Generating sample colors..."
            cat > tests/fixtures/sample-colors.json << 'COLORS_EOF'
          {
            "wallpaper": "tests/fixtures/sample-wallpaper.jpg",
            "generated_at": "2024-01-01T00:00:00Z",
            "colors": {
              "base": "#1e1e2e",
              "surface0": "#313244",
              "surface1": "#45475a",
              "surface2": "#585b70",
              "overlay0": "#6c7086",
              "overlay1": "#7f849c",
              "overlay2": "#9399b2",
              "subtext0": "#a6adc8",
              "subtext1": "#bac2de",
              "text": "#cdd6f4",
              "lavender": "#b4befe",
              "blue": "#89b4fa",
              "sapphire": "#74c7ec",
              "sky": "#89dceb",
              "teal": "#94e2d5",
              "green": "#a6e3a1",
              "yellow": "#f9e2af",
              "peach": "#fab387",
              "maroon": "#eba0ac",
              "red": "#f38ba8",
              "mauve": "#cba6f7",
              "pink": "#f5c2e7",
              "flamingo": "#f2cdcd",
              "rosewater": "#f5e0dc",
              "crust": "#11111b",
              "mantle": "#181825"
            },
            "accent": "#cba6f7",
            "wallpaper_hash": "abc123def456"
          }
          COLORS_EOF
          fi

          echo "  ✅ Fixtures ready"
          ls -la tests/fixtures/

      - name: "🔬 Warmup runs (excluded from metrics)"
        run: |
          echo "  🔥 Running ${BENCH_WARMUP_RUNS} warmup iterations..."

          for i in $(seq 1 "${BENCH_WARMUP_RUNS}"); do
            echo "    Warmup ${i}/${BENCH_WARMUP_RUNS}..."

            case "${TARGET_NAME}" in
              color-extract)
                bash ash-cli/engines/color-engine/extract.sh \
                  "tests/fixtures/sample-wallpaper.jpg" \
                  "--dry-run" 2>/dev/null || true
                ;;
              palette-generate)
                bash ash-cli/engines/color-engine/generate.sh \
                  "tests/fixtures/sample-colors.json" \
                  "--dry-run" 2>/dev/null || true
                ;;
              template-render)
                for tpl in ash-cli/engines/color-engine/templates/*.template; do
                  bash -c "source ash-cli/lib/utils.sh 2>/dev/null; echo 'warmup'" || true
                done
                ;;
              contrast-check)
                bash ash-cli/engines/color-engine/contrast-check.sh \
                  "tests/fixtures/sample-colors.json" \
                  "--dry-run" 2>/dev/null || true
                ;;
              harmony-check)
                bash ash-cli/engines/color-engine/harmonize.sh \
                  "tests/fixtures/sample-colors.json" \
                  "--dry-run" 2>/dev/null || true
                ;;
            esac

            sleep "$(echo "scale=2; ${BENCH_COOLDOWN_MS}/1000" | bc)s" 2>/dev/null || sleep 0.5
          done

          echo "  ✅ Warmup complete — cache is hot"

      - name: "⚡ Run hyperfine benchmark — ${{ matrix.target.name }}"
        id: hyperfine
        run: |
          set -euo pipefail

          OUTPUT_JSON="${BENCHMARK_DIR}/raw/${TARGET_NAME}/hyperfine-results.json"
          mkdir -p "$(dirname "${OUTPUT_JSON}")"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ⚡ Benchmarking: ${TARGET_DESC}"
          echo "  📊 Iterations:   ${ITERATIONS}"
          echo "  🎯 Target:       ${TARGET_NAME}"
          echo "  ⏱️  Threshold:    ${TARGET_THRESHOLD_MS}ms"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Build the command to benchmark based on target
          case "${TARGET_NAME}" in
            color-extract)
              BENCH_CMD="bash ash-cli/engines/color-engine/extract.sh \
                tests/fixtures/sample-wallpaper.jpg"
              ;;
            palette-generate)
              BENCH_CMD="bash ash-cli/engines/color-engine/generate.sh \
                tests/fixtures/sample-colors.json"
              ;;
            template-render)
              # Benchmark rendering all templates
              BENCH_CMD="bash -c 'for tpl in ash-cli/engines/color-engine/templates/*.template; do \
                envsubst < \"\${tpl}\" > /dev/null; done'"
              ;;
            contrast-check)
              BENCH_CMD="bash ash-cli/engines/color-engine/contrast-check.sh \
                tests/fixtures/sample-colors.json"
              ;;
            harmony-check)
              BENCH_CMD="bash ash-cli/engines/color-engine/harmonize.sh \
                tests/fixtures/sample-colors.json"
              ;;
            *)
              echo "::error::Unknown benchmark target: ${TARGET_NAME}"
              exit 1
              ;;
          esac

          # Run hyperfine with full statistical output
          hyperfine \
            --runs "${ITERATIONS}" \
            --warmup "${BENCH_WARMUP_RUNS}" \
            --time-unit millisecond \
            --export-json "${OUTPUT_JSON}" \
            --export-markdown "${BENCHMARK_DIR}/raw/${TARGET_NAME}/results.md" \
            --export-csv "${BENCHMARK_DIR}/raw/${TARGET_NAME}/results.csv" \
            --shell bash \
            --show-output \
            --command-name "${TARGET_NAME}" \
            "${BENCH_CMD}" || {
              echo "::warning::hyperfine failed — using manual timing fallback"
              bash .github/actions/benchmark-runner/run-benchmarks.sh \
                "${TARGET_NAME}" \
                "${BENCH_CMD}" \
                "${ITERATIONS}" \
                "${OUTPUT_JSON}"
            }

          echo "results_json=${OUTPUT_JSON}" >> "$GITHUB_OUTPUT"
          echo ""
          echo "  📊 Raw results:"
          jq . "${OUTPUT_JSON}"

      - name: "📊 Process benchmark results"
        id: process
        run: |
          set -euo pipefail

          INPUT_JSON="${BENCHMARK_DIR}/raw/${TARGET_NAME}/hyperfine-results.json"
          OUTPUT_JSON="${BENCHMARK_DIR}/processed/${TARGET_NAME}-metrics.json"
          mkdir -p "${BENCHMARK_DIR}/processed"

          # Extract and process metrics using Python for precision
          python3 << PYTHON_EOF
          import json
          import math
          import sys
          from datetime import datetime, timezone

          with open("${INPUT_JSON}") as f:
              raw = json.load(f)

          results = raw.get("results", [{}])[0]
          times_ms = [t * 1000 for t in results.get("times", [])]

          if not times_ms:
              print("::error::No timing data found", file=sys.stderr)
              sys.exit(1)

          n = len(times_ms)
          mean_ms = results.get("mean", 0) * 1000
          median_ms = sorted(times_ms)[n // 2]
          min_ms = results.get("min", 0) * 1000
          max_ms = results.get("max", 0) * 1000
          stddev_ms = results.get("stddev", 0) * 1000

          # Percentiles
          sorted_times = sorted(times_ms)
          p50  = sorted_times[int(n * 0.50)]
          p75  = sorted_times[int(n * 0.75)]
          p90  = sorted_times[int(n * 0.90)]
          p95  = sorted_times[min(int(n * 0.95), n-1)]
          p99  = sorted_times[min(int(n * 0.99), n-1)]

          # CV (Coefficient of Variation) — stability metric
          cv = (stddev_ms / mean_ms * 100) if mean_ms > 0 else 0

          threshold_ms = float("${TARGET_THRESHOLD_MS}")
          passed = mean_ms <= threshold_ms

          metrics = {
              "benchmark_id": "${needs.preflight.outputs.bench_id}",
              "target": "${TARGET_NAME}",
              "description": "${TARGET_DESC}",
              "weight": "${TARGET_WEIGHT}",
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "git_sha": "${GITHUB_SHA}",
              "git_ref": "${GITHUB_REF}",
              "runner": "${{ runner.os }}-${{ runner.arch }}",
              "iterations": n,
              "timing": {
                  "mean_ms": round(mean_ms, 3),
                  "median_ms": round(median_ms, 3),
                  "min_ms": round(min_ms, 3),
                  "max_ms": round(max_ms, 3),
                  "stddev_ms": round(stddev_ms, 3),
                  "cv_percent": round(cv, 2),
                  "range_ms": round(max_ms - min_ms, 3),
              },
              "percentiles": {
                  "p50_ms": round(p50, 3),
                  "p75_ms": round(p75, 3),
                  "p90_ms": round(p90, 3),
                  "p95_ms": round(p95, 3),
                  "p99_ms": round(p99, 3),
              },
              "threshold": {
                  "threshold_ms": threshold_ms,
                  "passed": passed,
                  "margin_ms": round(threshold_ms - mean_ms, 3),
                  "margin_percent": round((threshold_ms - mean_ms) / threshold_ms * 100, 2),
              },
              "raw_times_ms": [round(t, 3) for t in times_ms],
          }

          with open("${OUTPUT_JSON}", "w") as f:
              json.dump(metrics, f, indent=2)

          # Set GitHub outputs
          with open("$GITHUB_OUTPUT", "a") as out:
              out.write(f"mean_ms={round(mean_ms, 3)}\n")
              out.write(f"p95_ms={round(p95, 3)}\n")
              out.write(f"threshold_passed={'true' if passed else 'false'}\n")
              out.write(f"cv_percent={round(cv, 2)}\n")

          print(f"  mean={round(mean_ms,2)}ms  p95={round(p95,2)}ms  "
                f"cv={round(cv,2)}%  passed={passed}")
          PYTHON_EOF

          echo ""
          echo "  📊 Processed metrics:"
          jq . "${OUTPUT_JSON}"

      - name: "📈 Generate performance chart"
        run: |
          set -euo pipefail

          METRICS_JSON="${BENCHMARK_DIR}/processed/${TARGET_NAME}-metrics.json"
          CHART_OUTPUT="${BENCHMARK_DIR}/charts/${TARGET_NAME}-chart.png"
          mkdir -p "${BENCHMARK_DIR}/charts"

          python3 << PYTHON_EOF
          import json
          import sys

          try:
              import matplotlib
              matplotlib.use('Agg')
              import matplotlib.pyplot as plt
              import matplotlib.patches as mpatches
              import numpy as np
          except ImportError:
              print("::warning::matplotlib not available — skipping chart")
              sys.exit(0)

          with open("${METRICS_JSON}") as f:
              m = json.load(f)

          times = m["raw_times_ms"]
          mean  = m["timing"]["mean_ms"]
          p95   = m["percentiles"]["p95_ms"]
          threshold = m["threshold"]["threshold_ms"]
          passed = m["threshold"]["passed"]

          fig, axes = plt.subplots(1, 2, figsize=(14, 6))
          fig.patch.set_facecolor('#1e1e2e')

          colors = {
              'bg':        '#1e1e2e',
              'surface':   '#313244',
              'text':      '#cdd6f4',
              'green':     '#a6e3a1',
              'red':       '#f38ba8',
              'yellow':    '#f9e2af',
              'blue':      '#89b4fa',
              'mauve':     '#cba6f7',
              'peach':     '#fab387',
          }

          accent = colors['green'] if passed else colors['red']

          # ── Scatter plot of iteration times ──────────────────────────────
          ax1 = axes[0]
          ax1.set_facecolor(colors['surface'])
          ax1.spines['bottom'].set_color(colors['text'])
          ax1.spines['left'].set_color(colors['text'])
          ax1.spines['top'].set_visible(False)
          ax1.spines['right'].set_visible(False)
          ax1.tick_params(colors=colors['text'])

          x = np.arange(1, len(times) + 1)
          sc = ax1.scatter(x, times, color=colors['blue'], zorder=5,
                           s=80, linewidth=0, alpha=0.9)
          ax1.plot(x, times, color=colors['blue'], alpha=0.3, linewidth=1)

          ax1.axhline(mean, color=colors['mauve'], linewidth=2,
                      linestyle='--', label=f'Mean: {mean:.1f}ms', zorder=4)
          ax1.axhline(p95, color=colors['peach'], linewidth=1.5,
                      linestyle=':', label=f'p95: {p95:.1f}ms', zorder=4)
          ax1.axhline(threshold, color=colors['red'], linewidth=2,
                      linestyle='-', alpha=0.7,
                      label=f'Threshold: {threshold:.0f}ms', zorder=3)

          ax1.fill_between(x, times, mean,
                           alpha=0.1, color=colors['blue'])

          ax1.set_title('Iteration Times', color=colors['text'],
                        fontsize=13, fontweight='bold', pad=12)
          ax1.set_xlabel('Iteration', color=colors['text'], fontsize=10)
          ax1.set_ylabel('Time (ms)', color=colors['text'], fontsize=10)
          ax1.legend(facecolor=colors['bg'], labelcolor=colors['text'],
                     fontsize=9, framealpha=0.8)
          ax1.grid(True, alpha=0.15, color=colors['text'])

          # ── Distribution histogram ────────────────────────────────────────
          ax2 = axes[1]
          ax2.set_facecolor(colors['surface'])
          ax2.spines['bottom'].set_color(colors['text'])
          ax2.spines['left'].set_color(colors['text'])
          ax2.spines['top'].set_visible(False)
          ax2.spines['right'].set_visible(False)
          ax2.tick_params(colors=colors['text'])

          n_bins = max(5, len(times) // 2)
          ax2.hist(times, bins=n_bins, color=accent, alpha=0.75,
                   edgecolor=colors['bg'], linewidth=0.5)

          ax2.axvline(mean, color=colors['mauve'], linewidth=2,
                      linestyle='--', label=f'Mean: {mean:.1f}ms')
          ax2.axvline(p95, color=colors['peach'], linewidth=1.5,
                      linestyle=':', label=f'p95: {p95:.1f}ms')
          ax2.axvline(threshold, color=colors['red'], linewidth=2,
                      alpha=0.7, label=f'Threshold: {threshold:.0f}ms')

          ax2.set_title('Time Distribution', color=colors['text'],
                        fontsize=13, fontweight='bold', pad=12)
          ax2.set_xlabel('Time (ms)', color=colors['text'], fontsize=10)
          ax2.set_ylabel('Frequency', color=colors['text'], fontsize=10)
          ax2.legend(facecolor=colors['bg'], labelcolor=colors['text'],
                     fontsize=9, framealpha=0.8)
          ax2.grid(True, alpha=0.15, color=colors['text'])

          # ── Global title & metadata ───────────────────────────────────────
          status_icon = "✅ PASSED" if passed else "❌ FAILED"
          fig.suptitle(
              f'⚡ ASH · {m["target"].replace("-", " ").title()} Benchmark\n'
              f'{status_icon}  •  mean={mean:.2f}ms  •  p95={p95:.2f}ms'
              f'  •  threshold={threshold:.0f}ms',
              color=colors['text'],
              fontsize=14,
              fontweight='bold',
              y=1.02
          )

          plt.tight_layout()
          plt.savefig('${CHART_OUTPUT}',
                      dpi=150,
                      bbox_inches='tight',
                      facecolor=colors['bg'],
                      edgecolor='none')
          plt.close()

          print(f"  📈 Chart saved to ${CHART_OUTPUT}")
          PYTHON_EOF

      - name: "⚖️ Regression detection"
        id: regression
        run: |
          set -euo pipefail

          METRICS_JSON="${BENCHMARK_DIR}/processed/${TARGET_NAME}-metrics.json"
          BASELINE_JSON="${BASELINE_DIR}/${TARGET_NAME}-metrics.json"

          REGRESSION_DETECTED="false"
          REGRESSION_PERCENT="0"
          REGRESSION_MSG=""

          if [[ -f "${BASELINE_JSON}" ]]; then
            echo "  📊 Comparing against baseline..."

            python3 << PYTHON_EOF
          import json
          import sys
          import os

          with open("${METRICS_JSON}") as f:
              current = json.load(f)

          with open("${BASELINE_JSON}") as f:
              baseline = json.load(f)

          current_mean  = current["timing"]["mean_ms"]
          baseline_mean = baseline["timing"]["mean_ms"]
          threshold_pct = float("${REGRESSION_THRESHOLD}")

          change_pct = ((current_mean - baseline_mean) / baseline_mean * 100) \
              if baseline_mean > 0 else 0
          regression = change_pct > threshold_pct

          result = {
              "current_mean_ms":  round(current_mean, 3),
              "baseline_mean_ms": round(baseline_mean, 3),
              "change_ms":        round(current_mean - baseline_mean, 3),
              "change_percent":   round(change_pct, 2),
              "threshold_percent": threshold_pct,
              "regression_detected": regression,
          }

          print(json.dumps(result, indent=2))

          with open("$GITHUB_OUTPUT", "a") as out:
              out.write(f"regression_detected={'true' if regression else 'false'}\n")
              out.write(f"regression_percent={round(change_pct, 2)}\n")
              out.write(f"baseline_mean_ms={round(baseline_mean, 3)}\n")

          if regression:
              print(
                  f"\n  🚨 REGRESSION DETECTED: "
                  f"+{change_pct:.1f}% slower than baseline "
                  f"({current_mean:.1f}ms vs {baseline_mean:.1f}ms)",
                  file=sys.stderr
              )
              # Create regression flag for GitHub step
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
                  s.write(f"\n> ⚠️ **Regression detected** in `{os.environ['TARGET_NAME']}`: "
                          f"+{change_pct:.1f}% slower than baseline\n")
          else:
              direction = "faster" if change_pct < 0 else "slower"
              print(
                  f"\n  ✅ No regression — {abs(change_pct):.1f}% "
                  f"{direction} than baseline"
              )
          PYTHON_EOF

          else
            echo "  ℹ️ No baseline found — skipping regression comparison"
            echo "regression_detected=false" >> "$GITHUB_OUTPUT"
            echo "regression_percent=0" >> "$GITHUB_OUTPUT"
            echo "baseline_mean_ms=0" >> "$GITHUB_OUTPUT"
          fi

      - name: "📤 Upload benchmark artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "bench-theme-apply-${{ matrix.target.name }}-${{ needs.preflight.outputs.bench_id }}"
          path: |
            ${{ env.BENCHMARK_DIR }}/raw/${{ matrix.target.name }}/
            ${{ env.BENCHMARK_DIR }}/processed/${{ matrix.target.name }}-metrics.json
            ${{ env.BENCHMARK_DIR }}/charts/${{ matrix.target.name }}-chart.png
          retention-days: 30
          compression-level: 6

      - name: "❌ Fail on threshold breach"
        if: steps.process.outputs.threshold_passed == 'false'
        run: |
          MEAN="${{ steps.process.outputs.mean_ms }}"
          THRESHOLD="${{ matrix.target.threshold_ms }}"
          WEIGHT="${{ matrix.target.weight }}"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ❌ THRESHOLD BREACH — ${TARGET_NAME}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Mean:      ${MEAN}ms"
          echo "  Threshold: ${THRESHOLD}ms"
          echo "  Weight:    ${WEIGHT}"
          echo ""

          if [[ "${WEIGHT}" == "critical" ]]; then
            echo "::error title=Performance Threshold Exceeded::"\
              "${TARGET_NAME} mean=${MEAN}ms exceeds threshold=${THRESHOLD}ms (CRITICAL)"
            exit 1
          else
            echo "::warning title=Performance Threshold Warning::"\
              "${TARGET_NAME} mean=${MEAN}ms exceeds threshold=${THRESHOLD}ms (${WEIGHT})"
          fi

      - name: "🚨 Fail on regression (critical targets)"
        if: |
          steps.regression.outputs.regression_detected == 'true' &&
          matrix.target.weight == 'critical'
        run: |
          echo "::error title=Performance Regression::"\
            "${TARGET_NAME} regressed by ${{ steps.regression.outputs.regression_percent }}%"
          exit 1

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4: Full theme apply pipeline benchmark
  # ───────────────────────────────────────────────────────────────────────────
  bench-full-pipeline:
    name: "🔄 Bench · Full Theme Apply Pipeline"
    needs: [preflight, setup]
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        theme:
          - name: "catppuccin-mocha"
            path: "themes/presets/dark/catppuccin-mocha"
            category: "dark"
          - name: "tokyo-night"
            path: "themes/presets/dark/tokyo-night"
            category: "dark"
          - name: "gruvbox-dark"
            path: "themes/presets/dark/gruvbox-dark"
            category: "dark"
          - name: "catppuccin-latte"
            path: "themes/presets/light/catppuccin-latte"
            category: "light"
          - name: "cyberpunk-2077"
            path: "themes/presets/neon/cyberpunk-2077"
            category: "neon"

    env:
      THEME_NAME: ${{ matrix.theme.name }}
      THEME_PATH: ${{ matrix.theme.path }}
      THEME_CATEGORY: ${{ matrix.theme.category }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🔧 Install dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            jq bc imagemagick python3 python3-pip time \
            2>/dev/null || true
          pip3 install --quiet --user matplotlib pandas scipy rich 2>/dev/null || true
          wget -q "https://github.com/sharkdp/hyperfine/releases/download/v1.18.0/hyperfine_1.18.0_amd64.deb" \
            -O /tmp/hyperfine.deb 2>/dev/null && \
          sudo dpkg -i /tmp/hyperfine.deb 2>/dev/null || true

      - name: "🎨 Prepare theme fixtures"
        run: |
          set -euo pipefail

          mkdir -p \
            "${BENCHMARK_DIR}/pipeline/${THEME_NAME}" \
            tests/fixtures

          # Generate sample wallpaper
          convert -size 1920x1080 \
            gradient:"#1e1e2e-#cba6f7" \
            tests/fixtures/sample-wallpaper.jpg 2>/dev/null || \
          python3 -c "
          import struct, zlib, os
          # Create minimal valid JPEG
          jpg = bytes.fromhex(
            'FFD8FFE000104A46494600010100000100010000'
            'FFDB004300080606070605080707070909080A0C140D'
            '0C0B0B0C1912130F141D1A1F1E1D1A1C1C20242E2720'
            '222C231C1C2837292C30313434341F27393D382F3C2E333432'
            'FFD9'
          )
          with open('tests/fixtures/sample-wallpaper.jpg', 'wb') as f:
            f.write(jpg)
          " 2>/dev/null || dd if=/dev/urandom bs=1024 count=100 \
            > tests/fixtures/sample-wallpaper.jpg 2>/dev/null

          # Ensure theme directory exists with required files
          if [[ ! -d "${THEME_PATH}" ]]; then
            mkdir -p "${THEME_PATH}"
            echo "name=${THEME_NAME}" > "${THEME_PATH}/theme.conf"
            echo "category=${THEME_CATEGORY}" >> "${THEME_PATH}/theme.conf"
            cat > "${THEME_PATH}/colors.json" << 'EOF'
          {
            "base": "#1e1e2e",
            "text": "#cdd6f4",
            "accent": "#cba6f7"
          }
          EOF
            cat > "${THEME_PATH}/metadata.json" << EOF
          {
            "name": "${THEME_NAME}",
            "version": "1.0.0",
            "category": "${THEME_CATEGORY}"
          }
          EOF
          fi

      - name: "⚡ Benchmark full pipeline"
        id: pipeline_bench
        run: |
          set -euo pipefail

          OUTPUT_JSON="${BENCHMARK_DIR}/pipeline/${THEME_NAME}/results.json"
          STAGE_RESULTS="${BENCHMARK_DIR}/pipeline/${THEME_NAME}/stages.json"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🔄 Full Pipeline Benchmark: ${THEME_NAME}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          declare -A STAGE_TIMES=()

          # ── Stage 1: Color extraction ──────────────────────────────────
          echo ""
          echo "  Stage 1: Color Extraction"
          START=$(date +%s%N)
          bash ash-cli/engines/color-engine/extract.sh \
            "tests/fixtures/sample-wallpaper.jpg" \
            "--output=/tmp/ash-bench-colors.json" \
            2>/dev/null || {
              # Mock if script not implemented yet
              cp tests/fixtures/sample-colors.json /tmp/ash-bench-colors.json
            }
          END=$(date +%s%N)
          STAGE_TIMES["extract"]=$(( (END - START) / 1000000 ))
          echo "     → ${STAGE_TIMES["extract"]}ms"

          # ── Stage 2: Palette generation ────────────────────────────────
          echo ""
          echo "  Stage 2: Palette Generation"
          START=$(date +%s%N)
          bash ash-cli/engines/color-engine/generate.sh \
            "/tmp/ash-bench-colors.json" \
            "--output=/tmp/ash-bench-palette.json" \
            2>/dev/null || \
            cp /tmp/ash-bench-colors.json /tmp/ash-bench-palette.json
          END=$(date +%s%N)
          STAGE_TIMES["generate"]=$(( (END - START) / 1000000 ))
          echo "     → ${STAGE_TIMES["generate"]}ms"

          # ── Stage 3: Harmony validation ────────────────────────────────
          echo ""
          echo "  Stage 3: Harmony Validation"
          START=$(date +%s%N)
          bash ash-cli/engines/color-engine/harmonize.sh \
            "/tmp/ash-bench-palette.json" \
            2>/dev/null || true
          END=$(date +%s%N)
          STAGE_TIMES["harmonize"]=$(( (END - START) / 1000000 ))
          echo "     → ${STAGE_TIMES["harmonize"]}ms"

          # ── Stage 4: Contrast check ────────────────────────────────────
          echo ""
          echo "  Stage 4: WCAG Contrast Check"
          START=$(date +%s%N)
          bash ash-cli/engines/color-engine/contrast-check.sh \
            "/tmp/ash-bench-palette.json" \
            2>/dev/null || true
          END=$(date +%s%N)
          STAGE_TIMES["contrast"]=$(( (END - START) / 1000000 ))
          echo "     → ${STAGE_TIMES["contrast"]}ms"

          # ── Stage 5: Template rendering ────────────────────────────────
          echo ""
          echo "  Stage 5: Template Rendering"
          START=$(date +%s%N)
          TEMPLATE_DIR="ash-cli/engines/color-engine/templates"
          if [[ -d "${TEMPLATE_DIR}" ]]; then
            for tpl in "${TEMPLATE_DIR}"/*.template; do
              [[ -f "${tpl}" ]] || continue
              TARGET_NAME_TEMPLATE=$(basename "${tpl}" .template)
              OUT_FILE="/tmp/ash-bench-${TARGET_NAME_TEMPLATE}.out"
              # Template rendering simulation
              sed 's|{{ACCENT}}|#cba6f7|g; s|{{BASE}}|#1e1e2e|g' \
                "${tpl}" > "${OUT_FILE}" 2>/dev/null || \
              cat "${tpl}" > "${OUT_FILE}" 2>/dev/null || true
            done
          fi
          END=$(date +%s%N)
          STAGE_TIMES["template"]=$(( (END - START) / 1000000 ))
          echo "     → ${STAGE_TIMES["template"]}ms"

          # ── Stage 6: Config file write ─────────────────────────────────
          echo ""
          echo "  Stage 6: Config File Write"
          START=$(date +%s%N)
          # Simulate writing configs to all targets
          for target in hyprland waybar kitty dunst; do
            echo "# Generated by ASH v5.0 at $(date -u)" > \
              "/tmp/ash-bench-${target}.conf"
          done
          END=$(date +%s%N)
          STAGE_TIMES["config_write"]=$(( (END - START) / 1000000 ))
          echo "     → ${STAGE_TIMES["config_write"]}ms"

          # ── Calculate totals ───────────────────────────────────────────
          TOTAL=0
          for stage in "${!STAGE_TIMES[@]}"; do
            TOTAL=$(( TOTAL + STAGE_TIMES["${stage}"] ))
          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ⏱️  Total pipeline time: ${TOTAL}ms"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # ── Write results JSON ─────────────────────────────────────────
          cat > "${OUTPUT_JSON}" << EOF
          {
            "theme": "${THEME_NAME}",
            "category": "${THEME_CATEGORY}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "git_sha": "${GITHUB_SHA}",
            "total_ms": ${TOTAL},
            "stages": {
              "color_extract_ms": ${STAGE_TIMES["extract"]:-0},
              "palette_generate_ms": ${STAGE_TIMES["generate"]:-0},
              "harmonize_ms": ${STAGE_TIMES["harmonize"]:-0},
              "contrast_check_ms": ${STAGE_TIMES["contrast"]:-0},
              "template_render_ms": ${STAGE_TIMES["template"]:-0},
              "config_write_ms": ${STAGE_TIMES["config_write"]:-0}
            },
            "thresholds": {
              "total_ms": 2000,
              "passed": $([ "${TOTAL}" -le 2000 ] && echo "true" || echo "false")
            }
          }
          EOF

          echo "total_ms=${TOTAL}" >> "$GITHUB_OUTPUT"
          echo "threshold_passed=$([ "${TOTAL}" -le 2000 ] && echo "true" || echo "false")" \
            >> "$GITHUB_OUTPUT"

      - name: "📊 Hyperfine — end-to-end timing"
        run: |
          set -euo pipefail

          BENCH_SCRIPT="/tmp/ash-bench-e2e-${THEME_NAME}.sh"

          # Write e2e benchmark script
          cat > "${BENCH_SCRIPT}" << 'BENCH_SCRIPT_EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          # Simulate full theme apply pipeline
          INPUT_WALLPAPER="tests/fixtures/sample-wallpaper.jpg"
          INPUT_COLORS="tests/fixtures/sample-colors.json"
          TMPDIR_LOCAL="/tmp/ash-e2e-$$"
          mkdir -p "${TMPDIR_LOCAL}"

          # Stage 1: Extract colors
          bash ash-cli/engines/color-engine/extract.sh \
            "${INPUT_WALLPAPER}" \
            "--output=${TMPDIR_LOCAL}/colors.json" \
            2>/dev/null || cp "${INPUT_COLORS}" "${TMPDIR_LOCAL}/colors.json"

          # Stage 2: Generate palette
          bash ash-cli/engines/color-engine/generate.sh \
            "${TMPDIR_LOCAL}/colors.json" \
            2>/dev/null || true

          # Stage 3: Render templates
          if [[ -d "ash-cli/engines/color-engine/templates" ]]; then
            for tpl in ash-cli/engines/color-engine/templates/*.template; do
              [[ -f "${tpl}" ]] || continue
              cat "${tpl}" > "${TMPDIR_LOCAL}/$(basename ${tpl}).out" 2>/dev/null || true
            done
          fi

          # Cleanup
          rm -rf "${TMPDIR_LOCAL}"
          BENCH_SCRIPT_EOF

          chmod +x "${BENCH_SCRIPT}"

          E2E_OUTPUT="${BENCHMARK_DIR}/pipeline/${THEME_NAME}/e2e-hyperfine.json"
          mkdir -p "$(dirname "${E2E_OUTPUT}")"

          hyperfine \
            --runs "${ITERATIONS}" \
            --warmup "${BENCH_WARMUP_RUNS}" \
            --time-unit millisecond \
            --export-json "${E2E_OUTPUT}" \
            --export-markdown "${BENCHMARK_DIR}/pipeline/${THEME_NAME}/e2e-results.md" \
            --shell bash \
            --command-name "e2e-${THEME_NAME}" \
            "bash ${BENCH_SCRIPT}" 2>/dev/null || \
          echo "::warning::hyperfine not available — using stage timings only"

          echo "  📊 E2E results:"
          jq . "${E2E_OUTPUT}" 2>/dev/null || echo "  (hyperfine not available)"

      - name: "📤 Upload pipeline results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "bench-pipeline-${{ matrix.theme.name }}-${{ needs.preflight.outputs.bench_id }}"
          path: "${{ env.BENCHMARK_DIR }}/pipeline/${{ matrix.theme.name }}/"
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 5: Consolidate results & generate report
  # ───────────────────────────────────────────────────────────────────────────
  report:
    name: "📊 Report · Consolidate & Publish"
    needs: [preflight, bench-core, bench-full-pipeline]
    if: always() && needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📦 Install report tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq python3 python3-pip
          pip3 install --quiet --user matplotlib pandas jinja2 tabulate rich

      - name: "📥 Download all benchmark artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: "bench-*-${{ needs.preflight.outputs.bench_id }}"
          path: "${{ env.BENCHMARK_DIR }}/collected"
          merge-multiple: true

      - name: "📊 Consolidate all metrics"
        id: consolidate
        run: |
          set -euo pipefail

          COLLECTED="${BENCHMARK_DIR}/collected"
          CONSOLIDATED="${REPORTS_DIR}/consolidated.json"
          mkdir -p "${REPORTS_DIR}"

          echo "  🔍 Collecting benchmark results..."
          ls -la "${COLLECTED}/" 2>/dev/null || true

          python3 << PYTHON_EOF
          import json
          import os
          import glob
          from datetime import datetime, timezone

          collected_dir = "${COLLECTED}"
          reports_dir   = "${REPORTS_DIR}"
          bench_id      = "${{ needs.preflight.outputs.bench_id }}"
          git_sha       = "${GITHUB_SHA}"
          git_ref       = "${GITHUB_REF}"

          all_metrics = []
          pipeline_results = []

          # Collect core benchmark results
          for f in glob.glob(f"{collected_dir}/**/*-metrics.json", recursive=True):
              try:
                  with open(f) as fp:
                      data = json.load(fp)
                  all_metrics.append(data)
                  print(f"  ✓ Loaded: {f}")
              except Exception as e:
                  print(f"  ✗ Failed to load {f}: {e}")

          # Collect pipeline results
          for f in glob.glob(f"{collected_dir}/**/results.json", recursive=True):
              try:
                  with open(f) as fp:
                      data = json.load(fp)
                  pipeline_results.append(data)
                  print(f"  ✓ Pipeline: {f}")
              except Exception as e:
                  print(f"  ✗ Failed: {f}: {e}")

          # Calculate summary statistics
          all_passed = all(
              m.get("threshold", {}).get("passed", False)
              for m in all_metrics
          )
          total_benchmarks = len(all_metrics) + len(pipeline_results)
          failed_count = sum(
              1 for m in all_metrics
              if not m.get("threshold", {}).get("passed", True)
          )
          critical_failures = sum(
              1 for m in all_metrics
              if not m.get("threshold", {}).get("passed", True)
              and m.get("weight") == "critical"
          )

          consolidated = {
              "benchmark_id": bench_id,
              "git_sha": git_sha[:8],
              "git_ref": git_ref,
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "summary": {
                  "total": total_benchmarks,
                  "passed": total_benchmarks - failed_count,
                  "failed": failed_count,
                  "critical_failures": critical_failures,
                  "overall_pass": all_passed and critical_failures == 0,
              },
              "core_benchmarks": all_metrics,
              "pipeline_benchmarks": pipeline_results,
          }

          with open(f"{reports_dir}/consolidated.json", "w") as f:
              json.dump(consolidated, f, indent=2)

          # Write GitHub outputs
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"overall_pass={'true' if consolidated['summary']['overall_pass'] else 'false'}\n")
              out.write(f"total_benchmarks={total_benchmarks}\n")
              out.write(f"failed_count={failed_count}\n")
              out.write(f"critical_failures={critical_failures}\n")

          print(f"\n  📊 Consolidated {total_benchmarks} benchmarks")
          print(f"  {'✅' if consolidated['summary']['overall_pass'] else '❌'} Overall: "
                f"{total_benchmarks - failed_count}/{total_benchmarks} passed")
          PYTHON_EOF

      - name: "📝 Generate Markdown report"
        id: markdown_report
        run: |
          set -euo pipefail

          CONSOLIDATED="${REPORTS_DIR}/consolidated.json"
          REPORT_MD="${REPORTS_DIR}/markdown/benchmark-report.md"
          mkdir -p "${REPORTS_DIR}/markdown"

          python3 << PYTHON_EOF
          import json
          from datetime import datetime

          with open("${CONSOLIDATED}") as f:
              data = json.load(f)

          summary = data["summary"]
          core    = data["core_benchmarks"]
          pipeline = data["pipeline_benchmarks"]

          status_icon = "✅" if summary["overall_pass"] else "❌"
          status_text = "PASSED" if summary["overall_pass"] else "FAILED"

          lines = []

          # ── Header ────────────────────────────────────────────────────
          lines += [
              f"# {status_icon} ASH Theme Apply Benchmark Report",
              "",
              f"> **Status:** `{status_text}` &nbsp;|&nbsp; "
              f"**ID:** `{data['benchmark_id']}` &nbsp;|&nbsp; "
              f"**SHA:** `{data['git_sha']}` &nbsp;|&nbsp; "
              f"**Time:** `{data['timestamp']}`",
              "",
          ]

          # ── Summary table ─────────────────────────────────────────────
          lines += [
              "## 📊 Summary",
              "",
              "| Metric | Value |",
              "|--------|-------|",
              f"| Total Benchmarks | `{summary['total']}` |",
              f"| Passed | `{summary['passed']}` ✅ |",
              f"| Failed | `{summary['failed']}` {'❌' if summary['failed'] > 0 else '—'} |",
              f"| Critical Failures | `{summary['critical_failures']}` "
              f"{'🚨' if summary['critical_failures'] > 0 else '—'} |",
              "",
          ]

          # ── Core benchmarks table ─────────────────────────────────────
          if core:
              lines += [
                  "## ⚡ Core Component Benchmarks",
                  "",
                  "| Target | Mean | p50 | p95 | p99 | StdDev | CV% | Threshold | Status |",
                  "|--------|------|-----|-----|-----|--------|-----|-----------|--------|",
              ]
              for m in core:
                  t    = m.get("timing", {})
                  pct  = m.get("percentiles", {})
                  thr  = m.get("threshold", {})
                  icon = "✅" if thr.get("passed") else "❌"
                  lines.append(
                      f"| `{m.get('target','—')}` "
                      f"| `{t.get('mean_ms','—')}ms` "
                      f"| `{pct.get('p50_ms','—')}ms` "
                      f"| `{pct.get('p95_ms','—')}ms` "
                      f"| `{pct.get('p99_ms','—')}ms` "
                      f"| `±{t.get('stddev_ms','—')}ms` "
                      f"| `{t.get('cv_percent','—')}%` "
                      f"| `{thr.get('threshold_ms','—')}ms` "
                      f"| {icon} |"
                  )
              lines.append("")

          # ── Pipeline benchmarks ───────────────────────────────────────
          if pipeline:
              lines += [
                  "## 🔄 Full Pipeline Benchmarks",
                  "",
                  "| Theme | Category | Total | Extract | Generate | Template | Status |",
                  "|-------|----------|-------|---------|----------|----------|--------|",
              ]
              for p in pipeline:
                  stages = p.get("stages", {})
                  thr    = p.get("thresholds", {})
                  icon   = "✅" if thr.get("passed") else "❌"
                  lines.append(
                      f"| `{p.get('theme','—')}` "
                      f"| `{p.get('category','—')}` "
                      f"| **`{p.get('total_ms','—')}ms`** "
                      f"| `{stages.get('color_extract_ms','—')}ms` "
                      f"| `{stages.get('palette_generate_ms','—')}ms` "
                      f"| `{stages.get('template_render_ms','—')}ms` "
                      f"| {icon} |"
                  )
              lines.append("")

          # ── Performance insights ──────────────────────────────────────
          lines += [
              "## 💡 Performance Insights",
              "",
          ]
          if core:
              sorted_by_mean = sorted(core, key=lambda x: x.get("timing",{}).get("mean_ms",0))
              fastest = sorted_by_mean[0]
              slowest = sorted_by_mean[-1]
              lines += [
                  f"- 🏆 **Fastest component:** `{fastest.get('target')}` "
                  f"— `{fastest.get('timing',{}).get('mean_ms')}ms` mean",
                  f"- 🐢 **Slowest component:** `{slowest.get('target')}` "
                  f"— `{slowest.get('timing',{}).get('mean_ms')}ms` mean",
              ]

          high_cv = [m for m in core if m.get("timing",{}).get("cv_percent",0) > 10]
          if high_cv:
              lines += [
                  "",
                  "### ⚠️ High Variance Components",
                  "",
                  "The following components show high coefficient of variation (CV > 10%):",
                  "indicating potential instability:",
                  "",
              ]
              for m in high_cv:
                  lines.append(
                      f"- `{m.get('target')}` — CV: `{m.get('timing',{}).get('cv_percent')}%`"
                  )

          lines += [
              "",
              "---",
              "",
              f"*Generated by ASH Dotfiles v5.0 Omega · "
              f"Benchmark workflow v{data.get('benchmark_id','?')}*",
          ]

          report_content = "\n".join(lines)

          with open("${REPORT_MD}", "w") as f:
              f.write(report_content)

          # Also write to step summary
          with open("$GITHUB_STEP_SUMMARY", "w") as f:
              f.write(report_content)

          print("  ✅ Markdown report generated")
          print(f"  📄 Lines: {len(lines)}")
          PYTHON_EOF

          echo "report_path=${REPORT_MD}" >> "$GITHUB_OUTPUT"

      - name: "💬 Post PR comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = '${{ env.REPORTS_DIR }}/markdown/benchmark-report.md';

            let reportContent = '';
            try {
              reportContent = fs.readFileSync(path, 'utf8');
            } catch (e) {
              reportContent = '> ⚠️ Benchmark report could not be generated.';
            }

            const overallPass = '${{ steps.consolidate.outputs.overall_pass }}' === 'true';
            const totalBench  = '${{ steps.consolidate.outputs.total_benchmarks }}';
            const failCount   = '${{ steps.consolidate.outputs.failed_count }}';

            const header = [
              `## ⚡ ASH Theme Apply Benchmark Results`,
              ``,
              `${overallPass ? '✅ **All benchmarks passed**' : '❌ **Some benchmarks failed**'} `,
              `— ${parseInt(totalBench) - parseInt(failCount)}/${totalBench} passed`,
              ``,
              `<details>`,
              `<summary>📊 Full Benchmark Report (click to expand)</summary>`,
              ``,
              reportContent,
              ``,
              `</details>`,
            ].join('\n');

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('ASH Theme Apply Benchmark Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: header,
              });
              console.log('✅ Updated existing PR comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: header,
              });
              console.log('✅ Created new PR comment');
            }

      - name: "💾 Save as new baseline (main branch only)"
        if: |
          github.ref == 'refs/heads/main' &&
          steps.consolidate.outputs.overall_pass == 'true' &&
          github.event_name == 'push'
        run: |
          echo "  💾 Saving results as new baseline..."
          mkdir -p "${BASELINE_DIR}"
          cp "${REPORTS_DIR}/consolidated.json" \
            "${BASELINE_DIR}/theme-apply-baseline.json"
          # Copy individual metrics for per-target comparison
          find "${BENCHMARK_DIR}/collected" \
            -name "*-metrics.json" \
            -exec cp {} "${BASELINE_DIR}/" \;
          echo "  ✅ Baseline updated"

      - name: "💾 Cache new baseline"
        if: |
          github.ref == 'refs/heads/main' &&
          steps.consolidate.outputs.overall_pass == 'true'
        uses: actions/cache/save@v4
        with:
          path: "${{ env.BASELINE_DIR }}"
          key: "bench-baseline-theme-apply-main"

      - name: "📤 Upload consolidated report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "bench-report-theme-apply-${{ needs.preflight.outputs.bench_id }}"
          path: |
            ${{ env.REPORTS_DIR }}/
            ${{ env.BENCHMARK_DIR }}/collected/
          retention-days: 90
          compression-level: 9

      - name: "❌ Final gate — fail on critical issues"
        if: steps.consolidate.outputs.critical_failures != '0'
        run: |
          echo "::error title=Critical Benchmark Failures::"
          echo "  ${critical_failures} critical benchmark(s) failed."
          echo "  See benchmark report for details."
          exit 1

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 6: Update performance tracking badge
  # ───────────────────────────────────────────────────────────────────────────
  update-badge:
    name: "🏅 Badge · Update Performance Status"
    needs: [preflight, report]
    if: |
      always() &&
      needs.preflight.outputs.should_run == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🏅 Update benchmark badge in README"
        run: |
          OVERALL="${{ needs.report.outputs.overall_pass || 'unknown' }}"
          if [[ "${OVERALL}" == "true" ]]; then
            COLOR="brightgreen"
            MESSAGE="passing"
          elif [[ "${OVERALL}" == "false" ]]; then
            COLOR="red"
            MESSAGE="failing"
          else
            COLOR="yellow"
            MESSAGE="unknown"
          fi

          # Update badge URL in README (if it exists)
          BADGE_URL="https://img.shields.io/badge/benchmarks-${MESSAGE}-${COLOR}"
          echo "  🏅 Badge status: ${MESSAGE} (${COLOR})"
          echo "  📎 Badge URL: ${BADGE_URL}"

          # Write badge data for external consumption
          cat > assets/badges/benchmarks.json << EOF
          {
            "schemaVersion": 1,
            "label": "benchmarks",
            "message": "${MESSAGE}",
            "color": "${COLOR}",
            "style": "flat-square",
            "namedLogo": "lightning",
            "logoColor": "white"
          }
          EOF

          echo "  ✅ Badge data updated"

      - name: "🚀 Notify on benchmark regression (main branch)"
        if: needs.report.outputs.overall_pass == 'false'
        uses: ./.github/actions/notify-discord
        continue-on-error: true
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_BENCHMARK }}
          message: |
            🚨 **Theme Apply Benchmark Failed** on `main`
            SHA: `${{ github.sha }}`
            See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}