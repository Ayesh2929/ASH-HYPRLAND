name: "📉 Regression Detection · Performance Guard"

on:
  # ── Trigger after all benchmark workflows complete ──────────────────────────
  workflow_run:
    workflows:
      - "⚡ Benchmark · Theme Apply Performance"
      - "🚀 Benchmark · Startup Time Performance"
      - "🧠 Benchmark · Memory Usage Profiling"
      - "🎨 Benchmark · Color Extraction Pipeline"
      - "🔥 Benchmark · Hot Reload Latency"
      - "🌐 Benchmark · REST API Performance"
    types: [completed]
    branches: [main, develop, "release/*"]

  # ── Direct trigger from PRs ──────────────────────────────────────────────────
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

  # ── Manual execution with full control ──────────────────────────────────────
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: "Baseline commit SHA (leave empty for auto)"
        required: false
        default: ""
        type: string
      compare_sha:
        description: "Compare commit SHA (leave empty for HEAD)"
        required: false
        default: ""
        type: string
      detection_mode:
        description: "Detection algorithm"
        required: false
        default: "ensemble"
        type: choice
        options:
          - ensemble
          - zscore
          - percent-change
          - mann-whitney
          - ewma
          - changepoint
          - iqr
      zscore_threshold:
        description: "Z-score threshold (default: 2.5)"
        required: false
        default: "2.5"
        type: string
      percent_threshold:
        description: "Percent change threshold % (default: 15)"
        required: false
        default: "15"
        type: string
      severity_gate:
        description: "Minimum severity to fail workflow"
        required: false
        default: "critical"
        type: choice
        options:
          - critical
          - high
          - medium
          - any
      domains:
        description: "Benchmark domains (all|theme|startup|memory|color|reload|api)"
        required: false
        default: "all"
        type: string
      create_issue:
        description: "Create GitHub issue for critical regressions"
        required: false
        default: true
        type: boolean
      notify_discord:
        description: "Send Discord notifications"
        required: false
        default: true
        type: boolean
      lookback_days:
        description: "Historical lookback window (days)"
        required: false
        default: "30"
        type: string

  # ── Nightly comprehensive scan ────────────────────────────────────────────
  schedule:
    - cron: "30 3 * * *"     # Nightly 03:30 UTC (after all nightly benchmarks)
    - cron: "0 12 * * 1"     # Weekly Monday noon — full deep scan

# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: "regression-detect-${{ github.ref }}-${{ github.event_name }}"
  cancel-in-progress: false    # Never cancel regression detection

permissions:
  contents: write
  pull-requests: write
  checks: write
  issues: write
  statuses: write
  actions: read
  packages: read

# ─────────────────────────────────────────────────────────────────────────────
env:
  REGRESSION_VERSION: "5.0.0"
  WORK_DIR: "${{ github.workspace }}/regression"
  BASELINE_DIR: "${{ github.workspace }}/baselines"
  HISTORY_DIR: "${{ github.workspace }}/perf-history"
  REPORTS_DIR: "${{ github.workspace }}/regression-reports"
  DB_PATH: "${{ github.workspace }}/perf-history/regression.db"

  # ── Algorithm parameters ─────────────────────────────────────────────────
  DETECTION_MODE: "${{ github.event.inputs.detection_mode || 'ensemble' }}"
  ZSCORE_THRESHOLD: "${{ github.event.inputs.zscore_threshold || '2.5' }}"
  PERCENT_THRESHOLD: "${{ github.event.inputs.percent_threshold || '15' }}"
  SEVERITY_GATE: "${{ github.event.inputs.severity_gate || 'critical' }}"
  LOOKBACK_DAYS: "${{ github.event.inputs.lookback_days || '30' }}"
  DOMAINS: "${{ github.event.inputs.domains || 'all' }}"
  CREATE_ISSUE: "${{ github.event.inputs.create_issue || 'true' }}"
  NOTIFY_DISCORD: "${{ github.event.inputs.notify_discord || 'true' }}"

  # ── Severity thresholds ───────────────────────────────────────────────────
  CRITICAL_THRESHOLD_PCT: "30"       # ≥30% = critical regression
  HIGH_THRESHOLD_PCT: "15"           # ≥15% = high
  MEDIUM_THRESHOLD_PCT: "8"          # ≥8%  = medium
  LOW_THRESHOLD_PCT: "3"             # ≥3%  = low (informational)

  # ── Domain-specific metric config ────────────────────────────────────────
  THEME_METRIC: "mean_ms"
  STARTUP_METRIC: "mean_ms"
  MEMORY_METRIC: "peak_kb"
  COLOR_METRIC: "mean_ms"
  RELOAD_METRIC: "mean_ms"
  API_METRIC: "p95_ms"
  WS_METRIC: "mean_ms"

# ═════════════════════════════════════════════════════════════════════════════
jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 — Bootstrap regression engine
  # ─────────────────────────────────────────────────────────────────────────
  bootstrap:
    name: "🔧 Bootstrap · Regression Engine"
    runs-on: ubuntu-24.04
    outputs:
      session_id: ${{ steps.session.outputs.id }}
      baseline_sha: ${{ steps.refs.outputs.baseline_sha }}
      compare_sha: ${{ steps.refs.outputs.compare_sha }}
      baseline_exists: ${{ steps.baseline_check.outputs.exists }}
      domains_json: ${{ steps.domains.outputs.json }}
      triggered_by: ${{ steps.trigger.outputs.source }}
      should_gate: ${{ steps.gate.outputs.should_gate }}

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 50      # Enough history for trend analysis

      - name: "🆔 Generate session ID"
        id: session
        run: |
          SESSION_ID="regress-$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::10}"
          echo "id=${SESSION_ID}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Regression Session::${SESSION_ID}"

      - name: "🔍 Resolve comparison refs"
        id: refs
        run: |
          BASELINE_SHA="${{ github.event.inputs.baseline_sha }}"
          COMPARE_SHA="${{ github.event.inputs.compare_sha }}"

          # Auto-resolve baseline
          if [[ -z "${BASELINE_SHA}" ]]; then
            case "${{ github.event_name }}" in
              pull_request)
                BASELINE_SHA="${{ github.event.pull_request.base.sha }}"
                ;;
              workflow_run)
                BASELINE_SHA=$(git log --format="%H" -n 2 HEAD | tail -1)
                ;;
              schedule)
                # Compare against 7 days ago
                BASELINE_SHA=$(git log \
                  --before="7 days ago" \
                  --format="%H" -n 1 || \
                  git rev-parse HEAD~10)
                ;;
              *)
                BASELINE_SHA=$(git rev-parse HEAD~1 2>/dev/null || \
                  git rev-parse HEAD)
                ;;
            esac
          fi

          # Auto-resolve compare
          [[ -z "${COMPARE_SHA}" ]] && COMPARE_SHA="${GITHUB_SHA}"

          echo "baseline_sha=${BASELINE_SHA}" >> "$GITHUB_OUTPUT"
          echo "compare_sha=${COMPARE_SHA}"   >> "$GITHUB_OUTPUT"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  📍 Baseline SHA: ${BASELINE_SHA}"
          echo "  📍 Compare SHA:  ${COMPARE_SHA}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: "🔍 Detect trigger source"
        id: trigger
        run: |
          case "${{ github.event_name }}" in
            pull_request)   SOURCE="pull_request" ;;
            workflow_run)   SOURCE="benchmark_complete" ;;
            schedule)       SOURCE="scheduled" ;;
            workflow_dispatch) SOURCE="manual" ;;
            *)              SOURCE="unknown" ;;
          esac
          echo "source=${SOURCE}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Trigger::${SOURCE}"

      - name: "📦 Install Python + statistics stack"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3 \
            python3-pip \
            jq \
            bc \
            sqlite3 \
            git \
            curl \
            2>/dev/null || true

          pip3 install --quiet --user \
            numpy==2.1.2 \
            scipy==1.14.1 \
            pandas==2.2.3 \
            matplotlib==3.9.2 \
            seaborn==0.13.2 \
            ruptures==1.1.9 \
            statsmodels==0.14.4 \
            rich==13.9.2 \
            jinja2==3.1.4 \
            tabulate==0.9.0 \
            click==8.1.7 \
            colorama==0.4.6 \
            2>/dev/null || true

          echo ""
          echo "  ✅ numpy:       $(python3 -c 'import numpy; print(numpy.__version__)')"
          echo "  ✅ scipy:       $(python3 -c 'import scipy; print(scipy.__version__)')"
          echo "  ✅ pandas:      $(python3 -c 'import pandas; print(pandas.__version__)')"
          echo "  ✅ matplotlib:  $(python3 -c 'import matplotlib; print(matplotlib.__version__)')"
          echo "  ✅ ruptures:    $(python3 -c 'import ruptures; print(ruptures.__version__)' 2>/dev/null || echo 'optional')"
          echo "  ✅ statsmodels: $(python3 -c 'import statsmodels; print(statsmodels.__version__)' 2>/dev/null || echo 'optional')"

      - name: "🗂️ Resolve benchmark domains"
        id: domains
        run: |
          ALL_DOMAINS='["theme-apply","startup","memory","color-extract","hot-reload","api","websocket","cli"]'
          INPUT="${DOMAINS}"

          if [[ "${INPUT}" == "all" ]]; then
            DOMAINS_JSON="${ALL_DOMAINS}"
          else
            IFS=',' read -ra D_ARR <<< "${INPUT}"
            DOMAINS_JSON=$(printf '%s\n' "${D_ARR[@]}" | jq -R . | jq -s -c .)
          fi

          echo "json=${DOMAINS_JSON}" >> "$GITHUB_OUTPUT"
          echo "  🎯 Domains: ${DOMAINS_JSON}"

      - name: "📊 Check baseline availability"
        id: baseline_check
        run: |
          EXISTS="false"
          # Check for cached baseline artifacts
          if gh api \
            "repos/${{ github.repository }}/actions/caches" \
            --jq '[.actions_caches[].key]' 2>/dev/null | \
            grep -q "bench-baseline"; then
            EXISTS="true"
          fi
          echo "exists=${EXISTS}" >> "$GITHUB_OUTPUT"
          echo "  📊 Baseline exists: ${EXISTS}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "🚦 Gate decision"
        id: gate
        run: |
          # Determine if failures should block
          case "${SEVERITY_GATE}" in
            critical)  echo "should_gate=true" >> "$GITHUB_OUTPUT" ;;
            high)      echo "should_gate=true" >> "$GITHUB_OUTPUT" ;;
            medium)    echo "should_gate=true" >> "$GITHUB_OUTPUT" ;;
            any)       echo "should_gate=true" >> "$GITHUB_OUTPUT" ;;
            none)      echo "should_gate=false" >> "$GITHUB_OUTPUT" ;;
            *)         echo "should_gate=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: "🏗️ Initialize regression database"
        run: |
          mkdir -p "${HISTORY_DIR}" "${WORK_DIR}" "${REPORTS_DIR}"

          sqlite3 "${DB_PATH}" << 'SQL_EOF'
          -- ── Regression history schema ────────────────────────────────
          CREATE TABLE IF NOT EXISTS regression_sessions (
            id              TEXT PRIMARY KEY,
            session_id      TEXT NOT NULL,
            baseline_sha    TEXT NOT NULL,
            compare_sha     TEXT NOT NULL,
            git_ref         TEXT,
            triggered_by    TEXT,
            detection_mode  TEXT,
            overall_status  TEXT,
            total_checked   INTEGER DEFAULT 0,
            regressions     INTEGER DEFAULT 0,
            improvements    INTEGER DEFAULT 0,
            critical_count  INTEGER DEFAULT 0,
            high_count      INTEGER DEFAULT 0,
            medium_count    INTEGER DEFAULT 0,
            low_count       INTEGER DEFAULT 0,
            created_at      TEXT DEFAULT (datetime('now')),
            completed_at    TEXT
          );

          CREATE TABLE IF NOT EXISTS regression_findings (
            id              TEXT PRIMARY KEY,
            session_id      TEXT NOT NULL,
            domain          TEXT NOT NULL,
            metric_name     TEXT NOT NULL,
            metric_key      TEXT NOT NULL,
            baseline_value  REAL,
            current_value   REAL,
            change_pct      REAL,
            change_abs      REAL,
            zscore          REAL,
            severity        TEXT,
            direction       TEXT,
            algorithm       TEXT,
            confidence_pct  REAL,
            p_value         REAL,
            is_regression   INTEGER DEFAULT 1,
            created_at      TEXT DEFAULT (datetime('now')),
            FOREIGN KEY (session_id) REFERENCES regression_sessions(id)
          );

          CREATE TABLE IF NOT EXISTS metric_history (
            id              TEXT PRIMARY KEY,
            domain          TEXT NOT NULL,
            metric_name     TEXT NOT NULL,
            metric_key      TEXT NOT NULL,
            value           REAL NOT NULL,
            git_sha         TEXT,
            git_ref         TEXT,
            measured_at     TEXT DEFAULT (datetime('now')),
            benchmark_id    TEXT
          );

          CREATE TABLE IF NOT EXISTS performance_baselines (
            domain          TEXT NOT NULL,
            metric_key      TEXT NOT NULL,
            baseline_value  REAL NOT NULL,
            ewma_value      REAL,
            std_dev         REAL,
            sample_count    INTEGER DEFAULT 1,
            git_sha         TEXT,
            updated_at      TEXT DEFAULT (datetime('now')),
            PRIMARY KEY (domain, metric_key)
          );

          -- ── Indexes ────────────────────────────────────────────────
          CREATE INDEX IF NOT EXISTS idx_findings_session
            ON regression_findings(session_id);
          CREATE INDEX IF NOT EXISTS idx_findings_domain
            ON regression_findings(domain, metric_name);
          CREATE INDEX IF NOT EXISTS idx_history_domain
            ON metric_history(domain, metric_key);
          CREATE INDEX IF NOT EXISTS idx_history_time
            ON metric_history(measured_at);
          SQL_EOF

          echo "  ✅ Regression database initialized: ${DB_PATH}"
          echo "  📋 Tables: $(sqlite3 "${DB_PATH}" '.tables')"

      - name: "📤 Upload bootstrap artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: "regress-bootstrap-${{ steps.session.outputs.id }}"
          path: |
            ${{ env.HISTORY_DIR }}/
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — Collect & normalize all benchmark data
  # ─────────────────────────────────────────────────────────────────────────
  collect-data:
    name: "📥 Collect · ${{ matrix.domain }} Benchmarks"
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        domain:
          - name: "theme-apply"
            display: "🎨 Theme Apply"
            cache_prefix: "bench-baseline-theme-apply"
            metrics:
              - key: "color_extract_ms"
                label: "Color Extraction"
                unit: "ms"
                lower_is_better: true
                critical_threshold_pct: 30
              - key: "palette_generate_ms"
                label: "Palette Generation"
                unit: "ms"
                lower_is_better: true
                critical_threshold_pct: 30
              - key: "template_render_ms"
                label: "Template Rendering"
                unit: "ms"
                lower_is_better: true
                critical_threshold_pct: 25
              - key: "mean_ms"
                label: "Full Apply Mean"
                unit: "ms"
                lower_is_better: true
                critical_threshold_pct: 25

          - name: "startup"
            display: "🚀 Startup Time"
            cache_prefix: "bench-baseline-startup"
            metrics:
              - key: "mean_ms"
                label: "ASH CLI Mean"
                unit: "ms"
                lower_is_better: true
                critical_threshold_pct: 20
              - key: "p95_ms"
                label: "ASH CLI p95"
                unit: "ms"
                lower_is_better: true
                critical_threshold_pct: 25
              - key: "config_mean_ms"
                label: "Shell + Config"
                unit: "ms"
                lower_is_better: true
                critical_threshold_pct: 25

          - name: "memory"
            display: "🧠 Memory Usage"
            cache_prefix: "bench-baseline-memory"
            metrics:
              - key: "peak_kb"
                label: "Peak RSS"
                unit: "KB"
                lower_is_better: true
                critical_threshold_pct: 25
              - key: "mean_kb"
                label: "Mean RSS"
                unit: "KB"
                lower_is_better: true
                critical_threshold_pct: 25

          - name: "color-extract"
            display: "🎨 Color Extraction"
            cache_prefix: "bench-baseline-color"
            metrics:
              - key: "mean_ms"
                label: "Extraction Mean"
                unit: "ms"
                lower_is_better: true
                critical_threshold_pct: 30
              - key: "p95_ms"
                label: "Extraction p95"
                unit: "ms"
                lower_is_better: true
                critical_threshold_pct: 35

          - name: "hot-reload"
            display: "🔥 Hot Reload"
            cache_prefix: "bench-baseline-hot-reload"
            metrics:
              - key: "mean_ms"
                label: "Reload Mean"
                unit: "ms"
                lower_is_better: true
                critical_threshold_pct: 20
              - key: "jitter_ms"
                label: "Reload Jitter"
                unit: "ms"
                lower_is_better: true
                critical_threshold_pct: 40

          - name: "api"
            display: "🌐 REST API"
            cache_prefix: "bench-baseline-api"
            metrics:
              - key: "p50_ms"
                label: "API p50"
                unit: "ms"
                lower_is_better: true
                critical_threshold_pct: 25
              - key: "p95_ms"
                label: "API p95"
                unit: "ms"
                lower_is_better: true
                critical_threshold_pct: 30
              - key: "p99_ms"
                label: "API p99"
                unit: "ms"
                lower_is_better: true
                critical_threshold_pct: 35
              - key: "rps"
                label: "Requests/s"
                unit: "req/s"
                lower_is_better: false
                critical_threshold_pct: 25

    env:
      DOMAIN_NAME: ${{ matrix.domain.name }}
      CACHE_PREFIX: ${{ matrix.domain.cache_prefix }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "📦 Install tools"
        run: |
          pip3 install --quiet --user \
            numpy scipy pandas matplotlib seaborn rich 2>/dev/null || true
          sudo apt-get install -y --no-install-recommends \
            jq sqlite3 bc 2>/dev/null || true

      - name: "📥 Restore baseline cache"
        id: baseline_cache
        uses: actions/cache/restore@v4
        with:
          path: "${{ env.BASELINE_DIR }}/${{ matrix.domain.name }}"
          key: "${{ matrix.domain.cache_prefix }}-main"
          restore-keys: |
            ${{ matrix.domain.cache_prefix }}-
          fail-on-cache-miss: false

      - name: "🔨 Generate synthetic benchmark data"
        run: |
          set -euo pipefail

          DOMAIN_DIR="${WORK_DIR}/${DOMAIN_NAME}"
          mkdir -p "${DOMAIN_DIR}"

          python3 << 'PYTHON_EOF'
          """
          Synthetic benchmark data generator.
          In production, this reads real baseline/current artifacts.
          For CI demo purposes, generates statistically realistic data.
          """
          import json
          import math
          import os
          import random
          import time
          import uuid
          from pathlib import Path

          domain    = os.environ["DOMAIN_NAME"]
          work_dir  = Path(os.environ["WORK_DIR"]) / domain
          git_sha   = os.environ["GITHUB_SHA"]
          base_sha  = "${{ needs.bootstrap.outputs.baseline_sha }}"

          # ── Domain-specific realistic baselines ───────────────────────
          DOMAIN_CONFIG = {
              "theme-apply": {
                  "color_extract_ms":   {"base": 250.0, "std": 15.0,  "unit": "ms"},
                  "palette_generate_ms":{"base": 80.0,  "std": 8.0,   "unit": "ms"},
                  "template_render_ms": {"base": 120.0, "std": 12.0,  "unit": "ms"},
                  "mean_ms":            {"base": 450.0, "std": 30.0,  "unit": "ms"},
              },
              "startup": {
                  "mean_ms":            {"base": 85.0,  "std": 8.0,   "unit": "ms"},
                  "p95_ms":             {"base": 110.0, "std": 12.0,  "unit": "ms"},
                  "config_mean_ms":     {"base": 200.0, "std": 20.0,  "unit": "ms"},
              },
              "memory": {
                  "peak_kb":            {"base": 8192.0,"std": 512.0, "unit": "KB"},
                  "mean_kb":            {"base": 5120.0,"std": 300.0, "unit": "KB"},
              },
              "color-extract": {
                  "mean_ms":            {"base": 320.0, "std": 25.0,  "unit": "ms"},
                  "p95_ms":             {"base": 420.0, "std": 35.0,  "unit": "ms"},
              },
              "hot-reload": {
                  "mean_ms":            {"base": 75.0,  "std": 10.0,  "unit": "ms"},
                  "jitter_ms":          {"base": 30.0,  "std": 8.0,   "unit": "ms"},
              },
              "api": {
                  "p50_ms":             {"base": 22.0,  "std": 3.0,   "unit": "ms"},
                  "p95_ms":             {"base": 85.0,  "std": 10.0,  "unit": "ms"},
                  "p99_ms":             {"base": 180.0, "std": 25.0,  "unit": "ms"},
                  "rps":                {"base": 250.0, "std": 20.0,  "unit": "req/s"},
              },
          }

          config = DOMAIN_CONFIG.get(domain, {})
          random.seed(42)     # Reproducible

          # ── Generate BASELINE data ─────────────────────────────────────
          baseline = {"git_sha": base_sha, "domain": domain, "metrics": {}}
          for key, cfg in config.items():
              # Baseline: n=30 samples from reference distribution
              samples = [
                  max(cfg["base"] * 0.5,
                      random.gauss(cfg["base"], cfg["std"]))
                  for _ in range(30)
              ]
              baseline["metrics"][key] = {
                  "samples": [round(s, 3) for s in samples],
                  "mean":    round(sum(samples)/len(samples), 3),
                  "std":     round((sum((s-sum(samples)/len(samples))**2
                                  for s in samples)/len(samples))**0.5, 3),
                  "min":     round(min(samples), 3),
                  "max":     round(max(samples), 3),
                  "unit":    cfg["unit"],
              }

          # ── Generate CURRENT data with random regressions ──────────────
          # Inject regressions on ~30% of metrics for realism
          current = {"git_sha": git_sha, "domain": domain, "metrics": {}}
          injected_regressions = []

          for key, cfg in config.items():
              inject_regression = random.random() < 0.30
              inject_improvement = random.random() < 0.10

              if inject_regression:
                  # 15-50% regression
                  factor = 1.0 + random.uniform(0.15, 0.50)
                  injected_regressions.append((key, round((factor-1)*100, 1)))
              elif inject_improvement:
                  # 5-20% improvement
                  factor = 1.0 - random.uniform(0.05, 0.20)
              else:
                  # Normal variation
                  factor = 1.0 + random.uniform(-0.05, 0.05)

              new_base = cfg["base"] * factor
              new_std  = cfg["std"] * (1.0 + random.uniform(-0.1, 0.3))

              samples = [
                  max(new_base * 0.5,
                      random.gauss(new_base, new_std))
                  for _ in range(30)
              ]
              current["metrics"][key] = {
                  "samples": [round(s, 3) for s in samples],
                  "mean":    round(sum(samples)/len(samples), 3),
                  "std":     round((sum((s-sum(samples)/len(samples))**2
                                  for s in samples)/len(samples))**0.5, 3),
                  "min":     round(min(samples), 3),
                  "max":     round(max(samples), 3),
                  "unit":    cfg["unit"],
              }

          # ── Write data files ───────────────────────────────────────────
          with open(work_dir / "baseline.json", "w") as f:
              json.dump(baseline, f, indent=2)
          with open(work_dir / "current.json", "w") as f:
              json.dump(current, f, indent=2)

          # Also check if real baseline exists
          baseline_cache = Path(os.environ["BASELINE_DIR"]) / domain
          if (baseline_cache / "baseline.json").exists():
              import shutil
              shutil.copy(baseline_cache / "baseline.json",
                          work_dir / "baseline-real.json")
              print(f"  ✅ Real baseline found for {domain}")

          if injected_regressions:
              print(f"\n  ⚠️  Injected regressions in {domain}:")
              for key, pct in injected_regressions:
                  print(f"     {key}: +{pct}%")
          else:
              print(f"\n  ✅ No regressions injected in {domain}")
          PYTHON_EOF

      - name: "📤 Upload domain data"
        uses: actions/upload-artifact@v6
        with:
          name: "regress-data-${{ matrix.domain.name }}-${{ needs.bootstrap.outputs.session_id }}"
          path: "${{ env.WORK_DIR }}/${{ matrix.domain.name }}/"
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3 — Statistical regression analysis engine
  # ─────────────────────────────────────────────────────────────────────────
  analyze:
    name: "🔬 Analyze · Statistical Regression Engine"
    needs: [bootstrap, collect-data]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      regression_count: ${{ steps.analyze.outputs.regression_count }}
      improvement_count: ${{ steps.analyze.outputs.improvement_count }}
      critical_count: ${{ steps.analyze.outputs.critical_count }}
      high_count: ${{ steps.analyze.outputs.high_count }}
      medium_count: ${{ steps.analyze.outputs.medium_count }}
      overall_status: ${{ steps.analyze.outputs.overall_status }}
      worst_regression: ${{ steps.analyze.outputs.worst_regression }}
      analysis_json: ${{ steps.analyze.outputs.analysis_path }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📦 Install full statistics stack"
        run: |
          pip3 install --quiet --user \
            numpy==2.1.2 \
            scipy==1.14.1 \
            pandas==2.2.3 \
            matplotlib==3.9.2 \
            seaborn==0.13.2 \
            ruptures==1.1.9 \
            statsmodels==0.14.4 \
            rich==13.9.2 \
            tabulate==0.9.0 \
            2>/dev/null || true

          sudo apt-get install -y --no-install-recommends \
            jq sqlite3 bc 2>/dev/null || true

      - name: "📥 Download all domain data"
        uses: actions/download-artifact@v7
        with:
          pattern: "regress-data-*-${{ needs.bootstrap.outputs.session_id }}"
          path: "${{ env.WORK_DIR }}/collected"
          merge-multiple: true

      - name: "🔬 Run statistical analysis engine"
        id: analyze
        run: |
          mkdir -p "${REPORTS_DIR}"

          python3 << 'ANALYSIS_EOF'
          """
          ╔═══════════════════════════════════════════════════════════════╗
          ║  ASH Performance Regression Analysis Engine v5.0              ║
          ║                                                               ║
          ║  Algorithms:                                                  ║
          ║    1. Z-Score anomaly detection                               ║
          ║    2. Mann-Whitney U test (non-parametric)                    ║
          ║    3. EWMA baseline deviation                                 ║
          ║    4. Percent-change threshold                                ║
          ║    5. IQR outlier fence                                       ║
          ║    6. Change-point detection (PELT)                           ║
          ║    7. Confidence interval overlap                             ║
          ║    8. Ensemble voting                                         ║
          ╚═══════════════════════════════════════════════════════════════╝
          """
          import json
          import math
          import os
          import statistics
          import uuid
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any, Dict, List, Optional, Tuple

          import numpy as np

          # ── Optional imports ────────────────────────────────────────────
          try:
              from scipy import stats
              SCIPY_AVAILABLE = True
          except ImportError:
              SCIPY_AVAILABLE = False
              print("  ⚠️ scipy not available — using fallback stats")

          try:
              import ruptures as rpt
              RUPTURES_AVAILABLE = True
          except ImportError:
              RUPTURES_AVAILABLE = False

          # ── Configuration ───────────────────────────────────────────────
          WORK_DIR      = Path(os.environ["WORK_DIR"]) / "collected"
          REPORTS_DIR   = Path(os.environ["REPORTS_DIR"])
          SESSION_ID    = "${{ needs.bootstrap.outputs.session_id }}"
          BASELINE_SHA  = "${{ needs.bootstrap.outputs.baseline_sha }}"
          COMPARE_SHA   = "${{ needs.bootstrap.outputs.compare_sha }}"
          DETECTION_MODE= os.environ.get("DETECTION_MODE", "ensemble")
          ZSCORE_THRESH = float(os.environ.get("ZSCORE_THRESHOLD", "2.5"))
          PCT_THRESH    = float(os.environ.get("PERCENT_THRESHOLD", "15"))
          GIT_REF       = os.environ.get("GITHUB_REF", "unknown")

          CRITICAL_PCT  = float(os.environ.get("CRITICAL_THRESHOLD_PCT", "30"))
          HIGH_PCT      = float(os.environ.get("HIGH_THRESHOLD_PCT", "15"))
          MEDIUM_PCT    = float(os.environ.get("MEDIUM_THRESHOLD_PCT", "8"))
          LOW_PCT       = float(os.environ.get("LOW_THRESHOLD_PCT", "3"))

          REPORTS_DIR.mkdir(parents=True, exist_ok=True)

          # ════════════════════════════════════════════════════════════════
          # DETECTION ALGORITHMS
          # ════════════════════════════════════════════════════════════════

          def zscore_detect(
              baseline: List[float],
              current: List[float],
              threshold: float = 2.5
          ) -> Tuple[bool, float, float]:
              """
              Z-score detection: how many standard deviations is current mean
              from baseline distribution?
              Returns: (is_regression, zscore, confidence_pct)
              """
              if len(baseline) < 2:
                  return False, 0.0, 0.0
              b_mean = np.mean(baseline)
              b_std  = np.std(baseline, ddof=1)
              c_mean = np.mean(current)
              if b_std < 1e-10:
                  return False, 0.0, 50.0
              z = (c_mean - b_mean) / b_std
              # Confidence from normal CDF
              if SCIPY_AVAILABLE:
                  conf = float(stats.norm.cdf(abs(z)) * 100)
              else:
                  conf = min(99.9, 50 + abs(z) * 15)
              return abs(z) > threshold and z > 0, round(z, 4), round(conf, 2)

          def mann_whitney_detect(
              baseline: List[float],
              current: List[float],
              alpha: float = 0.05
          ) -> Tuple[bool, float, float]:
              """
              Mann-Whitney U test: non-parametric significance testing.
              Returns: (is_regression, u_statistic, p_value)
              """
              if not SCIPY_AVAILABLE or len(baseline) < 3 or len(current) < 3:
                  return False, 0.0, 1.0
              try:
                  u_stat, p_val = stats.mannwhitneyu(
                      current, baseline,
                      alternative="greater"    # Test: current > baseline
                  )
                  is_reg = (
                      p_val < alpha and
                      np.mean(current) > np.mean(baseline)
                  )
                  return is_reg, round(float(u_stat), 4), round(float(p_val), 6)
              except Exception:
                  return False, 0.0, 1.0

          def ewma_detect(
              baseline: List[float],
              current: List[float],
              alpha: float = 0.3,
              threshold_sigma: float = 2.0
          ) -> Tuple[bool, float, float]:
              """
              EWMA (Exponentially Weighted Moving Average) control chart.
              Returns: (is_regression, ewma_deviation, sigma_estimate)
              """
              if len(baseline) < 5:
                  return False, 0.0, 0.0
              # Compute EWMA of baseline
              ewma = [baseline[0]]
              for x in baseline[1:]:
                  ewma.append(alpha * x + (1 - alpha) * ewma[-1])
              ewma_mean = ewma[-1]
              # Sigma from baseline
              b_std = np.std(baseline, ddof=1)
              ewma_sigma = b_std * math.sqrt(alpha / (2 - alpha))
              # Current EWMA
              c_ewma = np.mean(current)
              deviation = (c_ewma - ewma_mean) / max(ewma_sigma, 1e-10)
              is_reg = deviation > threshold_sigma
              return is_reg, round(deviation, 4), round(ewma_sigma, 4)

          def percent_change_detect(
              baseline: List[float],
              current: List[float],
              threshold_pct: float = 15.0
          ) -> Tuple[bool, float, str]:
              """
              Simple percent change detection.
              Returns: (is_regression, change_pct, severity)
              """
              b_mean = np.mean(baseline) if baseline else 0
              c_mean = np.mean(current)  if current  else 0
              if b_mean < 1e-10:
                  return False, 0.0, "none"
              change_pct = (c_mean - b_mean) / b_mean * 100
              if change_pct >= CRITICAL_PCT:  severity = "critical"
              elif change_pct >= HIGH_PCT:    severity = "high"
              elif change_pct >= MEDIUM_PCT:  severity = "medium"
              elif change_pct >= LOW_PCT:     severity = "low"
              else:                           severity = "none"
              is_reg = change_pct >= threshold_pct
              return is_reg, round(change_pct, 3), severity

          def iqr_detect(
              baseline: List[float],
              current: List[float]
          ) -> Tuple[bool, float, float]:
              """
              IQR outlier fence detection.
              Tests if current mean is outside baseline Q3 + 1.5*IQR.
              Returns: (is_outlier, iqr_score, fence_upper)
              """
              if len(baseline) < 4:
                  return False, 0.0, float('inf')
              q1 = float(np.percentile(baseline, 25))
              q3 = float(np.percentile(baseline, 75))
              iqr = q3 - q1
              fence_upper = q3 + 1.5 * iqr
              fence_lower = q1 - 1.5 * iqr
              c_mean = np.mean(current)
              iqr_score = (c_mean - fence_upper) / max(iqr, 1e-10) if iqr > 0 else 0
              return c_mean > fence_upper, round(iqr_score, 4), round(fence_upper, 4)

          def confidence_interval_detect(
              baseline: List[float],
              current: List[float],
              confidence: float = 0.95
          ) -> Tuple[bool, Tuple[float,float], Tuple[float,float]]:
              """
              Confidence interval non-overlap detection.
              Returns: (no_overlap, baseline_ci, current_ci)
              """
              if len(baseline) < 3 or len(current) < 3:
                  return False, (0,0), (0,0)
              if SCIPY_AVAILABLE:
                  try:
                      b_ci = stats.t.interval(
                          confidence, len(baseline)-1,
                          loc=np.mean(baseline),
                          scale=stats.sem(baseline)
                      )
                      c_ci = stats.t.interval(
                          confidence, len(current)-1,
                          loc=np.mean(current),
                          scale=stats.sem(current)
                      )
                      no_overlap = c_ci[0] > b_ci[1]
                      return no_overlap, \
                             (round(b_ci[0],3), round(b_ci[1],3)), \
                             (round(c_ci[0],3), round(c_ci[1],3))
                  except Exception:
                      pass
              return False, (0,0), (0,0)

          def changepoint_detect(
              baseline: List[float],
              current: List[float]
          ) -> Tuple[bool, int, float]:
              """
              PELT change-point detection on combined series.
              Returns: (has_changepoint, changepoint_idx, cost)
              """
              if not RUPTURES_AVAILABLE or len(baseline) < 5 or len(current) < 5:
                  return False, 0, 0.0
              try:
                  combined = np.array(baseline + current)
                  algo = rpt.Pelt(model="rbf").fit(combined)
                  result = algo.predict(pen=10)
                  # Check if any changepoint falls in the transition zone
                  transition = len(baseline)
                  near_transition = any(
                      abs(cp - transition) < len(combined) * 0.2
                      for cp in result[:-1]
                  )
                  return near_transition, result[0] if result else 0, 0.0
              except Exception:
                  return False, 0, 0.0

          def ensemble_detect(
              baseline: List[float],
              current: List[float],
              metric_key: str,
              lower_is_better: bool = True
          ) -> Dict[str, Any]:
              """
              Ensemble voting across all algorithms.
              Requires majority vote (≥3/7) to declare regression.
              """
              if not lower_is_better:
                  # For metrics where higher is better (e.g., RPS),
                  # flip direction for detection
                  baseline = [-x for x in baseline]
                  current  = [-x for x in current]

              results = {}

              # 1. Z-Score
              z_reg, z_score, z_conf = zscore_detect(baseline, current, ZSCORE_THRESH)
              results["zscore"] = {"regression": z_reg, "zscore": z_score,
                                    "confidence": z_conf}

              # 2. Mann-Whitney U
              mw_reg, mw_u, mw_p = mann_whitney_detect(baseline, current)
              results["mann_whitney"] = {"regression": mw_reg, "u_stat": mw_u,
                                          "p_value": mw_p,
                                          "confidence": round((1-mw_p)*100, 2)}

              # 3. EWMA
              ew_reg, ew_dev, ew_sigma = ewma_detect(baseline, current)
              results["ewma"] = {"regression": ew_reg, "deviation": ew_dev,
                                  "sigma": ew_sigma,
                                  "confidence": min(99.9, 50 + abs(ew_dev)*15)}

              # 4. Percent change
              pct_reg, pct_change, pct_severity = percent_change_detect(
                  baseline, current, PCT_THRESH
              )
              results["percent_change"] = {"regression": pct_reg,
                                            "change_pct": pct_change,
                                            "severity": pct_severity}

              # 5. IQR
              iqr_reg, iqr_score, iqr_fence = iqr_detect(baseline, current)
              results["iqr"] = {"regression": iqr_reg, "score": iqr_score,
                                 "fence_upper": iqr_fence}

              # 6. Confidence interval
              ci_reg, b_ci, c_ci = confidence_interval_detect(baseline, current)
              results["confidence_interval"] = {"regression": ci_reg,
                                                  "baseline_ci": list(b_ci),
                                                  "current_ci": list(c_ci)}

              # 7. Changepoint
              cp_reg, cp_idx, cp_cost = changepoint_detect(baseline, current)
              results["changepoint"] = {"regression": cp_reg,
                                         "changepoint_idx": cp_idx}

              # ── Ensemble voting ─────────────────────────────────────────
              votes = sum([
                  z_reg, mw_reg, ew_reg, pct_reg,
                  iqr_reg, ci_reg, cp_reg
              ])
              total_algorithms = 7
              vote_ratio = votes / total_algorithms
              is_regression = vote_ratio >= 0.43   # ≥3/7

              # ── Confidence from ensemble ────────────────────────────────
              confidences = [v.get("confidence", 50)
                             for k, v in results.items()
                             if isinstance(v.get("confidence"), (int, float))]
              avg_confidence = statistics.mean(confidences) if confidences else 50.0

              # ── Severity from percent change ────────────────────────────
              severity = pct_severity if pct_severity != "none" else (
                  "critical" if vote_ratio >= 0.86 else
                  "high"     if vote_ratio >= 0.57 else
                  "medium"   if vote_ratio >= 0.43 else
                  "low"
              )

              b_mean = np.mean(baseline) if baseline else 0
              c_mean = np.mean(current)  if current  else 0

              return {
                  "is_regression":     is_regression,
                  "severity":          severity,
                  "votes":             votes,
                  "total_algorithms":  total_algorithms,
                  "vote_ratio":        round(vote_ratio, 3),
                  "confidence_pct":    round(avg_confidence, 2),
                  "baseline_mean":     round(float(b_mean), 3),
                  "current_mean":      round(float(c_mean), 3),
                  "change_pct":        round(pct_change, 3),
                  "change_abs":        round(float(c_mean - b_mean), 3),
                  "direction":         "regression" if c_mean > b_mean else "improvement",
                  "algorithms":        results,
              }

          # ════════════════════════════════════════════════════════════════
          # MAIN ANALYSIS LOOP
          # ════════════════════════════════════════════════════════════════

          all_findings    = []
          domain_summaries= []
          regression_count= 0
          improvement_count=0
          critical_count  = 0
          high_count      = 0
          medium_count    = 0
          medium_low_count= 0

          # Domain metric definitions
          DOMAIN_METRICS = {
              "theme-apply": [
                  ("color_extract_ms", "Color Extraction",    "ms",    True),
                  ("palette_generate_ms","Palette Generation","ms",    True),
                  ("template_render_ms","Template Render",    "ms",    True),
                  ("mean_ms",           "Full Apply Mean",    "ms",    True),
              ],
              "startup": [
                  ("mean_ms",       "ASH CLI Mean",    "ms", True),
                  ("p95_ms",        "ASH CLI p95",     "ms", True),
                  ("config_mean_ms","Shell+Config",    "ms", True),
              ],
              "memory": [
                  ("peak_kb", "Peak RSS",  "KB", True),
                  ("mean_kb", "Mean RSS",  "KB", True),
              ],
              "color-extract": [
                  ("mean_ms", "Extraction Mean", "ms", True),
                  ("p95_ms",  "Extraction p95",  "ms", True),
              ],
              "hot-reload": [
                  ("mean_ms",   "Reload Mean",   "ms", True),
                  ("jitter_ms", "Reload Jitter", "ms", True),
              ],
              "api": [
                  ("p50_ms", "API p50",  "ms",    True),
                  ("p95_ms", "API p95",  "ms",    True),
                  ("p99_ms", "API p99",  "ms",    True),
                  ("rps",    "API RPS",  "req/s", False),
              ],
          }

          print("\n" + "═"*65)
          print("  🔬 ASH Regression Analysis Engine")
          print(f"  Mode: {DETECTION_MODE.upper()}")
          print(f"  Z-Score threshold: {ZSCORE_THRESH}σ")
          print(f"  Percent threshold: {PCT_THRESH}%")
          print("═"*65)

          # ── Process each domain ─────────────────────────────────────────
          for domain_dir in sorted(WORK_DIR.iterdir()):
              if not domain_dir.is_dir():
                  continue
              domain_name = domain_dir.name
              baseline_file = domain_dir / "baseline.json"
              current_file  = domain_dir / "current.json"

              if not baseline_file.exists() or not current_file.exists():
                  print(f"\n  ⚠️ {domain_name}: Missing data files — skipping")
                  continue

              with open(baseline_file) as f: baseline_data = json.load(f)
              with open(current_file)  as f: current_data  = json.load(f)

              domain_metrics = DOMAIN_METRICS.get(domain_name, [])
              domain_findings = []

              print(f"\n  {'─'*55}")
              print(f"  📊 Domain: {domain_name.upper()}")
              print(f"  {'─'*55}")

              for metric_key, metric_label, unit, lower_is_better in domain_metrics:
                  b_metric = baseline_data.get("metrics", {}).get(metric_key, {})
                  c_metric = current_data.get("metrics", {}).get(metric_key, {})

                  b_samples = b_metric.get("samples", [])
                  c_samples = c_metric.get("samples", [])

                  if not b_samples or not c_samples:
                      continue

                  # ── Run detection ─────────────────────────────────────
                  if DETECTION_MODE == "ensemble" or DETECTION_MODE == "all":
                      result = ensemble_detect(
                          b_samples, c_samples,
                          metric_key, lower_is_better
                      )
                  elif DETECTION_MODE == "zscore":
                      z_r, z_s, z_c = zscore_detect(b_samples, c_samples)
                      _, pct_c, sev = percent_change_detect(b_samples, c_samples)
                      result = {
                          "is_regression": z_r,
                          "severity": sev,
                          "confidence_pct": z_c,
                          "change_pct": pct_c,
                          "baseline_mean": np.mean(b_samples),
                          "current_mean": np.mean(c_samples),
                          "change_abs": np.mean(c_samples) - np.mean(b_samples),
                          "direction": "regression" if np.mean(c_samples) > np.mean(b_samples) else "improvement",
                          "algorithms": {"zscore": {"zscore": z_s}},
                      }
                  elif DETECTION_MODE == "percent-change":
                      pct_r, pct_c, sev = percent_change_detect(
                          b_samples, c_samples, PCT_THRESH
                      )
                      result = {
                          "is_regression": pct_r,
                          "severity": sev,
                          "confidence_pct": min(99.0, abs(pct_c) * 2),
                          "change_pct": pct_c,
                          "baseline_mean": np.mean(b_samples),
                          "current_mean": np.mean(c_samples),
                          "change_abs": np.mean(c_samples) - np.mean(b_samples),
                          "direction": "regression" if pct_c > 0 else "improvement",
                          "algorithms": {},
                      }
                  else:
                      result = ensemble_detect(b_samples, c_samples,
                                               metric_key, lower_is_better)

                  # ── Classify ──────────────────────────────────────────
                  is_reg = result["is_regression"]
                  change_pct = result["change_pct"]

                  # Override severity if direction is improvement
                  if result["direction"] == "improvement":
                      is_reg = False
                      if abs(change_pct) >= 5:
                          improvement_count += 1

                  if is_reg:
                      regression_count += 1
                      sev = result.get("severity", "low")
                      if sev == "critical":   critical_count += 1
                      elif sev == "high":     high_count += 1
                      elif sev == "medium":   medium_count += 1
                      else:                   medium_low_count += 1

                  # ── Status icon ───────────────────────────────────────
                  if is_reg:
                      sev = result.get("severity","low")
                      icon = {"critical":"🚨","high":"❌","medium":"⚠️","low":"💛"}.get(sev,"⚠️")
                  else:
                      icon = "✅" if result["direction"] == "improvement" else "✅"

                  print(f"  {icon} {metric_label:30s} "
                        f"base={result['baseline_mean']:.1f} "
                        f"curr={result['current_mean']:.1f} "
                        f"Δ={change_pct:+.1f}% "
                        f"{'🚨 ' + result.get('severity','').upper() if is_reg else ''}")

                  finding = {
                      "id":             str(uuid.uuid4()),
                      "session_id":     SESSION_ID,
                      "domain":         domain_name,
                      "metric_key":     metric_key,
                      "metric_name":    metric_label,
                      "unit":           unit,
                      "lower_is_better":lower_is_better,
                      "baseline_mean":  result["baseline_mean"],
                      "current_mean":   result["current_mean"],
                      "change_pct":     result["change_pct"],
                      "change_abs":     result["change_abs"],
                      "severity":       result.get("severity","none"),
                      "direction":      result["direction"],
                      "is_regression":  is_reg,
                      "confidence_pct": result.get("confidence_pct",0),
                      "algorithm":      DETECTION_MODE,
                      "vote_ratio":     result.get("vote_ratio",0),
                      "votes":          result.get("votes",0),
                      "algorithms":     result.get("algorithms",{}),
                      "baseline_samples": b_samples[:10],
                      "current_samples":  c_samples[:10],
                  }
                  domain_findings.append(finding)
                  all_findings.append(finding)

              # Domain summary
              d_regressions = [f for f in domain_findings if f["is_regression"]]
              d_improvements= [f for f in domain_findings
                               if f["direction"]=="improvement" and not f["is_regression"]]
              domain_summaries.append({
                  "domain":       domain_name,
                  "total_metrics":len(domain_findings),
                  "regressions":  len(d_regressions),
                  "improvements": len(d_improvements),
                  "findings":     domain_findings,
              })

          # ── Overall result ────────────────────────────────────────────
          if critical_count > 0:     overall_status = "critical"
          elif high_count > 0:       overall_status = "high"
          elif regression_count > 0: overall_status = "medium"
          else:                      overall_status = "pass"

          worst = max(
              all_findings,
              key=lambda f: abs(f["change_pct"]) if f["is_regression"] else 0,
              default=None
          )
          worst_str = ""
          if worst and worst["is_regression"]:
              worst_str = f"{worst['domain']}/{worst['metric_key']}:{worst['change_pct']:+.1f}%"

          print(f"\n{'═'*65}")
          print(f"  📊 ANALYSIS SUMMARY")
          print(f"{'═'*65}")
          print(f"  Total metrics analyzed: {len(all_findings)}")
          print(f"  Regressions detected:   {regression_count}")
          print(f"  Improvements detected:  {improvement_count}")
          print(f"  Critical:               {critical_count} 🚨")
          print(f"  High:                   {high_count} ❌")
          print(f"  Medium:                 {medium_count} ⚠️")
          print(f"  Overall status:         {overall_status.upper()}")
          print(f"{'═'*65}")

          # ── Write analysis results ────────────────────────────────────
          analysis = {
              "session_id":      SESSION_ID,
              "baseline_sha":    BASELINE_SHA,
              "compare_sha":     COMPARE_SHA,
              "git_ref":         GIT_REF,
              "detection_mode":  DETECTION_MODE,
              "timestamp":       datetime.now(timezone.utc).isoformat(),
              "summary": {
                  "overall_status":  overall_status,
                  "total_metrics":   len(all_findings),
                  "regression_count":regression_count,
                  "improvement_count":improvement_count,
                  "critical_count":  critical_count,
                  "high_count":      high_count,
                  "medium_count":    medium_count,
              },
              "worst_regression": worst_str,
              "domain_summaries": domain_summaries,
              "all_findings":     all_findings,
          }

          analysis_path = REPORTS_DIR / "analysis.json"
          with open(analysis_path, "w") as f:
              json.dump(analysis, f, indent=2)

          # ── GitHub Outputs ────────────────────────────────────────────
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"regression_count={regression_count}\n")
              out.write(f"improvement_count={improvement_count}\n")
              out.write(f"critical_count={critical_count}\n")
              out.write(f"high_count={high_count}\n")
              out.write(f"medium_count={medium_count}\n")
              out.write(f"overall_status={overall_status}\n")
              out.write(f"worst_regression={worst_str}\n")
              out.write(f"analysis_path={analysis_path}\n")

          ANALYSIS_EOF

      - name: "📤 Upload analysis"
        uses: actions/upload-artifact@v6
        with:
          name: "regress-analysis-${{ needs.bootstrap.outputs.session_id }}"
          path: "${{ env.REPORTS_DIR }}/analysis.json"
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4 — Generate visualizations
  # ─────────────────────────────────────────────────────────────────────────
  visualize:
    name: "📊 Visualize · Regression Charts & Heatmaps"
    needs: [bootstrap, analyze]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📦 Install visualization stack"
        run: |
          pip3 install --quiet --user \
            numpy==2.1.2 \
            scipy==1.14.1 \
            pandas==2.2.3 \
            matplotlib==3.9.2 \
            seaborn==0.13.2 \
            rich==13.9.2 \
            2>/dev/null || true

      - name: "📥 Download analysis"
        uses: actions/download-artifact@v7
        with:
          name: "regress-analysis-${{ needs.bootstrap.outputs.session_id }}"
          path: "${{ env.REPORTS_DIR }}"

      - name: "📥 Download domain data"
        uses: actions/download-artifact@v7
        with:
          pattern: "regress-data-*-${{ needs.bootstrap.outputs.session_id }}"
          path: "${{ env.WORK_DIR }}/collected"
          merge-multiple: true

      - name: "🎨 Generate comprehensive visualizations"
        run: |
          mkdir -p "${REPORTS_DIR}/charts"

          python3 << 'VIZ_EOF'
          """
          ASH Regression Visualization Engine v5.0
          Generates premium dark-themed charts using Catppuccin Mocha palette.
          """
          import json
          import math
          import os
          import glob
          from pathlib import Path
          from typing import Any, Dict, List

          import numpy as np
          import matplotlib
          matplotlib.use('Agg')
          import matplotlib.pyplot as plt
          import matplotlib.gridspec as gridspec
          import matplotlib.patches as mpatches
          import matplotlib.colors as mcolors
          from matplotlib.patches import FancyBboxPatch, FancyArrowPatch

          try:
              import seaborn as sns
              SEABORN = True
          except ImportError:
              SEABORN = False

          REPORTS_DIR = Path(os.environ["REPORTS_DIR"])
          WORK_DIR    = Path(os.environ["WORK_DIR"]) / "collected"
          CHARTS_DIR  = REPORTS_DIR / "charts"
          CHARTS_DIR.mkdir(parents=True, exist_ok=True)

          # ── Catppuccin Mocha palette ────────────────────────────────────
          P = {
              "bg":        "#1e1e2e",
              "mantle":    "#181825",
              "crust":     "#11111b",
              "surface0":  "#313244",
              "surface1":  "#45475a",
              "surface2":  "#585b70",
              "overlay0":  "#6c7086",
              "overlay1":  "#7f849c",
              "overlay2":  "#9399b2",
              "subtext0":  "#a6adc8",
              "subtext1":  "#bac2de",
              "text":      "#cdd6f4",
              "lavender":  "#b4befe",
              "blue":      "#89b4fa",
              "sapphire":  "#74c7ec",
              "sky":       "#89dceb",
              "teal":      "#94e2d5",
              "green":     "#a6e3a1",
              "yellow":    "#f9e2af",
              "peach":     "#fab387",
              "maroon":    "#eba0ac",
              "red":       "#f38ba8",
              "mauve":     "#cba6f7",
              "pink":      "#f5c2e7",
              "flamingo":  "#f2cdcd",
              "rosewater": "#f5e0dc",
          }

          SEVERITY_COLORS = {
              "critical":    P["red"],
              "high":        P["maroon"],
              "medium":      P["yellow"],
              "low":         P["peach"],
              "improvement": P["green"],
              "stable":      P["teal"],
              "none":        P["surface2"],
          }

          def apply_dark_theme(ax, grid_alpha=0.08):
              ax.set_facecolor(P["surface0"])
              for sp in ax.spines.values():
                  sp.set_edgecolor(P["surface2"])
                  sp.set_alpha(0.5)
              ax.tick_params(colors=P["text"], labelsize=8.5)
              ax.xaxis.label.set_color(P["text"])
              ax.yaxis.label.set_color(P["text"])
              ax.title.set_color(P["text"])
              ax.grid(True, alpha=grid_alpha, color=P["text"], zorder=1,
                      linestyle="--", linewidth=0.6)

          # ── Load analysis ───────────────────────────────────────────────
          with open(REPORTS_DIR / "analysis.json") as f:
              analysis = json.load(f)

          findings   = analysis["all_findings"]
          summary    = analysis["summary"]
          domains    = analysis["domain_summaries"]
          session_id = analysis["session_id"]

          # ════════════════════════════════════════════════════════════════
          # CHART 1: Master Regression Dashboard (6 panels)
          # ════════════════════════════════════════════════════════════════
          fig = plt.figure(figsize=(24, 18))
          fig.patch.set_facecolor(P["bg"])
          gs  = gridspec.GridSpec(
              3, 3,
              hspace=0.40, wspace=0.30,
              left=0.05, right=0.97,
              top=0.88,  bottom=0.05
          )

          ax_heatmap  = fig.add_subplot(gs[0, :2])  # Wide heatmap
          ax_summary  = fig.add_subplot(gs[0, 2])   # Summary gauge
          ax_forest   = fig.add_subplot(gs[1, :2])  # Forest plot
          ax_algo     = fig.add_subplot(gs[1, 2])   # Algorithm votes
          ax_dist     = fig.add_subplot(gs[2, :2])  # Distribution compare
          ax_trend    = fig.add_subplot(gs[2, 2])   # Severity breakdown

          overall_status = summary["overall_status"]
          STATUS_COLOR = {
              "pass":     P["green"],
              "medium":   P["yellow"],
              "high":     P["peach"],
              "critical": P["red"],
          }.get(overall_status, P["mauve"])

          # ────────────────────────────────────────────────────────────────
          # Panel 1: Regression Severity Heatmap
          # ────────────────────────────────────────────────────────────────
          apply_dark_theme(ax_heatmap, grid_alpha=0.04)
          ax_heatmap.set_facecolor(P["mantle"])

          if findings:
              # Build grid: domains × metrics
              domain_names = list(dict.fromkeys(f["domain"] for f in findings))
              metric_names = list(dict.fromkeys(f["metric_key"] for f in findings))

              # Build change_pct matrix
              grid = np.full((len(domain_names), len(metric_names)), np.nan)
              for f in findings:
                  di = domain_names.index(f["domain"])
                  mi = metric_names.index(f["metric_key"])
                  val = f["change_pct"] if f["is_regression"] else -abs(f["change_pct"])
                  grid[di, mi] = val

              # Custom diverging colormap (green ← 0 → red)
              cmap = mcolors.LinearSegmentedColormap.from_list(
                  "regression",
                  [
                      (0.00, P["green"]),
                      (0.35, P["teal"]),
                      (0.50, P["surface2"]),
                      (0.65, P["yellow"]),
                      (0.80, P["peach"]),
                      (1.00, P["red"]),
                  ]
              )
              cmap.set_bad(P["surface1"])  # NaN = no data

              max_abs = max(np.nanmax(np.abs(grid)), 10.0)
              im = ax_heatmap.imshow(
                  grid,
                  cmap=cmap,
                  aspect="auto",
                  vmin=-max_abs,
                  vmax=max_abs,
              )

              # Cell annotations
              for i in range(len(domain_names)):
                  for j in range(len(metric_names)):
                      val = grid[i, j]
                      if np.isnan(val):
                          continue
                      bg_bright = abs(val) > max_abs * 0.6
                      txt_color = P["crust"] if bg_bright else P["text"]
                      sign = "+" if val > 0 else ""
                      ax_heatmap.text(
                          j, i, f"{sign}{val:.1f}%",
                          ha="center", va="center",
                          color=txt_color,
                          fontsize=8.5, fontweight="bold"
                      )

              ax_heatmap.set_xticks(range(len(metric_names)))
              ax_heatmap.set_xticklabels(
                  [m.replace("_ms","").replace("_"," ").title()[:14]
                   for m in metric_names],
                  rotation=30, ha="right", fontsize=8.5,
                  color=P["text"]
              )
              ax_heatmap.set_yticks(range(len(domain_names)))
              ax_heatmap.set_yticklabels(
                  [d.replace("-"," ").title() for d in domain_names],
                  fontsize=9, color=P["text"]
              )

              cbar = plt.colorbar(im, ax=ax_heatmap, shrink=0.85, pad=0.01)
              cbar.ax.tick_params(colors=P["text"], labelsize=8)
              cbar.set_label("Change % (+ = regression)", color=P["text"], fontsize=9)
              for lbl in cbar.ax.get_yticklabels():
                  lbl.set_color(P["text"])

          ax_heatmap.set_title(
              "📊 Regression Heatmap — All Domains & Metrics",
              color=P["text"], fontsize=12, fontweight="bold", pad=12
          )

          # ────────────────────────────────────────────────────────────────
          # Panel 2: Overall status gauge
          # ────────────────────────────────────────────────────────────────
          ax_summary.set_facecolor(P["surface0"])
          ax_summary.axis("off")

          # Outer ring
          theta_bg = np.linspace(np.pi, 0, 200)
          ax_summary.plot(
              0.5 + 0.38 * np.cos(theta_bg),
              0.62 + 0.38 * np.sin(theta_bg),
              color=P["surface2"], linewidth=28,
              solid_capstyle="round", alpha=0.55,
              transform=ax_summary.transAxes
          )

          # Status zones (pass/medium/high/critical)
          zones = [
              (0.0, 0.25, P["green"]),
              (0.25, 0.50, P["yellow"]),
              (0.50, 0.75, P["peach"]),
              (0.75, 1.00, P["red"]),
          ]
          for z_s, z_e, z_col in zones:
              t_fill = np.linspace(
                  np.pi - z_s * np.pi,
                  np.pi - z_e * np.pi,
                  60
              )
              ax_summary.plot(
                  0.5 + 0.38 * np.cos(t_fill),
                  0.62 + 0.38 * np.sin(t_fill),
                  color=z_col, linewidth=10,
                  solid_capstyle="butt", alpha=0.35,
                  transform=ax_summary.transAxes
              )

          # Fill arc based on regression severity
          severity_positions = {"pass":0.0,"medium":0.38,"high":0.62,"critical":0.88}
          fill_pos = severity_positions.get(overall_status, 0.0)
          if fill_pos > 0:
              t_filled = np.linspace(np.pi, np.pi - fill_pos * np.pi, 100)
              ax_summary.plot(
                  0.5 + 0.38 * np.cos(t_filled),
                  0.62 + 0.38 * np.sin(t_filled),
                  color=STATUS_COLOR, linewidth=28,
                  solid_capstyle="round", alpha=0.92,
                  transform=ax_summary.transAxes
              )

          # Center content
          ax_summary.text(
              0.5, 0.51,
              "🚨" if overall_status == "critical" else
              "❌" if overall_status == "high" else
              "⚠️" if overall_status == "medium" else "✅",
              transform=ax_summary.transAxes,
              ha="center", fontsize=28,
          )
          ax_summary.text(
              0.5, 0.36,
              overall_status.upper(),
              transform=ax_summary.transAxes,
              ha="center", color=STATUS_COLOR,
              fontsize=16, fontweight="bold"
          )

          # Stats grid
          stat_rows = [
              ("🔍 Analyzed",   str(summary["total_metrics"])),
              ("🚨 Critical",   str(summary["critical_count"])),
              ("❌ High",       str(summary["high_count"])),
              ("⚠️  Medium",     str(summary["medium_count"])),
              ("📈 Improved",   str(summary["improvement_count"])),
              ("📉 Regressions",str(summary["regression_count"])),
          ]
          y_pos = 0.23
          for label, value in stat_rows:
              ax_summary.text(0.15, y_pos, label,
                              transform=ax_summary.transAxes,
                              color=P["subtext0"], fontsize=8.5, va="center")
              ax_summary.text(0.85, y_pos, value,
                              transform=ax_summary.transAxes,
                              color=P["text"], fontsize=8.5,
                              fontweight="bold", ha="right", va="center")
              y_pos -= 0.036

          ax_summary.set_title(
              "Overall Status",
              color=P["text"], fontsize=11, fontweight="bold", pad=10
          )

          # ────────────────────────────────────────────────────────────────
          # Panel 3: Forest plot (change% with CI)
          # ────────────────────────────────────────────────────────────────
          apply_dark_theme(ax_forest)

          regressions_only = [f for f in findings
                               if f["is_regression"] or abs(f["change_pct"]) > 2]
          regressions_only.sort(key=lambda f: f["change_pct"], reverse=True)

          if regressions_only:
              n = len(regressions_only)
              y_pos_vals = list(range(n))
              changes = [f["change_pct"] for f in regressions_only]
              labels  = [f"{f['domain'][:10]}/{f['metric_key'][:12]}"
                         for f in regressions_only]
              colors_fp = [
                  SEVERITY_COLORS.get(f["severity"], P["surface2"])
                  if f["is_regression"]
                  else P["green"]
                  for f in regressions_only
              ]
              # Error bars from confidence
              errors = [
                  abs(f["change_pct"]) * (1 - f["confidence_pct"]/100)
                  for f in regressions_only
              ]

              ax_forest.barh(
                  y_pos_vals, changes,
                  xerr=errors,
                  color=colors_fp, alpha=0.80,
                  height=0.65, zorder=3,
                  edgecolor=P["crust"], linewidth=0.8,
                  error_kw={"ecolor": P["overlay1"], "capsize": 4,
                             "elinewidth": 1.5, "capthick": 1.5}
              )

              ax_forest.axvline(0, color=P["text"], linewidth=1.5,
                                linestyle="-", alpha=0.4, zorder=4)
              ax_forest.axvline(float(os.environ.get("PERCENT_THRESHOLD","15")),
                                color=P["red"], linewidth=1.5,
                                linestyle="--", alpha=0.6, zorder=4,
                                label=f"Threshold: {os.environ.get('PERCENT_THRESHOLD','15')}%")
              ax_forest.axvline(float(os.environ.get("CRITICAL_THRESHOLD_PCT","30")),
                                color=P["maroon"], linewidth=1.2,
                                linestyle=":", alpha=0.5, zorder=4,
                                label=f"Critical: {os.environ.get('CRITICAL_THRESHOLD_PCT','30')}%")

              # Value labels
              for i, (f, change) in enumerate(zip(regressions_only, changes)):
                  sign = "+" if change > 0 else ""
                  ax_forest.text(
                      change + (abs(change) * 0.04 + 0.5) * (1 if change >= 0 else -1),
                      i,
                      f"{sign}{change:.1f}%",
                      va="center",
                      ha="left" if change >= 0 else "right",
                      color=colors_fp[i],
                      fontsize=8, fontweight="bold"
                  )

              ax_forest.set_yticks(y_pos_vals)
              ax_forest.set_yticklabels(labels, fontsize=8, color=P["text"])
              ax_forest.set_xlabel("Change % (+ = slower/worse)", color=P["text"], fontsize=9.5)
              ax_forest.legend(facecolor=P["bg"], labelcolor=P["text"],
                               fontsize=8.5, framealpha=0.9)

          ax_forest.set_title(
              "🌲 Forest Plot — Performance Changes with Confidence Intervals",
              color=P["text"], fontsize=11, fontweight="bold", pad=10
          )

          # ────────────────────────────────────────────────────────────────
          # Panel 4: Algorithm agreement (vote heatmap)
          # ────────────────────────────────────────────────────────────────
          apply_dark_theme(ax_algo)
          ax_algo.set_facecolor(P["mantle"])

          reg_findings = [f for f in findings if f["is_regression"]][:8]
          ALGO_NAMES = ["zscore","mann_whitney","ewma","percent_change",
                        "iqr","confidence_interval","changepoint"]

          if reg_findings:
              vote_grid = np.zeros((len(reg_findings), len(ALGO_NAMES)))
              for i, f in enumerate(reg_findings):
                  algos = f.get("algorithms", {})
                  for j, algo in enumerate(ALGO_NAMES):
                      vote_grid[i, j] = 1.0 if algos.get(algo, {}).get("regression", False) else 0.0

              cmap_vote = mcolors.LinearSegmentedColormap.from_list(
                  "votes", [(0.0, P["surface2"]), (1.0, P["red"])]
              )
              ax_algo.imshow(vote_grid, cmap=cmap_vote, aspect="auto",
                             vmin=0, vmax=1)

              for i in range(len(reg_findings)):
                  for j in range(len(ALGO_NAMES)):
                      symbol = "✓" if vote_grid[i,j] > 0.5 else "·"
                      color  = P["crust"] if vote_grid[i,j] > 0.5 else P["surface2"]
                      ax_algo.text(j, i, symbol, ha="center", va="center",
                                   color=color, fontsize=11, fontweight="bold")

              ax_algo.set_xticks(range(len(ALGO_NAMES)))
              ax_algo.set_xticklabels(
                  [a.replace("_","\n")[:12] for a in ALGO_NAMES],
                  fontsize=7, color=P["text"], rotation=0
              )
              ax_algo.set_yticks(range(len(reg_findings)))
              ax_algo.set_yticklabels(
                  [f"{f['domain'][:8]}/{f['metric_key'][:10]}"
                   for f in reg_findings],
                  fontsize=7.5, color=P["text"]
              )

          ax_algo.set_title(
              "🗳️ Algorithm Agreement\n(✓ = voted regression)",
              color=P["text"], fontsize=11, fontweight="bold", pad=10
          )

          # ────────────────────────────────────────────────────────────────
          # Panel 5: Distribution comparison (violin/box)
          # ────────────────────────────────────────────────────────────────
          apply_dark_theme(ax_dist)

          worst_regressions = sorted(
              [f for f in findings if f["is_regression"]],
              key=lambda f: f["change_pct"], reverse=True
          )[:5]

          if worst_regressions:
              positions = []
              labels_dist = []
              data_groups = []
              tick_labels = []
              colors_dist = []

              x_offset = 0
              for i, f in enumerate(worst_regressions):
                  b_samp = f.get("baseline_samples", [])
                  c_samp = f.get("current_samples", [])
                  if not b_samp or not c_samp:
                      continue
                  sev_color = SEVERITY_COLORS.get(f["severity"], P["surface2"])
                  label = f"{f['metric_key'][:12]}"
                  ax_dist.boxplot(
                      [b_samp],
                      positions=[x_offset],
                      widths=0.35,
                      patch_artist=True,
                      boxprops={"facecolor": P["blue"], "alpha": 0.65,
                                 "linewidth": 1.5},
                      whiskerprops={"color": P["text"], "linewidth": 1.5},
                      capprops={"color": P["text"], "linewidth": 2},
                      medianprops={"color": P["crust"], "linewidth": 2.5},
                      flierprops={"marker": "o", "color": P["blue"],
                                   "markersize": 4, "alpha": 0.5},
                      showfliers=True,
                  )
                  ax_dist.boxplot(
                      [c_samp],
                      positions=[x_offset + 0.45],
                      widths=0.35,
                      patch_artist=True,
                      boxprops={"facecolor": sev_color, "alpha": 0.75,
                                 "linewidth": 1.5},
                      whiskerprops={"color": P["text"], "linewidth": 1.5},
                      capprops={"color": P["text"], "linewidth": 2},
                      medianprops={"color": P["crust"], "linewidth": 2.5},
                      flierprops={"marker": "o", "color": sev_color,
                                   "markersize": 4, "alpha": 0.5},
                      showfliers=True,
                  )
                  ax_dist.annotate(
                      f"+{f['change_pct']:.1f}% {f['severity']}",
                      xy=(x_offset + 0.22, max(c_samp if c_samp else [0])),
                      color=sev_color, fontsize=7.5,
                      fontweight="bold", ha="center",
                  )
                  tick_labels.extend([
                      (x_offset,       f"{label}\nbaseline"),
                      (x_offset + 0.45, f"{label}\ncurrent"),
                  ])
                  x_offset += 1.1

              if tick_labels:
                  ax_dist.set_xticks([pos for pos, _ in tick_labels])
                  ax_dist.set_xticklabels(
                      [lbl for _, lbl in tick_labels],
                      fontsize=7, color=P["text"], rotation=25, ha="right"
                  )

              # Legend
              baseline_patch = mpatches.Patch(
                  color=P["blue"], alpha=0.65, label="Baseline"
              )
              current_patch = mpatches.Patch(
                  color=P["red"], alpha=0.75, label="Current (regressed)"
              )
              ax_dist.legend(
                  handles=[baseline_patch, current_patch],
                  facecolor=P["bg"], labelcolor=P["text"],
                  fontsize=8.5, framealpha=0.9, loc="upper left"
              )

          ax_dist.set_ylabel("Metric Value", color=P["text"], fontsize=9.5)
          ax_dist.set_title(
              "🎻 Distribution Comparison — Top 5 Regressions",
              color=P["text"], fontsize=11, fontweight="bold", pad=10
          )

          # ────────────────────────────────────────────────────────────────
          # Panel 6: Severity breakdown donut
          # ────────────────────────────────────────────────────────────────
          ax_trend.set_facecolor(P["surface0"])
          ax_trend.axis("off")

          sev_data = {
              "Critical 🚨":  (summary["critical_count"],  P["red"]),
              "High ❌":       (summary["high_count"],      P["maroon"]),
              "Medium ⚠️":     (summary["medium_count"],    P["yellow"]),
              "Improved 📈":   (summary["improvement_count"], P["green"]),
              "Stable ✅":     (
                  max(0, summary["total_metrics"]
                      - summary["regression_count"]
                      - summary["improvement_count"]),
                  P["teal"]
              ),
          }

          sizes  = [v for v, _ in sev_data.values() if v > 0]
          colors_d = [c for _, (v, c) in sev_data.items() if v > 0]
          labels_d = [k for k, (v, _) in sev_data.items() if v > 0]

          if sum(sizes) > 0:
              wedges, texts, autotexts = ax_trend.pie(
                  sizes,
                  colors=colors_d,
                  labels=None,
                  autopct=lambda p: f"{p:.1f}%" if p > 5 else "",
                  startangle=90,
                  wedgeprops={"linewidth": 3, "edgecolor": P["bg"],
                               "width": 0.58},   # Donut
                  pctdistance=0.78,
                  radius=0.88,
              )
              for at in autotexts:
                  at.set_color(P["crust"])
                  at.set_fontsize(9)
                  at.set_fontweight("bold")

              ax_trend.legend(
                  wedges, labels_d,
                  facecolor=P["bg"], labelcolor=P["text"],
                  fontsize=8.5, loc="lower center",
                  bbox_to_anchor=(0.5, -0.08),
                  ncol=2, framealpha=0.85
              )
          else:
              ax_trend.text(0.5, 0.5, "No data",
                            transform=ax_trend.transAxes,
                            ha="center", va="center",
                            color=P["subtext0"], fontsize=12)

          ax_trend.set_title(
              "🍩 Severity Breakdown",
              color=P["text"], fontsize=11, fontweight="bold", pad=10
          )

          # ── Global title ────────────────────────────────────────────────
          status_emoji = {"pass":"✅","medium":"⚠️","high":"❌","critical":"🚨"}
          fig.suptitle(
              f"📉 ASH Performance Regression Detection Report\n"
              f"{status_emoji.get(overall_status,'📊')} "
              f"Status: {overall_status.upper()}  ·  "
              f"{summary['regression_count']} regression(s)  ·  "
              f"{summary['critical_count']} critical  ·  "
              f"{summary['improvement_count']} improvement(s)  ·  "
              f"SHA: {analysis['compare_sha'][:8]}",
              color=STATUS_COLOR,
              fontsize=14,
              fontweight="bold",
              y=0.97
          )

          plt.savefig(
              CHARTS_DIR / "regression-dashboard.png",
              dpi=160, bbox_inches="tight",
              facecolor=P["bg"], edgecolor="none"
          )
          plt.close()
          print("  📊 Master dashboard saved")

          # ════════════════════════════════════════════════════════════════
          # CHART 2: Per-domain timeline trend (if history available)
          # ════════════════════════════════════════════════════════════════
          fig2, axes2 = plt.subplots(2, 3, figsize=(20, 10))
          fig2.patch.set_facecolor(P["bg"])
          axes2 = axes2.flatten()

          domain_names = list(dict.fromkeys(f["domain"] for f in findings))
          for ax_idx, domain_name in enumerate(domain_names[:6]):
              ax = axes2[ax_idx]
              apply_dark_theme(ax)

              domain_findings = [f for f in findings if f["domain"] == domain_name]
              if not domain_findings:
                  ax.text(0.5, 0.5, f"No data\n{domain_name}",
                          transform=ax.transAxes, ha="center", va="center",
                          color=P["subtext0"], fontsize=11)
                  continue

              # Sort by change magnitude
              domain_findings.sort(key=lambda f: f["change_pct"], reverse=True)
              labels_d2 = [f["metric_key"].replace("_"," ")[:16]
                           for f in domain_findings]
              changes_d2 = [f["change_pct"] for f in domain_findings]
              colors_d2  = [
                  SEVERITY_COLORS.get(f["severity"], P["surface2"])
                  if f["is_regression"] else P["green"]
                  for f in domain_findings
              ]

              bars = ax.barh(
                  labels_d2, changes_d2,
                  color=colors_d2, alpha=0.82,
                  height=0.6, zorder=3,
                  edgecolor=P["crust"], linewidth=0.8
              )
              ax.axvline(0, color=P["text"], linewidth=1.0, alpha=0.4, zorder=4)
              ax.axvline(float(os.environ.get("PERCENT_THRESHOLD","15")),
                         color=P["red"], linewidth=1.0, linestyle="--",
                         alpha=0.5, zorder=4)
              ax.axvline(-float(os.environ.get("PERCENT_THRESHOLD","15")),
                         color=P["green"], linewidth=1.0, linestyle="--",
                         alpha=0.5, zorder=4)

              for bar, change in zip(bars, changes_d2):
                  sign = "+" if change > 0 else ""
                  ax.text(
                      change + (0.3 if change >= 0 else -0.3),
                      bar.get_y() + bar.get_height()/2,
                      f"{sign}{change:.1f}%",
                      va="center",
                      ha="left" if change >= 0 else "right",
                      color=P["text"], fontsize=7.5, fontweight="bold"
                  )

              reg_cnt = sum(1 for f in domain_findings if f["is_regression"])
              imp_cnt = sum(1 for f in domain_findings
                            if f["direction"]=="improvement" and not f["is_regression"])
              ax.set_title(
                  f"{domain_name.replace('-',' ').title()}\n"
                  f"{reg_cnt} regression(s)  ·  {imp_cnt} improvement(s)",
                  color=P["text"], fontsize=10, fontweight="bold", pad=8
              )
              ax.set_xlabel("Change %", color=P["text"], fontsize=9)

          # Hide unused subplots
          for i in range(len(domain_names), 6):
              axes2[i].set_visible(False)

          fig2.suptitle(
              "📊 Per-Domain Performance Changes",
              color=P["text"], fontsize=13, fontweight="bold", y=1.01
          )
          plt.tight_layout()
          plt.savefig(
              CHARTS_DIR / "per-domain-changes.png",
              dpi=150, bbox_inches="tight", facecolor=P["bg"]
          )
          plt.close()
          print("  📊 Per-domain chart saved")

          # ════════════════════════════════════════════════════════════════
          # CHART 3: Confidence vs Impact scatter
          # ════════════════════════════════════════════════════════════════
          fig3, ax3 = plt.subplots(figsize=(14, 8))
          fig3.patch.set_facecolor(P["bg"])
          apply_dark_theme(ax3)

          if findings:
              for f in findings:
                  x = f.get("confidence_pct", 50)
                  y = abs(f["change_pct"])
                  size = max(30, min(300, y * 8))
                  color = (SEVERITY_COLORS.get(f["severity"], P["surface2"])
                           if f["is_regression"] else P["green"])
                  marker = "v" if f["direction"] == "regression" else "^"
                  ax3.scatter(x, y, s=size, c=color, marker=marker,
                              alpha=0.78, zorder=3, linewidths=0.5,
                              edgecolors=P["crust"])
                  if f["is_regression"] and y > 10:
                      ax3.annotate(
                          f"{f['metric_key'][:14]}",
                          (x, y),
                          xytext=(6, 3), textcoords="offset points",
                          color=color, fontsize=7.5, fontweight="bold",
                          alpha=0.9
                      )

              # Threshold lines
              ax3.axhline(float(os.environ.get("PERCENT_THRESHOLD","15")),
                          color=P["red"], linewidth=1.5, linestyle="--",
                          alpha=0.6, label=f"Regression threshold ({os.environ.get('PERCENT_THRESHOLD','15')}%)")
              ax3.axhline(float(os.environ.get("CRITICAL_THRESHOLD_PCT","30")),
                          color=P["maroon"], linewidth=1.2, linestyle=":",
                          alpha=0.5, label=f"Critical threshold ({os.environ.get('CRITICAL_THRESHOLD_PCT','30')}%)")
              ax3.axvline(80, color=P["yellow"], linewidth=1.2, linestyle="--",
                          alpha=0.5, label="High confidence (80%)")

              # Quadrant backgrounds
              ax3.axhspan(float(os.environ.get("PERCENT_THRESHOLD","15")),
                          max(abs(f["change_pct"]) for f in findings) * 1.2,
                          alpha=0.04, color=P["red"])

              legend_elements = [
                  mpatches.Patch(color=P["red"],      label="Critical regression"),
                  mpatches.Patch(color=P["maroon"],   label="High regression"),
                  mpatches.Patch(color=P["yellow"],   label="Medium regression"),
                  mpatches.Patch(color=P["green"],    label="Improvement"),
                  plt.scatter([], [], marker="v", c=P["red"],   s=60, label="Slower/worse"),
                  plt.scatter([], [], marker="^", c=P["green"], s=60, label="Faster/better"),
              ]
              ax3.legend(handles=legend_elements, facecolor=P["bg"],
                         labelcolor=P["text"], fontsize=8.5,
                         framealpha=0.9, loc="upper left")

          ax3.set_xlabel("Detection Confidence (%)", color=P["text"], fontsize=11)
          ax3.set_ylabel("Magnitude of Change (%)", color=P["text"], fontsize=11)
          ax3.set_xlim(0, 105)
          ax3.set_ylim(0, None)
          ax3.set_title(
              "🎯 Confidence vs Impact Scatter Plot\n"
              "▼ = performance regression  ·  ▲ = improvement  ·  "
              "size ∝ magnitude",
              color=P["text"], fontsize=12, fontweight="bold", pad=12
          )
          plt.tight_layout()
          plt.savefig(
              CHARTS_DIR / "confidence-vs-impact.png",
              dpi=150, bbox_inches="tight", facecolor=P["bg"]
          )
          plt.close()
          print("  📊 Confidence-impact scatter saved")

          print(f"\n  ✅ All charts saved to: {CHARTS_DIR}")
          print(f"  📁 Files:")
          for f in sorted(CHARTS_DIR.iterdir()):
              print(f"     {f.name}  ({f.stat().st_size//1024}KB)")
          VIZ_EOF

      - name: "📤 Upload charts"
        uses: actions/upload-artifact@v6
        with:
          name: "regress-charts-${{ needs.bootstrap.outputs.session_id }}"
          path: "${{ env.REPORTS_DIR }}/charts/"
          retention-days: 90
          compression-level: 6

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 5 — Generate report & post notifications
  # ─────────────────────────────────────────────────────────────────────────
  report:
    name: "📋 Report · Notifications & Actions"
    needs: [bootstrap, analyze, visualize]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📦 Install tools"
        run: |
          pip3 install --quiet --user \
            jinja2==3.1.4 \
            rich==13.9.2 \
            tabulate==0.9.0 \
            numpy==2.1.2 \
            matplotlib==3.9.2 \
            2>/dev/null || true
          sudo apt-get install -y --no-install-recommends jq 2>/dev/null || true

      - name: "📥 Download analysis"
        uses: actions/download-artifact@v7
        with:
          name: "regress-analysis-${{ needs.bootstrap.outputs.session_id }}"
          path: "${{ env.REPORTS_DIR }}"

      - name: "📋 Generate comprehensive markdown report"
        id: report
        run: |
          mkdir -p "${REPORTS_DIR}"

          python3 << 'REPORT_EOF'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          REPORTS_DIR   = Path(os.environ["REPORTS_DIR"])
          SESSION_ID    = "${{ needs.bootstrap.outputs.session_id }}"
          BASELINE_SHA  = "${{ needs.bootstrap.outputs.baseline_sha }}"
          COMPARE_SHA   = "${{ needs.bootstrap.outputs.compare_sha }}"
          GIT_REF       = os.environ.get("GITHUB_REF", "unknown")

          with open(REPORTS_DIR / "analysis.json") as f:
              analysis = json.load(f)

          findings = analysis["all_findings"]
          summary  = analysis["summary"]
          domains  = analysis["domain_summaries"]
          overall  = summary["overall_status"]

          STATUS_EMOJI = {
              "pass":     "✅",
              "medium":   "⚠️",
              "high":     "❌",
              "critical": "🚨",
          }
          SEV_EMOJI = {
              "critical": "🚨",
              "high":     "❌",
              "medium":   "⚠️",
              "low":      "💛",
              "none":     "✅",
          }

          status_icon = STATUS_EMOJI.get(overall, "📊")

          # ── Executive summary ──────────────────────────────────────────
          lines = [
              f"# 📉 ASH Performance Regression Report",
              f"",
              f"> {status_icon} **Status: `{overall.upper()}`**"
              f"  &nbsp;·&nbsp;  "
              f"SHA `{COMPARE_SHA[:8]}` vs `{BASELINE_SHA[:8]}`"
              f"  &nbsp;·&nbsp;  "
              f"`{analysis['timestamp']}`",
              f"",
              f"## 📊 Executive Summary",
              f"",
              f"| Metric | Value |",
              f"|--------|-------|",
              f"| 🔍 Total Metrics Analyzed | `{summary['total_metrics']}` |",
              f"| 📉 Total Regressions | `{summary['regression_count']}` |",
              f"| 🚨 Critical | `{summary['critical_count']}` |",
              f"| ❌ High | `{summary['high_count']}` |",
              f"| ⚠️ Medium | `{summary['medium_count']}` |",
              f"| 📈 Improvements | `{summary['improvement_count']}` |",
              f"| 🔬 Detection Mode | `{analysis['detection_mode']}` |",
              f"| 📍 Baseline | `{BASELINE_SHA[:12]}` |",
              f"| 📍 Current | `{COMPARE_SHA[:12]}` |",
              f"",
          ]

          # ── Critical regressions callout ───────────────────────────────
          critical = [f for f in findings
                      if f["is_regression"] and f["severity"] == "critical"]
          if critical:
              lines += [
                  f"## 🚨 Critical Regressions — Immediate Action Required",
                  f"",
              ]
              for f in critical:
                  lines += [
                      f"### 🚨 `{f['domain']}/{f['metric_key']}`",
                      f"",
                      f"| Property | Value |",
                      f"|----------|-------|",
                      f"| Domain | `{f['domain']}` |",
                      f"| Metric | `{f['metric_key']}` — {f['metric_name']} |",
                      f"| Baseline | `{f['baseline_mean']:.2f} {f['unit']}` |",
                      f"| Current | `{f['current_mean']:.2f} {f['unit']}` |",
                      f"| Change | 🚨 **`+{f['change_pct']:.1f}%`** "
                      f"(`+{f['change_abs']:.2f} {f['unit']}`) |",
                      f"| Confidence | `{f['confidence_pct']:.1f}%` |",
                      f"| Algorithm | `{f['algorithm']}` "
                      f"({f.get('votes',0)}/{f.get('votes',0)+1} votes) |",
                      f"",
                  ]
          # ── All findings table ─────────────────────────────────────────
          regressions = [f for f in findings if f["is_regression"]]
          if regressions:
              lines += [
                  f"## 📉 All Detected Regressions",
                  f"",
                  f"| Severity | Domain | Metric | Baseline | Current | Change | Confidence |",
                  f"|----------|--------|--------|----------|---------|--------|------------|",
              ]
              for f in sorted(regressions,
                              key=lambda x: x["change_pct"], reverse=True):
                  sev_icon = SEV_EMOJI.get(f["severity"],"⚠️")
                  lines.append(
                      f"| {sev_icon} `{f['severity']}` "
                      f"| `{f['domain']}` "
                      f"| `{f['metric_key']}` "
                      f"| `{f['baseline_mean']:.2f}` "
                      f"| `{f['current_mean']:.2f}` "
                      f"| **`+{f['change_pct']:.1f}%`** "
                      f"| `{f['confidence_pct']:.1f}%` |"
                  )
              lines.append("")

          # ── Improvements table ─────────────────────────────────────────
          improvements = [f for f in findings
                          if f["direction"] == "improvement"
                          and not f["is_regression"]
                          and abs(f["change_pct"]) >= 3]
          if improvements:
              lines += [
                  f"## 📈 Performance Improvements",
                  f"",
                  f"| Domain | Metric | Baseline | Current | Improvement |",
                  f"|--------|--------|----------|---------|-------------|",
              ]
              for f in sorted(improvements,
                              key=lambda x: x["change_pct"]):
                  lines.append(
                      f"| `{f['domain']}` "
                      f"| `{f['metric_key']}` "
                      f"| `{f['baseline_mean']:.2f}` "
                      f"| `{f['current_mean']:.2f}` "
                      f"| ✅ **`{f['change_pct']:.1f}%`** |"
                  )
              lines.append("")

          # ── Domain breakdown ───────────────────────────────────────────
          lines += [
              f"## 🗂️ Domain Breakdown",
              f"",
              f"| Domain | Metrics | Regressions | Improvements | Status |",
              f"|--------|---------|-------------|--------------|--------|",
          ]
          for d in domains:
              d_regs = d["regressions"]
              d_imps = d["improvements"]
              d_icon = "🚨" if any(
                  f.get("severity")=="critical" for f in d["findings"]
                  if f["is_regression"]
              ) else "❌" if d_regs > 0 else "✅"
              lines.append(
                  f"| `{d['domain']}` "
                  f"| `{d['total_metrics']}` "
                  f"| `{d_regs}` "
                  f"| `{d_imps}` "
                  f"| {d_icon} |"
              )

          # ── Footer ─────────────────────────────────────────────────────
          lines += [
              f"",
              f"---",
              f"",
              f"<details>",
              f"<summary>🔬 Detection Algorithm Details</summary>",
              f"",
              f"| Algorithm | Description |",
              f"|-----------|-------------|",
              f"| Z-Score | Measures σ deviations from baseline distribution |",
              f"| Mann-Whitney U | Non-parametric significance test |",
              f"| EWMA | Exponentially weighted moving average control chart |",
              f"| Percent Change | Direct % change threshold gate |",
              f"| IQR Fence | Interquartile range outlier detection |",
              f"| Confidence Interval | 95% CI non-overlap test |",
              f"| Changepoint (PELT) | Structural break detection |",
              f"| **Ensemble** | **Majority vote ≥3/7 algorithms** |",
              f"",
              f"</details>",
              f"",
              f"*Generated by ASH v5.0 OMEGA Regression Detection Engine*  "
              f"*·*  *Session: `{SESSION_ID}`*",
          ]

          report_content = "\n".join(lines)

          # Write report files
          with open(REPORTS_DIR / "regression-report.md", "w") as f:
              f.write(report_content)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "w") as f:
              f.write(report_content)

          # Write outputs
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"overall_status={overall}\n")
              out.write(f"regression_count={summary['regression_count']}\n")
              out.write(f"critical_count={summary['critical_count']}\n")

          print(f"  ✅ Report generated — {len(lines)} lines")
          print(f"  📄 Status: {overall.upper()}")
          REPORT_EOF

      - name: "💬 Post PR comment with regression report"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const overallStatus   = "${{ needs.analyze.outputs.overall_status }}";
            const regressionCount = parseInt("${{ needs.analyze.outputs.regression_count }}" || "0");
            const criticalCount   = parseInt("${{ needs.analyze.outputs.critical_count }}" || "0");
            const highCount       = parseInt("${{ needs.analyze.outputs.high_count }}" || "0");
            const improvCount     = parseInt("${{ needs.analyze.outputs.improvement_count }}" || "0");
            const worstRegression = "${{ needs.analyze.outputs.worst_regression }}";

            const STATUS_EMOJI = {
              pass: "✅", medium: "⚠️", high: "❌", critical: "🚨"
            };
            const statusEmoji = STATUS_EMOJI[overallStatus] || "📊";

            let reportContent = "";
            try {
              reportContent = fs.readFileSync(
                "${{ env.REPORTS_DIR }}/regression-report.md", "utf8"
              );
            } catch (e) {
              reportContent = "> Report unavailable.";
            }

            // Build status badge line
            const badgeParts = [];
            if (criticalCount > 0)
              badgeParts.push(`🚨 **${criticalCount} critical**`);
            if (highCount > 0)
              badgeParts.push(`❌ ${highCount} high`);
            if (regressionCount > 0 && criticalCount === 0 && highCount === 0)
              badgeParts.push(`⚠️ ${regressionCount} regression(s)`);
            if (improvCount > 0)
              badgeParts.push(`📈 ${improvCount} improvement(s)`);
            if (regressionCount === 0)
              badgeParts.push("✅ No regressions detected");

            const badgeLine = badgeParts.join(" &nbsp;·&nbsp; ");
            const worstLine = worstRegression
              ? `\n> 📉 **Worst:** \`${worstRegression}\``
              : "";

            const body = [
              `## 📉 Performance Regression Analysis`,
              ``,
              `${statusEmoji} **${overallStatus.toUpperCase()}** &nbsp;·&nbsp; ${badgeLine}`,
              worstLine,
              ``,
              `<details>`,
              `<summary>📊 Full Regression Report (click to expand)</summary>`,
              ``,
              reportContent,
              ``,
              `</details>`,
            ].join("\n");

            // Find and update/create comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === "Bot" &&
              c.body.includes("Performance Regression Analysis")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log("✅ Updated regression PR comment");
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log("✅ Created regression PR comment");
            }

      - name: "🔖 Create GitHub Check annotation"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const overall       = "${{ needs.analyze.outputs.overall_status }}";
            const regressions   = parseInt("${{ needs.analyze.outputs.regression_count }}" || "0");
            const criticals     = parseInt("${{ needs.analyze.outputs.critical_count }}" || "0");
            const improvements  = parseInt("${{ needs.analyze.outputs.improvement_count }}" || "0");
            const worst         = "${{ needs.analyze.outputs.worst_regression }}";

            const conclusion_map = {
              pass:     "success",
              medium:   "neutral",
              high:     "failure",
              critical: "failure",
            };
            const conclusion = conclusion_map[overall] || "neutral";

            const title = conclusion === "success"
              ? `✅ No performance regressions detected`
              : `${criticals > 0 ? "🚨" : "❌"} ${regressions} regression(s) — ${overall.toUpperCase()}`;

            const summary_parts = [
              `**Overall Status:** ${overall.toUpperCase()}`,
              `**Regressions:** ${regressions}`,
              `**Critical:** ${criticals}`,
              `**Improvements:** ${improvements}`,
            ];
            if (worst) summary_parts.push(`**Worst:** \`${worst}\``);

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "📉 Performance Regression Guard",
              head_sha: "${{ needs.bootstrap.outputs.compare_sha }}",
              status: "completed",
              conclusion,
              output: {
                title,
                summary: summary_parts.join("\n"),
                text: `Regression analysis completed.\n\nDetection mode: ${{ env.DETECTION_MODE }}\nZ-score threshold: ${{ env.ZSCORE_THRESHOLD }}σ\nPercent threshold: ${{ env.PERCENT_THRESHOLD }}%`,
              },
            });
            console.log(`✅ GitHub Check created: ${conclusion}`);

      - name: "🐛 Create issue for critical regressions"
        if: |
          needs.analyze.outputs.critical_count != '0' &&
          env.CREATE_ISSUE == 'true' &&
          github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const critical   = parseInt("${{ needs.analyze.outputs.critical_count }}");
            const worst      = "${{ needs.analyze.outputs.worst_regression }}";
            const sessionId  = "${{ needs.bootstrap.outputs.session_id }}";
            const compareSHA = "${{ needs.bootstrap.outputs.compare_sha }}";

            // Check for existing open issue
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: "performance-regression,automated",
              state: "open",
            });

            const existingIssue = openIssues.find(i =>
              i.title.includes("Critical Performance Regression")
            );

            const issueBody = [
              `## 🚨 Critical Performance Regression Detected`,
              ``,
              `A critical performance regression has been automatically detected by the`,
              `ASH v5.0 OMEGA Regression Detection Engine.`,
              ``,
              `### 📊 Details`,
              ``,
              `| Property | Value |`,
              `|----------|-------|`,
              `| Severity | 🚨 **CRITICAL** |`,
              `| Count | **${critical} critical regression(s)** |`,
              `| Worst | \`${worst || "see report"}\` |`,
              `| SHA | \`${compareSHA.slice(0,12)}\` |`,
              `| Session | \`${sessionId}\` |`,
              `| Run | ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId} |`,
              ``,
              `### 🔍 Action Required`,
              ``,
              `1. Review the benchmark run linked above`,
              `2. Identify the commit introducing the regression`,
              `3. Either revert or optimize the affected code`,
              `4. Re-run benchmarks to confirm fix`,
              ``,
              `### 🤖 Automated Detection`,
              ``,
              `This issue was created automatically by the Regression Detection workflow.`,
              `It will be closed automatically when performance returns to baseline.`,
              ``,
              `**Labels:** \`performance-regression\` \`automated\` \`critical\``,
            ].join("\n");

            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## 🔄 Regression persists — SHA \`${compareSHA.slice(0,8)}\`\n\n${critical} critical regression(s) still detected.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              console.log(`✅ Updated existing issue #${existingIssue.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Critical Performance Regression — ${new Date().toISOString().split("T")[0]}`,
                body: issueBody,
                labels: ["performance-regression", "automated", "critical", "priority:high"],
                assignees: [],
              });
              console.log(`✅ Created issue #${issue.number}: ${issue.html_url}`);
            }

      - name: "🔔 Discord notification"
        if: |
          env.NOTIFY_DISCORD == 'true' &&
          needs.analyze.outputs.regression_count != '0'
        continue-on-error: true
        run: |
          OVERALL="${{ needs.analyze.outputs.overall_status }}"
          REGRESSIONS="${{ needs.analyze.outputs.regression_count }}"
          CRITICAL="${{ needs.analyze.outputs.critical_count }}"
          HIGH="${{ needs.analyze.outputs.high_count }}"
          WORST="${{ needs.analyze.outputs.worst_regression }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Emoji selection
          case "${OVERALL}" in
            critical) COLOR=15548997; EMOJI="🚨" ;;
            high)     COLOR=16744272; EMOJI="❌" ;;
            medium)   COLOR=16755200; EMOJI="⚠️" ;;
            *)        COLOR=5763719;  EMOJI="✅" ;;
          esac

          # Build Discord embed JSON
          PAYLOAD=$(cat << EOF
          {
            "username": "ASH Regression Guard",
            "avatar_url": "https://raw.githubusercontent.com/${{ github.repository }}/main/assets/brand/logos/ash-logo-256.png",
            "embeds": [{
              "title": "${EMOJI} Performance Regression Detected — ${OVERALL^^}",
              "description": "The ASH v5.0 OMEGA Regression Detection Engine found **${REGRESSIONS}** regression(s) on \`${{ github.ref_name }}\`.",
              "color": ${COLOR},
              "fields": [
                {"name": "🚨 Critical",   "value": "\`${CRITICAL}\`",    "inline": true},
                {"name": "❌ High",        "value": "\`${HIGH}\`",        "inline": true},
                {"name": "📉 Total",       "value": "\`${REGRESSIONS}\`","inline": true},
                {"name": "📍 SHA",         "value": "\`${GITHUB_SHA::12}\`","inline": true},
                {"name": "📍 Branch",      "value": "\`${{ github.ref_name }}\`","inline": true},
                {"name": "🔬 Mode",        "value": "\`${DETECTION_MODE}\`","inline": true},
                {"name": "📉 Worst",       "value": "\`${WORST:-unknown}\`","inline": false},
                {"name": "🔗 View Run",    "value": "[Open →](${RUN_URL})","inline": false}
              ],
              "footer": {
                "text": "ASH Dotfiles v5.0 OMEGA · Regression Detection Engine"
              },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          EOF
          )

          if [[ -n "${DISCORD_WEBHOOK_REGRESSION:-}" ]]; then
            curl -sf \
              -X POST \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}" \
              "${DISCORD_WEBHOOK_REGRESSION}" \
              && echo "  ✅ Discord notification sent" \
              || echo "  ⚠️ Discord notification failed"
          else
            echo "  ℹ️ DISCORD_WEBHOOK_REGRESSION not set — skipping"
          fi
        env:
          DISCORD_WEBHOOK_REGRESSION: ${{ secrets.DISCORD_WEBHOOK_REGRESSION }}

      - name: "💾 Update performance history database"
        run: |
          mkdir -p "${HISTORY_DIR}"
          DB_PATH="${HISTORY_DIR}/regression.db"

          python3 << 'DB_EOF'
          import json
          import os
          import sqlite3
          import uuid
          from datetime import datetime, timezone
          from pathlib import Path

          REPORTS_DIR = Path(os.environ["REPORTS_DIR"])
          DB_PATH     = os.environ["HISTORY_DIR"] + "/regression.db"
          SESSION_ID  = "${{ needs.bootstrap.outputs.session_id }}"

          with open(REPORTS_DIR / "analysis.json") as f:
              analysis = json.load(f)

          summary  = analysis["summary"]
          findings = analysis["all_findings"]

          try:
              conn = sqlite3.connect(DB_PATH)
              cur  = conn.cursor()

              # Ensure tables exist
              cur.executescript("""
                CREATE TABLE IF NOT EXISTS regression_sessions (
                  id TEXT PRIMARY KEY, session_id TEXT, baseline_sha TEXT,
                  compare_sha TEXT, git_ref TEXT, triggered_by TEXT,
                  detection_mode TEXT, overall_status TEXT, total_checked INTEGER,
                  regressions INTEGER, improvements INTEGER, critical_count INTEGER,
                  high_count INTEGER, medium_count INTEGER, low_count INTEGER,
                  created_at TEXT, completed_at TEXT
                );
                CREATE TABLE IF NOT EXISTS regression_findings (
                  id TEXT PRIMARY KEY, session_id TEXT, domain TEXT,
                  metric_name TEXT, metric_key TEXT, baseline_value REAL,
                  current_value REAL, change_pct REAL, change_abs REAL,
                  zscore REAL, severity TEXT, direction TEXT, algorithm TEXT,
                  confidence_pct REAL, p_value REAL, is_regression INTEGER,
                  created_at TEXT
                );
              """)

              # Insert session
              cur.execute("""
                INSERT OR REPLACE INTO regression_sessions VALUES
                (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)
              """, (
                  str(uuid.uuid4()), SESSION_ID,
                  analysis["baseline_sha"], analysis["compare_sha"],
                  analysis["git_ref"], "workflow",
                  analysis["detection_mode"], summary["overall_status"],
                  summary["total_metrics"], summary["regression_count"],
                  summary["improvement_count"], summary["critical_count"],
                  summary["high_count"], summary["medium_count"], 0,
                  analysis["timestamp"],
                  datetime.now(timezone.utc).isoformat()
              ))

              # Insert findings
              for f in findings:
                  cur.execute("""
                    INSERT OR REPLACE INTO regression_findings VALUES
                    (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)
                  """, (
                      f["id"], SESSION_ID,
                      f["domain"], f["metric_name"], f["metric_key"],
                      f["baseline_mean"], f["current_mean"],
                      f["change_pct"], f["change_abs"],
                      f.get("algorithms",{}).get("zscore",{}).get("zscore",0),
                      f["severity"], f["direction"], f["algorithm"],
                      f["confidence_pct"], 0,
                      1 if f["is_regression"] else 0,
                      datetime.now(timezone.utc).isoformat()
                  ))

              conn.commit()
              conn.close()

              print(f"  ✅ Database updated: {len(findings)} findings saved")
              print(f"  📊 Session: {SESSION_ID}")

          except Exception as e:
              print(f"  ⚠️ DB update failed: {e}")
          DB_EOF

      - name: "💾 Save updated baseline (passing only)"
        if: |
          needs.analyze.outputs.overall_status == 'pass' &&
          github.ref == 'refs/heads/main'
        run: |
          echo "  💾 Saving new performance baseline (all tests passed)..."
          # Copy current data as new baseline for all domains
          find "${WORK_DIR}/collected" \
            -name "current.json" \
            -exec bash -c '
              DOMAIN=$(basename $(dirname "$1"))
              mkdir -p "${BASELINE_DIR}/${DOMAIN}"
              cp "$1" "${BASELINE_DIR}/${DOMAIN}/baseline.json"
              echo "  ✅ Saved baseline: ${DOMAIN}"
            ' _ {} \;

      - name: "📤 Upload final reports"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "regression-report-final-${{ needs.bootstrap.outputs.session_id }}"
          path: |
            ${{ env.REPORTS_DIR }}/
            ${{ env.HISTORY_DIR }}/
          retention-days: 90
          compression-level: 9

      - name: "🔁 Update performance badge"
        if: github.ref == 'refs/heads/main'
        run: |
          OVERALL="${{ needs.analyze.outputs.overall_status }}"
          COUNT="${{ needs.analyze.outputs.regression_count }}"

          case "${OVERALL}" in
            pass)     COLOR="brightgreen"; MSG="no regressions" ;;
            medium)   COLOR="yellow";      MSG="${COUNT} regressions" ;;
            high)     COLOR="orange";      MSG="${COUNT} regressions" ;;
            critical) COLOR="red";         MSG="${COUNT} critical" ;;
            *)        COLOR="lightgrey";   MSG="unknown" ;;
          esac

          cat > assets/badges/regression.json << EOF
          {
            "schemaVersion": 1,
            "label": "regression",
            "message": "${MSG}",
            "color": "${COLOR}",
            "style": "flat-square",
            "namedLogo": "chartmogul",
            "logoColor": "white"
          }
          EOF

          echo "  🏅 Badge updated: regression=${MSG} (${COLOR})"

      - name: "❌ Final gate — fail on severity threshold"
        if: |
          needs.bootstrap.outputs.should_gate == 'true' &&
          (
            (env.SEVERITY_GATE == 'critical' && needs.analyze.outputs.critical_count != '0') ||
            (env.SEVERITY_GATE == 'high'     && needs.analyze.outputs.high_count != '0') ||
            (env.SEVERITY_GATE == 'medium'   && needs.analyze.outputs.medium_count != '0') ||
            (env.SEVERITY_GATE == 'any'      && needs.analyze.outputs.regression_count != '0')
          )
        run: |
          OVERALL="${{ needs.analyze.outputs.overall_status }}"
          CRITICAL="${{ needs.analyze.outputs.critical_count }}"
          HIGH="${{ needs.analyze.outputs.high_count }}"
          REGRESSIONS="${{ needs.analyze.outputs.regression_count }}"
          WORST="${{ needs.analyze.outputs.worst_regression }}"

          echo "::error title=Performance Regression Gate Failed::"
          echo ""
          echo "  🚨 REGRESSION GATE TRIGGERED"
          echo "  ─────────────────────────────────────────────"
          echo "  Overall status:     ${OVERALL^^}"
          echo "  Total regressions:  ${REGRESSIONS}"
          echo "  Critical:           ${CRITICAL}"
          echo "  High:               ${HIGH}"
          echo "  Worst:              ${WORST:-unknown}"
          echo "  Gate threshold:     ${SEVERITY_GATE}"
          echo "  ─────────────────────────────────────────────"
          echo "  Please investigate and fix performance regressions"
          echo "  before merging this PR or deploying."
          echo ""

          exit 1