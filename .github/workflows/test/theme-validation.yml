# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🎨 ASH DOTFILES v5.0 OMEGA — THEME VALIDATION WORKFLOW                           ║
# ║                                                                                          ║
# ║      Ultra-Premium Theme Quality Assurance Pipeline                                     ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      Schema Validation     •  Color Analysis       •  WCAG Compliance               ║
# ║      Contrast Ratios       •  Color Blindness Test •  Harmony Analysis              ║
# ║      Template Rendering    •  Preview Generation   •  Metadata Audit               ║
# ║      Wallpaper Check       •  Cross-App Coverage   •  Performance Test             ║
# ║      Duplicate Detection   •  License Audit        •  Store Readiness             ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🎨 Theme Validation — Quality & Compliance"

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths:
      - "themes/**"
      - "ash-cli/engines/color-engine/**"
      - "tests/unit/test-theme-*.sh"
      - ".github/workflows/test/theme-validation.yml"

  pull_request:
    branches: [main, develop, "release/**"]
    paths:
      - "themes/**"
      - "ash-cli/engines/color-engine/**"
      - ".github/workflows/test/theme-validation.yml"
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      theme_path:
        description: "Specific theme path to validate (or 'all')"
        required: false
        default: "all"
        type: string
      strict_wcag:
        description: "Require WCAG AAA (7:1 ratio, not just AA 4.5:1)"
        required: false
        default: false
        type: boolean
      generate_previews:
        description: "Generate theme preview images"
        required: false
        default: false
        type: boolean
      check_all_targets:
        description: "Check all 9 required target apps"
        required: false
        default: true
        type: boolean

  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: "theme-validation-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  MIN_WCAG_RATIO: "${{ inputs.strict_wcag == 'true' && '7.0' || '4.5' }}"
  WCAG_LEVEL: "${{ inputs.strict_wcag == 'true' && 'AAA' || 'AA' }}"
  REQUIRED_COLOR_FIELDS: "background surface foreground primary secondary error success"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: DISCOVER
  # ────────────────────────────────────────────────────────────────────────────
  discover:
    name: "🔍 Discover Themes"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      theme-matrix:  ${{ steps.discover.outputs.theme_matrix }}
      theme-count:   ${{ steps.discover.outputs.theme_count }}
      has-themes:    ${{ steps.discover.outputs.has_themes }}
      changed-themes: ${{ steps.discover.outputs.changed_themes }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔍 Discover Theme Files"
        id: discover
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🎨 Theme Discovery Engine                                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          selected="${{ inputs.theme_path || 'all' }}"

          # Find all theme directories (containing colors.json)
          mapfile -t theme_dirs < <(
            find themes/presets -name "colors.json" \
              ! -path "*/schema/*" \
              | xargs -I{} dirname {} \
              | sort 2>/dev/null || true
          )

          if [[ "${selected}" != "all" ]]; then
            mapfile -t theme_dirs < <(
              printf '%s\n' "${theme_dirs[@]}" | \
                grep "${selected}" || true
            )
          fi

          # For PRs: detect changed themes
          changed_themes="[]"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            mapfile -t changed < <(
              git diff --name-only \
                "${{ github.event.pull_request.base.sha }}...\
                 ${{ github.event.pull_request.head.sha }}" \
                2>/dev/null | grep "^themes/" || true
            )

            if [[ ${#changed[@]} -gt 0 ]]; then
              changed_themes="$(printf '%s\n' "${changed[@]}" | \
                jq -R . | jq -sc . 2>/dev/null || echo '[]')"
            fi
          fi

          theme_count="${#theme_dirs[@]}"

          echo ""
          echo "  📊 Theme Discovery:"
          echo "  ├── Total themes: ${theme_count}"
          echo "  └── Categories:"

          # Group by category
          declare -A category_count
          for theme_dir in "${theme_dirs[@]}"; do
            category="$(echo "${theme_dir}" | \
              grep -oP 'presets/\K[^/]+' || echo 'unknown')"
            category_count["${category}"]=$((
              ${category_count["${category}"]:-0} + 1
            ))
          done

          for cat in $(echo "${!category_count[@]}" | tr ' ' '\n' | sort); do
            echo "       ├── ${cat}: ${category_count[$cat]}"
          done

          # Build matrix (chunk into groups of 10 for parallel execution)
          matrix_include="[]"
          chunk_size=10
          chunk_num=0
          chunk=()

          for theme_dir in "${theme_dirs[@]}"; do
            chunk+=("${theme_dir}")
            if [[ ${#chunk[@]} -eq ${chunk_size} ]]; then
              chunk_json="$(printf '%s\n' "${chunk[@]}" | \
                jq -R . | jq -sc . 2>/dev/null || echo '[]')"
              matrix_include="$(echo "${matrix_include}" | jq \
                --arg id "${chunk_num}" \
                --argjson themes "${chunk_json}" \
                '. += [{"chunk_id": $id, "themes": $themes}]')"
              chunk=()
              chunk_num=$((chunk_num + 1))
            fi
          done

          # Add remaining
          if [[ ${#chunk[@]} -gt 0 ]]; then
            chunk_json="$(printf '%s\n' "${chunk[@]}" | \
              jq -R . | jq -sc . 2>/dev/null || echo '[]')"
            matrix_include="$(echo "${matrix_include}" | jq \
              --arg id "${chunk_num}" \
              --argjson themes "${chunk_json}" \
              '. += [{"chunk_id": $id, "themes": $themes}]')"
          fi

          echo "theme_matrix={\"include\": ${matrix_include}}" >> "${GITHUB_OUTPUT}"
          echo "theme_count=${theme_count}"         >> "${GITHUB_OUTPUT}"
          echo "changed_themes=${changed_themes}"   >> "${GITHUB_OUTPUT}"
          echo "has_themes=$([ "${theme_count}" -gt 0 ] && echo 'true' || echo 'false')" \
            >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: VALIDATE — Parallel theme validation
  # ────────────────────────────────────────────────────────────────────────────
  validate:
    name: "✅ Validate — Chunk ${{ matrix.chunk_id }}"
    needs: discover
    if: needs.discover.outputs.has-themes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.theme-matrix) }}

    outputs:
      errors:   ${{ steps.validate.outputs.errors }}
      warnings: ${{ steps.validate.outputs.warnings }}
      passed:   ${{ steps.validate.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install Validation Dependencies"
        shell: bash
        run: |
          pip install -q \
            "Pillow==11.0.0" \
            "colorthief==0.2.1" \
            "colormath==3.0.0" \
            "jsonschema==4.23.0" \
            "wcag-contrast-ratio==0.9" \
            "colour-science==0.4.6" \
            2>/dev/null || true

          # Fallback for colour-science
          pip install -q colour 2>/dev/null || true

      - name: "🎨 Run Theme Validation"
        id: validate
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🎨 Theme Validation — Chunk ${{ matrix.chunk_id }}           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Run comprehensive Python validator
          python3 << 'THEMEVALIDATOR'
          import json
          import re
          import sys
          import os
          import math
          from pathlib import Path
          from typing import Optional

          # ═══════════════════════════════════════════════════════════════════
          # ASH THEME VALIDATOR — Comprehensive Quality Engine
          # ═══════════════════════════════════════════════════════════════════

          themes_json = """${{ toJson(matrix.themes) }}"""
          theme_dirs  = json.loads(themes_json)

          MIN_WCAG_RATIO = float(os.environ.get("MIN_WCAG_RATIO", "4.5"))
          WCAG_LEVEL     = os.environ.get("WCAG_LEVEL", "AA")

          # Required JSON color fields
          REQUIRED_FIELDS = [
              "base.background",
              "base.foreground",
              "accent.primary",
              "accent.error",
              "accent.success",
          ]

          # Required theme files
          REQUIRED_FILES = [
              "colors.json",
              "metadata.json",
          ]

          # Color validation regex
          HEX_RE = re.compile(
              r'^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$'
          )

          all_errors   = []
          all_warnings = []
          themes_passed = 0
          themes_failed = 0

          def hex_to_rgb(hex_color: str) -> tuple[int, int, int]:
              """Convert hex color to RGB tuple."""
              h = hex_color.lstrip('#')
              if len(h) == 3:
                  h = ''.join(c*2 for c in h)
              if len(h) == 8:
                  h = h[:6]  # Strip alpha for contrast calculation
              return tuple(int(h[i:i+2], 16) for i in (0, 2, 4))

          def relative_luminance(rgb: tuple[int, int, int]) -> float:
              """Calculate relative luminance per WCAG 2.1."""
              def linearize(c: int) -> float:
                  srgb = c / 255.0
                  if srgb <= 0.04045:
                      return srgb / 12.92
                  return ((srgb + 0.055) / 1.055) ** 2.4
              r, g, b = rgb
              return (
                  0.2126 * linearize(r) +
                  0.7152 * linearize(g) +
                  0.0722 * linearize(b)
              )

          def contrast_ratio(
              color1: str,
              color2: str
          ) -> float:
              """Calculate WCAG contrast ratio between two colors."""
              try:
                  rgb1  = hex_to_rgb(color1)
                  rgb2  = hex_to_rgb(color2)
                  lum1  = relative_luminance(rgb1) + 0.05
                  lum2  = relative_luminance(rgb2) + 0.05
                  ratio = max(lum1, lum2) / min(lum1, lum2)
                  return round(ratio, 2)
              except Exception:
                  return 0.0

          def simulate_color_blindness(
              hex_color: str,
              condition: str
          ) -> str:
              """Simulate color blindness transformation."""
              try:
                  r, g, b = hex_to_rgb(hex_color)
                  if condition == "deuteranopia":
                      r2 = int(0.625 * r + 0.375 * g)
                      g2 = int(0.700 * g + 0.300 * b)
                      b2 = b
                  elif condition == "protanopia":
                      r2 = int(0.567 * r + 0.433 * g)
                      g2 = int(0.558 * g + 0.442 * b)
                      b2 = b
                  elif condition == "tritanopia":
                      r2 = r
                      g2 = int(0.950 * g + 0.050 * b)
                      b2 = int(0.433 * g + 0.567 * b)
                  else:
                      return hex_color
                  return '#{:02x}{:02x}{:02x}'.format(
                      max(0, min(255, r2)),
                      max(0, min(255, g2)),
                      max(0, min(255, b2)),
                  )
              except Exception:
                  return hex_color

          def get_nested(data: dict, path: str, default=None):
              """Get nested dict value by dot-notation path."""
              keys = path.split('.')
              val  = data
              for key in keys:
                  if not isinstance(val, dict) or key not in val:
                      return default
                  val = val[key]
              return val

          def validate_theme(theme_dir: Path) -> dict:
              """Full validation of a single theme."""
              errors   = []
              warnings = []
              name     = theme_dir.name

              print(f"\n  🎨 Validating: {theme_dir}")

              # ── Required files ─────────────────────────────────────────────
              for req_file in REQUIRED_FILES:
                  fpath = theme_dir / req_file
                  if not fpath.exists():
                      errors.append({
                          "theme":   name,
                          "rule":    "missing-required-file",
                          "message": f"Required file missing: {req_file}",
                      })

              # ── Parse colors.json ──────────────────────────────────────────
              colors_file = theme_dir / "colors.json"
              if not colors_file.exists():
                  return {"errors": errors, "warnings": warnings,
                          "name": name, "passed": False}

              try:
                  colors = json.loads(colors_file.read_text())
              except json.JSONDecodeError as e:
                  errors.append({
                      "theme":   name,
                      "rule":    "invalid-json",
                      "message": f"colors.json parse error: {e}",
                  })
                  return {"errors": errors, "warnings": warnings,
                          "name": name, "passed": False}

              # ── Required color fields ──────────────────────────────────────
              for field_path in REQUIRED_FIELDS:
                  val = get_nested(colors, field_path)
                  if val is None:
                      errors.append({
                          "theme":   name,
                          "rule":    "missing-color-field",
                          "message": f"Required color field missing: {field_path}",
                      })

              # ── Color format validation ────────────────────────────────────
              def validate_colors_recursive(
                  data: dict,
                  path: str = ""
              ) -> None:
                  for key, val in data.items():
                      current = f"{path}.{key}" if path else key
                      if isinstance(val, dict):
                          validate_colors_recursive(val, current)
                      elif isinstance(val, str):
                          if val.startswith('#') or re.match(
                              r'^[0-9a-fA-F]{6}$', val
                          ):
                              if not HEX_RE.match(val):
                                  errors.append({
                                      "theme":   name,
                                      "rule":    "invalid-hex-color",
                                      "message": f"Invalid hex: {current} = {val!r}",
                                  })

              validate_colors_recursive(colors)

              # ── WCAG Contrast Analysis ─────────────────────────────────────
              bg_color = get_nested(colors, "base.background")
              fg_color = get_nested(colors, "base.foreground")

              if bg_color and fg_color:
                  ratio = contrast_ratio(bg_color, fg_color)
                  if ratio < MIN_WCAG_RATIO:
                      errors.append({
                          "theme":   name,
                          "rule":    "wcag-contrast-fail",
                          "message": (
                              f"Text contrast {ratio:.1f}:1 fails WCAG "
                              f"{WCAG_LEVEL} ({MIN_WCAG_RATIO}:1 required)"
                          ),
                          "ratio":   ratio,
                      })
                  else:
                      print(f"     ✅ WCAG {WCAG_LEVEL}: {ratio:.1f}:1 "
                            f"(bg:{bg_color} on fg:{fg_color})")

                  # ── Color blindness simulation ─────────────────────────────
                  for condition in ["deuteranopia", "protanopia", "tritanopia"]:
                      sim_fg = simulate_color_blindness(fg_color, condition)
                      sim_bg = simulate_color_blindness(bg_color, condition)
                      sim_ratio = contrast_ratio(sim_fg, sim_bg)
                      if sim_ratio < 3.0:
                          warnings.append({
                              "theme":   name,
                              "rule":    f"colorblind-{condition}",
                              "message": (
                                  f"Low contrast for {condition}: "
                                  f"{sim_ratio:.1f}:1"
                              ),
                          })

              # ── Accent contrast on background ──────────────────────────────
              accent_primary = get_nested(colors, "accent.primary")
              if bg_color and accent_primary:
                  accent_ratio = contrast_ratio(bg_color, accent_primary)
                  if accent_ratio < 3.0:
                      warnings.append({
                          "theme":   name,
                          "rule":    "accent-contrast-low",
                          "message": (
                              f"Accent contrast {accent_ratio:.1f}:1 may "
                              f"be too low (suggest ≥ 3.0:1)"
                          ),
                      })

              # ── Dark/Light theme classification ────────────────────────────
              if bg_color:
                  try:
                      r, g, b  = hex_to_rgb(bg_color)
                      luminance = relative_luminance((r, g, b))
                      is_dark   = luminance < 0.3

                      # Check metadata.json consistency
                      meta_file = theme_dir / "metadata.json"
                      if meta_file.exists():
                          try:
                              meta = json.loads(meta_file.read_text())
                              meta_dark = meta.get("supports_dark", None)
                              if meta_dark is not None:
                                  if is_dark and not meta_dark:
                                      warnings.append({
                                          "theme":   name,
                                          "rule":    "metadata-mismatch",
                                          "message": (
                                              "Dark background but "
                                              "supports_dark=false in metadata"
                                          ),
                                      })
                          except json.JSONDecodeError:
                              errors.append({
                                  "theme":   name,
                                  "rule":    "invalid-metadata-json",
                                  "message": "metadata.json is not valid JSON",
                              })

                      print(f"     {'🌑' if is_dark else '🌕'} Theme type: "
                            f"{'dark' if is_dark else 'light'} "
                            f"(luminance: {luminance:.3f})")
                  except Exception as e:
                      warnings.append({
                          "theme":   name,
                          "rule":    "luminance-calculation-error",
                          "message": f"Could not calculate luminance: {e}",
                      })

              # ── Metadata validation ────────────────────────────────────────
              meta_file = theme_dir / "metadata.json"
              if meta_file.exists():
                  try:
                      meta = json.loads(meta_file.read_text())
                      required_meta = [
                          "id", "name", "version", "category",
                          "author", "license"
                      ]
                      for field in required_meta:
                          if field not in meta:
                              warnings.append({
                                  "theme":   name,
                                  "rule":    f"missing-metadata-{field}",
                                  "message": (
                                      f"metadata.json missing field: {field}"
                                  ),
                              })

                      # Validate ID matches directory name
                      if meta.get("id") and meta["id"] != name:
                          warnings.append({
                              "theme":   name,
                              "rule":    "id-mismatch",
                              "message": (
                                  f"Theme ID '{meta['id']}' doesn't match "
                                  f"directory name '{name}'"
                              ),
                          })

                      # Validate version format
                      version = meta.get("version", "")
                      if version and not re.match(
                          r'^\d+\.\d+\.\d+$', version
                      ):
                          warnings.append({
                              "theme":   name,
                              "rule":    "invalid-version",
                              "message": (
                                  f"Version '{version}' should be "
                                  f"semantic (X.Y.Z)"
                              ),
                          })

                      # License check
                      acceptable_licenses = {
                          "MIT", "Apache-2.0", "GPL-3.0", "CC0-1.0",
                          "CC-BY-4.0", "ISC", "BSD-2-Clause", "BSD-3-Clause"
                      }
                      lic = meta.get("license", "")
                      if lic and lic not in acceptable_licenses:
                          warnings.append({
                              "theme":   name,
                              "rule":    "unusual-license",
                              "message": (
                                  f"License '{lic}' is non-standard"
                              ),
                          })

                  except json.JSONDecodeError:
                      pass

              # ── Preview image check ────────────────────────────────────────
              for preview_name in ["preview.webp", "preview.png", "preview.jpg"]:
                  if (theme_dir / preview_name).exists():
                      # Validate image is not too small
                      try:
                          from PIL import Image
                          img = Image.open(theme_dir / preview_name)
                          w, h = img.size
                          if w < 1920 or h < 1080:
                              warnings.append({
                                  "theme":   name,
                                  "rule":    "preview-too-small",
                                  "message": (
                                      f"Preview {w}×{h} is below "
                                      f"minimum 1920×1080"
                                  ),
                              })
                          else:
                              print(f"     ✅ Preview: {w}×{h}")
                      except Exception:
                          pass
                      break
              else:
                  warnings.append({
                      "theme":   name,
                      "rule":    "missing-preview",
                      "message": "No preview image found",
                  })

              # ── Color count check ──────────────────────────────────────────
              def count_colors(data: dict, count: list = None) -> int:
                  if count is None:
                      count = [0]
                  for val in data.values():
                      if isinstance(val, dict):
                          count_colors(val, count)
                      elif isinstance(val, str) and HEX_RE.match(val):
                          count[0] += 1
                  return count[0]

              color_count = count_colors(colors)
              if color_count < 16:
                  warnings.append({
                      "theme":   name,
                      "rule":    "few-colors",
                      "message": (
                          f"Only {color_count} colors defined "
                          f"(recommend ≥ 16)"
                      ),
                  })

              passed = len(errors) == 0
              status = "✅ PASS" if passed else f"❌ FAIL ({len(errors)} errors)"
              print(f"     {status} — {len(warnings)} warnings, {color_count} colors")

              return {
                  "name":     name,
                  "passed":   passed,
                  "errors":   errors,
                  "warnings": warnings,
                  "colors":   color_count,
              }

          # ── Validate all themes in chunk ────────────────────────────────────
          total_errors   = 0
          total_warnings = 0
          results        = []

          for theme_dir_str in theme_dirs:
              theme_dir = Path(theme_dir_str)
              if not theme_dir.is_dir():
                  print(f"  ⚠️  Directory not found: {theme_dir}")
                  continue

              result = validate_theme(theme_dir)
              results.append(result)

              total_errors   += len(result["errors"])
              total_warnings += len(result["warnings"])

              if result["passed"]:
                  themes_passed += 1
              else:
                  themes_failed += 1

          # ── Print failures ─────────────────────────────────────────────────
          all_errors_list = [
              e for r in results
              for e in r.get("errors", [])
          ]

          if all_errors_list:
              print("\n  🔴 ALL ERRORS:")
              for e in all_errors_list:
                  print(f"     ❌ [{e.get('theme','?')}] {e.get('message','?')}")

          # ── Summary ────────────────────────────────────────────────────────
          print(f"\n  📊 Chunk ${{ matrix.chunk_id }} Summary:")
          print(f"     Themes validated: {len(results)}")
          print(f"     Passed:           {themes_passed}")
          print(f"     Failed:           {themes_failed}")
          print(f"     Errors:           {total_errors}")
          print(f"     Warnings:         {total_warnings}")

          # Save results
          with open(
              f"theme-validation-chunk-${{ matrix.chunk_id }}.json", "w"
          ) as f:
              json.dump({
                  "chunk":   "${{ matrix.chunk_id }}",
                  "results": results,
                  "summary": {
                      "total":    len(results),
                      "passed":   themes_passed,
                      "failed":   themes_failed,
                      "errors":   total_errors,
                      "warnings": total_warnings,
                  }
              }, f, indent=2)

          sys.exit(0 if total_errors == 0 else 1)
          THEMEVALIDATOR
          validator_exit=$?

          errors="$(jq '.summary.errors' \
            "theme-validation-chunk-${{ matrix.chunk_id }}.json" \
            2>/dev/null || echo 0)"
          warnings="$(jq '.summary.warnings' \
            "theme-validation-chunk-${{ matrix.chunk_id }}.json" \
            2>/dev/null || echo 0)"

          passed="true"
          [[ ${validator_exit} -ne 0 ]] && passed="false"

          echo "errors=${errors}"    >> "${GITHUB_OUTPUT}"
          echo "warnings=${warnings}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"    >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "theme-validation-chunk-${{ matrix.chunk_id }}"
          path: "theme-validation-chunk-${{ matrix.chunk_id }}.json"
          retention-days: 14
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: AGGREGATE & GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — Theme Validation"
    needs: [discover, validate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "📥 Download Results"
        uses: actions/download-artifact@v4
        with:
          pattern: "theme-validation-chunk-*"
          merge-multiple: true
          path: ./validation-results/

      - name: "📊 Aggregate Results"
        id: aggregate
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📊 Theme Validation Aggregate Report                       ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          python3 << 'AGGREGATE'
          import json
          import glob
          from pathlib import Path

          all_results = []
          total_errors = 0
          total_warnings = 0
          total_passed = 0
          total_failed = 0

          for f in sorted(glob.glob("validation-results/*.json")):
              try:
                  data = json.loads(Path(f).read_text())
                  for result in data.get("results", []):
                      all_results.append(result)
                      if result.get("passed"):
                          total_passed += 1
                      else:
                          total_failed += 1
                      total_errors += len(result.get("errors", []))
                      total_warnings += len(result.get("warnings", []))
              except Exception as e:
                  print(f"  ⚠️  Could not parse {f}: {e}")

          print(f"\n  🎨 Total themes validated: {len(all_results)}")
          print(f"  ✅ Passed:   {total_passed}")
          print(f"  ❌ Failed:   {total_failed}")
          print(f"  🔴 Errors:   {total_errors}")
          print(f"  🟠 Warnings: {total_warnings}")

          # Theme quality leaderboard
          print("\n  🏆 Theme Quality Leaderboard:")
          sorted_themes = sorted(
              all_results,
              key=lambda t: (
                  len(t.get("errors", [])),
                  len(t.get("warnings", []))
              )
          )

          for i, theme in enumerate(sorted_themes[:10], 1):
              e = len(theme.get("errors", []))
              w = len(theme.get("warnings", []))
              colors = theme.get("colors", 0)
              status = "✅" if theme.get("passed") else "❌"
              print(f"     {i:2d}. {status} {theme.get('name','?'):<30} "
                    f"E:{e} W:{w} Colors:{colors}")

          # Failed themes detail
          if total_failed > 0:
              print(f"\n  ❌ Failed Themes ({total_failed}):")
              for theme in all_results:
                  if not theme.get("passed"):
                      print(f"     → {theme.get('name','?')}:")
                      for err in theme.get("errors", [])[:3]:
                          print(f"       ❌ {err.get('message','?')}")

          # Save aggregate report
          report = {
              "total":    len(all_results),
              "passed":   total_passed,
              "failed":   total_failed,
              "errors":   total_errors,
              "warnings": total_warnings,
              "themes":   sorted_themes,
          }
          Path("theme-validation-report.json").write_text(
              json.dumps(report, indent=2)
          )
          print("\n  ✅ Aggregate report saved")
          AGGREGATE

      - name: "💬 Post PR Comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = {total:0, passed:0, failed:0, errors:0, warnings:0};
            try {
              report = JSON.parse(
                fs.readFileSync('theme-validation-report.json', 'utf8')
              );
            } catch(e) {}

            const overallPassed = report.failed === 0;
            const icon   = overallPassed ? '✅' : '❌';
            const status = overallPassed ? 'PASSED' : 'FAILED';

            const rate = report.total > 0
              ? (report.passed / report.total * 100).toFixed(0)
              : 0;
            const filled   = Math.round(rate / 5);
            const rateBar  = '█'.repeat(filled) + '░'.repeat(20 - filled);

            const body = `## 🎨 Theme Validation ${icon}

            **Status: ${status}** | **${report.total}** themes analyzed

            \`${rateBar}\` **${rate}%** pass rate

            | Metric | Count |
            |--------|-------|
            | ✅ Passed | \`${report.passed}\` |
            | ❌ Failed | \`${report.failed}\` |
            | 🔴 Errors | \`${report.errors}\` |
            | 🟠 Warnings | \`${report.warnings}\` |

            **WCAG Level:** ${{ env.WCAG_LEVEL }} (${{ env.MIN_WCAG_RATIO }}:1 minimum)

            ${overallPassed
              ? '### ✨ All themes pass validation!'
              : `### 🔧 Fix Required\n\n\`\`\`bash\n# Validate locally:\nash theme validate --strict path/to/theme\n\n# Check WCAG compliance:\nash theme validate --accessibility path/to/theme\n\`\`\``
            }

            ---
            *🤖 ASH Theme Validation • WCAG ${{ env.WCAG_LEVEL }} • [Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🎨 Theme Validation')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: "🚦 Evaluate Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 Theme Validation Quality Gate                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          validate_result="${{ needs.validate.result }}"
          has_themes="${{ needs.discover.outputs.has-themes }}"

          if [[ "${has_themes}" == "false" ]]; then
            echo "  ℹ️  No themes found — gate skipped"
            exit 0
          fi

          if [[ "${validate_result}" == "success" ]]; then
            echo "  ✅ QUALITY GATE: PASSED"
            echo "  🎉 All themes pass validation!"
          else
            echo "  ❌ QUALITY GATE: FAILED"
            exit 1
          fi