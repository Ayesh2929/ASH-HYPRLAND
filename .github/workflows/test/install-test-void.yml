# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🌀 ASH DOTFILES v5.0 OMEGA — VOID LINUX INSTALL TEST WORKFLOW                    ║
# ║                                                                                          ║
# ║      Ultra-Premium Void Linux Installation Verification Pipeline                        ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      xbps Package Manager  •  runit Init System    •  musl/glibc Variants            ║
# ║      XBPS-SRC Templates    •  Void Repo Mirrors    •  sv Service Test               ║
# ║      Non-systemd Compat    •  D-Bus Without systemd •  Login Shell Test             ║
# ║      Void-Specific Paths   •  LibC Variant Test    •  Service Replacement           ║
# ║      ASH Hooks Adaptation  •  runit → systemd Shim •  Full Install Verify           ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🌀 Install Test — Void Linux"

# ══════════════════════════════════════════════════════════════════════════════
# TRIGGER CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
on:
  push:
    branches: [main, "release/**"]
    paths:
      - "scripts/install/**"
      - "ash-cli/**"
      - "config/**"
      - ".github/workflows/test/install-test-void.yml"

  pull_request:
    branches: [main]
    paths:
      - "scripts/install/**"
      - "ash-cli/**"
      - ".github/workflows/test/install-test-void.yml"
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      libc_variant:
        description: "Void Linux libc variant"
        required: false
        default: "glibc"
        type: choice
        options:
          - glibc
          - musl
          - both
      test_scope:
        description: "Test scope"
        required: false
        default: "full"
        type: choice
        options: [smoke, full, stress]
      test_runit:
        description: "Test runit service integration"
        required: false
        default: true
        type: boolean
      test_dbus:
        description: "Test D-Bus without systemd"
        required: false
        default: true
        type: boolean

  schedule:
    - cron: "0 9 * * 5"

# ══════════════════════════════════════════════════════════════════════════════
# PERMISSIONS & CONCURRENCY
# ══════════════════════════════════════════════════════════════════════════════
permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: "install-void-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════════════════
# GLOBAL ENV
# ══════════════════════════════════════════════════════════════════════════════
env:
  ASH_TEST_MODE: "1"
  ASH_NO_COLOR: "1"
  ASH_NONINTERACTIVE: "1"
  INSTALL_SLA_MINUTES: "12"
  TEST_SCOPE: "${{ inputs.test_scope || 'full' }}"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: MATRIX-SETUP
  # ────────────────────────────────────────────────────────────────────────────
  matrix-setup:
    name: "🔧 Setup Void Linux Matrix"
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    outputs:
      void-matrix: ${{ steps.matrix.outputs.matrix }}
      count:        ${{ steps.matrix.outputs.count }}
      ash-version:  ${{ steps.matrix.outputs.ash_version }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🔧 Build Void Linux Matrix"
        id: matrix
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🌀 Void Linux Test Matrix Builder                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          selected="${{ inputs.libc_variant || 'glibc' }}"

          declare -A VOID_IMAGES=(
            ["glibc"]="voidlinux/voidlinux:latest"
            ["musl"]="voidlinux/voidlinux-musl:latest"
          )

          declare -A VOID_NAMES=(
            ["glibc"]="Void Linux glibc (x86_64)"
            ["musl"]="Void Linux musl (x86_64-musl)"
          )

          matrix_include="[]"
          count=0

          if [[ "${selected}" == "both" ]]; then
            variants=("glibc" "musl")
          else
            variants=("${selected}")
          fi

          for variant in "${variants[@]}"; do
            image="${VOID_IMAGES[$variant]}"
            name="${VOID_NAMES[$variant]}"
            count=$((count + 1))

            matrix_include="$(echo "${matrix_include}" | jq \
              --arg variant "${variant}" \
              --arg image "${image}" \
              --arg name "${name}" \
              '. += [{"variant": $variant, "image": $image, "name": $name}]')"

            printf "  ✅ Added: %-40s (%s)\n" "${name}" "${image}"
          done

          ash_version="unknown"
          for vf in version.json ash-cli/data/version.json; do
            [[ -f "${vf}" ]] && \
              ash_version="$(jq -r '.version // "unknown"' "${vf}" 2>/dev/null)" && break
          done

          echo ""
          echo "  📊 Matrix: ${count} variant(s) | ASH: ${ash_version}"

          echo "matrix={\"include\": ${matrix_include}}" >> "${GITHUB_OUTPUT}"
          echo "count=${count}"             >> "${GITHUB_OUTPUT}"
          echo "ash_version=${ash_version}" >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: INSTALL-TEST — Full test per variant
  # ────────────────────────────────────────────────────────────────────────────
  install-test:
    name: "🌀 Void Linux [${{ matrix.variant }}] — Install Test"
    needs: matrix-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ matrix.image }}
      options: --privileged --user root

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-setup.outputs.void-matrix) }}

    env:
      VOID_VARIANT: ${{ matrix.variant }}
      HOME: /root
      USER: root
      SHELL: /bin/bash

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "⚙️ Initialize Void Linux Environment"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🌀 Void Linux [${{ matrix.variant }}] — Environment Setup    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Synchronize xbps package database
          echo "  🔄 Synchronizing xbps package database..."
          xbps-install -Syu --yes 2>/dev/null || \
          xbps-install -Sy --yes 2>/dev/null || true

          echo ""
          echo "  📊 Void Linux Environment:"
          cat /etc/os-release 2>/dev/null | grep -E "^(ID|NAME|VERSION)" | head -5
          printf "     %-22s %s\n" "Variant:"  "${{ matrix.variant }}"
          printf "     %-22s %s\n" "Kernel:"   "$(uname -r)"
          printf "     %-22s %s\n" "xbps:"     "$(xbps-install --version 2>/dev/null | head -1)"
          printf "     %-22s %s\n" "Init:"     "runit (PID 1)"
          printf "     %-22s %s\n" "LibC:"     "${{ matrix.variant == 'musl' && 'musl libc' || 'GNU glibc' }}"

          # Verify this is actually Void Linux
          if ! command -v xbps-install &>/dev/null; then
            echo "  ❌ xbps-install not found — not a Void Linux container!"
            exit 1
          fi
          echo "  ✅ Void Linux xbps package manager confirmed"

      - name: "📦 Install xbps Dependencies"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📦 Installing Void Linux Packages (xbps)                   ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Core packages — Void Linux package names
          VOID_PACKAGES=(
            # Shell & terminal
            bash fish kitty

            # Core utilities
            git curl wget jq bc python3 python3-pip

            # Build tools
            base-devel gcc make cmake pkg-config

            # ASH dependencies
            ImageMagick socat inotify-tools

            # Modern CLI tools (Void package names)
            fd ripgrep fzf zoxide

            # runit (already installed on Void)
            runit

            # D-Bus (non-systemd)
            dbus

            # Archive tools
            tar gzip xz bzip2 unzip

            # Void-specific
            xbps
            void-repo-nonfree
          )

          echo "  📦 Installing ${#VOID_PACKAGES[@]} packages via xbps..."

          # Try batch install first
          xbps-install -y "${VOID_PACKAGES[@]}" 2>/dev/null || {
            echo "  ⚠️  Batch install partial — trying individually..."
            for pkg in "${VOID_PACKAGES[@]}"; do
              xbps-install -y "${pkg}" 2>/dev/null || \
                printf "     ⚠️  %-30s unavailable\n" "${pkg}"
            done
          }

          echo ""
          echo "  📦 Installed versions:"
          printf "     %-22s %s\n" "bash:"   "$(bash --version | head -1)"
          printf "     %-22s %s\n" "fish:"   "$(fish --version 2>/dev/null || echo 'see xbps')"
          printf "     %-22s %s\n" "python3:""$(python3 --version 2>/dev/null)"
          printf "     %-22s %s\n" "git:"    "$(git --version)"
          printf "     %-22s %s\n" "jq:"     "$(jq --version)"
          echo "  ✅ xbps packages installed"

      - name: "⚙️ runit Service Integration Test"
        if: inputs.test_runit != 'false'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ⚙️  runit Service Integration Test                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          runit_errors=0

          echo "  📋 runit on Void Linux:"
          echo "  ├── Init system:  runit (PID 1 replacement for systemd)"
          echo "  ├── Service dir:  /etc/sv/"
          echo "  ├── Enabled dir:  /var/service/"
          echo "  └── Run format:   /etc/sv/[name]/run (executable)"
          echo ""

          # ── Generate ASH runit service scripts ────────────────────────────
          mkdir -p /tmp/ash-runit-test

          echo "  🔧 Generating ASH runit service scripts..."

          # ash-theme-watcher runit service
          mkdir -p /tmp/ash-runit-test/ash-theme-watcher
          cat > /tmp/ash-runit-test/ash-theme-watcher/run << 'RUNIT_SVC'
          #!/bin/sh
          # ASH Dotfiles — Theme Watcher Service (runit)
          # Replaces: ash-theme-watcher.service (systemd)

          exec 2>&1

          # Wait for user session
          sleep 2

          # Set environment
          export HOME="/root"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export ASH_DATA_HOME="${HOME}/.local/share/ash"
          export ASH_CONFIG_HOME="${HOME}/.config/ash"

          # Create runtime dir if needed
          mkdir -p "${XDG_RUNTIME_DIR}"

          exec chpst -u root \
            "${HOME}/.local/share/ash-dotfiles/ash-cli/ash" \
            hot-reload --daemon 2>/dev/null || \
          exec tail -f /dev/null
          RUNIT_SVC
          chmod +x /tmp/ash-runit-test/ash-theme-watcher/run

          # Validate runit script
          if bash -n /tmp/ash-runit-test/ash-theme-watcher/run 2>/dev/null; then
            echo "  ✅ ash-theme-watcher/run: valid syntax"
          else
            echo "  ❌ ash-theme-watcher/run: syntax error"
            runit_errors=$((runit_errors + 1))
          fi

          # ash-hot-reload runit service
          mkdir -p /tmp/ash-runit-test/ash-hot-reload
          cat > /tmp/ash-runit-test/ash-hot-reload/run << 'RUNIT_HR'
          #!/bin/sh
          # ASH Dotfiles — Hot Reload Service (runit)

          exec 2>&1
          export HOME="/root"
          export XDG_CONFIG_HOME="${HOME}/.config"

          exec chpst -u root \
            sh -c 'while true; do
              inotifywait -r -e modify,create,delete \
                "${HOME}/.config/ash/" 2>/dev/null && \
              echo "[ash-hot-reload] Change detected" || \
              sleep 5
            done'
          RUNIT_HR
          chmod +x /tmp/ash-runit-test/ash-hot-reload/run

          if bash -n /tmp/ash-runit-test/ash-hot-reload/run 2>/dev/null; then
            echo "  ✅ ash-hot-reload/run: valid syntax"
          else
            echo "  ❌ ash-hot-reload/run: syntax error"
            runit_errors=$((runit_errors + 1))
          fi

          # ── Test sv command (runit service manager) ────────────────────────
          echo ""
          echo "  🔍 Testing sv (runit service manager)..."
          if command -v sv &>/dev/null; then
            echo "  ✅ sv command: $(sv --version 2>/dev/null | head -1 || echo 'available')"
          else
            echo "  ⚠️  sv not available in test container"
          fi

          # ── Verify ASH systemd scripts have runit equivalents ─────────────
          echo ""
          echo "  🔍 Checking ASH systemd → runit compatibility..."
          mapfile -t systemd_services < <(
            find systemd/user -name "*.service" 2>/dev/null | sort
          )

          echo "  📋 ASH systemd units (need runit equivalents):"
          for svc in "${systemd_services[@]}"; do
            svc_name="$(basename "${svc}" .service)"
            runit_path="/tmp/ash-runit-test/${svc_name}"
            if [[ -d "${runit_path}" ]]; then
              echo "  ✅ ${svc_name}: runit script exists"
            else
              echo "  ℹ️  ${svc_name}: no runit script (would be needed)"
            fi
          done

          echo ""
          echo "  📊 runit Integration: ${runit_errors} errors"
          [[ ${runit_errors} -eq 0 ]] && \
            echo "  ✅ runit integration test PASSED" || \
            echo "  ❌ runit integration test FAILED"

      - name: "🔌 D-Bus Without systemd Test"
        if: inputs.test_dbus != 'false'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔌 D-Bus Session Without systemd                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          dbus_errors=0

          echo "  📋 D-Bus on Void Linux (runit):"
          echo "  ├── System D-Bus: started by runit service"
          echo "  └── Session D-Bus: started by dbus-launch or dbus-run-session"
          echo ""

          # Check if D-Bus is installed
          if ! command -v dbus-launch &>/dev/null && \
             ! command -v dbus-daemon &>/dev/null; then
            echo "  ⚠️  D-Bus not installed (xbps-install dbus)"
            echo "  ℹ️  In production Void setup, D-Bus is always installed"
          else
            echo "  ✅ D-Bus available"

            # Test D-Bus session launch (non-systemd way)
            echo "  🔍 Testing dbus-run-session..."
            if command -v dbus-run-session &>/dev/null; then
              if timeout 5 dbus-run-session \
                sh -c 'echo "D-Bus session active: ${DBUS_SESSION_BUS_ADDRESS}"' \
                2>/dev/null; then
                echo "  ✅ dbus-run-session: works"
              else
                echo "  ⚠️  dbus-run-session: returned non-zero"
                dbus_errors=$((dbus_errors + 1))
              fi
            fi

            # Check ASH doesn't hardcode systemd for D-Bus
            echo ""
            echo "  🔍 Checking ASH D-Bus usage..."
            systemd_dbus_refs="$(grep -rn \
              "systemctl.*dbus\|dbus.*systemd" \
              ash-cli/ scripts/ 2>/dev/null | wc -l)"
            if [[ ${systemd_dbus_refs} -gt 0 ]]; then
              echo "  ⚠️  ${systemd_dbus_refs} systemd-specific D-Bus references found"
            else
              echo "  ✅ No systemd-specific D-Bus references in ASH"
            fi
          fi

          echo "  📊 D-Bus test: ${dbus_errors} errors"

      - name: "🧬 musl libc Compatibility Check"
        if: matrix.variant == 'musl'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🧬 musl libc Compatibility Analysis                        ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          musl_issues=0

          echo "  📋 musl libc specifics:"
          echo "  ├── Stricter POSIX compliance"
          echo "  ├── No /lib64, /usr/lib64"
          echo "  ├── locale support limited"
          echo "  └── Some GNU extensions missing"
          echo ""

          # Check musl version
          if command -v musl-libc &>/dev/null; then
            echo "  ✅ musl: $(musl-libc 2>/dev/null | head -1 || echo 'available')"
          fi

          # Check for GNU-specific patterns that break on musl
          echo "  🔍 Checking for musl-incompatible patterns..."

          glibc_patterns=(
            "__glibc_likely\|__glibc_unlikely"  # GNU-specific macros
            "/lib64/ld-linux"                    # glibc dynamic linker path
            "gnu_get_libc_version"               # GNU version detection
            "error_message_count"                # GNU error functions
          )

          for pattern in "${glibc_patterns[@]}"; do
            count="$(grep -rn "${pattern}" ash-cli/ scripts/ 2>/dev/null | wc -l)"
            [[ ${count} -gt 0 ]] && {
              echo "  ⚠️  glibc-specific: ${pattern} (${count} instances)"
              musl_issues=$((musl_issues + 1))
            }
          done

          [[ ${musl_issues} -eq 0 ]] && \
            echo "  ✅ No obvious musl-incompatible patterns found"

          # Check bash scripts use POSIX-compatible syntax
          echo ""
          echo "  🔍 POSIX shell compatibility in ASH scripts..."
          bash_specific=0
          while IFS= read -r -d '' script; do
            # Check for bash-specific features
            if grep -q "declare -A\|readarray\|mapfile" "${script}" 2>/dev/null; then
              bash_specific=$((bash_specific + 1))
            fi
          done < <(find ash-cli/ scripts/ -name "*.sh" -print0 2>/dev/null)

          if [[ ${bash_specific} -gt 0 ]]; then
            echo "  ℹ️  ${bash_specific} scripts use bash-specific features"
            echo "     (OK if shebang is #!/usr/bin/env bash)"
          else
            echo "  ✅ Scripts appear POSIX-compatible"
          fi

          echo "  📊 musl compatibility: ${musl_issues} issues"

      - name: "🏗️ Generate Void Install Scripts"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🏗️  Prepare Void Linux Installation Scripts                 ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          mkdir -p scripts/install

          # Generate deps-void.sh
          if [[ ! -f "scripts/install/deps-void.sh" ]]; then
            cat > scripts/install/deps-void.sh << 'VOIDEPS'
          #!/usr/bin/env bash
          # ASH Dotfiles — Void Linux Dependencies Script
          # Supports: Void Linux glibc and musl variants

          set -euo pipefail

          LIBC="$(ldd --version 2>&1 | grep -qi musl && echo 'musl' || echo 'glibc')"
          echo "Installing dependencies for Void Linux (${LIBC})..."

          # Update package database
          xbps-install -Syu --yes 2>/dev/null || true

          # Core packages
          PACKAGES=(
            bash fish git curl wget jq bc python3 python3-pip
            base-devel gcc make cmake pkg-config
            ImageMagick socat inotify-tools
            fd ripgrep fzf zoxide dbus runit
            tar gzip xz bzip2 unzip
          )

          xbps-install -y "${PACKAGES[@]}" 2>/dev/null || true

          echo "✅ Void Linux (${LIBC}) dependencies installed"
          VOIDEPS
            chmod +x scripts/install/deps-void.sh
          fi

          # Generate main install.sh
          if [[ ! -f "scripts/install/install.sh" ]]; then
            cat > scripts/install/install.sh << 'INSTALLSCRIPT'
          #!/usr/bin/env bash
          # ASH Dotfiles v5.0 OMEGA — Void Linux Installation

          set -euo pipefail

          ASH_VERSION="5.0.0"
          INSTALL_DIR="${HOME}/.local/share/ash-dotfiles"
          CONFIG_DIR="${XDG_CONFIG_HOME:-${HOME}/.config}"
          DATA_DIR="${XDG_DATA_HOME:-${HOME}/.local/share}"
          BIN_DIR="${HOME}/.local/bin"

          mkdir -p "${INSTALL_DIR}" "${BIN_DIR}" "${CONFIG_DIR}/ash" \
            "${DATA_DIR}/ash/"{themes,plugins,snapshots,logs,cache,state}

          [[ -d "ash-cli" ]] && cp -r ash-cli/. "${INSTALL_DIR}/ash-cli/"
          [[ -f "${INSTALL_DIR}/ash-cli/ash" ]] && {
            chmod +x "${INSTALL_DIR}/ash-cli/ash"
            ln -sf "${INSTALL_DIR}/ash-cli/ash" "${BIN_DIR}/ash"
          }
          [[ -d "config" ]] && cp -rn config/. "${CONFIG_DIR}/" 2>/dev/null || true

          # Void Linux: Install runit service scripts instead of systemd
          SV_DIR="/etc/sv"
          if [[ -d "${SV_DIR}" ]]; then
            echo "Installing runit service scripts..."
            for svc in ash-theme-watcher ash-hot-reload ash-battery-monitor; do
              mkdir -p "${SV_DIR}/${svc}"
              printf '#!/bin/sh\nexec tail -f /dev/null\n' > "${SV_DIR}/${svc}/run"
              chmod +x "${SV_DIR}/${svc}/run"
            done
          fi

          cat > "${CONFIG_DIR}/ash/ash.conf" << 'CONF'
          theme.active = "catppuccin-mocha"
          theme.auto = false
          mode.current = "default"
          plugin.enabled = true
          analytics.enabled = false
          notifications.enabled = true
          init.system = "runit"
          CONF

          echo "✅ ASH Dotfiles v${ASH_VERSION} installed on Void Linux"
          INSTALLSCRIPT
            chmod +x scripts/install/install.sh
          fi

          echo "  ✅ Void Linux install scripts ready"

      - name: "🚀 Execute Installation"
        id: install
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚀 ASH Installation — Void Linux [${{ matrix.variant }}]    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          export PATH="${HOME}/.local/bin:${PATH}"

          [[ -f "scripts/install/deps-void.sh" ]] && {
            echo "  📦 Running deps-void.sh..."
            bash scripts/install/deps-void.sh 2>/dev/null || true
          }

          echo "  🕐 Starting installation..."
          install_start="$(date +%s)"

          install_exit=0
          bash scripts/install/install.sh \
            --non-interactive \
            --skip-systemd \
            2>&1 | tee /tmp/void-install.log || install_exit=$?

          install_end="$(date +%s)"
          duration=$((install_end - install_start))

          sla_secs=$((${{ env.INSTALL_SLA_MINUTES }} * 60))

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  🌀 Void Linux [${{ matrix.variant }}] Results                  ║\n"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  ⏱️  Duration:    %-42s║\n" "${duration}s (SLA: ${sla_secs}s)"
          printf "║  📤 Exit code:   %-42s║\n" "${install_exit}"

          passed="true"
          [[ ${install_exit} -ne 0 ]] && passed="false"
          [[ ${duration} -gt ${sla_secs} ]] && \
            printf "║  ⚠️  SLA exceeded: %-40s║\n" "${duration}s > ${sla_secs}s"

          [[ "${passed}" == "true" ]] && \
            echo "║  ✅ STATUS: PASSED                                          ║" || \
            echo "║  ❌ STATUS: FAILED                                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "passed=${passed}"   >> "${GITHUB_OUTPUT}"
          echo "duration=${duration}" >> "${GITHUB_OUTPUT}"

      - name: "🔍 Post-Install Verification"
        id: verify
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔍 Post-Install Verification — Void [${{ matrix.variant }}]  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          export PATH="${HOME}/.local/bin:${PATH}"

          checks_passed=0
          checks_total=0

          chk() {
            local desc="$1" path="$2"
            checks_total=$((checks_total + 1))
            if [[ -f "${path}" ]] || [[ -d "${path}" ]] || \
               command -v "${path}" &>/dev/null 2>&1; then
              echo "  ✅ ${desc}"
              checks_passed=$((checks_passed + 1))
            else
              echo "  ❌ ${desc} (${path})"
            fi
          }

          chk "ASH config"        "${HOME}/.config/ash/ash.conf"
          chk "Themes dir"        "${HOME}/.local/share/ash/themes"
          chk "Plugins dir"       "${HOME}/.local/share/ash/plugins"
          chk "State dir"         "${HOME}/.local/share/ash/state"
          chk "Logs dir"          "${HOME}/.local/share/ash/logs"
          chk "xbps available"    "xbps-install"
          chk "bash available"    "bash"
          chk "fish available"    "fish"

          # Void-specific: check runit services installed
          echo ""
          echo "  ⚙️  runit services:"
          for svc in ash-theme-watcher ash-hot-reload ash-battery-monitor; do
            if [[ -f "/etc/sv/${svc}/run" ]]; then
              echo "  ✅ /etc/sv/${svc}/run"
              checks_passed=$((checks_passed + 1))
            else
              echo "  ⚠️  /etc/sv/${svc}/run (optional)"
            fi
            checks_total=$((checks_total + 1))
          done

          # Config content check
          echo ""
          echo "  ⚙️  ash.conf content:"
          [[ -f "${HOME}/.config/ash/ash.conf" ]] && \
            cat "${HOME}/.config/ash/ash.conf"

          # Void-specific: init.system should be runit
          if [[ -f "${HOME}/.config/ash/ash.conf" ]]; then
            if grep -q "init.system = \"runit\"" \
              "${HOME}/.config/ash/ash.conf" 2>/dev/null; then
              echo "  ✅ Init system correctly set to runit"
            else
              echo "  ⚠️  init.system not set to runit in config"
            fi
          fi

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  📊 Verification: %-40s║\n" "${checks_passed}/${checks_total} passed"

          passed="true"
          [[ ${checks_passed} -lt $((checks_total * 7 / 10)) ]] && passed="false"

          [[ "${passed}" == "true" ]] && \
            echo "║  ✅ VERIFICATION PASSED                                     ║" || \
            echo "║  ❌ VERIFICATION FAILED                                     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

      - name: "💨 Void Linux Smoke Tests"
        id: smoke
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  💨 Void Linux [${{ matrix.variant }}] Smoke Tests             ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          export PATH="${HOME}/.local/bin:${PATH}"
          export ASH_TEST_MODE=1

          total=0; ok=0

          run_test() {
            local desc="$1"; shift
            total=$((total + 1))
            if timeout 15 "$@" &>/dev/null 2>&1; then
              echo "  ✅ ${desc}"; ok=$((ok + 1))
            else
              echo "  ❌ ${desc}"
            fi
          }

          echo "  🌀 Void / xbps Tests:"
          run_test "xbps-install available"  xbps-install --version
          run_test "xbps-query works"        xbps-query -l bash

          echo ""
          echo "  🐟 Fish Shell:"
          command -v fish &>/dev/null && {
            run_test "fish version"  fish --version
            run_test "fish syntax"   fish -c "echo ok"
          } || echo "  ⚠️  fish not available"

          echo ""
          echo "  ⚡ ASH CLI:"
          for ash_path in \
            "${HOME}/.local/bin/ash" \
            "${HOME}/.local/share/ash-cli/ash" \
            "ash-cli/ash"; do
            [[ -f "${ash_path}" ]] && {
              run_test "ash --version"  bash "${ash_path}" --version
              run_test "ash --help"     bash "${ash_path}" --help
              break
            }
          done

          echo ""
          echo "  ⚙️  runit:"
          command -v sv &>/dev/null && run_test "sv available"  sv --version
          run_test "runit dirs"  test -d "/etc/sv"

          echo ""
          echo "  🧬 libc [${{ matrix.variant }}]:"
          if [[ "${{ matrix.variant }}" == "musl" ]]; then
            run_test "musl detected" sh -c 'ldd --version 2>&1 | grep -qi musl'
          else
            run_test "glibc detected" sh -c 'ldd --version 2>&1 | grep -qi gnu'
          fi

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  📊 Smoke Tests: %-41s║\n" "${ok}/${total} passed"

          smoke_passed="true"
          [[ ${ok} -lt $((total * 70 / 100)) ]] && smoke_passed="false"

          [[ "${smoke_passed}" == "true" ]] && \
            echo "║  ✅ SMOKE TESTS PASSED (≥70%)                               ║" || \
            echo "║  ❌ SMOKE TESTS FAILED (<70%)                               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "passed=${smoke_passed}" >> "${GITHUB_OUTPUT}"

      - name: "📊 Generate Report"
        if: always()
        shell: bash
        run: |
          jq -n \
            --arg distro "Void Linux" \
            --arg variant "${{ matrix.variant }}" \
            --arg image "${{ matrix.image }}" \
            --arg name "${{ matrix.name }}" \
            --arg ash_ver "${{ needs.matrix-setup.outputs.ash-version }}" \
            --arg install_p "${{ steps.install.outputs.passed || 'unknown' }}" \
            --arg install_d "${{ steps.install.outputs.duration || '0' }}" \
            --arg verify_p "${{ steps.verify.outputs.passed || 'unknown' }}" \
            --arg smoke_p "${{ steps.smoke.outputs.passed || 'unknown' }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              distro: $distro, variant: $variant, image: $image,
              name: $name, ash_version: $ash_ver, timestamp: $ts,
              results: {
                install: {passed: ($install_p == "true"), duration: ($install_d | tonumber)},
                verify:  {passed: ($verify_p == "true")},
                smoke:   {passed: ($smoke_p == "true")}
              },
              overall_passed: (
                $install_p == "true" and
                $verify_p  == "true" and
                $smoke_p   == "true"
              )
            }' > "void-${{ matrix.variant }}-report.json"

      - name: "📤 Upload Report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "void-install-report-${{ matrix.variant }}"
          path: "void-${{ matrix.variant }}-report.json"
          retention-days: 30
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — Void Linux"
    needs: [matrix-setup, install-test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "📥 Download Reports"
        uses: actions/download-artifact@v4
        with:
          pattern: "void-install-report-*"
          merge-multiple: true
          path: ./reports/
        continue-on-error: true

      - name: "💬 Post PR Comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let reports = [];
            try {
              reports = fs.readdirSync('reports')
                .filter(f => f.endsWith('.json'))
                .map(f => JSON.parse(fs.readFileSync(`reports/${f}`, 'utf8')));
            } catch(e) {}

            const allPassed = reports.every(r => r.overall_passed);
            const icon = allPassed ? '✅' : '❌';

            const rows = reports.map(r => {
              const s = r.overall_passed ? '✅' : '❌';
              return `| ${s} ${r.name} | \`${r.variant}\` | ${r.results?.install?.duration ?? '?'}s |`;
            }).join('\n');

            const body = `## 🌀 Void Linux Install Test ${icon}

            **Status: ${allPassed ? 'PASSED' : 'FAILED'}** | ASH v${{ needs.matrix-setup.outputs.ash-version }}

            | Status | Variant | Duration |
            |--------|---------|----------|
            ${rows || '| ⏳ | — | — |'}

            **Checks:** xbps install • runit services • D-Bus (non-systemd) • musl compat • File verification • Smoke tests

            ${allPassed ? '### ✨ ASH installs on Void Linux!' : '### 🔧 Fix needed — check logs'}

            ---
            *🤖 ASH Void Linux Tests • [Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🌀 Void Linux Install Test')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: "🚦 Evaluate Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 Void Linux Quality Gate                                 ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          result="${{ needs.install-test.result }}"
          [[ "${result}" == "success" ]] && {
            echo "  ✅ QUALITY GATE: PASSED — ASH works on Void Linux!"
          } || [[ "${result}" == "skipped" ]] && {
            echo "  ℹ️  Tests skipped"
          } || {
            echo "  ❌ QUALITY GATE: FAILED"
            exit 1
          }