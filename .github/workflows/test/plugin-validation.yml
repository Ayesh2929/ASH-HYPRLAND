# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🔌 ASH DOTFILES v5.0 OMEGA — PLUGIN VALIDATION WORKFLOW                          ║
# ║                                                                                          ║
# ║      Ultra-Premium Plugin Quality Assurance Pipeline                                    ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      Manifest Validation   •  Schema Compliance    •  Security Scanning              ║
# ║      Lifecycle Testing     •  Permissions Audit    •  API Compatibility              ║
# ║      ShellCheck Scan       •  Secret Detection     •  Performance Bench             ║
# ║      Dependency Check      •  Idempotency Test     •  Clean Uninstall              ║
# ║      Documentation Audit   •  Version Semver       •  Store Readiness             ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🔌 Plugin Validation — Quality & Security"

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths:
      - "plugins/**"
      - "ash-cli/commands/plugin/**"
      - "tests/unit/test-plugin-*.sh"
      - ".github/workflows/test/plugin-validation.yml"

  pull_request:
    branches: [main, develop, "release/**"]
    paths:
      - "plugins/**"
      - "ash-cli/commands/plugin/**"
      - ".github/workflows/test/plugin-validation.yml"
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      plugin_path:
        description: "Specific plugin to validate (or 'all')"
        required: false
        default: "all"
        type: string
      security_strict:
        description: "Strict security mode — zero warnings"
        required: false
        default: true
        type: boolean
      run_lifecycle:
        description: "Run full lifecycle tests (enable/disable)"
        required: false
        default: true
        type: boolean
      run_benchmarks:
        description: "Run performance benchmarks"
        required: false
        default: true
        type: boolean

  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

concurrency:
  group: "plugin-validation-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  BATS_VERSION: "1.11.0"
  ASH_TEST_MODE: "1"
  ASH_NO_COLOR: "1"
  # Performance SLAs (milliseconds)
  SLA_INIT_MS: "500"
  SLA_ENABLE_MS: "1000"
  SLA_DISABLE_MS: "500"
  SLA_STATUS_MS: "100"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: DISCOVER
  # ────────────────────────────────────────────────────────────────────────────
  discover:
    name: "🔍 Discover Plugins"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      plugin-matrix: ${{ steps.discover.outputs.plugin_matrix }}
      plugin-count:  ${{ steps.discover.outputs.plugin_count }}
      has-plugins:   ${{ steps.discover.outputs.has_plugins }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔍 Discover Plugin Directories"
        id: discover
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔌 Plugin Discovery Engine                                 ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          selected="${{ inputs.plugin_path || 'all' }}"

          # Find all plugin directories (containing plugin.json)
          mapfile -t plugin_dirs < <(
            find plugins -name "plugin.json" \
              ! -path "*/schema/*" \
              ! -path "*/template/*" \
              | xargs -I{} dirname {} \
              | sort 2>/dev/null || true
          )

          if [[ "${selected}" != "all" ]]; then
            mapfile -t plugin_dirs < <(
              printf '%s\n' "${plugin_dirs[@]}" | \
                grep "${selected}" || true
            )
          fi

          plugin_count="${#plugin_dirs[@]}"

          echo ""
          echo "  📊 Plugin Discovery:"
          echo "  ├── Total plugins: ${plugin_count}"
          echo "  └── By category:"

          declare -A cat_count
          for plugin_dir in "${plugin_dirs[@]}"; do
            cat="$(dirname "${plugin_dir}" | xargs basename)"
            cat_count["${cat}"]=$(( ${cat_count["${cat}"]:-0} + 1 ))
          done

          for cat in $(echo "${!cat_count[@]}" | tr ' ' '\n' | sort); do
            echo "       ├── ${cat}: ${cat_count[$cat]}"
          done

          # Build matrix
          matrix_include="[]"
          for plugin_dir in "${plugin_dirs[@]}"; do
            plugin_id="$(basename "${plugin_dir}")"
            matrix_include="$(echo "${matrix_include}" | jq \
              --arg id "${plugin_id}" \
              --arg dir "${plugin_dir}" \
              '. += [{"plugin_id": $id, "plugin_dir": $dir}]')"
          done

          echo "plugin_matrix={\"include\": ${matrix_include}}" >> "${GITHUB_OUTPUT}"
          echo "plugin_count=${plugin_count}"     >> "${GITHUB_OUTPUT}"
          echo "has_plugins=$([ "${plugin_count}" -gt 0 ] && echo 'true' || echo 'false')" \
            >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: VALIDATE — Full plugin validation in parallel
  # ────────────────────────────────────────────────────────────────────────────
  validate:
    name: "✅ Validate — ${{ matrix.plugin_id }}"
    needs: discover
    if: needs.discover.outputs.has-plugins == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.plugin-matrix) }}

    outputs:
      errors:   ${{ steps.validate.outputs.errors }}
      passed:   ${{ steps.validate.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python & Bash"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install Tools"
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y \
            bash jq bc shellcheck \
            2>/dev/null

          pip install -q "jsonschema==4.23.0" 2>/dev/null

          git clone --depth=1 \
            --branch="v${{ env.BATS_VERSION }}" \
            https://github.com/bats-core/bats-core.git /tmp/bats 2>/dev/null
          sudo /tmp/bats/install.sh /usr/local 2>/dev/null
          for lib in support assert file; do
            git clone --depth=1 \
              "https://github.com/bats-core/bats-${lib}.git" \
              "/usr/local/lib/bats-${lib}" 2>/dev/null
          done

      - name: "🔌 Validate Plugin: ${{ matrix.plugin_id }}"
        id: validate
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔌 Plugin Validation: ${{ matrix.plugin_id }}               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          PLUGIN_DIR="${{ matrix.plugin_dir }}"
          PLUGIN_ID="${{ matrix.plugin_id }}"

          echo "  📁 Plugin directory: ${PLUGIN_DIR}"
          echo ""

          errors=0
          warnings=0

          # ── 1. Manifest validation ──────────────────────────────────────
          echo "  📋 [1/8] Manifest Validation (plugin.json)..."
          manifest="${PLUGIN_DIR}/plugin.json"

          if [[ ! -f "${manifest}" ]]; then
            echo "  ❌ plugin.json not found"
            errors=$((errors + 1))
          else
            # JSON syntax check
            if ! jq empty "${manifest}" 2>/dev/null; then
              echo "  ❌ plugin.json is not valid JSON"
              errors=$((errors + 1))
            else
              echo "  ✅ plugin.json is valid JSON"

              # Required fields
              required_fields=(
                "id" "name" "version" "description"
                "author" "license" "entry"
              )
              for field in "${required_fields[@]}"; do
                val="$(jq -r ".${field} // empty" "${manifest}" 2>/dev/null)"
                if [[ -z "${val}" ]]; then
                  echo "  ❌ Missing required field: ${field}"
                  errors=$((errors + 1))
                fi
              done

              # ID matches directory
              manifest_id="$(jq -r '.id // empty' "${manifest}")"
              if [[ "${manifest_id}" != "${PLUGIN_ID}" ]]; then
                echo "  ❌ Manifest ID '${manifest_id}' ≠ directory '${PLUGIN_ID}'"
                errors=$((errors + 1))
              else
                echo "  ✅ Plugin ID matches directory"
              fi

              # Version format (semver)
              version="$(jq -r '.version // "0.0.0"' "${manifest}")"
              if ! echo "${version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "  ❌ Version '${version}' is not semver (X.Y.Z)"
                errors=$((errors + 1))
              else
                echo "  ✅ Version: ${version}"
              fi

              # Entry scripts exist
              for entry_key in init enable disable status; do
                entry_script="$(jq -r ".entry.${entry_key} // empty" \
                  "${manifest}" 2>/dev/null)"
                if [[ -n "${entry_script}" ]]; then
                  if [[ ! -f "${PLUGIN_DIR}/${entry_script}" ]]; then
                    echo "  ❌ Entry script missing: ${entry_script}"
                    errors=$((errors + 1))
                  else
                    echo "  ✅ Entry[${entry_key}]: ${entry_script}"
                  fi
                elif [[ "${entry_key}" =~ ^(init|enable|disable)$ ]]; then
                  echo "  ❌ Required entry missing: ${entry_key}"
                  errors=$((errors + 1))
                fi
              done
            fi
          fi

          # ── 2. Required files ───────────────────────────────────────────
          echo ""
          echo "  📁 [2/8] Required Files Check..."
          required_files=("README.md" "LICENSE")
          for req in "${required_files[@]}"; do
            if [[ -f "${PLUGIN_DIR}/${req}" ]]; then
              echo "  ✅ ${req} present"
            else
              echo "  ⚠️  ${req} missing (recommended)"
              warnings=$((warnings + 1))
            fi
          done

          # ── 3. ShellCheck scan ──────────────────────────────────────────
          echo ""
          echo "  🔬 [3/8] ShellCheck Security Scan..."
          shellcheck_errors=0
          shellcheck_warnings=0

          while IFS= read -r -d '' sh_file; do
            sc_output="$(shellcheck \
              --severity=warning \
              --enable=all \
              --format=compact \
              "${sh_file}" 2>&1)"
            sc_exit=$?

            file_errors="$(echo "${sc_output}" | grep -c " error:" || echo 0)"
            file_warnings="$(echo "${sc_output}" | grep -c " warning:" || echo 0)"

            shellcheck_errors=$((shellcheck_errors + file_errors))
            shellcheck_warnings=$((shellcheck_warnings + file_warnings))

            if [[ ${sc_exit} -eq 0 ]]; then
              echo "  ✅ $(basename "${sh_file}")"
            else
              echo "  ❌ $(basename "${sh_file}"): ${file_errors}E ${file_warnings}W"
              echo "${sc_output}" | head -5 | while IFS= read -r line; do
                echo "     ${line}"
              done
            fi
          done < <(find "${PLUGIN_DIR}" -name "*.sh" -print0)

          errors=$((errors + shellcheck_errors))
          [[ "${{ inputs.security_strict || 'true' }}" == "true" ]] && \
            errors=$((errors + shellcheck_warnings))
          echo "  📊 ShellCheck: ${shellcheck_errors}E ${shellcheck_warnings}W"

          # ── 4. Secret detection ─────────────────────────────────────────
          echo ""
          echo "  🔒 [4/8] Secret Detection..."
          secret_patterns=(
            'password\s*=\s*["\x27][^"\x27]'
            'api_key\s*=\s*["\x27][^"\x27]'
            'secret\s*=\s*["\x27][^"\x27]'
            'token\s*=\s*["\x27][^"\x27]'
            'AKIA[0-9A-Z]{16}'
            'sk-[a-zA-Z0-9]{32}'
            'ghp_[a-zA-Z0-9]{36}'
          )

          secret_found=0
          for pattern in "${secret_patterns[@]}"; do
            matches="$(grep -rniE "${pattern}" "${PLUGIN_DIR}" \
              --include="*.sh" --include="*.py" --include="*.json" \
              2>/dev/null | grep -v "^Binary" | wc -l)"
            if [[ ${matches} -gt 0 ]]; then
              echo "  ❌ Potential secret pattern detected: ${pattern}"
              errors=$((errors + 1))
              secret_found=$((secret_found + 1))
            fi
          done

          [[ ${secret_found} -eq 0 ]] && echo "  ✅ No secrets detected"

          # ── 5. Permissions audit ────────────────────────────────────────
          echo ""
          echo "  🛡️  [5/8] Permissions Audit..."
          manifest="${PLUGIN_DIR}/plugin.json"

          if [[ -f "${manifest}" ]]; then
            sudo_usage="$(jq -r '.permissions.sudo // false' "${manifest}")"
            if [[ "${sudo_usage}" == "true" ]]; then
              echo "  ⚠️  Plugin requests sudo — requires justification"
              warnings=$((warnings + 1))
            else
              echo "  ✅ No sudo requirements"
            fi

            network_perms="$(jq -r '.permissions.network // [] | length' "${manifest}")"
            if [[ ${network_perms} -gt 0 ]]; then
              echo "  ℹ️  Network permissions: ${network_perms} endpoint(s)"
              jq -r '.permissions.network[]' "${manifest}" 2>/dev/null | \
                while IFS= read -r ep; do
                  echo "     → ${ep}"
                done
            else
              echo "  ✅ No external network access"
            fi

            fs_write="$(jq -r '.permissions.filesystem.write // [] | length' \
              "${manifest}")"
            echo "  📁 Filesystem write paths: ${fs_write}"
          fi

          # ── 6. Dangerous patterns ───────────────────────────────────────
          echo ""
          echo "  ⚠️  [6/8] Dangerous Pattern Detection..."
          danger_patterns=(
            'eval\s'
            'rm\s+-rf\s+/'
            'curl.*\|\s*sh'
            'wget.*\|\s*sh'
            'chmod\s+777'
            '\$\(.*curl'
          )

          danger_found=0
          for pattern in "${danger_patterns[@]}"; do
            count="$(grep -rniE "${pattern}" "${PLUGIN_DIR}" \
              --include="*.sh" 2>/dev/null | \
              grep -v '^\s*#' | wc -l)"
            if [[ ${count} -gt 0 ]]; then
              echo "  ❌ Dangerous pattern found: ${pattern} (${count} matches)"
              errors=$((errors + 1))
              danger_found=$((danger_found + 1))
            fi
          done

          [[ ${danger_found} -eq 0 ]] && echo "  ✅ No dangerous patterns"

          # ── 7. Lifecycle test ───────────────────────────────────────────
          if [[ "${{ inputs.run_lifecycle || 'true' }}" == "true" ]]; then
            echo ""
            echo "  🔄 [7/8] Lifecycle Test..."

            TEST_HOME="${RUNNER_TEMP}/plugin-test-${PLUGIN_ID}"
            mkdir -p \
              "${TEST_HOME}/.config/ash" \
              "${TEST_HOME}/.local/share/ash/plugins" \
              "${TEST_HOME}/mock-bin"

            cat > "${TEST_HOME}/.config/ash/ash.conf" << 'CONF'
          plugin.enabled = true
          analytics.enabled = false
          CONF

            for mock in hyprctl notify-send waybar systemctl; do
              printf '#!/usr/bin/env bash\nexit 0\n' > \
                "${TEST_HOME}/mock-bin/${mock}"
              chmod +x "${TEST_HOME}/mock-bin/${mock}"
            done

            export HOME="${TEST_HOME}"
            export PATH="${TEST_HOME}/mock-bin:${PATH}"
            export ASH_CONFIG_HOME="${TEST_HOME}/.config/ash"
            export ASH_DATA_HOME="${TEST_HOME}/.local/share/ash"
            export ASH_PLUGIN_DIR="${PLUGIN_DIR}"
            export ASH_PLUGIN_ID="${PLUGIN_ID}"
            export ASH_TEST_MODE=1

            init_script="$(jq -r '.entry.init // ""' \
              "${PLUGIN_DIR}/plugin.json" 2>/dev/null)"

            if [[ -n "${init_script}" && \
                  -f "${PLUGIN_DIR}/${init_script}" ]]; then
              init_exit=0
              timeout 10 bash "${PLUGIN_DIR}/${init_script}" \
                2>/dev/null || init_exit=$?

              [[ ${init_exit} -eq 0 ]] && echo "  ✅ init.sh: PASS" || {
                echo "  ❌ init.sh: FAIL (exit: ${init_exit})"
                errors=$((errors + 1))
              }

              # Test idempotency (run init twice)
              timeout 10 bash "${PLUGIN_DIR}/${init_script}" \
                2>/dev/null && echo "  ✅ init.sh: Idempotent" || \
                echo "  ⚠️  init.sh: Not idempotent"
            fi

            # Test status.sh
            status_script="$(jq -r '.entry.status // ""' \
              "${PLUGIN_DIR}/plugin.json" 2>/dev/null)"
            if [[ -n "${status_script}" && \
                  -f "${PLUGIN_DIR}/${status_script}" ]]; then
              status_exit=0
              timeout 5 bash "${PLUGIN_DIR}/${status_script}" \
                2>/dev/null || status_exit=$?
              [[ ${status_exit} -eq 0 ]] && echo "  ✅ status.sh: PASS" || \
                echo "  ⚠️  status.sh: returned ${status_exit}"
            fi

          else
            echo ""
            echo "  [7/8] Lifecycle tests: SKIPPED"
          fi

          # ── 8. Performance benchmark ────────────────────────────────────
          if [[ "${{ inputs.run_benchmarks || 'true' }}" == "true" ]]; then
            echo ""
            echo "  ⚡ [8/8] Performance Benchmarks..."

            for entry_key in init enable disable status; do
              entry_script="$(jq -r ".entry.${entry_key} // empty" \
                "${PLUGIN_DIR}/plugin.json" 2>/dev/null)"

              [[ -z "${entry_script}" ]] && continue
              [[ ! -f "${PLUGIN_DIR}/${entry_script}" ]] && continue

              sla_var="SLA_${entry_key^^}_MS"
              sla="${!sla_var:-1000}"

              # Measure 3 runs
              times=()
              for i in 1 2 3; do
                start="$(date +%s%3N)"
                timeout 10 bash "${PLUGIN_DIR}/${entry_script}" \
                  2>/dev/null || true
                end="$(date +%s%3N)"
                times+=($((end - start)))
              done

              # Calculate median
              IFS=$'\n' sorted=($(printf '%s\n' "${times[@]}" | sort -n))
              unset IFS
              median="${sorted[1]}"

              # Visual bar
              bar_pct=$((median * 20 / sla))
              [[ ${bar_pct} -gt 20 ]] && bar_pct=20
              bar="$(printf '█%.0s' $(seq 1 ${bar_pct}) 2>/dev/null)\
          $(printf '░%.0s' $(seq 1 $((20 - bar_pct))) 2>/dev/null)"

              status_icon="✅"
              [[ ${median} -gt ${sla} ]] && status_icon="⚠️"

              printf "  %s %-12s │%s│ %4dms (SLA: %4dms)\n" \
                "${status_icon}" "${entry_key}.sh" "${bar}" \
                "${median}" "${sla}"
            done
          else
            echo ""
            echo "  [8/8] Performance benchmarks: SKIPPED"
          fi

          # ── Summary ─────────────────────────────────────────────────────
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  🔌 Plugin: %-48s║\n" "${PLUGIN_ID}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  🔴 Errors:   %-44s║\n" "${errors}"
          printf "║  🟠 Warnings: %-44s║\n" "${warnings}"
          echo "╠══════════════════════════════════════════════════════════════╣"

          passed="true"
          [[ ${errors} -gt 0 ]] && passed="false"

          if [[ "${passed}" == "true" ]]; then
            echo "║  ✅ STATUS: PASSED                                          ║"
          else
            echo "║  ❌ STATUS: FAILED                                          ║"
          fi
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Save results
          jq -n \
            --arg id "${PLUGIN_ID}" \
            --arg dir "${PLUGIN_DIR}" \
            --argjson errors "${errors}" \
            --argjson warnings "${warnings}" \
            --arg passed "${passed}" \
            '{id: $id, dir: $dir, errors: $errors,
              warnings: $warnings, passed: ($passed == "true")}' \
            > "plugin-validation-${PLUGIN_ID}.json"

          echo "errors=${errors}"   >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"   >> "${GITHUB_OUTPUT}"

          [[ "${passed}" == "true" ]] && exit 0 || exit 1

      - name: "📤 Upload Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "plugin-validation-${{ matrix.plugin_id }}"
          path: "plugin-validation-${{ matrix.plugin_id }}.json"
          retention-days: 14
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — Plugin Validation"
    needs: [discover, validate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "📥 Download Results"
        uses: actions/download-artifact@v4
        with:
          pattern: "plugin-validation-*"
          merge-multiple: true
          path: ./plugin-results/
        continue-on-error: true

      - name: "📊 Aggregate & Report"
        id: aggregate
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📊 Plugin Validation Aggregate                             ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          python3 << 'AGGREGATE'
          import json, glob
          from pathlib import Path

          total_errors = 0
          total_warnings = 0
          passed = 0
          failed = 0
          results = []

          for f in sorted(glob.glob("plugin-results/*.json")):
              try:
                  data = json.loads(Path(f).read_text())
                  results.append(data)
                  total_errors += data.get("errors", 0)
                  total_warnings += data.get("warnings", 0)
                  if data.get("passed"):
                      passed += 1
                  else:
                      failed += 1
              except Exception as e:
                  print(f"  ⚠️  {f}: {e}")

          print(f"\n  🔌 Total plugins:  {len(results)}")
          print(f"  ✅ Passed:         {passed}")
          print(f"  ❌ Failed:         {failed}")
          print(f"  🔴 Total errors:   {total_errors}")
          print(f"  🟠 Total warnings: {total_warnings}")

          print("\n  📋 Plugin Results:")
          for r in sorted(results, key=lambda x: (not x.get("passed"), x.get("id",""))):
              s = "✅" if r.get("passed") else "❌"
              e = r.get("errors", 0)
              w = r.get("warnings", 0)
              print(f"     {s} {r.get('id','?'):<30} E:{e} W:{w}")

          report = {
              "total": len(results), "passed": passed,
              "failed": failed, "errors": total_errors,
              "warnings": total_warnings, "plugins": results
          }
          Path("plugin-validation-report.json").write_text(
              json.dumps(report, indent=2)
          )
          AGGREGATE

      - name: "💬 Post PR Comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = {total:0,passed:0,failed:0,errors:0,warnings:0,plugins:[]};
            try {
              report = JSON.parse(
                fs.readFileSync('plugin-validation-report.json','utf8')
              );
            } catch(e) {}

            const overallPassed = report.failed === 0;
            const icon   = overallPassed ? '✅' : '❌';
            const status = overallPassed ? 'PASSED' : 'FAILED';

            const pluginRows = report.plugins
              .map(p => {
                const s = p.passed ? '✅' : '❌';
                return `| ${s} \`${p.id}\` | ${p.errors} | ${p.warnings} |`;
              }).join('\n');

            const body = `## 🔌 Plugin Validation ${icon}

            **Status: ${status}** | **${report.total}** plugins validated

            | Plugin | Errors | Warnings |
            |--------|--------|----------|
            ${pluginRows}

            **Checks performed:** Manifest • ShellCheck • Secrets • Permissions • Dangerous patterns • Lifecycle • Performance

            ${overallPassed
              ? '### ✨ All plugins pass validation!'
              : `### 🔧 Fix Required\n\n\`\`\`bash\n# Validate locally:\nash plugin validate --strict ./plugins/my-plugin/\n\n# Security scan:\nshellcheck --enable=all plugins/my-plugin/**/*.sh\n\`\`\``
            }

            ---
            *🤖 ASH Plugin Validation • [Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🔌 Plugin Validation')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: "🚦 Evaluate Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 Plugin Validation Quality Gate                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          validate_result="${{ needs.validate.result }}"
          has_plugins="${{ needs.discover.outputs.has-plugins }}"

          echo ""
          echo "  📊 Gate: plugins=${has_plugins}, result=${validate_result}"
          echo ""

          if [[ "${has_plugins}" == "false" ]]; then
            echo "  ℹ️  No plugins found — gate skipped"
            exit 0
          fi

          if [[ "${validate_result}" == "success" ]]; then
            echo "  ✅ QUALITY GATE: PASSED"
            echo "  🎉 All plugins pass validation!"
          else
            echo "  ❌ QUALITY GATE: FAILED"
            exit 1
          fi