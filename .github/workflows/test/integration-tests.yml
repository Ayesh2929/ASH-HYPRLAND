# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🔗 ASH DOTFILES v5.0 OMEGA — INTEGRATION TESTS WORKFLOW                          ║
# ║                                                                                          ║
# ║      Ultra-Premium Integration Test Execution Pipeline                                  ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      Full Workflow Tests   •  Component Integration  •  API Contract Tests            ║
# ║      Theme Pipeline        •  Mode Switching         •  Plugin Lifecycle              ║
# ║      Snapshot System       •  Hot Reload Engine      •  Hook Chain Tests             ║
# ║      Color Pipeline        •  Update System          •  Doctor Integration           ║
# ║      Multi-Component       •  State Management       •  Service Integration          ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🔗 Integration Tests — Component Workflows"

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths:
      - "ash-cli/**"
      - "scripts/**"
      - "config/**"
      - "tests/integration/**"
      - "tests/helpers/**"
      - ".github/workflows/test/integration-tests.yml"

  pull_request:
    branches: [main, develop, "release/**"]
    paths:
      - "ash-cli/**"
      - "scripts/**"
      - "config/**"
      - "tests/integration/**"
      - ".github/workflows/test/integration-tests.yml"
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      test_suite:
        description: "Integration suite to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - theme-workflow
          - mode-switching
          - plugin-lifecycle
          - snapshot-workflow
          - doctor
          - update
          - hot-reload
          - hooks
          - color-pipeline
          - api-endpoints
          - ai-engine
      environment:
        description: "Test environment"
        required: false
        default: "mock"
        type: choice
        options: [mock, partial, full]
      fail_fast:
        description: "Stop on first failure"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: "integration-tests-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  BATS_VERSION: "1.11.0"
  ASH_TEST_MODE: "1"
  ASH_NO_COLOR: "1"
  ASH_LOG_LEVEL: "info"
  TEST_TIMEOUT: "600"
  INTEGRATION_ENV: "${{ inputs.environment || 'mock' }}"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: DISCOVER
  # ────────────────────────────────────────────────────────────────────────────
  discover:
    name: "🔍 Discover Integration Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      test-matrix: ${{ steps.discover.outputs.test_matrix }}
      test-count:  ${{ steps.discover.outputs.test_count }}
      has-tests:   ${{ steps.discover.outputs.has_tests }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔍 Discover Integration Tests"
        id: discover
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔗 Integration Test Discovery                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          selected="${{ inputs.test_suite || 'all' }}"

          mapfile -t all_tests < <(
            find tests/integration -type f -name "test-*.sh" \
              ! -path "*/fixtures/*" \
              | sort 2>/dev/null || true
          )

          if [[ "${selected}" != "all" ]]; then
            mapfile -t all_tests < <(
              printf '%s\n' "${all_tests[@]}" | grep "${selected}" || true
            )
          fi

          test_count="${#all_tests[@]}"

          echo ""
          echo "  📊 Integration Test Discovery:"
          echo "  ├── Total suites: ${test_count}"
          echo "  └── Environment:  ${{ env.INTEGRATION_ENV }}"
          echo ""

          matrix_include="[]"
          for test_file in "${all_tests[@]}"; do
            suite="$(basename "${test_file}" .sh | sed 's/^test-//')"
            cases="$(grep -c "^@test\|^test_" "${test_file}" 2>/dev/null || echo 0)"
            echo "     ✅ ${suite}: ${cases} integration tests"

            matrix_include="$(echo "${matrix_include}" | jq \
              --arg suite "${suite}" \
              --arg file "${test_file}" \
              --arg cases "${cases}" \
              '. += [{"suite": $suite, "file": $file, "cases": $cases}]')"
          done

          echo "test_matrix={\"include\": ${matrix_include}}" >> "${GITHUB_OUTPUT}"
          echo "test_count=${test_count}"    >> "${GITHUB_OUTPUT}"
          echo "has_tests=$([ "${test_count}" -gt 0 ] && echo 'true' || echo 'false')" \
            >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: ENVIRONMENT — Build full mock desktop environment
  # ────────────────────────────────────────────────────────────────────────────
  environment:
    name: "🏗️ Build Integration Environment"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📦 Install Integration Dependencies"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🏗️  Building Integration Test Environment                   ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          sudo apt-get update -qq
          sudo apt-get install -qq -y \
            bash jq bc python3 python3-pip \
            imagemagick libmagickwand-dev \
            curl wget git \
            socat netcat-openbsd \
            inotify-tools \
            procps \
            2>/dev/null

          pip3 install -q \
            Pillow colorthief fastapi uvicorn \
            httpx pytest-asyncio \
            2>/dev/null || true

          # Install BATS
          git clone --depth=1 \
            --branch="v${{ env.BATS_VERSION }}" \
            https://github.com/bats-core/bats-core.git \
            /tmp/bats 2>/dev/null
          sudo /tmp/bats/install.sh /usr/local 2>/dev/null

          for lib in support assert file; do
            git clone --depth=1 \
              "https://github.com/bats-core/bats-${lib}.git" \
              "/usr/local/lib/bats-${lib}" 2>/dev/null
          done

          echo "  ✅ Integration environment ready"

      - name: "🏗️ Build Mock ASH Desktop"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🏗️  Mock Desktop Environment                                ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          INT_HOME="${RUNNER_TEMP}/ash-integration"
          mkdir -p \
            "${INT_HOME}/.config/ash/themes/catppuccin-mocha" \
            "${INT_HOME}/.config/ash/plugins" \
            "${INT_HOME}/.config/hypr" \
            "${INT_HOME}/.config/waybar" \
            "${INT_HOME}/.config/dunst" \
            "${INT_HOME}/.config/kitty" \
            "${INT_HOME}/.local/share/ash/state" \
            "${INT_HOME}/.local/share/ash/cache/colors" \
            "${INT_HOME}/.local/share/ash/logs" \
            "${INT_HOME}/.local/share/ash/plugins" \
            "${INT_HOME}/.local/share/ash/snapshots" \
            "${INT_HOME}/.local/share/ash/data" \
            "${INT_HOME}/mock-bin" \
            "${INT_HOME}/Pictures"

          # ── Install ASH CLI ───────────────────────────────────────────────
          cp -r ash-cli/. "${INT_HOME}/.local/share/ash-cli/"
          mkdir -p "${INT_HOME}/bin"
          cat > "${INT_HOME}/bin/ash" << 'ASHSCRIPT'
          #!/usr/bin/env bash
          exec "${HOME}/.local/share/ash-cli/ash" "$@"
          ASHSCRIPT
          chmod +x "${INT_HOME}/bin/ash"

          # ── Create mock config files ──────────────────────────────────────
          cat > "${INT_HOME}/.config/ash/ash.conf" << 'ASHCONF'
          theme.active = "catppuccin-mocha"
          theme.auto = false
          theme.transition = "smooth"
          wallpaper.current = "~/Pictures/default-dark.jpg"
          wallpaper.engine = "swww"
          mode.current = "default"
          plugin.enabled = true
          plugin.registry.official = true
          plugin.registry.community = false
          analytics.enabled = false
          notifications.enabled = true
          bar.layout = "top-bar"
          ASHCONF

          # ── Mock theme ────────────────────────────────────────────────────
          cat > "${INT_HOME}/.config/ash/themes/catppuccin-mocha/theme.conf" << 'THEMECONF'
          name = "Catppuccin Mocha"
          id = "catppuccin-mocha"
          version = "1.0.0"
          category = "dark"
          THEMECONF

          cat > "${INT_HOME}/.config/ash/themes/catppuccin-mocha/colors.json" << 'COLORS'
          {
            "base": {
              "background": "#1e1e2e",
              "surface": "#313244",
              "foreground": "#cdd6f4"
            },
            "accent": {
              "primary": "#cba6f7",
              "secondary": "#89b4fa",
              "error": "#f38ba8",
              "success": "#a6e3a1"
            }
          }
          COLORS

          # ── State files ───────────────────────────────────────────────────
          cat > "${INT_HOME}/.local/share/ash/state/current-theme.json" << 'STATE'
          {
            "theme_id": "catppuccin-mocha",
            "applied_at": "2024-01-15T14:32:00Z",
            "mode": "default"
          }
          STATE

          # ── Mock wallpaper ────────────────────────────────────────────────
          convert \
            -size 1920x1080 \
            xc:"#1e1e2e" \
            "${INT_HOME}/Pictures/default-dark.jpg" 2>/dev/null || \
          dd if=/dev/urandom of="${INT_HOME}/Pictures/default-dark.jpg" \
            bs=1024 count=10 2>/dev/null

          # ── Comprehensive mock executables ────────────────────────────────
          declare -A MOCK_RESPONSES=(
            ["hyprctl"]='{"version":"0.36.0","monitors":[{"name":"eDP-1","width":2560,"height":1600,"scale":1.5}]}'
            ["waybar"]='{"status":"running","pid":1234}'
            ["dunst"]='{"status":"running"}'
          )

          for cmd in hyprctl waybar dunst kitty swww \
                     notify-send rofi playerctl; do
            response="${MOCK_RESPONSES[$cmd]:-}"
            cat > "${INT_HOME}/mock-bin/${cmd}" << MOCKSCRIPT
          #!/usr/bin/env bash
          LOGFILE="${INT_HOME}/mock-calls.log"
          echo "[$(date +%H:%M:%S)] MOCK[${cmd}]: \$*" >> "\${LOGFILE}"
          case "\$1" in
            version|--version|-v)
              echo "mock-${cmd} 1.0.0";;
            *)
              echo '${response}' 2>/dev/null || echo "ok";;
          esac
          exit 0
          MOCKSCRIPT
            chmod +x "${INT_HOME}/mock-bin/${cmd}"
          done

          # ── Mock systemctl for services ───────────────────────────────────
          cat > "${INT_HOME}/mock-bin/systemctl" << 'SYSTEMCTL'
          #!/usr/bin/env bash
          case "$2" in
            ash-*.service|ash-*.timer)
              echo "[mock-systemctl] $*"
              exit 0;;
            *)
              /usr/bin/systemctl "$@" 2>/dev/null || exit 0;;
          esac
          SYSTEMCTL
          chmod +x "${INT_HOME}/mock-bin/systemctl"

          # Export environment
          echo "INT_HOME=${INT_HOME}" >> "${GITHUB_ENV}"
          echo "HOME=${INT_HOME}"     >> "${GITHUB_ENV}"
          echo "PATH=${INT_HOME}/mock-bin:${INT_HOME}/bin:${PATH}" >> "${GITHUB_ENV}"
          echo "XDG_CONFIG_HOME=${INT_HOME}/.config" >> "${GITHUB_ENV}"
          echo "XDG_DATA_HOME=${INT_HOME}/.local/share" >> "${GITHUB_ENV}"
          echo "ASH_CONFIG_HOME=${INT_HOME}/.config/ash" >> "${GITHUB_ENV}"
          echo "ASH_DATA_HOME=${INT_HOME}/.local/share/ash" >> "${GITHUB_ENV}"

          echo "  ✅ Mock desktop environment ready"
          echo "  📁 Structure:"
          find "${INT_HOME}" -maxdepth 3 -type d | head -30 | \
            while IFS= read -r d; do
              echo "     ${d}"
            done

      - name: "📤 Cache Integration Environment"
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/bin/bats
            /usr/local/lib/bats-*
          key: "bats-integration-${{ env.BATS_VERSION }}-${{ runner.os }}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: RUN INTEGRATION TESTS — Parallel by suite
  # ────────────────────────────────────────────────────────────────────────────
  run-integration:
    name: "🔗 ${{ matrix.suite }}"
    needs: [discover, environment]
    if: needs.discover.outputs.has-tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: ${{ inputs.fail_fast == 'true' }}
      matrix: ${{ fromJson(needs.discover.outputs.test-matrix) }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📥 Restore BATS"
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/bin/bats
            /usr/local/lib/bats-*
          key: "bats-integration-${{ env.BATS_VERSION }}-${{ runner.os }}"
          restore-keys: "bats-integration-"

      - name: "📦 Install Dependencies"
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y \
            bash jq bc python3 python3-pip \
            imagemagick curl wget socat \
            inotify-tools procps \
            2>/dev/null

          pip3 install -q Pillow colorthief 2>/dev/null || true

          if ! command -v bats &>/dev/null; then
            git clone --depth=1 \
              --branch="v${{ env.BATS_VERSION }}" \
              https://github.com/bats-core/bats-core.git /tmp/bats 2>/dev/null
            sudo /tmp/bats/install.sh /usr/local 2>/dev/null
            for lib in support assert file; do
              git clone --depth=1 \
                "https://github.com/bats-core/bats-${lib}.git" \
                "/usr/local/lib/bats-${lib}" 2>/dev/null
            done
          fi

      - name: "🏗️ Prepare Suite Environment"
        shell: bash
        run: |
          INT_HOME="${RUNNER_TEMP}/ash-integration"
          mkdir -p \
            "${INT_HOME}/.config/ash/themes/catppuccin-mocha" \
            "${INT_HOME}/.config/hypr" \
            "${INT_HOME}/.local/share/ash/"{state,cache,logs,plugins,snapshots,data} \
            "${INT_HOME}/mock-bin" \
            "${INT_HOME}/bin" \
            "${INT_HOME}/Pictures"

          # Recreate mock environment
          cp -r ash-cli/. "${INT_HOME}/.local/share/ash-cli/" 2>/dev/null || true

          cat > "${INT_HOME}/bin/ash" << 'ASHSCRIPT'
          #!/usr/bin/env bash
          exec "${HOME}/.local/share/ash-cli/ash" "$@"
          ASHSCRIPT
          chmod +x "${INT_HOME}/bin/ash"

          cat > "${INT_HOME}/.config/ash/ash.conf" << 'ASHCONF'
          theme.active = "catppuccin-mocha"
          theme.transition = "smooth"
          mode.current = "default"
          plugin.enabled = true
          analytics.enabled = false
          ASHCONF

          cat > "${INT_HOME}/.config/ash/themes/catppuccin-mocha/colors.json" << 'COLORS'
          {"base":{"background":"#1e1e2e","surface":"#313244","foreground":"#cdd6f4"},"accent":{"primary":"#cba6f7"}}
          COLORS

          cat > "${INT_HOME}/.local/share/ash/state/current-theme.json" << 'STATE'
          {"theme_id":"catppuccin-mocha","applied_at":"2024-01-15T14:32:00Z","mode":"default"}
          STATE

          # Mock executables
          for cmd in hyprctl waybar dunst kitty swww notify-send rofi \
                     systemctl playerctl; do
            cat > "${INT_HOME}/mock-bin/${cmd}" << MOCKSCRIPT
          #!/usr/bin/env bash
          echo "[$(date +%H:%M:%S)] MOCK[${cmd}]: \$*" >> "${INT_HOME}/mock-calls.log"
          exit 0
          MOCKSCRIPT
            chmod +x "${INT_HOME}/mock-bin/${cmd}"
          done

          # Create test wallpaper
          convert -size 100x100 xc:"#1e1e2e" \
            "${INT_HOME}/Pictures/default-dark.jpg" 2>/dev/null || \
          dd if=/dev/zero of="${INT_HOME}/Pictures/default-dark.jpg" \
            bs=1024 count=1 2>/dev/null

          echo "INT_HOME=${INT_HOME}" >> "${GITHUB_ENV}"
          echo "HOME=${INT_HOME}"     >> "${GITHUB_ENV}"
          echo "PATH=${INT_HOME}/mock-bin:${INT_HOME}/bin:${PATH}" >> "${GITHUB_ENV}"
          echo "XDG_CONFIG_HOME=${INT_HOME}/.config" >> "${GITHUB_ENV}"
          echo "XDG_DATA_HOME=${INT_HOME}/.local/share" >> "${GITHUB_ENV}"
          echo "ASH_CONFIG_HOME=${INT_HOME}/.config/ash" >> "${GITHUB_ENV}"
          echo "ASH_DATA_HOME=${INT_HOME}/.local/share/ash" >> "${GITHUB_ENV}"
          echo "ASH_TEST_MODE=1"   >> "${GITHUB_ENV}"
          echo "ASH_NO_COLOR=1"    >> "${GITHUB_ENV}"
          echo "ASH_LOG_LEVEL=debug" >> "${GITHUB_ENV}"

      - name: "🔗 Run Integration Suite: ${{ matrix.suite }}"
        id: run
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔗 Integration: ${{ matrix.suite }}                         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          test_file="${{ matrix.file }}"
          suite="${{ matrix.suite }}"

          echo "  Test:  ${test_file}"
          echo "  Cases: ${{ matrix.cases }}"
          echo "  Env:   ${{ env.INTEGRATION_ENV }}"
          echo ""

          mkdir -p test-results

          bats_exit=0
          bats \
            --tap \
            --timing \
            --no-tempdir-cleanup \
            "${test_file}" \
            > "test-results/integration-${suite}.tap" 2>&1 || bats_exit=$?

          cat "test-results/integration-${suite}.tap"

          # Parse results
          passed="$(grep -c "^ok " "test-results/integration-${suite}.tap" || echo 0)"
          failed="$(grep -c "^not ok " "test-results/integration-${suite}.tap" || echo 0)"

          # Convert TAP to JUnit XML
          python3 << JUNIT
          import re, html, sys

          tap = open("test-results/integration-${suite}.tap").read()
          suite_name = "${suite}"
          passed = ${passed}
          failed = ${failed}
          total  = passed + failed

          cases = []
          for line in tap.split('\n'):
              ok_m   = re.match(r'^ok (\d+) (.+?)(?:\s*#.*)?$', line)
              fail_m = re.match(r'^not ok (\d+) (.+?)(?:\s*#.*)?$', line)
              if ok_m:
                  cases.append({'name': ok_m.group(2), 'passed': True})
              elif fail_m:
                  cases.append({'name': fail_m.group(2), 'passed': False})

          xml = ['<?xml version="1.0" encoding="UTF-8"?>',
                 f'<testsuite name="integration-{suite_name}" '
                 f'tests="{total}" failures="{failed}" errors="0">']

          for c in cases:
              name = html.escape(c['name'])
              cls  = f"integration.{suite_name}"
              if c['passed']:
                  xml.append(f'  <testcase name="{name}" classname="{cls}"/>')
              else:
                  xml.append(
                      f'  <testcase name="{name}" classname="{cls}">'
                      f'<failure message="Integration test failed"/></testcase>'
                  )

          xml.append('</testsuite>')

          with open(f"test-results/integration-{suite_name}.xml", "w") as f:
              f.write('\n'.join(xml))
          JUNIT

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  🔗 Suite: %-49s║\n" "${suite}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  ✅ Passed: %-48s║\n" "${passed}"
          printf "║  ❌ Failed: %-48s║\n" "${failed}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          if [[ ${failed} -eq 0 ]]; then
            echo "║  ✅ STATUS: PASSED                                          ║"
          else
            echo "║  ❌ STATUS: FAILED                                          ║"
          fi
          echo "╚══════════════════════════════════════════════════════════════╝"

          [[ ${failed} -eq 0 ]] && exit 0 || exit 1

      - name: "📤 Upload Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "integration-results-${{ matrix.suite }}"
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — Integration Tests"
    needs: [discover, run-integration]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "💬 Post PR Comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runResult  = '${{ needs.run-integration.result }}';
            const testCount  = '${{ needs.discover.outputs.test-count }}';
            const hasTests   = '${{ needs.discover.outputs.has-tests }}';

            const passed = runResult === 'success';
            const icon   = passed ? '✅' : '❌';
            const status = passed ? 'PASSED' : 'FAILED';

            const body = `## 🔗 Integration Tests ${icon}

            **Status: ${status}** | **${testCount}** integration suites

            ${passed
              ? '### ✨ All integration tests pass!'
              : `### 🔧 Fix Required\n\n\`\`\`bash\n# Run locally:\nbash tests/run-integration-tests.sh\n# Run specific suite:\nbats tests/integration/test-theme-workflow.sh\n\`\`\``
            }

            ---
            *🤖 ASH Integration Tests • [Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🔗 Integration Tests')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: "🚦 Evaluate Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 Integration Test Quality Gate                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          has_tests="${{ needs.discover.outputs.has-tests }}"
          result="${{ needs.run-integration.result }}"

          echo ""
          echo "  📊 Gate: has_tests=${has_tests}, result=${result}"
          echo ""

          if [[ "${has_tests}" == "false" ]]; then
            echo "  ℹ️  No integration tests — gate skipped"
            exit 0
          fi

          if [[ "${result}" == "success" ]]; then
            echo "  ✅ QUALITY GATE: PASSED"
          else
            echo "  ❌ QUALITY GATE: FAILED"
            exit 1
          fi