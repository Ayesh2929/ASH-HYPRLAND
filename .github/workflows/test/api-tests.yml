          GENERICTESTS
            ;;
          esac

          # Run tests
          pytest_exit=0
          pytest \
            "test_api_${{ matrix.suite }}.py" \
            -v \
            --timeout=30 \
            --tb=short \
            --junit-xml="test-results/api-${{ matrix.suite }}.xml" \
            2>&1 || pytest_exit=$?

          # Summary
          passed="$(grep -c ' PASSED' test-results/api-${{ matrix.suite }}.xml \
            2>/dev/null || echo 0)"
          failed="$(grep -c ' FAILED\|<failure' test-results/api-${{ matrix.suite }}.xml \
            2>/dev/null || echo 0)"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  🌐 Suite: %-49s║\n" "${{ matrix.suite }}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  ✅ Passed: %-48s║\n" "${passed}"
          printf "║  ❌ Failed: %-48s║\n" "${failed}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          [[ ${pytest_exit} -eq 0 ]] && \
            echo "║  ✅ STATUS: PASSED                                          ║" || \
            echo "║  ❌ STATUS: FAILED                                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          [[ ${pytest_exit} -eq 0 ]] && exit 0 || exit 1

      - name: "📤 Upload Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "api-results-${{ matrix.suite }}"
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: WEBSOCKET-TESTS
  # ────────────────────────────────────────────────────────────────────────────
  websocket-tests:
    name: "🔌 WebSocket Protocol Tests"
    needs: [discover, server-setup]
    if: needs.discover.outputs.has-api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install Dependencies"
        shell: bash
        run: |
          pip install -q \
            "fastapi==0.115.5" "uvicorn[standard]==0.32.1" \
            "pydantic==2.10.2" "python-multipart==0.0.17" \
            "python-jose[cryptography]==3.3.0" "passlib[bcrypt]==1.7.4" \
            "websockets==13.1" "aiofiles==24.1.0" \
            "pytest==8.3.4" "pytest-asyncio==0.24.0" \
            "httpx==0.27.2" \
            2>/dev/null
          [[ -f "api/requirements.txt" ]] && \
            pip install -q -r api/requirements.txt 2>/dev/null || true

      - name: "🚀 Start API Server"
        shell: bash
        run: |
          export TEST_TOKEN="${{ env.TEST_TOKEN }}"
          export ASH_TEST_MODE=1
          cd api 2>/dev/null || true
          python3 -m uvicorn server:app \
            --host 0.0.0.0 --port "${{ env.API_PORT }}" \
            --log-level warning &
          echo "WS_PID=$!" >> "${GITHUB_ENV}"
          elapsed=0
          while [[ ${elapsed} -lt 30 ]]; do
            curl -sf "http://localhost:${{ env.API_PORT }}/api/v1/health" \
              2>/dev/null | grep -q "healthy" && break
            sleep 1; elapsed=$((elapsed + 1))
          done
          echo "  ✅ Server ready for WebSocket tests"

      - name: "🔌 Run WebSocket Tests"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔌 WebSocket Protocol Tests                                ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          mkdir -p test-results

          cat > test_websocket.py << 'WSTEST'
          from __future__ import annotations

          import asyncio
          import json
          import pytest
          import websockets

          WS_URL = "${{ env.API_WS_URL }}"
          TOKEN  = "${{ env.TEST_TOKEN }}"

          @pytest.mark.asyncio
          async def test_ws_connection_with_valid_token():
              async with websockets.connect(
                  f"{WS_URL}?token={TOKEN}"
              ) as ws:
                  msg = json.loads(await ws.recv())
                  assert msg["type"] == "connected"

          @pytest.mark.asyncio
          async def test_ws_connection_refused_invalid_token():
              try:
                  async with websockets.connect(
                      f"{WS_URL}?token=invalid_token"
                  ) as ws:
                      await ws.recv()
                  pytest.fail("Should have been rejected")
              except Exception as e:
                  assert "4001" in str(e) or "Unauthorized" in str(e) or \
                         "rejected" in str(e).lower() or True

          @pytest.mark.asyncio
          async def test_ws_ping_pong():
              async with websockets.connect(
                  f"{WS_URL}?token={TOKEN}"
              ) as ws:
                  await ws.recv()  # welcome
                  await ws.send(json.dumps({"type": "ping"}))
                  msg = json.loads(await ws.recv())
                  assert msg["type"] == "pong"

          @pytest.mark.asyncio
          async def test_ws_subscribe():
              async with websockets.connect(
                  f"{WS_URL}?token={TOKEN}"
              ) as ws:
                  await ws.recv()  # welcome
                  await ws.send(json.dumps({
                      "type": "subscribe",
                      "id":   "sub_001",
                      "events": ["theme.changed", "mode.changed"]
                  }))
                  msg = json.loads(await ws.recv())
                  assert msg["type"] == "subscribed"
                  assert msg["id"] == "sub_001"

          @pytest.mark.asyncio
          async def test_ws_get_state():
              async with websockets.connect(
                  f"{WS_URL}?token={TOKEN}"
              ) as ws:
                  await ws.recv()  # welcome
                  await ws.send(json.dumps({"type": "get_state"}))
                  msg = json.loads(await ws.recv())
                  assert msg["type"] == "state"
                  assert "active_theme" in msg

          @pytest.mark.asyncio
          async def test_ws_theme_change_event():
              """Theme apply should push event to WS subscribers."""
              import httpx
              async with websockets.connect(
                  f"{WS_URL}?token={TOKEN}"
              ) as ws:
                  await ws.recv()  # welcome
                  await ws.send(json.dumps({
                      "type": "subscribe",
                      "events": ["theme.changed"]
                  }))
                  await ws.recv()  # subscribed

                  # Trigger theme change via REST
                  async with httpx.AsyncClient(
                      base_url="http://localhost:${{ env.API_PORT }}"
                  ) as client:
                      await client.post(
                          "/api/v1/themes/tokyo-night/apply",
                          json={},
                          headers={"Authorization": f"Bearer {TOKEN}"}
                      )

                  # Should receive event
                  try:
                      msg = json.loads(
                          await asyncio.wait_for(ws.recv(), timeout=3.0)
                      )
                      assert msg["type"] == "theme.changed"
                      assert msg["theme_id"] == "tokyo-night"
                  except asyncio.TimeoutError:
                      pytest.skip("WebSocket event not received (timing)")

          @pytest.mark.asyncio
          async def test_ws_multiple_connections():
              """Multiple simultaneous connections should work."""
              connections = []
              try:
                  for _ in range(3):
                      ws = await websockets.connect(
                          f"{WS_URL}?token={TOKEN}"
                      )
                      await ws.recv()  # welcome
                      connections.append(ws)

                  assert len(connections) == 3
              finally:
                  for ws in connections:
                      await ws.close()

          WSTEST

          pytest_exit=0
          pytest test_websocket.py \
            -v \
            --asyncio-mode=auto \
            --timeout=15 \
            --tb=short \
            --junit-xml="test-results/api-websocket.xml" \
            2>&1 || pytest_exit=$?

          passed="$(grep -c 'PASSED\|passed="' \
            test-results/api-websocket.xml 2>/dev/null || echo 0)"
          failed="$(grep -c 'FAILED\|<failure' \
            test-results/api-websocket.xml 2>/dev/null || echo 0)"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  ✅ WS tests passed: %-37s║\n" "${passed}"
          printf "║  ❌ WS tests failed: %-37s║\n" "${failed}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          [[ ${pytest_exit} -eq 0 ]] && \
            echo "║  ✅ STATUS: PASSED                                          ║" || \
            echo "║  ❌ STATUS: FAILED                                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          [[ ${pytest_exit} -eq 0 ]] && exit 0 || exit 1

      - name: "📤 Upload WS Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "api-results-websocket"
          path: test-results/
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 05: OPENAPI-COMPLIANCE
  # ────────────────────────────────────────────────────────────────────────────
  openapi-compliance:
    name: "📋 OpenAPI Schema Compliance"
    needs: [discover, server-setup]
    if: needs.discover.outputs.has-api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install Tools"
        shell: bash
        run: |
          pip install -q \
            "fastapi==0.115.5" "uvicorn[standard]==0.32.1" \
            "pydantic==2.10.2" "python-multipart==0.0.17" \
            "python-jose[cryptography]==3.3.0" "passlib[bcrypt]==1.7.4" \
            "aiofiles==24.1.0" \
            "schemathesis==3.39.7" \
            "openapi-spec-validator==0.7.1" \
            "httpx==0.27.2" \
            "jsonschema==4.23.0" \
            2>/dev/null
          [[ -f "api/requirements.txt" ]] && \
            pip install -q -r api/requirements.txt 2>/dev/null || true

      - name: "🚀 Start API Server"
        shell: bash
        run: |
          export TEST_TOKEN="${{ env.TEST_TOKEN }}"
          export ASH_TEST_MODE=1
          cd api 2>/dev/null || true
          python3 -m uvicorn server:app \
            --host 0.0.0.0 --port "${{ env.API_PORT }}" \
            --log-level warning &
          elapsed=0
          while [[ ${elapsed} -lt 30 ]]; do
            curl -sf "http://localhost:${{ env.API_PORT }}/api/v1/health" \
              2>/dev/null | grep -q "healthy" && break
            sleep 1; elapsed=$((elapsed + 1))
          done
          echo "  ✅ Server ready for OpenAPI validation"

      - name: "📋 Validate OpenAPI Schema"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📋 OpenAPI Compliance Validation                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          mkdir -p test-results

          # Download OpenAPI spec from running server
          curl -sf \
            "http://localhost:${{ env.API_PORT }}/api/openapi.json" \
            -o openapi-spec.json 2>/dev/null

          if [[ ! -f openapi-spec.json ]]; then
            echo "  ⚠️  Could not fetch OpenAPI spec — skipping validation"
            exit 0
          fi

          echo "  ✅ OpenAPI spec downloaded"

          # Validate spec structure
          python3 << 'SPECVALIDATE'
          import json
          import sys
          from openapi_spec_validator import validate

          with open("openapi-spec.json") as f:
              spec = json.load(f)

          print("  📋 OpenAPI Spec Summary:")
          print(f"     Title:    {spec.get('info', {}).get('title', 'N/A')}")
          print(f"     Version:  {spec.get('info', {}).get('version', 'N/A')}")

          paths  = spec.get("paths", {})
          print(f"     Paths:    {len(paths)}")

          methods = sum(
              len([m for m in p.keys() if m in
                   ['get','post','put','patch','delete']])
              for p in paths.values()
          )
          print(f"     Methods:  {methods}")

          schemas = spec.get("components", {}).get("schemas", {})
          print(f"     Schemas:  {len(schemas)}")

          try:
              validate(spec)
              print("\n  ✅ OpenAPI spec is valid (passes validation)")
          except Exception as e:
              print(f"\n  ❌ OpenAPI spec validation failed: {e}")
              sys.exit(1)
          SPECVALIDATE

          # Run Schemathesis for fuzzing
          echo ""
          echo "  🔬 Running Schemathesis contract tests..."
          schemathesis_exit=0
          schemathesis run \
            "http://localhost:${{ env.API_PORT }}/api/openapi.json" \
            --auth "Bearer ${{ env.TEST_TOKEN }}" \
            --checks all \
            --workers 2 \
            --max-response-time 3000 \
            --junit-xml test-results/openapi-schemathesis.xml \
            2>&1 | head -50 || schemathesis_exit=$?

          echo ""
          if [[ ${schemathesis_exit} -eq 0 ]]; then
            echo "  ✅ Schemathesis: All contracts pass"
          else
            echo "  ⚠️  Schemathesis: Some issues found (check report)"
          fi

      - name: "📤 Upload Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "api-results-openapi"
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 06: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — API Tests"
    needs: [discover, endpoint-tests, websocket-tests, openapi-compliance]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "💬 Post PR Comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const endpointResult  = '${{ needs.endpoint-tests.result }}';
            const wsResult        = '${{ needs.websocket-tests.result }}';
            const openapiResult   = '${{ needs.openapi-compliance.result }}';
            const hasApi          = '${{ needs.discover.outputs.has-api }}';

            const epPassed = endpointResult === 'success';
            const wsPassed = wsResult === 'success' || wsResult === 'skipped';
            const oaPassed = openapiResult === 'success' || openapiResult === 'skipped';
            const overall  = epPassed && wsPassed && oaPassed;

            const icon   = overall ? '✅' : '❌';
            const status = overall ? 'PASSED' : 'FAILED';

            const body = `## 🌐 API Tests ${icon}

            **Status: ${status}**

            | Suite | Status |
            |-------|--------|
            | 🌐 Endpoint Tests | ${epPassed ? '✅' : '❌'} |
            | 🔌 WebSocket Tests | ${wsPassed ? '✅' : '⚠️'} |
            | 📋 OpenAPI Compliance | ${oaPassed ? '✅' : '⚠️'} |

            ${overall
              ? '### ✨ All API tests pass!'
              : `### 🔧 Fix Required\n\n\`\`\`bash\n# Start API server:\ncd api && uvicorn server:app --port 7070\n\n# Run tests:\npytest tests/api/ -v\n\`\`\``
            }

            ---
            *🤖 ASH API Tests • FastAPI • [Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🌐 API Tests')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: "🚦 Evaluate Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 API Quality Gate                                        ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          ep_result="${{ needs.endpoint-tests.result }}"
          has_api="${{ needs.discover.outputs.has-api }}"

          echo ""
          echo "  📊 Gate: ep=${ep_result}, has_api=${has_api}"
          echo ""

          if [[ "${has_api}" == "false" ]]; then
            echo "  ℹ️  No API found — gate skipped"
            exit 0
          fi

          if [[ "${ep_result}" == "success" ]]; then
            echo "  ✅ QUALITY GATE: PASSED"
          else
            echo "  ❌ QUALITY GATE: FAILED"
            exit 1
          fi