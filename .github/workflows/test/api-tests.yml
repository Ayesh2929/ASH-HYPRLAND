# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🌐 ASH DOTFILES v5.0 OMEGA — API TESTS WORKFLOW                                  ║
# ║                                                                                          ║
# ║      Ultra-Premium REST API & WebSocket Test Execution Pipeline                         ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      FastAPI Server Tests  •  OpenAPI Compliance   •  WebSocket Protocol              ║
# ║      Auth Flow Testing     •  Rate Limit Testing   •  Error Response Audit           ║
# ║      Endpoint Coverage     •  Schema Validation    •  Contract Testing               ║
# ║      Load Testing          •  Security Scanning    •  Mutation Testing               ║
# ║      Mock Desktop Bridge   •  Response Timing      •  Concurrent Requests            ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🌐 API Tests — REST & WebSocket"

# ══════════════════════════════════════════════════════════════════════════════
# TRIGGER CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
    paths:
      - "api/**"
      - "tests/api/**"
      - ".github/workflows/test/api-tests.yml"

  pull_request:
    branches:
      - main
      - develop
      - "release/**"
    paths:
      - "api/**"
      - "tests/api/**"
      - ".github/workflows/test/api-tests.yml"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:
    inputs:
      test_suite:
        description: "API test suite"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - theme-endpoints
          - plugin-endpoints
          - snapshot-endpoints
          - config-endpoints
          - wallpaper-endpoints
          - mode-endpoints
          - analytics-endpoints
          - ai-endpoints
          - auth-endpoints
          - websocket
          - rate-limits
          - error-handling
          - openapi-compliance
          - security
          - load-test
      api_port:
        description: "API server port"
        required: false
        default: "7070"
        type: string
      load_users:
        description: "Concurrent users for load test"
        required: false
        default: "10"
        type: string
      fail_fast:
        description: "Stop on first failure"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "0 3 * * *"

# ══════════════════════════════════════════════════════════════════════════════
# PERMISSIONS
# ══════════════════════════════════════════════════════════════════════════════
permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

# ══════════════════════════════════════════════════════════════════════════════
# CONCURRENCY
# ══════════════════════════════════════════════════════════════════════════════
concurrency:
  group: "api-tests-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════════════════
# GLOBAL ENV
# ══════════════════════════════════════════════════════════════════════════════
env:
  PYTHON_VERSION: "3.12"
  API_PORT: "${{ inputs.api_port || '7070' }}"
  API_BASE_URL: "http://localhost:${{ inputs.api_port || '7070' }}"
  API_WS_URL: "ws://localhost:${{ inputs.api_port || '7070' }}/ws/v1"
  TEST_TOKEN: "ash_test_token_e2e_ultraomega_${{ github.run_id }}"
  ASH_TEST_MODE: "1"
  ASH_NO_COLOR: "1"
  LOAD_USERS: "${{ inputs.load_users || '10' }}"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: DISCOVER
  # ────────────────────────────────────────────────────────────────────────────
  discover:
    name: "🔍 Discover API Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      test-matrix:   ${{ steps.discover.outputs.test_matrix }}
      test-count:    ${{ steps.discover.outputs.test_count }}
      has-api:       ${{ steps.discover.outputs.has_api }}
      has-tests:     ${{ steps.discover.outputs.has_tests }}
      openapi-spec:  ${{ steps.discover.outputs.openapi_spec }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔍 Discover API Files & Tests"
        id: discover
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🌐 API Test Discovery Engine                               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          selected="${{ inputs.test_suite || 'all' }}"

          # Check API server exists
          has_api="false"
          [[ -f "api/server.py" || -d "api" ]] && has_api="true"

          # Find OpenAPI spec
          openapi_spec=""
          for spec_path in "api/openapi.yaml" "api/openapi.yml" "api/openapi.json"; do
            [[ -f "${spec_path}" ]] && openapi_spec="${spec_path}" && break
          done

          # Find test files
          mapfile -t all_tests < <(
            find tests/api -type f -name "test_*.py" \
              2>/dev/null | sort || true
          )

          if [[ "${selected}" != "all" ]]; then
            mapfile -t all_tests < <(
              printf '%s\n' "${all_tests[@]}" | \
                grep "${selected}" || true
            )
          fi

          test_count="${#all_tests[@]}"

          echo ""
          echo "  📊 API Discovery Results:"
          echo "  ├── API server found: ${has_api}"
          echo "  ├── OpenAPI spec:     ${openapi_spec:-not found}"
          echo "  ├── Test files:       ${test_count}"
          echo "  └── Selected suite:   ${selected}"
          echo ""

          # Build matrix
          matrix_include="[]"
          for test_file in "${all_tests[@]}"; do
            suite="$(basename "${test_file}" .py | sed 's/^test_//')"
            cases="$(grep -c "def test_\|async def test_" "${test_file}" \
              2>/dev/null || echo 0)"

            echo "     📋 ${suite}: ${cases} test cases"

            matrix_include="$(echo "${matrix_include}" | jq \
              --arg suite "${suite}" \
              --arg file "${test_file}" \
              --arg cases "${cases}" \
              '. += [{"suite": $suite, "file": $file, "cases": $cases}]')"
          done

          echo "test_matrix={\"include\": ${matrix_include}}" >> "${GITHUB_OUTPUT}"
          echo "test_count=${test_count}"       >> "${GITHUB_OUTPUT}"
          echo "has_api=${has_api}"             >> "${GITHUB_OUTPUT}"
          echo "openapi_spec=${openapi_spec}"   >> "${GITHUB_OUTPUT}"
          echo "has_tests=$([ "${test_count}" -gt 0 ] && echo 'true' || echo 'false')" \
            >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: SERVER-SETUP — Spin up API server
  # ────────────────────────────────────────────────────────────────────────────
  server-setup:
    name: "🚀 Launch API Server"
    needs: discover
    if: needs.discover.outputs.has-api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install API Dependencies"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📦 Installing API Server Dependencies                      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          pip install -q --upgrade pip

          # Core API framework
          pip install -q \
            "fastapi==0.115.5" \
            "uvicorn[standard]==0.32.1" \
            "pydantic==2.10.2" \
            "pydantic-settings==2.6.1" \
            "python-multipart==0.0.17" \
            "python-jose[cryptography]==3.3.0" \
            "passlib[bcrypt]==1.7.4" \
            "websockets==13.1" \
            "httpx==0.27.2" \
            "anyio==4.7.0" \
            "aiofiles==24.1.0"

          # Test framework
          pip install -q \
            "pytest==8.3.4" \
            "pytest-asyncio==0.24.0" \
            "pytest-xdist==3.6.1" \
            "pytest-timeout==2.3.1" \
            "pytest-cov==6.0.0" \
            "pytest-html==4.1.1" \
            "httpx==0.27.2" \
            "websocket-client==1.8.0" \
            "locust==2.32.3"

          # Schema & security testing
          pip install -q \
            "schemathesis==3.39.7" \
            "openapi-spec-validator==0.7.1" \
            "jsonschema==4.23.0"

          # Install project requirements
          [[ -f "api/requirements.txt" ]] && \
            pip install -q -r api/requirements.txt 2>/dev/null || true

          echo ""
          echo "  📦 Installed:"
          printf "     %-25s %s\n" "fastapi:"    "$(pip show fastapi | grep Version)"
          printf "     %-25s %s\n" "pytest:"     "$(pytest --version 2>/dev/null)"
          printf "     %-25s %s\n" "schemathesis:""$(pip show schemathesis | grep Version)"
          echo "  ✅ API dependencies ready"

      - name: "🔧 Generate Mock API Server"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔧 Generating Mock ASH API Server                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # If real API server exists, use it — else generate mock
          if [[ -f "api/server.py" ]]; then
            echo "  ✅ Using repository API server"
          else
            echo "  ℹ️  Generating comprehensive mock API server..."
            mkdir -p api

            cat > api/server.py << 'APISERVER'
          # ╔══════════════════════════════════════════════════════════════════╗
          # ║  ASH Dotfiles v5.0 OMEGA — Mock API Server (Test Mode)         ║
          # ╚══════════════════════════════════════════════════════════════════╝

          from __future__ import annotations

          import asyncio
          import hashlib
          import json
          import os
          import time
          from datetime import datetime, timezone
          from typing import Any
          from uuid import uuid4

          from fastapi import (
              FastAPI, WebSocket, WebSocketDisconnect,
              HTTPException, Depends, Header, Request,
              status
          )
          from fastapi.middleware.cors import CORSMiddleware
          from fastapi.responses import JSONResponse
          from pydantic import BaseModel, Field

          # ── Constants ─────────────────────────────────────────────────────
          VERSION       = "5.0.0"
          API_VERSION   = "v1"
          TEST_TOKEN    = os.environ.get("TEST_TOKEN", "ash_test_token")
          SERVER_START  = datetime.now(timezone.utc).isoformat()

          # ── State ─────────────────────────────────────────────────────────
          state: dict[str, Any] = {
              "active_theme": "catppuccin-mocha",
              "active_mode":  "default",
              "wallpaper":    "/home/user/Pictures/default-dark.jpg",
              "plugins":      {"caffeine": "enabled", "game-mode": "disabled"},
              "ws_clients":   [],
              "request_log":  [],
              "rate_counts":  {},
          }

          THEMES_DB: dict[str, dict] = {
              "catppuccin-mocha": {
                  "id": "catppuccin-mocha", "name": "Catppuccin Mocha",
                  "version": "1.0.0", "category": "dark",
                  "colors": {"background": "#1e1e2e", "primary": "#cba6f7"},
              },
              "tokyo-night": {
                  "id": "tokyo-night", "name": "Tokyo Night",
                  "version": "1.0.0", "category": "dark",
                  "colors": {"background": "#1a1b26", "primary": "#7aa2f7"},
              },
              "gruvbox-dark": {
                  "id": "gruvbox-dark", "name": "Gruvbox Dark",
                  "version": "1.0.0", "category": "dark",
                  "colors": {"background": "#282828", "primary": "#fabd2f"},
              },
          }

          PLUGINS_DB: dict[str, dict] = {
              "caffeine": {
                  "id": "caffeine", "name": "Caffeine",
                  "version": "1.2.0", "status": "enabled",
                  "category": "productivity",
              },
              "game-mode": {
                  "id": "game-mode", "name": "Game Mode",
                  "version": "2.0.1", "status": "disabled",
                  "category": "gaming",
              },
          }

          SNAPSHOTS_DB: list[dict] = []
          ANALYTICS_DB: list[dict] = []

          # ── App ───────────────────────────────────────────────────────────
          app = FastAPI(
              title="ASH Dotfiles REST API",
              description="Ultra-Premium Desktop Configuration API",
              version=API_VERSION,
              docs_url="/api/docs",
              redoc_url="/api/redoc",
              openapi_url="/api/openapi.json",
          )

          app.add_middleware(
              CORSMiddleware,
              allow_origins=["*"],
              allow_credentials=True,
              allow_methods=["*"],
              allow_headers=["*"],
          )

          # ── Models ────────────────────────────────────────────────────────
          class ThemeApplyRequest(BaseModel):
              wallpaper:    str | None = None
              transition:   str        = "smooth"
              reload_targets: list[str] = []

          class PluginRequest(BaseModel):
              action: str = Field(..., pattern="^(enable|disable|install|remove)$")

          class SnapshotCreateRequest(BaseModel):
              name:        str
              description: str | None = None

          class ConfigSetRequest(BaseModel):
              key:   str
              value: Any

          class WallpaperSetRequest(BaseModel):
              path:       str
              transition: str = "fade"

          class ModeSetRequest(BaseModel):
              mode: str

          # ── Auth ──────────────────────────────────────────────────────────
          async def verify_token(
              authorization: str | None = Header(None)
          ) -> str:
              if not authorization:
                  raise HTTPException(
                      status_code=status.HTTP_401_UNAUTHORIZED,
                      detail={"code": "MISSING_TOKEN",
                              "message": "Authorization header required"},
                      headers={"WWW-Authenticate": "Bearer"},
                  )
              if not authorization.startswith("Bearer "):
                  raise HTTPException(
                      status_code=status.HTTP_401_UNAUTHORIZED,
                      detail={"code": "INVALID_TOKEN_FORMAT",
                              "message": "Token must be 'Bearer <token>'"},
                  )
              token = authorization[7:]
              if token != TEST_TOKEN:
                  raise HTTPException(
                      status_code=status.HTTP_401_UNAUTHORIZED,
                      detail={"code": "INVALID_TOKEN",
                              "message": "Invalid or expired token"},
                  )
              return token

          # ── Rate limiting ─────────────────────────────────────────────────
          async def rate_limit(
              request: Request,
              limit: int = 60,
          ) -> None:
              client_ip = request.client.host if request.client else "unknown"
              minute_key = f"{client_ip}:{int(time.time() / 60)}"
              count = state["rate_counts"].get(minute_key, 0) + 1
              state["rate_counts"][minute_key] = count
              if count > limit:
                  raise HTTPException(
                      status_code=status.HTTP_429_TOO_MANY_REQUESTS,
                      detail={"code": "RATE_LIMIT_EXCEEDED",
                              "message": f"Rate limit: {limit}/min",
                              "retry_after": 60},
                      headers={"Retry-After": "60",
                               "X-RateLimit-Limit": str(limit),
                               "X-RateLimit-Remaining": "0"},
                  )

          # ── Middleware ────────────────────────────────────────────────────
          @app.middleware("http")
          async def add_process_time_header(request: Request, call_next):
              start     = time.perf_counter()
              response  = await call_next(request)
              duration  = (time.perf_counter() - start) * 1000
              req_id    = str(uuid4())[:8]
              response.headers["X-ASH-Version"]    = VERSION
              response.headers["X-ASH-Request-ID"] = req_id
              response.headers["X-Response-Time"]  = f"{duration:.2f}ms"
              state["request_log"].append({
                  "id": req_id, "method": request.method,
                  "path": str(request.url.path),
                  "status": response.status_code,
                  "duration_ms": round(duration, 2),
                  "timestamp": datetime.now(timezone.utc).isoformat(),
              })
              return response

          # ══════════════════════════════════════════════════════════════════
          # ENDPOINTS
          # ══════════════════════════════════════════════════════════════════

          # ── Health ────────────────────────────────────────────────────────
          @app.get("/api/v1/health")
          async def health_check():
              return {
                  "status":      "healthy",
                  "version":     VERSION,
                  "api_version": API_VERSION,
                  "uptime":      (datetime.now(timezone.utc).isoformat()),
                  "started_at":  SERVER_START,
                  "components": {
                      "theme_engine":  "operational",
                      "plugin_system": "operational",
                      "api_server":    "operational",
                  },
              }

          @app.get("/api/v1/metrics")
          async def get_metrics(token: str = Depends(verify_token)):
              return {
                  "requests_total":    len(state["request_log"]),
                  "active_websockets": len(state["ws_clients"]),
                  "uptime_seconds":    int(time.time()),
                  "memory_mb":         45.2,
                  "cpu_percent":       1.3,
              }

          # ── Themes ────────────────────────────────────────────────────────
          @app.get("/api/v1/themes")
          async def list_themes(
              token:    str = Depends(verify_token),
              category: str | None = None,
              search:   str | None = None,
              page:     int = 1,
              per_page: int = 20,
          ):
              themes = list(THEMES_DB.values())
              if category:
                  themes = [t for t in themes if t["category"] == category]
              if search:
                  themes = [t for t in themes
                            if search.lower() in t["name"].lower()]
              return {
                  "data":       themes,
                  "total":      len(themes),
                  "page":       page,
                  "per_page":   per_page,
                  "active":     state["active_theme"],
              }

          @app.get("/api/v1/themes/{theme_id}")
          async def get_theme(
              theme_id: str,
              token:    str = Depends(verify_token),
          ):
              if theme_id not in THEMES_DB:
                  raise HTTPException(
                      status_code=status.HTTP_404_NOT_FOUND,
                      detail={"code": "THEME_NOT_FOUND",
                              "message": f"Theme '{theme_id}' not found"},
                  )
              return THEMES_DB[theme_id]

          @app.post("/api/v1/themes/{theme_id}/apply")
          async def apply_theme(
              theme_id: str,
              body:     ThemeApplyRequest,
              token:    str = Depends(verify_token),
          ):
              if theme_id not in THEMES_DB:
                  raise HTTPException(
                      status_code=status.HTTP_404_NOT_FOUND,
                      detail={"code": "THEME_NOT_FOUND",
                              "message": f"Theme '{theme_id}' not found"},
                  )
              start = time.perf_counter()
              state["active_theme"] = theme_id
              if body.wallpaper:
                  state["wallpaper"] = body.wallpaper
              duration = (time.perf_counter() - start) * 1000

              # Notify WebSocket clients
              ws_msg = json.dumps({
                  "type": "theme.changed",
                  "theme_id": theme_id,
                  "timestamp": datetime.now(timezone.utc).isoformat(),
              })
              for client in state["ws_clients"]:
                  try:
                      await client.send_text(ws_msg)
                  except Exception:
                      pass

              return {
                  "success":          True,
                  "theme_id":         theme_id,
                  "theme_name":       THEMES_DB[theme_id]["name"],
                  "duration_ms":      round(duration + 100, 2),
                  "wallpaper_applied":bool(body.wallpaper),
                  "applied_at":       datetime.now(timezone.utc).isoformat(),
              }

          # ── Plugins ───────────────────────────────────────────────────────
          @app.get("/api/v1/plugins")
          async def list_plugins(
              token:  str = Depends(verify_token),
              status: str | None = None,
          ):
              plugins = list(PLUGINS_DB.values())
              if status:
                  plugins = [p for p in plugins if p["status"] == status]
              return {
                  "data":  plugins,
                  "total": len(plugins),
              }

          @app.get("/api/v1/plugins/{plugin_id}")
          async def get_plugin(
              plugin_id: str,
              token:     str = Depends(verify_token),
          ):
              if plugin_id not in PLUGINS_DB:
                  raise HTTPException(
                      status_code=status.HTTP_404_NOT_FOUND,
                      detail={"code": "PLUGIN_NOT_FOUND",
                              "message": f"Plugin '{plugin_id}' not found"},
                  )
              return PLUGINS_DB[plugin_id]

          @app.post("/api/v1/plugins/{plugin_id}")
          async def plugin_action(
              plugin_id: str,
              body:      PluginRequest,
              token:     str = Depends(verify_token),
          ):
              if plugin_id not in PLUGINS_DB:
                  raise HTTPException(
                      status_code=status.HTTP_404_NOT_FOUND,
                      detail={"code": "PLUGIN_NOT_FOUND",
                              "message": f"Plugin '{plugin_id}' not found"},
                  )
              if body.action in ("enable", "disable"):
                  PLUGINS_DB[plugin_id]["status"] = (
                      "enabled" if body.action == "enable" else "disabled"
                  )
              return {
                  "success":   True,
                  "plugin_id": plugin_id,
                  "action":    body.action,
                  "status":    PLUGINS_DB[plugin_id]["status"],
              }

          # ── Snapshots ─────────────────────────────────────────────────────
          @app.get("/api/v1/snapshots")
          async def list_snapshots(token: str = Depends(verify_token)):
              return {"data": SNAPSHOTS_DB, "total": len(SNAPSHOTS_DB)}

          @app.post("/api/v1/snapshots")
          async def create_snapshot(
              body:  SnapshotCreateRequest,
              token: str = Depends(verify_token),
          ):
              snap = {
                  "id":           str(uuid4()),
                  "name":         body.name,
                  "description":  body.description,
                  "theme_id":     state["active_theme"],
                  "mode":         state["active_mode"],
                  "created_at":   datetime.now(timezone.utc).isoformat(),
                  "size_bytes":   4096,
              }
              SNAPSHOTS_DB.append(snap)
              return snap

          @app.post("/api/v1/snapshots/{snapshot_id}/restore")
          async def restore_snapshot(
              snapshot_id: str,
              token:       str = Depends(verify_token),
          ):
              snap = next(
                  (s for s in SNAPSHOTS_DB if s["id"] == snapshot_id), None
              )
              if not snap:
                  raise HTTPException(
                      status_code=status.HTTP_404_NOT_FOUND,
                      detail={"code": "SNAPSHOT_NOT_FOUND",
                              "message": f"Snapshot '{snapshot_id}' not found"},
                  )
              state["active_theme"] = snap["theme_id"]
              return {"success": True, "restored": snap}

          @app.delete("/api/v1/snapshots/{snapshot_id}",
                      status_code=status.HTTP_204_NO_CONTENT)
          async def delete_snapshot(
              snapshot_id: str,
              token:       str = Depends(verify_token),
          ):
              global SNAPSHOTS_DB
              snap = next(
                  (s for s in SNAPSHOTS_DB if s["id"] == snapshot_id), None
              )
              if not snap:
                  raise HTTPException(
                      status_code=status.HTTP_404_NOT_FOUND,
                      detail={"code": "SNAPSHOT_NOT_FOUND",
                              "message": f"Snapshot '{snapshot_id}' not found"},
                  )
              SNAPSHOTS_DB = [s for s in SNAPSHOTS_DB if s["id"] != snapshot_id]

          # ── Config ────────────────────────────────────────────────────────
          _config: dict[str, Any] = {
              "theme.active":    "catppuccin-mocha",
              "theme.auto":      False,
              "mode.current":    "default",
              "plugin.enabled":  True,
              "analytics.enabled": False,
          }

          @app.get("/api/v1/config")
          async def get_all_config(token: str = Depends(verify_token)):
              return {"data": _config}

          @app.get("/api/v1/config/{key:path}")
          async def get_config(
              key:   str,
              token: str = Depends(verify_token),
          ):
              if key not in _config:
                  raise HTTPException(
                      status_code=status.HTTP_404_NOT_FOUND,
                      detail={"code": "CONFIG_KEY_NOT_FOUND",
                              "message": f"Key '{key}' not found"},
                  )
              return {"key": key, "value": _config[key]}

          @app.put("/api/v1/config")
          async def set_config(
              body:  ConfigSetRequest,
              token: str = Depends(verify_token),
          ):
              _config[body.key] = body.value
              return {"success": True, "key": body.key, "value": body.value}

          # ── Wallpaper ─────────────────────────────────────────────────────
          @app.get("/api/v1/wallpaper")
          async def get_wallpaper(token: str = Depends(verify_token)):
              return {
                  "path":       state["wallpaper"],
                  "transition": "smooth",
                  "engine":     "swww",
              }

          @app.post("/api/v1/wallpaper")
          async def set_wallpaper(
              body:  WallpaperSetRequest,
              token: str = Depends(verify_token),
          ):
              state["wallpaper"] = body.path
              return {
                  "success":    True,
                  "path":       body.path,
                  "transition": body.transition,
              }

          # ── Mode ──────────────────────────────────────────────────────────
          VALID_MODES = {
              "default", "game", "work", "focus",
              "cinema", "present", "battery", "stream",
              "privacy", "accessibility",
          }

          @app.get("/api/v1/mode")
          async def get_mode(token: str = Depends(verify_token)):
              return {
                  "current":   state["active_mode"],
                  "available": sorted(list(VALID_MODES)),
              }

          @app.post("/api/v1/mode")
          async def set_mode(
              body:  ModeSetRequest,
              token: str = Depends(verify_token),
          ):
              if body.mode not in VALID_MODES:
                  raise HTTPException(
                      status_code=status.HTTP_422_UNPROCESSABLE_ENTITY,
                      detail={"code": "INVALID_MODE",
                              "message": f"Mode '{body.mode}' is not valid",
                              "valid_modes": sorted(list(VALID_MODES))},
                  )
              previous_mode        = state["active_mode"]
              state["active_mode"] = body.mode
              return {
                  "success":       True,
                  "mode":          body.mode,
                  "previous_mode": previous_mode,
              }

          # ── Analytics ─────────────────────────────────────────────────────
          @app.get("/api/v1/analytics")
          async def get_analytics(
              token:  str = Depends(verify_token),
              metric: str | None = None,
              days:   int = 7,
          ):
              return {
                  "theme_usage":  {
                      "catppuccin-mocha": 42,
                      "tokyo-night":      18,
                      "gruvbox-dark":     7,
                  },
                  "mode_usage": {
                      "default": 85, "game": 10,
                      "focus": 5,
                  },
                  "command_usage": {
                      "ash theme apply":     67,
                      "ash mode":            23,
                      "ash plugin":          15,
                  },
                  "period_days": days,
                  "total_events": 189,
              }

          # ── AI ────────────────────────────────────────────────────────────
          @app.post("/api/v1/ai/suggest-theme")
          async def ai_suggest_theme(
              token:    str = Depends(verify_token),
              request:  Request = None,
          ):
              body = await request.json() if request else {}
              return {
                  "suggestions": [
                      {
                          "theme_id":    "catppuccin-mocha",
                          "confidence":  0.92,
                          "reason":      "Matches your usage patterns",
                      },
                      {
                          "theme_id":    "tokyo-night",
                          "confidence":  0.78,
                          "reason":      "Popular at this time of day",
                      },
                  ],
                  "model":     "ash-recommendation-v1",
                  "generated": datetime.now(timezone.utc).isoformat(),
              }

          # ── WebSocket ──────────────────────────────────────────────────────
          @app.websocket("/ws/v1")
          async def websocket_endpoint(websocket: WebSocket):
              token = websocket.query_params.get("token") or \
                      websocket.headers.get("authorization", "").replace("Bearer ", "")
              if token != TEST_TOKEN:
                  await websocket.close(code=4001, reason="Unauthorized")
                  return

              await websocket.accept()
              state["ws_clients"].append(websocket)

              try:
                  # Send welcome message
                  await websocket.send_json({
                      "type":      "connected",
                      "server":    f"ASH API v{API_VERSION}",
                      "timestamp": datetime.now(timezone.utc).isoformat(),
                  })

                  while True:
                      data = await websocket.receive_text()
                      msg  = json.loads(data)

                      if msg.get("type") == "subscribe":
                          await websocket.send_json({
                              "type":   "subscribed",
                              "id":     msg.get("id"),
                              "events": msg.get("events", []),
                          })
                      elif msg.get("type") == "ping":
                          await websocket.send_json({
                              "type":      "pong",
                              "timestamp": datetime.now(timezone.utc).isoformat(),
                          })
                      elif msg.get("type") == "get_state":
                          await websocket.send_json({
                              "type":         "state",
                              "active_theme": state["active_theme"],
                              "active_mode":  state["active_mode"],
                          })

              except WebSocketDisconnect:
                  pass
              finally:
                  if websocket in state["ws_clients"]:
                      state["ws_clients"].remove(websocket)

          APISERVER
            echo "  ✅ Mock API server generated"
          fi

      - name: "🚀 Start API Server"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚀 Starting ASH API Server                                 ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          export TEST_TOKEN="${{ env.TEST_TOKEN }}"
          export ASH_TEST_MODE=1

          # Start server in background
          cd api || cd .
          python3 -m uvicorn \
            server:app \
            --host 0.0.0.0 \
            --port "${{ env.API_PORT }}" \
            --log-level warning \
            --workers 1 \
            &

          SERVER_PID=$!
          echo "SERVER_PID=${SERVER_PID}" >> "${GITHUB_ENV}"
          echo "  Server PID: ${SERVER_PID}"

          # Wait for server to be ready
          echo "  Waiting for API server..."
          max_wait=30
          elapsed=0

          while [[ ${elapsed} -lt ${max_wait} ]]; do
            if curl -sf \
              "http://localhost:${{ env.API_PORT }}/api/v1/health" \
              2>/dev/null | grep -q "healthy"; then
              echo "  ✅ API server ready at ${{ env.API_BASE_URL }}"
              break
            fi
            sleep 1
            elapsed=$((elapsed + 1))
          done

          if [[ ${elapsed} -ge ${max_wait} ]]; then
            echo "  ❌ API server failed to start within ${max_wait}s"
            exit 1
          fi

          # Print health check
          echo ""
          echo "  📊 Server health:"
          curl -sf "${{ env.API_BASE_URL }}/api/v1/health" | \
            python3 -m json.tool 2>/dev/null | head -15

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: ENDPOINT-TESTS — Test each endpoint suite
  # ────────────────────────────────────────────────────────────────────────────
  endpoint-tests:
    name: "🌐 API Tests — ${{ matrix.suite }}"
    needs: [discover, server-setup]
    if: needs.discover.outputs.has-api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: ${{ inputs.fail_fast == 'true' }}
      matrix:
        suite:
          - themes
          - plugins
          - snapshots
          - config
          - wallpaper
          - mode
          - analytics
          - auth
          - error-handling

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install Test Dependencies"
        shell: bash
        run: |
          pip install -q \
            "fastapi==0.115.5" "uvicorn[standard]==0.32.1" \
            "pydantic==2.10.2" "pydantic-settings==2.6.1" \
            "python-multipart==0.0.17" \
            "python-jose[cryptography]==3.3.0" \
            "passlib[bcrypt]==1.7.4" \
            "websockets==13.1" \
            "pytest==8.3.4" "pytest-asyncio==0.24.0" \
            "pytest-xdist==3.6.1" "pytest-timeout==2.3.1" \
            "pytest-cov==6.0.0" "httpx==0.27.2" \
            "aiofiles==24.1.0" \
            2>/dev/null

          [[ -f "api/requirements.txt" ]] && \
            pip install -q -r api/requirements.txt 2>/dev/null || true

      - name: "🚀 Start API Server"
        shell: bash
        run: |
          export TEST_TOKEN="${{ env.TEST_TOKEN }}"
          export ASH_TEST_MODE=1

          cd api 2>/dev/null || true
          python3 -m uvicorn server:app \
            --host 0.0.0.0 \
            --port "${{ env.API_PORT }}" \
            --log-level warning &

          echo "API_PID=$!" >> "${GITHUB_ENV}"

          elapsed=0
          while [[ ${elapsed} -lt 30 ]]; do
            curl -sf \
              "http://localhost:${{ env.API_PORT }}/api/v1/health" \
              2>/dev/null | grep -q "healthy" && break
            sleep 1; elapsed=$((elapsed + 1))
          done

          echo "  ✅ API server ready"

      - name: "🧪 Generate & Run API Tests: ${{ matrix.suite }}"
        id: test
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🌐 API Tests: ${{ matrix.suite }}                            ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          mkdir -p test-results

          # Generate comprehensive test file for this suite
          cat > "test_api_${{ matrix.suite }}.py" << PYTEST
