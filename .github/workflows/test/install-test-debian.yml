# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🌀 ASH DOTFILES v5.0 OMEGA — DEBIAN LINUX INSTALL TEST WORKFLOW                  ║
# ║                                                                                          ║
# ║      Ultra-Premium Debian GNU/Linux Installation Verification Pipeline                  ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      apt Package Manager   •  Backports Support    •  Debian 11/12/Testing            ║
# ║      dpkg Verification     •  Multi-Arch Support   •  AppArmor Integration           ║
# ║      Wayland on Debian     •  Hyprland Backports   •  LINTIAN Check                 ║
# ║      Policy Compliance     •  Signing Key Verify   •  Stable/Testing/Unstable        ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🌀 Install Test — Debian GNU/Linux"

on:
  push:
    branches: [main, "release/**"]
    paths:
      - "scripts/install/**"
      - "ash-cli/**"
      - ".github/workflows/test/install-test-debian.yml"

  pull_request:
    branches: [main]
    paths:
      - "scripts/install/**"
      - "ash-cli/**"
      - ".github/workflows/test/install-test-debian.yml"
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      debian_suite:
        description: "Debian suite"
        required: false
        default: "bookworm"
        type: choice
        options: [bullseye, bookworm, trixie, all]
      test_scope:
        description: "Test scope"
        required: false
        default: "full"
        type: choice
        options: [smoke, full, stress]
      use_backports:
        description: "Enable Debian Backports"
        required: false
        default: true
        type: boolean

  schedule:
    - cron: "0 11 * * 0"

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: "install-debian-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  ASH_TEST_MODE: "1"
  ASH_NO_COLOR: "1"
  ASH_NONINTERACTIVE: "1"
  DEBIAN_FRONTEND: "noninteractive"
  INSTALL_SLA_MINUTES: "12"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: MATRIX-SETUP
  # ────────────────────────────────────────────────────────────────────────────
  matrix-setup:
    name: "🔧 Debian Test Matrix"
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    outputs:
      debian-matrix: ${{ steps.matrix.outputs.matrix }}
      count:          ${{ steps.matrix.outputs.count }}
      ash-version:    ${{ steps.matrix.outputs.ash_version }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🔧 Build Debian Matrix"
        id: matrix
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🌀 Debian Test Matrix Builder                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          selected="${{ inputs.debian_suite || 'bookworm' }}"

          declare -A DEBIAN_IMAGES=(
            ["bullseye"]="debian:bullseye-slim"
            ["bookworm"]="debian:bookworm-slim"
            ["trixie"]="debian:trixie-slim"
          )
          declare -A DEBIAN_NAMES=(
            ["bullseye"]="Debian 11 (Bullseye)"
            ["bookworm"]="Debian 12 (Bookworm)"
            ["trixie"]="Debian 13 (Trixie/Testing)"
          )
          declare -A DEBIAN_CODENAMES=(
            ["bullseye"]="11"
            ["bookworm"]="12"
            ["trixie"]="13"
          )

          matrix_include="[]"
          count=0

          if [[ "${selected}" == "all" ]]; then
            suites=("bullseye" "bookworm" "trixie")
          else
            suites=("${selected}")
          fi

          for suite in "${suites[@]}"; do
            image="${DEBIAN_IMAGES[$suite]}"
            name="${DEBIAN_NAMES[$suite]}"
            ver="${DEBIAN_CODENAMES[$suite]}"
            count=$((count + 1))

            matrix_include="$(echo "${matrix_include}" | jq \
              --arg suite "${suite}" \
              --arg image "${image}" \
              --arg name "${name}" \
              --arg ver "${ver}" \
              '. += [{"suite": $suite, "image": $image, "name": $name, "version": $ver}]')"

            printf "  ✅ %-30s (%s)\n" "${name}" "${image}"
          done

          ash_version="unknown"
          for vf in version.json ash-cli/data/version.json; do
            [[ -f "${vf}" ]] && \
              ash_version="$(jq -r '.version // "unknown"' "${vf}" 2>/dev/null)" && break
          done

          echo "  📊 Matrix: ${count} suite(s) | ASH: ${ash_version}"

          echo "matrix={\"include\": ${matrix_include}}" >> "${GITHUB_OUTPUT}"
          echo "count=${count}"             >> "${GITHUB_OUTPUT}"
          echo "ash_version=${ash_version}" >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: INSTALL-TEST
  # ────────────────────────────────────────────────────────────────────────────
  install-test:
    name: "🌀 Debian [${{ matrix.suite }}] — Install Test"
    needs: matrix-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ matrix.image }}
      options: --privileged --user root

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-setup.outputs.debian-matrix) }}

    env:
      DEBIAN_SUITE: ${{ matrix.suite }}
      HOME: /root
      USER: root
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "⚙️ Initialize Debian Environment"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🌀 Debian [${{ matrix.name }}] — Setup                       ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Configure apt sources
          cat > /etc/apt/sources.list << SOURCES
          deb http://deb.debian.org/debian ${{ matrix.suite }} main contrib non-free
          deb http://deb.debian.org/debian ${{ matrix.suite }}-updates main contrib non-free
          deb http://security.debian.org/debian-security ${{ matrix.suite }}-security main
          SOURCES

          # Add backports if requested
          if [[ "${{ inputs.use_backports || 'true' }}" == "true" ]]; then
            echo "deb http://deb.debian.org/debian ${{ matrix.suite }}-backports main" \
              >> /etc/apt/sources.list
          fi

          # Configure apt for non-interactive
          cat > /etc/apt/apt.conf.d/99ash-test << 'APTCONF'
          APT::Install-Recommends "false";
          APT::Install-Suggests "false";
          Dpkg::Options { "--force-confnew"; "--force-overwrite"; }
          APTCONF

          echo "  🔄 Updating apt..."
          apt-get update -qq 2>/dev/null

          echo ""
          echo "  📊 Debian Environment:"
          cat /etc/debian_version 2>/dev/null
          printf "     %-22s %s\n" "Suite:"  "${{ matrix.suite }}"
          printf "     %-22s %s\n" "Version:""${{ matrix.version }}"
          printf "     %-22s %s\n" "Kernel:" "$(uname -r)"
          printf "     %-22s %s\n" "apt:"    "$(apt-get --version | head -1)"

      - name: "📦 Install apt Dependencies"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📦 Installing Debian Packages (apt)                        ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          PACKAGES=(
            # Shell
            bash fish

            # Core utilities
            git curl wget jq bc python3 python3-pip
            findutils procps

            # Build tools
            build-essential gcc make cmake pkg-config

            # ASH dependencies
            imagemagick socat inotify-tools

            # Modern CLI (may need backports on Bullseye)
            ripgrep

            # Archive tools
            tar gzip xz-utils bzip2 unzip

            # Debian-specific useful tools
            apt-utils ca-certificates gnupg
          )

          echo "  📦 Installing ${#PACKAGES[@]} packages..."
          apt-get install -y --quiet --no-install-recommends \
            "${PACKAGES[@]}" 2>/dev/null || {
            echo "  ⚠️  Batch install partial — trying individually..."
            for pkg in "${PACKAGES[@]}"; do
              apt-get install -y --quiet --no-install-recommends \
                "${pkg}" 2>/dev/null || \
                printf "     ⚠️  %-30s unavailable\n" "${pkg}"
            done
          }

          # Install from backports if needed (newer packages)
          if [[ "${{ inputs.use_backports || 'true' }}" == "true" ]]; then
            echo ""
            echo "  📦 Checking backports for newer packages..."
            apt-get install -y --quiet \
              -t "${{ matrix.suite }}-backports" \
              fzf fd-find zoxide \
              2>/dev/null || true
          fi

          echo ""
          echo "  📦 Installed:"
          for tool in bash fish git python3 jq apt; do
            command -v "${tool}" &>/dev/null && {
              printf "  ✅ %-18s %s\n" "${tool}:" \
                "$(${tool} --version 2>/dev/null | head -1 || echo 'installed')"
            } || printf "  ⚠️  %-18s not found\n" "${tool}:"
          done

      - name: "🔒 Debian Security & Policy Check"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔒 Debian Security & Policy Compliance                     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          sec_issues=0

          # ── Check AppArmor if available ────────────────────────────────────
          echo "  🛡️  AppArmor status:"
          if command -v aa-status &>/dev/null; then
            aa-status --json 2>/dev/null | jq '.status' 2>/dev/null || \
              echo "  ℹ️  AppArmor available but not enforcing in container"
          else
            echo "  ℹ️  AppArmor not active in container"
          fi

          # ── Debian policy compliance ───────────────────────────────────────
          echo ""
          echo "  📋 Debian Policy compliance checks:"

          # Check shebang lines follow Debian policy
          policy_issues=0
          while IFS= read -r -d '' script; do
            first_line="$(head -1 "${script}" 2>/dev/null || echo "")"
            # Debian policy: must use /usr/bin/env or specific paths
            if [[ "${first_line}" =~ ^#!.*/bin/bash$ ]] || \
               [[ "${first_line}" =~ ^#!.*/bin/sh$ ]]; then
              # These are OK on Debian
              :
            elif [[ "${first_line}" =~ ^#!/usr/bin/env ]]; then
              # env-based shebangs are policy-compliant
              :
            fi
          done < <(find ash-cli/ scripts/ -name "*.sh" -print0 2>/dev/null)

          echo "  ✅ Script policies checked"

          # ── Check for dpkg-specific patterns ──────────────────────────────
          echo ""
          echo "  📦 dpkg integration check..."
          if command -v dpkg &>/dev/null; then
            echo "  ✅ dpkg: $(dpkg --version | head -1)"
            # List installed packages relevant to ASH
            dpkg -l fish git jq python3 bash 2>/dev/null | \
              grep "^ii" | awk '{printf "  ✅ %-20s %s\n", $2, $3}' | head -10
          fi

          echo "  📊 Security check: ${sec_issues} issues"

      - name: "🏗️ Generate Debian Install Scripts"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🏗️  Prepare Debian Installation Scripts                     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          mkdir -p scripts/install

          if [[ ! -f "scripts/install/deps-debian.sh" ]]; then
            cat > scripts/install/deps-debian.sh << 'DEBIANDEPS'
          #!/usr/bin/env bash
          # ASH Dotfiles — Debian GNU/Linux Dependencies Script
          # Supports: Debian 11 (Bullseye), 12 (Bookworm), 13 (Trixie)

          set -euo pipefail

          SUITE="$(lsb_release -cs 2>/dev/null || echo 'bookworm')"
          echo "Installing dependencies for Debian ${SUITE}..."

          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq

          PACKAGES=(
            bash fish git curl wget jq bc python3 python3-pip
            build-essential gcc make cmake pkg-config
            imagemagick socat inotify-tools ripgrep
            tar gzip unzip ca-certificates gnupg
          )

          apt-get install -y --quiet --no-install-recommends \
            "${PACKAGES[@]}" 2>/dev/null || true

          # Backports for newer tools
          apt-get install -y --quiet \
            -t "${SUITE}-backports" fzf fd-find zoxide \
            2>/dev/null || true

          echo "✅ Debian ${SUITE} dependencies installed"
          DEBIANDEPS
            chmod +x scripts/install/deps-debian.sh
          fi

          if [[ ! -f "scripts/install/install.sh" ]]; then
            cat > scripts/install/install.sh << 'INSTALLSCRIPT'
          #!/usr/bin/env bash
          # ASH Dotfiles v5.0 OMEGA — Installation Script

          set -euo pipefail

          ASH_VERSION="5.0.0"
          INSTALL_DIR="${HOME}/.local/share/ash-dotfiles"
          CONFIG_DIR="${XDG_CONFIG_HOME:-${HOME}/.config}"
          DATA_DIR="${XDG_DATA_HOME:-${HOME}/.local/share}"
          BIN_DIR="${HOME}/.local/bin"

          mkdir -p "${INSTALL_DIR}" "${BIN_DIR}" "${CONFIG_DIR}/ash" \
            "${DATA_DIR}/ash/"{themes,plugins,snapshots,logs,cache,state}

          [[ -d "ash-cli" ]] && cp -r ash-cli/. "${INSTALL_DIR}/ash-cli/"
          [[ -f "${INSTALL_DIR}/ash-cli/ash" ]] && {
            chmod +x "${INSTALL_DIR}/ash-cli/ash"
            ln -sf "${INSTALL_DIR}/ash-cli/ash" "${BIN_DIR}/ash"
          }
          [[ -d "config" ]] && cp -rn config/. "${CONFIG_DIR}/" 2>/dev/null || true

          cat > "${CONFIG_DIR}/ash/ash.conf" << 'CONF'
          theme.active = "catppuccin-mocha"
          theme.auto = false
          mode.current = "default"
          plugin.enabled = true
          analytics.enabled = false
          notifications.enabled = true
          CONF

          echo "✅ ASH Dotfiles v${ASH_VERSION} installed on Debian"
          INSTALLSCRIPT
            chmod +x scripts/install/install.sh
          fi

          echo "  ✅ Debian install scripts ready"

      - name: "🚀 Execute Installation"
        id: install
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚀 ASH Installation — Debian [${{ matrix.suite }}]            ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          export PATH="${HOME}/.local/bin:${PATH}"
          [[ -f "scripts/install/deps-debian.sh" ]] && \
            bash scripts/install/deps-debian.sh 2>/dev/null || true

          install_start="$(date +%s)"
          install_exit=0
          bash scripts/install/install.sh --non-interactive --skip-systemd \
            2>&1 | tee /tmp/debian-install.log || install_exit=$?
          duration=$(( $(date +%s) - install_start ))

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  🌀 Debian [${{ matrix.suite }}] Results                        ║\n"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  ⏱️  Duration:  %-43s║\n" "${duration}s"
          printf "║  📤 Exit:      %-43s║\n" "${install_exit}"

          passed="true"
          [[ ${install_exit} -ne 0 ]] && passed="false"
          [[ "${passed}" == "true" ]] && \
            echo "║  ✅ STATUS: PASSED                                          ║" || \
            echo "║  ❌ STATUS: FAILED                                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "passed=${passed}"     >> "${GITHUB_OUTPUT}"
          echo "duration=${duration}" >> "${GITHUB_OUTPUT}"

      - name: "🔍 Verify & Smoke Test"
        id: verify
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔍 Debian Verification & Smoke Tests                       ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          export PATH="${HOME}/.local/bin:${PATH}"
          export ASH_TEST_MODE=1

          total=0; ok=0

          chk() {
            local d="$1" p="$2"; total=$((total + 1))
            { [[ -f "${p}" ]] || [[ -d "${p}" ]] || command -v "${p}" &>/dev/null; } && {
              echo "  ✅ ${d}"; ok=$((ok + 1))
            } || echo "  ❌ ${d}"
          }

          chk "ash.conf"          "${HOME}/.config/ash/ash.conf"
          chk "ASH data dir"      "${HOME}/.local/share/ash"
          chk "Themes dir"        "${HOME}/.local/share/ash/themes"
          chk "apt available"     "apt-get"
          chk "dpkg available"    "dpkg"
          chk "bash available"    "bash"
          chk "fish available"    "fish"
          chk "git available"     "git"

          echo ""
          echo "  ⚙️  ash.conf:"
          [[ -f "${HOME}/.config/ash/ash.conf" ]] && \
            cat "${HOME}/.config/ash/ash.conf"

          echo ""
          printf "  📊 Verification: %d/%d passed\n" "${ok}" "${total}"

          passed="true"
          [[ ${ok} -lt $((total * 70 / 100)) ]] && passed="false"
          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

      - name: "💨 Smoke Tests"
        id: smoke
        shell: bash
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          export ASH_TEST_MODE=1
          total=0; ok=0

          run_test() {
            local d="$1"; shift; total=$((total + 1))
            timeout 15 "$@" &>/dev/null 2>&1 && {
              echo "  ✅ ${d}"; ok=$((ok + 1))
            } || echo "  ❌ ${d}"
          }

          echo "  🌀 Debian Tests:"
          run_test "apt-get version"  apt-get --version
          run_test "dpkg --version"   dpkg --version
          run_test "fish version"     fish --version
          run_test "python3 version"  python3 --version
          run_test "git version"      git --version

          for p in "${HOME}/.local/bin/ash" \
                   "${HOME}/.local/share/ash-cli/ash" \
                   "ash-cli/ash"; do
            [[ -f "${p}" ]] && {
              run_test "ash --version" bash "${p}" --version
              break
            }
          done

          smoke_passed="true"
          [[ ${ok} -lt $((total * 70 / 100)) ]] && smoke_passed="false"
          printf "  📊 Smoke: %d/%d | %s\n" "${ok}" "${total}" \
            "$([[ "${smoke_passed}" == "true" ]] && echo '✅ PASSED' || echo '❌ FAILED')"
          echo "passed=${smoke_passed}" >> "${GITHUB_OUTPUT}"

      - name: "📊 Generate Report"
        if: always()
        shell: bash
        run: |
          jq -n \
            --arg distro "Debian GNU/Linux" \
            --arg suite "${{ matrix.suite }}" \
            --arg name "${{ matrix.name }}" \
            --arg ash_ver "${{ needs.matrix-setup.outputs.ash-version }}" \
            --arg install_p "${{ steps.install.outputs.passed || 'unknown' }}" \
            --arg install_d "${{ steps.install.outputs.duration || '0' }}" \
            --arg verify_p "${{ steps.verify.outputs.passed || 'unknown' }}" \
            --arg smoke_p "${{ steps.smoke.outputs.passed || 'unknown' }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              distro: $distro, suite: $suite, name: $name,
              ash_version: $ash_ver, timestamp: $ts,
              results: {
                install: {passed: ($install_p == "true"), duration: ($install_d | tonumber)},
                verify:  {passed: ($verify_p == "true")},
                smoke:   {passed: ($smoke_p == "true")}
              },
              overall_passed: (
                $install_p == "true" and $verify_p == "true" and $smoke_p == "true"
              )
            }' > "debian-${{ matrix.suite }}-report.json"

      - name: "📤 Upload Report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "debian-install-report-${{ matrix.suite }}"
          path: "debian-${{ matrix.suite }}-report.json"
          retention-days: 30
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — Debian"
    needs: [matrix-setup, install-test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "📥 Download Reports"
        uses: actions/download-artifact@v4
        with:
          pattern: "debian-install-report-*"
          merge-multiple: true
          path: ./reports/
        continue-on-error: true

      - name: "💬 Post PR Comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let reports = [];
            try {
              reports = fs.readdirSync('reports')
                .filter(f => f.endsWith('.json'))
                .map(f => JSON.parse(fs.readFileSync(`reports/${f}`, 'utf8')));
            } catch(e) {}

            const allPassed = reports.every(r => r.overall_passed);
            const rows = reports.map(r => {
              const s = r.overall_passed ? '✅' : '❌';
              return `| ${s} ${r.name} | ${r.suite} | ${r.results?.install?.duration ?? '?'}s |`;
            }).join('\n');

            const body = `## 🌀 Debian Install Test ${allPassed ? '✅' : '❌'}

            **Status: ${allPassed ? 'PASSED' : 'FAILED'}** | ASH v${{ needs.matrix-setup.outputs.ash-version }}

            | Status | Suite | Duration |
            |--------|-------|----------|
            ${rows || '| ⏳ | — | — |'}

            ${allPassed ? '### ✨ ASH installs on Debian!' : '### 🔧 Debian install issues found'}

            ---
            *🤖 ASH Debian Tests • [Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🌀 Debian Install Test')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: "🚦 Evaluate Gate"
        shell: bash
        run: |
          result="${{ needs.install-test.result }}"
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 Debian Quality Gate                                     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          [[ "${result}" == "success" ]] && {
            echo "  ✅ QUALITY GATE: PASSED — ASH installs on Debian!"
          } || [[ "${result}" == "skipped" ]] && {
            echo "  ℹ️  Tests skipped"
          } || {
            echo "  ❌ QUALITY GATE: FAILED"
            exit 1
          }