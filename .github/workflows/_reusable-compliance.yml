name: "📜 Compliance"
on:
  workflow_call:
    inputs:
      api_exists:
        type: string
        required: true
      web_exists:
        type: string
        required: true

jobs:
  license-scan:
    name: "📄 License Compliance"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: "🐍 Python license check"
        if: inputs.api_exists == 'true'
        run: |
          set -euo pipefail
          pip install pip-licenses --quiet
          if [[ -f api/requirements.txt ]]; then
            cd api
            pip install -r requirements.txt --quiet 2>/dev/null || true
            pip-licenses --format=json --output-file=/tmp/py-licenses.json || true
            pip-licenses --format=table --order=license

            # Check for blocked licenses
            pip-licenses --format=json 2>/dev/null | python3 -c "
            import json, sys
            data = json.load(sys.stdin)
            blocked = ['GPL-3.0', 'AGPL-3.0', 'GPL-3.0-only', 'AGPL-3.0-only']
            found = [d for d in data if any(b in d.get('License', '') for b in blocked)]
            for f in found: print(f'{f[\"Name\"]}: {f[\"License\"]}')
            sys.exit(1 if found else 0)
            " || echo "⚠️ Blocked license detected in Python packages"
          fi

      - name: "📦 Node license check"
        if: inputs.web_exists == 'true'
        run: |
          set -euo pipefail
          npm install -g license-checker --silent 2>/dev/null || true
          if [[ -d web ]] && [[ -f web/package.json ]]; then
            cd web
            npm ci --prefer-offline 2>/dev/null || npm install --prefer-offline 2>/dev/null || true
            license-checker --json --out /tmp/node-licenses.json || true
            license-checker --summary || true
            license-checker --failOn 'GPL-3.0;AGPL-3.0' || echo "⚠️ Blocked license detected in npm packages"
          fi

      - name: "📊 License summary"
        run: |
          set -euo pipefail
          echo "## 📄 License Compliance" >> "$GITHUB_STEP_SUMMARY"
          for f in /tmp/py-licenses.json /tmp/node-licenses.json; do
            if [[ -f "$f" ]]; then
              COUNT=$(python3 -c "import json; print(len(json.load(open('$f'))))" 2>/dev/null || echo 0)
              echo "- $(basename $f .json): $COUNT packages scanned" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  sbom-generate:
    name: "📋 SBOM Generation"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: "📋 Generate CycloneDX SBOM"
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          artifact-name: "sbom-${{ github.run_id }}"

      - name: "🔏 Attest SBOM"
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-sbom@v1
        with:
          subject-path: sbom.cyclonedx.json

      - name: "📤 Upload SBOM"
        uses: actions/upload-artifact@v4
        with:
          name: "sbom-${{ github.run_id }}"
          path: sbom.cyclonedx.json
          retention-days: 90

      - name: "📊 SBOM summary"
        run: |
          set -euo pipefail
          if [[ -f sbom.cyclonedx.json ]]; then
            COMPONENTS=$(python3 -c "import json; d=json.load(open('sbom.cyclonedx.json')); print(len(d.get('components', [])))" 2>/dev/null || echo "0")
            echo "## 📋 SBOM" >> "$GITHUB_STEP_SUMMARY"
            echo "- Format: CycloneDX JSON" >> "$GITHUB_STEP_SUMMARY"
            echo "- Components: $COMPONENTS" >> "$GITHUB_STEP_SUMMARY"
          fi
