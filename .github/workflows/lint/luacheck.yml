# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🌙 ASH DOTFILES v5.0 OMEGA — LUACHECK LINT WORKFLOW                              ║
# ║                                                                                          ║
# ║      Ultra-Premium Lua Script Analysis Pipeline                                         ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      Luacheck v1.1.2+     •  Neovim API Globals  •  Plugin Compatibility              ║
# ║      Stylua Integration   •  Custom Stds          •  Globals Validation               ║
# ║      LSP Config Audit     •  Lazy.nvim Analysis   •  Performance Linting              ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🌙 Luacheck — Lua Script Linting"

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths:
      - "**/*.lua"
      - ".luacheckrc"
      - ".github/workflows/lint/luacheck.yml"

  pull_request:
    branches: [main, develop, "release/**"]
    paths:
      - "**/*.lua"
      - ".luacheckrc"
      - ".github/workflows/lint/luacheck.yml"
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      severity:
        description: "Minimum severity (error / warning)"
        required: false
        default: "warning"
        type: choice
        options: [error, warning]
      strict_mode:
        description: "Enable strict mode (all warnings as errors)"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

concurrency:
  group: "luacheck-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  LUACHECK_VERSION: "1.1.2"
  LUA_VERSION: "5.4"
  NEOVIM_VERSION: "stable"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: SETUP & DISCOVER
  # ────────────────────────────────────────────────────────────────────────────
  discover:
    name: "🔍 Discover Lua Files"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      lua-files:    ${{ steps.discover.outputs.files }}
      lua-count:    ${{ steps.discover.outputs.count }}
      has-lua:      ${{ steps.discover.outputs.has_lua }}
      nvim-files:   ${{ steps.discover.outputs.nvim_files }}
      plugin-files: ${{ steps.discover.outputs.plugin_files }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🔍 Discover Lua Files"
        id: discover
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🌙 Lua File Discovery                           ║"
          echo "╚══════════════════════════════════════════════════╝"

          # All Lua files
          mapfile -t all_lua < <(
            find . -type f -name "*.lua" \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              ! -path "*/cache/*" \
              | sort
          )

          # Neovim-specific files
          mapfile -t nvim_lua < <(
            find ./config/nvim -type f -name "*.lua" 2>/dev/null | sort
          )

          # Kitty kitten files
          mapfile -t kitty_lua < <(
            find ./config/kitty -type f -name "*.lua" 2>/dev/null | sort
          )

          # Plugin-related Lua
          mapfile -t plugin_lua < <(
            find . -type f -name "*.lua" \
              -path "*/plugins/*" 2>/dev/null | sort
          )

          count="${#all_lua[@]}"
          nvim_count="${#nvim_lua[@]}"

          echo "  Total Lua files:    ${count}"
          echo "  Neovim Lua files:   ${nvim_count}"
          echo "  Kitty kitten files: ${#kitty_lua[@]}"
          echo "  Plugin Lua files:   ${#plugin_lua[@]}"

          files_json="$(printf '%s\n' "${all_lua[@]}" | jq -R . | jq -sc .)"
          nvim_json="$(printf '%s\n' "${nvim_lua[@]}" | jq -R . | jq -sc .)"
          plugin_json="$(printf '%s\n' "${plugin_lua[@]}" | jq -R . | jq -sc .)"

          echo "files=${files_json}" >> "${GITHUB_OUTPUT}"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          echo "has_lua=$([ "${count}" -gt 0 ] && echo 'true' || echo 'false')" >> "${GITHUB_OUTPUT}"
          echo "nvim_files=${nvim_json}" >> "${GITHUB_OUTPUT}"
          echo "plugin_files=${plugin_json}" >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: INSTALL TOOLS
  # ────────────────────────────────────────────────────────────────────────────
  install-tools:
    name: "🛠️ Install Analysis Tools"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🛠️ Install Lua & Luacheck"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🛠️  Installing Lua Analysis Toolchain            ║"
          echo "╚══════════════════════════════════════════════════╝"

          sudo apt-get update -q
          sudo apt-get install -q -y \
            lua5.4 \
            luarocks \
            lua-check \
            wget \
            curl \
            jq

          # Install specific luacheck version
          sudo luarocks install luacheck "${{ env.LUACHECK_VERSION }}" || \
          sudo luarocks install luacheck

          echo ""
          echo "  Tool versions:"
          lua -v
          luacheck --version
          luarocks --version | head -1

          echo "  ✅ Toolchain ready"

      - name: "📦 Install Neovim (for globals extraction)"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  📦 Installing Neovim for API globals            ║"
          echo "╚══════════════════════════════════════════════════╝"

          # Install Neovim for accurate global detection
          wget -qO /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/${{ env.NEOVIM_VERSION }}/nvim-linux-x86_64.tar.gz"

          sudo tar -xzf /tmp/nvim.tar.gz -C /usr/local \
            --strip-components=1 \
            --no-same-owner

          nvim --version | head -3
          echo "  ✅ Neovim installed"

      - name: "⚙️ Configure Luacheck"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  ⚙️  Luacheck Configuration                       ║"
          echo "╚══════════════════════════════════════════════════╝"

          # Extract Neovim API globals dynamically
          nvim_globals="$(nvim --headless -u NONE \
            -c 'lua io.write(table.concat(vim.fn.keys(vim.api), "\n"))' \
            -c 'quit' 2>/dev/null | grep '^nvim_' | sort -u || echo "")"

          vim_globals="$(nvim --headless -u NONE \
            -c 'lua io.write(table.concat(vim.fn.keys(vim), "\n"))' \
            -c 'quit' 2>/dev/null | sort -u || echo "")"

          echo "  Neovim API functions: $(echo "${nvim_globals}" | wc -l)"
          echo "  Vim globals:          $(echo "${vim_globals}" | wc -l)"

          # Write comprehensive .luacheckrc
          cat > .luacheckrc << 'LUACHECKRC'
          -- ╔══════════════════════════════════════════════════════════════════╗
          -- ║  ASH DOTFILES v5.0 OMEGA — Luacheck Configuration              ║
          -- ╚══════════════════════════════════════════════════════════════════╝

          -- Lua version
          std = "lua54"

          -- Maximum line length
          max_line_length = 120
          max_string_line_length = 180
          max_comment_line_length = 180

          -- Report format
          codes = true
          ranges = true
          max_cyclomatic_complexity = 15

          -- Warnings to enable
          -- W111: setting non-standard global
          -- W112: mutating non-standard global
          -- W113: accessing undefined variable
          -- W211: unused variable (except _)
          -- W212: unused argument (except _)
          -- W311: value assigned to variable is unused
          -- W312: value of argument is unused
          -- W411: redefining global in local scope
          -- W412: redefining a local
          -- W421: shadowing upvalue
          -- W422: shadowing upvalue argument
          -- W431: shadowing a loop variable
          -- W432: shadowing a loop variable with a loop variable
          -- W441: variable is never set
          -- W442: argument never used
          -- W451: accessing an undefined variable
          -- W452: accessing a field of an undefined variable

          -- Global whitelists

          -- Core Neovim globals
          globals = {
            -- Neovim core
            "vim",
            "jit",
            "bit",

            -- Lazy.nvim plugin spec
            "spec",

            -- Testing (if using plenary.nvim)
            "describe",
            "it",
            "before_each",
            "after_each",
            "assert",
            "mock",
            "stub",
            "spy",

            -- ASH integration globals
            "ASH_VERSION",
            "ASH_THEME",
            "ASH_MODE",
            "ASH_CONFIG_DIR",
            "ASH_DATA_DIR",
          }

          -- Read-only globals (can read but not write)
          read_globals = {
            -- Neovim API (auto-discovered)
            "vim",
          }

          -- Per-file/directory overrides
          files = {
            -- Neovim configuration
            ["config/nvim/**/*.lua"] = {
              globals = {
                "vim",
                "describe",
                "it",
                "before_each",
                "after_each",
                "assert",
              },
              std = "lua54",
              max_line_length = 120,
            },

            -- Kitty kittens (older Lua API)
            ["config/kitty/kittens/**/*.lua"] = {
              std = "lua54",
              globals = { "kitty" },
            },

            -- Test files
            ["tests/**/*.lua"] = {
              globals = {
                "vim",
                "describe",
                "it",
                "before_each",
                "after_each",
                "assert",
                "mock",
                "stub",
              },
              std = "lua54",
            },

            -- Plugin files (can define more globals)
            ["config/nvim/lua/plugins/**/*.lua"] = {
              globals = { "vim", "spec" },
              -- Plugins often use lazy patterns
              ignore = { "631" },  -- W631: line is too long (plugin specs)
            },
          }

          -- Patterns to exclude
          exclude_files = {
            ".git",
            "node_modules",
            "vendor",
            "*.min.lua",
          }

          -- Ignore specific codes with justification
          ignore = {
            -- "211",  -- Unused variable: too many false positives in Neovim config
            -- "212",  -- Unused argument: _ convention not always followed
          }

          LUACHECKRC

          echo "  ✅ .luacheckrc configured"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: ANALYZE — Full Luacheck analysis
  # ────────────────────────────────────────────────────────────────────────────
  analyze:
    name: "🔬 Luacheck Analysis"
    needs: [discover, install-tools]
    if: needs.discover.outputs.has-lua == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      errors:   ${{ steps.luacheck.outputs.errors }}
      warnings: ${{ steps.luacheck.outputs.warnings }}
      passed:   ${{ steps.luacheck.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🛠️ Install Tools"
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y lua5.4 luarocks jq
          sudo luarocks install luacheck "${{ env.LUACHECK_VERSION }}" || \
          sudo luarocks install luacheck

          # Install Neovim
          wget -qO /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/${{ env.NEOVIM_VERSION }}/nvim-linux-x86_64.tar.gz"
          sudo tar -xzf /tmp/nvim.tar.gz -C /usr/local \
            --strip-components=1 --no-same-owner

      - name: "⚙️ Generate Luacheckrc"
        shell: bash
        run: |
          # Use repo .luacheckrc if exists, otherwise create one
          if [[ ! -f .luacheckrc ]]; then
            cat > .luacheckrc << 'EOF'
          std = "lua54"
          globals = { "vim", "jit", "bit", "describe", "it", "before_each", "after_each", "assert" }
          max_line_length = 120
          codes = true
          ranges = true
          EOF
          fi

      - name: "🔬 Run Luacheck Analysis"
        id: luacheck
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🌙 Luacheck Analysis                            ║"
          echo "╚══════════════════════════════════════════════════╝"

          lua_files=(${{ needs.discover.outputs.lua-count }})
          echo "  Analyzing ${{ needs.discover.outputs.lua-count }} Lua files..."
          echo ""

          # Run luacheck with multiple output formats
          luacheck_exit=0

          # JSON-like output for processing
          luacheck \
            --codes \
            --ranges \
            --formatter=plain \
            --max-line-length=120 \
            ${{ inputs.strict_mode == 'true' && '--no-max-cyclomatic-complexity' || '' }} \
            $(find . -name "*.lua" ! -path "./.git/*" ! -path "./node_modules/*") \
            > luacheck-plain.txt 2>&1 || luacheck_exit=$?

          # Count issues
          errors="$(grep -c ': (E' luacheck-plain.txt 2>/dev/null || echo 0)"
          warnings="$(grep -c ': (W' luacheck-plain.txt 2>/dev/null || echo 0)"
          total=$((errors + warnings))

          echo "  Results:"
          echo "  ├── 🔴 Errors:   ${errors}"
          echo "  ├── 🟠 Warnings: ${warnings}"
          echo "  └── 📝 Total:    ${total}"
          echo ""

          # Print issues (grouped by file)
          if [[ ${total} -gt 0 ]]; then
            echo "  📋 Issues found:"
            cat luacheck-plain.txt | head -100
          fi

          # Determine pass/fail
          passed="true"
          if [[ ${errors} -gt 0 ]]; then
            passed="false"
          fi
          if [[ ${warnings} -gt 0 && "${{ inputs.strict_mode || 'false' }}" == "true" ]]; then
            passed="false"
          fi

          echo ""
          if [[ "${passed}" == "true" ]]; then
            echo "  ✅ STATUS: PASSED — All Lua files are clean!"
          else
            echo "  ❌ STATUS: FAILED — Fix issues before merging"
          fi

          echo "errors=${errors}" >> "${GITHUB_OUTPUT}"
          echo "warnings=${warnings}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

      - name: "🎨 Run Stylua Format Check"
        id: stylua
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🎨 StyLua Format Verification                   ║"
          echo "╚══════════════════════════════════════════════════╝"

          # Install StyLua
          wget -qO /tmp/stylua.zip \
            "https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip" \
            2>/dev/null || {
              echo "  ⚠️  StyLua download failed — skipping format check"
              exit 0
            }

          unzip -q /tmp/stylua.zip -d /tmp/
          sudo install -m 755 /tmp/stylua /usr/local/bin/stylua

          echo "  StyLua version: $(stylua --version)"

          # Generate stylua.toml if not present
          if [[ ! -f stylua.toml ]] && [[ ! -f .stylua.toml ]]; then
            cat > stylua.toml << 'STYLUATOML'
          column_width = 120
          line_endings = "Unix"
          indent_type = "Spaces"
          indent_width = 2
          quote_style = "AutoPreferDouble"
          call_parentheses = "Always"
          STYLUATOML
          fi

          # Check formatting (do not modify files)
          format_issues=0
          while IFS= read -r -d '' lua_file; do
            if ! stylua --check "${lua_file}" 2>/dev/null; then
              echo "  ❌ Formatting issue: ${lua_file}"
              format_issues=$((format_issues + 1))
            fi
          done < <(find . -name "*.lua" ! -path "./.git/*" ! -path "./node_modules/*" -print0)

          if [[ ${format_issues} -eq 0 ]]; then
            echo "  ✅ All Lua files are properly formatted"
          else
            echo ""
            echo "  ⚠️  ${format_issues} files need formatting"
            echo "  Fix with: stylua **/*.lua"
          fi

          echo "format_issues=${format_issues}" >> "${GITHUB_OUTPUT}"

      - name: "🔍 Neovim-Specific Analysis"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🔍 Neovim Configuration Analysis                ║"
          echo "╚══════════════════════════════════════════════════╝"

          nvim_dir="./config/nvim"
          if [[ ! -d "${nvim_dir}" ]]; then
            echo "  ℹ️  No Neovim config directory found — skipping"
            exit 0
          fi

          echo "  Checking Neovim configuration structure..."

          # Check init.lua exists
          if [[ -f "${nvim_dir}/init.lua" ]]; then
            echo "  ✅ init.lua present"
          else
            echo "  ❌ init.lua missing — required for Neovim"
          fi

          # Check lazy-lock.json
          if [[ -f "${nvim_dir}/lazy-lock.json" ]]; then
            plugin_count="$(jq 'keys | length' "${nvim_dir}/lazy-lock.json")"
            echo "  ✅ lazy-lock.json present (${plugin_count} plugins locked)"
          else
            echo "  ⚠️  lazy-lock.json missing — plugin versions not locked"
          fi

          # Check for deprecated API usage
          deprecated_patterns=(
            "vim.lsp.buf.formatting "
            "vim.lsp.buf.range_formatting"
            "vim.cmd\('colorscheme'\)"
            "require('nvim-lsp-installer')"
          )

          deprecated_found=0
          for pattern in "${deprecated_patterns[@]}"; do
            count="$(grep -r "${pattern}" "${nvim_dir}" 2>/dev/null | wc -l)"
            if [[ ${count} -gt 0 ]]; then
              echo "  ⚠️  Deprecated API found (${count} uses): ${pattern}"
              deprecated_found=$((deprecated_found + count))
            fi
          done

          if [[ ${deprecated_found} -eq 0 ]]; then
            echo "  ✅ No deprecated Neovim API usage detected"
          fi

          # Validate plugin specs
          plugin_files="$(find "${nvim_dir}/lua/plugins" -name "*.lua" 2>/dev/null | wc -l)"
          echo "  📦 Plugin spec files: ${plugin_files}"

          echo ""
          echo "  ✅ Neovim analysis complete"

      - name: "📤 Upload Results"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "luacheck-results"
          path: |
            luacheck-plain.txt
          retention-days: 14

      - name: "💬 Post PR Comment"
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const errors     = parseInt('${{ steps.luacheck.outputs.errors || 0 }}');
            const warnings   = parseInt('${{ steps.luacheck.outputs.warnings || 0 }}');
            const passed     = '${{ steps.luacheck.outputs.passed }}' === 'true';
            const luaCount   = '${{ needs.discover.outputs.lua-count }}';
            const formatIss  = parseInt('${{ steps.stylua.outputs.format_issues || 0 }}');

            const icon   = passed && formatIss === 0 ? '✅' : '❌';
            const status = passed && formatIss === 0 ? 'PASSED' : 'FAILED';

            const body = `## 🌙 Luacheck Analysis ${icon}

            **Status: ${status}** | Analyzed **${luaCount}** Lua files

            | Check | Count | Status |
            |-------|-------|--------|
            | 🔴 Errors | \`${errors}\` | ${errors === 0 ? '✅' : '❌'} |
            | 🟠 Warnings | \`${warnings}\` | ${warnings === 0 ? '✅' : '⚠️'} |
            | 🎨 Format Issues | \`${formatIss}\` | ${formatIss === 0 ? '✅' : '⚠️'} |

            ${errors === 0 && warnings === 0 && formatIss === 0
              ? '### ✨ All Lua files pass analysis!'
              : `### 🔧 Fix Required\n\n\`\`\`bash\n# Fix formatting\nstylua **/*.lua\n\n# Check luacheck issues\nluacheck --codes --ranges **/*.lua\n\`\`\``
            }

            ---
            *🤖 ASH Dotfiles Luacheck • [Full Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🌙 Luacheck Analysis')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — Luacheck"
    needs: [discover, analyze]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: "🚦 Evaluate Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🚦 Luacheck Quality Gate                        ║"
          echo "╚══════════════════════════════════════════════════╝"

          passed="${{ needs.analyze.outputs.passed || 'true' }}"
          has_lua="${{ needs.discover.outputs.has-lua }}"

          if [[ "${has_lua}" == "false" ]]; then
            echo "  ℹ️  No Lua files found — gate skipped"
            exit 0
          fi

          if [[ "${passed}" == "true" ]]; then
            echo "  ✅ QUALITY GATE: PASSED"
            echo "  🎉 All Lua files are Luacheck compliant!"
          else
            echo "  ❌ QUALITY GATE: FAILED"
            echo "  Fix all Luacheck issues before merging."
            echo "  Run: luacheck --codes --ranges config/nvim/**/*.lua"
            exit 1
          fi