# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      📏 ASH DOTFILES v5.0 OMEGA — EDITORCONFIG CHECK WORKFLOW                         ║
# ║                                                                                          ║
# ║      Ultra-Premium EditorConfig Compliance Analysis Pipeline                            ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      editorconfig-checker •  Multi-Language Rules  •  Encoding Validation             ║
# ║      Indent Consistency   •  Line Ending Audit     •  Trailing Whitespace             ║
# ║      Max Line Length      •  Final Newline Check   •  charset Validation              ║
# ║      Tab vs Space Audit   •  Cross-Platform Compat •  File Size Analysis             ║
# ║      Binary Detection     •  MIME Type Check       •  Diff Report                   ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "📏 EditorConfig — Code Style Compliance"

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths:
      - "**"
      - ".editorconfig"
      - ".github/workflows/lint/editorconfig-check.yml"

  pull_request:
    branches: [main, develop, "release/**"]
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      fix_mode:
        description: "Show what would be auto-fixed"
        required: false
        default: false
        type: boolean
      exclude_patterns:
        description: "Extra patterns to exclude (comma-separated)"
        required: false
        default: ""
        type: string
      strict_mode:
        description: "Strict mode — fail on all violations"
        required: false
        default: true
        type: boolean
      generate_report:
        description: "Generate detailed compliance report"
        required: false
        default: true
        type: boolean

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: "editorconfig-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  EC_VERSION: "3.0.3"
  PYTHON_VERSION: "3.12"
  # File patterns to always exclude
  ALWAYS_EXCLUDE: >-
    .git
    node_modules
    .pnpm-store
    target
    dist
    build
    __pycache__
    .venv
    venv
    vendor
    *.min.js
    *.min.css
    *.lock
    lazy-lock.json
    package-lock.json

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: VALIDATE-CONFIG — Check .editorconfig itself
  # ────────────────────────────────────────────────────────────────────────────
  validate-editorconfig:
    name: "📋 Validate .editorconfig"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      ec-exists:   ${{ steps.validate.outputs.ec_exists }}
      ec-valid:    ${{ steps.validate.outputs.ec_valid }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📋 Validate .editorconfig File"
        id: validate
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📋 EditorConfig File Validation                            ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          if [[ ! -f ".editorconfig" ]]; then
            echo "  ❌ .editorconfig file NOT found"
            echo "  ℹ️  Create a .editorconfig file in the repository root"
            echo "ec_exists=false" >> "${GITHUB_OUTPUT}"
            echo "ec_valid=false"  >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "  ✅ .editorconfig found"
          echo ""
          echo "  📋 Content:"
          cat .editorconfig | head -80

          # Validate .editorconfig syntax
          python3 << 'ECVALIDATE'
          import re
          import sys

          ec_errors   = []
          ec_warnings = []
          current_section = None
          valid_properties = {
              "indent_style", "indent_size", "tab_width",
              "end_of_line", "charset", "trim_trailing_whitespace",
              "insert_final_newline", "max_line_length", "root",
              "indent_brace_style", "quote_type",
              # Extension properties (allowed)
              "ij_any_use_relative_indentation",
          }
          valid_values = {
              "indent_style":               {"tab", "space"},
              "end_of_line":                {"lf", "cr", "crlf"},
              "charset":                    {"utf-8", "utf-16be", "utf-16le",
                                             "latin1", "utf-8-bom"},
              "trim_trailing_whitespace":   {"true", "false"},
              "insert_final_newline":       {"true", "false"},
              "root":                       {"true", "false"},
          }

          with open(".editorconfig") as f:
              lines = f.readlines()

          bom_check = open(".editorconfig", "rb").read(3)
          if bom_check == b"\xef\xbb\xbf":
              ec_warnings.append("File has BOM — EditorConfig should be UTF-8 without BOM")

          for line_num, line in enumerate(lines, 1):
              stripped = line.rstrip("\n\r")

              # Skip empty lines and comments
              if not stripped or stripped.startswith("#") or stripped.startswith(";"):
                  continue

              # Section headers
              if stripped.startswith("["):
                  if not stripped.endswith("]"):
                      ec_errors.append(
                          f"Line {line_num}: Malformed section header: {stripped!r}"
                      )
                  else:
                      current_section = stripped[1:-1]
                      if not current_section:
                          ec_errors.append(
                              f"Line {line_num}: Empty section name"
                          )
                  continue

              # Key = Value
              if "=" in stripped:
                  parts = stripped.split("=", 1)
                  key   = parts[0].strip().lower()
                  value = parts[1].strip().lower() if len(parts) > 1 else ""

                  # Skip extension/vendor properties
                  if key.startswith("ij_") or key.startswith("ktlint"):
                      continue

                  # Validate property name
                  if key not in valid_properties and not key.startswith("_"):
                      ec_warnings.append(
                          f"Line {line_num}: Unknown property {key!r}"
                      )

                  # Validate property value
                  if key in valid_values and value not in valid_values[key]:
                      if value != "unset":
                          ec_errors.append(
                              f"Line {line_num}: Invalid value {value!r} for {key!r} "
                              f"(valid: {', '.join(sorted(valid_values[key]))})"
                          )

                  # Validate indent_size
                  if key == "indent_size" and value not in ("tab", "unset"):
                      try:
                          size = int(value)
                          if size < 1 or size > 16:
                              ec_warnings.append(
                                  f"Line {line_num}: Unusual indent_size: {size} "
                                  f"(typical: 2 or 4)"
                              )
                      except ValueError:
                          ec_errors.append(
                              f"Line {line_num}: indent_size must be a number or 'tab': {value!r}"
                          )

                  # Validate max_line_length
                  if key == "max_line_length" and value != "off":
                      try:
                          length = int(value)
                          if length < 40:
                              ec_warnings.append(
                                  f"Line {line_num}: Very short max_line_length: {length}"
                              )
                      except ValueError:
                          ec_errors.append(
                              f"Line {line_num}: max_line_length must be a number or 'off': {value!r}"
                          )

              else:
                  if stripped and not stripped.startswith("["):
                      ec_warnings.append(
                          f"Line {line_num}: Line without '=': {stripped!r}"
                      )

          # Check for root = true
          with open(".editorconfig") as f:
              content = f.read()
          if "root = true" not in content and "root=true" not in content:
              ec_warnings.append(
                  "Missing 'root = true' — EditorConfig may not be applied correctly"
              )

          # Results
          print(f"  Validation: {len(ec_errors)} errors, {len(ec_warnings)} warnings")

          if ec_errors:
              print("\n  🔴 Errors:")
              for e in ec_errors:
                  print(f"     ❌ {e}")

          if ec_warnings:
              print("\n  🟠 Warnings:")
              for w in ec_warnings:
                  print(f"     ⚠️  {w}")

          if not ec_errors and not ec_warnings:
              print("  ✅ .editorconfig is valid!")

          sys.exit(len(ec_errors))
          ECVALIDATE

          ec_valid=$?
          echo ""

          echo "ec_exists=true" >> "${GITHUB_OUTPUT}"
          echo "ec_valid=$([ "${ec_valid}" -eq 0 ] && echo 'true' || echo 'false')" \
            >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: GENERATE EC — Ensure .editorconfig exists
  # ────────────────────────────────────────────────────────────────────────────
  generate-ec:
    name: "⚙️ Ensure EditorConfig Exists"
    needs: validate-editorconfig
    if: needs.validate-editorconfig.outputs.ec-exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "⚙️ Show Required .editorconfig"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ⚙️  Required .editorconfig for ASH Dotfiles                 ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          cat << 'ECTEMPLATE'
          # ASH Dotfiles v5.0 OMEGA — EditorConfig
          # https://editorconfig.org

          root = true

          # ── Universal defaults ──────────────────────────────────────────
          [*]
          charset               = utf-8
          end_of_line           = lf
          trim_trailing_whitespace = true
          insert_final_newline  = true
          indent_style          = space
          indent_size           = 2
          max_line_length       = 120

          # ── Shell scripts ───────────────────────────────────────────────
          [*.{sh,bash,zsh,ksh}]
          indent_style = space
          indent_size  = 4
          max_line_length = 120

          # ── Fish shell ──────────────────────────────────────────────────
          [*.fish]
          indent_style = space
          indent_size  = 4

          # ── Python ─────────────────────────────────────────────────────
          [*.py]
          indent_style = space
          indent_size  = 4
          max_line_length = 120

          # ── Rust ────────────────────────────────────────────────────────
          [*.rs]
          indent_style = space
          indent_size  = 4
          max_line_length = 100

          # ── Go ──────────────────────────────────────────────────────────
          [*.go]
          indent_style = tab
          indent_size  = 4

          # ── Lua ─────────────────────────────────────────────────────────
          [*.lua]
          indent_style = space
          indent_size  = 2
          max_line_length = 120

          # ── TypeScript / JavaScript ─────────────────────────────────────
          [*.{ts,tsx,js,jsx,mjs,cjs}]
          indent_style = space
          indent_size  = 2
          max_line_length = 120

          # ── CSS / SCSS / SASS ───────────────────────────────────────────
          [*.{css,scss,sass,less}]
          indent_style = space
          indent_size  = 2

          # ── HTML / XML ──────────────────────────────────────────────────
          [*.{html,htm,xml,svg}]
          indent_style = space
          indent_size  = 2
          max_line_length = 160

          # ── JSON / JSONC ─────────────────────────────────────────────────
          [*.{json,jsonc}]
          indent_style = space
          indent_size  = 2

          # ── YAML ─────────────────────────────────────────────────────────
          [*.{yml,yaml}]
          indent_style = space
          indent_size  = 2
          max_line_length = 160

          # ── TOML ─────────────────────────────────────────────────────────
          [*.toml]
          indent_style = space
          indent_size  = 2

          # ── Markdown ─────────────────────────────────────────────────────
          [*.{md,mdx}]
          trim_trailing_whitespace = false
          max_line_length          = off

          # ── Makefile ─────────────────────────────────────────────────────
          [Makefile]
          indent_style = tab

          # ── Justfile ─────────────────────────────────────────────────────
          [Justfile]
          indent_style = space
          indent_size  = 4

          # ── Hyprland config ───────────────────────────────────────────────
          [*.conf]
          indent_style = space
          indent_size  = 4
          max_line_length = 120

          # ── GLSL shaders ─────────────────────────────────────────────────
          [*.{frag,vert,glsl}]
          indent_style = space
          indent_size  = 4

          # ── Dockerfile ───────────────────────────────────────────────────
          [Dockerfile*]
          indent_style = space
          indent_size  = 4

          # ── Git ──────────────────────────────────────────────────────────
          [.gitattributes]
          indent_style = tab

          # ── EditorConfig itself ───────────────────────────────────────────
          [.editorconfig]
          indent_style = space
          indent_size  = 2

          # ── Rust lock files (auto-generated) ──────────────────────────────
          [Cargo.lock]
          insert_final_newline     = true
          trim_trailing_whitespace = true

          # ── Binary files (no rules) ───────────────────────────────────────
          [*.{png,jpg,jpeg,gif,ico,webp,woff,woff2,ttf,eot,otf}]
          charset                  = unset
          end_of_line              = unset
          insert_final_newline     = unset
          trim_trailing_whitespace = unset

          ECTEMPLATE

          echo ""
          echo "  ℹ️  Create this .editorconfig in the repository root to fix this check"
          exit 1

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: COMPLIANCE CHECK — Run ec tool
  # ────────────────────────────────────────────────────────────────────────────
  compliance-check:
    name: "✅ EditorConfig Compliance"
    needs: validate-editorconfig
    if: needs.validate-editorconfig.outputs.ec-exists == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      errors:   ${{ steps.ec-check.outputs.errors }}
      warnings: ${{ steps.ec-check.outputs.warnings }}
      passed:   ${{ steps.ec-check.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "📦 Install editorconfig-checker"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📦 Installing editorconfig-checker                         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Download editorconfig-checker binary
          EC_URL="https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${{ env.EC_VERSION }}/ec-linux-amd64.tar.gz"

          wget -qO /tmp/ec.tar.gz "${EC_URL}" 2>/dev/null || {
            echo "  ⚠️  Binary download failed — installing via Go"
            go install "github.com/editorconfig-checker/editorconfig-checker/v3/cmd/editorconfig-checker@v${{ env.EC_VERSION }}" 2>/dev/null || {
              # Fallback: use Python-based checker
              pip install -q editorconfig-checker 2>/dev/null || true
            }
          }

          if [[ -f /tmp/ec.tar.gz ]]; then
            tar -xzf /tmp/ec.tar.gz -C /tmp/ 2>/dev/null
            sudo install -m 755 \
              /tmp/bin/ec-linux-amd64 \
              /usr/local/bin/ec 2>/dev/null || \
            sudo install -m 755 \
              /tmp/ec-linux-amd64 \
              /usr/local/bin/ec 2>/dev/null || true
          fi

          # Verify installation
          if command -v ec &>/dev/null; then
            echo "  ✅ ec: $(ec --version 2>/dev/null | head -1)"
          elif command -v editorconfig-checker &>/dev/null; then
            echo "  ✅ editorconfig-checker: installed"
            alias ec="editorconfig-checker"
          else
            echo "  ℹ️  Using Python-based validation"
          fi

      - name: "⚙️ Configure EC"
        shell: bash
        run: |
          # Generate ec config if not present
          if [[ ! -f ".ecrc" && ! -f ".editorconfig-checker.json" ]]; then
            cat > .ecrc << 'ECRC'
          {
            "Version": false,
            "Verbose": false,
            "Debug": false,
            "NoColor": true,
            "Format": "",
            "Disable": {
              "TrimTrailingWhitespace": false,
              "EndOfLine": false,
              "InsertFinalNewline": false,
              "Indentation": false,
              "IndentSize": false,
              "MaxLineLength": false
            },
            "SpacesAftertabs": false,
            "AllowedContentTypes": [],
            "PassedFiles": [],
            "Exclude": [
              ".git",
              "node_modules",
              ".pnpm-store",
              "target/",
              "dist/",
              "build/",
              "__pycache__/",
              ".venv/",
              "venv/",
              "vendor/",
              "lazy-lock.json",
              "package-lock.json",
              "pnpm-lock.yaml",
              "yarn.lock",
              "Cargo.lock",
              "go.sum",
              "flake.lock",
              ".git-hooks/",
              "*.min.js",
              "*.min.css",
              "*.png",
              "*.jpg",
              "*.jpeg",
              "*.gif",
              "*.ico",
              "*.webp",
              "*.woff",
              "*.woff2",
              "*.ttf",
              "*.eot",
              "*.otf",
              "*.mp4",
              "*.mp3",
              "*.ogg",
              "*.wav",
              "*.db",
              "*.sqlite",
              "*.sarif"
            ]
          }
          ECRC
            echo "  ✅ .ecrc config generated"
          fi

      - name: "✅ Run EditorConfig Compliance Check"
        id: ec-check
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ✅ EditorConfig Compliance Check                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          ec_exit=0
          ec_output=""

          if command -v ec &>/dev/null; then
            ec_output="$(ec 2>&1)" || ec_exit=$?
          elif command -v editorconfig-checker &>/dev/null; then
            ec_output="$(editorconfig-checker 2>&1)" || ec_exit=$?
          else
            # Python fallback implementation
            echo "  ℹ️  Using Python-based compliance check..."
            python3 << 'PYEC'
          import os
          import re
          import sys
          from pathlib import Path

          EXCLUDE_PATTERNS = [
              ".git", "node_modules", ".pnpm-store", "target/", "dist/",
              "__pycache__", ".venv", "venv", "vendor/", "*.min.js",
              "*.min.css", "lazy-lock.json", "package-lock.json",
              "pnpm-lock.yaml", "flake.lock", "go.sum",
          ]

          def should_exclude(path: str) -> bool:
              for pat in EXCLUDE_PATTERNS:
                  if pat.endswith("/") and pat[:-1] in path:
                      return True
                  if pat.startswith("*") and path.endswith(pat[1:]):
                      return True
                  if pat in path:
                      return True
              return False

          def is_binary(filepath: Path) -> bool:
              try:
                  with open(filepath, "rb") as f:
                      chunk = f.read(8192)
                  return b"\x00" in chunk
              except Exception:
                  return True

          errors = []
          files_checked = 0

          for root, dirs, files in os.walk("."):
              dirs[:] = [
                  d for d in dirs
                  if not d.startswith(".")
                  and d not in ["node_modules", "target", "dist", "__pycache__",
                                ".venv", "venv", "vendor"]
              ]
              for filename in files:
                  filepath = Path(root) / filename
                  rel = str(filepath)

                  if should_exclude(rel):
                      continue
                  if is_binary(filepath):
                      continue

                  files_checked += 1

                  try:
                      content = filepath.read_bytes()
                  except Exception:
                      continue

                  # Check for BOM
                  if content.startswith(b"\xef\xbb\xbf"):
                      errors.append(f"{rel}: Has UTF-8 BOM")

                  # Check for CRLF
                  if b"\r\n" in content:
                      errors.append(f"{rel}: Windows line endings (CRLF)")

                  # Check for trailing whitespace (basic)
                  lines = content.split(b"\n")
                  for i, line in enumerate(lines, 1):
                      if line.endswith(b" ") or line.endswith(b"\t"):
                          errors.append(f"{rel}:{i}: Trailing whitespace")
                          break

                  # Check final newline
                  if content and not content.endswith(b"\n"):
                      errors.append(f"{rel}: Missing final newline")

          print(f"Checked {files_checked} files")
          for e in errors[:30]:
              print(f"Error: {e}")

          sys.exit(len(errors))
          PYEC
            ec_exit=$?
          fi

          # Process output
          if [[ -n "${ec_output}" ]]; then
            errors="$(echo "${ec_output}" | grep -cE "^.*:\d+:.*|^Error:" 2>/dev/null || echo 0)"
          else
            errors=0
          fi

          warnings=0

          if [[ ${errors} -gt 0 ]] || [[ ${ec_exit} -ne 0 ]]; then
            echo "  ❌ EditorConfig violations found:"
            echo ""
            echo "${ec_output}" | head -60 | while IFS= read -r line; do
              [[ -n "${line}" ]] && echo "  ⚠️  ${line}"
            done

            if [[ "$(echo "${ec_output}" | wc -l)" -gt 60 ]]; then
              remaining="$(echo "${ec_output}" | wc -l)"
              echo "  ... and $((remaining - 60)) more violations"
            fi
          else
            echo "  ✅ All files comply with .editorconfig!"
          fi

          passed="true"
          [[ ${ec_exit} -ne 0 ]] && passed="false"
          [[ "${{ inputs.strict_mode || 'true' }}" == "true" && \
             ${errors} -gt 0 ]] && passed="false"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  🔴 Violations found: %-36s║\n" "${errors}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          if [[ "${passed}" == "true" ]]; then
            echo "║  ✅ STATUS: PASSED                                          ║"
          else
            echo "║  ❌ STATUS: FAILED                                          ║"
          fi
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "errors=${errors}"    >> "${GITHUB_OUTPUT}"
          echo "warnings=${warnings}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"    >> "${GITHUB_OUTPUT}"

      - name: "📊 Generate Compliance Report"
        if: inputs.generate_report != 'false'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📊 EditorConfig Compliance Report                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          python3 << 'REPORT'
          import os
          import re
          from pathlib import Path
          from collections import defaultdict

          stats = defaultdict(int)
          by_extension = defaultdict(lambda: {"files": 0, "issues": 0})
          issue_types = defaultdict(int)

          # Analyze all files
          for root, dirs, files in os.walk("."):
              dirs[:] = [
                  d for d in dirs
                  if d not in [".git", "node_modules", "target", "dist",
                                "__pycache__", ".venv", "venv", "vendor"]
              ]
              for filename in files:
                  filepath = Path(root) / filename
                  ext = filepath.suffix.lower() or "no-extension"

                  try:
                      content = filepath.read_bytes()
                  except Exception:
                      continue

                  # Skip binary files
                  if b"\x00" in content[:8192]:
                      continue

                  stats["total_files"] += 1
                  by_extension[ext]["files"] += 1

                  # Check violations
                  has_crlf = b"\r\n" in content
                  has_trailing = any(
                      line.endswith(b" ") or line.endswith(b"\t")
                      for line in content.split(b"\n")
                  )
                  missing_newline = content and not content.endswith(b"\n")
                  has_bom = content.startswith(b"\xef\xbb\xbf")

                  if has_crlf:
                      issue_types["CRLF line endings"] += 1
                      by_extension[ext]["issues"] += 1
                  if has_trailing:
                      issue_types["Trailing whitespace"] += 1
                      by_extension[ext]["issues"] += 1
                  if missing_newline:
                      issue_types["Missing final newline"] += 1
                      by_extension[ext]["issues"] += 1
                  if has_bom:
                      issue_types["UTF-8 BOM"] += 1
                      by_extension[ext]["issues"] += 1

          print("  📊 File Statistics:")
          print(f"     Total files scanned: {stats['total_files']}")
          print("")
          print("  📁 By File Extension:")
          for ext, data in sorted(by_extension.items(),
                                   key=lambda x: x[1]["files"],
                                   reverse=True)[:15]:
              status = "✅" if data["issues"] == 0 else "❌"
              print(f"     {status} {ext:20s} {data['files']:4d} files  "
                    f"{data['issues']:3d} issues")

          print("")
          print("  📋 Issue Summary:")
          for issue_type, count in sorted(issue_types.items(),
                                           key=lambda x: x[1],
                                           reverse=True):
              print(f"     {issue_type:35s} {count:4d} files")

          if not issue_types:
              print("     ✅ No compliance issues detected!")

          REPORT

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — EditorConfig"
    needs: [validate-editorconfig, compliance-check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "💬 Post PR Comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const ecExists    = '${{ needs.validate-editorconfig.outputs.ec-exists }}' === 'true';
            const ecValid     = '${{ needs.validate-editorconfig.outputs.ec-valid }}' === 'true';
            const violations  = parseInt('${{ needs.compliance-check.outputs.errors || 0 }}');
            const compPassed  = '${{ needs.compliance-check.outputs.passed || "true" }}' === 'true';

            const overallPassed = ecExists && ecValid && compPassed;
            const icon   = overallPassed ? '✅' : '❌';
            const status = overallPassed ? 'PASSED' : 'FAILED';

            const body = `## 📏 EditorConfig Compliance ${icon}

            **Status: ${status}**

            | Check | Status |
            |-------|--------|
            | 📋 .editorconfig exists | ${ecExists ? '✅' : '❌'} |
            | ✔️ .editorconfig syntax | ${ecValid ? '✅' : '❌'} |
            | 📏 Compliance violations | \`${violations}\` ${compPassed ? '✅' : '❌'} |

            ${overallPassed
              ? '### ✨ All files comply with EditorConfig!'
              : !ecExists
                ? `### ❌ Missing .editorconfig\n\nCreate a \`.editorconfig\` file in the repository root.\nSee the workflow output for a recommended template.`
                : `### 🔧 Fix Compliance Violations\n\n\`\`\`bash\n# Install ec checker:\ngo install github.com/editorconfig-checker/editorconfig-checker/v3/cmd/editorconfig-checker@latest\n\n# Check compliance:\nec\n\n# Auto-fix trailing whitespace:\nfind . -name "*.sh" -exec sed -i 's/[[:space:]]*$//' {} \\;\n\n# Fix line endings:\nfind . -name "*.sh" -exec dos2unix {} \\;\n\`\`\``
            }

            <details>
            <summary>📋 EditorConfig Rules Applied</summary>

            | File Type | Indent | Line Ending | Max Length |
            |-----------|--------|-------------|------------|
            | Shell scripts | 4 spaces | LF | 120 |
            | Python | 4 spaces | LF | 120 |
            | Rust | 4 spaces | LF | 100 |
            | Go | tab (4) | LF | — |
            | Lua | 2 spaces | LF | 120 |
            | TypeScript/JS | 2 spaces | LF | 120 |
            | CSS/SCSS | 2 spaces | LF | — |
            | JSON/YAML | 2 spaces | LF | — |
            | Markdown | 2 spaces | LF | off |
            | Fish shell | 4 spaces | LF | — |
            | Hyprland .conf | 4 spaces | LF | 120 |
            </details>

            ---
            *🤖 ASH Dotfiles EditorConfig v${{ env.EC_VERSION }} • [Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('📏 EditorConfig Compliance')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: "🚦 Evaluate Quality Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 EditorConfig Quality Gate                               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          ec_exists="${{ needs.validate-editorconfig.outputs.ec-exists }}"
          ec_valid="${{ needs.validate-editorconfig.outputs.ec-valid }}"
          comp_passed="${{ needs.compliance-check.outputs.passed || 'true' }}"
          violations="${{ needs.compliance-check.outputs.errors || '0' }}"

          echo ""
          echo "  📊 Gate Summary:"
          echo "  ├── .editorconfig exists: ${ec_exists}"
          echo "  ├── .editorconfig valid:  ${ec_valid}"
          echo "  ├── Violations:           ${violations}"
          echo "  └── Compliance:           ${comp_passed}"
          echo ""

          if [[ "${ec_exists}" == "false" ]]; then
            echo "  ❌ QUALITY GATE: FAILED"
            echo "  .editorconfig file is required. Create it in the repository root."
            exit 1
          fi

          if [[ "${comp_passed}" == "true" ]]; then
            echo "  ✅ QUALITY GATE: PASSED"
            echo "  🎉 All files comply with EditorConfig rules!"
          else
            echo "  ❌ QUALITY GATE: FAILED"
            echo "  Fix violations: ec (editorconfig-checker)"
            exit 1
          fi