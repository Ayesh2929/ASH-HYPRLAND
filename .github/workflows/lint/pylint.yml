# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🐍 ASH DOTFILES v5.0 OMEGA — PYLINT WORKFLOW                                     ║
# ║                                                                                          ║
# ║      Ultra-Premium Python Code Quality Analysis Pipeline                                ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      Pylint v3.3+        •  Ruff v0.7+           •  mypy v1.13+                       ║
# ║      Bandit Security     •  Black Formatting      •  isort Import Order               ║
# ║      Radon Complexity    •  Vulture Dead Code     •  Safety CVE Scan                  ║
# ║      FastAPI Audit       •  Pydantic Validation   •  Type Stub Coverage              ║
# ║      Score Enforcement   •  SARIF Upload          •  Trend Analysis                  ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🐍 Pylint — Python Code Quality"

# ══════════════════════════════════════════════════════════════════════════════
# TRIGGER CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "setup.cfg"
      - "setup.py"
      - "requirements*.txt"
      - ".pylintrc"
      - "mypy.ini"
      - ".ruff.toml"
      - ".github/workflows/lint/pylint.yml"

  pull_request:
    branches:
      - main
      - develop
      - "release/**"
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".pylintrc"
      - "mypy.ini"
      - ".github/workflows/lint/pylint.yml"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:
    inputs:
      min_score:
        description: "Minimum Pylint score (0-10, default 8.5)"
        required: false
        default: "8.5"
        type: string
      run_mypy:
        description: "Run mypy type checking"
        required: false
        default: true
        type: boolean
      run_bandit:
        description: "Run Bandit security analysis"
        required: false
        default: true
        type: boolean
      run_ruff:
        description: "Run Ruff fast linter"
        required: false
        default: true
        type: boolean
      run_safety:
        description: "Run Safety CVE dependency scan"
        required: false
        default: true
        type: boolean
      strict_mode:
        description: "Strict mode — fail on any warning"
        required: false
        default: false
        type: boolean

  schedule:
    # Full analysis nightly at 03:30 UTC
    - cron: "30 3 * * *"

# ══════════════════════════════════════════════════════════════════════════════
# PERMISSIONS
# ══════════════════════════════════════════════════════════════════════════════
permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

# ══════════════════════════════════════════════════════════════════════════════
# CONCURRENCY
# ══════════════════════════════════════════════════════════════════════════════
concurrency:
  group: "pylint-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════════════════
# GLOBAL ENV
# ══════════════════════════════════════════════════════════════════════════════
env:
  PYTHON_VERSION: "3.12"
  PYLINT_VERSION: "3.3.1"
  MYPY_VERSION: "1.13.0"
  RUFF_VERSION: "0.7.4"
  BANDIT_VERSION: "1.8.0"
  BLACK_VERSION: "24.10.0"
  MIN_PYLINT_SCORE: "${{ inputs.min_score || '8.5' }}"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: DISCOVER — Find all Python files
  # ────────────────────────────────────────────────────────────────────────────
  discover:
    name: "🔍 Discover Python Files"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      py-files:      ${{ steps.discover.outputs.py_files }}
      py-count:      ${{ steps.discover.outputs.py_count }}
      has-python:    ${{ steps.discover.outputs.has_python }}
      api-files:     ${{ steps.discover.outputs.api_files }}
      test-files:    ${{ steps.discover.outputs.test_files }}
      action-files:  ${{ steps.discover.outputs.action_files }}
      has-api:       ${{ steps.discover.outputs.has_api }}
      has-tests:     ${{ steps.discover.outputs.has_tests }}
      packages:      ${{ steps.discover.outputs.packages }}

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🔍 Discover Python Files & Packages"
        id: discover
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🐍 Python Discovery Engine                                 ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # All Python files
          mapfile -t all_py < <(
            find . -type f -name "*.py" \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              ! -path "./.pnpm-store/*" \
              ! -path "*/__pycache__/*" \
              ! -path "*/.venv/*" \
              ! -path "*/venv/*" \
              ! -path "*/.tox/*" \
              ! -path "*/migrations/*" \
              | sort
          )

          # API server files
          mapfile -t api_files < <(
            find ./api -type f -name "*.py" \
              ! -path "*/__pycache__/*" 2>/dev/null | sort
          )

          # Test files
          mapfile -t test_files < <(
            find . -type f \( -name "test_*.py" -o -name "*_test.py" \) \
              ! -path "./.git/*" ! -path "./node_modules/*" \
              ! -path "*/__pycache__/*" 2>/dev/null | sort
          )

          # GitHub Action Python scripts
          mapfile -t action_files < <(
            find ./.github/actions -type f -name "*.py" 2>/dev/null | sort
          )

          # Python packages (directories with __init__.py)
          mapfile -t packages < <(
            find . -name "__init__.py" \
              ! -path "./.git/*" ! -path "./node_modules/*" \
              ! -path "*/__pycache__/*" ! -path "*/.venv/*" \
              | xargs -I{} dirname {} | sort -u
          )

          py_count="${#all_py[@]}"
          has_api="false"
          has_tests="false"
          [[ ${#api_files[@]} -gt 0 ]] && has_api="true"
          [[ ${#test_files[@]} -gt 0 ]] && has_tests="true"

          echo ""
          echo "  📊 Python Discovery Results:"
          echo "  ├── Total Python files:   ${py_count}"
          echo "  ├── API server files:     ${#api_files[@]}"
          echo "  ├── Test files:           ${#test_files[@]}"
          echo "  ├── Action files:         ${#action_files[@]}"
          echo "  └── Python packages:      ${#packages[@]}"
          echo ""
          echo "  📦 Python packages found:"
          for pkg in "${packages[@]}"; do
            echo "     → ${pkg}"
          done
          echo ""

          # Detect frameworks
          echo "  🔍 Framework detection:"
          has_fastapi="false"
          has_flask="false"
          has_django="false"
          if grep -rq "fastapi\|FastAPI" ./api 2>/dev/null; then
            echo "     ✅ FastAPI detected"
            has_fastapi="true"
          fi
          if grep -rq "flask\|Flask" . --include="*.py" 2>/dev/null; then
            echo "     ✅ Flask detected"
            has_flask="true"
          fi
          if grep -rq "django\|Django" . --include="*.py" 2>/dev/null; then
            echo "     ✅ Django detected"
            has_django="true"
          fi

          # Check for type annotations
          typed_files="$(grep -rl "from __future__ import annotations\|: [A-Z]\|-> " \
            --include="*.py" . 2>/dev/null | grep -v __pycache__ | wc -l)"
          echo "     📐 Files with type annotations: ${typed_files}"

          py_json="$(printf '%s\n' "${all_py[@]}" | jq -R . | jq -sc . 2>/dev/null || echo '[]')"
          api_json="$(printf '%s\n' "${api_files[@]}" | jq -R . | jq -sc . 2>/dev/null || echo '[]')"
          test_json="$(printf '%s\n' "${test_files[@]}" | jq -R . | jq -sc . 2>/dev/null || echo '[]')"
          action_json="$(printf '%s\n' "${action_files[@]}" | jq -R . | jq -sc . 2>/dev/null || echo '[]')"
          pkg_json="$(printf '%s\n' "${packages[@]}" | jq -R . | jq -sc . 2>/dev/null || echo '[]')"

          {
            echo "py_files=${py_json}"
            echo "py_count=${py_count}"
            echo "api_files=${api_json}"
            echo "test_files=${test_json}"
            echo "action_files=${action_json}"
            echo "packages=${pkg_json}"
            echo "has_api=${has_api}"
            echo "has_tests=${has_tests}"
            echo "has_python=$([ "${py_count}" -gt 0 ] && echo 'true' || echo 'false')"
          } >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: SETUP — Install Python toolchain
  # ────────────────────────────────────────────────────────────────────────────
  setup:
    name: "🛠️ Setup Python Toolchain"
    needs: discover
    if: needs.discover.outputs.has-python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🐍 Setup Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "🛠️ Install Complete Python Toolchain"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🐍 Installing Python Quality Toolchain                     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          pip install -q --upgrade pip wheel setuptools

          # Core analysis tools (pinned for reproducibility)
          pip install -q \
            "pylint==${{ env.PYLINT_VERSION }}" \
            "mypy==${{ env.MYPY_VERSION }}" \
            "ruff==${{ env.RUFF_VERSION }}" \
            "bandit[toml]==${{ env.BANDIT_VERSION }}" \
            "black==${{ env.BLACK_VERSION }}" \
            "isort==5.13.2" \
            "radon==6.0.1" \
            "vulture==2.13" \
            "safety==3.2.11" \
            "pyupgrade==3.19.0"

          # Type stubs for popular libraries
          pip install -q \
            "types-requests" \
            "types-PyYAML" \
            "types-toml" \
            "types-setuptools" \
            "types-redis" \
            "pandas-stubs" \
            "boto3-stubs"

          # FastAPI & web framework support
          pip install -q \
            "fastapi" \
            "pydantic" \
            "pydantic-settings" \
            "uvicorn" \
            "httpx" \
            "anyio" \
            "aiofiles" \
            2>/dev/null || true

          # Install project requirements if present
          for req_file in requirements.txt api/requirements.txt requirements-dev.txt; do
            if [[ -f "${req_file}" ]]; then
              echo "  📦 Installing: ${req_file}"
              pip install -q -r "${req_file}" 2>/dev/null || true
            fi
          done

          # Install package itself (for type checking)
          if [[ -f "pyproject.toml" ]] || [[ -f "setup.py" ]]; then
            pip install -q -e ".[dev]" 2>/dev/null || \
            pip install -q -e "." 2>/dev/null || true
          fi

          echo ""
          echo "  📦 Installed tool versions:"
          printf "     %-20s %s\n" "pylint:"    "$(pylint --version 2>/dev/null | head -1)"
          printf "     %-20s %s\n" "mypy:"      "$(mypy --version 2>/dev/null)"
          printf "     %-20s %s\n" "ruff:"      "$(ruff --version 2>/dev/null)"
          printf "     %-20s %s\n" "bandit:"    "$(bandit --version 2>/dev/null | head -1)"
          printf "     %-20s %s\n" "black:"     "$(black --version 2>/dev/null)"
          printf "     %-20s %s\n" "isort:"     "$(isort --version-number 2>/dev/null)"
          printf "     %-20s %s\n" "radon:"     "$(radon --version 2>/dev/null)"
          printf "     %-20s %s\n" "vulture:"   "$(vulture --version 2>/dev/null)"
          echo ""
          echo "  ✅ Python toolchain ready"

      - name: "⚙️ Generate Pylint Configuration"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ⚙️  Pylint Configuration Generator                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          if [[ -f .pylintrc ]] || (grep -q "\[tool.pylint\]" pyproject.toml 2>/dev/null); then
            echo "  ✅ Using repository Pylint config"
          else
            echo "  ℹ️  Generating comprehensive .pylintrc..."
            cat > .pylintrc << 'PYLINTRC'
          [MAIN]
          # Use multiple CPUs for parallel analysis
          jobs = 4
          # Pickle collected data for later comparisons
          persistent = yes
          # Allow loading extension modules
          extension-pkg-allow-list = pydantic,cv2

          [MESSAGES CONTROL]
          # Disable noisy or project-incompatible messages
          disable =
            C0114,  # missing-module-docstring
            C0115,  # missing-class-docstring
            C0116,  # missing-function-docstring
            R0903,  # too-few-public-methods
            W0511,  # fixme (allow TODO/FIXME comments)

          # Enable all these explicitly
          enable =
            W0611,  # unused-import
            W0612,  # unused-variable
            E0001,  # syntax-error
            E0102,  # function-redefined
            E0117,  # nonlocal-and-global
            W0602,  # global-variable-not-assigned
            W0603,  # global-statement
            C0301,  # line-too-long

          [FORMAT]
          max-line-length = 120
          indent-string = "    "
          indent-after-paren = 4
          expected-line-ending-format = LF

          [DESIGN]
          max-args = 10
          max-attributes = 15
          max-bool-expr = 5
          max-branches = 15
          max-locals = 20
          max-parents = 7
          max-public-methods = 30
          max-returns = 8
          max-statements = 60
          min-public-methods = 0

          [SIMILARITIES]
          min-similarity-lines = 8
          ignore-comments = yes
          ignore-docstrings = yes
          ignore-imports = yes
          ignore-signatures = yes

          [TYPECHECK]
          # Third-party libraries that generate attributes dynamically
          generated-members =
            sqlalchemy.*,
            pydantic.*,
            numpy.*,
            torch.*,
          # Modules to ignore type checking for
          ignored-modules =
            cv2,
            torch,
            tensorflow

          [VARIABLES]
          # Regex pattern matching names of dummy variables
          dummy-variables-rgx = _+$|(_[a-zA-Z0-9_]*[a-zA-Z0-9]+$)|dummy|^ignored_|^unused_

          [EXCEPTIONS]
          overgeneral-exceptions = builtins.BaseException, builtins.Exception

          [REPORTS]
          output-format = text
          reports = yes
          evaluation = max(0, 0 if fatal else 10.0 - ((float(5 * error + warning + refactor + convention) / statement) * 10))

          [IMPORTS]
          allow-wildcard-with-all = no
          analyse-fallback-blocks = no

          PYLINTRC
            echo "  ✅ .pylintrc generated"
          fi

      - name: "⚙️ Generate Ruff Configuration"
        shell: bash
        run: |
          if ! grep -q "\[tool.ruff\]" pyproject.toml 2>/dev/null && [[ ! -f ruff.toml ]]; then
            cat > ruff.toml << 'RUFFTOML'
          # ASH Dotfiles — Ruff Configuration
          target-version = "py312"
          line-length = 120
          indent-width = 4
          exclude = [
            ".git", ".venv", "venv", "__pycache__",
            "migrations", "dist", "build", ".tox"
          ]

          [lint]
          select = [
            "E",    # pycodestyle errors
            "W",    # pycodestyle warnings
            "F",    # pyflakes
            "I",    # isort
            "N",    # pep8-naming
            "UP",   # pyupgrade
            "ANN",  # flake8-annotations
            "B",    # flake8-bugbear
            "C4",   # flake8-comprehensions
            "DTZ",  # flake8-datetimez
            "EM",   # flake8-errmsg
            "ISC",  # flake8-implicit-str-concat
            "PIE",  # flake8-pie
            "PT",   # flake8-pytest-style
            "Q",    # flake8-quotes
            "RET",  # flake8-return
            "SIM",  # flake8-simplify
            "TCH",  # flake8-type-checking
            "TID",  # flake8-tidy-imports
            "ARG",  # flake8-unused-arguments
            "PTH",  # flake8-use-pathlib
            "ERA",  # eradicate
            "PL",   # pylint
            "PERF", # perflint
            "FURB", # refurb
            "RUF",  # ruff-specific
          ]

          ignore = [
            "ANN101", # Missing type annotation for self
            "ANN102", # Missing type annotation for cls
            "ANN401", # Dynamically typed expressions
          ]

          [lint.per-file-ignores]
          "tests/**" = ["ANN", "ARG", "S"]
          "**/__init__.py" = ["F401"]
          ".github/**" = ["INP001", "T20"]
          "api/**" = ["ANN"]

          [lint.isort]
          known-first-party = ["ash_api"]
          section-order = [
            "future",
            "standard-library",
            "third-party",
            "first-party",
            "local-folder"
          ]

          [format]
          quote-style = "double"
          indent-style = "space"
          magic-trailing-comma = true
          line-ending = "lf"

          RUFFTOML
            echo "  ✅ ruff.toml generated"
          fi

      - name: "📤 Cache Toolchain"
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/lib/python3.12
            .pylintrc
            ruff.toml
          key: "pylint-${{ hashFiles('requirements*.txt', 'pyproject.toml', 'setup.cfg') }}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: PYLINT — Core quality analysis
  # ────────────────────────────────────────────────────────────────────────────
  pylint:
    name: "🐍 Pylint Quality Analysis"
    needs: [discover, setup]
    if: needs.discover.outputs.has-python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    outputs:
      score:    ${{ steps.pylint.outputs.score }}
      errors:   ${{ steps.pylint.outputs.errors }}
      warnings: ${{ steps.pylint.outputs.warnings }}
      passed:   ${{ steps.pylint.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📥 Restore Toolchain Cache"
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/lib/python3.12
            .pylintrc
            ruff.toml
          key: "pylint-${{ hashFiles('requirements*.txt', 'pyproject.toml', 'setup.cfg') }}"
          restore-keys: "pylint-"

      - name: "📦 Reinstall if Cache Miss"
        shell: bash
        run: |
          if ! python3 -c "import pylint" 2>/dev/null; then
            pip install -q \
              "pylint==${{ env.PYLINT_VERSION }}" \
              "mypy==${{ env.MYPY_VERSION }}" \
              "ruff==${{ env.RUFF_VERSION }}" \
              "bandit[toml]==${{ env.BANDIT_VERSION }}" \
              "black==${{ env.BLACK_VERSION }}" \
              "isort==5.13.2" \
              "radon==6.0.1" \
              "vulture==2.13" \
              "safety==3.2.11" \
              fastapi pydantic uvicorn httpx \
              types-requests types-PyYAML types-toml \
              2>/dev/null || true

            for req_file in requirements.txt api/requirements.txt; do
              [[ -f "${req_file}" ]] && pip install -q -r "${req_file}" 2>/dev/null || true
            done
          fi

      - name: "🐍 Run Pylint Analysis"
        id: pylint
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🐍 Pylint Analysis                                         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          py_count="${{ needs.discover.outputs.py-count }}"
          echo "  Analyzing ${py_count} Python files..."
          echo ""

          # Build file list
          mapfile -t py_files < <(
            find . -name "*.py" \
              ! -path "./.git/*" ! -path "./node_modules/*" \
              ! -path "*/__pycache__/*" ! -path "*/.venv/*" \
              ! -path "*/migrations/*"
          )

          if [[ ${#py_files[@]} -eq 0 ]]; then
            echo "  ℹ️  No Python files to analyze"
            echo "score=10.0" >> "${GITHUB_OUTPUT}"
            echo "errors=0"   >> "${GITHUB_OUTPUT}"
            echo "warnings=0" >> "${GITHUB_OUTPUT}"
            echo "passed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Run Pylint with JSON format
          pylint_exit=0
          pylint_json="$(pylint \
            --rcfile=.pylintrc \
            --output-format=json \
            --score=yes \
            "${py_files[@]}" \
            2>/dev/null)" || pylint_exit=$?

          echo "${pylint_json}" > pylint-results.json

          # Also run for text output
          pylint_text="$(pylint \
            --rcfile=.pylintrc \
            --output-format=text \
            --score=yes \
            "${py_files[@]}" \
            2>/dev/null)" || true

          echo "${pylint_text}" > pylint-output.txt

          # Extract score
          score="$(echo "${pylint_text}" | \
            grep -oE '[0-9]+\.[0-9]+/10' | head -1 | cut -d/ -f1 || echo "0.0")"
          [[ -z "${score}" ]] && score="0.0"

          # Count by message type
          total_errors="$(echo "${pylint_json}" | \
            python3 -c "
          import sys, json
          try:
              msgs = json.loads(sys.stdin.read())
              print(sum(1 for m in msgs if m.get('type') in ('error', 'fatal')))
          except: print(0)" 2>/dev/null || echo 0)"

          total_warnings="$(echo "${pylint_json}" | \
            python3 -c "
          import sys, json
          try:
              msgs = json.loads(sys.stdin.read())
              print(sum(1 for m in msgs if m.get('type') in ('warning', 'convention', 'refactor')))
          except: print(0)" 2>/dev/null || echo 0)"

          # Display issues by severity
          echo "  🔴 Errors and Fatal:"
          echo "${pylint_json}" | python3 -c "
          import sys, json
          try:
              msgs = json.loads(sys.stdin.read())
              errors = [m for m in msgs if m.get('type') in ('error', 'fatal')]
              for m in errors[:20]:
                  icon = '💀' if m.get('type') == 'fatal' else '❌'
                  print(f\"  {icon} {m.get('path','?')}:{m.get('line','?')} [{m.get('message-id','?')}] {m.get('message','?')}\")
              if len(errors) > 20:
                  print(f'  ... and {len(errors)-20} more errors')
          except Exception as e: print(f'  Parse error: {e}')" 2>/dev/null

          echo ""
          echo "  🟠 Top Warnings:"
          echo "${pylint_json}" | python3 -c "
          import sys, json
          from collections import Counter
          try:
              msgs = json.loads(sys.stdin.read())
              warnings = [m for m in msgs if m.get('type') in ('warning', 'convention', 'refactor')]
              codes = Counter(m.get('message-id','?') for m in warnings)
              for code, count in codes.most_common(10):
                  print(f'  ⚠️  {code}: {count} occurrences')
          except: pass" 2>/dev/null

          # Score assessment
          echo ""
          min_score="${{ env.MIN_PYLINT_SCORE }}"

          # Build visual score bar
          score_int="$(python3 -c "print(round(float('${score}')))" 2>/dev/null || echo 0)"
          score_bar="$(python3 -c "
          s=${score_int}
          bar='█' * s + '░' * (10 - s)
          print(bar)" 2>/dev/null || echo "██████████")"

          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📊 PYLINT RESULTS                                          ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  📄 Files analyzed:     %-34s║\n" "${py_count}"
          printf "║  💀/❌ Fatal/Errors:    %-34s║\n" "${total_errors}"
          printf "║  ⚠️  Warnings:           %-34s║\n" "${total_warnings}"
          printf "║  📊 Score:              %-34s║\n" "${score_bar} ${score}/10"
          printf "║  🎯 Minimum required:   %-34s║\n" "${min_score}/10"
          echo "╠══════════════════════════════════════════════════════════════╣"

          # Determine pass/fail
          passed="true"
          score_ok="$(python3 -c "
          import sys
          try:
              ok = float('${score}') >= float('${min_score}')
              print('true' if ok else 'false')
          except: print('false')" 2>/dev/null || echo "false")"

          if [[ ${total_errors} -gt 0 ]]; then
            passed="false"
          fi
          if [[ "${score_ok}" == "false" ]]; then
            passed="false"
          fi

          if [[ "${passed}" == "true" ]]; then
            echo "║  ✅ STATUS: PASSED                                          ║"
          else
            echo "║  ❌ STATUS: FAILED                                          ║"
          fi
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "score=${score}"            >> "${GITHUB_OUTPUT}"
          echo "errors=${total_errors}"    >> "${GITHUB_OUTPUT}"
          echo "warnings=${total_warnings}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"          >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload Pylint Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "pylint-results"
          path: |
            pylint-results.json
            pylint-output.txt
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: RUFF — Fast linting
  # ────────────────────────────────────────────────────────────────────────────
  ruff:
    name: "⚡ Ruff Fast Linting"
    needs: [discover, setup]
    if: >
      needs.discover.outputs.has-python == 'true' &&
      inputs.run_ruff != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      errors:  ${{ steps.ruff.outputs.errors }}
      passed:  ${{ steps.ruff.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📥 Restore Cache"
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/pip
            .pylintrc
            ruff.toml
          key: "pylint-${{ hashFiles('requirements*.txt', 'pyproject.toml', 'setup.cfg') }}"
          restore-keys: "pylint-"

      - name: "📦 Install Ruff"
        shell: bash
        run: |
          pip install -q "ruff==${{ env.RUFF_VERSION }}" 2>/dev/null
          pip install -q "black==${{ env.BLACK_VERSION }}" "isort==5.13.2" 2>/dev/null
          echo "  ruff: $(ruff --version)"

      - name: "⚡ Run Ruff Analysis"
        id: ruff
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ⚡ Ruff — Ultra-Fast Python Linting                        ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "  Ruff version: $(ruff --version)"
          echo ""

          ruff_config=""
          [[ -f ruff.toml ]] && ruff_config="--config ruff.toml"

          # Run Ruff with JSON output
          ruff_exit=0
          ruff check \
            ${ruff_config} \
            --output-format=json \
            . \
            2>/dev/null > ruff-results.json || ruff_exit=$?

          # Parse results
          errors="$(python3 -c "
          import json, sys
          try:
              results = json.load(open('ruff-results.json'))
              print(len(results))
          except: print(0)" 2>/dev/null || echo 0)"

          # Show human-readable output
          if [[ ${errors} -gt 0 ]]; then
            echo "  ❌ Ruff found ${errors} issues:"
            echo ""
            ruff check ${ruff_config} --output-format=concise . 2>/dev/null | head -40
            echo ""
            echo "  📈 Issues by category:"
            python3 -c "
          import json
          from collections import Counter
          try:
              results = json.load(open('ruff-results.json'))
              codes = Counter(r.get('code','?') for r in results)
              for code, count in codes.most_common(10):
                  cat = code[0] if code else '?'
                  cats = {'E':'pycodestyle','W':'pycodestyle','F':'pyflakes',
                          'I':'isort','N':'naming','B':'bugbear','S':'security',
                          'ANN':'annotations','UP':'pyupgrade','RUF':'ruff'}
                  label = cats.get(cat, cats.get(code[:3], 'other'))
                  print(f'     {code}: {count} ({label})')
          except: pass" 2>/dev/null
          else
            echo "  ✅ No Ruff issues found!"
          fi

          echo ""
          echo "  🎨 Black format check:"
          black_exit=0
          black --check --quiet . 2>/dev/null || black_exit=$?
          if [[ ${black_exit} -eq 0 ]]; then
            echo "  ✅ All files are Black-formatted"
          else
            echo "  ⚠️  Some files need Black formatting"
            echo "     Fix: black ."
          fi

          echo ""
          echo "  📦 isort import order check:"
          isort_exit=0
          isort --check-only --quiet . 2>/dev/null || isort_exit=$?
          if [[ ${isort_exit} -eq 0 ]]; then
            echo "  ✅ All imports are sorted"
          else
            echo "  ⚠️  Some imports need sorting"
            echo "     Fix: isort ."
          fi

          passed="true"
          [[ ${errors} -gt 0 ]] && passed="false"
          [[ "${{ inputs.strict_mode || 'false' }}" == "true" ]] && \
            [[ ${black_exit} -ne 0 || ${isort_exit} -ne 0 ]] && passed="false"

          echo "errors=${errors}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload Ruff Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "ruff-results"
          path: ruff-results.json
          retention-days: 14
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 05: MYPY — Type checking
  # ────────────────────────────────────────────────────────────────────────────
  mypy:
    name: "📐 mypy Type Checking"
    needs: [discover, setup]
    if: >
      needs.discover.outputs.has-python == 'true' &&
      inputs.run_mypy != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      errors:  ${{ steps.mypy.outputs.errors }}
      passed:  ${{ steps.mypy.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install mypy & Stubs"
        shell: bash
        run: |
          pip install -q \
            "mypy==${{ env.MYPY_VERSION }}" \
            types-requests types-PyYAML types-toml \
            types-setuptools types-redis \
            fastapi pydantic uvicorn httpx \
            2>/dev/null || true

          for req_file in requirements.txt api/requirements.txt; do
            [[ -f "${req_file}" ]] && pip install -q -r "${req_file}" 2>/dev/null || true
          done

      - name: "⚙️ Configure mypy"
        shell: bash
        run: |
          if [[ -f mypy.ini ]] || (grep -q "\[tool.mypy\]" pyproject.toml 2>/dev/null); then
            echo "  ✅ Using repository mypy config"
          else
            cat > mypy.ini << 'MYPYINI'
          [mypy]
          python_version = 3.12
          strict = true
          ignore_missing_imports = false
          warn_return_any = true
          warn_unused_configs = true
          warn_unused_ignores = true
          warn_redundant_casts = true
          disallow_untyped_defs = true
          disallow_any_generics = true
          no_implicit_optional = true
          strict_equality = true
          extra_checks = true
          show_error_codes = true
          show_column_numbers = true
          pretty = true
          error_summary = true

          [mypy-fastapi.*]
          ignore_missing_imports = true

          [mypy-uvicorn.*]
          ignore_missing_imports = true

          [mypy-pydantic.*]
          ignore_missing_imports = false

          [mypy-aiofiles.*]
          ignore_missing_imports = true

          MYPYINI
          fi

      - name: "📐 Run mypy"
        id: mypy
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📐 mypy Static Type Analysis                               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "  mypy version: $(mypy --version)"
          echo ""

          # Find Python source directories
          mapfile -t src_dirs < <(
            find . -name "__init__.py" \
              ! -path "./.git/*" ! -path "./node_modules/*" \
              ! -path "*/__pycache__/*" ! -path "*/.venv/*" \
              | xargs -I{} dirname {} | sort -u | head -10
          )

          mypy_exit=0
          mypy_output=""

          if [[ ${#src_dirs[@]} -gt 0 ]]; then
            mypy_output="$(mypy \
              "${src_dirs[@]}" \
              --no-error-summary \
              2>&1)" || mypy_exit=$?
          else
            # Fall back to analyzing all Python files
            mapfile -t py_files < <(
              find . -name "*.py" ! -path "./.git/*" \
                ! -path "./node_modules/*" ! -path "*/__pycache__/*"
            )
            mypy_output="$(mypy "${py_files[@]}" 2>&1)" || mypy_exit=$?
          fi

          errors="$(echo "${mypy_output}" | grep -c "error:" 2>/dev/null || echo 0)"
          notes="$(echo "${mypy_output}" | grep -c "note:" 2>/dev/null || echo 0)"

          if [[ ${errors} -gt 0 ]]; then
            echo "  ❌ ${errors} type errors found:"
            echo ""
            echo "${mypy_output}" | head -50
          else
            echo "  ✅ No type errors found!"
          fi

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  📐 Type errors: %-41s║\n" "${errors}"
          printf "║  📝 Notes:       %-41s║\n" "${notes}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          if [[ ${errors} -eq 0 ]]; then
            echo "║  ✅ STATUS: PASSED                                          ║"
          else
            echo "║  ❌ STATUS: FAILED                                          ║"
          fi
          echo "╚══════════════════════════════════════════════════════════════╝"

          passed="true"
          [[ ${errors} -gt 0 ]] && passed="false"

          echo "errors=${errors}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 06: SECURITY — Bandit + Safety
  # ────────────────────────────────────────────────────────────────────────────
  security:
    name: "🔒 Security Analysis — Bandit & Safety"
    needs: [discover, setup]
    if: >
      needs.discover.outputs.has-python == 'true' &&
      inputs.run_bandit != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      bandit-passed: ${{ steps.bandit.outputs.passed }}
      safety-passed: ${{ steps.safety.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install Security Tools"
        shell: bash
        run: |
          pip install -q \
            "bandit[toml]==${{ env.BANDIT_VERSION }}" \
            "safety==3.2.11" \
            2>/dev/null

          for req_file in requirements.txt api/requirements.txt; do
            [[ -f "${req_file}" ]] && pip install -q -r "${req_file}" 2>/dev/null || true
          done

      - name: "🔒 Run Bandit Security Scan"
        id: bandit
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔒 Bandit — Python Security Analysis                       ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "  Bandit version: $(bandit --version 2>/dev/null | head -1)"
          echo ""

          # Generate bandit config
          if ! grep -q "\[tool.bandit\]" pyproject.toml 2>/dev/null; then
            cat > .bandit.toml << 'BANDITCONFIG'
          [bandit]
          targets = ["."]
          recursive = true
          exclude_dirs = ["tests", ".venv", "venv", "migrations", "__pycache__"]
          skips = ["B101"]  # Allow assert statements in non-test code
          severity = "medium"
          confidence = "medium"

          BANDITCONFIG
          fi

          # Run Bandit
          bandit_exit=0
          bandit \
            --recursive \
            --format json \
            --severity-level medium \
            --confidence-level medium \
            --exclude "./.git,./node_modules,./.venv,./venv,./migrations" \
            --output bandit-results.json \
            . \
            2>/dev/null || bandit_exit=$?

          # Parse results
          high_count="$(python3 -c "
          import json
          try:
              r = json.load(open('bandit-results.json'))
              print(sum(1 for i in r.get('results',[]) if i.get('issue_severity') == 'HIGH'))
          except: print(0)" 2>/dev/null || echo 0)"

          medium_count="$(python3 -c "
          import json
          try:
              r = json.load(open('bandit-results.json'))
              print(sum(1 for i in r.get('results',[]) if i.get('issue_severity') == 'MEDIUM'))
          except: print(0)" 2>/dev/null || echo 0)"

          if [[ $((high_count + medium_count)) -gt 0 ]]; then
            echo "  🚨 Security issues found:"
            python3 -c "
          import json
          try:
              r = json.load(open('bandit-results.json'))
              issues = sorted(r.get('results',[]),
                              key=lambda x: x.get('issue_severity',''), reverse=True)
              for issue in issues[:15]:
                  sev = issue.get('issue_severity','?')
                  conf = issue.get('issue_confidence','?')
                  icon = '🔴' if sev == 'HIGH' else '🟡'
                  print(f\"  {icon} [{sev}/{conf}] {issue.get('test_id','?')}: {issue.get('issue_text','?')}\")
                  print(f\"     {issue.get('filename','?')}:{issue.get('line_number','?')}\")
          except Exception as e: print(f'  Parse error: {e}')" 2>/dev/null
          else
            echo "  ✅ No security issues found!"
          fi

          # Generate SARIF
          bandit \
            --recursive \
            --format sarif \
            --exclude "./.git,./node_modules,./.venv,./venv" \
            --output bandit.sarif \
            . 2>/dev/null || true

          passed="true"
          [[ ${high_count} -gt 0 ]] && passed="false"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  🔴 HIGH severity:    %-36s║\n" "${high_count}"
          printf "║  🟡 MEDIUM severity:  %-36s║\n" "${medium_count}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          if [[ "${passed}" == "true" ]]; then
            echo "║  ✅ STATUS: PASSED                                          ║"
          else
            echo "║  ❌ STATUS: FAILED                                          ║"
          fi
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload Bandit SARIF"
        if: always() && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: bandit.sarif
          category: "bandit-python"
        continue-on-error: true

      - name: "🛡️ Run Safety CVE Scan"
        id: safety
        if: inputs.run_safety != 'false'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🛡️  Safety — Dependency CVE Scan                            ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "  Safety version: $(safety --version 2>/dev/null | head -1)"
          echo ""

          safety_exit=0
          safety_output="$(safety check \
            --output json \
            2>/dev/null)" || safety_exit=$?

          vulns="$(echo "${safety_output}" | python3 -c "
          import sys, json
          try:
              r = json.loads(sys.stdin.read())
              vulns = r.get('vulnerabilities', r) if isinstance(r, dict) else r
              if isinstance(vulns, list):
                  print(len(vulns))
              else:
                  print(0)
          except: print(0)" 2>/dev/null || echo 0)"

          if [[ ${vulns} -gt 0 ]]; then
            echo "  ⚠️  ${vulns} CVE vulnerabilities found in dependencies"
            echo "${safety_output}" | python3 -c "
          import sys, json
          try:
              r = json.loads(sys.stdin.read())
              vulns = r.get('vulnerabilities', r) if isinstance(r, dict) else r
              if isinstance(vulns, list):
                  for v in vulns[:10]:
                      if isinstance(v, dict):
                          print(f\"  🔴 {v.get('package_name','?')} {v.get('vulnerable_spec','')} — CVE: {v.get('advisory','?')[:80]}\")
          except: pass" 2>/dev/null
          else
            echo "  ✅ No known CVE vulnerabilities in dependencies!"
          fi

          passed="true"
          [[ ${safety_exit} -ne 0 && ${vulns} -gt 0 ]] && passed="false"

          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload Security Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "python-security-results"
          path: |
            bandit-results.json
            bandit.sarif
          retention-days: 30
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 07: METRICS — Code quality metrics
  # ────────────────────────────────────────────────────────────────────────────
  metrics:
    name: "📊 Code Quality Metrics"
    needs: [discover, setup]
    if: needs.discover.outputs.has-python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install Metrics Tools"
        shell: bash
        run: |
          pip install -q "radon==6.0.1" "vulture==2.13" 2>/dev/null

      - name: "📊 Run Radon Complexity Analysis"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📊 Radon — Cyclomatic Complexity Analysis                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "  📈 Cyclomatic Complexity (grade C+ flagged):"
          radon cc \
            --average \
            --show-complexity \
            --min=C \
            --exclude "**/migrations/**,**/.venv/**" \
            . 2>/dev/null | head -30 || echo "  (no complex functions found)"

          echo ""
          echo "  📊 Maintainability Index (grade B- flagged):"
          radon mi \
            --show \
            --min=B \
            --exclude "**/migrations/**" \
            . 2>/dev/null | head -20 || echo "  (all files have acceptable MI)"

          echo ""
          echo "  📋 Raw Metrics Summary:"
          radon raw \
            --summary \
            --exclude "**/migrations/**,**/.venv/**" \
            . 2>/dev/null | tail -10 || echo "  (could not compute raw metrics)"

          echo ""
          echo "  📊 Halstead Metrics:"
          radon hal \
            . 2>/dev/null | head -30 || echo "  (could not compute Halstead metrics)"

      - name: "🦅 Run Vulture Dead Code Detection"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🦅 Vulture — Dead Code Detection                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          mapfile -t py_files < <(
            find . -name "*.py" ! -path "./.git/*" ! -path "./node_modules/*" \
              ! -path "*/__pycache__/*" ! -path "*/.venv/*" \
              ! -path "*/migrations/*"
          )

          if [[ ${#py_files[@]} -gt 0 ]]; then
            vulture_output="$(vulture \
              --min-confidence 80 \
              --sort-by-size \
              "${py_files[@]}" 2>/dev/null)"

            if [[ -n "${vulture_output}" ]]; then
              dead_count="$(echo "${vulture_output}" | wc -l)"
              echo "  ⚠️  ${dead_count} potentially dead code items (≥80% confidence):"
              echo "${vulture_output}" | head -20 | while IFS= read -r line; do
                echo "     🦅 ${line}"
              done
            else
              echo "  ✅ No dead code detected at ≥80% confidence!"
            fi
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 08: REPORT & GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — Python"
    needs: [discover, pylint, ruff, mypy, security]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "💬 Post PR Comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const score         = '${{ needs.pylint.outputs.score || "0.0" }}';
            const minScore      = '${{ env.MIN_PYLINT_SCORE }}';
            const pylintErrors  = parseInt('${{ needs.pylint.outputs.errors || 0 }}');
            const pylintPassed  = '${{ needs.pylint.outputs.passed }}' === 'true';
            const ruffErrors    = parseInt('${{ needs.ruff.outputs.errors || 0 }}');
            const ruffPassed    = '${{ needs.ruff.outputs.passed || "true" }}' === 'true';
            const mypyErrors    = parseInt('${{ needs.mypy.outputs.errors || 0 }}');
            const mypyPassed    = '${{ needs.mypy.outputs.passed || "true" }}' === 'true';
            const banditPassed  = '${{ needs.security.outputs.bandit-passed || "true" }}' === 'true';
            const safetyPassed  = '${{ needs.security.outputs.safety-passed || "true" }}' === 'true';
            const pyCount       = '${{ needs.discover.outputs.py-count }}';
            const hasApi        = '${{ needs.discover.outputs.has-api }}' === 'true';

            const overallPassed = pylintPassed && ruffPassed && mypyPassed && banditPassed;
            const icon          = overallPassed ? '✅' : '❌';
            const status        = overallPassed ? 'PASSED' : 'FAILED';

            const scoreFloat    = parseFloat(score);
            const minFloat      = parseFloat(minScore);
            const filled        = Math.round(scoreFloat);
            const scoreBar      = '█'.repeat(filled) + '░'.repeat(10 - filled);

            const body = `## 🐍 Python Analysis ${icon}

            **Status: ${status}** | Analyzed **${pyCount}** Python files

            ### 📊 Pylint Score
            \`${scoreBar}\` **${score}/10** (minimum: ${minScore}/10) ${scoreFloat >= minFloat ? '✅' : '❌'}

            ### 🛠️ Tool Results

            | Tool | Issues | Status |
            |------|--------|--------|
            | 🐍 Pylint | \`${pylintErrors}\` errors | ${pylintPassed ? '✅' : '❌'} |
            | ⚡ Ruff | \`${ruffErrors}\` issues | ${ruffPassed ? '✅' : '❌'} |
            | 📐 mypy | \`${mypyErrors}\` type errors | ${mypyPassed ? '✅' : '❌'} |
            | 🔒 Bandit | Security scan | ${banditPassed ? '✅' : '❌'} |
            | 🛡️ Safety | CVE scan | ${safetyPassed ? '✅' : '⚠️'} |
            | 🎨 Black | Formatting | Checked |
            | 📦 isort | Import order | Checked |
            | 📊 Radon | Complexity | Analyzed |
            | 🦅 Vulture | Dead code | Analyzed |

            ${hasApi ? `\n> 🌐 **API Server detected** — FastAPI/Pydantic validation included\n` : ''}

            ${overallPassed
              ? '### ✨ All Python quality checks pass!'
              : `### 🔧 Fix Required

            \`\`\`bash
            # Format code
            black . && isort .

            # Fix Ruff issues
            ruff check --fix .

            # Run Pylint
            pylint **/*.py

            # Type check
            mypy .

            # Security scan
            bandit -r .
            \`\`\``
            }

            ---
            *🤖 Pylint v${{ env.PYLINT_VERSION }} • Ruff v${{ env.RUFF_VERSION }} • mypy v${{ env.MYPY_VERSION }} • [Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🐍 Python Analysis')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: "🚦 Evaluate Quality Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 Python Quality Gate                                     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          score="${{ needs.pylint.outputs.score || '10.0' }}"
          min_score="${{ env.MIN_PYLINT_SCORE }}"
          pylint_passed="${{ needs.pylint.outputs.passed || 'true' }}"
          ruff_passed="${{ needs.ruff.outputs.passed || 'true' }}"
          mypy_passed="${{ needs.mypy.outputs.passed || 'true' }}"
          bandit_passed="${{ needs.security.outputs.bandit-passed || 'true' }}"

          echo ""
          echo "  📊 Final Gate Summary:"
          echo "  ├── Pylint score: ${score}/10 (min: ${min_score}/10)"
          echo "  ├── Pylint:       ${pylint_passed}"
          echo "  ├── Ruff:         ${ruff_passed}"
          echo "  ├── mypy:         ${mypy_passed}"
          echo "  └── Bandit:       ${bandit_passed}"
          echo ""

          has_python="${{ needs.discover.outputs.has-python }}"
          if [[ "${has_python}" == "false" ]]; then
            echo "  ℹ️  No Python files — gate skipped"
            exit 0
          fi

          all_passed="true"
          [[ "${pylint_passed}" != "true" ]] && all_passed="false"
          [[ "${bandit_passed}" != "true" ]] && all_passed="false"

          if [[ "${all_passed}" == "true" ]]; then
            echo "  ✅ QUALITY GATE: PASSED"
            echo "  🎉 Python code meets all quality standards!"
          else
            echo "  ❌ QUALITY GATE: FAILED"
            [[ "${pylint_passed}" != "true" ]] && \
              echo "  → Fix Pylint: score ${score}/10 below minimum ${min_score}/10 or has errors"
            [[ "${bandit_passed}" != "true" ]] && \
              echo "  → Fix Security: bandit found HIGH severity issues"
            exit 1
          fi