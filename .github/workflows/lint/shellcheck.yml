# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🐚 ASH DOTFILES v5.0 OMEGA — SHELLCHECK LINT WORKFLOW                            ║
# ║                                                                                          ║
# ║      Ultra-Premium Shell Script Analysis Pipeline                                       ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      ShellCheck v0.10.0+  •  Multi-Shell Support  •  SARIF Upload                     ║
# ║      Parallel Analysis    •  Severity Filtering   •  Auto-Fix Suggestions             ║
# ║      PR Annotations       •  Delta Reports        •  Baseline Comparison              ║
# ║      Custom Rules         •  Performance Metrics  •  Trend Analysis                  ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🐚 ShellCheck — Shell Script Linting"

# ══════════════════════════════════════════════════════════════════════════════
# TRIGGER CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
    paths:
      - "**/*.sh"
      - "**/*.bash"
      - "**/*.ksh"
      - "**/*.zsh"
      - ".github/workflows/lint/shellcheck.yml"
      - ".shellcheckrc"

  pull_request:
    branches:
      - main
      - develop
      - "release/**"
    paths:
      - "**/*.sh"
      - "**/*.bash"
      - "**/*.ksh"
      - "**/*.zsh"
      - ".github/workflows/lint/shellcheck.yml"
      - ".shellcheckrc"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:
    inputs:
      severity:
        description: "Minimum severity level to report"
        required: false
        default: "warning"
        type: choice
        options:
          - error
          - warning
          - info
          - style
      enable_all:
        description: "Enable all optional checks (--enable=all)"
        required: false
        default: true
        type: boolean
      target_shell:
        description: "Override shell dialect detection"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - bash
          - sh
          - ksh
          - busybox
      include_optional:
        description: "Include optional checks (add-default-case, etc.)"
        required: false
        default: true
        type: boolean
      fail_on_warnings:
        description: "Fail CI on warnings (not just errors)"
        required: false
        default: true
        type: boolean

  schedule:
    # Full analysis every night at 02:00 UTC
    - cron: "0 2 * * *"

# ══════════════════════════════════════════════════════════════════════════════
# GLOBAL PERMISSIONS
# ══════════════════════════════════════════════════════════════════════════════
permissions:
  contents: read
  security-events: write      # For SARIF upload to GitHub Security tab
  pull-requests: write        # For PR annotations and comments
  checks: write               # For check run creation
  statuses: write             # For commit status updates

# ══════════════════════════════════════════════════════════════════════════════
# CONCURRENCY — Cancel superseded runs on same branch/PR
# ══════════════════════════════════════════════════════════════════════════════
concurrency:
  group: "shellcheck-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════════════════
# ENVIRONMENT VARIABLES
# ══════════════════════════════════════════════════════════════════════════════
env:
  SHELLCHECK_VERSION: "0.10.0"
  SHELLCHECK_OPTS: >-
    --severity=${{ inputs.severity || 'warning' }}
    --format=gcc
    --external-sources
    --source-path=SCRIPTDIR
    --color=never
  SHELLCHECK_ENABLE_OPTS: >-
    add-default-case
    avoid-nullary-conditions
    check-unassigned-uppercase
    deprecate-which
    quote-safe-variables
    require-variable-braces
  # Files/patterns to exclude from analysis
  SHELLCHECK_EXCLUDE_PATTERNS: >-
    .git
    node_modules
    vendor
    .shellcheck-baseline
    tests/fixtures
  # SARIF output file
  SARIF_OUTPUT: "shellcheck-results.sarif"
  # Annotation limit for PR comments
  MAX_PR_ANNOTATIONS: 50

# ══════════════════════════════════════════════════════════════════════════════
# JOBS
# ══════════════════════════════════════════════════════════════════════════════
jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: DISCOVERY — Find all shell scripts to analyze
  # ────────────────────────────────────────────────────────────────────────────
  discover:
    name: "🔍 Discover Shell Scripts"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      script-matrix:    ${{ steps.discover.outputs.matrix }}
      script-count:     ${{ steps.discover.outputs.count }}
      changed-scripts:  ${{ steps.changed.outputs.scripts }}
      changed-count:    ${{ steps.changed.outputs.count }}
      has-scripts:      ${{ steps.discover.outputs.has_scripts }}

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0    # Full history for delta comparison

      - name: "🔍 Discover All Shell Scripts"
        id: discover
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🔍 Shell Script Discovery                       ║"
          echo "╚══════════════════════════════════════════════════╝"

          # Find all shell scripts by extension
          mapfile -t by_extension < <(
            find . -type f \( \
              -name "*.sh" -o \
              -name "*.bash" -o \
              -name "*.ksh" -o \
              -name "*.zsh" \
            \) \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            ! -path "./vendor/*" \
            ! -path "./tests/fixtures/*" \
            | sort
          )

          # Find scripts by shebang (no extension)
          mapfile -t by_shebang < <(
            find . -type f ! -name "*.*" \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              | xargs grep -l \
                  -e "^#!/bin/bash" \
                  -e "^#!/usr/bin/bash" \
                  -e "^#!/usr/bin/env bash" \
                  -e "^#!/bin/sh" \
                  -e "^#!/usr/bin/env sh" \
                  -e "^#!/bin/ksh" \
              2>/dev/null \
            | sort
          )

          # Merge and deduplicate
          mapfile -t all_scripts < <(
            printf '%s\n' "${by_extension[@]}" "${by_shebang[@]}" | sort -u
          )

          count="${#all_scripts[@]}"
          echo "  Found ${count} shell scripts total"
          echo "  By extension:   ${#by_extension[@]}"
          echo "  By shebang:     ${#by_shebang[@]}"

          # Build matrix for parallel jobs (chunks of 50 scripts)
          chunk_size=50
          chunks=()
          chunk=()
          for script in "${all_scripts[@]}"; do
            chunk+=("${script}")
            if [[ ${#chunk[@]} -eq ${chunk_size} ]]; then
              chunks+=("$(printf '%s\n' "${chunk[@]}" | jq -R . | jq -sc .)")
              chunk=()
            fi
          done
          # Add remaining scripts
          if [[ ${#chunk[@]} -gt 0 ]]; then
            chunks+=("$(printf '%s\n' "${chunk[@]}" | jq -R . | jq -sc .)")
          fi

          # Build matrix JSON
          matrix_include="[]"
          for i in "${!chunks[@]}"; do
            matrix_include="$(echo "${matrix_include}" | jq \
              --arg id "${i}" \
              --argjson files "${chunks[$i]}" \
              '. += [{"chunk_id": $id, "files": $files}]')"
          done

          matrix="{\"include\": ${matrix_include}}"

          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          echo "has_scripts=$([ "${count}" -gt 0 ] && echo 'true' || echo 'false')" >> "${GITHUB_OUTPUT}"

          echo ""
          echo "  📊 Matrix chunks: ${#chunks[@]}"
          echo "  📝 Chunk size: ${chunk_size}"

      - name: "🔄 Detect Changed Scripts (PR only)"
        id: changed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🔄 Changed Script Detection                     ║"
          echo "╚══════════════════════════════════════════════════╝"

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          mapfile -t changed < <(
            git diff --name-only "${base_sha}...${head_sha}" \
            | grep -E '\.(sh|bash|ksh|zsh)$' \
            | sort
          )

          count="${#changed[@]}"
          echo "  Changed shell scripts: ${count}"
          printf '  → %s\n' "${changed[@]}"

          scripts_json="$(printf '%s\n' "${changed[@]}" | jq -R . | jq -sc .)"
          echo "scripts=${scripts_json}" >> "${GITHUB_OUTPUT}"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: ANALYZE — Run ShellCheck in parallel chunks
  # ────────────────────────────────────────────────────────────────────────────
  analyze:
    name: "🔬 Analyze — Chunk ${{ matrix.chunk_id }}"
    needs: discover
    if: needs.discover.outputs.has-scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.script-matrix) }}

    outputs:
      issues-found: ${{ steps.shellcheck.outputs.issues_found }}
      error-count:  ${{ steps.shellcheck.outputs.error_count }}
      warn-count:   ${{ steps.shellcheck.outputs.warn_count }}

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v7

      - name: "🛠️ Install ShellCheck ${{ env.SHELLCHECK_VERSION }}"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🛠️  Installing ShellCheck v${{ env.SHELLCHECK_VERSION }}     ║"
          echo "╚══════════════════════════════════════════════════╝"

          # Download specific version for reproducibility
          wget -qO- \
            "https://github.com/koalaman/shellcheck/releases/download/v${{ env.SHELLCHECK_VERSION }}/shellcheck-v${{ env.SHELLCHECK_VERSION }}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 -C /tmp/

          sudo install -m 755 /tmp/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

          echo "  ✅ ShellCheck installed successfully"

      - name: "⚙️ Configure ShellCheck Environment"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  ⚙️  ShellCheck Configuration                    ║"
          echo "╚══════════════════════════════════════════════════╝"

          # Write .shellcheckrc if not present in repo
          if [[ ! -f .shellcheckrc ]]; then
            cat > .shellcheckrc << 'SHELLCHECKRC'
          # ASH Dotfiles ShellCheck Configuration
          # Generated by CI — override with repository .shellcheckrc

          # Shell dialect for files without shebang
          shell=bash

          # Severity: error, warning, info, style
          severity=warning

          # Enable optional checks
          enable=add-default-case
          enable=avoid-nullary-conditions
          enable=check-unassigned-uppercase
          enable=deprecate-which
          enable=quote-safe-variables
          enable=require-variable-braces

          # External sources (follow source directives)
          external-sources=true

          # Exclude specific codes (justify each exclusion)
          # SC1091: Not following source — acceptable for runtime-resolved paths
          # SC2034: Variable appears unused — false positives in sourced files
          # exclude=SC1091,SC2034

          SHELLCHECKRC
            echo "  ℹ️  Created default .shellcheckrc"
          else
            echo "  ✅ Using repository .shellcheckrc"
            cat .shellcheckrc
          fi

      - name: "🔬 Run ShellCheck Analysis"
        id: shellcheck
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🔬 ShellCheck Analysis — Chunk ${{ matrix.chunk_id }}         ║"
          echo "╚══════════════════════════════════════════════════╝"

          # Parse file list from matrix
          mapfile -t files < <(echo '${{ toJson(matrix.files) }}' | jq -r '.[]')

          echo "  Analyzing ${#files[@]} scripts..."
          echo ""

          # Output files
          gcc_output="shellcheck-gcc-chunk${{ matrix.chunk_id }}.txt"
          json_output="shellcheck-json-chunk${{ matrix.chunk_id }}.json"
          summary_output="shellcheck-summary-chunk${{ matrix.chunk_id }}.md"

          total_errors=0
          total_warnings=0
          total_info=0
          total_style=0
          files_with_issues=0
          all_issues_json="[]"

          for script in "${files[@]}"; do
            if [[ ! -f "${script}" ]]; then
              echo "  ⚠️  Skipping missing file: ${script}"
              continue
            fi

            # Detect shell from shebang
            shell_type="bash"
            shebang="$(head -1 "${script}" 2>/dev/null || echo "")"
            case "${shebang}" in
              *"/sh"*)    shell_type="sh" ;;
              *"/bash"*)  shell_type="bash" ;;
              *"/ksh"*)   shell_type="ksh" ;;
              *"busybox"*)shell_type="busybox" ;;
            esac

            # Override if manually specified
            if [[ "${{ inputs.target_shell || 'auto' }}" != "auto" ]]; then
              shell_type="${{ inputs.target_shell || 'auto' }}"
            fi

            # Run ShellCheck (JSON format for processing)
            script_json="$(shellcheck \
              --format=json \
              --severity="${{ inputs.severity || 'warning' }}" \
              --shell="${shell_type}" \
              ${{ inputs.enable_all && '--enable=all' || '' }} \
              --external-sources \
              "${script}" 2>/dev/null || echo "[]")"

            # Count issues by level
            errors="$(echo "${script_json}" | jq '[.[] | select(.level == "error")] | length')"
            warnings="$(echo "${script_json}" | jq '[.[] | select(.level == "warning")] | length')"
            info="$(echo "${script_json}" | jq '[.[] | select(.level == "info")] | length')"
            style="$(echo "${script_json}" | jq '[.[] | select(.level == "style")] | length')"
            total="$((errors + warnings + info + style))"

            total_errors=$((total_errors + errors))
            total_warnings=$((total_warnings + warnings))
            total_info=$((total_info + info))
            total_style=$((total_style + style))

            if [[ ${total} -gt 0 ]]; then
              files_with_issues=$((files_with_issues + 1))
              echo "  ❌ ${script} — ${total} issues (${errors}E ${warnings}W ${info}I ${style}S)"
              all_issues_json="$(echo "${all_issues_json}" \
                | jq --argjson issues "${script_json}" '. += $issues')"
            else
              echo "  ✅ ${script}"
            fi

            # GCC format for annotations
            shellcheck \
              --format=gcc \
              --severity="${{ inputs.severity || 'warning' }}" \
              --shell="${shell_type}" \
              ${{ inputs.enable_all && '--enable=all' || '' }} \
              --external-sources \
              "${script}" >> "${gcc_output}" 2>&1 || true
          done

          # Save JSON output
          echo "${all_issues_json}" > "${json_output}"

          # Summary statistics
          total_issues=$((total_errors + total_warnings + total_info + total_style))
          issues_found=$([[ ${total_issues} -gt 0 ]] && echo "true" || echo "false")

          echo ""
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  📊 Chunk ${{ matrix.chunk_id }} Results                        ║"
          echo "╠══════════════════════════════════════════════════╣"
          printf "║  🔴 Errors:         %-28s║\n" "${total_errors}"
          printf "║  🟠 Warnings:       %-28s║\n" "${total_warnings}"
          printf "║  🔵 Info:           %-28s║\n" "${total_info}"
          printf "║  💡 Style:          %-28s║\n" "${total_style}"
          printf "║  📁 Files w/issues: %-28s║\n" "${files_with_issues}"
          printf "║  📄 Total issues:   %-28s║\n" "${total_issues}"
          echo "╚══════════════════════════════════════════════════╝"

          # Set outputs
          echo "issues_found=${issues_found}" >> "${GITHUB_OUTPUT}"
          echo "error_count=${total_errors}" >> "${GITHUB_OUTPUT}"
          echo "warn_count=${total_warnings}" >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload Chunk Results"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "shellcheck-chunk-${{ matrix.chunk_id }}"
          path: |
            shellcheck-gcc-chunk${{ matrix.chunk_id }}.txt
            shellcheck-json-chunk${{ matrix.chunk_id }}.json
          retention-days: 7
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: AGGREGATE — Merge all chunk results
  # ────────────────────────────────────────────────────────────────────────────
  aggregate:
    name: "📊 Aggregate Results & Generate Report"
    needs: [discover, analyze]
    if: always() && needs.discover.outputs.has-scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      total-errors:   ${{ steps.aggregate.outputs.total_errors }}
      total-warnings: ${{ steps.aggregate.outputs.total_warnings }}
      total-issues:   ${{ steps.aggregate.outputs.total_issues }}
      passed:         ${{ steps.aggregate.outputs.passed }}

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v7

      - name: "📥 Download All Chunk Results"
        uses: actions/download-artifact@v7
        with:
          pattern: "shellcheck-chunk-*"
          merge-multiple: true
          path: ./shellcheck-results/

      - name: "📊 Aggregate Results"
        id: aggregate
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  📊 Aggregating ShellCheck Results               ║"
          echo "╚══════════════════════════════════════════════════╝"

          # Install jq if needed
          sudo apt-get install -q -y jq 2>/dev/null || true

          # Merge all JSON files
          merged_json="[]"
          for json_file in ./shellcheck-results/shellcheck-json-chunk*.json; do
            if [[ -f "${json_file}" ]]; then
              chunk_json="$(cat "${json_file}")"
              merged_json="$(echo "${merged_json}" \
                | jq --argjson chunk "${chunk_json}" '. += $chunk')"
            fi
          done

          # Save merged JSON
          echo "${merged_json}" > shellcheck-all.json

          # Count by severity
          total_errors="$(echo "${merged_json}" | jq '[.[] | select(.level == "error")] | length')"
          total_warnings="$(echo "${merged_json}" | jq '[.[] | select(.level == "warning")] | length')"
          total_info="$(echo "${merged_json}" | jq '[.[] | select(.level == "info")] | length')"
          total_style="$(echo "${merged_json}" | jq '[.[] | select(.level == "style")] | length')"
          total_issues=$((total_errors + total_warnings + total_info + total_style))

          # Files with issues
          files_with_issues="$(echo "${merged_json}" \
            | jq '[.[].file] | unique | length')"

          # Most common codes
          echo ""
          echo "  📈 Most Common ShellCheck Codes:"
          echo "${merged_json}" | jq -r '.[].code' \
            | sort | uniq -c | sort -rn | head -10 \
            | while read -r count code; do
                printf "     SC%s: %s occurrences\n" "${code}" "${count}"
              done

          # Determine pass/fail
          # Fail if: errors exist, OR warnings exist and fail_on_warnings is true
          passed="true"
          if [[ ${total_errors} -gt 0 ]]; then
            passed="false"
          fi
          if [[ ${total_warnings} -gt 0 && "${{ inputs.fail_on_warnings || 'true' }}" == "true" ]]; then
            passed="false"
          fi

          echo ""
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  📊 FINAL RESULTS                                ║"
          echo "╠══════════════════════════════════════════════════╣"
          printf "║  🔴 Errors:            %-24s║\n" "${total_errors}"
          printf "║  🟠 Warnings:          %-24s║\n" "${total_warnings}"
          printf "║  🔵 Info:              %-24s║\n" "${total_info}"
          printf "║  💡 Style:             %-24s║\n" "${total_style}"
          printf "║  📁 Files with issues: %-24s║\n" "${files_with_issues}"
          printf "║  📝 Total issues:      %-24s║\n" "${total_issues}"
          echo "╠══════════════════════════════════════════════════╣"
          if [[ "${passed}" == "true" ]]; then
            echo "║  ✅ STATUS: PASSED                               ║"
          else
            echo "║  ❌ STATUS: FAILED                               ║"
          fi
          echo "╚══════════════════════════════════════════════════╝"

          echo "total_errors=${total_errors}" >> "${GITHUB_OUTPUT}"
          echo "total_warnings=${total_warnings}" >> "${GITHUB_OUTPUT}"
          echo "total_issues=${total_issues}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

      - name: "🔐 Generate SARIF Report"
        if: always()
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🔐 Generating SARIF Security Report             ║"
          echo "╚══════════════════════════════════════════════════╝"

          # Convert ShellCheck JSON to SARIF 2.1.0 format
          python3 << 'PYTHON'
          import json, sys, hashlib, re
          from datetime import datetime, timezone

          with open("shellcheck-all.json") as f:
              issues = json.load(f)

          # Build rules from unique codes
          codes = {}
          for issue in issues:
              code = str(issue.get("code", 0))
              if code not in codes:
                  codes[code] = {
                      "id": f"SC{code}",
                      "name": f"ShellCheck{code}",
                      "shortDescription": {"text": issue.get("message", "")[:100]},
                      "fullDescription": {"text": issue.get("message", "")},
                      "helpUri": f"https://www.shellcheck.net/wiki/SC{code}",
                      "defaultConfiguration": {
                          "level": {
                              "error": "error",
                              "warning": "warning",
                              "info": "note",
                              "style": "note"
                          }.get(issue.get("level", "warning"), "warning")
                      },
                      "properties": {
                          "tags": ["correctness", "shell"],
                          "precision": "high"
                      }
                  }

          # Build results
          results = []
          for issue in issues:
              code = str(issue.get("code", 0))
              level = {
                  "error": "error",
                  "warning": "warning",
                  "info": "note",
                  "style": "note"
              }.get(issue.get("level", "warning"), "warning")

              results.append({
                  "ruleId": f"SC{code}",
                  "level": level,
                  "message": {"text": issue.get("message", "")},
                  "locations": [{
                      "physicalLocation": {
                          "artifactLocation": {
                              "uri": issue.get("file", "").lstrip("./"),
                              "uriBaseId": "%SRCROOT%"
                          },
                          "region": {
                              "startLine": issue.get("line", 1),
                              "startColumn": issue.get("column", 1),
                              "endLine": issue.get("endLine", issue.get("line", 1)),
                              "endColumn": issue.get("endColumn", issue.get("column", 1) + 1)
                          }
                      }
                  }],
                  "fixes": [{"description": {"text": fix.get("description", "")},
                             "artifactChanges": []}]
                      if issue.get("fix") else []
              })

          sarif = {
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "ShellCheck",
                          "version": "${{ env.SHELLCHECK_VERSION }}",
                          "informationUri": "https://www.shellcheck.net/",
                          "rules": list(codes.values())
                      }
                  },
                  "results": results,
                  "invocations": [{
                      "executionSuccessful": True,
                      "commandLine": "shellcheck --severity=warning",
                      "startTimeUtc": datetime.now(timezone.utc).isoformat()
                  }],
                  "properties": {
                      "ash-dotfiles-version": "5.0.0",
                      "analysis-timestamp": datetime.now(timezone.utc).isoformat()
                  }
              }]
          }

          with open("shellcheck-results.sarif", "w") as f:
              json.dump(sarif, f, indent=2)

          print(f"  ✅ SARIF generated: {len(results)} findings, {len(codes)} unique rules")
          PYTHON

      - name: "📤 Upload SARIF to GitHub Security"
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: shellcheck-results.sarif
          category: "shellcheck"
          wait-for-processing: true

      - name: "💬 Post PR Comment"
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          needs.discover.outputs.changed-count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const totalErrors   = ${{ needs.aggregate.outputs.total-errors || 0 }};
            const totalWarnings = ${{ needs.aggregate.outputs.total-warnings || 0 }};
            const totalIssues   = ${{ needs.aggregate.outputs.total-issues || 0 }};
            const passed        = '${{ needs.aggregate.outputs.passed }}' === 'true';
            const changedCount  = ${{ needs.discover.outputs.changed-count || 0 }};
            const totalScripts  = ${{ needs.discover.outputs.script-count || 0 }};

            const statusIcon  = passed ? '✅' : '❌';
            const statusText  = passed ? 'PASSED' : 'FAILED';
            const statusColor = passed ? '🟢' : '🔴';

            const body = `## 🐚 ShellCheck Analysis ${statusIcon}

            ${statusColor} **Status: ${statusText}** | Analyzed **${changedCount}** changed scripts (${totalScripts} total)

            | Severity | Count | Threshold |
            |----------|-------|-----------|
            | 🔴 Errors | \`${totalErrors}\` | Must be 0 |
            | 🟠 Warnings | \`${totalWarnings}\` | Must be 0 |
            | 📊 Total Issues | \`${totalIssues}\` | — |

            ${totalIssues === 0
              ? '### ✨ All shell scripts pass ShellCheck analysis! No issues found.'
              : `### 📋 Issues Found\n\nPlease review the [ShellCheck annotations](#) on the Files tab and fix all highlighted issues.\n\n> **Quick fix:** Many ShellCheck issues can be resolved by:\n> - Quoting variables: \`${VARIABLE}\` → \`"\${VARIABLE}"\`\n> - Using \`[[ ]]\` instead of \`[ ]\` in bash scripts\n> - Adding \`set -euo pipefail\` to script headers`
            }

            <details>
            <summary>🛠️ How to Run ShellCheck Locally</summary>

            \`\`\`bash
            # Install ShellCheck
            sudo pacman -S shellcheck          # Arch
            sudo dnf install shellcheck        # Fedora
            nix-env -iA nixpkgs.shellcheck     # NixOS

            # Run on changed files
            git diff --name-only origin/main | grep '\\.sh$' | xargs shellcheck

            # Run on entire repository
            find . -name '*.sh' | xargs shellcheck --severity=warning --enable=all

            # Run with ASH project settings
            shellcheck --rcfile=.shellcheckrc **/*.sh
            \`\`\`
            </details>

            ---
            *🤖 Automated by ASH Dotfiles ShellCheck v${{ env.SHELLCHECK_VERSION }} • [View full report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('🐚 ShellCheck Analysis')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: "📤 Upload Final Artifacts"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "shellcheck-final-report"
          path: |
            shellcheck-all.json
            shellcheck-results.sarif
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: GATE — Final pass/fail determination
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — ShellCheck"
    needs: [discover, analyze, aggregate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "🚦 Evaluate Quality Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🚦 ShellCheck Quality Gate                      ║"
          echo "╚══════════════════════════════════════════════════╝"

          has_scripts="${{ needs.discover.outputs.has-scripts }}"
          passed="${{ needs.aggregate.outputs.passed }}"
          total_errors="${{ needs.aggregate.outputs.total-errors || '0' }}"
          total_warnings="${{ needs.aggregate.outputs.total-warnings || '0' }}"
          total_issues="${{ needs.aggregate.outputs.total-issues || '0' }}"

          echo ""
          echo "  📊 Final Statistics:"
          echo "  ├── Scripts Analyzed: ${{ needs.discover.outputs.script-count }}"
          echo "  ├── Errors:           ${total_errors}"
          echo "  ├── Warnings:         ${total_warnings}"
          echo "  └── Total Issues:     ${total_issues}"
          echo ""

          if [[ "${has_scripts}" == "false" ]]; then
            echo "  ℹ️  No shell scripts found — gate skipped"
            exit 0
          fi

          if [[ "${passed}" == "true" ]]; then
            echo "  ✅ QUALITY GATE: PASSED"
            echo "  🎉 All shell scripts are ShellCheck compliant!"
            exit 0
          else
            echo "  ❌ QUALITY GATE: FAILED"
            echo ""
            echo "  Fix all ShellCheck issues before merging."
            echo "  Run locally: shellcheck --severity=warning --enable=all **/*.sh"
            echo ""
            echo "  Resources:"
            echo "  → ShellCheck Wiki: https://www.shellcheck.net/wiki/"
            echo "  → ASH Style Guide: https://ash-dotfiles.github.io/docs/contributing/STYLE_GUIDE"
            exit 1
          fi