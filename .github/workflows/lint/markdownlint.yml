# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      📝 ASH DOTFILES v5.0 OMEGA — MARKDOWNLINT WORKFLOW                               ║
# ║                                                                                          ║
# ║      Ultra-Premium Markdown Documentation Analysis Pipeline                             ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      markdownlint-cli2 v0.12+ •  Link Checking   •  Spell Checking                    ║
# ║      Prose Analysis          •  Vale Integration  •  Readability Scores               ║
# ║      Table Validation        •  Code Block Audit  •  Front Matter Check               ║
# ║      Image Alt Text          •  TOC Generation    •  Dead Link Detection              ║
# ║      SARIF Upload            •  PR Annotations    •  Auto-Fix Mode                   ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "📝 Markdownlint — Documentation Analysis"

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - ".markdownlint*"
      - ".vale.ini"
      - ".github/workflows/lint/markdownlint.yml"

  pull_request:
    branches: [main, develop, "release/**"]
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - ".markdownlint*"
      - ".github/workflows/lint/markdownlint.yml"
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      check_links:
        description: "Check for broken links (slower)"
        required: false
        default: true
        type: boolean
      check_spelling:
        description: "Run spell checking"
        required: false
        default: true
        type: boolean
      check_prose:
        description: "Run Vale prose analysis"
        required: false
        default: false
        type: boolean
      fix_mode:
        description: "Apply auto-fixes (report only)"
        required: false
        default: false
        type: boolean
      severity:
        description: "Minimum severity"
        required: false
        default: "warning"
        type: choice
        options: [error, warning]

  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: "markdownlint-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  MARKDOWNLINT_VERSION: "0.12.1"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: DISCOVER
  # ────────────────────────────────────────────────────────────────────────────
  discover:
    name: "🔍 Discover Markdown Files"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      md-files:      ${{ steps.discover.outputs.md_files }}
      total-count:   ${{ steps.discover.outputs.total_count }}
      has-markdown:  ${{ steps.discover.outputs.has_markdown }}
      docs-count:    ${{ steps.discover.outputs.docs_count }}
      readme-count:  ${{ steps.discover.outputs.readme_count }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔍 Discover Markdown Files"
        id: discover
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  📝 Markdown File Discovery                      ║"
          echo "╚══════════════════════════════════════════════════╝"

          # All markdown files
          mapfile -t md_files < <(
            find . -type f \( -name "*.md" -o -name "*.mdx" \) \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              ! -path "./.pnpm-store/*" \
              | sort
          )

          # Docs directory
          mapfile -t docs_files < <(
            find ./docs -type f -name "*.md" 2>/dev/null | sort
          )

          # README files
          mapfile -t readme_files < <(
            find . -maxdepth 3 -name "README.md" \
              ! -path "./.git/*" ! -path "./node_modules/*" | sort
          )

          total="${#md_files[@]}"

          echo ""
          echo "  📊 Markdown Inventory:"
          echo "  ├── Total MD files:   ${total}"
          echo "  ├── Docs pages:       ${#docs_files[@]}"
          echo "  ├── README files:     ${#readme_files[@]}"
          echo "  ├── Changelogs:       $(find . -name "CHANGELOG*.md" ! -path "./.git/*" | wc -l)"
          echo "  ├── Contributing:     $(find . -name "CONTRIBUTING.md" ! -path "./.git/*" | wc -l)"
          echo "  ├── PR templates:     $(find .github/PULL_REQUEST_TEMPLATE -name "*.md" 2>/dev/null | wc -l)"
          echo "  └── Issue templates:  $(find .github/ISSUE_TEMPLATE -name "*.md" 2>/dev/null | wc -l)"

          md_json="$(printf '%s\n' "${md_files[@]}" | jq -R . | jq -sc . 2>/dev/null || echo '[]')"
          echo "md_files=${md_json}"                  >> "${GITHUB_OUTPUT}"
          echo "total_count=${total}"                  >> "${GITHUB_OUTPUT}"
          echo "docs_count=${#docs_files[@]}"          >> "${GITHUB_OUTPUT}"
          echo "readme_count=${#readme_files[@]}"      >> "${GITHUB_OUTPUT}"
          echo "has_markdown=$([ "${total}" -gt 0 ] && echo 'true' || echo 'false')" \
            >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: LINT — Run markdownlint-cli2
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: "🔬 Markdownlint Analysis"
    needs: discover
    if: needs.discover.outputs.has-markdown == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      errors:   ${{ steps.lint.outputs.errors }}
      warnings: ${{ steps.lint.outputs.warnings }}
      passed:   ${{ steps.lint.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "🛠️ Install markdownlint-cli2"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🛠️  Installing Markdown Analysis Tools           ║"
          echo "╚══════════════════════════════════════════════════╝"

          npm install -g \
            "markdownlint-cli2@${{ env.MARKDOWNLINT_VERSION }}" \
            markdownlint-cli2-formatter-sarif \
            markdownlint-rule-helpers \
            2>/dev/null

          echo "  markdownlint-cli2: $(markdownlint-cli2 --version)"
          echo "  ✅ Tools installed"

      - name: "⚙️ Configure markdownlint"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  ⚙️  Markdownlint Configuration                   ║"
          echo "╚══════════════════════════════════════════════════╝"

          if [[ -f .markdownlint.json ]] || [[ -f .markdownlint.yml ]] || \
             [[ -f .markdownlint-cli2.jsonc ]]; then
            echo "  ✅ Using repository markdownlint config"
          else
            cat > .markdownlint-cli2.jsonc << 'MDLINTRC'
          {
            // ASH Dotfiles markdownlint-cli2 Configuration
            "config": {
              // MD001 — Heading levels should only increment by one level at a time
              "MD001": true,

              // MD003 — Heading style — ATX style required
              "MD003": { "style": "atx" },

              // MD004 — Unordered list style
              "MD004": { "style": "dash" },

              // MD005 — Inconsistent indentation for list items
              "MD005": true,

              // MD007 — Unordered list indentation
              "MD007": { "indent": 2 },

              // MD009 — Trailing spaces
              "MD009": { "br_spaces": 2, "list_item_empty_lines": false },

              // MD010 — Hard tabs
              "MD010": { "code_blocks": false, "spaces_per_tab": 2 },

              // MD011 — Reversed link syntax
              "MD011": true,

              // MD012 — Multiple consecutive blank lines
              "MD012": { "maximum": 2 },

              // MD013 — Line length (disabled — long lines OK in docs)
              "MD013": {
                "line_length": 160,
                "heading_line_length": 80,
                "code_block_line_length": 160,
                "code_blocks": false,
                "tables": false
              },

              // MD014 — Dollar signs in shell code blocks
              "MD014": false,

              // MD018 — No space after hash on ATX heading
              "MD018": true,

              // MD019 — Multiple spaces after hash on ATX heading
              "MD019": true,

              // MD020 — No space inside hashes on closed ATX heading
              "MD020": true,

              // MD021 — Multiple spaces inside hashes on closed ATX heading
              "MD021": true,

              // MD022 — Headings should be surrounded by blank lines
              "MD022": { "lines_above": 1, "lines_below": 1 },

              // MD023 — Headings must start at the beginning of the line
              "MD023": true,

              // MD024 — Multiple headings with the same content
              "MD024": { "siblings_only": true },

              // MD025 — Multiple top-level headings in the same document
              "MD025": true,

              // MD026 — Trailing punctuation in heading
              "MD026": { "punctuation": ".,;:!。，；：！" },

              // MD027 — Multiple spaces after blockquote symbol
              "MD027": true,

              // MD028 — Blank line inside blockquote
              "MD028": true,

              // MD029 — Ordered list item prefix
              "MD029": { "style": "one_or_ordered" },

              // MD030 — Spaces after list markers
              "MD030": {
                "ul_single": 1,
                "ol_single": 1,
                "ul_multi": 1,
                "ol_multi": 1
              },

              // MD031 — Fenced code blocks should be surrounded by blank lines
              "MD031": { "list_items": false },

              // MD032 — Lists should be surrounded by blank lines
              "MD032": true,

              // MD033 — Inline HTML
              "MD033": {
                "allowed_elements": [
                  "br",
                  "details",
                  "summary",
                  "table",
                  "tr",
                  "th",
                  "td",
                  "img",
                  "div",
                  "sub",
                  "sup",
                  "kbd",
                  "pre",
                  "code",
                  "b",
                  "i",
                  "em",
                  "strong",
                  "picture",
                  "source",
                  "h1",
                  "h2",
                  "h3"
                ]
              },

              // MD034 — Bare URL used
              "MD034": true,

              // MD035 — Horizontal rule style
              "MD035": { "style": "---" },

              // MD036 — Emphasis used instead of a heading
              "MD036": { "punctuation": ".,;:!?。，；：！？" },

              // MD037 — Spaces inside emphasis markers
              "MD037": true,

              // MD038 — Spaces inside code span elements
              "MD038": true,

              // MD039 — Spaces inside link text
              "MD039": true,

              // MD040 — Fenced code blocks should have a language specified
              "MD040": {
                "allowed_languages": [],
                "language_only": false
              },

              // MD041 — First line in file should be a top-level heading
              "MD041": {
                "level": 1,
                "front_matter_title": "^\\s*title\\s*[:=]"
              },

              // MD042 — No empty links
              "MD042": true,

              // MD043 — Required heading structure
              "MD043": false,

              // MD044 — Proper names should have the correct capitalization
              "MD044": {
                "names": [
                  "ASH Dotfiles",
                  "Hyprland",
                  "Neovim",
                  "Wayland",
                  "Waybar",
                  "Fish",
                  "NVIDIA",
                  "AMD",
                  "NixOS",
                  "Arch Linux",
                  "Fedora",
                  "GitHub",
                  "GitLab",
                  "Docker",
                  "Kubernetes",
                  "JavaScript",
                  "TypeScript",
                  "Python",
                  "Rust",
                  "Linux"
                ],
                "code_blocks": false,
                "html_elements": false
              },

              // MD045 — Images should have alternate text
              "MD045": true,

              // MD046 — Code block style
              "MD046": { "style": "fenced" },

              // MD047 — Files should end with a single newline character
              "MD047": true,

              // MD048 — Code fence style
              "MD048": { "style": "backtick" },

              // MD049 — Emphasis style
              "MD049": { "style": "asterisk" },

              // MD050 — Strong style
              "MD050": { "style": "asterisk" },

              // MD051 — Link fragments should be valid
              "MD051": true,

              // MD052 — Reference links and images should use a label that is defined
              "MD052": true,

              // MD053 — Link and image reference definitions should be needed
              "MD053": true
            },

            "globs": [
              "**/*.md",
              "**/*.mdx"
            ],

            "ignores": [
              "node_modules/**",
              ".pnpm-store/**",
              "**/CHANGELOG.md",
              "dist/**",
              "build/**"
            ],

            "fix": false,

            "customRules": [],

            "showFound": false
          }
          MDLINTRC

            echo "  ✅ markdownlint-cli2 config generated"
          fi

      - name: "🔬 Run Markdownlint Analysis"
        id: lint
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  📝 Markdownlint Analysis                        ║"
          echo "╚══════════════════════════════════════════════════╝"

          total_files="${{ needs.discover.outputs.total-count }}"
          echo "  Analyzing ${total_files} Markdown files..."
          echo ""

          # Run markdownlint-cli2 with JSON output
          markdownlint_exit=0
          markdownlint-cli2 \
            "**/*.md" "**/*.mdx" \
            --config .markdownlint-cli2.jsonc \
            2>&1 > markdownlint-output.txt || markdownlint_exit=$?

          # Also run with JSON formatter for processing
          markdownlint-cli2 \
            "**/*.md" "**/*.mdx" \
            --config .markdownlint-cli2.jsonc \
            --formatter sarif \
            2>/dev/null > markdownlint.sarif || true

          # Parse counts
          errors="$(grep -c "error" markdownlint-output.txt 2>/dev/null || echo 0)"
          warnings="$(grep -c "warning" markdownlint-output.txt 2>/dev/null || echo 0)"

          # Extract just the issues
          issue_lines="$(grep -E "^.*\.mdx?:[0-9]+" markdownlint-output.txt 2>/dev/null || true)"
          total_issues="$(echo "${issue_lines}" | grep -c "." 2>/dev/null || echo 0)"

          # Files with issues
          files_with_issues="$(echo "${issue_lines}" | cut -d: -f1 | sort -u | grep -c "." 2>/dev/null || echo 0)"

          if [[ ${total_issues} -gt 0 ]]; then
            echo "  📋 Issues found:"
            echo "${issue_lines}" | head -50 | while IFS= read -r line; do
              echo "  ⚠️  ${line}"
            done
          fi

          # Top violated rules
          echo ""
          echo "  📈 Top violated rules:"
          echo "${issue_lines}" \
            | grep -oE "MD[0-9]+" \
            | sort | uniq -c | sort -rn | head -10 \
            | while read -r count rule; do
                wiki_url="https://github.com/DavidAnson/markdownlint/blob/main/doc/${rule}.md"
                printf "     %-8s %-3s violations → %s\n" "${rule}" "${count}" "${wiki_url}"
              done

          echo ""
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  📊 MARKDOWNLINT RESULTS                         ║"
          echo "╠══════════════════════════════════════════════════╣"
          printf "║  📄 Total files:        %-24s║\n" "${total_files}"
          printf "║  ❌ Files with issues:  %-24s║\n" "${files_with_issues}"
          printf "║  📝 Total issues:       %-24s║\n" "${total_issues}"
          echo "╠══════════════════════════════════════════════════╣"

          passed="true"
          if [[ ${markdownlint_exit} -ne 0 ]]; then
            passed="false"
            echo "║  ❌ STATUS: FAILED                               ║"
          else
            echo "║  ✅ STATUS: PASSED                               ║"
          fi
          echo "╚══════════════════════════════════════════════════╝"

          echo "errors=${total_issues}"   >> "${GITHUB_OUTPUT}"
          echo "warnings=0"               >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"         >> "${GITHUB_OUTPUT}"

      - name: "🔗 Check Markdown Links"
        if: inputs.check_links != 'false'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🔗 Markdown Link Validation                     ║"
          echo "╚══════════════════════════════════════════════════╝"

          # Install lychee for link checking
          wget -qO /tmp/lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            2>/dev/null || {
              echo "  ⚠️  lychee download failed — using fallback link check"
              # Fallback: basic link extraction and check
              broken_links=0
              while IFS= read -r -d '' md_file; do
                while IFS= read -r link; do
                  # Check relative links only
                  if [[ "${link}" =~ ^\.\/ ]] || [[ "${link}" =~ ^\.\.\/ ]]; then
                    if [[ ! -f "${link}" ]] && [[ ! -d "${link}" ]]; then
                      echo "  ❌ Broken relative link in ${md_file}: ${link}"
                      broken_links=$((broken_links + 1))
                    fi
                  fi
                done < <(grep -oE '\[.*?\]\((.*?)\)' "${md_file}" | grep -oE '\(.*?\)' | tr -d '()')
              done < <(find . -name "*.md" ! -path "./.git/*" ! -path "./node_modules/*" -print0)

              echo "  Broken relative links: ${broken_links}"
              exit 0
            }

          tar -xzf /tmp/lychee.tar.gz -C /tmp/ 2>/dev/null
          sudo install -m 755 /tmp/lychee /usr/local/bin/lychee 2>/dev/null || true

          if ! command -v lychee &>/dev/null; then
            echo "  ⚠️  lychee not available — skipping link check"
            exit 0
          fi

          echo "  lychee: $(lychee --version)"
          echo "  Checking links in Markdown files..."

          # Run lychee with sensible defaults
          lychee \
            --no-progress \
            --format compact \
            --timeout 15 \
            --max-retries 2 \
            --exclude "localhost" \
            --exclude "127.0.0.1" \
            --exclude "example.com" \
            --exclude "your-domain.com" \
            --exclude-path node_modules \
            --exclude-path .git \
            --output lychee-report.md \
            "**/*.md" \
            2>/dev/null || link_exit=$?

          if [[ -f lychee-report.md ]]; then
            broken="$(grep -c "ERROR\|FAILED\|404\|Connection" lychee-report.md 2>/dev/null || echo 0)"
            echo "  🔗 Broken links found: ${broken}"
            if [[ ${broken} -gt 0 ]]; then
              echo "  Details:"
              head -30 lychee-report.md | while IFS= read -r line; do
                echo "     ${line}"
              done
            else
              echo "  ✅ All checked links are valid"
            fi
          fi

      - name: "🔤 Spell Check"
        if: inputs.check_spelling != 'false'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🔤 Markdown Spell Check                         ║"
          echo "╚══════════════════════════════════════════════════╝"

          # Install cspell
          npm install -g cspell 2>/dev/null || {
            echo "  ⚠️  cspell unavailable — skipping spell check"
            exit 0
          }

          # Generate cspell config
          cat > .cspell.json << 'CSPELL'
          {
            "version": "0.2",
            "language": "en",
            "dictionaries": ["en_US", "companies", "softwareTerms", "misc"],
            "words": [
              "Hyprland",
              "Waybar",
              "SWWW",
              "swww",
              "rofi",
              "dunst",
              "swaync",
              "hyprlock",
              "hypridle",
              "fastfetch",
              "btop",
              "cava",
              "yazi",
              "wlogout",
              "kvantum",
              "eww",
              "pnpm",
              "luacheck",
              "shellcheck",
              "yamllint",
              "stylelint",
              "markdownlint",
              "Neovim",
              "neovim",
              "luasnip",
              "treesitter",
              "nvim",
              "starship",
              "atuin",
              "zoxide",
              "spicetify",
              "vencord",
              "mangohud",
              "gamemode",
              "gamepad",
              "pipewire",
              "wireplumber",
              "easyeffects",
              "flatpak",
              "appimage",
              "pkgbuild",
              "srcinfo",
              "colorscheme",
              "colorspace",
              "rgba",
              "oklch",
              "matugen",
              "nerdfonts",
              "catppuccin",
              "tokyonight",
              "gruvbox",
              "everforest",
              "kanagawa",
              "solarized",
              "dracula",
              "onedark",
              "rosepine",
              "oxocarbon",
              "melange",
              "vesper"
            ],
            "ignorePaths": [
              "node_modules/**",
              ".git/**",
              "CHANGELOG.md"
            ]
          }
          CSPELL

          echo "  Running cspell on Markdown files..."
          spell_errors=0

          cspell lint \
            --no-progress \
            --config .cspell.json \
            "**/*.md" \
            2>/dev/null | while IFS= read -r line; do
              if echo "${line}" | grep -qiE "unknown word|error"; then
                echo "  ⚠️  ${line}"
                spell_errors=$((spell_errors + 1))
              fi
            done

          echo "  ✅ Spell check complete"

      - name: "📊 Documentation Quality Metrics"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  📊 Documentation Quality Metrics                ║"
          echo "╚══════════════════════════════════════════════════╝"

          total_docs=0
          total_words=0
          total_headings=0
          total_code_blocks=0
          total_images=0
          total_links=0
          missing_alt=0

          while IFS= read -r -d '' md_file; do
            total_docs=$((total_docs + 1))

            # Word count (excluding code blocks)
            words="$(sed '/^```/,/^```/d' "${md_file}" 2>/dev/null | wc -w)"
            total_words=$((total_words + words))

            # Heading count
            headings="$(grep -c "^#" "${md_file}" 2>/dev/null || echo 0)"
            total_headings=$((total_headings + headings))

            # Code blocks
            code_blocks="$(grep -c "^\`\`\`" "${md_file}" 2>/dev/null || echo 0)"
            total_code_blocks=$((total_code_blocks + code_blocks / 2))

            # Images
            images="$(grep -cE "!\[" "${md_file}" 2>/dev/null || echo 0)"
            total_images=$((total_images + images))

            # Missing alt text
            missing="$(grep -cE "!\[\]" "${md_file}" 2>/dev/null || echo 0)"
            missing_alt=$((missing_alt + missing))

            # Links
            links="$(grep -cE "\[.*\]\(" "${md_file}" 2>/dev/null || echo 0)"
            total_links=$((total_links + links))

          done < <(find . -name "*.md" ! -path "./.git/*" ! -path "./node_modules/*" -print0)

          avg_words=0
          if [[ ${total_docs} -gt 0 ]]; then
            avg_words=$((total_words / total_docs))
          fi

          echo ""
          echo "  📊 Documentation Metrics:"
          echo "  ┌─────────────────────────────────────────────┐"
          printf "  │  📄 Total documents:     %-18s│\n" "${total_docs}"
          printf "  │  📝 Total words:         %-18s│\n" "${total_words}"
          printf "  │  📏 Avg words/doc:       %-18s│\n" "${avg_words}"
          printf "  │  📋 Total headings:      %-18s│\n" "${total_headings}"
          printf "  │  💻 Total code blocks:   %-18s│\n" "${total_code_blocks}"
          printf "  │  🖼️  Total images:        %-18s│\n" "${total_images}"
          printf "  │  🔗 Total links:         %-18s│\n" "${total_links}"
          printf "  │  ♿ Missing alt text:    %-18s│\n" "${missing_alt}"
          echo "  └─────────────────────────────────────────────┘"

          if [[ ${missing_alt} -gt 0 ]]; then
            echo ""
            echo "  ⚠️  ${missing_alt} images missing alt text (accessibility issue)"
            echo "     Use: ![Descriptive alt text](image.png)"
          else
            echo "  ✅ All images have alt text"
          fi

      - name: "📤 Upload SARIF"
        if: always() && hashFiles('markdownlint.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: markdownlint.sarif
          category: "markdownlint"
        continue-on-error: true

      - name: "📤 Upload Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "markdownlint-results"
          path: |
            markdownlint-output.txt
            markdownlint.sarif
            lychee-report.md
          retention-days: 14
          if-no-files-found: ignore

      - name: "💬 Post PR Comment"
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const errors    = parseInt('${{ steps.lint.outputs.errors || 0 }}');
            const passed    = '${{ steps.lint.outputs.passed }}' === 'true';
            const total     = '${{ needs.discover.outputs.total-count }}';
            const docsCount = '${{ needs.discover.outputs.docs-count }}';
            const rdmeCount = '${{ needs.discover.outputs.readme-count }}';

            const icon   = passed ? '✅' : '❌';
            const status = passed ? 'PASSED' : 'FAILED';

            const body = `## 📝 Markdownlint Analysis ${icon}

            **Status: ${status}** | Analyzed **${total}** Markdown files

            | Category | Count |
            |----------|-------|
            | 📖 Docs pages | \`${docsCount}\` |
            | 📄 README files | \`${rdmeCount}\` |
            | 📝 Lint issues | \`${errors}\` |

            ${passed
              ? '### ✨ All Markdown files pass linting!'
              : `### 🔧 Fix Required

            \`\`\`bash
            # Install and run locally:
            npm install -g markdownlint-cli2

            # Fix all issues:
            markdownlint-cli2 "**/*.md" --fix

            # Check specific file:
            markdownlint-cli2 docs/guides/installation.md

            # List all rule violations:
            markdownlint-cli2 "**/*.md" 2>&1 | grep -E "MD[0-9]+"
            \`\`\`

            📚 [Markdownlint Rules Reference](https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md)`
            }

            <details>
            <summary>📋 Configuration Details</summary>

            - **Config:** \`.markdownlint-cli2.jsonc\`
            - **Checks:** MD001-MD053 (all rules)
            - **Link checking:** ${{ inputs.check_links != 'false' && 'Enabled' || 'Disabled' }}
            - **Spell checking:** ${{ inputs.check_spelling != 'false' && 'Enabled' || 'Disabled' }}
            - **Allowed HTML:** details, summary, table, img, kbd, div
            </details>

            ---
            *🤖 ASH Dotfiles Markdownlint v${{ env.MARKDOWNLINT_VERSION }} • [Full Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('📝 Markdownlint Analysis')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — Markdownlint"
    needs: [discover, lint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: "🚦 Evaluate Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🚦 Markdownlint Quality Gate                    ║"
          echo "╚══════════════════════════════════════════════════╝"

          passed="${{ needs.lint.outputs.passed || 'true' }}"
          has_md="${{ needs.discover.outputs.has-markdown }}"
          errors="${{ needs.lint.outputs.errors || '0' }}"

          echo ""
          echo "  📊 Gate Summary:"
          echo "  ├── Files:    ${{ needs.discover.outputs.total-count }}"
          echo "  ├── Errors:   ${errors}"
          echo "  └── Passed:   ${passed}"
          echo ""

          if [[ "${has_md}" == "false" ]]; then
            echo "  ℹ️  No Markdown files — gate skipped"
            exit 0
          fi

          if [[ "${passed}" == "true" ]]; then
            echo "  ✅ QUALITY GATE: PASSED"
            echo "  🎉 All documentation passes markdownlint!"
          else
            echo "  ❌ QUALITY GATE: FAILED"
            echo "  Fix all markdownlint errors before merging."
            echo "  Run: markdownlint-cli2 --fix '**/*.md'"
            exit 1
          fi