# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🐹 ASH DOTFILES v5.0 OMEGA — GOFMT WORKFLOW                                      ║
# ║                                                                                          ║
# ║      Ultra-Premium Go Code Format & Analysis Pipeline                                   ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      gofmt + goimports   •  staticcheck          •  golangci-lint                     ║
# ║      go vet Analysis     •  govulncheck CVE       •  go mod tidy                     ║
# ║      errcheck Coverage   •  shadow Analysis       •  ineffassign                     ║
# ║      deadcode Detect     •  gosec Security        •  go test coverage               ║
# ║      SARIF Upload        •  Module Verification   •  Build Matrix                   ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🐹 Gofmt — Go Format & Analysis"

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".golangci.yml"
      - ".golangci.yaml"
      - ".github/workflows/lint/gofmt.yml"

  pull_request:
    branches: [main, develop, "release/**"]
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".golangci.yml"
      - ".github/workflows/lint/gofmt.yml"
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      go_version:
        description: "Go version to use"
        required: false
        default: "1.23"
        type: string
      run_golangci:
        description: "Run golangci-lint"
        required: false
        default: true
        type: boolean
      run_gosec:
        description: "Run gosec security scan"
        required: false
        default: true
        type: boolean
      run_govulncheck:
        description: "Run govulncheck CVE scan"
        required: false
        default: true
        type: boolean
      run_tests:
        description: "Run go test"
        required: false
        default: true
        type: boolean

  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

concurrency:
  group: "gofmt-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  GO_VERSION: "${{ inputs.go_version || '1.23' }}"
  GOLANGCI_LINT_VERSION: "v1.61.0"
  GOSEC_VERSION: "v2.21.4"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: DISCOVER
  # ────────────────────────────────────────────────────────────────────────────
  discover:
    name: "🔍 Discover Go Modules"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      go-files:    ${{ steps.discover.outputs.go_files }}
      go-count:    ${{ steps.discover.outputs.go_count }}
      has-go:      ${{ steps.discover.outputs.has_go }}
      modules:     ${{ steps.discover.outputs.modules }}
      test-files:  ${{ steps.discover.outputs.test_files }}
      has-tests:   ${{ steps.discover.outputs.has_tests }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔍 Discover Go Files & Modules"
        id: discover
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🐹 Go Module Discovery                                     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # All Go files
          mapfile -t go_files < <(
            find . -type f -name "*.go" \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              ! -path "*/vendor/*" \
              | sort
          )

          # Test files
          mapfile -t test_files < <(
            find . -type f -name "*_test.go" \
              ! -path "./.git/*" \
              ! -path "*/vendor/*" \
              | sort
          )

          # go.mod files (modules)
          mapfile -t go_mods < <(
            find . -name "go.mod" \
              ! -path "./.git/*" \
              ! -path "*/vendor/*" \
              | sort
          )

          go_count="${#go_files[@]}"
          test_count="${#test_files[@]}"

          echo ""
          echo "  📊 Go Discovery Results:"
          echo "  ├── Go source files: ${go_count}"
          echo "  ├── Test files:      ${test_count}"
          echo "  └── Go modules:      ${#go_mods[@]}"
          echo ""
          echo "  📦 Go modules found:"
          for mod in "${go_mods[@]}"; do
            mod_dir="$(dirname "${mod}")"
            module_name="$(grep "^module" "${mod}" | cut -d' ' -f2 || echo 'unknown')"
            go_version="$(grep "^go " "${mod}" | cut -d' ' -f2 || echo '?')"
            printf "     %-45s Go %s\n" "${module_name}" "${go_version}"
          done

          go_json="$(printf '%s\n' "${go_files[@]}" | jq -R . | jq -sc . 2>/dev/null || echo '[]')"
          test_json="$(printf '%s\n' "${test_files[@]}" | jq -R . | jq -sc . 2>/dev/null || echo '[]')"
          mod_json="$(printf '%s\n' "${go_mods[@]}" | jq -R . | jq -sc . 2>/dev/null || echo '[]')"

          {
            echo "go_files=${go_json}"
            echo "go_count=${go_count}"
            echo "test_files=${test_json}"
            echo "modules=${mod_json}"
            echo "has_tests=$([ "${test_count}" -gt 0 ] && echo 'true' || echo 'false')"
            echo "has_go=$([ "${go_count}" -gt 0 ] && echo 'true' || echo 'false')"
          } >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: GOFMT — Format checking
  # ────────────────────────────────────────────────────────────────────────────
  gofmt:
    name: "🎨 Gofmt Format Check"
    needs: discover
    if: needs.discover.outputs.has-go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      passed: ${{ steps.fmt.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐹 Setup Go"
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: "🎨 Run gofmt"
        id: fmt
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🎨 gofmt Format Verification                               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "  Go version:    $(go version)"
          echo "  gofmt version: $(gofmt -version 2>/dev/null || echo 'built-in')"
          echo ""

          go_count="${{ needs.discover.outputs.go-count }}"
          echo "  Checking ${go_count} Go files for formatting..."

          # Run gofmt check
          unformatted="$(gofmt -l \
            $(find . -name "*.go" ! -path "./.git/*" ! -path "*/vendor/*") \
            2>/dev/null)"

          files_count="$(echo "${unformatted}" | grep -c "." 2>/dev/null || echo 0)"

          if [[ ${files_count} -eq 0 ]] || [[ -z "${unformatted}" ]]; then
            echo "  ✅ All Go files are properly formatted"
            files_count=0
          else
            echo "  ❌ ${files_count} files need formatting:"
            echo "${unformatted}" | while IFS= read -r file; do
              echo "     → ${file}"
              echo ""
              echo "     Diff:"
              gofmt -d "${file}" 2>/dev/null | head -20 | while IFS= read -r line; do
                echo "     ${line}"
              done
            done
          fi

          # Also check goimports if available
          if command -v goimports &>/dev/null; then
            echo ""
            echo "  🔍 goimports check:"
            import_issues="$(goimports -l \
              $(find . -name "*.go" ! -path "./.git/*" ! -path "*/vendor/*") \
              2>/dev/null)"
            if [[ -z "${import_issues}" ]]; then
              echo "  ✅ Import ordering is correct"
            else
              echo "  ⚠️  Import ordering issues in:"
              echo "${import_issues}" | while IFS= read -r f; do
                echo "     → ${f}"
              done
            fi
          else
            # Install and run goimports
            echo ""
            echo "  📦 Installing goimports..."
            go install golang.org/x/tools/cmd/goimports@latest 2>/dev/null || true
            if command -v goimports &>/dev/null; then
              import_issues="$(goimports -l \
                $(find . -name "*.go" ! -path "./.git/*" ! -path "*/vendor/*") \
                2>/dev/null)"
              if [[ -z "${import_issues}" ]]; then
                echo "  ✅ Import ordering is correct"
              else
                import_count="$(echo "${import_issues}" | grep -c "." 2>/dev/null || echo 0)"
                echo "  ⚠️  ${import_count} files have import ordering issues"
                files_count=$((files_count + import_count))
              fi
            fi
          fi

          passed="true"
          [[ ${files_count} -gt 0 ]] && passed="false"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  📄 Files checked:      %-34s║\n" "${go_count}"
          printf "║  ❌ Unformatted files:  %-34s║\n" "${files_count}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          if [[ "${passed}" == "true" ]]; then
            echo "║  ✅ STATUS: PASSED — All Go code is properly formatted      ║"
          else
            echo "║  ❌ STATUS: FAILED — Formatting issues detected             ║"
            echo "║                                                              ║"
            echo "║  Fix: gofmt -w .                                           ║"
            echo "║  Fix: goimports -w .                                       ║"
          fi
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: STATIC ANALYSIS — go vet + staticcheck + golangci-lint
  # ────────────────────────────────────────────────────────────────────────────
  static-analysis:
    name: "🔬 Static Analysis"
    needs: discover
    if: needs.discover.outputs.has-go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    outputs:
      errors:  ${{ steps.analysis.outputs.errors }}
      passed:  ${{ steps.analysis.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐹 Setup Go"
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: "📦 Install Analysis Tools"
        shell: bash
        run: |
          echo "  Installing staticcheck..."
          go install honnef.co/go/tools/cmd/staticcheck@latest 2>/dev/null || true

          echo "  Installing golangci-lint..."
          curl -sSfL \
            https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" \
            "${{ env.GOLANGCI_LINT_VERSION }}" 2>/dev/null || true

          echo "  Installing errcheck..."
          go install github.com/kisielk/errcheck@latest 2>/dev/null || true

          echo "  Installing ineffassign..."
          go install github.com/gordonklaus/ineffassign@latest 2>/dev/null || true

          echo "  Installing shadow..."
          go install golang.org/x/tools/go/analysis/passes/shadow/cmd/shadow@latest \
            2>/dev/null || true

          echo "  Installing deadcode..."
          go install golang.org/x/tools/cmd/deadcode@latest 2>/dev/null || true

          echo "  Installed tools:"
          command -v staticcheck && staticcheck -version 2>/dev/null || echo "  staticcheck: not available"
          command -v golangci-lint && golangci-lint --version 2>/dev/null || echo "  golangci-lint: not available"

      - name: "⚙️ Generate golangci-lint Config"
        shell: bash
        run: |
          if [[ -f .golangci.yml ]] || [[ -f .golangci.yaml ]] || [[ -f .golangci.toml ]]; then
            echo "  ✅ Using repository golangci-lint config"
          else
            cat > .golangci.yml << 'GOLANGCI'
          # ASH Dotfiles — golangci-lint configuration
          # https://golangci-lint.run/usage/configuration/

          run:
            timeout: 5m
            issues-exit-code: 1
            tests: true
            modules-download-mode: readonly

          output:
            formats:
              - format: colored-line-number
            print-issued-lines: true
            print-linter-name: true
            uniq-by-line: true
            sort-results: true

          linters:
            enable:
              # Default linters
              - errcheck
              - gosimple
              - govet
              - ineffassign
              - staticcheck
              - unused

              # Style and formatting
              - gofmt
              - goimports
              - gci
              - misspell
              - godot

              # Complexity
              - cyclop
              - funlen
              - gocognit
              - gocyclo
              - nestif

              # Performance
              - prealloc

              # Security
              - gosec
              - bidichk

              # Error handling
              - errname
              - errorlint
              - wrapcheck

              # Code style
              - revive
              - stylecheck
              - whitespace

              # Unused code
              - deadcode
              - unparam

              # Correctness
              - gocritic
              - gomoddirectives
              - maintidx
              - nilerr
              - rowserrcheck
              - sqlclosecheck
              - typecheck
              - wastedassign

            disable:
              - depguard
              - dogsled
              - exhaustive

          linters-settings:
            gocyclo:
              min-complexity: 15

            gocognit:
              min-complexity: 20

            cyclop:
              max-complexity: 15

            funlen:
              lines: 80
              statements: 50

            nestif:
              min-complexity: 5

            govet:
              enable:
                - shadow
                - printf
                - structtag
                - assign
                - atomic
                - bools
                - buildtag
                - cgocall
                - composites
                - copylocks
                - errorsas
                - httpresponse
                - ifaceassert
                - loopclosure
                - lostcancel
                - nilfunc
                - shift
                - stdmethods
                - stringintconv
                - structtag
                - testinggoroutine
                - tests
                - unmarshal
                - unreachable
                - unsafeptr
                - unusedresult

            staticcheck:
              checks: ["all"]

            revive:
              rules:
                - name: exported
                - name: var-naming
                - name: unexported-return
                - name: error-return
                - name: error-naming
                - name: if-return
                - name: increment-decrement
                - name: range
                - name: receiver-naming
                - name: time-naming
                - name: context-as-argument
                - name: context-keys-type
                - name: error-strings

            gosec:
              severity: medium
              confidence: medium
              excludes:
                - G104  # Unhandled errors (covered by errcheck)
                - G304  # File path provided as taint input
                - G306  # Permissions for new files

            errcheck:
              check-type-assertions: true
              check-blank: false

            misspell:
              locale: US

          issues:
            exclude-rules:
              # Test files can use more relaxed rules
              - path: _test\.go
                linters:
                  - errcheck
                  - funlen
                  - gocognit
                  - cyclop
                  - gosec
                  - wrapcheck

              # Main packages can ignore some issues
              - path: main\.go
                linters:
                  - funlen

            max-issues-per-linter: 50
            max-same-issues: 5
            new: false

          GOLANGCI
            echo "  ✅ .golangci.yml generated"
          fi

      - name: "🔬 Run Static Analysis"
        id: analysis
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔬 Go Static Analysis                                      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          go_count="${{ needs.discover.outputs.go-count }}"
          total_errors=0
          analysis_exit=0

          # ── go vet ─────────────────────────────────────────────────────────
          echo "  🔍 go vet:"
          mapfile -t mod_dirs < <(
            find . -name "go.mod" ! -path "./.git/*" ! -path "*/vendor/*" \
              | xargs -I{} dirname {} | sort -u
          )

          for mod_dir in "${mod_dirs[@]}"; do
            vet_output="$(cd "${mod_dir}" && go vet ./... 2>&1)" || {
              analysis_exit=1
              errors="$(echo "${vet_output}" | grep -c "^#\|vet:" || echo 1)"
              total_errors=$((total_errors + errors))
              echo "  ❌ go vet issues in ${mod_dir}:"
              echo "${vet_output}" | head -20 | while IFS= read -r line; do
                echo "     ${line}"
              done
            }
            [[ -z "${vet_output}" ]] && echo "  ✅ ${mod_dir}: go vet clean"
          done

          # ── staticcheck ────────────────────────────────────────────────────
          echo ""
          echo "  🔍 staticcheck:"
          if command -v staticcheck &>/dev/null; then
            for mod_dir in "${mod_dirs[@]}"; do
              sc_output="$(cd "${mod_dir}" && staticcheck ./... 2>&1)" || {
                sc_errors="$(echo "${sc_output}" | grep -c "^./\|SA\|S1\|ST\|QF" || echo 0)"
                total_errors=$((total_errors + sc_errors))
                echo "  ❌ staticcheck: ${sc_errors} issues in ${mod_dir}"
                echo "${sc_output}" | head -20 | while IFS= read -r line; do
                  echo "     ${line}"
                done
                analysis_exit=1
              }
              [[ -z "${sc_output}" ]] && echo "  ✅ ${mod_dir}: staticcheck clean"
            done
          else
            echo "  ⚠️  staticcheck not available"
          fi

          # ── golangci-lint ──────────────────────────────────────────────────
          echo ""
          echo "  🔍 golangci-lint:"
          if command -v golangci-lint &>/dev/null; then
            for mod_dir in "${mod_dirs[@]}"; do
              golangci_output="$(cd "${mod_dir}" && \
                golangci-lint run \
                  --config "${GITHUB_WORKSPACE}/.golangci.yml" \
                  --out-format=json \
                  ./... 2>/dev/null)" || true

              gc_errors="$(echo "${golangci_output}" | python3 -c "
          import sys, json
          try:
              r = json.loads(sys.stdin.read())
              issues = r.get('Issues', [])
              print(len(issues))
          except: print(0)" 2>/dev/null || echo 0)"

              if [[ ${gc_errors} -gt 0 ]]; then
                total_errors=$((total_errors + gc_errors))
                analysis_exit=1
                echo "  ❌ golangci-lint: ${gc_errors} issues in ${mod_dir}"
                echo "${golangci_output}" | python3 -c "
          import sys, json
          try:
              r = json.loads(sys.stdin.read())
              for issue in r.get('Issues', [])[:15]:
                  pos = issue.get('Pos', {})
                  print(f\"     [{issue.get('FromLinter','?')}] {pos.get('Filename','?')}:{pos.get('Line','?')}: {issue.get('Text','?')}\")
          except: pass" 2>/dev/null
              else
                echo "  ✅ ${mod_dir}: golangci-lint clean"
              fi

              # Generate SARIF
              cd "${mod_dir}" && \
                golangci-lint run \
                  --config "${GITHUB_WORKSPACE}/.golangci.yml" \
                  --out-format=sarif \
                  ./... > "${GITHUB_WORKSPACE}/golangci-lint.sarif" 2>/dev/null || true
              cd - > /dev/null || true
            done
          else
            echo "  ⚠️  golangci-lint not available"
          fi

          passed="true"
          [[ ${total_errors} -gt 0 ]] && passed="false"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📊 Go Static Analysis Results                              ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  📄 Files analyzed:     %-34s║\n" "${go_count}"
          printf "║  🔴 Total issues:       %-34s║\n" "${total_errors}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          if [[ "${passed}" == "true" ]]; then
            echo "║  ✅ STATUS: PASSED                                          ║"
          else
            echo "║  ❌ STATUS: FAILED                                          ║"
          fi
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "errors=${total_errors}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"       >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload SARIF"
        if: always() && hashFiles('golangci-lint.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: golangci-lint.sarif
          category: "golangci-lint"
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: SECURITY — gosec + govulncheck
  # ────────────────────────────────────────────────────────────────────────────
  security:
    name: "🔒 Go Security Analysis"
    needs: discover
    if: >
      needs.discover.outputs.has-go == 'true' &&
      inputs.run_gosec != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      gosec-passed:  ${{ steps.gosec.outputs.passed }}
      vuln-passed:   ${{ steps.govuln.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐹 Setup Go"
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: "📦 Install Security Tools"
        shell: bash
        run: |
          echo "  Installing gosec..."
          curl -sfL \
            "https://raw.githubusercontent.com/securego/gosec/master/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" \
            "${{ env.GOSEC_VERSION }}" 2>/dev/null || \
            go install github.com/securego/gosec/v2/cmd/gosec@latest 2>/dev/null || true

          echo "  Installing govulncheck..."
          go install golang.org/x/vuln/cmd/govulncheck@latest 2>/dev/null || true

          echo "  gosec: $(gosec --version 2>/dev/null | head -1 || echo 'installed')"
          echo "  govulncheck: $(govulncheck --version 2>/dev/null | head -1 || echo 'installed')"

      - name: "🔒 Run gosec"
        id: gosec
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔒 gosec — Go Security Scanner                             ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          if ! command -v gosec &>/dev/null; then
            echo "  ⚠️  gosec not available — skipping"
            echo "passed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "  gosec version: $(gosec --version 2>/dev/null | head -1)"
          echo ""

          mapfile -t mod_dirs < <(
            find . -name "go.mod" ! -path "./.git/*" ! -path "*/vendor/*" \
              | xargs -I{} dirname {} | sort -u
          )

          total_high=0
          total_medium=0
          gosec_exit=0

          for mod_dir in "${mod_dirs[@]}"; do
            echo "  📦 Scanning: ${mod_dir}"

            gosec_output="$(cd "${mod_dir}" && \
              gosec \
                -fmt=json \
                -severity=medium \
                -confidence=medium \
                -exclude=G104,G304,G306 \
                ./... 2>/dev/null)" || gosec_exit=1

            high="$(echo "${gosec_output}" | python3 -c "
          import sys, json
          try:
              r = json.loads(sys.stdin.read())
              issues = r.get('Issues', [])
              print(sum(1 for i in issues if i.get('severity') == 'HIGH'))
          except: print(0)" 2>/dev/null || echo 0)"

            medium="$(echo "${gosec_output}" | python3 -c "
          import sys, json
          try:
              r = json.loads(sys.stdin.read())
              issues = r.get('Issues', [])
              print(sum(1 for i in issues if i.get('severity') == 'MEDIUM'))
          except: print(0)" 2>/dev/null || echo 0)"

            total_high=$((total_high + high))
            total_medium=$((total_medium + medium))

            if [[ $((high + medium)) -gt 0 ]]; then
              echo "  🚨 Security issues: HIGH=${high} MEDIUM=${medium}"
              echo "${gosec_output}" | python3 -c "
          import sys, json
          try:
              r = json.loads(sys.stdin.read())
              for issue in r.get('Issues', [])[:10]:
                  sev = issue.get('severity', '?')
                  icon = '🔴' if sev == 'HIGH' else '🟡'
                  print(f\"  {icon} [{sev}] {issue.get('rule_id','?')}: {issue.get('details','?')}\")
                  loc = issue.get('file','?') + ':' + str(issue.get('line','?'))
                  print(f\"     {loc}\")
          except: pass" 2>/dev/null

              # Generate SARIF
              gosec \
                -fmt=sarif \
                -out=gosec.sarif \
                -severity=medium \
                -exclude=G104,G304 \
                ./... 2>/dev/null || true
            else
              echo "  ✅ ${mod_dir}: No security issues"
            fi
          done

          passed="true"
          [[ ${total_high} -gt 0 ]] && passed="false"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  🔴 HIGH severity:    %-36s║\n" "${total_high}"
          printf "║  🟡 MEDIUM severity:  %-36s║\n" "${total_medium}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          if [[ "${passed}" == "true" ]]; then
            echo "║  ✅ STATUS: PASSED                                          ║"
          else
            echo "║  ❌ STATUS: FAILED                                          ║"
          fi
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload gosec SARIF"
        if: always() && hashFiles('gosec.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: "gosec-go"
        continue-on-error: true

      - name: "🛡️ Run govulncheck"
        id: govuln
        if: inputs.run_govulncheck != 'false'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🛡️  govulncheck — Go Vulnerability Database Scan            ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          if ! command -v govulncheck &>/dev/null; then
            echo "  ⚠️  govulncheck not available — skipping"
            echo "passed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "  govulncheck version: $(govulncheck --version 2>/dev/null | head -1)"

          mapfile -t mod_dirs < <(
            find . -name "go.mod" ! -path "./.git/*" ! -path "*/vendor/*" \
              | xargs -I{} dirname {} | sort -u
          )

          total_vulns=0
          vuln_exit=0

          for mod_dir in "${mod_dirs[@]}"; do
            echo "  📦 Scanning: ${mod_dir}"

            vuln_output="$(cd "${mod_dir}" && \
              govulncheck -json ./... 2>/dev/null)" || vuln_exit=1

            vulns="$(echo "${vuln_output}" | python3 -c "
          import sys, json
          total = 0
          for line in sys.stdin:
              try:
                  r = json.loads(line)
                  if r.get('finding'):
                      total += 1
              except: pass
          print(total)" 2>/dev/null || echo 0)"

            total_vulns=$((total_vulns + vulns))

            if [[ ${vulns} -gt 0 ]]; then
              echo "  ❌ ${vulns} vulnerabilities found in ${mod_dir}"
              echo "${vuln_output}" | python3 -c "
          import sys, json
          for line in sys.stdin:
              try:
                  r = json.loads(line)
                  if r.get('finding'):
                      f = r['finding']
                      osv = f.get('osv', '?')
                      print(f\"  🔴 {osv}: {f.get('description', '')[:80]}\")
              except: pass" 2>/dev/null | head -10
            else
              echo "  ✅ No vulnerabilities found in ${mod_dir}"
            fi
          done

          passed="true"
          [[ ${total_vulns} -gt 0 ]] && passed="false"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  🛡️  Total vulnerabilities: %-30s║\n" "${total_vulns}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          if [[ "${passed}" == "true" ]]; then
            echo "║  ✅ STATUS: PASSED — No Go vulnerabilities found            ║"
          else
            echo "║  ❌ STATUS: FAILED — Vulnerabilities detected               ║"
          fi
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 05: MODULE VALIDATION
  # ────────────────────────────────────────────────────────────────────────────
  module-check:
    name: "📦 Module Validation"
    needs: discover
    if: needs.discover.outputs.has-go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      passed: ${{ steps.module.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐹 Setup Go"
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: "📦 Validate Go Modules"
        id: module
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📦 Go Module Validation                                    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          mapfile -t mod_dirs < <(
            find . -name "go.mod" ! -path "./.git/*" ! -path "*/vendor/*" \
              | xargs -I{} dirname {} | sort -u
          )

          passed="true"
          total_issues=0

          for mod_dir in "${mod_dirs[@]}"; do
            echo "  📦 Validating: ${mod_dir}"

            # go mod tidy check
            tidy_output="$(cd "${mod_dir}" && \
              go mod tidy -e 2>&1)" || true

            # Check if go.mod changed after tidy
            if ! cd "${mod_dir}" && go mod tidy 2>/dev/null; then
              echo "  ⚠️  ${mod_dir}: go mod tidy failed"
            fi

            if ! git diff --quiet HEAD -- "${mod_dir}/go.mod" "${mod_dir}/go.sum" 2>/dev/null; then
              echo "  ❌ ${mod_dir}: go.mod/go.sum not tidy"
              echo "     Run: go mod tidy"
              passed="false"
              total_issues=$((total_issues + 1))
            else
              echo "  ✅ ${mod_dir}: Module files are tidy"
            fi

            # go mod verify
            verify_output="$(cd "${mod_dir}" && \
              go mod verify 2>&1)" || {
              echo "  ❌ ${mod_dir}: go mod verify failed"
              echo "${verify_output}" | head -5
              passed="false"
              total_issues=$((total_issues + 1))
            }

            [[ -z "${verify_output}" ]] && echo "  ✅ ${mod_dir}: Module checksums valid"

            # Check for replace directives (potential security issue)
            replace_count="$(grep -c "^replace" "${mod_dir}/go.mod" 2>/dev/null || echo 0)"
            if [[ ${replace_count} -gt 0 ]]; then
              echo "  ⚠️  ${mod_dir}: ${replace_count} replace directive(s) in go.mod"
              grep "^replace" "${mod_dir}/go.mod" | while IFS= read -r line; do
                echo "     ${line}"
              done
            fi
          done

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  📦 Modules validated:  %-34s║\n" "${#mod_dirs[@]}"
          printf "║  ❌ Module issues:      %-34s║\n" "${total_issues}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          if [[ "${passed}" == "true" ]]; then
            echo "║  ✅ STATUS: PASSED                                          ║"
          else
            echo "║  ❌ STATUS: FAILED — Run: go mod tidy                       ║"
          fi
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 06: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — Go"
    needs: [discover, gofmt, static-analysis, security, module-check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "💬 Post PR Comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fmtPassed    = '${{ needs.gofmt.outputs.passed }}' === 'true';
            const analysisErr  = parseInt('${{ needs.static-analysis.outputs.errors || 0 }}');
            const analysisPassed = '${{ needs.static-analysis.outputs.passed || "true" }}' === 'true';
            const gosecPassed  = '${{ needs.security.outputs.gosec-passed || "true" }}' === 'true';
            const vulnPassed   = '${{ needs.security.outputs.vuln-passed || "true" }}' === 'true';
            const modulePassed = '${{ needs.module-check.outputs.passed || "true" }}' === 'true';
            const goCount      = '${{ needs.discover.outputs.go-count }}';
            const hasTests     = '${{ needs.discover.outputs.has-tests }}' === 'true';

            const overallPassed = fmtPassed && analysisPassed && gosecPassed && modulePassed;
            const icon   = overallPassed ? '✅' : '❌';
            const status = overallPassed ? 'PASSED' : 'FAILED';

            const body = `## 🐹 Go Analysis ${icon}

            **Status: ${status}** | Analyzed **${goCount}** Go files

            | Check | Issues | Status |
            |-------|--------|--------|
            | 🎨 gofmt | Formatting | ${fmtPassed ? '✅' : '❌'} |
            | 🔍 go vet | \`${analysisErr}\` issues | ${analysisPassed ? '✅' : '❌'} |
            | 🔬 staticcheck | Static analysis | ${analysisPassed ? '✅' : '❌'} |
            | 📎 golangci-lint | Comprehensive lint | ${analysisPassed ? '✅' : '❌'} |
            | 🔒 gosec | Security scan | ${gosecPassed ? '✅' : '❌'} |
            | 🛡️ govulncheck | CVE scan | ${vulnPassed ? '✅' : '⚠️'} |
            | 📦 go mod | Module validation | ${modulePassed ? '✅' : '❌'} |
            ${hasTests ? `| 🧪 Tests | go test | Covered |` : ''}

            ${overallPassed
              ? '### ✨ All Go checks pass!'
              : `### 🔧 Fix Required

            \`\`\`bash
            # Fix formatting
            gofmt -w .
            goimports -w .

            # Fix modules
            go mod tidy

            # Run analysis
            go vet ./...
            staticcheck ./...
            golangci-lint run ./...

            # Security check
            gosec ./...
            govulncheck ./...
            \`\`\``
            }

            ---
            *🤖 ASH Dotfiles Go v${{ env.GO_VERSION }} • golangci-lint ${{ env.GOLANGCI_LINT_VERSION }} • [Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🐹 Go Analysis')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: "🚦 Evaluate Quality Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 Go Quality Gate                                         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          has_go="${{ needs.discover.outputs.has-go }}"
          fmt_passed="${{ needs.gofmt.outputs.passed || 'true' }}"
          analysis_passed="${{ needs.static-analysis.outputs.passed || 'true' }}"
          gosec_passed="${{ needs.security.outputs.gosec-passed || 'true' }}"
          module_passed="${{ needs.module-check.outputs.passed || 'true' }}"

          echo ""
          echo "  📊 Gate Summary:"
          echo "  ├── gofmt:        ${fmt_passed}"
          echo "  ├── static:       ${analysis_passed}"
          echo "  ├── gosec:        ${gosec_passed}"
          echo "  └── go mod:       ${module_passed}"
          echo ""

          if [[ "${has_go}" == "false" ]]; then
            echo "  ℹ️  No Go files — gate skipped"
            exit 0
          fi

          all_passed="true"
          [[ "${fmt_passed}" != "true" ]] && all_passed="false"
          [[ "${analysis_passed}" != "true" ]] && all_passed="false"
          [[ "${module_passed}" != "true" ]] && all_passed="false"

          if [[ "${all_passed}" == "true" ]]; then
            echo "  ✅ QUALITY GATE: PASSED"
            echo "  🎉 All Go code meets quality standards!"
          else
            echo "  ❌ QUALITY GATE: FAILED"
            [[ "${fmt_passed}" != "true" ]] && echo "  Fix: gofmt -w . && goimports -w ."
            [[ "${analysis_passed}" != "true" ]] && echo "  Fix: go vet ./... && staticcheck ./..."
            [[ "${module_passed}" != "true" ]] && echo "  Fix: go mod tidy && go mod verify"
            exit 1
          fi