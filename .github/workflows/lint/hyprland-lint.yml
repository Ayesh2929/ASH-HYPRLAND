# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🪟 ASH DOTFILES v5.0 OMEGA — HYPRLAND LINT WORKFLOW                              ║
# ║                                                                                          ║
# ║      Ultra-Premium Hyprland Configuration Analysis Pipeline                             ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      Hyprland Config Parsing •  Keyword Validation   •  Monitor Rules Check           ║
# ║      Keybind Conflict Detect •  Animation Analysis   •  Window Rules Audit            ║
# ║      Plugin Config Verify    •  Color Value Check    •  Source Directive Trace        ║
# ║      Workspace Rules Audit   •  Security Analysis    •  Performance Hints             ║
# ║      Deprecated API Detect   •  Schema Validation    •  Custom Parser Engine         ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🪟 Hyprland Config — Lint & Validation"

# ══════════════════════════════════════════════════════════════════════════════
# TRIGGER CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
    paths:
      - "config/hypr/**"
      - "config/hypr/*.conf"
      - ".github/workflows/lint/hyprland-lint.yml"

  pull_request:
    branches:
      - main
      - develop
      - "release/**"
    paths:
      - "config/hypr/**"
      - ".github/workflows/lint/hyprland-lint.yml"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:
    inputs:
      check_keybinds:
        description: "Check for keybind conflicts"
        required: false
        default: true
        type: boolean
      check_deprecated:
        description: "Check for deprecated keywords"
        required: false
        default: true
        type: boolean
      check_colors:
        description: "Validate color hex values"
        required: false
        default: true
        type: boolean
      check_security:
        description: "Run security analysis"
        required: false
        default: true
        type: boolean
      strict_mode:
        description: "Strict mode — warnings become errors"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "0 5 * * *"

# ══════════════════════════════════════════════════════════════════════════════
# PERMISSIONS
# ══════════════════════════════════════════════════════════════════════════════
permissions:
  contents: read
  pull-requests: write
  checks: write

# ══════════════════════════════════════════════════════════════════════════════
# CONCURRENCY
# ══════════════════════════════════════════════════════════════════════════════
concurrency:
  group: "hyprland-lint-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════════════════
# GLOBAL ENV
# ══════════════════════════════════════════════════════════════════════════════
env:
  HYPR_CONFIG_DIR: "config/hypr"
  PYTHON_VERSION: "3.12"
  # Known Hyprland config sections
  KNOWN_SECTIONS: >-
    general animations decoration input gestures group misc
    xwayland opengl cursor render debug binds device ecosystem
  # Deprecated keywords (Hyprland changelog tracked)
  DEPRECATED_KEYWORDS: >-
    animations:bezier_curve
    decoration:drop_shadow
    decoration:col.shadow
    general:col.inactive_border
    general:col.active_border
    input:follow_mouse
    misc:no_vfr
    debug:overlay
  # Max keybind combinations to detect conflicts
  MAX_KEYBIND_CONFLICTS: "0"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: DISCOVER
  # ────────────────────────────────────────────────────────────────────────────
  discover:
    name: "🔍 Discover Hyprland Config Files"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      conf-files:    ${{ steps.discover.outputs.conf_files }}
      conf-count:    ${{ steps.discover.outputs.conf_count }}
      has-config:    ${{ steps.discover.outputs.has_config }}
      main-config:   ${{ steps.discover.outputs.main_config }}
      keybind-files: ${{ steps.discover.outputs.keybind_files }}
      shader-files:  ${{ steps.discover.outputs.shader_files }}

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔍 Discover Config Files"
        id: discover
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🪟 Hyprland Config Discovery                               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          hypr_dir="${{ env.HYPR_CONFIG_DIR }}"

          if [[ ! -d "${hypr_dir}" ]]; then
            echo "  ℹ️  No Hyprland config directory found at: ${hypr_dir}"
            {
              echo "conf_files=[]"
              echo "conf_count=0"
              echo "has_config=false"
              echo "main_config="
              echo "keybind_files=[]"
              echo "shader_files=[]"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # All .conf files
          mapfile -t conf_files < <(
            find "${hypr_dir}" -type f -name "*.conf" | sort
          )

          # Keybind files
          mapfile -t keybind_files < <(
            find "${hypr_dir}" -type f -name "*.conf" \
              \( -path "*/keybinds/*" -o -name "*bind*" -o -name "*key*" \) \
              | sort
          )

          # GLSL shader files
          mapfile -t shader_files < <(
            find "${hypr_dir}" -type f \( -name "*.frag" -o -name "*.vert" -o -name "*.glsl" \) \
              | sort
          )

          conf_count="${#conf_files[@]}"
          main_config=""
          [[ -f "${hypr_dir}/hyprland.conf" ]] && main_config="${hypr_dir}/hyprland.conf"

          echo ""
          echo "  📊 Hyprland Config Discovery:"
          echo "  ├── Total .conf files:  ${conf_count}"
          echo "  ├── Main config:        ${main_config:-NOT FOUND}"
          echo "  ├── Keybind files:      ${#keybind_files[@]}"
          echo "  └── Shader files:       ${#shader_files[@]}"
          echo ""
          echo "  📁 Config structure:"
          find "${hypr_dir}" -name "*.conf" | while IFS= read -r f; do
            size="$(wc -l < "${f}")"
            printf "     %-50s %s lines\n" "${f}" "${size}"
          done

          conf_json="$(printf '%s\n' "${conf_files[@]}" | \
            jq -R . | jq -sc . 2>/dev/null || echo '[]')"
          keybind_json="$(printf '%s\n' "${keybind_files[@]}" | \
            jq -R . | jq -sc . 2>/dev/null || echo '[]')"
          shader_json="$(printf '%s\n' "${shader_files[@]}" | \
            jq -R . | jq -sc . 2>/dev/null || echo '[]')"

          {
            echo "conf_files=${conf_json}"
            echo "conf_count=${conf_count}"
            echo "has_config=$([ "${conf_count}" -gt 0 ] && echo 'true' || echo 'false')"
            echo "main_config=${main_config}"
            echo "keybind_files=${keybind_json}"
            echo "shader_files=${shader_json}"
          } >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: PARSE & VALIDATE — Core syntax analysis
  # ────────────────────────────────────────────────────────────────────────────
  parse-validate:
    name: "🔬 Parse & Validate Config Syntax"
    needs: discover
    if: needs.discover.outputs.has-config == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      syntax-errors:   ${{ steps.parse.outputs.syntax_errors }}
      syntax-warnings: ${{ steps.parse.outputs.syntax_warnings }}
      syntax-passed:   ${{ steps.parse.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "🔬 Parse Hyprland Config Files"
        id: parse
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🪟 Hyprland Config Syntax Parser                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Run comprehensive Python parser
          python3 << 'PARSER'
          import os
          import re
          import sys
          import json
          from pathlib import Path
          from collections import defaultdict

          # ═══════════════════════════════════════════════════════════════════
          # HYPRLAND CONFIG PARSER — Full implementation
          # ═══════════════════════════════════════════════════════════════════

          HYPR_DIR = Path("config/hypr")
          errors   = []
          warnings = []

          # ── Known valid sections ─────────────────────────────────────────
          KNOWN_SECTIONS = {
              "general", "animations", "decoration", "input", "gestures",
              "group", "misc", "xwayland", "opengl", "cursor", "render",
              "debug", "binds", "device", "ecosystem", "plugin",
              "general:layout", "decoration:blur", "decoration:shadow",
              "animations:bezier", "input:touchpad", "input:touchdevice",
              "input:tablet", "group:groupbar",
          }

          # ── Deprecated keywords ──────────────────────────────────────────
          DEPRECATED = {
              "drop_shadow":         "shadow:enabled (Hyprland v0.40+)",
              "shadow_range":        "shadow:range",
              "shadow_render_power": "shadow:render_power",
              "col.shadow":          "shadow:color",
              "col.shadow_inactive": "shadow:color_inactive",
              "no_vfr":              "misc:vfr (inverted logic)",
              "bezier_curve":        "animations: bezier = name, ...",
              "follow_mouse":        "input:focus_on_close",
              "rounding":            "decoration:rounding",
              "blur_size":           "decoration:blur:size",
              "blur_passes":         "decoration:blur:passes",
          }

          # ── Color validation regex ────────────────────────────────────────
          HEX_COLOR_RE = re.compile(
              r'^(?:0x|#)?(?:[0-9a-fA-F]{6}|[0-9a-fA-F]{8}|[0-9a-fA-F]{3})$'
          )
          RGBA_RE = re.compile(
              r'^rgba\(\s*[0-9a-fA-F]{8}\s*\)$|^rgb\(\s*[0-9a-fA-F]{6}\s*\)$'
          )

          # ── Source directive tracking ─────────────────────────────────────
          sourced_files = set()

          def validate_color(value: str, file: str, line_num: int) -> bool:
              """Validate a color value used in Hyprland config."""
              v = value.strip()
              if HEX_COLOR_RE.match(v) or RGBA_RE.match(v):
                  return True
              if v.startswith("0x") and len(v) in (8, 10):
                  return True
              warnings.append({
                  "file": str(file),
                  "line": line_num,
                  "message": f"Potentially invalid color value: {v!r}",
                  "rule": "invalid-color"
              })
              return False

          def parse_config_file(filepath: Path, depth: int = 0) -> dict:
              """Recursively parse a Hyprland .conf file."""
              if depth > 10:
                  warnings.append({
                      "file": str(filepath),
                      "line": 0,
                      "message": "Maximum source depth (10) reached",
                      "rule": "deep-source"
                  })
                  return {}

              if not filepath.exists():
                  errors.append({
                      "file": str(filepath),
                      "line": 0,
                      "message": f"Source file not found: {filepath}",
                      "rule": "missing-source"
                  })
                  return {}

              sourced_files.add(str(filepath))
              stats = {
                  "sections": [],
                  "keywords": defaultdict(list),
                  "binds": [],
                  "source_files": [],
                  "colors": [],
                  "monitors": [],
                  "line_count": 0,
              }

              current_section = ""
              brace_depth = 0
              section_stack = []

              try:
                  content = filepath.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  errors.append({
                      "file": str(filepath),
                      "line": 0,
                      "message": "File is not valid UTF-8",
                      "rule": "encoding-error"
                  })
                  return stats

              for line_num, raw_line in enumerate(content.splitlines(), 1):
                  stats["line_count"] += 1
                  line = raw_line.strip()

                  # Skip comments and empty lines
                  if not line or line.startswith("#"):
                      continue

                  # ── source directive ──────────────────────────────────────
                  if line.startswith("source"):
                      match = re.match(r'source\s*=\s*(.+)', line)
                      if match:
                          raw_path = match.group(1).strip()
                          # Expand ~ and $HOME
                          raw_path = raw_path.replace(
                              "~",
                              str(Path.home())
                          ).replace(
                              "$HOME",
                              str(Path.home())
                          ).replace(
                              "$XDG_CONFIG_HOME",
                              os.environ.get("XDG_CONFIG_HOME",
                                             str(Path.home() / ".config"))
                          )
                          src_path = Path(raw_path)
                          if not src_path.is_absolute():
                              src_path = filepath.parent / raw_path

                          # Track relative sources for CI validation
                          rel_match = re.match(
                              r'\$\(.*\)|\$\{.*\}|~', raw_path
                          )
                          if not rel_match:
                              stats["source_files"].append(str(src_path))
                              if not src_path.exists():
                                  # Check if relative to repo root
                                  repo_path = Path(raw_path.lstrip("/"))
                                  if repo_path.exists():
                                      sub_stats = parse_config_file(
                                          repo_path, depth + 1
                                      )
                                  else:
                                      warnings.append({
                                          "file": str(filepath),
                                          "line": line_num,
                                          "message": (
                                              f"Source file may not exist at "
                                              f"runtime: {raw_path}"
                                          ),
                                          "rule": "maybe-missing-source"
                                      })
                      continue

                  # ── Section open ──────────────────────────────────────────
                  if line.endswith("{"):
                      section_name = line[:-1].strip()
                      section_stack.append(section_name)
                      brace_depth += 1

                      # Build full section path
                      if section_stack:
                          current_section = ":".join(
                              s for s in section_stack if s
                          )
                      else:
                          current_section = section_name

                      # Validate section name
                      base_section = section_stack[0] if section_stack else ""
                      if (base_section and
                              base_section not in KNOWN_SECTIONS and
                              not base_section.startswith("device")):
                          warnings.append({
                              "file": str(filepath),
                              "line": line_num,
                              "message": (
                                  f"Unknown section: {base_section!r}. "
                                  f"Is this a plugin section?"
                              ),
                              "rule": "unknown-section"
                          })
                      else:
                          stats["sections"].append(current_section)
                      continue

                  # ── Section close ─────────────────────────────────────────
                  if line == "}":
                      if brace_depth > 0:
                          brace_depth -= 1
                          if section_stack:
                              section_stack.pop()
                          current_section = (
                              ":".join(s for s in section_stack if s)
                              if section_stack else ""
                          )
                      else:
                          errors.append({
                              "file": str(filepath),
                              "line": line_num,
                              "message": "Unexpected closing brace '}'",
                              "rule": "unexpected-brace"
                          })
                      continue

                  # ── Key = Value assignment ────────────────────────────────
                  if "=" in line:
                      parts = line.split("=", 1)
                      key   = parts[0].strip()
                      value = parts[1].strip() if len(parts) > 1 else ""

                      full_key = f"{current_section}:{key}" if current_section else key

                      # Track keyword
                      stats["keywords"][key].append({
                          "section": current_section,
                          "value": value,
                          "line": line_num
                      })

                      # ── Deprecated keyword check ──────────────────────────
                      if key in DEPRECATED:
                          warnings.append({
                              "file": str(filepath),
                              "line": line_num,
                              "message": (
                                  f"Deprecated keyword {key!r} — "
                                  f"use {DEPRECATED[key]} instead"
                              ),
                              "rule": "deprecated-keyword"
                          })

                      # ── Color validation ──────────────────────────────────
                      color_keys = {
                          "col.active_border", "col.inactive_border",
                          "col.shadow", "col.nogroup_border",
                          "col.nogroup_border_active",
                          "color", "col.from", "col.to",
                      }
                      if key in color_keys or key.startswith("col."):
                          # Handle gradient syntax: rgba(...) rgba(...) degree
                          for token in value.split():
                              if (token.startswith("0x") or
                                      token.startswith("rgba(") or
                                      token.startswith("rgb(") or
                                      token.startswith("#")):
                                  validate_color(token, filepath, line_num)

                      # ── Bind parsing ──────────────────────────────────────
                      if key in ("bind", "bindm", "binde", "bindr", "bindl",
                                 "bindn", "bindrt"):
                          stats["binds"].append({
                              "type": key,
                              "value": value,
                              "line": line_num,
                              "file": str(filepath),
                          })

                      # ── Monitor parsing ───────────────────────────────────
                      if key == "monitor":
                          stats["monitors"].append({
                              "value": value,
                              "line": line_num
                          })
                          # Validate monitor syntax
                          # Expected: name,resolution@rate,position,scale
                          monitor_re = re.compile(
                              r'^[^,]+,\s*'
                              r'(?:\d+x\d+(?:@\d+(?:\.\d+)?)?|preferred|highrr|highres|disable)'
                              r',\s*[\d.]+x[\d.]+,\s*[\d.]+'
                          )
                          if not monitor_re.match(value) and value != ",preferred,auto,1":
                              if value not in (",preferred,auto,1",
                                              "disable",
                                              ",disable"):
                                  warnings.append({
                                      "file": str(filepath),
                                      "line": line_num,
                                      "message": (
                                          f"Monitor value may have unusual "
                                          f"format: {value!r}"
                                      ),
                                      "rule": "monitor-format"
                                  })

                      # ── Animation validation ──────────────────────────────
                      if key == "animation":
                          # animation = name, onoff, speed, curve [, style]
                          parts_anim = [p.strip() for p in value.split(",")]
                          if len(parts_anim) < 3:
                              errors.append({
                                  "file": str(filepath),
                                  "line": line_num,
                                  "message": (
                                      f"Animation requires at least 3 params "
                                      f"(name, enable, speed): {value!r}"
                                  ),
                                  "rule": "animation-params"
                              })
                          elif len(parts_anim) >= 3:
                              try:
                                  speed = float(parts_anim[2])
                                  if speed <= 0:
                                      warnings.append({
                                          "file": str(filepath),
                                          "line": line_num,
                                          "message": (
                                              f"Animation speed should be "
                                              f"positive: {speed}"
                                          ),
                                          "rule": "animation-speed"
                                      })
                                  if speed > 20:
                                      warnings.append({
                                          "file": str(filepath),
                                          "line": line_num,
                                          "message": (
                                              f"Very high animation speed "
                                              f"({speed}) may cause issues"
                                          ),
                                          "rule": "animation-speed-high"
                                      })
                              except ValueError:
                                  pass

                      # ── Bezier curve validation ───────────────────────────
                      if key == "bezier":
                          bezier_re = re.compile(
                              r'^\s*\w+\s*,\s*'
                              r'[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+'
                          )
                          if not bezier_re.match(value):
                              errors.append({
                                  "file": str(filepath),
                                  "line": line_num,
                                  "message": (
                                      f"Invalid bezier format (expected: "
                                      f"name, p1x, p1y, p2x, p2y): {value!r}"
                                  ),
                                  "rule": "bezier-format"
                              })

                      # ── Exec security check ────────────────────────────────
                      if key in ("exec", "exec-once"):
                          # Check for potentially dangerous patterns
                          danger_patterns = [
                              (r'curl.*\|.*sh', "curl pipe to shell"),
                              (r'wget.*\|.*sh', "wget pipe to shell"),
                              (r'rm\s+-rf\s+/', "rm -rf with absolute path"),
                              (r'sudo\s+', "sudo usage in autostart"),
                              (r'chmod\s+777', "world-writable chmod"),
                          ]
                          for pattern, desc in danger_patterns:
                              if re.search(pattern, value):
                                  warnings.append({
                                      "file": str(filepath),
                                      "line": line_num,
                                      "message": (
                                          f"Potentially dangerous exec: "
                                          f"{desc} — review carefully"
                                      ),
                                      "rule": "exec-security"
                                  })

              # ── Unclosed brace check ──────────────────────────────────────
              if brace_depth != 0:
                  errors.append({
                      "file": str(filepath),
                      "line": stats["line_count"],
                      "message": (
                          f"Unclosed section brace (depth: {brace_depth})"
                      ),
                      "rule": "unclosed-brace"
                  })

              return stats

          # ── Parse all config files ────────────────────────────────────────
          all_stats = {}
          all_binds = []
          all_monitors = []

          for conf_file in sorted(HYPR_DIR.rglob("*.conf")):
              rel = conf_file.relative_to(".")
              print(f"  📄 Parsing: {rel}")
              stats = parse_config_file(conf_file)
              all_stats[str(rel)] = stats
              all_binds.extend(stats.get("binds", []))
              all_monitors.extend(stats.get("monitors", []))

          # ── Keybind conflict detection ────────────────────────────────────
          print("\n  🎹 Checking keybind conflicts...")
          bind_map = defaultdict(list)
          for bind in all_binds:
              val = bind["value"]
              parts = [p.strip() for p in val.split(",")]
              if len(parts) >= 2:
                  mods = parts[0].upper()
                  key  = parts[1].upper() if len(parts) > 1 else ""
                  bind_key = f"{mods}+{key}"
                  bind_map[bind_key].append(bind)

          conflicts_found = 0
          for bind_combo, instances in bind_map.items():
              # Filter to only "bind" type (not bindm, bindr etc.)
              normal_binds = [
                  b for b in instances
                  if b["type"] == "bind"
              ]
              if len(normal_binds) > 1:
                  conflicts_found += 1
                  files_info = ", ".join(
                      f"{b['file']}:{b['line']}"
                      for b in normal_binds
                  )
                  warnings.append({
                      "file": normal_binds[0]["file"],
                      "line": normal_binds[0]["line"],
                      "message": (
                          f"Potential keybind conflict for {bind_combo!r} "
                          f"— defined {len(normal_binds)} times: {files_info}"
                      ),
                      "rule": "keybind-conflict"
                  })

          print(f"     Keybind conflicts: {conflicts_found}")

          # ── Summary ───────────────────────────────────────────────────────
          total_errors   = len(errors)
          total_warnings = len(warnings)
          total_lines    = sum(
              s.get("line_count", 0) for s in all_stats.values()
          )
          total_binds    = len(all_binds)
          total_monitors = len(all_monitors)

          print("")
          print("  📊 Parse Results:")
          print(f"     Files parsed:      {len(all_stats)}")
          print(f"     Total lines:       {total_lines}")
          print(f"     Total binds:       {total_binds}")
          print(f"     Monitor rules:     {total_monitors}")
          print(f"     Errors:            {total_errors}")
          print(f"     Warnings:          {total_warnings}")

          if errors:
              print("\n  🔴 ERRORS:")
              for e in errors:
                  print(f"     ❌ {e['file']}:{e['line']} [{e['rule']}]")
                  print(f"        {e['message']}")

          if warnings:
              print("\n  🟠 WARNINGS:")
              for w in warnings[:20]:
                  print(f"     ⚠️  {w['file']}:{w['line']} [{w['rule']}]")
                  print(f"        {w['message']}")
              if len(warnings) > 20:
                  print(f"     ... and {len(warnings)-20} more warnings")

          # Write outputs
          results = {
              "errors": errors,
              "warnings": warnings,
              "stats": {
                  "files": len(all_stats),
                  "lines": total_lines,
                  "binds": total_binds,
                  "monitors": total_monitors,
                  "keybind_conflicts": conflicts_found,
              }
          }

          with open("hyprland-lint-results.json", "w") as f:
              json.dump(results, f, indent=2)

          # Set exit code
          sys.exit(0 if total_errors == 0 else 1)

          PARSER
          parser_exit=$?

          echo ""
          # Parse outputs from JSON
          if [[ -f hyprland-lint-results.json ]]; then
            syntax_errors="$(jq '.errors | length' hyprland-lint-results.json 2>/dev/null || echo 0)"
            syntax_warnings="$(jq '.warnings | length' hyprland-lint-results.json 2>/dev/null || echo 0)"
          else
            syntax_errors=0
            syntax_warnings=0
          fi

          passed="true"
          [[ ${parser_exit} -ne 0 ]] && passed="false"
          [[ "${{ inputs.strict_mode || 'false' }}" == "true" && \
             ${syntax_warnings} -gt 0 ]] && passed="false"

          echo "syntax_errors=${syntax_errors}"     >> "${GITHUB_OUTPUT}"
          echo "syntax_warnings=${syntax_warnings}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"                   >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload Parse Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "hyprland-lint-results"
          path: hyprland-lint-results.json
          retention-days: 14
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: SHADER VALIDATION
  # ────────────────────────────────────────────────────────────────────────────
  shader-check:
    name: "🎨 Shader Files Validation"
    needs: discover
    if: >
      needs.discover.outputs.has-config == 'true' &&
      needs.discover.outputs.shader-files != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      passed: ${{ steps.shaders.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🎨 Validate GLSL Shaders"
        id: shaders
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🎨 GLSL Shader Validation                                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Install glslang for validation
          sudo apt-get install -qq -y glslang-tools 2>/dev/null || true

          shader_errors=0
          shader_warnings=0

          mapfile -t shader_files < <(
            find "${{ env.HYPR_CONFIG_DIR }}/shaders" \
              -type f \( -name "*.frag" -o -name "*.vert" -o -name "*.glsl" \) \
              2>/dev/null | sort
          )

          if [[ ${#shader_files[@]} -eq 0 ]]; then
            echo "  ℹ️  No shader files found"
            echo "passed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "  Found ${#shader_files[@]} shader files"
          echo ""

          for shader in "${shader_files[@]}"; do
            echo "  🎨 Checking: ${shader}"

            # Determine shader type
            ext="${shader##*.}"
            stage="frag"
            [[ "${ext}" == "vert" ]] && stage="vert"

            # Python-based GLSL syntax checker (basic)
            python3 << GLSLCHECK
          import re, sys

          shader_file = "${shader}"
          stage = "${stage}"
          errors_found = 0

          try:
              with open(shader_file) as f:
                  content = f.read()
                  lines = content.splitlines()
          except Exception as e:
              print(f"  ❌ Cannot read {shader_file}: {e}")
              sys.exit(1)

          # Check for #version directive
          has_version = any(l.strip().startswith("#version") for l in lines[:5])
          if not has_version:
              print(f"  ⚠️  Missing #version directive in {shader_file}")

          # Check for main function
          has_main = bool(re.search(r'void\s+main\s*\(', content))
          if not has_main:
              print(f"  ❌ Missing main() function in {shader_file}")
              errors_found += 1

          # Fragment shader must have gl_FragColor or out vec4
          if stage == "frag":
              has_output = (
                  "gl_FragColor" in content or
                  re.search(r'out\s+vec4', content) is not None
              )
              if not has_output:
                  print(f"  ⚠️  Fragment shader has no output variable")

          # Check for balanced braces
          open_braces  = content.count("{")
          close_braces = content.count("}")
          if open_braces != close_braces:
              print(f"  ❌ Unbalanced braces: {open_braces} open, {close_braces} close")
              errors_found += 1

          # Check for texture2D (deprecated in GLSL 130+)
          if "texture2D(" in content:
              print(f"  ⚠️  texture2D() is deprecated — use texture() instead")

          if errors_found == 0:
              print(f"  ✅ {shader_file}: OK")

          sys.exit(errors_found)
          GLSLCHECK

            [[ $? -ne 0 ]] && shader_errors=$((shader_errors + 1))
          done

          echo ""
          echo "  📊 Shader Check Results:"
          echo "  ├── Shaders checked: ${#shader_files[@]}"
          echo "  └── Errors:          ${shader_errors}"

          passed="true"
          [[ ${shader_errors} -gt 0 ]] && passed="false"

          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: STYLE CHECK — Line length, formatting
  # ────────────────────────────────────────────────────────────────────────────
  style-check:
    name: "📐 Style & Format Check"
    needs: discover
    if: needs.discover.outputs.has-config == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      passed: ${{ steps.style.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📐 Run Style Checks"
        id: style
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📐 Hyprland Config Style Analysis                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          style_warnings=0
          style_errors=0

          mapfile -t conf_files < <(
            find "${{ env.HYPR_CONFIG_DIR }}" -name "*.conf" | sort
          )

          echo "  Checking ${#conf_files[@]} config files..."
          echo ""

          for conf in "${conf_files[@]}"; do
            file_issues=0

            # ── Line length check (max 120) ───────────────────────────────
            long_lines="$(awk 'length > 120 && !/^\s*#/' "${conf}" | wc -l)"
            if [[ ${long_lines} -gt 0 ]]; then
              echo "  ⚠️  ${conf}: ${long_lines} lines exceed 120 chars"
              style_warnings=$((style_warnings + long_lines))
              file_issues=$((file_issues + long_lines))
            fi

            # ── Trailing whitespace ───────────────────────────────────────
            trailing="$(grep -cnE '\s+$' "${conf}" 2>/dev/null || echo 0)"
            if [[ ${trailing} -gt 0 ]]; then
              echo "  ⚠️  ${conf}: ${trailing} lines with trailing whitespace"
              style_warnings=$((style_warnings + trailing))
              file_issues=$((file_issues + trailing))
            fi

            # ── Tabs instead of spaces ────────────────────────────────────
            tabs="$(grep -cP '^\t' "${conf}" 2>/dev/null || echo 0)"
            if [[ ${tabs} -gt 0 ]]; then
              echo "  ⚠️  ${conf}: ${tabs} lines indented with tabs"
              style_warnings=$((style_warnings + tabs))
              file_issues=$((file_issues + tabs))
            fi

            # ── Missing newline at end of file ────────────────────────────
            if [[ -s "${conf}" ]]; then
              last_char="$(tail -c 1 "${conf}" | wc -l)"
              if [[ "${last_char}" -eq 0 ]]; then
                echo "  ⚠️  ${conf}: Missing newline at end of file"
                style_warnings=$((style_warnings + 1))
                file_issues=$((file_issues + 1))
              fi
            fi

            # ── Windows line endings ──────────────────────────────────────
            crlf="$(grep -cU $'\r' "${conf}" 2>/dev/null || echo 0)"
            if [[ ${crlf} -gt 0 ]]; then
              echo "  ❌ ${conf}: Windows line endings (CRLF) detected"
              style_errors=$((style_errors + 1))
            fi

            [[ ${file_issues} -eq 0 ]] && echo "  ✅ ${conf}"
          done

          # ── Comment quality check ─────────────────────────────────────────
          echo ""
          echo "  📝 Comment coverage:"
          for conf in "${conf_files[@]}"; do
            total_lines="$(wc -l < "${conf}")"
            comment_lines="$(grep -cE '^\s*#' "${conf}" || echo 0)"
            code_lines="$(grep -cE '^\s*[^#\s]' "${conf}" || echo 0)"
            if [[ ${code_lines} -gt 0 ]]; then
              ratio=$((comment_lines * 100 / code_lines))
              printf "     %-45s %d%% comment ratio\n" \
                "$(basename "${conf}")" "${ratio}"
            fi
          done

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  🟠 Style warnings: %-38s║\n" "${style_warnings}"
          printf "║  🔴 Style errors:   %-38s║\n" "${style_errors}"
          echo "╠══════════════════════════════════════════════════════════════╣"

          passed="true"
          [[ ${style_errors} -gt 0 ]] && passed="false"

          if [[ "${passed}" == "true" ]]; then
            echo "║  ✅ STATUS: PASSED                                          ║"
          else
            echo "║  ❌ STATUS: FAILED                                          ║"
          fi
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 05: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — Hyprland"
    needs: [discover, parse-validate, shader-check, style-check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "💬 Post PR Comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const syntaxErrors   = parseInt('${{ needs.parse-validate.outputs.syntax-errors || 0 }}');
            const syntaxWarnings = parseInt('${{ needs.parse-validate.outputs.syntax-warnings || 0 }}');
            const syntaxPassed   = '${{ needs.parse-validate.outputs.syntax-passed }}' === 'true';
            const shaderPassed   = '${{ needs.shader-check.outputs.passed || "true" }}' === 'true';
            const stylePassed    = '${{ needs.style-check.outputs.passed }}' === 'true';
            const confCount      = '${{ needs.discover.outputs.conf-count }}';

            const overallPassed = syntaxPassed && shaderPassed && stylePassed;
            const icon   = overallPassed ? '✅' : '❌';
            const status = overallPassed ? 'PASSED' : 'FAILED';

            const body = `## 🪟 Hyprland Config Analysis ${icon}

            **Status: ${status}** | Analyzed **${confCount}** config files

            | Check | Issues | Status |
            |-------|--------|--------|
            | 🔬 Syntax Parser | \`${syntaxErrors}\` errors, \`${syntaxWarnings}\` warnings | ${syntaxPassed ? '✅' : '❌'} |
            | 🎨 GLSL Shaders | Shader validation | ${shaderPassed ? '✅' : '❌'} |
            | 📐 Style/Format | Formatting check | ${stylePassed ? '✅' : '❌'} |
            | 🎹 Keybind Conflicts | Conflict detection | Checked |
            | 📺 Monitor Rules | Format validation | Checked |
            | 🔄 Deprecated APIs | Version check | Checked |
            | 🔒 Exec Security | Autostart audit | Checked |

            ${overallPassed
              ? '### ✨ All Hyprland config files pass validation!'
              : `### 🔧 Fix Required\n\nReview the lint output for specific issues in your Hyprland config files.\n\nCommon fixes:\n- Remove deprecated keywords\n- Fix bezier curve format: \`bezier = name, x1, y1, x2, y2\`\n- Check monitor rule format: \`monitor = name, res@rate, pos, scale\`\n- Remove duplicate keybinds`
            }

            ---
            *🤖 ASH Dotfiles Hyprland Lint • [Full Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🪟 Hyprland Config Analysis')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: "🚦 Evaluate Quality Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 Hyprland Quality Gate                                   ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          syntax_passed="${{ needs.parse-validate.outputs.syntax-passed || 'true' }}"
          shader_passed="${{ needs.shader-check.outputs.passed || 'true' }}"
          style_passed="${{ needs.style-check.outputs.passed || 'true' }}"
          has_config="${{ needs.discover.outputs.has-config }}"

          echo ""
          echo "  📊 Gate Summary:"
          echo "  ├── Syntax:  ${syntax_passed}"
          echo "  ├── Shaders: ${shader_passed}"
          echo "  └── Style:   ${style_passed}"
          echo ""

          if [[ "${has_config}" == "false" ]]; then
            echo "  ℹ️  No Hyprland config found — gate skipped"
            exit 0
          fi

          all_passed="true"
          [[ "${syntax_passed}" != "true" ]] && all_passed="false"
          [[ "${shader_passed}" != "true" ]] && all_passed="false"
          [[ "${style_passed}" != "true" ]] && all_passed="false"

          if [[ "${all_passed}" == "true" ]]; then
            echo "  ✅ QUALITY GATE: PASSED"
            echo "  🎉 All Hyprland config files are valid!"
          else
            echo "  ❌ QUALITY GATE: FAILED"
            exit 1
          fi