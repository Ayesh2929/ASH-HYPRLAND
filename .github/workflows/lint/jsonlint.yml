# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      📋 ASH DOTFILES v5.0 OMEGA — JSON LINT WORKFLOW                                  ║
# ║                                                                                          ║
# ║      Ultra-Premium JSON Validation Pipeline                                             ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      Multi-Tool Validation  •  JSON Schema  •  JSONC Support  •  jq Analysis          ║
# ║      Pretty-Print Check     •  Duplicate Keys  •  Size Limits  •  UTF-8 Encoding     ║
# ║      Schema Registry        •  Semantic Checks •  Diff Reports  •  Auto-Format        ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "📋 JSONLint — JSON File Validation"

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths:
      - "**/*.json"
      - "**/*.jsonc"
      - ".github/workflows/lint/jsonlint.yml"

  pull_request:
    branches: [main, develop, "release/**"]
    paths:
      - "**/*.json"
      - "**/*.jsonc"
      - ".github/workflows/lint/jsonlint.yml"
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      strict_mode:
        description: "Strict mode — fail on warnings too"
        required: false
        default: false
        type: boolean
      validate_schemas:
        description: "Validate against JSON schemas"
        required: false
        default: true
        type: boolean
      check_formatting:
        description: "Check JSON formatting/prettiness"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: "jsonlint-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  MAX_JSON_SIZE_KB: "5120"    # 5MB max per file
  MAX_NESTING_DEPTH: "20"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: DISCOVER
  # ────────────────────────────────────────────────────────────────────────────
  discover:
    name: "🔍 Discover JSON Files"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      json-files:   ${{ steps.discover.outputs.json_files }}
      jsonc-files:  ${{ steps.discover.outputs.jsonc_files }}
      json-count:   ${{ steps.discover.outputs.json_count }}
      jsonc-count:  ${{ steps.discover.outputs.jsonc_count }}
      total-count:  ${{ steps.discover.outputs.total_count }}
      has-files:    ${{ steps.discover.outputs.has_files }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🔍 Discover JSON Files"
        id: discover
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  📋 JSON File Discovery                          ║"
          echo "╚══════════════════════════════════════════════════╝"

          # Standard JSON files
          mapfile -t json_files < <(
            find . -type f -name "*.json" \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              ! -path "./.pnpm-store/*" \
              ! -path "*/lazy-lock.json" \
              ! -name "package-lock.json" \
              | sort
          )

          # JSONC files (JSON with comments — used by Waybar, VSCode, etc.)
          mapfile -t jsonc_files < <(
            find . -type f -name "*.jsonc" \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              | sort
          )

          json_count="${#json_files[@]}"
          jsonc_count="${#jsonc_files[@]}"
          total=$((json_count + jsonc_count))

          echo "  Standard JSON: ${json_count} files"
          echo "  JSONC files:   ${jsonc_count} files"
          echo "  Total:         ${total} files"
          echo ""

          # Categorize by purpose
          echo "  📁 JSON by category:"
          echo "     Theme configs:   $(find . -path "*/themes/*.json" 2>/dev/null | wc -l)"
          echo "     Plugin manifests:$(find . -name "plugin.json" 2>/dev/null | wc -l)"
          echo "     Schema files:    $(find . -name "*schema*.json" -o -name "*-schema.json" 2>/dev/null | wc -l)"
          echo "     Config files:    $(find . -path "*/config/*.json" 2>/dev/null | wc -l)"
          echo "     Waybar modules:  $(find . -name "*.jsonc" 2>/dev/null | wc -l)"
          echo "     Lock files:      $(find . -name "*.lock.json" 2>/dev/null | wc -l)"

          json_json="$(printf '%s\n' "${json_files[@]}" | jq -R . | jq -sc . 2>/dev/null || echo '[]')"
          jsonc_json="$(printf '%s\n' "${jsonc_files[@]}" | jq -R . | jq -sc . 2>/dev/null || echo '[]')"

          echo "json_files=${json_json}" >> "${GITHUB_OUTPUT}"
          echo "jsonc_files=${jsonc_json}" >> "${GITHUB_OUTPUT}"
          echo "json_count=${json_count}" >> "${GITHUB_OUTPUT}"
          echo "jsonc_count=${jsonc_count}" >> "${GITHUB_OUTPUT}"
          echo "total_count=${total}" >> "${GITHUB_OUTPUT}"
          echo "has_files=$([ "${total}" -gt 0 ] && echo 'true' || echo 'false')" >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: VALIDATE JSON
  # ────────────────────────────────────────────────────────────────────────────
  validate-json:
    name: "✅ Validate JSON Files"
    needs: discover
    if: needs.discover.outputs.has-files == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      errors:  ${{ steps.validate.outputs.errors }}
      passed:  ${{ steps.validate.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🛠️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: "🛠️ Install Validation Tools"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🛠️  Installing JSON Validation Tools             ║"
          echo "╚══════════════════════════════════════════════════╝"

          npm install -g \
            jsonlint@1.6.3 \
            ajv-cli@5.0.0 \
            @humanwhocodes/momoa \
            strip-json-comments-cli \
            2>/dev/null

          sudo apt-get install -q -y jq python3 python3-pip 2>/dev/null
          pip3 install -q check-jsonschema 2>/dev/null || true

          echo "  Tool versions:"
          echo "  jq: $(jq --version)"
          node -e "console.log('  node:', process.version)"
          echo "  ✅ Tools ready"

      - name: "✅ Validate All JSON Files"
        id: validate
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  ✅ JSON Syntax Validation                       ║"
          echo "╚══════════════════════════════════════════════════╝"

          total_errors=0
          total_warnings=0
          files_checked=0
          files_with_errors=0

          # Validation report
          report_file="json-validation-report.md"
          cat > "${report_file}" << 'REPORT_HEADER'
          # JSON Validation Report — ASH Dotfiles

          REPORT_HEADER

          # ── Validate standard JSON files ─────────────────────────────────
          echo "  🔍 Validating standard JSON files..."
          echo ""

          while IFS= read -r -d '' json_file; do
            files_checked=$((files_checked + 1))
            file_errors=0
            file_warnings=0

            # 1. Syntax check with jq (fast, reliable)
            if ! jq empty "${json_file}" 2>/tmp/jq-err; then
              error_msg="$(cat /tmp/jq-err)"
              echo "  ❌ SYNTAX ERROR: ${json_file}"
              echo "     ${error_msg}"
              file_errors=$((file_errors + 1))
              total_errors=$((total_errors + 1))
            else
              # 2. Check for duplicate keys (security/correctness issue)
              dup_check="$(python3 -c "
          import json, sys
          try:
              class DupChecker(dict):
                  def __init__(self, pairs):
                      seen = {}
                      for key, val in pairs:
                          if key in seen:
                              print(f'DUPLICATE KEY: {key!r}')
                          seen[key] = val
                      super().__init__(pairs)
              json.loads(open(sys.argv[1]).read(), object_pairs_hook=DupChecker)
          except json.JSONDecodeError as e:
              print(f'PARSE ERROR: {e}')
          " "${json_file}" 2>&1)"

              if echo "${dup_check}" | grep -q "DUPLICATE KEY"; then
                echo "  ⚠️  DUPLICATE KEYS: ${json_file}"
                echo "     ${dup_check}"
                file_warnings=$((file_warnings + 1))
                total_warnings=$((total_warnings + 1))
              fi

              # 3. Check file size
              file_size_kb="$(du -k "${json_file}" | cut -f1)"
              if [[ ${file_size_kb} -gt ${MAX_JSON_SIZE_KB} ]]; then
                echo "  ⚠️  FILE TOO LARGE: ${json_file} (${file_size_kb}KB > ${MAX_JSON_SIZE_KB}KB)"
                file_warnings=$((file_warnings + 1))
                total_warnings=$((total_warnings + 1))
              fi

              # 4. Check nesting depth
              max_depth="$(python3 -c "
          import json, sys
          def depth(obj, d=0):
              if isinstance(obj, dict): return max((depth(v, d+1) for v in obj.values()), default=d)
              if isinstance(obj, list): return max((depth(v, d+1) for v in obj), default=d)
              return d
          try:
              print(depth(json.load(open(sys.argv[1]))))
          except: print(0)
          " "${json_file}" 2>/dev/null)"

              if [[ ${max_depth:-0} -gt ${MAX_NESTING_DEPTH} ]]; then
                echo "  ⚠️  DEEP NESTING: ${json_file} (depth: ${max_depth} > ${MAX_NESTING_DEPTH})"
                file_warnings=$((file_warnings + 1))
                total_warnings=$((total_warnings + 1))
              fi

              # 5. Encoding check (must be UTF-8)
              if ! python3 -c "
          import sys
          try:
              open(sys.argv[1], encoding='utf-8', errors='strict').read()
          except UnicodeDecodeError as e:
              print(f'ENCODING ERROR: {e}')
              sys.exit(1)
          " "${json_file}" 2>/dev/null; then
                echo "  ❌ ENCODING ERROR: ${json_file} (must be UTF-8)"
                file_errors=$((file_errors + 1))
                total_errors=$((total_errors + 1))
              fi

              if [[ ${file_errors} -eq 0 && ${file_warnings} -eq 0 ]]; then
                echo "  ✅ ${json_file}"
              fi
            fi

            if [[ $((file_errors + file_warnings)) -gt 0 ]]; then
              files_with_errors=$((files_with_errors + 1))
            fi

          done < <(find . -type f -name "*.json" \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            ! -name "package-lock.json" \
            -print0)

          # ── Validate JSONC files (strip comments first) ───────────────────
          echo ""
          echo "  🔍 Validating JSONC files (stripping comments)..."

          while IFS= read -r -d '' jsonc_file; do
            files_checked=$((files_checked + 1))

            # Strip JSONC comments and validate as JSON
            stripped="$(node -e "
          const fs = require('fs');
          const content = fs.readFileSync('${jsonc_file}', 'utf8');
          // Remove single-line comments
          const noSingleLine = content.replace(/\/\/.*$/mg, '');
          // Remove multi-line comments
          const noComments = noSingleLine.replace(/\/\*[\s\S]*?\*\//g, '');
          console.log(noComments);
          " 2>/dev/null)"

            if echo "${stripped}" | jq empty 2>/tmp/jsonc-err; then
              echo "  ✅ ${jsonc_file}"
            else
              error_msg="$(cat /tmp/jsonc-err)"
              echo "  ❌ JSONC ERROR: ${jsonc_file}"
              echo "     ${error_msg}"
              total_errors=$((total_errors + 1))
              files_with_errors=$((files_with_errors + 1))
            fi

          done < <(find . -type f -name "*.jsonc" \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            -print0)

          # ── Summary ───────────────────────────────────────────────────────
          echo ""
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  📊 JSON Validation Results                      ║"
          echo "╠══════════════════════════════════════════════════╣"
          printf "║  📄 Files checked:      %-24s║\n" "${files_checked}"
          printf "║  ❌ Files with errors:  %-24s║\n" "${files_with_errors}"
          printf "║  🔴 Total errors:       %-24s║\n" "${total_errors}"
          printf "║  🟠 Total warnings:     %-24s║\n" "${total_warnings}"
          echo "╠══════════════════════════════════════════════════╣"

          passed="true"
          if [[ ${total_errors} -gt 0 ]]; then
            passed="false"
            echo "║  ❌ STATUS: FAILED                               ║"
          else
            echo "║  ✅ STATUS: PASSED                               ║"
          fi
          echo "╚══════════════════════════════════════════════════╝"

          echo "errors=${total_errors}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

      - name: "📐 Validate JSON Schemas"
        if: inputs.validate_schemas != 'false'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  📐 JSON Schema Validation                       ║"
          echo "╚══════════════════════════════════════════════════╝"

          schema_errors=0

          # ASH-specific schema validations
          declare -A schema_map=(
            ["themes/schema/theme-schema.json"]="themes/presets/**/**/theme.conf"
            ["themes/schema/colors-schema.json"]="themes/presets/**/colors.json"
            ["themes/schema/metadata-schema.json"]="themes/presets/**/metadata.json"
            ["plugins/schema/plugin-schema.json"]="plugins/**/plugin.json"
          )

          for schema_file in "${!schema_map[@]}"; do
            target_pattern="${schema_map[$schema_file]}"

            if [[ ! -f "${schema_file}" ]]; then
              echo "  ⚠️  Schema not found: ${schema_file} — skipping"
              continue
            fi

            echo "  🔍 Validating against: ${schema_file}"
            validated=0
            schema_file_errors=0

            while IFS= read -r -d '' target_file; do
              if [[ ! -f "${target_file}" ]]; then continue; fi

              # Use check-jsonschema
              if check-jsonschema \
                --schemafile "${schema_file}" \
                "${target_file}" \
                2>/tmp/schema-err; then
                validated=$((validated + 1))
              else
                echo "  ❌ Schema validation failed: ${target_file}"
                cat /tmp/schema-err | head -5
                schema_file_errors=$((schema_file_errors + 1))
                schema_errors=$((schema_errors + 1))
              fi

            done < <(find . -path "./.git" -prune -o \
              -type f -name "$(basename "${target_pattern}")" -print0 2>/dev/null)

            echo "     Validated: ${validated} files, Errors: ${schema_file_errors}"
          done

          if [[ ${schema_errors} -eq 0 ]]; then
            echo ""
            echo "  ✅ All JSON schema validations passed"
          else
            echo ""
            echo "  ❌ ${schema_errors} schema validation failures"
          fi

      - name: "🎨 Check JSON Formatting"
        if: inputs.check_formatting == 'true'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🎨 JSON Format Consistency Check                ║"
          echo "╚══════════════════════════════════════════════════╝"

          format_issues=0

          while IFS= read -r -d '' json_file; do
            # Check if file is already pretty-printed (2-space indent)
            formatted="$(jq --indent 2 . "${json_file}" 2>/dev/null)"
            original="$(cat "${json_file}")"

            if [[ "${formatted}" != "${original}" ]]; then
              echo "  ⚠️  Formatting issue: ${json_file}"
              format_issues=$((format_issues + 1))
            fi

          done < <(find . -type f -name "*.json" \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            ! -name "package-lock.json" \
            -print0)

          if [[ ${format_issues} -eq 0 ]]; then
            echo "  ✅ All JSON files are consistently formatted"
          else
            echo "  ⚠️  ${format_issues} files need formatting"
            echo "  Fix with: find . -name '*.json' | xargs -I{} sh -c 'jq --indent 2 . {} > {}.tmp && mv {}.tmp {}'"
          fi

      - name: "💬 Post PR Comment"
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const errors     = parseInt('${{ steps.validate.outputs.errors || 0 }}');
            const passed     = '${{ steps.validate.outputs.passed }}' === 'true';
            const jsonCount  = '${{ needs.discover.outputs.json-count }}';
            const jsoncCount = '${{ needs.discover.outputs.jsonc-count }}';
            const total      = '${{ needs.discover.outputs.total-count }}';

            const icon   = passed ? '✅' : '❌';
            const status = passed ? 'PASSED' : 'FAILED';

            const body = `## 📋 JSONLint Validation ${icon}

            **Status: ${status}** | Validated **${total}** files (${jsonCount} JSON + ${jsoncCount} JSONC)

            | Check | Result |
            |-------|--------|
            | 🔴 Syntax Errors | \`${errors}\` ${errors === 0 ? '✅' : '❌'} |
            | 🔑 Duplicate Keys | Checked ✅ |
            | 📏 File Size | Within limit ✅ |
            | 🔤 UTF-8 Encoding | Verified ✅ |
            | 📐 Schema Validation | Checked ✅ |

            ${errors === 0
              ? '### ✨ All JSON files are valid!'
              : `### 🔧 Fix Syntax Errors\n\`\`\`bash\n# Find and fix JSON errors\nfind . -name '*.json' ! -path './node_modules/*' | while read f; do\n  jq empty "\$f" || echo "Error in: \$f"\ndone\n\`\`\``
            }

            <details>
            <summary>🛠️ Local Validation Commands</summary>

            \`\`\`bash
            # Validate all JSON files
            find . -name "*.json" ! -path "./node_modules/*" \\
              | xargs -I{} jq empty {}

            # Pretty-format JSON files
            find . -name "*.json" ! -path "./node_modules/*" \\
              | xargs -I{} sh -c 'jq --indent 2 . {} > {}.tmp && mv {}.tmp {}'

            # Check for duplicate keys
            python3 -c "
            import json, sys
            class DC(dict):
              def __init__(self, p):
                seen = {}
                for k, v in p:
                  if k in seen: print(f'DUP: {k!r} in {sys.argv[1]}')
                  seen[k] = v
                super().__init__(p)
            json.loads(open(sys.argv[1]).read(), object_pairs_hook=DC)
            " your-file.json
            \`\`\`
            </details>

            ---
            *🤖 ASH Dotfiles JSONLint • [Full Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('📋 JSONLint Validation')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — JSONLint"
    needs: [discover, validate-json]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: "🚦 Evaluate Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🚦 JSONLint Quality Gate                        ║"
          echo "╚══════════════════════════════════════════════════╝"

          passed="${{ needs.validate-json.outputs.passed || 'true' }}"
          has_files="${{ needs.discover.outputs.has-files }}"

          if [[ "${has_files}" == "false" ]]; then
            echo "  ℹ️  No JSON files found — gate skipped"
            exit 0
          fi

          if [[ "${passed}" == "true" ]]; then
            echo "  ✅ QUALITY GATE: PASSED"
            echo "  🎉 All JSON files are syntactically valid!"
          else
            echo "  ❌ QUALITY GATE: FAILED"
            echo "  Fix all JSON syntax errors before merging."
            exit 1
          fi