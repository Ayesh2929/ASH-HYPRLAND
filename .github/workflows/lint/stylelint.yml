# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🎨 ASH DOTFILES v5.0 OMEGA — STYLELINT WORKFLOW                                  ║
# ║                                                                                          ║
# ║      Ultra-Premium CSS / SCSS / SASS Analysis Pipeline                                  ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      Stylelint v16+       •  CSS Variables Audit   •  Waybar CSS Analysis             ║
# ║      GTK Theme Validation •  SCSS Compilation      •  AGS Stylesheet Check            ║
# ║      Custom Properties    •  Color Consistency     •  Specificity Analysis            ║
# ║      Accessibility Audit  •  Performance Rules     •  SARIF Upload                   ║
# ║      Auto-Fix Suggestions •  Prettier Integration  •  PR Annotations                 ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🎨 Stylelint — CSS/SCSS/SASS Analysis"

# ══════════════════════════════════════════════════════════════════════════════
# TRIGGER CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
    paths:
      - "**/*.css"
      - "**/*.scss"
      - "**/*.sass"
      - "**/*.less"
      - ".stylelintrc*"
      - ".stylelintignore"
      - ".github/workflows/lint/stylelint.yml"

  pull_request:
    branches:
      - main
      - develop
      - "release/**"
    paths:
      - "**/*.css"
      - "**/*.scss"
      - "**/*.sass"
      - "**/*.less"
      - ".stylelintrc*"
      - ".github/workflows/lint/stylelint.yml"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:
    inputs:
      severity:
        description: "Minimum severity to report"
        required: false
        default: "warning"
        type: choice
        options: [error, warning]
      fix_mode:
        description: "Run in auto-fix mode (report only — no commits)"
        required: false
        default: false
        type: boolean
      validate_variables:
        description: "Validate CSS custom property consistency"
        required: false
        default: true
        type: boolean
      check_gtk_themes:
        description: "Run GTK CSS theme validation"
        required: false
        default: true
        type: boolean
      check_waybar:
        description: "Run Waybar CSS analysis"
        required: false
        default: true
        type: boolean

  schedule:
    - cron: "0 3 * * *"

# ══════════════════════════════════════════════════════════════════════════════
# PERMISSIONS
# ══════════════════════════════════════════════════════════════════════════════
permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

# ══════════════════════════════════════════════════════════════════════════════
# CONCURRENCY
# ══════════════════════════════════════════════════════════════════════════════
concurrency:
  group: "stylelint-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════════════════
# GLOBAL ENV
# ══════════════════════════════════════════════════════════════════════════════
env:
  NODE_VERSION: "20"
  STYLELINT_VERSION: "16.3.1"
  PNPM_VERSION: "9"
  # ASH color variable prefix for custom property validation
  ASH_COLOR_PREFIX: "--ash-"
  # Maximum CSS file size (KB)
  MAX_CSS_SIZE_KB: "500"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: DISCOVER — Find all stylesheets
  # ────────────────────────────────────────────────────────────────────────────
  discover:
    name: "🔍 Discover Stylesheets"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      css-files:    ${{ steps.discover.outputs.css_files }}
      scss-files:   ${{ steps.discover.outputs.scss_files }}
      sass-files:   ${{ steps.discover.outputs.sass_files }}
      total-count:  ${{ steps.discover.outputs.total_count }}
      has-styles:   ${{ steps.discover.outputs.has_styles }}
      waybar-css:   ${{ steps.discover.outputs.waybar_css }}
      gtk-css:      ${{ steps.discover.outputs.gtk_css }}
      ags-scss:     ${{ steps.discover.outputs.ags_scss }}

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🔍 Discover All Stylesheet Files"
        id: discover
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🎨 Stylesheet Discovery Engine                  ║"
          echo "╚══════════════════════════════════════════════════╝"

          # Standard CSS files
          mapfile -t css_files < <(
            find . -type f -name "*.css" \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              ! -path "./.pnpm-store/*" \
              ! -name "*.min.css" \
              | sort
          )

          # SCSS files
          mapfile -t scss_files < <(
            find . -type f -name "*.scss" \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              ! -name "_*.scss" \
              | sort
          )

          # SASS files
          mapfile -t sass_files < <(
            find . -type f -name "*.sass" \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              | sort
          )

          # Waybar-specific CSS
          mapfile -t waybar_css < <(
            find ./config/waybar -type f -name "*.css" 2>/dev/null | sort
          )

          # GTK theme CSS
          mapfile -t gtk_css < <(
            find ./config/gtk-3.0 ./config/gtk-4.0 \
              -type f -name "*.css" 2>/dev/null | sort
          )

          # AGS SCSS
          mapfile -t ags_scss < <(
            find ./config/ags -type f \( -name "*.scss" -o -name "*.css" \) \
              2>/dev/null | sort
          )

          total=$((${#css_files[@]} + ${#scss_files[@]} + ${#sass_files[@]}))

          echo ""
          echo "  📊 Stylesheet Inventory:"
          echo "  ├── CSS files:      ${#css_files[@]}"
          echo "  ├── SCSS files:     ${#scss_files[@]}"
          echo "  ├── SASS files:     ${#sass_files[@]}"
          echo "  ├── Total:          ${total}"
          echo "  │"
          echo "  ├── By Component:"
          echo "  │   ├── Waybar CSS: ${#waybar_css[@]}"
          echo "  │   ├── GTK CSS:    ${#gtk_css[@]}"
          echo "  │   ├── AGS SCSS:   ${#ags_scss[@]}"
          echo "  │   ├── Rofi:       $(find ./config/rofi -name "*.css" 2>/dev/null | wc -l)"
          echo "  │   ├── Hyprlock:   $(find ./config/hyprlock -name "*.css" 2>/dev/null | wc -l)"
          echo "  │   └── Web:        $(find ./web/src/styles -name "*.css" 2>/dev/null | wc -l)"

          # Build JSON arrays
          css_json="$(printf '%s\n' "${css_files[@]}" | jq -R . | jq -sc . 2>/dev/null || echo '[]')"
          scss_json="$(printf '%s\n' "${scss_files[@]}" | jq -R . | jq -sc . 2>/dev/null || echo '[]')"
          sass_json="$(printf '%s\n' "${sass_files[@]}" | jq -R . | jq -sc . 2>/dev/null || echo '[]')"
          waybar_json="$(printf '%s\n' "${waybar_css[@]}" | jq -R . | jq -sc . 2>/dev/null || echo '[]')"
          gtk_json="$(printf '%s\n' "${gtk_css[@]}" | jq -R . | jq -sc . 2>/dev/null || echo '[]')"
          ags_json="$(printf '%s\n' "${ags_scss[@]}" | jq -R . | jq -sc . 2>/dev/null || echo '[]')"

          echo "css_files=${css_json}"     >> "${GITHUB_OUTPUT}"
          echo "scss_files=${scss_json}"   >> "${GITHUB_OUTPUT}"
          echo "sass_files=${sass_json}"   >> "${GITHUB_OUTPUT}"
          echo "total_count=${total}"      >> "${GITHUB_OUTPUT}"
          echo "waybar_css=${waybar_json}" >> "${GITHUB_OUTPUT}"
          echo "gtk_css=${gtk_json}"       >> "${GITHUB_OUTPUT}"
          echo "ags_scss=${ags_json}"      >> "${GITHUB_OUTPUT}"
          echo "has_styles=$([ "${total}" -gt 0 ] && echo 'true' || echo 'false')" \
            >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: SETUP — Install dependencies
  # ────────────────────────────────────────────────────────────────────────────
  setup:
    name: "🛠️ Setup Node.js & Stylelint"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: "🛠️ Install Stylelint & Plugins"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🛠️  Installing Stylelint Toolchain               ║"
          echo "╚══════════════════════════════════════════════════╝"

          pnpm add -D \
            "stylelint@${{ env.STYLELINT_VERSION }}" \
            stylelint-config-standard \
            stylelint-config-standard-scss \
            stylelint-config-recommended \
            stylelint-config-prettier \
            stylelint-order \
            stylelint-scss \
            stylelint-a11y \
            stylelint-declaration-block-no-ignored-properties \
            stylelint-no-unsupported-browser-features \
            stylelint-high-performance-animation \
            stylelint-csstree-validator \
            @stylelint/postcss-css-in-js \
            postcss-scss \
            postcss-sass \
            prettier \
            2>/dev/null

          echo ""
          echo "  📦 Installed packages:"
          echo "  ├── stylelint: $(pnpm list stylelint --depth=0 | grep stylelint | head -1)"
          echo "  ├── stylelint-order: $(pnpm list stylelint-order --depth=0 | grep stylelint-order | head -1)"
          echo "  ├── stylelint-scss: installed"
          echo "  └── stylelint-a11y: installed"
          echo ""
          echo "  ✅ Stylelint toolchain ready"

      - name: "⚙️ Generate Stylelint Config"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  ⚙️  Stylelint Configuration                      ║"
          echo "╚══════════════════════════════════════════════════╝"

          if [[ -f .stylelintrc.json ]] || [[ -f .stylelintrc.js ]] || [[ -f .stylelintrc.yml ]]; then
            echo "  ✅ Using existing repository Stylelint config"
          else
            echo "  ℹ️  Generating comprehensive Stylelint config..."

            cat > .stylelintrc.json << 'STYLELINTRC'
          {
            "$schema": "https://json.schemastore.org/stylelintrc.json",
            "extends": [
              "stylelint-config-standard",
              "stylelint-config-standard-scss"
            ],
            "plugins": [
              "stylelint-order",
              "stylelint-scss",
              "stylelint-a11y",
              "stylelint-declaration-block-no-ignored-properties",
              "stylelint-high-performance-animation"
            ],
            "customSyntax": "postcss-scss",
            "rules": {
              "color-no-invalid-hex": true,
              "color-named": "never",
              "color-no-undefined-variables": [
                true,
                {
                  "severity": "warning"
                }
              ],
              "font-family-no-duplicate-names": true,
              "font-family-no-missing-generic-family-keyword": true,
              "font-family-name-quotes": "always-where-recommended",
              "function-calc-no-unspaced-operator": true,
              "function-linear-gradient-no-nonstandard-direction": true,
              "function-no-unknown": [
                true,
                {
                  "ignoreFunctions": ["theme", "alpha", "mix", "shade", "tint"]
                }
              ],
              "unit-no-unknown": true,
              "property-no-unknown": [
                true,
                {
                  "ignoreProperties": [
                    "-gtk-icon-source",
                    "-gtk-icon-size",
                    "-gtk-icon-effect",
                    "-gtk-icon-shadow",
                    "-gtk-icon-transform",
                    "-gtk-outline-radius",
                    "-gtk-secondary-caret-color"
                  ]
                }
              ],
              "property-no-vendor-prefix": true,
              "value-no-vendor-prefix": true,
              "selector-pseudo-class-no-unknown": [
                true,
                {
                  "ignorePseudoClasses": [
                    "global",
                    "local",
                    "focus-visible",
                    "has",
                    "is",
                    "where"
                  ]
                }
              ],
              "selector-pseudo-element-no-unknown": [
                true,
                {
                  "ignorePseudoElements": [
                    "slider",
                    "thumb",
                    "track",
                    "backdrop",
                    "selection",
                    "slotted"
                  ]
                }
              ],
              "selector-type-no-unknown": [
                true,
                {
                  "ignoreTypes": [
                    "slider",
                    "trough",
                    "contents",
                    "indicator",
                    "decoration",
                    "action",
                    "button"
                  ]
                }
              ],
              "no-duplicate-selectors": true,
              "no-duplicate-at-import-rules": true,
              "no-invalid-position-at-import-rule": true,
              "declaration-block-no-duplicate-properties": [
                true,
                {
                  "ignore": ["consecutive-duplicates-with-different-values"]
                }
              ],
              "declaration-block-no-shorthand-property-overrides": true,
              "block-no-empty": true,
              "comment-no-empty": true,
              "no-empty-source": true,

              "alpha-value-notation": "percentage",
              "color-function-notation": "modern",
              "hue-degree-notation": "angle",
              "import-notation": "string",
              "keyframe-selector-notation": "percentage-unless-within-keyword-only-block",
              "selector-pseudo-element-colon-notation": "double",

              "indentation": 2,
              "max-line-length": [
                120,
                {
                  "ignore": ["comments"]
                }
              ],
              "no-eol-whitespace": true,
              "no-missing-end-of-source-newline": true,

              "order/order": [
                "custom-properties",
                "dollar-variables",
                {
                  "type": "at-rule",
                  "name": "extend"
                },
                {
                  "type": "at-rule",
                  "name": "include",
                  "hasBlock": false
                },
                "declarations",
                {
                  "type": "at-rule",
                  "name": "include",
                  "hasBlock": true
                },
                "rules"
              ],

              "order/properties-order": [
                "content",
                "position",
                "top",
                "right",
                "bottom",
                "left",
                "z-index",
                "display",
                "flex",
                "flex-flow",
                "flex-direction",
                "flex-wrap",
                "justify-content",
                "align-items",
                "align-content",
                "grid",
                "grid-template",
                "grid-template-columns",
                "grid-template-rows",
                "grid-template-areas",
                "gap",
                "width",
                "min-width",
                "max-width",
                "height",
                "min-height",
                "max-height",
                "margin",
                "margin-top",
                "margin-right",
                "margin-bottom",
                "margin-left",
                "padding",
                "padding-top",
                "padding-right",
                "padding-bottom",
                "padding-left",
                "border",
                "border-radius",
                "background",
                "background-color",
                "background-image",
                "background-position",
                "background-size",
                "color",
                "font",
                "font-family",
                "font-size",
                "font-weight",
                "font-style",
                "line-height",
                "text-align",
                "text-decoration",
                "opacity",
                "visibility",
                "overflow",
                "cursor",
                "transition",
                "animation",
                "transform",
                "box-shadow",
                "outline"
              ],

              "plugin/declaration-block-no-ignored-properties": true,
              "plugin/no-unsupported-browser-features": [
                true,
                {
                  "severity": "warning",
                  "ignorePartialSupport": true,
                  "browsers": [
                    "last 2 Chrome versions",
                    "last 2 Firefox versions"
                  ]
                }
              ],
              "plugin/no-low-performance-animation-properties": [
                true,
                {
                  "severity": "warning"
                }
              ],

              "scss/at-rule-no-unknown": [
                true,
                {
                  "ignoreAtRules": [
                    "tailwind",
                    "apply",
                    "layer",
                    "config",
                    "plugin"
                  ]
                }
              ],
              "scss/dollar-variable-colon-space-after": "always",
              "scss/dollar-variable-colon-space-before": "never",
              "scss/dollar-variable-no-missing-interpolation": true,
              "scss/double-slash-comment-whitespace-inside": "always",
              "scss/no-duplicate-dollar-variables": [
                true,
                {
                  "ignoreInside": ["at-rule"]
                }
              ],
              "scss/selector-no-redundant-nesting-selector": true,

              "a11y/content-property-no-static-value": false,
              "a11y/no-display-none": true,
              "a11y/no-obsolete-element": true,
              "a11y/no-text-align-justify": true,
              "a11y/selector-pseudo-class-focus": true
            },
            "overrides": [
              {
                "files": ["config/waybar/**/*.css"],
                "rules": {
                  "selector-type-no-unknown": false,
                  "property-no-unknown": false,
                  "no-descending-specificity": null,
                  "color-named": null
                }
              },
              {
                "files": ["config/gtk-3.0/**/*.css", "config/gtk-4.0/**/*.css"],
                "rules": {
                  "selector-type-no-unknown": false,
                  "property-no-unknown": false,
                  "selector-pseudo-class-no-unknown": false,
                  "selector-pseudo-element-no-unknown": false,
                  "value-no-vendor-prefix": false,
                  "color-named": null
                }
              },
              {
                "files": ["config/rofi/**/*.css"],
                "rules": {
                  "selector-type-no-unknown": false,
                  "property-no-unknown": false,
                  "color-named": null
                }
              },
              {
                "files": ["config/ags/**/*.scss", "config/ags/**/*.css"],
                "rules": {
                  "import-notation": null,
                  "color-named": null
                }
              }
            ],
            "ignoreFiles": [
              "node_modules/**",
              "**/*.min.css",
              ".pnpm-store/**",
              "dist/**",
              "build/**"
            ]
          }
          STYLELINTRC

            echo "  ✅ Stylelint config generated"
          fi

      - name: "📤 Cache Config"
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            .pnpm-store
            .stylelintrc.json
          key: "stylelint-${{ hashFiles('package.json', '.stylelintrc*') }}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: ANALYZE — Run Stylelint
  # ────────────────────────────────────────────────────────────────────────────
  analyze:
    name: "🔬 Stylelint Analysis"
    needs: [discover, setup]
    if: needs.discover.outputs.has-styles == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    outputs:
      errors:   ${{ steps.stylelint.outputs.errors }}
      warnings: ${{ steps.stylelint.outputs.warnings }}
      passed:   ${{ steps.stylelint.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: "📥 Restore Cache"
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            .pnpm-store
            .stylelintrc.json
          key: "stylelint-${{ hashFiles('package.json', '.stylelintrc*') }}"
          restore-keys: "stylelint-"

      - name: "🔬 Run Stylelint — CSS Files"
        id: stylelint-css
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🎨 CSS Analysis                                 ║"
          echo "╚══════════════════════════════════════════════════╝"

          css_count="$(find . -name "*.css" ! -path "./.git/*" ! -path "./node_modules/*" ! -name "*.min.css" | wc -l)"
          echo "  Analyzing ${css_count} CSS files..."

          if [[ "${css_count}" -eq 0 ]]; then
            echo "  ℹ️  No CSS files found — skipping"
            echo "errors=0" >> "${GITHUB_OUTPUT}"
            echo "warnings=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          pnpm stylelint \
            "**/*.css" \
            "!node_modules/**" \
            "!**/*.min.css" \
            --formatter=json \
            --allow-empty-input \
            2>/dev/null > stylelint-css.json || true

          # Count results
          errors="$(cat stylelint-css.json | jq '[.[].warnings[] | select(.severity == "error")] | length' 2>/dev/null || echo 0)"
          warnings="$(cat stylelint-css.json | jq '[.[].warnings[] | select(.severity == "warning")] | length' 2>/dev/null || echo 0)"

          echo "  CSS Results: ${errors} errors, ${warnings} warnings"
          echo "errors=${errors}" >> "${GITHUB_OUTPUT}"
          echo "warnings=${warnings}" >> "${GITHUB_OUTPUT}"

      - name: "🔬 Run Stylelint — SCSS Files"
        id: stylelint-scss
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  💅 SCSS Analysis                                ║"
          echo "╚══════════════════════════════════════════════════╝"

          scss_count="$(find . -name "*.scss" ! -path "./.git/*" ! -path "./node_modules/*" | wc -l)"
          echo "  Analyzing ${scss_count} SCSS files..."

          if [[ "${scss_count}" -eq 0 ]]; then
            echo "  ℹ️  No SCSS files found — skipping"
            echo "errors=0" >> "${GITHUB_OUTPUT}"
            echo "warnings=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          pnpm stylelint \
            "**/*.scss" \
            "!node_modules/**" \
            --formatter=json \
            --allow-empty-input \
            --custom-syntax=postcss-scss \
            2>/dev/null > stylelint-scss.json || true

          errors="$(cat stylelint-scss.json | jq '[.[].warnings[] | select(.severity == "error")] | length' 2>/dev/null || echo 0)"
          warnings="$(cat stylelint-scss.json | jq '[.[].warnings[] | select(.severity == "warning")] | length' 2>/dev/null || echo 0)"

          echo "  SCSS Results: ${errors} errors, ${warnings} warnings"
          echo "errors=${errors}" >> "${GITHUB_OUTPUT}"
          echo "warnings=${warnings}" >> "${GITHUB_OUTPUT}"

      - name: "🔬 Run Stylelint — Full Analysis & Aggregate"
        id: stylelint
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  📊 Aggregating Stylelint Results                ║"
          echo "╚══════════════════════════════════════════════════╝"

          # Merge all JSON outputs
          merged="[]"
          for json_file in stylelint-css.json stylelint-scss.json; do
            if [[ -f "${json_file}" ]]; then
              content="$(cat "${json_file}" 2>/dev/null || echo '[]')"
              merged="$(echo "${merged}" | jq --argjson arr "${content}" '. += $arr')"
            fi
          done

          echo "${merged}" > stylelint-all.json

          # Aggregate counts
          total_errors="$(echo "${merged}" \
            | jq '[.[].warnings[] | select(.severity == "error")] | length' \
            2>/dev/null || echo 0)"
          total_warnings="$(echo "${merged}" \
            | jq '[.[].warnings[] | select(.severity == "warning")] | length' \
            2>/dev/null || echo 0)"
          total_files_with_issues="$(echo "${merged}" \
            | jq '[.[] | select(.warnings | length > 0)] | length' \
            2>/dev/null || echo 0)"
          total_issues=$((total_errors + total_warnings))

          # Generate human-readable report
          echo ""
          echo "  📋 Issues by file:"
          echo "${merged}" | jq -r '
            .[] |
            select(.warnings | length > 0) |
            "  ❌ \(.source)\n" +
            (.warnings[] |
              "     [\(.severity | ascii_upcase)] line \(.line):\(.column) — \(.text) (\(.rule // "unknown"))")
          ' 2>/dev/null | head -100

          # Most common rules violated
          echo ""
          echo "  📈 Top violated rules:"
          echo "${merged}" | jq -r '.[].warnings[].rule // "unknown"' \
            | sort | uniq -c | sort -rn | head -10 \
            | while read -r count rule; do
                printf "     %-40s %s violations\n" "${rule}" "${count}"
              done

          echo ""
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  📊 STYLELINT FINAL RESULTS                      ║"
          echo "╠══════════════════════════════════════════════════╣"
          printf "║  📄 Files analyzed:     %-24s║\n" "${{ needs.discover.outputs.total-count }}"
          printf "║  ❌ Files with issues:  %-24s║\n" "${total_files_with_issues}"
          printf "║  🔴 Errors:             %-24s║\n" "${total_errors}"
          printf "║  🟠 Warnings:           %-24s║\n" "${total_warnings}"
          printf "║  📝 Total issues:       %-24s║\n" "${total_issues}"
          echo "╠══════════════════════════════════════════════════╣"

          passed="true"
          if [[ ${total_errors} -gt 0 ]]; then
            passed="false"
            echo "║  ❌ STATUS: FAILED                               ║"
          else
            echo "║  ✅ STATUS: PASSED                               ║"
          fi
          echo "╚══════════════════════════════════════════════════╝"

          echo "errors=${total_errors}"   >> "${GITHUB_OUTPUT}"
          echo "warnings=${total_warnings}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"         >> "${GITHUB_OUTPUT}"

      - name: "🎨 CSS Variable Audit"
        if: inputs.validate_variables != 'false'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🎨 CSS Custom Property Audit                    ║"
          echo "╚══════════════════════════════════════════════════╝"

          # Find all defined custom properties
          echo "  📋 Defined CSS custom properties:"
          grep -rh \
            --include="*.css" \
            --include="*.scss" \
            -oE "\-\-ash-[a-z-]+" . \
            2>/dev/null \
            | sort -u | head -50 \
            | while read -r prop; do
                uses="$(grep -rh "${prop}" --include="*.css" --include="*.scss" . 2>/dev/null | wc -l)"
                printf "     %-45s used %s times\n" "${prop}" "${uses}"
              done

          # Check for undefined variable usage
          echo ""
          echo "  🔍 Checking for potentially undefined CSS variables..."

          # Variables defined in theme files
          defined_vars="$(grep -rh \
            --include="*.css" \
            -oE "\-\-ash-[a-z-]+(?=\s*:)" \
            ./config/ 2>/dev/null | sort -u)"

          # Variables used
          used_vars="$(grep -rh \
            --include="*.css" \
            --include="*.scss" \
            -oE "var\(\s*--ash-[a-z-]+" \
            ./config/ 2>/dev/null \
            | grep -oE "\-\-ash-[a-z-]+" | sort -u)"

          # Find undefined usages
          undefined=0
          while IFS= read -r used_var; do
            if ! echo "${defined_vars}" | grep -qF "${used_var}"; then
              echo "  ⚠️  Potentially undefined: ${used_var}"
              undefined=$((undefined + 1))
            fi
          done <<< "${used_vars}"

          if [[ ${undefined} -eq 0 ]]; then
            echo "  ✅ All ASH CSS custom properties appear to be defined"
          else
            echo "  ⚠️  Found ${undefined} potentially undefined CSS custom properties"
          fi

      - name: "📊 Waybar CSS Analysis"
        if: inputs.check_waybar != 'false'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  📊 Waybar CSS Analysis                          ║"
          echo "╚══════════════════════════════════════════════════╝"

          waybar_dir="./config/waybar"
          if [[ ! -d "${waybar_dir}" ]]; then
            echo "  ℹ️  No Waybar config — skipping"
            exit 0
          fi

          echo "  Waybar CSS files:"
          find "${waybar_dir}" -name "*.css" | while read -r f; do
            size="$(du -k "${f}" | cut -f1)"
            vars="$(grep -c "var(--" "${f}" 2>/dev/null || echo 0)"
            rules="$(grep -c '{' "${f}" 2>/dev/null || echo 0)"
            printf "  ├── %-40s size: %4sKB  vars: %3s  rules: %3s\n" \
              "$(basename "${f}")" "${size}" "${vars}" "${rules}"
          done

          # Check for theme variable usage (good practice)
          total_waybar_css="$(find "${waybar_dir}" -name "*.css" | wc -l)"
          vars_count="$(grep -rh "var(--" "${waybar_dir}" 2>/dev/null | wc -l)"
          hardcoded_colors="$(grep -rEh "#[0-9a-fA-F]{3,8}|rgba?\(" "${waybar_dir}" 2>/dev/null | grep -v "//" | wc -l)"

          echo ""
          echo "  📊 Waybar CSS Statistics:"
          echo "  ├── CSS files:           ${total_waybar_css}"
          echo "  ├── CSS variable usage:  ${vars_count} (theme-aware) ✅"
          echo "  └── Hardcoded colors:    ${hardcoded_colors} (should be 0)"

          if [[ ${hardcoded_colors} -gt 0 ]]; then
            echo ""
            echo "  ⚠️  Hardcoded colors found (should use CSS variables):"
            grep -rEnh "#[0-9a-fA-F]{3,8}|rgba?\(" "${waybar_dir}" 2>/dev/null \
              | grep -v "//" | head -10 \
              | while read -r line; do echo "     ${line}"; done
          fi

      - name: "🎭 GTK CSS Theme Validation"
        if: inputs.check_gtk_themes != 'false'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🎭 GTK CSS Theme Validation                     ║"
          echo "╚══════════════════════════════════════════════════╝"

          for gtk_dir in ./config/gtk-3.0 ./config/gtk-4.0; do
            if [[ ! -d "${gtk_dir}" ]]; then continue; fi

            version="$(basename "${gtk_dir}")"
            echo "  📁 Checking ${version}:"

            # Check required GTK CSS selectors
            css_file="${gtk_dir}/gtk.css"
            if [[ -f "${css_file}" ]]; then
              echo "    ✅ gtk.css present"

              # GTK-specific checks
              if grep -q "@import" "${css_file}"; then
                echo "    ✅ @import statements found"
              fi

              if grep -q "widget" "${css_file}" || grep -q "button" "${css_file}"; then
                echo "    ✅ Widget styling detected"
              fi

              # Check for @define-color (GTK color definitions)
              define_count="$(grep -c "@define-color" "${css_file}" 2>/dev/null || echo 0)"
              echo "    📊 @define-color declarations: ${define_count}"
            else
              echo "    ⚠️  gtk.css not found in ${gtk_dir}"
            fi
          done

      - name: "🔧 Generate Auto-Fix Report"
        if: inputs.fix_mode == 'true'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🔧 Stylelint Auto-Fix Report                    ║"
          echo "╚══════════════════════════════════════════════════╝"
          echo "  ℹ️  Running in report-only mode (no commits)"

          # Show what would be auto-fixed
          pnpm stylelint \
            "**/*.css" "**/*.scss" \
            "!node_modules/**" "!**/*.min.css" \
            --fix \
            --allow-empty-input \
            --dry-run \
            2>/dev/null || true

          echo ""
          echo "  ℹ️  To apply fixes locally:"
          echo "  pnpm stylelint --fix '**/*.css' '**/*.scss'"

      - name: "📤 Upload Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "stylelint-results"
          path: |
            stylelint-all.json
            stylelint-css.json
            stylelint-scss.json
          retention-days: 14

      - name: "💬 Post PR Comment"
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const errors    = parseInt('${{ steps.stylelint.outputs.errors || 0 }}');
            const warnings  = parseInt('${{ steps.stylelint.outputs.warnings || 0 }}');
            const passed    = '${{ steps.stylelint.outputs.passed }}' === 'true';
            const total     = '${{ needs.discover.outputs.total-count }}';
            const cssCount  = '${{ needs.discover.outputs.css-files }}'.split(',').length;
            const scssCount = '${{ needs.discover.outputs.scss-files }}'.split(',').length;

            const icon   = passed ? '✅' : '❌';
            const status = passed ? 'PASSED' : 'FAILED';

            const body = `## 🎨 Stylelint Analysis ${icon}

            **Status: ${status}** | Analyzed **${total}** stylesheets

            | Type | Files | Errors | Warnings |
            |------|-------|--------|----------|
            | 🎨 CSS | ~${cssCount} | \`${errors}\` | \`${warnings}\` |
            | 💅 SCSS | ~${scssCount} | — | — |

            ${passed
              ? '### ✨ All stylesheets pass Stylelint analysis!'
              : `### 🔧 Fix Required

            \`\`\`bash
            # Install and run locally:
            pnpm install
            pnpm stylelint --fix "**/*.css" "**/*.scss"

            # Check specific file:
            pnpm stylelint config/waybar/style.css

            # Run with auto-fix:
            pnpm stylelint --fix "**/*.css"
            \`\`\``
            }

            <details>
            <summary>📋 Stylelint Configuration</summary>

            - **Config:** \`.stylelintrc.json\`
            - **Plugins:** stylelint-order, stylelint-scss, stylelint-a11y
            - **Profiles:** Standard CSS + SCSS + Accessibility
            - **GTK overrides:** Waybar, GTK3, GTK4 specific rules
            </details>

            ---
            *🤖 ASH Dotfiles Stylelint v${{ env.STYLELINT_VERSION }} • [Full Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🎨 Stylelint Analysis')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — Stylelint"
    needs: [discover, analyze]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: "🚦 Evaluate Quality Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🚦 Stylelint Quality Gate                       ║"
          echo "╚══════════════════════════════════════════════════╝"

          has_styles="${{ needs.discover.outputs.has-styles }}"
          passed="${{ needs.analyze.outputs.passed || 'true' }}"
          errors="${{ needs.analyze.outputs.errors || '0' }}"
          warnings="${{ needs.analyze.outputs.warnings || '0' }}"

          echo ""
          echo "  📊 Gate Summary:"
          echo "  ├── Total files: ${{ needs.discover.outputs.total-count }}"
          echo "  ├── Errors:      ${errors}"
          echo "  ├── Warnings:    ${warnings}"
          echo "  └── Passed:      ${passed}"
          echo ""

          if [[ "${has_styles}" == "false" ]]; then
            echo "  ℹ️  No stylesheets found — gate skipped"
            exit 0
          fi

          if [[ "${passed}" == "true" ]]; then
            echo "  ✅ QUALITY GATE: PASSED"
            echo "  🎉 All stylesheets pass Stylelint analysis!"
          else
            echo "  ❌ QUALITY GATE: FAILED"
            echo "  Fix all CSS errors before merging."
            echo "  Run: pnpm stylelint --fix '**/*.css' '**/*.scss'"
            exit 1
          fi