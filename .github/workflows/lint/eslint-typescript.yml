# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      ⚡ ASH DOTFILES v5.0 OMEGA — ESLINT TYPESCRIPT WORKFLOW                          ║
# ║                                                                                          ║
# ║      Ultra-Premium TypeScript/JavaScript Analysis Pipeline                              ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      ESLint v9+           •  TypeScript v5.4+   •  Type-Aware Linting                 ║
# ║      Flat Config          •  React/JSX Rules    •  Import Resolution                  ║
# ║      Security Plugin      •  Unicorn Rules      •  SonarJS Analysis                  ║
# ║      AGS TypeScript       •  Web Dashboard      •  Browser Extension                 ║
# ║      Performance Rules    •  A11y Checks        •  SARIF Upload                      ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "⚡ ESLint TypeScript — JS/TS Analysis"

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "eslint.config*"
      - ".eslintrc*"
      - "tsconfig*.json"
      - "package.json"
      - ".github/workflows/lint/eslint-typescript.yml"

  pull_request:
    branches: [main, develop, "release/**"]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "eslint.config*"
      - ".eslintrc*"
      - "tsconfig*.json"
      - ".github/workflows/lint/eslint-typescript.yml"
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      strict_mode:
        description: "Strict TypeScript checks"
        required: false
        default: true
        type: boolean
      fix_mode:
        description: "Show auto-fixable issues"
        required: false
        default: false
        type: boolean
      type_check:
        description: "Run TypeScript type checking (tsc --noEmit)"
        required: false
        default: true
        type: boolean
      security_audit:
        description: "Run security-focused ESLint rules"
        required: false
        default: true
        type: boolean

  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

concurrency:
  group: "eslint-ts-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  TYPESCRIPT_VERSION: "5.4.5"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: DISCOVER
  # ────────────────────────────────────────────────────────────────────────────
  discover:
    name: "🔍 Discover TS/JS Files"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      ts-files:    ${{ steps.discover.outputs.ts_files }}
      js-files:    ${{ steps.discover.outputs.js_files }}
      total-count: ${{ steps.discover.outputs.total_count }}
      has-ts:      ${{ steps.discover.outputs.has_ts }}
      projects:    ${{ steps.discover.outputs.projects }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔍 Discover TypeScript/JavaScript Files"
        id: discover
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  ⚡ TypeScript/JavaScript Discovery              ║"
          echo "╚══════════════════════════════════════════════════╝"

          # TypeScript files
          mapfile -t ts_files < <(
            find . -type f \( -name "*.ts" -o -name "*.tsx" \) \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              ! -path "./.pnpm-store/*" \
              ! -name "*.d.ts" \
              | sort
          )

          # JavaScript files
          mapfile -t js_files < <(
            find . -type f \( -name "*.js" -o -name "*.jsx" -o -name "*.mjs" \) \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              ! -name "*.config.js" \
              | sort
          )

          # Find project directories with tsconfig.json
          mapfile -t project_dirs < <(
            find . -name "tsconfig.json" \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              | xargs -I{} dirname {} \
              | sort -u
          )

          ts_count="${#ts_files[@]}"
          js_count="${#js_files[@]}"
          total=$((ts_count + js_count))

          echo ""
          echo "  📊 TypeScript/JavaScript Inventory:"
          echo "  ├── TypeScript files: ${ts_count}"
          echo "  ├── JavaScript files: ${js_count}"
          echo "  ├── Total:            ${total}"
          echo "  │"
          echo "  ├── By Project:"
          echo "  │   ├── Web Dashboard:      $(find ./web/src -name "*.ts" -o -name "*.tsx" 2>/dev/null | wc -l) files"
          echo "  │   ├── AGS Config:         $(find ./config/ags -name "*.ts" 2>/dev/null | wc -l) files"
          echo "  │   ├── Mobile App:         $(find ./mobile -name "*.ts" 2>/dev/null | wc -l) files"
          echo "  │   ├── Browser Extension:  $(find ./browser-extension/src -name "*.ts" 2>/dev/null | wc -l) files"
          echo "  │   └── API Server:         $(find ./api -name "*.ts" 2>/dev/null | wc -l) files"
          echo "  │"
          echo "  └── tsconfig.json projects:"
          for dir in "${project_dirs[@]}"; do
            echo "      → ${dir}"
          done

          ts_json="$(printf '%s\n' "${ts_files[@]}" | jq -R . | jq -sc . 2>/dev/null || echo '[]')"
          js_json="$(printf '%s\n' "${js_files[@]}" | jq -R . | jq -sc . 2>/dev/null || echo '[]')"
          proj_json="$(printf '%s\n' "${project_dirs[@]}" | jq -R . | jq -sc . 2>/dev/null || echo '[]')"

          echo "ts_files=${ts_json}"   >> "${GITHUB_OUTPUT}"
          echo "js_files=${js_json}"   >> "${GITHUB_OUTPUT}"
          echo "total_count=${total}"  >> "${GITHUB_OUTPUT}"
          echo "projects=${proj_json}" >> "${GITHUB_OUTPUT}"
          echo "has_ts=$([ "${total}" -gt 0 ] && echo 'true' || echo 'false')" \
            >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: SETUP
  # ────────────────────────────────────────────────────────────────────────────
  setup:
    name: "🛠️ Setup ESLint Environment"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: "🛠️ Install ESLint & TypeScript Plugins"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🛠️  Installing ESLint Toolchain                  ║"
          echo "╚══════════════════════════════════════════════════╝"

          # Install comprehensive ESLint toolchain
          pnpm add -D \
            eslint@9 \
            typescript@${{ env.TYPESCRIPT_VERSION }} \
            typescript-eslint \
            "@typescript-eslint/eslint-plugin" \
            "@typescript-eslint/parser" \
            "@typescript-eslint/rule-tester" \
            eslint-plugin-react \
            eslint-plugin-react-hooks \
            eslint-plugin-jsx-a11y \
            eslint-plugin-import \
            eslint-plugin-unicorn \
            eslint-plugin-security \
            eslint-plugin-sonarjs \
            eslint-plugin-n \
            eslint-plugin-promise \
            "@eslint/js" \
            "globals" \
            "@types/node" \
            "@types/react" \
            "@types/react-dom" \
            2>/dev/null

          echo ""
          echo "  📦 ESLint toolchain installed:"
          pnpm list eslint typescript typescript-eslint \
            --depth=0 2>/dev/null | grep -E "eslint|typescript" | head -10

          echo "  ✅ Setup complete"

      - name: "⚙️ Generate ESLint Flat Config"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  ⚙️  ESLint Configuration (Flat Config v9)        ║"
          echo "╚══════════════════════════════════════════════════╝"

          if [[ -f "eslint.config.js" ]] || [[ -f "eslint.config.ts" ]] || \
             [[ -f "eslint.config.mjs" ]]; then
            echo "  ✅ Using existing ESLint flat config"
          else
            cat > eslint.config.mjs << 'ESLINTCONFIG'
          // ╔══════════════════════════════════════════════════════════════════════╗
          // ║  ASH DOTFILES v5.0 OMEGA — ESLint Flat Configuration               ║
          // ║  Covers: Web Dashboard • AGS • Browser Extension • Mobile          ║
          // ╚══════════════════════════════════════════════════════════════════════╝

          import js from "@eslint/js";
          import tseslint from "typescript-eslint";
          import reactPlugin from "eslint-plugin-react";
          import reactHooksPlugin from "eslint-plugin-react-hooks";
          import jsxA11yPlugin from "eslint-plugin-jsx-a11y";
          import importPlugin from "eslint-plugin-import";
          import unicornPlugin from "eslint-plugin-unicorn";
          import securityPlugin from "eslint-plugin-security";
          import sonarPlugin from "eslint-plugin-sonarjs";
          import globals from "globals";

          export default tseslint.config(
            // ── Global ignores ──────────────────────────────────────────────────
            {
              ignores: [
                "node_modules/**",
                ".pnpm-store/**",
                "dist/**",
                "build/**",
                "coverage/**",
                "**/*.d.ts",
                "**/*.min.js",
                "eslint.config.mjs",
              ],
            },

            // ── Base JS rules ────────────────────────────────────────────────────
            js.configs.recommended,

            // ── TypeScript rules ─────────────────────────────────────────────────
            ...tseslint.configs.recommendedTypeChecked,
            ...tseslint.configs.stylisticTypeChecked,

            // ── Global configuration ─────────────────────────────────────────────
            {
              languageOptions: {
                ecmaVersion: "latest",
                sourceType: "module",
                globals: {
                  ...globals.browser,
                  ...globals.node,
                  ...globals.es2024,
                },
                parserOptions: {
                  project: true,
                  tsconfigRootDir: import.meta.dirname,
                },
              },

              plugins: {
                "react": reactPlugin,
                "react-hooks": reactHooksPlugin,
                "jsx-a11y": jsxA11yPlugin,
                "import": importPlugin,
                "unicorn": unicornPlugin,
                "security": securityPlugin,
                "sonarjs": sonarPlugin,
              },

              rules: {
                // ── TypeScript Rules ───────────────────────────────────────────
                "@typescript-eslint/no-explicit-any": "warn",
                "@typescript-eslint/no-unused-vars": [
                  "error",
                  {
                    argsIgnorePattern: "^_",
                    varsIgnorePattern: "^_",
                    caughtErrorsIgnorePattern: "^_",
                  },
                ],
                "@typescript-eslint/consistent-type-imports": [
                  "error",
                  { prefer: "type-imports", fixStyle: "inline-type-imports" },
                ],
                "@typescript-eslint/consistent-type-definitions": ["error", "interface"],
                "@typescript-eslint/no-floating-promises": "error",
                "@typescript-eslint/no-misused-promises": "error",
                "@typescript-eslint/await-thenable": "error",
                "@typescript-eslint/no-unnecessary-type-assertion": "error",
                "@typescript-eslint/prefer-nullish-coalescing": "warn",
                "@typescript-eslint/prefer-optional-chain": "warn",
                "@typescript-eslint/no-non-null-assertion": "warn",
                "@typescript-eslint/strict-boolean-expressions": [
                  "warn",
                  {
                    allowString: true,
                    allowNumber: true,
                    allowNullableObject: true,
                  },
                ],
                "@typescript-eslint/naming-convention": [
                  "warn",
                  {
                    selector: "variable",
                    format: ["camelCase", "UPPER_CASE", "PascalCase"],
                    leadingUnderscore: "allow",
                  },
                  {
                    selector: "typeLike",
                    format: ["PascalCase"],
                  },
                  {
                    selector: "interface",
                    format: ["PascalCase"],
                    custom: { regex: "^I[A-Z]", match: false },
                  },
                ],

                // ── JavaScript Rules ───────────────────────────────────────────
                "no-console": ["warn", { allow: ["warn", "error", "info", "debug"] }],
                "no-debugger": "error",
                "no-alert": "warn",
                "prefer-const": "error",
                "no-var": "error",
                "object-shorthand": "error",
                "prefer-arrow-callback": "error",
                "prefer-template": "error",
                "prefer-destructuring": ["warn", { array: false, object: true }],
                "no-duplicate-imports": "error",
                "eqeqeq": ["error", "always", { null: "ignore" }],
                "curly": ["error", "multi-line"],
                "dot-notation": "error",
                "no-throw-literal": "error",
                "no-return-await": "error",
                "require-await": "warn",

                // ── Import Rules ───────────────────────────────────────────────
                "import/no-duplicates": "error",
                "import/no-cycle": "warn",
                "import/no-self-import": "error",
                "import/no-useless-path-segments": "warn",
                "import/consistent-type-specifier-style": ["error", "prefer-inline"],

                // ── Unicorn Rules ──────────────────────────────────────────────
                "unicorn/no-for-loop": "error",
                "unicorn/prefer-includes": "error",
                "unicorn/prefer-string-slice": "error",
                "unicorn/prefer-array-find": "error",
                "unicorn/no-array-for-each": "error",
                "unicorn/prefer-at": "warn",
                "unicorn/prefer-optional-catch-binding": "error",
                "unicorn/no-useless-undefined": "error",
                "unicorn/prefer-ternary": "warn",
                "unicorn/throw-new-error": "error",
                "unicorn/no-instanceof-array": "error",
                "unicorn/prefer-number-properties": "error",
                "unicorn/prefer-module": "error",
                "unicorn/prefer-logical-operator-over-ternary": "error",

                // ── Security Rules ─────────────────────────────────────────────
                "security/detect-object-injection": "warn",
                "security/detect-non-literal-regexp": "warn",
                "security/detect-non-literal-fs-filename": "warn",
                "security/detect-unsafe-regex": "error",
                "security/detect-buffer-noassert": "error",
                "security/detect-possible-timing-attacks": "warn",

                // ── SonarJS Rules ──────────────────────────────────────────────
                "sonarjs/no-duplicate-string": ["warn", { threshold: 5 }],
                "sonarjs/no-identical-functions": "error",
                "sonarjs/cognitive-complexity": ["warn", 20],
                "sonarjs/no-nested-template-literals": "warn",
                "sonarjs/prefer-single-boolean-return": "warn",
                "sonarjs/no-redundant-jump": "error",

                // ── React Rules ────────────────────────────────────────────────
                "react/react-in-jsx-scope": "off",
                "react/prop-types": "off",
                "react/jsx-key": "error",
                "react/no-array-index-key": "warn",
                "react/no-unused-prop-types": "warn",
                "react/jsx-no-duplicate-props": "error",
                "react/jsx-boolean-value": ["error", "never"],
                "react/self-closing-comp": "error",
                "react-hooks/rules-of-hooks": "error",
                "react-hooks/exhaustive-deps": "warn",

                // ── Accessibility Rules ────────────────────────────────────────
                "jsx-a11y/alt-text": "error",
                "jsx-a11y/aria-role": "error",
                "jsx-a11y/no-autofocus": "warn",
                "jsx-a11y/click-events-have-key-events": "warn",
                "jsx-a11y/no-noninteractive-element-interactions": "warn",
              },
            },

            // ── AGS TypeScript overrides ──────────────────────────────────────────
            {
              files: ["config/ags/**/*.ts"],
              rules: {
                "@typescript-eslint/no-explicit-any": "off",
                "unicorn/prefer-module": "off",
              },
            },

            // ── Test file overrides ───────────────────────────────────────────────
            {
              files: ["**/*.test.ts", "**/*.spec.ts", "**/*.test.tsx"],
              rules: {
                "@typescript-eslint/no-explicit-any": "off",
                "sonarjs/no-duplicate-string": "off",
                "security/detect-object-injection": "off",
              },
            },

            // ── Config file overrides ─────────────────────────────────────────────
            {
              files: ["**/*.config.ts", "vite.config.ts", "tailwind.config.ts"],
              rules: {
                "unicorn/prefer-module": "off",
                "@typescript-eslint/no-explicit-any": "off",
              },
            },
          );
          ESLINTCONFIG

            echo "  ✅ ESLint flat config generated"
          fi

      - name: "📤 Cache Setup"
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            .pnpm-store
            eslint.config.mjs
          key: "eslint-ts-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'eslint.config*', 'tsconfig*') }}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: TYPE CHECK — tsc --noEmit
  # ────────────────────────────────────────────────────────────────────────────
  type-check:
    name: "🔷 TypeScript Type Checking"
    needs: [discover, setup]
    if: >
      needs.discover.outputs.has-ts == 'true' &&
      inputs.type_check != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      ts-errors:  ${{ steps.typecheck.outputs.errors }}
      ts-passed:  ${{ steps.typecheck.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: "📥 Restore Cache"
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            .pnpm-store
          key: "eslint-ts-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'eslint.config*', 'tsconfig*') }}"
          restore-keys: "eslint-ts-"

      - name: "🔷 Run TypeScript Type Check"
        id: typecheck
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🔷 TypeScript Type Checking                     ║"
          echo "╚══════════════════════════════════════════════════╝"

          total_errors=0
          total_warnings=0
          projects_passed=0
          projects_failed=0

          # Find all tsconfig.json files
          mapfile -t tsconfigs < <(
            find . -name "tsconfig.json" \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              | sort
          )

          echo "  Found ${#tsconfigs[@]} TypeScript projects"
          echo ""

          for tsconfig in "${tsconfigs[@]}"; do
            project_dir="$(dirname "${tsconfig}")"
            echo "  🔷 Checking: ${project_dir}"

            # Run tsc --noEmit
            tsc_output="$(cd "${project_dir}" && \
              pnpm tsc --noEmit --pretty false 2>&1)" || true

            # Count errors
            errors="$(echo "${tsc_output}" | grep -cE "error TS[0-9]+" 2>/dev/null || echo 0)"
            warnings="$(echo "${tsc_output}" | grep -cE "warning TS[0-9]+" 2>/dev/null || echo 0)"

            total_errors=$((total_errors + errors))
            total_warnings=$((total_warnings + warnings))

            if [[ ${errors} -eq 0 ]]; then
              echo "     ✅ No type errors"
              projects_passed=$((projects_passed + 1))
            else
              echo "     ❌ ${errors} type errors:"
              echo "${tsc_output}" | grep "error TS" | head -10 | while IFS= read -r line; do
                echo "       ${line}"
              done
              projects_failed=$((projects_failed + 1))
            fi
            echo ""
          done

          echo "╔══════════════════════════════════════════════════╗"
          echo "║  📊 TypeScript Type Check Results                ║"
          echo "╠══════════════════════════════════════════════════╣"
          printf "║  📦 Projects checked: %-26s║\n" "${#tsconfigs[@]}"
          printf "║  ✅ Projects passed:  %-26s║\n" "${projects_passed}"
          printf "║  ❌ Projects failed:  %-26s║\n" "${projects_failed}"
          printf "║  🔴 Total TS errors:  %-26s║\n" "${total_errors}"
          echo "╠══════════════════════════════════════════════════╣"

          passed="true"
          if [[ ${total_errors} -gt 0 ]]; then
            passed="false"
            echo "║  ❌ STATUS: FAILED                               ║"
          else
            echo "║  ✅ STATUS: PASSED                               ║"
          fi
          echo "╚══════════════════════════════════════════════════╝"

          echo "errors=${total_errors}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"       >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: ESLINT — Run analysis
  # ────────────────────────────────────────────────────────────────────────────
  analyze:
    name: "🔬 ESLint Analysis"
    needs: [discover, setup]
    if: needs.discover.outputs.has-ts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    outputs:
      errors:   ${{ steps.eslint.outputs.errors }}
      warnings: ${{ steps.eslint.outputs.warnings }}
      passed:   ${{ steps.eslint.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: "📥 Restore Cache"
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            .pnpm-store
            eslint.config.mjs
          key: "eslint-ts-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'eslint.config*', 'tsconfig*') }}"
          restore-keys: "eslint-ts-"

      - name: "🔬 Run ESLint"
        id: eslint
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  ⚡ ESLint TypeScript Analysis                   ║"
          echo "╚══════════════════════════════════════════════════╝"

          total_files="${{ needs.discover.outputs.total-count }}"
          echo "  Analyzing ${total_files} TypeScript/JavaScript files..."
          echo ""

          # Run ESLint with JSON format
          pnpm eslint \
            "**/*.ts" \
            "**/*.tsx" \
            "**/*.js" \
            "**/*.jsx" \
            "**/*.mjs" \
            --no-eslintrc \
            --format=json \
            --max-warnings=0 \
            --no-ignore \
            --ignore-pattern="node_modules/**" \
            --ignore-pattern="**/*.d.ts" \
            --ignore-pattern="**/*.min.js" \
            --ignore-pattern="dist/**" \
            --ignore-pattern="build/**" \
            2>/dev/null > eslint-results.json || true

          # Run again with human-readable format for display
          pnpm eslint \
            "**/*.ts" "**/*.tsx" "**/*.js" "**/*.jsx" \
            --format=stylish \
            --ignore-pattern="node_modules/**" \
            --ignore-pattern="**/*.d.ts" \
            --ignore-pattern="dist/**" \
            2>/dev/null > eslint-stylish.txt || true

          # Generate SARIF for GitHub Security
          pnpm eslint \
            "**/*.ts" "**/*.tsx" "**/*.js" "**/*.jsx" \
            --format=@microsoft/eslint-formatter-sarif \
            --ignore-pattern="node_modules/**" \
            --ignore-pattern="**/*.d.ts" \
            2>/dev/null > eslint.sarif || true

          # Parse JSON results
          if [[ -f eslint-results.json ]]; then
            errors="$(jq '[.[].messages[] | select(.severity == 2)] | length' \
              eslint-results.json 2>/dev/null || echo 0)"
            warnings="$(jq '[.[].messages[] | select(.severity == 1)] | length' \
              eslint-results.json 2>/dev/null || echo 0)"
            files_with_issues="$(jq '[.[] | select(.messages | length > 0)] | length' \
              eslint-results.json 2>/dev/null || echo 0)"
            fixable="$(jq '[.[].messages[] | select(.fix != null)] | length' \
              eslint-results.json 2>/dev/null || echo 0)"
          else
            errors=0; warnings=0; files_with_issues=0; fixable=0
          fi

          # Show issues
          if [[ $((errors + warnings)) -gt 0 ]]; then
            echo "  📋 Issues found:"
            cat eslint-stylish.txt | head -80
          fi

          # Top violated rules
          echo ""
          echo "  📈 Top violated rules:"
          jq -r '.[].messages[].ruleId // "unknown"' eslint-results.json 2>/dev/null \
            | sort | uniq -c | sort -rn | head -10 \
            | while read -r count rule; do
                printf "     %-50s %s violations\n" "${rule}" "${count}"
              done

          echo ""
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  📊 ESLINT TYPESCRIPT RESULTS                    ║"
          echo "╠══════════════════════════════════════════════════╣"
          printf "║  📄 Files analyzed:     %-24s║\n" "${total_files}"
          printf "║  ❌ Files with issues:  %-24s║\n" "${files_with_issues}"
          printf "║  🔴 Errors:             %-24s║\n" "${errors}"
          printf "║  🟠 Warnings:           %-24s║\n" "${warnings}"
          printf "║  🔧 Auto-fixable:       %-24s║\n" "${fixable}"
          echo "╠══════════════════════════════════════════════════╣"

          passed="true"
          if [[ ${errors} -gt 0 ]]; then
            passed="false"
            echo "║  ❌ STATUS: FAILED                               ║"
          else
            echo "║  ✅ STATUS: PASSED                               ║"
          fi
          echo "╚══════════════════════════════════════════════════╝"

          if [[ ${fixable} -gt 0 ]]; then
            echo ""
            echo "  💡 ${fixable} issues can be auto-fixed:"
            echo "     pnpm eslint --fix '**/*.ts' '**/*.tsx'"
          fi

          echo "errors=${errors}"    >> "${GITHUB_OUTPUT}"
          echo "warnings=${warnings}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"    >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload SARIF"
        if: always() && hashFiles('eslint.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint.sarif
          category: "eslint"
        continue-on-error: true

      - name: "📤 Upload Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "eslint-results"
          path: |
            eslint-results.json
            eslint-stylish.txt
            eslint.sarif
          retention-days: 14
          if-no-files-found: ignore

      - name: "💬 Post PR Comment"
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const errors    = parseInt('${{ steps.eslint.outputs.errors || 0 }}');
            const warnings  = parseInt('${{ steps.eslint.outputs.warnings || 0 }}');
            const passed    = '${{ steps.eslint.outputs.passed }}' === 'true';
            const total     = '${{ needs.discover.outputs.total-count }}';
            const tsErrors  = parseInt('${{ needs.type-check.outputs.ts-errors || 0 }}');
            const tsPassed  = '${{ needs.type-check.outputs.ts-passed || "true" }}' === 'true';

            const overallPassed = passed && tsPassed;
            const icon   = overallPassed ? '✅' : '❌';
            const status = overallPassed ? 'PASSED' : 'FAILED';

            const body = `## ⚡ ESLint TypeScript Analysis ${icon}

            **Status: ${status}** | Analyzed **${total}** TypeScript/JavaScript files

            | Check | Errors | Warnings | Status |
            |-------|--------|----------|--------|
            | 🔷 Type Check (tsc) | \`${tsErrors}\` | — | ${tsPassed ? '✅' : '❌'} |
            | ⚡ ESLint Analysis | \`${errors}\` | \`${warnings}\` | ${passed ? '✅' : '❌'} |

            ${overallPassed
              ? '### ✨ All TypeScript/JavaScript files pass analysis!'
              : `### 🔧 Fix Required

            \`\`\`bash
            # Install dependencies
            pnpm install

            # Type check
            pnpm tsc --noEmit

            # ESLint check
            pnpm eslint "**/*.ts" "**/*.tsx"

            # Auto-fix ESLint issues
            pnpm eslint --fix "**/*.ts" "**/*.tsx" "**/*.js"
            \`\`\``
            }

            <details>
            <summary>📋 ESLint Configuration</summary>

            - **Config:** \`eslint.config.mjs\` (Flat Config v9)
            - **TypeScript:** \`typescript-eslint\` strict + stylistic
            - **Plugins:** react, react-hooks, jsx-a11y, import, unicorn, security, sonarjs
            - **Projects:** Web Dashboard, AGS, Browser Extension, Mobile
            </details>

            ---
            *🤖 ASH Dotfiles ESLint TypeScript • [Full Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('⚡ ESLint TypeScript Analysis')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 05: GATE — Final quality gate
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — ESLint TypeScript"
    needs: [discover, type-check, analyze]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: "🚦 Evaluate Quality Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🚦 ESLint TypeScript Quality Gate               ║"
          echo "╚══════════════════════════════════════════════════╝"

          has_ts="${{ needs.discover.outputs.has-ts }}"
          eslint_passed="${{ needs.analyze.outputs.passed || 'true' }}"
          ts_passed="${{ needs.type-check.outputs.ts-passed || 'true' }}"
          eslint_errors="${{ needs.analyze.outputs.errors || '0' }}"
          ts_errors="${{ needs.type-check.outputs.ts-errors || '0' }}"

          echo ""
          echo "  📊 Gate Summary:"
          echo "  ├── TS files:      ${{ needs.discover.outputs.total-count }}"
          echo "  ├── ESLint errors: ${eslint_errors}"
          echo "  ├── TSC errors:    ${ts_errors}"
          echo "  ├── ESLint passed: ${eslint_passed}"
          echo "  └── TSC passed:    ${ts_passed}"
          echo ""

          if [[ "${has_ts}" == "false" ]]; then
            echo "  ℹ️  No TypeScript/JavaScript files — gate skipped"
            exit 0
          fi

          overall_passed="true"
          if [[ "${eslint_passed}" != "true" ]] || [[ "${ts_passed}" != "true" ]]; then
            overall_passed="false"
          fi

          if [[ "${overall_passed}" == "true" ]]; then
            echo "  ✅ QUALITY GATE: PASSED"
            echo "  🎉 All TypeScript/JavaScript files pass analysis!"
          else
            echo "  ❌ QUALITY GATE: FAILED"
            echo ""
            if [[ "${eslint_passed}" != "true" ]]; then
              echo "  ESLint fix: pnpm eslint --fix '**/*.ts' '**/*.tsx'"
            fi
            if [[ "${ts_passed}" != "true" ]]; then
              echo "  TS fix:     pnpm tsc --noEmit && fix type errors"
            fi
            exit 1
          fi