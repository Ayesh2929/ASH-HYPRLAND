name: "⚙️ Unified Setup"
on:
  workflow_call:
    inputs:
      cache_key:
        type: string
        required: false
        default: "default-cache"

jobs:
  setup:
    name: "⚙️ Unified Setup Cache"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            package.json
            requirements.txt

      - name: "Cache Layer 1: GitHub Actions (pip/npm)"
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ~/.cache/pip
          key: ${{ runner.os }}-pkg-${{ inputs.cache_key }}-${{ hashFiles('**/package-lock.json', '**/requirements.txt') }}

      - name: "Cache Layer 3: Nix Binary Cache"
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: "Cache Layer 4: Tool Binaries"
        uses: actions/cache@v6
        with:
          path: /usr/local/bin
          key: ${{ runner.os }}-tools-${{ hashFiles('.github/workflows/*.yml') }}

      - name: "📊 Cache Analytics"
        run: |
          set -euo pipefail
          echo "## ⚙️ Cache Status" >> "$GITHUB_STEP_SUMMARY"
          
          # Layer 1: npm/pip
          NPM_SIZE=$(du -sh ~/.npm 2>/dev/null | cut -f1 || echo "0B")
          PIP_SIZE=$(du -sh ~/.cache/pip 2>/dev/null | cut -f1 || echo "0B")
          echo "- **npm cache**: $NPM_SIZE" >> "$GITHUB_STEP_SUMMARY"
          echo "- **pip cache**: $PIP_SIZE" >> "$GITHUB_STEP_SUMMARY"
          
          # Layer 4: Tools
          TOOLS_SIZE=$(du -sh /usr/local/bin 2>/dev/null | cut -f1 || echo "0B")
          echo "- **Tool Binaries**: $TOOLS_SIZE" >> "$GITHUB_STEP_SUMMARY"
          
          # Note on Layer 2
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ℹ️ *Docker cache (Layer 2) is handled natively by buildx.*" >> "$GITHUB_STEP_SUMMARY"
          echo "ℹ️ *Nix cache (Layer 3) is handled by Magic Nix Cache.*" >> "$GITHUB_STEP_SUMMARY"
