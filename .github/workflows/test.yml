# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.1.0 — INTEGRATION TESTS                          ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

name: 🧪 Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 0'   # Weekly Sunday 3am
  workflow_dispatch:
  workflow_call:

env:
  PYTHON_VERSION: '3.11'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:

# ═══════════════════════════════════════════════════════════════════════════════
# 🔧 JOB 1: INSTALL SCRIPT TEST
# ═══════════════════════════════════════════════════════════════════════════════

  test-install:
    name: 🔧 Install Script
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: ✅ Validate install.sh syntax
        run: |
          bash -n install.sh
          bash -n quickstart.sh
          echo "✅ Install scripts syntax valid"

      - name: ✅ Test dry-run mode
        run: |
          HOME=$(mktemp -d)
          export HOME
          mkdir -p "${HOME}/.cache/ash-dots/logs"

          # Mock environment
          export DOTFILES_DIR="${GITHUB_WORKSPACE}"

          # Test help flag
          bash install.sh --help 2>/dev/null | head -20 || true
          echo "✅ Help flag works"

      - name: ✅ Test directory structure creation
        run: |
          TEST_HOME=$(mktemp -d)
          export HOME="${TEST_HOME}"
          export DOTFILES_DIR="${GITHUB_WORKSPACE}"

          # Run structure init
          bash scripts/setup/init-structure.sh 2>/dev/null || true

          # Verify key directories
          DIRS=(
              "${TEST_HOME}/.config/hypr"
              "${TEST_HOME}/.config/waybar"
              "${TEST_HOME}/.config/rofi"
              "${TEST_HOME}/.config/fish"
              "${TEST_HOME}/.config/nvim"
              "${TEST_HOME}/.cache/ash-dots"
              "${TEST_HOME}/.local/bin"
              "${TEST_HOME}/Pictures/Wallpapers"
          )

          FAILED=0
          for dir in "${DIRS[@]}"; do
              if [[ -d "$dir" ]]; then
                  echo "  ✅ ${dir/${TEST_HOME}/~}"
              else
                  echo "  ❌ Missing: ${dir/${TEST_HOME}/~}"
                  FAILED=$((FAILED+1))
              fi
          done

          [[ $FAILED -gt 0 ]] && exit 1
          echo "✅ Directory structure created correctly"

      - name: ✅ Test ASH CLI structure
        run: |
          # Check all required CLI functions
          REQUIRED_FUNCS=(
              "cmd_theme"
              "cmd_shot"
              "cmd_vol"
              "cmd_bright"
              "cmd_lock"
              "cmd_reload"
              "cmd_doctor"
              "cmd_update"
              "cmd_backup"
              "cmd_clean"
              "cmd_music"
              "cmd_score"
              "cmd_workspace"
              "cmd_smart"
              "cmd_analytics"
              "cmd_context"
          )

          FAILED=0
          for func in "${REQUIRED_FUNCS[@]}"; do
              if grep -q "^${func}()" bin/ash 2>/dev/null; then
                  echo "  ✅ ${func}"
              else
                  echo "  ❌ Missing: ${func}"
                  FAILED=$((FAILED+1))
              fi
          done

          [[ $FAILED -gt 0 ]] && exit 1
          echo "✅ All CLI functions present"

# ═══════════════════════════════════════════════════════════════════════════════
# 🎨 JOB 2: THEME ENGINE TEST
# ═══════════════════════════════════════════════════════════════════════════════

  test-theme-engine:
    name: 🎨 Theme Engine
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: 🔧 Install ImageMagick + tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick jq python3

      - name: ✅ Test color extraction
        run: |
          # Create test wallpaper
          convert -size 400x300 \
              gradient:"#cba6f7-#89b4fa" \
              /tmp/test-wall.png 2>/dev/null

          # Extract colors
          COLORS=$(convert /tmp/test-wall.png \
              -filter Lanczos \
              -resize 200x200^ \
              -quantize transparent \
              -colors 8 \
              -unique-colors \
              -format "%[hex:u]\n" \
              info: 2>/dev/null | head -8)

          COUNT=$(echo "${COLORS}" | wc -l)

          if [[ $COUNT -ge 4 ]]; then
              echo "✅ Color extraction works ($COUNT colors)"
              echo "${COLORS}" | while read hex; do echo "  #$hex"; done
          else
              echo "❌ Too few colors extracted: $COUNT"
              exit 1
          fi

      - name: ✅ Test fallback palette
        run: |
          # Check fallback function exists and has required variables
          REQUIRED_VARS=(BASE MANTLE PRIMARY SECONDARY TERTIARY TEXT SUCCESS ERR)

          MISSING=0
          for var in "${REQUIRED_VARS[@]}"; do
              if grep -q "${var}=" config/hypr/scripts/theme/theme-engine.sh 2>/dev/null; then
                  echo "  ✅ Variable: ${var}"
              else
                  echo "  ❌ Missing: ${var}"
                  MISSING=$((MISSING+1))
              fi
          done

          [[ $MISSING -gt 0 ]] && exit 1
          echo "✅ All required color variables present"

      - name: ✅ Test JSON palette structure
        run: |
          python3 - << 'PYEOF'
          import json, sys

          # Test that our color JSON structure is valid
          test_palette = {
              "_meta": {"version": "3.1.0", "generator": "test"},
              "backgrounds": {"base": "#1e1e2e", "mantle": "#181825"},
              "accents": {"primary": "#cba6f7", "secondary": "#89b4fa"},
              "text": {"text": "#cdd6f4"},
              "states": {"success": "#a6e3a1", "error": "#f38ba8"}
          }

          # Validate structure
          required = ['_meta', 'backgrounds', 'accents', 'text', 'states']
          for section in required:
              assert section in test_palette, f"Missing: {section}"
              print(f"  ✅ Section: {section}")

          # Validate hex colors
          import re
          def is_hex(color):
              return bool(re.match(r'^#[0-9a-fA-F]{6}$', color))

          for section, values in test_palette.items():
              if isinstance(values, dict):
                  for key, val in values.items():
                      if isinstance(val, str) and val.startswith('#'):
                          assert is_hex(val), f"Invalid hex: {section}.{key}: {val}"

          print("\n✅ JSON palette structure valid")
          PYEOF

      - name: ✅ Test theme engine modes
        run: |
          # Check that all modes exist in theme-engine.sh
          MODES=("apply" "boot" "reapply" "test" "export")
          MISSING=0

          for mode in "${MODES[@]}"; do
              if grep -q "\"${mode}\"" config/hypr/scripts/theme/theme-engine.sh 2>/dev/null \
              || grep -q "'${mode}'" config/hypr/scripts/theme/theme-engine.sh 2>/dev/null; then
                  echo "  ✅ Mode: ${mode}"
              else
                  echo "  ❌ Missing mode: ${mode}"
                  MISSING=$((MISSING+1))
              fi
          done

          [[ $MISSING -gt 0 ]] && exit 1
          echo "✅ All theme modes present"

      - name: ✅ Test app target generation functions
        run: |
          GENERATORS=(
              "generate_hyprland"
              "generate_kitty"
              "generate_alacritty"
              "generate_wezterm"
              "generate_waybar"
              "generate_rofi"
              "generate_fish"
              "generate_dunst"
              "generate_swaync"
              "generate_hyprlock"
              "generate_gtk"
              "generate_vscode"
              "generate_firefox"
          )

          MISSING=0
          for gen in "${GENERATORS[@]}"; do
              if grep -q "^${gen}()" config/hypr/scripts/theme/theme-engine.sh 2>/dev/null; then
                  echo "  ✅ ${gen}"
              else
                  echo "  ❌ Missing: ${gen}"
                  MISSING=$((MISSING+1))
              fi
          done

          if [[ $MISSING -gt 0 ]]; then
              echo "❌ $MISSING generator function(s) missing"
              exit 1
          fi
          echo "✅ All 13 app generators present"

# ═══════════════════════════════════════════════════════════════════════════════
# 🌟 JOB 3: UNIQUE FEATURES TEST
# ═══════════════════════════════════════════════════════════════════════════════

  test-unique-features:
    name: 🌟 Unique Features
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: ✅ Test music reactive script structure
        run: |
          SCRIPT="config/hypr/scripts/theme/album-art-theme.sh"
          [[ -f "${SCRIPT}" ]] || { echo "❌ Missing: ${SCRIPT}"; exit 1; }

          # Check key functions
          FUNCS=("get_album_art_url" "extract_vibrant_color" "apply_music_color" "run_daemon")
          for func in "${FUNCS[@]}"; do
              grep -q "^${func}()" "${SCRIPT}" && echo "  ✅ ${func}" || echo "  ⚠️  ${func}"
          done

          bash -n "${SCRIPT}" && echo "✅ Syntax valid"

      - name: ✅ Test health score categories
        run: |
          SCRIPT="config/hypr/scripts/theme/health-score.sh"
          [[ -f "${SCRIPT}" ]] || { echo "❌ Missing"; exit 1; }

          CHECKS=("check_performance" "check_security" "check_cleanliness" \
                  "check_updates" "check_backups" "check_desktop")

          for check in "${CHECKS[@]}"; do
              grep -q "^${check}()" "${SCRIPT}" \
                  && echo "  ✅ ${check}" \
                  || echo "  ❌ Missing: ${check}"
          done

          bash -n "${SCRIPT}" && echo "✅ Syntax valid"

      - name: ✅ Test workspace profiles
        run: |
          SCRIPT="config/hypr/scripts/theme/workspace-profiles.sh"
          [[ -f "${SCRIPT}" ]] || { echo "❌ Missing"; exit 1; }
          bash -n "${SCRIPT}" && echo "✅ Syntax valid"

          # Check built-in profiles would be created
          grep -q "coding.json" "${SCRIPT}" && echo "✅ coding profile"
          grep -q "gaming.json" "${SCRIPT}" && echo "✅ gaming profile"
          grep -q "meeting.json" "${SCRIPT}" && echo "✅ meeting profile"

      - name: ✅ Test smart wallpaper
        run: |
          SCRIPT="config/hypr/scripts/theme/smart-wallpaper.sh"
          [[ -f "${SCRIPT}" ]] || { echo "❌ Missing"; exit 1; }
          bash -n "${SCRIPT}" && echo "✅ Syntax valid"

          grep -q "get_time_category" "${SCRIPT}" && echo "✅ time-based"
          grep -q "get_weather_category" "${SCRIPT}" && echo "✅ weather-based"

      - name: ✅ Test AI theme generator
        run: |
          SCRIPT="config/hypr/scripts/theme/ai-theme.sh"
          [[ -f "${SCRIPT}" ]] || { echo "❌ Missing"; exit 1; }
          bash -n "${SCRIPT}" && echo "✅ Syntax valid"

          grep -q "generate_with_ollama" "${SCRIPT}" && echo "✅ Ollama backend"
          grep -q "generate_with_python" "${SCRIPT}" && echo "✅ Python fallback"
          grep -q "apply_generated_palette" "${SCRIPT}" && echo "✅ Apply function"

      - name: ✅ Test theme undo system
        run: |
          SCRIPT="config/hypr/scripts/theme/theme-undo.sh"
          [[ -f "${SCRIPT}" ]] || { echo "❌ Missing"; exit 1; }
          bash -n "${SCRIPT}" && echo "✅ Syntax valid"

          grep -q "save_snapshot" "${SCRIPT}" && echo "✅ save function"
          grep -q "restore_snapshot" "${SCRIPT}" && echo "✅ restore function"

      - name: ✅ Test light/dark mode
        run: |
          SCRIPT="config/hypr/scripts/theme/light-theme.sh"
          [[ -f "${SCRIPT}" ]] || { echo "❌ Missing"; exit 1; }
          bash -n "${SCRIPT}" && echo "✅ Syntax valid"

          grep -q "LIGHT_PALETTE" "${SCRIPT}" && echo "✅ Light palette"
          grep -q "DARK_PALETTE" "${SCRIPT}" && echo "✅ Dark palette"
          grep -q "apply_mode" "${SCRIPT}" && echo "✅ Apply function"

      - name: ✅ Test context theming
        run: |
          SCRIPT="config/hypr/scripts/theme/context-theme.sh"
          [[ -f "${SCRIPT}" ]] || { echo "❌ Missing"; exit 1; }
          bash -n "${SCRIPT}" && echo "✅ Syntax valid"

          grep -q "APP_THEMES" "${SCRIPT}" && echo "✅ App mappings"
          grep -q "watch_windows" "${SCRIPT}" && echo "✅ Window watcher"

      - name: ✅ Test analytics
        run: |
          SCRIPT="config/hypr/scripts/analytics/desktop-analytics.sh"
          [[ -f "${SCRIPT}" ]] || { echo "❌ Missing"; exit 1; }
          bash -n "${SCRIPT}" && echo "✅ Syntax valid"

          grep -q "init_db" "${SCRIPT}" && echo "✅ Database init"
          grep -q "show_dashboard" "${SCRIPT}" && echo "✅ Dashboard function"

      - name: 📊 Unique features summary
        run: |
          echo "## 🌟 Unique Features Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Feature | Script | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🎵 Music Reactive | album-art-theme.sh | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏥 Health Score | health-score.sh | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| 📁 Workspace Profiles | workspace-profiles.sh | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌤️ Smart Wallpaper | smart-wallpaper.sh | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| 🤖 AI Theme Gen | ai-theme.sh | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| ↩️ Theme Undo | theme-undo.sh | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| ☀️🌙 Light/Dark | light-theme.sh | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎭 Context Theme | context-theme.sh | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 Analytics | desktop-analytics.sh | ✅ |" >> $GITHUB_STEP_SUMMARY

# ═══════════════════════════════════════════════════════════════════════════════
# 🔢 JOB 4: FILE COUNT VERIFICATION
# ═══════════════════════════════════════════════════════════════════════════════

  test-file-count:
    name: 🔢 File Count
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: 📊 Count and verify files
        run: |
          python3 - << 'PYEOF'
          from pathlib import Path
          import sys

          base = Path('config')

          # Count by category
          counts = {
              'Shell scripts (.sh)': len(list(base.rglob('*.sh'))),
              'Lua files (.lua)': len(list(base.rglob('*.lua'))),
              'Config files (.conf)': len(list(base.rglob('*.conf'))),
              'CSS files (.css)': len(list(base.rglob('*.css'))),
              'SCSS files (.scss)': len(list(base.rglob('*.scss'))),
              'JSON/JSONC (.json*)': len(list(base.rglob('*.json*'))),
              'TOML files (.toml)': len(list(base.rglob('*.toml'))),
              'Fish files (.fish)': len(list(base.rglob('*.fish'))),
              'JavaScript (.js)': len(list(base.rglob('*.js'))),
              'RASI files (.rasi)': len(list(base.rglob('*.rasi'))),
              'GLSL shaders (.glsl)': len(list(base.rglob('*.glsl'))),
              'Yuck files (.yuck)': len(list(base.rglob('*.yuck'))),
          }

          total = sum(counts.values())
          print(f"\n{'='*50}")
          print(f"{'ASH Dotfiles File Count Report':^50}")
          print(f"{'='*50}")
          for category, count in sorted(counts.items(), key=lambda x: -x[1]):
              bar = '█' * min(count // 2, 30)
              print(f"  {category:<30} {count:>4}  {bar}")
          print(f"{'─'*50}")
          print(f"  {'TOTAL CONFIG FILES':<30} {total:>4}")

          # Minimum thresholds
          MIN_TOTAL = 150
          MIN_SCRIPTS = 80

          print(f"\n{'Verification':^50}")
          print(f"{'─'*50}")

          issues = 0
          if total >= MIN_TOTAL:
              print(f"  ✅ Total files: {total} (min: {MIN_TOTAL})")
          else:
              print(f"  ❌ Too few files: {total} (min: {MIN_TOTAL})")
              issues += 1

          scripts = counts['Shell scripts (.sh)']
          if scripts >= MIN_SCRIPTS:
              print(f"  ✅ Shell scripts: {scripts} (min: {MIN_SCRIPTS})")
          else:
              print(f"  ❌ Too few scripts: {scripts} (min: {MIN_SCRIPTS})")
              issues += 1

          if issues:
              sys.exit(1)
          PYEOF