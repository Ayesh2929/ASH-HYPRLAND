# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🔬 ASH DOTFILES v5.0 OMEGA — SAST (STATIC APPLICATION SECURITY TESTING)          ║
# ║                                                                                          ║
# ║      Ultra-Premium Multi-Engine Static Analysis Security Pipeline                       ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      Semgrep OSS           •  Psalm (PHP)         •  ESLint Security                  ║
# ║      Bandit (Python)       •  Brakeman-style       •  ShellCheck SAST                 ║
# ║      Data Flow Analysis    •  Taint Tracking       •  OWASP Top 10                   ║
# ║      CWE Taxonomy          •  CVSS Scoring         •  Multi-Language                 ║
# ║      Rule Customization    •  False Positive Mgmt  •  Remediation Guide             ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🔬 SAST — Static Application Security Testing"

# ══════════════════════════════════════════════════════════════════════════════
# TRIGGER CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
    paths:
      - "**/*.py"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.sh"
      - "**/*.bash"
      - "api/**"
      - "web/**"
      - "ash-cli/**"
      - ".github/workflows/security/sast.yml"

  pull_request:
    branches:
      - main
      - develop
      - "release/**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:
    inputs:
      engines:
        description: "SAST engines to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - semgrep
          - bandit
          - shellcheck-sast
          - eslint-security
      severity:
        description: "Minimum severity level"
        required: false
        default: "WARNING"
        type: choice
        options: [ERROR, WARNING, INFO]
      ruleset:
        description: "Semgrep ruleset"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - p/security-audit
          - p/owasp-top-ten
          - p/python
          - p/javascript
          - p/bash

  schedule:
    - cron: "0 2 * * 1"

# ══════════════════════════════════════════════════════════════════════════════
# PERMISSIONS
# ══════════════════════════════════════════════════════════════════════════════
permissions:
  contents: read
  pull-requests: write
  security-events: write
  checks: write

# ══════════════════════════════════════════════════════════════════════════════
# CONCURRENCY
# ══════════════════════════════════════════════════════════════════════════════
concurrency:
  group: "sast-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════════════════
# GLOBAL ENV
# ══════════════════════════════════════════════════════════════════════════════
env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  SEMGREP_VERSION: "1.90.0"
  SEVERITY: "${{ inputs.severity || 'WARNING' }}"
  RULESET: "${{ inputs.ruleset || 'auto' }}"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: SEMGREP — Multi-language semantic analysis
  # ────────────────────────────────────────────────────────────────────────────
  semgrep:
    name: "🔬 Semgrep — Semantic Pattern Analysis"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: >
      inputs.engines == 'semgrep' ||
      inputs.engines == 'all' ||
      inputs.engines == null ||
      inputs.engines == ''

    outputs:
      findings: ${{ steps.scan.outputs.findings }}
      critical:  ${{ steps.scan.outputs.critical }}
      high:      ${{ steps.scan.outputs.high }}
      passed:    ${{ steps.scan.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install Semgrep"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔬 Installing Semgrep v${{ env.SEMGREP_VERSION }}            ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          pip install -q "semgrep==${{ env.SEMGREP_VERSION }}" 2>/dev/null

          echo "  ✅ Semgrep: $(semgrep --version 2>/dev/null)"

      - name: "⚙️ Generate ASH Custom Semgrep Rules"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ⚙️  ASH Custom Semgrep Rules Generator                      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          mkdir -p .semgrep/rules

          # ── ASH-specific Semgrep rules ─────────────────────────────────────
          cat > .semgrep/rules/ash-security.yaml << 'SEMGREP_RULES'
          # ASH Dotfiles v5.0 OMEGA — Custom Semgrep Security Rules
          # Covers: Shell injection, insecure config, plugin sandbox escape

          rules:

            # ── Rule 1: Shell injection via unquoted variable ─────────────────
            - id: ash-shell-injection-unquoted
              patterns:
                - pattern: |
                    eval $...ARGS
                - pattern-not: |
                    eval "..."
              message: >
                Potential shell injection: eval with unquoted variable.
                Use quoted strings or avoid eval entirely.
              languages: [bash]
              severity: ERROR
              metadata:
                cwe: "CWE-78"
                owasp: "A03:2021"
                category: security
                subcategory: [vuln]
                confidence: HIGH
                likelihood: MEDIUM
                impact: HIGH
                fix: "Replace 'eval $VAR' with 'eval \"$VAR\"' or safer alternatives"
              fix: |
                eval "$...ARGS"

            # ── Rule 2: curl pipe to shell ────────────────────────────────────
            - id: ash-curl-pipe-shell
              patterns:
                - pattern-regex: 'curl\s+.*\|\s*(?:bash|sh|zsh|fish)'
              message: >
                Unsafe: curl output piped directly to shell.
                Verify the URL is trusted and consider downloading
                and inspecting before executing.
              languages: [bash]
              severity: ERROR
              metadata:
                cwe: "CWE-494"
                owasp: "A08:2021"
                category: security
                subcategory: [vuln]
                confidence: HIGH
                likelihood: HIGH
                impact: CRITICAL

            # ── Rule 3: Hardcoded credential in shell ─────────────────────────
            - id: ash-hardcoded-credential-shell
              patterns:
                - pattern-regex: >
                    (?:PASSWORD|PASSWD|API_KEY|SECRET|TOKEN|AUTH)=["']?[A-Za-z0-9_\-\.]{8,}["']?
                - pattern-not-regex: >
                    (?:PASSWORD|PASSWD|API_KEY|SECRET|TOKEN|AUTH)=["']?\$\{
                - pattern-not-regex: >
                    (?:PASSWORD|PASSWD|API_KEY|SECRET|TOKEN|AUTH)=["']?<
                - pattern-not-regex: >
                    (?:PASSWORD|PASSWD|API_KEY|SECRET|TOKEN|AUTH)=["']?PLACEHOLDER
                - pattern-not-regex: >
                    (?:PASSWORD|PASSWD|API_KEY|SECRET|TOKEN|AUTH)=["']?YOUR_
              message: >
                Hardcoded credential detected. Use environment variables
                or ASH secret store: ash::secrets::get 'key'
              languages: [bash]
              severity: ERROR
              metadata:
                cwe: "CWE-798"
                owasp: "A07:2021"
                category: security
                subcategory: [vuln]
                confidence: MEDIUM
                likelihood: HIGH
                impact: CRITICAL

            # ── Rule 4: rm -rf with variable ──────────────────────────────────
            - id: ash-rm-rf-variable
              patterns:
                - pattern: rm -rf $X/$Y
                - pattern-not: rm -rf /tmp/$Y
                - pattern-not: rm -rf "${TMPDIR:-/tmp}/$Y"
              message: >
                Dangerous: rm -rf with variable path.
                Validate path is within expected directory before removal.
              languages: [bash]
              severity: ERROR
              metadata:
                cwe: "CWE-73"
                category: security
                subcategory: [vuln]

            # ── Rule 5: Python subprocess shell=True ──────────────────────────
            - id: ash-python-subprocess-shell-true
              patterns:
                - pattern: subprocess.$FUNC(..., shell=True, ...)
                - pattern-not: subprocess.$FUNC(shlex.split(...), shell=True, ...)
              message: >
                subprocess with shell=True enables shell injection.
                Pass a list of arguments instead.
              languages: [python]
              severity: ERROR
              metadata:
                cwe: "CWE-78"
                owasp: "A03:2021"
                category: security
                subcategory: [vuln]
                confidence: HIGH
              fix: |
                subprocess.$FUNC(shlex.split(...), shell=False, ...)

            # ── Rule 6: FastAPI missing auth dependency ────────────────────────
            - id: ash-fastapi-no-auth
              patterns:
                - pattern: |
                    @app.$METHOD("...")
                    async def $FUNC(...):
                        ...
                - pattern-not: |
                    @app.$METHOD("...")
                    async def $FUNC(..., $TOKEN: str = Depends(...), ...):
                        ...
                - pattern-not: |
                    @app.$METHOD("/health")
                    async def $FUNC(...):
                        ...
                - pattern-not: |
                    @app.$METHOD("/api/v1/health")
                    async def $FUNC(...):
                        ...
              message: >
                FastAPI endpoint may be missing authentication dependency.
                Add Depends(verify_token) or appropriate auth middleware.
              languages: [python]
              severity: WARNING
              metadata:
                cwe: "CWE-306"
                owasp: "A01:2021"
                category: security
                subcategory: [audit]
                confidence: LOW

            # ── Rule 7: Python pickle deserialization ─────────────────────────
            - id: ash-python-pickle-unsafe
              patterns:
                - pattern: pickle.loads(...)
                - pattern: pickle.load(...)
              message: >
                Unsafe deserialization via pickle.
                Use JSON or other safe formats for untrusted data.
              languages: [python]
              severity: ERROR
              metadata:
                cwe: "CWE-502"
                owasp: "A08:2021"
                category: security
                subcategory: [vuln]
                confidence: HIGH

            # ── Rule 8: TypeScript innerHTML assignment ────────────────────────
            - id: ash-ts-innerhtml-xss
              patterns:
                - pattern: $ELEMENT.innerHTML = $VALUE
                - pattern-not: $ELEMENT.innerHTML = DOMPurify.sanitize($VALUE)
                - pattern-not: $ELEMENT.innerHTML = ""
                - pattern-not: $ELEMENT.innerHTML = " "
              message: >
                Potential XSS via innerHTML assignment.
                Use textContent for plain text or DOMPurify for HTML.
              languages: [typescript, javascript]
              severity: ERROR
              metadata:
                cwe: "CWE-79"
                owasp: "A03:2021"
                category: security
                subcategory: [vuln]
                confidence: HIGH

            # ── Rule 9: TypeScript dangerouslySetInnerHTML ────────────────────
            - id: ash-react-dangerous-html
              patterns:
                - pattern: dangerouslySetInnerHTML={{ __html: $VALUE }}
                - pattern-not: dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize($VALUE) }}
              message: >
                dangerouslySetInnerHTML with unsanitized content.
                Wrap with DOMPurify.sanitize() before rendering.
              languages: [typescript, javascript]
              severity: ERROR
              metadata:
                cwe: "CWE-79"
                owasp: "A03:2021"
                category: security
                subcategory: [vuln]
                confidence: HIGH

            # ── Rule 10: Insecure random in security context ──────────────────
            - id: ash-insecure-random
              patterns:
                - pattern: Math.random()
              message: >
                Math.random() is not cryptographically secure.
                Use crypto.getRandomValues() or window.crypto for security tokens.
              languages: [typescript, javascript]
              severity: WARNING
              metadata:
                cwe: "CWE-338"
                owasp: "A02:2021"
                category: security
                subcategory: [audit]

          SEMGREP_RULES

          echo "  ✅ Custom rules: $(grep -c 'id:' .semgrep/rules/ash-security.yaml) rules"

      - name: "🔬 Run Semgrep Analysis"
        id: scan
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔬 Semgrep Multi-Language SAST Analysis                    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          ruleset="${{ env.RULESET }}"
          echo "  📊 Scan Configuration:"
          echo "  ├── Ruleset:   ${ruleset}"
          echo "  ├── Severity:  ${{ env.SEVERITY }}"
          echo "  ├── Custom:    .semgrep/rules/ash-security.yaml"
          echo "  └── Languages: bash, python, typescript, javascript"
          echo ""

          mkdir -p semgrep-results

          # Run semgrep with multiple rulesets
          semgrep_exit=0
          semgrep \
            --config="${ruleset}" \
            --config=".semgrep/rules/ash-security.yaml" \
            --json \
            --output=semgrep-results/results.json \
            --severity="${{ env.SEVERITY }}" \
            --exclude="node_modules" \
            --exclude=".git" \
            --exclude="*.lock" \
            --exclude="dist" \
            --exclude="build" \
            --exclude="tests/fixtures" \
            --metrics=off \
            --no-rewrite-rule-ids \
            . 2>&1 | tee /tmp/semgrep-output.txt || semgrep_exit=$?

          # Also generate SARIF
          semgrep \
            --config="${ruleset}" \
            --config=".semgrep/rules/ash-security.yaml" \
            --sarif \
            --output=semgrep-results/results.sarif \
            --severity="${{ env.SEVERITY }}" \
            --exclude="node_modules" \
            --exclude=".git" \
            --exclude="*.lock" \
            --metrics=off \
            . 2>/dev/null || true

          # Parse results
          total_findings=0
          critical_count=0
          high_count=0
          medium_count=0

          if [[ -f "semgrep-results/results.json" ]]; then
            total_findings="$(jq '.results | length' \
              semgrep-results/results.json 2>/dev/null || echo 0)"
            critical_count="$(jq '
              [.results[] |
               select(.extra.severity == "ERROR" and
                      (.extra.metadata.impact == "CRITICAL" or
                       .extra.metadata.likelihood == "HIGH"))] | length
            ' semgrep-results/results.json 2>/dev/null || echo 0)"
            high_count="$(jq '
              [.results[] |
               select(.extra.severity == "ERROR")] | length
            ' semgrep-results/results.json 2>/dev/null || echo 0)"
            medium_count="$(jq '
              [.results[] |
               select(.extra.severity == "WARNING")] | length
            ' semgrep-results/results.json 2>/dev/null || echo 0)"
          fi

          # Display findings
          if [[ ${total_findings} -gt 0 ]]; then
            echo "  📋 Semgrep Findings (${total_findings} total):"
            echo ""
            jq -r '
              .results[] |
              "  [\(.extra.severity)] \(.check_id)\n" +
              "     File: \(.path):\(.start.line)\n" +
              "     \(.extra.message[0:120])\n"
            ' semgrep-results/results.json 2>/dev/null | head -80

            echo ""
            echo "  📊 By Rule:"
            jq -r '
              [.results[] | .check_id] |
              group_by(.) |
              sort_by(-length) |
              .[] |
              "     \(.[0]): \(length) finding(s)"
            ' semgrep-results/results.json 2>/dev/null | head -15

            echo ""
            echo "  📊 OWASP Mapping:"
            jq -r '
              [.results[].extra.metadata.owasp? // "Unknown"] |
              group_by(.) |
              sort_by(-length) |
              .[] |
              "     \(.[0]): \(length)"
            ' semgrep-results/results.json 2>/dev/null | head -10
          else
            echo "  ✅ No security findings detected by Semgrep!"
          fi

          passed="true"
          [[ ${high_count} -gt 0 ]] && passed="false"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📊 SEMGREP RESULTS                                         ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  🔴 High/Critical:   %-36s║\n" "${high_count}"
          printf "║  🟠 Medium:          %-36s║\n" "${medium_count}"
          printf "║  📊 Total:           %-36s║\n" "${total_findings}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          [[ "${passed}" == "true" ]] && \
            echo "║  ✅ STATUS: PASSED                                          ║" || \
            echo "║  ❌ STATUS: FAILED — Security findings require attention    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "findings=${total_findings}" >> "${GITHUB_OUTPUT}"
          echo "critical=${critical_count}" >> "${GITHUB_OUTPUT}"
          echo "high=${high_count}"         >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"           >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload Semgrep SARIF"
        if: always() && hashFiles('semgrep-results/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: semgrep-results/results.sarif
          category: "semgrep-sast"
        continue-on-error: true

      - name: "📤 Upload Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "semgrep-results"
          path: semgrep-results/
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: BANDIT — Python security analysis
  # ────────────────────────────────────────────────────────────────────────────
  bandit-sast:
    name: "🐍 Bandit — Python Security Analysis"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >
      inputs.engines == 'bandit' ||
      inputs.engines == 'all' ||
      inputs.engines == null ||
      inputs.engines == ''

    outputs:
      high:   ${{ steps.bandit.outputs.high }}
      passed: ${{ steps.bandit.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install Bandit"
        shell: bash
        run: |
          pip install -q "bandit[toml]==1.8.0" "bandit-sarif-formatter==1.1.1" 2>/dev/null
          echo "  ✅ Bandit: $(bandit --version 2>/dev/null | head -1)"

      - name: "🐍 Run Bandit SAST"
        id: bandit
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🐍 Bandit Python Security Analysis                         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          mkdir -p bandit-results

          # Find Python files
          mapfile -t py_files < <(
            find . -name "*.py" \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              ! -path "*/__pycache__/*" \
              ! -path "*/.venv/*" \
              | sort
          )

          echo "  📊 Analyzing ${#py_files[@]} Python files..."
          echo ""

          bandit_exit=0

          # Run bandit with JSON output
          bandit \
            --recursive \
            --format=json \
            --output=bandit-results/results.json \
            --severity-level=medium \
            --confidence-level=medium \
            --exclude "./.git,./node_modules,./.venv,./venv" \
            "${py_files[@]}" \
            2>/dev/null || bandit_exit=$?

          # Generate SARIF
          bandit \
            --recursive \
            --format=sarif \
            --output=bandit-results/results.sarif \
            --severity-level=medium \
            --exclude "./.git,./node_modules,./.venv,./venv" \
            "${py_files[@]}" \
            2>/dev/null || true

          # Parse results
          high="$(jq '
            [.results[] |
             select(.issue_severity == "HIGH")] | length
          ' bandit-results/results.json 2>/dev/null || echo 0)"
          medium="$(jq '
            [.results[] |
             select(.issue_severity == "MEDIUM")] | length
          ' bandit-results/results.json 2>/dev/null || echo 0)"
          low="$(jq '
            [.results[] |
             select(.issue_severity == "LOW")] | length
          ' bandit-results/results.json 2>/dev/null || echo 0)"

          # Display findings
          if [[ $((high + medium)) -gt 0 ]]; then
            echo "  📋 Bandit findings:"
            jq -r '
              .results[] |
              select(.issue_severity == "HIGH" or .issue_severity == "MEDIUM") |
              "  [\(.issue_severity)/\(.issue_confidence)] \(.test_id): \(.issue_text[0:80])\n" +
              "     \(.filename):\(.line_number)"
            ' bandit-results/results.json 2>/dev/null | head -50

            echo ""
            echo "  📊 By test ID:"
            jq -r '
              [.results[] | .test_id] |
              group_by(.) | sort_by(-length) |
              .[] | "     \(.[0]): \(length)"
            ' bandit-results/results.json 2>/dev/null | head -10
          else
            echo "  ✅ No HIGH/MEDIUM Bandit findings!"
          fi

          passed="true"
          [[ ${high} -gt 0 ]] && passed="false"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  🔴 High:    %-44s║\n" "${high}"
          printf "║  🟠 Medium:  %-44s║\n" "${medium}"
          printf "║  📊 Low:     %-44s║\n" "${low}"
          [[ "${passed}" == "true" ]] && \
            echo "║  ✅ STATUS: PASSED                                          ║" || \
            echo "║  ❌ STATUS: FAILED                                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "high=${high}"     >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload Bandit SARIF"
        if: always() && hashFiles('bandit-results/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: bandit-results/results.sarif
          category: "bandit-python-sast"
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: SHELLCHECK-SAST — Shell script security analysis
  # ────────────────────────────────────────────────────────────────────────────
  shellcheck-sast:
    name: "🐚 ShellCheck — Script Security Analysis"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >
      inputs.engines == 'shellcheck-sast' ||
      inputs.engines == 'all' ||
      inputs.engines == null ||
      inputs.engines == ''

    outputs:
      errors:  ${{ steps.shellcheck.outputs.errors }}
      passed:  ${{ steps.shellcheck.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐚 Run ShellCheck SAST"
        id: shellcheck
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🐚 ShellCheck Security-Focused Analysis                    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Install shellcheck
          sudo apt-get install -qq -y shellcheck 2>/dev/null

          mkdir -p shellcheck-results

          # Find all shell scripts
          mapfile -t shell_scripts < <(
            find . -type f \( -name "*.sh" -o -name "*.bash" \) \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              | sort
          )

          # Also find scripts by shebang
          mapfile -t shebang_scripts < <(
            find . -type f ! -name "*.sh" \
              ! -path "./.git/*" \
              ! -path "./node_modules/*" \
              -exec grep -l "^#!/.*bash\|^#!/.*sh\b" {} \; \
              2>/dev/null | sort
          )

          # Combine and deduplicate
          mapfile -t all_scripts < <(
            printf '%s\n' "${shell_scripts[@]}" "${shebang_scripts[@]}" | sort -u
          )

          echo "  📊 Analyzing ${#all_scripts[@]} shell scripts..."
          echo ""

          total_errors=0
          total_warnings=0
          security_codes=(SC2086 SC2091 SC2094 SC2102 SC2116 SC2140 SC2206)

          for script in "${all_scripts[@]}"; do
            # Run with JSON format for security-focused check
            result="$(shellcheck \
              --severity=warning \
              --enable=all \
              --format=json \
              --shell=bash \
              "${script}" 2>/dev/null)" || true

            if [[ -n "${result}" ]]; then
              errors="$(echo "${result}" | jq '[.[] | select(.level == "error")] | length' 2>/dev/null || echo 0)"
              warnings="$(echo "${result}" | jq '[.[] | select(.level == "warning")] | length' 2>/dev/null || echo 0)"
              total_errors=$((total_errors + errors))
              total_warnings=$((total_warnings + warnings))

              # Flag security-specific codes
              for sc in "${security_codes[@]}"; do
                sec_count="$(echo "${result}" | jq "[.[] | select(.code == ${sc#SC})] | length" 2>/dev/null || echo 0)"
                if [[ ${sec_count} -gt 0 ]]; then
                  echo "  ⚠️  Security code ${sc} (${sec_count}x): $(basename "${script}")"
                fi
              done
            fi
          done

          # Generate SARIF from ShellCheck JSON
          shellcheck \
            --severity=warning \
            --format=json \
            "${all_scripts[@]}" \
            2>/dev/null > /tmp/shellcheck-all.json || true

          python3 << 'SARIF_GEN'
          import json
          from pathlib import Path

          try:
              findings = json.loads(Path("/tmp/shellcheck-all.json").read_text())
          except:
              findings = []

          # Map ShellCheck codes to CWE
          CODE_CWE = {
              2086: "CWE-78",   # Unquoted variable
              2091: "CWE-78",   # Recursive eval
              2094: "CWE-78",   # Loop variable
              2116: "CWE-78",   # Unnecessary subshell
              2206: "CWE-78",   # Array word splitting
          }

          results = []
          for f in findings:
              code = f.get("code", 0)
              results.append({
                  "ruleId": f"shellcheck/SC{code}",
                  "level": "error" if f.get("level") == "error" else "warning",
                  "message": {"text": f.get("message", "")},
                  "locations": [{
                      "physicalLocation": {
                          "artifactLocation": {
                              "uri": f.get("file", "").lstrip("./"),
                              "uriBaseId": "%SRCROOT%"
                          },
                          "region": {
                              "startLine": f.get("line", 1),
                              "startColumn": f.get("column", 1)
                          }
                      }
                  }]
              })

          sarif = {
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "ShellCheck",
                          "informationUri": "https://www.shellcheck.net/"
                      }
                  },
                  "results": results
              }]
          }

          Path("shellcheck-results/results.sarif").write_text(
              json.dumps(sarif, indent=2)
          )
          print(f"  ✅ SARIF: {len(results)} findings")
          SARIF_GEN

          passed="true"
          [[ ${total_errors} -gt 0 ]] && passed="false"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  🔴 Errors:   %-43s║\n" "${total_errors}"
          printf "║  🟠 Warnings: %-43s║\n" "${total_warnings}"
          [[ "${passed}" == "true" ]] && \
            echo "║  ✅ STATUS: PASSED                                          ║" || \
            echo "║  ❌ STATUS: FAILED                                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "errors=${total_errors}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"       >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload ShellCheck SARIF"
        if: always() && hashFiles('shellcheck-results/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: shellcheck-results/results.sarif
          category: "shellcheck-sast"
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Security Gate — SAST"
    needs: [semgrep, bandit-sast, shellcheck-sast]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "💬 Post PR Comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const semgrepFindings= parseInt('${{ needs.semgrep.outputs.findings || 0 }}');
            const semgrepHigh    = parseInt('${{ needs.semgrep.outputs.high || 0 }}');
            const semgrepPassed  = '${{ needs.semgrep.outputs.passed || "true" }}' === 'true';
            const banditHigh     = parseInt('${{ needs.bandit-sast.outputs.high || 0 }}');
            const banditPassed   = '${{ needs.bandit-sast.outputs.passed || "true" }}' === 'true';
            const scErrors       = parseInt('${{ needs.shellcheck-sast.outputs.errors || 0 }}');
            const scPassed       = '${{ needs.shellcheck-sast.outputs.passed || "true" }}' === 'true';

            const overallPassed  = semgrepPassed && banditPassed && scPassed;
            const icon = overallPassed ? '✅' : '❌';

            const body = `## 🔬 SAST Analysis ${icon}

            **Status: ${overallPassed ? 'PASSED' : 'FAILED'}**

            | Engine | Findings | Status |
            |--------|----------|--------|
            | 🔬 Semgrep | \`${semgrepFindings}\` (${semgrepHigh} HIGH) | ${semgrepPassed ? '✅' : '❌'} |
            | 🐍 Bandit | \`${banditHigh}\` HIGH | ${banditPassed ? '✅' : '❌'} |
            | 🐚 ShellCheck | \`${scErrors}\` errors | ${scPassed ? '✅' : '❌'} |

            **Coverage:** OWASP Top 10 • CWE taxonomy • Shell injection • XSS • SQLi • Hardcoded creds • Insecure deserialization

            ${overallPassed ? '### ✅ All SAST checks pass!' : '### 🔧 Security issues found — review required'}

            ---
            *🤖 ASH SAST Pipeline • Semgrep v${{ env.SEMGREP_VERSION }} • Bandit • ShellCheck*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🔬 SAST Analysis')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: "🚦 Evaluate SAST Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 SAST Security Gate                                      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          sg_passed="${{ needs.semgrep.outputs.passed || 'true' }}"
          bn_passed="${{ needs.bandit-sast.outputs.passed || 'true' }}"
          sc_passed="${{ needs.shellcheck-sast.outputs.passed || 'true' }}"

          all_passed="true"
          [[ "${sg_passed}" != "true" ]] && all_passed="false"
          [[ "${bn_passed}" != "true" ]] && all_passed="false"
          [[ "${sc_passed}" != "true" ]] && all_passed="false"

          if [[ "${all_passed}" == "true" ]]; then
            echo "  ✅ SAST GATE: PASSED — No critical security issues!"
          else
            echo "  ❌ SAST GATE: FAILED — Fix security findings before merging"
            exit 1
          fi