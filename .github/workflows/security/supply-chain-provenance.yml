# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      SLSA Level 3          •  SBOM Generation      •  Artifact Signing               ║
# ║      Sigstore/Cosign       •  Dependency Audit      •  Provenance Generation         ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "⛓️ Supply Chain — Provenance & SBOM"

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: "provenance-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/ash-dotfiles/ash-hyprland
  PYTHON_VERSION: "3.12"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: SBOM GENERATION
  # ────────────────────────────────────────────────────────────────────────────
  generate-sbom:
    name: "📋 Generate CycloneDX SBOM"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sbom-path: ${{ steps.sbom.outputs.path }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📦 Generate SBOM with Syft"
        id: sbom
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: "📤 Upload SBOM Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: DOCKER PROVENANCE (SLSA Level 3)
  # ────────────────────────────────────────────────────────────────────────────
  docker-provenance:
    name: "🔏 Generate SLSA Provenance"
    needs: [generate-sbom]
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ${{ env.IMAGE_NAME }}
      digest: ${{ github.sha }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: SIGN ARTIFACTS
  # ────────────────────────────────────────────────────────────────────────────
  sign-artifacts:
    name: "🖋️ Sign Docker Image & Attach SBOM"
    needs: [docker-provenance, generate-sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "📥 Download SBOM"
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: "🖋️ Install Cosign"
        uses: sigstore/cosign-installer@v3.5.0

      - name: "🔐 Login to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "✒️ Sign Image and Attach SBOM"
        run: |
          cosign sign --yes ${IMAGE_NAME}:${{ github.sha }}
          cosign attach sbom --sbom sbom.cdx.json ${IMAGE_NAME}:${{ github.sha }}

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: DEPENDENCY REVIEW
  # ────────────────────────────────────────────────────────────────────────────
  dependency-review:
    name: "🔍 Review Dependencies"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
      
      - name: "🔍 Run Dependency Review"
        uses: actions/dependency-review-action@v4
