# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🕵️  ASH DOTFILES v5.0 OMEGA — SECRET SCANNING WORKFLOW                            ║
# ║                                                                                          ║
# ║      Ultra-Premium Multi-Engine Secret Detection & Prevention Pipeline                  ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      Multi-Tool Detection  •  TruffleHog v3        •  detect-secrets                  ║
# ║      Custom Pattern Engine •  Entropy Analysis     •  File Content Scan               ║
# ║      Allowlist Management  •  False Positive Filter•  Baseline Tracking               ║
# ║      Historical Analysis   •  Binary File Check    •  Encoded Secret Detect           ║
# ║      Remediation Workflow  •  Incident Response    •  Rotation Guidance              ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🕵️ Secret Scanning — Multi-Engine Detection"

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop
      - "release/**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:
    inputs:
      engines:
        description: "Detection engines to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - trufflehog
          - detect-secrets
          - custom-patterns
      scan_history:
        description: "Scan full git history"
        required: false
        default: false
        type: boolean
      entropy_threshold:
        description: "Entropy threshold (3.0-5.0)"
        required: false
        default: "3.5"
        type: string

  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read
  pull-requests: write
  security-events: write
  checks: write

concurrency:
  group: "secret-scan-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  ENTROPY_THRESHOLD: "${{ inputs.entropy_threshold || '3.5' }}"
  SCAN_HISTORY: "${{ inputs.scan_history || 'false' }}"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: TRUFFLEHOG — Deep git history secret scanning
  # ────────────────────────────────────────────────────────────────────────────
  trufflehog:
    name: "🔍 TruffleHog — Deep Secret Detection"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: >
      inputs.engines == 'trufflehog' ||
      inputs.engines == 'all' ||
      inputs.engines == null ||
      inputs.engines == ''

    outputs:
      found:  ${{ steps.scan.outputs.found }}
      count:  ${{ steps.scan.outputs.count }}
      passed: ${{ steps.scan.outputs.passed }}

    steps:
      - name: "📥 Checkout Full History"
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.scan_history == 'true' && '0' || '50' }}

      - name: "🛠️ Install TruffleHog v3"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🛠️  Installing TruffleHog v3                                ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Install latest TruffleHog
          curl -sSfL \
            https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin 2>/dev/null

          echo "  ✅ TruffleHog: $(trufflehog --version 2>/dev/null | head -1)"

      - name: "🔍 Run TruffleHog Scan"
        id: scan
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔍 TruffleHog — Deep Secret Detection                      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          scan_depth="${{ inputs.scan_history == 'true' && '--since-commit HEAD' || '--since-commit HEAD~50' }}"

          echo "  📊 Scan Configuration:"
          echo "  ├── Scan mode:     ${{ inputs.scan_history == 'true' && 'full-history' || 'recent (50 commits)' }}"
          echo "  ├── Entropy:       enabled"
          echo "  ├── Verification:  enabled (live credential check)"
          echo "  └── Output format: JSON"
          echo ""

          th_exit=0
          trufflehog git \
            file://. \
            --json \
            --only-verified \
            --fail \
            2>/dev/null > trufflehog-results.json || th_exit=$?

          # Also scan for unverified secrets
          trufflehog git \
            file://. \
            --json \
            --no-verification \
            2>/dev/null > trufflehog-all.json || true

          # Parse results
          verified_count="$(jq -s 'length' trufflehog-results.json 2>/dev/null || echo 0)"
          unverified_count="$(jq -s 'length' trufflehog-all.json 2>/dev/null || echo 0)"
          unverified_count=$((unverified_count - verified_count))

          if [[ ${verified_count} -gt 0 ]]; then
            echo "  🚨 VERIFIED SECRETS FOUND: ${verified_count}"
            echo ""
            # Display findings (redacted)
            jq -r '
              "  🔴 [\(.DetectorType)] \(.SourceMetadata.Data.Git.file // "unknown"):\(.SourceMetadata.Data.Git.line // "?")\n" +
              "     Commit: \(.SourceMetadata.Data.Git.commit[0:8] // "?")\n" +
              "     Match:  \(.Raw[0:50] | @json)..."
            ' trufflehog-results.json 2>/dev/null | head -30
          else
            echo "  ✅ No verified secrets detected by TruffleHog"
          fi

          if [[ ${unverified_count} -gt 0 ]]; then
            echo ""
            echo "  ⚠️  ${unverified_count} unverified potential secrets"
            echo "     (May include false positives — review manually)"
          fi

          passed="true"
          [[ ${verified_count} -gt 0 ]] && passed="false"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  🔍 TruffleHog: %-42s║\n" "${verified_count} verified, ${unverified_count} unverified"
          [[ "${passed}" == "true" ]] && \
            echo "║  ✅ STATUS: PASSED                                          ║" || \
            echo "║  ❌ STATUS: FAILED — Verified secrets detected!             ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "found=$([[ ${verified_count} -gt 0 ]] && echo 'true' || echo 'false')" \
            >> "${GITHUB_OUTPUT}"
          echo "count=${verified_count}"  >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"         >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload TruffleHog Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "trufflehog-results"
          path: |
            trufflehog-results.json
            trufflehog-all.json
          retention-days: 30
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: DETECT-SECRETS — Yelp's detect-secrets tool
  # ────────────────────────────────────────────────────────────────────────────
  detect-secrets:
    name: "🔬 detect-secrets — Pattern Analysis"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: >
      inputs.engines == 'detect-secrets' ||
      inputs.engines == 'all' ||
      inputs.engines == null ||
      inputs.engines == ''

    outputs:
      found:  ${{ steps.scan.outputs.found }}
      count:  ${{ steps.scan.outputs.count }}
      passed: ${{ steps.scan.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "📦 Install detect-secrets"
        shell: bash
        run: |
          pip install -q \
            "detect-secrets==1.5.0" \
            "gibberish-detector==0.1.2" \
            2>/dev/null

          echo "  ✅ detect-secrets: $(detect-secrets --version 2>/dev/null)"

      - name: "⚙️ Configure detect-secrets"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ⚙️  detect-secrets Configuration                            ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Generate baseline
          detect-secrets scan \
            --list-all-plugins 2>/dev/null | head -20

          # Create baseline with all detectors enabled
          detect-secrets scan \
            --exclude-files '\.git/.*' \
            --exclude-files 'node_modules/.*' \
            --exclude-files '.*\.lock$' \
            --exclude-files '.*lazy-lock\.json$' \
            --exclude-files '.*\.min\.js$' \
            --no-verify \
            . > .secrets.baseline 2>/dev/null || true

          echo ""
          echo "  ✅ Baseline generated"
          baseline_count="$(jq '.results | length' .secrets.baseline 2>/dev/null || echo 0)"
          echo "  📊 Baseline: ${baseline_count} files with potential secrets"

      - name: "🔬 Run detect-secrets Scan"
        id: scan
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔬 detect-secrets Pattern Analysis                         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "  Entropy threshold: ${{ env.ENTROPY_THRESHOLD }}"
          echo ""

          # Scan with detailed output
          scan_exit=0
          detect-secrets scan \
            --baseline .secrets.baseline \
            --exclude-files '\.git/.*' \
            --exclude-files 'node_modules/.*' \
            --exclude-files '.*\.lock$' \
            --exclude-files 'lazy-lock\.json' \
            --no-verify \
            . > .secrets.current 2>/dev/null || scan_exit=$?

          # Audit differences
          audit_result="$(detect-secrets audit \
            --json \
            .secrets.current 2>/dev/null || echo '{}')"

          # Count findings
          new_secrets="$(jq '
            .results |
            to_entries |
            map(.value | length) |
            add // 0
          ' .secrets.current 2>/dev/null || echo 0)"

          total_secrets="${new_secrets}"

          if [[ ${total_secrets} -gt 0 ]]; then
            echo "  📋 Potential secrets found: ${total_secrets}"
            echo ""

            # Display by type
            jq -r '
              .results |
              to_entries[] |
              .key as $file |
              .value[] |
              "  🔴 [\(.type)] \($file):\(.line_number)"
            ' .secrets.current 2>/dev/null | head -30

            # Group by detector type
            echo ""
            echo "  📊 By detector type:"
            jq -r '
              [.results | to_entries[] | .value[] | .type] |
              group_by(.) |
              .[] |
              "     \(.[0]): \(length)"
            ' .secrets.current 2>/dev/null | head -15
          else
            echo "  ✅ No new secrets detected by detect-secrets"
          fi

          # Generate SARIF
          python3 << 'SARIF_GEN'
          import json
          from pathlib import Path

          try:
              secrets = json.loads(Path(".secrets.current").read_text())
          except:
              secrets = {"results": {}}

          results = []
          for filepath, findings in secrets.get("results", {}).items():
              for finding in findings:
                  results.append({
                      "ruleId": f"detect-secrets/{finding.get('type', 'unknown').lower().replace(' ', '-')}",
                      "level": "error",
                      "message": {"text": f"Potential secret: {finding.get('type', 'Unknown')}"},
                      "locations": [{
                          "physicalLocation": {
                              "artifactLocation": {
                                  "uri": filepath,
                                  "uriBaseId": "%SRCROOT%"
                              },
                              "region": {
                                  "startLine": finding.get("line_number", 1)
                              }
                          }
                      }]
                  })

          sarif = {
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "detect-secrets",
                          "version": "1.5.0",
                          "informationUri": "https://github.com/Yelp/detect-secrets",
                          "rules": []
                      }
                  },
                  "results": results
              }]
          }

          Path("detect-secrets.sarif").write_text(json.dumps(sarif, indent=2))
          print(f"  ✅ SARIF: {len(results)} findings")
          SARIF_GEN

          passed="true"
          [[ ${total_secrets} -gt 5 ]] && passed="false"  # Allow some false positives

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  🔬 detect-secrets: %-38s║\n" "${total_secrets} findings"
          [[ "${passed}" == "true" ]] && \
            echo "║  ✅ STATUS: PASSED                                          ║" || \
            echo "║  ⚠️  STATUS: HIGH FINDING COUNT — Manual review required    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "found=$([[ ${total_secrets} -gt 0 ]] && echo 'true' || echo 'false')" \
            >> "${GITHUB_OUTPUT}"
          echo "count=${total_secrets}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"       >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload SARIF"
        if: always() && hashFiles('detect-secrets.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: detect-secrets.sarif
          category: "detect-secrets"
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: CUSTOM-PATTERNS — ASH-specific entropy & pattern analysis
  # ────────────────────────────────────────────────────────────────────────────
  custom-patterns:
    name: "🎯 Custom Pattern & Entropy Analysis"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: >
      inputs.engines == 'custom-patterns' ||
      inputs.engines == 'all' ||
      inputs.engines == null ||
      inputs.engines == ''

    outputs:
      found:  ${{ steps.scan.outputs.found }}
      count:  ${{ steps.scan.outputs.count }}
      passed: ${{ steps.scan.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🎯 Run Custom Secret Pattern Engine"
        id: scan
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🎯 ASH Custom Secret Detection Engine                      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          python3 << 'CUSTOMENGINE'
          import re
          import os
          import sys
          import json
          import math
          import base64
          import binascii
          from pathlib import Path
          from collections import defaultdict
          from datetime import datetime, timezone

          # ═══════════════════════════════════════════════════════════════════
          # ASH DOTFILES — Custom Secret Detection Engine v5.0
          # ═══════════════════════════════════════════════════════════════════

          ENTROPY_THRESHOLD = float(os.environ.get("ENTROPY_THRESHOLD", "3.5"))

          findings   = []
          stats      = defaultdict(int)

          # ── Skip paths ───────────────────────────────────────────────────
          SKIP_DIRS = {
              ".git", "node_modules", ".pnpm-store", "target",
              "dist", "build", "__pycache__", ".venv", "venv",
          }
          SKIP_EXTENSIONS = {
              ".png", ".jpg", ".jpeg", ".gif", ".ico", ".webp",
              ".woff", ".woff2", ".ttf", ".eot", ".otf",
              ".mp4", ".mp3", ".ogg", ".wav", ".flac",
              ".pdf", ".zip", ".tar", ".gz", ".bz2",
              ".db", ".sqlite", ".sarif",
          }
          SKIP_FILES = {
              "lazy-lock.json", "package-lock.json",
              "pnpm-lock.yaml", "yarn.lock", "Cargo.lock",
              "go.sum", "flake.lock", "poetry.lock",
          }

          # ── Secret patterns ───────────────────────────────────────────────
          SECRET_PATTERNS = [
              # API Keys
              (r'(?i)api[_\-\s]*key["\']?\s*[:=]\s*["\']?([A-Za-z0-9_\-]{20,})["\']?',
               "API Key", "high"),
              # Passwords
              (r'(?i)(?:password|passwd|pwd)["\']?\s*[:=]\s*["\']([^"\']{8,})["\']',
               "Password", "critical"),
              # Tokens
              (r'(?i)(?:token|auth[_\-]?token|access[_\-]?token)["\']?\s*[:=]\s*["\']([A-Za-z0-9_\-\.]{20,})["\']',
               "Auth Token", "high"),
              # Connection strings
              (r'(?i)(?:mongodb|postgresql|mysql|redis|amqp)\+?://[^\s"\']+:[^\s"\'@]+@',
               "Database Connection String", "critical"),
              # AWS
              (r'\bAKIA[0-9A-Z]{16}\b',
               "AWS Access Key ID", "critical"),
              (r'(?i)aws[_\-\s]*secret[_\-\s]*(?:access[_\-\s]*)?key["\']?\s*[:=]\s*["\']?([A-Za-z0-9/+]{40})["\']?',
               "AWS Secret Access Key", "critical"),
              # GitHub
              (r'ghp_[A-Za-z0-9]{36}',
               "GitHub Personal Access Token", "critical"),
              (r'github_pat_[A-Za-z0-9_]{82}',
               "GitHub Fine-grained PAT", "critical"),
              # OpenAI/AI services
              (r'sk-[A-Za-z0-9]{48}',
               "OpenAI API Key", "critical"),
              (r'sk-ant-api[0-9]{2}-[A-Za-z0-9_\-]{48}',
               "Anthropic API Key", "critical"),
              (r'gsk_[A-Za-z0-9]{52}',
               "Groq API Key", "critical"),
              # Cloud providers
              (r'AIza[0-9A-Za-z_\-]{35}',
               "Google API Key", "critical"),
              (r'(?i)(?:azure|az)[_\-\s]*(?:subscription|account|client)[_\-\s]*(?:id|key|secret)["\']?\s*[:=]\s*["\']([A-Za-z0-9_\-]{30,})["\']?',
               "Azure Credential", "high"),
              # Private keys
              (r'-----BEGIN\s+(?:RSA|EC|DSA|OPENSSH|PGP)\s+PRIVATE\s+KEY-----',
               "Private Key", "critical"),
              # JWT
              (r'eyJ[A-Za-z0-9_\-]{20,}\.eyJ[A-Za-z0-9_\-]{20,}\.[A-Za-z0-9_\-]{20,}',
               "JWT Token", "high"),
              # WireGuard
              (r'PrivateKey\s*=\s*[A-Za-z0-9+/]{43}=',
               "WireGuard Private Key", "critical"),
              # Slack
              (r'xox[baprs]-[0-9]+-[0-9]+-[0-9A-Za-z-]+',
               "Slack Token", "critical"),
              # Discord
              (r'(?:[MN][A-Za-z0-9]{23})\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27}',
               "Discord Bot Token", "critical"),
              # Stripe
              (r'(?:sk|pk)_(?:live|test)_[A-Za-z0-9]{24}',
               "Stripe API Key", "critical"),
              # Tailscale
              (r'tskey-auth-[A-Za-z0-9_\-]{32,}',
               "Tailscale Auth Key", "critical"),
          ]

          # ── Allowlist patterns ─────────────────────────────────────────────
          ALLOWLIST_PATTERNS = [
              r'(?i)example|placeholder|your[_\-]?.*[_\-]?here|test|dummy|fake',
              r'(?i)xxxxxxxxxxx|XXXXXXXX|\$\{.*\}|<.*>',
              r'(?i)#\s.*',  # Comments
              r'sk-ant-api\d{2}-[x]{40,}',  # Redacted Anthropic key
              r'ash_test_token',             # Test tokens
              r'ash_tok_x+',                 # Test ASH tokens
          ]

          def is_allowlisted(match: str, context: str) -> bool:
              """Check if a finding is in the allowlist."""
              for pattern in ALLOWLIST_PATTERNS:
                  if re.search(pattern, match) or re.search(pattern, context):
                      return True
              return False

          def calculate_entropy(text: str) -> float:
              """Calculate Shannon entropy of a string."""
              if not text:
                  return 0.0
              freq = defaultdict(int)
              for char in text:
                  freq[char] += 1
              length = len(text)
              entropy = -sum(
                  (count / length) * math.log2(count / length)
                  for count in freq.values()
              )
              return entropy

          def check_high_entropy(line: str, line_num: int,
                                 filepath: str) -> list:
              """Detect high-entropy strings that may be secrets."""
              results = []
              # Look for quoted strings with high entropy
              quoted = re.findall(r'["\']([A-Za-z0-9+/=_\-]{20,})["\']', line)
              for candidate in quoted:
                  entropy = calculate_entropy(candidate)
                  if entropy > ENTROPY_THRESHOLD:
                      if not is_allowlisted(candidate, line):
                          results.append({
                              "type":    "high-entropy-string",
                              "match":   candidate[:20] + "...",
                              "entropy": round(entropy, 3),
                              "line":    line_num,
                              "file":    filepath,
                              "severity":"medium",
                          })
              return results

          def check_base64_secrets(line: str, line_num: int,
                                   filepath: str) -> list:
              """Detect base64-encoded secrets."""
              results = []
              b64_matches = re.findall(
                  r'["\']([A-Za-z0-9+/]{40,}={0,2})["\']', line
              )
              for b64 in b64_matches:
                  try:
                      decoded = base64.b64decode(b64).decode("utf-8", errors="ignore")
                      # Check if decoded content looks like a secret
                      if re.search(r'(?i)(?:key|token|pass|secret|auth)', decoded):
                          results.append({
                              "type":    "base64-encoded-secret",
                              "match":   b64[:20] + "...",
                              "decoded": decoded[:30] + "...",
                              "line":    line_num,
                              "file":    filepath,
                              "severity":"high",
                          })
                  except Exception:
                      pass
              return results

          # ── Scan all files ────────────────────────────────────────────────
          print("  🔍 Scanning repository files...")
          files_scanned = 0

          for root, dirs, files in os.walk("."):
              # Prune skip dirs
              dirs[:] = [
                  d for d in dirs
                  if d not in SKIP_DIRS and not d.startswith(".")
              ]

              for filename in files:
                  filepath = os.path.join(root, filename)
                  rel_path = filepath.lstrip("./")

                  # Skip by name or extension
                  if filename in SKIP_FILES:
                      continue
                  ext = Path(filename).suffix.lower()
                  if ext in SKIP_EXTENSIONS:
                      continue

                  # Skip binary files
                  try:
                      with open(filepath, "rb") as f:
                          chunk = f.read(8192)
                      if b"\x00" in chunk:
                          continue
                  except (OSError, PermissionError):
                      continue

                  # Read file content
                  try:
                      with open(filepath, encoding="utf-8", errors="ignore") as f:
                          lines = f.readlines()
                  except Exception:
                      continue

                  files_scanned += 1

                  for line_num, line in enumerate(lines, 1):
                      stripped = line.strip()
                      if not stripped or stripped.startswith("#"):
                          continue

                      # ── Pattern matching ──────────────────────────────────
                      for pattern, secret_type, severity in SECRET_PATTERNS:
                          matches = re.findall(pattern, line, re.IGNORECASE)
                          for match in matches:
                              match_str = match if isinstance(match, str) else match[0]
                              if not is_allowlisted(match_str, line):
                                  findings.append({
                                      "type":     secret_type,
                                      "file":     rel_path,
                                      "line":     line_num,
                                      "match":    match_str[:30] + "..." if len(match_str) > 30 else match_str,
                                      "severity": severity,
                                      "rule":     "pattern-match",
                                  })
                                  stats[secret_type] += 1

                      # ── Entropy analysis ──────────────────────────────────
                      for finding in check_high_entropy(stripped, line_num, rel_path):
                          findings.append(finding)

                      # ── Base64 check ──────────────────────────────────────
                      for finding in check_base64_secrets(stripped, line_num, rel_path):
                          findings.append(finding)

          # ── Deduplicate ───────────────────────────────────────────────────
          seen = set()
          unique_findings = []
          for f in findings:
              key = f"{f['file']}:{f['line']}:{f['type']}"
              if key not in seen:
                  seen.add(key)
                  unique_findings.append(f)

          findings = unique_findings

          # ── Report ────────────────────────────────────────────────────────
          print(f"  📊 Scanned {files_scanned} files")
          print(f"  📊 Findings: {len(findings)}")
          print("")

          if findings:
              # Group by severity
              by_severity = defaultdict(list)
              for f in findings:
                  by_severity[f["severity"]].append(f)

              for severity in ["critical", "high", "medium", "low"]:
                  group = by_severity.get(severity, [])
                  if not group:
                      continue
                  icon = {"critical": "💀", "high": "🔴",
                          "medium": "🟠", "low": "🟡"}.get(severity, "⚪")
                  print(f"  {icon} {severity.upper()} ({len(group)}):")
                  for f in group[:5]:
                      print(f"     {f['type']}: {f['file']}:{f['line']}")
                  if len(group) > 5:
                      print(f"     ... and {len(group) - 5} more")

              print("")
              print("  📊 By type:")
              for stype, count in sorted(stats.items(), key=lambda x: -x[1]):
                  print(f"     {stype}: {count}")

          # ── Generate SARIF ────────────────────────────────────────────────
          sarif_results = []
          for f in findings:
              severity_map = {
                  "critical": "error", "high": "error",
                  "medium": "warning", "low": "note",
              }
              sarif_results.append({
                  "ruleId": f"ash-secrets/{f['type'].lower().replace(' ', '-')}",
                  "level":  severity_map.get(f["severity"], "warning"),
                  "message": {
                      "text": f"{f['type']} detected: {f.get('match', 'REDACTED')}"
                  },
                  "locations": [{
                      "physicalLocation": {
                          "artifactLocation": {
                              "uri": f["file"],
                              "uriBaseId": "%SRCROOT%"
                          },
                          "region": {
                              "startLine": f["line"]
                          }
                      }
                  }]
              })

          sarif = {
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "ASH-Secret-Scanner",
                          "version": "5.0.0",
                          "informationUri": "https://github.com/ash-dotfiles/ash-dotfiles",
                          "rules": []
                      }
                  },
                  "results": sarif_results,
                  "invocations": [{
                      "executionSuccessful": True,
                      "commandLine": "custom-secret-scanner",
                      "startTimeUtc": datetime.now(timezone.utc).isoformat(),
                  }]
              }]
          }

          Path("custom-secret-scan.sarif").write_text(
              json.dumps(sarif, indent=2)
          )

          # Save results
          with open("custom-secret-results.json", "w") as f:
              json.dump({
                  "findings":      findings,
                  "count":         len(findings),
                  "files_scanned": files_scanned,
                  "by_type":       dict(stats),
                  "passed":        len([f for f in findings
                                        if f["severity"] in ("critical", "high")]) == 0,
              }, f, indent=2)

          critical_high = len([f for f in findings
                                if f["severity"] in ("critical", "high")])
          sys.exit(0 if critical_high == 0 else 1)
          CUSTOMENGINE
          engine_exit=$?

          count="$(jq '.count' custom-secret-results.json 2>/dev/null || echo 0)"
          passed="true"
          [[ ${engine_exit} -ne 0 ]] && passed="false"

          echo "found=$([[ ${count} -gt 0 ]] && echo 'true' || echo 'false')" \
            >> "${GITHUB_OUTPUT}"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload Custom Scan SARIF"
        if: always() && hashFiles('custom-secret-scan.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: custom-secret-scan.sarif
          category: "ash-custom-secrets"
        continue-on-error: true

      - name: "📤 Upload Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "custom-secret-results"
          path: |
            custom-secret-results.json
            custom-secret-scan.sarif
          retention-days: 30
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: GATE — Final security gate
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Security Gate — Secret Scanning"
    needs: [trufflehog, detect-secrets, custom-patterns]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "💬 Post PR Comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const thFound    = '${{ needs.trufflehog.outputs.found }}' === 'true';
            const thCount    = parseInt('${{ needs.trufflehog.outputs.count || 0 }}');
            const thPassed   = '${{ needs.trufflehog.outputs.passed || "true" }}' === 'true';
            const dsFound    = '${{ needs.detect-secrets.outputs.found }}' === 'true';
            const dsCount    = parseInt('${{ needs.detect-secrets.outputs.count || 0 }}');
            const dsPassed   = '${{ needs.detect-secrets.outputs.passed || "true" }}' === 'true';
            const cpFound    = '${{ needs.custom-patterns.outputs.found }}' === 'true';
            const cpCount    = parseInt('${{ needs.custom-patterns.outputs.count || 0 }}');
            const cpPassed   = '${{ needs.custom-patterns.outputs.passed || "true" }}' === 'true';

            const overallPassed = thPassed && dsPassed && cpPassed;
            const icon   = overallPassed ? '✅' : '🚨';
            const status = overallPassed ? 'PASSED' : 'SECRETS DETECTED';

            const body = `## 🕵️ Secret Scanning ${icon}

            **Status: ${status}**

            | Engine | Findings | Status |
            |--------|----------|--------|
            | 🔍 TruffleHog v3 | \`${thCount}\` verified | ${thPassed ? '✅' : '🚨'} |
            | 🔬 detect-secrets | \`${dsCount}\` patterns | ${dsPassed ? '✅' : '⚠️'} |
            | 🎯 Custom Engine | \`${cpCount}\` matches | ${cpPassed ? '✅' : '🚨'} |

            ${overallPassed
              ? '### ✅ No secrets detected — repository is clean!'
              : `### 🚨 SECRETS DETECTED — IMMEDIATE ACTION REQUIRED

            **⚠️ STOP: Do NOT merge this PR until secrets are removed and rotated!**

            Steps:
            1. 🔴 **Rotate ALL exposed credentials immediately**
            2. Remove from code and commit history
            3. Contact: security@ash-dotfiles.dev`
            }

            ---
            *🤖 ASH Multi-Engine Secret Scanner • TruffleHog • detect-secrets • Custom Patterns*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🕵️ Secret Scanning')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: "🚦 Evaluate Security Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 Secret Scanning Security Gate                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          th_passed="${{ needs.trufflehog.outputs.passed || 'true' }}"
          ds_passed="${{ needs.detect-secrets.outputs.passed || 'true' }}"
          cp_passed="${{ needs.custom-patterns.outputs.passed || 'true' }}"

          th_count="${{ needs.trufflehog.outputs.count || '0' }}"
          ds_count="${{ needs.detect-secrets.outputs.count || '0' }}"
          cp_count="${{ needs.custom-patterns.outputs.count || '0' }}"

          echo ""
          echo "  📊 Security Gate Summary:"
          echo "  ├── TruffleHog:    ${th_passed} (${th_count} findings)"
          echo "  ├── detect-secrets:${ds_passed} (${ds_count} findings)"
          echo "  └── Custom engine: ${cp_passed} (${cp_count} findings)"
          echo ""

          all_passed="true"
          [[ "${th_passed}" != "true" ]] && all_passed="false"
          [[ "${cp_passed}" != "true" ]] && all_passed="false"

          if [[ "${all_passed}" == "true" ]]; then
            echo "  ✅ SECURITY GATE: PASSED"
            echo "  🎉 All secret scanning engines report clean!"
          else
            echo "  ❌ SECURITY GATE: FAILED"
            echo ""
            echo "  🚨 CRITICAL: Secrets detected!"
            echo "  1. Rotate ALL exposed credentials immediately"
            echo "  2. Remove from codebase and git history"
            echo "  3. Contact: security@ash-dotfiles.dev"
            exit 1
          fi