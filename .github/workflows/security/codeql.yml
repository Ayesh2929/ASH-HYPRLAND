# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🔬 ASH DOTFILES v5.0 OMEGA — CODEQL ANALYSIS WORKFLOW                            ║
# ║                                                                                          ║
# ║      Ultra-Premium Static Application Security Testing (SAST) Pipeline                  ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      CodeQL v2+           •  Multi-Language       •  Custom Queries                   ║
# ║      Python Analysis      •  TypeScript/JS        •  Security Queries                ║
# ║      SARIF Upload         •  Incremental Scan     •  Query Suite Select             ║
# ║      Threat Modeling      •  Data Flow Analysis   •  Taint Tracking                ║
# ║      CWE Coverage         •  OWASP Mapping        •  False Positive Handling       ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🔬 CodeQL — Static Security Analysis"

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths:
      - "**/*.py"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "api/**"
      - "web/**"
      - "browser-extension/**"
      - ".github/workflows/security/codeql.yml"

  pull_request:
    branches: [main, develop, "release/**"]
    paths:
      - "**/*.py"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "api/**"
      - "web/**"
      - ".github/workflows/security/codeql.yml"
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      languages:
        description: "Languages to analyze (comma-separated)"
        required: false
        default: "python,javascript-typescript"
        type: string
      query_suite:
        description: "Query suite to use"
        required: false
        default: "security-and-quality"
        type: choice
        options:
          - security-extended
          - security-and-quality
          - security-experimental
      debug_mode:
        description: "Enable CodeQL debug mode"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  pull-requests: write
  security-events: write
  actions: read
  checks: write

concurrency:
  group: "codeql-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  QUERY_SUITE: "${{ inputs.query_suite || 'security-and-quality' }}"
  CODEQL_THREADS: "4"
  CODEQL_RAM: "4096"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: DISCOVER — Find languages to analyze
  # ────────────────────────────────────────────────────────────────────────────
  discover:
    name: "🔍 Discover Languages"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      language-matrix: ${{ steps.discover.outputs.matrix }}
      has-python:      ${{ steps.discover.outputs.has_python }}
      has-js-ts:       ${{ steps.discover.outputs.has_js_ts }}
      python-count:    ${{ steps.discover.outputs.python_count }}
      ts-count:        ${{ steps.discover.outputs.ts_count }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔍 Discover Languages for CodeQL"
        id: discover
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔬 CodeQL Language Discovery                               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Count files by language
          python_count="$(find . -name "*.py" \
            ! -path "./.git/*" ! -path "./node_modules/*" \
            ! -path "*/__pycache__/*" | wc -l)"

          ts_js_count="$(find . \( -name "*.ts" -o -name "*.tsx" \
            -o -name "*.js" -o -name "*.jsx" \) \
            ! -path "./.git/*" ! -path "./node_modules/*" \
            ! -name "*.d.ts" | wc -l)"

          has_python="false"
          has_js_ts="false"
          [[ ${python_count} -gt 0 ]] && has_python="true"
          [[ ${ts_js_count} -gt 0 ]] && has_js_ts="true"

          echo ""
          echo "  📊 Language Discovery:"
          printf "  ├── Python files:       %d\n" "${python_count}"
          printf "  ├── TypeScript/JS files:%d\n" "${ts_js_count}"
          printf "  ├── Has Python:         %s\n" "${has_python}"
          printf "  └── Has JS/TS:          %s\n" "${has_js_ts}"

          # Build language matrix
          matrix_include="[]"

          if [[ "${has_python}" == "true" ]]; then
            matrix_include="$(echo "${matrix_include}" | jq \
              '. += [{"language": "python", "build_mode": "none"}]')"
            echo "  ✅ Added: Python analysis"
          fi

          if [[ "${has_js_ts}" == "true" ]]; then
            matrix_include="$(echo "${matrix_include}" | jq \
              '. += [{"language": "javascript-typescript", "build_mode": "none"}]')"
            echo "  ✅ Added: JavaScript/TypeScript analysis"
          fi

          echo "matrix={\"include\": ${matrix_include}}" >> "${GITHUB_OUTPUT}"
          echo "has_python=${has_python}"   >> "${GITHUB_OUTPUT}"
          echo "has_js_ts=${has_js_ts}"     >> "${GITHUB_OUTPUT}"
          echo "python_count=${python_count}" >> "${GITHUB_OUTPUT}"
          echo "ts_count=${ts_js_count}"    >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: CUSTOM-QUERIES — Generate ASH-specific CodeQL queries
  # ────────────────────────────────────────────────────────────────────────────
  custom-queries:
    name: "⚙️ Generate Custom Queries"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Generate ASH Custom CodeQL Queries"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ⚙️  ASH Custom CodeQL Query Generator                       ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          mkdir -p .codeql/queries/python \
                   .codeql/queries/javascript \
                   .codeql/suites

          # ── Python query: Unsafe shell command construction ───────────────
          cat > .codeql/queries/python/unsafe-shell-command.ql << 'PYQUERY'
          /**
           * @name Unsafe shell command construction (ASH)
           * @description Detects string concatenation used to build shell commands
           *              in ASH API server code without proper sanitization.
           * @kind problem
           * @id ash/python/unsafe-shell-command
           * @severity error
           * @tags security
           *       correctness
           *       CWE-78
           */

          import python
          import semmle.python.security.dataflow.CommandInjectionQuery

          from CommandInjectionSink sink, DataFlow::PathNode source, DataFlow::PathNode sinkNode
          where
            CommandInjectionFlow::flowPath(source, sinkNode) and
            sinkNode.getNode() = sink
          select sink, source, sinkNode,
            "Possible command injection: user data flows to shell command."
          PYQUERY

          # ── Python query: Hardcoded secrets ──────────────────────────────
          cat > .codeql/queries/python/hardcoded-secret.ql << 'PYSECRET'
          /**
           * @name Hardcoded credential or secret (ASH)
           * @description Finds hardcoded passwords, API keys, or tokens
           *              in ASH server code.
           * @kind problem
           * @id ash/python/hardcoded-secret
           * @severity error
           * @tags security
           *       CWE-798
           */

          import python

          from AssignStmt assign, StringLiteral value, Attribute attr
          where
            assign.getValue() = value and
            assign.getATarget() = attr and
            attr.getName().regexpMatch("(?i)(password|passwd|secret|api_key|token|credential)") and
            value.getText().length() > 8 and
            not value.getText().regexpMatch("(?i)(test|example|placeholder|dummy|your_.*_here|\\$\\{.*\\})")
          select assign, "Possible hardcoded secret in '" + attr.getName() + "'."
          PYSECRET

          # ── Python query: SQL injection in FastAPI ──────────────────────
          cat > .codeql/queries/python/fastapi-sql-injection.ql << 'PYSQL'
          /**
           * @name SQL injection via FastAPI route parameter (ASH)
           * @description Detects user-controlled route parameters used
           *              directly in SQL queries without parameterization.
           * @kind path-problem
           * @id ash/python/fastapi-sql-injection
           * @severity error
           * @tags security
           *       CWE-89
           */

          import python
          import semmle.python.security.dataflow.SqlInjectionQuery

          from SqlInjectionSink sink, DataFlow::PathNode source, DataFlow::PathNode sinkNode
          where SqlInjectionFlow::flowPath(source, sinkNode) and sinkNode.getNode() = sink
          select sink, source, sinkNode,
            "SQL injection: unsanitized data flows to SQL query."
          PYSQL

          # ── JavaScript query: Prototype pollution ────────────────────────
          cat > .codeql/queries/javascript/prototype-pollution.ql << 'JSPROTO'
          /**
           * @name Prototype pollution in ASH web dashboard
           * @description Detects patterns that may allow prototype pollution
           *              in the ASH web dashboard TypeScript code.
           * @kind problem
           * @id ash/javascript/prototype-pollution
           * @severity warning
           * @tags security
           *       CWE-1321
           */

          import javascript

          from PropAccess access, string propName
          where
            propName = access.getPropertyName() and
            propName.regexpMatch("__proto__|constructor|prototype") and
            exists(AssignExpr assign | assign.getLhs() = access)
          select access, "Potential prototype pollution via property '" + propName + "'."
          JSPROTO

          # ── JavaScript query: XSS in React components ────────────────────
          cat > .codeql/queries/javascript/react-xss.ql << 'JSXSS'
          /**
           * @name Cross-site scripting in React component (ASH Dashboard)
           * @description Detects dangerouslySetInnerHTML usage with
           *              potentially unsanitized content in ASH dashboard.
           * @kind problem
           * @id ash/javascript/react-xss
           * @severity error
           * @tags security
           *       CWE-79
           */

          import javascript
          import semmle.javascript.frameworks.React

          from JsxAttribute attr, DataFlow::Node source
          where
            attr.getName() = "dangerouslySetInnerHTML" and
            not exists(SanitizingGuard guard | guard.sanitizes(_, source))
          select attr, "Potential XSS via dangerouslySetInnerHTML — ensure content is sanitized."
          JSXSS

          # ── Query suite definition ────────────────────────────────────────
          cat > .codeql/suites/ash-security.qls << 'SUITE'
          # ASH Dotfiles Custom Security Query Suite
          - description: "ASH Dotfiles custom security queries"
          - queries: .
            from: ash/python/unsafe-shell-command.ql
            from: ash/python/hardcoded-secret.ql
            from: ash/python/fastapi-sql-injection.ql
            from: ash/javascript/prototype-pollution.ql
            from: ash/javascript/react-xss.ql
          SUITE

          echo ""
          echo "  ✅ Custom queries generated:"
          find .codeql -name "*.ql" | while IFS= read -r q; do
            echo "     → ${q}"
          done

      - name: "📤 Cache Custom Queries"
        uses: actions/cache/save@v4
        with:
          path: .codeql/
          key: "codeql-queries-${{ github.sha }}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: ANALYZE — Run CodeQL on each language
  # ────────────────────────────────────────────────────────────────────────────
  analyze:
    name: "🔬 CodeQL [${{ matrix.language }}]"
    needs: [discover, custom-queries]
    if: needs.discover.outputs.has-python == 'true' || needs.discover.outputs.has-js-ts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.language-matrix) }}

    permissions:
      actions: read
      contents: read
      security-events: write

    outputs:
      alerts-${{ matrix.language }}: ${{ steps.analyze.outputs.alerts }}
      passed-${{ matrix.language }}: ${{ steps.analyze.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: "📥 Restore Custom Queries"
        uses: actions/cache/restore@v4
        with:
          path: .codeql/
          key: "codeql-queries-${{ github.sha }}"
          restore-keys: "codeql-queries-"

      - name: "⚙️ Setup CodeQL Environment"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔬 CodeQL [${{ matrix.language }}] Setup                    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Language-specific setup
          case "${{ matrix.language }}" in
            python)
              echo "  🐍 Python setup..."
              sudo apt-get install -qq -y python3 python3-pip 2>/dev/null
              [[ -f "api/requirements.txt" ]] && \
                pip3 install -q -r api/requirements.txt 2>/dev/null || true
              [[ -f "requirements.txt" ]] && \
                pip3 install -q -r requirements.txt 2>/dev/null || true
              echo "  ✅ Python environment ready"
              ;;
            javascript-typescript)
              echo "  🟨 JavaScript/TypeScript setup..."
              if [[ -f "package.json" ]]; then
                npm ci --silent 2>/dev/null || npm install --silent 2>/dev/null || true
              fi
              if [[ -f "web/package.json" ]]; then
                cd web && npm ci --silent 2>/dev/null || true && cd -
              fi
              echo "  ✅ JS/TS environment ready"
              ;;
          esac

      - name: "🔬 Initialize CodeQL"
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          queries: >-
            +security-and-quality,
            +security-extended
          config: |
            name: "ASH Dotfiles CodeQL Config"
            queries:
              - uses: security-and-quality
              - uses: security-extended
            paths-ignore:
              - node_modules
              - .git
              - "**/*.test.ts"
              - "**/*.spec.ts"
              - "tests/**"
              - "docs/**"
              - dist
              - build
            query-filters:
              - exclude:
                  problem.severity:
                    - recommendation
          trap-for-errors: false

      - name: "🔨 Build (if needed)"
        if: matrix.build_mode == 'manual'
        shell: bash
        run: |
          case "${{ matrix.language }}" in
            python)
              echo "  🐍 Python: no build needed"
              ;;
            javascript-typescript)
              echo "  🟨 JS/TS: attempting build..."
              [[ -f "web/package.json" ]] && {
                cd web && npm run build 2>/dev/null || true && cd -
              } || true
              ;;
          esac

      - name: "🔬 Perform CodeQL Analysis"
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: "codeql-results-${{ matrix.language }}.sarif"
          upload: true
          wait-for-processing: true
          add-snippet: true
        continue-on-error: true

      - name: "📊 Process CodeQL Results"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📊 CodeQL [${{ matrix.language }}] Results                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          sarif_file="codeql-results-${{ matrix.language }}.sarif"

          if [[ ! -f "${sarif_file}" ]]; then
            echo "  ℹ️  SARIF file not found — CodeQL may still be processing"
            echo "alerts=0" >> "${GITHUB_OUTPUT}"
            echo "passed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Parse results
          total_alerts="$(jq '
            [.runs[]?.results[]?] | length
          ' "${sarif_file}" 2>/dev/null || echo 0)"

          error_alerts="$(jq '
            [.runs[]?.results[]? |
             select(.level == "error")] | length
          ' "${sarif_file}" 2>/dev/null || echo 0)"

          warning_alerts="$(jq '
            [.runs[]?.results[]? |
             select(.level == "warning")] | length
          ' "${sarif_file}" 2>/dev/null || echo 0)"

          # Display findings by rule
          if [[ ${total_alerts} -gt 0 ]]; then
            echo ""
            echo "  🔍 Findings by rule:"
            jq -r '
              [.runs[]?.results[]?] |
              group_by(.ruleId) |
              .[] |
              "  [\(length)] \(.[0].ruleId): \(.[0].message.text[0:80])"
            ' "${sarif_file}" 2>/dev/null | head -30

            echo ""
            echo "  🔍 Findings by severity:"
            jq -r '
              [.runs[]?.results[]?] |
              group_by(.level) |
              .[] |
              "  [\(.[0].level // "note")]: \(length) finding(s)"
            ' "${sarif_file}" 2>/dev/null

            # CWE summary
            echo ""
            echo "  🔍 CWE Coverage:"
            jq -r '
              [.runs[]?.results[]?.properties?.tags[]? |
               select(startswith("CWE-"))] |
              group_by(.) |
              .[] |
              "  \(.[0]): \(length) finding(s)"
            ' "${sarif_file}" 2>/dev/null | head -15
          else
            echo "  ✅ No security alerts found!"
          fi

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  🔬 Language:        %-34s║\n" "${{ matrix.language }}"
          printf "║  ❌ Error alerts:    %-34s║\n" "${error_alerts}"
          printf "║  ⚠️  Warning alerts:  %-34s║\n" "${warning_alerts}"
          printf "║  📊 Total findings:  %-34s║\n" "${total_alerts}"
          echo "╠══════════════════════════════════════════════════════════════╣"

          passed="true"
          [[ ${error_alerts} -gt 0 ]] && passed="false"
          [[ "${passed}" == "true" ]] && \
            echo "║  ✅ STATUS: PASSED                                          ║" || \
            echo "║  ❌ STATUS: SECURITY ISSUES FOUND                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "alerts=${total_alerts}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"       >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Security Gate — CodeQL"
    needs: [discover, analyze]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "💬 Post PR Comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pythonCount  = '${{ needs.discover.outputs.python-count || 0 }}';
            const tsCount      = '${{ needs.discover.outputs.ts-count || 0 }}';
            const analyzeResult= '${{ needs.analyze.result }}';
            const passed       = analyzeResult === 'success' || analyzeResult === 'skipped';
            const querySuite   = '${{ env.QUERY_SUITE }}';

            const body = `## 🔬 CodeQL Security Analysis ${passed ? '✅' : '❌'}

            **Status: ${passed ? 'PASSED' : 'FAILED'}** | Suite: \`${querySuite}\`

            ### 📊 Languages Analyzed

            | Language | Files | Status |
            |----------|-------|--------|
            | 🐍 Python | \`${pythonCount}\` | ${parseInt(pythonCount) > 0 ? 'Analyzed ✅' : 'Not found'} |
            | 🟨 TypeScript/JS | \`${tsCount}\` | ${parseInt(tsCount) > 0 ? 'Analyzed ✅' : 'Not found'} |

            ### 🎯 Queries Used

            - **Security & Quality** — CWE-78, CWE-79, CWE-89, CWE-798, CWE-1321
            - **ASH Custom** — Shell injection, FastAPI SQL, React XSS, Proto pollution
            - **Security Extended** — Additional security rules

            ${passed
              ? '### ✅ No critical security issues found!'
              : `### 🔧 Security Issues Found\n\nReview the [Code Scanning Alerts](${{ github.server_url }}/${{ github.repository }}/security/code-scanning) and fix all ERROR-level findings before merging.`
            }

            ---
            *🤖 ASH CodeQL v2 • Query suite: ${querySuite} • [Security Alerts](${{ github.server_url }}/${{ github.repository }}/security/code-scanning)*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🔬 CodeQL Security Analysis')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: "🚦 Evaluate Security Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 CodeQL Security Gate                                    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          analyze_result="${{ needs.analyze.result }}"
          python_count="${{ needs.discover.outputs.python-count || '0' }}"
          ts_count="${{ needs.discover.outputs.ts-count || '0' }}"

          echo ""
          echo "  📊 Gate Summary:"
          echo "  ├── Analysis result: ${analyze_result}"
          echo "  ├── Python files:    ${python_count}"
          echo "  └── TS/JS files:     ${ts_count}"
          echo ""

          if [[ "${analyze_result}" == "success" ]] || \
             [[ "${analyze_result}" == "skipped" ]]; then
            echo "  ✅ SECURITY GATE: PASSED"
            echo "  🎉 CodeQL analysis complete — no critical issues!"
            echo ""
            echo "  Analyzed with:"
            echo "  → Query suite: ${{ env.QUERY_SUITE }}"
            echo "  → Custom queries: ASH-specific security patterns"
            echo "  → CWE coverage: 78, 79, 89, 798, 1321+"
          else
            echo "  ❌ SECURITY GATE: FAILED"
            echo "  Fix all CodeQL ERROR-level findings before merging."
            echo "  Review: ${{ github.server_url }}/${{ github.repository }}/security/code-scanning"
            exit 1
          fi