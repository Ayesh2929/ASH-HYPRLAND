# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🔍 ASH DOTFILES v5.0 OMEGA — TRIVY VULNERABILITY SCANNER WORKFLOW                ║
# ║                                                                                          ║
# ║      Ultra-Premium Container & Filesystem Vulnerability Scanning Pipeline               ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      Trivy v0.57+         •  CVE Database         •  SBOM Generation                 ║
# ║      Filesystem Scan      •  Container Scan        •  Dependency Scan                ║
# ║      Misconfiguration     •  License Audit         •  Supply Chain                  ║
# ║      SARIF Upload         •  VEX Support           •  Compliance Check              ║
# ║      Multi-Target         •  Delta Reporting       •  Trend Analysis               ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🔍 Trivy — Vulnerability Scanning"

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths:
      - "**/*.py"
      - "**/*.ts"
      - "**/*.js"
      - "**/requirements*.txt"
      - "**/package.json"
      - "**/Cargo.toml"
      - "**/go.mod"
      - "**/pyproject.toml"
      - "docker/**"
      - "Dockerfile*"
      - ".github/workflows/security/trivy-scan.yml"

  pull_request:
    branches: [main, develop, "release/**"]
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      scan_type:
        description: "Scan type"
        required: false
        default: "fs"
        type: choice
        options: [fs, config, sbom, image, all]
      severity:
        description: "Minimum severity to report"
        required: false
        default: "HIGH,CRITICAL"
        type: choice
        options:
          - CRITICAL
          - HIGH,CRITICAL
          - MEDIUM,HIGH,CRITICAL
          - LOW,MEDIUM,HIGH,CRITICAL
      ignore_unfixed:
        description: "Ignore unfixable CVEs"
        required: false
        default: true
        type: boolean
      exit_code:
        description: "Exit code when vulnerabilities found"
        required: false
        default: "1"
        type: string

  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  pull-requests: write
  security-events: write
  checks: write

concurrency:
  group: "trivy-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  TRIVY_VERSION: "0.57.1"
  SEVERITY: "${{ inputs.severity || 'HIGH,CRITICAL' }}"
  EXIT_CODE: "${{ inputs.exit_code || '1' }}"
  IGNORE_UNFIXED: "${{ inputs.ignore_unfixed || 'true' }}"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: SETUP — Install Trivy and configure
  # ────────────────────────────────────────────────────────────────────────────
  setup:
    name: "🛠️ Setup Trivy Scanner"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      trivy-version: ${{ steps.install.outputs.version }}
      db-updated:    ${{ steps.install.outputs.db_updated }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🛠️ Install Trivy v${{ env.TRIVY_VERSION }}"
        id: install
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🛠️  Installing Trivy v${{ env.TRIVY_VERSION }}               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Install via apt (most reliable)
          sudo apt-get install -qq -y wget apt-transport-https gnupg 2>/dev/null

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list > /dev/null

          sudo apt-get update -qq 2>/dev/null
          sudo apt-get install -qq -y "trivy=${{ env.TRIVY_VERSION }}-1" \
            2>/dev/null || sudo apt-get install -qq -y trivy 2>/dev/null

          version="$(trivy --version | head -1 | awk '{print $2}')"
          echo ""
          echo "  ✅ Trivy installed: ${version}"

          # Update vulnerability database
          echo "  🔄 Updating vulnerability database..."
          trivy image --download-db-only 2>/dev/null || true

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "db_updated=true"   >> "${GITHUB_OUTPUT}"

      - name: "⚙️ Generate Trivy Configuration"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ⚙️  Trivy Configuration Generator                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          if [[ -f "trivy.yaml" ]] || [[ -f ".trivy.yaml" ]]; then
            echo "  ✅ Using repository Trivy config"
          else
            cat > trivy.yaml << 'TRIVYCONFIG'
          # ASH Dotfiles v5.0 OMEGA — Trivy Configuration
          # https://aquasecurity.github.io/trivy/docs/configuration/

          # Scan settings
          severity: ["HIGH", "CRITICAL"]
          exit-code: 1
          ignore-unfixed: true
          timeout: 10m
          parallel: 5
          cache-dir: /tmp/.trivy-cache

          # Output format
          format: sarif
          output: trivy-results.sarif

          # Vulnerability settings
          vuln-type: ["os", "library"]

          # Misconfiguration scanning
          misconfig-scanners: ["terraform", "dockerfile", "kubernetes", "helm"]

          # Secret detection
          secret: false  # Handled by gitleaks

          # License compliance
          license-full: true
          ignored-licenses:
            - MIT
            - Apache-2.0
            - BSD-2-Clause
            - BSD-3-Clause
            - ISC
            - CC0-1.0
            - MPL-2.0
            - CC-BY-4.0
            - GPL-2.0-only  # Need review but acceptable for tools
            - GPL-3.0-only  # Need review but acceptable for tools

          # Scanners to enable
          scanners:
            - vuln
            - config
            - license

          # File patterns to skip
          skip-files:
            - "**/*.lock"
            - "**/node_modules/**"
            - "**/.git/**"
            - "**/testdata/**"
            - "tests/fixtures/**"

          # Ignore specific CVEs (with justification)
          .trivyignore-policy: .trivyignore

          TRIVYCONFIG
            echo "  ✅ trivy.yaml generated"
          fi

          # Generate .trivyignore for known false positives
          if [[ ! -f ".trivyignore" ]]; then
            cat > .trivyignore << 'TRIVYIGNORE'
          # ASH Dotfiles — Trivy Ignore File
          # Format: CVE-ID [expiry-date] [comment]
          #
          # Add false positives or accepted risks here with justification.
          # Example:
          # CVE-2023-XXXXX 2024-12-31 # Not exploitable in our context

          TRIVYIGNORE
            echo "  ✅ .trivyignore created"
          fi

      - name: "📤 Cache Trivy Config"
        uses: actions/cache/save@v4
        with:
          path: |
            trivy.yaml
            .trivyignore
          key: "trivy-config-${{ github.sha }}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: FS-SCAN — Filesystem vulnerability scan
  # ────────────────────────────────────────────────────────────────────────────
  fs-scan:
    name: "📂 Filesystem Vulnerability Scan"
    needs: setup
    if: >
      inputs.scan_type == 'fs' ||
      inputs.scan_type == 'all' ||
      inputs.scan_type == null ||
      inputs.scan_type == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    outputs:
      vulns-found: ${{ steps.scan.outputs.vulns_found }}
      critical:    ${{ steps.scan.outputs.critical }}
      high:        ${{ steps.scan.outputs.high }}
      passed:      ${{ steps.scan.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🛠️ Install Trivy"
        shell: bash
        run: |
          sudo apt-get install -qq -y wget gnupg 2>/dev/null
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list > /dev/null
          sudo apt-get update -qq 2>/dev/null
          sudo apt-get install -qq -y trivy 2>/dev/null

      - name: "📥 Restore Config"
        uses: actions/cache/restore@v4
        with:
          path: |
            trivy.yaml
            .trivyignore
          key: "trivy-config-${{ github.sha }}"
          restore-keys: "trivy-config-"

      - name: "📂 Run Filesystem Scan"
        id: scan
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📂 Trivy Filesystem Vulnerability Scan                     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          mkdir -p trivy-results

          echo "  📊 Scan Configuration:"
          echo "  ├── Target:        . (repository root)"
          echo "  ├── Severity:      ${{ env.SEVERITY }}"
          echo "  ├── Ignore unfixed:${{ env.IGNORE_UNFIXED }}"
          echo "  └── Scanners:      vuln, config, license"
          echo ""

          # Filesystem scan
          fs_exit=0
          trivy fs \
            --severity="${{ env.SEVERITY }}" \
            --format=sarif \
            --output=trivy-results/fs-results.sarif \
            --ignore-unfixed=${{ env.IGNORE_UNFIXED }} \
            --exit-code=${{ env.EXIT_CODE }} \
            --scanners=vuln,config,license \
            --cache-dir=/tmp/.trivy-cache \
            --skip-files="*.lock,**/testdata/**,tests/fixtures/**" \
            . 2>&1 | tee /tmp/trivy-fs-output.txt || fs_exit=$?

          # JSON report for processing
          trivy fs \
            --severity="${{ env.SEVERITY }}" \
            --format=json \
            --output=trivy-results/fs-results.json \
            --ignore-unfixed=${{ env.IGNORE_UNFIXED }} \
            --exit-code=0 \
            --scanners=vuln,config,license \
            --cache-dir=/tmp/.trivy-cache \
            . 2>/dev/null || true

          # Parse results
          critical=0
          high=0
          medium=0
          low=0
          total=0
          vulns_found="false"

          if [[ -f "trivy-results/fs-results.json" ]]; then
            critical="$(jq '
              [.Results[]?.Vulnerabilities[]? |
               select(.Severity == "CRITICAL")] | length
            ' trivy-results/fs-results.json 2>/dev/null || echo 0)"

            high="$(jq '
              [.Results[]?.Vulnerabilities[]? |
               select(.Severity == "HIGH")] | length
            ' trivy-results/fs-results.json 2>/dev/null || echo 0)"

            medium="$(jq '
              [.Results[]?.Vulnerabilities[]? |
               select(.Severity == "MEDIUM")] | length
            ' trivy-results/fs-results.json 2>/dev/null || echo 0)"

            low="$(jq '
              [.Results[]?.Vulnerabilities[]? |
               select(.Severity == "LOW")] | length
            ' trivy-results/fs-results.json 2>/dev/null || echo 0)"

            total=$((critical + high + medium + low))
          fi

          [[ ${total} -gt 0 ]] && vulns_found="true"

          # Display vulnerability summary
          if [[ ${total} -gt 0 ]]; then
            echo "  📋 Vulnerabilities found:"
            echo ""
            jq -r '
              .Results[] |
              select(.Vulnerabilities != null) |
              "  📦 \(.Target) [\(.Class)]",
              (.Vulnerabilities[] |
                "     \(if .Severity == "CRITICAL" then "🔴" elif .Severity == "HIGH" then "🟠" elif .Severity == "MEDIUM" then "🟡" else "⚪" end) [\(.Severity)] \(.VulnerabilityID): \(.PkgName) \(.InstalledVersion) → \(.FixedVersion // "no fix")"
              )
            ' trivy-results/fs-results.json 2>/dev/null | head -60

            echo ""
            echo "  📊 Affected packages:"
            jq -r '
              [.Results[]?.Vulnerabilities[]? | .PkgName] |
              group_by(.) |
              .[] |
              "     \(.[0]): \(length) CVE(s)"
            ' trivy-results/fs-results.json 2>/dev/null | head -20
          fi

          # Misconfigurations
          misconfig_count="$(jq '
            [.Results[]?.Misconfigurations[]?] | length
          ' trivy-results/fs-results.json 2>/dev/null || echo 0)"

          if [[ ${misconfig_count} -gt 0 ]]; then
            echo ""
            echo "  ⚙️  Misconfigurations found: ${misconfig_count}"
            jq -r '
              .Results[]? |
              select(.Misconfigurations != null) |
              .Misconfigurations[] |
              "  ⚠️  [\(.Severity)] \(.ID): \(.Title)"
            ' trivy-results/fs-results.json 2>/dev/null | head -20
          fi

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📊 TRIVY FILESYSTEM SCAN RESULTS                           ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  🔴 Critical:        %-34s║\n" "${critical}"
          printf "║  🟠 High:            %-34s║\n" "${high}"
          printf "║  🟡 Medium:          %-34s║\n" "${medium}"
          printf "║  ⚪ Low:             %-34s║\n" "${low}"
          printf "║  ⚙️  Misconfigs:      %-34s║\n" "${misconfig_count}"
          printf "║  📊 Total:           %-34s║\n" "${total}"
          echo "╠══════════════════════════════════════════════════════════════╣"

          passed="true"
          if [[ ${fs_exit} -ne 0 ]] || [[ ${critical} -gt 0 ]]; then
            passed="false"
            echo "║  ❌ STATUS: VULNERABILITIES FOUND                           ║"
          else
            echo "║  ✅ STATUS: CLEAN                                            ║"
          fi
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "vulns_found=${vulns_found}" >> "${GITHUB_OUTPUT}"
          echo "critical=${critical}"       >> "${GITHUB_OUTPUT}"
          echo "high=${high}"               >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"           >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload Filesystem SARIF"
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results/fs-results.sarif
          category: "trivy-filesystem"
        continue-on-error: true

      - name: "📤 Upload Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "trivy-fs-results"
          path: trivy-results/
          retention-days: 30
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: DOCKER-SCAN — Container image scan
  # ────────────────────────────────────────────────────────────────────────────
  docker-scan:
    name: "🐋 Container Image Scan"
    needs: setup
    if: >
      inputs.scan_type == 'image' ||
      inputs.scan_type == 'all' ||
      (hashFiles('docker/Dockerfile', 'Dockerfile') != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    outputs:
      docker-critical: ${{ steps.docker.outputs.critical }}
      docker-passed:   ${{ steps.docker.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🛠️ Install Trivy"
        shell: bash
        run: |
          sudo apt-get install -qq -y wget gnupg 2>/dev/null
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list > /dev/null
          sudo apt-get update -qq 2>/dev/null
          sudo apt-get install -qq -y trivy 2>/dev/null

      - name: "🐋 Build & Scan Docker Images"
        id: docker
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🐋 Container Image Vulnerability Scan                      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          mkdir -p trivy-results

          total_critical=0
          total_high=0
          images_scanned=0

          # Find Dockerfiles
          mapfile -t dockerfiles < <(
            find . -name "Dockerfile*" ! -name "*.test" \
              ! -path "./.git/*" | sort
          )

          if [[ ${#dockerfiles[@]} -eq 0 ]]; then
            echo "  ℹ️  No Dockerfiles found — scanning base images instead"

            # Scan ASH's base images
            BASE_IMAGES=(
              "archlinux:latest"
              "ubuntu:24.04"
              "python:3.12-slim"
            )

            for image in "${BASE_IMAGES[@]}"; do
              echo "  🐋 Scanning: ${image}"
              image_tag="$(echo "${image}" | tr '/:' '-')"

              trivy image \
                --severity="${{ env.SEVERITY }}" \
                --format=json \
                --output="trivy-results/image-${image_tag}.json" \
                --ignore-unfixed=${{ env.IGNORE_UNFIXED }} \
                --exit-code=0 \
                --cache-dir=/tmp/.trivy-cache \
                "${image}" 2>/dev/null || true

              if [[ -f "trivy-results/image-${image_tag}.json" ]]; then
                crit="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' \
                  "trivy-results/image-${image_tag}.json" 2>/dev/null || echo 0)"
                hi="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' \
                  "trivy-results/image-${image_tag}.json" 2>/dev/null || echo 0)"
                total_critical=$((total_critical + crit))
                total_high=$((total_high + hi))
                printf "     %-40s CRITICAL: %d HIGH: %d\n" \
                  "${image}" "${crit}" "${hi}"
              fi
              images_scanned=$((images_scanned + 1))
            done
          else
            echo "  🐋 Building and scanning ${#dockerfiles[@]} Dockerfile(s)..."
            for df in "${dockerfiles[@]}"; do
              df_dir="$(dirname "${df}")"
              image_name="ash-test-$(echo "${df}" | tr '/' '-' | tr '.' '-'):ci"

              echo "  🔨 Building: ${df}"
              docker build -t "${image_name}" \
                -f "${df}" "${df_dir}" \
                --no-cache \
                2>/dev/null || {
                echo "  ⚠️  Build failed for ${df} — skipping"
                continue
              }

              echo "  🔍 Scanning: ${image_name}"
              trivy image \
                --severity="${{ env.SEVERITY }}" \
                --format=json \
                --output="trivy-results/image-$(basename "${df}").json" \
                --ignore-unfixed=${{ env.IGNORE_UNFIXED }} \
                --exit-code=0 \
                --cache-dir=/tmp/.trivy-cache \
                "${image_name}" 2>/dev/null || true

              images_scanned=$((images_scanned + 1))
            done
          fi

          passed="true"
          [[ ${total_critical} -gt 0 ]] && passed="false"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  🐋 Images scanned:  %-36s║\n" "${images_scanned}"
          printf "║  🔴 Critical CVEs:   %-36s║\n" "${total_critical}"
          printf "║  🟠 High CVEs:       %-36s║\n" "${total_high}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          [[ "${passed}" == "true" ]] && \
            echo "║  ✅ STATUS: CONTAINER SCAN PASSED                           ║" || \
            echo "║  ❌ STATUS: CRITICAL VULNERABILITIES IN IMAGES              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "critical=${total_critical}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"           >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload Docker Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "trivy-docker-results"
          path: trivy-results/
          retention-days: 30
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: SBOM — Generate Software Bill of Materials
  # ────────────────────────────────────────────────────────────────────────────
  sbom:
    name: "📋 SBOM Generation"
    needs: setup
    if: >
      inputs.scan_type == 'sbom' ||
      inputs.scan_type == 'all' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🛠️ Install Trivy"
        shell: bash
        run: |
          sudo apt-get install -qq -y wget gnupg 2>/dev/null
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list > /dev/null
          sudo apt-get update -qq 2>/dev/null
          sudo apt-get install -qq -y trivy 2>/dev/null

      - name: "📋 Generate SBOM (CycloneDX + SPDX)"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📋 Software Bill of Materials Generation                   ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          mkdir -p sbom

          ash_version="unknown"
          [[ -f "version.json" ]] && \
            ash_version="$(jq -r '.version // "unknown"' version.json 2>/dev/null)"

          echo "  📊 Generating SBOM for ASH Dotfiles v${ash_version}..."
          echo ""

          # CycloneDX format
          echo "  📋 CycloneDX SBOM..."
          trivy fs \
            --format=cyclonedx \
            --output=sbom/ash-dotfiles-sbom.cdx.json \
            --exit-code=0 \
            --scanners=vuln,license \
            --cache-dir=/tmp/.trivy-cache \
            . 2>/dev/null || true

          # SPDX format
          echo "  📋 SPDX SBOM..."
          trivy fs \
            --format=spdx-json \
            --output=sbom/ash-dotfiles-sbom.spdx.json \
            --exit-code=0 \
            --scanners=vuln,license \
            --cache-dir=/tmp/.trivy-cache \
            . 2>/dev/null || true

          # License report
          echo "  📋 License report..."
          trivy fs \
            --format=json \
            --output=sbom/ash-dotfiles-licenses.json \
            --exit-code=0 \
            --scanners=license \
            --license-full=true \
            --cache-dir=/tmp/.trivy-cache \
            . 2>/dev/null || true

          # Parse license summary
          if [[ -f "sbom/ash-dotfiles-licenses.json" ]]; then
            echo ""
            echo "  📜 License Summary:"
            jq -r '
              [.Results[]?.Licenses[]?.Name] |
              group_by(.) |
              sort_by(-length) |
              .[] |
              "     \(length)x \(.[0])"
            ' sbom/ash-dotfiles-licenses.json 2>/dev/null | head -20
          fi

          # Display SBOM statistics
          echo ""
          for sbom_file in sbom/ash-dotfiles-sbom.cdx.json \
                           sbom/ash-dotfiles-sbom.spdx.json; do
            if [[ -f "${sbom_file}" ]]; then
              size="$(du -sh "${sbom_file}" | cut -f1)"
              components="$(jq '.components | length' "${sbom_file}" 2>/dev/null || \
                jq '.packages | length' "${sbom_file}" 2>/dev/null || echo '?')"
              printf "  ✅ %-45s %s (%s components)\n" \
                "$(basename "${sbom_file}")" "${size}" "${components}"
            fi
          done

      - name: "📤 Upload SBOM"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "ash-dotfiles-sbom"
          path: sbom/
          retention-days: 90
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 05: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Security Gate — Vulnerability Scan"
    needs: [setup, fs-scan, docker-scan]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "💬 Post PR Comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fsCritical  = parseInt('${{ needs.fs-scan.outputs.critical || 0 }}');
            const fsHigh      = parseInt('${{ needs.fs-scan.outputs.high || 0 }}');
            const fsPassed    = '${{ needs.fs-scan.outputs.passed || "true" }}' === 'true';
            const dkrCritical = parseInt('${{ needs.docker-scan.outputs.docker-critical || 0 }}');
            const dkrPassed   = '${{ needs.docker-scan.outputs.docker-passed || "true" }}' === 'true';
            const severity    = '${{ env.SEVERITY }}';

            const overallPassed = fsPassed && dkrPassed;
            const icon = overallPassed ? '✅' : '❌';

            const body = `## 🔍 Trivy Vulnerability Scan ${icon}

            **Status: ${overallPassed ? 'PASSED' : 'FAILED'}** | Severity threshold: \`${severity}\`

            | Scan Target | Critical | High | Status |
            |-------------|----------|------|--------|
            | 📂 Filesystem | \`${fsCritical}\` | \`${fsHigh}\` | ${fsPassed ? '✅' : '❌'} |
            | 🐋 Containers | \`${dkrCritical}\` | — | ${dkrPassed ? '✅' : '❌'} |

            ${overallPassed
              ? '### ✅ No critical vulnerabilities detected!'
              : `### 🔧 Vulnerabilities Require Attention\n\nReview the [Security Alerts](${{ github.server_url }}/${{ github.repository }}/security/code-scanning) and update affected dependencies.`
            }

            ---
            *🤖 ASH Trivy v${{ env.TRIVY_VERSION }} • [Security Dashboard](${{ github.server_url }}/${{ github.repository }}/security)*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🔍 Trivy Vulnerability Scan')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: "🚦 Evaluate Security Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 Trivy Security Gate                                     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          fs_passed="${{ needs.fs-scan.outputs.passed || 'true' }}"
          dk_passed="${{ needs.docker-scan.outputs.docker-passed || 'true' }}"
          fs_critical="${{ needs.fs-scan.outputs.critical || '0' }}"

          echo ""
          echo "  📊 Gate Summary:"
          echo "  ├── Filesystem scan: ${fs_passed} (critical: ${fs_critical})"
          echo "  └── Docker scan:     ${dk_passed}"
          echo ""

          all_passed="true"
          [[ "${fs_passed}" != "true" ]] && all_passed="false"
          [[ "${dk_passed}" != "true" ]] && all_passed="false"

          if [[ "${all_passed}" == "true" ]]; then
            echo "  ✅ SECURITY GATE: PASSED"
            echo "  🎉 No critical vulnerabilities detected!"
          else
            echo "  ❌ SECURITY GATE: FAILED"
            echo "  Critical vulnerabilities must be fixed before merging."
            exit 1
          fi