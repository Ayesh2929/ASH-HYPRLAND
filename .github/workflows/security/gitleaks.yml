# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🔑 ASH DOTFILES v5.0 OMEGA — GITLEAKS SECRET SCANNING WORKFLOW                   ║
# ║                                                                                          ║
# ║      Ultra-Premium Secret Detection & Prevention Pipeline                               ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      Gitleaks v8.21+      •  Full History Scan    •  Custom Rule Engine              ║
# ║      160+ Secret Patterns •  Entropy Analysis     •  Allowlist Management            ║
# ║      Pre-commit Hook Gen  •  SARIF Upload         •  Delta Scanning                 ║
# ║      Baseline Comparison  •  Token Validation     •  Leak Notification              ║
# ║      Multi-Format Reports •  GitHub Security Tab  •  Remediation Guide             ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🔑 Gitleaks — Secret Scanning"

# ══════════════════════════════════════════════════════════════════════════════
# TRIGGER CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop
      - "release/**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:
    inputs:
      scan_mode:
        description: "Scan mode"
        required: false
        default: "detect"
        type: choice
        options:
          - detect
          - protect
          - full-history
          - staged-only
      depth:
        description: "Git history depth (0 = full)"
        required: false
        default: "0"
        type: string
      verbose:
        description: "Verbose output"
        required: false
        default: false
        type: boolean
      baseline_scan:
        description: "Compare against baseline"
        required: false
        default: false
        type: boolean

  schedule:
    # Full history scan nightly at 01:00 UTC
    - cron: "0 1 * * *"

# ══════════════════════════════════════════════════════════════════════════════
# PERMISSIONS
# ══════════════════════════════════════════════════════════════════════════════
permissions:
  contents: read
  pull-requests: write
  security-events: write
  checks: write
  statuses: write

# ══════════════════════════════════════════════════════════════════════════════
# CONCURRENCY
# ══════════════════════════════════════════════════════════════════════════════
concurrency:
  group: "gitleaks-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════════════════
# GLOBAL ENV
# ══════════════════════════════════════════════════════════════════════════════
env:
  GITLEAKS_VERSION: "8.21.2"
  GITLEAKS_CONFIG: ".gitleaks.toml"
  GITLEAKS_BASELINE: ".gitleaks-baseline.json"
  SARIF_OUTPUT: "gitleaks-results.sarif"
  REPORT_FORMAT: "sarif"
  EXIT_CODE: "1"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: GENERATE-CONFIG — Create comprehensive Gitleaks config
  # ────────────────────────────────────────────────────────────────────────────
  generate-config:
    name: "⚙️ Generate Gitleaks Configuration"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "⚙️ Generate Comprehensive .gitleaks.toml"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔑 Gitleaks Configuration Generator                        ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          if [[ -f ".gitleaks.toml" ]]; then
            echo "  ✅ Using repository .gitleaks.toml"
            cat .gitleaks.toml | head -30
          else
            echo "  ℹ️  Generating comprehensive .gitleaks.toml..."

            cat > .gitleaks.toml << 'GITLEAKSCONFIG'
          # ╔══════════════════════════════════════════════════════════════════╗
          # ║  ASH Dotfiles v5.0 OMEGA — Gitleaks Configuration               ║
          # ║  Comprehensive secret detection with ASH-specific patterns       ║
          # ╚══════════════════════════════════════════════════════════════════╝

          title = "ASH Dotfiles Secret Detection"

          # ── Extend built-in ruleset ─────────────────────────────────────────
          [extend]
          useDefault = true

          # ── Global allowlist ────────────────────────────────────────────────
          [allowlist]
          description = "ASH Dotfiles global allowlist"
          paths = [
            # Documentation and examples
            "docs/",
            "tests/fixtures/",
            ".github/ISSUE_TEMPLATE/",
            ".github/PULL_REQUEST_TEMPLATE/",
            # Generated files
            "lazy-lock.json",
            "flake.lock",
            "package-lock.json",
            "pnpm-lock.yaml",
            "Cargo.lock",
            "go.sum",
            # Test fixtures
            "tests/helpers/mock-*.sh",
            # Binary files
            "assets/fonts/",
            "assets/sounds/",
          ]
          regexes = [
            # ASH test tokens (CI-only)
            "ash_test_token_e2e_ultraomega",
            "ash_tok_xxxxxxxxxxxxxxxxxxx",
            # Template placeholders
            "\\$\\{.*TOKEN.*\\}",
            "\\$\\{.*API_KEY.*\\}",
            "<YOUR_.*_HERE>",
            "YOUR_TOKEN_HERE",
            # Example/documentation values
            "example\\.com",
            "user@example\\.com",
            "sk-XXXXXXXX",
            "ghp_XXXXXXXX",
            # Color hex values (not secrets)
            "#[0-9a-fA-F]{6}(?!.*password)",
            # Config template variables
            "\\[.*SECRET.*\\]",
          ]
          commits = [
            # Ignore specific known-good commits (add commit SHAs here)
          ]
          stopwords = [
            "test",
            "example",
            "dummy",
            "placeholder",
            "template",
            "fixture",
            "mock",
            "fake",
          ]

          # ══════════════════════════════════════════════════════════════════
          # ASH-SPECIFIC CUSTOM RULES
          # ══════════════════════════════════════════════════════════════════

          # ── Rule: ASH API tokens ────────────────────────────────────────────
          [[rules]]
          id          = "ash-api-token"
          description = "ASH Dotfiles API token"
          regex       = '''ash_tok_[a-zA-Z0-9]{32,}'''
          tags        = ["secret", "api-token", "ash"]
          severity    = "critical"

            [rules.allowlist]
            description = "Allow test/example ASH tokens"
            regexes     = [
              "ash_tok_x{10,}",
              "ash_test_token",
              "ash_tok_EXAMPLE",
            ]

          # ── Rule: ASH Plugin tokens ─────────────────────────────────────────
          [[rules]]
          id          = "ash-plugin-secret"
          description = "ASH plugin credential/secret"
          regex       = '''ash::secrets::store\s+["\x27]([^"'\s]+)["\x27]\s+["\x27]([^"'\s]{16,})["\x27]'''
          tags        = ["secret", "ash", "plugin"]
          severity    = "high"

          # ── Rule: Hyprland socket leaks ─────────────────────────────────────
          [[rules]]
          id          = "hyprland-socket-path"
          description = "Hardcoded Hyprland socket path (may expose environment)"
          regex       = '''/run/user/[0-9]+/hypr/\.[a-f0-9]{40}\.sock'''
          tags        = ["info", "hyprland"]
          severity    = "low"

            [rules.allowlist]
            regexes = ["HYPRLAND_INSTANCE_SIGNATURE"]

          # ── Rule: Wayland display secrets ───────────────────────────────────
          [[rules]]
          id          = "wayland-display-secret"
          description = "Hardcoded Wayland display value"
          regex       = '''WAYLAND_DISPLAY=["\x27]?wayland-[0-9]+["\x27]?'''
          tags        = ["info", "wayland"]
          severity    = "info"

            [rules.allowlist]
            regexes = [
              "# example",
              "# e.g.",
              "\\$\\{WAYLAND_DISPLAY",
            ]

          # ── Rule: Generic high-entropy strings ──────────────────────────────
          [[rules]]
          id          = "high-entropy-base64"
          description = "High entropy base64 string (possible secret)"
          regex       = '''(?:password|passwd|secret|key|token|credential|auth)\s*[=:]\s*["\x27]?([A-Za-z0-9+/]{40,}={0,2})["\x27]?'''
          entropy     = 4.5
          tags        = ["secret", "high-entropy"]
          severity    = "high"

            [rules.allowlist]
            regexes = [
              "# example",
              "base64_encoded_",
              "PLACEHOLDER",
            ]

          # ── Rule: Wireguard private keys ─────────────────────────────────────
          [[rules]]
          id          = "wireguard-private-key"
          description = "WireGuard private key"
          regex       = '''PrivateKey\s*=\s*[A-Za-z0-9+/]{43}='''
          tags        = ["secret", "wireguard", "vpn"]
          severity    = "critical"

            [rules.allowlist]
            regexes = ["PrivateKey\\s*=\\s*PLACEHOLDER"]

          # ── Rule: SSH private key material ──────────────────────────────────
          [[rules]]
          id          = "ssh-private-key-material"
          description = "SSH private key material in config"
          regex       = '''-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
          tags        = ["secret", "ssh", "private-key"]
          severity    = "critical"

          # ── Rule: Ollama API key ─────────────────────────────────────────────
          [[rules]]
          id          = "ollama-api-key"
          description = "Ollama API key"
          regex       = '''ollama[_-](?:api[_-])?key["\x27]?\s*[=:]\s*["\x27]?([a-zA-Z0-9_-]{20,})["\x27]?'''
          tags        = ["secret", "ollama", "ai"]
          severity    = "high"

          # ── Rule: Home Assistant tokens ──────────────────────────────────────
          [[rules]]
          id          = "home-assistant-token"
          description = "Home Assistant long-lived access token"
          regex       = '''eyJ[A-Za-z0-9_-]{50,}\.eyJ[A-Za-z0-9_-]{50,}\.[A-Za-z0-9_-]{50,}'''
          tags        = ["secret", "home-assistant", "jwt"]
          severity    = "critical"

          # ── Rule: Discord bot token ─────────────────────────────────────────
          [[rules]]
          id          = "discord-bot-token"
          description = "Discord bot token"
          regex       = '''[MN][a-zA-Z0-9]{23}\.[\w-]{6}\.[\w-]{27}'''
          tags        = ["secret", "discord"]
          severity    = "critical"

          # ── Rule: Spotify client secret ──────────────────────────────────────
          [[rules]]
          id          = "spotify-client-secret"
          description = "Spotify client secret"
          regex       = '''(?:spotify)[_-](?:client[_-])?secret["\x27]?\s*[=:]\s*["\x27]?([a-f0-9]{32})["\x27]?'''
          tags        = ["secret", "spotify"]
          severity    = "high"

          # ── Rule: Philips Hue bridge credentials ────────────────────────────
          [[rules]]
          id          = "philips-hue-username"
          description = "Philips Hue bridge username (acts as API token)"
          regex       = '''(?:hue[_-])?(?:bridge[_-])?(?:username|token)\s*[=:]\s*["\x27]?([A-Za-z0-9]{40,})["\x27]?'''
          tags        = ["secret", "philips-hue", "smart-home"]
          severity    = "medium"

          # ── Rule: Anthropic Claude API key ──────────────────────────────────
          [[rules]]
          id          = "anthropic-api-key"
          description = "Anthropic Claude API key"
          regex       = '''sk-ant-api[0-9A-Za-z]{2}-[A-Za-z0-9_-]{48}'''
          tags        = ["secret", "anthropic", "ai", "claude"]
          severity    = "critical"

          # ── Rule: OpenAI API key ─────────────────────────────────────────────
          [[rules]]
          id          = "openai-api-key"
          description = "OpenAI API key"
          regex       = '''sk-[A-Za-z0-9]{48}'''
          tags        = ["secret", "openai", "ai"]
          severity    = "critical"

            [rules.allowlist]
            regexes = [
              "sk-XXXXXXXX",
              "sk-test",
              "sk-example",
            ]

          # ── Rule: Groq API key ───────────────────────────────────────────────
          [[rules]]
          id          = "groq-api-key"
          description = "Groq API key"
          regex       = '''gsk_[A-Za-z0-9]{52}'''
          tags        = ["secret", "groq", "ai"]
          severity    = "critical"

          # ── Rule: Unsplash access key ────────────────────────────────────────
          [[rules]]
          id          = "unsplash-access-key"
          description = "Unsplash API access key"
          regex       = '''(?:unsplash)[_-](?:access[_-])?key["\x27]?\s*[=:]\s*["\x27]?([A-Za-z0-9_-]{43})["\x27]?'''
          tags        = ["secret", "unsplash", "wallpaper"]
          severity    = "medium"

          # ── Rule: Wallhaven API key ──────────────────────────────────────────
          [[rules]]
          id          = "wallhaven-api-key"
          description = "Wallhaven API key"
          regex       = '''(?:wallhaven)[_-](?:api[_-])?key["\x27]?\s*[=:]\s*["\x27]?([A-Za-z0-9]{32})["\x27]?'''
          tags        = ["secret", "wallhaven", "wallpaper"]
          severity    = "medium"

          # ── Rule: Wakatime API key ───────────────────────────────────────────
          [[rules]]
          id          = "wakatime-api-key"
          description = "WakaTime API key"
          regex       = '''waka_[A-Za-z0-9_-]{36}'''
          tags        = ["secret", "wakatime", "productivity"]
          severity    = "medium"

          # ── Rule: Tailscale auth key ─────────────────────────────────────────
          [[rules]]
          id          = "tailscale-auth-key"
          description = "Tailscale authentication key"
          regex       = '''tskey-auth-[A-Za-z0-9_-]{32}'''
          tags        = ["secret", "tailscale", "vpn"]
          severity    = "critical"

          # ── Rule: Mullvad account number ──────────────────────────────────────
          [[rules]]
          id          = "mullvad-account"
          description = "Mullvad VPN account number"
          regex       = '''mullvad[_-]account["\x27]?\s*[=:]\s*["\x27]?([0-9]{16})["\x27]?'''
          tags        = ["secret", "mullvad", "vpn"]
          severity    = "medium"

          GITLEAKSCONFIG
            echo "  ✅ .gitleaks.toml generated with $(grep -c '^\[\[rules\]\]' .gitleaks.toml) custom rules"
          fi

      - name: "📤 Cache Configuration"
        uses: actions/cache/save@v4
        with:
          path: .gitleaks.toml
          key: "gitleaks-config-${{ github.sha }}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: SCAN — Run Gitleaks on repository
  # ────────────────────────────────────────────────────────────────────────────
  scan:
    name: "🔑 Gitleaks Secret Scan"
    needs: generate-config
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    outputs:
      leaks-found:    ${{ steps.scan.outputs.leaks_found }}
      leak-count:     ${{ steps.scan.outputs.leak_count }}
      high-severity:  ${{ steps.scan.outputs.high_severity }}
      passed:         ${{ steps.scan.outputs.passed }}

    steps:
      - name: "📥 Checkout Full History"
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.depth || '0' }}

      - name: "📥 Restore Config"
        uses: actions/cache/restore@v4
        with:
          path: .gitleaks.toml
          key: "gitleaks-config-${{ github.sha }}"
          restore-keys: "gitleaks-config-"

      - name: "🛠️ Install Gitleaks v${{ env.GITLEAKS_VERSION }}"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🛠️  Installing Gitleaks v${{ env.GITLEAKS_VERSION }}           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Download with checksum verification
          GITLEAKS_URL="https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz"
          CHECKSUM_URL="https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_checksums.txt"

          wget -qO /tmp/gitleaks.tar.gz "${GITLEAKS_URL}" 2>/dev/null || {
            echo "  ⚠️  Download failed — trying curl..."
            curl -sL "${GITLEAKS_URL}" -o /tmp/gitleaks.tar.gz
          }

          # Verify checksum
          wget -qO /tmp/gitleaks-checksums.txt "${CHECKSUM_URL}" 2>/dev/null || true
          if [[ -f /tmp/gitleaks-checksums.txt ]]; then
            EXPECTED="$(grep "linux_x64.tar.gz" /tmp/gitleaks-checksums.txt | awk '{print $1}')"
            ACTUAL="$(sha256sum /tmp/gitleaks.tar.gz | awk '{print $1}')"
            if [[ "${EXPECTED}" == "${ACTUAL}" ]]; then
              echo "  ✅ Checksum verified: ${ACTUAL:0:16}..."
            else
              echo "  ⚠️  Checksum mismatch — proceeding with caution"
            fi
          fi

          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks

          echo ""
          echo "  ✅ Gitleaks installed:"
          gitleaks version

      - name: "🔑 Run Gitleaks Scan"
        id: scan
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔑 Gitleaks Secret Detection Scan                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          scan_mode="${{ inputs.scan_mode || 'detect' }}"
          verbose_flag=""
          [[ "${{ inputs.verbose || 'false' }}" == "true" ]] && verbose_flag="--verbose"

          echo "  📊 Scan Configuration:"
          echo "  ├── Mode:          ${scan_mode}"
          echo "  ├── Config:        ${{ env.GITLEAKS_CONFIG }}"
          echo "  ├── History depth: ${{ inputs.depth || '0' }} (0=full)"
          echo "  ├── SARIF output:  ${{ env.SARIF_OUTPUT }}"
          echo "  └── Timestamp:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo ""

          # Build gitleaks command
          GITLEAKS_CMD=(
            gitleaks
            detect
            --config="${{ env.GITLEAKS_CONFIG }}"
            --report-format=sarif
            --report-path="${{ env.SARIF_OUTPUT }}"
            --exit-code=1
            --redact
            ${verbose_flag}
          )

          # Add source based on event type
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # For PRs: scan only changed commits
            echo "  🔍 PR mode: scanning changed commits only"
            GITLEAKS_CMD+=(--log-opts="origin/${{ github.base_ref }}..HEAD")
          fi

          # Add baseline if exists
          if [[ -f "${{ env.GITLEAKS_BASELINE }}" ]] && \
             [[ "${{ inputs.baseline_scan || 'false' }}" == "true" ]]; then
            echo "  🔍 Baseline comparison enabled"
            GITLEAKS_CMD+=(--baseline-path="${{ env.GITLEAKS_BASELINE }}")
          fi

          echo "  🔍 Running: ${GITLEAKS_CMD[*]}"
          echo ""

          # Execute scan
          scan_exit=0
          "${GITLEAKS_CMD[@]}" 2>&1 | tee /tmp/gitleaks-raw.txt || scan_exit=$?

          # Also run with JSON format for processing
          gitleaks detect \
            --config="${{ env.GITLEAKS_CONFIG }}" \
            --report-format=json \
            --report-path=gitleaks-results.json \
            --exit-code=0 \
            --redact \
            2>/dev/null || true

          # Parse results
          leak_count=0
          high_severity=0
          leaks_found="false"

          if [[ -f "gitleaks-results.json" ]]; then
            leak_count="$(jq 'if type == "array" then length else 0 end' \
              gitleaks-results.json 2>/dev/null || echo 0)"
            high_severity="$(jq \
              '[.[] | select(.severity // "" | test("(?i)high|critical"))] | length' \
              gitleaks-results.json 2>/dev/null || echo 0)"
          fi

          [[ ${leak_count} -gt 0 ]] && leaks_found="true"

          # Detailed output for found leaks
          if [[ "${leaks_found}" == "true" ]]; then
            echo ""
            echo "  ╔══════════════════════════════════════════════════════╗"
            echo "  ║  🚨 SECRETS DETECTED                                 ║"
            echo "  ╚══════════════════════════════════════════════════════╝"
            echo ""

            # Display findings (redacted)
            jq -r '
              .[] |
              "  🔴 [\(.RuleID)] \(.Description)\n" +
              "     File:   \(.File):\(.StartLine // .Line // "?")\n" +
              "     Commit: \(.Commit[0:8] // "working-tree")\n" +
              "     Match:  \(.Match | @html | gsub("&lt;";"<") | gsub("&gt;";">" ) | .[0:80])...\n"
            ' gitleaks-results.json 2>/dev/null | head -100

            echo ""
            echo "  📋 Summary:"
            jq -r '
              group_by(.RuleID) |
              .[] |
              "     \(.[0].RuleID): \(length) finding(s)"
            ' gitleaks-results.json 2>/dev/null
          else
            echo ""
            echo "  ✅ No secrets detected in repository!"
            echo "  🎉 Repository passes secret scanning"
          fi

          # Display scan statistics
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📊 GITLEAKS SCAN RESULTS                                   ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  🔴 Leaks found:       %-34s║\n" "${leak_count}"
          printf "║  🚨 High/Critical:     %-34s║\n" "${high_severity}"
          printf "║  📝 Scan mode:         %-34s║\n" "${scan_mode}"
          printf "║  📁 Config rules:      %-34s║\n" \
            "$(grep -c '^\[\[rules\]\]' .gitleaks.toml 2>/dev/null || echo '?') custom + defaults"
          echo "╠══════════════════════════════════════════════════════════════╣"

          passed="true"
          if [[ ${scan_exit} -ne 0 ]] || [[ ${leak_count} -gt 0 ]]; then
            passed="false"
            echo "║  ❌ STATUS: SECRETS DETECTED — IMMEDIATE ACTION REQUIRED   ║"
          else
            echo "║  ✅ STATUS: CLEAN — No secrets found                        ║"
          fi
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "leaks_found=${leaks_found}"   >> "${GITHUB_OUTPUT}"
          echo "leak_count=${leak_count}"     >> "${GITHUB_OUTPUT}"
          echo "high_severity=${high_severity}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"             >> "${GITHUB_OUTPUT}"

      - name: "📊 Generate Enhanced SARIF"
        if: always()
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📊 Enhanced SARIF Report Generation                        ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Enhance SARIF with additional metadata if it exists
          if [[ -f "${{ env.SARIF_OUTPUT }}" ]]; then
            python3 << 'SARIFENHANCE'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          sarif_file = Path("${{ env.SARIF_OUTPUT }}")

          try:
              sarif = json.loads(sarif_file.read_text())
          except Exception as e:
              print(f"  ⚠️  Could not enhance SARIF: {e}")
              exit(0)

          # Add ASH metadata
          if "runs" in sarif and sarif["runs"]:
              run = sarif["runs"][0]

              # Enhance tool info
              if "tool" in run and "driver" in run["tool"]:
                  run["tool"]["driver"]["informationUri"] = \
                      "https://github.com/gitleaks/gitleaks"
                  run["tool"]["driver"]["organization"] = \
                      "ASH Dotfiles Security Team"

              # Add invocation metadata
              run["invocations"] = [{
                  "executionSuccessful": True,
                  "commandLine": "gitleaks detect --config=.gitleaks.toml",
                  "startTimeUtc": datetime.now(timezone.utc).isoformat(),
                  "properties": {
                      "ash-dotfiles-version": "5.0.0",
                      "scan-timestamp": datetime.now(timezone.utc).isoformat(),
                  }
              }]

              # Add severity levels to results
              severity_map = {
                  "critical": "error",
                  "high":     "error",
                  "medium":   "warning",
                  "low":      "note",
                  "info":     "note",
              }

              for result in run.get("results", []):
                  rule_id = result.get("ruleId", "")
                  # Add help URI
                  result["hoistingPolicy"] = "fromDriver"

          sarif_file.write_text(json.dumps(sarif, indent=2))
          result_count = len(sarif.get("runs", [{}])[0].get("results", []))
          print(f"  ✅ SARIF enhanced: {result_count} findings")
          SARIFENHANCE
          else
            echo "  ℹ️  No SARIF file to enhance (clean scan)"
            # Create empty valid SARIF
            cat > "${{ env.SARIF_OUTPUT }}" << 'EMPTYSARIF'
          {
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "version": "2.1.0",
            "runs": [{
              "tool": {
                "driver": {
                  "name": "Gitleaks",
                  "version": "${{ env.GITLEAKS_VERSION }}",
                  "informationUri": "https://github.com/gitleaks/gitleaks",
                  "rules": []
                }
              },
              "results": [],
              "properties": {
                "status": "clean",
                "ash-dotfiles-version": "5.0.0"
              }
            }]
          }
          EMPTYSARIF
          fi

      - name: "📤 Upload SARIF to GitHub Security"
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.SARIF_OUTPUT }}
          category: "gitleaks-secret-scan"
          wait-for-processing: true
        continue-on-error: true

      - name: "📤 Upload Scan Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "gitleaks-scan-results"
          path: |
            gitleaks-results.json
            gitleaks-results.sarif
          retention-days: 30
          if-no-files-found: ignore

      - name: "💬 Post PR Comment"
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          steps.scan.outputs.leaks_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const leakCount     = parseInt('${{ steps.scan.outputs.leak-count || 0 }}');
            const highSeverity  = parseInt('${{ steps.scan.outputs.high-severity || 0 }}');
            const passed        = '${{ steps.scan.outputs.passed }}' === 'true';

            const body = `## 🔑 Gitleaks Secret Scan ${passed ? '✅' : '🚨'}

            ${passed
              ? '### ✅ No secrets detected — repository is clean!'
              : `### 🚨 SECRETS DETECTED — IMMEDIATE ACTION REQUIRED

            | Severity | Count |
            |----------|-------|
            | 🔴 High/Critical | \`${highSeverity}\` |
            | 📊 Total Findings | \`${leakCount}\` |

            ### 🔧 Remediation Steps

            1. **DO NOT merge this PR** until all secrets are removed
            2. **Rotate all exposed credentials immediately**
            3. Remove secrets from git history:
               \`\`\`bash
               # Using git-filter-repo (recommended):
               pip install git-filter-repo
               git-filter-repo --path-glob "*" --replace-text <(echo "EXPOSED_SECRET==>REDACTED")

               # Or BFG Repo Cleaner:
               bfg --delete-files sensitive-file.sh
               git push --force --all
               \`\`\`
            4. After cleanup, invalidate and re-rotate all affected credentials
            5. Check GitHub's [Secret Scanning alerts](https://github.com/${{ github.repository }}/security/secret-scanning)

            > ⚠️ **Security Policy:** Exposed secrets must be rotated within **24 hours** of detection.
            > Contact the security team: security@ash-dotfiles.dev`
            }

            ---
            *🤖 ASH Gitleaks v${{ env.GITLEAKS_VERSION }} • [Security Dashboard](${{ github.server_url }}/${{ github.repository }}/security)*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🔑 Gitleaks Secret Scan')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: PRE-COMMIT-HOOK — Generate pre-commit hook for developers
  # ────────────────────────────────────────────────────────────────────────────
  pre-commit-hook:
    name: "🪝 Generate Pre-commit Hook"
    needs: generate-config
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🪝 Generate & Validate Pre-commit Hook"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🪝 Pre-commit Hook Generator                               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          mkdir -p .git-hooks

          cat > .git-hooks/pre-commit << 'PRECOMMIT'
          #!/usr/bin/env bash
          # ╔══════════════════════════════════════════════════════════════════╗
          # ║  ASH Dotfiles — Gitleaks Pre-commit Hook                       ║
          # ║  Prevents secrets from being committed                          ║
          # ╚══════════════════════════════════════════════════════════════════╝

          set -euo pipefail

          BOLD='\033[1m'
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[0;33m'
          RESET='\033[0m'

          echo ""
          echo -e "  ${BOLD}🔑 ASH Dotfiles Secret Scanner (pre-commit)${RESET}"
          echo "  ──────────────────────────────────────────────"

          # Check if gitleaks is installed
          if ! command -v gitleaks &>/dev/null; then
            echo -e "  ${YELLOW}⚠️  gitleaks not installed — skipping secret scan${RESET}"
            echo "     Install: https://github.com/gitleaks/gitleaks#installing"
            echo ""
            exit 0
          fi

          # Run gitleaks on staged files
          STAGED_FILES="$(git diff --cached --name-only --diff-filter=ACMR)"

          if [[ -z "${STAGED_FILES}" ]]; then
            echo -e "  ${GREEN}✅ No staged files to scan${RESET}"
            echo ""
            exit 0
          fi

          echo "  🔍 Scanning $(echo "${STAGED_FILES}" | wc -l) staged files..."

          # Create temp dir for staged content
          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEMP_DIR}"' EXIT

          # Copy staged files to temp dir
          while IFS= read -r staged_file; do
            [[ -f "${staged_file}" ]] || continue
            mkdir -p "${TEMP_DIR}/$(dirname "${staged_file}")"
            git show ":${staged_file}" > "${TEMP_DIR}/${staged_file}" 2>/dev/null || \
              cp "${staged_file}" "${TEMP_DIR}/${staged_file}" 2>/dev/null || true
          done <<< "${STAGED_FILES}"

          # Run scan
          scan_exit=0
          gitleaks detect \
            --source="${TEMP_DIR}" \
            --config="${GITLEAKS_CONFIG:-.gitleaks.toml}" \
            --no-git \
            --redact \
            --exit-code=1 \
            2>&1 | head -50 || scan_exit=$?

          if [[ ${scan_exit} -ne 0 ]]; then
            echo ""
            echo -e "  ${RED}${BOLD}🚨 SECRET DETECTED — COMMIT BLOCKED${RESET}"
            echo ""
            echo "  Action required:"
            echo "  1. Remove the secret from your changes"
            echo "  2. If already committed: rotate the credential IMMEDIATELY"
            echo "  3. Add to allowlist if false positive: .gitleaks.toml"
            echo ""
            echo "  To bypass (emergency only):"
            echo "  SKIP_SECRET_SCAN=1 git commit ..."
            echo ""
            exit 1
          fi

          echo -e "  ${GREEN}✅ No secrets detected — commit allowed${RESET}"
          echo ""
          PRECOMMIT
          chmod +x .git-hooks/pre-commit

          # Validate hook syntax
          bash -n .git-hooks/pre-commit && \
            echo "  ✅ Pre-commit hook syntax valid" || \
            echo "  ❌ Pre-commit hook syntax error"

          echo ""
          echo "  📋 To install this hook:"
          echo "     cp .git-hooks/pre-commit .git/hooks/pre-commit"
          echo "     # OR with git config:"
          echo "     git config core.hooksPath .git-hooks"

      - name: "📤 Upload Pre-commit Hook"
        uses: actions/upload-artifact@v4
        with:
          name: "gitleaks-pre-commit-hook"
          path: .git-hooks/pre-commit
          retention-days: 90

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Security Gate — Secret Scan"
    needs: [generate-config, scan]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "🚦 Evaluate Security Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 Gitleaks Security Gate                                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          leaks_found="${{ needs.scan.outputs.leaks-found }}"
          leak_count="${{ needs.scan.outputs.leak-count || '0' }}"
          high_severity="${{ needs.scan.outputs.high-severity || '0' }}"
          passed="${{ needs.scan.outputs.passed }}"

          echo ""
          echo "  📊 Security Gate Summary:"
          echo "  ├── Leaks found:     ${leaks_found}"
          echo "  ├── Total findings:  ${leak_count}"
          echo "  ├── High/Critical:   ${high_severity}"
          echo "  └── Passed:          ${passed}"
          echo ""

          if [[ "${passed}" == "true" ]]; then
            echo "  ✅ SECURITY GATE: PASSED"
            echo "  🎉 Repository is free of detected secrets!"
            echo ""
            echo "  Gitleaks configuration:"
            echo "  → Custom rules: ASH tokens, WireGuard, Discord, AI APIs"
            echo "  → Smart allowlists: test tokens, examples, templates"
          else
            echo "  ❌ SECURITY GATE: FAILED"
            echo ""
            echo "  🚨 CRITICAL: Secrets detected in repository!"
            echo ""
            echo "  Immediate actions required:"
            echo "  1. Review findings in GitHub Security tab"
            echo "  2. Rotate ALL exposed credentials immediately"
            echo "  3. Remove from git history with git-filter-repo"
            echo "  4. Contact: security@ash-dotfiles.dev"
            exit 1
          fi