# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      📦 ASH DOTFILES v5.0 OMEGA — DEPENDENCY AUDIT WORKFLOW                           ║
# ║                                                                                          ║
# ║      Ultra-Premium Dependency Security & License Compliance Pipeline                    ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      npm audit             •  pip-audit            •  cargo audit                     ║
# ║      go vuln               •  License Compliance   •  SBOM Generation                ║
# ║      Supply Chain Check    •  Typosquatting Det    •  Abandoned Pkgs                 ║
# ║      CVE Correlation       •  Remediation Guide    •  Upgrade Path                  ║
# ║      OSV Database          •  GHSA Integration     •  NVD Cross-Ref                ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "📦 Dependency Audit — Security & License"

# ══════════════════════════════════════════════════════════════════════════════
# TRIGGER CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - "requirements*.txt"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "go.mod"
      - "go.sum"
      - "flake.lock"
      - ".github/workflows/security/dependency-audit.yml"

  pull_request:
    branches: [main, develop, "release/**"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "requirements*.txt"
      - "Cargo.toml"
      - "go.mod"
      - ".github/workflows/security/dependency-audit.yml"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:
    inputs:
      audit_level:
        description: "Minimum severity to report"
        required: false
        default: "high"
        type: choice
        options: [info, low, moderate, high, critical]
      check_licenses:
        description: "Run license compliance check"
        required: false
        default: true
        type: boolean
      check_typosquatting:
        description: "Check for typosquatting"
        required: false
        default: true
        type: boolean
      fail_on_vuln:
        description: "Fail CI if vulnerabilities found"
        required: false
        default: true
        type: boolean

  schedule:
    # Full dependency audit every day at 00:30 UTC
    - cron: "30 0 * * *"

# ══════════════════════════════════════════════════════════════════════════════
# PERMISSIONS
# ══════════════════════════════════════════════════════════════════════════════
permissions:
  contents: read
  pull-requests: write
  security-events: write
  checks: write

# ══════════════════════════════════════════════════════════════════════════════
# CONCURRENCY
# ══════════════════════════════════════════════════════════════════════════════
concurrency:
  group: "dep-audit-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════════════════
# GLOBAL ENV
# ══════════════════════════════════════════════════════════════════════════════
env:
  AUDIT_LEVEL: "${{ inputs.audit_level || 'high' }}"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  GO_VERSION: "1.23"
  PNPM_VERSION: "9"
  FAIL_ON_VULN: "${{ inputs.fail_on_vuln || 'true' }}"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: DISCOVER — Detect all dependency manifests
  # ────────────────────────────────────────────────────────────────────────────
  discover:
    name: "🔍 Discover Dependency Manifests"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      has-npm:     ${{ steps.discover.outputs.has_npm }}
      has-python:  ${{ steps.discover.outputs.has_python }}
      has-cargo:   ${{ steps.discover.outputs.has_cargo }}
      has-go:      ${{ steps.discover.outputs.has_go }}
      has-nix:     ${{ steps.discover.outputs.has_nix }}
      npm-count:   ${{ steps.discover.outputs.npm_count }}
      python-count: ${{ steps.discover.outputs.python_count }}
      cargo-count: ${{ steps.discover.outputs.cargo_count }}
      go-count:    ${{ steps.discover.outputs.go_count }}
      total-pkgs:  ${{ steps.discover.outputs.total_pkgs }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔍 Discover All Dependency Files"
        id: discover
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📦 Dependency Manifest Discovery                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # ── npm/pnpm/yarn ─────────────────────────────────────────────────
          npm_files=0
          npm_pkgs=0
          has_npm="false"
          for f in package.json web/package.json config/ags/package.json \
                   browser-extension/package.json; do
            if [[ -f "${f}" ]]; then
              npm_files=$((npm_files + 1))
              deps="$(jq '
                (.dependencies // {} | length) +
                (.devDependencies // {} | length)
              ' "${f}" 2>/dev/null || echo 0)"
              npm_pkgs=$((npm_pkgs + deps))
              printf "  ✅ npm: %-40s (%d packages)\n" "${f}" "${deps}"
            fi
          done
          [[ ${npm_files} -gt 0 ]] && has_npm="true"

          # ── Python ────────────────────────────────────────────────────────
          python_files=0
          python_pkgs=0
          has_python="false"
          for f in requirements.txt requirements-dev.txt api/requirements.txt \
                   pyproject.toml setup.cfg; do
            if [[ -f "${f}" ]]; then
              python_files=$((python_files + 1))
              pkgs="$(grep -cE '^[a-zA-Z]' "${f}" 2>/dev/null || \
                jq '.dependencies | length' "${f}" 2>/dev/null || echo 0)"
              python_pkgs=$((python_pkgs + pkgs))
              printf "  ✅ Python: %-38s (%d packages)\n" "${f}" "${pkgs}"
            fi
          done
          [[ ${python_files} -gt 0 ]] && has_python="true"

          # ── Cargo (Rust) ──────────────────────────────────────────────────
          cargo_files=0
          cargo_pkgs=0
          has_cargo="false"
          mapfile -t cargo_tomls < <(
            find . -name "Cargo.toml" ! -path "./.git/*" | sort
          )
          for f in "${cargo_tomls[@]}"; do
            cargo_files=$((cargo_files + 1))
            deps="$(grep -cE '^\s*\w+\s*=' "${f}" 2>/dev/null || echo 0)"
            cargo_pkgs=$((cargo_pkgs + deps))
            printf "  ✅ Cargo: %-39s (%d packages)\n" "${f}" "${deps}"
          done
          [[ ${cargo_files} -gt 0 ]] && has_cargo="true"

          # ── Go ────────────────────────────────────────────────────────────
          go_files=0
          go_pkgs=0
          has_go="false"
          mapfile -t go_mods < <(
            find . -name "go.mod" ! -path "./.git/*" | sort
          )
          for f in "${go_mods[@]}"; do
            go_files=$((go_files + 1))
            deps="$(grep -cE '^\s+\S+\s+v' "${f}" 2>/dev/null || echo 0)"
            go_pkgs=$((go_pkgs + deps))
            printf "  ✅ Go: %-41s (%d packages)\n" "${f}" "${deps}"
          done
          [[ ${go_files} -gt 0 ]] && has_go="true"

          # ── Nix ──────────────────────────────────────────────────────────
          has_nix="false"
          [[ -f "flake.lock" ]] && {
            has_nix="true"
            nix_inputs="$(jq '.nodes | length' flake.lock 2>/dev/null || echo 0)"
            printf "  ✅ Nix: %-41s (%d inputs)\n" "flake.lock" "${nix_inputs}"
          }

          total_pkgs=$((npm_pkgs + python_pkgs + cargo_pkgs + go_pkgs))

          echo ""
          echo "  📊 Dependency Discovery Summary:"
          echo "  ┌──────────────────────────────────────────────────────────┐"
          printf "  │  npm/pnpm:  %4d packages across %d manifest(s)          │\n" \
            "${npm_pkgs}" "${npm_files}"
          printf "  │  Python:    %4d packages across %d manifest(s)          │\n" \
            "${python_pkgs}" "${python_files}"
          printf "  │  Rust/Cargo:%4d packages across %d manifest(s)          │\n" \
            "${cargo_pkgs}" "${cargo_files}"
          printf "  │  Go:        %4d packages across %d manifest(s)          │\n" \
            "${go_pkgs}" "${go_files}"
          printf "  │  Total:     %4d packages                                 │\n" \
            "${total_pkgs}"
          echo "  └──────────────────────────────────────────────────────────┘"

          {
            echo "has_npm=${has_npm}"
            echo "has_python=${has_python}"
            echo "has_cargo=${has_cargo}"
            echo "has_go=${has_go}"
            echo "has_nix=${has_nix}"
            echo "npm_count=${npm_pkgs}"
            echo "python_count=${python_pkgs}"
            echo "cargo_count=${cargo_pkgs}"
            echo "go_count=${go_pkgs}"
            echo "total_pkgs=${total_pkgs}"
          } >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: NPM-AUDIT — Node.js dependency audit
  # ────────────────────────────────────────────────────────────────────────────
  npm-audit:
    name: "📦 npm/pnpm Dependency Audit"
    needs: discover
    if: needs.discover.outputs.has-npm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      critical:   ${{ steps.audit.outputs.critical }}
      high:       ${{ steps.audit.outputs.high }}
      total:      ${{ steps.audit.outputs.total }}
      passed:     ${{ steps.audit.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "🔍 Run npm Audit"
        id: audit
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📦 npm/pnpm Dependency Security Audit                      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          total_critical=0
          total_high=0
          total_moderate=0
          total_low=0
          total_info=0
          audit_failed=false

          audit_manifest() {
            local dir="$1"
            local pkg_file="${dir}/package.json"
            [[ -f "${pkg_file}" ]] || return 0

            echo ""
            echo "  📦 Auditing: ${dir}/"

            cd "${dir}" 2>/dev/null || return 0

            # Install dependencies
            if [[ -f "pnpm-lock.yaml" ]]; then
              pnpm install --frozen-lockfile --silent 2>/dev/null || \
                pnpm install --silent 2>/dev/null || true
            elif [[ -f "package-lock.json" ]]; then
              npm ci --silent 2>/dev/null || \
                npm install --silent 2>/dev/null || true
            else
              npm install --silent 2>/dev/null || true
            fi

            # Run audit
            audit_json=""
            if [[ -f "pnpm-lock.yaml" ]]; then
              audit_json="$(pnpm audit --json 2>/dev/null || \
                npm audit --json 2>/dev/null || echo '{}')"
            else
              audit_json="$(npm audit --json 2>/dev/null || echo '{}')"
            fi

            # Parse results
            critical="$(echo "${audit_json}" | \
              jq '.metadata.vulnerabilities.critical // 0' 2>/dev/null || echo 0)"
            high="$(echo "${audit_json}" | \
              jq '.metadata.vulnerabilities.high // 0' 2>/dev/null || echo 0)"
            moderate="$(echo "${audit_json}" | \
              jq '.metadata.vulnerabilities.moderate // 0' 2>/dev/null || echo 0)"
            low="$(echo "${audit_json}" | \
              jq '.metadata.vulnerabilities.low // 0' 2>/dev/null || echo 0)"
            info="$(echo "${audit_json}" | \
              jq '.metadata.vulnerabilities.info // 0' 2>/dev/null || echo 0)"
            total_pkg_vulns=$((critical + high + moderate + low + info))

            total_critical=$((total_critical + critical))
            total_high=$((total_high + high))
            total_moderate=$((total_moderate + moderate))
            total_low=$((total_low + low))
            total_info=$((total_info + info))

            # Display results
            if [[ ${total_pkg_vulns} -gt 0 ]]; then
              echo "  ❌ ${dir}: ${total_pkg_vulns} vulnerabilities"
              printf "     🔴 Critical: %d\n" "${critical}"
              printf "     🟠 High:     %d\n" "${high}"
              printf "     🟡 Moderate: %d\n" "${moderate}"
              printf "     ⚪ Low:      %d\n" "${low}"

              # Show specific vulns
              echo "${audit_json}" | jq -r '
                .vulnerabilities // {} |
                to_entries[] |
                select(.value.severity == "critical" or .value.severity == "high") |
                "     [\(.value.severity | ascii_upcase)] \(.key): " +
                "\(.value.via | if type == "array" then .[0].title // .[0] else . end)"
              ' 2>/dev/null | head -10

              [[ $((critical + high)) -gt 0 ]] && audit_failed=true
            else
              echo "  ✅ ${dir}: Clean"
            fi

            cd - > /dev/null || true
          }

          # Audit all manifest directories
          audit_manifest "."
          [[ -d "web" ]] && audit_manifest "web"
          [[ -d "config/ags" ]] && audit_manifest "config/ags"
          [[ -d "browser-extension" ]] && audit_manifest "browser-extension"

          # Generate SARIF
          cat > npm-audit.sarif << SARIF
          {
            "\$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "version": "2.1.0",
            "runs": [{
              "tool": {
                "driver": {
                  "name": "npm-audit",
                  "version": "$(npm --version 2>/dev/null || echo 'unknown')",
                  "informationUri": "https://docs.npmjs.com/cli/audit"
                }
              },
              "results": [],
              "properties": {
                "critical": ${total_critical},
                "high": ${total_high},
                "total": $((total_critical + total_high + total_moderate + total_low))
              }
            }]
          }
          SARIF

          total=$((total_critical + total_high + total_moderate + total_low + total_info))
          passed="true"
          [[ "${audit_failed}" == "true" ]] && passed="false"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📊 NPM AUDIT RESULTS                                       ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  🔴 Critical:        %-34s║\n" "${total_critical}"
          printf "║  🟠 High:            %-34s║\n" "${total_high}"
          printf "║  🟡 Moderate:        %-34s║\n" "${total_moderate}"
          printf "║  ⚪ Low/Info:        %-34s║\n" "$((total_low + total_info))"
          printf "║  📊 Total:           %-34s║\n" "${total}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          [[ "${passed}" == "true" ]] && \
            echo "║  ✅ STATUS: PASSED — No critical/high vulnerabilities        ║" || \
            echo "║  ❌ STATUS: FAILED — Critical vulnerabilities found          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "critical=${total_critical}" >> "${GITHUB_OUTPUT}"
          echo "high=${total_high}"         >> "${GITHUB_OUTPUT}"
          echo "total=${total}"             >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"           >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload npm Audit SARIF"
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: npm-audit.sarif
          category: "npm-audit"
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: PYTHON-AUDIT — Python dependency audit
  # ────────────────────────────────────────────────────────────────────────────
  python-audit:
    name: "🐍 Python Dependency Audit"
    needs: discover
    if: needs.discover.outputs.has-python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      vulnerabilities: ${{ steps.audit.outputs.vulns }}
      passed:          ${{ steps.audit.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install Audit Tools"
        shell: bash
        run: |
          pip install -q \
            "pip-audit==2.7.3" \
            "safety==3.2.11" \
            "cyclonedx-bom==4.6.1" \
            "pip-licenses==4.5.1" \
            2>/dev/null

          echo "  ✅ Python audit tools:"
          printf "     %-20s %s\n" "pip-audit:" "$(pip-audit --version 2>/dev/null)"
          printf "     %-20s %s\n" "safety:" "$(safety --version 2>/dev/null | head -1)"

      - name: "🔍 Run Python Vulnerability Audit"
        id: audit
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🐍 Python Dependency Security Audit                        ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          total_vulns=0
          audit_failed=false

          audit_python_deps() {
            local req_file="$1"
            [[ -f "${req_file}" ]] || return 0

            echo ""
            echo "  🐍 Auditing: ${req_file}"

            # Install deps
            pip install -q -r "${req_file}" 2>/dev/null || true

            # Run pip-audit
            pip_audit_exit=0
            pip_audit_output="$(pip-audit \
              --requirement="${req_file}" \
              --format=json \
              --output=/dev/stdout \
              2>/dev/null)" || pip_audit_exit=$?

            vulns="$(echo "${pip_audit_output}" | \
              jq '.dependencies | map(.vulns | length) | add // 0' \
              2>/dev/null || echo 0)"

            total_vulns=$((total_vulns + vulns))

            if [[ ${vulns} -gt 0 ]]; then
              echo "  ❌ ${req_file}: ${vulns} vulnerabilities"
              echo "${pip_audit_output}" | jq -r '
                .dependencies[]? |
                select(.vulns | length > 0) |
                "  [\(.name) \(.version)]",
                (.vulns[] |
                  "     [\(.id)] \(.description[0:100])")
              ' 2>/dev/null | head -30
              audit_failed=true
            else
              echo "  ✅ ${req_file}: Clean"
            fi

            # Also run safety check
            safety_output="$(safety check \
              --requirement="${req_file}" \
              --json \
              2>/dev/null)" || true

            safety_vulns="$(echo "${safety_output}" | \
              python3 -c "
          import sys, json
          try:
              data = json.loads(sys.stdin.read())
              vulns = data.get('vulnerabilities', data) if isinstance(data, dict) else data
              print(len(vulns) if isinstance(vulns, list) else 0)
          except: print(0)" 2>/dev/null || echo 0)"

            if [[ ${safety_vulns} -gt 0 ]]; then
              echo "  ⚠️  Safety found ${safety_vulns} additional CVEs (may overlap)"
            fi
          }

          # Audit all Python manifests
          for req in requirements.txt requirements-dev.txt api/requirements.txt; do
            audit_python_deps "${req}"
          done

          # License check
          echo ""
          echo "  📜 Python License Compliance:"
          if command -v pip-licenses &>/dev/null; then
            pip-licenses \
              --format=json \
              --output-file=/tmp/py-licenses.json \
              2>/dev/null || true

            if [[ -f /tmp/py-licenses.json ]]; then
              python3 << 'LICCHECK'
          import json, sys

          ALLOWED = {"MIT", "Apache Software License", "BSD License",
                     "ISC License", "Python Software Foundation License",
                     "Mozilla Public License 2.0 (MPL 2.0)"}
          REVIEW  = {"GNU General Public License v2", "GNU General Public License v3",
                     "GNU Lesser General Public License v2"}

          with open("/tmp/py-licenses.json") as f:
              pkgs = json.load(f)

          by_license = {}
          for pkg in pkgs:
              lic = pkg.get("License", "UNKNOWN")
              by_license.setdefault(lic, []).append(pkg["Name"])

          print(f"  Total packages: {len(pkgs)}")
          for lic, names in sorted(by_license.items(),
                                    key=lambda x: len(x[1]),
                                    reverse=True):
              icon = "✅" if lic in ALLOWED else \
                     "⚠️ " if lic in REVIEW else "ℹ️ "
              print(f"  {icon} {lic}: {len(names)} package(s)")
          LICCHECK
            fi
          fi

          passed="true"
          [[ "${audit_failed}" == "true" ]] && passed="false"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  📊 Python Audit: %-40s║\n" "${total_vulns} vulnerabilities"
          echo "╠══════════════════════════════════════════════════════════════╣"
          [[ "${passed}" == "true" ]] && \
            echo "║  ✅ STATUS: PASSED                                          ║" || \
            echo "║  ❌ STATUS: FAILED — Python vulnerabilities detected        ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "vulns=${total_vulns}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"     >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: CARGO-AUDIT — Rust dependency audit
  # ────────────────────────────────────────────────────────────────────────────
  cargo-audit:
    name: "🦀 Cargo Dependency Audit"
    needs: discover
    if: needs.discover.outputs.has-cargo == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      vulnerabilities: ${{ steps.audit.outputs.vulns }}
      passed:          ${{ steps.audit.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🦀 Install Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable

      - name: "🛠️ Install cargo-audit & cargo-deny"
        shell: bash
        run: |
          echo "  Installing cargo-audit..."
          cargo install cargo-audit --quiet 2>/dev/null || true
          echo "  Installing cargo-deny..."
          cargo install cargo-deny --quiet 2>/dev/null || true
          echo "  Installing cargo-license..."
          cargo install cargo-license --quiet 2>/dev/null || true

          echo "  ✅ Rust audit tools installed"

      - name: "🔍 Run Cargo Audit"
        id: audit
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🦀 Cargo/Rust Dependency Security Audit                    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          total_vulns=0
          audit_failed=false

          mapfile -t cargo_dirs < <(
            find . -name "Cargo.toml" ! -path "./.git/*" ! -path "*/target/*" \
              | xargs -I{} dirname {} | sort -u
          )

          for cargo_dir in "${cargo_dirs[@]}"; do
            echo ""
            echo "  🦀 Auditing: ${cargo_dir}/"

            audit_output="$(cd "${cargo_dir}" && \
              cargo audit --json 2>/dev/null)" || true

            vulns="$(echo "${audit_output}" | \
              jq '.vulnerabilities.count // 0' 2>/dev/null || echo 0)"
            warnings="$(echo "${audit_output}" | \
              jq '.warnings | length' 2>/dev/null || echo 0)"

            total_vulns=$((total_vulns + vulns))

            if [[ ${vulns} -gt 0 ]]; then
              echo "  ❌ ${cargo_dir}: ${vulns} vulnerabilities"
              echo "${audit_output}" | jq -r '
                .vulnerabilities.list[]? |
                "  🔴 [\(.advisory.id)] \(.advisory.title)\n" +
                "     Package: \(.package.name) \(.package.version)\n" +
                "     CVSSv3:  \(.advisory.cvss // "N/A")"
              ' 2>/dev/null | head -30
              audit_failed=true
            else
              echo "  ✅ ${cargo_dir}: Clean (${warnings} warnings)"
            fi

            # cargo deny check
            if command -v cargo-deny &>/dev/null; then
              echo "  🔍 cargo deny check..."
              cd "${cargo_dir}" && \
                cargo deny check advisories 2>/dev/null || true
              cd - > /dev/null || true
            fi
          done

          # Rust license audit
          echo ""
          echo "  📜 Rust License Compliance:"
          if command -v cargo-license &>/dev/null; then
            cargo license --json 2>/dev/null | \
              python3 -c "
          import sys, json
          from collections import Counter
          try:
              pkgs = json.loads(sys.stdin.read())
              lics = Counter(p.get('license', 'UNKNOWN') for p in pkgs)
              print(f'  Total crates: {len(pkgs)}')
              for lic, count in sorted(lics.items(), key=lambda x: -x[1]):
                  print(f'     {lic}: {count}')
          except: pass" 2>/dev/null || true
          fi

          passed="true"
          [[ "${audit_failed}" == "true" ]] && passed="false"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  📊 Cargo Audit: %-41s║\n" "${total_vulns} vulnerabilities"
          [[ "${passed}" == "true" ]] && \
            echo "║  ✅ STATUS: PASSED                                          ║" || \
            echo "║  ❌ STATUS: FAILED                                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "vulns=${total_vulns}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"     >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 05: GO-AUDIT — Go dependency audit
  # ────────────────────────────────────────────────────────────────────────────
  go-audit:
    name: "🐹 Go Dependency Audit"
    needs: discover
    if: needs.discover.outputs.has-go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      vulnerabilities: ${{ steps.audit.outputs.vulns }}
      passed:          ${{ steps.audit.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐹 Setup Go"
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: "🔍 Run govulncheck"
        id: audit
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🐹 Go Dependency Security Audit (govulncheck)              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          go install golang.org/x/vuln/cmd/govulncheck@latest 2>/dev/null || true
          go install golang.org/x/tools/cmd/gonew@latest 2>/dev/null || true

          total_vulns=0
          audit_failed=false

          mapfile -t go_dirs < <(
            find . -name "go.mod" ! -path "./.git/*" | xargs -I{} dirname {} | sort -u
          )

          for go_dir in "${go_dirs[@]}"; do
            echo "  🐹 Auditing: ${go_dir}/"

            vuln_output="$(cd "${go_dir}" && \
              govulncheck -json ./... 2>/dev/null)" || true

            finding_count="$(echo "${vuln_output}" | \
              python3 -c "
          import sys, json
          total = 0
          for line in sys.stdin:
              try:
                  r = json.loads(line)
                  if r.get('finding'): total += 1
              except: pass
          print(total)" 2>/dev/null || echo 0)"

            total_vulns=$((total_vulns + finding_count))

            if [[ ${finding_count} -gt 0 ]]; then
              echo "  ❌ ${go_dir}: ${finding_count} findings"
              echo "${vuln_output}" | python3 -c "
          import sys, json
          for line in sys.stdin:
              try:
                  r = json.loads(line)
                  if f := r.get('finding'):
                      print(f\"  🔴 {f.get('osv', '?')}: {f.get('description', '')[:80]}\")
              except: pass" 2>/dev/null | head -10
              audit_failed=true
            else
              echo "  ✅ ${go_dir}: Clean"
            fi
          done

          passed="true"
          [[ "${audit_failed}" == "true" ]] && passed="false"

          echo "vulns=${total_vulns}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"     >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 06: TYPOSQUATTING — Check for typosquatting attacks
  # ────────────────────────────────────────────────────────────────────────────
  typosquatting:
    name: "🎯 Typosquatting Detection"
    needs: discover
    if: inputs.check_typosquatting != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      suspicious: ${{ steps.check.outputs.suspicious }}
      passed:     ${{ steps.check.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "🎯 Run Typosquatting Detection"
        id: check
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🎯 Typosquatting & Supply Chain Attack Detection           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          pip install -q "typosquatparser==0.4.2" 2>/dev/null || true

          python3 << 'TYPOCHECK'
          import json
          import re
          import sys
          from pathlib import Path

          # ═══════════════════════════════════════════════════════════════════
          # ASH Dotfiles Typosquatting Detector
          # ═══════════════════════════════════════════════════════════════════

          suspicious_found = []
          all_packages = []

          # ── Known legitimate packages used by ASH ─────────────────────────
          KNOWN_LEGITIMATE = {
              "fastapi", "uvicorn", "pydantic", "pydantic-settings",
              "httpx", "anyio", "aiofiles", "websockets",
              "python-jose", "passlib", "bcrypt", "python-multipart",
              "pytest", "pytest-asyncio", "pytest-cov", "coverage",
              "pillow", "colorthief", "colormath",
              "jsonschema", "pyyaml", "toml", "referencing",
              "black", "isort", "pylint", "mypy", "ruff", "bandit",
              "react", "react-dom", "react-router-dom",
              "typescript", "@typescript-eslint/eslint-plugin",
              "eslint", "vite", "tailwindcss",
              "stylelint", "prettier", "postcss",
              "axios", "zustand", "tanstack",
              "locust", "schemathesis", "openapi-spec-validator",
          }

          # ── Typosquatting patterns to detect ─────────────────────────────
          def is_suspicious(pkg_name: str) -> tuple[bool, str]:
              """Detect potentially typosquatted package names."""
              name = pkg_name.lower().strip()

              # Common typosquatting techniques
              checks = []

              # 1. Character swap (e.g., rqeuests vs requests)
              known_targets = ["requests", "flask", "django", "numpy",
                               "pandas", "tensorflow", "pytorch", "fastapi",
                               "pydantic", "sqlalchemy", "celery", "redis"]

              for target in known_targets:
                  # Check for 1-2 character differences (simple typos)
                  if len(name) == len(target) and name != target:
                      diffs = sum(a != b for a, b in zip(name, target))
                      if diffs <= 2:
                          checks.append(f"Possible typo of '{target}' ({diffs} char diff)")

              # 2. Homoglyph substitution (e.g., rn vs m, 1 vs l)
              homoglyphs = {
                  "0": "o", "1": "l", "rn": "m", "vv": "w", "cl": "d"
              }
              for fake, real in homoglyphs.items():
                  if fake in name and real in name.replace(fake, real):
                      checks.append(f"Possible homoglyph attack ({fake}→{real})")

              # 3. Extra/missing hyphens or underscores
              variants = [
                  name.replace("-", ""), name.replace("_", ""),
                  name.replace("-", "_"), name.replace("_", "-"),
              ]
              for known in KNOWN_LEGITIMATE:
                  known_variants = [
                      known.replace("-", ""), known.replace("_", ""),
                  ]
                  if any(v in known_variants for v in variants) and \
                     name not in KNOWN_LEGITIMATE:
                      checks.append(
                          f"Variant of known package '{known}' with different separator"
                      )

              # 4. Prefix/suffix attacks
              suspicious_prefixes = ["py-", "python-", "npm-", "lib", "xn--"]
              suspicious_suffixes = ["-dev", "-test", "-backup", "-temp", "-2"]

              for prefix in suspicious_prefixes:
                  target = name[len(prefix):]
                  if name.startswith(prefix) and target in KNOWN_LEGITIMATE:
                      checks.append(
                          f"Suspicious prefix '{prefix}' on known package '{target}'"
                      )

              for suffix in suspicious_suffixes:
                  target = name[:-len(suffix)]
                  if name.endswith(suffix) and target in KNOWN_LEGITIMATE:
                      checks.append(
                          f"Suspicious suffix '{suffix}' on known package '{target}'"
                      )

              return bool(checks), " | ".join(checks) if checks else ""

          # ── Parse package.json ────────────────────────────────────────────
          for pkg_file in Path(".").rglob("package.json"):
              if "node_modules" in str(pkg_file) or ".git" in str(pkg_file):
                  continue
              try:
                  data = json.loads(pkg_file.read_text())
                  for section in ["dependencies", "devDependencies"]:
                      for pkg_name in data.get(section, {}):
                          all_packages.append(("npm", str(pkg_file), pkg_name))
              except Exception:
                  pass

          # ── Parse requirements.txt ────────────────────────────────────────
          for req_file in ["requirements.txt", "api/requirements.txt",
                           "requirements-dev.txt"]:
              if Path(req_file).exists():
                  for line in Path(req_file).read_text().splitlines():
                      line = line.strip()
                      if line and not line.startswith("#"):
                          pkg_name = re.split(r"[>=<!=\[]", line)[0].strip()
                          if pkg_name:
                              all_packages.append(("pip", req_file, pkg_name))

          # ── Check all packages ────────────────────────────────────────────
          print(f"  📦 Checking {len(all_packages)} packages for typosquatting...")
          print("")

          for ecosystem, source, pkg_name in all_packages:
              is_susp, reason = is_suspicious(pkg_name)
              if is_susp and pkg_name not in KNOWN_LEGITIMATE:
                  suspicious_found.append({
                      "ecosystem": ecosystem,
                      "source": source,
                      "package": pkg_name,
                      "reason": reason,
                  })

          if suspicious_found:
              print(f"  ⚠️  {len(suspicious_found)} suspicious package(s) detected:")
              for s in suspicious_found:
                  print(f"  ⚠️  [{s['ecosystem']}] {s['package']}")
                  print(f"     Source: {s['source']}")
                  print(f"     Reason: {s['reason']}")
                  print()
          else:
              print("  ✅ No suspicious packages detected")
              print(f"  📊 Checked: {len(all_packages)} packages across all manifests")

          # Save results
          with open("typosquatting-results.json", "w") as f:
              json.dump({
                  "total_packages": len(all_packages),
                  "suspicious": suspicious_found,
                  "count": len(suspicious_found),
              }, f, indent=2)

          TYPOCHECK

          suspicious="$(jq '.count' typosquatting-results.json 2>/dev/null || echo 0)"
          passed="true"
          [[ ${suspicious} -gt 0 ]] && passed="false"

          echo ""
          echo "  📊 Typosquatting check: ${suspicious} suspicious packages"
          echo "suspicious=${suspicious}" >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}"         >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 07: GATE — Aggregate and report
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Security Gate — Dependency Audit"
    needs: [discover, npm-audit, python-audit, cargo-audit, go-audit, typosquatting]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "💬 Post PR Comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const npmCritical  = parseInt('${{ needs.npm-audit.outputs.critical || 0 }}');
            const npmHigh      = parseInt('${{ needs.npm-audit.outputs.high || 0 }}');
            const npmTotal     = parseInt('${{ needs.npm-audit.outputs.total || 0 }}');
            const npmPassed    = '${{ needs.npm-audit.outputs.passed || "true" }}' === 'true';
            const pyVulns      = parseInt('${{ needs.python-audit.outputs.vulnerabilities || 0 }}');
            const pyPassed     = '${{ needs.python-audit.outputs.passed || "true" }}' === 'true';
            const cargoVulns   = parseInt('${{ needs.cargo-audit.outputs.vulnerabilities || 0 }}');
            const cargoPassed  = '${{ needs.cargo-audit.outputs.passed || "true" }}' === 'true';
            const goVulns      = parseInt('${{ needs.go-audit.outputs.vulnerabilities || 0 }}');
            const goPassed     = '${{ needs.go-audit.outputs.passed || "true" }}' === 'true';
            const suspicious   = parseInt('${{ needs.typosquatting.outputs.suspicious || 0 }}');
            const typosPassed  = '${{ needs.typosquatting.outputs.passed || "true" }}' === 'true';
            const totalPkgs    = '${{ needs.discover.outputs.total-pkgs }}';

            const overallPassed = npmPassed && pyPassed && cargoPassed && goPassed;
            const icon = overallPassed ? '✅' : '❌';
            const status = overallPassed ? 'PASSED' : 'FAILED';

            const body = `## 📦 Dependency Audit ${icon}

            **Status: ${status}** | **${totalPkgs}** total packages audited

            | Ecosystem | Vulnerabilities | Status |
            |-----------|----------------|--------|
            | 📦 npm/pnpm | C:\`${npmCritical}\` H:\`${npmHigh}\` T:\`${npmTotal}\` | ${npmPassed ? '✅' : '❌'} |
            | 🐍 Python | \`${pyVulns}\` | ${pyPassed ? '✅' : '❌'} |
            | 🦀 Rust/Cargo | \`${cargoVulns}\` | ${cargoPassed ? '✅' : '❌'} |
            | 🐹 Go | \`${goVulns}\` | ${goPassed ? '✅' : '❌'} |
            | 🎯 Typosquatting | \`${suspicious}\` suspicious | ${typosPassed ? '✅' : '⚠️'} |

            ${overallPassed
              ? '### ✅ All dependencies are secure!'
              : `### 🔧 Vulnerabilities Require Attention\n\n\`\`\`bash\n# Fix npm vulnerabilities:\nnpm audit fix\n\n# Fix Python vulnerabilities:\npip install --upgrade [package-name]\n\n# Fix Cargo vulnerabilities:\ncargo update\n\`\`\``
            }

            ---
            *🤖 ASH Dependency Audit • [Security Dashboard](${{ github.server_url }}/${{ github.repository }}/security)*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('📦 Dependency Audit')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: "🚦 Evaluate Security Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 Dependency Audit Security Gate                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          npm_passed="${{ needs.npm-audit.outputs.passed || 'true' }}"
          py_passed="${{ needs.python-audit.outputs.passed || 'true' }}"
          cargo_passed="${{ needs.cargo-audit.outputs.passed || 'true' }}"
          go_passed="${{ needs.go-audit.outputs.passed || 'true' }}"

          echo ""
          echo "  📊 Audit Gate Summary:"
          echo "  ├── npm/pnpm: ${npm_passed}"
          echo "  ├── Python:   ${py_passed}"
          echo "  ├── Cargo:    ${cargo_passed}"
          echo "  └── Go:       ${go_passed}"
          echo ""

          all_passed="true"
          for result in "${npm_passed}" "${py_passed}" "${cargo_passed}" "${go_passed}"; do
            [[ "${result}" != "true" ]] && all_passed="false"
          done

          if [[ "${all_passed}" == "true" ]]; then
            echo "  ✅ SECURITY GATE: PASSED"
            echo "  🎉 All dependencies are secure!"
          else
            echo "  ❌ SECURITY GATE: FAILED"
            echo "  Update vulnerable dependencies before merging."
            [[ "${{ env.FAIL_ON_VULN }}" == "true" ]] && exit 1 || true
          fi