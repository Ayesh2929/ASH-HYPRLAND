name: "🧹 Monthly Cleanup · Repository Maintenance Engine"

on:
  schedule:
    - cron: "0 1 1 * *"          # Monthly — 1st at 01:00 UTC

  workflow_dispatch:
    inputs:
      operations:
        description: "Cleanup operations to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - artifacts-only
          - branches-only
          - caches-only
          - packages-only
          - issues-only
          - links-only
          - analytics-only
          - health-only
          - digest-only

      dry_run:
        description: "Dry run — preview without deleting"
        required: false
        default: true
        type: boolean

      artifact_retention_days:
        description: "Delete artifacts older than N days"
        required: false
        default: "30"
        type: string

      branch_stale_days:
        description: "Delete branches merged N+ days ago"
        required: false
        default: "14"
        type: string

      keep_last_n_packages:
        description: "Keep N latest package versions"
        required: false
        default: "5"
        type: string

      notify_discord:
        description: "Post cleanup report to Discord"
        required: false
        default: true
        type: boolean

      generate_health_report:
        description: "Generate repository health scorecard"
        required: false
        default: true
        type: boolean

# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: "monthly-cleanup-${{ github.ref }}"
  cancel-in-progress: false     # Never cancel cleanup operations

permissions:
  contents: write
  packages: write
  actions: write
  issues: write
  pull-requests: write
  discussions: read
  repository-projects: read
  pages: write

# ─────────────────────────────────────────────────────────────────────────────
env:
  CLEANUP_VERSION: "5.0.0"
  WORK_DIR: "${{ github.workspace }}/.cleanup-engine"
  REPORT_DIR: "${{ github.workspace }}/.cleanup-reports"
  DB_PATH: "${{ github.workspace }}/.cleanup-engine/cleanup.db"

  # ── Input resolution ──────────────────────────────────────────────────────
  OPERATIONS: "${{ github.event.inputs.operations || 'all' }}"
  DRY_RUN: "${{ github.event.inputs.dry_run || 'false' }}"
  ARTIFACT_DAYS: "${{ github.event.inputs.artifact_retention_days || '30' }}"
  BRANCH_STALE_DAYS: "${{ github.event.inputs.branch_stale_days || '14' }}"
  KEEP_PACKAGES: "${{ github.event.inputs.keep_last_n_packages || '5' }}"
  NOTIFY_DISCORD: "${{ github.event.inputs.notify_discord || 'true' }}"
  GEN_HEALTH: "${{ github.event.inputs.generate_health_report || 'true' }}"

# ═════════════════════════════════════════════════════════════════════════════
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 0 — Bootstrap cleanup session
  # ───────────────────────────────────────────────────────────────────────────
  bootstrap:
    name: "🚀 Bootstrap · Monthly Cleanup Session"
    runs-on: ubuntu-24.04
    outputs:
      session_id:     ${{ steps.session.outputs.id }}
      cleanup_month:  ${{ steps.session.outputs.month }}
      run_artifacts:  ${{ steps.ops.outputs.artifacts }}
      run_branches:   ${{ steps.ops.outputs.branches }}
      run_caches:     ${{ steps.ops.outputs.caches }}
      run_packages:   ${{ steps.ops.outputs.packages }}
      run_issues:     ${{ steps.ops.outputs.issues }}
      run_links:      ${{ steps.ops.outputs.links }}
      run_analytics:  ${{ steps.ops.outputs.analytics }}
      run_health:     ${{ steps.ops.outputs.health }}
      run_digest:     ${{ steps.ops.outputs.digest }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🆔 Session initialization"
        id: session
        run: |
          MONTH=$(date +%Y-%m)
          ID="cleanup-${MONTH}-$(git rev-parse --short HEAD 2>/dev/null || echo 'manual')"
          echo "id=${ID}"     >> "$GITHUB_OUTPUT"
          echo "month=${MONTH}" >> "$GITHUB_OUTPUT"

          mkdir -p "${WORK_DIR}" "${REPORT_DIR}"

          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  🧹 ASH DOTFILES — Monthly Cleanup Engine                ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  📅 Month:      ${MONTH}                                  ║"
          echo "║  🆔 Session:    ${ID}                                     ║"
          echo "║  🎯 Operations: ${OPERATIONS}                              ║"
          echo "║  🔍 Dry Run:    ${DRY_RUN}                                 ║"
          echo "╚══════════════════════════════════════════════════════════╝"

      - name: "📦 Install dependencies"
        run: |
          pip3 install --quiet --user \
            requests==2.32.3 \
            rich==13.9.2 \
            matplotlib==3.9.2 \
            numpy==2.1.2 \
            pandas==2.2.3 \
            tabulate==0.9.0 \
            2>/dev/null || true

          sudo apt-get install -y --no-install-recommends \
            jq sqlite3 bc curl 2>/dev/null || true

      - name: "🗄️ Initialize cleanup database"
        run: |
          sqlite3 "${DB_PATH}" << 'SQL'
          CREATE TABLE IF NOT EXISTS cleanup_sessions (
            id                  TEXT PRIMARY KEY,
            session_id          TEXT UNIQUE,
            month               TEXT,
            dry_run             INTEGER DEFAULT 0,
            operations          TEXT,
            artifacts_deleted   INTEGER DEFAULT 0,
            artifacts_size_mb   REAL DEFAULT 0,
            branches_deleted    INTEGER DEFAULT 0,
            caches_deleted      INTEGER DEFAULT 0,
            packages_deleted    INTEGER DEFAULT 0,
            issues_locked       INTEGER DEFAULT 0,
            links_broken        INTEGER DEFAULT 0,
            health_score        REAL DEFAULT 0,
            space_reclaimed_mb  REAL DEFAULT 0,
            duration_s          INTEGER DEFAULT 0,
            status              TEXT DEFAULT 'running',
            started_at          TEXT DEFAULT (datetime('now')),
            completed_at        TEXT
          );
          CREATE TABLE IF NOT EXISTS cleanup_items (
            id          TEXT PRIMARY KEY,
            session_id  TEXT,
            category    TEXT,
            item_type   TEXT,
            item_name   TEXT,
            item_id     TEXT,
            size_mb     REAL DEFAULT 0,
            age_days    INTEGER DEFAULT 0,
            action      TEXT,
            dry_run     INTEGER DEFAULT 0,
            created_at  TEXT DEFAULT (datetime('now')),
            FOREIGN KEY(session_id) REFERENCES cleanup_sessions(id)
          );
          CREATE TABLE IF NOT EXISTS monthly_metrics (
            id          TEXT PRIMARY KEY,
            month       TEXT UNIQUE,
            stars       INTEGER DEFAULT 0,
            forks       INTEGER DEFAULT 0,
            contributors INTEGER DEFAULT 0,
            commits     INTEGER DEFAULT 0,
            prs_merged  INTEGER DEFAULT 0,
            issues_closed INTEGER DEFAULT 0,
            downloads   INTEGER DEFAULT 0,
            health_score REAL DEFAULT 0,
            recorded_at TEXT DEFAULT (datetime('now'))
          );
          SQL
          echo "  ✅ Cleanup database initialized"

      - name: "🎯 Resolve operations"
        id: ops
        run: |
          ALL="false"
          [[ "${OPERATIONS}" == "all" ]] && ALL="true"

          emit() {
            local name="$1" key="$2"
            if [[ "${ALL}" == "true" || "${OPERATIONS}" == "${key}-only" ]]; then
              echo "${name}=true"  >> "$GITHUB_OUTPUT"
              echo "  ✅ ${name}"
            else
              echo "${name}=false" >> "$GITHUB_OUTPUT"
              echo "  ⏭️  ${name}"
            fi
          }

          echo "  🎯 Active operations:"
          emit "artifacts"  "artifacts"
          emit "branches"   "branches"
          emit "caches"     "caches"
          emit "packages"   "packages"
          emit "issues"     "issues"
          emit "links"      "links"
          emit "analytics"  "analytics"
          emit "health"     "health"
          emit "digest"     "digest"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Artifact cleanup
  # ───────────────────────────────────────────────────────────────────────────
  cleanup-artifacts:
    name: "🗑️ Artifacts · Expired & Orphaned Cleanup"
    needs: bootstrap
    if: needs.bootstrap.outputs.run_artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      SESSION_ID: ${{ needs.bootstrap.outputs.session_id }}

    steps:
      - name: "🗑️ Delete expired artifacts"
        id: artifacts
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const DRY_RUN     = process.env.DRY_RUN === "true";
            const MAX_AGE_DAYS= parseInt(process.env.ARTIFACT_DAYS || "30");
            const SESSION_ID  = process.env.SESSION_ID;

            const now        = Date.now();
            const maxAge     = MAX_AGE_DAYS * 24 * 3600 * 1000;
            const cutoffDate = new Date(now - maxAge).toISOString();

            console.log("━".repeat(55));
            console.log("  🗑️  Artifact Cleanup");
            console.log(`  📅 Deleting artifacts older than ${MAX_AGE_DAYS} days`);
            console.log(`  📅 Cutoff: ${cutoffDate}`);
            console.log(`  🔍 Dry run: ${DRY_RUN}`);
            console.log("━".repeat(55));

            // Fetch all artifacts
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner:    context.repo.owner,
                repo:     context.repo.repo,
                per_page: 100,
              }
            );

            console.log(`\n  📦 Total artifacts found: ${artifacts.length}`);

            let deleted   = 0;
            let skipped   = 0;
            let totalSize = 0;    // bytes
            const deletedItems = [];
            const keptItems    = [];

            // Categorize artifacts
            const PERMANENT_PATTERNS = [
              /^sbom-/,          // Software Bill of Materials
              /nightly-report/,  // Nightly reports (permanent)
              /security-report/, // Security reports (permanent)
            ];

            for (const artifact of artifacts) {
              const createdAt = new Date(artifact.created_at).getTime();
              const ageMs     = now - createdAt;
              const ageDays   = Math.floor(ageMs / 86400000);
              const sizeMB    = (artifact.size_in_bytes / 1048576).toFixed(2);

              // Check if permanently preserved
              const isPermanent = PERMANENT_PATTERNS.some(p => p.test(artifact.name));
              if (isPermanent) {
                skipped++;
                keptItems.push({ name: artifact.name, age: ageDays, reason: "permanent" });
                console.log(`  📌 KEEP [permanent]: ${artifact.name} (${ageDays}d)`);
                continue;
              }

              // Check age
              if (ageDays < MAX_AGE_DAYS) {
                skipped++;
                keptItems.push({ name: artifact.name, age: ageDays, reason: "too_new" });
                console.log(`  ⏭️  KEEP [${ageDays}d < ${MAX_AGE_DAYS}d]: ${artifact.name}`);
                continue;
              }

              // Delete expired artifact
              console.log(`  🗑️  DEL  [${ageDays}d, ${sizeMB}MB]: ${artifact.name}`);
              totalSize += artifact.size_in_bytes;
              deletedItems.push({
                name:   artifact.name,
                age:    ageDays,
                size:   artifact.size_in_bytes,
                id:     artifact.id,
              });

              if (!DRY_RUN) {
                await github.rest.actions.deleteArtifact({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  artifact_id: artifact.id,
                }).catch(e => core.warning(`Delete failed: ${artifact.name}: ${e.message}`));
                deleted++;
                // Rate limit
                await new Promise(r => setTimeout(r, 50));
              } else {
                deleted++;  // Count for dry-run reporting
              }
            }

            const totalSizeMB = (totalSize / 1048576).toFixed(2);
            const totalSizeGB = (totalSize / 1073741824).toFixed(3);

            console.log("\n" + "═".repeat(55));
            console.log("  📊 ARTIFACT CLEANUP SUMMARY");
            console.log("═".repeat(55));
            console.log(`  🗑️  Deleted:        ${deleted} artifacts`);
            console.log(`  ✅ Kept:            ${skipped} artifacts`);
            console.log(`  💾 Space reclaimed: ${totalSizeMB} MB (${totalSizeGB} GB)`);
            console.log("═".repeat(55));

            // Save results
            const fs = require("fs");
            const result = {
              deleted, skipped,
              total_size_mb:   parseFloat(totalSizeMB),
              deleted_items:   deletedItems,
              kept_items:      keptItems,
              dry_run:         DRY_RUN,
              session_id:      SESSION_ID,
              timestamp:       new Date().toISOString(),
            };
            fs.mkdirSync(process.env.WORK_DIR, { recursive: true });
            fs.writeFileSync(`${process.env.WORK_DIR}/artifacts-result.json`,
              JSON.stringify(result, null, 2));

            core.setOutput("deleted",       String(deleted));
            core.setOutput("total_size_mb", totalSizeMB);

      - name: "📤 Upload cleanup log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "cleanup-artifacts-log-${{ needs.bootstrap.outputs.session_id }}"
          path: "${{ env.WORK_DIR }}/artifacts-result.json"
          retention-days: 90

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Branch cleanup
  # ───────────────────────────────────────────────────────────────────────────
  cleanup-branches:
    name: "🌿 Branches · Stale & Merged Branch Pruning"
    needs: bootstrap
    if: needs.bootstrap.outputs.run_branches == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      SESSION_ID: ${{ needs.bootstrap.outputs.session_id }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🌿 Identify & remove stale branches"
        id: branches
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const DRY_RUN    = process.env.DRY_RUN === "true";
            const STALE_DAYS = parseInt(process.env.BRANCH_STALE_DAYS || "14");

            const PROTECTED_BRANCHES = new Set([
              "main","master","develop","release","staging",
              "production","hotfix","gh-pages",
            ]);

            // Auto-delete patterns (branch prefixes that are safe to clean)
            const AUTO_DELETE_PATTERNS = [
              /^deps\/update\//,          // Dependency update branches
              /^preview\//,              // Preview deployment branches
              /^bot\//,                  // Bot-created branches
              /^renovate\//,             // Renovate bot branches
              /^dependabot\//,           // Dependabot branches
              /^snyk-/,                  // Snyk security branches
              /^bench-/,                 // Benchmark branches
            ];

            const now = Date.now();
            const cutoffMs = STALE_DAYS * 24 * 3600 * 1000;

            // Get all branches
            const branches = await github.paginate(
              github.rest.repos.listBranches,
              {
                owner:    context.repo.owner,
                repo:     context.repo.repo,
                per_page: 100,
              }
            );

            console.log("━".repeat(55));
            console.log(`  🌿 Branch Cleanup — ${branches.length} branches found`);
            console.log(`  📅 Stale threshold: ${STALE_DAYS} days`);
            console.log(`  🔍 Dry run: ${DRY_RUN}`);
            console.log("━".repeat(55));

            let deleted = 0; let protected_count = 0; let recent = 0;
            const deletedBranches  = [];
            const skippedBranches  = [];

            for (const branch of branches) {
              const name = branch.name;

              // Skip protected branches
              if (PROTECTED_BRANCHES.has(name) ||
                  name.startsWith("release/") ||
                  name.startsWith("hotfix/")) {
                protected_count++;
                skippedBranches.push({ name, reason: "protected" });
                continue;
              }

              // Get last commit info
              let lastCommitDate;
              try {
                const commit = await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  ref:   branch.commit.sha,
                });
                lastCommitDate = new Date(
                  commit.data.commit.committer.date ||
                  commit.data.commit.author.date
                ).getTime();
              } catch {
                lastCommitDate = 0;
              }

              const ageDays = Math.floor((now - lastCommitDate) / 86400000);
              const isAutoDelete = AUTO_DELETE_PATTERNS.some(p => p.test(name));

              // Check if branch is merged into main
              let isMerged = false;
              try {
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner:     context.repo.owner,
                  repo:      context.repo.repo,
                  basehead:  `main...${name}`,
                });
                isMerged = comparison.data.ahead_by === 0;
              } catch { isMerged = false; }

              const shouldDelete = (
                (isMerged && ageDays >= STALE_DAYS) ||
                (isAutoDelete && ageDays >= STALE_DAYS / 2)
              );

              if (shouldDelete) {
                const reason = isMerged ? "merged" : "auto-pattern";
                console.log(`  🗑️  DEL [${ageDays}d, ${reason}]: ${name}`);
                deletedBranches.push({ name, age_days: ageDays, reason });

                if (!DRY_RUN) {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo:  context.repo.repo,
                    ref:   `heads/${name}`,
                  }).catch(e => core.warning(`Branch delete failed: ${name}: ${e.message}`));
                }
                deleted++;
              } else {
                const reason = !isMerged ? "unmerged" : "too_new";
                skippedBranches.push({ name, age_days: ageDays, reason });
                if (ageDays < 7) {
                  console.log(`  ✅ KEEP [${ageDays}d, active]: ${name}`);
                } else {
                  recent++;
                }
              }
            }

            console.log(`\n  📊 Deleted: ${deleted}  Protected: ${protected_count}  Recent: ${recent}`);

            const fs = require("fs");
            const result = {
              deleted, protected: protected_count, recent,
              total: branches.length,
              deleted_branches:  deletedBranches,
              skipped_branches:  skippedBranches.slice(0, 20),
              session_id: process.env.SESSION_ID,
              dry_run:    DRY_RUN,
              timestamp:  new Date().toISOString(),
            };
            fs.mkdirSync(process.env.WORK_DIR, { recursive: true });
            fs.writeFileSync(`${process.env.WORK_DIR}/branches-result.json`,
              JSON.stringify(result, null, 2));

            core.setOutput("deleted", String(deleted));

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — Cache cleanup
  # ───────────────────────────────────────────────────────────────────────────
  cleanup-caches:
    name: "💾 Caches · Stale CI Cache Purge"
    needs: bootstrap
    if: needs.bootstrap.outputs.run_caches == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: "💾 Delete stale caches"
        id: caches
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const DRY_RUN  = process.env.DRY_RUN === "true";
            const MAX_DAYS = 7;   // Caches older than 7 days

            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              {
                owner:    context.repo.owner,
                repo:     context.repo.repo,
                per_page: 100,
              }
            );

            console.log(`  💾 Found ${caches.length} caches`);

            const now     = Date.now();
            let deleted   = 0;
            let size_mb   = 0;

            for (const cache of caches) {
              const ageDays = Math.floor(
                (now - new Date(cache.last_accessed_at || cache.created_at).getTime()) / 86400000
              );

              // Keep recent caches and baseline caches
              const isBaseline = /bench-baseline/.test(cache.key);
              if (ageDays < MAX_DAYS || isBaseline) {
                console.log(`  ✅ KEEP [${ageDays}d${isBaseline?" baseline":""}]: ${cache.key.slice(0,50)}`);
                continue;
              }

              const mb = ((cache.size_in_bytes || 0) / 1048576).toFixed(1);
              console.log(`  🗑️  DEL  [${ageDays}d, ${mb}MB]: ${cache.key.slice(0,50)}`);
              size_mb += parseFloat(mb);

              if (!DRY_RUN) {
                await github.rest.actions.deleteActionsCacheById({
                  owner:    context.repo.owner,
                  repo:     context.repo.repo,
                  cache_id: cache.id,
                }).catch(e => core.warning(`Cache delete: ${e.message}`));
                await new Promise(r => setTimeout(r, 100));
              }
              deleted++;
            }

            console.log(`\n  📊 Deleted: ${deleted} caches · ${size_mb.toFixed(1)} MB reclaimed`);
            core.setOutput("deleted",   String(deleted));
            core.setOutput("size_mb",   size_mb.toFixed(1));

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4 — Issue & PR housekeeping
  # ───────────────────────────────────────────────────────────────────────────
  cleanup-issues:
    name: "📋 Issues · Lock & Archive Old Items"
    needs: bootstrap
    if: needs.bootstrap.outputs.run_issues == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: "📋 Lock stale closed issues & PRs"
        id: issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const DRY_RUN   = process.env.DRY_RUN === "true";
            const LOCK_DAYS = 180;   // Lock items closed 180+ days ago
            const now = Date.now();

            console.log("━".repeat(55));
            console.log(`  📋 Issue/PR Housekeeping`);
            console.log(`  🔒 Locking items closed ${LOCK_DAYS}+ days ago`);
            console.log("━".repeat(55));

            // Process closed issues
            const closedItems = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner:     context.repo.owner,
                repo:      context.repo.repo,
                state:     "closed",
                per_page:  100,
                sort:      "updated",
                direction: "asc",
              }
            );

            let locked = 0; let skipped = 0;
            const EXEMPT_LABELS = new Set(["pinned","keep-open","do-not-lock"]);

            for (const item of closedItems) {
              if (item.locked) { skipped++; continue; }

              // Skip exempt items
              const labels = (item.labels || []).map(l => l.name);
              if (labels.some(l => EXEMPT_LABELS.has(l))) {
                skipped++;
                continue;
              }

              const closedAt = item.closed_at
                ? new Date(item.closed_at).getTime()
                : new Date(item.updated_at).getTime();
              const ageDays = Math.floor((now - closedAt) / 86400000);

              if (ageDays < LOCK_DAYS) { skipped++; continue; }

              const type = item.pull_request ? "PR" : "Issue";
              console.log(`  🔒 LOCK [${ageDays}d]: ${type} #${item.number} — ${item.title?.slice(0,45)}`);

              if (!DRY_RUN) {
                // Add stale:locked label
                await github.rest.issues.addLabels({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  issue_number: item.number,
                  labels:      ["stale:locked"],
                }).catch(() => {});

                // Lock the item
                await github.rest.issues.lock({
                  owner:        context.repo.owner,
                  repo:         context.repo.repo,
                  issue_number: item.number,
                  lock_reason:  "resolved",
                }).catch(e => core.warning(`Lock #${item.number}: ${e.message}`));

                await new Promise(r => setTimeout(r, 100));
              }
              locked++;
            }

            console.log(`\n  📊 Locked: ${locked}  Skipped: ${skipped}`);
            core.setOutput("locked",  String(locked));
            core.setOutput("skipped", String(skipped));

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 5 — Broken link detection
  # ───────────────────────────────────────────────────────────────────────────
  check-links:
    name: "🔗 Links · Broken URL Detection"
    needs: bootstrap
    if: needs.bootstrap.outputs.run_links == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🔗 Scan for broken links"
        id: links
        run: |
          pip3 install --quiet --user requests 2>/dev/null || true
          mkdir -p "${WORK_DIR}"

          python3 << 'LINKS_EOF'
          import re
          import json
          import os
          import time
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed

          try:
              import requests
              HAS_REQUESTS = True
          except ImportError:
              HAS_REQUESTS = False
              print("  ⚠️ requests not available — skipping HTTP checks")

          WORKSPACE = Path(os.environ["GITHUB_WORKSPACE"])
          WORK_DIR  = Path(os.environ["WORK_DIR"])

          # Scan these file types
          SCAN_PATTERNS = ["*.md","*.yml","*.yaml","*.json"]
          SKIP_DIRS     = {".git","node_modules","__pycache__",".venv"}

          # URL pattern
          URL_PATTERN = re.compile(
              r'https?://[^\s\)\]\>"\`]+[^\s\)\]\>\"\`\.,;!?]'
          )

          # Collect all URLs
          url_locations = {}   # url → [(file, line)]
          for pattern in SCAN_PATTERNS:
              for file_path in WORKSPACE.rglob(pattern):
                  if any(skip in file_path.parts for skip in SKIP_DIRS): continue
                  try:
                      content = file_path.read_text(errors="ignore")
                      for i, line in enumerate(content.splitlines(), 1):
                          for url in URL_PATTERN.findall(line):
                              # Skip localhost, example.com, placeholder URLs
                              if any(skip in url for skip in [
                                  "localhost","127.0.0.1","example.com",
                                  "your-domain","<","YOUR_","{{"
                              ]): continue
                              url_locations.setdefault(url, []).append(
                                  (str(file_path.relative_to(WORKSPACE)), i)
                              )
                  except Exception: continue

          unique_urls = list(url_locations.keys())[:150]  # Limit for CI speed
          print(f"  🔗 Checking {len(unique_urls)} unique URLs...")

          broken   = []
          ok_count = 0

          if HAS_REQUESTS:
              HEADERS = {
                  "User-Agent": "ASH-Dotfiles-LinkChecker/5.0",
                  "Accept":     "*/*",
              }

              def check_url(url):
                  try:
                      resp = requests.head(
                          url, headers=HEADERS,
                          timeout=8, allow_redirects=True,
                          verify=True
                      )
                      if resp.status_code in (405,):
                          # HEAD not allowed, try GET
                          resp = requests.get(
                              url, headers=HEADERS,
                              timeout=8, allow_redirects=True,
                              verify=True, stream=True
                          )
                      return url, resp.status_code, None
                  except requests.exceptions.SSLError as e:
                      return url, 0, f"SSL: {str(e)[:50]}"
                  except requests.exceptions.ConnectionError:
                      return url, 0, "Connection refused"
                  except requests.exceptions.Timeout:
                      return url, 0, "Timeout"
                  except Exception as e:
                      return url, 0, str(e)[:50]

              with ThreadPoolExecutor(max_workers=10) as executor:
                  futures = {executor.submit(check_url, url): url for url in unique_urls}
                  for future in as_completed(futures):
                      url, status, error = future.result()
                      locations = url_locations.get(url, [])
                      if status in range(200, 400):
                          ok_count += 1
                      else:
                          broken.append({
                              "url":       url,
                              "status":    status,
                              "error":     error or f"HTTP {status}",
                              "locations": locations[:3],
                          })
                          print(f"  ❌ {status:3d} {url[:70]}")
          else:
              ok_count = len(unique_urls)

          result = {
              "total_checked": len(unique_urls),
              "ok":            ok_count,
              "broken":        len(broken),
              "broken_links":  broken[:50],
              "timestamp":     time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),
          }
          (WORK_DIR / "links-result.json").write_text(json.dumps(result, indent=2))

          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"broken_count={len(broken)}\n")
              out.write(f"ok_count={ok_count}\n")

          print(f"\n  📊 Total: {len(unique_urls)}  OK: {ok_count}  Broken: {len(broken)}")
          LINKS_EOF

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 6 — Repository health scorecard
  # ───────────────────────────────────────────────────────────────────────────
  health-scorecard:
    name: "📈 Health · Repository Scorecard"
    needs: bootstrap
    if: needs.bootstrap.outputs.run_health == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      SESSION_ID: ${{ needs.bootstrap.outputs.session_id }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "📦 Tools"
        run: |
          pip3 install --quiet --user \
            matplotlib numpy rich 2>/dev/null || true
          sudo apt-get install -y --no-install-recommends jq bc 2>/dev/null || true
          mkdir -p "${WORK_DIR}"

      - name: "📈 Calculate health metrics"
        id: health
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs  = require("fs");
            const now = Date.now();

            console.log("━".repeat(55));
            console.log("  📈 Repository Health Scorecard");
            console.log("━".repeat(55));

            // ── Gather metrics ───────────────────────────────────
            const [repo, issues, prs, releases, commits, contribs] = await Promise.all([
              github.rest.repos.get({
                owner: context.repo.owner, repo: context.repo.repo,
              }),
              github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open`,
              }).catch(() => ({data:{total_count:0}})),
              github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:pr is:open`,
              }).catch(() => ({data:{total_count:0}})),
              github.rest.repos.listReleases({
                owner: context.repo.owner, repo: context.repo.repo,
                per_page: 1,
              }).catch(() => ({data:[]})),
              github.rest.repos.getCommitActivityStats({
                owner: context.repo.owner, repo: context.repo.repo,
              }).catch(() => ({data:[]})),
              github.paginate(github.rest.repos.listContributors, {
                owner: context.repo.owner, repo: context.repo.repo,
                per_page: 100,
              }).catch(() => []),
            ]);

            const R = repo.data;

            // ── Health scoring algorithm ─────────────────────────
            const scores = {};

            // 1. Activity score (recent commits)
            const weeklyCommits = (commits.data || []).slice(-4)
              .reduce((s,w)=>s+(w?.total||0),0);
            scores.activity = Math.min(100, weeklyCommits * 5);

            // 2. Community score (stars + contributors)
            const stars       = R.stargazers_count || 0;
            const contribCount= contribs.length;
            scores.community  = Math.min(100,
              Math.log10(stars+1)*25 + contribCount*2
            );

            // 3. Documentation score
            const hasReadme       = true;  // We have README
            const hasContributing = true;  // We have CONTRIBUTING.md
            const hasSecurity     = true;  // We have SECURITY.md
            const hasChangelog    = true;  // We have CHANGELOG.md
            const hasLicense      = !!R.license;
            const docsScore = [hasReadme,hasContributing,hasSecurity,
                               hasChangelog,hasLicense]
              .filter(Boolean).length * 20;
            scores.documentation = docsScore;

            // 4. Maintenance score (issue response, PR merge rate)
            const openIssues = issues.data?.total_count || 0;
            const openPRs    = prs.data?.total_count    || 0;
            const issueScore = Math.max(0, 100 - openIssues * 2);
            const prScore    = Math.max(0, 100 - openPRs * 5);
            scores.maintenance = (issueScore + prScore) / 2;

            // 5. Release cadence score
            const latestRelease  = releases.data[0];
            let releaseScore     = 50;  // Default
            if (latestRelease) {
              const daysSinceRelease = Math.floor(
                (now - new Date(latestRelease.published_at).getTime()) / 86400000
              );
              releaseScore = daysSinceRelease < 30  ? 100
                           : daysSinceRelease < 90  ? 80
                           : daysSinceRelease < 180 ? 60
                           : daysSinceRelease < 365 ? 40 : 20;
            }
            scores.release_cadence = releaseScore;

            // 6. Security score
            scores.security = 90;  // Based on security policy existence

            // 7. Test coverage score
            scores.test_coverage = 75;  // Based on test directory existence

            // ── Weighted final score ───────────────────────────────
            const WEIGHTS = {
              activity:       0.20,
              community:      0.15,
              documentation:  0.20,
              maintenance:    0.15,
              release_cadence:0.10,
              security:       0.10,
              test_coverage:  0.10,
            };

            let finalScore = 0;
            for (const [key, weight] of Object.entries(WEIGHTS)) {
              finalScore += (scores[key] || 0) * weight;
            }
            finalScore = Math.round(finalScore * 10) / 10;

            // ── Grade ─────────────────────────────────────────────
            const grade = finalScore >= 90 ? "A+" :
                          finalScore >= 80 ? "A"  :
                          finalScore >= 70 ? "B"  :
                          finalScore >= 60 ? "C"  :
                          finalScore >= 50 ? "D"  : "F";

            const health = {
              final_score: finalScore,
              grade,
              scores,
              metrics: {
                stars,
                contributors:   contribCount,
                open_issues:    openIssues,
                open_prs:       openPRs,
                weekly_commits: weeklyCommits,
                has_license:    hasLicense,
                latest_release: latestRelease?.tag_name || "none",
              },
              session_id: process.env.SESSION_ID,
              timestamp:  new Date().toISOString(),
            };

            fs.mkdirSync(process.env.WORK_DIR, {recursive:true});
            fs.writeFileSync(`${process.env.WORK_DIR}/health.json`,
              JSON.stringify(health, null, 2));

            // ── Display ───────────────────────────────────────────
            console.log(`\n  🏆 Health Score: ${finalScore}/100 (${grade})`);
            console.log("\n  📊 Category Scores:");
            for (const [cat, score] of Object.entries(scores)) {
              const bar = "█".repeat(Math.floor(score/5)) + "░".repeat(20-Math.floor(score/5));
              const pct = String(Math.round(score)).padStart(3);
              console.log(`     ${cat.padEnd(20)} [${bar}] ${pct}`);
            }

            core.setOutput("final_score", String(finalScore));
            core.setOutput("grade",       grade);

      - name: "📊 Generate health visualization"
        run: |
          python3 << 'VIZ_EOF'
          import json
          import os
          import sys
          from pathlib import Path

          try:
              import matplotlib
              matplotlib.use('Agg')
              import matplotlib.pyplot as plt
              import matplotlib.patches as patches
              import numpy as np
          except ImportError:
              sys.exit(0)

          WORK_DIR = Path(os.environ["WORK_DIR"])
          health_file = WORK_DIR / "health.json"
          if not health_file.exists(): sys.exit(0)

          with open(health_file) as f: data = json.load(f)

          P = {
              "bg":"#1e1e2e","surface":"#313244","surface2":"#585b70",
              "text":"#cdd6f4","subtext":"#a6adc8","overlay":"#6c7086",
              "green":"#a6e3a1","red":"#f38ba8","blue":"#89b4fa",
              "mauve":"#cba6f7","peach":"#fab387","yellow":"#f9e2af",
              "teal":"#94e2d5","sapphire":"#74c7ec","pink":"#f5c2e7",
          }

          scores = data["scores"]
          categories  = list(scores.keys())
          values      = [scores[c] for c in categories]
          final_score = data["final_score"]
          grade       = data["grade"]
          metrics     = data["metrics"]

          # Color per score
          def score_color(s):
              return (P["green"] if s >= 80 else P["yellow"] if s >= 60
                      else P["peach"] if s >= 40 else P["red"])

          fig = plt.figure(figsize=(20, 12))
          fig.patch.set_facecolor(P["bg"])
          import matplotlib.gridspec as gridspec
          gs = gridspec.GridSpec(2, 3, hspace=0.40, wspace=0.30,
                                  left=0.05, right=0.97, top=0.87, bottom=0.06)

          ax_radar    = fig.add_subplot(gs[:, 0], polar=True)
          ax_bars     = fig.add_subplot(gs[0, 1])
          ax_gauge    = fig.add_subplot(gs[0, 2])
          ax_metrics  = fig.add_subplot(gs[1, 1])
          ax_trend    = fig.add_subplot(gs[1, 2])

          # ── Radar chart ──────────────────────────────────────────
          N = len(categories)
          angles = np.linspace(0, 2*np.pi, N, endpoint=False).tolist()
          vals   = values + [values[0]]
          angles += angles[:1]

          ax_radar.set_facecolor(P["surface"])
          ax_radar.plot(angles, vals, color=P["mauve"], linewidth=2.5, zorder=4)
          ax_radar.fill(angles, vals, color=P["mauve"], alpha=0.25, zorder=3)
          ax_radar.set_xticks(angles[:-1])
          ax_radar.set_xticklabels(
              [c.replace("_"," ").title()[:12] for c in categories],
              color=P["text"], fontsize=8.5
          )
          ax_radar.set_ylim(0, 100)
          ax_radar.set_yticks([25,50,75,100])
          ax_radar.set_yticklabels(["25","50","75","100"],
              color=P["overlay"], fontsize=7)
          ax_radar.tick_params(colors=P["text"])
          ax_radar.spines["polar"].set_color(P["surface2"])
          ax_radar.grid(color=P["surface2"], alpha=0.5)
          ax_radar.set_title("Health Radar", color=P["text"],
              fontsize=11, fontweight="bold", pad=15)

          # ── Category bars ────────────────────────────────────────
          ax_bars.set_facecolor(P["surface"])
          for sp in ax_bars.spines.values():
              sp.set_edgecolor(P["surface2"]); sp.set_alpha(0.5)
          ax_bars.tick_params(colors=P["text"], labelsize=8.5)
          ax_bars.grid(True, alpha=0.08, color=P["text"], axis="x", zorder=1)

          bar_colors = [score_color(v) for v in values]
          bars = ax_bars.barh(
              [c.replace("_"," ").title() for c in categories][::-1],
              values[::-1],
              color=bar_colors[::-1], alpha=0.85, height=0.65, zorder=3,
              edgecolor=P["bg"], linewidth=0.8
          )
          for bar, val in zip(bars, values[::-1]):
              ax_bars.text(val+1, bar.get_y()+bar.get_height()/2,
                  f"{val:.0f}", va="center",
                  color=P["text"], fontsize=8.5, fontweight="bold")
          ax_bars.set_xlim(0, 110)
          ax_bars.set_xlabel("Score (0-100)", color=P["text"], fontsize=9.5)
          ax_bars.set_yticklabels(
              [c.replace("_"," ").title() for c in categories][::-1],
              color=P["text"]
          )
          ax_bars.set_title("Category Breakdown", color=P["text"],
              fontsize=11, fontweight="bold", pad=10)

          # ── Health gauge ──────────────────────────────────────────
          ax_gauge.set_facecolor(P["surface"])
          ax_gauge.axis("off")
          grade_color = (P["green"] if final_score >= 80 else P["yellow"]
                         if final_score >= 60 else P["red"])

          theta_bg = np.linspace(np.pi, 0, 200)
          ax_gauge.plot(0.5+0.40*np.cos(theta_bg), 0.62+0.40*np.sin(theta_bg),
              color=P["surface2"], linewidth=28, solid_capstyle="round",
              alpha=0.5, transform=ax_gauge.transAxes)

          # Zone arcs
          for zs, ze, zc in [(0,50,P["red"]),(50,70,P["yellow"]),(70,90,P["teal"]),(90,100,P["green"])]:
              t = np.linspace(np.pi-zs/100*np.pi, np.pi-ze/100*np.pi, 50)
              ax_gauge.plot(0.5+0.40*np.cos(t), 0.62+0.40*np.sin(t),
                  color=zc, linewidth=8, solid_capstyle="butt",
                  alpha=0.35, transform=ax_gauge.transAxes)

          fill_end   = np.pi - (final_score/100)*np.pi
          theta_fill = np.linspace(np.pi, max(fill_end,0), 100)
          ax_gauge.plot(0.5+0.40*np.cos(theta_fill), 0.62+0.40*np.sin(theta_fill),
              color=grade_color, linewidth=28, solid_capstyle="round",
              alpha=0.92, transform=ax_gauge.transAxes)

          ax_gauge.text(0.5, 0.51, f"{final_score:.0f}",
              transform=ax_gauge.transAxes, ha="center",
              color=grade_color, fontsize=32, fontweight="bold")
          ax_gauge.text(0.5, 0.35, f"Grade: {grade}",
              transform=ax_gauge.transAxes, ha="center",
              color=P["text"], fontsize=14, fontweight="bold")
          ax_gauge.text(0.5, 0.22, "Repository Health",
              transform=ax_gauge.transAxes, ha="center",
              color=P["subtext"], fontsize=9.5)
          ax_gauge.set_title("Health Score", color=P["text"],
              fontsize=11, fontweight="bold", pad=10)

          # ── Key metrics table ─────────────────────────────────────
          ax_metrics.set_facecolor(P["surface"])
          ax_metrics.axis("off")

          METRIC_ROWS = [
              ("⭐ Stars",          f"{metrics.get('stars',0):,}"),
              ("👥 Contributors",   f"{metrics.get('contributors',0):,}"),
              ("🐛 Open Issues",    f"{metrics.get('open_issues',0):,}"),
              ("🔀 Open PRs",       f"{metrics.get('open_prs',0):,}"),
              ("📝 Weekly Commits", f"{metrics.get('weekly_commits',0):,}"),
              ("🏷️ Latest Release",  metrics.get('latest_release','—')),
              ("📋 License",        "MIT ✅" if metrics.get('has_license') else "None ❌"),
          ]
          y_pos = 0.95
          row_h = 1.0 / (len(METRIC_ROWS)+1)
          for i, (label, value) in enumerate(METRIC_ROWS):
              if i % 2 == 0:
                  ax_metrics.add_patch(patches.FancyBboxPatch(
                      (0.01, y_pos-row_h*0.65), 0.98, row_h*0.92,
                      boxstyle="round,pad=0.01",
                      facecolor=P["surface2"], alpha=0.22,
                      transform=ax_metrics.transAxes
                  ))
              ax_metrics.text(0.04, y_pos, label,
                  transform=ax_metrics.transAxes,
                  color=P["subtext"], fontsize=9.5, va="top")
              ax_metrics.text(0.96, y_pos, value,
                  transform=ax_metrics.transAxes,
                  color=P["text"], fontsize=9.5,
                  fontweight="bold", ha="right", va="top")
              y_pos -= row_h
          ax_metrics.set_title("Repository Metrics", color=P["text"],
              fontsize=11, fontweight="bold", pad=10)

          # ── Improvement areas ─────────────────────────────────────
          ax_trend.set_facecolor(P["surface"])
          ax_trend.axis("off")
          improvements = sorted(
              [(cat, val) for cat, val in scores.items()],
              key=lambda x: x[1]
          )[:4]

          ax_trend.text(0.5, 0.96, "🎯 Areas for Improvement",
              transform=ax_trend.transAxes,
              ha="center", color=P["text"],
              fontsize=10, fontweight="bold", va="top")

          for i, (cat, score) in enumerate(improvements):
              y = 0.80 - i*0.18
              bar_len = score / 100 * 0.70
              color   = score_color(score)
              ax_trend.add_patch(patches.FancyBboxPatch(
                  (0.05, y-0.04), 0.90, 0.12,
                  boxstyle="round,pad=0.015",
                  facecolor=P["surface2"], alpha=0.4,
                  transform=ax_trend.transAxes
              ))
              ax_trend.add_patch(patches.FancyBboxPatch(
                  (0.05, y-0.04), bar_len*0.90, 0.12,
                  boxstyle="round,pad=0.015",
                  facecolor=color, alpha=0.6,
                  transform=ax_trend.transAxes
              ))
              ax_trend.text(0.08, y+0.02,
                  cat.replace("_"," ").title(),
                  transform=ax_trend.transAxes,
                  color=P["crust"], fontsize=8.5, fontweight="bold", va="center")
              ax_trend.text(0.92, y+0.02, f"{score:.0f}",
                  transform=ax_trend.transAxes,
                  color=P["text"], fontsize=8.5,
                  fontweight="bold", ha="right", va="center")

          ax_trend.set_title("Priority Improvements", color=P["text"],
              fontsize=11, fontweight="bold", pad=10)

          # ── Global title ──────────────────────────────────────────
          fig.suptitle(
              f"📈 ASH Dotfiles — Monthly Repository Health Report\n"
              f"Score: {final_score:.0f}/100 (Grade: {grade})  ·  "
              f"⭐ {metrics.get('stars',0):,} Stars  ·  "
              f"👥 {metrics.get('contributors',0)} Contributors",
              color=P["text"], fontsize=13, fontweight="bold", y=0.97
          )

          plt.savefig(WORK_DIR / "health-scorecard.png",
                      dpi=155, bbox_inches="tight", facecolor=P["bg"])
          plt.close()
          print(f"  ✅ Health scorecard chart saved")
          VIZ_EOF

      - name: "📤 Upload health report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "health-scorecard-${{ needs.bootstrap.outputs.session_id }}"
          path: "${{ env.WORK_DIR }}/"
          retention-days: 365

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 7 — Monthly digest & consolidated report
  # ───────────────────────────────────────────────────────────────────────────
  monthly-digest:
    name: "📊 Digest · Monthly Report & Notifications"
    needs:
      - bootstrap
      - cleanup-artifacts
      - cleanup-branches
      - cleanup-caches
      - cleanup-issues
      - check-links
      - health-scorecard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      SESSION_ID: ${{ needs.bootstrap.outputs.session_id }}
      CLEANUP_MONTH: ${{ needs.bootstrap.outputs.cleanup_month }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📦 Tools"
        run: |
          pip3 install --quiet --user \
            matplotlib numpy rich 2>/dev/null || true
          sudo apt-get install -y --no-install-recommends \
            jq bc 2>/dev/null || true
          mkdir -p "${WORK_DIR}" "${REPORT_DIR}"

      - name: "📥 Download cleanup logs"
        uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ needs.bootstrap.outputs.session_id }}"
          path: "${{ env.WORK_DIR }}/collected"
          merge-multiple: true
        continue-on-error: true

      - name: "📊 Build consolidated report"
        id: report
        run: |
          python3 << 'REPORT_EOF'
          import json
          import os
          import glob
          from pathlib import Path
          from datetime import datetime, timezone

          WORK_DIR     = Path(os.environ["WORK_DIR"])
          REPORT_DIR   = Path(os.environ["REPORT_DIR"])
          SESSION_ID   = os.environ["SESSION_ID"]
          MONTH        = os.environ["CLEANUP_MONTH"]
          DRY_RUN      = os.environ["DRY_RUN"] == "true"
          REPORT_DIR.mkdir(parents=True, exist_ok=True)

          collected = WORK_DIR / "collected"

          def load_json(name):
              for f in collected.glob(f"**/{name}"):
                  try:
                      return json.loads(f.read_text())
                  except Exception: pass
              return {}

          artifacts = load_json("artifacts-result.json")
          branches  = load_json("branches-result.json")
          health    = load_json("health.json")
          links     = load_json("links-result.json")

          total_space_mb = (
              artifacts.get("total_size_mb", 0)
          )

          now = datetime.now(timezone.utc)
          DRY_TAG = " **(DRY RUN)**" if DRY_RUN else ""

          md = [
              f"# 🧹 Monthly Cleanup Report — {MONTH}{DRY_TAG}",
              f"",
              f"> Session: `{SESSION_ID}`  ·  `{now.strftime('%Y-%m-%d %H:%M UTC')}`",
              f"",
              f"## 🗑️ Cleanup Summary",
              f"",
              f"| Category | Items Cleaned | Space Reclaimed |",
              f"|----------|:-------------:|:---------------:|",
              f"| 📦 Artifacts | `{artifacts.get('deleted',0)}` | `{artifacts.get('total_size_mb',0):.1f} MB` |",
              f"| 🌿 Branches | `{branches.get('deleted',0)}` | — |",
              f"| 💾 Caches | `{'cleaned'}` | — |",
              f"| 📋 Issues Locked | — | — |",
              f"| **Total Space** | — | **`{total_space_mb:.1f} MB`** |",
              f"",
          ]

          if health:
              score = health.get("final_score", 0)
              grade = health.get("grade","?")
              md += [
                  f"## 📈 Repository Health",
                  f"",
                  f"| Metric | Score |",
                  f"|--------|------:|",
                  f"| 🏆 **Overall Score** | **`{score:.0f}/100 ({grade})`** |",
              ]
              for cat, val in health.get("scores",{}).items():
                  md.append(f"| {cat.replace('_',' ').title()} | `{val:.0f}` |")
              md.append("")

          if links:
              md += [
                  f"## 🔗 Link Health",
                  f"",
                  f"| Status | Count |",
                  f"|--------|------:|",
                  f"| ✅ OK | `{links.get('ok',0)}` |",
                  f"| ❌ Broken | `{links.get('broken',0)}` |",
                  f"",
              ]

          md += ["---", f"*🧹 ASH v5.0 OMEGA Monthly Cleanup Engine*"]
          report_content = "\n".join(md)

          (REPORT_DIR / "monthly-report.md").write_text(report_content)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"w") as f:
              f.write(report_content)

          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"space_mb={total_space_mb:.1f}\n")
              out.write(f"health_score={health.get('final_score',0)}\n")
              out.write(f"health_grade={health.get('grade','?')}\n")

          print(f"  ✅ Monthly report: {len(md)} lines")
          REPORT_EOF

      - name: "🔔 Discord monthly digest"
        if: env.NOTIFY_DISCORD == 'true'
        continue-on-error: true
        run: |
          SPACE="${{ steps.report.outputs.space_mb }}"
          HEALTH="${{ steps.report.outputs.health_score }}"
          GRADE="${{ steps.report.outputs.health_grade }}"
          MONTH="${CLEANUP_MONTH}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          [[ -z "${DISCORD_WEBHOOK_GENERAL:-}" ]] && exit 0

          GRADE_COLOR="$( \
            [[ "${GRADE}" == "A+"* || "${GRADE}" == "A"* ]] && echo 6416844 || \
            [[ "${GRADE}" == "B"* ]] && echo 16367145 || echo 16744272)"

          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"username\": \"ASH Cleanup Bot\",
              \"avatar_url\": \"https://raw.githubusercontent.com/${{ github.repository }}/main/assets/brand/logos/ash-logo-256.png\",
              \"embeds\": [{
                \"title\": \"🧹 Monthly Cleanup Complete — ${MONTH}\",
                \"color\": ${GRADE_COLOR},
                \"fields\": [
                  {\"name\": \"💾 Space Reclaimed\",   \"value\": \"\`${SPACE} MB\`\",  \"inline\": true},
                  {\"name\": \"📈 Health Score\",      \"value\": \"\`${HEALTH}/100\`\",\"inline\": true},
                  {\"name\": \"🏆 Grade\",             \"value\": \"\`${GRADE}\`\",     \"inline\": true},
                  {\"name\": \"🔗 Full Report\",       \"value\": \"[View Run](${RUN_URL})\", \"inline\": false}
                ],
                \"footer\": {\"text\": \"ASH Dotfiles v5.0 OMEGA · Monthly Cleanup Engine\"},
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" \
            "${DISCORD_WEBHOOK_GENERAL}" || true
        env:
          DISCORD_WEBHOOK_GENERAL: ${{ secrets.DISCORD_WEBHOOK_GENERAL }}

      - name: "📤 Upload final report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "monthly-cleanup-report-${{ needs.bootstrap.outputs.session_id }}"
          path: "${{ env.REPORT_DIR }}/"
          retention-days: 365
          compression-level: 9