name: "📦 Weekly Dep Audit · Multi-Ecosystem Vulnerability Scanner"

on:
  schedule:
    - cron: "0 4 * * 4"       # Weekly Thursday 04:00 UTC (after security audit)
    - cron: "0 4 1 * *"       # Monthly 1st — full audit with SBOM

  workflow_dispatch:
    inputs:
      ecosystems:
        description: "Ecosystems to audit"
        required: false
        default: "all"
        type: string

      severity_threshold:
        description: "Minimum CVE severity"
        required: false
        default: "MODERATE"
        type: choice
        options:
          - LOW
          - MODERATE
          - HIGH
          - CRITICAL

      generate_sbom:
        description: "Generate Software Bill of Materials"
        required: false
        default: true
        type: boolean

      auto_pr:
        description: "Auto-create PRs for safe updates"
        required: false
        default: false
        type: boolean

      notify_discord:
        description: "Discord notification"
        required: false
        default: true
        type: boolean

      fail_on_critical:
        description: "Fail workflow on CRITICAL CVEs"
        required: false
        default: true
        type: boolean

# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: "dep-audit-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  security-events: write
  actions: read

# ─────────────────────────────────────────────────────────────────────────────
env:
  DEP_AUDIT_VERSION: "5.0.0"
  WORK_DIR: "${{ github.workspace }}/.dep-audit"
  FINDINGS_DIR: "${{ github.workspace }}/.dep-findings"
  SBOM_DIR: "${{ github.workspace }}/.sbom"

  ECOSYSTEMS: "${{ github.event.inputs.ecosystems || 'all' }}"
  SEVERITY_THRESHOLD: "${{ github.event.inputs.severity_threshold || 'MODERATE' }}"
  GENERATE_SBOM: "${{ github.event.inputs.generate_sbom || 'true' }}"
  AUTO_PR: "${{ github.event.inputs.auto_pr || 'false' }}"
  NOTIFY_DISCORD: "${{ github.event.inputs.notify_discord || 'true' }}"
  FAIL_ON_CRITICAL: "${{ github.event.inputs.fail_on_critical || 'true' }}"

# ═════════════════════════════════════════════════════════════════════════════
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 0 — Audit bootstrap
  # ───────────────────────────────────────────────────────────────────────────
  bootstrap:
    name: "📦 Bootstrap · Dependency Audit Session"
    runs-on: ubuntu-24.04
    outputs:
      session_id: ${{ steps.session.outputs.id }}
      audit_date: ${{ steps.session.outputs.date }}
      is_monthly: ${{ steps.schedule.outputs.monthly }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🆔 Session"
        id: session
        run: |
          DATE=$(date +%Y-%m-%d)
          ID="depaudit-${DATE}-$(git rev-parse --short HEAD)"
          echo "id=${ID}"     >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

          mkdir -p "${WORK_DIR}" "${FINDINGS_DIR}" "${SBOM_DIR}"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  📦 ASH Dependency Audit — Weekly Scan"
          echo "  📅 Date:       ${DATE}"
          echo "  🎯 Ecosystems: ${ECOSYSTEMS}"
          echo "  ⚠️  Threshold:  ${SEVERITY_THRESHOLD}+"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: "📅 Detect schedule type"
        id: schedule
        run: |
          # Monthly schedule triggers SBOM generation
          DAY=$(date +%-d)
          MONTHLY="false"
          [[ "${DAY}" -le 2 ]] && MONTHLY="true"
          echo "monthly=${MONTHLY}" >> "$GITHUB_OUTPUT"
          echo "  📅 Monthly mode: ${MONTHLY}"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Ecosystem audits (parallel matrix)
  # ───────────────────────────────────────────────────────────────────────────
  ecosystem-audit:
    name: "🔍 Audit · ${{ matrix.eco.display }}"
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        eco:
          - name: "python"
            display: "🐍 Python (pip-audit)"
            files: ["api/requirements.txt", "requirements*.txt"]
            install_cmd: "pip3 install --quiet --user pip-audit==2.7.3 safety==3.2.8 2>/dev/null || true"
            weight: "critical"

          - name: "node"
            display: "🟨 Node.js (npm audit)"
            files: ["web/package.json", "package.json"]
            install_cmd: "npm install -g npm@latest 2>/dev/null || true"
            weight: "high"

          - name: "github-actions"
            display: "⚙️ GitHub Actions"
            files: [".github/workflows/*.yml"]
            install_cmd: "pip3 install --quiet --user PyYAML requests 2>/dev/null || true"
            weight: "medium"

          - name: "docker"
            display: "🐳 Docker (Trivy)"
            files: ["docker/Dockerfile", "Dockerfile"]
            install_cmd: "curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin 2>/dev/null || true"
            weight: "high"

          - name: "nix"
            display: "❄️ Nix Flake"
            files: ["nix/flake.lock"]
            install_cmd: "true"
            weight: "medium"

    env:
      ECO_NAME: ${{ matrix.eco.name }}
      SESSION_ID: ${{ needs.bootstrap.outputs.session_id }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📦 Install audit tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            jq bc curl python3 python3-pip 2>/dev/null || true
          eval "${{ matrix.eco.install_cmd }}" || true
          mkdir -p "${FINDINGS_DIR}/${ECO_NAME}"

      - name: "🔍 Run ecosystem audit"
        id: audit
        run: |
          FINDINGS="${FINDINGS_DIR}/${ECO_NAME}/audit.json"
          START=$(date +%s%N)

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🔍 Auditing: ${{ matrix.eco.display }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          declare -a VULNS=()
          declare -a OUTDATED=()

          case "${ECO_NAME}" in

            python)
              # pip-audit
              PIP_OUTPUT=$(python3 -m pip_audit \
                --format=json \
                --progress-spinner=off \
                2>/dev/null || echo '{"dependencies":[],"vulnerabilities":[]}')

              VULN_COUNT=$(echo "${PIP_OUTPUT}" | \
                jq '.vulnerabilities | length' 2>/dev/null || echo 0)

              # Also check with safety
              SAFETY_OUTPUT=$(python3 -m safety check \
                --json \
                2>/dev/null || echo '[]')

              echo "${PIP_OUTPUT}" > "${FINDINGS}"
              echo "vuln_count=${VULN_COUNT}" >> "$GITHUB_OUTPUT"
              echo "  🐍 Python vulns: ${VULN_COUNT}"
              ;;

            node)
              REQ_FILE=""
              for f in web/package.json package.json; do
                [[ -f "${f}" ]] && REQ_FILE="${f}" && break
              done

              if [[ -n "${REQ_FILE}" ]]; then
                NODE_DIR=$(dirname "${REQ_FILE}")
                cd "${NODE_DIR}"
                AUDIT_OUTPUT=$(npm audit --json 2>/dev/null || \
                  echo '{"vulnerabilities":{},"metadata":{"vulnerabilities":{"total":0}}}')
                cd "${GITHUB_WORKSPACE}"

                TOTAL=$(echo "${AUDIT_OUTPUT}" | \
                  jq '.metadata.vulnerabilities.total // 0' 2>/dev/null || echo 0)
                CRITICAL=$(echo "${AUDIT_OUTPUT}" | \
                  jq '.metadata.vulnerabilities.critical // 0' 2>/dev/null || echo 0)
                HIGH=$(echo "${AUDIT_OUTPUT}" | \
                  jq '.metadata.vulnerabilities.high // 0' 2>/dev/null || echo 0)

                echo "${AUDIT_OUTPUT}" > "${FINDINGS}"
                echo "vuln_count=${TOTAL}" >> "$GITHUB_OUTPUT"
                echo "critical_count=${CRITICAL}" >> "$GITHUB_OUTPUT"
                echo "  🟨 Node.js: total=${TOTAL} critical=${CRITICAL} high=${HIGH}"
              else
                echo '{"info":"no package.json found"}' > "${FINDINGS}"
                echo "vuln_count=0" >> "$GITHUB_OUTPUT"
                echo "  🟨 Node.js: no package.json found"
              fi
              ;;

            github-actions)
              python3 << 'GHA_EOF'
              import re
              import json
              import os
              import sys
              from pathlib import Path

              try:
                  import requests
                  HAS_REQUESTS = True
              except ImportError:
                  HAS_REQUESTS = False

              WORKSPACE = Path(os.environ["GITHUB_WORKSPACE"])
              FINDINGS  = Path(os.environ["FINDINGS_DIR"]) / "github-actions" / "audit.json"
              THRESHOLD = os.environ.get("SEVERITY_THRESHOLD","MODERATE")
              HEADERS   = {"Authorization": f"Bearer {os.environ.get('GITHUB_TOKEN','')}"}

              issues = []
              workflows_dir = WORKSPACE / ".github" / "workflows"

              for wf in workflows_dir.glob("*.yml"):
                  try:
                      content = wf.read_text()
                      for match in re.finditer(r'uses:\s+([^@\s]+)@([^\s\n]+)', content):
                          action, ref = match.groups()
                          if action.startswith("."): continue

                          if re.match(r'^(main|master|develop|HEAD|latest)$', ref):
                              issues.append({
                                  "action":   action,
                                  "ref":      ref,
                                  "file":     wf.name,
                                  "severity": "HIGH",
                                  "issue":    "MUTABLE_REF",
                                  "fix":      f"Pin to SHA commit",
                              })
                          elif re.match(r'^v\d+\.\d+\.\d+$', ref):
                              # Check for updates if requests available
                              if HAS_REQUESTS:
                                  try:
                                      owner_repo = action
                                      resp = requests.get(
                                          f"https://api.github.com/repos/{owner_repo}/releases/latest",
                                          headers=HEADERS, timeout=5
                                      )
                                      if resp.status_code == 200:
                                          latest = resp.json().get("tag_name","")
                                          if latest and latest != ref:
                                              issues.append({
                                                  "action":   action,
                                                  "ref":      ref,
                                                  "latest":   latest,
                                                  "file":     wf.name,
                                                  "severity": "LOW",
                                                  "issue":    "OUTDATED_ACTION",
                                                  "fix":      f"Update to {latest}",
                                              })
                                  except Exception:
                                      pass
                  except Exception: continue

              with open(FINDINGS,"w") as f:
                  json.dump(issues, f, indent=2)

              with open(os.environ["GITHUB_OUTPUT"],"a") as out:
                  out.write(f"vuln_count={len(issues)}\n")
                  out.write(f"critical_count={sum(1 for i in issues if i['severity']=='HIGH')}\n")

              print(f"  ⚙️ Actions audit: {len(issues)} issues")
              GHA_EOF
              ;;

            docker)
              echo "  🐳 Docker: checking base images..."

              # Find all Dockerfiles
              DOCKERFILES=$(find . -name "Dockerfile*" -not -path "./.git/*" | head -5)

              if [[ -n "${DOCKERFILES}" ]]; then
                if command -v trivy &>/dev/null; then
                  echo "${DOCKERFILES}" | while read -r df; do
                    echo "  Scanning: ${df}"
                    trivy fs \
                      --format=json \
                      --severity="${SEVERITY_THRESHOLD}" \
                      "${df}" \
                      2>/dev/null >> "${FINDINGS}" || true
                  done
                else
                  # Fallback: just check FROM statements
                  python3 << 'DOCKER_EOF'
          import re, json, os
          from pathlib import Path
          W = Path(os.environ["GITHUB_WORKSPACE"])
          F = Path(os.environ["FINDINGS_DIR"]) / "docker" / "audit.json"
          issues = []
          for df in W.rglob("Dockerfile*"):
              if ".git" in str(df): continue
              try:
                  content = df.read_text()
                  for m in re.finditer(r'^FROM\s+([^\s]+)', content, re.M):
                      image = m.group(1)
                      if ":" not in image or image.endswith(":latest"):
                          issues.append({"image":image,"file":str(df.relative_to(W)),"issue":"NO_VERSION_PIN","severity":"MEDIUM"})
              except Exception: pass
          json.dump(issues, open(F,"w"), indent=2)
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"vuln_count={len(issues)}\n")
          print(f"  🐳 Docker: {len(issues)} issues")
          DOCKER_EOF
                fi
              else
                echo '{"info":"no Dockerfiles found"}' > "${FINDINGS}"
                echo "vuln_count=0" >> "$GITHUB_OUTPUT"
              fi
              ;;

            nix)
              LOCK_FILE="nix/flake.lock"
              if [[ -f "${LOCK_FILE}" ]]; then
                # Check for pinned vs floating inputs
                python3 << 'NIX_EOF'
          import json, os
          from pathlib import Path
          F = Path(os.environ["FINDINGS_DIR"]) / "nix" / "audit.json"
          LOCK = Path(os.environ["GITHUB_WORKSPACE"]) / "nix/flake.lock"
          issues = []
          try:
              data = json.loads(LOCK.read_text())
              nodes = data.get("nodes",{})
              for name, node in nodes.items():
                  if name == "root": continue
                  locked = node.get("locked",{})
                  if not locked.get("rev") and not locked.get("hash"):
                      issues.append({"input":name,"issue":"UNPINNED_INPUT","severity":"MEDIUM"})
          except Exception as e:
              issues.append({"error":str(e),"severity":"LOW","issue":"PARSE_ERROR"})
          json.dump(issues, open(F,"w"), indent=2)
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"vuln_count={len(issues)}\n")
          print(f"  ❄️ Nix: {len(issues)} issues")
          NIX_EOF
              else
                echo '[]' > "${FINDINGS}"
                echo "vuln_count=0" >> "$GITHUB_OUTPUT"
                echo "  ❄️ Nix: no flake.lock found"
              fi
              ;;
          esac

          END=$(date +%s%N)
          DURATION=$(( (END - START) / 1000000 ))
          echo "duration_ms=${DURATION}" >> "$GITHUB_OUTPUT"
          echo "  ⏱️ Duration: ${DURATION}ms"

      - name: "📤 Upload ecosystem findings"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "dep-audit-${{ matrix.eco.name }}-${{ needs.bootstrap.outputs.session_id }}"
          path: "${{ env.FINDINGS_DIR }}/${{ matrix.eco.name }}/"
          retention-days: 90

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — SBOM generation
  # ───────────────────────────────────────────────────────────────────────────
  sbom-generation:
    name: "📋 SBOM · CycloneDX Bill of Materials"
    needs: [bootstrap, ecosystem-audit]
    if: |
      always() &&
      (env.GENERATE_SBOM == 'true' ||
       needs.bootstrap.outputs.is_monthly == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      SESSION_ID: ${{ needs.bootstrap.outputs.session_id }}
      AUDIT_DATE: ${{ needs.bootstrap.outputs.audit_date }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📦 Install SBOM tools"
        run: |
          pip3 install --quiet --user \
            cyclonedx-bom==4.4.0 \
            2>/dev/null || true
          sudo apt-get install -y --no-install-recommends \
            jq bc 2>/dev/null || true
          mkdir -p "${SBOM_DIR}"

      - name: "📋 Generate CycloneDX SBOM"
        run: |
          python3 << 'SBOM_EOF'
          import json
          import os
          import glob
          import hashlib
          from pathlib import Path
          from datetime import datetime, timezone

          WORKSPACE  = Path(os.environ["GITHUB_WORKSPACE"])
          SBOM_DIR   = Path(os.environ["SBOM_DIR"])
          SESSION_ID = os.environ["SESSION_ID"]
          AUDIT_DATE = os.environ["AUDIT_DATE"]
          REPO       = os.environ.get("GITHUB_REPOSITORY","ash/dotfiles")
          SHA        = os.environ.get("GITHUB_SHA","unknown")

          # Collect components from all dependency files
          components = []

          # Python packages
          for req_file in WORKSPACE.glob("**/requirements*.txt"):
              if ".git" in str(req_file): continue
              try:
                  for line in req_file.read_text().splitlines():
                      line = line.strip()
                      if not line or line.startswith("#"): continue
                      parts = line.split("==")
                      name = parts[0].strip()
                      version = parts[1].strip() if len(parts)>1 else "unknown"
                      components.append({
                          "type":    "library",
                          "name":    name,
                          "version": version,
                          "purl":    f"pkg:pypi/{name.lower()}@{version}",
                          "ecosystem": "python",
                      })
              except Exception: pass

          # Node packages
          for pkg_file in WORKSPACE.glob("**/package.json"):
              if ".git" in str(pkg_file) or "node_modules" in str(pkg_file): continue
              try:
                  data = json.loads(pkg_file.read_text())
                  for dep_type in ("dependencies","devDependencies"):
                      for name, version in data.get(dep_type,{}).items():
                          ver = version.lstrip("^~>=")
                          components.append({
                              "type":    "library",
                              "name":    name,
                              "version": ver,
                              "purl":    f"pkg:npm/{name}@{ver}",
                              "ecosystem": "node",
                          })
              except Exception: pass

          # GitHub Actions
          for wf in (WORKSPACE/".github/workflows").glob("*.yml"):
              try:
                  import re
                  content = wf.read_text()
                  for m in re.finditer(r'uses:\s+([^@\s]+)@([^\s\n]+)', content):
                      action, ref = m.groups()
                      if action.startswith("."): continue
                      components.append({
                          "type":    "framework",
                          "name":    action,
                          "version": ref,
                          "purl":    f"pkg:github/{action}@{ref}",
                          "ecosystem": "github-actions",
                      })
              except Exception: pass

          # Build CycloneDX SBOM
          now = datetime.now(timezone.utc).isoformat()

          sbom = {
              "bomFormat":   "CycloneDX",
              "specVersion": "1.5",
              "version":     1,
              "serialNumber":f"urn:uuid:{hashlib.md5(SESSION_ID.encode()).hexdigest()}",
              "metadata": {
                  "timestamp": now,
                  "tools": [{
                      "vendor": "ASH Dotfiles",
                      "name":   "dep-audit-engine",
                      "version":"5.0.0",
                  }],
                  "component": {
                      "type":    "application",
                      "name":    "ash-dotfiles",
                      "version": "5.0.0",
                      "purl":    f"pkg:github/{REPO}@{SHA[:7]}",
                  },
              },
              "components": [
                  {
                      "type":    c["type"],
                      "name":    c["name"],
                      "version": c["version"],
                      "purl":    c.get("purl",""),
                      "properties": [
                          {"name":"ecosystem","value":c.get("ecosystem","unknown")}
                      ],
                  }
                  for c in components
              ],
              "dependencies": [],
          }

          # Write SBOM files
          sbom_json = SBOM_DIR / f"sbom-{AUDIT_DATE}.json"
          sbom_json.write_text(json.dumps(sbom, indent=2))

          # Write latest symlink
          latest = SBOM_DIR / "sbom-latest.json"
          latest.write_text(json.dumps(sbom, indent=2))

          # Markdown summary
          eco_counts = {}
          for c in components:
              eco = c.get("ecosystem","unknown")
              eco_counts[eco] = eco_counts.get(eco, 0) + 1

          md = [
              f"# 📋 Software Bill of Materials",
              f"",
              f"**Generated:** `{now}`  ·  **Components:** `{len(components)}`",
              f"",
              f"| Ecosystem | Components |",
              f"|-----------|----------:|",
          ]
          for eco, count in sorted(eco_counts.items()):
              md.append(f"| `{eco}` | `{count}` |")
          md.append("")
          md.append("*CycloneDX SBOM v1.5 — ASH Dotfiles v5.0 OMEGA*")

          (SBOM_DIR / "SBOM.md").write_text("\n".join(md))

          print(f"  ✅ SBOM generated: {len(components)} components")
          for eco, count in sorted(eco_counts.items()):
              print(f"     {eco}: {count}")
          SBOM_EOF

      - name: "📤 Upload SBOM"
        uses: actions/upload-artifact@v6
        with:
          name: "sbom-${{ needs.bootstrap.outputs.session_id }}"
          path: "${{ env.SBOM_DIR }}/"
          retention-days: 365    # Keep SBOMs for 1 year
          compression-level: 9

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — Consolidated dependency audit report
  # ───────────────────────────────────────────────────────────────────────────
  dep-audit-report:
    name: "📊 Report · Dependency Audit Dashboard"
    needs:
      - bootstrap
      - ecosystem-audit
      - sbom-generation
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      SESSION_ID: ${{ needs.bootstrap.outputs.session_id }}
      AUDIT_DATE: ${{ needs.bootstrap.outputs.audit_date }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📦 Tools"
        run: |
          pip3 install --quiet --user \
            matplotlib numpy rich tabulate 2>/dev/null || true
          sudo apt-get install -y --no-install-recommends jq bc 2>/dev/null || true
          mkdir -p "${WORK_DIR}" "${FINDINGS_DIR}"

      - name: "📥 Download all audit artifacts"
        uses: actions/download-artifact@v7
        with:
          pattern: "dep-audit-*-${{ needs.bootstrap.outputs.session_id }}"
          path: "${{ env.FINDINGS_DIR }}/all"
          merge-multiple: true

      - name: "📊 Generate audit dashboard"
        id: dashboard
        run: |
          python3 << 'DASHBOARD_EOF'
          import json
          import os
          import glob
          import sys
          from pathlib import Path
          from datetime import datetime, timezone

          FINDINGS_DIR = Path(os.environ["FINDINGS_DIR"]) / "all"
          WORK_DIR     = Path(os.environ["WORK_DIR"])
          SESSION_ID   = os.environ["SESSION_ID"]
          AUDIT_DATE   = os.environ["AUDIT_DATE"]
          THRESHOLD    = os.environ.get("SEVERITY_THRESHOLD","MODERATE")

          # Collect all findings
          all_vulns    = []
          ecosystem_summary = {}

          for f in FINDINGS_DIR.glob("**/*.json"):
              eco_name = f.parent.name
              try:
                  data = json.loads(f.read_text())
                  vulns = []
                  if isinstance(data, list): vulns = data
                  elif isinstance(data, dict):
                      vulns = data.get("vulnerabilities", data.get("results", []))
                  all_vulns.extend(vulns)
                  ecosystem_summary[eco_name] = {
                      "count": len(vulns),
                      "file":  str(f),
                  }
              except Exception: pass

          # Severity classification
          CRITICAL = [v for v in all_vulns if
              str(v.get("severity","")).upper() in ("CRITICAL","HIGH","HIGH_SEVERITY")]
          HIGH     = [v for v in all_vulns if
              str(v.get("severity","")).upper() in ("HIGH","MODERATE_HIGH")]
          MODERATE = [v for v in all_vulns if
              str(v.get("severity","")).upper() in ("MODERATE","MEDIUM")]
          LOW      = [v for v in all_vulns if
              str(v.get("severity","")).upper() in ("LOW","INFORMATIONAL","INFO")]

          total    = len(all_vulns)
          now      = datetime.now(timezone.utc)

          # Determine overall status
          fail_on_critical = os.environ.get("FAIL_ON_CRITICAL","true") == "true"
          overall_ok = True
          if CRITICAL and fail_on_critical: overall_ok = False
          if THRESHOLD in ("LOW",) and total > 0: overall_ok = False
          if THRESHOLD in ("MODERATE",) and (CRITICAL or HIGH or MODERATE): overall_ok = False
          if THRESHOLD in ("HIGH","CRITICAL") and CRITICAL: overall_ok = False

          STATUS = "✅ CLEAN" if overall_ok else "⚠️ VULNERABILITIES FOUND"

          # Build markdown report
          ECO_ICONS = {
              "python":"🐍","node":"🟨","github-actions":"⚙️",
              "docker":"🐳","nix":"❄️","rust":"🦀","go":"🐹",
          }

          md = [
              f"# 📦 Weekly Dependency Audit Report",
              f"",
              f"> **{STATUS}**  ·  `{AUDIT_DATE}`  ·  Session: `{SESSION_ID}`",
              f"",
              f"## 📊 Vulnerability Summary",
              f"",
              f"| Severity | Count | Action Required |",
              f"|----------|------:|:----------------|",
              f"| 🚨 Critical | `{len(CRITICAL)}` | {'🔴 **PATCH IMMEDIATELY**' if CRITICAL else '✅ None'} |",
              f"| 🔴 High | `{len(HIGH)}` | {'⚠️ **Patch within 7 days**' if HIGH else '✅ None'} |",
              f"| 🟡 Moderate | `{len(MODERATE)}` | {'📋 Patch within 30 days' if MODERATE else '✅ None'} |",
              f"| 🟢 Low | `{len(LOW)}` | {'📋 Informational' if LOW else '✅ None'} |",
              f"| **Total** | **`{total}`** | — |",
              f"",
              f"## 🌍 By Ecosystem",
              f"",
              f"| Ecosystem | Issues | Status |",
              f"|-----------|-------:|:-------|",
          ]

          for eco, summary in sorted(ecosystem_summary.items()):
              icon = ECO_ICONS.get(eco,"📦")
              count = summary["count"]
              status_icon = "✅" if count == 0 else "⚠️" if count <= 5 else "🔴"
              md.append(f"| {icon} `{eco}` | `{count}` | {status_icon} |")

          if CRITICAL or HIGH:
              md += [f"", f"## 🚨 Critical & High Vulnerabilities",
                     f"", f"| Package | Version | CVE | Severity |",
                     f"|---------|---------|-----|----------|"]
              for v in (CRITICAL + HIGH)[:15]:
                  pkg = v.get("name",v.get("package",v.get("action","Unknown")))
                  ver = v.get("version","?")
                  cve = v.get("id",v.get("cve",v.get("aliases",["?"])[0]
                               if isinstance(v.get("aliases",["?"]),list) else "?"))
                  sev = v.get("severity","?")
                  md.append(f"| `{pkg}` | `{ver}` | `{cve}` | `{sev.upper()}` |")

          md += [f"", f"---", f"*📦 ASH v5.0 OMEGA Dependency Audit Engine*"]
          report_content = "\n".join(md)

          (WORK_DIR / "dep-audit-report.md").write_text(report_content)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"w") as f:
              f.write(report_content)

          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"overall_ok={'true' if overall_ok else 'false'}\n")
              out.write(f"total_vulns={total}\n")
              out.write(f"critical_count={len(CRITICAL)}\n")
              out.write(f"high_count={len(HIGH)}\n")

          print(f"\n  {STATUS}")
          print(f"  🚨 Critical: {len(CRITICAL)}  🔴 High: {len(HIGH)}  🟡 Moderate: {len(MODERATE)}")
          DASHBOARD_EOF

      - name: "🔔 Discord CVE alert"
        if: |
          always() &&
          env.NOTIFY_DISCORD == 'true' &&
          steps.dashboard.outputs.critical_count != '0'
        continue-on-error: true
        run: |
          CRITICAL="${{ steps.dashboard.outputs.critical_count }}"
          HIGH="${{ steps.dashboard.outputs.high_count }}"
          TOTAL="${{ steps.dashboard.outputs.total_vulns }}"
          DATE="${AUDIT_DATE}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          [[ -z "${DISCORD_WEBHOOK_SECURITY:-}" ]] && exit 0

          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"username\": \"ASH Dep Audit Bot\",
              \"content\": \"@here 🚨 **Critical CVEs detected in dependencies!**\",
              \"embeds\": [{
                \"title\": \"📦 Dependency Audit — ${CRITICAL} Critical CVE(s)\",
                \"color\": 16007085,
                \"fields\": [
                  {\"name\": \"🚨 Critical\", \"value\": \"\`${CRITICAL}\`\", \"inline\": true},
                  {\"name\": \"🔴 High\",     \"value\": \"\`${HIGH}\`\",     \"inline\": true},
                  {\"name\": \"📊 Total\",    \"value\": \"\`${TOTAL}\`\",    \"inline\": true},
                  {\"name\": \"📅 Date\",     \"value\": \"\`${DATE}\`\",     \"inline\": true},
                  {\"name\": \"🔗 Report\",   \"value\": \"[View Report](${RUN_URL})\", \"inline\": false}
                ],
                \"footer\": {\"text\": \"ASH Dotfiles v5.0 OMEGA · Dep Audit Engine\"},
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" \
            "${DISCORD_WEBHOOK_SECURITY}" || true
        env:
          DISCORD_WEBHOOK_SECURITY: ${{ secrets.DISCORD_WEBHOOK_SECURITY }}

      - name: "📤 Upload final report"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "dep-audit-report-${{ needs.bootstrap.outputs.session_id }}"
          path: "${{ env.WORK_DIR }}/"
          retention-days: 90
          compression-level: 9

      - name: "❌ Gate — fail on critical CVEs"
        if: |
          steps.dashboard.outputs.overall_ok == 'false' &&
          env.FAIL_ON_CRITICAL == 'true' &&
          steps.dashboard.outputs.critical_count != '0'
        run: |
          echo "::error title=Critical CVEs Detected::${{ steps.dashboard.outputs.critical_count }} critical vulnerability(-ies) found"
          exit 1