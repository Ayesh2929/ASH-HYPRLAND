name: "🔑 Secret Rotation Check"
on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-secrets:
    name: "🔑 Verify Secrets"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "🔑 Check required secrets"
        env:
          HAS_DISCORD: ${{ secrets.DISCORD_WEBHOOK != '' }}
          HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CLOUDFLARE_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_FLY: ${{ secrets.FLY_API_TOKEN != '' }}
          HAS_CODECOV: ${{ secrets.CODECOV_TOKEN != '' }}
          HAS_AUR: ${{ secrets.AUR_SSH_KEY != '' }}
          HAS_DOCKER_HUB: ${{ secrets.DOCKER_HUB_TOKEN != '' }}
        run: |
          set -euo pipefail
          MISSING=0
          echo "## 🔑 Secret Health Check" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|--------|" >> "$GITHUB_STEP_SUMMARY"

          check_secret() {
            local name="$1" val="$2"
            if [[ "$val" == "true" ]]; then
              echo "| $name | ✅ Set |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $name | ❌ Missing |" >> "$GITHUB_STEP_SUMMARY"
              MISSING=$((MISSING + 1))
            fi
          }

          check_secret "DISCORD_WEBHOOK" "$HAS_DISCORD"
          check_secret "CLOUDFLARE_API_TOKEN" "$HAS_CLOUDFLARE_TOKEN"
          check_secret "CLOUDFLARE_ACCOUNT_ID" "$HAS_CLOUDFLARE_ACCT"
          check_secret "FLY_API_TOKEN" "$HAS_FLY"
          check_secret "CODECOV_TOKEN" "$HAS_CODECOV"
          check_secret "AUR_SSH_KEY" "$HAS_AUR"
          check_secret "DOCKER_HUB_TOKEN" "$HAS_DOCKER_HUB"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Total missing: $MISSING**" >> "$GITHUB_STEP_SUMMARY"

      - name: "💬 Alert on missing secrets"
        if: env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail
          curl -sSf -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"🔑 Monthly Secret Health Check\",
              \"color\": 5814783,
              \"description\": \"Automated secret rotation reminder. Check the workflow run for details.\",
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" "$DISCORD_WEBHOOK" || true
