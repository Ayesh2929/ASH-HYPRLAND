name: "📊 Benchmark"
on:
  workflow_call:
    inputs:
      run_benchmarks:
        type: string
        required: true

jobs:
  benchmark:
    name: "📊 Performance Benchmarks"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: inputs.run_benchmarks == 'true' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: "⚙️ Install benchmark tools"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq bc webp imagemagick
          HF_VER="1.18.0"
          curl --retry 3 -fsSL "https://github.com/sharkdp/hyperfine/releases/download/v${HF_VER}/hyperfine_${HF_VER}_amd64.deb" -o /tmp/hf.deb
          sudo dpkg -i /tmp/hf.deb

      - name: "🏎️ Benchmark: CLI Startup"
        id: bench-startup
        run: |
          set -euo pipefail
          # Create a minimal test script
          echo '#!/bin/bash' > /tmp/test-startup.sh
          echo 'source scripts/core/install.sh --help 2>/dev/null || true' >> /tmp/test-startup.sh
          chmod +x /tmp/test-startup.sh
          hyperfine --warmup 3 --min-runs 10 --export-json /tmp/bench-startup.json \
            'bash /tmp/test-startup.sh' \
            --command-name 'CLI startup'
          MEAN_MS=$(jq '.results[0].mean * 1000 | floor' /tmp/bench-startup.json)
          echo "mean_ms=$MEAN_MS" >> "$GITHUB_OUTPUT"
          echo "### 🏎️ CLI Startup: ${MEAN_MS}ms" >> "$GITHUB_STEP_SUMMARY"

      - name: "🖼️ Benchmark: WebP Encoding"
        id: bench-webp
        run: |
          set -euo pipefail
          # Generate a test image
          convert -size 2560x1440 xc:"#1a1b26" /tmp/test-input.png
          hyperfine --warmup 2 --min-runs 5 --export-json /tmp/bench-webp.json \
            'cwebp -q 92 -m 6 /tmp/test-input.png -o /tmp/test-output.webp' \
            --command-name 'WebP encode 2560x1440'
          MEAN_MS=$(jq '.results[0].mean * 1000 | floor' /tmp/bench-webp.json)
          SIZE_KB=$(du -k /tmp/test-output.webp | cut -f1)
          echo "mean_ms=$MEAN_MS" >> "$GITHUB_OUTPUT"
          echo "size_kb=$SIZE_KB" >> "$GITHUB_OUTPUT"
          echo "### 🖼️ WebP Encode: ${MEAN_MS}ms (${SIZE_KB}KB)" >> "$GITHUB_STEP_SUMMARY"

      - name: "📄 Benchmark: JSON Theme Processing"
        id: bench-json
        run: |
          set -euo pipefail
          THEME_FILES=$(find themes/presets -name 'colors.json' 2>/dev/null | head -20 || echo '')
          if [[ -n "$THEME_FILES" ]]; then
            hyperfine --warmup 3 --min-runs 10 --export-json /tmp/bench-json.json \
              "jq -s '.' $THEME_FILES > /dev/null" \
              --command-name 'JSON theme parse'
            MEAN_MS=$(jq '.results[0].mean * 1000 | floor' /tmp/bench-json.json)
          else
            echo '{"results":[{"mean":0.001,"command":"JSON theme parse"}]}' > /tmp/bench-json.json
            MEAN_MS=1
          fi
          echo "mean_ms=$MEAN_MS" >> "$GITHUB_OUTPUT"
          echo "### 📄 JSON Parse: ${MEAN_MS}ms" >> "$GITHUB_STEP_SUMMARY"

      - name: "📊 Build combined results"
        run: |
          set -euo pipefail
          # Merge results into benchmark-action format
          python3 -c "
          import json, sys
          results = []
          for name, path in [('CLI Startup (ms)', '/tmp/bench-startup.json'),
                              ('WebP Encode (ms)', '/tmp/bench-webp.json'),
                              ('JSON Parse (ms)', '/tmp/bench-json.json')]:
              try:
                  data = json.load(open(path))
                  mean = data['results'][0]['mean'] * 1000
                  results.append({'name': name, 'unit': 'ms', 'value': round(mean, 2)})
              except Exception as e:
                  print(f'Warning: {name}: {e}', file=sys.stderr)
          json.dump(results, open('/tmp/bench-combined.json', 'w'), indent=2)
          print(f'Combined {len(results)} benchmarks')
          "
          # Summary table
          echo '## 📊 Benchmark Results' >> "$GITHUB_STEP_SUMMARY"
          echo '| Benchmark | Time |' >> "$GITHUB_STEP_SUMMARY"
          echo '|-----------|------|' >> "$GITHUB_STEP_SUMMARY"
          python3 -c "
          import json
          for r in json.load(open('/tmp/bench-combined.json')):
              print(f'| {r[\"name\"]} | {r[\"value\"]:.1f}{r[\"unit\"]} |')
          " >> "$GITHUB_STEP_SUMMARY"

      - name: "📊 Baseline comparison (main only)"
        if: github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: /tmp/bench-combined.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "130%"
          comment-on-alert: true
          fail-on-alert: false
          benchmark-data-dir-path: dev/bench

      - name: "📊 Comment on PR"
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: /tmp/bench-combined.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-always: true
          auto-push: false
          alert-threshold: "130%"

      - name: "📤 Upload artifacts"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "bench-results-${{ github.run_id }}"
          path: /tmp/bench-*.json
          retention-days: 30
