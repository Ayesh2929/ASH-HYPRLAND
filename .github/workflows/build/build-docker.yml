# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🐋 ASH DOTFILES v5.0 OMEGA — DOCKER BUILD WORKFLOW                               ║
# ║                                                                                          ║
# ║      Ultra-Premium Multi-Platform Container Build & Publish Pipeline                    ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      Multi-arch Build      •  GHCR + Docker Hub   •  Layer Caching                   ║
# ║      BuildKit + Buildx     •  SBOM Attestation    •  Provenance                     ║
# ║      Vulnerability Scan    •  Image Signing        •  Digest Pinning                ║
# ║      Distroless Options    •  Size Optimization    •  Health Checks                 ║
# ║      Smoke Test Suite      •  Blue-Green Ready     •  Release Tagging              ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🐋 Docker — Multi-Platform Build & Publish"

# ══════════════════════════════════════════════════════════════════════════════
# TRIGGER CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
on:
  push:
    branches:
      - main
      - develop
      - "release/**"
    paths:
      - "docker/**"
      - "Dockerfile*"
      - ".dockerignore"
      - "api/**"
      - "ash-cli/**"
      - ".github/workflows/build/build-docker.yml"
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "docker/**"
      - "Dockerfile*"
      - "api/**"
      - ".github/workflows/build/build-docker.yml"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - api-server
          - cli-tools
          - test-environment
          - full-desktop
      platforms:
        description: "Target platforms"
        required: false
        default: "linux/amd64,linux/arm64"
        type: choice
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64
          - linux/amd64,linux/arm64,linux/arm/v7
      push_images:
        description: "Push to registry"
        required: false
        default: false
        type: boolean
      no_cache:
        description: "Disable build cache"
        required: false
        default: false
        type: boolean
      scan_images:
        description: "Run security scan after build"
        required: false
        default: true
        type: boolean

  schedule:
    # Rebuild nightly for base image updates
    - cron: "0 2 * * *"

# ══════════════════════════════════════════════════════════════════════════════
# PERMISSIONS
# ══════════════════════════════════════════════════════════════════════════════
permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write

# ══════════════════════════════════════════════════════════════════════════════
# CONCURRENCY
# ══════════════════════════════════════════════════════════════════════════════
concurrency:
  group: "docker-build-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════════════════
# GLOBAL ENV
# ══════════════════════════════════════════════════════════════════════════════
env:
  REGISTRY_GHCR: "ghcr.io"
  REGISTRY_DOCKERHUB: "docker.io"
  IMAGE_NAME: "ash-dotfiles/ash-dotfiles"
  GHCR_IMAGE: "ghcr.io/ash-dotfiles/ash-dotfiles"
  PLATFORMS: "${{ inputs.platforms || 'linux/amd64,linux/arm64' }}"
  BUILDKIT_PROGRESS: "plain"
  DOCKER_BUILDKIT: "1"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: PREPARE — Extract metadata and generate Dockerfiles
  # ────────────────────────────────────────────────────────────────────────────
  prepare:
    name: "📋 Prepare Build Metadata"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      version:        ${{ steps.meta.outputs.version }}
      tags:           ${{ steps.meta.outputs.tags }}
      labels:         ${{ steps.meta.outputs.labels }}
      json:           ${{ steps.meta.outputs.json }}
      image-name:     ${{ steps.meta.outputs.image_name }}
      short-sha:      ${{ steps.meta.outputs.short_sha }}
      build-date:     ${{ steps.meta.outputs.build_date }}
      should-push:    ${{ steps.meta.outputs.should_push }}
      dockerfile-matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "📋 Generate Build Metadata"
        id: meta
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🐋 Docker Build Metadata Generator                         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          SHORT_SHA="${GITHUB_SHA:0:8}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REF="${{ github.ref }}"
          EVENT="${{ github.event_name }}"

          # Determine version
          VERSION="dev-${SHORT_SHA}"
          if [[ "${REF}" =~ ^refs/tags/v ]]; then
            VERSION="${REF#refs/tags/v}"
          elif [[ "${REF}" == "refs/heads/main" ]]; then
            VERSION="latest"
          elif [[ "${REF}" =~ ^refs/heads/release/ ]]; then
            VERSION="rc-${REF#refs/heads/release/}-${SHORT_SHA}"
          fi

          # Determine if should push
          SHOULD_PUSH="false"
          if [[ "${EVENT}" == "push" && "${REF}" == "refs/heads/main" ]]; then
            SHOULD_PUSH="true"
          elif [[ "${REF}" =~ ^refs/tags/v ]]; then
            SHOULD_PUSH="true"
          elif [[ "${{ inputs.push_images }}" == "true" ]]; then
            SHOULD_PUSH="true"
          fi

          # Generate tags
          TAGS=""
          if [[ "${VERSION}" == "latest" ]]; then
            TAGS="${{ env.GHCR_IMAGE }}:latest"
            TAGS="${TAGS},${{ env.GHCR_IMAGE }}:${SHORT_SHA}"
          elif [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            MAJOR="${VERSION%%.*}"
            MINOR="${VERSION%.*}"; MINOR="${MINOR#*.}"
            TAGS="${{ env.GHCR_IMAGE }}:${VERSION}"
            TAGS="${TAGS},${{ env.GHCR_IMAGE }}:${MAJOR}.${MINOR}"
            TAGS="${TAGS},${{ env.GHCR_IMAGE }}:${MAJOR}"
            TAGS="${TAGS},${{ env.GHCR_IMAGE }}:latest"
          else
            TAGS="${{ env.GHCR_IMAGE }}:${VERSION}"
          fi

          echo ""
          echo "  📊 Build Configuration:"
          echo "  ├── Version:     ${VERSION}"
          echo "  ├── Short SHA:   ${SHORT_SHA}"
          echo "  ├── Build date:  ${BUILD_DATE}"
          echo "  ├── Should push: ${SHOULD_PUSH}"
          echo "  ├── Tags:        ${TAGS}"
          echo "  └── Platforms:   ${{ env.PLATFORMS }}"

          {
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "build_date=${BUILD_DATE}"
            echo "should_push=${SHOULD_PUSH}"
            echo "tags=${TAGS}"
            echo "image_name=${{ env.GHCR_IMAGE }}"
            echo "labels=org.opencontainers.image.title=ASH Dotfiles\norg.opencontainers.image.version=${VERSION}"
          } >> "${GITHUB_OUTPUT}"

      - name: "🏗️ Generate Dockerfiles"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🏗️  Dockerfile Generation Engine                            ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          mkdir -p docker

          # ── API Server Dockerfile ─────────────────────────────────────────
          if [[ ! -f "docker/Dockerfile.api" ]]; then
            cat > docker/Dockerfile.api << 'APIDOCKERFILE'
          # ╔══════════════════════════════════════════════════════════════════╗
          # ║  ASH Dotfiles v5.0 OMEGA — API Server Container                ║
          # ║  Multi-stage build for minimal production image                 ║
          # ╚══════════════════════════════════════════════════════════════════╝

          # ── Stage 1: Dependencies ─────────────────────────────────────────
          FROM python:3.12-slim AS dependencies
          LABEL stage=dependencies

          WORKDIR /tmp/build

          # Install build deps
          RUN apt-get update -qq && \
              apt-get install -y --no-install-recommends \
                gcc libpq-dev curl && \
              rm -rf /var/lib/apt/lists/*

          # Copy and install requirements
          COPY api/requirements.txt ./
          RUN pip install --no-cache-dir --prefix=/install -r requirements.txt

          # ── Stage 2: Production ───────────────────────────────────────────
          FROM python:3.12-slim AS production
          LABEL \
            org.opencontainers.image.title="ASH Dotfiles API" \
            org.opencontainers.image.description="ASH Dotfiles REST API Server" \
            org.opencontainers.image.source="https://github.com/ash-dotfiles/ash-dotfiles" \
            org.opencontainers.image.licenses="MIT"

          # Security: Create non-root user
          RUN groupadd --gid 1000 ash && \
              useradd --uid 1000 --gid 1000 \
                --shell /bin/bash \
                --home-dir /app \
                --no-create-home ash

          WORKDIR /app

          # Copy installed packages from dependencies stage
          COPY --from=dependencies /install /usr/local

          # Copy application code
          COPY --chown=ash:ash api/ ./

          # Security hardening
          RUN chmod -R 550 /app && \
              chmod 700 /app

          # Health check
          HEALTHCHECK --interval=30s --timeout=10s \
              --start-period=10s --retries=3 \
              CMD python3 -c "import httpx; r=httpx.get('http://localhost:7070/api/v1/health', timeout=5); r.raise_for_status()"

          # Security: Switch to non-root
          USER ash

          # Port
          EXPOSE 7070

          # Metadata
          ARG BUILD_DATE
          ARG VERSION
          ARG REVISION
          LABEL \
            org.opencontainers.image.created="${BUILD_DATE}" \
            org.opencontainers.image.version="${VERSION}" \
            org.opencontainers.image.revision="${REVISION}"

          # Entrypoint
          CMD ["uvicorn", "server:app", \
               "--host", "0.0.0.0", \
               "--port", "7070", \
               "--workers", "2", \
               "--log-level", "info"]
          APIDOCKERFILE
            echo "  ✅ Generated: docker/Dockerfile.api"
          fi

          # ── CLI Tools Dockerfile ──────────────────────────────────────────
          if [[ ! -f "docker/Dockerfile.cli" ]]; then
            cat > docker/Dockerfile.cli << 'CLIDOCKERFILE'
          # ╔══════════════════════════════════════════════════════════════════╗
          # ║  ASH Dotfiles v5.0 OMEGA — CLI Tools Container                 ║
          # ╚══════════════════════════════════════════════════════════════════╝

          FROM archlinux:latest AS ash-cli

          LABEL \
            org.opencontainers.image.title="ASH Dotfiles CLI" \
            org.opencontainers.image.description="ASH Dotfiles command-line tools" \
            org.opencontainers.image.source="https://github.com/ash-dotfiles/ash-dotfiles"

          # Configure pacman
          RUN sed -i 's/^#ParallelDownloads/ParallelDownloads/' /etc/pacman.conf && \
              pacman -Syu --noconfirm --noprogressbar && \
              pacman -S --noconfirm --noprogressbar --needed \
                bash fish git jq bc python python-pip \
                imagemagick socat inotify-tools \
                fd ripgrep fzf zoxide && \
              pacman -Scc --noconfirm

          # Install ASH CLI
          WORKDIR /opt/ash-dotfiles

          COPY ash-cli/ ./ash-cli/
          COPY themes/presets/ ./themes/presets/
          COPY config/ ./config/

          RUN chmod +x ash-cli/ash && \
              ln -sf /opt/ash-dotfiles/ash-cli/ash /usr/local/bin/ash

          # Create ash user
          RUN useradd -m -s /bin/bash ash-user

          ENV ASH_DATA_DIR=/opt/ash-dotfiles
          ENV PATH="/opt/ash-dotfiles/ash-cli:${PATH}"

          HEALTHCHECK --interval=60s --timeout=5s \
              CMD ash --version || exit 1

          USER ash-user
          WORKDIR /home/ash-user

          ARG BUILD_DATE VERSION REVISION
          LABEL \
            org.opencontainers.image.created="${BUILD_DATE}" \
            org.opencontainers.image.version="${VERSION}" \
            org.opencontainers.image.revision="${REVISION}"

          CMD ["bash"]
          CLIDOCKERFILE
            echo "  ✅ Generated: docker/Dockerfile.cli"
          fi

          # ── Test Environment Dockerfile ───────────────────────────────────
          if [[ ! -f "docker/Dockerfile.test" ]]; then
            cat > docker/Dockerfile.test << 'TESTDOCKERFILE'
          # ╔══════════════════════════════════════════════════════════════════╗
          # ║  ASH Dotfiles v5.0 OMEGA — Test Environment Container          ║
          # ╚══════════════════════════════════════════════════════════════════╝

          FROM archlinux:latest AS test-env

          LABEL \
            org.opencontainers.image.title="ASH Test Environment" \
            org.opencontainers.image.description="ASH Dotfiles CI/CD test environment"

          RUN pacman -Syu --noconfirm --noprogressbar && \
              pacman -S --noconfirm --noprogressbar --needed \
                bash fish git jq bc python python-pip \
                imagemagick socat inotify-tools \
                fd ripgrep shellcheck luacheck \
                nodejs npm && \
              pacman -Scc --noconfirm

          # Install bats for testing
          RUN git clone --depth=1 --branch=v1.11.0 \
                https://github.com/bats-core/bats-core.git /tmp/bats && \
              /tmp/bats/install.sh /usr/local && \
              rm -rf /tmp/bats

          WORKDIR /workspace
          COPY . .

          ENV ASH_TEST_MODE=1
          ENV ASH_NO_COLOR=1
          ENV BATS_LIB_PATH=/usr/local/lib

          CMD ["bash", "tests/run-all-tests.sh"]
          TESTDOCKERFILE
            echo "  ✅ Generated: docker/Dockerfile.test"
          fi

          # ── .dockerignore ─────────────────────────────────────────────────
          if [[ ! -f ".dockerignore" ]]; then
            cat > .dockerignore << 'DOCKERIGNORE'
          # ASH Dotfiles — .dockerignore
          .git
          .github
          node_modules
          .pnpm-store
          target
          dist
          build
          __pycache__
          *.pyc
          .venv
          venv
          .env
          .env.*
          secrets/
          *.sarif
          data/
          backups/
          data/analytics/
          data/cache/
          tests/fixtures/
          assets/wallpapers/
          assets/videos/
          docs/
          DOCKERIGNORE
            echo "  ✅ Generated: .dockerignore"
          fi

      - name: "🏗️ Build Dockerfile Matrix"
        id: matrix
        shell: bash
        run: |
          target="${{ inputs.target || 'all' }}"

          matrix_include="[]"

          declare -A DOCKERFILES=(
            ["api-server"]="docker/Dockerfile.api:api"
            ["cli-tools"]="docker/Dockerfile.cli:cli"
            ["test-environment"]="docker/Dockerfile.test:test"
          )

          for name in "${!DOCKERFILES[@]}"; do
            if [[ "${target}" == "all" || "${target}" == "${name}" ]]; then
              IFS=':' read -r dockerfile suffix <<< "${DOCKERFILES[$name]}"
              matrix_include="$(echo "${matrix_include}" | jq \
                --arg name "${name}" \
                --arg dockerfile "${dockerfile}" \
                --arg suffix "${suffix}" \
                '. += [{"name": $name, "dockerfile": $dockerfile, "suffix": $suffix}]')"
            fi
          done

          echo "matrix={\"include\": ${matrix_include}}" >> "${GITHUB_OUTPUT}"
          echo "  ✅ Build matrix: $(echo "${matrix_include}" | jq 'length') targets"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: BUILD — Multi-platform Docker build
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: "🔨 Build — ${{ matrix.name }}"
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.dockerfile-matrix) }}

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      imageid: ${{ steps.build.outputs.imageid }}
      image-name: ${{ steps.build.outputs.image_name }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "⚙️ Set up QEMU (Multi-arch)"
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ env.PLATFORMS }}

      - name: "🔨 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          driver-opts: |
            network=host
            image=moby/buildkit:latest
          buildkitd-flags: --debug

      - name: "🔑 Login to GHCR"
        if: needs.prepare.outputs.should-push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔑 Login to Docker Hub"
        if: >
          needs.prepare.outputs.should-push == 'true' &&
          secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: "🏷️ Extract Docker Metadata"
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}-${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=ASH Dotfiles ${{ matrix.name }}
            org.opencontainers.image.description=ASH Dotfiles v5.0 OMEGA — ${{ matrix.name }}
            org.opencontainers.image.vendor=ASH Dotfiles Team
            org.opencontainers.image.licenses=MIT
            ash.dotfiles.component=${{ matrix.name }}
            ash.dotfiles.version=${{ needs.prepare.outputs.version }}

      - name: "🗄️ Cache Docker Layers"
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-${{ matrix.suffix }}
          key: >-
            buildx-${{ matrix.suffix }}-${{ runner.os }}-
            ${{ hashFiles(matrix.dockerfile, 'api/requirements.txt', 'ash-cli/**') }}
          restore-keys: |
            buildx-${{ matrix.suffix }}-${{ runner.os }}-

      - name: "🔨 Build Docker Image"
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ needs.prepare.outputs.should-push == 'true' }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          no-cache: ${{ inputs.no_cache || 'false' }}
          cache-from: |
            type=local,src=/tmp/.buildx-cache-${{ matrix.suffix }}
            type=registry,ref=${{ env.GHCR_IMAGE }}-${{ matrix.suffix }}:buildcache
          cache-to: |
            type=local,dest=/tmp/.buildx-cache-${{ matrix.suffix }}-new,mode=max
            type=registry,ref=${{ env.GHCR_IMAGE }}-${{ matrix.suffix }}:buildcache,mode=max
          build-args: |
            BUILD_DATE=${{ needs.prepare.outputs.build-date }}
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ github.sha }}
            ASH_VERSION=${{ needs.prepare.outputs.version }}
          sbom: true
          provenance: true
          annotations: |
            index:org.opencontainers.image.description=ASH Dotfiles v5.0 OMEGA ${{ matrix.name }}

      - name: "🔄 Rotate Build Cache"
        shell: bash
        run: |
          rm -rf /tmp/.buildx-cache-${{ matrix.suffix }}
          mv /tmp/.buildx-cache-${{ matrix.suffix }}-new \
             /tmp/.buildx-cache-${{ matrix.suffix }} 2>/dev/null || true

      - name: "📊 Display Build Info"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  🐋 Built: %-49s║\n" "${{ matrix.name }}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  📍 Digest:   %-43s║\n" "${{ steps.build.outputs.digest }}"
          printf "║  🏷️  Image ID: %-43s║\n" "${{ steps.build.outputs.imageid }}"
          printf "║  🌐 Platform: %-43s║\n" "${{ env.PLATFORMS }}"
          echo "╚══════════════════════════════════════════════════════════════╝"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: SCAN — Security scan built images
  # ────────────────────────────────────────────────────────────────────────────
  scan:
    name: "🔒 Security Scan — Built Images"
    needs: [prepare, build]
    if: inputs.scan_images != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    outputs:
      scan-passed: ${{ steps.scan.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🛠️ Install Trivy"
        shell: bash
        run: |
          sudo apt-get install -qq -y wget gnupg 2>/dev/null
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list > /dev/null
          sudo apt-get update -qq 2>/dev/null
          sudo apt-get install -qq -y trivy 2>/dev/null
          echo "  ✅ Trivy: $(trivy --version | head -1)"

      - name: "🔒 Scan Images"
        id: scan
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔒 Docker Image Security Scanning                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          mkdir -p scan-results

          IMAGES=(
            "python:3.12-slim"
            "archlinux:latest"
          )

          total_critical=0
          scan_passed=true

          for image in "${IMAGES[@]}"; do
            echo ""
            echo "  🔍 Scanning: ${image}"

            trivy image \
              --severity=CRITICAL \
              --format=json \
              --output="scan-results/$(echo "${image}" | tr ':/' '--').json" \
              --ignore-unfixed=true \
              --exit-code=0 \
              --cache-dir=/tmp/.trivy-cache \
              "${image}" 2>/dev/null || true

            result_file="scan-results/$(echo "${image}" | tr ':/' '--').json"
            if [[ -f "${result_file}" ]]; then
              crit="$(jq '
                [.Results[]?.Vulnerabilities[]? |
                 select(.Severity == "CRITICAL")] | length
              ' "${result_file}" 2>/dev/null || echo 0)"

              total_critical=$((total_critical + crit))

              if [[ ${crit} -gt 0 ]]; then
                echo "  ❌ ${image}: ${crit} critical CVEs"
                jq -r '
                  .Results[]?.Vulnerabilities[]? |
                  select(.Severity == "CRITICAL") |
                  "     🔴 \(.VulnerabilityID): \(.PkgName) → fix: \(.FixedVersion // "N/A")"
                ' "${result_file}" 2>/dev/null | head -5
              else
                echo "  ✅ ${image}: No critical CVEs"
              fi
            fi
          done

          [[ ${total_critical} -gt 0 ]] && scan_passed=false

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  🔒 Critical CVEs total: %-33s║\n" "${total_critical}"
          [[ "${scan_passed}" == "true" ]] && \
            echo "║  ✅ STATUS: PASSED                                          ║" || \
            echo "║  ⚠️  STATUS: CVEs detected in base images                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "passed=${scan_passed}" >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload Scan Results"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "docker-scan-results"
          path: scan-results/
          retention-days: 30
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: SMOKE-TEST — Verify images work correctly
  # ────────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: "💨 Smoke Test — Image Validation"
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      passed: ${{ steps.smoke.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🛠️ Setup Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "💨 Run Smoke Tests"
        id: smoke
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  💨 Docker Image Smoke Tests                                ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          total=0; passed=0; failed=()

          smoke_test() {
            local name="$1"
            local cmd="$2"
            total=$((total + 1))
            if eval "${cmd}" &>/dev/null; then
              echo "  ✅ ${name}"
              passed=$((passed + 1))
            else
              echo "  ❌ ${name}"
              failed+=("${name}")
            fi
          }

          # Build test image locally
          echo "  🔨 Building test image..."
          docker build \
            -f docker/Dockerfile.test \
            -t ash-test-local:smoke \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg VERSION="smoke-test" \
            --build-arg REVISION="${{ github.sha }}" \
            . 2>/dev/null || {
              echo "  ⚠️  Test image build failed — using archlinux base"
              docker pull archlinux:latest 2>/dev/null
              docker tag archlinux:latest ash-test-local:smoke
            }

          echo ""
          echo "  🧪 Running smoke tests..."

          # Basic container tests
          smoke_test "Container starts" \
            "docker run --rm ash-test-local:smoke echo 'ok'"

          smoke_test "bash available" \
            "docker run --rm ash-test-local:smoke bash --version"

          smoke_test "python3 available" \
            "docker run --rm ash-test-local:smoke python3 --version"

          smoke_test "git available" \
            "docker run --rm ash-test-local:smoke git --version"

          smoke_test "jq available" \
            "docker run --rm ash-test-local:smoke jq --version"

          smoke_test "Non-root user" \
            "docker run --rm --user 1000:1000 ash-test-local:smoke id"

          smoke_test "Filesystem writable" \
            "docker run --rm ash-test-local:smoke sh -c 'touch /tmp/test && rm /tmp/test'"

          smoke_test "No privileged required" \
            "docker run --rm --security-opt=no-new-privileges ash-test-local:smoke echo 'ok'"

          # ASH-specific tests (if ash-cli is present)
          if [[ -f "ash-cli/ash" ]]; then
            smoke_test "ASH CLI available" \
              "docker run --rm ash-test-local:smoke sh -c 'ls /opt/ash-dotfiles/ash-cli/ash 2>/dev/null || exit 0'"
          fi

          # Cleanup
          docker rmi ash-test-local:smoke 2>/dev/null || true

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  📊 Smoke Tests: %-41s║\n" "${passed}/${total} passed"
          echo "╠══════════════════════════════════════════════════════════════╣"

          smoke_passed="true"
          if [[ ${#failed[@]} -gt 0 ]]; then
            smoke_passed="false"
            echo "║  ❌ Failed tests:                                           ║"
            for f in "${failed[@]}"; do
              printf "║     → %-52s║\n" "${f}"
            done
          fi

          [[ "${smoke_passed}" == "true" ]] && \
            echo "║  ✅ STATUS: ALL SMOKE TESTS PASSED                          ║" || \
            echo "║  ❌ STATUS: SMOKE TESTS FAILED                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "passed=${smoke_passed}" >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 05: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — Docker Build"
    needs: [prepare, build, scan, smoke-test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "💬 Post PR Comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const buildResult  = '${{ needs.build.result }}';
            const scanPassed   = '${{ needs.scan.outputs.scan-passed || "true" }}' === 'true';
            const smokePassed  = '${{ needs.smoke-test.outputs.passed || "true" }}' === 'true';
            const version      = '${{ needs.prepare.outputs.version }}';
            const platforms    = '${{ env.PLATFORMS }}';
            const imageName    = '${{ env.GHCR_IMAGE }}';

            const buildPassed = buildResult === 'success';
            const overall     = buildPassed && scanPassed && smokePassed;
            const icon = overall ? '✅' : '❌';

            const body = `## 🐋 Docker Build ${icon}

            **Status: ${overall ? 'PASSED' : 'FAILED'}** | Version: \`${version}\`

            | Stage | Status |
            |-------|--------|
            | 🔨 Multi-platform Build | ${buildPassed ? '✅' : '❌'} |
            | 🔒 Security Scan | ${scanPassed ? '✅' : '⚠️'} |
            | 💨 Smoke Tests | ${smokePassed ? '✅' : '❌'} |

            **Platforms:** \`${platforms}\`
            **Image:** \`${imageName}\`

            ${overall ? '### ✅ Docker images built successfully!' : '### 🔧 Build issues found — check logs'}

            ---
            *🤖 ASH Docker Build Pipeline • BuildKit + Buildx*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🐋 Docker Build')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: "🚦 Evaluate Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 Docker Build Quality Gate                               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          build_result="${{ needs.build.result }}"
          smoke_passed="${{ needs.smoke-test.outputs.passed || 'true' }}"

          all_passed="true"
          [[ "${build_result}" != "success" ]] && all_passed="false"
          [[ "${smoke_passed}" != "true" ]] && all_passed="false"

          if [[ "${all_passed}" == "true" ]]; then
            echo "  ✅ DOCKER BUILD GATE: PASSED"
            echo "  🎉 All container images built and verified!"
          else
            echo "  ❌ DOCKER BUILD GATE: FAILED"
            exit 1
          fi