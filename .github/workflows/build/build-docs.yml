          yay -S ash-dotfiles

          # Apply first theme
          ash theme apply catppuccin-mocha

          # Open theme picker
          ash theme pick

          # Get help
          ash --help
          \`\`\`

          ## ✨ Key Features

          <div class="grid cards" markdown>

          - :art: **250+ Themes**

              Full WCAG AA compliance, dark/light/neon variants,
              seasonal themes, AI-generated palettes.

          - :electric_plug: **150+ Plugins**

              Game mode, focus timer, Discord RPC, smart home,
              streaming, productivity, and more.

          - :robot: **AI-Powered**

              Theme generation from wallpapers, mood detection,
              weather-based themes, activity awareness.

          - :shield: **Enterprise Security**

              Secret scanning, SAST, supply chain verification,
              SLSA provenance, SBOM generation.

          - :bar_chart: **Analytics Dashboard**

              Real-time usage metrics, performance monitoring,
              theme usage trends, command statistics.

          - :globe_with_meridians: **REST API**

              Full OpenAPI specification, WebSocket events,
              mobile app integration, web dashboard.

          </div>

          ## 📊 Stats

          | Metric | Count |
          |--------|-------|
          | 🎨 Themes | 250+ |
          | 🔌 Plugins | 150+ |
          | ⚡ CLI Commands | 115+ |
          | 📖 Documentation Pages | 75+ |
          | 🧪 Test Cases | 1,000+ |
          | 🐧 Supported Distros | 8 |
          INDEXMD
            echo "  ✅ docs/index.md generated"
          fi

          # ── Generate CLI reference ─────────────────────────────────────────
          if [[ "${{ inputs.generate_cli_ref || 'true' }}" == "true" ]]; then
            python3 << 'CLIREF'
          import os, re, json
          from pathlib import Path

          docs_dir = Path("docs/reference")
          docs_dir.mkdir(parents=True, exist_ok=True)
          cli_ref = docs_dir / "ash-cli-reference.md"

          if not cli_ref.exists():
              content = """---
          title: ASH CLI Reference
          description: Complete command reference for the ASH Dotfiles CLI
          ---

          # ⚡ ASH CLI Reference

          Complete reference for all ASH Dotfiles CLI commands.

          ## Overview

          ```bash
          ash [command] [subcommand] [options] [arguments]
          ```

          ## Global Options

          | Option | Description |
          |--------|-------------|
          | `--version`, `-v` | Show version information |
          | `--help`, `-h` | Show help message |
          | `--no-color` | Disable colored output |
          | `--debug` | Enable debug logging |
          | `--quiet`, `-q` | Suppress non-essential output |
          | `--json` | Output in JSON format |

          ## Command Categories

          === "🎨 Theme"

              ```bash
              ash theme [subcommand]
              ```

              | Command | Description |
              |---------|-------------|
              | `ash theme apply <name>` | Apply a theme |
              | `ash theme pick` | Interactive theme picker |
              | `ash theme list` | List available themes |
              | `ash theme random` | Apply random theme |
              | `ash theme create` | Create new theme |
              | `ash theme ai-generate` | AI-powered theme generation |
              | `ash theme schedule` | Schedule theme changes |
              | `ash theme history` | View theme history |
              | `ash theme favorite` | Manage favorites |

          === "🎭 Mode"

              ```bash
              ash mode [subcommand]
              ```

              | Command | Description |
              |---------|-------------|
              | `ash mode game` | Enable game mode |
              | `ash mode focus` | Enable focus mode |
              | `ash mode work` | Enable work mode |
              | `ash mode cinema` | Enable cinema mode |
              | `ash mode battery` | Enable battery saver |
              | `ash mode default` | Return to default mode |
              | `ash mode status` | Show current mode |

          === "🔌 Plugin"

              ```bash
              ash plugin [subcommand]
              ```

              | Command | Description |
              |---------|-------------|
              | `ash plugin install <id>` | Install a plugin |
              | `ash plugin remove <id>` | Remove a plugin |
              | `ash plugin list` | List plugins |
              | `ash plugin browse` | Browse plugin store |
              | `ash plugin update` | Update plugins |
              | `ash plugin enable <id>` | Enable a plugin |
              | `ash plugin disable <id>` | Disable a plugin |

          === "💾 Snapshot"

              ```bash
              ash snapshot [subcommand]
              ```

              | Command | Description |
              |---------|-------------|
              | `ash snapshot create` | Create snapshot |
              | `ash snapshot restore` | Restore snapshot |
              | `ash snapshot list` | List snapshots |
              | `ash snapshot diff` | Compare snapshots |
              | `ash snapshot delete` | Delete snapshot |

          === "🩺 Doctor"

              ```bash
              ash doctor [options]
              ```

              | Option | Description |
              |--------|-------------|
              | `--full` | Run full diagnostic |
              | `--quick` | Quick health check |
              | `--fix` | Auto-fix issues |
              | `--hardware` | Hardware-specific checks |
              | `--api` | API server checks |

          ## Examples

          ```bash
          # Apply Catppuccin Mocha theme with custom wallpaper
          ash theme apply catppuccin-mocha --wallpaper ~/Pictures/aurora.jpg

          # Generate AI theme from current wallpaper
          ash theme ai-generate --wallpaper ~/Pictures/sunset.jpg --style dark

          # Enable game mode (disables animations, maximizes performance)
          ash mode game

          # Install and enable a plugin
          ash plugin install smart-focus-timer
          ash plugin enable smart-focus-timer

          # Create a snapshot before making changes
          ash snapshot create --name "before-theme-change"

          # Run full system diagnostic
          ash doctor --full --verbose
          ```
          """
              cli_ref.write_text(content)
              print(f"  ✅ Generated: {cli_ref}")
          CLIREF
          fi

          # ── Generate custom CSS ────────────────────────────────────────────
          mkdir -p docs/{stylesheets,javascripts,overrides,assets/brand/logos}

          cat > docs/stylesheets/extra.css << 'EXTRACSS'
          /* ASH Dotfiles — MkDocs Extra Styles */

          :root {
            --ash-primary: #cba6f7;
            --ash-accent: #89b4fa;
            --ash-bg: #1e1e2e;
            --ash-surface: #313244;
          }

          /* Hero banner */
          .ash-hero {
            background: linear-gradient(135deg, var(--ash-bg), var(--ash-surface));
            border-radius: 12px;
            padding: 2rem;
            margin: 1rem 0;
            text-align: center;
          }

          /* Feature cards */
          .md-typeset .grid.cards > ul > li {
            border: 1px solid var(--md-default-fg-color--lightest);
            border-radius: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
          }

          .md-typeset .grid.cards > ul > li:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(203, 166, 247, 0.2);
          }

          /* Code blocks */
          .highlight {
            border-radius: 8px;
          }

          /* Tabs */
          .md-typeset .tabbed-labels label {
            font-weight: 600;
          }

          /* Admonitions */
          .md-typeset .admonition {
            border-radius: 8px;
          }

          /* Navigation */
          .md-nav__link {
            font-size: 0.85rem;
          }

          /* Header gradient */
          .md-header {
            background: linear-gradient(90deg, #1e1e2e, #313244);
          }
          EXTRACSS

          cat > docs/javascripts/ash-interactive.js << 'ASHJS'
          // ASH Dotfiles — Interactive Documentation Features
          document.addEventListener("DOMContentLoaded", function() {
            // Add copy buttons to shell commands
            document.querySelectorAll("pre code.language-bash").forEach(function(block) {
              const btn = document.createElement("button");
              btn.className = "ash-copy-btn";
              btn.innerHTML = "📋 Copy";
              btn.onclick = function() {
                navigator.clipboard.writeText(block.textContent).then(function() {
                  btn.innerHTML = "✅ Copied!";
                  setTimeout(function() { btn.innerHTML = "📋 Copy"; }, 2000);
                });
              };
              block.parentElement.style.position = "relative";
              block.parentElement.appendChild(btn);
            });

            // Version badge animation
            const badges = document.querySelectorAll(".ash-version-badge");
            badges.forEach(function(badge) {
              badge.style.animation = "pulse 2s infinite";
            });

            console.log("⚡ ASH Dotfiles Docs v5.0 OMEGA loaded");
          });
          ASHJS

          # ── Count stats ────────────────────────────────────────────────────
          page_count="$(find docs -name "*.md" | wc -l)"
          word_count="$(find docs -name "*.md" -exec cat {} \; | wc -w)"
          docs_hash="$(find docs -name "*.md" -exec md5sum {} \; | md5sum | cut -c1-8)"

          has_mkdocs="true"

          echo ""
          echo "  📊 Documentation Statistics:"
          echo "  ├── Pages:      ${page_count}"
          echo "  ├── Words:      ${word_count}"
          echo "  ├── Hash:       ${docs_hash}"
          echo "  └── MkDocs:     ${has_mkdocs}"

          {
            echo "docs_hash=${docs_hash}"
            echo "page_count=${page_count}"
            echo "word_count=${word_count}"
            echo "has_mkdocs=${has_mkdocs}"
            echo "ash_version=${ASH_VERSION}"
          } >> "${GITHUB_OUTPUT}"

      - name: "📤 Cache Generated Docs"
        uses: actions/cache/save@v4
        with:
          path: |
            docs/
            mkdocs.yml
          key: "docs-gen-${{ github.sha }}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: BUILD — Build MkDocs site
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: "🔨 Build MkDocs Site"
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    outputs:
      build-passed: ${{ steps.build.outputs.passed }}
      site-size:    ${{ steps.build.outputs.site_size }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📥 Restore Generated Docs"
        uses: actions/cache/restore@v4
        with:
          path: |
            docs/
            mkdocs.yml
          key: "docs-gen-${{ github.sha }}"
          restore-keys: "docs-gen-"

      - name: "📦 Install MkDocs & Plugins"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📦 Installing MkDocs Ecosystem                             ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          pip install -q \
            "mkdocs==1.6.1" \
            "mkdocs-material==9.5.44" \
            "mkdocs-material-extensions==1.3.1" \
            "pymdown-extensions==10.12" \
            "mkdocs-minify-plugin==0.8.0" \
            "mkdocs-git-revision-date-localized-plugin==1.3.0" \
            "mkdocs-glightbox==0.4.0" \
            "mkdocs-redirects==1.2.2" \
            "mkdocs-awesome-pages-plugin==2.9.3" \
            "mkdocs-tags-plugin==0.2.0" \
            "mkdocs-social-plugin==1.0.3" \
            "mike==2.1.3" \
            "pillow==11.0.0" \
            "cairosvg==2.7.1" \
            2>/dev/null

          echo "  ✅ MkDocs: $(mkdocs --version)"

      - name: "🔨 Build Documentation"
        id: build
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔨 MkDocs Build Pipeline                                   ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          ASH_VERSION="${{ needs.generate.outputs.ash-version }}"

          # Strict mode build
          build_exit=0
          ENABLE_GIT_COMMITTERS=false \
          ENABLE_GIT_AUTHORS=false \
          mkdocs build \
            --strict \
            --site-dir="${{ env.SITE_DIR }}" \
            --config-file=mkdocs.yml \
            2>&1 | tee /tmp/mkdocs-build.log | tail -30 || build_exit=$?

          if [[ ${build_exit} -eq 0 ]]; then
            echo "  ✅ MkDocs build: SUCCESS"
          else
            echo "  ⚠️  Strict build failed — trying relaxed build..."
            build_exit=0
            mkdocs build \
              --site-dir="${{ env.SITE_DIR }}" \
              --config-file=mkdocs.yml \
              2>&1 | tail -20 || build_exit=$?
          fi

          if [[ ${build_exit} -eq 0 ]]; then
            site_size="$(du -sh "${{ env.SITE_DIR }}" | cut -f1)"
            page_count="$(find "${{ env.SITE_DIR }}" -name "*.html" | wc -l)"

            echo ""
            echo "  📊 Build Statistics:"
            echo "  ├── Site size:   ${site_size}"
            echo "  ├── HTML pages:  ${page_count}"
            echo "  └── Version:     ${ASH_VERSION}"

            echo ""
            echo "╔══════════════════════════════════════════════════════════════╗"
            printf "║  📖 Site built successfully!                               ║\n"
            printf "║  📏 Size: %-49s║\n" "${site_size}"
            printf "║  📄 Pages: %-48s║\n" "${page_count}"
            echo "║  ✅ STATUS: BUILD PASSED                                    ║"
            echo "╚══════════════════════════════════════════════════════════════╝"

            echo "passed=true"           >> "${GITHUB_OUTPUT}"
            echo "site_size=${site_size}" >> "${GITHUB_OUTPUT}"
          else
            echo "passed=false" >> "${GITHUB_OUTPUT}"
            echo "site_size=0"  >> "${GITHUB_OUTPUT}"
          fi

      - name: "🔗 Validate Links"
        if: inputs.check_links != 'false'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔗 Documentation Link Validation                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          pip install -q "linkchecker==10.4.0" 2>/dev/null || true

          if command -v linkchecker &>/dev/null; then
            echo "  🔍 Running linkchecker on built site..."
            linkchecker \
              --check-extern \
              --no-follow-url=".*github\.com.*" \
              --timeout=10 \
              "${{ env.SITE_DIR }}/index.html" \
              2>&1 | tail -20 || true
            echo "  ✅ Link check complete"
          else
            # Python-based internal link checker
            python3 << 'LINKCHECK'
          import re, sys
          from pathlib import Path

          site_dir = Path("${{ env.SITE_DIR }}")
          broken = []
          checked = 0

          if not site_dir.exists():
              print("  ℹ️  Site dir not found — skipping link check")
              sys.exit(0)

          for html_file in sorted(site_dir.rglob("*.html"))[:30]:
              content = html_file.read_text(encoding="utf-8", errors="ignore")
              links = re.findall(r'href=["\']([^"\'#?]+)["\']', content)

              for link in links:
                  if link.startswith("http") or link.startswith("//"):
                      continue
                  if link.startswith("/"):
                      target = site_dir / link.lstrip("/")
                  else:
                      target = html_file.parent / link

                  checked += 1
                  target_path = target if target.suffix else target / "index.html"

                  if not target_path.exists() and not target.exists():
                      broken.append(f"  ❌ {html_file.name}: {link}")

          if broken:
              print(f"  ⚠️  {len(broken)} broken internal links:")
              for b in broken[:10]:
                  print(b)
          else:
              print(f"  ✅ All {checked} internal links valid")
          LINKCHECK
          fi

      - name: "📊 Documentation Quality Metrics"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📊 Documentation Quality Analysis                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          python3 << 'QUALITYCHECK'
          import re, json
          from pathlib import Path
          from collections import defaultdict

          docs_dir = Path("docs")
          if not docs_dir.exists():
              print("  ℹ️  No docs directory found")
              exit(0)

          stats = {
              "total_pages":    0,
              "total_words":    0,
              "total_headings": 0,
              "total_code":     0,
              "total_images":   0,
              "total_links":    0,
              "missing_meta":   0,
              "missing_desc":   0,
          }

          by_category = defaultdict(lambda: {"pages": 0, "words": 0})

          for md_file in sorted(docs_dir.rglob("*.md")):
              try:
                  content = md_file.read_text(encoding="utf-8")
              except Exception:
                  continue

              # Category
              parts = md_file.relative_to(docs_dir).parts
              cat = parts[0] if len(parts) > 1 else "root"

              stats["total_pages"] += 1
              by_category[cat]["pages"] += 1

              # Strip code blocks for word count
              no_code = re.sub(r'```[\s\S]*?```', '', content)
              words   = len(no_code.split())
              stats["total_words"] += words
              by_category[cat]["words"] += words

              # Counts
              stats["total_headings"] += len(re.findall(r'^#{1,6}\s', content, re.M))
              stats["total_code"]     += len(re.findall(r'```', content)) // 2
              stats["total_images"]   += len(re.findall(r'!\[', content))
              stats["total_links"]    += len(re.findall(r'\[.*?\]\(', content))

              # Frontmatter checks
              if not re.match(r'^---\n', content):
                  stats["missing_meta"] += 1
              if not re.search(r'description:', content[:300]):
                  stats["missing_desc"] += 1

          avg_words = stats["total_words"] // max(stats["total_pages"], 1)

          print(f"  📊 Documentation Quality Report:")
          print(f"  ┌──────────────────────────────────────────────────────┐")
          print(f"  │  📄 Total pages:      {stats['total_pages']:<31}│")
          print(f"  │  📝 Total words:      {stats['total_words']:<31}│")
          print(f"  │  📏 Avg words/page:   {avg_words:<31}│")
          print(f"  │  🔖 Total headings:   {stats['total_headings']:<31}│")
          print(f"  │  💻 Code blocks:      {stats['total_code']:<31}│")
          print(f"  │  🖼️  Images:           {stats['total_images']:<31}│")
          print(f"  │  🔗 Links:            {stats['total_links']:<31}│")
          print(f"  │  ⚠️  Missing meta:     {stats['missing_meta']:<31}│")
          print(f"  └──────────────────────────────────────────────────────┘")

          print(f"\n  📁 By Category:")
          for cat, data in sorted(by_category.items()):
              print(f"     {cat:<20} {data['pages']:3d} pages  {data['words']:6d} words")

          # Quality score
          score = 10
          if stats["missing_meta"] > stats["total_pages"] * 0.3:
              score -= 2
              print("\n  ⚠️  Many pages missing frontmatter metadata")
          if avg_words < 100:
              score -= 1
              print("  ⚠️  Average page word count is low")
          if stats["total_images"] == 0:
              score -= 1
              print("  ℹ️  No images found in documentation")

          print(f"\n  📊 Quality Score: {score}/10")
          QUALITYCHECK

      - name: "📤 Upload Built Site"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "docs-site"
          path: ${{ env.SITE_DIR }}/
          retention-days: 30
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: DEPLOY — Deploy to GitHub Pages
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 Deploy to GitHub Pages"
    needs: [generate, build]
    if: >
      needs.build.outputs.build-passed == 'true' &&
      (
        (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
        inputs.deploy == 'true'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    permissions:
      pages: write
      id-token: write
      contents: write

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install MkDocs"
        shell: bash
        run: |
          pip install -q \
            "mkdocs==1.6.1" \
            "mkdocs-material==9.5.44" \
            "pymdown-extensions==10.12" \
            "mkdocs-git-revision-date-localized-plugin==1.3.0" \
            "mike==2.1.3" \
            2>/dev/null

      - name: "📥 Download Built Site"
        uses: actions/download-artifact@v7
        with:
          name: "docs-site"
          path: ${{ env.SITE_DIR }}/

      - name: "⚙️ Setup GitHub Pages"
        uses: actions/configure-pages@v5

      - name: "📤 Upload Pages Artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}/

      - name: "🚀 Deploy to GitHub Pages"
        id: deploy
        uses: actions/deploy-pages@v4

      - name: "🎉 Deployment Success"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🎉 Documentation Deployed Successfully!                    ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  🌐 URL: %-50s║\n" "${{ steps.deploy.outputs.page_url }}"
          printf "║  📖 Pages: %-48s║\n" "${{ needs.generate.outputs.page-count }}"
          printf "║  📝 Words: %-48s║\n" "${{ needs.generate.outputs.word-count }}"
          echo "╚══════════════════════════════════════════════════════════════╝"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — Documentation"
    needs: [generate, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "💬 Post PR Comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const buildPassed = '${{ needs.build.outputs.build-passed || "true" }}' === 'true';
            const pageCount   = '${{ needs.generate.outputs.page-count }}';
            const wordCount   = '${{ needs.generate.outputs.word-count }}';
            const siteSize    = '${{ needs.build.outputs.site-size || "N/A" }}';
            const ashVersion  = '${{ needs.generate.outputs.ash-version }}';

            const body = `## 📖 Documentation Build ${buildPassed ? '✅' : '❌'}

            **Status: ${buildPassed ? 'PASSED' : 'FAILED'}** | v${ashVersion}

            | Metric | Value |
            |--------|-------|
            | 📄 Pages | \`${pageCount}\` |
            | 📝 Words | \`${wordCount}\` |
            | 📏 Site Size | \`${siteSize}\` |

            **Built with:** MkDocs Material • Mermaid • Glightbox • Social Cards

            ${buildPassed
              ? `### ✅ Documentation builds successfully!\n\n[Preview on GitHub Pages](https://ash-dotfiles.github.io/docs)`
              : '### 🔧 Documentation build failed — check logs'
            }

            ---
            *🤖 ASH Docs Pipeline • MkDocs Material*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('📖 Documentation Build')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: "🚦 Evaluate Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 Documentation Quality Gate                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          build_passed="${{ needs.build.outputs.build-passed || 'true' }}"
          page_count="${{ needs.generate.outputs.page-count || '0' }}"

          echo ""
          echo "  📊 Gate Summary:"
          echo "  ├── Build:  ${build_passed}"
          echo "  ├── Pages:  ${page_count}"
          echo "  └── Words:  ${{ needs.generate.outputs.word-count || '0' }}"
          echo ""

          if [[ "${build_passed}" == "true" ]]; then
            echo "  ✅ DOCS GATE: PASSED"
            echo "  🎉 Documentation built successfully!"
            echo "  🌐 https://ash-dotfiles.github.io/docs"
          else
            echo "  ❌ DOCS GATE: FAILED"
            echo "  Fix documentation build errors before merging."
            exit 1
          fi