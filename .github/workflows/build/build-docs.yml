# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      📖 ASH DOTFILES v5.0 OMEGA — DOCUMENTATION BUILD WORKFLOW                        ║
# ║                                                                                          ║
# ║      Ultra-Premium Documentation Build, Validate & Deploy Pipeline                     ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      MkDocs Material       •  Auto-Generation     •  Multi-language               ║
# ║      API Reference         •  CLI Reference        •  Search Index               ║
# ║      Link Validation       •  Spell Check          •  Reading Level             ║
# ║      Screenshot Gen        •  Mermaid Diagrams     •  OpenGraph Meta            ║
# ║      GitHub Pages Deploy   •  Versioned Docs       •  PDF Export               ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "📖 Documentation — Build, Validate & Deploy"

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "*.md"
      - "ash-cli/**"
      - ".github/workflows/build/build-docs.yml"

  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "*.md"
      - ".github/workflows/build/build-docs.yml"
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages"
        required: false
        default: false
        type: boolean
      generate_api_ref:
        description: "Generate API reference"
        required: false
        default: true
        type: boolean
      generate_cli_ref:
        description: "Generate CLI reference"
        required: false
        default: true
        type: boolean
      check_links:
        description: "Validate all hyperlinks"
        required: false
        default: true
        type: boolean
      export_pdf:
        description: "Export PDF version"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  checks: write

concurrency:
  group: "docs-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  DOCS_DIR: "docs"
  SITE_DIR: "site"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: GENERATE — Auto-generate reference documentation
  # ────────────────────────────────────────────────────────────────────────────
  generate:
    name: "⚙️ Generate Reference Documentation"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      docs-hash:     ${{ steps.gen.outputs.docs_hash }}
      page-count:    ${{ steps.gen.outputs.page_count }}
      word-count:    ${{ steps.gen.outputs.word_count }}
      has-mkdocs:    ${{ steps.gen.outputs.has_mkdocs }}
      ash-version:   ${{ steps.gen.outputs.ash_version }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "⚙️ Generate Reference Documentation"
        id: gen
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📖 Documentation Generator Engine                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          mkdir -p docs/{getting-started,guides,reference,troubleshooting,contributing,changelog}

          ASH_VERSION="5.0.0"
          for vf in version.json ash-cli/data/version.json; do
            [[ -f "${vf}" ]] && \
              ASH_VERSION="$(jq -r '.version // "5.0.0"' "${vf}" 2>/dev/null)" && break
          done

          echo "  📊 Doc Generation:"
          echo "  ├── ASH Version: ${ASH_VERSION}"
          echo "  ├── Docs dir:    ${{ env.DOCS_DIR }}"
          echo "  └── Output:      ${{ env.SITE_DIR }}"

          # ── Generate mkdocs.yml ─────────────────────────────────────────────
          if [[ ! -f "mkdocs.yml" ]]; then
            cat > mkdocs.yml << MKDOCSYML
          # ╔══════════════════════════════════════════════════════════════════╗
          # ║  ASH Dotfiles v5.0 OMEGA — MkDocs Configuration               ║
          # ╚══════════════════════════════════════════════════════════════════╝

          site_name: ASH Dotfiles v5.0 OMEGA
          site_url: https://ash-dotfiles.github.io
          site_description: >-
            ASH Dotfiles v5.0 OMEGA — Ultra-Premium Hyprland Desktop Environment.
            250+ themes, 150+ plugins, AI-powered configuration, enterprise security.
          site_author: ASH Dotfiles Team
          repo_url: https://github.com/ash-dotfiles/ash-dotfiles
          repo_name: ash-dotfiles/ash-dotfiles
          edit_uri: edit/main/docs/

          docs_dir: docs
          site_dir: site

          # ── Theme Configuration ──────────────────────────────────────────
          theme:
            name: material
            custom_dir: docs/overrides
            logo: assets/brand/logos/ash-logo.svg
            favicon: assets/brand/logos/ash-logo.ico
            icon:
              repo: fontawesome/brands/github
              tag:
                default: material/tag
                ash: material/star

            palette:
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: deep purple
                accent: cyan
                toggle:
                  icon: material/weather-sunny
                  name: Switch to light mode
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: deep purple
                accent: cyan
                toggle:
                  icon: material/weather-night
                  name: Switch to dark mode

            features:
              # Navigation
              - navigation.instant
              - navigation.instant.progress
              - navigation.tracking
              - navigation.tabs
              - navigation.tabs.sticky
              - navigation.sections
              - navigation.expand
              - navigation.path
              - navigation.indexes
              - navigation.top
              - navigation.footer

              # Search
              - search.suggest
              - search.highlight
              - search.share

              # Content
              - content.code.copy
              - content.code.annotate
              - content.code.select
              - content.tabs.link
              - content.tooltips
              - content.action.edit
              - content.action.view

              # Header
              - header.autohide
              - announce.dismiss

              # TOC
              - toc.follow

          # ── Plugins ──────────────────────────────────────────────────────
          plugins:
            - search:
                separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
            - minify:
                minify_html: true
                minify_js: true
                minify_css: true
                htmlmin_opts:
                  remove_comments: true
            - glightbox:
                touchNavigation: true
                loop: false
                effect: zoom
            - git-revision-date-localized:
                enable_creation_date: true
                type: timeago
            - tags:
                tags_file: tags.md
            - social:
                cards: true
                cards_layout: default

          # ── Markdown Extensions ───────────────────────────────────────────
          markdown_extensions:
            - abbr
            - admonition
            - attr_list
            - def_list
            - footnotes
            - md_in_html
            - meta
            - tables
            - toc:
                permalink: true
                title: On this page
                toc_depth: 3
            - pymdownx.arithmatex:
                generic: true
            - pymdownx.betterem
            - pymdownx.caret
            - pymdownx.critic
            - pymdownx.details
            - pymdownx.emoji:
                emoji_index: !!python/name:material.extensions.emoji.twemoji
                emoji_generator: !!python/name:material.extensions.emoji.to_svg
            - pymdownx.escapeall
            - pymdownx.highlight:
                anchor_linenums: true
                line_spans: __span
                pygments_lang_class: true
                auto_title: true
            - pymdownx.inlinehilite
            - pymdownx.keys
            - pymdownx.magiclink:
                normalize_issue_symbols: true
                repo_url_shorthand: true
                user: ash-dotfiles
                repo: ash-dotfiles
            - pymdownx.mark
            - pymdownx.progressbar
            - pymdownx.smartsymbols
            - pymdownx.snippets:
                auto_append:
                  - includes/mkdocs.md
            - pymdownx.superfences:
                custom_fences:
                  - name: mermaid
                    class: mermaid
                    format: !!python/name:pymdownx.superfences.fence_code_format
            - pymdownx.tabbed:
                alternate_style: true
                combine_header_slug: true
            - pymdownx.tasklist:
                custom_checkbox: true
            - pymdownx.tilde

          # ── Navigation ────────────────────────────────────────────────────
          nav:
            - Home: index.md
            - Getting Started:
                - getting-started/index.md
                - Installation: getting-started/installation.md
                - Requirements: getting-started/requirements.md
                - Quick Start: getting-started/quick-start.md
                - First Steps: getting-started/first-steps.md
                - FAQ: getting-started/faq.md
            - Guides:
                - guides/index.md
                - 🎨 Theming:
                    - Theme Guide: guides/theming-deep-dive.md
                    - AI Themes: guides/ai-theme-generation.md
                    - Create Theme: guides/theme-creation.md
                - ⚡ Desktop:
                    - Keybinds: guides/keybinds-reference.md
                    - Waybar: guides/waybar-customization.md
                    - Rofi Menus: guides/rofi-menus.md
                    - Multi-Monitor: guides/multi-monitor.md
                - 📝 Editors:
                    - Neovim IDE: guides/neovim-ide-guide.md
                - 🐟 Shell:
                    - Fish Shell: guides/fish-shell-guide.md
                - 🎮 Use Cases:
                    - Gaming Setup: guides/gaming-setup.md
                    - Streaming: guides/streaming-setup.md
                    - Productivity: guides/productivity-workflow.md
                - 🖥️ Hardware:
                    - NVIDIA Setup: guides/nvidia-setup.md
                    - AMD Setup: guides/amd-setup.md
                    - Laptop Setup: guides/laptop-setup.md
                - 🔌 Integrations:
                    - Plugin Development: guides/plugin-development.md
                    - REST API: guides/api-guide.md
                    - Web Dashboard: guides/web-dashboard.md
                    - Mobile App: guides/mobile-app.md
                - 🔒 Security:
                    - Security Hardening: guides/security-hardening.md
                    - Privacy Guide: guides/privacy-guide.md
                - ♿ Accessibility: guides/accessibility.md
                - ❄️ NixOS Setup: guides/nixos-setup.md
            - Reference:
                - reference/index.md
                - CLI Reference: reference/ash-cli-reference.md
                - Configuration: reference/config-reference.md
                - Theme Schema: reference/theme-schema.md
                - Plugin API: reference/plugin-api.md
                - Hook Reference: reference/hook-reference.md
                - REST API: reference/rest-api-reference.md
                - WebSocket: reference/websocket-protocol.md
                - Environment: reference/environment-variables.md
                - Systemd: reference/systemd-services.md
            - Troubleshooting:
                - troubleshooting/index.md
                - Common Issues: troubleshooting/common-issues.md
                - Display Issues: troubleshooting/display-issues.md
                - Audio Issues: troubleshooting/audio-issues.md
                - Theme Issues: troubleshooting/theme-issues.md
                - NVIDIA Issues: troubleshooting/nvidia-issues.md
                - Performance: troubleshooting/performance-issues.md
                - Debug Mode: troubleshooting/debug-mode.md
            - Contributing:
                - contributing/index.md
                - CONTRIBUTING.md: contributing/CONTRIBUTING.md
                - Code of Conduct: contributing/CODE_OF_CONDUCT.md
                - Style Guide: contributing/STYLE_GUIDE.md
                - Architecture: contributing/ARCHITECTURE.md
            - Changelog: changelog/CHANGELOG.md

          # ── Extra ─────────────────────────────────────────────────────────
          extra:
            version:
              provider: mike
              default: stable
            social:
              - icon: fontawesome/brands/github
                link: https://github.com/ash-dotfiles/ash-dotfiles
              - icon: fontawesome/brands/discord
                link: https://discord.gg/ash-dotfiles
              - icon: fontawesome/brands/mastodon
                link: https://fosstodon.org/@ash_dotfiles
            analytics:
              provider: google
              property: !ENV GOOGLE_ANALYTICS_KEY
            tags:
              ash: Ash Dotfiles
              hyprland: Hyprland
              wayland: Wayland
              theme: Theme
              plugin: Plugin
            generator: false
            status:
              new: Recently added
              deprecated: Deprecated
              beta: Beta

          extra_css:
            - stylesheets/extra.css
            - stylesheets/ash-custom.css

          extra_javascript:
            - javascripts/mathjax.js
            - https://polyfill.io/v3/polyfill.min.js?features=es6
            - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
            - javascripts/ash-interactive.js
          MKDOCSYML
            echo "  ✅ mkdocs.yml generated"
          fi

          # ── Generate index page ────────────────────────────────────────────
          if [[ ! -f "docs/index.md" ]]; then
            cat > docs/index.md << INDEXMD
          ---
          title: ASH Dotfiles v${ASH_VERSION} OMEGA
          description: Ultra-Premium Hyprland Desktop Environment
          ---

          # 🔥 ASH Dotfiles v${ASH_VERSION} OMEGA

          <div align="center">

          \`\`\`
          ░█████╗░░██████╗██╗░░██╗  ██████╗░░█████╗░████████╗███████╗██╗██╗░░░░░███████╗░██████╗
          ██╔══██╗██╔════╝██║░░██║  ██╔══██╗██╔══██╗╚══██╔══╝██╔════╝██║██║░░░░░██╔════╝██╔════╝
          ███████║╚█████╗░███████║  ██║░░██║██║░░██║░░░██║░░░█████╗░░██║██║░░░░░█████╗░░╚█████╗░
          ██╔══██║░╚═══██╗██╔══██║  ██║░░██║██║░░██║░░░██║░░░██╔══╝░░██║██║░░░░░██╔══╝░░░╚═══██╗
          ██║░░██║██████╔╝██║░░██║  ██████╔╝╚█████╔╝░░░██║░░░██║░░░░░██║███████╗███████╗██████╔╝
          ╚═╝░░╚═╝╚═════╝░╚═╝░░╚═╝  ╚═════╝░░╚════╝░░░░╚═╝░░░╚═╝░░░░░╚═╝╚══════╝╚══════╝╚═════╝░
          \`\`\`

          **⚡ v${ASH_VERSION} OMEGA • 🎨 250+ Themes • 🔌 150+ Plugins • 🤖 AI-Native • 🔒 Enterprise Security**

          </div>

          ---

          ## 🚀 Quick Start

          \`\`\`bash
