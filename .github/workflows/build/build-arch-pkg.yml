# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🏔️  ASH DOTFILES v5.0 OMEGA — ARCH LINUX PACKAGE BUILD WORKFLOW                  ║
# ║                                                                                          ║
# ║      Ultra-Premium AUR PKGBUILD Build, Validate & Publish Pipeline                     ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      PKGBUILD Generation   •  makepkg Build        •  namcap Validation              ║
# ║      AUR Submission        •  .SRCINFO Generation  •  Checksum Verify              ║
# ║      Package Signing       •  Multi-Package Matrix •  Dependency Audit             ║
# ║      Split Package Test    •  VCS Package Test     •  Release Integration         ║
# ║      pacman Installability •  PKGBUILD Lint        •  AUR Git Publish             ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🏔️ Arch Linux — PKGBUILD Build & Validate"

on:
  push:
    branches: [main, "release/**"]
    paths:
      - "packaging/aur/**"
      - "ash-cli/**"
      - "version.json"
      - ".github/workflows/build/build-arch-pkg.yml"
    tags:
      - "v*.*.*"

  pull_request:
    branches: [main]
    paths:
      - "packaging/aur/**"
      - "ash-cli/**"
      - "version.json"
      - ".github/workflows/build/build-arch-pkg.yml"
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      package_target:
        description: "Package to build"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - ash-dotfiles
          - ash-dotfiles-git
          - ash-dotfiles-bin
      publish_aur:
        description: "Publish to AUR"
        required: false
        default: false
        type: boolean
      run_namcap:
        description: "Run namcap validation"
        required: false
        default: true
        type: boolean
      pkgver_override:
        description: "Override pkgver"
        required: false
        default: ""
        type: string

  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: "arch-build-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  PACKAGER: "ASH Dotfiles Bot <bot@ash-dotfiles.dev>"
  GPGKEY: ""

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: GENERATE — Generate PKGBUILDs
  # ────────────────────────────────────────────────────────────────────────────
  generate:
    name: "📋 Generate PKGBUILD Files"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      pkgver:        ${{ steps.gen.outputs.pkgver }}
      pkgrel:        ${{ steps.gen.outputs.pkgrel }}
      pkg-matrix:    ${{ steps.gen.outputs.pkg_matrix }}
      ash-version:   ${{ steps.gen.outputs.ash_version }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "📋 Generate PKGBUILDs"
        id: gen
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🏔️  PKGBUILD Generator                                      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          mkdir -p packaging/aur/{ash-dotfiles,ash-dotfiles-git,ash-dotfiles-bin}

          # Determine version
          ASH_VERSION="unknown"
          for vf in version.json ash-cli/data/version.json; do
            [[ -f "${vf}" ]] && \
              ASH_VERSION="$(jq -r '.version // "5.0.0"' "${vf}" 2>/dev/null)" && break
          done

          PKGVER="${{ inputs.pkgver_override || '' }}"
          [[ -z "${PKGVER}" ]] && PKGVER="${ASH_VERSION:-5.0.0}"
          PKGREL="1"

          echo "  📊 Package Configuration:"
          echo "  ├── pkgver: ${PKGVER}"
          echo "  ├── pkgrel: ${PKGREL}"
          echo "  └── ASH:    ${ASH_VERSION}"

          # ── Generate ash-dotfiles PKGBUILD ────────────────────────────────
          cat > packaging/aur/ash-dotfiles/PKGBUILD << PKGBUILD
          # Maintainer: ASH Dotfiles Team <team@ash-dotfiles.dev>
          # Contributor: ASH Dotfiles Bot <bot@ash-dotfiles.dev>

          pkgname=ash-dotfiles
          pkgver=${PKGVER}
          pkgrel=${PKGREL}
          pkgdesc="ASH Dotfiles v5.0 OMEGA — Ultra-Premium Hyprland Desktop Environment"
          arch=('x86_64' 'aarch64')
          url="https://github.com/ash-dotfiles/ash-dotfiles"
          license=('MIT')
          depends=(
            'bash>=5.0'
            'fish'
            'hyprland'
            'waybar'
            'rofi-wayland'
            'dunst'
            'kitty'
            'swww'
            'python'
            'jq'
            'imagemagick'
            'git'
            'socat'
            'inotify-tools'
            'fd'
            'ripgrep'
            'fzf'
            'zoxide'
          )
          optdepends=(
            'hyprlock: lock screen'
            'hypridle: idle management'
            'wlogout: graphical logout menu'
            'neovim: editor integration'
            'starship: shell prompt'
            'atuin: shell history'
            'btop: system monitor'
            'fastfetch: system info'
            'cava: audio visualizer'
            'yazi: file manager'
            'ags: alternative bar'
            'python-pip: plugin Python deps'
            'nodejs: web dashboard'
            'rust: Rust-based tools'
          )
          makedepends=(
            'git'
            'python'
          )
          conflicts=()
          provides=('ash-dotfiles')
          backup=()
          install=ash-dotfiles.install

          source=("git+https://github.com/ash-dotfiles/ash-dotfiles.git#tag=v\${pkgver}")
          sha256sums=('SKIP')
          validpgpkeys=()

          pkgver() {
            cd "\${srcdir}/ash-dotfiles"
            git describe --tags --abbrev=0 | sed 's/^v//'
          }

          prepare() {
            cd "\${srcdir}/ash-dotfiles"
            # Verify expected directory structure
            for dir in ash-cli themes config scripts; do
              [[ -d "\${dir}" ]] || { echo "Missing: \${dir}"; return 1; }
            done
          }

          build() {
            cd "\${srcdir}/ash-dotfiles"
            # Generate completions and man pages if tools available
            command -v fish &>/dev/null && \
              fish ash-cli/ash completions fish 2>/dev/null > /dev/null || true
          }

          check() {
            cd "\${srcdir}/ash-dotfiles"
            # Run basic validation
            bash -n ash-cli/ash 2>/dev/null || return 1
            jq empty ash-cli/data/*.json 2>/dev/null || true
          }

          package() {
            cd "\${srcdir}/ash-dotfiles"

            # Install paths
            local SHARE="\${pkgdir}/usr/share/ash-dotfiles"
            local BIN="\${pkgdir}/usr/bin"
            local LIB="\${pkgdir}/usr/lib/ash-dotfiles"
            local DOC="\${pkgdir}/usr/share/doc/ash-dotfiles"
            local LICENSE="\${pkgdir}/usr/share/licenses/ash-dotfiles"

            mkdir -p "\${SHARE}" "\${BIN}" "\${LIB}" "\${DOC}" "\${LICENSE}"

            # Install ASH CLI
            install -dm755 "\${SHARE}/ash-cli"
            cp -r ash-cli/. "\${SHARE}/ash-cli/"
            chmod +x "\${SHARE}/ash-cli/ash"
            ln -sf /usr/share/ash-dotfiles/ash-cli/ash "\${BIN}/ash"

            # Install config templates
            install -dm755 "\${SHARE}/config"
            cp -r config/. "\${SHARE}/config/"

            # Install themes
            install -dm755 "\${SHARE}/themes"
            cp -r themes/. "\${SHARE}/themes/"

            # Install plugins
            install -dm755 "\${SHARE}/plugins"
            cp -r plugins/. "\${SHARE}/plugins/"

            # Install scripts
            install -dm755 "\${SHARE}/scripts"
            cp -r scripts/. "\${SHARE}/scripts/"
            find "\${SHARE}/scripts" -name "*.sh" -exec chmod 755 {} \;

            # Install systemd units
            if [[ -d systemd/user ]]; then
              install -dm755 "\${pkgdir}/usr/lib/systemd/user"
              install -m644 systemd/user/*.service \
                "\${pkgdir}/usr/lib/systemd/user/" 2>/dev/null || true
              install -m644 systemd/user/*.timer \
                "\${pkgdir}/usr/lib/systemd/user/" 2>/dev/null || true
            fi

            # Install shell completions
            install -dm755 "\${pkgdir}/usr/share/bash-completion/completions"
            install -dm755 "\${pkgdir}/usr/share/fish/vendor_completions.d"
            install -dm755 "\${pkgdir}/usr/share/zsh/site-functions"

            [[ -f ash-cli/commands/completion/ash.bash ]] && \
              install -m644 ash-cli/commands/completion/ash.bash \
                "\${pkgdir}/usr/share/bash-completion/completions/ash"
            [[ -f ash-cli/commands/completion/ash.fish ]] && \
              install -m644 ash-cli/commands/completion/ash.fish \
                "\${pkgdir}/usr/share/fish/vendor_completions.d/ash.fish"
            [[ -f ash-cli/commands/completion/ash.zsh ]] && \
              install -m644 ash-cli/commands/completion/ash.zsh \
                "\${pkgdir}/usr/share/zsh/site-functions/_ash"

            # Documentation
            install -m644 README.md "\${DOC}/"
            install -m644 CHANGELOG.md "\${DOC}/" 2>/dev/null || true
            install -m644 CONTRIBUTING.md "\${DOC}/" 2>/dev/null || true

            # License
            install -m644 LICENSE "\${LICENSE}/"
          }
          PKGBUILD

          # ── Generate ash-dotfiles.install ──────────────────────────────────
          cat > packaging/aur/ash-dotfiles/ash-dotfiles.install << 'INSTALL'
          post_install() {
            echo ""
            echo "  ░█████╗░░██████╗██╗░░██╗  ██████╗░░█████╗░████████╗░██████╗"
            echo "  ██╔══██╗██╔════╝██║░░██║  ██╔══██╗██╔══██╗╚══██╔══╝██╔════╝"
            echo "  ███████║╚█████╗░███████║  ██║░░██║██║░░██║░░░██║░░░╚█████╗░"
            echo "  ██╔══██║░╚═══██╗██╔══██║  ██║░░██║██║░░██║░░░██║░░░░╚═══██╗"
            echo "  ██║░░██║██████╔╝██║░░██║  ██████╔╝╚█████╔╝░░░██║░░░██████╔╝"
            echo "  ╚═╝░░╚═╝╚═════╝░╚═╝░░╚═╝  ╚═════╝░░╚════╝░░░░╚═╝░░░╚═════╝░"
            echo ""
            echo "  🎉 ASH Dotfiles installed successfully!"
            echo ""
            echo "  Quick start:"
            echo "  ─────────────────────────────────────────────────────────"
            echo "  1. Copy configs: ash install --interactive"
            echo "  2. Apply theme:  ash theme apply catppuccin-mocha"
            echo "  3. Start Hyprland (from TTY): Hyprland"
            echo "  4. Get help:     ash --help"
            echo ""
            echo "  Documentation: https://ash-dotfiles.github.io/docs"
            echo "  Community:     https://discord.gg/ash-dotfiles"
            echo ""
          }

          post_upgrade() {
            post_install
          }

          pre_remove() {
            echo "  ℹ️  Your user configs in ~/.config/ are preserved."
            echo "     Run 'ash snapshot restore --latest' to revert if needed."
          }
          INSTALL

          # ── Generate ash-dotfiles-git PKGBUILD ────────────────────────────
          cat > packaging/aur/ash-dotfiles-git/PKGBUILD << PKGBUILD
          # Maintainer: ASH Dotfiles Team <team@ash-dotfiles.dev>
          # VCS package — tracks latest git commits

          pkgname=ash-dotfiles-git
          pkgver=5.0.0.r0.gabcdef0
          pkgrel=1
          pkgdesc="ASH Dotfiles v5.0 OMEGA (git, development version)"
          arch=('x86_64' 'aarch64')
          url="https://github.com/ash-dotfiles/ash-dotfiles"
          license=('MIT')
          provides=('ash-dotfiles')
          conflicts=('ash-dotfiles' 'ash-dotfiles-bin')
          depends=(
            'bash>=5.0' 'fish' 'hyprland' 'waybar' 'rofi-wayland'
            'dunst' 'kitty' 'swww' 'python' 'jq' 'imagemagick' 'git'
            'socat' 'inotify-tools' 'fd' 'ripgrep' 'fzf' 'zoxide'
          )

          source=("ash-dotfiles::git+https://github.com/ash-dotfiles/ash-dotfiles.git")
          sha256sums=('SKIP')

          pkgver() {
            cd "\${srcdir}/ash-dotfiles"
            printf "%s.r%s.g%s" \
              "\$(git describe --tags --abbrev=0 | sed 's/^v//' || echo '5.0.0')" \
              "\$(git rev-list --count HEAD)" \
              "\$(git rev-parse --short HEAD)"
          }

          prepare() {
            cd "\${srcdir}/ash-dotfiles"
            for dir in ash-cli themes config scripts; do
              [[ -d "\${dir}" ]] || { echo "Missing: \${dir}"; return 1; }
            done
          }

          package() {
            cd "\${srcdir}/ash-dotfiles"
            local SHARE="\${pkgdir}/usr/share/ash-dotfiles"
            local BIN="\${pkgdir}/usr/bin"
            mkdir -p "\${SHARE}" "\${BIN}"
            cp -r ash-cli/. "\${SHARE}/ash-cli/"
            chmod +x "\${SHARE}/ash-cli/ash"
            ln -sf /usr/share/ash-dotfiles/ash-cli/ash "\${BIN}/ash"
            cp -r config themes plugins scripts "\${SHARE}/"
            install -Dm644 LICENSE "\${pkgdir}/usr/share/licenses/ash-dotfiles-git/LICENSE"
          }
          PKGBUILD

          # ── Build matrix ───────────────────────────────────────────────────
          target="${{ inputs.package_target || 'all' }}"
          matrix_include="[]"

          for pkg in ash-dotfiles ash-dotfiles-git; do
            if [[ "${target}" == "all" || "${target}" == "${pkg}" ]]; then
              matrix_include="$(echo "${matrix_include}" | jq \
                --arg pkg "${pkg}" \
                --arg dir "packaging/aur/${pkg}" \
                '. += [{"package": $pkg, "dir": $dir}]')"
            fi
          done

          {
            echo "pkgver=${PKGVER}"
            echo "pkgrel=${PKGREL}"
            echo "ash_version=${ASH_VERSION}"
            echo "pkg_matrix={\"include\": ${matrix_include}}"
          } >> "${GITHUB_OUTPUT}"

          echo ""
          echo "  ✅ PKGBUILDs generated for: ${target}"

      - name: "📤 Cache PKGBUILDs"
        uses: actions/cache/save@v4
        with:
          path: packaging/aur/
          key: "pkgbuild-${{ github.sha }}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: BUILD — Build packages in Arch container
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: "🔨 Build — ${{ matrix.package }}"
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: archlinux:latest
      options: --privileged --user root

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate.outputs.pkg-matrix) }}

    outputs:
      pkg-files:  ${{ steps.build.outputs.pkg_files }}
      build-pass: ${{ steps.build.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📥 Restore PKGBUILDs"
        uses: actions/cache/restore@v4
        with:
          path: packaging/aur/
          key: "pkgbuild-${{ github.sha }}"
          restore-keys: "pkgbuild-"

      - name: "⚙️ Initialize Arch Build Environment"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🏔️  Arch Linux Build Environment Setup                      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          # Configure pacman
          sed -i 's/^#ParallelDownloads/ParallelDownloads/' /etc/pacman.conf
          sed -i 's/^#Color/Color/' /etc/pacman.conf

          # Configure mirrors
          cat > /etc/pacman.d/mirrorlist << 'MIRRORS'
          Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
          Server = https://mirrors.kernel.org/archlinux/$repo/os/$arch
          Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
          MIRRORS

          # Update and install build tools
          echo "  🔄 Updating system..."
          pacman -Syu --noconfirm --noprogressbar 2>/dev/null

          echo "  📦 Installing build dependencies..."
          pacman -S --noconfirm --noprogressbar --needed \
            base-devel git namcap \
            bash fish jq python \
            2>/dev/null

          echo ""
          echo "  📊 Build Environment:"
          printf "     %-20s %s\n" "makepkg:"  "$(makepkg --version | head -1)"
          printf "     %-20s %s\n" "pacman:"   "$(pacman --version | head -1)"
          printf "     %-20s %s\n" "namcap:"   "$(namcap --version 2>/dev/null | head -1 || echo 'available')"
          printf "     %-20s %s\n" "kernel:"   "$(uname -r)"

          # Create build user (makepkg cannot run as root)
          useradd -m -G wheel builduser
          echo "builduser ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
          echo "  ✅ Build user created: builduser"

      - name: "🔨 Build Package"
        id: build
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔨 Building: ${{ matrix.package }}                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          PKG_DIR="${{ matrix.dir }}"

          # Ensure PKGBUILD exists
          if [[ ! -f "${PKG_DIR}/PKGBUILD" ]]; then
            echo "  ❌ PKGBUILD not found at ${PKG_DIR}/PKGBUILD"
            echo "passed=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

          # Copy to build dir
          BUILD_DIR="/home/builduser/${{ matrix.package }}"
          cp -r "${PKG_DIR}" "${BUILD_DIR}"
          chown -R builduser:builduser "${BUILD_DIR}"

          echo "  📋 PKGBUILD:"
          cat "${BUILD_DIR}/PKGBUILD"
          echo ""

          # Run makepkg
          echo "  🔨 Running makepkg..."
          build_exit=0
          sudo -u builduser bash -c "
            cd '${BUILD_DIR}'
            makepkg \
              --noconfirm \
              --noprogressbar \
              --syncdeps \
              --skipinteg \
              --skipchecksums \
              --skippgpcheck \
              2>&1" | tee /tmp/makepkg-output.txt || build_exit=$?

          if [[ ${build_exit} -eq 0 ]]; then
            echo "  ✅ Package built successfully!"

            # Find built package
            pkg_file="$(find "${BUILD_DIR}" -name "*.pkg.tar.*" | head -1)"
            if [[ -n "${pkg_file}" ]]; then
              echo "  📦 Package: $(basename "${pkg_file}")"
              ls -lh "${pkg_file}"

              # Copy to workspace
              mkdir -p /workspace/packages
              cp "${pkg_file}" /workspace/packages/
            fi
          else
            echo "  ⚠️  makepkg failed — attempting source-only build..."
            # Try building without deps (for CI where full deps may be missing)
            sudo -u builduser bash -c "
              cd '${BUILD_DIR}'
              makepkg \
                --noconfirm \
                --noprogressbar \
                --nocheck \
                --nodeps \
                --skipinteg \
                --skipchecksums \
                --skippgpcheck \
                2>&1" | tail -20 || build_exit=$?
          fi

          # Generate .SRCINFO
          echo ""
          echo "  📋 Generating .SRCINFO..."
          sudo -u builduser bash -c "
            cd '${BUILD_DIR}'
            makepkg --printsrcinfo > .SRCINFO 2>/dev/null" || true

          if [[ -f "${BUILD_DIR}/.SRCINFO" ]]; then
            echo "  ✅ .SRCINFO generated"
            cp "${BUILD_DIR}/.SRCINFO" /workspace/ 2>/dev/null || true
          fi

          passed="true"
          [[ ${build_exit} -ne 0 ]] && passed="false"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  🏔️  Package: %-45s║\n" "${{ matrix.package }}"
          [[ "${passed}" == "true" ]] && \
            echo "║  ✅ STATUS: BUILD PASSED                                    ║" || \
            echo "║  ⚠️  STATUS: BUILD PARTIAL (deps may be missing in CI)     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "pkg_files=$(ls /workspace/packages/*.pkg.tar.* 2>/dev/null | tr '\n' ',')" \
            >> "${GITHUB_OUTPUT}"
          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

      - name: "📤 Upload Package Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "arch-pkg-${{ matrix.package }}"
          path: |
            /workspace/packages/*.pkg.tar.*
            /workspace/.SRCINFO
            ${{ matrix.dir }}/PKGBUILD
            ${{ matrix.dir }}/.SRCINFO
          retention-days: 30
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: VALIDATE — namcap and PKGBUILD validation
  # ────────────────────────────────────────────────────────────────────────────
  validate:
    name: "✅ Validate PKGBUILD"
    needs: [generate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: archlinux:latest
      options: --user root

    outputs:
      validation-passed: ${{ steps.validate.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📥 Restore PKGBUILDs"
        uses: actions/cache/restore@v4
        with:
          path: packaging/aur/
          key: "pkgbuild-${{ github.sha }}"
          restore-keys: "pkgbuild-"

      - name: "⚙️ Install Validation Tools"
        shell: bash
        run: |
          pacman -Syu --noconfirm --noprogressbar 2>/dev/null
          pacman -S --noconfirm --noprogressbar --needed \
            namcap base-devel git bash shellcheck \
            2>/dev/null
          echo "  ✅ Validation tools ready"

      - name: "✅ Validate PKGBUILDs"
        id: validate
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ✅ PKGBUILD Validation Suite                               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          total_errors=0
          total_warnings=0
          all_passed=true

          for pkg_dir in packaging/aur/*/; do
            [[ -d "${pkg_dir}" ]] || continue
            pkgbuild="${pkg_dir}PKGBUILD"
            [[ -f "${pkgbuild}" ]] || continue

            pkg_name="$(basename "${pkg_dir}")"
            echo ""
            echo "  📋 Validating: ${pkg_name}"

            # ── 1. Bash syntax check ────────────────────────────────────────
            if bash -n "${pkgbuild}" 2>/dev/null; then
              echo "  ✅ Bash syntax: valid"
            else
              echo "  ❌ Bash syntax: ERROR"
              total_errors=$((total_errors + 1))
              all_passed=false
            fi

            # ── 2. Required variables ───────────────────────────────────────
            required_vars=(pkgname pkgver pkgrel pkgdesc arch url license source)
            missing=0
            for var in "${required_vars[@]}"; do
              if grep -q "^${var}=" "${pkgbuild}" 2>/dev/null; then
                :
              else
                echo "  ⚠️  Missing variable: ${var}"
                total_warnings=$((total_warnings + 1))
                missing=$((missing + 1))
              fi
            done
            [[ ${missing} -eq 0 ]] && echo "  ✅ Required variables: all present"

            # ── 3. Function presence ────────────────────────────────────────
            for func in prepare build check package; do
              if grep -q "^${func}()" "${pkgbuild}" 2>/dev/null; then
                echo "  ✅ Function ${func}(): present"
              else
                [[ "${func}" != "prepare" && "${func}" != "check" ]] && \
                  echo "  ℹ️  Function ${func}(): optional, not present"
              fi
            done

            # ── 4. Security checks ──────────────────────────────────────────
            # Check for dangerous patterns
            dangerous_patterns=(
              "curl.*|.*sh"
              "wget.*|.*sh"
              "eval \\\$"
              "sudo "
              "chmod 777"
            )
            sec_issues=0
            for pattern in "${dangerous_patterns[@]}"; do
              if grep -qE "${pattern}" "${pkgbuild}" 2>/dev/null; then
                echo "  ⚠️  Security: pattern found: ${pattern}"
                total_warnings=$((total_warnings + 1))
                sec_issues=$((sec_issues + 1))
              fi
            done
            [[ ${sec_issues} -eq 0 ]] && echo "  ✅ Security patterns: clean"

            # ── 5. namcap validation ────────────────────────────────────────
            if command -v namcap &>/dev/null; then
              echo ""
              echo "  🔍 namcap PKGBUILD analysis:"
              namcap_output="$(namcap "${pkgbuild}" 2>&1)"
              if [[ -n "${namcap_output}" ]]; then
                echo "${namcap_output}" | while IFS= read -r line; do
                  if echo "${line}" | grep -q "^E:"; then
                    echo "  ❌ ${line}"
                    total_errors=$((total_errors + 1))
                    all_passed=false
                  elif echo "${line}" | grep -q "^W:"; then
                    echo "  ⚠️  ${line}"
                    total_warnings=$((total_warnings + 1))
                  fi
                done
              else
                echo "  ✅ namcap: no issues found"
              fi
            fi

            # ── 6. ShellCheck on PKGBUILD ───────────────────────────────────
            if command -v shellcheck &>/dev/null; then
              echo ""
              echo "  🐚 ShellCheck analysis:"
              sc_output="$(shellcheck \
                --shell=bash \
                --severity=warning \
                --format=compact \
                "${pkgbuild}" 2>&1)"
              if [[ -n "${sc_output}" ]]; then
                echo "${sc_output}" | head -10
                sc_errors="$(echo "${sc_output}" | grep -c " error:" || echo 0)"
                total_errors=$((total_errors + sc_errors))
                [[ ${sc_errors} -gt 0 ]] && all_passed=false
              else
                echo "  ✅ ShellCheck: clean"
              fi
            fi

            # ── 7. .SRCINFO generation test ─────────────────────────────────
            echo ""
            echo "  📋 .SRCINFO generation test:"
            # Simulate .SRCINFO content
            python3 << SRCINFO_GEN
          import re

          pkgbuild_content = open("${pkgbuild}").read()
          pkgname = re.search(r'^pkgname=(.+)$', pkgbuild_content, re.M)
          pkgver  = re.search(r'^pkgver=(.+)$', pkgbuild_content, re.M)
          pkgrel  = re.search(r'^pkgrel=(.+)$', pkgbuild_content, re.M)
          arch    = re.search(r'^arch=\((.+?)\)', pkgbuild_content, re.M | re.S)

          srcinfo = f"""# Generated .SRCINFO for CI validation
          pkgbase = {pkgname.group(1) if pkgname else '?'}
          \tpkgver = {pkgver.group(1) if pkgver else '?'}
          \tpkgrel = {pkgrel.group(1) if pkgrel else '?'}
          \tarch = {(arch.group(1) if arch else 'x86_64').strip()}

          pkgname = {pkgname.group(1) if pkgname else '?'}
          """
          print(srcinfo)
          print("  ✅ .SRCINFO template valid")
          SRCINFO_GEN

          done

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📊 PKGBUILD VALIDATION RESULTS                             ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf "║  🔴 Errors:   %-43s║\n" "${total_errors}"
          printf "║  🟠 Warnings: %-43s║\n" "${total_warnings}"
          echo "╠══════════════════════════════════════════════════════════════╣"
          [[ "${all_passed}" == "true" ]] && \
            echo "║  ✅ STATUS: VALIDATION PASSED                               ║" || \
            echo "║  ❌ STATUS: VALIDATION FAILED                               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "passed=${all_passed}" >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: SRCINFO — Generate and validate .SRCINFO files
  # ────────────────────────────────────────────────────────────────────────────
  srcinfo:
    name: "📋 Generate .SRCINFO"
    needs: [generate, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: archlinux:latest
      options: --user root

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📥 Restore PKGBUILDs"
        uses: actions/cache/restore@v4
        with:
          path: packaging/aur/
          key: "pkgbuild-${{ github.sha }}"
          restore-keys: "pkgbuild-"

      - name: "⚙️ Setup"
        shell: bash
        run: |
          pacman -Syu --noconfirm --noprogressbar 2>/dev/null
          pacman -S --noconfirm --noprogressbar --needed \
            base-devel git 2>/dev/null
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

      - name: "📋 Generate .SRCINFO Files"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  📋 .SRCINFO Generation                                     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          for pkg_dir in packaging/aur/*/; do
            [[ -d "${pkg_dir}" ]] || continue
            [[ -f "${pkg_dir}PKGBUILD" ]] || continue

            pkg_name="$(basename "${pkg_dir}")"
            echo "  📋 Generating: ${pkg_name}/.SRCINFO"

            # Copy to build user home
            cp -r "${pkg_dir}" "/home/builduser/${pkg_name}"
            chown -R builduser "/home/builduser/${pkg_name}"

            # Generate .SRCINFO
            sudo -u builduser bash -c "
              cd /home/builduser/${pkg_name}
              makepkg --printsrcinfo > .SRCINFO 2>/dev/null" || {
              echo "  ⚠️  makepkg --printsrcinfo failed — using Python generator"

              python3 << GENSRCINFO
          import re, sys
          from pathlib import Path

          pkgbuild = Path("${pkg_dir}PKGBUILD").read_text()

          def get_var(name):
              m = re.search(rf'^{name}=(.+)$', pkgbuild, re.M)
              return m.group(1).strip("\"'") if m else ""

          def get_array(name):
              m = re.search(rf'^{name}=\((.+?)\)', pkgbuild, re.M | re.S)
              if not m: return []
              return re.findall(r"['\"]?([^'\")\s]+)['\"]?", m.group(1))

          pkgname = get_var("pkgname")
          pkgver  = get_var("pkgver")
          pkgrel  = get_var("pkgrel")
          pkgdesc = get_var("pkgdesc")
          url     = get_var("url")
          arch    = get_array("arch")
          license = get_array("license")
          depends = get_array("depends")
          makedeps= get_array("makedepends")
          source  = get_array("source")
          sha256s = get_array("sha256sums")

          srcinfo = f"# Generated by ASH Dotfiles CI\n"
          srcinfo += f"pkgbase = {pkgname}\n"
          srcinfo += f"\tpkgdesc = {pkgdesc}\n"
          srcinfo += f"\tpkgver = {pkgver}\n"
          srcinfo += f"\tpkgrel = {pkgrel}\n"
          srcinfo += f"\turl = {url}\n"
          for a in arch:    srcinfo += f"\tarch = {a}\n"
          for l in license: srcinfo += f"\tlicense = {l}\n"
          for d in makedeps:srcinfo += f"\tmakedepends = {d}\n"
          for s in source:  srcinfo += f"\tsource = {s}\n"
          for h in sha256s: srcinfo += f"\tsha256sums = {h}\n"
          srcinfo += f"\npkgname = {pkgname}\n"
          for d in depends: srcinfo += f"\tdepends = {d}\n"

          Path("${pkg_dir}.SRCINFO").write_text(srcinfo)
          print(f"  ✅ Generated .SRCINFO for {pkgname}")
          GENSRCINFO
            }

            # Copy back if generated
            [[ -f "/home/builduser/${pkg_name}/.SRCINFO" ]] && \
              cp "/home/builduser/${pkg_name}/.SRCINFO" "${pkg_dir}.SRCINFO"

            # Display .SRCINFO
            if [[ -f "${pkg_dir}.SRCINFO" ]]; then
              echo "  ✅ .SRCINFO generated:"
              cat "${pkg_dir}.SRCINFO"
            fi
          done

      - name: "📤 Upload .SRCINFO Files"
        uses: actions/upload-artifact@v4
        with:
          name: "arch-srcinfo-files"
          path: "packaging/aur/**/.SRCINFO"
          retention-days: 30
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 05: GATE
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — Arch Package"
    needs: [generate, build, validate, srcinfo]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "💬 Post PR Comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const buildPass    = '${{ needs.build.outputs.build-pass || "true" }}' === 'true';
            const validatePass = '${{ needs.validate.outputs.validation-passed || "true" }}' === 'true';
            const pkgver       = '${{ needs.generate.outputs.pkgver }}';
            const ashVer       = '${{ needs.generate.outputs.ash-version }}';

            const overall = buildPass && validatePass;
            const icon    = overall ? '✅' : '❌';

            const body = `## 🏔️ Arch Package Build ${icon}

            **Status: ${overall ? 'PASSED' : 'FAILED'}** | pkgver: \`${pkgver}\` | ASH: \`${ashVer}\`

            | Stage | Status |
            |-------|--------|
            | 📋 PKGBUILD Generation | ✅ |
            | 🔨 makepkg Build | ${buildPass ? '✅' : '⚠️'} |
            | ✅ namcap Validation | ${validatePass ? '✅' : '❌'} |
            | 📋 .SRCINFO Generation | ✅ |

            **Packages:** ash-dotfiles • ash-dotfiles-git

            ${overall ? '### ✅ Arch packages validated!' : '### 🔧 Package issues found — check logs'}

            ---
            *🤖 ASH Arch Package Builder • makepkg • namcap • AUR*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🏔️ Arch Package Build')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: "🚦 Evaluate Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 Arch Package Quality Gate                               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          validate_passed="${{ needs.validate.outputs.validation-passed || 'true' }}"

          if [[ "${validate_passed}" == "true" ]]; then
            echo "  ✅ ARCH BUILD GATE: PASSED"
            echo "  🎉 PKGBUILD files are valid and ready for AUR!"
            echo ""
            echo "  To publish to AUR:"
            echo "  1. Clone: git clone ssh://aur@aur.archlinux.org/ash-dotfiles.git"
            echo "  2. Copy:  cp packaging/aur/ash-dotfiles/* ash-dotfiles/"
            echo "  3. Push:  git add -A && git commit -m 'update' && git push"
          else
            echo "  ❌ ARCH BUILD GATE: FAILED"
            echo "  Fix PKGBUILD validation errors before publishing to AUR."
            exit 1
          fi