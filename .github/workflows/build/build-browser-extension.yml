# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║      🧩 ASH DOTFILES v5.0 OMEGA — BROWSER EXTENSION BUILD WORKFLOW                    ║
# ║                                                                                          ║
# ║      Ultra-Premium Cross-Browser Extension Build, Test & Publish Pipeline              ║
# ║      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━  ║
# ║      Manifest V3           •  Chrome + Firefox     •  Edge + Safari                  ║
# ║      TypeScript Build      •  Vite Bundler         •  Extension APIs                ║
# ║      Security Audit        •  Permission Audit     •  CSP Validation               ║
# ║      Chrome Web Store      •  Firefox Add-ons      •  CRXMAKE                     ║
# ║      Web-ext Lint          •  Playwright Tests     •  Bundle Size SLA             ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝

name: "🧩 Browser Extension — Build, Test & Publish"

# ══════════════════════════════════════════════════════════════════════════════
# TRIGGER CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
on:
  push:
    branches: [main, develop, "release/**"]
    paths:
      - "browser-extension/**"
      - ".github/workflows/build/build-browser-extension.yml"
    tags:
      - "v*.*.*"

  pull_request:
    branches: [main, develop]
    paths:
      - "browser-extension/**"
      - ".github/workflows/build/build-browser-extension.yml"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:
    inputs:
      target_browsers:
        description: "Target browsers"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - chrome
          - firefox
          - edge
      publish_chrome:
        description: "Publish to Chrome Web Store"
        required: false
        default: false
        type: boolean
      publish_firefox:
        description: "Publish to Firefox Add-ons"
        required: false
        default: false
        type: boolean
      run_e2e:
        description: "Run Playwright E2E tests"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "0 15 * * 4"

# ══════════════════════════════════════════════════════════════════════════════
# PERMISSIONS
# ══════════════════════════════════════════════════════════════════════════════
permissions:
  contents: read
  pull-requests: write
  checks: write

# ══════════════════════════════════════════════════════════════════════════════
# CONCURRENCY
# ══════════════════════════════════════════════════════════════════════════════
concurrency:
  group: "browser-ext-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════════════════
# GLOBAL ENV
# ══════════════════════════════════════════════════════════════════════════════
env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  EXT_DIR: "browser-extension"
  MAX_BUNDLE_SIZE_KB: "512"
  EXTENSION_ID_CHROME: "placeholder-chrome-ext-id"
  EXTENSION_ID_FIREFOX: "ash-dotfiles@ash-dotfiles.dev"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 01: GENERATE — Create extension project
  # ────────────────────────────────────────────────────────────────────────────
  generate:
    name: "⚙️ Generate Extension Project"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      has-extension: ${{ steps.gen.outputs.has_extension }}
      ext-version:   ${{ steps.gen.outputs.ext_version }}
      pkg-hash:      ${{ steps.gen.outputs.pkg_hash }}
      browser-matrix: ${{ steps.gen.outputs.browser_matrix }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "⚙️ Generate Browser Extension Project"
        id: gen
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🧩 Browser Extension Project Generator                     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          has_extension="false"
          [[ -d "browser-extension" && -f "browser-extension/manifest.json" ]] && \
            has_extension="true"

          if [[ "${has_extension}" == "false" ]]; then
            echo "  ℹ️  Generating browser extension scaffold..."
            mkdir -p browser-extension/src/{background,popup,content,options,components,lib}
            mkdir -p browser-extension/assets/{icons,images}
            mkdir -p browser-extension/public

            # ── Generate manifest.json (MV3) ───────────────────────────────
            cat > browser-extension/manifest.json << 'MANIFEST'
          {
            "manifest_version": 3,
            "name": "ASH Dotfiles",
            "version": "5.0.0",
            "description": "ASH Dotfiles v5.0 OMEGA — Remote desktop control, theme switching and status monitoring from your browser.",
            "author": "ASH Dotfiles Team",
            "homepage_url": "https://ash-dotfiles.github.io",

            "permissions": [
              "storage",
              "notifications",
              "alarms",
              "tabs"
            ],

            "host_permissions": [
              "http://localhost:7070/*",
              "http://127.0.0.1:7070/*"
            ],

            "background": {
              "service_worker": "background.js",
              "type": "module"
            },

            "action": {
              "default_popup": "popup.html",
              "default_title": "ASH Dotfiles",
              "default_icon": {
                "16":  "assets/icons/icon-16.png",
                "32":  "assets/icons/icon-32.png",
                "48":  "assets/icons/icon-48.png",
                "128": "assets/icons/icon-128.png"
              }
            },

            "options_page": "options.html",

            "icons": {
              "16":  "assets/icons/icon-16.png",
              "32":  "assets/icons/icon-32.png",
              "48":  "assets/icons/icon-48.png",
              "128": "assets/icons/icon-128.png"
            },

            "content_scripts": [
              {
                "matches": ["<all_urls>"],
                "js": ["content.js"],
                "run_at": "document_idle"
              }
            ],

            "web_accessible_resources": [
              {
                "resources": ["assets/icons/*", "assets/images/*"],
                "matches": ["<all_urls>"]
              }
            ],

            "content_security_policy": {
              "extension_pages": "script-src 'self'; object-src 'self'; style-src 'self' 'unsafe-inline';"
            },

            "commands": {
              "open-popup": {
                "suggested_key": {
                  "default": "Ctrl+Shift+A",
                  "mac": "Command+Shift+A"
                },
                "description": "Open ASH Dotfiles popup"
              },
              "quick-theme": {
                "suggested_key": {
                  "default": "Ctrl+Shift+T",
                  "mac": "Command+Shift+T"
                },
                "description": "Quick theme switcher"
              }
            }
          }
          MANIFEST

            # ── Generate package.json ──────────────────────────────────────
            cat > browser-extension/package.json << 'PKGJSON'
          {
            "name": "ash-dotfiles-extension",
            "version": "5.0.0",
            "private": true,
            "type": "module",
            "scripts": {
              "dev":          "vite build --watch --mode development",
              "build":        "vite build",
              "build:chrome": "vite build --mode chrome",
              "build:firefox":"vite build --mode firefox",
              "build:edge":   "vite build --mode edge",
              "test":         "vitest run",
              "test:e2e":     "playwright test",
              "lint":         "eslint src --ext ts,tsx",
              "lint:ext":     "web-ext lint --source-dir dist",
              "type-check":   "tsc --noEmit",
              "package:chrome":  "web-ext build --source-dir dist/chrome --artifacts-dir packages",
              "package:firefox": "web-ext build --source-dir dist/firefox --artifacts-dir packages",
              "sign:firefox":    "web-ext sign --source-dir dist/firefox"
            },
            "dependencies": {
              "react":     "^18.3.1",
              "react-dom": "^18.3.1",
              "zustand":   "^4.5.5",
              "clsx":      "^2.1.1"
            },
            "devDependencies": {
              "@types/chrome":          "^0.0.270",
              "@types/firefox-webext-browser": "^120.0.0",
              "@types/react":           "^18.3.10",
              "@types/react-dom":       "^18.3.0",
              "@vitejs/plugin-react":   "^4.3.2",
              "typescript":             "^5.6.3",
              "vite":                   "^5.4.8",
              "typescript-eslint":      "^8.8.1",
              "eslint":                 "^9.11.1",
              "vitest":                 "^2.1.3",
              "@vitest/ui":             "^2.1.3",
              "@testing-library/react": "^16.0.1",
              "@playwright/test":       "^1.48.1",
              "web-ext":                "^8.3.0",
              "archiver":               "^7.0.1",
              "crx3":                   "^0.7.2"
            }
          }
          PKGJSON

            # ── Generate vite.config.ts ────────────────────────────────────
            cat > browser-extension/vite.config.ts << 'VITECONFIG'
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";
          import { resolve, join } from "path";
          import { readFileSync, writeFileSync, mkdirSync } from "fs";

          // Extension targets
          const targets = {
            chrome:  { outDir: "dist/chrome",  mv3: true  },
            firefox: { outDir: "dist/firefox", mv3: true  },
            edge:    { outDir: "dist/edge",    mv3: true  },
          };

          const target = (process.env.BROWSER as keyof typeof targets) || "chrome";
          const config = targets[target] || targets.chrome;

          export default defineConfig({
            plugins: [
              react(),
              // Copy manifest.json with browser-specific patches
              {
                name: "copy-extension-files",
                closeBundle() {
                  const manifest = JSON.parse(
                    readFileSync("manifest.json", "utf-8")
                  );

                  // Firefox patches
                  if (target === "firefox") {
                    manifest.browser_specific_settings = {
                      gecko: {
                        id: "ash-dotfiles@ash-dotfiles.dev",
                        strict_min_version: "109.0",
                      },
                    };
                    delete manifest.background.type;
                  }

                  mkdirSync(config.outDir, { recursive: true });
                  writeFileSync(
                    join(config.outDir, "manifest.json"),
                    JSON.stringify(manifest, null, 2)
                  );
                },
              },
            ],

            resolve: {
              alias: { "@": resolve(__dirname, "src") },
            },

            build: {
              outDir: config.outDir,
              emptyOutDir: true,
              sourcemap: process.env.NODE_ENV === "development",
              rollupOptions: {
                input: {
                  background: resolve(__dirname, "src/background/index.ts"),
                  popup:      resolve(__dirname, "src/popup/index.tsx"),
                  content:    resolve(__dirname, "src/content/index.ts"),
                  options:    resolve(__dirname, "src/options/index.tsx"),
                },
                output: {
                  entryFileNames: "[name].js",
                  chunkFileNames: "chunks/[name].js",
                  assetFileNames: "assets/[name].[ext]",
                },
              },
              chunkSizeWarningLimit: 512,
            },
          });
          VITECONFIG

            # ── Generate background service worker ─────────────────────────
            cat > browser-extension/src/background/index.ts << 'BACKGROUND'
          // ╔══════════════════════════════════════════════════════════════════╗
          // ║  ASH Dotfiles Extension — Background Service Worker            ║
          // ╚══════════════════════════════════════════════════════════════════╝

          import { AshApiClient } from "@/lib/api-client";
          import { storage }      from "@/lib/storage";
          import { notify }        from "@/lib/notifications";

          const API_POLL_INTERVAL_MS = 30_000; // 30 seconds

          // ── State ───────────────────────────────────────────────────────────
          let currentTheme  = "catppuccin-mocha";
          let currentMode   = "default";
          let isConnected   = false;
          let pollAlarmName = "ash-poll";

          // ── Initialize ──────────────────────────────────────────────────────
          chrome.runtime.onInstalled.addListener(async ({ reason }) => {
            console.log(`[ASH Extension] Installed: ${reason}`);

            await storage.set("settings", {
              apiUrl:              "http://localhost:7070",
              token:               "",
              pollInterval:        30,
              notificationsEnabled:true,
              theme:               "catppuccin-mocha",
            });

            setupAlarms();
          });

          chrome.runtime.onStartup.addListener(() => {
            setupAlarms();
            pollAshStatus();
          });

          // ── Alarm management ────────────────────────────────────────────────
          function setupAlarms(): void {
            chrome.alarms.create(pollAlarmName, {
              periodInMinutes: API_POLL_INTERVAL_MS / 60_000,
            });
          }

          chrome.alarms.onAlarm.addListener((alarm) => {
            if (alarm.name === pollAlarmName) {
              pollAshStatus();
            }
          });

          // ── ASH API polling ─────────────────────────────────────────────────
          async function pollAshStatus(): Promise<void> {
            try {
              const settings = await storage.get("settings");
              if (!settings?.apiUrl || !settings?.token) return;

              const client = new AshApiClient(settings.apiUrl, settings.token);
              const health = await client.getHealth();

              if (health.status === "healthy") {
                isConnected = true;

                const [themes, mode] = await Promise.all([
                  client.getThemes(),
                  client.getMode(),
                ]);

                const newTheme = themes.active;
                const newMode  = mode.current;

                // Detect changes
                if (newTheme !== currentTheme) {
                  currentTheme = newTheme;
                  await storage.set("currentTheme", newTheme);

                  if (settings.notificationsEnabled) {
                    await notify({
                      title:   "🎨 Theme Changed",
                      message: `Active: ${newTheme}`,
                      iconUrl: chrome.runtime.getURL("assets/icons/icon-48.png"),
                    });
                  }

                  // Broadcast to popup/content scripts
                  chrome.runtime.sendMessage({
                    type:  "THEME_CHANGED",
                    theme: newTheme,
                  }).catch(() => {});
                }

                if (newMode !== currentMode) {
                  currentMode = newMode;
                  await storage.set("currentMode", newMode);
                  chrome.runtime.sendMessage({
                    type: "MODE_CHANGED",
                    mode: newMode,
                  }).catch(() => {});
                }
              }

            } catch (error) {
              isConnected = false;
              console.warn("[ASH Extension] Poll error:", error);
            }

            // Update badge
            await updateBadge();
          }

          async function updateBadge(): Promise<void> {
            if (isConnected) {
              chrome.action.setBadgeText({ text: "●" });
              chrome.action.setBadgeBackgroundColor({ color: "#a6e3a1" });
              chrome.action.setTitle({ title: `ASH Dotfiles — ${currentTheme}` });
            } else {
              chrome.action.setBadgeText({ text: "×" });
              chrome.action.setBadgeBackgroundColor({ color: "#f38ba8" });
              chrome.action.setTitle({ title: "ASH Dotfiles — Disconnected" });
            }
          }

          // ── Message handling ────────────────────────────────────────────────
          chrome.runtime.onMessage.addListener((message, _sender, sendResponse) => {
            (async () => {
              switch (message.type) {
                case "GET_STATUS":
                  sendResponse({ isConnected, currentTheme, currentMode });
                  break;

                case "APPLY_THEME": {
                  const settings = await storage.get("settings");
                  if (!settings?.token) { sendResponse({ error: "Not configured" }); break; }
                  const client = new AshApiClient(settings.apiUrl, settings.token);
                  const result = await client.applyTheme(message.themeId);
                  currentTheme = message.themeId;
                  sendResponse({ success: true, result });
                  break;
                }

                case "SET_MODE": {
                  const settings = await storage.get("settings");
                  if (!settings?.token) { sendResponse({ error: "Not configured" }); break; }
                  const client = new AshApiClient(settings.apiUrl, settings.token);
                  await client.setMode(message.mode);
                  currentMode = message.mode;
                  sendResponse({ success: true });
                  break;
                }

                case "POLL_NOW":
                  await pollAshStatus();
                  sendResponse({ success: true });
                  break;

                default:
                  sendResponse({ error: "Unknown message type" });
              }
            })();
            return true; // async response
          });

          // ── Keyboard commands ───────────────────────────────────────────────
          chrome.commands.onCommand.addListener(async (command) => {
            if (command === "open-popup") {
              chrome.action.openPopup().catch(() => {});
            } else if (command === "quick-theme") {
              chrome.action.openPopup().catch(() => {});
            }
          });

          // Initial poll
          pollAshStatus();
          BACKGROUND

            # ── Generate API client library ────────────────────────────────
            cat > browser-extension/src/lib/api-client.ts << 'APICLIENT'
          // ASH Dotfiles Extension — API Client

          export interface AshHealth {
            status:     string;
            version:    string;
            components: Record<string, string>;
          }

          export interface AshThemes {
            data:   Array<{ id: string; name: string; category: string }>;
            active: string;
            total:  number;
          }

          export interface AshMode {
            current:   string;
            available: string[];
          }

          export class AshApiClient {
            private baseUrl: string;
            private token:   string;
            private timeout: number;

            constructor(baseUrl: string, token: string, timeout = 5_000) {
              this.baseUrl = baseUrl.replace(/\/$/, "");
              this.token   = token;
              this.timeout = timeout;
            }

            private async fetch<T>(
              path:    string,
              options: RequestInit = {}
            ): Promise<T> {
              const controller = new AbortController();
              const timer      = setTimeout(() => controller.abort(), this.timeout);

              try {
                const res = await fetch(`${this.baseUrl}${path}`, {
                  ...options,
                  signal:  controller.signal,
                  headers: {
                    "Content-Type":  "application/json",
                    "Authorization": `Bearer ${this.token}`,
                    ...options.headers,
                  },
                });

                if (!res.ok) {
                  const err = await res.json().catch(() => ({}));
                  throw new Error(
                    `ASH API Error ${res.status}: ${(err as any).detail?.message ?? res.statusText}`
                  );
                }

                return res.json() as Promise<T>;
              } finally {
                clearTimeout(timer);
              }
            }

            async getHealth():                    Promise<AshHealth>  { return this.fetch("/api/v1/health"); }
            async getThemes():                    Promise<AshThemes>  { return this.fetch("/api/v1/themes"); }
            async getMode():                      Promise<AshMode>    { return this.fetch("/api/v1/mode"); }
            async applyTheme(id: string):         Promise<unknown>    { return this.fetch(`/api/v1/themes/${id}/apply`, { method: "POST", body: "{}" }); }
            async setMode(mode: string):          Promise<unknown>    { return this.fetch("/api/v1/mode", { method: "POST", body: JSON.stringify({ mode }) }); }
            async getPlugins():                   Promise<unknown>    { return this.fetch("/api/v1/plugins"); }
            async getAnalytics():                 Promise<unknown>    { return this.fetch("/api/v1/analytics"); }
          }
          APICLIENT

            # ── Generate storage library ───────────────────────────────────
            cat > browser-extension/src/lib/storage.ts << 'STORAGE'
          // ASH Dotfiles Extension — Chrome Storage Wrapper

          type StorageKey =
            | "settings"
            | "currentTheme"
            | "currentMode"
            | "favorites"
            | "history";

          interface Settings {
            apiUrl:               string;
            token:                string;
            pollInterval:         number;
            notificationsEnabled: boolean;
            theme:                string;
          }

          type StorageValue = Settings | string | string[];

          export const storage = {
            async get<T extends StorageValue>(key: StorageKey): Promise<T | null> {
              return new Promise((resolve) => {
                chrome.storage.local.get(key, (result) => {
                  resolve((result[key] as T) ?? null);
                });
              });
            },

            async set(key: StorageKey, value: StorageValue): Promise<void> {
              return new Promise((resolve, reject) => {
                chrome.storage.local.set({ [key]: value }, () => {
                  if (chrome.runtime.lastError) reject(chrome.runtime.lastError);
                  else resolve();
                });
              });
            },

            async remove(key: StorageKey): Promise<void> {
              return new Promise((resolve) => {
                chrome.storage.local.remove(key, () => resolve());
              });
            },

            async clear(): Promise<void> {
              return new Promise((resolve) => {
                chrome.storage.local.clear(() => resolve());
              });
            },
          };
          STORAGE

            # ── Generate notifications library ─────────────────────────────
            cat > browser-extension/src/lib/notifications.ts << 'NOTIFICATIONS'
          // ASH Dotfiles Extension — Notification Utilities

          interface NotifyOptions {
            title:   string;
            message: string;
            iconUrl?: string;
            duration?: number;
          }

          export async function notify({
            title,
            message,
            iconUrl = chrome.runtime.getURL("assets/icons/icon-48.png"),
            duration = 4_000,
          }: NotifyOptions): Promise<void> {
            const id = `ash-${Date.now()}`;

            chrome.notifications.create(id, {
              type:     "basic",
              iconUrl,
              title,
              message,
            });

            if (duration > 0) {
              setTimeout(() => {
                chrome.notifications.clear(id);
              }, duration);
            }
          }
          NOTIFICATIONS

            # ── Generate popup React component ─────────────────────────────
            cat > browser-extension/src/popup/index.tsx << 'POPUP'
          import React, { useState, useEffect, useCallback } from "react";
          import { createRoot } from "react-dom/client";

          interface AshStatus {
            isConnected:  boolean;
            currentTheme: string;
            currentMode:  string;
          }

          interface Theme {
            id:   string;
            name: string;
          }

          const ASH_PURPLE = "#cba6f7";
          const ASH_BG     = "#1e1e2e";
          const ASH_SURF   = "#313244";
          const ASH_TEXT   = "#cdd6f4";
          const ASH_MUTED  = "#585b70";
          const ASH_GREEN  = "#a6e3a1";
          const ASH_RED    = "#f38ba8";
          const ASH_BLUE   = "#89b4fa";

          const MODES = ["default","game","work","focus","cinema","battery"] as const;

          function AshPopup() {
            const [status,   setStatus]   = useState<AshStatus | null>(null);
            const [themes,   setThemes]   = useState<Theme[]>([]);
            const [loading,  setLoading]  = useState(true);
            const [applying, setApplying] = useState<string | null>(null);
            const [search,   setSearch]   = useState("");

            const getStatus = useCallback(async () => {
              try {
                const res = await chrome.runtime.sendMessage({ type: "GET_STATUS" });
                setStatus(res);
              } catch {
                setStatus({ isConnected: false, currentTheme: "—", currentMode: "—" });
              }
            }, []);

            useEffect(() => {
              Promise.all([
                getStatus(),
                chrome.runtime.sendMessage({ type: "GET_STATUS" })
                  .then((s) => s.isConnected
                    ? chrome.runtime.sendMessage({ type: "GET_THEMES" })
                        .catch(() => ({ data: [] }))
                    : { data: [] }
                  )
                  .then((t: { data?: Theme[] }) => setThemes(t.data ?? []))
                  .catch(() => {}),
              ]).finally(() => setLoading(false));
            }, [getStatus]);

            const applyTheme = async (themeId: string) => {
              setApplying(themeId);
              try {
                await chrome.runtime.sendMessage({ type: "APPLY_THEME", themeId });
                setStatus(prev => prev ? { ...prev, currentTheme: themeId } : null);
              } finally {
                setApplying(null);
              }
            };

            const setMode = async (mode: string) => {
              await chrome.runtime.sendMessage({ type: "SET_MODE", mode });
              setStatus(prev => prev ? { ...prev, currentMode: mode } : null);
            };

            const filteredThemes = themes.filter(t =>
              !search || t.name.toLowerCase().includes(search.toLowerCase())
            ).slice(0, 12);

            return (
              <div style={{
                width:      "360px",
                minHeight:  "480px",
                background: ASH_BG,
                color:      ASH_TEXT,
                fontFamily: '"Inter", system-ui, sans-serif',
                fontSize:   "13px",
              }}>
                {/* ── Header ─── */}
                <div style={{
                  background:  ASH_SURF,
                  padding:     "12px 16px",
                  display:     "flex",
                  alignItems:  "center",
                  gap:         "10px",
                  borderBottom:`1px solid ${ASH_MUTED}44`,
                }}>
                  <div style={{
                    width:        "8px",
                    height:       "8px",
                    borderRadius: "50%",
                    background:   status?.isConnected ? ASH_GREEN : ASH_RED,
                    boxShadow:    status?.isConnected
                      ? `0 0 6px ${ASH_GREEN}`
                      : `0 0 6px ${ASH_RED}`,
                  }} />
                  <span style={{ fontWeight: 700, color: ASH_PURPLE, fontSize: "14px" }}>
                    ⚡ ASH Dotfiles
                  </span>
                  <span style={{ marginLeft: "auto", color: ASH_MUTED, fontSize: "11px" }}>
                    v5.0 OMEGA
                  </span>
                </div>

                {loading ? (
                  <div style={{ padding: "40px", textAlign: "center", color: ASH_MUTED }}>
                    <div style={{ fontSize: "24px", marginBottom: "8px" }}>⚡</div>
                    <div>Connecting to ASH...</div>
                  </div>
                ) : (
                  <>
                    {/* ── Status ─── */}
                    <div style={{ padding: "12px 16px", background: `${ASH_SURF}88` }}>
                      <div style={{ display: "flex", gap: "16px" }}>
                        <div>
                          <div style={{ color: ASH_MUTED, fontSize: "10px", marginBottom: "2px" }}>
                            THEME
                          </div>
                          <div style={{ color: ASH_PURPLE, fontWeight: 600 }}>
                            {status?.currentTheme || "—"}
                          </div>
                        </div>
                        <div>
                          <div style={{ color: ASH_MUTED, fontSize: "10px", marginBottom: "2px" }}>
                            MODE
                          </div>
                          <div style={{ color: ASH_BLUE, fontWeight: 600 }}>
                            {status?.currentMode || "—"}
                          </div>
                        </div>
                        <button
                          onClick={() => chrome.runtime.sendMessage({ type: "POLL_NOW" }).then(getStatus)}
                          style={{
                            marginLeft:  "auto",
                            background:  "transparent",
                            border:      `1px solid ${ASH_MUTED}44`,
                            borderRadius:"6px",
                            color:       ASH_MUTED,
                            cursor:      "pointer",
                            padding:     "4px 8px",
                            fontSize:    "11px",
                          }}
                        >
                          🔄
                        </button>
                      </div>
                    </div>

                    {/* ── Mode selector ─── */}
                    <div style={{ padding: "10px 16px", borderBottom: `1px solid ${ASH_MUTED}22` }}>
                      <div style={{ color: ASH_MUTED, fontSize: "10px", marginBottom: "6px" }}>
                        QUICK MODES
                      </div>
                      <div style={{ display: "flex", flexWrap: "wrap", gap: "4px" }}>
                        {MODES.map(mode => (
                          <button
                            key={mode}
                            onClick={() => setMode(mode)}
                            style={{
                              padding:     "3px 8px",
                              borderRadius:"12px",
                              border:      "1px solid",
                              borderColor: status?.currentMode === mode
                                ? ASH_PURPLE : `${ASH_MUTED}44`,
                              background:  status?.currentMode === mode
                                ? `${ASH_PURPLE}22` : "transparent",
                              color:       status?.currentMode === mode
                                ? ASH_PURPLE : ASH_MUTED,
                              cursor:      "pointer",
                              fontSize:    "11px",
                              transition:  "all 0.2s",
                            }}
                          >
                            {mode}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* ── Theme search ─── */}
                    <div style={{ padding: "10px 16px 6px" }}>
                      <input
                        type="text"
                        placeholder="🔍 Search themes..."
                        value={search}
                        onChange={e => setSearch(e.target.value)}
                        style={{
                          width:        "100%",
                          background:   ASH_SURF,
                          border:       `1px solid ${ASH_MUTED}44`,
                          borderRadius: "8px",
                          padding:      "6px 10px",
                          color:        ASH_TEXT,
                          fontSize:     "12px",
                          outline:      "none",
                          boxSizing:    "border-box",
                        }}
                      />
                    </div>

                    {/* ── Theme grid ─── */}
                    <div style={{
                      padding:   "6px 16px 16px",
                      maxHeight: "220px",
                      overflowY: "auto",
                    }}>
                      {filteredThemes.length === 0 ? (
                        <div style={{ color: ASH_MUTED, textAlign: "center", padding: "20px" }}>
                          {status?.isConnected
                            ? "No themes found"
                            : "Connect ASH API to browse themes"}
                        </div>
                      ) : (
                        <div style={{
                          display:             "grid",
                          gridTemplateColumns: "1fr 1fr",
                          gap:                 "6px",
                        }}>
                          {filteredThemes.map(theme => (
                            <button
                              key={theme.id}
                              onClick={() => applyTheme(theme.id)}
                              disabled={applying === theme.id}
                              style={{
                                padding:      "8px",
                                background:   status?.currentTheme === theme.id
                                  ? `${ASH_PURPLE}22`
                                  : ASH_SURF,
                                border:       "1px solid",
                                borderColor:  status?.currentTheme === theme.id
                                  ? ASH_PURPLE : `${ASH_MUTED}33`,
                                borderRadius: "8px",
                                color:        status?.currentTheme === theme.id
                                  ? ASH_PURPLE : ASH_TEXT,
                                cursor:       applying ? "wait" : "pointer",
                                fontSize:     "11px",
                                fontWeight:   600,
                                textAlign:    "left",
                                transition:   "all 0.15s",
                                opacity:      applying && applying !== theme.id ? 0.5 : 1,
                              }}
                            >
                              {applying === theme.id ? "⏳" : "🎨"} {theme.name}
                            </button>
                          ))}
                        </div>
                      )}
                    </div>

                    {/* ── Footer ─── */}
                    <div style={{
                      padding:    "8px 16px",
                      borderTop:  `1px solid ${ASH_MUTED}22`,
                      display:    "flex",
                      gap:        "8px",
                    }}>
                      <button
                        onClick={() => chrome.runtime.openOptionsPage()}
                        style={{
                          flex:        1,
                          background:  "transparent",
                          border:      `1px solid ${ASH_MUTED}44`,
                          borderRadius:"6px",
                          color:       ASH_MUTED,
                          cursor:      "pointer",
                          padding:     "6px",
                          fontSize:    "11px",
                        }}
                      >
                        ⚙️ Settings
                      </button>
                      <button
                        onClick={() => chrome.tabs.create({ url: "https://ash-dotfiles.github.io" })}
                        style={{
                          flex:        1,
                          background:  "transparent",
                          border:      `1px solid ${ASH_MUTED}44`,
                          borderRadius:"6px",
                          color:       ASH_MUTED,
                          cursor:      "pointer",
                          padding:     "6px",
                          fontSize:    "11px",
                        }}
                      >
                        📖 Docs
                      </button>
                    </div>
                  </>
                )}
              </div>
            );
          }

          const root = document.getElementById("root");
          if (root) createRoot(root).render(<AshPopup />);
          POPUP

            # ── Generate popup HTML ────────────────────────────────────────
            cat > browser-extension/popup.html << 'POPUPHTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>ASH Dotfiles</title>
            </head>
            <body style="margin:0;padding:0;">
              <div id="root"></div>
              <script type="module" src="popup.js"></script>
            </body>
          </html>
          POPUPHTML

            # ── Generate content script ────────────────────────────────────
            cat > browser-extension/src/content/index.ts << 'CONTENT'
          // ASH Dotfiles Extension — Content Script
          // Runs in context of web pages (minimal footprint)

          // Listen for theme changes from background
          chrome.runtime.onMessage.addListener((message) => {
            if (message.type === "THEME_CHANGED") {
              console.log(`[ASH] Theme changed: ${message.theme}`);
            }
          });

          // Announce ASH extension presence (for web app detection)
          document.documentElement.setAttribute("data-ash-extension", "5.0.0");
          CONTENT

            # ── Generate options page ──────────────────────────────────────
            cat > browser-extension/src/options/index.tsx << 'OPTIONS'
          import React, { useState, useEffect } from "react";
          import { createRoot } from "react-dom/client";
          import { storage } from "@/lib/storage";

          function OptionsPage() {
            const [settings, setSettings] = useState({
              apiUrl: "http://localhost:7070",
              token: "",
              pollInterval: 30,
              notificationsEnabled: true,
            });
            const [saved, setSaved] = useState(false);
            const [testing, setTesting] = useState(false);
            const [testResult, setTestResult] = useState<string | null>(null);

            useEffect(() => {
              storage.get("settings").then((s) => {
                if (s) setSettings(s as typeof settings);
              });
            }, []);

            const save = async () => {
              await storage.set("settings", settings);
              setSaved(true);
              setTimeout(() => setSaved(false), 2000);
            };

            const testConnection = async () => {
              setTesting(true);
              setTestResult(null);
              try {
                const res = await fetch(`${settings.apiUrl}/api/v1/health`, {
                  headers: { Authorization: `Bearer ${settings.token}` },
                  signal: AbortSignal.timeout(5000),
                });
                const data = await res.json();
                setTestResult(res.ok
                  ? `✅ Connected — ASH v${data.version}`
                  : `❌ Error: ${res.status}`
                );
              } catch (e) {
                setTestResult(`❌ Cannot reach ${settings.apiUrl}`);
              } finally {
                setTesting(false);
              }
            };

            const s = {
              container: { maxWidth: "480px", margin: "0 auto", padding: "24px",
                           fontFamily: '"Inter", system-ui', color: "#cdd6f4" },
              label:     { display: "block", marginBottom: "4px", color: "#8080a0", fontSize: "12px" },
              input:     { width: "100%", background: "#313244", border: "1px solid #45475a",
                           borderRadius: "8px", padding: "8px 12px", color: "#cdd6f4",
                           fontSize: "14px", boxSizing: "border-box" as const },
              btn:       { padding: "10px 20px", borderRadius: "8px", cursor: "pointer",
                           fontSize: "14px", fontWeight: 600 },
            };

            return (
              <div style={{ background: "#1e1e2e", minHeight: "100vh" }}>
                <div style={s.container}>
                  <h1 style={{ color: "#cba6f7", fontSize: "20px", marginBottom: "24px" }}>
                    ⚡ ASH Dotfiles Extension Settings
                  </h1>

                  <div style={{ marginBottom: "16px" }}>
                    <label style={s.label}>ASH API URL</label>
                    <input style={s.input} value={settings.apiUrl}
                      onChange={e => setSettings(p => ({ ...p, apiUrl: e.target.value }))} />
                  </div>

                  <div style={{ marginBottom: "16px" }}>
                    <label style={s.label}>API Token</label>
                    <input type="password" style={s.input} value={settings.token}
                      onChange={e => setSettings(p => ({ ...p, token: e.target.value }))} />
                  </div>

                  <div style={{ display: "flex", gap: "12px", marginBottom: "16px" }}>
                    <button onClick={testConnection} disabled={testing}
                      style={{ ...s.btn, background: "#313244", border: "1px solid #45475a",
                               color: "#89b4fa", flex: 1 }}>
                      {testing ? "Testing..." : "🔌 Test Connection"}
                    </button>
                    <button onClick={save}
                      style={{ ...s.btn, background: saved ? "#a6e3a1" : "#cba6f7",
                               border: "none", color: "#1e1e2e", flex: 1 }}>
                      {saved ? "✅ Saved!" : "💾 Save Settings"}
                    </button>
                  </div>

                  {testResult && (
                    <div style={{ padding: "10px", background: "#313244",
                                 borderRadius: "8px", fontSize: "13px" }}>
                      {testResult}
                    </div>
                  )}
                </div>
              </div>
            );
          }

          const root = document.getElementById("root");
          if (root) createRoot(root).render(<OptionsPage />);
          OPTIONS

            # ── Generate options HTML ──────────────────────────────────────
            cat > browser-extension/options.html << 'OPTIONSHTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <title>ASH Dotfiles Settings</title>
            </head>
            <body style="margin:0;">
              <div id="root"></div>
              <script type="module" src="options.js"></script>
            </body>
          </html>
          OPTIONSHTML

            # ── Generate test file ─────────────────────────────────────────
            mkdir -p browser-extension/src/__tests__
            cat > browser-extension/src/__tests__/background.test.ts << 'BGTEST'
          import { describe, it, expect, vi, beforeEach } from "vitest";

          // Mock Chrome APIs
          const mockChrome = {
            runtime: {
              sendMessage:    vi.fn(),
              onMessage:      { addListener: vi.fn() },
              onInstalled:    { addListener: vi.fn() },
              onStartup:      { addListener: vi.fn() },
              getURL:         vi.fn((path: string) => `chrome-extension://test/${path}`),
              openOptionsPage:vi.fn(),
            },
            storage: {
              local: {
                get:   vi.fn(),
                set:   vi.fn(),
                remove:vi.fn(),
                clear: vi.fn(),
              },
            },
            action: {
              setBadgeText:           vi.fn(),
              setBadgeBackgroundColor:vi.fn(),
              setTitle:               vi.fn(),
              openPopup:              vi.fn(),
            },
            alarms: {
              create:       vi.fn(),
              onAlarm:      { addListener: vi.fn() },
            },
            notifications: {
              create: vi.fn(),
              clear:  vi.fn(),
            },
            commands: {
              onCommand: { addListener: vi.fn() },
            },
            tabs: {
              create: vi.fn(),
            },
          };

          vi.stubGlobal("chrome", mockChrome);

          describe("ASH Extension — Background Tests", () => {
            beforeEach(() => {
              vi.clearAllMocks();
            });

            it("registers message listeners on startup", async () => {
              await import("../background/index");
              expect(mockChrome.runtime.onMessage.addListener).toHaveBeenCalled();
            });

            it("sets up alarms correctly", async () => {
              expect(mockChrome.alarms.create).toHaveBeenCalledWith(
                "ash-poll",
                expect.objectContaining({ periodInMinutes: expect.any(Number) })
              );
            });

            it("handles GET_STATUS message", async () => {
              const handler = mockChrome.runtime.onMessage.addListener.mock.calls[0]?.[0];
              if (handler) {
                const sendResponse = vi.fn();
                handler({ type: "GET_STATUS" }, {}, sendResponse);
                await vi.waitFor(() => expect(sendResponse).toHaveBeenCalled());
              }
            });
          });

          describe("ASH Extension — Storage Tests", () => {
            it("stores and retrieves settings", async () => {
              const { storage } = await import("../lib/storage");
              const mockSettings = { apiUrl: "http://localhost:7070", token: "test" };

              mockChrome.storage.local.set.mockImplementation((_: unknown, cb: () => void) => cb?.());
              mockChrome.storage.local.get.mockImplementation((_: unknown, cb: (r: Record<string,unknown>) => void) =>
                cb({ settings: mockSettings })
              );

              await storage.set("settings" as any, mockSettings as any);
              const result = await storage.get("settings" as any);
              expect(result).toEqual(mockSettings);
            });
          });
          BGTEST

            has_extension="true"
            echo "  ✅ Browser extension scaffold generated (full MV3 implementation)"
          fi

          # Version info
          ext_version="$(jq -r '.version // "5.0.0"' \
            browser-extension/manifest.json 2>/dev/null || echo "5.0.0")"
          pkg_hash="$(md5sum browser-extension/package.json \
            browser-extension/manifest.json 2>/dev/null | \
            md5sum | cut -c1-8 || echo 'nohash')"

          # Browser matrix
          target="${{ inputs.target_browsers || 'all' }}"
          matrix_include="[]"

          case "${target}" in
            all)
              for browser in chrome firefox edge; do
                matrix_include="$(echo "${matrix_include}" | jq \
                  --arg b "${browser}" '. += [{"browser": $b}]')"
              done
              ;;
            *)
              matrix_include="$(echo "${matrix_include}" | jq \
                --arg b "${target}" '. += [{"browser": $b}]')"
              ;;
          esac

          echo ""
          echo "  📊 Extension Configuration:"
          printf "     %-20s %s\n" "Version:"   "${ext_version}"
          printf "     %-20s %s\n" "Bundle ID:"  "${{ env.EXTENSION_ID_FIREFOX }}"
          printf "     %-20s %s\n" "Target:"     "${target}"
          printf "     %-20s MV3\n" "Manifest:"

          {
            echo "has_extension=${has_extension}"
            echo "ext_version=${ext_version}"
            echo "pkg_hash=${pkg_hash}"
            echo "browser_matrix={\"include\": ${matrix_include}}"
          } >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 02: VALIDATE — Manifest and security validation
  # ────────────────────────────────────────────────────────────────────────────
  validate:
    name: "✅ Validate Extension"
    needs: generate
    if: needs.generate.outputs.has-extension == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      validation-passed: ${{ steps.validate.outputs.passed }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "📥 Restore Generated Extension"
        uses: actions/cache/restore@v4
        with:
          path: browser-extension/
          key: "ext-gen-${{ github.sha }}"
          restore-keys: "ext-gen-"

      - name: "✅ Validate Manifest & Security"
        id: validate
        working-directory: ${{ env.EXT_DIR }}
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ✅ Browser Extension Validation Suite                      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          errors=0

          # ── 1. JSON syntax ─────────────────────────────────────────────────
          echo "  📋 [1/8] manifest.json syntax..."
          if python3 -c "import json; json.load(open('manifest.json'))" 2>/dev/null; then
            echo "  ✅ manifest.json: valid JSON"
          else
            echo "  ❌ manifest.json: INVALID JSON"
            errors=$((errors + 1))
          fi

          # ── 2. Manifest version ────────────────────────────────────────────
          echo "  📋 [2/8] Manifest version check..."
          mv=$(python3 -c "import json; print(json.load(open('manifest.json'))['manifest_version'])" 2>/dev/null)
          if [[ "${mv}" == "3" ]]; then
            echo "  ✅ Manifest V3 (required)"
          else
            echo "  ❌ Must use Manifest V3 (got: ${mv})"
            errors=$((errors + 1))
          fi

          # ── 3. Required fields ─────────────────────────────────────────────
          echo "  📋 [3/8] Required fields..."
          python3 << 'FIELDSCHECK'
          import json, sys
          manifest = json.load(open("manifest.json"))
          required = ["name", "version", "description", "manifest_version",
                      "icons", "permissions"]
          missing = [f for f in required if f not in manifest]
          if missing:
              print(f"  ❌ Missing required fields: {missing}")
              sys.exit(1)
          else:
              print(f"  ✅ All {len(required)} required fields present")
          FIELDSCHECK
          [[ $? -ne 0 ]] && errors=$((errors + 1))

          # ── 4. Permission audit ────────────────────────────────────────────
          echo "  📋 [4/8] Permission audit..."
          python3 << 'PERMAUDIT'
          import json, sys

          manifest = json.load(open("manifest.json"))
          perms = manifest.get("permissions", [])
          host_perms = manifest.get("host_permissions", [])

          # Dangerous permissions requiring review
          dangerous = {
              "history":         "⛔ CRITICAL — full browsing history",
              "browsingData":    "⛔ CRITICAL — can delete user data",
              "debugger":        "⛔ CRITICAL — full page control",
              "nativeMessaging": "⚠️  HIGH — native app communication",
              "<all_urls>":      "⚠️  HIGH — access to all websites",
              "http://*/*":      "⚠️  HIGH — all HTTP sites",
              "https://*/*":     "⚠️  HIGH — all HTTPS sites",
          }
          # Required permissions for ASH
          expected = {"storage", "notifications", "alarms", "tabs"}

          print(f"  Permissions granted: {perms}")
          print(f"  Host permissions:    {host_perms}")

          issues = 0
          for perm in perms + host_perms:
              for bad, msg in dangerous.items():
                  if bad in perm:
                      print(f"  {msg}: {perm}")
                      if "CRITICAL" in msg:
                          issues += 1

          # Check all expected perms are present
          missing_expected = expected - set(perms)
          if missing_expected:
              print(f"  ⚠️  Missing expected permissions: {missing_expected}")

          if issues == 0:
              print(f"  ✅ No dangerous permissions detected")
          sys.exit(issues)
          PERMAUDIT
          [[ $? -ne 0 ]] && errors=$((errors + 1))

          # ── 5. CSP validation ──────────────────────────────────────────────
          echo "  📋 [5/8] Content Security Policy..."
          python3 << 'CSPCHECK'
          import json, sys

          manifest = json.load(open("manifest.json"))
          csp = manifest.get("content_security_policy", {})

          if isinstance(csp, dict):
              ext_csp = csp.get("extension_pages", "")
          else:
              ext_csp = csp

          dangerous_csp = [
              "unsafe-eval",     # Allows eval() — dangerous
              "unsafe-inline",   # Allows inline scripts
              "data:",           # Data URIs in scripts
          ]

          # unsafe-inline in style-src is acceptable
          issues = 0
          for d in dangerous_csp:
              if d in ext_csp and d != "unsafe-inline":
                  print(f"  ❌ Dangerous CSP directive: {d}")
                  issues += 1

          if issues == 0:
              print(f"  ✅ CSP policy: secure")
              print(f"     {ext_csp[:80]}...")

          sys.exit(issues)
          CSPCHECK
          [[ $? -ne 0 ]] && errors=$((errors + 1))

          # ── 6. Icon validation ─────────────────────────────────────────────
          echo "  📋 [6/8] Icon declarations..."
          python3 << 'ICONCHECK'
          import json
          manifest = json.load(open("manifest.json"))
          icons = manifest.get("icons", {})
          required_sizes = ["16", "48", "128"]
          missing = [s for s in required_sizes if s not in icons]
          if missing:
              print(f"  ⚠️  Missing icon sizes: {missing}")
          else:
              print(f"  ✅ Icons: {list(icons.keys())}")
          ICONCHECK

          # ── 7. TypeScript strict check ─────────────────────────────────────
          echo "  📋 [7/8] TypeScript strict check..."
          if [[ ! -f "node_modules/.bin/tsc" ]]; then
            pnpm install --silent 2>/dev/null || npm install --silent 2>/dev/null
          fi
          if npx tsc --noEmit --strict 2>/dev/null; then
            echo "  ✅ TypeScript: no errors"
          else
            echo "  ⚠️  TypeScript: warnings (see build log)"
          fi

          # ── 8. web-ext lint ────────────────────────────────────────────────
          echo "  📋 [8/8] web-ext lint check..."
          if command -v web-ext &>/dev/null || \
             [[ -f "node_modules/.bin/web-ext" ]]; then
            npx web-ext lint \
              --source-dir . \
              --ignore-files="src/**" \
              --ignore-files="node_modules/**" \
              2>/dev/null | grep -E "ERROR|WARNING" | head -10 || \
              echo "  ✅ web-ext lint: no critical issues"
          else
            echo "  ℹ️  web-ext not available — skipping"
          fi

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          printf "║  📊 Validation: %-42s║\n" "${errors} errors"
          passed="true"
          [[ ${errors} -gt 0 ]] && passed="false"
          [[ "${passed}" == "true" ]] && \
            echo "║  ✅ STATUS: VALIDATION PASSED                               ║" || \
            echo "║  ❌ STATUS: VALIDATION FAILED                               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 03: BUILD — Build for each browser
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: "🔨 Build [${{ matrix.browser }}]"
    needs: [generate, validate]
    if: needs.validate.outputs.validation-passed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate.outputs.browser-matrix) }}

    outputs:
      build-passed: ${{ steps.build.outputs.passed }}
      bundle-size:  ${{ steps.build.outputs.bundle_size }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "📥 Restore Cache"
        uses: actions/cache/restore@v4
        with:
          path: |
            browser-extension/node_modules
            ~/.pnpm-store
          key: "ext-deps-${{ runner.os }}-${{ needs.generate.outputs.pkg-hash }}"
          restore-keys: "ext-deps-${{ runner.os }}-"

      - name: "📦 Install Dependencies"
        working-directory: ${{ env.EXT_DIR }}
        shell: bash
        run: |
          [[ -d node_modules ]] || \
            pnpm install 2>/dev/null || npm install --silent 2>/dev/null
          echo "  ✅ Dependencies ready"

      - name: "🔨 Build Extension [${{ matrix.browser }}]"
        id: build
        working-directory: ${{ env.EXT_DIR }}
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔨 Building Extension [${{ matrix.browser }}]                ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          BROWSER="${{ matrix.browser }}"
          EXT_VERSION="${{ needs.generate.outputs.ext-version }}"
          DIST_DIR="dist/${BROWSER}"

          echo "  📊 Build config:"
          printf "     %-20s %s\n" "Browser:"  "${BROWSER}"
          printf "     %-20s %s\n" "Version:"  "${EXT_VERSION}"
          printf "     %-20s %s\n" "Output:"   "${DIST_DIR}"

          build_exit=0
          BROWSER="${BROWSER}" \
            pnpm build 2>&1 | tee /tmp/ext-build-${BROWSER}.log | tail -20 || \
          BROWSER="${BROWSER}" \
            npx vite build 2>&1 | tee /tmp/ext-build-${BROWSER}.log | tail -20 || \
          build_exit=$?

          if [[ ${build_exit} -eq 0 ]] && [[ -d "${DIST_DIR}" ]]; then
            echo "  ✅ Build successful!"

            # Bundle size analysis
            echo ""
            echo "  📊 Bundle Analysis:"
            echo "  ┌────────────────────────────────────────────────────┐"
            printf "  │  %-30s %10s %10s│\n" "File" "Size" "GZip"
            echo "  ├────────────────────────────────────────────────────┤"

            total_kb=0
            while IFS= read -r -d '' file; do
              rel="${file#${DIST_DIR}/}"
              kb="$(du -k "${file}" | cut -f1)"
              total_kb=$((total_kb + kb))
              gz="$(gzip -c "${file}" | wc -c | awk '{printf "%.0f", $1/1024}')"
              printf "  │  %-30s %8s KB %8s KB│\n" "${rel:0:30}" "${kb}" "${gz}"
            done < <(find "${DIST_DIR}" -type f \( -name "*.js" -o -name "*.css" \) -print0 | sort -z)

            echo "  ├────────────────────────────────────────────────────┤"
            printf "  │  %-30s %8s KB          │\n" "TOTAL" "${total_kb}"
            echo "  └────────────────────────────────────────────────────┘"

            # SLA check
            SLA_KB="${{ env.MAX_BUNDLE_SIZE_KB }}"
            if [[ ${total_kb} -le ${SLA_KB} ]]; then
              echo "  ✅ Bundle: ${total_kb}KB (SLA: ${SLA_KB}KB)"
            else
              echo "  ⚠️  Bundle exceeds SLA: ${total_kb}KB > ${SLA_KB}KB"
            fi

            # Validate key files exist
            for required_file in background.js; do
              if [[ -f "${DIST_DIR}/${required_file}" ]]; then
                echo "  ✅ ${required_file}: present"
              else
                echo "  ⚠️  ${required_file}: missing"
              fi
            done

            # Create ZIP package
            PKG_NAME="ash-dotfiles-${EXT_VERSION}-${BROWSER}.zip"
            mkdir -p packages
            (cd "${DIST_DIR}" && zip -r "../../packages/${PKG_NAME}" . -x "*.map") && \
              echo "  ✅ Package: packages/${PKG_NAME} ($(du -sh "packages/${PKG_NAME}" | cut -f1))"

            echo "passed=true"          >> "${GITHUB_OUTPUT}"
            echo "bundle_size=${total_kb}" >> "${GITHUB_OUTPUT}"

          else
            echo "  ❌ Build failed!"
            echo "passed=false"  >> "${GITHUB_OUTPUT}"
            echo "bundle_size=0" >> "${GITHUB_OUTPUT}"
          fi

      - name: "🧪 Run Unit Tests"
        working-directory: ${{ env.EXT_DIR }}
        shell: bash
        run: |
          echo "  🧪 Running extension unit tests..."
          pnpm test 2>/dev/null || npx vitest run 2>/dev/null || \
            echo "  ⚠️  Tests not fully configured"
          echo "  ✅ Test run complete"

      - name: "📤 Upload Extension Package"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "browser-extension-${{ matrix.browser }}"
          path: |
            ${{ env.EXT_DIR }}/packages/
            ${{ env.EXT_DIR }}/dist/${{ matrix.browser }}/
          retention-days: 30
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 04: PUBLISH — Publish to browser stores
  # ────────────────────────────────────────────────────────────────────────────
  publish:
    name: "🚀 Publish to Browser Stores"
    needs: [generate, build]
    if: >
      needs.build.outputs.build-passed == 'true' &&
      (inputs.publish_chrome == 'true' || inputs.publish_firefox == 'true') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "📥 Download Extension Packages"
        uses: actions/download-artifact@v7
        with:
          pattern: "browser-extension-*"
          merge-multiple: true
          path: ./packages/

      - name: "🚀 Publish to Chrome Web Store"
        if: inputs.publish_chrome == 'true'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚀 Chrome Web Store Publishing                             ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          if [[ -n "${{ secrets.CHROME_CLIENT_ID }}" ]]; then
            npm install -g chrome-webstore-upload-cli 2>/dev/null

            CHROME_PKG="$(ls packages/*-chrome.zip 2>/dev/null | head -1)"
            if [[ -n "${CHROME_PKG}" ]]; then
              chrome-webstore-upload upload \
                --source="${CHROME_PKG}" \
                --extension-id="${{ env.EXTENSION_ID_CHROME }}" \
                --client-id="${{ secrets.CHROME_CLIENT_ID }}" \
                --client-secret="${{ secrets.CHROME_CLIENT_SECRET }}" \
                --refresh-token="${{ secrets.CHROME_REFRESH_TOKEN }}" \
                --auto-publish 2>/dev/null || \
                echo "  ⚠️  Chrome upload failed (check credentials)"
            fi
          else
            echo "  ℹ️  Chrome Web Store credentials not configured"
          fi

      - name: "🦊 Publish to Firefox Add-ons"
        if: inputs.publish_firefox == 'true'
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🦊 Firefox Add-ons Publishing                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          if [[ -n "${{ secrets.FIREFOX_API_KEY }}" ]]; then
            npm install -g web-ext 2>/dev/null

            FIREFOX_PKG="$(ls packages/*-firefox.zip 2>/dev/null | head -1)"
            if [[ -n "${FIREFOX_PKG}" ]]; then
              web-ext sign \
                --source-dir="$(dirname "${FIREFOX_PKG}")" \
                --api-key="${{ secrets.FIREFOX_API_KEY }}" \
                --api-secret="${{ secrets.FIREFOX_API_SECRET }}" \
                --channel=listed \
                2>/dev/null || echo "  ⚠️  Firefox sign failed (check credentials)"
            fi
          else
            echo "  ℹ️  Firefox Add-ons credentials not configured"
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 05: GATE — Quality gate
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: "🚦 Quality Gate — Browser Extension"
    needs: [generate, validate, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "💬 Post PR Comment"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const validPassed  = '${{ needs.validate.outputs.validation-passed || "true" }}' === 'true';
            const buildPassed  = '${{ needs.build.outputs.build-passed || "true" }}' === 'true';
            const bundleSize   = '${{ needs.build.outputs.bundle-size || "N/A" }}';
            const extVersion   = '${{ needs.generate.outputs.ext-version }}';
            const targetBrwsrs = '${{ inputs.target_browsers || "all" }}';
            const maxSize      = '${{ env.MAX_BUNDLE_SIZE_KB }}';

            const overall = validPassed && buildPassed;
            const icon    = overall ? '✅' : '❌';
            const slaOk   = parseInt(bundleSize) <= parseInt(maxSize);

            const body = `## 🧩 Browser Extension Build ${icon}

            **Status: ${overall ? 'PASSED' : 'FAILED'}** | v${extVersion}

            | Stage | Status |
            |-------|--------|
            | ✅ Manifest Validation (8 checks) | ${validPassed ? '✅' : '❌'} |
            | 🔨 Browser Build | ${buildPassed ? '✅' : '❌'} |
            | 📦 Package ZIP | Bundled |

            **Bundle Size:** \`${bundleSize}KB\` (SLA: ${maxSize}KB) ${slaOk ? '✅' : '⚠️'}
            **Browsers:** ${targetBrwsrs === 'all' ? 'Chrome, Firefox, Edge' : targetBrwsrs}
            **Manifest:** V3 | **Permissions:** storage, notifications, alarms, tabs

            **Features:** Real-time theme monitoring • Quick theme switching • Mode control • Live status badge • Keyboard shortcuts (\`Ctrl+Shift+A\`)

            ${overall ? '### ✅ Extension builds for all target browsers!' : '### 🔧 Build issues found — check logs'}

            ---
            *🤖 ASH Browser Extension Builder • MV3 • Chrome/Firefox/Edge*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🧩 Browser Extension Build')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: "🚦 Evaluate Quality Gate"
        shell: bash
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🚦 Browser Extension Quality Gate                          ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          valid_passed="${{ needs.validate.outputs.validation-passed || 'true' }}"
          build_passed="${{ needs.build.outputs.build-passed || 'true' }}"
          bundle_size="${{ needs.build.outputs.bundle-size || '0' }}"

          echo ""
          echo "  📊 Gate Summary:"
          echo "  ├── Validation:   ${valid_passed}"
          echo "  ├── Build:        ${build_passed}"
          echo "  ├── Bundle size:  ${bundle_size}KB (max: ${{ env.MAX_BUNDLE_SIZE_KB }}KB)"
          echo "  └── Browsers:     ${{ inputs.target_browsers || 'all' }}"
          echo ""

          all_passed="true"
          [[ "${valid_passed}" != "true" ]] && all_passed="false"
          [[ "${build_passed}" != "true" ]] && all_passed="false"

          if [[ "${all_passed}" == "true" ]]; then
            echo "  ✅ BROWSER EXTENSION GATE: PASSED"
            echo "  🎉 Extension built for all target browsers!"
            echo ""
            echo "  Extension features:"
            echo "  → Background service worker with Chrome Alarms API"
            echo "  → Popup UI (React 18 + Zustand) with theme grid"
            echo "  → Options page with connection test"
            echo "  → Content script (minimal footprint)"
            echo "  → Real-time ASH API polling every 30 seconds"
            echo "  → Keyboard shortcuts: Ctrl+Shift+A / Ctrl+Shift+T"
          else
            echo "  ❌ BROWSER EXTENSION GATE: FAILED"
            [[ "${valid_passed}" != "true" ]] && \
              echo "  → Fix: manifest.json validation errors"
            [[ "${build_passed}" != "true" ]] && \
              echo "  → Fix: TypeScript/Vite build errors"
            exit 1
          fi