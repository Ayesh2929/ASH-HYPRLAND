# GitHub Labeler Configuration
# Automatically adds labels to PRs based on changed files

# Documentation changes
documentation:
  - "**/*.md"
  - "**/*.rst"
  - "docs/**/*"

# Configuration changes
configuration:
  - "**/*.yml"
  - "**/*.yaml"
  - "**/*.json"
  - "**/*.toml"
  - ".github/**/*"

# Scripts and automation
scripts:
  - "scripts/**/*"
  - "**/*.sh"
  - "**/*.py"

# Dependencies
dependencies:
  - "package.json"
  - "package-lock.json"
  - "pnpm-lock.yaml"
  - "yarn.lock"
  - "Cargo.toml"
  - "Cargo.lock"
  - "go.mod"
  - "go.sum"
  - "requirements.txt"
  - "pyproject.toml"

# CI/CD
ci:
  - ".github/workflows/**/*"
  - ".gitlab-ci.yml"
  - "Jenkinsfile"

# Tests
tests:
  - "**/*test*"
  - "**/*spec*"
  - "**/__tests__/**"
  - "**/__mocks__/**"

# Types/TypeScript
types:
  - "**/*.d.ts"
  - "**/*.ts"
  - "**/*.tsx"

# Styles
styles:
  - "**/*.css"
  - "**/*.scss"
  - "**/*.sass"
  - "**/*.less"

# Bug fixes (based on branch name pattern)
bug:
  - branch: "fix/*"
  - branch: "bugfix/*"
  - branch: "hotfix/*"

# Features
feature:
  - branch: "feat/*"
  - branch: "feature/*"

# Chores
chore:
  - branch: "chore/*"
  - branch: "maintenance/*"