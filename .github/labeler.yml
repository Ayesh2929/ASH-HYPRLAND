# Labeler configuration for ASH Dotfiles

# Documentation
"documentation":
  - "*.md"
  - "docs/**"
  - "README*"

# Configuration files
"config":
  - "config/**/*.conf"
  - "config/**/*.json*"
  - "config/**/*.yaml"
  - "config/**/*.yml"
  - "config/**/*.toml"

# Shell scripts
"scripts":
  - "config/**/*.sh"
  - "scripts/**/*.sh"
  - "bin/**"

# Lua configuration
"lua":
  - "config/**/*.lua"

# Stylesheets
"styles":
  - "config/**/*.css"
  - "config/**/*.scss"

# Rofi themes
"rofi":
  - "config/rofi/**"

# Waybar configuration
"waybar":
  - "config/waybar/**"

# Hyprland configuration
"hyprland":
  - "config/hypr/**"

# Kitty terminal
"kitty":
  - "config/kitty/**"

# Fish shell
"fish":
  - "config/fish/**"

# Neovim
"neovim":
  - "config/nvim/**"

# GTK themes
"gtk":
  - "config/gtk-*/**"

# Eww widgets
"eww":
  - "config/eww/**"

# Notifications
"notifications":
  - "config/swaync/**"
  - "config/mako/**"

# GitHub Actions
"github-actions":
  - ".github/workflows/**"

# Dependencies
"dependencies":
  - "package*.json"
  - "Cargo.toml"
  - "go.mod"
  - "requirements*.txt"

# CI/CD
"ci":
  - ".github/workflows/**"
  - "*.yml"
  - "*.yaml"

# Breaking changes
"breaking":
  - "config/hypr/hyprland.conf"
  - "config/hypr/keybinds.conf"
  - "bin/ash"

# Bug fixes
"bug":
  - "**/fix*.sh"
  - "**/*fix*.sh"

# Features
"feature":
  - "**/new*.sh"
  - "**/*feature*.sh"