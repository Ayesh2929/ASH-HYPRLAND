# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  💰 ASH DOTFILES v5.0 OMEGA — FUNDING CONFIGURATION                        ║
# ║  Support the most advanced dotfiles repository in human history             ║
# ║  Every contribution fuels 250+ themes, 150+ plugins & infinite innovation  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ── GITHUB SPONSORS ───────────────────────────────────────────────────────────
# Primary funding channel — direct GitHub integration
# Tiers: ☕ Coffee ($3) → 🌟 Star ($10) → 💎 Diamond ($50) → 🏆 Legendary ($100+)
github:
  - ash-dotfiles          # Main organization account
  - ash-dotfiles-dev      # Core developer account

# ── PATREON ───────────────────────────────────────────────────────────────────
# Monthly recurring support with exclusive perks
# Perks: Early access themes, private Discord, priority support, voting rights
patreon: ash-dotfiles

# ── OPEN COLLECTIVE ───────────────────────────────────────────────────────────
# Transparent community fund — every dollar tracked publicly
# Used for: Infrastructure, CI/CD costs, domain, CDN, server hosting
open_collective: ash-dotfiles

# ── KO-FI ─────────────────────────────────────────────────────────────────────
# One-time "buy me a coffee" style support
# Quick, no-account-required giving option
ko_fi: ash_dotfiles

# ── LIBERAPAY ─────────────────────────────────────────────────────────────────
# Privacy-respecting recurring donations
# No fees on the platform side — maximum goes to development
liberapay: ash-dotfiles

# ── ISSUEHUNT ─────────────────────────────────────────────────────────────────
# Bounty-based funding — fund specific features & bug fixes
# Community can pool funds for priority features
issuehunt: ash-dotfiles

# ── TIDELIFT ──────────────────────────────────────────────────────────────────
# Enterprise-grade support subscriptions
# For organizations using ASH Dotfiles in production environments
tidelift: ash-dotfiles/ash-dotfiles

# ── COMMUNITY BRIDGE ──────────────────────────────────────────────────────────
# Linux Foundation's community funding platform
community_bridge: ash-dotfiles

# ── CUSTOM FUNDING URLS ───────────────────────────────────────────────────────
# Additional funding channels with full context
custom:
  # 💳 Direct cryptocurrency donations
  - url: https://ash-dotfiles.dev/donate/crypto
    label: "₿ Crypto Donations (BTC/ETH/XMR)"

  # 🏪 ASH Theme & Plugin Store (revenue share model)
  - url: https://store.ash-dotfiles.dev
    label: "🏪 ASH Theme Store — Premium Themes"

  # 🎮 Ko-fi Shop — ASH branded merchandise
  - url: https://ko-fi.com/ash_dotfiles/shop
    label: "👕 ASH Merchandise & Stickers"

  # 📚 Sponsorship tiers documentation
  - url: https://ash-dotfiles.dev/sponsors
    label: "🌟 View All Sponsorship Tiers & Perks"

  # 🏢 Enterprise support contracts
  - url: https://ash-dotfiles.dev/enterprise
    label: "🏢 Enterprise Support Contracts"

  # 💬 Discord Nitro boost
  - url: https://discord.gg/ash-dotfiles
    label: "💜 Boost Our Discord Server"

  # 🎯 Bounty program
  - url: https://ash-dotfiles.dev/bounties
    label: "🎯 Fund Specific Features (Bounty Board)"