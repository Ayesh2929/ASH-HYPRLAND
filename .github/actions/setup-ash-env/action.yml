name: "⚡ Setup ASH Environment"
description: >
  🎨 Bootstrap the complete ASH Dotfiles v5.0 OMEGA development environment.
  Installs all toolchain dependencies, initializes the theme engine, plugin
  system, benchmark tools, security scanners, and validates the full setup.
  Features aggressive multi-layer caching for sub-90-second setup times.

author: "ASH Dotfiles Team <ash@dotfiles.dev>"

# ─────────────────────────────────────────────────────────────────────────────
# INPUTS
# ─────────────────────────────────────────────────────────────────────────────
inputs:

  # ── Environment profile ──────────────────────────────────────────────────
  profile:
    description: >
      🎯 Environment profile to install.
      • minimal    — Core tools only (bash/jq/bc/python3)
      • standard   — Full ASH toolchain (recommended for most CI jobs)
      • benchmark  — Standard + hyperfine + k6 + perf tools
      • api        — Standard + FastAPI + uvicorn + httpx + websockets
      • security   — Standard + gitleaks + semgrep + bandit + trivy
      • full        — Everything (all profiles combined)
      • custom      — Use custom_packages only
    required: false
    default: "standard"

  # ── Python configuration ──────────────────────────────────────────────────
  python_version:
    description: "🐍 Python version to use"
    required: false
    default: "3.12"

  python_packages:
    description: "🐍 Additional Python packages (space-separated)"
    required: false
    default: ""

  install_python:
    description: "🐍 Install Python toolchain"
    required: false
    default: "true"

  # ── Node.js configuration ─────────────────────────────────────────────────
  node_version:
    description: "🟨 Node.js version"
    required: false
    default: "20"

  install_node:
    description: "🟨 Install Node.js toolchain"
    required: false
    default: "false"

  node_package_manager:
    description: "🟨 Package manager (npm|pnpm|bun)"
    required: false
    default: "npm"

  # ── System tools ──────────────────────────────────────────────────────────
  install_imagemagick:
    description: "🖼️ Install ImageMagick + WebP + AVIF"
    required: false
    default: "true"

  install_fish:
    description: "🐚 Install Fish shell"
    required: false
    default: "false"

  install_hyperfine:
    description: "⚡ Install Hyperfine benchmark tool"
    required: false
    default: "false"

  hyperfine_version:
    description: "⚡ Hyperfine version to install"
    required: false
    default: "1.18.0"

  install_shellcheck:
    description: "🔒 Install ShellCheck linter"
    required: false
    default: "true"

  install_gitleaks:
    description: "🔑 Install Gitleaks secret scanner"
    required: false
    default: "false"

  gitleaks_version:
    description: "🔑 Gitleaks version"
    required: false
    default: "8.21.2"

  install_trivy:
    description: "🐳 Install Trivy vulnerability scanner"
    required: false
    default: "false"

  install_sqlite:
    description: "🗄️ Install SQLite"
    required: false
    default: "true"

  custom_packages:
    description: "📦 Custom apt packages (space-separated)"
    required: false
    default: ""

  # ── ASH-specific ─────────────────────────────────────────────────────────
  init_theme_engine:
    description: "🎨 Initialize ASH theme engine"
    required: false
    default: "false"

  init_plugin_system:
    description: "🔌 Initialize ASH plugin system"
    required: false
    default: "false"

  ash_config_dir:
    description: "⚙️ ASH config directory path"
    required: false
    default: "$HOME/.config/ash"

  # ── Caching ───────────────────────────────────────────────────────────────
  cache_strategy:
    description: >
      💾 Cache strategy.
      • aggressive — Cache everything (pip + apt + npm + tools)
      • standard   — Cache pip + tools only
      • minimal    — Cache pip only
      • none        — Disable all caching
    required: false
    default: "aggressive"

  cache_key_prefix:
    description: "💾 Custom cache key prefix"
    required: false
    default: "ash-env"

  # ── Behavior ──────────────────────────────────────────────────────────────
  fail_on_error:
    description: "🚨 Fail action if any tool installation fails"
    required: false
    default: "true"

  verbose:
    description: "📢 Enable verbose output"
    required: false
    default: "false"

  validate_environment:
    description: "✅ Run environment validation after setup"
    required: false
    default: "true"

  generate_summary:
    description: "📊 Generate GitHub Step Summary report"
    required: false
    default: "true"

  timeout_minutes:
    description: "⏱️ Setup timeout in minutes"
    required: false
    default: "15"

# ─────────────────────────────────────────────────────────────────────────────
# OUTPUTS
# ─────────────────────────────────────────────────────────────────────────────
outputs:

  # ── Environment info ──────────────────────────────────────────────────────
  python_path:
    description: "🐍 Path to Python executable"
    value: ${{ steps.validate.outputs.python_path }}

  python_version_installed:
    description: "🐍 Installed Python version string"
    value: ${{ steps.validate.outputs.python_version }}

  node_path:
    description: "🟨 Path to Node.js executable"
    value: ${{ steps.validate.outputs.node_path }}

  node_version_installed:
    description: "🟨 Installed Node.js version string"
    value: ${{ steps.validate.outputs.node_version }}

  ash_config_dir:
    description: "⚙️ Path to ASH config directory"
    value: ${{ steps.setup.outputs.ash_config_dir }}

  # ── Status ────────────────────────────────────────────────────────────────
  setup_success:
    description: "✅ Whether setup completed successfully"
    value: ${{ steps.validate.outputs.success }}

  tools_installed:
    description: "🔧 JSON array of installed tools with versions"
    value: ${{ steps.validate.outputs.tools_json }}

  cache_hit:
    description: "💾 Whether cache was restored (true/false)"
    value: ${{ steps.cache-pip.outputs.cache-hit }}

  # ── Timing ────────────────────────────────────────────────────────────────
  setup_duration_seconds:
    description: "⏱️ Total setup time in seconds"
    value: ${{ steps.validate.outputs.duration_s }}

  # ── Tool paths ────────────────────────────────────────────────────────────
  hyperfine_path:
    description: "⚡ Path to Hyperfine"
    value: ${{ steps.tools.outputs.hyperfine_path }}

  shellcheck_path:
    description: "🔒 Path to ShellCheck"
    value: ${{ steps.tools.outputs.shellcheck_path }}

  gitleaks_path:
    description: "🔑 Path to Gitleaks"
    value: ${{ steps.tools.outputs.gitleaks_path }}

# ─────────────────────────────────────────────────────────────────────────────
# RUNS
# ─────────────────────────────────────────────────────────────────────────────
runs:
  using: "composite"

  steps:

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 0 — Pre-flight validation
    # ─────────────────────────────────────────────────────────────────────────
    - name: "🔍 Pre-flight · Validate inputs & environment"
      shell: bash
      id: preflight
      run: |
        set -euo pipefail
        START_TIME=$(date +%s)
        echo "start_time=${START_TIME}" >> "$GITHUB_OUTPUT"

        echo ""
        echo "╔══════════════════════════════════════════════════════════════╗"
        echo "║  ⚡ ASH Dotfiles v5.0 OMEGA — Environment Setup Action       ║"
        echo "╠══════════════════════════════════════════════════════════════╣"
        echo "║  🎯 Profile:  ${{ inputs.profile }}$(printf '%*s' $((45 - ${#inputs.profile} )) '')║"
        echo "║  🐍 Python:   ${{ inputs.python_version }}$(printf '%*s' $((45 - ${#inputs.python_version} )) '')║"
        echo "║  🟨 Node:     ${{ inputs.node_version }}$(printf '%*s' $((45 - ${#inputs.node_version} )) '')║"
        echo "║  💾 Cache:    ${{ inputs.cache_strategy }}$(printf '%*s' $((45 - ${#inputs.cache_strategy} )) '')║"
        echo "╠══════════════════════════════════════════════════════════════╣"
        echo "║  🖥️  OS:       $(uname -s) $(uname -m)$(printf '%*s' $((36 - ${#GITHUB_OS:-ubuntu} )) '')║"
        echo "║  🔧 Runner:   $RUNNER_OS$(printf '%*s' $((45 - ${#RUNNER_OS:-ubuntu} )) '')║"
        echo "╚══════════════════════════════════════════════════════════════╝"
        echo ""

        # Validate profile
        VALID_PROFILES="minimal standard benchmark api security full custom"
        if ! echo "${VALID_PROFILES}" | grep -qw "${{ inputs.profile }}"; then
          echo "::error::Invalid profile '${{ inputs.profile }}'. Valid: ${VALID_PROFILES}"
          exit 1
        fi

        # Validate cache strategy
        VALID_CACHE="aggressive standard minimal none"
        if ! echo "${VALID_CACHE}" | grep -qw "${{ inputs.cache_strategy }}"; then
          echo "::error::Invalid cache_strategy '${{ inputs.cache_strategy }}'"
          exit 1
        fi

        # Detect runner OS
        OS_TYPE="ubuntu"
        if [[ "${RUNNER_OS:-}" == "macOS" ]]; then
          OS_TYPE="macos"
        elif [[ "${RUNNER_OS:-}" == "Windows" ]]; then
          OS_TYPE="windows"
        fi
        echo "os_type=${OS_TYPE}" >> "$GITHUB_OUTPUT"

        # Resolve profile → feature flags
        PROFILE="${{ inputs.profile }}"
        declare -A FEATURES=(
          [python]="true"
          [node]="false"
          [imagemagick]="true"
          [fish]="false"
          [hyperfine]="false"
          [shellcheck]="true"
          [gitleaks]="false"
          [trivy]="false"
          [sqlite]="true"
          [api_deps]="false"
          [security_deps]="false"
          [benchmark_deps]="false"
        )

        case "${PROFILE}" in
          minimal)
            FEATURES[imagemagick]="false"
            FEATURES[shellcheck]="false"
            FEATURES[sqlite]="false"
            ;;
          standard)
            # defaults are fine
            ;;
          benchmark)
            FEATURES[hyperfine]="true"
            FEATURES[benchmark_deps]="true"
            ;;
          api)
            FEATURES[api_deps]="true"
            ;;
          security)
            FEATURES[gitleaks]="true"
            FEATURES[trivy]="true"
            FEATURES[security_deps]="true"
            ;;
          full)
            for key in "${!FEATURES[@]}"; do
              FEATURES[$key]="true"
            done
            ;;
          custom)
            # All features controlled by individual inputs
            for key in "${!FEATURES[@]}"; do
              FEATURES[$key]="false"
            done
            ;;
        esac

        # Individual input overrides
        [[ "${{ inputs.install_python }}"      == "true"  ]] && FEATURES[python]="true"
        [[ "${{ inputs.install_python }}"      == "false" ]] && FEATURES[python]="false"
        [[ "${{ inputs.install_node }}"        == "true"  ]] && FEATURES[node]="true"
        [[ "${{ inputs.install_imagemagick }}" == "false" ]] && FEATURES[imagemagick]="false"
        [[ "${{ inputs.install_fish }}"        == "true"  ]] && FEATURES[fish]="true"
        [[ "${{ inputs.install_hyperfine }}"   == "true"  ]] && FEATURES[hyperfine]="true"
        [[ "${{ inputs.install_shellcheck }}"  == "false" ]] && FEATURES[shellcheck]="false"
        [[ "${{ inputs.install_gitleaks }}"    == "true"  ]] && FEATURES[gitleaks]="true"
        [[ "${{ inputs.install_trivy }}"       == "true"  ]] && FEATURES[trivy]="true"
        [[ "${{ inputs.install_sqlite }}"      == "false" ]] && FEATURES[sqlite]="false"

        # Export features
        for key in "${!FEATURES[@]}"; do
          echo "feat_${key}=${FEATURES[$key]}" >> "$GITHUB_OUTPUT"
        done

        echo "  ✅ Pre-flight validation passed"
        echo "  🎯 Active features: ${!FEATURES[@]}"

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 1 — Cache: Python packages
    # ─────────────────────────────────────────────────────────────────────────
    - name: "💾 Cache · Python packages"
      if: inputs.cache_strategy != 'none' && inputs.install_python == 'true'
      id: cache-pip
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.local/lib/python${{ inputs.python_version }}/site-packages
          ~/.local/bin
        key: >-
          ${{ inputs.cache_key_prefix }}-pip-${{ inputs.python_version }}-
          ${{ inputs.profile }}-
          ${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/setup.py') }}-
          ${{ inputs.python_packages }}
        restore-keys: |
          ${{ inputs.cache_key_prefix }}-pip-${{ inputs.python_version }}-${{ inputs.profile }}-
          ${{ inputs.cache_key_prefix }}-pip-${{ inputs.python_version }}-
          ${{ inputs.cache_key_prefix }}-pip-

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 2 — Cache: System tools binaries
    # ─────────────────────────────────────────────────────────────────────────
    - name: "💾 Cache · Binary tools"
      if: inputs.cache_strategy == 'aggressive'
      id: cache-tools
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/bin/hyperfine
          ~/.local/bin/gitleaks
          /usr/local/bin/trivy
        key: >-
          ${{ inputs.cache_key_prefix }}-tools-
          ${{ inputs.hyperfine_version }}-
          ${{ inputs.gitleaks_version }}-
          ${{ runner.os }}-${{ runner.arch }}
        restore-keys: |
          ${{ inputs.cache_key_prefix }}-tools-

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 3 — Setup Python
    # ─────────────────────────────────────────────────────────────────────────
    - name: "🐍 Setup · Python ${{ inputs.python_version }}"
      if: inputs.install_python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}
        cache: "pip"
        cache-dependency-path: |
          **/requirements*.txt
          **/pyproject.toml

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 4 — Setup Node.js
    # ─────────────────────────────────────────────────────────────────────────
    - name: "🟨 Setup · Node.js ${{ inputs.node_version }}"
      if: inputs.install_node == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}
        cache: ${{ inputs.node_package_manager }}

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 5 — Main setup script
    # ─────────────────────────────────────────────────────────────────────────
    - name: "⚡ Setup · Execute environment bootstrap"
      shell: bash
      id: setup
      timeout-minutes: ${{ fromJson(inputs.timeout_minutes) }}
      env:
        ASH_PROFILE:          ${{ inputs.profile }}
        ASH_PYTHON_VERSION:   ${{ inputs.python_version }}
        ASH_NODE_VERSION:     ${{ inputs.node_version }}
        ASH_NODE_PM:          ${{ inputs.node_package_manager }}
        ASH_CONFIG_DIR:       ${{ inputs.ash_config_dir }}
        ASH_PYTHON_PACKAGES:  ${{ inputs.python_packages }}
        ASH_CUSTOM_PACKAGES:  ${{ inputs.custom_packages }}
        ASH_VERBOSE:          ${{ inputs.verbose }}
        ASH_FAIL_ON_ERROR:    ${{ inputs.fail_on_error }}
        ASH_CACHE_STRATEGY:   ${{ inputs.cache_strategy }}
        ASH_CACHE_HIT_PIP:    ${{ steps.cache-pip.outputs.cache-hit || 'false' }}
        ASH_CACHE_HIT_TOOLS:  ${{ steps.cache-tools.outputs.cache-hit || 'false' }}
        ASH_INIT_THEME:       ${{ inputs.init_theme_engine }}
        ASH_INIT_PLUGINS:     ${{ inputs.init_plugin_system }}
        # Feature flags from preflight
        ASH_FEAT_PYTHON:      ${{ steps.preflight.outputs.feat_python }}
        ASH_FEAT_NODE:        ${{ steps.preflight.outputs.feat_node }}
        ASH_FEAT_IMAGEMAGICK: ${{ steps.preflight.outputs.feat_imagemagick }}
        ASH_FEAT_FISH:        ${{ steps.preflight.outputs.feat_fish }}
        ASH_FEAT_HYPERFINE:   ${{ steps.preflight.outputs.feat_hyperfine }}
        ASH_FEAT_SHELLCHECK:  ${{ steps.preflight.outputs.feat_shellcheck }}
        ASH_FEAT_GITLEAKS:    ${{ steps.preflight.outputs.feat_gitleaks }}
        ASH_FEAT_TRIVY:       ${{ steps.preflight.outputs.feat_trivy }}
        ASH_FEAT_SQLITE:      ${{ steps.preflight.outputs.feat_sqlite }}
        ASH_FEAT_API_DEPS:    ${{ steps.preflight.outputs.feat_api_deps }}
        ASH_FEAT_SECURITY:    ${{ steps.preflight.outputs.feat_security_deps }}
        ASH_FEAT_BENCHMARK:   ${{ steps.preflight.outputs.feat_benchmark_deps }}
        ASH_HYPERFINE_VER:    ${{ inputs.hyperfine_version }}
        ASH_GITLEAKS_VER:     ${{ inputs.gitleaks_version }}
      run: |
        bash "${{ github.action_path }}/setup.sh"

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 6 — Tool path discovery
    # ─────────────────────────────────────────────────────────────────────────
    - name: "🔧 Tools · Discover installed paths"
      shell: bash
      id: tools
      run: |
        find_tool() {
          local name="$1"
          local path
          path=$(command -v "${name}" 2>/dev/null || \
                 command -v ~/.local/bin/"${name}" 2>/dev/null || \
                 echo "not-found")
          echo "${path}"
        }

        HYPERFINE_PATH=$(find_tool hyperfine)
        SHELLCHECK_PATH=$(find_tool shellcheck)
        GITLEAKS_PATH=$(find_tool gitleaks)
        TRIVY_PATH=$(find_tool trivy)
        FISH_PATH=$(find_tool fish)
        PYTHON_PATH=$(find_tool python3)
        NODE_PATH=$(find_tool node)

        echo "hyperfine_path=${HYPERFINE_PATH}" >> "$GITHUB_OUTPUT"
        echo "shellcheck_path=${SHELLCHECK_PATH}" >> "$GITHUB_OUTPUT"
        echo "gitleaks_path=${GITLEAKS_PATH}" >> "$GITHUB_OUTPUT"
        echo "trivy_path=${TRIVY_PATH}" >> "$GITHUB_OUTPUT"
        echo "fish_path=${FISH_PATH}" >> "$GITHUB_OUTPUT"
        echo "python_path=${PYTHON_PATH}" >> "$GITHUB_OUTPUT"
        echo "node_path=${NODE_PATH}" >> "$GITHUB_OUTPUT"

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 7 — Validate environment
    # ─────────────────────────────────────────────────────────────────────────
    - name: "✅ Validate · Environment integrity check"
      shell: bash
      id: validate
      if: inputs.validate_environment == 'true'
      run: |
        set -euo pipefail

        START_TIME="${{ steps.preflight.outputs.start_time }}"
        NOW=$(date +%s)
        DURATION=$((NOW - START_TIME))

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  ✅ Environment Validation Report"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        PASSED=0; FAILED=0; WARNED=0
        declare -a TOOLS_JSON=()
        declare -a FAILED_TOOLS=()

        check_tool() {
          local name="$1"
          local version_flag="${2:---version}"
          local required="${3:-true}"

          if command -v "${name}" &>/dev/null; then
            local version
            version=$(${name} ${version_flag} 2>/dev/null | head -1 || echo "unknown")
            echo "  ✅ ${name}: ${version}"
            TOOLS_JSON+=("{\"tool\":\"${name}\",\"version\":\"${version}\",\"status\":\"ok\"}")
            ((PASSED++))
            return 0
          else
            if [[ "${required}" == "true" ]]; then
              echo "  ❌ ${name}: NOT FOUND (required)"
              TOOLS_JSON+=("{\"tool\":\"${name}\",\"status\":\"missing\",\"required\":true}")
              FAILED_TOOLS+=("${name}")
              ((FAILED++))
            else
              echo "  ⚠️  ${name}: not found (optional)"
              TOOLS_JSON+=("{\"tool\":\"${name}\",\"status\":\"missing\",\"required\":false}")
              ((WARNED++))
            fi
            return 1
          fi
        }

        echo ""
        echo "  🔧 Core Tools:"
        check_tool "bash"        "--version" "true"
        check_tool "jq"          "--version" "true"
        check_tool "bc"          "--version" "false"
        check_tool "curl"        "--version" "true"
        check_tool "git"         "--version" "true"

        if [[ "${{ inputs.install_sqlite }}" == "true" ]]; then
          echo ""
          echo "  🗄️  Database:"
          check_tool "sqlite3" "--version" "true"
        fi

        if [[ "${{ inputs.install_python }}" == "true" ]]; then
          echo ""
          echo "  🐍 Python:"
          check_tool "python3" "--version" "true"
          check_tool "pip3"    "--version" "true"

          # Check key packages
          PACKAGES=(matplotlib numpy rich requests)
          for pkg in "${PACKAGES[@]}"; do
            if python3 -c "import ${pkg}" 2>/dev/null; then
              VER=$(python3 -c "import ${pkg}; print(getattr(${pkg},'__version__','?'))" 2>/dev/null || echo "?")
              echo "  ✅ python:${pkg}: ${VER}"
              TOOLS_JSON+=("{\"tool\":\"python:${pkg}\",\"version\":\"${VER}\",\"status\":\"ok\"}")
              ((PASSED++))
            fi
          done
        fi

        if [[ "${{ inputs.install_node }}" == "true" ]]; then
          echo ""
          echo "  🟨 Node.js:"
          check_tool "node" "--version" "true"
          check_tool "npm"  "--version" "true"
        fi

        if [[ "${{ inputs.install_imagemagick }}" == "true" ]]; then
          echo ""
          echo "  🖼️  Image Tools:"
          check_tool "convert" "--version" "false"
          check_tool "cwebp"   "-version"  "false"
        fi

        if [[ "${{ inputs.install_shellcheck }}" == "true" ]]; then
          echo ""
          echo "  🔒 Security/Lint:"
          check_tool "shellcheck" "--version" "true"
        fi

        check_tool "hyperfine" "--version" "false"
        check_tool "gitleaks"  "version"   "false"
        check_tool "fish"      "--version"  "false"

        echo ""
        echo "  🎨 ASH Engine:"
        if [[ -f "ash-cli/ash" ]]; then
          echo "  ✅ ash-cli: found"
          ASH_VER=$(bash ash-cli/ash --version 2>/dev/null || echo "unknown")
          echo "  ✅ ash version: ${ASH_VER}"
          ((PASSED++))
        else
          echo "  ⚠️  ash-cli: not found in repo root"
          ((WARNED++))
        fi

        if [[ -d "${{ inputs.ash_config_dir }}" ]]; then
          echo "  ✅ ash config dir: ${{ inputs.ash_config_dir }}"
          ((PASSED++))
        else
          echo "  ⚠️  ash config dir: not initialized"
          ((WARNED++))
        fi

        # ── Build outputs ──────────────────────────────────────────
        TOOLS_JSON_STR="[$(IFS=,; echo "${TOOLS_JSON[*]}")]"
        PYTHON_PATH=$(command -v python3 2>/dev/null || echo "")
        PYTHON_VER=$(python3 --version 2>/dev/null || echo "not installed")
        NODE_PATH=$(command -v node 2>/dev/null || echo "")
        NODE_VER=$(node --version 2>/dev/null || echo "not installed")

        SUCCESS="true"
        if [[ "${FAILED}" -gt 0 ]] && [[ "${{ inputs.fail_on_error }}" == "true" ]]; then
          SUCCESS="false"
        fi

        echo "python_path=${PYTHON_PATH}"     >> "$GITHUB_OUTPUT"
        echo "python_version=${PYTHON_VER}"   >> "$GITHUB_OUTPUT"
        echo "node_path=${NODE_PATH}"         >> "$GITHUB_OUTPUT"
        echo "node_version=${NODE_VER}"       >> "$GITHUB_OUTPUT"
        echo "success=${SUCCESS}"             >> "$GITHUB_OUTPUT"
        echo "tools_json=${TOOLS_JSON_STR}"   >> "$GITHUB_OUTPUT"
        echo "duration_s=${DURATION}"         >> "$GITHUB_OUTPUT"
        echo "passed=${PASSED}"               >> "$GITHUB_OUTPUT"
        echo "failed=${FAILED}"               >> "$GITHUB_OUTPUT"
        echo "warned=${WARNED}"               >> "$GITHUB_OUTPUT"

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  📊 Validation: ✅${PASSED} ❌${FAILED} ⚠️${WARNED} (${DURATION}s)"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        if [[ "${FAILED}" -gt 0 ]]; then
          echo ""
          echo "  ❌ Failed tools: ${FAILED_TOOLS[*]}"
          if [[ "${{ inputs.fail_on_error }}" == "true" ]]; then
            echo "::error::${FAILED} required tool(s) not found: ${FAILED_TOOLS[*]}"
            exit 1
          fi
        fi

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 8 — GitHub Step Summary
    # ─────────────────────────────────────────────────────────────────────────
    - name: "📊 Summary · Environment Setup Report"
      shell: bash
      if: inputs.generate_summary == 'true' && always()
      run: |
        DURATION="${{ steps.validate.outputs.duration_s || '?' }}"
        PASSED="${{ steps.validate.outputs.passed || '0' }}"
        FAILED="${{ steps.validate.outputs.failed || '0' }}"
        WARNED="${{ steps.validate.outputs.warned || '0' }}"
        SUCCESS="${{ steps.validate.outputs.success || 'true' }}"
        PYTHON_VER="${{ steps.validate.outputs.python_version || 'N/A' }}"
        NODE_VER="${{ steps.validate.outputs.node_version || 'N/A' }}"
        CACHE_HIT="${{ steps.cache-pip.outputs.cache-hit || 'false' }}"

        STATUS_ICON="$([[ "${SUCCESS}" == 'true' ]] && echo '✅' || echo '❌')"
        STATUS_TEXT="$([[ "${SUCCESS}" == 'true' ]] && echo 'SUCCESS' || echo 'FAILED')"
        CACHE_ICON="$([[ "${CACHE_HIT}" == 'true' ]] && echo '⚡ HIT' || echo '📦 MISS')"

        cat >> "${GITHUB_STEP_SUMMARY}" << EOF
        ## ⚡ ASH Environment Setup — ${STATUS_ICON} ${STATUS_TEXT}

        > Profile: \`${{ inputs.profile }}\`  ·  Cache: \`${{ inputs.cache_strategy }}\`  ·  Duration: \`${DURATION}s\`

        | Component | Status | Details |
        |-----------|:------:|---------|
        | 🐍 Python | ✅ | \`${PYTHON_VER}\` |
        | 🟨 Node.js | $([ "${{ inputs.install_node }}" == 'true' ] && echo '✅' || echo '⏭️') | \`${NODE_VER}\` |
        | 💾 Cache | ${CACHE_ICON} | Strategy: \`${{ inputs.cache_strategy }}\` |
        | ✅ Checks | \`${PASSED}\` passed | ❌ \`${FAILED}\` failed · ⚠️ \`${WARNED}\` warned |
        | ⏱️ Duration | \`${DURATION}s\` | Setup time |

        ---
        *⚡ ASH Dotfiles v5.0 OMEGA Setup Action*
        EOF

        echo "  ✅ Step summary written"

# ─────────────────────────────────────────────────────────────────────────────
# BRANDING
# ─────────────────────────────────────────────────────────────────────────────
branding:
  icon: "zap"
  color: "purple"