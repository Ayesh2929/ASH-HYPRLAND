# ║                                                                                           ║
# ║  ─────────────────────────────────────────────────────────────────────────────────────── ║
# ║                                                                                           ║
# ║  🎯 BENCHMARK DOMAINS (12 categories):                                                    ║
# ║     ⚡ startup       — ASH CLI cold/warm start latency                                   ║
# ║     🎨 theme-apply   — Full theme application pipeline timing                            ║
# ║     🎨 color-extract — Color extraction throughput (images/sec)                          ║
# ║     🔥 hot-reload    — Hot-reload propagation latency per target                         ║
# ║     🌐 api           — REST API endpoint response times (p50/p95/p99)                   ║
# ║     📡 websocket     — WebSocket RTT and throughput                                      ║
# ║     🔌 plugin-load   — Plugin load/enable/disable cycle time                             ║
# ║     💾 snapshot      — Snapshot create/restore/diff performance                          ║
# ║     🧠 memory        — Peak RSS / heap / process memory                                  ║
# ║     🚀 throughput    — Batch operation throughput                                         ║
# ║     📊 custom        — User-defined benchmark suite                                      ║
# ║     🔄 regression    — Regression detection (compare vs baseline)                        ║
# ║                                                                                           ║
# ║  📊 OUTPUT FORMATS:                                                                       ║
# ║     JSON · Markdown · HTML · CSV · JUnit XML · GitHub Step Summary                      ║
# ║                                                                                           ║
# ║  🔬 STATISTICAL ANALYSIS:                                                                 ║
# ║     p50/p75/p90/p95/p99 · mean · stddev · CV% · IQR · min/max                          ║
# ║     Outlier detection · regression detection · trend analysis                            ║
# ║                                                                                           ║
# ╚═══════════════════════════════════════════════════════════════════════════════════════════╝

name: "⚡ Benchmark Runner"
description: >
  🔬 Ultra-comprehensive performance benchmark runner for ASH Dotfiles v5.0 OMEGA.

  Executes 12 benchmark domains (startup, theme-apply, color-extract, hot-reload,
  API, WebSocket, plugin-load, snapshot, memory, throughput, custom, regression)
  using Hyperfine + Python statistical analysis. Generates rich reports in
  JSON/Markdown/HTML/CSV/JUnit formats with p50–p99 percentiles, outlier
  detection, regression detection, baseline comparison, GitHub Step Summary,
  PR comment injection, Discord notifications, and artifact upload.

author: "ASH Dotfiles Team <ash@dotfiles.dev>"

# ─────────────────────────────────────────────────────────────────────────────
# INPUTS — Complete specification (50+ inputs)
# ─────────────────────────────────────────────────────────────────────────────
inputs:

  # ╔══════════════════════════════════════════════════════╗
  # ║  🎯 BENCHMARK SELECTION                              ║
  # ╚══════════════════════════════════════════════════════╝

  benchmarks:
    description: >
      🎯 Benchmark domains to run (comma-separated or preset names).

      Domains:
        startup       — CLI cold/warm start latency
        theme-apply   — Full theme application pipeline
        color-extract — Color extraction throughput
        hot-reload    — Hot-reload propagation latency
        api           — REST API endpoint timing
        websocket     — WebSocket RTT & throughput
        plugin-load   — Plugin lifecycle timing
        snapshot      — Snapshot create/restore/diff
        memory        — Peak memory profiling
        throughput    — Batch operation throughput
        custom        — Custom user benchmark suite
        regression    — Regression detection only

      Presets:
        all           — All 12 domains (comprehensive, ~30min)
        quick         — startup + theme-apply + memory (~5min)
        ci            — startup + theme-apply + api (~10min)
        release       — all except websocket/custom (~20min)
        performance   — theme-apply + color-extract + hot-reload
        nightly       — all domains + regression

      Examples:
        "startup,theme-apply,memory"
        "ci"
        "all"
    required: false
    default: "ci"

  custom_benchmark_path:
    description: >
      📝 Path to custom benchmark script (for 'custom' domain).
      Script must output JSON results to stdout.
    required: false
    default: "benchmarks/custom-benchmarks.sh"

  exclude_benchmarks:
    description: >
      🚫 Comma-separated benchmark domains to exclude from run.
      Useful with preset modes: exclude="websocket,custom"
    required: false
    default: ""

  # ╔══════════════════════════════════════════════════════╗
  # ║  🔢 ITERATION CONTROL                                ║
  # ╚══════════════════════════════════════════════════════╝

  iterations:
    description: >
      🔢 Number of measurement iterations per benchmark.
      Higher = more statistical accuracy, longer runtime.
      Minimum: 3 (for meaningful statistics)
    required: false
    default: "10"

  warmup_runs:
    description: >
      🔥 Number of warmup runs before measurement (excluded from stats).
      Warms CPU caches, JIT compilation, filesystem caches.
    required: false
    default: "3"

  min_iterations:
    description: >
      🔢 Minimum iterations regardless of other settings.
      Ensures statistical validity.
    required: false
    default: "3"

  max_iterations:
    description: >
      🔢 Maximum iterations cap (prevents runaway long benchmarks).
    required: false
    default: "100"

  time_limit_seconds:
    description: >
      ⏱️ Per-benchmark time limit in seconds.
      Automatically reduces iterations if limit would be exceeded.
    required: false
    default: "300"

  # ╔══════════════════════════════════════════════════════╗
  # ║  📊 STATISTICAL CONFIGURATION                        ║
  # ╚══════════════════════════════════════════════════════╝

  percentiles:
    description: >
      📊 Percentiles to compute (comma-separated, 0-100).
      Standard set: "50,75,90,95,99"
      Extended set: "25,50,75,90,95,99,99.9"
    required: false
    default: "50,75,90,95,99"

  outlier_method:
    description: >
      🔬 Outlier detection algorithm.
      Options:
        iqr      — Interquartile range (Tukey fence, robust)
        zscore   — Z-score (3σ threshold)
        modified — Modified Z-score (Median Absolute Deviation)
        none     — No outlier removal
    required: false
    default: "iqr"

  outlier_threshold:
    description: >
      🔬 Outlier detection threshold multiplier.
      IQR: 1.5 (mild), 3.0 (extreme)
      Z-score: 2.5-3.5 (standard)
    required: false
    default: "1.5"

  confidence_level:
    description: >
      📊 Confidence level for statistical intervals (0.0-1.0).
      0.95 = 95% confidence interval (standard)
    required: false
    default: "0.95"

  time_unit:
    description: >
      ⏱️ Time unit for display in reports.
      Options: auto, ms, us, ns, s
      "auto" selects the most readable unit per benchmark.
    required: false
    default: "auto"

  # ╔══════════════════════════════════════════════════════╗
  # ║  🎯 REGRESSION DETECTION                             ║
  # ╚══════════════════════════════════════════════════════╝

  compare_baseline:
    description: >
      🔄 Enable baseline comparison for regression detection.
      Requires a previously stored baseline in cache or artifact.
    required: false
    default: "true"

  baseline_ref:
    description: >
      📋 Git ref for baseline comparison.
      Options: "main", "HEAD~1", specific SHA, branch name.
      Leave empty to use stored benchmark baseline.
    required: false
    default: "main"

  regression_threshold_pct:
    description: >
      🚨 Regression threshold as percentage slowdown.
      Benchmark fails if mean degrades by more than this %.
      Example: 15 = fail if 15% slower than baseline.
    required: false
    default: "15"

  regression_threshold_abs_ms:
    description: >
      🚨 Absolute regression threshold in milliseconds.
      Supplementary to percentage threshold.
      0 = disabled.
    required: false
    default: "0"

  fail_on_regression:
    description: >
      🚨 Fail the action if regression is detected.
      false = report only (default for PRs)
    required: false
    default: "false"

  save_baseline:
    description: >
      💾 Save current results as new baseline.
      Typically true on main branch merges.
    required: false
    default: "false"

  baseline_cache_key:
    description: >
      💾 Cache key for baseline storage.
      Change to invalidate cached baselines.
    required: false
    default: "ash-benchmarks-baseline-v5"

  # ╔══════════════════════════════════════════════════════╗
  # ║  🔧 TOOL CONFIGURATION                               ║
  # ╚══════════════════════════════════════════════════════╝

  hyperfine_version:
    description: "⚡ Hyperfine version to install"
    required: false
    default: "1.18.0"

  use_hyperfine:
    description: >
      ⚡ Use Hyperfine for precise benchmarking.
      Falls back to manual timing if not available.
    required: false
    default: "true"

  cpu_governor:
    description: >
      🖥️ Set CPU frequency governor for consistent benchmarks.
      Options: performance, powersave, schedutil, ondemand
      Requires root/sudo on Linux. Skipped if not available.
    required: false
    default: "performance"

  isolate_processes:
    description: >
      🔒 Attempt to minimize background process interference.
      Drops caches, disables swap, pins CPU affinity if possible.
    required: false
    default: "false"

  shell:
    description: >
      🐚 Shell to use for benchmark execution.
      Options: bash, sh, dash, zsh, fish
    required: false
    default: "bash"

  # ╔══════════════════════════════════════════════════════╗
  # ║  🎯 DOMAIN-SPECIFIC SETTINGS                         ║
  # ╚══════════════════════════════════════════════════════╝

  # Startup benchmark
  cli_path:
    description: "⚡ Path to ASH CLI binary"
    required: false
    default: "ash-cli/ash"

  startup_modes:
    description: >
      ⚡ Startup benchmark modes (comma-separated).
      Options: cold, warm, version, help, config-read
    required: false
    default: "cold,warm,version"

  # Theme benchmark
  theme_name:
    description: "🎨 Theme name for theme-apply benchmark"
    required: false
    default: "catppuccin-mocha"

  theme_targets:
    description: >
      🎨 Theme apply targets for hot-reload benchmark.
      Options: all, hyprland, waybar, kitty, dunst, gtk, nvim, fish
    required: false
    default: "all"

  # API benchmark
  api_host:
    description: "🌐 API server host for REST benchmarks"
    required: false
    default: "localhost"

  api_port:
    description: "🌐 API server port for REST benchmarks"
    required: false
    default: "8765"

  api_endpoints:
    description: >
      🌐 API endpoints to benchmark (comma-separated paths).
      Examples: "/health,/api/v1/themes,/api/v1/plugins"
    required: false
    default: "/health,/api/v1/themes,/api/v1/config"

  api_concurrent_users:
    description: "🌐 Concurrent users for API load test"
    required: false
    default: "10"

  # Memory benchmark
  memory_profile_interval_ms:
    description: "🧠 Memory sampling interval in milliseconds"
    required: false
    default: "50"

  # Wallpaper/image count for color-extract
  image_count:
    description: "🎨 Number of test images for color-extract benchmark"
    required: false
    default: "5"

  # Plugin count for plugin-load
  plugin_count:
    description: "🔌 Number of plugins to load in plugin-load benchmark"
    required: false
    default: "10"

  # ╔══════════════════════════════════════════════════════╗
  # ║  📤 OUTPUT & REPORTING                               ║
  # ╚══════════════════════════════════════════════════════╝

  output_formats:
    description: >
      📊 Report formats to generate (comma-separated or "all").
      Options: json, markdown, html, csv, junit, summary
      "all" generates all formats.
    required: false
    default: "json,markdown,summary"

  output_dir:
    description: "📁 Directory for benchmark output files"
    required: false
    default: ".benchmark-results"

  report_title:
    description: "📊 Custom title for benchmark reports"
    required: false
    default: "ASH Dotfiles v5.0 OMEGA — Performance Benchmarks"

  include_system_info:
    description: >
      🖥️ Include system information in reports.
      CPU model, RAM, OS, kernel, runner environment.
    required: false
    default: "true"

  include_git_info:
    description: >
      📋 Include git commit info in reports.
      SHA, branch, author, timestamp.
    required: false
    default: "true"

  chart_style:
    description: >
      📊 Chart visual style for HTML reports.
      Options: catppuccin, minimal, classic, dark, light
    required: false
    default: "catppuccin"

  # ╔══════════════════════════════════════════════════════╗
  # ║  💬 NOTIFICATIONS & CI INTEGRATION                   ║
  # ╚══════════════════════════════════════════════════════╝

  post_pr_comment:
    description: >
      💬 Post benchmark results as PR comment.
      Updates existing comment if found.
    required: false
    default: "true"

  pr_comment_style:
    description: >
      💬 PR comment display style.
      Options: full, compact, table-only, summary-only
    required: false
    default: "compact"

  notify_discord:
    description: "🔔 Send results to Discord webhook"
    required: false
    default: "false"

  discord_notify_on:
    description: >
      🔔 When to send Discord notification.
      Options: always, regression-only, failure-only
    required: false
    default: "regression-only"

  update_readme_badges:
    description: >
      🏅 Update README.md performance badges with current results.
      Commits badge updates to the repository.
    required: false
    default: "false"

  create_github_check:
    description: >
      ✅ Create a GitHub Check annotation with benchmark summary.
    required: false
    default: "true"

  # ╔══════════════════════════════════════════════════════╗
  # ║  🗂️  ARTIFACT & CACHING                              ║
  # ╚══════════════════════════════════════════════════════╝

  upload_results:
    description: "📤 Upload benchmark results as workflow artifact"
    required: false
    default: "true"

  artifact_retention_days:
    description: "📤 Artifact retention period in days"
    required: false
    default: "90"

  cache_tool_binaries:
    description: "💾 Cache downloaded benchmark tool binaries"
    required: false
    default: "true"

  # ╔══════════════════════════════════════════════════════╗
  # ║  ⚙️  BEHAVIOR                                         ║
  # ╚══════════════════════════════════════════════════════╝

  fail_on_error:
    description: >
      🚨 Fail action if any benchmark encounters an error.
      false = report errors, continue with remaining benchmarks.
    required: false
    default: "false"

  timeout_minutes:
    description: "⏱️ Total benchmark suite timeout in minutes"
    required: false
    default: "30"

  dry_run:
    description: >
      🔍 Dry run — show benchmark plan without executing.
    required: false
    default: "false"

  verbose:
    description: "📢 Enable verbose output with detailed timing"
    required: false
    default: "false"

  seed:
    description: >
      🎲 Random seed for reproducible benchmarks.
      0 = use timestamp-based seed.
    required: false
    default: "42"

  github_token:
    description: "🔑 GitHub token for API operations"
    required: false
    default: "${{ github.token }}"

# ─────────────────────────────────────────────────────────────────────────────
# OUTPUTS
# ─────────────────────────────────────────────────────────────────────────────
outputs:

  # ── Summary metrics ───────────────────────────────────────────────────────
  benchmarks_run:
    description: "🔢 Total number of benchmark cases executed"
    value: ${{ steps.run.outputs.benchmarks_run }}

  benchmarks_passed:
    description: "✅ Number of benchmarks that passed thresholds"
    value: ${{ steps.run.outputs.benchmarks_passed }}

  benchmarks_failed:
    description: "❌ Number of benchmarks that failed thresholds"
    value: ${{ steps.run.outputs.benchmarks_failed }}

  regressions_detected:
    description: "🚨 Number of performance regressions detected"
    value: ${{ steps.run.outputs.regressions_detected }}

  # ── Key performance metrics ────────────────────────────────────────────────
  startup_cold_ms:
    description: "⚡ Cold startup latency mean (ms)"
    value: ${{ steps.run.outputs.startup_cold_ms }}

  startup_warm_ms:
    description: "⚡ Warm startup latency mean (ms)"
    value: ${{ steps.run.outputs.startup_warm_ms }}

  theme_apply_ms:
    description: "🎨 Theme apply pipeline mean (ms)"
    value: ${{ steps.run.outputs.theme_apply_ms }}

  theme_apply_p95_ms:
    description: "🎨 Theme apply p95 latency (ms)"
    value: ${{ steps.run.outputs.theme_apply_p95_ms }}

  color_extract_ips:
    description: "🎨 Color extraction images/second throughput"
    value: ${{ steps.run.outputs.color_extract_ips }}

  hot_reload_ms:
    description: "🔥 Hot-reload propagation mean (ms)"
    value: ${{ steps.run.outputs.hot_reload_ms }}

  api_p50_ms:
    description: "🌐 API response p50 (ms)"
    value: ${{ steps.run.outputs.api_p50_ms }}

  api_p95_ms:
    description: "🌐 API response p95 (ms)"
    value: ${{ steps.run.outputs.api_p95_ms }}

  memory_peak_mb:
    description: "🧠 Peak memory usage (MB)"
    value: ${{ steps.run.outputs.memory_peak_mb }}

  # ── Report artifacts ──────────────────────────────────────────────────────
  results_json_path:
    description: "📋 Path to JSON results file"
    value: ${{ steps.run.outputs.results_json_path }}

  results_markdown_path:
    description: "📋 Path to Markdown report"
    value: ${{ steps.run.outputs.results_markdown_path }}

  results_html_path:
    description: "📋 Path to HTML report"
    value: ${{ steps.run.outputs.results_html_path }}

  artifact_url:
    description: "🔗 Uploaded artifact URL"
    value: ${{ steps.upload.outputs.artifact-url }}

  # ── Status ────────────────────────────────────────────────────────────────
  overall_status:
    description: "✅ Overall benchmark status (pass/fail/regression/error)"
    value: ${{ steps.run.outputs.overall_status }}

  regression_summary:
    description: "🚨 JSON summary of detected regressions"
    value: ${{ steps.run.outputs.regression_summary }}

  duration_seconds:
    description: "⏱️ Total benchmark suite duration (seconds)"
    value: ${{ steps.run.outputs.duration_seconds }}

  score:
    description: "📊 Overall performance score (0-100)"
    value: ${{ steps.run.outputs.score }}

# ─────────────────────────────────────────────────────────────────────────────
# RUNS
# ─────────────────────────────────────────────────────────────────────────────
runs:
  using: "composite"

  steps:

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 0 — Pre-flight: resolve benchmark plan
    # ─────────────────────────────────────────────────────────────────────────
    - name: "🔍 Pre-flight · Resolve benchmark plan & validate inputs"
      shell: bash
      id: preflight
      run: |
        set -euo pipefail

        WORKSPACE="${GITHUB_WORKSPACE:-$(pwd)}"
        START_TIME=$(date +%s)
        SESSION_ID="bench-$(date +%Y%m%d%H%M%S)-$(git rev-parse --short HEAD 2>/dev/null || echo 'ci')"
        echo "start_time=${START_TIME}" >> "$GITHUB_OUTPUT"
        echo "session_id=${SESSION_ID}" >> "$GITHUB_OUTPUT"

        echo ""
        echo "╔══════════════════════════════════════════════════════════════╗"
        echo "║  ⚡ ASH Benchmark Runner v5.0 OMEGA                           ║"
        echo "╠══════════════════════════════════════════════════════════════╣"
        printf "║  🆔 Session:    %-47s║\n" "${SESSION_ID}"
        printf "║  🎯 Benchmarks: %-47s║\n" "${{ inputs.benchmarks }}"
        printf "║  🔢 Iterations: %-47s║\n" "${{ inputs.iterations }}"
        printf "║  🔄 Regression: %-47s║\n" "${{ inputs.compare_baseline }}"
        printf "║  🔍 Dry Run:    %-47s║\n" "${{ inputs.dry_run }}"
        echo "╚══════════════════════════════════════════════════════════════╝"
        echo ""

        # ── Validate iterations ──────────────────────────────────────────────
        ITERS="${{ inputs.iterations }}"
        if ! [[ "${ITERS}" =~ ^[0-9]+$ ]] || [[ "${ITERS}" -lt 1 ]]; then
          echo "::error::iterations must be a positive integer"
          exit 1
        fi

        # ── Resolve benchmark preset → domain list ───────────────────────────
        INPUT="${{ inputs.benchmarks }}"
        ALL_DOMAINS="startup,theme-apply,color-extract,hot-reload,api,websocket,plugin-load,snapshot,memory,throughput,custom,regression"
        case "${INPUT}" in
          all)         RESOLVED="${ALL_DOMAINS}" ;;
          quick)       RESOLVED="startup,theme-apply,memory" ;;
          ci)          RESOLVED="startup,theme-apply,api" ;;
          release)     RESOLVED="startup,theme-apply,color-extract,hot-reload,api,plugin-load,snapshot,memory,throughput,regression" ;;
          performance) RESOLVED="theme-apply,color-extract,hot-reload" ;;
          nightly)     RESOLVED="${ALL_DOMAINS}" ;;
          *)           RESOLVED="${INPUT}" ;;
        esac

        # Apply exclusions
        EXCLUDE="${{ inputs.exclude_benchmarks }}"
        if [[ -n "${EXCLUDE}" ]]; then
          for excl in $(echo "${EXCLUDE}" | tr ',' ' '); do
            RESOLVED=$(echo "${RESOLVED}" | tr ',' '\n' | grep -v "^${excl}$" | tr '\n' ',' | sed 's/,$//')
          done
        fi

        BENCHMARK_COUNT=$(echo "${RESOLVED}" | tr ',' '\n' | grep -cv '^$' || echo 0)

        echo "resolved_benchmarks=${RESOLVED}" >> "$GITHUB_OUTPUT"
        echo "benchmark_count=${BENCHMARK_COUNT}" >> "$GITHUB_OUTPUT"
        echo "workspace=${WORKSPACE}" >> "$GITHUB_OUTPUT"

        echo "  🎯 Benchmarks: ${BENCHMARK_COUNT} domains"
        echo "  📋 Plan: ${RESOLVED}"

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 1 — Cache: tool binaries
    # ─────────────────────────────────────────────────────────────────────────
    - name: "💾 Cache · Benchmark tool binaries"
      if: inputs.cache_tool_binaries == 'true'
      id: cache-tools
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/bin/hyperfine
          ~/.cargo/bin/hyperfine
        key: >-
          bench-tools-hyperfine-${{ inputs.hyperfine_version }}-
          ${{ runner.os }}-${{ runner.arch }}
        restore-keys: |
          bench-tools-hyperfine-${{ inputs.hyperfine_version }}-${{ runner.os }}-

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 2 — Cache: baseline results
    # ─────────────────────────────────────────────────────────────────────────
    - name: "💾 Cache · Restore benchmark baseline"
      if: inputs.compare_baseline == 'true'
      id: cache-baseline
      uses: actions/cache@v4
      with:
        path: "${{ steps.preflight.outputs.workspace }}/.benchmark-baseline"
        key: >-
          ${{ inputs.baseline_cache_key }}-
          ${{ inputs.benchmarks }}-
          ${{ runner.os }}
        restore-keys: |
          ${{ inputs.baseline_cache_key }}-${{ inputs.benchmarks }}-
          ${{ inputs.baseline_cache_key }}-

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 3 — Install dependencies
    # ─────────────────────────────────────────────────────────────────────────
    - name: "📦 Dependencies · Install benchmark toolchain"
      shell: bash
      id: deps
      env:
        HYPERFINE_VERSION: ${{ inputs.hyperfine_version }}
        CACHE_HIT:         ${{ steps.cache-tools.outputs.cache-hit }}
      run: |
        set -euo pipefail

        echo "  📦 Installing benchmark toolchain..."

        # Python packages
        pip3 install --quiet --user \
          numpy==2.1.2 \
          scipy==1.14.1 \
          matplotlib==3.9.2 \
          pandas==2.2.3 \
          rich==13.9.2 \
          tabulate==0.9.0 \
          psutil==6.1.0 \
          jinja2==3.1.4 \
          2>/dev/null || true

        # System tools
        sudo apt-get install -y --no-install-recommends \
          jq bc time curl wget procps \
          2>/dev/null || true

        # Hyperfine
        if [[ "${CACHE_HIT}" != "true" ]] || ! command -v hyperfine &>/dev/null; then
          echo "  ⚡ Installing Hyperfine v${HYPERFINE_VERSION}..."

          ARCH=$(dpkg --print-architecture 2>/dev/null || echo "amd64")
          DEB_URL="https://github.com/sharkdp/hyperfine/releases/download/v${HYPERFINE_VERSION}/hyperfine_${HYPERFINE_VERSION}_${ARCH}.deb"

          if curl -sSfL "${DEB_URL}" -o /tmp/hyperfine.deb 2>/dev/null; then
            sudo dpkg -i /tmp/hyperfine.deb 2>/dev/null && \
              echo "  ✅ Hyperfine installed via deb" || {
              # Fallback: binary extraction
              mkdir -p "${HOME}/.local/bin"
              dpkg-deb -x /tmp/hyperfine.deb /tmp/hyperfine-extracted 2>/dev/null || true
              find /tmp/hyperfine-extracted -name "hyperfine" -type f -exec \
                install -m755 {} "${HOME}/.local/bin/hyperfine" \; || true
              echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
            }
            rm -f /tmp/hyperfine.deb
          else
            echo "  ⚠️  Hyperfine download failed — using manual timing fallback"
          fi
        fi

        # Verify
        echo ""
        echo "  ✅ Tool versions:"
        echo "     hyperfine: $(hyperfine --version 2>/dev/null || echo 'fallback mode')"
        echo "     python3:   $(python3 --version 2>/dev/null)"
        echo "     numpy:     $(python3 -c 'import numpy; print(numpy.__version__)' 2>/dev/null || echo '?')"
        echo "     scipy:     $(python3 -c 'import scipy; print(scipy.__version__)' 2>/dev/null || echo '?')"

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 4 — CPU performance setup
    # ─────────────────────────────────────────────────────────────────────────
    - name: "🖥️ CPU · Configure for consistent benchmarks"
      shell: bash
      id: cpu-setup
      if: inputs.isolate_processes == 'true' || inputs.cpu_governor != 'schedutil'
      run: |
        echo "  🖥️ Configuring CPU for benchmark stability..."

        # CPU governor
        GOVERNOR="${{ inputs.cpu_governor }}"
        if [[ -f /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor ]]; then
          echo "${GOVERNOR}" | sudo tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor \
            > /dev/null 2>&1 && \
            echo "  ✅ CPU governor: ${GOVERNOR}" || \
            echo "  ⚠️  CPU governor: not available"
        fi

        # Disable frequency boost (reduces jitter)
        if [[ -f /sys/devices/system/cpu/cpufreq/boost ]]; then
          echo 0 | sudo tee /sys/devices/system/cpu/cpufreq/boost > /dev/null 2>&1 || true
        fi

        if [[ "${{ inputs.isolate_processes }}" == "true" ]]; then
          # Drop file system caches
          sync
          echo 3 | sudo tee /proc/sys/vm/drop_caches > /dev/null 2>&1 || true
          echo "  ✅ Filesystem caches dropped"

          # Disable swap temporarily
          sudo swapoff -a 2>/dev/null && \
            echo "  ✅ Swap disabled" || \
            echo "  ⚠️  Swap: cannot disable"
        fi

        echo "  ✅ CPU configuration complete"
        echo "  📊 Runner: $(nproc) cores @ $(grep 'model name' /proc/cpuinfo | head -1 | cut -d: -f2 | xargs)"

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 5 — Main benchmark execution
    # ─────────────────────────────────────────────────────────────────────────
    - name: "⚡ Execute · Run benchmark suite"
      shell: bash
      id: run
      timeout-minutes: ${{ fromJson(inputs.timeout_minutes) }}
      env:
        # Session
        SESSION_ID:          ${{ steps.preflight.outputs.session_id }}
        START_TIME:          ${{ steps.preflight.outputs.start_time }}
        RESOLVED_BENCHMARKS: ${{ steps.preflight.outputs.resolved_benchmarks }}
        BENCHMARK_COUNT:     ${{ steps.preflight.outputs.benchmark_count }}
        WORKSPACE:           ${{ steps.preflight.outputs.workspace }}
        # Iteration config
        ITERATIONS:          ${{ inputs.iterations }}
        WARMUP_RUNS:         ${{ inputs.warmup_runs }}
        MIN_ITERATIONS:      ${{ inputs.min_iterations }}
        MAX_ITERATIONS:      ${{ inputs.max_iterations }}
        TIME_LIMIT_SECONDS:  ${{ inputs.time_limit_seconds }}
        # Statistical config
        PERCENTILES:         ${{ inputs.percentiles }}
        OUTLIER_METHOD:      ${{ inputs.outlier_method }}
        OUTLIER_THRESHOLD:   ${{ inputs.outlier_threshold }}
        CONFIDENCE_LEVEL:    ${{ inputs.confidence_level }}
        TIME_UNIT:           ${{ inputs.time_unit }}
        # Regression
        COMPARE_BASELINE:    ${{ inputs.compare_baseline }}
        BASELINE_REF:        ${{ inputs.baseline_ref }}
        REGRESSION_THRESHOLD_PCT: ${{ inputs.regression_threshold_pct }}
        REGRESSION_THRESHOLD_MS:  ${{ inputs.regression_threshold_abs_ms }}
        FAIL_ON_REGRESSION:  ${{ inputs.fail_on_regression }}
        SAVE_BASELINE:       ${{ inputs.save_baseline }}
        BASELINE_HIT:        ${{ steps.cache-baseline.outputs.cache-hit }}
        # Domain settings
        CLI_PATH:            ${{ inputs.cli_path }}
        STARTUP_MODES:       ${{ inputs.startup_modes }}
        THEME_NAME:          ${{ inputs.theme_name }}
        THEME_TARGETS:       ${{ inputs.theme_targets }}
        API_HOST:            ${{ inputs.api_host }}
        API_PORT:            ${{ inputs.api_port }}
        API_ENDPOINTS:       ${{ inputs.api_endpoints }}
        API_CONCURRENT:      ${{ inputs.api_concurrent_users }}
        MEMORY_INTERVAL_MS:  ${{ inputs.memory_profile_interval_ms }}
        IMAGE_COUNT:         ${{ inputs.image_count }}
        PLUGIN_COUNT:        ${{ inputs.plugin_count }}
        CUSTOM_BENCH_PATH:   ${{ inputs.custom_benchmark_path }}
        # Output config
        OUTPUT_FORMATS:      ${{ inputs.output_formats }}
        OUTPUT_DIR:          ${{ inputs.output_dir }}
        REPORT_TITLE:        ${{ inputs.report_title }}
        INCLUDE_SYSTEM_INFO: ${{ inputs.include_system_info }}
        INCLUDE_GIT_INFO:    ${{ inputs.include_git_info }}
        CHART_STYLE:         ${{ inputs.chart_style }}
        # Behavior
        DRY_RUN:             ${{ inputs.dry_run }}
        VERBOSE:             ${{ inputs.verbose }}
        FAIL_ON_ERROR:       ${{ inputs.fail_on_error }}
        BENCH_SEED:          ${{ inputs.seed }}
        USE_HYPERFINE:       ${{ inputs.use_hyperfine }}
        BENCH_SHELL:         ${{ inputs.shell }}
      run: |
        bash "${{ github.action_path }}/run-benchmarks.sh"

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 6 — Save baseline cache
    # ─────────────────────────────────────────────────────────────────────────
    - name: "💾 Baseline · Save results as new baseline"
      if: |
        inputs.save_baseline == 'true' &&
        steps.run.outputs.overall_status == 'pass' &&
        github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: "${{ steps.preflight.outputs.workspace }}/.benchmark-baseline"
        key: >-
          ${{ inputs.baseline_cache_key }}-
          ${{ inputs.benchmarks }}-
          ${{ runner.os }}

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 7 — Post PR comment
    # ─────────────────────────────────────────────────────────────────────────
    - name: "💬 Comment · Post benchmark results to PR"
      if: inputs.post_pr_comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const fs = require("fs");
          const path = require("path");

          const WORKSPACE     = "${{ steps.preflight.outputs.workspace }}";
          const OUTPUT_DIR    = `${WORKSPACE}/${{ inputs.output_dir }}`;
          const SESSION_ID    = "${{ steps.preflight.outputs.session_id }}";
          const STATUS        = "${{ steps.run.outputs.overall_status || 'unknown' }}";
          const TOTAL         = parseInt("${{ steps.run.outputs.benchmarks_run    || '0' }}");
          const PASSED        = parseInt("${{ steps.run.outputs.benchmarks_passed || '0' }}");
          const FAILED        = parseInt("${{ steps.run.outputs.benchmarks_failed || '0' }}");
          const REGRESSIONS   = parseInt("${{ steps.run.outputs.regressions_detected || '0' }}");
          const SCORE         = "${{ steps.run.outputs.score || '—' }}";
          const DURATION      = "${{ steps.run.outputs.duration_seconds || '?' }}";

          // Key metrics
          const STARTUP_COLD  = "${{ steps.run.outputs.startup_cold_ms  || '—' }}";
          const STARTUP_WARM  = "${{ steps.run.outputs.startup_warm_ms  || '—' }}";
          const THEME_APPLY   = "${{ steps.run.outputs.theme_apply_ms   || '—' }}";
          const THEME_P95     = "${{ steps.run.outputs.theme_apply_p95_ms || '—' }}";
          const COLOR_EXT     = "${{ steps.run.outputs.color_extract_ips || '—' }}";
          const HOT_RELOAD    = "${{ steps.run.outputs.hot_reload_ms    || '—' }}";
          const API_P50       = "${{ steps.run.outputs.api_p50_ms       || '—' }}";
          const API_P95       = "${{ steps.run.outputs.api_p95_ms       || '—' }}";
          const MEM_PEAK      = "${{ steps.run.outputs.memory_peak_mb   || '—' }}";
          const STYLE         = "${{ inputs.pr_comment_style }}";
          const BENCHMARKS    = "${{ steps.preflight.outputs.resolved_benchmarks }}";
          const RUN_URL       = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

          const STATUS_EMOJI  = {"pass":"✅","fail":"❌","regression":"⚠️","error":"💥","unknown":"❓"}[STATUS] || "❓";
          const SCORE_INT     = parseInt(SCORE) || 0;
          const SCORE_BAR_W   = 24;
          const SCORE_FILLED  = Math.round(SCORE_INT / 100 * SCORE_BAR_W);
          const SCORE_BAR     = "█".repeat(SCORE_FILLED) + "░".repeat(SCORE_BAR_W - SCORE_FILLED);
          const REGRESSION_S  = REGRESSIONS > 0 ? `🚨 **${REGRESSIONS} regression(s)** detected!` : "✅ No regressions";

          let mdReport = "";
          try {
            const reportPath = `${OUTPUT_DIR}/benchmark-report.md`;
            if (fs.existsSync(reportPath)) {
              mdReport = fs.readFileSync(reportPath, "utf8").slice(0, 3000);
            }
          } catch(e) {}

          const summaryRows = [
            STARTUP_COLD !== "—"  ? `| ⚡ Startup (cold)    | \`${STARTUP_COLD}ms\` |` : null,
            STARTUP_WARM !== "—"  ? `| ⚡ Startup (warm)    | \`${STARTUP_WARM}ms\` |` : null,
            THEME_APPLY  !== "—"  ? `| 🎨 Theme Apply (mean)| \`${THEME_APPLY}ms\` |` : null,
            THEME_P95    !== "—"  ? `| 🎨 Theme Apply (p95) | \`${THEME_P95}ms\` |` : null,
            COLOR_EXT    !== "—"  ? `| 🌈 Color Extract     | \`${COLOR_EXT} img/s\` |` : null,
            HOT_RELOAD   !== "—"  ? `| 🔥 Hot Reload        | \`${HOT_RELOAD}ms\` |` : null,
            API_P50      !== "—"  ? `| 🌐 API p50           | \`${API_P50}ms\` |` : null,
            API_P95      !== "—"  ? `| 🌐 API p95           | \`${API_P95}ms\` |` : null,
            MEM_PEAK     !== "—"  ? `| 🧠 Memory Peak       | \`${MEM_PEAK}MB\` |` : null,
          ].filter(Boolean).join("\n");

          const body = [
            `## ⚡ Benchmark Results — ${STATUS_EMOJI} ${STATUS.toUpperCase()}`,
            ``,
            `> 🆔 Session: \`${SESSION_ID}\`  &nbsp;·&nbsp;  **Score:** \`${SCORE}/100\`  &nbsp;·&nbsp;  ⏱️ \`${DURATION}s\``,
            ``,
            `\`\`\``,
            `Score: [${SCORE_BAR}] ${SCORE}/100`,
            `\`\`\``,
            ``,
            `### 📊 Results`,
            ``,
            `| Metric | Value |`,
            `|--------|------:|`,
            `| ✅ Passed | \`${PASSED}/${TOTAL}\` |`,
            `| ❌ Failed | \`${FAILED}/${TOTAL}\` |`,
            `| ${REGRESSIONS > 0 ? "🚨" : "✅"} Regressions | \`${REGRESSIONS}\` |`,
            `| 🎯 Domains | \`${BENCHMARKS.split(",").length}\` |`,
            ``,
            summaryRows ? [
              `### ⚡ Key Metrics`,
              ``,
              `| Benchmark | Result |`,
              `|-----------|-------:|`,
              summaryRows,
              ``,
            ].join("\n") : "",
            REGRESSIONS > 0 ? `### 🚨 Regression Alert\n\n${REGRESSION_S}\n` : "",
            mdReport ? [
              `<details>`,
              `<summary>📄 Full Report</summary>`,
              ``,
              mdReport,
              `</details>`,
            ].join("\n") : "",
            `---`,
            `*⚡ ASH v5.0 OMEGA Benchmark Runner · [View Run](${RUN_URL})*`,
          ].filter(Boolean).join("\n");

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existing = comments.find(c =>
            c.user.type === "Bot" && c.body.includes("Benchmark Results")
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: existing.id, body,
            });
            console.log(`✅ Updated benchmark comment #${existing.id}`);
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            console.log("✅ Created benchmark comment");
          }

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 8 — GitHub Check annotation
    # ─────────────────────────────────────────────────────────────────────────
    - name: "✅ Check · Create GitHub Check annotation"
      if: inputs.create_github_check == 'true' && always()
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const STATUS      = "${{ steps.run.outputs.overall_status || 'unknown' }}";
          const SCORE       = "${{ steps.run.outputs.score || '0' }}";
          const REGRESSIONS = parseInt("${{ steps.run.outputs.regressions_detected || '0' }}");
          const TOTAL       = "${{ steps.run.outputs.benchmarks_run || '0' }}";
          const PASSED      = "${{ steps.run.outputs.benchmarks_passed || '0' }}";
          const STARTUP     = "${{ steps.run.outputs.startup_cold_ms || '—' }}";
          const THEME       = "${{ steps.run.outputs.theme_apply_ms || '—' }}";
          const DURATION    = "${{ steps.run.outputs.duration_seconds || '?' }}";

          const conclusion_map = {
            pass: "success", fail: "failure",
            regression: "neutral", error: "failure", unknown: "neutral",
          };

          const title = STATUS === "pass"
            ? `✅ Benchmarks passed — Score: ${SCORE}/100`
            : REGRESSIONS > 0
              ? `⚠️ ${REGRESSIONS} regression(s) detected — Score: ${SCORE}/100`
              : `❌ Benchmarks failed — Score: ${SCORE}/100`;

          await github.rest.checks.create({
            owner:   context.repo.owner,
            repo:    context.repo.repo,
            name:    "⚡ ASH Performance Benchmarks",
            head_sha:context.sha || "${{ github.sha }}",
            status:  "completed",
            conclusion: conclusion_map[STATUS] || "neutral",
            output: {
              title,
              summary: [
                `**Score:** ${SCORE}/100`,
                `**Passed:** ${PASSED}/${TOTAL}`,
                `**Regressions:** ${REGRESSIONS}`,
                `**Duration:** ${DURATION}s`,
                `**Startup:** ${STARTUP}ms`,
                `**Theme Apply:** ${THEME}ms`,
              ].join("\n"),
            },
          }).catch(e => console.log(`Check creation: ${e.message}`));

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 9 — Discord notification
    # ─────────────────────────────────────────────────────────────────────────
    - name: "🔔 Discord · Send benchmark notification"
      if: inputs.notify_discord == 'true' && always()
      shell: bash
      continue-on-error: true
      env:
        STATUS:      ${{ steps.run.outputs.overall_status || 'unknown' }}
        SCORE:       ${{ steps.run.outputs.score || '0' }}
        REGRESSIONS: ${{ steps.run.outputs.regressions_detected || '0' }}
        TOTAL:       ${{ steps.run.outputs.benchmarks_run || '0' }}
        PASSED:      ${{ steps.run.outputs.benchmarks_passed || '0' }}
        STARTUP_MS:  ${{ steps.run.outputs.startup_cold_ms || '—' }}
        THEME_MS:    ${{ steps.run.outputs.theme_apply_ms || '—' }}
        API_P95_MS:  ${{ steps.run.outputs.api_p95_ms || '—' }}
        MEM_MB:      ${{ steps.run.outputs.memory_peak_mb || '—' }}
        DURATION:    ${{ steps.run.outputs.duration_seconds || '?' }}
        SESSION_ID:  ${{ steps.preflight.outputs.session_id }}
        NOTIFY_ON:   ${{ inputs.discord_notify_on }}
      run: |
        WEBHOOK="${DISCORD_WEBHOOK_BENCHMARKS:-}"
        [[ -z "${WEBHOOK}" ]] && exit 0

        # Notification filter
        case "${NOTIFY_ON}" in
          regression-only)
            [[ "${REGRESSIONS}" -eq 0 ]] && exit 0 ;;
          failure-only)
            [[ "${STATUS}" == "pass" ]] && exit 0 ;;
        esac

        # Color and emoji mapping
        case "${STATUS}" in
          pass)       COLOR=6416844;  ICON="✅" ;;
          regression) COLOR=16367145; ICON="⚠️" ;;
          fail|error) COLOR=16007085; ICON="❌" ;;
          *)          COLOR=8947848;  ICON="❓" ;;
        esac

        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

        curl -sf -X POST \
          -H "Content-Type: application/json" \
          -d "{
            \"username\": \"ASH Benchmark Bot\",
            \"avatar_url\": \"https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/assets/brand/logos/ash-logo-256.png\",
            \"content\": \"${ICON} Benchmark results for \`${GITHUB_REF_NAME}\`\",
            \"embeds\": [{
              \"title\": \"⚡ ASH Benchmark — ${STATUS^^}\",
              \"color\": ${COLOR},
              \"fields\": [
                {\"name\":\"📊 Score\",     \"value\":\"\`${SCORE}/100\`\",    \"inline\":true},
                {\"name\":\"✅ Passed\",    \"value\":\"\`${PASSED}/${TOTAL}\`\",\"inline\":true},
                {\"name\":\"🚨 Regressions\",\"value\":\"\`${REGRESSIONS}\`\",\"inline\":true},
                {\"name\":\"⚡ Startup\",  \"value\":\"\`${STARTUP_MS}ms\`\",  \"inline\":true},
                {\"name\":\"🎨 Theme\",    \"value\":\"\`${THEME_MS}ms\`\",    \"inline\":true},
                {\"name\":\"🌐 API p95\",  \"value\":\"\`${API_P95_MS}ms\`\",  \"inline\":true},
                {\"name\":\"🧠 Memory\",   \"value\":\"\`${MEM_MB}MB\`\",      \"inline\":true},
                {\"name\":\"⏱️ Duration\",  \"value\":\"\`${DURATION}s\`\",     \"inline\":true},
                {\"name\":\"🔗 Run\",       \"value\":\"[View](${RUN_URL})\",   \"inline\":true}
              ],
              \"footer\": {\"text\": \"ASH Dotfiles v5.0 OMEGA · Benchmark Runner\"},
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" \
          "${WEBHOOK}" && echo "  ✅ Discord notified" || echo "  ⚠️ Discord failed"
      env:
        DISCORD_WEBHOOK_BENCHMARKS: ${{ secrets.DISCORD_WEBHOOK_BENCHMARKS }}

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 10 — Upload artifacts
    # ─────────────────────────────────────────────────────────────────────────
    - name: "📤 Upload · Benchmark results artifact"
      if: inputs.upload_results == 'true' && always()
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: >-
          benchmarks-${{ steps.preflight.outputs.session_id }}-
          ${{ inputs.benchmarks }}-
          ${{ github.run_id }}
        path: |
          ${{ steps.preflight.outputs.workspace }}/${{ inputs.output_dir }}/
        retention-days: ${{ fromJson(inputs.artifact_retention_days) }}
        compression-level: 6
        if-no-files-found: warn

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 11 — Step Summary
    # ─────────────────────────────────────────────────────────────────────────
    - name: "📊 Summary · Write GitHub Step Summary"
      shell: bash
      if: always()
      env:
        STATUS:      ${{ steps.run.outputs.overall_status || 'unknown' }}
        SCORE:       ${{ steps.run.outputs.score || '0' }}
        TOTAL:       ${{ steps.run.outputs.benchmarks_run || '0' }}
        PASSED:      ${{ steps.run.outputs.benchmarks_passed || '0' }}
        FAILED:      ${{ steps.run.outputs.benchmarks_failed || '0' }}
        REGRESSIONS: ${{ steps.run.outputs.regressions_detected || '0' }}
        DURATION:    ${{ steps.run.outputs.duration_seconds || '?' }}
        STARTUP_C:   ${{ steps.run.outputs.startup_cold_ms || '—' }}
        STARTUP_W:   ${{ steps.run.outputs.startup_warm_ms || '—' }}
        THEME_MS:    ${{ steps.run.outputs.theme_apply_ms || '—' }}
        THEME_P95:   ${{ steps.run.outputs.theme_apply_p95_ms || '—' }}
        COLOR_IPS:   ${{ steps.run.outputs.color_extract_ips || '—' }}
        RELOAD_MS:   ${{ steps.run.outputs.hot_reload_ms || '—' }}
        API_P50:     ${{ steps.run.outputs.api_p50_ms || '—' }}
        API_P95:     ${{ steps.run.outputs.api_p95_ms || '—' }}
        MEM_MB:      ${{ steps.run.outputs.memory_peak_mb || '—' }}
        SESSION_ID:  ${{ steps.preflight.outputs.session_id }}
        BENCHMARKS:  ${{ steps.preflight.outputs.resolved_benchmarks }}
        TITLE:       ${{ inputs.report_title }}
      run: |
        SCORE_INT="${SCORE:-0}"
        BAR_W=25
        BAR_FILL=$(( SCORE_INT * BAR_W / 100 ))
        BAR_EMPTY=$(( BAR_W - BAR_FILL ))
        SCORE_BAR="$(printf '█%.0s' $(seq 1 "${BAR_FILL}" 2>/dev/null || true))"
        SCORE_BAR+="$(printf '░%.0s' $(seq 1 "${BAR_EMPTY}" 2>/dev/null || true))"

        STATUS_EMOJI="❓"
        case "${STATUS}" in
          pass)       STATUS_EMOJI="✅" ;;
          fail)       STATUS_EMOJI="❌" ;;
          regression) STATUS_EMOJI="⚠️" ;;
          error)      STATUS_EMOJI="💥" ;;
        esac

        cat >> "${GITHUB_STEP_SUMMARY}" << EOF
        # ⚡ ${TITLE}

        > ${STATUS_EMOJI} **${STATUS^^}**  &nbsp;·&nbsp;  Session: \`${SESSION_ID}\`

        \`\`\`
        Score: [${SCORE_BAR}] ${SCORE_INT}/100
        \`\`\`

        ## 📊 Results

        | Metric | Value | Metric | Value |
        |--------|------:|--------|------:|
        | ✅ Passed | \`${PASSED}/${TOTAL}\` | ❌ Failed | \`${FAILED}/${TOTAL}\` |
        | 🚨 Regressions | \`${REGRESSIONS}\` | ⏱️ Duration | \`${DURATION}s\` |

        ## ⚡ Key Metrics

        | Benchmark | Mean | p95 |
        |-----------|-----:|----:|
        | ⚡ Startup (cold) | \`${STARTUP_C}ms\` | — |
        | ⚡ Startup (warm) | \`${STARTUP_W}ms\` | — |
        | 🎨 Theme Apply | \`${THEME_MS}ms\` | \`${THEME_P95}ms\` |
        | 🌈 Color Extract | \`${COLOR_IPS} img/s\` | — |
        | 🔥 Hot Reload | \`${RELOAD_MS}ms\` | — |
        | 🌐 API | \`${API_P50}ms\` | \`${API_P95}ms\` |
        | 🧠 Memory Peak | — | \`${MEM_MB}MB\` |

        ---
        *⚡ ASH v5.0 OMEGA Benchmark Runner · Domains: \`${BENCHMARKS}\`*
        EOF

        echo "  ✅ Step summary written"

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 12 — Fail gate
    # ─────────────────────────────────────────────────────────────────────────
    - name: "🚨 Gate · Fail on regression or error"
      shell: bash
      if: always()
      run: |
        STATUS="${{ steps.run.outputs.overall_status || 'unknown' }}"
        REGRESSIONS="${{ steps.run.outputs.regressions_detected || '0' }}"
        FAIL_ON_REG="${{ inputs.fail_on_regression }}"
        FAIL_ON_ERR="${{ inputs.fail_on_error }}"

        if [[ "${FAIL_ON_REG}" == "true" && "${REGRESSIONS}" -gt 0 ]]; then
          echo "::error title=Performance Regression::${REGRESSIONS} regression(s) detected"
          exit 1
        fi

        if [[ "${FAIL_ON_ERR}" == "true" && "${STATUS}" == "error" ]]; then
          echo "::error title=Benchmark Error::Benchmark suite encountered errors"
          exit 1
        fi

        echo "✅ Gate passed (status=${STATUS}, regressions=${REGRESSIONS})"

