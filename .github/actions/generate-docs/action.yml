# ║  ─────────────────────────────────────────────────────────────────────────────────────── ║
# ║                                                                                           ║
# ║  🎯 DOCUMENTATION PIPELINE (15 generators):                                               ║
# ║     📚 MkDocs Material — full static site with navigation                                ║
# ║     🔌 Plugin API reference (auto-extracted from plugin.json)                            ║
# ║     🎨 Theme Gallery (auto-generated from themes/presets/)                               ║
