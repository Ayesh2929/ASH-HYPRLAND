# ║     📡 Multi-channel routing (up to 5 simultaneous webhook targets)                      ║
# ║     🎨 Rich embed builder (color/thumbnail/image/author/footer/fields)                   ║
# ║     🏷️  Message templates (12 built-in presets + custom)                                  ║
# ║     📊 Dynamic field grids (auto-layout, inline/block mixed)                             ║
