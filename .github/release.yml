# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🚀 ASH DOTFILES v5.0 OMEGA — RELEASE NOTES CONFIGURATION                  ║
# ║  Auto-generates beautiful release notes from PR labels & commits            ║
# ║  Docs: https://docs.github.com/en/repositories/releasing-projects-on-      ║
# ║        github/automatically-generated-release-notes                         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

changelog:

  # ── EXCLUSION RULES ─────────────────────────────────────────────────────────
  # PRs with these labels are excluded from release notes entirely
  exclude:
    labels:
      - "🤖 dependabot"              # Routine dependency updates
      - "🤖 bot"                     # Bot-generated PRs
      - "⏰ stale"                   # Stale cleanup
      - "🗑️ resolution: stale-closed" # Stale-closed items
      - "resolution: duplicate"      # Duplicate issues
      - "resolution: invalid"        # Invalid reports

  # ── CATEGORY DEFINITIONS ────────────────────────────────────────────────────
  # Order matters — first matching label wins for each PR
  categories:

    # ── 💥 BREAKING CHANGES — Always first, most prominent ──────────────────
    - title: "💥 Breaking Changes"
      labels:
        - "💥 breaking-change"
        - "🔄 migration"

    # ── 🔒 SECURITY — Critical visibility ────────────────────────────────────
    - title: "🔒 Security Patches & Hardening"
      labels:
        - "🔒 security"
        - "🔥 hotfix"

    # ── ✨ NEW FEATURES ────────────────────────────────────────────────────────
    - title: "✨ New Features"
      labels:
        - "✨ feature"

    # ── 🎨 THEMES ─────────────────────────────────────────────────────────────
    - title: "🎨 New Themes & Theme Improvements"
      labels:
        - "🎨 theme"

    # ── 🔌 PLUGINS ────────────────────────────────────────────────────────────
    - title: "🔌 New Plugins & Plugin Updates"
      labels:
        - "🔌 plugin"

    # ── 🖼️ WALLPAPERS ─────────────────────────────────────────────────────────
    - title: "🖼️ Wallpaper Additions"
      labels:
        - "🖼️ wallpaper"

    # ── 🌐 API ────────────────────────────────────────────────────────────────
    - title: "🌐 REST API Changes"
      labels:
        - "🌐 api"

    # ── 🤖 AI ─────────────────────────────────────────────────────────────────
    - title: "🤖 AI & Machine Learning"
      labels:
        - "🤖 ai"

    # ── 🖥️ WEB DASHBOARD ──────────────────────────────────────────────────────
    - title: "🖥️ Web Dashboard"
      labels:
        - "🌍 web"

    # ── 📱 MOBILE APP ─────────────────────────────────────────────────────────
    - title: "📱 Mobile App (Flutter)"
      labels:
        - "📱 mobile"

    # ── 🧩 BROWSER EXTENSION ──────────────────────────────────────────────────
    - title: "🧩 Browser Extension"
      labels:
        - "🧩 browser-extension"

    # ── 🐛 BUG FIXES ──────────────────────────────────────────────────────────
    - title: "🐛 Bug Fixes"
      labels:
        - "🐛 bug"

    # ── ⚡ PERFORMANCE ────────────────────────────────────────────────────────
    - title: "⚡ Performance Improvements"
      labels:
        - "⚡ performance"

    # ── ♿ ACCESSIBILITY ───────────────────────────────────────────────────────
    - title: "♿ Accessibility"
      labels:
        - "♿ accessibility"

    # ── 📝 NEOVIM IDE ─────────────────────────────────────────────────────────
    - title: "📝 Neovim IDE"
      labels:
        - "📝 component: neovim"

    # ── 🐟 SHELL ──────────────────────────────────────────────────────────────
    - title: "🐟 Fish Shell & Terminal"
      labels:
        - "🐟 component: fish"
        - "🖥️ component: kitty"

    # ── 🖥️ HYPRLAND ───────────────────────────────────────────────────────────
    - title: "🖥️ Hyprland Configuration"
      labels:
        - "🖥️ component: hyprland"
        - "🔒 component: hyprlock"

    # ── 📊 WAYBAR & ROFI ──────────────────────────────────────────────────────
    - title: "📊 Waybar & Rofi"
      labels:
        - "📊 component: waybar"
        - "🚀 component: rofi"

    # ── 🎮 GAMING ─────────────────────────────────────────────────────────────
    - title: "🎮 Gaming Features"
      labels:
        - "🎮 component: gaming"

    # ── ❄️ NIX / PACKAGING ────────────────────────────────────────────────────
    - title: "❄️ Nix & Packaging"
      labels:
        - "❄️ nix"
        - "🐳 docker"

    # ── 🔧 REFACTOR ───────────────────────────────────────────────────────────
    - title: "🔧 Refactoring & Code Quality"
      labels:
        - "🔧 refactor"

    # ── 🧪 TESTING ────────────────────────────────────────────────────────────
    - title: "🧪 Tests & Quality Assurance"
      labels:
        - "🧪 test"

    # ── 🏗️ DEVOPS ─────────────────────────────────────────────────────────────
    - title: "🏗️ CI/CD & DevOps"
      labels:
        - "🏗️ ci-cd"

    # ── 📖 DOCUMENTATION ──────────────────────────────────────────────────────
    - title: "📖 Documentation"
      labels:
        - "📖 documentation"

    # ── 🗑️ DEPRECATIONS ───────────────────────────────────────────────────────
    - title: "🗑️ Deprecations"
      labels:
        - "🗑️ deprecation"

    # ── 🙏 MISC — Catch-all for unlabeled PRs ─────────────────────────────────
    - title: "🙏 Other Changes"
      labels:
        - "*"