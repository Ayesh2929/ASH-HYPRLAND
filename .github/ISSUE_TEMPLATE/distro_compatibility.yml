    id: error_output
    attributes:
      label: "❌ Complete Error Output"
      description: >
        Paste ALL error output — including warnings that might seem unrelated.
        Run with verbose/debug flags for maximum detail.
      render: shell
      placeholder: |
        # Run install with verbose output:
        $ ASH_DEBUG=1 ./scripts/install/install.sh --verbose 2>&1 | tee /tmp/ash-install.log

        # Or paste the relevant error section:
        [INFO]  ══════════════════════════════════════════════════
        [INFO]  ASH Dotfiles v5.0 OMEGA — Installation
        [INFO]  Distribution: Fedora Linux 39
        [INFO]  ══════════════════════════════════════════════════
        [INFO]  Phase 3: Installing Hyprland ecosystem...
        [INFO]  Installing from COPR: hyprland/hyprland
        [OK]    hyprland-0.36.0-1.fc39.x86_64 installed
        [INFO]  Compiling Hyprland plugins...
        [INFO]  Building: hyprspace...
        -- The C compiler identification is GNU 13.2.1
        -- The CXX compiler identification is GNU 13.2.1
        -- Detecting C compiler ABI info - done
        [ERROR] /tmp/hyprspace/src/overview.cpp:8:10:
                fatal error: protocols/hyprland-toplevel-export-v1.h: No such file
        [ERROR] Build failed: hyprspace
        [WARN]  Continuing with remaining plugins...
        [ERROR] /tmp/hyprexpo/src/HyprExpo.cpp:12:10:
                fatal error: protocols/hyprland-toplevel-export-v1.h: No such file
        [ERROR] Build failed: hyprexpo
        [ERROR] 3 of 8 plugins failed to compile
        [ERROR] Run 'ash doctor --check-hyprland-plugins' for details

        # Doctor output:
        $ ash doctor --check-hyprland-plugins
        ❌ hyprspace: NOT installed (build failed)
        ❌ hyprexpo: NOT installed (build failed)
        ❌ hyprbars: NOT installed (build failed)
        ✅ hy3: installed
        ✅ hyprscroller: installed
        ⚠️  3/8 plugins failed — game-mode, expo-overview unavailable
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 07 — PACKAGE COMPATIBILITY MATRIX
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: package_matrix
    attributes:
      label: "📦 Package Availability Matrix"
      description: >
        Check which packages are available on your distribution.
        This helps us update the distro-specific dependency scripts.
        Run: `ash doctor --full --distro-compat` for automated checking.
      placeholder: |
        ## Core Dependencies Status on [Your Distro]

        Run: `ash doctor --check-dependencies --verbose`

        ### 🔴 CRITICAL — Missing or Wrong Version

        | Package | Required | Available | Source | Status |
        |---------|----------|-----------|--------|--------|
        | hyprland | ≥ 0.36.0 | 0.36.0 | COPR | ✅ OK |
        | hyprland-devel | ≥ 0.36.0 | ❌ MISSING | COPR | 🔴 FAIL |
        | waybar | ≥ 0.9.24 | 0.9.24 | DNF | ✅ OK |
        | rofi-wayland | ≥ 1.7.5 | 1.7.5 | DNF | ✅ OK |
        | swww | ≥ 0.8.2 | 0.8.1 | ❌ Too old | 🟡 WARN |
        | hyprlock | any | ❌ MISSING | No Fedora pkg | 🔴 FAIL |
        | hypridle | any | ❌ MISSING | No Fedora pkg | 🔴 FAIL |

        ### 🟡 OPTIONAL — Missing but Non-Critical

        | Package | Purpose | Available | Alternative |
        |---------|---------|-----------|-------------|
        | matugen | Color extraction | ❌ Missing | cargo install |
        | wl-clip-persist | Clipboard | ❌ Missing | cliphist works |
        | grimblast | Screenshot | Available | ✅ DNF |

        ### ✅ Working Packages

        | Package | Version | Source |
        |---------|---------|--------|
        | kitty | 0.32.2 | ✅ DNF |
        | fish | 3.7.0 | ✅ DNF |
        | neovim | 0.9.5 | ✅ DNF |
        | btop | 1.3.2 | ✅ DNF |
        | dunst | 1.10.0 | ✅ DNF |
        | starship | 1.18.0 | ✅ DNF |
        | yazi | 0.2.4 | ✅ COPR |
        | zoxide | 0.9.4 | ✅ DNF |

        ## Package Manager Commands Tested

        ```bash
        # What the install script runs vs what's needed:

        # Current deps-fedora.sh (BROKEN):
        sudo dnf install -y hyprland  # Missing: hyprland-devel

        # What's needed (FIX):
        sudo dnf install -y hyprland hyprland-devel  # Both required for plugin compilation

        # For missing packages, workaround:
        # 1. hyprlock: Build from AUR source adapted for Fedora
        # 2. hypridle: Same as above
        # 3. swww 0.8.2: cargo install --git https://github.com/LGFae/swww
        ```
    validations:
      required: true

