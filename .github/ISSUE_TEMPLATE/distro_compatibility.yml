  # ════════════════════════════════════════════════════════════════════
  # SECTION 12 — REPRODUCTION STEPS
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: reproduction
    attributes:
      label: "🔄 Exact Reproduction Steps"
      description: "Step-by-step instructions to reproduce the compatibility issue"
      placeholder: |
        ## From a Fresh Minimal Installation

        **Starting state:** Fresh Fedora 39 Workstation installation, Hyprland from COPR

        ```bash
        # Step 1: Ensure Hyprland is running
        echo $HYPRLAND_INSTANCE_SIGNATURE
        # Output: [some-hash]  ✅ Hyprland is active

        # Step 2: Clone ASH Dotfiles
        git clone https://github.com/ash-dotfiles/ash-dotfiles.git
        cd ash-dotfiles

        # Step 3: Run installation
        chmod +x scripts/install/install.sh
        ./scripts/install/install.sh

        # Step 4: Observe the failure
        # Output:
        # [INFO] Phase 3: Hyprland plugins...
        # [ERROR] Build failed: hyprspace (missing protocol headers)
        # [ERROR] Build failed: hyprexpo (missing protocol headers)
        # [ERROR] Build failed: hyprbars (missing protocol headers)

        # Step 5: Verify which packages are missing
        pkg-config --modversion hyprland
        # Output: Package hyprland was not found in the pkg-config search path.
        # Fix: sudo dnf install hyprland-devel
        # Then re-run: ./scripts/install/deps-fedora.sh --plugins-only
        ```

        ## Minimal Reproduction (Just the Failing Step)

        ```bash
        # Install hyprland WITHOUT hyprland-devel (as current script does):
        sudo dnf install -y hyprland

        # Try to compile any Hyprland plugin:
        git clone https://github.com/KZDKM/Hyprspace
        cd Hyprspace
        cmake -B build
        # Output: -- Could NOT find PkgConfig (missing: PKG_CONFIG_EXECUTABLE)
        # OR: CMake Error: Could not find hyprland
        ```

        ## Workaround (Manual Fix)

        ```bash
        # Add the missing package:
        sudo dnf install -y hyprland-devel

        # Re-run plugin installation:
        ash plugin install --hyprland-plugins

        # Verify:
        ash doctor --check-hyprland-plugins
        # ✅ hyprspace: installed
        # ✅ hyprexpo: installed
        ```
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 13 — PROPOSED FIX
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: proposed_fix
    attributes:
      label: "🔧 Proposed Fix / Workaround"
      description: >
        If you've identified the fix, provide it here with enough detail
        for us to implement and test it. PRs are warmly welcomed!
      placeholder: |
        ## ✅ Proposed Fix for deps-fedora.sh

        ### Current (Broken)
        ```bash
        # scripts/install/deps-fedora.sh — current state
        install_hyprland() {
          log::info "Installing Hyprland from COPR..."
          sudo dnf copr enable -y hyprland/hyprland
          sudo dnf install -y \
            hyprland \
            xdg-desktop-portal-hyprland
        }
        ```

        ### Fixed Version
        ```bash
        # scripts/install/deps-fedora.sh — proposed fix
        install_hyprland() {
          log::info "Installing Hyprland from COPR..."
          sudo dnf copr enable -y hyprland/hyprland
          sudo dnf install -y \
            hyprland \
            hyprland-devel \        # ← ADD THIS: required for plugin compilation
            xdg-desktop-portal-hyprland

          # Also install missing packages not currently in deps-fedora.sh:
          log::info "Installing hyprlock and hypridle..."
          # These are in the hyprland COPR but not listed in current script:
          sudo dnf install -y \
            hyprlock \
            hypridle \
            hyprpaper              # Alternative to swww if swww too old
        }

        install_optional_tools() {
          log::info "Installing optional tools via cargo (not in DNF)..."
          # matugen not in DNF — install via cargo:
          if command -v cargo &>/dev/null; then
            cargo install matugen
          fi

          # swww version in DNF (0.8.1) is below minimum (0.8.2):
          # Install from cargo until DNF package is updated:
          cargo install swww
        }
        ```

        ### Additional Fixes Needed

        1. **swww version:** Current Fedora DNF has 0.8.1, need 0.8.2+
           - Fix: Install via `cargo install swww` as fallback
           - OR: Accept 0.8.1 and update minimum version requirement

        2. **matugen:** Not available in DNF or any Fedora repo
           - Fix: Add cargo installation fallback in deps-fedora.sh
           - OR: Add `cargo install matugen` to post-install steps

        3. **hyprlock/hypridle:** Available in COPR but not in current script
           - Fix: Add to the `install_hyprland()` function

        ## 🧪 Tested Fix

        I've tested these changes manually:
        ```bash
        # After applying the fixes:
        ash doctor --check-dependencies
        # ✅ All 18 required packages: PRESENT
        # ✅ All 3 optional packages: PRESENT (via cargo)

        ash doctor --check-hyprland-plugins
        # ✅ 8/8 Hyprland plugins: compiled and installed
        ```

        ## 🔀 PR Ready?
        - [ ] ✅ I will submit a PR with this fix
        - [ ] 🔜 I can submit a PR but need 1-2 days
        - [ ] 📝 I've described the fix but cannot write the PR
    validations:
      required: false

