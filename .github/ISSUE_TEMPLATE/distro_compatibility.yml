        Run `ash hw full-report` OR `ash doctor --full --distro-compat`
        and paste the complete output. Include distro-specific details.
      placeholder: |
        ## Full System Information

        ```bash
        # Run: ash doctor --full --distro-compat 2>&1
        # OR fill in manually:
        ```

        ### Distribution Details
