        # 🐧 Distribution Compatibility Issue — ASH Dotfiles v5.0 OMEGA

        > *"Linux diversity is its greatest strength — ASH embraces every distro"*

        </div>

        ---

        > [!NOTE]
        > ASH Dotfiles officially targets **8 distributions:**
        >
        > | Distribution | Status | Package Manager | Init |
        > |-------------|--------|----------------|------|
        > | 🏔️ **Arch Linux** | 🟢 Primary | pacman + AUR | systemd |
        > | 🌀 **Fedora** (38, 39, 40) | 🟢 Full | dnf + COPR | systemd |
        > | ❄️ **NixOS** (23.11, 24.05) | 🟢 Full | nix + flake | systemd |
        > | 🦎 **openSUSE** (Tumbleweed) | 🟡 Good | zypper + OBS | systemd |
        > | 🌀 **Void Linux** | 🟡 Good | xbps | runit |
        > | 🐛 **Gentoo** | 🟡 Community | portage | OpenRC/systemd |
        > | 🌀 **Debian** (12+) | 🟠 Partial | apt + backports | systemd |
        > | 🍊 **Ubuntu** (22.04+) | 🟠 Partial | apt + PPA | systemd |
        >
        > **Community-supported:** EndeavourOS, Manjaro, CachyOS, Garuda,
        > Pop!_OS, Linux Mint, Nobara, openSUSE Leap

        > [!TIP]
        > **Before filing:** Run the distro-specific diagnostic:
        > ```bash
        > # Full compatibility diagnostic for your distro
        > ash doctor --full --distro-compat
        >
        > # Or run the distro-specific install test:
        > bash scripts/install/deps-[your-distro].sh --dry-run --verbose
        > ```

        ---

        ### 🐧 Pre-Submission Checklist

        - [ ] 🔍 Searched [existing distro issues](https://github.com/ash-dotfiles/ash-dotfiles/issues?q=label%3A%22distro-compatibility%22)
        - [ ] 📦 Verified all distro-specific dependencies are installed
        - [ ] 🔄 Tried the distro-specific installation script: `scripts/install/deps-[distro].sh`
        - [ ] 🩺 Ran `ash doctor --full --distro-compat` and reviewed output
        - [ ] 📖 Checked the [distro-specific guide](https://ash-dotfiles.github.io/docs) for your distribution
        - [ ] 💬 Searched [Discord #distro-help](https://discord.gg/ash-dotfiles) for similar reports

        ---

  # ════════════════════════════════════════════════════════════════════
  # SECTION 02 — DISTRIBUTION IDENTIFICATION
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: distribution
    attributes:
      label: "🐧 Linux Distribution"
      description: "Your exact Linux distribution"
      options:
        # Official Tier 1
        - "🏔️ Arch Linux (Rolling)"
        - "🏔️ EndeavourOS (Arch-based)"
        - "🏔️ Manjaro (Arch-based)"
        - "🏔️ CachyOS (Arch-based)"
        - "🏔️ Garuda Linux (Arch-based)"
        - "🏔️ Other Arch-based"
        # Fedora Family
        - "🌀 Fedora 40 (Latest)"
        - "🌀 Fedora 39"
        - "🌀 Fedora 38"
        - "🌀 Fedora Rawhide (Bleeding edge)"
        - "🌀 Nobara (Fedora-based)"
        - "🌀 Other Fedora/RPM-based"
        # NixOS
        - "❄️ NixOS 24.05 (Uakari)"
        - "❄️ NixOS 23.11 (Tapir)"
        - "❄️ NixOS Unstable (nixpkgs-unstable)"
        # openSUSE
        - "🦎 openSUSE Tumbleweed (Rolling)"
        - "🦎 openSUSE Leap 15.6"
        - "🦎 openSUSE Leap 15.5"
        - "🦎 SUSE Linux Enterprise (SLE)"
        # Void Linux
        - "🌀 Void Linux (glibc)"
        - "🌀 Void Linux (musl)"
        # Gentoo
        - "🐛 Gentoo Linux (systemd profile)"
        - "🐛 Gentoo Linux (OpenRC profile)"
        - "🐛 Calculate Linux (Gentoo-based)"
        # Debian Family
        - "🌀 Debian 12 (Bookworm)"
        - "🌀 Debian 11 (Bullseye)"
        - "🌀 Debian Testing (Trixie)"
        - "🌀 Debian Unstable (Sid)"
        - "🍊 Ubuntu 24.04 LTS (Noble)"
        - "🍊 Ubuntu 22.04 LTS (Jammy)"
        - "🍊 Ubuntu 23.10 (Mantic)"
        - "🍊 Linux Mint 21.x (Ubuntu-based)"
        - "🍊 Pop!_OS 22.04 (Ubuntu-based)"
        - "🍊 Zorin OS (Ubuntu-based)"
        - "🍊 Elementary OS (Ubuntu-based)"
        - "🍊 Other Debian/Ubuntu-based"
        # Other
        - "🔴 Alpine Linux"
        - "🟡 Solus"
        - "🟣 Slackware"
        - "⬛ Bedrock Linux"
        - "🔵 Other (specify below)"
    validations:
      required: true

  - type: input
    id: distro_version_detail
    attributes:
      label: "🔢 Exact Distribution Version"
      description: "Run `cat /etc/os-release` and paste the VERSION_ID and PRETTY_NAME"
      placeholder: |
        e.g., PRETTY_NAME="Fedora Linux 39 (Workstation Edition)" VERSION_ID="39"
        OR: NixOS 23.11.20240101.abc1234 (Tapir)
        OR: Arch Linux (rolling, 2024-01-15)
    validations:
      required: true

  - type: input
    id: kernel_version
    attributes:
      label: "🐧 Kernel Version"
      description: "Run `uname -r` and paste the result"
      placeholder: "e.g., 6.7.0-arch1-1 / 6.6.10-200.fc39.x86_64 / 6.1.69"
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 03 — INIT SYSTEM & CORE SERVICES
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: init_system
    attributes:
      label: "⚙️ Init System"
      description: "Which init system is your distribution running?"
      options:
        - "🔵 systemd — Standard (most distros)"
        - "🟢 OpenRC — Gentoo, Alpine, artix"
        - "🟡 runit — Void Linux, artix-runit"
        - "🟠 s6 — artix-s6, 66"
        - "🔴 dinit — artix-dinit"
        - "⚪ SysVinit — Slackware, very old distros"
        - "❓ Unknown"
    validations:
      required: true

  - type: dropdown
    id: desktop_session
    attributes:
      label: "🖥️ Desktop Session Type"
      description: "How is your Hyprland session started?"
      options:
        - "🖥️ SDDM (Display Manager) → Hyprland"
        - "🖥️ GDM → Hyprland"
        - "🖥️ LightDM → Hyprland"
        - "🖥️ ly → Hyprland"
        - "🖥️ greetd → Hyprland"
        - "🖥️ TTY → startx → Hyprland"
        - "🖥️ TTY → Hyprland (direct, no startx)"
        - "🖥️ TTY → uwsm → Hyprland"
        - "🖥️ NixOS home-manager → Hyprland"
        - "❓ Other / Unknown"
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 04 — COMPATIBILITY ISSUE TYPE
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: issue_type
    attributes:
      label: "🎯 Compatibility Issue Type"
      description: "What kind of compatibility problem are you experiencing?"
      multiple: true
      options:
        # Installation
        - "📦 Install — Missing package in distro's repository"
        - "📦 Install — Package version too old (below minimum required)"
        - "📦 Install — Package name differs from expected"
        - "📦 Install — Dependency conflict / incompatible packages"
        - "📦 Install — Installation script fails on this distro"
        - "📦 Install — AUR/COPR/Flake not available for this distro"
        # Paths & Configuration
        - "📁 Paths — Different XDG base directories"
        - "📁 Paths — Config files in wrong location for distro"
        - "📁 Paths — Binary not in expected PATH"
        - "📁 Paths — Systemd unit path differences"
        # Init System
        - "⚙️ Init — Non-systemd init system incompatibility"
        - "⚙️ Init — Systemd user session not available"
        - "⚙️ Init — Service fails to start on this distro's systemd"
        - "⚙️ Init — D-Bus session bus not available"
        # Runtime
        - "🔴 Runtime — Crash or error specific to this distro"
        - "🔴 Runtime — Feature broken on this distro"
        - "🔴 Runtime — Wrong behavior on this distro"
        # Wayland
        - "🌊 Wayland — XDG portals not working"
        - "🌊 Wayland — Screen sharing broken"
        - "🌊 Wayland — Input method issues"
        - "🌊 Wayland — Clipboard issues"
        - "🌊 Wayland — DMA-BUF / hardware acceleration"
        # GPU
        - "🖥️ GPU — NVIDIA driver version incompatibility"
        - "🖥️ GPU — AMD driver issues on this distro"
        - "🖥️ GPU — Intel GPU rendering issues"
        - "🖥️ GPU — Hybrid graphics (NVIDIA Optimus)"
        - "🖥️ GPU — Missing Vulkan support"
        # Shell
        - "🐟 Shell — Fish version too old"
        - "🐟 Shell — Shell integration broken"
        - "🐟 Shell — PATH not set correctly"
        # NixOS Specific
        - "❄️ Nix — Flake evaluation error"
        - "❄️ Nix — Home-manager module issue"
        - "❄️ Nix — Impure operation in pure environment"
        - "❄️ Nix — Missing nixpkgs package"
        # Gentoo Specific
        - "🐛 Gentoo — USE flag conflict"
        - "🐛 Gentoo — Emerge dependency resolution failure"
        - "🐛 Gentoo — OpenRC service script issue"
        # Other
        - "🔤 Locale — Character encoding / locale issues"
        - "📅 Version — Software version too old for features"
        - "🔒 Security — SELinux / AppArmor blocking operation"
        - "🔒 Security — seccomp restrictions"
        - "❓ Other / Unknown"
    validations:
      required: true

  - type: dropdown
    id: issue_severity
    attributes:
      label: "🚨 Compatibility Issue Severity"
      description: "How severely does this affect your ability to use ASH Dotfiles?"
      options:
        - "🔴 BLOCKER — Cannot install or run ASH at all on this distro"
        - "🟠 MAJOR — Core features broken, significant workflow impact"
        - "🟡 MEDIUM — Some features broken, workarounds exist"
        - "🟢 MINOR — Edge case, cosmetic issue, or rare scenario"
        - "💡 ENHANCEMENT — Works but could be better optimized for this distro"
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 05 — PROBLEM DESCRIPTION
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: problem_description
    attributes:
      label: "📋 Problem Description"
      description: >
        Describe exactly what fails on your distribution.
        Include specific commands, error messages, and behavior.
      placeholder: |
        ## 🔴 What Fails

        **On Fedora 39, the ASH installation script fails at the Hyprland plugin
        compilation step with a header file error.**

        When running `./scripts/install/deps-fedora.sh`:

        ```bash
        $ ./scripts/install/deps-fedora.sh

        [INFO] Installing Hyprland from COPR...
        ✅ hyprland-0.36.0 installed

        [INFO] Installing Hyprland plugins...
        🔨 Compiling hyprspace...

        /tmp/hyprspace-build/src/hyprspace.cpp:42:10:
        fatal error: protocols/hyprland-toplevel-export-v1.h: No such file or directory
           42 | #include <protocols/hyprland-toplevel-export-v1.h>
              |          ^~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        compilation terminated.
        make[1]: *** [CMakeFiles/hyprspace.dir/src/hyprspace.cpp.o] Error 1
        make: *** [all] Error 2

        [ERROR] Failed to build hyprspace plugin
        [ERROR] Installation incomplete — 3/8 Hyprland plugins failed
        ```

        ## ✅ What Works on Fedora

        - Hyprland installation via COPR: ✅
        - Waybar, Rofi, Kitty, Fish: ✅ (via DNF)
        - ASH CLI basic commands: ✅
        - Theme engine (non-plugin): ✅

        ## ❌ What Doesn't Work on Fedora

        - Hyprland plugin compilation: ❌ (missing protocol headers)
        - `hyprspace`, `hyprexpo`, `hyprbars`: ❌ (all fail same error)
        - Game mode (requires Hyprland plugin): ❌
        - `ash mode game`: ❌ (plugin dependency)

        ## 🔍 Root Cause Analysis

        The Hyprland COPR package for Fedora doesn't include the protocol header files
        that are needed for plugin compilation. On Arch Linux, these are included in
        the `hyprland` package, but on Fedora's COPR they're in a separate
        `hyprland-devel` package that the install script doesn't install.

        **Fix:** Add `hyprland-devel` to `scripts/install/deps-fedora.sh`
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 06 — ERROR OUTPUT
  # ════════════════════════════════════════════════════════════════════
