name: "🐧 Distribution Compatibility Issue"
description: >
  Report a compatibility issue with a specific Linux distribution.
  Help us make ASH Dotfiles work flawlessly across the entire
  Linux ecosystem with this comprehensive compatibility report.
title: "🐧 [DISTRO] — "
labels:
  - "🐧 distro-compatibility"
  - "🔍 needs-triage"
assignees: []

body:
  # ════════════════════════════════════════════════════════════════════
  # SECTION 01 — HERO BANNER
