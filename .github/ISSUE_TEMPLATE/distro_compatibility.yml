  # ════════════════════════════════════════════════════════════════════
  # SECTION 09 — DISTRO-SPECIFIC ISSUES
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: distro_specific_issues
    attributes:
      label: "🔧 Distro-Specific Technical Issues"
      description: "Select all that apply to your distribution"
