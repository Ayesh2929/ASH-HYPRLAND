# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.1.0 — ISSUE TEMPLATE CONFIG                      ║
# ║           Controls what appears in the "New Issue" menu                    ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

blank_issues_enabled: false

contact_links:

  # Primary documentation
  - name: 📚 Read the Documentation First
    url: https://github.com/yourusername/ash-dots/tree/main/docs
    about: |
      Check docs/ before filing an issue.
      KEYBINDS.md, THEMING.md, TROUBLESHOOTING.md, CUSTOMIZATION.md

  # Health check
  - name: 🏥 Run ash doctor First
    url: https://github.com/yourusername/ash-dots#health-check
    about: |
      Run 'ash doctor' to check 60+ system health points.
      Most issues are caught by the health checker.

  # Discussion for questions
  - name: 💬 Ask a Question (Discussions)
    url: https://github.com/yourusername/ash-dots/discussions/new?category=q-a
    about: |
      Not a bug? Ask in Discussions!
      Perfect for: setup help, configuration questions, workflow tips

  # Show and tell
  - name: 🎨 Share Your Setup (Show & Tell)
    url: https://github.com/yourusername/ash-dots/discussions/new?category=show-and-tell
    about: |
      Share your ASH-powered desktop!
      Screenshots, videos, custom configs welcome

  # Feature ideas
  - name: 💡 Ideas & Brainstorming
    url: https://github.com/yourusername/ash-dots/discussions/new?category=ideas
    about: |
      Have a vague idea that's not fully formed?
      Discuss in the Ideas category before creating a feature request

  # Community
  - name: 🐧 Reddit Community
    url: https://reddit.com/r/hyprland
    about: |
      r/hyprland for general Hyprland discussions,
      r/unixporn for ricing and desktop showcases

  # Arch wiki
  - name: 📖 Arch Wiki — Hyprland
    url: https://wiki.archlinux.org/title/Hyprland
    about: |
      Comprehensive Hyprland documentation on the Arch Wiki

  # Emergency
  - name: 🚨 Desktop Won't Start Emergency
    url: https://github.com/yourusername/ash-dots/blob/main/docs/TROUBLESHOOTING.md#nuclear-option
    about: |
      Desktop broke completely? See the Nuclear Option section
      in TROUBLESHOOTING.md for recovery steps