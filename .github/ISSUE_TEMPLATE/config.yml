#
#   ASH DOTFILES v5.0 OMEGA — ISSUE TEMPLATE CONFIGURATION
#
#   This file controls:
#   ┌─────────────────────────────────────────────────────────────────────────────────────┐
#   │  • Whether blank (unstructured) issues are allowed                                  │
#   │  • Contact links shown alongside template options                                   │
#   │  • External resources linked from the issue chooser                                 │
#   │  • Smart routing to the right support channel                                       │
#   └─────────────────────────────────────────────────────────────────────────────────────┘
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ════════════════════════════════════════════════════════════════════
# BLANK ISSUE POLICY
# ════════════════════════════════════════════════════════════════════

# Disable blank (freeform) issues — ALL issues must use a template.
#
# Rationale:
# ┌─────────────────────────────────────────────────────────────────────────────────────────┐
# │  Unstructured issues consistently lack the diagnostic data needed for resolution.       │
# │  Our templates guide reporters to provide GPU info, ASH version, system logs,           │
# │  reproduction steps, and other critical data upfront — saving days of back-and-forth.   │
# │                                                                                         │
# │  Users who need freeform discussion can use:                                            │
# │    • GitHub Discussions (for questions, ideas, showcase)                                │
# │    • Discord (for real-time help and community chat)                                    │
# │    • The "Other" category in the most relevant template                                 │
# └─────────────────────────────────────────────────────────────────────────────────────────┘
blank_issues_enabled: false

# ════════════════════════════════════════════════════════════════════
# CONTACT LINKS — External support channels
# ════════════════════════════════════════════════════════════════════
#
# These appear as additional options alongside the issue templates
# in the GitHub issue chooser. Use these to route users to the
# most appropriate channel for their needs.
#
# Design principles:
#   ✅ Route quick questions away from issue tracker
#   ✅ Surface security reporting prominently
#   ✅ Connect users to real-time community support
#   ✅ Provide self-service resources first
#   ✅ Direct contributors to the right workflow
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

contact_links:

  # ──────────────────────────────────────────────────────────────────
  # 🔒 SECURITY — Always first (highest priority)
  # ──────────────────────────────────────────────────────────────────
  - name: >-
      🔒 Report a Security Vulnerability (Private)
    url: >-
      https://github.com/ash-dotfiles/ash-dotfiles/security/advisories/new
    about: >-
      ⚠️ CRITICAL: Found a security vulnerability? Report it PRIVATELY
      here to protect users before a patch is released. Public issue
      reports for security vulnerabilities will be immediately closed.
      We follow 90-day coordinated disclosure with full reporter credit
      and bug bounty eligibility. Response guaranteed within 24 hours.

  # ──────────────────────────────────────────────────────────────────
  # 💬 COMMUNITY — Discord (primary real-time support)
  # ──────────────────────────────────────────────────────────────────
  - name: >-
      💬 Join the ASH Discord Community
    url: >-
      https://discord.gg/ash-dotfiles
    about: >-
      🚀 The fastest way to get help! Our Discord has 5,000+ members
      and dedicated channels for every topic:
      #general-help | #hardware-help | #theming | #plugins | #rice-showcase
      #neovim | #fish-shell | #nvidia-users | #api-dev | #mobile-app
      Most questions answered within minutes by the community.
      Requires no template — just ask! Average response: < 15 minutes.

  # ──────────────────────────────────────────────────────────────────
  # 💡 DISCUSSIONS — GitHub Discussions (structured async)
  # ──────────────────────────────────────────────────────────────────
  - name: >-
      💡 Start a GitHub Discussion (Ideas & Questions)
    url: >-
      https://github.com/ash-dotfiles/ash-dotfiles/discussions/new/choose
    about: >-
      Perfect for: Questions that need detailed answers, feature ideas
      you want community input on, sharing your rice/setup, polls,
      RFC proposals, or anything that doesn't fit the issue templates.
      Categories: 💬 Q&A | 🌟 Show & Tell | 💡 Ideas | 📣 Announcements
      | 🗳️ Polls | 📖 Documentation | 🔧 Dev Discussion

  # ──────────────────────────────────────────────────────────────────
  # 📖 DOCUMENTATION — Self-service first
  # ──────────────────────────────────────────────────────────────────
  - name: >-
      📖 Read the Documentation (Solve it yourself!)
    url: >-
      https://ash-dotfiles.github.io/docs
    about: >-
      📚 Before filing an issue, check our comprehensive documentation:
      ✅ Installation Guide | ✅ Quick Start | ✅ Configuration Reference
      ✅ Troubleshooting Guide | ✅ NVIDIA Setup | ✅ GPU Guides
      ✅ Plugin Development | ✅ Theme Creation | ✅ API Reference
      ✅ FAQ | ✅ Video Tutorials
      Most common issues are already answered here!

  # ──────────────────────────────────────────────────────────────────
  # 🩺 SELF-DIAGNOSIS — Run doctor first
  # ──────────────────────────────────────────────────────────────────
  - name: >-
      🩺 Run ASH Doctor Before Filing (auto-diagnose issues)
    url: >-
      https://ash-dotfiles.github.io/docs/troubleshooting/doctor
    about: >-
      Before filing any issue, run the built-in diagnostic tool:
      $ ash doctor --full
      ASH Doctor automatically checks 25+ system conditions, detects
      common misconfigurations, suggests fixes, and generates a
      diagnostic report you can attach to your issue. Many issues
      are resolved by doctor's auto-fix feature without filing at all!
      Run it first — save everyone time!

  # ──────────────────────────────────────────────────────────────────
  # 🎨 THEME STORE — Community themes
  # ──────────────────────────────────────────────────────────────────
  - name: >-
      🎨 Browse the ASH Theme Store
    url: >-
      https://ash-dotfiles.github.io/themes
    about: >-
      Discover 250+ curated themes! Browse by category, mood, color,
      or compatibility. Preview themes with live screenshots before
      installing. One-click install: ash theme store download [name]
      Can't find what you want? Submit your own theme using the
      🎨 Theme Submission issue template!

  # ──────────────────────────────────────────────────────────────────
  # 🔌 PLUGIN STORE — Community plugins
  # ──────────────────────────────────────────────────────────────────
  - name: >-
      🔌 Browse the ASH Plugin Store
    url: >-
      https://ash-dotfiles.github.io/plugins
    about: >-
      Discover 150+ plugins to supercharge your ASH desktop!
      Categories: Productivity | Gaming | Streaming | Health | AI
      | Smart Home | Development | Media | Social | Finance
      Install any plugin: ash plugin install [plugin-id]
      Want to build your own? $ ash plugin create --interactive

  # ──────────────────────────────────────────────────────────────────
  # 🏆 SHOWCASE — Community rices
  # ──────────────────────────────────────────────────────────────────
  - name: >-
      🌟 Showcase Your Rice (Show & Tell)
    url: >-
      https://github.com/ash-dotfiles/ash-dotfiles/discussions/categories/show-and-tell
    about: >-
      Proud of your ASH setup? Share it with the community!
      Post screenshots, themes, configs, and workflows.
      Get inspired by other users' setups.
      Top rices are featured in the README gallery!
      Also join: r/unixporn | Discord #rice-showcase

  # ──────────────────────────────────────────────────────────────────
  # 🤝 CONTRIBUTING — For contributors
  # ──────────────────────────────────────────────────────────────────
  - name: >-
      🤝 Contribute to ASH Dotfiles
    url: >-
      https://ash-dotfiles.github.io/docs/contributing/CONTRIBUTING
    about: >-
      Want to contribute? We welcome ALL contributions:
      🎨 Themes | 🔌 Plugins | 📖 Documentation | 🐛 Bug Fixes
      ✨ Features | 🌍 Translations | 🧪 Tests | 🎨 Art/Icons
      Read our Contributing Guide for: code style, PR process,
      dev environment setup, and where to start as a newcomer.
      First-time contributors: look for "good first issue" label!

  # ──────────────────────────────────────────────────────────────────
  # 📊 ROADMAP — Future plans
  # ──────────────────────────────────────────────────────────────────
  - name: >-
      🗺️ View the Public Roadmap
    url: >-
      https://github.com/orgs/ash-dotfiles/projects/1
    about: >-
      See what's planned for upcoming releases!
      ASH Dotfiles v5.x roadmap includes:
      🔜 v5.1 — Enhanced AI theme generation
      🔜 v5.2 — Improved mobile app features
      🔜 v5.3 — More distro support (Alpine, Slackware)
      🔜 v6.0 — Major architecture improvements
      Vote on features and track implementation progress.

  # ──────────────────────────────────────────────────────────────────
  # 💰 SPONSOR — Support the project
  # ──────────────────────────────────────────────────────────────────
  - name: >-
      💰 Sponsor ASH Dotfiles Development
    url: >-
      https://github.com/sponsors/ash-dotfiles
    about: >-
      ASH Dotfiles is free and open source. Your sponsorship helps:
      ☕ Keep maintainers motivated | 🖥️ CI/CD infrastructure costs
      🏆 Bug bounty program | 📱 App store developer accounts
      🎁 Community events and giveaways
      Tiers: ☕ Coffee ($3) | 🥇 Supporter ($10) | 🏆 Champion ($25)
      All sponsors get: Sponsor badge in Discord + README credit