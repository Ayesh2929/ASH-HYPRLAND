        # 🌐 API Issue — ASH Dotfiles v5.0 OMEGA

        > *"A great API is the foundation of a great ecosystem"*

        </div>

        ---

        > [!NOTE]
        > **ASH Dotfiles API Surface:**
        >
        > | API | Base URL / Location | Version | Docs |
        > |-----|---------------------|---------|------|
        > | 🌐 **REST API** | `http://localhost:7070/api/v1` | v1 | [OpenAPI Spec](https://ash-dotfiles.github.io/api/openapi) |
        > | 🔌 **WebSocket** | `ws://localhost:7070/ws/v1` | v1 | [WS Protocol](https://ash-dotfiles.github.io/api/websocket) |
        > | 🔧 **Plugin Shell API** | `ash::plugin::*` functions | 2.0 | [Plugin SDK](https://ash-dotfiles.github.io/docs/plugin-api) |
        > | 📋 **IPC API** | Hyprland socket + ASH socket | 1.0 | [IPC Docs](https://ash-dotfiles.github.io/docs/ipc) |
        > | 🐟 **Fish API** | `ash_*` fish functions | 5.0 | [Fish Docs](https://ash-dotfiles.github.io/docs/fish-api) |

        > [!TIP]
        > **Quick API diagnostics:**
        > ```bash
        > # Check REST API health:
        > curl -s http://localhost:7070/api/v1/health | jq
        >
        > # Check API server status:
        > ash api status --verbose
        >
        > # Validate your request against OpenAPI spec:
        > ash api validate --request "GET /api/v1/themes"
        >
        > # Check Plugin API compatibility:
        > ash plugin compat-check --api-version 2.0
        >
        > # Full API diagnostic:
        > ash doctor --api --verbose
        > ```

        ---

        ### 🌐 API Issue Pre-Flight Checklist

        - [ ] 📖 Read the [API Reference](https://ash-dotfiles.github.io/api/) for the affected endpoint
        - [ ] 🔄 Tested against the **latest API version** (`ash api --version`)
        - [ ] 🔑 Verified authentication token is **valid and not expired**
        - [ ] 📋 Validated request against the [OpenAPI specification](https://ash-dotfiles.github.io/api/openapi)
        - [ ] 🔍 Searched [existing API issues](https://github.com/ash-dotfiles/ash-dotfiles/issues?q=label%3A%22api%22)
        - [ ] 💬 Checked [Discord #api-dev](https://discord.gg/ash-dotfiles) for related discussions

        ---

  # ════════════════════════════════════════════════════════════════════
  # SECTION 02 — API SURFACE AFFECTED
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: api_surface
    attributes:
      label: "🎯 API Surface Affected"
      description: "Which ASH API has the issue?"
      options:
        - "🌐 REST API — HTTP endpoints (http://localhost:7070/api/v1/...)"
        - "🔌 WebSocket API — Real-time events (ws://localhost:7070/ws/v1)"
        - "🔧 Plugin Shell API — ash::plugin::* bash functions"
        - "🎨 Theme Shell API — ash::theme::* bash functions"
        - "⚙️ Mode Shell API — ash::mode::* bash functions"
        - "📋 Config Shell API — ash::config::* bash functions"
        - "🔔 Notification Shell API — ash::notification::* functions"
        - "📊 Analytics Shell API — ash::analytics::* functions"
        - "🪝 Hook Shell API — ash::hook::* bash functions"
        - "🔒 Secrets Shell API — ash::secrets::* bash functions"
        - "💾 State Shell API — ash::state::* bash functions"
        - "🐟 Fish API — ash_* fish functions"
        - "📋 IPC API — Unix socket / Hyprland IPC"
        - "📱 Mobile API — Mobile app REST client"
        - "🖥️ Web Dashboard API — Dashboard → REST API"
        - "❓ Unknown / Multiple"
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 03 — ISSUE TYPE
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: issue_type
    attributes:
      label: "🔍 API Issue Type"
      description: "What kind of API problem are you experiencing?"
      multiple: true
      options:
        # Correctness
        - "❌ Wrong Response — Endpoint returns incorrect data"
        - "❌ Wrong Status Code — Incorrect HTTP status code returned"
        - "❌ Missing Field — Response missing documented fields"
        - "❌ Wrong Field Type — Field type differs from spec (string vs int)"
        - "❌ Incorrect Behavior — API does something different from docs"
        - "❌ Race Condition — Concurrent calls produce incorrect state"
        # Reliability
        - "💥 Server Error — 500/503 responses on valid requests"
        - "💥 Timeout — Endpoint hangs without responding"
        - "💥 Memory Leak — API server memory grows without bound"
        - "💥 Crash — API server process crashes on specific requests"
        - "💥 Infinite Loop — Request causes server to spin"
        # Authentication
        - "🔑 Auth Failure — Valid token rejected (401)"
        - "🔑 Auth Bypass — Request succeeds without authentication"
        - "🔑 Token Expiry — Tokens expire too quickly or not at all"
        - "🔑 CORS Error — Cross-origin requests blocked/allowed incorrectly"
        - "🔑 Permission Error — Authorized user denied valid operation (403)"
        # Breaking Changes
        - "💔 Breaking Change — API changed without notice/deprecation"
        - "💔 Removed Endpoint — Previously documented endpoint gone"
        - "💔 Renamed Field — Field renamed in response without migration"
        - "💔 Plugin API Breaking — Plugin SDK function signature changed"
        # Schema & Documentation
        - "📋 Schema Mismatch — Response doesn't match OpenAPI schema"
        - "📋 Undocumented Behavior — API behavior not in docs"
        - "📋 Wrong Example — OpenAPI example is incorrect"
        - "📋 Missing Endpoint — Documented endpoint doesn't exist"
        # Performance
        - "⚡ Slow Response — Endpoint takes too long"
        - "⚡ Rate Limit Issue — Rate limiting too aggressive or not working"
        - "⚡ Pagination Bug — Pagination returns wrong data or hangs"
        # WebSocket Specific
        - "🔌 WS Connection Drop — WebSocket disconnects unexpectedly"
        - "🔌 WS Missing Event — Subscribed event never received"
        - "🔌 WS Wrong Payload — Event payload format incorrect"
        - "🔌 WS Reconnect — Reconnection doesn't restore subscriptions"
        # Feature
        - "✨ Missing Endpoint — New endpoint needed"
        - "✨ Missing Field — Additional field needed in response"
        - "✨ Missing Filter — Filtering/sorting option needed"
        - "✨ Missing WebSocket Event — New event type needed"
        # Plugin API
        - "🔧 Plugin API Function Missing — Needed function not in SDK"
        - "🔧 Plugin API Function Broken — SDK function returns wrong result"
        - "🔧 Plugin API Compatibility — API incompatible between versions"
        - "❓ Other"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "🚨 Issue Severity"
      options:
        - "🔴 CRITICAL — API completely broken / security vulnerability"
        - "🟠 HIGH — Major feature unusable / production blocker"
        - "🟡 MEDIUM — Feature degraded / workaround exists"
        - "🟢 LOW — Minor issue / edge case / cosmetic"
        - "✨ ENHANCEMENT — API works but needs new capability"
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 04 — ENDPOINT DETAILS (REST API)
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: endpoint_details
    attributes:
      label: "📡 Endpoint Details (REST API — fill if applicable)"
      description: >
        For REST API issues, provide complete request/response details.
        Use `curl -v` for full HTTP details including headers.
      placeholder: |
        ## 🎯 Affected Endpoint

        | Property | Value |
        |----------|-------|
        | Method | GET / POST / PUT / PATCH / DELETE |
        | Endpoint | `/api/v1/themes/{theme_id}/apply` |
        | Full URL | `http://localhost:7070/api/v1/themes/catppuccin-mocha/apply` |
        | API Version | v1 |
        | Auth Required | Yes (Bearer token) |

        ## 📤 Request

        ```http
        POST /api/v1/themes/catppuccin-mocha/apply HTTP/1.1
        Host: localhost:7070
        Authorization: Bearer ash_tok_xxxxxxxxxxxxxxxxxxx
        Content-Type: application/json
        Accept: application/json
        X-ASH-Client: web-dashboard/1.2.0

        {
          "wallpaper": "/home/user/Pictures/my-wallpaper.jpg",
          "transition": "smooth",
          "reload_targets": ["waybar", "kitty", "nvim"],
          "dry_run": false
        }
        ```

        ## 📥 Actual Response (BROKEN)

        ```http
        HTTP/1.1 500 Internal Server Error
        Content-Type: application/json
        X-ASH-Request-ID: req_abc123
        X-ASH-Version: 5.0.2
        X-RateLimit-Limit: 60
        X-RateLimit-Remaining: 58

        {
          "error": {
            "code": "THEME_APPLY_FAILED",
            "message": "Failed to apply theme: color extraction error",
            "details": {
              "stage": "color_extraction",
              "wallpaper": "/home/user/Pictures/my-wallpaper.jpg",
              "reason": "null reference in palette generator"
            },
            "request_id": "req_abc123",
            "timestamp": "2024-01-15T14:32:01Z"
          }
        }
        ```

        ## ✅ Expected Response (per OpenAPI spec)

        ```http
        HTTP/1.1 200 OK
        Content-Type: application/json

        {
          "success": true,
          "theme": {
            "id": "catppuccin-mocha",
            "name": "Catppuccin Mocha",
            "applied_at": "2024-01-15T14:32:01Z"
          },
          "duration_ms": 1247,
          "reloaded_targets": ["waybar", "kitty", "nvim"],
          "wallpaper_applied": true
        }
        ```

        ## 🔬 Full curl -v Output

        ```bash
        $ curl -v -X POST \
          -H "Authorization: Bearer ash_tok_xxx" \
          -H "Content-Type: application/json" \
          -d '{"wallpaper":"/home/user/Pictures/my-wallpaper.jpg","transition":"smooth"}' \
          http://localhost:7070/api/v1/themes/catppuccin-mocha/apply

        *   Trying 127.0.0.1:7070...
        * Connected to localhost (127.0.0.1) port 7070 (#0)
        > POST /api/v1/themes/catppuccin-mocha/apply HTTP/1.1
        > Host: localhost:7070
        > Authorization: Bearer ash_tok_xxx
        > Content-Type: application/json
        > Content-Length: 75
        >
        < HTTP/1.1 500 Internal Server Error
        < Content-Type: application/json
        < X-ASH-Request-ID: req_abc123
        <
        {"error":{"code":"THEME_APPLY_FAILED",...}}
        ```
    validations:
      required: false

  # ════════════════════════════════════════════════════════════════════
  # SECTION 05 — PLUGIN API DETAILS
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: plugin_api_details
    attributes:
      label: "🔧 Plugin Shell API Details (Plugin SDK — fill if applicable)"
      description: >
        For Plugin SDK / Shell API issues, provide function call details
        and exact error output.
      placeholder: |
        ## 🎯 Affected Plugin API Function

        | Property | Value |
        |----------|-------|
        | Function | `ash::theme::set_accent` |
        | API Version | 2.0 |
        | Declared in | Plugin API 2.0 (ash >= 5.0.0) |
        | Plugin using it | my-custom-plugin v1.2.0 |
        | Stability | @stable (documented as stable) |

        ## 📜 Code Causing the Issue

        ```bash
        #!/usr/bin/env bash
        # my-plugin/lib/theme-integration.sh

        source "${ASH_PLUGIN_API}"  # /usr/lib/ash/plugin-api.sh

        # Attempt to temporarily shift accent color
        ash::theme::set_accent "#ff5580" --duration 300

        # ↑ This call returns exit code 1 with no error message
        # The accent does NOT change, no notification sent
        # ash::plugin::log shows nothing in debug mode either
        ```

        ## ❌ Actual Behavior

        ```bash
        # Debug trace output:
        $ ASH_DEBUG=1 ASH_TRACE=1 bash my-plugin/lib/theme-integration.sh

        [DEBUG] ash::theme::set_accent called with: "#ff5580" --duration 300
        [DEBUG] ash::theme::_validate_hex_color: "#ff5580" → valid
        [DEBUG] ash::theme::_get_current_accent → "#1e66f5"
        [TRACE] Calling: hyprctl keyword general:col.active_border ...
        [DEBUG] hyprctl exit code: 0
        [ERROR] ash::theme::set_accent: Failed to update theme config
        [ERROR] Exit code: 1

        # But the color DID apply to Hyprland, just not to the theme config
        # So partial application with wrong exit code and no rollback
        ```

        ## ✅ Expected Behavior (per SDK docs v2.0)

        From [Plugin API docs](https://ash-dotfiles.github.io/docs/plugin-api#theme-set-accent):

        > `ash::theme::set_accent <hex_color> [--duration <seconds>]`
        > Sets the primary accent color temporarily. After `--duration` seconds,
        > reverts to the original accent color.
        >
        > **Returns:** 0 on success, non-zero on failure
        > **Side effects:** Updates all running components via hot-reload

        **Expected exit code:** 0 (success)
        **Expected behavior:** Both Hyprland AND theme config updated atomically

        ## 🔬 Minimal Reproducer

        ```bash
        #!/usr/bin/env bash
        # Minimal reproduction — no plugin boilerplate

        source /usr/lib/ash/plugin-api.sh

        echo "Before: $(ash::theme::get_accent)"
        ash::theme::set_accent "#ff5580"
        echo "Exit code: $?"
        echo "After: $(ash::theme::get_accent)"

        # Expected output:
        # Before: #1e66f5
        # Exit code: 0
        # After: #ff5580

        # Actual output:
        # Before: #1e66f5
        # Exit code: 1
        # After: #1e66f5  ← Not changed despite Hyprland applying it
        ```

        ## 📋 Plugin API Version in Use

        ```bash
        $ ash plugin compat-check --api-version 2.0 --verbose
        Plugin API v2.0 compatibility check:
        ✅ Core functions: available
        ✅ Theme functions: available
        ⚠️  ash::theme::set_accent: available but returns wrong exit code
        ✅ Mode functions: available
        ```
    validations:
      required: false

  # ════════════════════════════════════════════════════════════════════
  # SECTION 06 — WEBSOCKET API DETAILS
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: websocket_details
    attributes:
      label: "🔌 WebSocket API Details (fill if WebSocket issue)"
      description: >
        For WebSocket API issues, provide connection details and event traces.
      placeholder: |
        ## 🔌 WebSocket Connection Details

        | Property | Value |
        |----------|-------|
        | Endpoint | `ws://localhost:7070/ws/v1` |
        | Protocol version | v1 |
        | Client | websocat / web dashboard / custom |
        | Auth method | Bearer token in handshake header |
        | Subscriptions | `theme.changed`, `mode.changed`, `plugin.status` |

        ## 📡 Connection & Subscription Flow

        ```bash
        # Connect and subscribe:
        websocat "ws://localhost:7070/ws/v1" \
          --header "Authorization: Bearer ash_tok_xxx" \
          --header "X-ASH-Client: my-client/1.0.0"

        # Send subscription message:
        {
          "type": "subscribe",
          "events": ["theme.changed", "mode.changed", "plugin.status"],
          "id": "sub_001"
        }

        # Expected acknowledgment:
        {
          "type": "subscribed",
          "id": "sub_001",
          "events": ["theme.changed", "mode.changed", "plugin.status"],
          "timestamp": "2024-01-15T14:32:01Z"
        }
        ```

        ## ❌ Issue: Missing Events

        ```bash
        # Triggered on desktop:
        ash theme apply tokyo-night  # ← This SHOULD emit theme.changed event

        # What WebSocket receives: NOTHING
        # Expected: {"type": "theme.changed", "theme_id": "tokyo-night", ...}

        # However, testing with ash's own web dashboard WORKS
        # The issue is only with external WebSocket clients

        # Debug: Server shows event was emitted:
        $ journalctl --user -u ash-ipc-server --since "1 min ago"
        [INFO] Emitting event: theme.changed {theme_id: "tokyo-night"}
        [INFO] Active subscribers: 2
        [INFO] Delivered to: web-dashboard-ws-client
        [WARN] Failed delivery to: external-client-ws-001 (disconnected?)
        ```

        ## 📋 Full WebSocket Message Trace

        ```
        → {"type":"subscribe","events":["theme.changed"],"id":"sub_001"}
        ← {"type":"subscribed","id":"sub_001","events":["theme.changed"]}
        ← {"type":"ping","interval":30}
        → {"type":"pong"}
        ← {"type":"ping","interval":30}
        → {"type":"pong"}
        [60 seconds of silence — theme.changed event NOT received]
        ← {"type":"close","code":1006,"reason":"Connection timeout"}
        [Client disconnects despite active pong exchange]
        ```

        ## 🔬 Reconnection Behavior

        After disconnect, subscriptions are lost on reconnect:
        ```bash
        # After reconnect, must re-send subscribe message
        # But even after re-subscribing, events still not received
        # Suggests server-side delivery issue, not just subscription state
        ```
    validations:
      required: false

  # ════════════════════════════════════════════════════════════════════
  # SECTION 07 — BREAKING CHANGE DETAILS
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: breaking_change
    attributes:
      label: "💔 Breaking Change Details (fill if regression/breaking change)"
      description: >
        If this is a breaking change between API versions, document
        exactly what changed and the migration impact.
      placeholder: |
        ## 💔 Breaking Change Analysis

        ### What Changed
        | Property | Before (v5.0.1) | After (v5.0.2) |
        |----------|----------------|---------------|
        | Endpoint | `POST /api/v1/theme/apply` | `POST /api/v1/themes/{id}/apply` |
        | Request body | `{"theme": "name", ...}` | `{"transition": "...", ...}` |
        | Response field | `"applied": true` | `"success": true` |
        | Auth header | `X-ASH-Token: xxx` | `Authorization: Bearer xxx` |

        ### Breaking Change Timeline
        ```
        v5.0.0: Introduced /api/v1/theme/apply (old format)
        v5.0.1: Still working with old format
        v5.0.2: Old endpoint returns 404 — NO DEPRECATION NOTICE
        ```

        ### Migration Impact
        **Affected integrations:**
        - My custom Waybar module using the old endpoint
        - Community plugin `waybar-ash-theme` v1.x (1,200 installs)
        - Mobile app using REST API v1 (old format)

        **Migration effort:**
        - Update endpoint URL: 5 minutes
        - Update request body format: 30 minutes
        - Update response parsing: 30 minutes
        - Test all code paths: 2 hours

        ### What Should Have Happened
        Per [API Stability Policy](https://ash-dotfiles.github.io/api/stability):

        > Breaking changes MUST:
        > 1. Be announced 30 days before release
        > 2. Include deprecation warnings for 2 minor versions
        > 3. Provide automatic migration helpers
        > 4. Be documented in CHANGELOG with migration guide

        None of these requirements were met for this change.

        ### Proposed Resolution
        - [ ] Restore old endpoint as alias for 2 more minor versions
        - [ ] Add deprecation header: `X-ASH-Deprecated: true; migrate-to: /api/v1/themes/{id}/apply`
        - [ ] Document migration in CHANGELOG
        - [ ] Add migration guide to docs
        - [ ] Announce in Discord #api-announcements
    validations:
      required: false

  # ════════════════════════════════════════════════════════════════════
  # SECTION 08 — REPRODUCTION
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: reproduction
    attributes:
      label: "🔄 Minimal Reproduction"
      description: >
        The most minimal, complete, standalone reproduction of the issue.
        This is the single most important section for quick resolution.
      placeholder: |
        ## 🧪 Minimal Reproduction (copy-paste ready)

        ```bash
        #!/usr/bin/env bash
        # Minimal reproduction of ASH API issue
        # ASH Version: v5.0.2-omega
        # Run: bash reproduce-api-issue.sh

        ASH_API="http://localhost:7070/api/v1"
        TOKEN="$(ash api token --create --name 'repro-test' --scopes 'themes:write')"

        echo "=== Step 1: Verify API is running ==="
        curl -sf "${ASH_API}/health" | jq '.status'
        # Expected: "healthy"

        echo "=== Step 2: List available themes (should work) ==="
        curl -sf -H "Authorization: Bearer ${TOKEN}" \
          "${ASH_API}/themes" | jq '.data | length'
        # Expected: > 0
        # Actual: ✅ Works

        echo "=== Step 3: Apply theme (THIS IS THE BUG) ==="
        curl -sf -X POST \
          -H "Authorization: Bearer ${TOKEN}" \
          -H "Content-Type: application/json" \
          -d '{
            "wallpaper": "/home/user/Pictures/aurora.jpg",
            "transition": "smooth"
          }' \
          "${ASH_API}/themes/catppuccin-mocha/apply"
        # Expected: {"success": true, "duration_ms": 1247, ...}
        # Actual: {"error": {"code": "THEME_APPLY_FAILED", ...}} ← BUG

        echo "=== Step 4: Verify the theme was applied anyway ==="
        ash config get theme.active
        # Shows: catppuccin-mocha (partially applied despite 500 error)
        ```

        ## 📊 Reproduction Consistency

        | Run | Result | Notes |
        |-----|--------|-------|
        | Run 1 | ❌ 500 error | With wallpaper path |
        | Run 2 | ❌ 500 error | Same result |
        | Run 3 | ✅ 200 OK | No wallpaper path provided |
        | Run 4 | ❌ 500 error | With wallpaper path |
        | Run 5 | ✅ 200 OK | No wallpaper path provided |

        **Pattern identified:** The 500 error ONLY occurs when `wallpaper` field is included.
        The endpoint works without the wallpaper parameter.

        ## ✅ Workaround

        ```bash
        # Apply theme without wallpaper (works):
        curl -X POST -H "Authorization: Bearer ${TOKEN}" \
          -d '{"transition": "smooth"}' \
          "${ASH_API}/themes/catppuccin-mocha/apply"

        # Then set wallpaper separately:
        curl -X POST -H "Authorization: Bearer ${TOKEN}" \
          -d '{"path": "/home/user/Pictures/aurora.jpg"}' \
          "${ASH_API}/wallpaper/set"
        ```
    validations:
