name: "🌐 API Issue"
description: >
  Report issues with the ASH Dotfiles REST API, WebSocket API,
  Plugin SDK API, or Shell API. Whether it's a broken endpoint,
  authentication failure, missing feature, or breaking change —
  this comprehensive form captures everything needed for resolution.
title: "🌐 [API] — "
labels:
  - "🌐 api"
  - "🔍 needs-triage"
assignees: []

body:
  # ════════════════════════════════════════════════════════════════════
  # SECTION 01 — HERO BANNER
  # ════════════════════════════════════════════════════════════════════
  - type: markdown
    attributes:
      value: |
        <div align="center">

        ```
