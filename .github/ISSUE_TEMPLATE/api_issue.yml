  # ════════════════════════════════════════════════════════════════════
  # SECTION 14 — PROPOSED FIX
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: proposed_fix
    attributes:
      label: "🔧 Proposed Fix / Implementation"
      description: >
        If you've identified the root cause and solution, share it here.
      placeholder: |
        ## 🔍 Root Cause Analysis

        Based on the server logs, the error is in `api/endpoints/theme.py`:

        ```python
        # api/endpoints/theme.py — apply_theme() function
        # Current code (BUGGY):

        async def apply_theme(
            theme_id: str,
            body: ThemeApplyRequest,
            auth: AuthContext = Depends(verify_token)
        ):
            theme = await theme_service.get_theme(theme_id)

            if body.wallpaper:
                # BUG: Path validation called with wrong argument order
                # ash_utils.validate_path(body.wallpaper, user=auth.user)  # WRONG
                # Should be:
                # ash_utils.validate_path(path=body.wallpaper, user_home=auth.user.home)

                validated_path = ash_utils.validate_path(body.wallpaper, auth.user)
                # ↑ This passes auth.user (User object) where str path expected
                # → NullPointerException when validate_path tries path.exists()
        ```

        ## ✅ Proposed Fix

        ```python
        # api/endpoints/theme.py — fixed version

        async def apply_theme(
            theme_id: str,
            body: ThemeApplyRequest,
            auth: AuthContext = Depends(verify_token)
        ):
            theme = await theme_service.get_theme(theme_id)

            wallpaper_path = None
            if body.wallpaper:
                # FIX: Correct argument order
                wallpaper_path = ash_utils.validate_path(
                    path=body.wallpaper,
                    user_home=auth.user.home_directory
                )
                if wallpaper_path is None:
                    raise HTTPException(
                        status_code=422,
                        detail={"code": "INVALID_WALLPAPER_PATH",
                                "message": f"Wallpaper not found: {body.wallpaper}"}
                    )

            result = await theme_service.apply_theme(
                theme=theme,
                wallpaper=wallpaper_path,  # Now properly validated
                transition=body.transition,
                reload_targets=body.reload_targets
            )

            return ThemeApplyResult(**result)
        ```

