name: Bug Report
description: Report a bug or issue with ASH Dotfiles
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees: []
body:
- type: markdown
attributes:
value: |
## Bug Report
Thanks for taking the time to report an issue!
Please fill this out completely.
- type: checkboxes
id: checklist
attributes:
label: Pre-flight Checklist
options:
- label: I ran `ash doctor` and checked the output
required: true
- label: I searched existing issues before opening this one
required: true
- label: I am on Arch Linux or an Arch-based distro
required: true
- label: I have the latest version (`ash update`)
required: true
- type: dropdown
id: component
attributes:
label: Affected Component
multiple: true
options:
- Hyprland (compositor)
- Waybar (status bar)
- Rofi (launcher)
- Theme Engine
- Hyprlock (lock screen)
- Hypridle (idle)
- Fish Shell
- Neovim
- AGS Widgets
- EWW Widgets
- Dunst/SwayNC
- Kitty Terminal
- Screenshots
- Recorder
- Clipboard
- ASH CLI
- Installation
- Other
- type: dropdown
id: gpu
attributes:
label: GPU Type
options:
- AMD (Mesa/RADV)
- NVIDIA (proprietary)
- Intel
- Multiple GPUs
- Unknown
- type: textarea
id: description
attributes:
label: Bug Description
description: A clear description of what the bug is
placeholder: Describe the bug...
validations:
required: true
- type: textarea
id: reproduce
attributes:
label: Steps to Reproduce
description: How to reproduce the issue
value: |
1. Open terminal
2. Run '...'
3. See error
validations:
required: true
- type: textarea
id: expected
attributes:
label: Expected Behavior
description: What should happen
validations:
required: true
- type: textarea
id: actual
attributes:
label: Actual Behavior
description: What actually happens
validations:
required: true
- type: textarea
id: doctor
attributes:
label: Doctor Output
description: Output of `ash doctor`
render: shell
validations:
required: true
- type: textarea
id: logs
attributes:
label: Relevant Logs
description: Paste logs from `~/.cache/ash-dots/logs/`
render: shell
- type: textarea
id: system
attributes:
label: System Information
description: Output of `bash ~/.dotfiles/scripts/summary.sh`
render: shell
validations:
required: true
- type: textarea
id: screenshots
attributes:
label: Screenshots
description: Add screenshots if applicable
- type: input
id: version
attributes:
label: ASH Version
description: Run `ash version`
placeholder: "3.0"
validations:
required: true