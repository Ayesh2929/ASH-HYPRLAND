name: 🐛 Bug Report
description: Report a bug in ASH Dotfiles
title: "fix: [brief description of bug]"
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report
        Thank you for taking the time to report a bug!
        Please fill in all sections below.

  - type: textarea
    id: description
    attributes:
      label: 🐛 Bug Description
      description: A clear description of what the bug is
      placeholder: "When I run 'ash theme pick', the terminal crashes with..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 🔄 Steps to Reproduce
      description: Steps to reproduce the behavior
      value: |
        1. Open terminal
        2. Run: `ash ...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ Expected Behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: ❌ Actual Behavior
      description: What actually happened
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 📋 Logs
      description: Paste relevant log output
      render: shell
      placeholder: |
        # Run these and paste output:
        ash doctor
        ash log 50
        cat ~/.cache/ash-dots/logs/cli.log | tail -30

  - type: dropdown
    id: component
    attributes:
      label: 🔧 Affected Component
      description: Which part of ASH is affected?
      multiple: true
      options:
        - Theme Engine (ash theme)
        - Wallpaper Picker
        - Waybar
        - Rofi Launcher
        - Hyprlock
        - Fish Shell
        - Neovim
        - Music Reactive (ash music)
        - Health Score (ash score)
        - Workspace Profiles (ash workspace)
        - Smart Wallpaper (ash smart)
        - AI Theme (ash theme ai)
        - Analytics (ash analytics)
        - Context Theming (ash context)
        - ASH CLI
        - Installation
        - Other
    validations:
      required: true

  - type: dropdown
    id: gpu
    attributes:
      label: 🎮 GPU Type
      options:
        - AMD
        - NVIDIA
        - Intel
        - Virtual/Other
    validations:
      required: true

  - type: input
    id: hyprland-version
    attributes:
      label: 🖥️ Hyprland Version
      description: Run `hyprctl version`
      placeholder: "v0.41.0"
    validations:
      required: true

  - type: input
    id: ash-version
    attributes:
      label: 📦 ASH Version
      description: Run `ash version`
      placeholder: "3.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 🐧 Operating System
      options:
        - Arch Linux
        - EndeavourOS
        - CachyOS
        - Manjaro
        - Garuda Linux
        - Other Arch-based
    validations:
      required: true

  - type: textarea
    id: system-info
    attributes:
      label: 🖥️ System Information
      description: Run `fastfetch` or `ash score quick` and paste output
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ Checklist
      options:
        - label: I ran `ash doctor` and checked the output
          required: true
        - label: I searched existing issues for duplicates
          required: true
        - label: I'm running the latest version (`ash update`)
          required: true
        - label: I checked `~/.cache/ash-dots/logs/` for errors
          required: true