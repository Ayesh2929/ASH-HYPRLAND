  # ════════════════════════════════════════════════════════════════════
  # SECTION 13 — USER JOURNEY IMPACT
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: user_journey
    attributes:
      label: "🗺️ User Journey Impact"
      description: >
        Describe the full user journey when they encountered this documentation issue.
        Understanding the context helps us prioritize and fix the right problem.
      placeholder: |
        ## My User Journey

        **Goal I was trying to accomplish:**
        Setting up NVIDIA GPU for Hyprland with proper Wayland acceleration

        **How I found the documentation:**
        1. Searched Google: "ASH dotfiles nvidia hyprland setup"
        2. Found the [NVIDIA Setup Guide](https://ash-dotfiles.github.io/docs/guides/nvidia-setup)
        3. Followed the guide step by step
        4. Got stuck at "Step 3: Environment Variables"

        **Where the documentation failed me:**
        Step 3 says to "add the following to your environment" but doesn't specify:
        - WHICH file to add them to (`~/.config/environment.d/nvidia.conf` vs `/etc/environment`)
        - What happens if both files exist
        - Whether to use `export VAR=value` or just `VAR=value` syntax

        **Time lost due to this issue:** ~2 hours of debugging

        **How I eventually solved it:**
        - Found the correct answer in a 3-year-old Reddit comment
        - Confirmed by reading the ASH source: `config/environment.d/nvidia.conf`

        **What I wish the documentation had said:**
        A clear note: "Add these variables to `~/.config/environment.d/nvidia.conf`
        using `KEY=VALUE` format (no `export`). If this file doesn't exist, create it."

        ## Impact on My Decision

        - [ ] 🔄 I almost gave up and used a different dotfiles manager
        - [ ] ⏰ I lost significant time (>30 minutes)
        - [ ] 😤 I was frustrated but eventually succeeded
        - [ ] 📞 I had to ask in Discord/GitHub for help
        - [ ] ❌ I couldn't complete the task at all
        - [ ] ✅ Minor inconvenience — found workaround quickly
    validations:
      required: false

