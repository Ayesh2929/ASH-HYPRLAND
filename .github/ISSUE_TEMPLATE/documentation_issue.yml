name: "📖 Documentation Issue"
description: >
  Found incorrect, missing, unclear, or outdated documentation?
  Help us maintain world-class documentation by reporting issues
  with this comprehensive form covering all doc types and quality dimensions.
title: "📖 [DOCS] — "
labels:
  - "📖 documentation"
  - "🔍 needs-triage"
assignees: []

body:
  # ════════════════════════════════════════════════════════════════════
  # SECTION 01 — HERO BANNER
  # ════════════════════════════════════════════════════════════════════
  - type: markdown
    attributes:
      value: |
        <div align="center">

        ```
        ██████╗  ██████╗  ██████╗███████╗
        ██╔══██╗██╔═══██╗██╔════╝██╔════╝
        ██║  ██║██║   ██║██║     ███████╗
        ██║  ██║██║   ██║██║     ╚════██║
        ██████╔╝╚██████╔╝╚██████╗███████║
        ╚═════╝  ╚═════╝  ╚═════╝╚══════╝

        ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░
        ░ 📖 DOCUMENTATION QUALITY SYSTEM v5.0 OMEGA ░
        ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░
        ```

        # 📖 Documentation Issue — ASH Dotfiles v5.0 OMEGA

        > *"Great software deserves documentation as powerful as the code itself"*

        </div>

        ---

        > [!NOTE]
        > Documentation is a **first-class citizen** of ASH Dotfiles.
        > Every report — from a typo to a missing guide — makes ASH better
        > for thousands of users worldwide. **Thank you for contributing!**

        > [!TIP]
        > **Want to fix it yourself?** Documentation contributions are among
        > the easiest ways to get started! See our
        > [Documentation Contributing Guide](https://ash-dotfiles.github.io/docs/contributing/docs)
        > and submit a PR alongside this issue for fastest resolution.
        >
        > ```bash
        > # Quick doc preview locally:
        > cd docs && mkdocs serve --dev-addr=127.0.0.1:8080
        > # Then edit any .md file and see live preview at http://localhost:8080
        > ```

        ---

        ### 📖 Before You Submit

        - [ ] 🔍 Searched [existing doc issues](https://github.com/ash-dotfiles/ash-dotfiles/issues?q=label%3A%22documentation%22)
        - [ ] 📚 Checked the [live documentation](https://ash-dotfiles.github.io/docs) for latest version
        - [ ] 🔄 Verified the issue exists on the **current** docs (not cached version)
        - [ ] 💬 Checked [Discord #documentation](https://discord.gg/ash-dotfiles) for clarifications

        ---

  # ════════════════════════════════════════════════════════════════════
  # SECTION 02 — ISSUE TYPE
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: issue_type
    attributes:
      label: "🎯 Documentation Issue Type"
      description: "What kind of documentation problem are you reporting?"
      options:
        # Accuracy Issues
        - "❌ Incorrect — Information is factually wrong or outdated"
        - "⚠️ Misleading — Information is technically correct but leads users astray"
        - "🔗 Broken Link — Link leads to 404 or wrong destination"
        - "💻 Broken Code Example — Code sample doesn't work as shown"
        - "📸 Broken Screenshot — Image broken, outdated, or doesn't match current UI"
        # Completeness Issues
        - "🕳️ Missing Documentation — Feature/command has no documentation at all"
        - "📝 Incomplete — Documentation exists but is too brief or missing steps"
        - "🔍 Missing Example — Concept explained but no practical examples"
        - "❓ Missing FAQ Entry — Common question not addressed in FAQ"
        - "🗺️ Missing Guide — Complex workflow needs a dedicated guide"
        # Clarity Issues
        - "😕 Unclear — Technically correct but hard to understand"
        - "🔀 Disorganized — Information exists but is hard to find / poorly structured"
        - "📐 Poor Formatting — Markdown formatting issues, bad tables, etc."
        - "🔤 Terminology — Inconsistent or confusing terminology used"
        # Translation & Localization
        - "🌍 Translation Error — Incorrect translation in non-English docs"
        - "🌍 Missing Translation — Page not available in my language"
        - "🌍 Translation Needed — New content not yet translated"
        # Accessibility
        - "♿ Accessibility — Documentation not accessible (missing alt text, etc.)"
        - "📱 Mobile — Documentation unusable on mobile devices"
        # Enhancement
        - "✨ Enhancement — Existing docs are fine but could be significantly better"
        - "🗺️ New Guide Request — Request for entirely new documentation"
        - "🎬 Video Tutorial Request — Request for video version of written guide"
        # Other
        - "✏️ Typo / Grammar — Spelling or grammatical error"
        - "🎨 Style Issue — Inconsistent formatting or style"
        - "🔖 SEO / Discovery — Hard to find via search"
        - "📊 Outdated Version — Documentation covers old ASH version"
        - "❓ Other"
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 03 — SEVERITY & IMPACT
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: severity
    attributes:
      label: "🚨 Issue Severity"
      description: "How severely does this documentation issue impact users?"
      options:
        - "🔴 CRITICAL — Users cannot complete core tasks due to doc errors"
        - "🟠 HIGH — Major feature undocumented or significantly misleading"
        - "🟡 MEDIUM — Confusing or incomplete docs for common use case"
        - "🟢 LOW — Minor issue, workaround obvious, typo, cosmetic"
        - "💡 ENHANCEMENT — Docs work but could be substantially improved"
    validations:
      required: true

  - type: dropdown
    id: user_impact
    attributes:
      label: "👥 Who Does This Affect?"
      description: "Which users are most impacted by this documentation issue?"
      options:
        - "🆕 New Users — Blocks first-time setup / getting started"
        - "🔄 Migrating Users — Blocks migration from other dotfiles"
        - "🔌 Plugin Developers — Affects plugin SDK documentation"
        - "🎨 Theme Creators — Affects theme creation documentation"
        - "🌍 Non-English Users — Affects localized documentation"
        - "♿ Users with Disabilities — Accessibility barrier"
        - "🎮 Gamers — Affects gaming setup documentation"
        - "💼 Power Users — Affects advanced feature documentation"
        - "🤖 API Users — Affects REST API / programmatic usage docs"
        - "🐧 Specific Distro Users — Affects distro-specific guides"
        - "🌐 All Users — Universal impact"
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 04 — AFFECTED DOCUMENTATION
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: doc_section
    attributes:
      label: "📚 Affected Documentation Section"
      description: "Which section of the documentation has the issue?"
      multiple: true
      options:
        # Getting Started
        - "🚀 Getting Started — Installation guide"
        - "🚀 Getting Started — System requirements"
        - "🚀 Getting Started — First steps / quick start"
        - "🚀 Getting Started — Video tour"
        - "🚀 Getting Started — FAQ"
        # Guides
        - "📖 Guide — Theming deep dive"
        - "📖 Guide — AI theme generation"
        - "📖 Guide — Keybinds reference"
        - "📖 Guide — Neovim IDE setup"
        - "📖 Guide — Fish shell"
        - "📖 Guide — Waybar customization"
        - "📖 Guide — Rofi menus"
        - "📖 Guide — AGS widgets"
        - "📖 Guide — Plugin development"
        - "📖 Guide — Theme creation"
        - "📖 Guide — Wallpaper guide"
        - "📖 Guide — Multi-monitor"
        - "📖 Guide — Gaming setup"
        - "📖 Guide — Streaming setup"
        - "📖 Guide — Productivity workflow"
        - "📖 Guide — NVIDIA setup"
        - "📖 Guide — AMD setup"
        - "📖 Guide — Laptop setup"
        - "📖 Guide — REST API guide"
        - "📖 Guide — Web dashboard"
        - "📖 Guide — Mobile app"
        - "📖 Guide — Security hardening"
        - "📖 Guide — Privacy guide"
        - "📖 Guide — Accessibility"
        - "📖 Guide — Migration guide"
        - "📖 Guide — NixOS setup"
        # Reference
        - "📋 Reference — ASH CLI command reference"
        - "📋 Reference — Configuration reference"
        - "📋 Reference — Theme schema"
        - "📋 Reference — Plugin API"
        - "📋 Reference — Hook reference"
        - "📋 Reference — Color engine"
        - "📋 Reference — Systemd services"
        - "📋 Reference — Environment variables"
        - "📋 Reference — REST API reference"
        - "📋 Reference — WebSocket protocol"
        # Troubleshooting
        - "🔧 Troubleshooting — Common issues"
        - "🔧 Troubleshooting — Display issues"
        - "🔧 Troubleshooting — Audio issues"
        - "🔧 Troubleshooting — Theme issues"
        - "🔧 Troubleshooting — NVIDIA issues"
        - "🔧 Troubleshooting — Performance issues"
        - "🔧 Troubleshooting — Debug mode"
        # Contributing
        - "🤝 Contributing — CONTRIBUTING.md"
        - "🤝 Contributing — Code of Conduct"
        - "🤝 Contributing — Style guide"
        - "🤝 Contributing — Testing guide"
        - "🤝 Contributing — Release process"
        - "🤝 Contributing — Architecture"
        # Root Files
        - "📄 README.md — Main repository README"
        - "📄 CHANGELOG.md — Version changelog"
        - "📄 SECURITY.md — Security policy"
        - "📄 LICENSE"
        # Code Documentation
        - "💻 Code Comments — Inline documentation in scripts"
        - "💻 Code Comments — Neovim Lua documentation"
        - "💻 Code Comments — Fish functions"
        - "💻 Code Comments — API docstrings"
        # Other
        - "🌍 Translation — Non-English docs"
        - "🎬 Video — Video tutorial"
        - "🌐 Website — ash-dotfiles.github.io"
        - "📝 Wiki — GitHub Wiki"
        - "❓ Unknown / Not sure"
    validations:
      required: true

  - type: input
    id: doc_url
    attributes:
      label: "🔗 Direct URL to Affected Documentation"
      description: >
        The exact URL where the issue exists. Include anchor (#section) if applicable.
        For file-based issues, provide the GitHub file path.
      placeholder: |
        e.g., https://ash-dotfiles.github.io/docs/guides/nvidia-setup#driver-installation
        OR: docs/guides/nvidia-setup.md (line 47)
        OR: README.md#installation
    validations:
      required: false

  - type: input
    id: doc_line
    attributes:
      label: "📍 Line Number / Section (if file-based)"
      description: "Specific line number(s) or section heading in the source file"
      placeholder: "e.g., Line 47-52, or '## Driver Installation' section"
    validations:
      required: false

  # ════════════════════════════════════════════════════════════════════
  # SECTION 05 — CURRENT CONTENT (THE PROBLEM)
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: current_content
    attributes:
      label: "❌ Current Documentation (The Problem)"
      description: >
        Paste the **exact current text / code / content** that has the issue.
        Quote it precisely — do not paraphrase. This helps us find and fix it quickly.
      placeholder: |
        ## 📄 Current Text (paste exactly as it appears in the docs)

        > Copy the exact text from the documentation, formatted as a blockquote

        **Example of what to paste:**

        > ## Installing NVIDIA Drivers
        >
        > Run the following command to install NVIDIA drivers:
        > ```bash
        > sudo pacman -S nvidia nvidia-utils
        > ```
        > Then reboot your system and Hyprland will automatically configure
        > NVIDIA settings for optimal performance.

        ---

        ## 💻 Current Code Example (if applicable)

        ```bash
        # Paste the problematic code example exactly as shown in docs
        ash theme apply --wallpaper ~/Pictures/wallpaper.jpg catppuccin-mocha
        # ^ This command format is incorrect — should be:
        # ash theme apply catppuccin-mocha --wallpaper ~/Pictures/wallpaper.jpg
        ```

        ## 🖼️ Screenshot of Current State (if visual issue)
        [drag screenshot of the documentation problem here]
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 06 — WHAT SHOULD IT SAY
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: expected_content
    attributes:
      label: "✅ What the Documentation Should Say"
      description: >
        Provide the **corrected / improved version** of the documentation.
        The more complete your suggestion, the faster we can implement it.
        If you're unsure of the correct content, explain what's wrong instead.
      placeholder: |
        ## 📝 Suggested Corrected Text

        > ## Installing NVIDIA Drivers
        >
        > **For Arch Linux users:**
        > ```bash
        > # Install NVIDIA proprietary drivers (recommended for Hyprland)
        > sudo pacman -S nvidia-dkms nvidia-utils lib32-nvidia-utils
        >
        > # Enable early loading (CRITICAL for Hyprland + NVIDIA)
        > echo 'options nvidia-drm modeset=1 fbdev=1' | \
        >   sudo tee /etc/modprobe.d/nvidia.conf
        >
        > # Regenerate initramfs
        > sudo mkinitcpio -P
        > ```
        >
        > > ⚠️ **Important:** After rebooting, run `ash doctor --check-gpu` to
        > > verify your NVIDIA configuration is correct before starting Hyprland.
        >
        > **Note:** Hyprland does NOT automatically configure NVIDIA settings.
        > You must add the required environment variables manually. See
        > [NVIDIA Environment Variables](#nvidia-env-vars) below.

        ## 💻 Corrected Code Example

        ```bash
        # Correct syntax (flag comes after theme name):
        ash theme apply catppuccin-mocha --wallpaper ~/Pictures/wallpaper.jpg

        # Or use the wallpaper command separately:
        ash wallpaper set ~/Pictures/wallpaper.jpg
        ash theme apply catppuccin-mocha
        ```

        ## 📋 Additional Content That Should Be Added

        - A warning callout about the `--force` flag risks
        - A link to the troubleshooting page for NVIDIA-specific errors
        - An example for Fedora/COPR users (currently only Arch is documented)
    validations:
      required: false

  # ════════════════════════════════════════════════════════════════════
  # SECTION 07 — PROOF OF INCORRECTNESS
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: proof
    attributes:
      label: "🔍 Proof / Evidence of the Issue"
      description: >
        Demonstrate WHY the current documentation is wrong/incomplete.
        Include terminal output, error messages, or references to correct information.
      placeholder: |
        ## 💻 Terminal Output Proving the Error

        ```bash
        # Following the documented command exactly:
        $ ash theme apply --wallpaper ~/Pictures/test.jpg catppuccin-mocha

        [ERROR] ash: unrecognized option '--wallpaper' before 'catppuccin-mocha'
        Usage: ash theme apply [OPTIONS] <THEME_NAME>
               ash theme apply catppuccin-mocha [--wallpaper PATH] [--no-reload]

        # Correct syntax (discovered through --help):
        $ ash theme apply catppuccin-mocha --wallpaper ~/Pictures/test.jpg
        ✅ Theme 'catppuccin-mocha' applied successfully with custom wallpaper
        ```

        ## 📋 ASH --help Output (showing correct syntax)

        ```
        $ ash theme apply --help

        USAGE:
            ash theme apply <THEME_NAME> [OPTIONS]

        ARGUMENTS:
            <THEME_NAME>    Name of the theme to apply (required, positional)

        OPTIONS:
            --wallpaper <PATH>    Custom wallpaper to use with theme
            --no-reload           Skip reloading desktop components
            --force               Force apply even if theme is already active
        ```

        ## 🔗 Reference to Correct Information

        - The correct behavior is described in the ASH source: `ash-cli/commands/theme/apply.sh` (line 23-31)
        - Related GitHub issue: #XXX
        - This was changed in v5.0.0 per the changelog: [link]

        ## 📸 Screenshot Evidence

        [drag screenshot showing the error or correct behavior here]
    validations:
      required: false

  # ════════════════════════════════════════════════════════════════════
  # SECTION 08 — MISSING DOCUMENTATION SPEC
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: missing_doc_spec
    attributes:
      label: "📝 Missing Documentation Specification (for 'Missing' issue types)"
      description: >
        If reporting missing documentation, describe in detail what should exist.
        The more specific you are, the easier it is to create exactly what's needed.
      placeholder: |
        ## 🗺️ What Documentation Is Missing

        **Feature/Topic:** `ash remote` command group

        **Why It's Needed:**
        The `ash remote` commands allow applying themes across SSH connections to
        remote machines. This is a powerful feature with zero documentation, causing
        users to discover it only by running `ash remote --help` or reading source code.

        ## 📋 Proposed Documentation Outline

        ```markdown
        # Remote Configuration Management

        ## Overview
        ASH Dotfiles supports managing configurations on remote machines via SSH,
        allowing you to synchronize themes, apply updates, and manage configs
        across your entire infrastructure.

        ## Commands
        - `ash remote connect <host>` — establish remote connection
        - `ash remote sync-config <host>` — push local config to remote
        - `ash remote apply-theme <host> <theme>` — apply theme on remote host

        ## Prerequisites
        - SSH key-based authentication configured
        - ASH Dotfiles installed on the remote machine
        - Remote user in `ash-users` group

        ## Examples
        [practical examples for common use cases]

        ## Troubleshooting
        [common issues with remote management]
        ```

        ## 📊 Estimated Documentation Size
        - Number of new pages needed: 1 (could integrate into CLI reference)
        - Approximate word count: ~800-1200 words
        - Code examples needed: ~5-8 examples
        - Screenshots needed: 0 (CLI-only feature)

        ## 🔗 Source Material Available
        - Source code: `ash-cli/commands/remote/`
        - `ash remote --help` output is comprehensive and could be adapted
        - I'm willing to draft initial content if guided on format
    validations:
      required: false

  # ════════════════════════════════════════════════════════════════════
  # SECTION 09 — CODE EXAMPLE ISSUES
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: code_issue
    attributes:
      label: "💻 Code Example Issues (if applicable)"
      description: >
        For broken or incorrect code examples, provide the full debug session
        showing exactly what fails and why.
      placeholder: |
        ## 🧪 Reproduction of Broken Code Example

        **Documentation says:**
        ```bash
        # From: docs/guides/plugin-development.md#publishing
        ash plugin publish my-plugin --registry official
        ```

        **What actually happens:**

        ```bash
        $ ash plugin publish my-plugin --registry official

        [ERROR] ash plugin publish: unknown flag '--registry'
        Run 'ash plugin publish --help' for usage.

        $ ash plugin publish --help

        USAGE: ash plugin publish [OPTIONS] <PLUGIN_ID>

        OPTIONS:
          --to <TARGET>    Publish target: 'official' | 'community' | 'local'
          --draft          Publish as draft for review
          --notes <TEXT>   Release notes

        # CORRECT command (flag renamed from --registry to --to):
        $ ash plugin publish my-plugin --to official
        ✅ Plugin submitted to official registry for review
        ```

        ## 📋 Test Environment

        | Property | Value |
        |----------|-------|
        | ASH Version | v5.0.2 |
        | Shell | Fish 3.7.0 |
        | OS | Arch Linux |
        | Doc Version Tested | Current (not cached) |

        ## 🔄 When Was This Code Example Last Correct?
        - [ ] It was never correct (documentation error from initial writing)
        - [ ] It worked until approximately: [version/date]
        - [ ] It works in a specific context (specify): _____________
        - [ ] Unknown
    validations:
      required: false

  # ════════════════════════════════════════════════════════════════════
  # SECTION 10 — UX & CLARITY FEEDBACK
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: ux_feedback
    attributes:
      label: "🎨 UX & Clarity Feedback"
      description: >
        Beyond factual accuracy — how can we make the documentation experience
        better for users? Navigation, visual design, information architecture.
      placeholder: |
        ## 🧭 Navigation Issues

        **The problem I encountered:**
        I spent 15 minutes trying to find documentation for the `ash snapshot` command.
        I searched the site, checked the CLI reference, and looked in "Getting Started"
        before eventually finding it buried in a single paragraph of "Advanced Features."

        **Suggested improvements:**
        1. Add `ash snapshot` to the main navigation sidebar under "Commands"
        2. Create a dedicated "Snapshots" guide page (not just CLI reference)
        3. Add it to the "Common Tasks" quick-reference card on the homepage
        4. Include it in the search index with keywords: "backup", "restore", "undo"

        ## 🎭 Visual Hierarchy Issues

        The current documentation uses H2 headings for everything, making it hard
        to distinguish between major sections and subsections at a glance.

        **Before (confusing):**
        All headings look identical → users can't scan page structure easily

        **After (suggested):**
        Use H2 for major topics → H3 for subtopics → H4 for specific options
        Add visual separators between major sections

        ## 📱 Mobile Experience Issues

        On mobile (375px viewport):
        - Code blocks overflow horizontally requiring scroll (no wrap)
        - Table of contents overlaps content on narrow screens
        - Navigation hamburger menu doesn't close after selecting item

        ## ⚡ Information Architecture Suggestions

        ```
        Current structure (confusing):
        docs/
        ├── getting-started/
        ├── guides/          ← 26 guides dumped here with no subcategories
        ├── reference/
        └── contributing/

        Suggested structure:
        docs/
        ├── getting-started/
        ├── guides/
        │   ├── desktop/     ← Hyprland, Waybar, Rofi
        │   ├── editors/     ← Neovim, Helix, VSCode
        │   ├── shell/       ← Fish, Starship, Atuin
        │   ├── hardware/    ← NVIDIA, AMD, Laptop, Multi-monitor
        │   ├── workflows/   ← Gaming, Streaming, Productivity
        │   └── advanced/    ← API, Plugins, Themes, AI
        ├── reference/
        └── contributing/
        ```
    validations:
      required: false

  # ════════════════════════════════════════════════════════════════════
  # SECTION 11 — LOCALIZATION & ACCESSIBILITY
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: localization
    attributes:
      label: "🌍 Localization & Accessibility Issues (if applicable)"
      description: >
        For translation errors, missing translations, or accessibility issues.
        Skip this section for English-only issues.
      placeholder: |
        ## 🌐 Translation Issue Details

        **Language affected:** Japanese (ja)
        **Page:** https://ash-dotfiles.github.io/ja/docs/guides/installation/
        **Section:** "GPU Driver Configuration" heading

        **Current translation (incorrect):**
        ```
        GPU ドライバー設定
        → Literally: "GPU Driver Setting" (singular, incomplete)
        ```

        **Correct translation should be:**
        ```
        GPUドライバーの設定と構成
        → "GPU Driver Settings and Configuration" (complete, idiomatic)
        ```

        **Context:** The Japanese translation was done by machine translation
        and several technical terms are incorrect or use outdated Japanese IT terminology.

        ---

        ## ♿ Accessibility Issues

        **Issue type:** Missing image alt text
        **Location:** https://ash-dotfiles.github.io/docs/guides/theming-deep-dive/

        **Images missing alt text:**
        - Figure 3 (color wheel diagram) — completely missing alt attribute
        - Figure 7 (before/after theme comparison) — alt text says "image" (non-descriptive)
        - Figure 12 (waybar customization) — alt text in wrong language (French)

        **Suggested alt text for Figure 3:**
        ```html
        <!-- Current (broken): -->
        <img src="color-wheel.png">

        <!-- Correct: -->
        <img src="color-wheel.png"
             alt="HSL color wheel showing primary, secondary, and tertiary color relationships
                  used by ASH's color harmony algorithm. Primary colors (red, blue, yellow)
                  are highlighted with larger circles at 0°, 240°, and 60° positions.">
        ```

        **Screen reader test results:**
        Tested with NVDA + Firefox on Windows — the color wheel section is completely
        inaccessible to screen reader users, providing zero information about the diagram.

        ## 📏 Readability Issues

        **Flesch-Kincaid Reading Level:** The NVIDIA setup guide scores at college level (Grade 14)
        which is unnecessarily complex for setup documentation.

        **Specific complex sentences to simplify:**

        | Current (complex) | Suggested (simpler) |
        |------------------|--------------------|
        | "The utilization of kernel module parameters for the nvidia-drm module necessitates..." | "You must set nvidia-drm kernel parameters to..." |
        | "Subsequent to the aforementioned configuration..." | "After this configuration..." |
    validations:
      required: false

