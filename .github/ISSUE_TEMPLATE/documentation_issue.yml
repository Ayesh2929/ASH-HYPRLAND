    attributes:
      label: "🤝 Would You Like to Fix This?"
      description: >
        Documentation PRs are the **fastest way to contribute** to ASH!
        Even small fixes are warmly welcomed. 🙏
      options:
        - "✍️ Yes — I'll write the complete fix and submit a PR"
        - "📝 Yes — I'll draft the content, need help with formatting/structure"
        - "🌍 Yes — I can fix/improve the translation for my language"
        - "♿ Yes — I can improve accessibility (alt text, structure, etc.)"
        - "🔄 Maybe — I need guidance on where/how to edit"
        - "👀 No — I can review and confirm fixes if someone writes them"
