name: "✨ Feature Request"
description: >
  Have an idea to make ASH Dotfiles even more powerful? Submit your feature
  proposal with this comprehensive form and help shape the future of the project!
title: "✨ [FEATURE] — "
labels:
  - "✨ enhancement"
  - "💡 feature-request"
  - "🔍 needs-triage"
assignees: []

body:
  # ════════════════════════════════════════════════════════════════════
  # SECTION 01 — INTRO BANNER
  # ════════════════════════════════════════════════════════════════════
  - type: markdown
    attributes:
      value: |
        <div align="center">

        ```
        ███████╗███████╗ █████╗ ████████╗██╗   ██╗██████╗ ███████╗
        ██╔════╝██╔════╝██╔══██╗╚══██╔══╝██║   ██║██╔══██╗██╔════╝
        █████╗  █████╗  ███████║   ██║   ██║   ██║██████╔╝█████╗
        ██╔══╝  ██╔══╝  ██╔══██║   ██║   ██║   ██║██╔══██╗██╔══╝
        ██║     ███████╗██║  ██║   ██║   ╚██████╔╝██║  ██║███████╗
        ╚═╝     ╚══════╝╚═╝  ╚═╝   ╚═╝    ╚═════╝ ╚═╝  ╚═╝╚══════╝

        ██████╗ ███████╗ ██████╗ ██╗   ██╗███████╗███████╗████████╗
        ██╔══██╗██╔════╝██╔═══██╗██║   ██║██╔════╝██╔════╝╚══██╔══╝
        ██████╔╝█████╗  ██║   ██║██║   ██║█████╗  ███████╗   ██║
        ██╔══██╗██╔══╝  ██║▄▄ ██║██║   ██║██╔══╝  ╚════██║   ██║
        ██║  ██║███████╗╚██████╔╝╚██████╔╝███████╗███████║   ██║
        ╚═╝  ╚═╝╚══════╝ ╚══▀▀═╝  ╚═════╝ ╚══════╝╚══════╝   ╚═╝
        ```

        # ✨ Feature Request — ASH Dotfiles v5.0 OMEGA

        </div>

        ---

        > [!NOTE]
        > **Great features start with great proposals!**
        > The more detail and context you provide, the higher the chance
        > your feature gets implemented and merged quickly.

        > [!TIP]
        > **Check the [Roadmap](https://github.com/ash-dotfiles/ash-dotfiles/projects)** —
        > your feature might already be planned for an upcoming release!

        ---

        ### 💡 Before You Submit

        - [ ] 🔍 Searched [existing issues](https://github.com/ash-dotfiles/ash-dotfiles/issues?q=label%3A%22feature-request%22) — not a duplicate
        - [ ] 📋 Checked the [Public Roadmap](https://github.com/orgs/ash-dotfiles/projects) — not already planned
        - [ ] 💬 Discussed this in [Discord](https://discord.gg/ash-dotfiles) — got community interest
        - [ ] 📖 Reviewed [Plugin Development Guide](https://ash-dotfiles.github.io/docs/plugin-development) — could this be a plugin?

        ---

  # ════════════════════════════════════════════════════════════════════
  # SECTION 02 — FEATURE CATEGORY
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: category
    attributes:
      label: "🗂️ Feature Category"
      description: "Which area of ASH Dotfiles does this feature belong to?"
      options:
        # Core System
        - "⚡ ASH CLI — New command / subcommand"
        - "⚡ ASH CLI — Enhancement to existing command"
        - "⚡ ASH CLI — Performance improvement"
        - "⚡ ASH CLI — UX / output improvement"
        # Theme System
        - "🎨 Theme Engine — New color extraction method"
        - "🎨 Theme Engine — New color generation algorithm"
        - "🎨 Theme Engine — New template / target app"
        - "🎨 Theme Engine — Hot reload improvement"
        - "🎨 Theme Engine — New theme category / preset"
        # AI Features
        - "🤖 AI Engine — Theme generation"
        - "🤖 AI Engine — Mood / context detection"
        - "🤖 AI Engine — Wallpaper generation"
        - "🤖 AI Engine — Config optimization"
        - "🤖 AI Engine — New AI integration"
        # Wallpaper System
        - "🖼️ Wallpaper Engine — New source"
        - "🖼️ Wallpaper Engine — New transition effect"
        - "🖼️ Wallpaper Engine — Processing / effects"
        # Desktop Components
        - "🪟 Hyprland — New config / keybind"
        - "🪟 Hyprland — New animation preset"
        - "🪟 Hyprland — New shader effect"
        - "📊 Waybar — New module"
        - "📊 Waybar — New layout"
        - "🚀 Rofi — New menu / launcher"
        - "🔔 Notifications — Dunst enhancement"
        - "🔔 Notifications — SwayNC widget"
        - "🔒 Hyprlock — New layout / widget"
        # Modes
        - "🎭 New Desktop Mode"
        - "🎭 Enhancement to existing mode"
        # Plugins
        - "🔌 New Plugin Idea"
        - "🔌 Plugin System Enhancement"
        - "🔌 New Integration Plugin (third-party service)"
        # Infrastructure
        - "🌐 REST API — New endpoint"
        - "🖥️ Web Dashboard — New component"
        - "📱 Mobile App — New feature"
        - "🧩 Browser Extension — New feature"
        - "❄️ Nix / NixOS — Module improvement"
        - "🐋 Docker — Enhancement"
        # Tools
        - "📝 Neovim — New plugin integration"
        - "🐟 Fish Shell — New function / abbreviation"
        # Security & Privacy
        - "🔒 Security Enhancement"
        - "🕵️ Privacy Feature"
        # Accessibility
        - "♿ Accessibility Improvement"
        # Documentation
        - "📖 Documentation — New guide"
        - "📖 Documentation — Improvement"
        # Other
        - "🎮 Gaming Enhancement"
        - "💼 Productivity Feature"
        - "🏥 Health / Wellness Feature"
        - "📊 Analytics / Monitoring"
        - "☁️ Cloud / Sync Feature"
        - "🔧 Developer Experience"
        - "❓ Other / Cross-cutting"
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 03 — PRIORITY & IMPACT
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: priority
    attributes:
      label: "🎯 Requested Priority"
      description: "How important is this feature to you?"
      options:
        - "🔥 Critical — Blocking my workflow, need ASAP"
        - "⬆️ High — Would significantly improve my daily use"
        - "🟡 Medium — Nice to have, would use frequently"
        - "🟢 Low — Minor convenience, would occasionally use"
        - "💭 Someday — Long-term vision item"
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: "📊 Estimated User Impact"
      description: "How many users do you think would benefit from this feature?"
      options:
        - "🌍 Universal — Would benefit ALL users (core functionality)"
        - "👥 Majority — Would benefit MOST users (75%+)"
        - "🎯 Specific — Would benefit a specific audience (25-75%)"
        - "🔬 Niche — Would benefit a small group (<25%)"
        - "👤 Personal — Primarily for my specific use case"
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 04 — PROBLEM STATEMENT
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: problem
    attributes:
      label: "😤 Problem Statement"
      description: >
        **What problem does this feature solve?**
        Describe the pain point, frustration, or limitation you're experiencing.
        Great features solve real problems — help us understand yours.
      placeholder: |
        ## The Problem I'm Facing

        When I try to [action], I find that [problem].
        This is frustrating because [reason/impact].

        **Specific scenarios where I encounter this:**

        1. **Scenario 1:** When I switch to game mode at night, my theme doesn't
           automatically adjust color temperature, causing eye strain...

        2. **Scenario 2:** I want to share my theme config with a friend but
           there's no easy export format that includes all...

        **How I currently work around this:**
        I have to manually [workaround steps], which takes [time/effort] every time.

        **Why the workaround is inadequate:**
        The manual process is error-prone / time-consuming / breaks when...
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 05 — PROPOSED SOLUTION
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: solution
    attributes:
      label: "💡 Proposed Solution"
      description: >
        **Describe your ideal solution in detail.**
        Include CLI commands, UI mockups, config examples, and behavior specifications.
      placeholder: |
        ## My Proposed Solution

        ### 🖥️ User Interface / CLI Design

        **New command(s):**
        ```bash
        # Primary command
        ash [new-command] [subcommand] [options]

        # Example usage:
        ash theme schedule --from sunset --to sunrise --theme nord
        ash theme schedule --time 22:00 --theme catppuccin-mocha --duration 8h
        ash theme schedule list
        ash theme schedule remove [id]
        ```

        **New config options:**
        ```bash
        # In ~/.config/ash/ash.conf:
        theme.schedule.enabled = true
        theme.schedule.rules = [
          { time: "sunset", theme: "nord", transition: "smooth" },
          { time: "sunrise", theme: "catppuccin-latte", transition: "fade" }
        ]
        ```

        ### ⚙️ Behavior Specification

        **When triggered:**
        1. Read the schedule configuration
        2. Calculate next trigger time based on location/sunset API
        3. At trigger time, smoothly transition to scheduled theme
        4. Send notification: "Theme scheduled to 'Nord' applied"
        5. Log the change to analytics

        **Edge cases to handle:**
        - What if the system is sleeping at trigger time? → Apply on wake
        - What if the theme no longer exists? → Log warning, skip
        - What if multiple schedules conflict? → Last-write-wins / priority system

        ### 🎨 UI Mockup (if applicable)

        ```
        ┌─────────────────────────────────────────────────┐
        │  🕐 Theme Scheduler                             │
        ├─────────────────────────────────────────────────┤
        │  ● 06:00 → Catppuccin Latte  (sunrise-based) ✅ │
        │  ● 12:00 → Tokyo Night Storm                  ✅ │
        │  ● 22:00 → Nord              (sunset-based)   ✅ │
        ├─────────────────────────────────────────────────┤
        │  [+ Add Rule]    [Edit]    [Remove]             │
        └─────────────────────────────────────────────────┘
        ```
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 06 — ALTERNATIVES CONSIDERED
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: alternatives
    attributes:
      label: "🔄 Alternatives Considered"
      description: >
        What alternative solutions or approaches have you considered?
        Why are they insufficient compared to your proposal?
      placeholder: |
        ## Alternative 1: Using cron / systemd timers directly
        **Why it's insufficient:**
        - Requires manual systemd unit creation (complex for non-technical users)
        - Doesn't integrate with ASH's theme transition system
        - No location-based sunset/sunrise awareness
        - No integration with ASH modes

        ## Alternative 2: Existing third-party tools (wlsunset, gammastep)
        **Why it's insufficient:**
        - Only handles color temperature, not full theme switching
        - Doesn't coordinate with ASH's color palette system
        - Separate configuration from the ASH ecosystem

        ## Alternative 3: A plugin
        **Why it's insufficient (or actually sufficient):**
        - This might actually be better as a plugin rather than core feature...
        - [OR] A plugin can't do this because it needs deep integration with...
    validations:
      required: false

  # ════════════════════════════════════════════════════════════════════
  # SECTION 07 — IMPLEMENTATION HINTS
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: implementation
    attributes:
      label: "🔧 Implementation Hints (Optional)"
      description: >
        If you have technical knowledge, share implementation ideas.
        This helps developers plan and estimate the effort required.
      placeholder: |
        ## Technical Approach Suggestions

        ### Relevant existing code
        - `ash-cli/commands/theme/schedule.sh` — could be extended
        - `ash-cli/engines/hot-reload-engine/` — reuse the watcher pattern
        - `systemd/user/ash-theme-scheduler.service` — already exists!

        ### Libraries / tools to leverage
        - `sunwait` or `solunar` for sunrise/sunset calculation
        - `systemd-timer` for scheduling (already used by ASH)
        - Hyprland socket IPC for smooth transitions

        ### Data structures
        ```json
        {
          "schedules": [
            {
              "id": "uuid",
              "trigger": "sunset",     // "time:22:00", "sunrise", "sunset"
              "theme": "nord",
              "transition": "smooth",  // "none", "fade", "smooth"
              "mode": null,            // optional mode change
              "enabled": true,
              "location_aware": true
            }
          ]
        }
        ```

        ### Estimated complexity
        - [ ] 🟢 Simple (< 1 day) — just config/script changes
        - [ ] 🟡 Medium (1-3 days) — new module + tests
        - [ ] 🟠 Complex (1-2 weeks) — new engine + UI + tests + docs
        - [ ] 🔴 Major (1+ month) — architectural changes required
    validations:
      required: false

  # ════════════════════════════════════════════════════════════════════
  # SECTION 08 — INSPIRATION / REFERENCES
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: references
    attributes:
      label: "🌐 Inspiration & References"
      description: >
        Links to similar features in other tools, design inspiration,
        articles, videos, or any reference material.
      placeholder: |
        ## Similar implementations in other tools

        - **HyDE** implements X differently: [link]
        - **Gnome's Night Light** does this for color temp: [link]
        - **macOS Auto Dark Mode** has excellent UX: [description]

        ## Design inspiration

        - [Figma mockup / screenshot of similar UI]
        - [Reddit post discussing this need](https://reddit.com/r/hyprland/...)
        - [YouTube video showing desired behavior](https://youtu.be/...)

        ## Relevant discussions

        - Discord thread: [description of discussion]
        - Previous related issue: #[number]
        - Forum post: [link]

        ## Technical references

        - sunset/sunrise API: https://api.sunrise-sunset.org
        - Relevant Hyprland IPC docs: https://wiki.hyprland.org/IPC/
    validations:
      required: false

  # ════════════════════════════════════════════════════════════════════
  # SECTION 09 — MOCKUPS / WIREFRAMES
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: mockups
    attributes:
      label: "🎨 Mockups / Wireframes / Designs"
      description: >
        Visual representations of the proposed feature.
        Drag and drop images, create ASCII art, or link to Figma designs.
      placeholder: |
        <!-- Drop your mockups, screenshots, or design references here -->

        **ASCII wireframe:**
        ```
        ╔══════════════════════════════════╗
        │  ash theme schedule              │
        │                                  │
        │  [Your wireframe here]           │
        ╚══════════════════════════════════╝
        ```

        **Reference screenshot from other tool:**
        [drag image here]
    validations:
      required: false

  # ════════════════════════════════════════════════════════════════════
  # SECTION 10 — PLUGIN VS CORE
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: plugin_vs_core
    attributes:
      label: "🔌 Plugin or Core Feature?"
      description: >
        Should this be a plugin or a core ASH feature?
        See the [Plugin Guide](https://ash-dotfiles.github.io/docs/plugin-development)
        for guidance on what belongs where.
      options:
        - "🏛️ Core — Essential functionality all users need"
        - "🔌 Plugin — Optional functionality for specific users"
        - "🤷 Either — Happy with whatever makes sense architecturally"
        - "📦 New command — Extension to the CLI"
        - "❓ Unsure — Please advise!"
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 11 — BREAKING CHANGES
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: breaking
    attributes:
      label: "⚠️ Breaking Changes"
      description: "Would this feature require breaking changes to existing functionality?"
      options:
        - "✅ No — Purely additive, no breaking changes"
        - "⚠️ Minor — Small config format changes (easy to migrate)"
        - "🔴 Major — Significant breaking changes required"
        - "❓ Unknown — I'm not sure about the impact"
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 12 — COMMUNITY SUPPORT
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: community_support
    attributes:
      label: "👥 Community Interest"
      description: >
        Have others expressed interest in this feature?
        Link Discord discussions, Reddit threads, or mention survey responses.
      placeholder: |
        ## Community discussions about this feature

        - 15 people upvoted this idea in the Discord #feature-requests channel
        - Reddit post with 200+ upvotes: https://reddit.com/r/unixporn/...
        - Multiple users requested this in issue #XXX comments
        - This was the #3 most requested feature in our community survey

        ## Direct quotes from community members

        > "I've been wanting this for months! Currently I use a hacky cron job" — @username
        > "This would make ASH the best dotfiles manager bar none" — @username2
    validations:
      required: false

  # ════════════════════════════════════════════════════════════════════
  # SECTION 13 — CONTRIBUTION OFFER
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: contribution
    attributes:
      label: "🤝 Contribution Offer"
      description: "Are you willing to help implement this feature?"
      options:
        - "💻 Yes — I can implement this and submit a PR"
        - "🎨 Yes — I can help with design/UX (not coding)"
        - "🧪 Yes — I can write tests for this feature"
        - "📖 Yes — I can write documentation"
        - "🆘 Maybe — I'd like to try with mentorship"
        - "💰 Sponsor — I can sponsor development of this"
        - "👀 No — Just requesting, open to others implementing"
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 14 — TIMELINE EXPECTATIONS
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: timeline
    attributes:
      label: "⏰ Timeline Expectation"
      description: "When would you ideally like to see this implemented?"
      options:
        - "🚨 ASAP — Critical for my workflow"
        - "📅 Next minor release (v5.x)"
        - "📅 Next major release (v6.0)"
        - "🗓️ Within 6 months"
        - "🗓️ Within a year"
        - "💭 No rush — long-term roadmap item"
    validations:
      required: false

  # ════════════════════════════════════════════════════════════════════
  # SECTION 15 — FINAL CHECKLIST
  # ════════════════════════════════════════════════════════════════════
  - type: checkboxes
    id: final_checklist
    attributes:
      label: "✅ Submission Checklist"
      options:
        - label: >
            🔍 I have searched existing issues — this is **not a duplicate**
          required: true
        - label: >
            📋 I have checked the roadmap — this is **not already planned**
          required: true
        - label: >
            🤔 I have considered if this could be implemented as a **plugin first**
          required: true
        - label: >
            📝 I have provided a **clear problem statement** and **concrete solution**
          required: true
        - label: >
            📖 I agree to the
            [Code of Conduct](https://github.com/ash-dotfiles/ash-dotfiles/blob/main/CODE_OF_CONDUCT.md)
          required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 16 — CLOSING
  # ════════════════════════════════════════════════════════════════════
  - type: markdown
    attributes:
      value: |
        ---

        <div align="center">

        ### 🚀 Thank You for Your Feature Request!

        Every great feature starts with a proposal like yours.
        Our team will review and respond with our assessment.

        | Status | Meaning |
        |--------|---------|
        | `needs-discussion` | We need more info or community input |
        | `accepted` | Approved for implementation! |
        | `planned` | Added to the official roadmap |
        | `in-progress` | Someone is actively working on it |
        | `wont-implement` | Not aligned with project goals (with explanation) |

        **While you wait:**
        - ⭐ [Star the repo](https://github.com/ash-dotfiles/ash-dotfiles) to show support
        - 💬 Discuss in [Discord #feature-requests](https://discord.gg/ash-dotfiles)
        - 🔌 Consider prototyping this as a [plugin](https://ash-dotfiles.github.io/docs/plugin-development)!

        *— The ASH Dotfiles Team* ⚡

        </div>