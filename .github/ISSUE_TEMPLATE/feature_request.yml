name: ✨ Feature Request
description: Suggest a new feature for ASH Dotfiles
title: "feat: [brief description]"
labels: ["enhancement", "needs-discussion"]

body:
  - type: markdown
    attributes:
      value: |
        ## ✨ Feature Request
        Have an idea to make ASH better? We'd love to hear it!

  - type: textarea
    id: feature
    attributes:
      label: ✨ Feature Description
      description: Clear description of the feature
      placeholder: "Add support for..."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 🤔 Problem It Solves
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 💡 Proposed Solution
      description: How would you implement this?
      placeholder: |
        The feature would work by:
        1. ...
        2. ...

        Command: `ash feature-name action`

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Alternatives Considered
      description: Other solutions you've considered

  - type: dropdown
    id: category
    attributes:
      label: 🗂️ Category
      multiple: true
      options:
        - Theme Engine
        - Wallpaper System
        - Waybar Modules
        - Rofi Launchers
        - Shell Integration
        - Neovim Plugins
        - Terminal Support
        - Unique Feature (new)
        - Performance
        - Documentation
        - Installation
        - CI/CD
        - Accessibility
        - Multi-GPU Support
        - Light Mode
        - Other

  - type: dropdown
    id: priority
    attributes:
      label: 📊 Priority
      options:
        - Low — Nice to have
        - Medium — Would improve workflow
        - High — Critical for my use case

  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ Checklist
      options:
        - label: This feature fits ASH Dotfiles' scope
          required: true
        - label: I searched existing issues and discussions
          required: true
        - label: I'm willing to help implement this