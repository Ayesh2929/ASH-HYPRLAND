name: 📚 Documentation Issue
description: Report missing, incorrect, or confusing documentation
title: "docs: [description]"
labels: ["documentation"]

body:
  - type: markdown
    attributes:
      value: |
        ## 📚 Documentation Issue
        Help us improve ASH Dotfiles documentation.

  - type: dropdown
    id: doc-type
    attributes:
      label: 📄 Documentation Type
      options:
        - README.md
        - docs/KEYBINDS.md
        - docs/THEMING.md
        - docs/TROUBLESHOOTING.md
        - docs/CUSTOMIZATION.md
        - docs/CONTRIBUTING.md
        - docs/UNIQUE-FEATURES.md
        - ATTRIBUTION.md
        - Code comments (inline)
        - GitHub Wiki
        - New documentation needed
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: 🔍 Issue Type
      options:
        - Information is incorrect
        - Information is missing
        - Information is outdated
        - Information is confusing
        - Typo or grammar error
        - Code example doesn't work
        - New topic needed
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 📍 Current Documentation
      description: Paste the current (incorrect) documentation
      render: markdown

  - type: textarea
    id: suggested
    attributes:
      label: ✏️ Suggested Improvement
      description: How should it be improved?

  - type: checkboxes
    id: contribute
    attributes:
      label: 🤝 Contribution
      options:
        - label: I'm willing to write/fix this documentation