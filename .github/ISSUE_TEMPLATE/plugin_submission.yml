name: "🔌 Plugin Submission"
description: >
  Submit a new plugin to the ASH Dotfiles plugin ecosystem!
  This comprehensive form ensures your plugin meets our quality,
  security, performance, and API standards for official inclusion.
title: "🔌 [PLUGIN] — "
labels:
  - "🔌 plugin-submission"
  - "🔍 needs-review"
  - "🔒 needs-security-audit"
  - "✨ community-contribution"
assignees: []

body:
