        # 🔌 Plugin Submission — ASH Dotfiles v5.0 OMEGA

        > *"Plugins are the heartbeat of the ASH ecosystem — build something legendary"*

        </div>

        ---

        > [!IMPORTANT]
        > **ALL plugins undergo automated security scanning before human review.**
        > Your plugin WILL be rejected if it contains:
        > - Hardcoded credentials, API keys, or secrets
        > - Network calls to undisclosed endpoints
        > - File operations outside permitted directories
        > - Privilege escalation attempts
        > - Obfuscated or minified code without source

        > [!TIP]
        > **New to plugin development?**
        > ```bash
        > # Scaffold a plugin instantly:
        > ash plugin create --interactive --name "my-plugin"
        >
        > # Validate before submitting:
        > ash plugin validate --strict --security ./my-plugin/
        >
        > # Run the full test suite:
        > ash plugin test --all ./my-plugin/
        >
        > # Check API compatibility:
        > ash plugin compat-check ./my-plugin/
        > ```
        > 📖 Read the full [Plugin Development Guide](https://ash-dotfiles.github.io/docs/plugin-development)

        ---

        ### 🔌 Plugin Submission Pre-Flight Checklist

        **Security (MANDATORY — hard failures):**
        - [ ] 🔒 **No hardcoded secrets** — all credentials use ASH secure store
        - [ ] 🌐 **All network endpoints disclosed** in `plugin.json` `permissions.network`
        - [ ] 📁 **File access restricted** to permitted directories only
        - [ ] 🔑 **No sudo/root** operations without explicit justification
        - [ ] 🧹 **No eval** or dynamic code execution of user-provided strings

        **Quality (MANDATORY — required for acceptance):**
        - [ ] 📝 **Complete `plugin.json`** with all required fields
        - [ ] 🧪 **All tests pass** (`ash plugin test ./my-plugin/`)
        - [ ] ✅ **Strict validation** passes (`ash plugin validate --strict`)
        - [ ] 📖 **README.md** with installation, usage, config documentation
        - [ ] 🔄 **Clean enable/disable lifecycle** (no orphaned processes)

        **Quality (RECOMMENDED — increases acceptance speed):**
        - [ ] 📸 Screenshot/demo GIF of plugin in action
        - [ ] ♿ Accessible UI (if plugin has visual components)
        - [ ] 📊 Performance benchmarks included
        - [ ] 🌍 i18n-ready (string externalization)
        - [ ] ↩️ Full rollback capability on disable/uninstall

        ---

  # ════════════════════════════════════════════════════════════════════
  # SECTION 02 — PLUGIN IDENTITY
  # ════════════════════════════════════════════════════════════════════
  - type: input
    id: plugin_name
    attributes:
      label: "🏷️ Plugin Display Name"
      description: >
        The official display name shown in the plugin store and CLI listings.
        Use Title Case. Max 60 characters. No special characters except spaces and hyphens.
      placeholder: "e.g., Smart Focus Timer, Discord Rich Presence, AI Wallpaper Generator"
    validations:
      required: true

  - type: input
    id: plugin_id
    attributes:
      label: "🔑 Plugin ID (slug)"
      description: >
        Unique machine identifier. `kebab-case` only, no spaces or special chars.
        Used in CLI: `ash plugin install [id]`. Check uniqueness in the
        [Plugin Registry](https://ash-dotfiles.github.io/plugins).
      placeholder: "e.g., smart-focus-timer, discord-rpc, ai-wallpaper-gen"
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: "🔢 Plugin Version"
      description: "Semantic versioning (MAJOR.MINOR.PATCH). Must start at 1.0.0 for stable."
      placeholder: "e.g., 1.0.0"
    validations:
      required: true

  - type: input
    id: plugin_repository
    attributes:
      label: "🐙 Plugin Repository URL"
      description: "Full URL to your plugin's public repository"
      placeholder: "https://github.com/yourusername/ash-plugin-smart-focus-timer"
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 03 — PLUGIN CLASSIFICATION
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: plugin_category
    attributes:
      label: "🗂️ Plugin Category"
      description: "Primary category for store browsing and discovery"
      options:
        # Productivity
        - "⏱️ Productivity — Focus, Pomodoro, time management"
        - "📋 Task Management — Todo, goals, habits, tracking"
        - "📅 Calendar & Scheduling — Events, reminders, meetings"
        - "📝 Notes & Writing — Quick notes, journaling, docs"
        # Desktop Enhancement
        - "🪟 Window Management — Tiling, layouts, rules"
        - "🎨 Visual Enhancement — Effects, animations, shaders"
        - "🖼️ Wallpaper — Wallpaper sources, effects, rotation"
        - "🖱️ Cursor & Input — Cursor effects, gesture control"
        - "📊 Bar & Widget — Waybar/AGS modules, widgets"
        # System Management
        - "🔋 Power Management — Battery, thermal, performance"
        - "🌐 Network — WiFi, VPN, monitoring, proxy"
        - "🔊 Audio — Volume, EQ, visualizer, profiles"
        - "🖥️ Display — Multi-monitor, brightness, color temp"
        - "📦 Storage — Disk monitoring, auto-mount, cleanup"
        - "🔒 Security — Firewall, VPN, encryption, privacy"
        # Development
        - "💻 Developer Tools — Docker, K8s, Git, SSH"
        - "📊 Monitoring — System stats, alerts, dashboards"
        - "🧪 Testing & Debug — Development utilities"
        # Entertainment
        - "🎵 Media & Music — Players, visualizers, controls"
        - "🎮 Gaming — Game mode, MangoHUD, Steam, Proton"
        - "📺 Streaming — OBS, Streamlabs, stream deck"
        - "🎭 Entertainment — Fun, novelty, ambient"
        # Integrations
        - "💬 Communication — Discord, Telegram, Slack, Matrix"
        - "📱 Social Media — Reddit, Twitter, Mastodon"
        - "☁️ Cloud Services — Google, AWS, Azure, storage"
        - "🤖 AI & ML — AI assistants, generation, automation"
        - "🏠 Smart Home — Home Assistant, Hue, Nanoleaf"
        - "📊 Finance — Crypto, stocks, budgeting"
        # Health & Wellness
        - "🏥 Health & Wellness — Break reminders, eye care, posture"
        # Other
        - "🔧 Utilities — General purpose tools"
        - "🌍 Internationalization — Language, locale, translation"
        - "♿ Accessibility — Screen reader, high contrast, motor"
        - "❓ Other / Uncategorized"
    validations:
      required: true

  - type: dropdown
    id: plugin_type
    attributes:
      label: "⚙️ Plugin Architecture Type"
      description: "What is the primary technical architecture of your plugin?"
      options:
        - "📜 Shell Script — Pure bash/sh/fish scripts (recommended for simplicity)"
        - "🐍 Python — Python 3 with pip dependencies"
        - "🟢 Node.js — JavaScript/TypeScript with npm dependencies"
        - "🦀 Rust — Compiled Rust binary"
        - "🐹 Go — Compiled Go binary"
        - "🌊 Fish — Pure Fish shell functions/scripts"
        - "🌙 Lua — Lua scripts (for Neovim integration)"
        - "🔗 Hybrid — Multiple languages (specify in description)"
        - "🐋 Container — Runs in Docker/Podman container"
        - "⚙️ Systemd — Primary delivery via systemd user unit"
    validations:
      required: true

  - type: dropdown
    id: plugin_tier
    attributes:
      label: "🏆 Requested Plugin Tier"
      description: >
        Plugins are classified into tiers based on scope and quality.
        **Tier 1 (Core):** Bundled with ASH, maintained by core team
        **Tier 2 (Official):** Published in official store, community maintained
        **Tier 3 (Community):** Listed in store, author maintained
      options:
        - "🥇 Tier 2 (Official) — I want this in the official ASH plugin store"
        - "🥈 Tier 3 (Community) — I want this listed as a community plugin"
        - "💡 Tier 1 (Core) — I believe this should be bundled with ASH core"
        - "🤷 Either — I'll accept whatever tier is appropriate"
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 04 — PLUGIN DESCRIPTION
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: plugin_description
    attributes:
      label: "📝 Plugin Description"
      description: >
        Write a compelling, detailed description of your plugin.
        **Short (≤160 chars):** For CLI listings and store previews.
        **Long (≤2000 chars):** For full plugin store page.
      placeholder: |
        ## 🎯 One-Line Pitch (≤80 chars)
        Smart Pomodoro timer with ASH theme integration and break animations

        ## 📋 Short Description (≤160 chars — store card)
        A fully-integrated Pomodoro focus timer that automatically enables Focus Mode,
        dims distracting apps, and rewards completed sessions with theme celebrations.

        ## 📖 Full Description (≤2000 chars — store page)

        **Smart Focus Timer** transforms your ASH desktop into a productivity powerhouse
        by seamlessly integrating the Pomodoro Technique with ASH's mode system.

        ### ✨ What makes it special?

        Unlike basic timer apps, Smart Focus Timer **deeply integrates** with ASH:

        - 🎭 **Auto-enables Focus Mode** when a Pomodoro starts, disabling notifications,
          hiding the taskbar's distracting elements, and muting non-essential sounds
        - 🎨 **Live color shifting** — the desktop accent color gradually shifts from
          energetic blue at session start to calming amber as time progresses
        - 🏆 **Completion celebrations** — on session complete, triggers a theme flash
          animation and plays customizable sound effects
        - 📊 **Waybar integration** — shows live countdown, progress arc, and
          current Pomodoro number directly in your bar
        - 📈 **Analytics integration** — all sessions tracked in ASH analytics
          dashboard with productivity trends and streak tracking
        - 🔔 **Smart notifications** — custom dunst notifications with session
          context, next action, and one-click controls

        ### 📊 Session Statistics
        Track your focus quality with built-in metrics: sessions per day, focus
        streak, distraction events, and weekly/monthly productivity trends.

        ### ⚙️ Highly Configurable
        Work duration, break duration, long break intervals, auto-start behavior,
        focus mode intensity, sound selection, and color shift ranges — all
        configurable via `ash config set plugin.smart-focus-timer.*`.
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 05 — PROBLEM & SOLUTION
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: problem_solution
    attributes:
      label: "🎯 Problem Solved & Value Proposition"
      description: >
        Articulate the exact problem this plugin solves and why it belongs
        in the ASH ecosystem rather than being a standalone tool.
      placeholder: |
        ## 😤 Problem Statement

        **Pain point:** ASH users who practice Pomodoro technique currently need
        to use separate apps (Gnome Clocks, KDE timer, external CLI tools) that:
        - Don't integrate with ASH's Focus Mode system
        - Can't modify theme colors or bar widgets automatically
        - Don't trigger ASH hooks for pre/post session actions
        - Aren't styleable with ASH's current theme

        **Evidence of demand:**
        - 47 upvotes on Discord #feature-requests for "integrated focus timer"
        - Issue #234 requesting Pomodoro integration
        - 12 users mentioned in the community survey (Q3 2024)

        ## 💡 Why This Plugin vs Existing Solutions

        | Feature | Existing Tools | Smart Focus Timer |
        |---------|---------------|-------------------|
        | ASH Mode integration | ❌ | ✅ Auto-enables Focus Mode |
        | Waybar widget | ❌ | ✅ Live countdown + arc |
        | Theme color shift | ❌ | ✅ Dynamic urgency colors |
        | ASH hooks | ❌ | ✅ Full hook support |
        | Analytics | ❌ | ✅ ASH analytics integration |
        | Themed notifications | ❌ | ✅ Dunst with progress bar |
        | Config via `ash config` | ❌ | ✅ Full ash config integration |

        ## 🎯 Why This Belongs in ASH Core (Not Just Standalone)

        This plugin demonstrates the power of deep ASH integration — it couldn't
        exist as a meaningful standalone tool because its value comes entirely from
        the ASH ecosystem hooks, mode system, theme engine, and analytics framework.
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 06 — PLUGIN.JSON SPECIFICATION
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: plugin_json
    attributes:
      label: "📋 plugin.json — Complete Manifest"
      description: >
        Paste your complete `plugin.json` manifest.
        This is the most critical file — it defines your plugin's identity,
        permissions, hooks, dependencies, and configuration schema.
        **Validation WILL fail without a complete, schema-valid manifest.**
      placeholder: |
        ```json
        {
          "$schema": "https://ash-dotfiles.github.io/schemas/plugin-v2.json",

          "id": "smart-focus-timer",
          "name": "Smart Focus Timer",
          "version": "1.0.0",
          "description": "Pomodoro focus timer with deep ASH desktop integration",
          "long_description": "...",

          "author": {
            "name": "Jane Developer",
            "github": "janedeveloper",
            "email": "jane@example.com",
            "website": "https://janedeveloper.dev"
          },

          "license": "MIT",
          "homepage": "https://github.com/janedeveloper/ash-plugin-smart-focus-timer",
          "repository": "https://github.com/janedeveloper/ash-plugin-smart-focus-timer",
          "issues": "https://github.com/janedeveloper/ash-plugin-smart-focus-timer/issues",
          "funding": "https://github.com/sponsors/janedeveloper",

          "category": "productivity",
          "tags": ["pomodoro", "focus", "timer", "productivity", "work", "wellness"],
          "keywords": ["focus-timer", "pomodoro-technique", "time-management"],

          "min_ash_version": "5.0.0",
          "max_ash_version": null,
          "targets": ["hyprland"],

          "entry": {
            "init":    "init.sh",
            "enable":  "enable.sh",
            "disable": "disable.sh",
            "status":  "status.sh",
            "update":  "update.sh",
            "health":  "health.sh"
          },

          "config": {
            "schema_version": "1",
            "defaults": {
              "work_duration":        25,
              "short_break_duration":  5,
              "long_break_duration":  15,
              "long_break_interval":   4,
              "auto_start_breaks":  true,
              "auto_start_work":   false,
              "sound_enabled":      true,
              "sound_work_start":   "pomodoro-start",
              "sound_break_start":  "pomodoro-end",
              "sound_complete":     "success",
              "focus_mode_auto":    true,
              "color_shift_enabled":true,
              "waybar_module":      true,
              "analytics_enabled":  true,
              "notification_style": "detailed",
              "celebration_enabled":true
            },
            "schema": {
              "work_duration": {
                "type": "integer",
                "min": 1,
                "max": 120,
                "description": "Work session duration in minutes"
              },
              "short_break_duration": {
                "type": "integer",
                "min": 1,
                "max": 30,
                "description": "Short break duration in minutes"
              },
              "focus_mode_auto": {
                "type": "boolean",
                "description": "Automatically enable Focus Mode during work sessions"
              }
            }
          },

          "permissions": {
            "network":    [],
            "filesystem": {
              "read":  ["$XDG_CONFIG_HOME/ash", "$HOME/.local/share/ash"],
              "write": ["$HOME/.local/share/ash/plugins/smart-focus-timer",
                        "$HOME/.local/share/ash/data/analytics"]
            },
            "system_calls": ["notify-send", "playerctl", "hyprctl"],
            "ash_api":  ["theme.accent", "mode.set", "mode.get",
                         "analytics.record", "notification.send",
                         "config.get", "config.set", "hook.register"],
            "secrets":  [],
            "sudo":     false,
            "dbus":     ["org.freedesktop.Notifications"],
            "sockets":  ["$HYPRLAND_INSTANCE_SIGNATURE"]
          },

          "hooks": {
            "registers": [
              "pre-mode-change",
              "post-mode-change",
              "on-idle",
              "on-resume",
              "on-suspend",
              "on-battery",
              "on-ac-power"
            ],
            "provides": [
              "on-pomodoro-start",
              "on-pomodoro-complete",
              "on-break-start",
              "on-break-complete",
              "on-long-break-start",
              "on-session-complete"
            ]
          },

          "dependencies": {
            "required": {
              "system": ["bash>=5.0", "notify-send", "bc"],
              "ash_plugins": []
            },
            "optional": {
              "system": ["playerctl", "mpv"],
              "ash_plugins": ["analytics", "discord-rpc"]
            },
            "conflicts": ["focus-timer", "pomodoro"]
          },

          "provides": {
            "waybar_module": "custom/ash-pomodoro",
            "rofi_menu":     "pomodoro",
            "fish_functions": ["pomodoro", "pomo", "pomo_status"],
            "keybinds":      true,
            "systemd_units": ["ash-pomodoro.service", "ash-pomodoro.timer"]
          },

          "lifecycle": {
            "idempotent_enable":  true,
            "idempotent_disable": true,
            "clean_uninstall":    true,
            "state_persistence":  true,
            "auto_restart":       true
          },

          "resources": {
            "max_memory_mb":   50,
            "max_cpu_percent":  2,
            "background_processes": 1,
            "disk_usage_mb":   10
          },

          "ui": {
            "has_waybar_module":  true,
            "has_rofi_menu":      true,
            "has_notifications":  true,
            "has_tui":           false,
            "has_gui":           false,
            "theme_aware":        true
          },

          "screenshots": [
            { "file": "screenshots/waybar-active.webp",  "caption": "Waybar countdown during work session" },
            { "file": "screenshots/notification.webp",   "caption": "Pomodoro complete notification" },
            { "file": "screenshots/rofi-menu.webp",      "caption": "Rofi control menu" },
            { "file": "screenshots/color-shift.webp",    "caption": "Dynamic color shift during session" }
          ],

          "changelog": [
            {
              "version": "1.0.0",
              "date": "2024-01-15",
              "changes": ["Initial release", "Waybar module", "Focus Mode integration", "Analytics support"]
            }
          ],

          "stats": {
            "install_time_seconds": 5,
            "init_time_ms":        50,
            "enable_time_ms":     200,
            "disable_time_ms":    100
          }
        }
        ```
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
