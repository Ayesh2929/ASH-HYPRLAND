  # ════════════════════════════════════════════════════════════════════
  # SECTION 08 — CORE SCRIPT PREVIEWS
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: core_scripts
    attributes:
      label: "📜 Core Script Previews"
      description: >
        Paste the content of your most critical scripts.
        At minimum: `init.sh`, `enable.sh`, `disable.sh`, `status.sh`.
        Our security team reviews these before automated scanning.
      placeholder: |
        ## init.sh — First-time initialization

        ```bash
        #!/usr/bin/env bash
        # ╔══════════════════════════════════════════════════╗
        # ║  Smart Focus Timer — init.sh                    ║
        # ║  First-time plugin initialization               ║
        # ╚══════════════════════════════════════════════════╝

        set -euo pipefail

        # Source ASH plugin API
        # shellcheck source=/dev/null
        source "${ASH_PLUGIN_API:-/usr/lib/ash/plugin-api.sh}"

        ASH_PLUGIN_ID="smart-focus-timer"
        ASH_PLUGIN_VERSION="1.0.0"

        ash::plugin::log "info" "Initializing ${ASH_PLUGIN_ID} v${ASH_PLUGIN_VERSION}"

        # ── Create plugin data directory ──────────────────
        local data_dir
        data_dir="$(ash::plugin::data_dir)"
        mkdir -p "${data_dir}"/{state,sessions,logs}

        # ── Initialize state file ─────────────────────────
        if [[ ! -f "${data_dir}/state/current.json" ]]; then
          cat > "${data_dir}/state/current.json" << 'EOF'
        {
          "status":          "idle",
          "session_type":    null,
          "session_number":  0,
          "start_time":      null,
          "duration_minutes": 25,
          "pomodoros_today": 0,
          "streak_days":     0
        }
        EOF
          ash::plugin::log "debug" "State file initialized"
        fi

        # ── Register Waybar module ─────────────────────────
        if ash::config::get "plugin.${ASH_PLUGIN_ID}.waybar_module" | grep -q "true"; then
          ash::plugin::register_waybar_module "custom/ash-pomodoro" \
            "${ASH_PLUGIN_DIR}/waybar/module.jsonc"
          ash::plugin::log "info" "Waybar module registered"
        fi

        # ── Register ASH hooks ────────────────────────────
        ash::hook::register "on-suspend"    "${ASH_PLUGIN_DIR}/lib/hooks.sh::on_suspend"
        ash::hook::register "on-resume"     "${ASH_PLUGIN_DIR}/lib/hooks.sh::on_resume"
        ash::hook::register "on-battery"    "${ASH_PLUGIN_DIR}/lib/hooks.sh::on_battery"
        ash::hook::register "on-ac-power"   "${ASH_PLUGIN_DIR}/lib/hooks.sh::on_ac_power"

        # ── Install Fish functions ─────────────────────────
        ash::plugin::install_fish_functions "${ASH_PLUGIN_DIR}/fish/"

        # ── Verify required dependencies ──────────────────
        local -a required_cmds=("bash" "bc" "notify-send" "date")
        for cmd in "${required_cmds[@]}"; do
          if ! command -v "${cmd}" &>/dev/null; then
            ash::plugin::log "error" "Missing required dependency: ${cmd}"
            ash::plugin::fail "Dependency not found: ${cmd}"
          fi
        done

        ash::plugin::log "success" "Plugin initialized successfully"
        ash::plugin::emit_event "initialized" "{\"version\": \"${ASH_PLUGIN_VERSION}\"}"
        ```

        ## enable.sh — Plugin activation

        ```bash
        #!/usr/bin/env bash
        # Smart Focus Timer — enable.sh

        set -euo pipefail
        source "${ASH_PLUGIN_API:-/usr/lib/ash/plugin-api.sh}"

        ASH_PLUGIN_ID="smart-focus-timer"

        ash::plugin::log "info" "Enabling ${ASH_PLUGIN_ID}"

        # ── Start background daemon via systemd ───────────
        systemctl --user enable --now "ash-pomodoro.service" \
          || ash::plugin::log "warn" "systemd unit start failed — using fallback"

        # ── Update Waybar ─────────────────────────────────
        ash::waybar::reload

        ash::plugin::log "success" "Smart Focus Timer enabled"
        ash::plugin::set_status "enabled"
        ```

        ## disable.sh — Clean deactivation

        ```bash
        #!/usr/bin/env bash
        # Smart Focus Timer — disable.sh

        set -euo pipefail
        source "${ASH_PLUGIN_API:-/usr/lib/ash/plugin-api.sh}"

        ASH_PLUGIN_ID="smart-focus-timer"

        ash::plugin::log "info" "Disabling ${ASH_PLUGIN_ID}"

        # ── Stop any active timer gracefully ──────────────
        local state_file
        state_file="$(ash::plugin::data_dir)/state/current.json"

        if [[ -f "${state_file}" ]]; then
          local current_status
          current_status="$(jq -r '.status' "${state_file}" 2>/dev/null || echo "idle")"

          if [[ "${current_status}" != "idle" ]]; then
            ash::plugin::log "info" "Stopping active timer (status: ${current_status})"
            # Save partial session to analytics before stopping
            source "${ASH_PLUGIN_DIR}/lib/analytics.sh"
            analytics::record_partial_session
          fi
        fi

        # ── Stop systemd service ──────────────────────────
        systemctl --user disable --now "ash-pomodoro.service" 2>/dev/null || true

        # ── Restore Focus Mode if we set it ──────────────
        local focus_set_by_plugin
        focus_set_by_plugin="$(ash::state::get "plugin.${ASH_PLUGIN_ID}.set_focus_mode" || echo false)"
        if [[ "${focus_set_by_plugin}" == "true" ]]; then
          ash::mode::restore_previous
          ash::state::set "plugin.${ASH_PLUGIN_ID}.set_focus_mode" "false"
        fi

        # ── Restore original theme accent ─────────────────
        ash::theme::restore_accent

        # ── Remove Waybar module ──────────────────────────
        ash::waybar::remove_module "custom/ash-pomodoro"
        ash::waybar::reload

        # ── Deregister hooks ──────────────────────────────
        ash::hook::deregister_all "${ASH_PLUGIN_ID}"

        ash::plugin::log "success" "Plugin disabled cleanly — no orphaned processes"
        ash::plugin::set_status "disabled"
        ```

        ## status.sh — State reporter

        ```bash
        #!/usr/bin/env bash
        # Smart Focus Timer — status.sh

        set -euo pipefail
        source "${ASH_PLUGIN_API:-/usr/lib/ash/plugin-api.sh}"

        ASH_PLUGIN_ID="smart-focus-timer"

        state_file="$(ash::plugin::data_dir)/state/current.json"

        if [[ ! -f "${state_file}" ]]; then
          ash::plugin::output::json '{
            "status": "not_initialized",
            "plugin": "smart-focus-timer"
          }'
          exit 0
        fi

        # Read current state
        status="$(jq -r '.status' "${state_file}")"
        session_type="$(jq -r '.session_type // "none"' "${state_file}")"
        pomodoros_today="$(jq -r '.pomodoros_today' "${state_file}")"

        # Calculate time remaining if active
        time_remaining=""
        if [[ "${status}" == "running" ]]; then
          start_time="$(jq -r '.start_time' "${state_file}")"
          duration_secs=$(( $(jq -r '.duration_minutes' "${state_file}") * 60 ))
          elapsed=$(( $(date +%s) - start_time ))
          remaining=$(( duration_secs - elapsed ))
          time_remaining="$(printf '%02d:%02d' $((remaining/60)) $((remaining%60)))"
        fi

        ash::plugin::output::json "$(jq -n \
          --arg status "${status}" \
          --arg session_type "${session_type}" \
          --arg time_remaining "${time_remaining}" \
          --argjson pomodoros_today "${pomodoros_today}" \
          '{
            "status": $status,
            "session_type": $session_type,
            "time_remaining": $time_remaining,
            "pomodoros_today": $pomodoros_today
          }')"
        ```
    validations:
      required: true

