  # ════════════════════════════════════════════════════════════════════
  # SECTION 11 — LIFECYCLE MANAGEMENT
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: lifecycle
    attributes:
      label: "🔄 Plugin Lifecycle Management"
      description: >
        Describe exactly what your plugin does at each lifecycle stage.
        **Clean lifecycle management is a hard requirement for acceptance.**
      placeholder: |
        ## ⬇️ Install (`ash plugin install smart-focus-timer`)

        1. Downloads plugin from repository
        2. Runs `init.sh`:
           - Creates `~/.local/share/ash/plugins/smart-focus-timer/` data dir
           - Initializes `state/current.json` with defaults
           - Registers Waybar module definition
           - Installs Fish functions to `~/.config/fish/functions/`
           - Installs systemd user units (not yet enabled)
        3. Validates all dependencies are present
        4. Sets plugin status to `installed`

        **Files created during install:**
        ```
        ~/.local/share/ash/plugins/smart-focus-timer/
        ├── state/current.json
        ├── sessions/
        └── logs/plugin.log
        ~/.config/fish/functions/pomodoro.fish (symlink)
        ~/.config/fish/functions/pomo.fish (symlink)
        ~/.config/systemd/user/ash-pomodoro.service (symlink)
        ```

        ## ✅ Enable (`ash plugin enable smart-focus-timer`)

        1. Starts `ash-pomodoro.service` via systemd
        2. Registers Waybar module in active config
        3. Reloads Waybar
        4. Registers ASH event hooks
        5. Sets status to `enabled`

        **Changes to running system:**
        - 1 new background process: `ash-pomodoro-daemon`
        - Waybar gains `custom/ash-pomodoro` module
        - 4 ASH hooks registered

        ## ❌ Disable (`ash plugin disable smart-focus-timer`)

        1. If timer is active: saves partial session data, sends "timer stopped" notification
        2. If Focus Mode was enabled by plugin: restores previous mode
        3. If accent color was shifted: restores original accent
        4. Stops `ash-pomodoro.service`
        5. Removes Waybar module, reloads Waybar
        6. Deregisters all ASH hooks
        7. Sets status to `disabled`

        **System state after disable:** ✅ Clean — identical to before enable was called

        ## 🗑️ Uninstall (`ash plugin remove smart-focus-timer`)

        1. Runs disable if currently enabled
        2. Removes systemd units
        3. Removes Fish function symlinks
        4. **Optionally** removes data dir (prompts user — session history preserved by default)
        5. Removes plugin from ASH plugin registry

        **Files remaining after uninstall (with data preserved):**
        ```
        ~/.local/share/ash/plugins/smart-focus-timer/sessions/  ← preserved by default
        ```

        **Files remaining after uninstall (full clean):**
        ```
        Nothing — complete removal confirmed ✅
        ```

        ## 🔄 Update (`ash plugin update smart-focus-timer`)

        1. Downloads new version
        2. Runs `disable.sh` (graceful stop)
        3. Backs up current state to `~/.local/share/ash/plugins/smart-focus-timer/backups/`
        4. Replaces plugin files
        5. Runs migration script if config schema changed
        6. Runs `enable.sh` to restart
        7. Verifies health check passes

        **Zero data loss guaranteed during updates ✅**
    validations:
      required: true

