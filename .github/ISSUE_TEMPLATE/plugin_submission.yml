    id: file_structure
    attributes:
      label: "📁 Complete Plugin File Structure"
      description: >
        Show the complete directory structure of your plugin.
        Every file listed in `plugin.json` must exist.
      placeholder: |
        ```
        ash-plugin-smart-focus-timer/
        │
        ├── 📄 plugin.json              ← Plugin manifest (required)
        ├── 📄 README.md                ← Documentation (required)
        ├── 📄 LICENSE                  ← License file (required)
        ├── 📄 CHANGELOG.md             ← Version history
        │
        ├── 📄 init.sh                  ← First-time setup (required)
        ├── 📄 enable.sh                ← Activation logic (required)
        ├── 📄 disable.sh               ← Deactivation + cleanup (required)
        ├── 📄 status.sh                ← Current state reporter (required)
        ├── 📄 update.sh                ← Self-update logic
        ├── 📄 health.sh                ← Health check endpoint
        │
        ├── 📁 lib/
