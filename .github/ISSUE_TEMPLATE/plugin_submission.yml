  # SECTION 15 — COMPATIBILITY MATRIX
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: compatibility
    attributes:
      label: "🌍 Compatibility Matrix"
      description: >
        Document which systems, distros, and configurations your plugin
        has been tested with and any known limitations.
      placeholder: |
        ## 🐧 Distribution Compatibility

        | Distribution | Version | Status | Notes |
        |-------------|---------|--------|-------|
        | Arch Linux | Rolling | ✅ Fully supported | Primary dev platform |
        | EndeavourOS | Rolling | ✅ Fully supported | Same as Arch |
        | NixOS | 23.11, 24.05 | ✅ Fully supported | Nix module included |
        | Fedora | 39, 40 | ✅ Fully supported | Tested with COPR |
        | openSUSE Tumbleweed | Rolling | ✅ Supported | Minor path differences |
        | Void Linux | Rolling | ✅ Supported | runit → systemd compat layer |
        | Debian | 12 (Bookworm) | ⚠️ Partial | bash 5.1, missing `bc` by default |
        | Ubuntu | 24.04 LTS | ⚠️ Partial | Same as Debian |
        | Gentoo | Rolling | 🧪 Untested | Should work, unverified |

        ## 🪟 Hyprland Version Compatibility

        | Hyprland | Supports | Notes |
        |----------|----------|-------|
        | v0.40.0+ | ✅ Full | Current minimum recommended |
        | v0.36.0 - v0.39.x | ✅ Full | Tested |
        | v0.30.0 - v0.35.x | ⚠️ Partial | Missing `hyprctl dispatch focusmonitor` |
        | < v0.30.0 | ❌ Unsupported | IPC format incompatible |

        ## 🖥️ Hardware Compatibility

        | GPU Driver | Status | Notes |
        |-----------|--------|-------|
        | AMD (amdgpu) | ✅ Full | Primary test platform |
        | NVIDIA (proprietary) | ✅ Full | Tested on RTX 3080 |
        | NVIDIA (open) | ✅ Full | Tested on RTX 4090 |
        | Intel (iris/i915) | ✅ Full | Tested on Iris Xe |
        | VM (VMware/QEMU) | ⚠️ Partial | Animations disabled in VM |

        ## ⚙️ Configuration Compatibility

        - **Multiple monitors:** ✅ Supported — Waybar module appears on primary
        - **Multiple Waybar instances:** ✅ Supported — module on each bar
        - **Vertical Waybar:** ✅ Supported — compact text mode auto-enabled
        - **AGS instead of Waybar:** 🔜 Planned for v1.1.0
        - **Without systemd (runit/OpenRC):** ⚠️ Fallback mode using background process

        ## 🔌 Plugin Compatibility

        | Plugin | Status | Notes |
        |--------|--------|-------|
        | `analytics` | ✅ Integrates | Automatically records sessions |
        | `discord-rpc` | ✅ Integrates | Shows "Focusing 🍅" in Discord status |
        | `focus-mode` (deprecated) | ⚠️ Conflicts | Use this plugin instead |
        | `game-mode` | ⚠️ Advisory | Warns when game mode conflicts with focus |
        | `do-not-disturb` | ✅ Compatible | Works alongside DND mode |
    validations:
      required: true

