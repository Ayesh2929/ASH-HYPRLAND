  - type: textarea
    id: connectivity_diagnostics
    attributes:
      label: "🔌 Connectivity Diagnostics (fill for connection issues)"
      description: >
        For connection-related issues, provide detailed network diagnostics.
      placeholder: |
        ## 📡 Network Reachability Tests

        ### From Phone Browser (test these URLs):
        ```
        http://[DESKTOP_IP]:7070/api/v1/health
        Expected response: {"status":"healthy","version":"5.0.2","uptime":12345}
        Actual response: [timeout / connection refused / correct response]

        http://[DESKTOP_IP]:7070/api/v1/health (with auth)
        → Tap URL in browser, does it respond?
