  # SECTION 15 — WORKAROUNDS
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: workarounds
    attributes:
      label: "🔧 Workarounds Attempted"
      description: "Document everything you've tried to resolve the issue"
      placeholder: |
        ## ✅ Partial Workarounds Found

        ### Workaround 1: Force-close and reopen app
        - **Effect:** Sometimes fixes connection issues temporarily
        - **Duration:** Works for ~5 minutes then issue returns
        - **Verdict:** ⚠️ Temporary, inconvenient

        ### Workaround 2: Clear app cache
        - **Steps:** Settings → Apps → ASH Mobile → Clear Cache
        - **Effect:** Fixed the broken preview images issue
        - **Verdict:** ✅ Works but shouldn't be needed

        ### Workaround 3: Re-pair device (delete and re-add)
        - **Steps:** Desktop: `ash api devices remove dev_abc123` → App: Re-scan QR
        - **Effect:** Did NOT fix the theme apply issue
        - **Verdict:** ❌ No improvement

        ## ❌ Failed Attempts

        | Attempt | Expected | Actual |
        |---------|----------|--------|
        | Toggle airplane mode | Reset network | No change |
        | Disable VPN | Remove network barrier | No VPN active anyway |
        | Switch from WiFi to mobile data | Different network path | Same issue |
        | Downgrade app (1.2.2) | Older version might work | Same issue |
        | Regenerate API token | Fresh auth | Same issue |
        | Restart desktop ASH API | Clear server state | Same issue |
        | Change API port to 8080 | Port conflict resolution | Same issue |

        ## 🔍 Insights from Testing

        1. The API call succeeds (200 OK) — the issue is post-API-response
        2. The desktop job queue has 3 stuck jobs — likely root cause
        3. `ash api queue --flush` clears stuck jobs → theme applies work temporarily
        4. Queue gets stuck again after ~5 theme applies
        5. Appears to be a desktop-side issue, not mobile app issue specifically

        **Conclusion:** This may actually be a desktop API bug (job queue deadlock)
        triggered by mobile usage patterns, not a mobile app bug per se.
