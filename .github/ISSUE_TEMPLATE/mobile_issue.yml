  # ════════════════════════════════════════════════════════════════════
  # SECTION 07 — PROBLEM DESCRIPTION
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: problem_description
    attributes:
      label: "📋 Detailed Problem Description"
      description: >
        Describe the mobile issue with precise detail.
        Include what you tap, what you expect, and what actually happens.
      placeholder: |
        ## 🔴 What Is Happening

        **Summary:** When I attempt to apply a theme from the mobile app on my
        Samsung Galaxy S24 Ultra (Android 14), the app shows "Theme Applied ✅"
        toast notification but the desktop theme does NOT change. The app's
        theme list shows the correct active theme after applying, but the desktop
        remains on the previous theme.

        ## 📋 Step-by-Step Description

        1. Open ASH Mobile App → connection indicator shows 🟢 Connected
        2. Navigate to Themes tab → list loads correctly with 47 themes
        3. Tap "Catppuccin Mocha" theme card
        4. Theme preview modal appears with preview image — correct
        5. Tap "Apply Theme" button (blue, full-width)
        6. Loading spinner shows for ~1.5 seconds
        7. **✅ Toast appears:** "Catppuccin Mocha applied successfully"
        8. App's active theme indicator updates to show Catppuccin Mocha
        9. **❌ Desktop remains on Tokyo Night** — no theme change occurs
        10. Running `ash config get theme.active` on desktop shows: `tokyo-night`

        ## ✅ Expected Behavior

        Desktop should immediately apply Catppuccin Mocha theme:
        - Colors update across all components
        - Waybar refreshes with new theme colors
        - Terminal (Kitty) updates colors
        - Active theme changes to catppuccin-mocha on desktop

        ## 🔍 Additional Observations

        - The issue is 100% reproducible — every theme apply from mobile fails
        - `ash doctor` on desktop shows API is healthy
        - Manual `ash theme apply catppuccin-mocha` from desktop terminal WORKS
        - The mobile app receives a 200 OK from the API (not an error)
        - But `ash api logs` shows the apply was queued but never executed
        - The issue started after updating the desktop ASH to v5.0.2

        ## 🕐 When Does This Occur?

        - [x] Always — 100% reproducible
        - [ ] Intermittently — approximately ___% of the time
        - [ ] Only in specific app state (describe below)
        - [ ] Only after the app has been running for X minutes
        - [ ] Only when battery saver is active
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 08 — REPRODUCTION STEPS
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: reproduction
    attributes:
      label: "🔄 Exact Reproduction Steps"
      description: "Numbered steps someone else can follow to reproduce your issue"
      placeholder: |
        ## Prerequisites
        - ASH Mobile App v1.2.3 on Samsung Galaxy S24 Ultra (Android 14)
        - ASH Desktop v5.0.2 running on Arch Linux
        - Connected to same WiFi network
        - App is connected (green indicator in top bar)

        ## Reproduction Steps

        1. Launch ASH Mobile App
        2. Verify connection: Top bar shows "🟢 Connected — ash-desktop"
        3. Tap **"Themes"** tab (second tab in bottom navigation)
        4. Wait for theme list to load (approximately 2 seconds)
        5. Scroll down to find **"Catppuccin Mocha"** theme
        6. Tap the **Catppuccin Mocha** theme card (NOT the favorite star)
        7. Bottom sheet modal appears with theme preview
        8. Tap the **"Apply Theme"** button
        9. Observe: Loading indicator → Toast "Applied ✅" → Modal closes
        10. Go to desktop and run: `ash config get theme.active`
            - **Expected:** `catppuccin-mocha`
            - **Actual:** `tokyo-night` (unchanged)

        ## Verify the Bug

        ```bash
        # On desktop — check API logs around the time of the app action:
        $ journalctl --user -u ash-api-server --since "2 min ago"

        # Expected log (if working):
        # [14:32:01] POST /api/v1/themes/catppuccin-mocha/apply → 200
        # [14:32:01] Executing theme apply: catppuccin-mocha
        # [14:32:02] Theme applied successfully

        # Actual log (what happens):
        # [14:32:01] POST /api/v1/themes/catppuccin-mocha/apply → 200
        # [14:32:01] Queued theme apply: catppuccin-mocha [job_id: 789]
        # [NO FURTHER LOGS — job never executes]
        ```

        ## Minimum Reproduction

        Just tapping ANY theme's "Apply" button in the mobile app fails.
        Not specific to Catppuccin Mocha — all themes fail identically.
