  available for Android and iOS. Connection problems, UI bugs,
  theme control failures, push notification issues, performance
  problems, or any mobile-specific behavior — report them here
  with our comprehensive mobile diagnostic form.
title: "📱 [MOBILE] — "
labels:
  - "📱 mobile"
  - "🔍 needs-triage"
  - "🔬 needs-device-info"
assignees: []

body:
