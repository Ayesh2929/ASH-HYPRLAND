        QR Code: [displayed — scan with mobile app]

        # Test token from phone (via browser):
        # GET http://[DESKTOP_IP]:7070/api/v1/themes
        # Header: Authorization: Bearer ash_tok_xxx
        # Expected: 200 OK with themes array
        # Actual: [401 / 403 / timeout / 200 correct]
