        # 📱 Mobile Companion App Issue — ASH Dotfiles v5.0 OMEGA

        > *"Your desktop, in your pocket — seamlessly connected"*

        </div>

        ---

        > [!IMPORTANT]
        > **Mobile app requires ASH Desktop v5.0.0+ with the REST API enabled.**
        > Before filing a mobile issue, verify your desktop setup:
        > ```bash
        > # On your desktop — verify API is running:
        > ash api status
        >
        > # Enable API if not running:
        > ash config set api.enabled true
        > ash api start
        >
        > # Check connectivity from phone's network:
        > ash api --show-connection-info
        > # Output: Connection URL: http://192.168.1.x:7070
        >
        > # Test API health endpoint from phone browser:
        > # http://[DESKTOP_IP]:7070/api/v1/health
        > ```

        > [!TIP]
        > **Quick mobile diagnostics:**
        > In the ASH Mobile App:
        > `Settings → Diagnostics → Export Full Report`
        > This generates a shareable diagnostic bundle — attach it to your issue!

        ---

        ### 📱 Mobile Issue Pre-Flight Checklist

        **Connectivity:**
        - [ ] 📡 Phone and desktop are on the **same WiFi network** (or VPN)
        - [ ] 🔒 Firewall allows port 7070 (`ash api --check-firewall`)
        - [ ] 🌐 ASH desktop REST API is running (`ash api status`)
        - [ ] 🔑 API authentication token is configured in app settings

        **App State:**
        - [ ] 🔄 Updated to **latest app version** (Play Store / App Store)
        - [ ] 🔄 Updated **ASH Desktop** to latest version (`ash update`)
        - [ ] 🔁 Tried **force-closing and reopening** the app
        - [ ] 🧹 Tried **clearing app cache** (Settings → App → Clear Cache)
        - [ ] 🔍 Searched [existing mobile issues](https://github.com/ash-dotfiles/ash-dotfiles/issues?q=label%3A%22mobile%22)

        ---

