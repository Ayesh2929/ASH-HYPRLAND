        # 🖼️ Wallpaper Submission — ASH Dotfiles v5.0 OMEGA

        > *"The perfect wallpaper transforms pixels into poetry"*

        </div>

        ---

        > [!IMPORTANT]
        > **Copyright and licensing are non-negotiable.**
        > Submitting wallpapers you don't have rights to distribute is grounds
        > for **immediate rejection and potential DMCA reporting**.
        > When in doubt, only submit your own original work.

        > [!TIP]
        > **Quality over quantity.** We curate wallpapers carefully.
        > One exceptional 4K wallpaper is worth more than ten mediocre ones.
        > Run `ash wallpaper validate path/to/wallpaper.jpg` to pre-check quality.

        ---

        ### 🖼️ Pre-Submission Requirements Checklist

        **Technical (MANDATORY):**
        - [ ] 📐 Minimum resolution: **1920×1080** (3840×2160 strongly preferred)
        - [ ] 📦 File format: **JPEG** (quality ≥ 90), **PNG**, or **WebP** (lossless)
        - [ ] 📊 File size: **≤ 25 MB** per wallpaper
        - [ ] 🎨 Color space: **sRGB** (not CMYK, not P3 unless sRGB-compatible)
        - [ ] 🚫 No visible watermarks, text overlays, or logos (unless decorative)
        - [ ] ✅ Passes `ash wallpaper validate` quality checks

        **Rights (MANDATORY):**
        - [ ] ⚖️ You are the **original creator** OR have **explicit redistribution rights**
        - [ ] 📄 A **compatible open-source license** applies (see accepted licenses below)
        - [ ] 🚫 Image does **not** contain trademarked logos, recognizable people, or NSFW content
        - [ ] 🚫 Image was **not** generated using models trained on non-consenting artists' work *(if AI)*

        **Quality (RECOMMENDED for faster acceptance):**
        - [ ] 🎨 Vibrant, interesting composition that works with dark themes
        - [ ] 🌓 Works well with both dark and light theme overlays
        - [ ] 📱 Tested at multiple aspect ratios (16:9, 21:9, 32:9)
        - [ ] 🔲 Clean focal area — important content not in corners (where bars overlay)
        - [ ] 🖥️ Shown in context (screenshot of your ASH desktop using this wallpaper)

        ---

  # ════════════════════════════════════════════════════════════════════
  # SECTION 02 — SUBMISSION TYPE
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: submission_type
    attributes:
      label: "📦 Submission Type"
      description: "What are you submitting?"
      options:
        - "🖼️ Single wallpaper — One wallpaper file"
        - "🗂️ Wallpaper pack — 2-10 thematically related wallpapers"
        - "🎨 Themed collection — 10+ wallpapers for a specific ASH theme"
        - "🤖 AI-generated single — One AI-generated wallpaper"
        - "🤖 AI-generated pack — Multiple AI-generated wallpapers"
        - "🎬 Animated wallpaper — GIF or video loop"
        - "📡 Live wallpaper script — Dynamic/generated wallpaper"
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 03 — WALLPAPER IDENTITY
  # ════════════════════════════════════════════════════════════════════
  - type: input
    id: wallpaper_title
    attributes:
      label: "🏷️ Wallpaper Title"
      description: "A descriptive title for store listing. Max 80 chars. No file extensions."
      placeholder: "e.g., Arctic Aurora Midnight, Neon Tokyo Rain, Misty Forest Dawn"
    validations:
      required: true

  - type: input
    id: wallpaper_id
    attributes:
      label: "🔑 Wallpaper ID (slug)"
      description: "Unique `kebab-case` identifier used in CLI: `ash wallpaper set [id]`"
      placeholder: "e.g., arctic-aurora-midnight, neon-tokyo-rain, misty-forest-dawn"
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 04 — CATEGORY & STYLE
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: wallpaper_category
    attributes:
      label: "🗂️ Primary Category"
      description: "Where should this wallpaper appear in the library?"
      options:
        - "🌑 Dark — Dark-toned, works with dark themes"
        - "🌕 Light — Light-toned, works with light themes"
        - "◾ Minimal — Clean, simple, minimalist"
        - "🎨 Abstract — Abstract art, patterns, geometrics"
        - "🌿 Nature — Landscapes, forests, oceans, mountains"
        - "🌌 Space — Cosmos, nebulae, planets, astronomy"
        - "🏙️ Architecture — Buildings, cities, urban"
        - "🌊 Water — Oceans, lakes, rain, underwater"
        - "⛰️ Mountains — Mountains, glaciers, highland"
        - "🌸 Floral — Flowers, plants, botanical"
        - "🦋 Wildlife — Animals, insects, birds"
        - "🌅 Atmospheric — Sunrises, sunsets, weather, sky"
        - "🎌 Anime & Illustration — Anime art, illustration, manga"
        - "⚡ Cyberpunk & Neon — Neon, cyberpunk, futuristic"
        - "🕹️ Retro & Pixel — Retro, vaporwave, pixel art"
        - "🎮 Gaming — Game art, game environments"
        - "🌈 Gradient — Color gradients, aurora effects"
        - "🏛️ Architecture — Historic, modern, brutalist"
        - "🔬 Macro — Extreme close-up, micro photography"
        - "🎨 Digital Art — Digital paintings, 3D renders"
