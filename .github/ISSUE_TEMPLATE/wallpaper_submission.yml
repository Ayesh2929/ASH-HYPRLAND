    attributes:
      label: "🎨 Color Analysis & Theme Compatibility"
      description: >
        Provide color extraction data so our theme engine can automatically
        generate matching themes from your wallpaper.
        Run `ash wallpaper info --colors path/to/wallpaper.jpg`
      placeholder: |
        ## Dominant Color Palette

        ```bash
        # Run: ash wallpaper info --colors arctic-aurora-midnight.jpg
        # OR: matugen image arctic-aurora-midnight.jpg --type scheme-tonal-spot
        ```

        ### Extracted Colors (from `ash wallpaper info --colors`)

        | Role | Hex | RGB | Notes |
        |------|-----|-----|-------|
        | Background | `#0a0f1a` | 10, 15, 26 | Deep midnight blue — main bg |
        | Surface | `#121923` | 18, 25, 35 | Slightly lighter surface |
        | Foreground | `#e8f0fe` | 232, 240, 254 | Cool white text |
        | Primary Accent | `#39d353` | 57, 211, 83 | Aurora green |
        | Secondary Accent | `#58a6ff` | 88, 166, 255 | Aurora blue |
        | Tertiary Accent | `#bc8cff` | 188, 140, 255 | Aurora purple |
        | Warm Highlight | `#ffd700` | 255, 215, 0 | Star yellow (rare) |
        | Neutral | `#3d4a5c` | 61, 74, 92 | Gray-blue mid-tone |

        ## Theme Engine Compatibility

        | Feature | Value | Notes |
        |---------|-------|-------|
        | Background luminance | 0.18 | Dark (< 0.3) — ideal for dark themes |
        | Accent vibrancy | 0.85 | High — colors will pop |
        | Color harmony | Analogous + Complementary | Blue-green-purple range |
        | Material You | Compatible | matugen extraction works well |
        | Pywal | Compatible | Good color clustering |
        | WCAG AA foreground | ✅ 9.2:1 contrast | Well above minimum |

        ## Recommended Generated Themes

        This wallpaper works best as the source for:
        - Auto-generated dark theme (luminance-based)
        - Nord-adjacent color palette
        - Custom "Arctic Aurora" theme (submitted alongside)

        ## Color Temperature & Mood Mapping

        ```
        Temperature: Cool (6800K equivalent)
        Primary feel: Night sky, frozen tundra, aurora
        ASH mood mapping: "calm", "focused", "mysterious"
        Best modes: Default, Focus, Work
        Avoid modes: Gaming (too calm), Cinema (too dark)
        ```
    validations:
      required: false

  # ════════════════════════════════════════════════════════════════════
  # SECTION 08 — CREATION DETAILS
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: creation_type
    attributes:
      label: "🎨 Creation Method"
      description: "How was this wallpaper created?"
      options:
        - "📷 Original Photography — I took this photo"
        - "🎨 Original Digital Art — I created this digitally (Blender, Photoshop, etc.)"
        - "🖌️ Traditional Art — Photographed or scanned traditional artwork I created"
        - "🤖 AI Generated — DALL-E 3"
        - "🤖 AI Generated — Stable Diffusion (open weights)"
        - "🤖 AI Generated — Midjourney"
        - "🤖 AI Generated — Adobe Firefly"
        - "🤖 AI Generated — Other AI tool (specify below)"
        - "🤖 AI Enhanced — My photo/art + AI enhancement/upscaling only"
        - "🔗 Licensed Third-Party — I have explicit license to redistribute"
        - "🌍 Public Domain — Pre-1928 artwork, NASA, USGS, etc."
        - "📜 CC Licensed — Creative Commons licensed work (specify below)"
    validations:
      required: true

  - type: textarea
    id: creation_details
    attributes:
      label: "🔧 Creation Details & Technical Process"
      description: >
        Describe HOW you created this wallpaper.
        For photography: camera, lens, settings, location.
        For digital art: software, techniques, render settings.
        For AI: exact prompts, model version, seed, negative prompts.
      placeholder: |
        ## 📷 Photography Details (if applicable)

        - **Camera:** Sony A7R V
        - **Lens:** Sigma 14mm f/1.8 DG HSM Art
        - **Settings:** f/2.0, ISO 3200, 15s exposure
        - **Location:** Tromsø, Norway (69.6°N, 18.9°E)
        - **Date/Time:** 2024-01-15, 23:47 local time
        - **Post-processing:** Adobe Lightroom (exposure +0.3, clarity +20, dehaze +15)
        - **RAW processed:** Yes (Sony ARW → JPEG export)

        ---

        ## 🎨 Digital Art Details (if applicable)

        - **Software:** Blender 4.1 + EEVEE renderer
        - **Render time:** 4h 23min (RTX 4090, 4096 samples)
        - **Resolution:** Rendered at 7680×4320, downscaled to 3840×2160
        - **Techniques:** Volumetric atmosphere, procedural aurora shader,
                         particle system for stars, HDRI sky dome
        - **Post-processing:** Photoshop (color grade, lens flare, film grain)

        ---

        ## 🤖 AI Generation Details (if applicable)

        > ⚠️ Required: Provide complete prompts for AI-generated work.
        > Submissions without complete prompts will be rejected.

        - **AI Tool:** Stable Diffusion XL 1.0 (open weights — ComfyUI)
        - **Model:** dreamshaper-xl-v2-turbo.safetensors
        - **Sampler:** DPM++ 2M Karras
        - **Steps:** 40
        - **CFG Scale:** 7.5
        - **Seed:** 42891736

        **Positive Prompt:**
        ```
        (masterpiece, best quality, ultra detailed), arctic night sky, northern lights
        aurora borealis, electric green and blue aurora curtains, star field, frozen
        tundra, snow-covered pine trees silhouette, reflective ice lake, cinematic
        lighting, photorealistic, 8K resolution, sharp focus, dramatic atmosphere,
        National Geographic photography style, long exposure effect
        ```

        **Negative Prompt:**
        ```
        watermark, text, logo, blurry, noisy, low quality, jpeg artifacts, cartoon,
        anime, painting, drawing, oversaturated, ugly, deformed, extra limbs, humans,
        animals, buildings, daytime, bright sky
        ```

        **Post-processing:** Topaz Gigapixel AI upscale 2x → JPEG export quality 95

        ---

        ## 🔗 License Source Details (if third-party)

        - **Original source URL:** https://unsplash.com/photos/[id]
        - **Original author:** Jane Photographer
        - **License:** Unsplash License (allows redistribution)
        - **Verification:** [Screenshot of license page]
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 09 — RIGHTS & LICENSING
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: license
    attributes:
      label: "⚖️ Wallpaper License"
      description: >
        Under which license are you releasing this wallpaper?
        **Only open licenses are accepted in the official library.**
        Wallpapers under proprietary/restrictive licenses may be listed
        in the community section with a download link only.
      options:
        - "🌟 CC0 1.0 Universal — Public Domain (most permissive, preferred)"
        - "✅ CC BY 4.0 — Attribution required"
        - "✅ CC BY-SA 4.0 — Attribution + ShareAlike (derivatives must be same license)"
        - "✅ Unsplash License — Permissive (allows redistribution)"
        - "✅ Pexels License — Permissive (allows redistribution)"
        - "✅ MIT — Permissive with attribution"
        - "⚠️ CC BY-NC 4.0 — Non-commercial only (community section only)"
        - "⚠️ CC BY-ND 4.0 — No derivatives (community section only)"
        - "❌ All Rights Reserved — Cannot be included (submit link only)"
        - "🤖 AI-generated — No copyright claim (CC0 equivalent)"
    validations:
      required: true

  - type: textarea
    id: rights_declaration
    attributes:
      label: "📜 Rights & Origin Declaration"
      description: >
        **Legally binding declaration.** False declarations will result in
        permanent ban from contributions and DMCA reporting if applicable.
      placeholder: |
        ## 🔏 I Declare That:

        ### Regarding Copyright
        - [x] I am the **original creator** of this wallpaper
        - [ ] I have explicit **written permission** from the copyright holder to redistribute
        - [ ] This work is in the **public domain** (pre-1928 or CC0 release)
        - [ ] This is **AI-generated** content with no copyright claimant

        ### Regarding Content
