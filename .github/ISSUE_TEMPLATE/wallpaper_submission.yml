  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: wallpaper_files
    attributes:
      label: "📸 Wallpaper Files & Previews"
      description: >
        **Upload your wallpapers here.** Drag and drop images directly,
        or provide download links to your wallpaper files.

        > ⚠️ GitHub issue uploads max out at 10MB. For larger files:
        > - Use GitHub Releases (preferred)
        > - Provide a Nextcloud/Mega/Dropbox link
        > - Submit via PR directly to the `wallpapers/` directory
      placeholder: |
        ## 🖼️ Full Resolution Wallpaper(s)

        <!-- PRIMARY WALLPAPER — Drag 4K/full-resolution file here -->
        ### Primary (4K / Highest Resolution)
