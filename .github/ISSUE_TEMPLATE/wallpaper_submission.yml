name: "🖼️ Wallpaper Submission"
description: >
  Submit wallpapers to the ASH Dotfiles wallpaper library!
  Whether you're a photographer, digital artist, or AI art creator —
  this form ensures your wallpaper meets our quality, rights, and
  technical standards for inclusion in the official collection.
title: "🖼️ [WALLPAPER] — "
labels:
  - "🖼️ wallpaper-submission"
  - "🔍 needs-review"
  - "✨ community-contribution"
assignees: []

