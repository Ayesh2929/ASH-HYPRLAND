        **Waybar module JSON:**
        ```jsonc
        // custom/obsidian-tasks
        "custom/obsidian-tasks": {
          "exec": "~/.local/share/ash/plugins/obsidian/waybar/module.sh",
          "interval": 60,
          "format": "📝 {} tasks",
          "format-alt": "📝 {alt}",
          "tooltip": true,
          "tooltip-format": "Due today: {due}\nOverdue: {overdue}\nCompleted: {done}",
          "return-type": "json",
          "on-click": "obsidian://open",
          "on-click-right": "bash ~/.local/share/ash/plugins/obsidian/rofi/quick-note.sh"
        }
        ```

        **Theme-aware CSS:**
        ```css
        #custom-obsidian-tasks {
          color: @accent-primary;
          background: @surface;
          border-radius: 8px;
          padding: 0 12px;
          margin: 4px 2px;
          transition: all 200ms ease;
        }

        #custom-obsidian-tasks.overdue {
          color: @accent-error;
          animation: pulse 2s infinite;
        }
        ```

        ## 🚀 Rofi Quick Capture UI

        ```
        ╔══════════════════════════════════════════════╗
        ║  📝 Quick Note → Obsidian Daily Note         ║
        ╠══════════════════════════════════════════════╣
        ║  > |                                         ║
        ╠══════════════════════════════════════════════╣
        ║  📅 2024-01-15 Daily Note                   ║
        ║  📁 Daily Notes/2024-01-15.md                ║
        ║  ⌨️  Enter to append • Esc to cancel          ║
        ╚══════════════════════════════════════════════╝
        ```

        ## 🔔 Notification Templates

        ```bash
        # Task reminder notification:
        notify-send \
          --app-name "Obsidian" \
          --icon "${ASH_PLUGIN_DIR}/assets/obsidian.svg" \
          --urgency normal \
          --expire-time 8000 \
          --hint string:x-ash-category:obsidian \
          "📝 Obsidian Reminder" \
          "3 tasks due today — Click to open Obsidian"

        # Quick note confirmation:
        notify-send \
          --app-name "Obsidian" \
          --urgency low \
          "✅ Note Added" \
          "Saved to $(date +%Y-%m-%d).md"
        ```

        ## ⚡ CLI Commands

        ```bash
        # Plugin-provided commands:
        ash obsidian status              # Connection + task summary
        ash obsidian note "quick text"   # Append quick note
        ash obsidian tasks               # List today's tasks
        ash obsidian tasks --overdue     # List overdue tasks
        ash obsidian open                # Launch Obsidian
        ash obsidian sync                # Force sync

        # Fish abbreviations:
        obs    → ash obsidian status
        obsn   → ash obsidian note
        obst   → ash obsidian tasks
        ```

        ## ⌨️ Suggested Keybinds

        ```bash
        # In hyprland keybinds (registered by plugin):
        bind = SUPER SHIFT, N, exec, ash obsidian note --rofi
        bind = SUPER SHIFT, O, exec, ash obsidian tasks --rofi
        bind = SUPER SHIFT, M, exec, obsidian://open
        ```
