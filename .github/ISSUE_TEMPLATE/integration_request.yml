  # SECTION 09 — IMPLEMENTATION COMPLEXITY
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: complexity
    attributes:
      label: "📊 Implementation Complexity Assessment"
      description: >
        Help the team understand the effort required for this integration.
      placeholder: |
        ## ⏱️ Estimated Implementation Effort

        | Phase | Effort | Description |
        |-------|--------|-------------|
        | Plugin scaffold | 0.5 days | `ash plugin create --type integration` |
        | REST API client | 1 day | Wrapper for Obsidian Local REST API |
        | Task fetching | 0.5 days | Parse tasks from API response |
        | Quick note append | 0.5 days | POST to daily note endpoint |
        | WebSocket listener | 1 day | Real-time event handling |
        | Waybar module | 0.5 days | JSON output + CSS styling |
        | Rofi quick-note | 0.5 days | Input UI + handler |
        | Mode sync | 1 day | Bidirectional mode state sync |
        | Tests | 1 day | Unit + integration tests |
        | Documentation | 0.5 days | README + guide |
        | **Total** | **7 days** | 1-2 week sprint |

        ## 🔗 External Dependencies

        | Dependency | Type | Already in ASH | Risk |
        |-----------|------|---------------|------|
        | curl | System | ✅ Yes | None |
        | jq | System | ✅ Yes | None |
        | websocat | System | ❌ New dep | Low — in most repos |
        | Obsidian Local REST API | Obsidian plugin | ❌ User installs | Low |

        ## ⚠️ Implementation Risks

        | Risk | Probability | Impact | Mitigation |
        |------|-------------|--------|-----------|
        | API breaks between Obsidian versions | Medium | High | Version lock + migration path |
        | WebSocket connection drops | Medium | Low | Auto-reconnect with backoff |
        | Daily note template varies by user | High | Medium | Configurable template format |
        | Obsidian not running | High | Low | Graceful degradation (hide widget) |
        | Large vaults slow queries | Medium | Medium | Query timeout + caching |

        ## 🔄 Maintenance Burden

        - **Ongoing maintenance:** Low — Obsidian API is stable
        - **Update frequency needed:** On major Obsidian releases only
        - **I am willing to maintain:** Yes, long-term
    validations:
      required: false

  # ════════════════════════════════════════════════════════════════════
  # SECTION 10 — ALTERNATIVES ANALYSIS
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: alternatives
    attributes:
      label: "🔄 Alternatives Analysis"
      description: >
        Why is this integration needed vs existing alternatives?
      placeholder: |
        ## Existing Solutions Evaluated

        ### Alternative 1: obsidian-cli (npm package)
        **URL:** https://github.com/julynervoso/obsidian-cli
        **Why insufficient:**
        - Requires Node.js runtime (heavy dependency)
        - Only supports note creation, not reading/tasks
        - Not maintained (last commit 3 years ago)
        - No Waybar/AGS widget support
        - No ASH mode sync

        ### Alternative 2: Direct file manipulation
        **Approach:** Read Obsidian vault `.md` files directly
        **Why insufficient:**
        - Bypasses Obsidian's internal state (sync conflicts)
        - Doesn't work with Obsidian Sync encrypted vaults
        - No real-time event awareness
        - Breaks with non-standard vault structures

        ### Alternative 3: rofi-obsidian (existing community plugin)
        **URL:** https://github.com/example/rofi-obsidian
        **Why insufficient:**
        - Only covers quick note capture, not task widget
        - Not integrated with ASH's mode/hook system
        - No theme awareness
        - Requires manual setup, not managed by `ash plugin`

        ## Why This Integration Is the Right Approach

        The Obsidian Local REST API (official community plugin) is:
        - ✅ Actively maintained by the plugin author
        - ✅ Officially endorsed by Obsidian (in their community plugins)
        - ✅ Stable API with version guarantees
        - ✅ Zero configuration on Obsidian's side beyond installing the plugin
        - ✅ Local only — perfect for privacy-conscious users
    validations:
      required: false

