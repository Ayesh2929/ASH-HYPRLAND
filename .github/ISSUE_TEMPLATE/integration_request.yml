  # ════════════════════════════════════════════════════════════════════
  # SECTION 04 — USE CASE & VALUE PROPOSITION
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: use_case
    attributes:
      label: "🎯 Use Case & Value Proposition"
      description: >
        Articulate exactly WHY this integration would make ASH better
        and HOW users would use it daily.
      placeholder: |
        ## 😤 Problem This Solves

        **Current pain point:**
        Obsidian users who use ASH Dotfiles currently have to alt-tab to Obsidian
        to capture quick notes, breaking their workflow entirely. There's no way to:
        - Quickly add a thought to today's daily note without switching focus
        - See upcoming tasks from Obsidian tasks plugin in the Waybar
        - Have ASH's focus mode sync with Obsidian's "Reading" mode
        - Get reminders from Obsidian's reminder plugin as system notifications

        ## 💡 Proposed User Experience

        **Quick capture workflow:**
        1. User presses `Super + Shift + N` (global hotkey)
        2. Rofi opens with a quick note input field
        3. User types note and presses Enter
        4. Note appears instantly in Obsidian's daily note under "## Quick Captures"
        5. Desktop notification confirms: "📝 Note added to Daily Note"

        **Waybar task count widget:**
        ```
        ┌─────────────────────────────────┐
        │  📝 3 tasks due today   [Obs]   │
        └─────────────────────────────────┘
        ```

        **Focus mode sync:**
        - `ash mode focus` → Obsidian switches to "Reading" mode automatically
        - Obsidian enters "Reading" mode → ASH enables Focus Mode automatically

        ## 📊 Daily Value Delivered

        | User Action | Without Integration | With Integration |
        |-------------|--------------------|--------------------|
        | Quick note capture | Alt-tab → type → alt-tab (30s) | Hotkey → type → Enter (5s) |
        | Check today's tasks | Alt-tab to Obsidian (10s) | Glance at Waybar (0s) |
        | Focus session | Manually set both apps (20s) | One command syncs both (1s) |

        **Net time saved per day (estimated):** 10-15 minutes

        ## 🌟 Why This Belongs in ASH (Not Standalone)

        This integration derives its value entirely from:
        1. ASH's mode system (focus mode sync)
        2. ASH's notification system (themed Obsidian alerts)
        3. ASH's Rofi framework (quick capture UI)
        4. ASH's keybind system (global hotkey registration)

        Without these hooks, it would be a much weaker standalone tool.
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 05 — TECHNICAL DESIGN
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: technical_design
    attributes:
      label: "🔧 Technical Integration Design"
      description: >
        Provide detailed technical design for how the integration would work.
        The more detailed, the better.
      placeholder: |
        ## 🏗️ Architecture Overview

        ```
        ┌─────────────────────────────────────────────────────────┐
        │                   ASH Desktop                           │
        │                                                         │
        │  ┌──────────────┐    ┌──────────────────────────────┐  │
        │  │ Waybar Widget│    │  Rofi Quick Capture Menu     │  │
        │  │ 📝 3 tasks   │    │  ┌────────────────────────┐  │  │
        │  │ due today    │    │  │ > Add quick note...    │  │  │
        │  └──────┬───────┘    │  └────────────────────────┘  │  │
        │         │            └────────────┬─────────────────┘  │
        │  ┌──────▼───────────────────────▼─────────────┐        │
        │  │        ASH Obsidian Integration Plugin       │        │
        │  │                                              │        │
        │  │  ┌─────────────┐  ┌──────────────────────┐  │        │
        │  │  │ REST Client │  │  WebSocket Listener  │  │        │
        │  │  │ (poll/push) │  │  (real-time events)  │  │        │
        │  │  └──────┬──────┘  └──────────┬───────────┘  │        │
        │  └─────────┼────────────────────┼──────────────┘        │
        └────────────┼────────────────────┼─────────────────────── ┘
                     │                    │
                     ▼                    ▼
        ┌────────────────────────────────────────┐
        │        Obsidian (Local App)             │
        │                                         │
        │  ┌─────────────────────────────────┐   │
        │  │  Obsidian Local REST API        │   │
        │  │  (obsidian-local-rest-api plugin)│   │
        │  │  Port: 27123 (configurable)     │   │
        │  └─────────────────────────────────┘   │
        └────────────────────────────────────────┘
        ```

        ## 📡 API Communication

        ### Authentication
        ```bash
        # Obsidian Local REST API uses API key authentication
        # Key stored in ASH secure store:
        ash config set --secret "plugin.obsidian.api_key" "Bearer xxxxxxxxxxxx"

        # NO external internet communication — local only!
        # API endpoint: http://localhost:27123 (user-configurable port)
        ```

        ### Data Fetch (Polling)
        ```bash
        # GET today's tasks (every 60 seconds):
        curl -s -H "Authorization: Bearer ${API_KEY}" \
          "http://localhost:27123/search/simple/?query=task%20due%20today" \
          | jq '.[] | select(.matches[] | .content | test("- \\[ \\]"))'

        # Response format:
        {
          "filename": "2024-01-15.md",
          "result": "...",
          "score": 0.9,
          "matches": [{"content": "- [ ] Review PR #123 📅 2024-01-15"}]
        }
        ```

        ### Quick Note Append
        ```bash
        # POST note to today's daily note:
        NOTE_CONTENT="$1"
        TODAY=$(date +%Y-%m-%d)

        curl -s -X POST \
          -H "Authorization: Bearer ${API_KEY}" \
          -H "Content-Type: text/markdown" \
          "http://localhost:27123/vault/${TODAY}.md" \
          --data "
        ## Quick Captures
        - $(date '+%H:%M') ${NOTE_CONTENT}" \
          | jq '.message'
        ```

        ### WebSocket Events (Real-time)
        ```bash
        # Listen for Obsidian events via WebSocket:
        # (Obsidian Local REST API supports WebSocket for push events)
        websocat "ws://localhost:27123/ws" \
          --header "Authorization: Bearer ${API_KEY}"

        # Events received:
        # {"event": "file:modified", "file": "2024-01-15.md"}
        # {"event": "mode:changed", "mode": "reading"}
        ```

        ## 🔌 Plugin Structure

        ```
        ash-plugin-obsidian/
        ├── plugin.json              ← Manifest
        ├── init.sh                  ← Setup + API key config
        ├── enable.sh                ← Start polling daemon
        ├── disable.sh               ← Stop daemon
        ├── status.sh                ← Connection status
        ├── lib/
        │   ├── api-client.sh        ← REST API wrapper
        │   ├── task-fetcher.sh      ← Task polling logic
        │   ├── note-appender.sh     ← Quick note append
        │   ├── websocket.sh         ← Real-time event listener
        │   └── mode-sync.sh         ← ASH mode ↔ Obsidian mode
        ├── waybar/
        │   ├── module.jsonc         ← Task count widget
        │   └── style.css            ← Themed widget styles
        └── rofi/
            ├── quick-note.rasi      ← Quick note input UI
            └── quick-note.sh        ← Note handler
        ```

        ## ⚙️ Configuration Schema

        ```json
        {
          "plugin.obsidian.api_url": "http://localhost:27123",
          "plugin.obsidian.api_key": "[stored in ASH secret store]",
          "plugin.obsidian.vault_path": "~/Documents/Obsidian/MyVault",
          "plugin.obsidian.daily_note_folder": "Daily Notes",
          "plugin.obsidian.daily_note_format": "YYYY-MM-DD",
          "plugin.obsidian.task_poll_interval": 60,
          "plugin.obsidian.quick_note_template": "- {time} {content}",
          "plugin.obsidian.mode_sync": true,
          "plugin.obsidian.waybar_enabled": true,
          "plugin.obsidian.waybar_max_tasks": 5,
          "plugin.obsidian.notifications_enabled": true
        }
        ```
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 06 — API & AUTHENTICATION DETAILS
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: api_details
    attributes:
      label: "🔑 API & Authentication Analysis"
      description: >
        Detailed analysis of the service's API capabilities and authentication.
        This is critical for security review and implementation planning.
      placeholder: |
        ## 📋 API Overview

        | Property | Details |
        |----------|---------|
        | API Type | REST + WebSocket |
        | API Version | v1 (stable) |
        | Documentation | https://codemirror.net/docs/ref/ |
        | SDKs available | Python, Node.js (unofficial) |
        | Rate limits | No limits (local app) |
        | Versioning policy | Stable since 2022, no breaking changes |
        | Pagination | Yes (offset-based) |
        | Webhooks | Yes (WebSocket push) |

        ## 🔑 Authentication

        ### Method Used
        - [ ] 🔑 API Key (Bearer token in header)
        - [ ] 🔐 OAuth 2.0 (authorization code flow)
        - [ ] 🔐 OAuth 2.0 (client credentials flow)
        - [ ] 📧 Username + Password (basic auth)
        - [ ] 🔒 mTLS (mutual TLS certificates)
        - [ ] 🚫 No authentication (local service)
        - [ ] 🔗 Session token / cookie

        ### Authentication Flow Design
        ```bash
        # First-time setup:
        ash plugin install obsidian

        # Guided setup wizard:
        ash plugin configure obsidian
        # > Enter Obsidian Local REST API key: [hidden input]
        # > Enter API port [27123]:
        # > Testing connection... ✅ Connected to Obsidian v1.5.3

        # Key storage (NEVER in plaintext config):
        ash::secrets::store "plugin.obsidian.api_key" "${API_KEY}"

        # Key retrieval at runtime:
        API_KEY="$(ash::secrets::get "plugin.obsidian.api_key")"
        ```

        ### Token Scope Requirements
        ```
        Required scopes (minimal privilege principle):
        - read:files     — Read vault files for task extraction
        - write:files    — Append to daily note files
        - read:metadata  — Access file metadata for change detection

        NOT required (will NOT request):
        - delete:files   — No deletion operations
        - manage:plugins — No plugin management
        - admin          — No admin operations
        ```

        ## 🌐 Network Communication

        | Aspect | Details |
        |--------|---------|
        | Communication type | Local only (localhost) |
        | External internet | ❌ Never |
        | Data sent externally | ❌ None |
        | Data sent locally | Note content, file paths |
        | Encryption | HTTP locally (TLS optional) |
        | Port required | 27123 (user-configurable) |

        ## 📦 Required Dependencies

        ```bash
        # System dependencies:
        - curl (already required by ASH)
        - jq (already required by ASH)
        - websocat (new dependency — for WebSocket support)

        # Installation:
        # Arch: pacman -S websocat
        # Others: cargo install websocat

        # The Obsidian plugin required on user side:
        # "Local REST API" by coddingtonbear (Obsidian community plugin)
        # Installation URL: obsidian://show-plugin?id=obsidian-local-rest-api
        ```
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 07 — PRIVACY & SECURITY ANALYSIS
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: privacy_security
    attributes:
      label: "🔒 Privacy & Security Analysis"
      description: >
        ALL integrations undergo security review. Complete this analysis
        to help the security team evaluate your proposal quickly.
      placeholder: |
        ## 🌐 Data Flow Analysis

        ### Data ASH Reads from Service
        | Data | Sensitivity | Purpose | Stored? |
        |------|-------------|---------|---------|
        | Note content | High | Display task count | No — never stored |
        | Task titles | Medium | Waybar widget | 60s cache only |
        | File metadata | Low | Change detection | No |
        | Mode status | Low | Mode sync | No |

        ### Data ASH Writes to Service
        | Data | Sensitivity | Purpose |
        |------|-------------|---------|
        | Quick note text | High (user content) | User explicitly types it |
        | Timestamp | Low | Note metadata |

        ### Data Sent to External Networks
        **NONE** — This integration is entirely local (localhost only).
        Zero external network communication.

        ## 🔐 Security Controls

        ### Credential Management
        - API keys stored in ASH secure store (encrypted at rest)
        - Keys NEVER written to config files, logs, or environment variables
        - Keys accessed via `ash::secrets::get()` — never passed as CLI args
        - Keys rotate-able without reinstalling the plugin

        ### Input Sanitization
        - Quick note content sanitized before API calls (no injection)
        - File paths validated and canonicalized (no path traversal)
        - JSON responses parsed with `jq` (no eval of responses)
        - API response size limited to prevent memory exhaustion

        ### Network Security
        - API URL validated at configuration time (must be localhost)
        - Rejects non-localhost URLs: `if [[ ! "${API_URL}" =~ localhost|127\. ]]`
        - TLS supported and recommended (user enables in Obsidian settings)
        - Connection timeout: 5 seconds (prevents hanging on unavailable service)

        ## 📜 Terms of Service Compliance

        ### Service ToS Review
        - [x] Reviewed Obsidian's Terms of Service
        - [x] Local REST API is an official community plugin (permitted use)
        - [x] No ToS violations — purely local integration
        - [x] No rate limit concerns (local, unlimited)

        ### Data Privacy
        - [x] No user data leaves the local machine
        - [x] GDPR compliant (data never leaves user's device)
        - [x] No analytics about note content
        - [x] User can disable at any time — full data control

        ## 🚨 Potential Security Concerns & Mitigations

        | Concern | Mitigation |
        |---------|-----------|
        | API key exposure in logs | Keys filtered from all log output |
        | SSRF via configurable URL | Strict localhost-only validation |
        | Note content in logs | Note content never logged |
        | Obsidian plugin malicious | User installs Obsidian plugin separately (their choice) |
        | Port conflict | Configurable port, conflict detection on startup |
    validations:
      required: true

