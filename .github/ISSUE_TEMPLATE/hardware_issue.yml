        ## Monitor Configuration

        ```bash
        # Run: hyprctl monitors
        Monitor eDP-1 (ID 0):
                2560x1600@165.00200 at 0x0
                description: BOE 0x0996 Unknown
                make: BOE
                model: 0x0996
                serial: (null)
                active workspace: 1 (1)
                special workspace: none
                reserved: 0 38 0 0
                scale: 1.50
                transform: 0
                focused: yes
                dpmsStatus: 1
                vrr: 0
                activelyTearing: false

        Monitor HDMI-A-1 (ID 1):
                3840x2160@60.00000 at 2560x0
                description: DELL U2720Q Unknown
                make: DELL
                model: U2720Q
                scale: 2.00
                vrr: 0
        ```

        ## Display Technology Details

        | Property | Monitor 1 (Internal) | Monitor 2 (External) |
        |----------|---------------------|---------------------|
        | Connection | eDP | HDMI 2.1 |
        | Resolution | 2560×1600 | 3840×2160 |
        | Refresh Rate | 165Hz | 60Hz |
        | Panel Type | IPS | IPS |
        | HDR Support | No | Yes (DisplayHDR 400) |
        | VRR/G-Sync | Yes (FreeSync) | No |
        | Scale Factor | 1.5x | 2.0x |
        | Color Depth | 10-bit | 10-bit |

        ## Hyprland Monitor Config
