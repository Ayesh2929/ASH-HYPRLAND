    attributes:
      label: "🔄 Exact Reproduction Steps"
      description: "Step-by-step instructions to reproduce the hardware issue"
      placeholder: |
        ## Hardware Setup Required
        - Dell XPS 15 9530 (or similar NVIDIA Optimus laptop)
        - External monitor connected via HDMI
        - NVIDIA driver 545.x installed
        - Hyprland running in hybrid GPU mode

        ## Reproduction Steps

        ```bash
        # Step 1: Boot system with HDMI monitor connected
        # Step 2: Verify NVIDIA driver is active
        nvidia-smi  # Should show RTX 3050

        # Step 3: Set environment (current config that causes tearing)
        cat ~/.config/environment.d/nvidia.conf
        # WLR_DRM_DEVICES=/dev/dri/card0
        # GBM_BACKEND=nvidia-drm
        # __GLX_VENDOR_LIBRARY_NAME=nvidia

        # Step 4: Start Hyprland
        # (SDDM auto-starts, or: Hyprland)

        # Step 5: Open any application on EXTERNAL HDMI monitor
        # Step 6: Move the window around OR scroll inside it
        # Step 7: Observe tearing on HDMI monitor (none on internal display)

        # Additional reproduction — video tearing:
        # Step 8: Open mpv and play any video on HDMI monitor
        mpv --vo=gpu ~/Videos/test.mp4
        # Result: Severe horizontal tearing on every frame
        ```

        ## Bisection Results (if applicable)

        ```bash
        # Last working configuration (no tearing):
        # Hyprland v0.34.0 with nvidia driver 535.x
        # (This changed in v0.35.0 or nvidia 545.x — not sure which)

        # Confirmed broken on:
        # Hyprland v0.35.0 + nvidia 545.x
        # Hyprland v0.36.0 + nvidia 545.x
        ```
    validations:
      required: true

