        ╚═╝╚══════╝╚══════╝ ╚═════╝ ╚══════╝
        ```

        # 🖥️ Hardware Issue — ASH Dotfiles v5.0 OMEGA

        > *"Every piece of hardware deserves a flawless desktop experience"*

        </div>

        ---

        > [!IMPORTANT]
        > **Hardware issues require detailed diagnostic data to reproduce and fix.**
        > Please run ALL diagnostic commands listed in each section.
        > Reports with incomplete hardware data take **3-5x longer** to resolve.

        > [!TIP]
        > **Instant hardware diagnostics:**
        > ```bash
        > # Full hardware report — generates everything we need:
        > ash hw full-report --output ~/ash-hardware-report.txt
        > cat ~/ash-hardware-report.txt
        >
        > # GPU-specific diagnostics:
        > ash hw gpu --verbose
        >
        > # Display diagnostics:
        > ash hw monitor --verbose
        >
        > # Full system doctor with hardware checks:
        > ash doctor --full --hardware
        > ```

        ---

        ### 🖥️ Hardware Issue Pre-Flight Checklist

        **Before submitting — verify these first:**
        - [ ] 🔄 Updated GPU drivers to latest stable version
        - [ ] 🔄 Updated Hyprland to latest version (`ash update --hyprland`)
        - [ ] 🩺 Ran `ash doctor --full --hardware` and reviewed output
        - [ ] 🔍 Searched [existing hardware issues](https://github.com/ash-dotfiles/ash-dotfiles/issues?q=label%3A%22hardware%22)
        - [ ] 📖 Checked [hardware-specific guides](https://ash-dotfiles.github.io/docs/guides) for your GPU brand
        - [ ] 💬 Searched [Discord #hardware-help](https://discord.gg/ash-dotfiles) for similar reports

        ---

  # ════════════════════════════════════════════════════════════════════
  # SECTION 02 — HARDWARE CATEGORY
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: hardware_category
    attributes:
      label: "🎯 Hardware Issue Category"
      description: "Primary hardware category affected"
      multiple: true
      options:
        # GPU & Display
        - "🎮 GPU — NVIDIA rendering / artifacts / crashes"
        - "🎮 GPU — AMD rendering / artifacts / crashes"
        - "🎮 GPU — Intel integrated graphics issues"
        - "🎮 GPU — Hybrid graphics (NVIDIA Optimus / AMD MUX)"
        - "🎮 GPU — Vulkan / OpenGL compatibility"
        - "🎮 GPU — Hardware video acceleration (VA-API / NVENC)"
        - "🎮 GPU — Multi-GPU configuration"
        - "🖥️ Display — Monitor not detected"
        - "🖥️ Display — Wrong resolution / refresh rate"
        - "🖥️ Display — HDR / high bit depth issues"
        - "🖥️ Display — Variable refresh rate (VRR/G-Sync/FreeSync)"
        - "🖥️ Display — Multi-monitor layout problems"
        - "🖥️ Display — Fractional scaling issues"
        - "🖥️ Display — Color calibration / ICC profiles"
        - "🖥️ Display — Overscan / underscan"
        - "🖥️ Display — Flickering / screen tearing"
        - "🖥️ Display — Cursor rendering issues"
        # Audio
        - "🔊 Audio — No sound output"
        - "🔊 Audio — Wrong audio device selected"
        - "🔊 Audio — Crackling / popping / distortion"
        - "🔊 Audio — HDMI / DisplayPort audio"
        - "🔊 Audio — Bluetooth audio issues"
        - "🔊 Audio — Microphone not working"
        - "🔊 Audio — USB audio device"
        - "🔊 Audio — PipeWire / PulseAudio conflict"
        # Input
        - "⌨️ Input — Keyboard not working / wrong layout"
        - "🖱️ Input — Mouse / trackpad issues"
        - "🖱️ Input — Trackpad gestures not working"
        - "🎮 Input — Game controller / gamepad"
        - "✏️ Input — Drawing tablet / stylus"
        - "👆 Input — Touchscreen"
        - "📱 Input — Virtual keyboard"
        # Power & Thermal
        - "🔋 Battery — Wrong battery percentage / not detected"
        - "🔋 Battery — Rapid discharge / power management"
        - "🌡️ Thermal — CPU/GPU overheating"
        - "🌡️ Thermal — Thermal throttling affecting performance"
        - "⚡ Power — Suspend / resume issues"
        - "⚡ Power — Hibernate not working"
        - "⚡ Power — Power button behavior"
        - "⚡ Power — Lid close action (laptop)"
        # Peripherals
        - "📷 Camera — Webcam not detected / distorted"
        - "🖨️ Printer — Printing issues"
        - "📡 WiFi — WiFi not connecting / slow"
        - "🔵 Bluetooth — Bluetooth not working"
        - "🔌 USB — USB device not recognized"
        - "💾 Storage — NVMe / SSD issues"
        - "💾 Storage — External drive not mounting"
        - "📺 Dock / Hub — Docking station issues"
        - "🖥️ eGPU — External GPU issues"
        # Form Factor
        - "💻 Laptop — Specific laptop model issue"
        - "🖥️ Desktop — Specific desktop configuration"
        - "🖥️ All-in-One — AIO specific issues"
        - "🎮 Mini PC — Compact form factor"
        - "🖥️ Server / Workstation — Server hardware"
        # Other
