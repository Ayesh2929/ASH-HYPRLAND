            32. WirePlumber [export]                 [pipewire-1.0.2]
            ...
        ```

        ## Audio Devices

        ```bash
        # All audio sinks:
        $ wpctl status | grep -A 50 "Sinks:"
        Audio
         ├─ Devices:
         │   12. NVIDIA High Definition Audio       [alsa]
