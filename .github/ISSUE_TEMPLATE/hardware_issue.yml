name: "🖥️ Hardware Issue"
description: >
  Experiencing hardware-specific problems with ASH Dotfiles?
  GPU rendering glitches, display issues, audio problems, input device
  failures, thermal throttling, or peripheral incompatibilities —
  report them here with our comprehensive hardware diagnostic form.
title: "🖥️ [HARDWARE] — "
labels:
  - "🖥️ hardware"
  - "🔍 needs-triage"
  - "🔬 needs-hardware-info"
assignees: []

body:
  # ════════════════════════════════════════════════════════════════════
  # SECTION 01 — HERO BANNER
  # ════════════════════════════════════════════════════════════════════
  - type: markdown
    attributes:
      value: |
        <div align="center">

        ```
