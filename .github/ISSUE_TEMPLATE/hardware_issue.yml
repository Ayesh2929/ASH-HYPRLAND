  # ════════════════════════════════════════════════════════════════════
  # SECTION 14 — WORKAROUNDS ATTEMPTED
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: workarounds
    attributes:
      label: "🔧 Workarounds Attempted"
      description: >
        Document everything you've tried. This prevents duplicate suggestions
        and often reveals important clues about the root cause.
      placeholder: |
        ## ✅ Partially Working Workarounds

        ### Workaround 1: Force NVIDIA GPU for all rendering
        ```bash
        # Set WLR_DRM_DEVICES to NVIDIA card only
        echo 'WLR_DRM_DEVICES=/dev/dri/card1' >> ~/.config/environment.d/nvidia.conf
        # Result: HDMI tearing FIXED ✅ but internal display broken ❌
        ```

        ### Workaround 2: Disable hardware cursors
        ```bash
        echo 'WLR_NO_HARDWARE_CURSORS=1' >> ~/.config/environment.d/nvidia.conf
        # Result: No change to tearing ❌ (but cursor was flickering before)
        ```

        ### Workaround 3: Force lower refresh rate
        ```bash
        hyprctl keyword monitor HDMI-A-1,3840x2160@30,2560x0,2.0
        # Result: Tearing reduced significantly at 30Hz ⚠️ but unacceptable smoothness
        ```

        ## ❌ Failed Workarounds

        | Attempt | Expected Result | Actual Result |
        |---------|----------------|---------------|
        | `explicit_sync = 1` in render.conf | Fix sync issues | No change |
        | `nvidia_anti_flicker = true` | Reduce flickering | No change |
        | `direct_scanout = true` | Better performance | Made tearing worse |
        | `NVreg_UsePageAttributeTable=1` | Better memory | No change |
        | Hyprland `--no-vt-switch` flag | Different issue | No change |
        | Downgrade to NVIDIA 535.x | Older driver might work | Tearing still present |
        | `vfr = false` in misc | Disable variable FR | Slightly better, not fixed |

        ## 🔍 Key Observations from Testing

        1. The issue ONLY occurs with dual-GPU (hybrid) + external HDMI
        2. Single-GPU mode (one or the other) doesn't have this issue
        3. Setting `WLR_DRM_DEVICES` to both cards creates a different issue
        4. The problem appears to be in the frame buffer handoff between GPUs
    validations:
      required: false

