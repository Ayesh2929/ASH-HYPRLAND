        ███████║███████║██████╔╝██║  ██║██║ █╗ ██║███████║██████╔╝█████╗
        ██╔══██║██╔══██║██╔══██╗██║  ██║██║███╗██║██╔══██║██╔══██╗██╔══╝
        ██║  ██║██║  ██║██║  ██║██████╔╝╚███╔███╔╝██║  ██║██║  ██║███████╗
        ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝╚═════╝  ╚══╝╚══╝ ╚═╝  ╚═╝╚═╝  ╚═╝╚══════╝

        ██╗███████╗███████╗██╗   ██╗███████╗
        ██║██╔════╝██╔════╝██║   ██║██╔════╝
        ██║███████╗███████╗██║   ██║█████╗
        ██║╚════██║╚════██║██║   ██║██╔══╝
