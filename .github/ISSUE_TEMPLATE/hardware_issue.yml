  # ════════════════════════════════════════════════════════════════════
  # SECTION 08 — PROBLEM DESCRIPTION
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: problem_description
    attributes:
      label: "📋 Detailed Problem Description"
      description: >
        Describe the hardware issue with as much technical precision as possible.
        Include what you see, what you expect, and when it occurs.
      placeholder: |
        ## 🔴 What Is Happening

        **Summary:** On my Dell XPS 15 9530 with NVIDIA RTX 3050 + Intel Iris Xe
        hybrid graphics, Hyprland shows severe screen tearing on the external 4K
        HDMI monitor at 60Hz while the internal display renders perfectly.

        **Visual Description:**
        - Horizontal tearing lines appear in the bottom 1/3 of the external monitor
        - Tearing is most visible during window animations and scrolling
        - Tearing does NOT occur on the laptop's internal eDP display
        - Tearing does NOT occur when running GNOME or KDE on Wayland

        **When It Occurs:**
        - [x] Constantly (every frame has artifacts)
        - [ ] Intermittently (approximately ___% of the time)
        - [ ] Only under specific conditions (see below)
        - [ ] Only after system has been running for X minutes

        **Specific Conditions Triggering the Issue:**
        The tearing is worse when:
        1. Moving windows across the HDMI monitor (animation = severe tearing)
        2. Scrolling in Firefox on HDMI monitor (smooth scroll = tearing pattern)
        3. Playing video fullscreen on HDMI (constantly torn frames)

        ## ✅ Expected Behavior

        All monitors should render tear-free under Wayland compositing.
        Hyprland's compositor should eliminate screen tearing via vsync by design.
        This works correctly on the internal display and on pure Intel/AMD systems.

        ## 🔍 Root Cause Hypothesis

        I believe the issue is with the HDMI output being routed through the NVIDIA
        dGPU while Hyprland uses the Intel iGPU for rendering. The frame handoff
        between the two GPUs on this hybrid Optimus laptop causes synchronization
        issues that manifest as tearing on the HDMI output.

        Supporting evidence:
        - `WLR_DRM_DEVICES=/dev/dri/card0` (Intel) → tearing on HDMI
        - `WLR_DRM_DEVICES=/dev/dri/card1` (NVIDIA) → HDMI works but internal screen broken
        - No tearing in single-GPU desktop configurations
    validations:
      required: true

