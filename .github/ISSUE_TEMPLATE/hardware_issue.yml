  # ════════════════════════════════════════════════════════════════════
  # SECTION 03 — HARDWARE SEVERITY
  # ════════════════════════════════════════════════════════════════════
  - type: dropdown
    id: severity
    attributes:
      label: "🚨 Issue Severity"
      description: "How severely does this hardware issue impact your ASH desktop experience?"
      options:
        - "🔴 CRITICAL — System crashes / data loss / hardware damage risk"
        - "🟠 HIGH — Desktop unusable / major feature completely broken"
        - "🟡 MEDIUM — Significant impact but workaround exists"
        - "🟢 LOW — Minor visual artifact / edge case / occasional glitch"
        - "💡 ENHANCEMENT — Hardware works but could be better optimized"
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 04 — GPU DEEP DIAGNOSTICS
  # ════════════════════════════════════════════════════════════════════
  - type: textarea
    id: gpu_diagnostics
    attributes:
      label: "🎮 GPU Diagnostics (CRITICAL — Fill Even if GPU Seems OK)"
      description: >
        GPU information is essential for ALL Hyprland-related issues.
        Run `ash hw gpu --verbose` or fill manually.
      placeholder: |
        ## GPU Hardware Identification

        ```bash
        # Run: lspci -k | grep -A3 -E "VGA|3D|Display"
        00:02.0 VGA compatible controller: Intel Corporation Alder Lake-P GT2 [Iris Xe Graphics] (rev 0c)
                Subsystem: Dell Iris Xe Graphics
                Kernel driver in use: i915
                Kernel modules: i915

        01:00.0 3D controller: NVIDIA Corporation GA107M [GeForce RTX 3050 Mobile] (rev a1)
                Subsystem: Dell GeForce RTX 3050 Mobile
                Kernel driver in use: nvidia
                Kernel modules: nvidia, nouveau
        ```

        ## GPU Driver Information

        ### NVIDIA (if applicable)
        ```bash
        # Run: nvidia-smi --query-gpu=name,driver_version,memory.total,compute_mode --format=csv
        name, driver_version, memory.total [MiB], compute_mode
        NVIDIA GeForce RTX 3050, 545.29.06, 4096 MiB, Default

        # Driver type:
        # [ ] nvidia (proprietary closed-source)
        # [ ] nvidia-open (open-source kernel module)
        # [ ] nouveau (reverse-engineered open source — NOT recommended for Hyprland)

        # NVIDIA DRM kernel module loaded:
        $ cat /sys/module/nvidia_drm/parameters/modeset
        Y  # Must be Y for Wayland to work

        # NVIDIA framebuffer:
        $ cat /sys/module/nvidia_drm/parameters/fbdev
        1  # Must be 1 for proper Wayland support
        ```

        ### AMD (if applicable)
        ```bash
        # Run: lspci -k | grep -A3 "AMD\|Radeon"
        # AMD GPU driver info:
        $ glxinfo | grep -E "vendor|renderer|version" | head -6
        server glx vendor string: SGI
        server glx version string: 1.4
        client glx vendor string: Mesa Project and SGI
        OpenGL vendor string: AMD
        OpenGL renderer string: AMD Radeon RX 7900 XTX (radeonsi, navi31, LLVM 16.0.6, DRM 3.54)
        OpenGL version string: 4.6 (Compatibility Profile) Mesa 23.3.3

        # AMDGPU firmware version:
        $ cat /sys/kernel/debug/dri/0/amdgpu_firmware_info 2>/dev/null | head -10

        # ROCm (if installed):
        $ rocminfo 2>/dev/null | grep -E "Name:|gfx" | head -5
        ```

        ### Intel (if applicable)
        ```bash
        # Run: glxinfo | grep -E "vendor|renderer|version" | head -6
        OpenGL vendor string: Intel
        OpenGL renderer string: Mesa Intel(R) Xe Graphics (TGL GT2)
        OpenGL version string: 4.6 (Compatibility Profile) Mesa 23.3.3

        # Intel GPU version:
        $ intel_gpu_top -J -s 100 2>/dev/null | head -20
        ```

        ## Vulkan Support
        ```bash
        # Run: vulkaninfo --summary 2>/dev/null | head -30
        VULKAN INFO
        ===========
        Vulkan Instance Version: 1.3.268

        Instance Extensions: count = 23
        Instance Layers: count = 8

        Devices:
        GPU0:
          apiVersion         = 1.3.268
          driverVersion      = 545.29.6.0
          vendorID           = 0x10de
          deviceID           = 0x25a5
          deviceType         = PHYSICAL_DEVICE_TYPE_DISCRETE_GPU
          deviceName         = NVIDIA GeForce RTX 3050
          driverID           = DRIVER_ID_NVIDIA_PROPRIETARY
          driverName         = NVIDIA
          driverInfo         = 545.29.06
        ```

        ## OpenGL / DRM Information
        ```bash
        # DRM devices:
        $ ls /dev/dri/
        by-path  card0  card1  renderD128  renderD129

        # Wayland DRM device:
        $ echo $WLR_DRM_DEVICES
        /dev/dri/card1  # Should point to your primary GPU

        # DRM version:
        $ cat /sys/class/drm/card*/device/driver/module/version 2>/dev/null
        ```

        ## Environment Variables Set for GPU
        ```bash
        $ env | grep -E "WLR_|NVIDIA|__GL|__VK|DRI|LIBVA|VDPAU|MESA|GBM" | sort
        WLR_NO_HARDWARE_CURSORS=1
        WLR_DRM_DEVICES=/dev/dri/card1
        LIBVA_DRIVER_NAME=nvidia
        __GLX_VENDOR_LIBRARY_NAME=nvidia
        GBM_BACKEND=nvidia-drm
        ```
    validations:
      required: true

  # ════════════════════════════════════════════════════════════════════
  # SECTION 05 — DISPLAY DIAGNOSTICS
