        # Your monitor configuration in hyprland.conf:
        $ cat ~/.config/hypr/monitors.conf
        monitor=eDP-1,2560x1600@165,0x0,1.5
        monitor=HDMI-A-1,3840x2160@60,2560x0,2.0

        # Hyprland rendering info:
        $ hyprctl version
        Hyprland v0.36.0 (compiled with aquamarine 0.3.0)
        Tag: v0.36.0, commits: 0

        # Active rendering backend:
        $ cat ~/.config/hypr/env.conf | grep -E "WLR_|RENDERER"
        ```

        ## Display Issue Specifics

        ```bash
        # If display not detected:
        $ wlr-randr --list 2>/dev/null || echo "wlr-randr not available"

        # EDID information:
        $ for f in /sys/class/drm/*/edid; do
            echo "=== $(dirname $f | xargs basename) ==="
            edid-decode "$f" 2>/dev/null | head -20
          done

