<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 3840 2160"
  width="3840"
  height="2160"
  shape-rendering="geometricPrecision"
  text-rendering="optimizeLegibility"
>
  <defs>

    <!-- ═══════════════════════════════════════════════
         CATPPUCCIN LATTE PALETTE
    ═══════════════════════════════════════════════ -->
    <style>
      :root {
        --rosewater: #dc8a78;
        --flamingo:  #dd7878;
        --pink:      #ea76cb;
        --mauve:     #8839ef;
        --red:       #d20f39;
        --maroon:    #e64553;
        --peach:     #fe640b;
        --yellow:    #df8e1d;
        --green:     #40a02b;
        --teal:      #179299;
        --sky:       #04a5e5;
        --sapphire:  #209fb5;
        --blue:      #1e66f5;
        --lavender:  #7287fd;
        --text:      #4c4f69;
        --subtext1:  #5c5f77;
        --subtext0:  #6c6f85;
        --overlay2:  #7c7f93;
        --overlay1:  #8c8fa1;
        --overlay0:  #9ca0b0;
        --surface2:  #acb0be;
        --surface1:  #bcc0cc;
        --surface0:  #ccd0da;
        --base:      #eff1f5;
        --mantle:    #e6e9ef;
        --crust:     #dce0e8;
      }
    </style>

    <!-- Background gradient - soft paper -->
    <radialGradient id="bgLight" cx="50%" cy="40%" r="80%">
      <stop offset="0%"   stop-color="#f5f7ff"/>
      <stop offset="35%"  stop-color="#eff1f5"/>
      <stop offset="70%"  stop-color="#e8eaf2"/>
      <stop offset="100%" stop-color="#dce0e8"/>
    </radialGradient>

    <!-- Sun glow upper center -->
    <radialGradient id="sunGlow" cx="50%" cy="20%" r="60%">
      <stop offset="0%"   stop-color="#df8e1d" stop-opacity="0.12"/>
      <stop offset="40%"  stop-color="#fe640b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#eff1f5" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft color washes -->
    <radialGradient id="wash1" cx="15%" cy="25%" r="45%">
      <stop offset="0%"   stop-color="#7287fd" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#eff1f5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash2" cx="85%" cy="75%" r="45%">
      <stop offset="0%"   stop-color="#8839ef" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#eff1f5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash3" cx="75%" cy="20%" r="40%">
      <stop offset="0%"   stop-color="#04a5e5" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#eff1f5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash4" cx="20%" cy="80%" r="35%">
      <stop offset="0%"   stop-color="#ea76cb" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#eff1f5" stop-opacity="0"/>
    </radialGradient>

    <!-- Ring gradients light -->
    <radialGradient id="ringL1" cx="50%" cy="50%" r="50%">
      <stop offset="86%"  stop-color="#7287fd" stop-opacity="0"/>
      <stop offset="92%"  stop-color="#7287fd" stop-opacity="0.35"/>
      <stop offset="96%"  stop-color="#8839ef" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8839ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringL2" cx="50%" cy="50%" r="50%">
      <stop offset="88%"  stop-color="#04a5e5" stop-opacity="0"/>
      <stop offset="93%"  stop-color="#04a5e5" stop-opacity="0.25"/>
      <stop offset="97%"  stop-color="#209fb5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#209fb5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringL3" cx="50%" cy="50%" r="50%">
      <stop offset="90%"  stop-color="#ea76cb" stop-opacity="0"/>
      <stop offset="95%"  stop-color="#ea76cb" stop-opacity="0.15"/>
      <stop offset="98%"  stop-color="#7287fd" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7287fd" stop-opacity="0"/>
    </radialGradient>

    <!-- Core light glow -->
    <radialGradient id="coreLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7287fd" stop-opacity="0.22"/>
      <stop offset="40%"  stop-color="#04a5e5" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#eff1f5" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo gradient light -->
    <linearGradient id="logoLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#8839ef"/>
      <stop offset="35%"  stop-color="#7287fd"/>
      <stop offset="65%"  stop-color="#04a5e5"/>
      <stop offset="100%" stop-color="#1e66f5"/>
    </linearGradient>

    <!-- Paper texture pattern -->
    <pattern id="paperDots" x="0" y="0" width="28" height="28"
             patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.7" fill="#acb0be" opacity="0.35"/>
    </pattern>

    <!-- Fine grid light -->
    <pattern id="gridLight" x="0" y="0" width="60" height="60"
             patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none"
            stroke="#ccd0da" stroke-width="0.5" opacity="0.5"/>
    </pattern>

    <!-- Watercolor hex -->
    <pattern id="hexLight" x="0" y="0" width="80" height="92.4"
             patternUnits="userSpaceOnUse">
      <polygon points="40,2 78,23 78,69 40,90 2,69 2,23"
               fill="none" stroke="#bcc0cc" stroke-width="0.7" opacity="0.4"/>
      <polygon points="0,46 38,67 38,113 0,134 -38,113 -38,67"
               fill="none" stroke="#bcc0cc" stroke-width="0.7" opacity="0.4"/>
    </pattern>

    <!-- Blur filters -->
    <filter id="blurL4"  x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blurL8"  x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blurL16" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blurL32" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="blurL64" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>

    <!-- Drop shadow for shapes -->
    <filter id="shadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8"
                    flood-color="#4c4f69" flood-opacity="0.08"/>
    </filter>
    <filter id="glowLight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip paths -->
    <clipPath id="screenClipL">
      <rect width="3840" height="2160"/>
    </clipPath>

    <!-- Star symbol -->
    <symbol id="starL" viewBox="-10 -10 20 20">
      <path d="M0,-10 L2,-2 L10,0 L2,2 L0,10 L-2,2 L-10,0 L-2,-2 Z"
            fill="currentColor"/>
    </symbol>

    <!-- ASH mark symbol light -->
    <symbol id="ashMarkL" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="56" fill="none"
              stroke="url(#logoLight)" stroke-width="2.5" opacity="0.85"/>
      <circle cx="60" cy="60" r="40" fill="none"
              stroke="#7287fd" stroke-width="1.2" opacity="0.45"/>
      <path d="M35,88 L60,32 L85,88 M43,70 L77,70"
            fill="none" stroke="url(#logoLight)" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Vignette light -->
    <radialGradient id="vignetteL" cx="50%" cy="50%" r="70%">
      <stop offset="45%"  stop-color="#dce0e8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#dce0e8" stop-opacity="0.55"/>
    </radialGradient>

  </defs>

  <g clip-path="url(#screenClipL)">

    <!-- ═══════════════════════════════════════════════════════
         LAYER 1 — PAPER BACKGROUND
    ═══════════════════════════════════════════════════════ -->
    <rect width="3840" height="2160" fill="url(#bgLight)"/>

    <!-- ═══════════════════════════════════════════════════════
         LAYER 2 — ATMOSPHERIC WASHES
    ═══════════════════════════════════════════════════════ -->
    <ellipse cx="576"  cy="540"  rx="1400" ry="1000"
             fill="url(#wash1)" filter="url(#blurL64)"/>
    <ellipse cx="3264" cy="1620" rx="1300" ry="950"
             fill="url(#wash2)" filter="url(#blurL64)"/>
    <ellipse cx="2880" cy="432"  rx="900"  ry="700"
             fill="url(#wash3)" filter="url(#blurL64)"/>
    <ellipse cx="576"  cy="1728" rx="800"  ry="600"
             fill="url(#wash4)" filter="url(#blurL64)"/>
    <!-- Sun glow top center -->
    <ellipse cx="1920" cy="300" rx="1200" ry="600"
             fill="url(#sunGlow)" filter="url(#blurL64)"/>

    <!-- ═══════════════════════════════════════════════════════
         LAYER 3 — PAPER DOT TEXTURE
    ═══════════════════════════════════════════════════════ -->
    <rect width="3840" height="2160"
          fill="url(#paperDots)" opacity="0.40"/>

    <!-- ═══════════════════════════════════════════════════════
         LAYER 4 — HEX GRID
    ═══════════════════════════════════════════════════════ -->
    <rect width="3840" height="2160"
          fill="url(#hexLight)" opacity="0.22"/>

    <!-- ═══════════════════════════════════════════════════════
         LAYER 5 — HORIZONTAL WAVE LINES
    ═══════════════════════════════════════════════════════ -->
    <g opacity="0.12">
      <!-- Gentle wave using paths -->
      <path d="M0,700 C480,680 960,720 1440,700 C1920,680 2400,720 2880,700 C3360,680 3840,720 3840,700 L3840,730 C3360,750 2880,710 2400,730 C1920,750 1440,710 960,730 C480,750 0,730 0,730 Z"
            fill="#7287fd" opacity="0.15"/>
      <path d="M0,900 C600,885 1200,915 1800,900 C2400,885 3000,915 3600,900 C3720,895 3840,900 3840,900 L3840,916 C3240,931 2640,901 2040,916 C1440,931 840,901 240,916 C160,918 0,916 0,916 Z"
            fill="#04a5e5" opacity="0.12"/>
      <path d="M0,1100 C400,1090 800,1110 1200,1100 C1600,1090 2000,1110 2400,1100 C2800,1090 3200,1110 3600,1100 L3840,1100 L3840,1112 C3400,1122 3000,1102 2600,1112 C2200,1122 1800,1102 1400,1112 C1000,1122 600,1102 200,1112 L0,1112 Z"
            fill="#8839ef" opacity="0.08"/>
    </g>

    <!-- ═══════════════════════════════════════════════════════
         LAYER 6 — CONCENTRIC RINGS
    ═══════════════════════════════════════════════════════ -->
    <g transform="translate(1920, 1000)">

      <!-- Outer ring glow -->
      <circle cx="0" cy="0" r="820" fill="url(#ringL3)"
              filter="url(#blurL8)" opacity="0.5"/>

      <!-- Ring 3 -->
      <circle cx="0" cy="0" r="750"
              fill="none" stroke="#ea76cb" stroke-width="0.7"
              stroke-dasharray="10,18" opacity="0.22"
              filter="url(#blurL4)"/>

      <!-- Ring 2 glow -->
      <circle cx="0" cy="0" r="580" fill="url(#ringL2)"
              filter="url(#blurL8)" opacity="0.55"/>

      <!-- Ring 2 -->
      <circle cx="0" cy="0" r="520"
              fill="none" stroke="#04a5e5" stroke-width="1"
              stroke-dasharray="24,14" opacity="0.28"
              filter="url(#blurL4)"/>
      <circle cx="0" cy="0" r="538"
              fill="none" stroke="#04a5e5" stroke-width="0.4"
              opacity="0.14"/>

      <!-- Ring 1 glow -->
      <circle cx="0" cy="0" r="380" fill="url(#ringL1)"
              filter="url(#blurL16)" opacity="0.65"/>

      <!-- Ring 1 -->
      <circle cx="0" cy="0" r="320"
              fill="none" stroke="#7287fd" stroke-width="1.5"
              stroke-dasharray="44,10" opacity="0.40"
              filter="url(#blurL4)"/>
      <circle cx="0" cy="0" r="338"
              fill="none" stroke="#8839ef" stroke-width="0.4"
              opacity="0.18"/>

      <!-- Core glow -->
      <circle cx="0" cy="0" r="200" fill="url(#coreLight)"
              filter="url(#blurL32)" opacity="0.75"/>

      <!-- Inner ring -->
      <circle cx="0" cy="0" r="140"
              fill="none" stroke="#7287fd" stroke-width="2"
              opacity="0.30"/>
      <circle cx="0" cy="0" r="142"
              fill="none" stroke="#8839ef" stroke-width="0.5"
              opacity="0.12"/>

      <!-- Tick marks -->
      <g stroke="#7287fd" stroke-width="1.5" opacity="0.45">
        <g transform="rotate(0)">  <line x1="140" y1="0" x2="155" y2="0"/></g>
        <g transform="rotate(30)"> <line x1="140" y1="0" x2="148" y2="0"/></g>
        <g transform="rotate(60)"> <line x1="140" y1="0" x2="148" y2="0"/></g>
        <g transform="rotate(90)"> <line x1="140" y1="0" x2="155" y2="0"/></g>
        <g transform="rotate(120)"><line x1="140" y1="0" x2="148" y2="0"/></g>
        <g transform="rotate(150)"><line x1="140" y1="0" x2="148" y2="0"/></g>
        <g transform="rotate(180)"><line x1="140" y1="0" x2="155" y2="0"/></g>
        <g transform="rotate(210)"><line x1="140" y1="0" x2="148" y2="0"/></g>
        <g transform="rotate(240)"><line x1="140" y1="0" x2="148" y2="0"/></g>
        <g transform="rotate(270)"><line x1="140" y1="0" x2="155" y2="0"/></g>
        <g transform="rotate(300)"><line x1="140" y1="0" x2="148" y2="0"/></g>
        <g transform="rotate(330)"><line x1="140" y1="0" x2="148" y2="0"/></g>
      </g>

      <!-- Cross hair -->
      <g stroke="#7287fd" stroke-width="0.5" opacity="0.10">
        <line x1="-820" y1="0" x2="820" y2="0"/>
        <line x1="0" y1="-820" x2="0" y2="820"/>
      </g>

    </g>

    <!-- ═══════════════════════════════════════════════════════
         LAYER 7 — ASH LOGO MARK
    ═══════════════════════════════════════════════════════ -->
    <g transform="translate(1920, 1000)" filter="url(#glowLight)">
      <use href="#ashMarkL" x="-60" y="-60" width="120" height="120"/>
    </g>

    <!-- ═══════════════════════════════════════════════════════
         LAYER 8 — FLOATING SHAPES (LIGHT / PAPER STYLE)
    ═══════════════════════════════════════════════════════ -->

    <!-- Cards / panels floating -->
    <g filter="url(#shadowLight)">
      <!-- Top left panel -->
      <rect x="120" y="120" width="280" height="180" rx="16"
            fill="#eff1f5" fill-opacity="0.85" stroke="#ccd0da"
            stroke-width="1.5"/>
      <!-- Color dots inside panel -->
      <circle cx="160" cy="160" r="12" fill="#8839ef" opacity="0.7"/>
      <circle cx="192" cy="160" r="12" fill="#7287fd" opacity="0.7"/>
      <circle cx="224" cy="160" r="12" fill="#04a5e5" opacity="0.7"/>
      <!-- Fake content lines -->
      <rect x="140" y="190" width="180" height="6" rx="3"
            fill="#acb0be" opacity="0.6"/>
      <rect x="140" y="210" width="140" height="6" rx="3"
            fill="#bcc0cc" opacity="0.5"/>
      <rect x="140" y="230" width="160" height="6" rx="3"
            fill="#bcc0cc" opacity="0.4"/>
      <rect x="140" y="250" width="100" height="6" rx="3"
            fill="#ccd0da" opacity="0.4"/>
    </g>

    <!-- Top right panel -->
    <g filter="url(#shadowLight)">
      <rect x="3440" y="120" width="280" height="180" rx="16"
            fill="#eff1f5" fill-opacity="0.85" stroke="#ccd0da"
            stroke-width="1.5"/>
      <circle cx="3480" cy="160" r="12" fill="#40a02b" opacity="0.7"/>
      <circle cx="3512" cy="160" r="12" fill="#df8e1d" opacity="0.7"/>
      <circle cx="3544" cy="160" r="12" fill="#d20f39" opacity="0.7"/>
      <rect x="3460" y="190" width="180" height="6" rx="3"
            fill="#acb0be" opacity="0.6"/>
      <rect x="3460" y="210" width="120" height="6" rx="3"
            fill="#bcc0cc" opacity="0.5"/>
      <rect x="3460" y="230" width="150" height="6" rx="3"
            fill="#bcc0cc" opacity="0.4"/>
      <rect x="3460" y="250" width="90"  height="6" rx="3"
            fill="#ccd0da" opacity="0.4"/>
    </g>

    <!-- Floating geometric light shapes -->
    <g opacity="0.30">
      <polygon points="320,500 380,600 260,600"
               fill="none" stroke="#7287fd" stroke-width="2"
               filter="url(#blurL4)"/>
      <circle cx="3600" cy="450" r="70"
              fill="none" stroke="#04a5e5" stroke-width="1.5"
              filter="url(#blurL4)"/>
      <circle cx="3600" cy="450" r="45"
              fill="none" stroke="#04a5e5" stroke-width="0.7"
              filter="url(#blurL4)"/>
      <rect x="200" y="1700" width="100" height="100" rx="12"
            fill="none" stroke="#ea76cb" stroke-width="1.5"
            transform="rotate(20,250,1750)"
            filter="url(#blurL4)"/>
      <polygon points="3600,1700 3660,1800 3540,1800"
               fill="none" stroke="#8839ef" stroke-width="1.5"
               filter="url(#blurL4)"/>
    </g>

    <!-- ═══════════════════════════════════════════════════════
         LAYER 9 — SUBTLE SPARKLES (LIGHT)
    ═══════════════════════════════════════════════════════ -->
    <g fill="#7287fd" opacity="0.40">
      <use href="#starL" x="1100" y="280"  width="14" height="14"/>
      <use href="#starL" x="2700" y="200"  width="10" height="10"/>
      <use href="#starL" x="3300" y="350"  width="12" height="12"/>
      <use href="#starL" x="400"  y="600"  width="8"  height="8"/>
    </g>
    <g fill="#04a5e5" opacity="0.35">
      <use href="#starL" x="3050" y="500"  width="10" height="10"/>
      <use href="#starL" x="1600" y="150"  width="12" height="12"/>
    </g>
    <g fill="#ea76cb" opacity="0.30">
      <use href="#starL" x="2100" y="300"  width="8"  height="8"/>
      <use href="#starL" x="1800" y="650"  width="10" height="10"/>
    </g>

    <!-- ═══════════════════════════════════════════════════════
         LAYER 10 — CORNER HUD DECORATIONS (LIGHT)
    ═══════════════════════════════════════════════════════ -->
    <g stroke="#7287fd" stroke-width="2.5" fill="none" opacity="0.35">
      <polyline points="60,120 60,60 120,60"/>
      <polyline points="78,120 78,78 120,78"/>
    </g>
    <g stroke="#04a5e5" stroke-width="2.5" fill="none" opacity="0.35">
      <polyline points="3780,120 3780,60 3720,60"/>
      <polyline points="3762,120 3762,78 3720,78"/>
    </g>
    <g stroke="#ea76cb" stroke-width="2.5" fill="none" opacity="0.35">
      <polyline points="60,2040 60,2100 120,2100"/>
      <polyline points="78,2040 78,2082 120,2082"/>
    </g>
    <g stroke="#8839ef" stroke-width="2.5" fill="none" opacity="0.35">
      <polyline points="3780,2040 3780,2100 3720,2100"/>
      <polyline points="3762,2040 3762,2082 3720,2082"/>
    </g>

    <!-- ═══════════════════════════════════════════════════════
         LAYER 11 — CENTRAL WORDMARK
    ═══════════════════════════════════════════════════════ -->
    <g transform="translate(1920, 1000)">
      <text x="0" y="240"
            font-family="'JetBrains Mono', 'Courier New', monospace"
            font-size="72" font-weight="700" letter-spacing="48"
            text-anchor="middle"
            fill="url(#logoLight)" opacity="0.72">ASH</text>
      <text x="0" y="288"
            font-family="'JetBrains Mono', 'Courier New', monospace"
            font-size="18" font-weight="400" letter-spacing="12"
            text-anchor="middle"
            fill="#8c8fa1" opacity="0.50">DOTFILES v5.0 OMEGA</text>
    </g>

    <!-- ═══════════════════════════════════════════════════════
         LAYER 12 — VIGNETTE LIGHT
    ═══════════════════════════════════════════════════════ -->
    <rect width="3840" height="2160" fill="url(#vignetteL)"/>

  </g>
</svg>