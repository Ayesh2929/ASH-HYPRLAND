<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <!-- Ethernet — wired network, solid active connection -->
    <linearGradient id="ethGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#89b4fa"/>
      <stop offset="50%"  stop-color="#74c7ec"/>
      <stop offset="100%" stop-color="#a6e3a1"/>
    </linearGradient>
    <linearGradient id="cableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#89b4fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#74c7ec" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="plugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#b4befe"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <radialGradient id="actDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#40a870"/>
    </radialGradient>
    <filter id="glowEth" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowDot" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.0" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── RJ-45 Plug head (top) ── -->
  <!-- plug outer body -->
  <rect x="7.5" y="2" width="9" height="7" rx="1.5"
        fill="url(#plugGrad)" opacity="0.90"/>
  <!-- plug body inner (recessed) -->
  <rect x="8.5" y="2.8" width="7" height="5.5" rx="1"
        fill="#1e1e2e" opacity="0.55"/>
  <!-- plug connector pins (4 pins) -->
  <g fill="url(#ethGrad)" opacity="0.85">
    <rect x="9"   y="3.5" width="1.2" height="4" rx="0.4"/>
    <rect x="10.6" y="3.5" width="1.2" height="4" rx="0.4"/>
    <rect x="12.2" y="3.5" width="1.2" height="4" rx="0.4"/>
    <rect x="13.8" y="3.5" width="1.2" height="4" rx="0.4"/>
  </g>
  <!-- plug clip tab -->
  <rect x="10.5" y="8.8" width="3" height="1.4" rx="0.5"
        fill="url(#plugGrad)" opacity="0.70"/>

  <!-- ── Cable body ── -->
  <!-- main vertical cable -->
  <rect x="11.2" y="9" width="1.6" height="7" rx="0.8"
        fill="url(#cableGrad)"/>
  <!-- cable highlight stripe -->
  <rect x="11.4" y="9.2" width="0.5" height="6.6" rx="0.25"
        fill="#ffffff" opacity="0.10"/>

  <!-- ── Network connector body (bottom socket) ── -->
  <!-- outer housing -->
  <rect x="6" y="15.5" width="12" height="6.5" rx="2"
        fill="url(#plugGrad)" opacity="0.82"/>
  <!-- inner recess -->
  <rect x="7" y="16.5" width="10" height="4.5" rx="1.2"
        fill="#181825" opacity="0.65"/>
  <!-- socket pins -->
  <g fill="url(#ethGrad)" opacity="0.75">
    <rect x="8"    y="17.2" width="0.9" height="3" rx="0.3"/>
    <rect x="9.4"  y="17.2" width="0.9" height="3" rx="0.3"/>
    <rect x="10.8" y="17.2" width="0.9" height="3" rx="0.3"/>
    <rect x="12.2" y="17.2" width="0.9" height="3" rx="0.3"/>
    <rect x="13.6" y="17.2" width="0.9" height="3" rx="0.3"/>
  </g>

  <!-- cable to socket entry -->
  <rect x="11.2" y="15" width="1.6" height="1.2" rx="0"
        fill="url(#cableGrad)" opacity="0.7"/>

  <!-- ── Activity dot (top-right corner, green = connected) ── -->
  <!-- halo -->
  <circle cx="20" cy="4" r="2.5"
          fill="#a6e3a1" opacity="0.15" filter="url(#glowDot)"/>
  <!-- dot -->
  <circle cx="20" cy="4" r="1.6"
          fill="url(#actDot)" filter="url(#glowDot)"/>
  <!-- inner specular -->
  <circle cx="19.5" cy="3.5" r="0.55"
          fill="#ffffff" opacity="0.40"/>

  <!-- ── Overall icon glow (subtle) ── -->
  <rect x="6" y="2" width="12" height="20" rx="2"
        fill="none" stroke="#89b4fa"
        stroke-width="0" opacity="0"
        filter="url(#glowEth)"/>
</svg>