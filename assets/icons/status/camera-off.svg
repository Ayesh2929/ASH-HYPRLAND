<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="camDimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#45475a"/>
      <stop offset="100%" stop-color="#313244"/>
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f38ba8"/>
      <stop offset="100%" stop-color="#eba0ac"/>
    </linearGradient>
    <filter id="glowSlash" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Camera body — dimmed -->
  <rect x="1.5" y="7" width="17" height="13" rx="2.5"
        fill="none" stroke="url(#camDimGrad)"
        stroke-width="1.6" opacity="0.45"/>

  <path d="M7,7 L7,4.5 Q7,3.5 8,3.5 L12,3.5 Q13,3.5 13,4.5 L13,7"
        fill="none" stroke="url(#camDimGrad)"
        stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round" opacity="0.45"/>

  <path d="M18.5,10 L22.5,8 L22.5,16 L18.5,14"
        fill="none" stroke="url(#camDimGrad)"
        stroke-width="1.4" stroke-linecap="round"
        stroke-linejoin="round" opacity="0.45"/>

  <circle cx="9.5" cy="13.5" r="4.5"
          fill="none" stroke="url(#camDimGrad)"
          stroke-width="1.3" opacity="0.45"/>
  <circle cx="9.5" cy="13.5" r="2.2"
          fill="none" stroke="url(#camDimGrad)"
          stroke-width="0.7" opacity="0.30"/>

  <!-- Diagonal slash (camera off) -->
  <line x1="2" y1="2" x2="22" y2="22"
        stroke="#00000040" stroke-width="2.4"
        stroke-linecap="round"/>
  <line x1="2" y1="2" x2="22" y2="22"
        stroke="url(#slashGrad)" stroke-width="1.7"
        stroke-linecap="round"
        filter="url(#glowSlash)"/>
</svg>