<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="mutedSpk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#585b70"/>
      <stop offset="100%" stop-color="#45475a"/>
    </linearGradient>
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f38ba8"/>
      <stop offset="100%" stop-color="#eba0ac"/>
    </linearGradient>
    <filter id="glowX" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Speaker dimmed -->
  <path d="M3,9 L3,15 L7,15 L12,19 L12,5 L7,9 Z"
        fill="url(#mutedSpk)" opacity="0.50"/>
  <path d="M7,9.5 L7,14.5 L11.2,17.8 L11.2,6.2 Z"
        fill="#1e1e2e" opacity="0.25"/>

  <!-- All wave arcs dimmed -->
  <path d="M14.5,9.5 A3.5,3.5 0 0,1 14.5,14.5"
        fill="none" stroke="#313244" stroke-width="1.5"
        stroke-linecap="round" opacity="0.30"/>
  <path d="M16.5,7.5 A6,6 0 0,1 16.5,16.5"
        fill="none" stroke="#313244" stroke-width="1.5"
        stroke-linecap="round" opacity="0.20"/>

  <!-- X mark (muted indicator) -->
  <g filter="url(#glowX)">
    <!-- circle bg -->
    <circle cx="17.5" cy="17.5" r="3.5"
            fill="#f38ba8" opacity="0.14"/>
    <!-- X lines -->
    <line x1="15.5" y1="15.5" x2="19.5" y2="19.5"
          stroke="url(#xGrad)" stroke-width="1.8"
          stroke-linecap="round"/>
    <line x1="19.5" y1="15.5" x2="15.5" y2="19.5"
          stroke="url(#xGrad)" stroke-width="1.8"
          stroke-linecap="round"/>
  </g>
</svg>