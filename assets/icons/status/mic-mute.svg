<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="micDimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#585b70"/>
      <stop offset="100%" stop-color="#45475a"/>
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f38ba8"/>
      <stop offset="100%" stop-color="#eba0ac"/>
    </linearGradient>
    <filter id="glowSlash" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Microphone (dimmed) -->
  <rect x="8.5" y="3" width="7" height="12" rx="3.5"
        fill="none" stroke="url(#micDimGrad)"
        stroke-width="1.7" opacity="0.45"/>

  <path d="M5.5,11 A6.5,6.5 0 0,0 18.5,11"
        fill="none" stroke="url(#micDimGrad)"
        stroke-width="1.7" stroke-linecap="round" opacity="0.45"/>

  <line x1="12" y1="17" x2="12" y2="21"
        stroke="url(#micDimGrad)" stroke-width="1.7"
        stroke-linecap="round" opacity="0.45"/>

  <line x1="8.5" y1="21" x2="15.5" y2="21"
        stroke="url(#micDimGrad)" stroke-width="1.9"
        stroke-linecap="round" opacity="0.45"/>

  <!-- Diagonal slash (muted) -->
  <line x1="3" y1="3" x2="21" y2="21"
        stroke="#000" stroke-width="2.4"
        stroke-linecap="round" opacity="0.22"/>

  <line x1="3" y1="3" x2="21" y2="21"
        stroke="url(#slashGrad)" stroke-width="1.7"
        stroke-linecap="round"
        filter="url(#glowSlash)"/>
</svg>