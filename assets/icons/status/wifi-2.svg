<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <!-- WiFi 2 — Medium signal (dot + inner 2 arcs) -->
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f9e2af" stop-opacity="0.5"/>
      <stop offset="50%"  stop-color="#f9e2af"/>
      <stop offset="100%" stop-color="#f9e2af" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="medGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#fab387" stop-opacity="0.5"/>
      <stop offset="50%"  stop-color="#fab387"/>
      <stop offset="100%" stop-color="#fab387" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="dotGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f9e2af"/>
      <stop offset="100%" stop-color="#d4a820"/>
    </radialGradient>
    <filter id="glowMed" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowDot" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.0" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowOuter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Arc 3 (outermost) — NO signal, dimmed -->
  <path d="M2.5,9.5 A13.5,13.5 0 0,1 21.5,9.5"
        fill="none" stroke="#313244" stroke-width="2"
        stroke-linecap="round" opacity="0.28"/>

  <!-- Arc 2 (middle) — ACTIVE (medium signal) -->
  <!-- Glow bloom -->
  <path d="M5,12.2 A10,10 0 0,1 19,12.2"
        fill="none" stroke="#f9e2af"
        stroke-width="3" stroke-linecap="round"
        opacity="0.14" filter="url(#glowMed)"/>
  <!-- Main stroke -->
  <path d="M5,12.2 A10,10 0 0,1 19,12.2"
        fill="none" stroke="url(#medGrad)"
        stroke-width="2.2" stroke-linecap="round"
        filter="url(#glowMed)"/>

  <!-- Arc 1 (inner) — ACTIVE -->
  <!-- Glow bloom -->
  <path d="M7.5,14.9 A6.5,6.5 0 0,1 16.5,14.9"
        fill="none" stroke="#fab387"
        stroke-width="3" stroke-linecap="round"
        opacity="0.18" filter="url(#glowMed)"/>
  <!-- Main stroke -->
  <path d="M7.5,14.9 A6.5,6.5 0 0,1 16.5,14.9"
        fill="none" stroke="url(#medGrad2)"
        stroke-width="2.2" stroke-linecap="round"
        filter="url(#glowMed)"/>

  <!-- Centre dot — ACTIVE, bright -->
  <!-- Outer glow -->
  <circle cx="12" cy="18.5" r="3"
          fill="#f9e2af" opacity="0.15" filter="url(#glowDot)"/>
  <!-- Main dot -->
  <circle cx="12" cy="18.5" r="1.8"
          fill="url(#dotGrad)" filter="url(#glowDot)"/>
  <!-- Inner highlight -->
  <circle cx="11.3" cy="17.8" r="0.65"
          fill="#ffffff" opacity="0.35"/>
</svg>