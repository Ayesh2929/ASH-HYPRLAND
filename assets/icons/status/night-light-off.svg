<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="moonDimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#45475a"/>
      <stop offset="100%" stop-color="#313244"/>
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#585b70"/>
      <stop offset="100%" stop-color="#45475a"/>
    </linearGradient>
    <filter id="glowSlash" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Moon crescent — dimmed / off -->
  <path d="M14,4.5 A8,8 0 1,0 14,21.5 A5.5,5.5 0 1,1 14,4.5 Z"
        fill="none" stroke="url(#moonDimGrad)"
        stroke-width="1.6" stroke-linejoin="round" opacity="0.40"/>

  <!-- Stars dimmed -->
  <circle cx="19" cy="5" r="1.0"
          fill="#45475a" opacity="0.40"/>
  <circle cx="20.5" cy="10" r="0.7"
          fill="#45475a" opacity="0.30"/>
  <circle cx="18" cy="14.5" r="0.55"
          fill="#45475a" opacity="0.25"/>

  <!-- sun rays (daytime mode indicator) -->
  <!-- small sun -->
  <circle cx="19.5" cy="18.5" r="2.2"
          fill="#585b70" opacity="0.25"/>
  <circle cx="19.5" cy="18.5" r="1.4"
          fill="#585b70" opacity="0.40"/>
  <!-- rays -->
  <g stroke="#585b70" stroke-width="0.9" stroke-linecap="round" opacity="0.30"
     transform="translate(19.5,18.5)">
    <line x1="0" y1="-3.2" x2="0"  y2="-2.2"/>
    <line x1="0" y1="-3.2" x2="0"  y2="-2.2" transform="rotate(45)"/>
    <line x1="0" y1="-3.2" x2="0"  y2="-2.2" transform="rotate(90)"/>
    <line x1="0" y1="-3.2" x2="0"  y2="-2.2" transform="rotate(135)"/>
    <line x1="0" y1="-3.2" x2="0"  y2="-2.2" transform="rotate(180)"/>
    <line x1="0" y1="-3.2" x2="0"  y2="-2.2" transform="rotate(225)"/>
    <line x1="0" y1="-3.2" x2="0"  y2="-2.2" transform="rotate(270)"/>
    <line x1="0" y1="-3.2" x2="0"  y2="-2.2" transform="rotate(315)"/>
  </g>

  <!-- Subtle slash through moon (off indicator) -->
  <line x1="5" y1="4" x2="20" y2="20"
        stroke="url(#slashGrad)" stroke-width="1.4"
        stroke-linecap="round" opacity="0.50"
        filter="url(#glowSlash)"/>
</svg>