<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="bellDimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#585b70"/>
      <stop offset="100%" stop-color="#45475a"/>
    </linearGradient>
  </defs>

  <!-- Bell (dimmed — DND off, notifications allowed) -->
  <path d="M12,3.5 A6.5,6.5 0 0,1 18.5,10 L18.5,15.5 L5.5,15.5 L5.5,10 A6.5,6.5 0 0,1 12,3.5 Z"
        fill="none" stroke="url(#bellDimGrad)"
        stroke-width="1.6" stroke-linejoin="round" opacity="0.55"/>

  <path d="M9,15.5 Q9,18.5 12,18.5 Q15,18.5 15,15.5"
        fill="none" stroke="url(#bellDimGrad)"
        stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>

  <path d="M10.5,3.5 A1.5,1.5 0 0,1 13.5,3.5"
        fill="none" stroke="url(#bellDimGrad)"
        stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>

  <!-- Gentle chime mark (DND off = active notifications) -->
  <line x1="5" y1="8" x2="4" y2="6.5"
        stroke="#585b70" stroke-width="1.2"
        stroke-linecap="round" opacity="0.45"/>
  <line x1="19" y1="8" x2="20" y2="6.5"
        stroke="#585b70" stroke-width="1.2"
        stroke-linecap="round" opacity="0.45"/>
  <line x1="12" y1="2" x2="12" y2="1"
        stroke="#585b70" stroke-width="1.2"
        stroke-linecap="round" opacity="0.45"/>
</svg>