<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <!-- Bluetooth OFF — disabled, greyed out with slash -->
    <linearGradient id="btOffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#45475a"/>
      <stop offset="100%" stop-color="#313244"/>
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f38ba8"/>
      <stop offset="50%"  stop-color="#eba0ac"/>
      <stop offset="100%" stop-color="#f38ba8"/>
    </linearGradient>
    <filter id="glowSlash" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="btClip">
      <!-- clip region excluding the slash path area -->
      <rect x="0" y="0" width="24" height="24"/>
    </clipPath>
  </defs>

  <!-- ── Bluetooth symbol — fully dimmed ── -->
  <!-- vertical line -->
  <line x1="12" y1="3" x2="12" y2="21"
        stroke="url(#btOffGrad)" stroke-width="2"
        stroke-linecap="round" opacity="0.45"/>

  <!-- upper-right diagonal -->
  <line x1="12" y1="3" x2="17" y2="7.5"
        stroke="url(#btOffGrad)" stroke-width="2"
        stroke-linecap="round" opacity="0.45"/>
  <line x1="17" y1="7.5" x2="12" y2="12"
        stroke="url(#btOffGrad)" stroke-width="2"
        stroke-linecap="round" opacity="0.45"/>

  <!-- lower-right diagonal -->
  <line x1="12" y1="12" x2="17" y2="16.5"
        stroke="url(#btOffGrad)" stroke-width="2"
        stroke-linecap="round" opacity="0.45"/>
  <line x1="17" y1="16.5" x2="12" y2="21"
        stroke="url(#btOffGrad)" stroke-width="2"
        stroke-linecap="round" opacity="0.45"/>

  <!-- ── Diagonal slash (disabled) ── -->
  <!-- shadow -->
  <line x1="3" y1="21" x2="21" y2="3"
        stroke="#000" stroke-width="2.6"
        stroke-linecap="round" opacity="0.22"/>
  <!-- main slash -->
  <line x1="3" y1="21" x2="21" y2="3"
        stroke="url(#slashGrad)" stroke-width="1.8"
        stroke-linecap="round"
        filter="url(#glowSlash)"/>
  <!-- slash inner highlight -->
  <line x1="3.4" y1="21.4" x2="21.4" y2="3.4"
        stroke="#ffffff" stroke-width="0.4"
        stroke-linecap="round" opacity="0.10"/>

  <title>Bluetooth Off</title>
</svg>