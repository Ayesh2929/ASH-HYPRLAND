<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="spkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#89b4fa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#74c7ec" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <filter id="glowSpk" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowWave" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Speaker -->
  <path d="M3,9 L3,15 L7,15 L12,19 L12,5 L7,9 Z"
        fill="url(#spkGrad)" opacity="0.90"
        filter="url(#glowSpk)"/>
  <path d="M7,9.5 L7,14.5 L11.2,17.8 L11.2,6.2 Z"
        fill="#1e1e2e" opacity="0.25"/>

  <!-- Wave 1 — inner -->
  <path d="M14.5,9.5 A3.5,3.5 0 0,1 14.5,14.5"
        fill="none" stroke="url(#wave1)"
        stroke-width="1.8" stroke-linecap="round"
        filter="url(#glowWave)"/>

  <!-- Wave 2 — medium -->
  <path d="M16.5,7.5 A6,6 0 0,1 16.5,16.5"
        fill="none" stroke="url(#wave2)"
        stroke-width="1.8" stroke-linecap="round"
        filter="url(#glowWave)"/>

  <!-- Wave 3 — outer (dimmed, medium volume) -->
  <path d="M18.5,5.5 A8.5,8.5 0 0,1 18.5,18.5"
        fill="none" stroke="#313244"
        stroke-width="1.6" stroke-linecap="round"
        opacity="0.30"/>
</svg>