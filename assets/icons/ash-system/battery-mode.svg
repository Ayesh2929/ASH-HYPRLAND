<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- ═══════════════════════════════════════════════════ -->
    <!-- ASH DOTFILES — BATTERY MODE ICON                   -->
    <!-- Concept: Leaf + battery + eco energy conservation  -->
    <!-- Primary: #a6e3a1 (green) + #f9e2af (amber warning) -->
    <!-- ═══════════════════════════════════════════════════ -->

    <!-- Background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1e1e2e"/>
      <stop offset="55%"  stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </radialGradient>

    <!-- Battery shell gradient -->
    <linearGradient id="battShell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#313244"/>
      <stop offset="50%"  stop-color="#252535"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>

    <!-- Battery fill green (high) -->
    <linearGradient id="battGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#a6e3a1"/>
      <stop offset="60%"  stop-color="#94e2d5"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>

    <!-- Battery fill amber (medium) -->
    <linearGradient id="battAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f9e2af"/>
      <stop offset="100%" stop-color="#fab387"/>
    </linearGradient>

    <!-- Battery fill red (low) -->
    <linearGradient id="battRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f38ba8"/>
      <stop offset="100%" stop-color="#eba0ac"/>
    </linearGradient>

    <!-- Green gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a6e3a1"/>
      <stop offset="50%"  stop-color="#94e2d5"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>

    <!-- Leaf gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a6e3a1"/>
      <stop offset="40%"  stop-color="#86c884"/>
      <stop offset="100%" stop-color="#4a8c50"/>
    </linearGradient>

    <!-- Leaf vein gradient -->
    <linearGradient id="veinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2a5c2e"/>
      <stop offset="100%" stop-color="#3a7c40"/>
    </linearGradient>

    <!-- Ambient glow -->
    <radialGradient id="ambientGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a6e3a1" stop-opacity="0.18"/>
      <stop offset="60%"  stop-color="#94e2d5" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#a6e3a1" stop-opacity="0"/>
    </radialGradient>

    <!-- Ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a6e3a1" stop-opacity="0.5"/>
      <stop offset="50%"  stop-color="#94e2d5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a6e3a1" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Power save mode gradient -->
    <linearGradient id="saveModeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#a6e3a1" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#a6e3a1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a6e3a1" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Shimmer -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b1"/>
      <feGaussianBlur stdDeviation="3" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowGreenSoft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowAmber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowLeaf" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="b1"/>
      <feGaussianBlur stdDeviation="4"  result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="shadowDeep" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>

    <filter id="shadowBatt" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.60"/>
    </filter>

    <filter id="glowOuter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip circle -->
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="242"/>
    </clipPath>

    <!-- Battery interior clip -->
    <clipPath id="battClip">
      <rect x="82" y="176" width="296" height="160" rx="14"/>
    </clipPath>
  </defs>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- LAYER 0: Background                                    -->
  <!-- ══════════════════════════════════════════════════════ -->
  <circle cx="256" cy="256" r="252" fill="url(#bgGrad)"/>

  <!-- outer rings -->
  <circle cx="256" cy="256" r="248"
          fill="none" stroke="url(#ringGrad)"
          stroke-width="0.8" stroke-dasharray="10 7" opacity="0.35"/>
  <circle cx="256" cy="256" r="234"
          fill="none" stroke="#a6e3a1"
          stroke-width="0.5" opacity="0.14"/>

  <!-- ambient glow -->
  <circle cx="256" cy="256" r="200" fill="url(#ambientGrad)"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- LAYER 1: Eco leaf (background element)                -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- leaf glow bloom -->
  <g filter="url(#glowLeaf)" opacity="0.65">
    <path d="M256,80
             C310,80 380,130 380,210
             C380,290 310,360 256,380
             C202,360 132,290 132,210
             C132,130 202,80 256,80 Z"
          fill="url(#leafGrad)" opacity="0.22"/>
  </g>

  <!-- leaf main body -->
  <path d="M256,96
           C306,96 370,142 370,214
           C370,286 306,354 256,372
           C206,354 142,286 142,214
           C142,142 206,96 256,96 Z"
        fill="url(#leafGrad)" opacity="0.18"/>

  <!-- leaf veins -->
  <g stroke="url(#veinGrad)" stroke-width="1.5"
     fill="none" opacity="0.25" stroke-linecap="round">
    <!-- centre vein -->
    <path d="M256,100 L256,368"/>
    <!-- left veins -->
    <path d="M256,160 Q218,180 180,192"/>
    <path d="M256,200 Q212,224 176,240"/>
    <path d="M256,240 Q210,268 174,286"/>
    <path d="M256,280 Q216,308 184,324"/>
    <!-- right veins -->
    <path d="M256,160 Q294,180 332,192"/>
    <path d="M256,200 Q300,224 336,240"/>
    <path d="M256,240 Q302,268 338,286"/>
    <path d="M256,280 Q296,308 328,324"/>
  </g>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- LAYER 2: BATTERY BODY (main icon element)             -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- battery shadow -->
  <g filter="url(#shadowBatt)">
    <rect x="80" y="174" width="300" height="164" rx="16"
          fill="#000000" opacity="0.25" transform="translate(2,8)"/>
  </g>

  <!-- battery outer shell -->
  <rect x="80" y="174" width="300" height="164" rx="16"
        fill="url(#battShell)"
        stroke="#45475a" stroke-width="2.5"/>

  <!-- battery terminal (right nub) -->
  <rect x="380" y="218" width="28" height="76" rx="10"
        fill="url(#battShell)" stroke="#45475a" stroke-width="2"/>
  <rect x="384" y="228" width="18" height="56" rx="7"
        fill="#3d3d55" stroke="#404058" stroke-width="1"/>

  <!-- battery inner background -->
  <rect x="86" y="180" width="288" height="152" rx="12"
        fill="#141420"/>

  <!-- battery fill level clip area -->
  <rect x="92" y="186" width="276" height="140" rx="10"
        fill="#0a0a14"/>

  <!-- ── BATTERY FILL SEGMENTS ── -->
  <!-- segment 1 (rightmost, green — 74% charge) -->
  <!-- Filling left-to-right to show 74% -->
  <g clip-path="url(#battClip)">
    <!-- Green fill — main charge (74%) -->
    <rect x="92" y="186" width="204" height="140" rx="10"
          fill="url(#battGreen)"
          filter="url(#glowGreenSoft)"/>

    <!-- fill shimmer -->
    <rect x="92" y="186" width="204" height="140" rx="10"
          fill="url(#shimmer)" opacity="0.5"/>

    <!-- fill inner highlight (top edge) -->
    <rect x="92" y="186" width="204" height="6" rx="3"
          fill="#ffffff" opacity="0.10"/>

    <!-- power wave animation feel — horizontal band -->
    <rect x="92" y="230" width="204" height="20" rx="0"
          fill="#ffffff" opacity="0.04"/>
  </g>

  <!-- battery segment dividers -->
  <g stroke="#252535" stroke-width="2" opacity="0.60">
    <line x1="184" y1="186" x2="184" y2="326"/>
    <line x1="276" y1="186" x2="276" y2="326"/>
    <!-- only show divider if charge level above that segment -->
  </g>

  <!-- ── BATTERY PERCENTAGE TEXT ── -->
  <text x="196" y="272" font-family="'JetBrains Mono', monospace"
        font-size="52" font-weight="800" fill="url(#greenGrad)"
        text-anchor="middle" opacity="0.85"
        filter="url(#glowGreenSoft)">74</text>
  <text x="196" y="300" font-family="'JetBrains Mono', monospace"
        font-size="14" font-weight="600" fill="#a6e3a1"
        text-anchor="middle" opacity="0.60" letter-spacing="1">PERCENT</text>

  <!-- battery outer border glow -->
  <rect x="80" y="174" width="300" height="164" rx="16"
        fill="none"
        stroke="url(#greenGrad)"
        stroke-width="2"
        opacity="0.35"
        filter="url(#glowGreenSoft)"/>

  <!-- battery shell shimmer -->
  <rect x="80" y="174" width="300" height="164" rx="16"
        fill="url(#shimmer)" opacity="0.5"/>

  <!-- ── TOP EDGE INDICATOR BAR ── -->
  <rect x="80" y="174" width="300" height="3" rx="1.5"
        fill="url(#battGreen)" opacity="0.7" filter="url(#glowGreenSoft)"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- LAYER 3: POWER MODE indicators (right side)           -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- Power save mode panel -->
  <g transform="translate(434,256)" filter="url(#shadowDeep)">
    <rect x="-32" y="-80" width="64" height="160" rx="12"
          fill="#181825" stroke="#313244" stroke-width="1.2"/>
    <rect x="-32" y="-80" width="64" height="3" rx="1.5"
          fill="url(#greenGrad)" opacity="0.5"/>
    <rect x="-32" y="-80" width="64" height="160" rx="12"
          fill="url(#shimmer)" opacity="0.5"/>

    <!-- ECO label -->
    <text x="0" y="-60" font-family="'JetBrains Mono', monospace"
          font-size="9" font-weight="700" fill="#a6e3a1"
          text-anchor="middle" opacity="0.65" letter-spacing="1">ECO</text>

    <!-- Mini battery rows -->
    <!-- row 1: screen -->
    <g transform="translate(0,-38)">
      <rect x="-22" y="-8" width="44" height="16" rx="3"
            fill="#252535" stroke="#313244" stroke-width="0.7"/>
      <rect x="-20" y="-6" width="28" height="12" rx="2"
            fill="#a6e3a1" opacity="0.35"/>
      <text x="8" y="4" font-family="'JetBrains Mono', monospace"
            font-size="7" fill="#6c7086" text-anchor="middle">SCR</text>
      <text x="-8" y="4" font-family="'JetBrains Mono', monospace"
            font-size="7" fill="#a6e3a1" text-anchor="middle">40%</text>
    </g>

    <!-- row 2: CPU -->
    <g transform="translate(0,-14)">
      <rect x="-22" y="-8" width="44" height="16" rx="3"
            fill="#252535" stroke="#313244" stroke-width="0.7"/>
      <rect x="-20" y="-6" width="20" height="12" rx="2"
            fill="#a6e3a1" opacity="0.25"/>
      <text x="8" y="4" font-family="'JetBrains Mono', monospace"
            font-size="7" fill="#6c7086" text-anchor="middle">CPU</text>
      <text x="-9" y="4" font-family="'JetBrains Mono', monospace"
            font-size="7" fill="#a6e3a1" text-anchor="middle">30%</text>
    </g>

    <!-- row 3: WiFi -->
    <g transform="translate(0,10)">
      <rect x="-22" y="-8" width="44" height="16" rx="3"
            fill="#252535" stroke="#313244" stroke-width="0.7"/>
      <rect x="-20" y="-6" width="34" height="12" rx="2"
            fill="#a6e3a1" opacity="0.20"/>
      <text x="8" y="4" font-family="'JetBrains Mono', monospace"
            font-size="7" fill="#6c7086" text-anchor="middle">NET</text>
      <text x="-6" y="4" font-family="'JetBrains Mono', monospace"
            font-size="7" fill="#94e2d5" text-anchor="middle">50%</text>
    </g>

    <!-- time remaining -->
    <g transform="translate(0,42)">
      <text x="0" y="-4" font-family="'JetBrains Mono', monospace"
            font-size="8" fill="#6c7086" text-anchor="middle">ETA</text>
      <text x="0" y="12" font-family="'JetBrains Mono', monospace"
            font-size="14" font-weight="800" fill="#a6e3a1"
            text-anchor="middle" filter="url(#glowGreenSoft)">6h</text>
    </g>

    <!-- border glow -->
    <rect x="-32" y="-80" width="64" height="160" rx="12"
          fill="none" stroke="#a6e3a1"
          stroke-width="1" opacity="0.20"/>
  </g>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- LAYER 4: Status row (below battery)                   -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- status panel -->
  <g transform="translate(196,380)" filter="url(#shadowDeep)">
    <rect x="-130" y="-22" width="260" height="44" rx="10"
          fill="#181825" stroke="#313244" stroke-width="1"/>
    <rect x="-130" y="-22" width="260" height="3" rx="1.5"
          fill="url(#battGreen)" opacity="0.5"/>
    <rect x="-130" y="-22" width="260" height="44" rx="10"
          fill="url(#shimmer)" opacity="0.5"/>

    <!-- eco leaf icon -->
    <text x="-108" y="6" font-family="serif" font-size="20"
          fill="#a6e3a1" opacity="0.6">🍃</text>

    <!-- BATTERY MODE label -->
    <text x="20" y="-4" font-family="'JetBrains Mono', monospace"
          font-size="11" font-weight="700" fill="#a6e3a1"
          text-anchor="middle" filter="url(#glowGreenSoft)">BATTERY</text>
    <text x="20" y="14" font-family="'JetBrains Mono', monospace"
          font-size="11" font-weight="700" fill="#94e2d5"
          text-anchor="middle" opacity="0.7">SAVE MODE</text>

    <!-- ON indicator -->
    <rect x="82" y="-12" width="36" height="24" rx="6"
          fill="#a6e3a1" opacity="0.15"/>
    <rect x="82" y="-12" width="36" height="24" rx="6"
          fill="none" stroke="#a6e3a1" stroke-width="0.8" opacity="0.4"/>
    <text x="100" y="5" font-family="'JetBrains Mono', monospace"
          font-size="10" font-weight="800" fill="#a6e3a1"
          text-anchor="middle" filter="url(#glowGreenSoft)">ON</text>

    <!-- border glow -->
    <rect x="-130" y="-22" width="260" height="44" rx="10"
          fill="none" stroke="#a6e3a1"
          stroke-width="1" opacity="0.18"/>
  </g>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- LAYER 5: Suspended processes (top left panel)          -->
  <!-- ══════════════════════════════════════════════════════ -->

  <g transform="translate(80,118)" filter="url(#shadowDeep)">
    <rect x="-50" y="-28" width="100" height="56" rx="9"
          fill="#181825" stroke="#313244" stroke-width="1"/>
    <rect x="-50" y="-28" width="100" height="3" rx="1.5"
          fill="#f9e2af" opacity="0.4"/>
    <text x="0" y="-12" font-family="'JetBrains Mono', monospace"
          font-size="7" fill="#6c7086" text-anchor="middle">SUSPENDED</text>
    <text x="0" y="4" font-family="'JetBrains Mono', monospace"
          font-size="18" font-weight="800" fill="#f9e2af"
          text-anchor="middle" filter="url(#glowAmber)">8</text>
    <text x="0" y="18" font-family="'JetBrains Mono', monospace"
          font-size="7" fill="#6c7086" text-anchor="middle">PROCS</text>
  </g>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- LAYER 6: Savings meter (top)                           -->
  <!-- ══════════════════════════════════════════════════════ -->

  <g transform="translate(256,110)">
    <text x="0" y="-12" font-family="'JetBrains Mono', monospace"
          font-size="10" fill="#6c7086" text-anchor="middle"
          letter-spacing="1">POWER SAVING</text>

    <!-- horizontal saving bar -->
    <rect x="-100" y="0" width="200" height="12" rx="4"
          fill="#181825" stroke="#313244" stroke-width="0.8"/>
    <rect x="-100" y="0" width="140" height="12" rx="4"
          fill="url(#battGreen)" filter="url(#glowGreenSoft)"/>
    <!-- shimmer on bar -->
    <rect x="-100" y="0" width="60" height="12" rx="4"
          fill="url(#shimmer)" opacity="0.6"/>
    <text x="50" y="24" font-family="'JetBrains Mono', monospace"
          font-size="10" font-weight="700" fill="#a6e3a1"
          text-anchor="middle" filter="url(#glowGreenSoft)">70%</text>
    <text x="-60" y="24" font-family="'JetBrains Mono', monospace"
          font-size="10" fill="#6c7086" text-anchor="middle">saved</text>
  </g>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- LAYER 7: Corner brackets + micro elements              -->
  <!-- ══════════════════════════════════════════════════════ -->

  <g stroke-width="2" fill="none">
    <path d="M62,98 L62,82 L80,82"    stroke="#a6e3a1" opacity="0.40"/>
    <path d="M450,98 L450,82 L432,82"  stroke="#94e2d5" opacity="0.40"/>
    <path d="M62,414 L62,430 L80,430"   stroke="#74c7ec" opacity="0.40"/>
    <path d="M450,414 L450,430 L432,430" stroke="#a6e3a1" opacity="0.40"/>
  </g>

  <!-- micro particles -->
  <g opacity="0.40" filter="url(#glowSoft)">
    <circle cx="100" cy="168" r="2.5" fill="#a6e3a1"/>
    <circle cx="118" cy="154" r="2"   fill="#94e2d5"/>
    <circle cx="400" cy="160" r="2.5" fill="#f9e2af"/>
    <circle cx="420" cy="175" r="2"   fill="#fab387"/>
    <circle cx="98"  cy="380" r="2"   fill="#a6e3a1"/>
    <circle cx="112" cy="394" r="1.5" fill="#94e2d5"/>
  </g>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- LAYER 8: Outer glow + vignette                         -->
  <!-- ══════════════════════════════════════════════════════ -->

  <circle cx="256" cy="256" r="248"
          fill="none" stroke="#a6e3a1"
          stroke-width="1" opacity="0.08" filter="url(#glowOuter)"/>

  <radialGradient id="vigGrad" cx="50%" cy="50%" r="50%">
    <stop offset="58%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.40"/>
  </radialGradient>
  <circle cx="256" cy="256" r="252" fill="url(#vigGrad)"/>

</svg>