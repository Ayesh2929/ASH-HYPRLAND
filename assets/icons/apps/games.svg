<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="ctrlGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cba6f7"/>
      <stop offset="50%"  stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <linearGradient id="ctrlFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cba6f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="btnA" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#40a870"/>
    </radialGradient>
    <radialGradient id="btnB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f38ba8"/>
      <stop offset="100%" stop-color="#cc3355"/>
    </radialGradient>
    <radialGradient id="btnX" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#4488cc"/>
    </radialGradient>
    <radialGradient id="btnY" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f9e2af"/>
      <stop offset="100%" stop-color="#ccaa44"/>
    </radialGradient>
    <filter id="glowCtrl" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBtn" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Controller body -->
  <path d="M5,9 Q3,9 2,11 L2,17 Q2,20 5,20 L8,20 Q9,19 10,16 L14,16 Q15,19 16,20 L19,20 Q22,20 22,17 L22,11 Q21,9 19,9 Q17,9 15,10 L9,10 Q7,9 5,9 Z"
        fill="url(#ctrlFill)" stroke="url(#ctrlGrd)"
        stroke-width="1.4" stroke-linejoin="round"
        filter="url(#glowCtrl)"/>

  <!-- D-pad -->
  <g fill="#313244" stroke="url(#ctrlGrd)" stroke-width="0.6">
    <!-- Horizontal bar -->
    <rect x="4" y="12.5" width="5" height="2" rx="0.5"/>
    <!-- Vertical bar -->
    <rect x="5.5" y="11" width="2" height="5" rx="0.5"/>
  </g>

  <!-- ABXY Buttons -->
  <g filter="url(#glowBtn)">
    <circle cx="18.5" cy="12.5" r="1.3" fill="url(#btnY)"/><!-- Y top -->
    <circle cx="16.5" cy="13.5" r="1.3" fill="url(#btnX)"/><!-- X left -->
    <circle cx="20.5" cy="13.5" r="1.3" fill="url(#btnA)"/><!-- A right -->
    <circle cx="18.5" cy="15" r="1.3" fill="url(#btnB)"/><!-- B bottom -->
  </g>

  <!-- Centre buttons (select/start) -->
  <rect x="10" y="13" width="1.8" height="1.2" rx="0.6"
        fill="#45475a"/>
  <rect x="12.2" y="13" width="1.8" height="1.2" rx="0.6"
        fill="#45475a"/>

  <!-- Joystick left -->
  <circle cx="7.5" cy="16.5" r="2"
          fill="#252535" stroke="url(#ctrlGrd)" stroke-width="0.7"/>
  <circle cx="7.5" cy="16.5" r="1.1"
          fill="#313244"/>

  <!-- Joystick right -->
  <circle cx="14.5" cy="16.5" r="2"
          fill="#252535" stroke="url(#ctrlGrd)" stroke-width="0.7"/>
  <circle cx="14.5" cy="16.5" r="1.1"
          fill="#313244"/>

  <!-- Shoulder bumpers -->
  <rect x="3" y="7.5" width="5" height="2.5" rx="2"
        fill="url(#ctrlFill)" stroke="url(#ctrlGrd)" stroke-width="0.8"/>
  <rect x="16" y="7.5" width="5" height="2.5" rx="2"
        fill="url(#ctrlFill)" stroke="url(#ctrlGrd)" stroke-width="0.8"/>
</svg>