<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="mailGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#89b4fa"/>
      <stop offset="50%"  stop-color="#74c7ec"/>
      <stop offset="100%" stop-color="#a6e3a1"/>
    </linearGradient>
    <linearGradient id="mailFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#89b4fa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#74c7ec" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="flapGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#89b4fa" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#74c7ec" stop-opacity="0.20"/>
    </linearGradient>
    <radialGradient id="notifDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f38ba8"/>
      <stop offset="100%" stop-color="#e64466"/>
    </radialGradient>
    <filter id="glowMail" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowDot" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Envelope body -->
  <rect x="2" y="5" width="20" height="15" rx="2.5"
        fill="url(#mailFill)" stroke="url(#mailGrd)"
        stroke-width="1.4" filter="url(#glowMail)"/>

  <!-- Envelope flap (open, folded down) -->
  <path d="M2,5 L12,13.5 L22,5"
        fill="url(#flapGrd)" stroke="url(#mailGrd)"
        stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Bottom crease lines -->
  <line x1="2" y1="20" x2="9" y2="14"
        stroke="url(#mailGrd)" stroke-width="0.8" opacity="0.45"/>
  <line x1="22" y1="20" x2="15" y2="14"
        stroke="url(#mailGrd)" stroke-width="0.8" opacity="0.45"/>

  <!-- Stamp area (top right of body) -->
  <rect x="17" y="7.5" width="3.5" height="4" rx="0.5"
        fill="none" stroke="url(#mailGrd)"
        stroke-width="0.7" opacity="0.40"/>
  <!-- Stamp lines -->
  <g stroke="url(#mailGrd)" stroke-width="0.5" opacity="0.30">
    <line x1="17.4" y1="7.5" x2="17.4" y2="11.5"/>
    <line x1="18.2" y1="7.5" x2="18.2" y2="11.5"/>
    <line x1="19" y1="7.5" x2="19" y2="11.5"/>
    <line x1="17" y1="8.3" x2="20.5" y2="8.3"/>
    <line x1="17" y1="9.1" x2="20.5" y2="9.1"/>
    <line x1="17" y1="9.9" x2="20.5" y2="9.9"/>
    <line x1="17" y1="10.7" x2="20.5" y2="10.7"/>
  </g>

  <!-- Unread dot -->
  <circle cx="20" cy="4" r="2.5"
          fill="url(#notifDot)" filter="url(#glowDot)"/>
  <circle cx="19.4" cy="3.4" r="0.85"
          fill="#ffffff" opacity="0.35"/>
</svg>