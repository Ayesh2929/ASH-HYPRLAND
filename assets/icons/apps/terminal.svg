<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="termAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#94e2d5"/>
    </linearGradient>
    <linearGradient id="promptGrd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <filter id="glowTerm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Terminal window -->
  <rect x="1" y="2" width="22" height="20" rx="3"
        fill="url(#termBg)" stroke="#313244" stroke-width="0.8"/>

  <!-- Title bar -->
  <rect x="1" y="2" width="22" height="5" rx="3" fill="#11111b"/>
  <rect x="1" y="5" width="22" height="2" fill="#11111b"/>
  <!-- Top accent line -->
  <rect x="1" y="2" width="22" height="1.5" rx="1"
        fill="url(#termAccent)" opacity="0.80"
        filter="url(#glowTerm)"/>

  <!-- Traffic lights -->
  <circle cx="4.5" cy="4.5" r="1" fill="#f38ba8"/>
  <circle cx="7"   cy="4.5" r="1" fill="#f9e2af"/>
  <circle cx="9.5" cy="4.5" r="1" fill="#a6e3a1"/>

  <!-- Terminal content -->
  <!-- Prompt -->
  <text x="2.5" y="12" font-family="monospace" font-size="3.8"
        font-weight="bold" fill="#cba6f7" filter="url(#glowTerm)">❯</text>

  <!-- Command line -->
  <text x="5" y="12" font-family="monospace" font-size="3.5"
        fill="#cdd6f4">ash theme</text>

  <!-- Output line -->
  <text x="2.5" y="16.5" font-family="monospace" font-size="3.2"
        fill="#a6e3a1" filter="url(#glowTerm)">✓ applied</text>

  <!-- Cursor blink -->
  <rect x="2.5" y="18.5" width="2.2" height="2"
        fill="#cba6f7" opacity="0.85"
        filter="url(#glowTerm)" rx="0.3"/>
</svg>