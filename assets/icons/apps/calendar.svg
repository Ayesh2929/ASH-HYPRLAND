<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="calGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="calFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cba6f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="headerGrd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#cba6f7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glowCal" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Calendar body -->
  <rect x="2" y="3" width="20" height="20" rx="3"
        fill="url(#calFill)" stroke="url(#calGrd)"
        stroke-width="1.4" filter="url(#glowCal)"/>

  <!-- Header bar -->
  <rect x="2" y="3" width="20" height="6" rx="3" fill="url(#headerGrd)"/>
  <rect x="2" y="7" width="20" height="2" fill="url(#headerGrd)"/>

  <!-- Binding rings -->
  <rect x="7"  y="1.5" width="2" height="4" rx="1"
        fill="url(#calGrd)" filter="url(#glowCal)"/>
  <rect x="15" y="1.5" width="2" height="4" rx="1"
        fill="url(#calGrd)" filter="url(#glowCal)"/>

  <!-- Month label -->
  <text x="12" y="7.5" font-family="monospace" font-size="3.5"
        font-weight="bold" fill="#1e1e2e"
        text-anchor="middle">OCTOBER</text>

  <!-- Day grid -->
  <g font-family="monospace" font-size="2.8" fill="#6c7086" text-anchor="middle">
    <!-- Days of week -->
    <text x="5"  y="12">M</text>
    <text x="8.5" y="12">T</text>
    <text x="12" y="12">W</text>
    <text x="15.5" y="12">T</text>
    <text x="19" y="12">F</text>

    <!-- Week 1 -->
    <text x="5"  y="15.5">1</text>
    <text x="8.5" y="15.5">2</text>
    <text x="12" y="15.5">3</text>
    <text x="15.5" y="15.5">4</text>
    <text x="19" y="15.5">5</text>

    <!-- Week 2 — today highlighted -->
    <text x="5"  y="19">8</text>
    <text x="8.5" y="19">9</text>
    <!-- Today -->
    <circle cx="12" cy="18" r="2.2" fill="#cba6f7" opacity="0.90"/>
    <text x="12" y="19" fill="#1e1e2e" font-weight="bold">10</text>
    <text x="15.5" y="19">11</text>
    <text x="19" y="19">12</text>

    <!-- Week 3 -->
    <text x="5"  y="22.5">15</text>
    <text x="8.5" y="22.5">16</text>
  </g>
</svg>