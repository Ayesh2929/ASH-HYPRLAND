<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="musicGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f38ba8"/>
      <stop offset="50%"  stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="noteFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f38ba8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0.07"/>
    </linearGradient>
    <radialGradient id="discGrd" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#cba6f7" stop-opacity="0.35"/>
      <stop offset="60%"  stop-color="#89b4fa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f38ba8" stop-opacity="0.05"/>
    </radialGradient>
    <filter id="glowMusic" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Vinyl disc -->
  <circle cx="12" cy="13" r="9"
          fill="url(#noteFill)" stroke="url(#musicGrd)"
          stroke-width="1.4" filter="url(#glowMusic)"/>

  <!-- Disc rings -->
  <circle cx="12" cy="13" r="6.5"
          fill="none" stroke="url(#musicGrd)"
          stroke-width="0.8" opacity="0.45"/>
  <circle cx="12" cy="13" r="4.2"
          fill="none" stroke="url(#musicGrd)"
          stroke-width="0.7" opacity="0.35"/>

  <!-- Center label -->
  <circle cx="12" cy="13" r="2.5"
          fill="url(#discGrd)" stroke="url(#musicGrd)"
          stroke-width="1" filter="url(#glowMusic)"/>
  <circle cx="12" cy="13" r="0.9"
          fill="#cba6f7" opacity="0.70"/>

  <!-- Musical note (top, peeking) -->
  <g filter="url(#glowMusic)">
    <!-- Note head 1 -->
    <ellipse cx="8.5" cy="6.5" rx="1.8" ry="1.4"
             fill="url(#musicGrd)" opacity="0.90"
             transform="rotate(-15,8.5,6.5)"/>
    <!-- Stem 1 -->
    <line x1="10.2" y1="6" x2="10.2" y2="2"
          stroke="url(#musicGrd)" stroke-width="1.5"
          stroke-linecap="round" filter="url(#glowMusic)"/>
    <!-- Note head 2 -->
    <ellipse cx="14" cy="5" rx="1.8" ry="1.4"
             fill="url(#musicGrd)" opacity="0.90"
             transform="rotate(-15,14,5)"/>
    <!-- Stem 2 -->
    <line x1="15.7" y1="4.5" x2="15.7" y2="2"
          stroke="url(#musicGrd)" stroke-width="1.5"
          stroke-linecap="round"/>
    <!-- Beam connecting stems -->
    <line x1="10.2" y1="2" x2="15.7" y2="2"
          stroke="url(#musicGrd)" stroke-width="1.5"
          stroke-linecap="round"/>
  </g>
</svg>