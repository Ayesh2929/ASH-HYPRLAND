<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="folderGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f9e2af"/>
      <stop offset="50%"  stop-color="#fab387"/>
      <stop offset="100%" stop-color="#f9e2af"/>
    </linearGradient>
    <linearGradient id="folderFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f9e2af" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#fab387" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="fileGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cdd6f4"/>
      <stop offset="100%" stop-color="#9399b2"/>
    </linearGradient>
    <filter id="glowFiles" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Back folder -->
  <path d="M2,6 L2,20 Q2,21 3,21 L21,21 Q22,21 22,20 L22,8 Q22,7 21,7 L12,7 L10,5 L3,5 Q2,5 2,6 Z"
        fill="url(#folderFill)"/>
  <path d="M2,6 L2,20 Q2,21 3,21 L21,21 Q22,21 22,20 L22,8 Q22,7 21,7 L12,7 L10,5 L3,5 Q2,5 2,6 Z"
        fill="none" stroke="url(#folderGrd)"
        stroke-width="1.5" stroke-linejoin="round"
        filter="url(#glowFiles)"/>

  <!-- Folder shimmer -->
  <ellipse cx="10" cy="9" rx="4" ry="0.8"
           fill="#ffffff" opacity="0.12"
           transform="rotate(-10,10,9)"/>

  <!-- Files inside (peeking out) -->
  <!-- File 1 -->
  <rect x="7" y="11" width="6.5" height="8" rx="1"
        fill="url(#folderFill)" stroke="url(#fileGrd)"
        stroke-width="0.9" opacity="0.80"/>
  <!-- File 2 (front) -->
  <rect x="10.5" y="12" width="6.5" height="7" rx="1"
        fill="url(#folderFill)" stroke="url(#folderGrd)"
        stroke-width="0.9"/>
  <!-- File lines -->
  <g stroke="#585b70" stroke-width="0.7" stroke-linecap="round" opacity="0.60">
    <line x1="12"   y1="14.5" x2="16"   y2="14.5"/>
    <line x1="12"   y1="16"   x2="15.5" y2="16"/>
    <line x1="12"   y1="17.5" x2="16"   y2="17.5"/>
  </g>

  <!-- Folder tab highlight -->
  <path d="M3,7 L10,7 L11.5,5.5"
        fill="none" stroke="#f9e2af"
        stroke-width="0.7" opacity="0.45"/>
</svg>