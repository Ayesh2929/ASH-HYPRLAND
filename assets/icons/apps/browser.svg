<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="browserGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#89b4fa"/>
      <stop offset="50%"  stop-color="#74c7ec"/>
      <stop offset="100%" stop-color="#a6e3a1"/>
    </linearGradient>
    <linearGradient id="browserFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#89b4fa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#74c7ec" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="urlBarGrd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#a6e3a1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a6e3a1" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glowBrow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Browser frame -->
  <rect x="1" y="2" width="22" height="20" rx="3"
        fill="url(#browserFill)" stroke="url(#browserGrd)"
        stroke-width="1.4" filter="url(#glowBrow)"/>

  <!-- Top bar -->
  <rect x="1" y="2" width="22" height="6" rx="3" fill="#181825"/>
  <rect x="1" y="6" width="22" height="2" fill="#181825"/>
  <!-- Top accent -->
  <rect x="1" y="2" width="22" height="1.5" rx="1"
        fill="url(#browserGrd)" opacity="0.80" filter="url(#glowBrow)"/>

  <!-- Tab dots -->
  <circle cx="4" cy="5" r="1" fill="#f38ba8" opacity="0.80"/>
  <circle cx="6.5" cy="5" r="1" fill="#f9e2af" opacity="0.80"/>
  <circle cx="9" cy="5" r="1" fill="#a6e3a1" opacity="0.80"/>

  <!-- URL bar -->
  <rect x="11" y="3.5" width="10" height="3" rx="1.5"
        fill="url(#urlBarGrd)" stroke="#313244" stroke-width="0.5"/>
  <!-- Lock icon -->
  <circle cx="12.5" cy="5" r="0.7"
          fill="none" stroke="#a6e3a1" stroke-width="0.7"/>
  <rect x="12" y="5.2" width="1" height="1" rx="0.2"
        fill="#a6e3a1"/>
  <!-- URL dots -->
  <rect x="14" y="4.7" width="6" height="0.6" rx="0.3"
        fill="#585b70"/>

  <!-- Globe/earth icon in content area -->
  <circle cx="12" cy="15" r="5.5"
          fill="none" stroke="url(#browserGrd)"
          stroke-width="1.3" filter="url(#glowBrow)"/>
  <!-- Globe lines -->
  <ellipse cx="12" cy="15" rx="2.5" ry="5.5"
           fill="none" stroke="url(#browserGrd)"
           stroke-width="0.8" opacity="0.60"/>
  <line x1="6.5" y1="15" x2="17.5" y2="15"
        stroke="url(#browserGrd)" stroke-width="0.8" opacity="0.60"/>
  <path d="M7.5,12.5 Q12,11.5 16.5,12.5"
        fill="none" stroke="url(#browserGrd)"
        stroke-width="0.7" opacity="0.50"/>
  <path d="M7.5,17.5 Q12,18.5 16.5,17.5"
        fill="none" stroke="url(#browserGrd)"
        stroke-width="0.7" opacity="0.50"/>
</svg>