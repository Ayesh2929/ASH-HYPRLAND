<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="gearGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6c7086"/>
      <stop offset="50%"  stop-color="#7f849c"/>
      <stop offset="100%" stop-color="#9399b2"/>
    </linearGradient>
    <linearGradient id="gearFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6c7086" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#9399b2" stop-opacity="0.07"/>
    </linearGradient>
    <radialGradient id="gearCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#89b4fa" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0.10"/>
    </radialGradient>
    <filter id="glowGear" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Gear teeth (8 teeth) -->
  <g fill="url(#gearFill)" stroke="url(#gearGrd)" stroke-width="1.4"
     stroke-linejoin="round" filter="url(#glowGear)">
    <!-- Gear body with teeth as a compound path -->
    <path d="M12,2
             L13.5,2.5 L14.5,4.5 L16,4
             L17.5,5 L17,6.5 L18.5,7.5
             L19,9 L17.5,9.5 L17.5,11.5
             L19,12 L18.5,13.5 L17,14.5
             L17.5,16 L16,17 L14.5,16.5
             L13.5,18.5 L12,19
             L10.5,18.5 L9.5,16.5 L8,17
             L6.5,16 L7,14.5 L5.5,13.5
             L5,12 L6.5,11.5 L6.5,9.5
             L5,9 L5.5,7.5 L7,6.5
             L6.5,5 L8,4 L9.5,4.5
             L10.5,2.5 Z"/>
  </g>

  <!-- Gear inner circle -->
  <circle cx="12" cy="10.5" r="3.5"
          fill="url(#gearCore)" stroke="url(#gearGrd)"
          stroke-width="1.4" filter="url(#glowGear)"/>

  <!-- Centre dot (highlight) -->
  <circle cx="12" cy="10.5" r="1.2"
          fill="#89b4fa" opacity="0.50"/>
  <circle cx="11.4" cy="9.9" r="0.5"
          fill="#ffffff" opacity="0.30"/>
</svg>