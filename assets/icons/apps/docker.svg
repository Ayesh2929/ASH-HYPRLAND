<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="dockGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#74c7ec"/>
      <stop offset="50%"  stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <linearGradient id="containerGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#74c7ec" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="waveGrd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#74c7ec" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#74c7ec" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#74c7ec" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowDock" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowWave" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="0.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Whale body (simplified Docker whale) -->
  <!-- Whale / ship hull -->
  <path d="M2,17 Q2,19 5,19 L19,19 Q22,19 22,17 L22,15 Q22,14 21,14 L3,14 Q2,14 2,15 Z"
        fill="url(#containerGrd)" stroke="url(#dockGrd)"
        stroke-width="1.3" stroke-linejoin="round"
        filter="url(#glowDock)"/>

  <!-- Container stacks (on top of whale) -->
  <!-- Row 1: 3 containers -->
  <g fill="url(#containerGrd)" stroke="url(#dockGrd)" stroke-width="1.1"
     stroke-linejoin="round" filter="url(#glowDock)">
    <rect x="3.5" y="10.5" width="4" height="3.5" rx="0.8"/>
    <rect x="9"   y="10.5" width="4" height="3.5" rx="0.8"/>
    <rect x="14.5" y="10.5" width="4" height="3.5" rx="0.8"/>
  </g>

  <!-- Row 2: 2 containers (on top) -->
  <g fill="url(#containerGrd)" stroke="url(#dockGrd)" stroke-width="1.1"
     stroke-linejoin="round" filter="url(#glowDock)">
    <rect x="6"  y="7" width="4" height="3.5" rx="0.8"/>
    <rect x="12" y="7" width="4" height="3.5" rx="0.8"/>
  </g>

  <!-- Row 3: 1 container (top) -->
  <rect x="9" y="3.5" width="4" height="3.5" rx="0.8"
        fill="url(#containerGrd)" stroke="url(#dockGrd)"
        stroke-width="1.1" stroke-linejoin="round"
        filter="url(#glowDock)"/>

  <!-- Container lines (horizontal bands) -->
  <g stroke="url(#dockGrd)" stroke-width="0.5" opacity="0.40">
    <line x1="4" y1="12.2" x2="7.5" y2="12.2"/>
    <line x1="9.5" y1="12.2" x2="13" y2="12.2"/>
    <line x1="15" y1="12.2" x2="18.5" y2="12.2"/>
    <line x1="6.5" y1="8.7" x2="10" y2="8.7"/>
    <line x1="12.5" y1="8.7" x2="16" y2="8.7"/>
    <line x1="9.5" y1="5.2" x2="13" y2="5.2"/>
  </g>

  <!-- Water wave beneath whale -->
  <path d="M2,19.5 Q5,18.5 8,19.5 Q11,20.5 14,19.5 Q17,18.5 20,19.5 Q21.5,20 22,19.5"
        fill="none" stroke="url(#waveGrd)"
        stroke-width="1.5" stroke-linecap="round"
        filter="url(#glowWave)"/>

  <!-- Whale spout -->
  <path d="M20,14 L20,12 Q20,10 22,9"
        fill="none" stroke="url(#dockGrd)"
        stroke-width="1.2" stroke-linecap="round"
        opacity="0.65"/>
  <path d="M22,9 Q21.5,7.5 22.5,7 Q23,7.5 22.5,8.5"
        fill="none" stroke="url(#dockGrd)"
        stroke-width="1" stroke-linecap="round"
        opacity="0.55"/>
</svg>