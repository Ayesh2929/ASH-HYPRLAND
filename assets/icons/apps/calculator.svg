<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="calcGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#94e2d5"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <linearGradient id="calcFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#94e2d5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#74c7ec" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="screenGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#94e2d5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#74c7ec" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="eqGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f9e2af"/>
      <stop offset="100%" stop-color="#fab387"/>
    </linearGradient>
    <filter id="glowCalc" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Calculator body -->
  <rect x="4" y="1.5" width="16" height="21" rx="3"
        fill="url(#calcFill)" stroke="url(#calcGrd)"
        stroke-width="1.4" filter="url(#glowCalc)"/>

  <!-- Display screen -->
  <rect x="5.5" y="3" width="13" height="6" rx="1.5"
        fill="url(#screenGrd)" stroke="url(#calcGrd)"
        stroke-width="0.8"/>
  <!-- Display number -->
  <text x="17" y="8" font-family="monospace" font-size="5"
        font-weight="bold" fill="#94e2d5"
        text-anchor="end" filter="url(#glowCalc)">42</text>

  <!-- Button grid (3x4) -->
  <g fill="url(#calcFill)" stroke="url(#calcGrd)" stroke-width="0.7">
    <!-- Row 1: 7 8 9 -->
    <rect x="5.5" y="10.5" width="3.5" height="2.5" rx="0.8"/>
    <rect x="10.2" y="10.5" width="3.5" height="2.5" rx="0.8"/>
    <rect x="14.9" y="10.5" width="3.5" height="2.5" rx="0.8"/>
    <!-- Row 2: 4 5 6 -->
    <rect x="5.5" y="14" width="3.5" height="2.5" rx="0.8"/>
    <rect x="10.2" y="14" width="3.5" height="2.5" rx="0.8"/>
    <rect x="14.9" y="14" width="3.5" height="2.5" rx="0.8"/>
    <!-- Row 3: 1 2 3 -->
    <rect x="5.5" y="17.5" width="3.5" height="2.5" rx="0.8"/>
    <rect x="10.2" y="17.5" width="3.5" height="2.5" rx="0.8"/>
    <rect x="14.9" y="17.5" width="3.5" height="2.5" rx="0.8"/>
    <!-- Row 4: 0 . = -->
    <rect x="5.5" y="21" width="3.5" height="1.2" rx="0.6"/>
    <rect x="10.2" y="21" width="3.5" height="1.2" rx="0.6"/>
    <!-- Equals (highlighted) -->
    <rect x="14.9" y="21" width="3.5" height="1.2" rx="0.6"
          fill="url(#eqGrd)" opacity="0.60"/>
  </g>

  <!-- Button labels -->
  <g font-family="monospace" font-size="2" fill="#585b70" text-anchor="middle">
    <text x="7.25" y="12.2">7</text>
    <text x="11.95" y="12.2">8</text>
    <text x="16.65" y="12.2">9</text>
    <text x="7.25" y="15.7">4</text>
    <text x="11.95" y="15.7">5</text>
    <text x="16.65" y="15.7">6</text>
    <text x="7.25" y="19.2">1</text>
    <text x="11.95" y="19.2">2</text>
    <text x="16.65" y="19.2">3</text>
    <text x="7.25" y="22">0</text>
    <text x="11.95" y="22">.</text>
    <text x="16.65" y="22" fill="#f9e2af">=</text>
  </g>
</svg>