<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="imgGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a6e3a1"/>
      <stop offset="50%"  stop-color="#94e2d5"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="imgFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a6e3a1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="skyGrd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#89b4fa" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#74c7ec" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="mountGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a6e3a1" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#94e2d5" stop-opacity="0.30"/>
    </linearGradient>
    <filter id="glowImg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Image frame -->
  <rect x="1.5" y="2.5" width="21" height="19" rx="3"
        fill="url(#imgFill)" stroke="url(#imgGrd)"
        stroke-width="1.4" filter="url(#glowImg)"/>

  <!-- Top accent -->
  <rect x="1.5" y="2.5" width="21" height="1.5" rx="1.5"
        fill="url(#imgGrd)" opacity="0.70"/>

  <!-- Image content — landscape scene -->
  <!-- Sky gradient -->
  <rect x="2.5" y="5" width="19" height="10" rx="1.5"
        fill="url(#skyGrd)"/>

  <!-- Sun -->
  <circle cx="17" cy="8" r="2.2"
          fill="#f9e2af" opacity="0.85"
          filter="url(#glowImg)"/>

  <!-- Mountains -->
  <path d="M2.5,15 L7,8 L11.5,15 Z"
        fill="url(#mountGrd)"/>
  <path d="M8,15 L13,9.5 L18,15 Z"
        fill="url(#mountGrd)" opacity="0.70"/>
  <path d="M14,15 L18.5,11 L22.5,15 Z"
        fill="url(#mountGrd)" opacity="0.55"/>

  <!-- Ground -->
  <rect x="2.5" y="15" width="19" height="5.5" rx="0 0 1.5 1.5"
        fill="#a6e3a1" opacity="0.20"/>

  <!-- Frame corners -->
  <g stroke="url(#imgGrd)" stroke-width="1" fill="none" opacity="0.45">
    <path d="M3.5,4.5 L3.5,3 L5,3"/>
    <path d="M20.5,4.5 L20.5,3 L19,3"/>
    <path d="M3.5,19 L3.5,20.5 L5,20.5"/>
    <path d="M20.5,19 L20.5,20.5 L19,20.5"/>
  </g>
</svg>