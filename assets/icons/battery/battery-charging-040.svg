<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f9e2af"/>
      <stop offset="100%" stop-color="#a6e3a1"/>
    </linearGradient>
    <linearGradient id="fillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f9e2af" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a6e3a1"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f9e2af"/>
      <stop offset="100%" stop-color="#a6e3a1"/>
    </linearGradient>
    <radialGradient id="chrgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f9e2af" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f9e2af" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowChrg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBolt" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ambient glow -->
  <rect x="1" y="6" width="18" height="12" rx="2.5"
        fill="url(#chrgGlow)" filter="url(#glowChrg)"/>

  <!-- Shell -->
  <rect x="1" y="6.5" width="18" height="11" rx="2.2"
        fill="none" stroke="url(#shellGrad)"
        stroke-width="1.7" filter="url(#glowChrg)"/>

  <!-- Background -->
  <rect x="2.5" y="8" width="15" height="8" rx="1.4"
        fill="#1e1e2e" opacity="0.65"/>

  <!-- Terminal nub -->
  <rect x="19" y="9.8" width="2.5" height="4.4" rx="1.2"
        fill="url(#shellGrad)" opacity="0.72"/>

  <!-- Fill 40% = 6px -->
  <rect x="2.8" y="8.3" width="6.0" height="7.4" rx="0.7"
        fill="url(#fillGrad)" filter="url(#glowChrg)"/>

  <!-- Lightning bolt -->
  <g filter="url(#glowBolt)">
    <path d="M12,8.5 L9,12.5 L11.2,12.5 L9.5,15.5 L14.5,11 L12,11 Z"
          fill="#f9e2af" opacity="0.15"/>
    <path d="M12,8.5 L9,12.5 L11.2,12.5 L9.5,15.5 L14.5,11 L12,11 Z"
          fill="url(#boltGrad)"/>
    <path d="M11.5,9.2 L9.5,12.5 L11.3,12.5 Z"
          fill="#ffffff" opacity="0.18"/>
  </g>

  <text x="11" y="21"
        font-family="'JetBrains Mono', monospace"
        font-size="4" font-weight="700"
        fill="#f9e2af" text-anchor="middle" opacity="0.65">⚡40%</text>
</svg>