<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f38ba8"/>
      <stop offset="100%" stop-color="#eba0ac"/>
    </linearGradient>
    <linearGradient id="fillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f38ba8"/>
      <stop offset="100%" stop-color="#eba0ac"/>
    </linearGradient>
    <filter id="glowFill" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Battery shell -->
  <rect x="1" y="6.5" width="18" height="11" rx="2.2"
        fill="none" stroke="url(#shellGrad)"
        stroke-width="1.7" filter="url(#glowFill)"/>

  <!-- Empty background -->
  <rect x="2.5" y="8" width="15" height="8" rx="1.4"
        fill="#1e1e2e" opacity="0.65"/>

  <!-- Terminal nub -->
  <rect x="19" y="9.8" width="2.5" height="4.4" rx="1.2"
        fill="url(#shellGrad)" opacity="0.75"/>

  <!-- Fill — 10% -->
  <rect x="2.8" y="8.3" width="1.5" height="7.4" rx="0.7"
        fill="url(#fillGrad)" filter="url(#glowFill)"/>

  <!-- Percentage label -->
  <text x="11" y="21"
        font-family="'JetBrains Mono', monospace"
        font-size="4" font-weight="700"
        fill="#f38ba8" text-anchor="middle"
        opacity="0.60">10%</text>
</svg>