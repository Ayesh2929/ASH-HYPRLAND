<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a6e3a1"/>
      <stop offset="33%"  stop-color="#94e2d5"/>
      <stop offset="66%"  stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#cba6f7"/>
    </linearGradient>
    <linearGradient id="fillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#a6e3a1" stop-opacity="0.7"/>
      <stop offset="33%"  stop-color="#94e2d5"/>
      <stop offset="66%"  stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#cba6f7"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f9e2af"/>
      <stop offset="100%" stop-color="#a6e3a1"/>
    </linearGradient>
    <radialGradient id="fullGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a6e3a1" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a6e3a1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowFull" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.0" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBolt" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCheck" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Strong ambient glow (fully charged) -->
  <rect x="0.5" y="5.5" width="19" height="13" rx="3"
        fill="url(#fullGlow)" filter="url(#glowFull)"/>

  <!-- Battery shell -->
  <rect x="1" y="6.5" width="18" height="11" rx="2.2"
        fill="none" stroke="url(#shellGrad)"
        stroke-width="1.8" filter="url(#glowFull)"/>

  <!-- Terminal nub -->
  <rect x="19" y="9.8" width="2.5" height="4.4" rx="1.2"
        fill="url(#shellGrad)" opacity="0.85"/>

  <!-- Fill 100% — complete rainbow fill -->
  <rect x="2.8" y="8.3" width="14.4" height="7.4" rx="1.2"
        fill="url(#fillGrad)" filter="url(#glowFull)"/>

  <!-- Inner shimmer highlight -->
  <rect x="3.2" y="8.7" width="13.6" height="2.5" rx="1.2"
        fill="#ffffff" opacity="0.12"/>

  <!-- Bottom shine -->
  <rect x="3.2" y="14.2" width="13.6" height="1.2" rx="0.6"
        fill="#ffffff" opacity="0.06"/>

  <!-- Lightning bolt (still charging / just completed) -->
  <g filter="url(#glowBolt)">
    <path d="M12,8.5 L9,12.5 L11.2,12.5 L9.5,15.5 L14.5,11 L12,11 Z"
          fill="#f9e2af" opacity="0.20"/>
    <!-- bolt over full fill — dark silhouette + bright outline -->
    <path d="M12,8.5 L9,12.5 L11.2,12.5 L9.5,15.5 L14.5,11 L12,11 Z"
          fill="#1e1e2e" opacity="0.30"/>
    <path d="M12,8.5 L9,12.5 L11.2,12.5 L9.5,15.5 L14.5,11 L12,11 Z"
          fill="url(#boltGrad)" opacity="0.65"/>
    <!-- specular -->
    <path d="M11.5,9.2 L9.5,12.5 L11.2,12.5 Z"
          fill="#ffffff" opacity="0.22"/>
  </g>

  <!-- Outer glow ring (full charge celebration) -->
  <rect x="1" y="6.5" width="18" height="11" rx="2.2"
        fill="none" stroke="#a6e3a1"
        stroke-width="0.8" opacity="0.20"
        filter="url(#glowFull)"/>

  <text x="11" y="21"
        font-family="'JetBrains Mono', monospace"
        font-size="4" font-weight="800"
        fill="#a6e3a1" text-anchor="middle"
        opacity="0.70" letter-spacing="0.2">⚡ FULL</text>
</svg>