<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fab387"/>
      <stop offset="100%" stop-color="#f9e2af"/>
    </linearGradient>
    <linearGradient id="fillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#fab387"/>
      <stop offset="100%" stop-color="#f9e2af"/>
    </linearGradient>
    <filter id="glowFill" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="6.5" width="18" height="11" rx="2.2"
        fill="none" stroke="url(#shellGrad)"
        stroke-width="1.6" filter="url(#glowFill)"/>
  <rect x="2.5" y="8" width="15" height="8" rx="1.4"
        fill="#1e1e2e" opacity="0.65"/>
  <rect x="19" y="9.8" width="2.5" height="4.4" rx="1.2"
        fill="url(#shellGrad)" opacity="0.70"/>

  <!-- Fill 30% = 4.5px -->
  <rect x="2.8" y="8.3" width="4.5" height="7.4" rx="0.7"
        fill="url(#fillGrad)" filter="url(#glowFill)"/>

  <text x="11" y="21"
        font-family="'JetBrains Mono', monospace"
        font-size="4" font-weight="700"
        fill="#fab387" text-anchor="middle" opacity="0.60">30%</text>
</svg>