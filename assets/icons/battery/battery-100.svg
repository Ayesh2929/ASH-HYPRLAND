<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a6e3a1"/>
      <stop offset="50%"  stop-color="#94e2d5"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="fillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#a6e3a1" stop-opacity="0.7"/>
      <stop offset="50%"  stop-color="#94e2d5"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <radialGradient id="fullGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a6e3a1" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#a6e3a1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowFull" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCheck" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ambient full glow -->
  <rect x="1" y="6" width="18" height="12" rx="2.5"
        fill="url(#fullGlow)" filter="url(#glowFull)"/>

  <!-- Battery shell -->
  <rect x="1" y="6.5" width="18" height="11" rx="2.2"
        fill="none" stroke="url(#shellGrad)"
        stroke-width="1.7" filter="url(#glowFull)"/>

  <!-- Terminal nub -->
  <rect x="19" y="9.8" width="2.5" height="4.4" rx="1.2"
        fill="url(#shellGrad)" opacity="0.80"/>

  <!-- Fill 100% — complete with gradient -->
  <rect x="2.8" y="8.3" width="14.4" height="7.4" rx="1.2"
        fill="url(#fillGrad)" filter="url(#glowFull)"/>

  <!-- Inner shimmer highlight -->
  <rect x="3.2" y="8.7" width="13.6" height="2.2" rx="1"
        fill="#ffffff" opacity="0.10"/>

  <!-- Check mark (full indicator) -->
  <g filter="url(#glowCheck)">
    <path d="M7.5,11.5 L9.5,13.5 L13.5,9.5"
          fill="none" stroke="#1e1e2e"
          stroke-width="1.6" stroke-linecap="round"
          stroke-linejoin="round" opacity="0.55"/>
  </g>

  <text x="11" y="21"
        font-family="'JetBrains Mono', monospace"
        font-size="4" font-weight="700"
        fill="#a6e3a1" text-anchor="middle" opacity="0.65">100%</text>
</svg>