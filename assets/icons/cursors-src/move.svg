<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="moveGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f9e2af"/>
      <stop offset="100%" stop-color="#fab387"/>
    </linearGradient>
    <filter id="glowMove" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Move cursor — four directional arrows -->
  <!-- Up arrow -->
  <path d="M16,3 L12,9 L14.5,9 L14.5,14 L17.5,14 L17.5,9 L20,9 Z"
        fill="url(#moveGrd)" stroke="#1e1e2e" stroke-width="1.2"
        stroke-linejoin="round" filter="url(#glowMove)"/>

  <!-- Down arrow -->
  <path d="M16,29 L12,23 L14.5,23 L14.5,18 L17.5,18 L17.5,23 L20,23 Z"
        fill="url(#moveGrd)" stroke="#1e1e2e" stroke-width="1.2"
        stroke-linejoin="round" filter="url(#glowMove)"/>

  <!-- Left arrow -->
  <path d="M3,16 L9,12 L9,14.5 L14,14.5 L14,17.5 L9,17.5 L9,20 Z"
        fill="url(#moveGrd)" stroke="#1e1e2e" stroke-width="1.2"
        stroke-linejoin="round" filter="url(#glowMove)"/>

  <!-- Right arrow -->
  <path d="M29,16 L23,12 L23,14.5 L18,14.5 L18,17.5 L23,17.5 L23,20 Z"
        fill="url(#moveGrd)" stroke="#1e1e2e" stroke-width="1.2"
        stroke-linejoin="round" filter="url(#glowMove)"/>

  <!-- Centre dot -->
  <circle cx="16" cy="16" r="2.5"
          fill="url(#moveGrd)" stroke="#1e1e2e"
          stroke-width="1" filter="url(#glowMove)"/>
</svg>