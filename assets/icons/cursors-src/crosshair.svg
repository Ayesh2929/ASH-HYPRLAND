<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="crossGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#94e2d5"/>
      <stop offset="100%" stop-color="#a6e3a1"/>
    </linearGradient>
    <radialGradient id="crossCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a6e3a1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#94e2d5" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowCross" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer circle -->
  <circle cx="16" cy="16" r="12"
          fill="none" stroke="url(#crossGrd)"
          stroke-width="1.6" filter="url(#glowCross)"/>

  <!-- Inner circle -->
  <circle cx="16" cy="16" r="4"
          fill="url(#crossCenter)"
          stroke="url(#crossGrd)" stroke-width="1.2"
          filter="url(#glowCross)"/>

  <!-- Cross lines — horizontal -->
  <line x1="2" y1="16" x2="11" y2="16"
        stroke="url(#crossGrd)" stroke-width="1.8"
        stroke-linecap="round" filter="url(#glowCross)"/>
  <line x1="21" y1="16" x2="30" y2="16"
        stroke="url(#crossGrd)" stroke-width="1.8"
        stroke-linecap="round" filter="url(#glowCross)"/>

  <!-- Cross lines — vertical -->
  <line x1="16" y1="2" x2="16" y2="11"
        stroke="url(#crossGrd)" stroke-width="1.8"
        stroke-linecap="round" filter="url(#glowCross)"/>
  <line x1="16" y1="21" x2="16" y2="30"
        stroke="url(#crossGrd)" stroke-width="1.8"
        stroke-linecap="round" filter="url(#glowCross)"/>

  <!-- Tick marks on circle -->
  <g stroke="url(#crossGrd)" stroke-width="1.2"
     stroke-linecap="round" opacity="0.45">
    <line x1="16" y1="4.5" x2="16" y2="6.5"/>
    <line x1="16" y1="25.5" x2="16" y2="27.5"/>
    <line x1="4.5" y1="16" x2="6.5" y2="16"/>
    <line x1="25.5" y1="16" x2="27.5" y2="16"/>
  </g>
</svg>