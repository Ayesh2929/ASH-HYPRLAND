<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="forbidGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f38ba8"/>
      <stop offset="100%" stop-color="#e64466"/>
    </linearGradient>
    <linearGradient id="forbidFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f38ba8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e64466" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="glowForbid" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.0" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Circle -->
  <circle cx="16" cy="16" r="13"
          fill="url(#forbidFill)" stroke="url(#forbidGrd)"
          stroke-width="2.5" filter="url(#glowForbid)"/>

  <!-- Diagonal slash -->
  <line x1="5.8" y1="5.8" x2="26.2" y2="26.2"
        stroke="url(#forbidGrd)" stroke-width="3.5"
        stroke-linecap="round" filter="url(#glowForbid)"/>

  <!-- Ambient glow -->
  <circle cx="16" cy="16" r="10"
          fill="url(#forbidFill)" filter="url(#glowForbid)"/>
</svg>