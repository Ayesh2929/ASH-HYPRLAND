<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="handGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cdd6f4"/>
      <stop offset="100%" stop-color="#9399b2"/>
    </linearGradient>
    <linearGradient id="tipGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <filter id="dropShadow">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.5"
                    flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Hand base + fingers (pointer/hand cursor) -->
  <g filter="url(#dropShadow)">
    <!-- Index finger (pointing up) -->
    <rect x="13" y="4" width="5" height="14" rx="2.5"
          fill="url(#handGrd)" stroke="#1e1e2e" stroke-width="1.2"/>

    <!-- Middle finger -->
    <rect x="19" y="10" width="4.5" height="11" rx="2.2"
          fill="url(#handGrd)" stroke="#1e1e2e" stroke-width="1.1"/>

    <!-- Ring finger -->
    <rect x="24" y="12" width="4" height="10" rx="2"
          fill="url(#handGrd)" stroke="#1e1e2e" stroke-width="1.1"/>

    <!-- Palm -->
    <path d="M8,18 Q8,14 13,14 L19,14 L19,20 Q19,24 15,25 Q11,25 9,23 Q7,22 8,18 Z"
          fill="url(#handGrd)" stroke="#1e1e2e"
          stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Thumb -->
    <path d="M8,18 Q6,17 5,19 Q4,21 6,23 Q8,25 9,23"
          fill="url(#handGrd)" stroke="#1e1e2e"
          stroke-width="1.1" stroke-linecap="round"/>
  </g>

  <!-- Index finger tip glow (accent) -->
  <ellipse cx="15.5" cy="5" rx="2.5" ry="2"
           fill="url(#tipGrd)" opacity="0.55"/>

  <!-- Knuckle lines -->
  <g stroke="#1e1e2e" stroke-width="0.7" stroke-linecap="round" opacity="0.40">
    <line x1="13" y1="16" x2="18" y2="16"/>
    <line x1="19" y1="18" x2="23.5" y2="18"/>
  </g>
</svg>