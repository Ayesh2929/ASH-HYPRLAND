<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="resizeGrd" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#cba6f7"/>
    </linearGradient>
    <filter id="glowResize" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- SW arrow -->
  <path d="M6,26 L14,26 L10,22 L19,13 L22,16 L26,8 L18,4 L21,7 L12,16 L8,12 L6,20 Z"
        fill="url(#resizeGrd)" stroke="#1e1e2e" stroke-width="1.3"
        stroke-linejoin="round" filter="url(#glowResize)"/>
</svg>