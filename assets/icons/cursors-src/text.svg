<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="ibeamGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <filter id="glowIbeam" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.0" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- I-beam cursor -->
  <g filter="url(#glowIbeam)">
    <!-- Top serif -->
    <line x1="10" y1="5" x2="22" y2="5"
          stroke="url(#ibeamGrd)" stroke-width="2.5"
          stroke-linecap="round"/>
    <!-- Top connector -->
    <line x1="16" y1="5" x2="16" y2="9"
          stroke="url(#ibeamGrd)" stroke-width="1.8"
          stroke-linecap="round"/>

    <!-- Vertical bar -->
    <line x1="16" y1="9" x2="16" y2="23"
          stroke="url(#ibeamGrd)" stroke-width="2"
          stroke-linecap="round"/>

    <!-- Bottom connector -->
    <line x1="16" y1="23" x2="16" y2="27"
          stroke="url(#ibeamGrd)" stroke-width="1.8"
          stroke-linecap="round"/>
    <!-- Bottom serif -->
    <line x1="10" y1="27" x2="22" y2="27"
          stroke="url(#ibeamGrd)" stroke-width="2.5"
          stroke-linecap="round"/>
  </g>

  <!-- Cursor blink highlight (middle accent) -->
  <circle cx="16" cy="16" r="1.5"
          fill="#89b4fa" opacity="0.50"
          filter="url(#glowIbeam)"/>
</svg>