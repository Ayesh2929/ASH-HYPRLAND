<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="resizeGrd" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <filter id="glowResize" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- NW arrow (mirror of NE) -->
  <path d="M6,6 L14,6 L10,10 L19,19 L22,16 L26,24 L18,28 L21,25 L12,16 L8,20 L6,12 Z"
        fill="url(#resizeGrd)" stroke="#1e1e2e" stroke-width="1.3"
        stroke-linejoin="round" filter="url(#glowResize)"/>
</svg>