<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grabGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cdd6f4"/>
      <stop offset="100%" stop-color="#9399b2"/>
    </linearGradient>
    <filter id="dropShadow">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.2"
                    flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Grab hand — open hand, fingers spread upward -->
  <g filter="url(#dropShadow)">
    <!-- Pinky finger -->
    <rect x="5"  y="10" width="3.5" height="10" rx="1.75"
          fill="url(#grabGrd)" stroke="#1e1e2e" stroke-width="1"/>
    <!-- Ring finger -->
    <rect x="9.5" y="8" width="3.5" height="12" rx="1.75"
          fill="url(#grabGrd)" stroke="#1e1e2e" stroke-width="1"/>
    <!-- Middle finger -->
    <rect x="14" y="6" width="3.5" height="14" rx="1.75"
          fill="url(#grabGrd)" stroke="#1e1e2e" stroke-width="1"/>
    <!-- Index finger -->
    <rect x="18.5" y="8" width="3.5" height="12" rx="1.75"
          fill="url(#grabGrd)" stroke="#1e1e2e" stroke-width="1"/>

    <!-- Palm -->
    <path d="M5,18 Q5,24 10,25 L18,25 Q23,25 23,20 L23,18 Q22,20 15.75,20 Q9,20 5,18 Z"
          fill="url(#grabGrd)" stroke="#1e1e2e"
          stroke-width="1.1" stroke-linejoin="round"/>

    <!-- Thumb -->
    <path d="M23,18 Q26,16 27,18 Q28,22 25,25 Q23,26 22,24"
          fill="url(#grabGrd)" stroke="#1e1e2e"
          stroke-width="1.1" stroke-linejoin="round"/>
  </g>

  <!-- Knuckle lines -->
  <g stroke="#1e1e2e" stroke-width="0.6" opacity="0.35" stroke-linecap="round">
    <line x1="5"  y1="16" x2="8.5"  y2="16"/>
    <line x1="9.5" y1="14" x2="13" y2="14"/>
    <line x1="14" y1="12" x2="17.5" y2="12"/>
    <line x1="18.5" y1="14" x2="22" y2="14"/>
  </g>
</svg>