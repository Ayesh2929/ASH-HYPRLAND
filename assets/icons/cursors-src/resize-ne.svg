<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="resizeGrd" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <filter id="glowResize" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Two-headed diagonal arrow (NE direction) -->
  <!-- NE arrow head -->
  <path d="M26,6 L18,6 L22,10 L13,19 L10,16 L6,24 L14,28 L11,25 L20,16 L24,20 L26,12 Z"
        fill="url(#resizeGrd)" stroke="#1e1e2e" stroke-width="1.3"
        stroke-linejoin="round" filter="url(#glowResize)"/>
</svg>