<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="resizeGrd" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#cba6f7"/>
    </linearGradient>
    <filter id="glowResize" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Down arrow -->
  <path d="M16,28 L10,20 L13.5,20 L13.5,4 L18.5,4 L18.5,20 L22,20 Z"
        fill="url(#resizeGrd)" stroke="#1e1e2e" stroke-width="1.3"
        stroke-linejoin="round" filter="url(#glowResize)"/>
</svg>