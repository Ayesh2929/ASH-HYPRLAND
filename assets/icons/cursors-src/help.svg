<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="cursorGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cdd6f4"/>
      <stop offset="100%" stop-color="#9399b2"/>
    </linearGradient>
    <linearGradient id="qGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f9e2af"/>
      <stop offset="100%" stop-color="#fab387"/>
    </linearGradient>
    <filter id="dropShadow">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.2"
                    flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glowQ" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Arrow cursor -->
  <path d="M4,2 L4,22 L8,18 L11.5,25 L14,24 L10.5,17 L16,17 Z"
        fill="url(#cursorGrd)" filter="url(#dropShadow)"/>
  <path d="M4,2 L4,22 L8,18 L11.5,25 L14,24 L10.5,17 L16,17 Z"
        fill="none" stroke="#1e1e2e" stroke-width="1.2"
        stroke-linejoin="round"/>

  <!-- Question mark badge (bottom-right) -->
  <circle cx="23" cy="24" r="7"
          fill="#1e1e2e" stroke="url(#qGrd)"
          stroke-width="1.5" filter="url(#glowQ)"/>

  <!-- ? arc -->
  <path d="M20,21 Q20,18 23,18 Q26,18 26,21 Q26,23 23,23.5 L23,25"
        fill="none" stroke="url(#qGrd)"
        stroke-width="2" stroke-linecap="round"
        filter="url(#glowQ)"/>

  <!-- ? dot -->
  <circle cx="23" cy="28" r="1.3"
          fill="url(#qGrd)" filter="url(#glowQ)"/>
</svg>