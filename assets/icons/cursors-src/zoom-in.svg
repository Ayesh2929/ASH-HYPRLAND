<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="lensGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#94e2d5"/>
    </linearGradient>
    <linearGradient id="lensFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a6e3a1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#94e2d5" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glowLens" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Magnifier circle -->
  <circle cx="13" cy="13" r="10"
          fill="url(#lensFill)" stroke="url(#lensGrd)"
          stroke-width="2.2" filter="url(#glowLens)"/>

  <!-- Inner ring -->
  <circle cx="13" cy="13" r="7"
          fill="none" stroke="url(#lensGrd)"
          stroke-width="0.7" opacity="0.35"/>

  <!-- Plus sign (zoom in) -->
  <g stroke="url(#lensGrd)" stroke-width="2.2"
     stroke-linecap="round" filter="url(#glowLens)">
    <line x1="13" y1="8.5" x2="13" y2="17.5"/>
    <line x1="8.5" y1="13" x2="17.5" y2="13"/>
  </g>

  <!-- Handle -->
  <line x1="20.5" y1="20.5" x2="28" y2="28"
        stroke="url(#lensGrd)" stroke-width="3"
        stroke-linecap="round" filter="url(#glowLens)"/>

  <!-- Handle cap -->
  <circle cx="28" cy="28" r="1.5"
          fill="url(#lensGrd)" opacity="0.70"/>
</svg>