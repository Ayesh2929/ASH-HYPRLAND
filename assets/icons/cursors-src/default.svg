<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="cursorGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cdd6f4"/>
      <stop offset="100%" stop-color="#a6adc8"/>
    </linearGradient>
    <linearGradient id="shadowGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1e1e2e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#11111b" stop-opacity="0.30"/>
    </linearGradient>
    <filter id="dropShadow">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.5"
                    flood-color="#000000" flood-opacity="0.40"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <path d="M4,2 L4,26 L9,21 L13,28 L16,27 L12,20 L19,20 Z"
        fill="url(#shadowGrd)" transform="translate(1.5,2)" opacity="0.50"/>

  <!-- Arrow cursor body -->
  <path d="M4,2 L4,26 L9,21 L13,28 L16,27 L12,20 L19,20 Z"
        fill="url(#cursorGrd)" filter="url(#dropShadow)"/>

  <!-- Inner highlight -->
  <path d="M5,4 L5,22 L9,18 L12.5,24.5 L14,24 L10.5,17.5 L17,17.5 Z"
        fill="#ffffff" opacity="0.15"/>

  <!-- Cursor outline -->
  <path d="M4,2 L4,26 L9,21 L13,28 L16,27 L12,20 L19,20 Z"
        fill="none" stroke="#1e1e2e" stroke-width="1.4"
        stroke-linejoin="round"/>

  <!-- Accent tip glow -->
  <circle cx="4" cy="2" r="1.5" fill="#cba6f7" opacity="0.60"/>
</svg>