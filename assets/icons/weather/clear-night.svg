<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cba6f7"/>
      <stop offset="50%"  stop-color="#b4befe"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="moonFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cba6f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#b4befe" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="starGrd" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </radialGradient>
    <filter id="glowMoon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStar" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Stars -->
  <g filter="url(#glowStar)">
    <circle cx="5"  cy="4"  r="0.9" fill="url(#starGrd)" opacity="0.80"/>
    <circle cx="20" cy="6"  r="0.7" fill="url(#starGrd)" opacity="0.65"/>
    <circle cx="19" cy="3"  r="0.5" fill="#cba6f7" opacity="0.55"/>
    <circle cx="3"  cy="10" r="0.6" fill="#b4befe" opacity="0.50"/>
    <circle cx="21" cy="14" r="0.5" fill="url(#starGrd)" opacity="0.60"/>
    <!-- Sparkle star (top right) -->
    <g transform="translate(20,8)" opacity="0.70">
      <line x1="0" y1="-1.5" x2="0"  y2="1.5"  stroke="#cba6f7" stroke-width="0.7" stroke-linecap="round"/>
      <line x1="-1.5" y1="0" x2="1.5" y2="0"   stroke="#cba6f7" stroke-width="0.7" stroke-linecap="round"/>
      <line x1="-0.9" y1="-0.9" x2="0.9" y2="0.9" stroke="#cba6f7" stroke-width="0.4" stroke-linecap="round" opacity="0.55"/>
      <line x1="0.9"  y1="-0.9" x2="-0.9" y2="0.9" stroke="#cba6f7" stroke-width="0.4" stroke-linecap="round" opacity="0.55"/>
    </g>
  </g>

  <!-- Moon crescent -->
  <path d="M14,4.5 A8,8 0 1,0 14,21.5 A5.5,5.5 0 1,1 14,4.5 Z"
        fill="url(#moonFill)"/>
  <path d="M14,4.5 A8,8 0 1,0 14,21.5 A5.5,5.5 0 1,1 14,4.5 Z"
        fill="none" stroke="url(#moonGrad)"
        stroke-width="1.7" stroke-linejoin="round"
        filter="url(#glowMoon)"/>

  <!-- Crater texture -->
  <circle cx="9" cy="14" r="1.1" fill="none" stroke="#cba6f7"
          stroke-width="0.7" opacity="0.25"/>
  <circle cx="11" cy="9" r="0.7" fill="none" stroke="#b4befe"
          stroke-width="0.6" opacity="0.20"/>
</svg>