<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="cloudGrd1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#9399b2"/>
      <stop offset="100%" stop-color="#6c7086"/>
    </linearGradient>
    <linearGradient id="cloudGrd2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cdd6f4"/>
      <stop offset="100%" stop-color="#9399b2"/>
    </linearGradient>
    <linearGradient id="fill1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#9399b2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6c7086" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="fill2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cdd6f4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9399b2" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="glowCloud" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="0.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Back cloud (darker) -->
  <path d="M18,14 L8,14 Q5.5,14 5.5,11.5 Q5.5,9.5 7.5,9 Q8,7 10.5,7 Q12.5,7 13.5,8.5 Q15,7.8 16.5,8.5 Q19,9.2 19,12 Q21,12.5 21,14.5 Q21,15 18,14 Z"
        fill="url(#fill1)"/>
  <path d="M18,14 L8,14 Q5.5,14 5.5,11.5 Q5.5,9.5 7.5,9 Q8,7 10.5,7 Q12.5,7 13.5,8.5 Q15,7.8 16.5,8.5 Q19,9.2 19,12 Q21,12.5 21,14.5 Q21,15 18,14 Z"
        fill="none" stroke="url(#cloudGrd1)"
        stroke-width="1.5" stroke-linejoin="round"
        opacity="0.65"/>

  <!-- Front cloud (brighter) -->
  <path d="M17,19 L6,19 Q3,19 3,16 Q3,13.5 5.5,13 Q6,10.5 9,10.5 Q11.5,10.5 12.5,12 Q14,11 16,11.5 Q19.5,12 19.5,15.5 Q22,16 22,18 Q22,19 17,19 Z"
        fill="url(#fill2)"/>
  <path d="M17,19 L6,19 Q3,19 3,16 Q3,13.5 5.5,13 Q6,10.5 9,10.5 Q11.5,10.5 12.5,12 Q14,11 16,11.5 Q19.5,12 19.5,15.5 Q22,16 22,18 Q22,19 17,19 Z"
        fill="none" stroke="url(#cloudGrd2)"
        stroke-width="1.6" stroke-linejoin="round"
        filter="url(#glowCloud)"/>

  <!-- Cloud specular -->
  <ellipse cx="8" cy="14" rx="2" ry="0.7"
           fill="#ffffff" opacity="0.12"
           transform="rotate(-20,8,14)"/>
</svg>