<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="fogGrd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#9399b2" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#9399b2" stop-opacity="0.70"/>
      <stop offset="70%"  stop-color="#9399b2" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#9399b2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fogGrd2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6c7086" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#6c7086" stop-opacity="0.55"/>
      <stop offset="75%"  stop-color="#6c7086" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6c7086" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowFog" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fog layers (horizontal bands) -->
  <g filter="url(#glowFog)">
    <!-- Layer 1 (top) -->
    <rect x="2" y="5.5" width="20" height="2.5" rx="1.25"
          fill="url(#fogGrd)" opacity="0.80"/>

    <!-- Layer 2 -->
    <rect x="1" y="9.5" width="22" height="2.5" rx="1.25"
          fill="url(#fogGrd)" opacity="0.90"/>

    <!-- Layer 3 (middle, denser) -->
    <rect x="2" y="13" width="20" height="2.5" rx="1.25"
          fill="url(#fogGrd)" opacity="0.85"/>

    <!-- Layer 4 -->
    <rect x="3" y="16.5" width="18" height="2.5" rx="1.25"
          fill="url(#fogGrd2)" opacity="0.75"/>

    <!-- Layer 5 (bottom, lighter) -->
    <rect x="1" y="20" width="22" height="2" rx="1"
          fill="url(#fogGrd2)" opacity="0.60"/>
  </g>
</svg>