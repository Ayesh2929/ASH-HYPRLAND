<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f9e2af"/>
      <stop offset="60%"  stop-color="#fab387"/>
      <stop offset="100%" stop-color="#f9e2af"/>
    </radialGradient>
    <radialGradient id="sunCore" cx="40%" cy="38%" r="60%">
      <stop offset="0%"   stop-color="#fff8e0"/>
      <stop offset="100%" stop-color="#f9e2af"/>
    </radialGradient>
    <radialGradient id="sunAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f9e2af" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f9e2af" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowSun" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRay" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ambient halo -->
  <circle cx="12" cy="12" r="7" fill="url(#sunAmbient)" filter="url(#glowSun)"/>

  <!-- Sun rays -->
  <g stroke="url(#sunGrad)" stroke-linecap="round" filter="url(#glowRay)">
    <line x1="12" y1="2"   x2="12" y2="4.5"  stroke-width="1.8"/>
    <line x1="12" y1="19.5" x2="12" y2="22" stroke-width="1.8"/>
    <line x1="2"  y1="12"  x2="4.5" y2="12" stroke-width="1.8"/>
    <line x1="19.5" y1="12" x2="22" y2="12" stroke-width="1.8"/>
    <line x1="4.93" y1="4.93" x2="6.7"  y2="6.7"  stroke-width="1.5"/>
    <line x1="17.3" y1="17.3" x2="19.07" y2="19.07" stroke-width="1.5"/>
    <line x1="19.07" y1="4.93" x2="17.3" y2="6.7"  stroke-width="1.5"/>
    <line x1="6.7"  y1="17.3" x2="4.93" y2="19.07" stroke-width="1.5"/>
  </g>

  <!-- Sun disc -->
  <circle cx="12" cy="12" r="4.5"
          fill="url(#sunCore)" filter="url(#glowSun)"/>
  <!-- Specular highlight -->
  <ellipse cx="10.5" cy="10.5" rx="1.4" ry="0.9"
           fill="#ffffff" opacity="0.30"
           transform="rotate(-30,10.5,10.5)"/>
</svg>