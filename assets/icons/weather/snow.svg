<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="cloudGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cdd6f4"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="cloudFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cdd6f4" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="snowGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cdd6f4"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <filter id="glowSnow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Cloud -->
  <path d="M17,12 L6,12 Q3,12 3,9 Q3,6.5 5.5,6 Q6,3.5 9,3.5 Q11.5,3.5 12.5,5 Q14,4 16,4.5 Q19.5,5 19.5,8.5 Q22,9 22,11 Q22,12 17,12 Z"
        fill="url(#cloudFill)"/>
  <path d="M17,12 L6,12 Q3,12 3,9 Q3,6.5 5.5,6 Q6,3.5 9,3.5 Q11.5,3.5 12.5,5 Q14,4 16,4.5 Q19.5,5 19.5,8.5 Q22,9 22,11 Q22,12 17,12 Z"
        fill="none" stroke="url(#cloudGrd)"
        stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Snowflakes -->
  <g filter="url(#glowSnow)">
    <!-- Snowflake 1 -->
    <g transform="translate(7,16)" stroke="url(#snowGrd)" stroke-linecap="round">
      <line x1="0" y1="-2" x2="0"  y2="2"  stroke-width="1.2"/>
      <line x1="-2" y1="0" x2="2"  y2="0"  stroke-width="1.2"/>
      <line x1="-1.4" y1="-1.4" x2="1.4" y2="1.4" stroke-width="0.8"/>
      <line x1="1.4"  y1="-1.4" x2="-1.4" y2="1.4" stroke-width="0.8"/>
    </g>
    <!-- Snowflake 2 -->
    <g transform="translate(12,15.5)" stroke="url(#snowGrd)" stroke-linecap="round">
      <line x1="0" y1="-2" x2="0"  y2="2"  stroke-width="1.2"/>
      <line x1="-2" y1="0" x2="2"  y2="0"  stroke-width="1.2"/>
      <line x1="-1.4" y1="-1.4" x2="1.4" y2="1.4" stroke-width="0.8"/>
      <line x1="1.4"  y1="-1.4" x2="-1.4" y2="1.4" stroke-width="0.8"/>
    </g>
    <!-- Snowflake 3 -->
    <g transform="translate(17,16)" stroke="url(#snowGrd)" stroke-linecap="round">
      <line x1="0" y1="-2" x2="0"  y2="2"  stroke-width="1.2"/>
      <line x1="-2" y1="0" x2="2"  y2="0"  stroke-width="1.2"/>
      <line x1="-1.4" y1="-1.4" x2="1.4" y2="1.4" stroke-width="0.8"/>
      <line x1="1.4"  y1="-1.4" x2="-1.4" y2="1.4" stroke-width="0.8"/>
    </g>
    <!-- Snowflake 4 (lower) -->
    <g transform="translate(9.5,20)" stroke="url(#snowGrd)" stroke-linecap="round" opacity="0.75">
      <line x1="0" y1="-1.6" x2="0"  y2="1.6"  stroke-width="1.0"/>
      <line x1="-1.6" y1="0" x2="1.6" y2="0"  stroke-width="1.0"/>
      <line x1="-1.1" y1="-1.1" x2="1.1" y2="1.1" stroke-width="0.6"/>
      <line x1="1.1"  y1="-1.1" x2="-1.1" y2="1.1" stroke-width="0.6"/>
    </g>
    <!-- Snowflake 5 (lower) -->
    <g transform="translate(14.5,20)" stroke="url(#snowGrd)" stroke-linecap="round" opacity="0.75">
      <line x1="0" y1="-1.6" x2="0"  y2="1.6"  stroke-width="1.0"/>
      <line x1="-1.6" y1="0" x2="1.6" y2="0"  stroke-width="1.0"/>
      <line x1="-1.1" y1="-1.1" x2="1.1" y2="1.1" stroke-width="0.6"/>
      <line x1="1.1"  y1="-1.1" x2="-1.1" y2="1.1" stroke-width="0.6"/>
    </g>
  </g>
</svg>