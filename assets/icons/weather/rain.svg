<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="cloudGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <linearGradient id="cloudFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#89b4fa" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#74c7ec" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="dropGrd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#89b4fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <filter id="glowRain" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Cloud -->
  <path d="M17,13 L6,13 Q3,13 3,10 Q3,7.5 5.5,7 Q6,4.5 9,4.5 Q11.5,4.5 12.5,6 Q14,5 16,5.5 Q19.5,6 19.5,9.5 Q22,10 22,12 Q22,13 17,13 Z"
        fill="url(#cloudFill)"/>
  <path d="M17,13 L6,13 Q3,13 3,10 Q3,7.5 5.5,7 Q6,4.5 9,4.5 Q11.5,4.5 12.5,6 Q14,5 16,5.5 Q19.5,6 19.5,9.5 Q22,10 22,12 Q22,13 17,13 Z"
        fill="none" stroke="url(#cloudGrd)"
        stroke-width="1.6" stroke-linejoin="round"
        filter="url(#glowRain)"/>

  <!-- Rain drops (diagonal) -->
  <g stroke="url(#dropGrd)" stroke-linecap="round"
     stroke-width="1.6" filter="url(#glowRain)">
    <line x1="7"  y1="16" x2="5.5"  y2="20"/>
    <line x1="12" y1="15" x2="10.5" y2="19"/>
    <line x1="17" y1="16" x2="15.5" y2="20"/>
    <line x1="9.5" y1="19.5" x2="8"  y2="23" opacity="0.65"/>
    <line x1="14.5" y1="19"  x2="13" y2="23" opacity="0.65"/>
  </g>
</svg>