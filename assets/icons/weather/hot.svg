<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <radialGradient id="sunGrd" cx="40%" cy="38%" r="62%">
      <stop offset="0%"   stop-color="#fff8e0"/>
      <stop offset="100%" stop-color="#fab387"/>
    </radialGradient>
    <linearGradient id="heatGrd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f38ba8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f38ba8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="thermGrd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f38ba8"/>
      <stop offset="100%" stop-color="#cc1133"/>
    </linearGradient>
    <filter id="glowHot" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowTherm" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sun (left side) -->
  <g filter="url(#glowHot)">
    <circle cx="7" cy="8.5" r="4.5" fill="url(#sunGrd)" opacity="0.90"/>
    <!-- Rays -->
    <g stroke="#f9e2af" stroke-linecap="round" stroke-width="1.5" opacity="0.75">
      <line x1="7"   y1="3"   x2="7"   y2="4.5"/>
      <line x1="7"   y1="12.5" x2="7" y2="14"/>
      <line x1="2"   y1="8.5" x2="3.5" y2="8.5"/>
      <line x1="10.5" y1="8.5" x2="12" y2="8.5"/>
      <line x1="4"   y1="5.5" x2="5"   y2="6.5"/>
      <line x1="9"   y1="10.5" x2="10" y2="11.5"/>
      <line x1="10"  y1="5.5" x2="9"   y2="6.5"/>
      <line x1="5"   y1="10.5" x2="4"  y2="11.5"/>
    </g>
  </g>

  <!-- Heat shimmer waves -->
  <g filter="url(#glowHot)" opacity="0.70">
    <path d="M13,6 Q14.5,4 16,6 Q17.5,8 19,6"
          fill="none" stroke="#f38ba8" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M13,10 Q14.5,8 16,10 Q17.5,12 19,10"
          fill="none" stroke="#f38ba8" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M13,14 Q14.5,12 16,14 Q17.5,16 19,14"
          fill="none" stroke="#fab387" stroke-width="1.2" stroke-linecap="round" opacity="0.80"/>
  </g>

  <!-- Thermometer -->
  <g filter="url(#glowTherm)">
    <!-- tube -->
    <rect x="19.5" y="4" width="3" height="13" rx="1.5"
          fill="none" stroke="#f38ba8" stroke-width="1.3"/>
    <!-- mercury fill — high (hot) -->
    <rect x="20" y="6.5" width="2" height="10" rx="1"
          fill="url(#thermGrd)"/>
    <!-- bulb -->
    <circle cx="21" cy="18.5" r="2.5"
            fill="url(#thermGrd)" filter="url(#glowTherm)"/>
    <circle cx="20.2" cy="17.7" r="0.8"
            fill="#ffffff" opacity="0.22"/>
    <!-- degree marks -->
    <g stroke="#f38ba8" stroke-width="0.8" opacity="0.50">
      <line x1="22.8" y1="7"  x2="24" y2="7"/>
      <line x1="22.8" y1="10" x2="24" y2="10"/>
      <line x1="22.8" y1="13" x2="24" y2="13"/>
    </g>
  </g>
</svg>