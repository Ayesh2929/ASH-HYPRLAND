<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="moonGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="cloudGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#585b70"/>
      <stop offset="100%" stop-color="#45475a"/>
    </linearGradient>
    <linearGradient id="cloudFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#585b70" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#45475a" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="glowMoon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCloud" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="0.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Stars -->
  <circle cx="4"  cy="4.5" r="0.7" fill="#cba6f7" opacity="0.65"/>
  <circle cx="20" cy="5"   r="0.5" fill="#b4befe" opacity="0.55"/>
  <circle cx="3"  cy="9"   r="0.5" fill="#89b4fa" opacity="0.50"/>

  <!-- Moon (small, top-left) -->
  <path d="M8.5,3.5 A5,5 0 1,0 8.5,13.5 A3.5,3.5 0 1,1 8.5,3.5 Z"
        fill="none" stroke="url(#moonGrd)"
        stroke-width="1.5" stroke-linejoin="round"
        filter="url(#glowMoon)"/>

  <!-- Cloud -->
  <path d="M19,17 L7,17 Q4,17 4,14 Q4,11.5 6.5,11 Q7,8.5 10,8.5 Q12,8.5 13,10 Q14,9 15.5,9.5 Q18.5,10 18.5,13 Q21,13.5 21,16 Q21,17 19,17 Z"
        fill="url(#cloudFill)"/>
  <path d="M19,17 L7,17 Q4,17 4,14 Q4,11.5 6.5,11 Q7,8.5 10,8.5 Q12,8.5 13,10 Q14,9 15.5,9.5 Q18.5,10 18.5,13 Q21,13.5 21,16 Q21,17 19,17 Z"
        fill="none" stroke="url(#cloudGrd)"
        stroke-width="1.5" stroke-linejoin="round"
        filter="url(#glowCloud)"/>
</svg>