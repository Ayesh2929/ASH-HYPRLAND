<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="cloudGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#9399b2"/>
      <stop offset="100%" stop-color="#7f849c"/>
    </linearGradient>
    <linearGradient id="cloudFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#9399b2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7f849c" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="dropGrd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#89b4fa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#74c7ec" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glowDrz" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Cloud -->
  <path d="M17,13 L6,13 Q3,13 3,10 Q3,7.5 5.5,7 Q6,4.5 9,4.5 Q11.5,4.5 12.5,6 Q14,5 16,5.5 Q19.5,6 19.5,9.5 Q22,10 22,12 Q22,13 17,13 Z"
        fill="url(#cloudFill)"/>
  <path d="M17,13 L6,13 Q3,13 3,10 Q3,7.5 5.5,7 Q6,4.5 9,4.5 Q11.5,4.5 12.5,6 Q14,5 16,5.5 Q19.5,6 19.5,9.5 Q22,10 22,12 Q22,13 17,13 Z"
        fill="none" stroke="url(#cloudGrd)"
        stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Light drizzle drops (small, sparse) -->
  <g stroke="url(#dropGrd)" stroke-linecap="round"
     stroke-width="1.2" filter="url(#glowDrz)">
    <line x1="7.5"  y1="15.5" x2="6.5"  y2="18.5" opacity="0.80"/>
    <line x1="12"   y1="15"   x2="11"   y2="18"   opacity="0.80"/>
    <line x1="16.5" y1="15.5" x2="15.5" y2="18.5" opacity="0.80"/>
    <line x1="9.5"  y1="18.5" x2="8.5"  y2="21"   opacity="0.55"/>
    <line x1="14"   y1="18"   x2="13"   y2="20.5" opacity="0.55"/>
  </g>
</svg>