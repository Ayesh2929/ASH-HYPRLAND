<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="unkGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6c7086"/>
      <stop offset="100%" stop-color="#45475a"/>
    </linearGradient>
    <linearGradient id="unkFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6c7086" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#45475a" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="qMarkGrd" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#9399b2"/>
      <stop offset="100%" stop-color="#585b70"/>
    </radialGradient>
    <filter id="glowUnk" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Unknown cloud silhouette -->
  <path d="M17,14 L6,14 Q3,14 3,11 Q3,8.5 5.5,8 Q6,5.5 9,5.5 Q11.5,5.5 12.5,7 Q14,6 16,6.5 Q19.5,7 19.5,10.5 Q22,11 22,13 Q22,14 17,14 Z"
        fill="url(#unkFill)"/>
  <path d="M17,14 L6,14 Q3,14 3,11 Q3,8.5 5.5,8 Q6,5.5 9,5.5 Q11.5,5.5 12.5,7 Q14,6 16,6.5 Q19.5,7 19.5,10.5 Q22,11 22,13 Q22,14 17,14 Z"
        fill="none" stroke="url(#unkGrd)"
        stroke-width="1.5" stroke-linejoin="round"
        opacity="0.60"/>

  <!-- Question mark -->
  <g filter="url(#glowUnk)">
    <!-- Q mark arc -->
    <path d="M9.5,18 Q9.5,15 12,14.5 Q14,14 14.5,15.5 Q15,17 13,18 Q12,18.5 12,20"
          fill="none" stroke="url(#qMarkGrd)"
          stroke-width="1.7" stroke-linecap="round"/>
    <!-- Q mark dot -->
    <circle cx="12" cy="22" r="1.1"
            fill="url(#qMarkGrd)"/>
  </g>
</svg>