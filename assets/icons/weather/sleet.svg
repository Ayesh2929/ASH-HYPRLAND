<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="cloudGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#9399b2"/>
      <stop offset="100%" stop-color="#6c7086"/>
    </linearGradient>
    <linearGradient id="cloudFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#9399b2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6c7086" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="rainGrd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#89b4fa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <linearGradient id="iceGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cdd6f4"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <filter id="glowSleet" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Cloud -->
  <path d="M17,12 L6,12 Q3,12 3,9 Q3,6.5 5.5,6 Q6,3.5 9,3.5 Q11.5,3.5 12.5,5 Q14,4 16,4.5 Q19.5,5 19.5,8.5 Q22,9 22,11 Q22,12 17,12 Z"
        fill="url(#cloudFill)"/>
  <path d="M17,12 L6,12 Q3,12 3,9 Q3,6.5 5.5,6 Q6,3.5 9,3.5 Q11.5,3.5 12.5,5 Q14,4 16,4.5 Q19.5,5 19.5,8.5 Q22,9 22,11 Q22,12 17,12 Z"
        fill="none" stroke="url(#cloudGrd)"
        stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Rain drops -->
  <g stroke="url(#rainGrd)" stroke-linecap="round"
     stroke-width="1.4" filter="url(#glowSleet)">
    <line x1="7"  y1="14" x2="6"  y2="17"/>
    <line x1="17" y1="14" x2="16" y2="17"/>
  </g>

  <!-- Ice pellets (small circles) -->
  <g filter="url(#glowSleet)">
    <circle cx="12" cy="16" r="1.4"
            fill="none" stroke="url(#iceGrd)" stroke-width="1.3"/>
    <circle cx="8.5" cy="19" r="1.2"
            fill="none" stroke="url(#iceGrd)" stroke-width="1.2" opacity="0.85"/>
    <circle cx="15.5" cy="19" r="1.2"
            fill="none" stroke="url(#iceGrd)" stroke-width="1.2" opacity="0.85"/>
    <circle cx="12"  cy="21.5" r="1.0"
            fill="none" stroke="url(#iceGrd)" stroke-width="1.0" opacity="0.65"/>
  </g>
</svg>