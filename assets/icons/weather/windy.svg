<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="windGrd1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#89b4fa" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="windGrd2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#74c7ec" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#74c7ec"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="windGrd3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#cba6f7" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glowWind" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Wind streams -->
  <g filter="url(#glowWind)">
    <!-- Stream 1 — top, long, curls right -->
    <path d="M2,6 Q8,4.5 13,6 Q17,7 19,5.5 Q21,4 20,2.5"
          fill="none" stroke="url(#windGrd1)"
          stroke-width="2" stroke-linecap="round"/>

    <!-- Stream 2 — mid, full width -->
    <path d="M2,10 Q10,8.5 15,10.5 Q19,12 21,10"
          fill="none" stroke="url(#windGrd2)"
          stroke-width="2" stroke-linecap="round"/>

    <!-- Stream 3 — mid-lower -->
    <path d="M4,14 Q11,12.5 17,14 Q20,15 22,13.5"
          fill="none" stroke="url(#windGrd1)"
          stroke-width="1.7" stroke-linecap="round" opacity="0.85"/>

    <!-- Stream 4 — bottom, shorter -->
    <path d="M2,18 Q8,16.5 12,18 Q16,19.5 18,18"
          fill="none" stroke="url(#windGrd3)"
          stroke-width="1.6" stroke-linecap="round" opacity="0.80"/>

    <!-- Stream 5 — lowest, gentle -->
    <path d="M5,21.5 Q10,20.5 14,21.5"
          fill="none" stroke="url(#windGrd2)"
          stroke-width="1.4" stroke-linecap="round" opacity="0.60"/>
  </g>
</svg>