<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="tornGrd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cba6f7"/>
      <stop offset="50%"  stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <linearGradient id="tornFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cba6f7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="glowTorn" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Tornado funnel (tapering from top-wide to bottom-narrow) -->
  <!-- Fill bands -->
  <path d="M3,4 L21,4 Q20,8 17,10 Q15,11 12,11 Q9,11 7,10 Q4,8 3,4 Z"
        fill="url(#tornFill)"/>
  <path d="M5,11 Q8,13 12,13 Q16,13 19,11 Q18,15 16,17 Q14,18 12,18 Q10,18 8,17 Q6,15 5,11 Z"
        fill="url(#tornFill)" opacity="0.70"/>
  <path d="M8,18 Q9.5,20 12,20 Q14.5,20 16,18 Q15.5,21 14,22.5 Q13,23.5 12,23.5 Q11,23.5 10,22.5 Q8.5,21 8,18 Z"
        fill="url(#tornFill)" opacity="0.55"/>

  <!-- Stroke outlines (funnel rings) -->
  <g stroke="url(#tornGrd)" fill="none" stroke-linejoin="round"
     filter="url(#glowTorn)">
    <!-- Wide top -->
    <path d="M3,4 L21,4 Q20,8 17,10 Q15,11 12,11 Q9,11 7,10 Q4,8 3,4 Z"
          stroke-width="1.6"/>
    <!-- Mid -->
    <path d="M5,11 Q8,13 12,13 Q16,13 19,11 Q18,15 16,17 Q14,18 12,18 Q10,18 8,17 Q6,15 5,11 Z"
          stroke-width="1.5"/>
    <!-- Narrow bottom -->
    <path d="M8,18 Q9.5,20 12,20 Q14.5,20 16,18 Q15.5,21 14,22.5 Q13,23.5 12,23.5 Q11,23.5 10,22.5 Q8.5,21 8,18 Z"
          stroke-width="1.4"/>
  </g>

  <!-- Rotation swirl lines (horizontal) -->
  <g stroke="url(#tornGrd)" stroke-linecap="round" opacity="0.40">
    <path d="M4,6 Q7,5.5 12,6 Q17,6.5 20,6" fill="none" stroke-width="1"/>
    <path d="M6,8 Q9,7.5 12,8 Q15,8.5 18,8" fill="none" stroke-width="0.8"/>
    <path d="M7,13.5 Q9.5,13 12,13.5 Q14.5,14 17,13.5" fill="none" stroke-width="0.7"/>
  </g>
</svg>