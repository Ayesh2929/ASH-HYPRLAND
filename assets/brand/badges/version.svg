<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<!--
╔══════════════════════════════════════════════════════════════════════════════╗
║  🏷️  ASH DOTFILES v5.0 OMEGA — VERSION BADGE                                ║
║  Dynamic version display with animated Catppuccin Mocha palette             ║
║  Dimensions: 148 × 28px  ·  Accessible  ·  GitHub-safe                     ║
╚══════════════════════════════════════════════════════════════════════════════╝
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 148 28"
  width="148"
  height="28"
  shape-rendering="geometricPrecision"
  text-rendering="geometricPrecision"
  role="img"
  aria-label="ASH Dotfiles version 5.0.0-omega">

  <title>version: v5.0.0-omega</title>
  <desc>ASH Dotfiles version badge showing v5.0.0-omega</desc>

  <defs>

    <style><![CDATA[
      .vb-label-text {
        animation: vb-label-breathe 6s ease-in-out infinite;
      }
      .vb-value-text {
        animation: vb-value-shimmer 4s ease-in-out infinite;
      }
      .vb-rocket {
        animation: vb-rocket-hover 3s ease-in-out infinite;
        transform-origin: 128px 14px;
      }
      .vb-glow-ring {
        animation: vb-glow-pulse 4s ease-in-out infinite;
        transform-origin: 74px 14px;
      }
      .vb-accent-bar {
        animation: vb-bar-slide 3s ease-in-out infinite;
      }
      .vb-left-shimmer {
        animation: vb-shimmer-left 5s ease-in-out infinite;
      }
      .vb-right-shimmer {
        animation: vb-shimmer-right 4s ease-in-out infinite 1s;
      }
      .vb-particle-1 { animation: vb-particle 3.2s ease-out 0.5s infinite; }
      .vb-particle-2 { animation: vb-particle 4.1s ease-out 1.2s infinite; }
      .vb-particle-3 { animation: vb-particle 3.8s ease-out 2.1s infinite; }
      .vb-dot-1 { animation: vb-dot-pulse 2s ease-in-out 0s infinite; }
      .vb-dot-2 { animation: vb-dot-pulse 2s ease-in-out 0.66s infinite; }
      .vb-dot-3 { animation: vb-dot-pulse 2s ease-in-out 1.33s infinite; }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }

      @keyframes vb-label-breathe {
        0%,100% { opacity: 0.9; }
        50%      { opacity: 1;   }
      }
      @keyframes vb-value-shimmer {
        0%,100% { filter: brightness(1);    }
        50%      { filter: brightness(1.15); }
      }
      @keyframes vb-rocket-hover {
        0%,100% { transform: translateY(0) rotate(0deg);   }
        33%      { transform: translateY(-1.5px) rotate(5deg);  }
        66%      { transform: translateY(1px) rotate(-3deg); }
      }
      @keyframes vb-glow-pulse {
        0%,100% { opacity: 0.4; }
        50%      { opacity: 0.8; }
      }
      @keyframes vb-bar-slide {
        0%,100% { transform: scaleX(1);    opacity: 0.7; }
        50%      { transform: scaleX(0.96); opacity: 1;   }
      }
      @keyframes vb-shimmer-left {
        0%   { transform: translateX(-50px); opacity: 0; }
        20%  { opacity: 0.5; }
        80%  { opacity: 0.5; }
        100% { transform: translateX(80px);  opacity: 0; }
      }
      @keyframes vb-shimmer-right {
        0%   { transform: translateX(-30px); opacity: 0; }
        20%  { opacity: 0.4; }
        80%  { opacity: 0.4; }
        100% { transform: translateX(100px); opacity: 0; }
      }
      @keyframes vb-particle {
        0%   { transform: translate(0,0) scale(0); opacity: 0; }
        10%  { opacity: 1; }
        60%  { transform: translate(var(--px,4px),var(--py,-8px)) scale(1.3); opacity: 0.7; }
        100% { transform: translate(var(--px2,6px),var(--py2,-14px)) scale(0); opacity: 0; }
      }
      @keyframes vb-dot-pulse {
        0%,100% { opacity: 0.4; transform: scale(0.8); }
        50%      { opacity: 1;   transform: scale(1.3); }
      }
    ]]></style>

    <!-- ── GRADIENTS ─────────────────────────────────────────────────── -->

    <!-- Label bg — deep dark with slight blue tint -->
    <linearGradient id="vb-g-label" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#24243E"/>
      <stop offset="100%" stop-color="#1E1E2E"/>
    </linearGradient>

    <!-- Value bg — Catppuccin animated spectrum -->
    <linearGradient id="vb-g-value" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#89B4FA">
        <animate attributeName="stop-color"
          values="#89B4FA;#CBA6F7;#89DCEB;#A6E3A1;#89B4FA"
          dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#74C7EC">
        <animate attributeName="stop-color"
          values="#74C7EC;#89B4FA;#CBA6F7;#74C7EC;#74C7EC"
          dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Value bg overlay — darker tint for readability -->
    <linearGradient id="vb-g-value-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#11111B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#11111B" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Border gradient — top to bottom -->
    <linearGradient id="vb-g-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#89B4FA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#74C7EC" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glow radial -->
    <radialGradient id="vb-g-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#89B4FA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#89B4FA" stop-opacity="0"/>
    </radialGradient>

    <!-- Shimmer -->
    <linearGradient id="vb-g-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Inner glass highlight -->
    <linearGradient id="vb-g-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Particle fills -->
    <radialGradient id="vb-pf1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#89B4FA"/>
      <stop offset="100%" stop-color="#89B4FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vb-pf2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CBA6F7"/>
      <stop offset="100%" stop-color="#CBA6F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vb-pf3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A6E3A1"/>
      <stop offset="100%" stop-color="#A6E3A1" stop-opacity="0"/>
    </radialGradient>

    <!-- ── FILTERS ────────────────────────────────────────────────────── -->

    <!-- Badge shadow -->
    <filter id="vb-f-shadow" x="-4%" y="-14%" width="108%" height="128%">
      <feDropShadow dx="0" dy="2" stdDeviation="3"
        flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Value glow -->
    <filter id="vb-f-value-glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feFlood flood-color="#89B4FA" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Crest glow -->
    <filter id="vb-f-crest" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>

    <!-- ── CLIP PATHS ─────────────────────────────────────────────────── -->

    <clipPath id="vb-clip-all">
      <rect x="0" y="0" width="148" height="28" rx="6"/>
    </clipPath>
    <clipPath id="vb-clip-label">
      <rect x="0" y="0" width="66" height="28" rx="0"/>
    </clipPath>
    <clipPath id="vb-clip-value">
      <rect x="66" y="0" width="82" height="28" rx="0"/>
    </clipPath>

  </defs>

  <!-- ════════════════════════════════════════════════════════════════════
       BADGE BODY
       ════════════════════════════════════════════════════════════════════ -->
  <g clip-path="url(#vb-clip-all)" filter="url(#vb-f-shadow)">

    <!-- ── LABEL SECTION (left) ──────────────────────────────────────── -->
    <g clip-path="url(#vb-clip-label)">

      <!-- Background -->
      <rect x="0" y="0" width="66" height="28" fill="url(#vb-g-label)"/>

      <!-- Subtle dot texture -->
      <circle cx="8"  cy="8"  r="0.8" fill="#89B4FA" opacity="0.12"/>
      <circle cx="20" cy="20" r="0.8" fill="#89B4FA" opacity="0.1"/>
      <circle cx="40" cy="8"  r="0.8" fill="#89B4FA" opacity="0.08"/>
      <circle cx="55" cy="20" r="0.8" fill="#89B4FA" opacity="0.1"/>

      <!-- Glass top edge -->
      <rect x="0" y="0" width="66" height="14" fill="url(#vb-g-glass)"/>

      <!-- Shimmer sweep -->
      <rect class="vb-left-shimmer" x="-50" y="0" width="30" height="28"
        fill="url(#vb-g-shimmer)" clip-path="url(#vb-clip-label)" opacity="0.4"/>

      <!-- ⚡ Icon -->
      <text x="10" y="19"
        font-family="system-ui,sans-serif"
        font-size="12"
        fill="#89B4FA"
        opacity="0.9">⚡</text>

      <!-- "version" label -->
      <text class="vb-label-text"
        x="26" y="18.5"
        font-family="'SF Mono','JetBrains Mono','Cascadia Code',monospace"
        font-size="9.5"
        font-weight="600"
        letter-spacing="0.8"
        fill="#A6ADC8">version</text>

    </g>

    <!-- ── DIVIDER ─────────────────────────────────────────────────────── -->
    <rect x="65" y="0" width="1" height="28" fill="#89B4FA" opacity="0.35"/>

    <!-- ── VALUE SECTION (right) ─────────────────────────────────────── -->
    <g clip-path="url(#vb-clip-value)">

      <!-- Animated gradient base -->
      <rect x="66" y="0" width="82" height="28" fill="url(#vb-g-value)"/>
      <!-- Dark overlay for readability -->
      <rect x="66" y="0" width="82" height="28" fill="url(#vb-g-value-dark)"/>

      <!-- Glass top edge -->
      <rect x="66" y="0" width="82" height="12" fill="url(#vb-g-glass)"/>

      <!-- Shimmer sweep -->
      <rect class="vb-right-shimmer" x="36" y="0" width="28" height="28"
        fill="url(#vb-g-shimmer)" clip-path="url(#vb-clip-value)" opacity="0.5"/>

      <!-- "v5.0.0-omega" value text -->
      <text class="vb-value-text"
        x="74" y="18.5"
        font-family="'SF Mono','JetBrains Mono','Cascadia Code',monospace"
        font-size="10"
        font-weight="700"
        letter-spacing="-0.3"
        fill="#CDD6F4"
        filter="url(#vb-f-value-glow)">v5.0.0-omega</text>

      <!-- 🚀 Emoji right side -->
      <g class="vb-rocket">
        <text x="134" y="19"
          font-family="system-ui,sans-serif"
          font-size="11"
          fill="#FFFFFF"
          opacity="0.9">🚀</text>
      </g>

    </g>

    <!-- ── OUTER BORDER ───────────────────────────────────────────────── -->
    <rect x="0.5" y="0.5" width="147" height="27" rx="5.5"
      fill="none"
      stroke="url(#vb-g-border)"
      stroke-width="1"/>

    <!-- Top accent line — animated gradient -->
    <rect class="vb-accent-bar"
      x="0" y="0" width="148" height="1.5" rx="1"
      fill="url(#vb-g-value)" opacity="0.8"
      style="transform-origin:0 0"/>

  </g>

  <!-- ── GLOW RING behind badge ────────────────────────────────────────── -->
  <ellipse class="vb-glow-ring" cx="74" cy="14" rx="74" ry="14"
    fill="url(#vb-g-glow)"/>

  <!-- ── PARTICLES ─────────────────────────────────────────────────────── -->
  <circle class="vb-particle-1" cx="136" cy="22" r="2"
    fill="url(#vb-pf1)" style="--px:3px;--py:-7px;--px2:5px;--py2:-13px"/>
  <circle class="vb-particle-2" cx="140" cy="18" r="1.5"
    fill="url(#vb-pf2)" style="--px:-2px;--py:-6px;--px2:-4px;--py2:-12px"/>
  <circle class="vb-particle-3" cx="133" cy="24" r="1.8"
    fill="url(#vb-pf3)" style="--px:4px;--py:-8px;--px2:7px;--py2:-15px"/>

  <!-- ── STATUS DOTS ────────────────────────────────────────────────────── -->
  <!-- Activity pulse dots below badge -->
  <circle class="vb-dot-1" cx="60"  cy="26" r="1.5" fill="#89B4FA" opacity="0.4"/>
  <circle class="vb-dot-2" cx="65"  cy="26" r="1.5" fill="#89B4FA" opacity="0.4"/>
  <circle class="vb-dot-3" cx="70"  cy="26" r="1.5" fill="#89B4FA" opacity="0.4"/>

</svg>