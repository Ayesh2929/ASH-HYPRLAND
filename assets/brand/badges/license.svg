<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<!--
╔══════════════════════════════════════════════════════════════════════════════╗
║  ⚖️  ASH DOTFILES v5.0 OMEGA — LICENSE BADGE                                ║
║  MIT License badge with animated Catppuccin green palette                  ║
║  Dimensions: 106 × 28px  ·  Accessible  ·  GitHub-safe                    ║
╚══════════════════════════════════════════════════════════════════════════════╝
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 106 28"
  width="106"
  height="28"
  shape-rendering="geometricPrecision"
  text-rendering="geometricPrecision"
  role="img"
  aria-label="License: MIT">

  <title>license: MIT</title>
  <desc>ASH Dotfiles license badge — MIT open source license</desc>

  <defs>

    <style><![CDATA[
      .lb-label-text   { animation: lb-label-breathe  6s ease-in-out infinite; }
      .lb-value-text   { animation: lb-value-glow     4s ease-in-out infinite; }
      .lb-scales       { animation: lb-scales-sway    4s ease-in-out infinite; transform-origin: 10px 14px; }
      .lb-scales-r     { animation: lb-scales-sway-r  4s ease-in-out infinite; transform-origin: 10px 14px; }
      .lb-checkmark    { animation: lb-check-bounce   3s ease-in-out infinite; transform-origin: 90px 14px; }
      .lb-shield       { animation: lb-shield-pulse   5s ease-in-out infinite; transform-origin: 91px 14px; }
      .lb-glow         { animation: lb-glow-breathe   4s ease-in-out infinite; transform-origin: 53px 14px; }
      .lb-shimmer      { animation: lb-shimmer-sweep  5s ease-in-out 1s infinite; }
      .lb-accent-top   { animation: lb-accent-pulse   3s ease-in-out infinite; transform-origin: 0 0; }
      .lb-spark-1      { animation: lb-spark 3.5s ease-out 0.3s infinite; }
      .lb-spark-2      { animation: lb-spark 4.2s ease-out 1.4s infinite; }
      .lb-spark-3      { animation: lb-spark 3.8s ease-out 2.5s infinite; }
      .lb-coin         { animation: lb-coin-spin 6s linear infinite; transform-origin: 94px 14px; }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }

      @keyframes lb-label-breathe {
        0%,100% { opacity: 0.9; }
        50%      { opacity: 1;   }
      }
      @keyframes lb-value-glow {
        0%,100% { filter: brightness(1);    }
        50%      { filter: brightness(1.18); }
      }
      @keyframes lb-scales-sway {
        0%,100% { transform: rotate(0deg);   }
        25%      { transform: rotate(-8deg);  }
        75%      { transform: rotate(8deg);   }
      }
      @keyframes lb-scales-sway-r {
        0%,100% { transform: rotate(0deg);  }
        25%      { transform: rotate(8deg);  }
        75%      { transform: rotate(-8deg); }
      }
      @keyframes lb-check-bounce {
        0%,100% { transform: scale(1)    translateY(0);    }
        33%      { transform: scale(1.15) translateY(-1px); }
        66%      { transform: scale(0.95) translateY(0.5px); }
      }
      @keyframes lb-shield-pulse {
        0%,100% { opacity: 0.7; }
        50%      { opacity: 1;   }
      }
      @keyframes lb-glow-breathe {
        0%,100% { opacity: 0.35; transform: scale(1);    }
        50%      { opacity: 0.65; transform: scale(1.06); }
      }
      @keyframes lb-shimmer-sweep {
        0%   { transform: translateX(-50px) skewX(-8deg); opacity: 0; }
        20%  { opacity: 0.5; }
        80%  { opacity: 0.5; }
        100% { transform: translateX(150px) skewX(-8deg); opacity: 0; }
      }
      @keyframes lb-accent-pulse {
        0%,100% { opacity: 0.7; transform: scaleX(1);    }
        50%      { opacity: 1;   transform: scaleX(0.97); }
      }
      @keyframes lb-spark {
        0%   { transform: translate(0,0) scale(0); opacity: 0; }
        8%   { opacity: 1; }
        55%  { transform: translate(var(--lx,3px),var(--ly,-7px)) scale(1.4); opacity: 0.8; }
        100% { transform: translate(var(--lx2,5px),var(--ly2,-13px)) scale(0); opacity: 0; }
      }
      @keyframes lb-coin-spin {
        0%   { transform: rotateY(0deg);   }
        100% { transform: rotateY(360deg); }
      }
    ]]></style>

    <!-- ── GRADIENTS ──────────────────────────────────────────────────── -->

    <!-- Label bg -->
    <linearGradient id="lb-g-label" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#24243E"/>
      <stop offset="100%" stop-color="#1E1E2E"/>
    </linearGradient>

    <!-- Value bg — animated Catppuccin green spectrum -->
    <linearGradient id="lb-g-value" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#A6E3A1">
        <animate attributeName="stop-color"
          values="#A6E3A1;#94E2D5;#89DCEB;#A6E3A1"
          dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#40A02B">
        <animate attributeName="stop-color"
          values="#40A02B;#179299;#A6E3A1;#40A02B"
          dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Value dark overlay -->
    <linearGradient id="lb-g-value-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0D1F0D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0A1A0A" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Border -->
    <linearGradient id="lb-g-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#A6E3A1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#40A02B" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glow radial -->
    <radialGradient id="lb-g-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#A6E3A1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A6E3A1" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass -->
    <linearGradient id="lb-g-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="55%"  stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Shimmer -->
    <linearGradient id="lb-g-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Particle fills -->
    <radialGradient id="lb-pf1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A6E3A1"/>
      <stop offset="100%" stop-color="#A6E3A1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lb-pf2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#94E2D5"/>
      <stop offset="100%" stop-color="#94E2D5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lb-pf3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F9E2AF"/>
      <stop offset="100%" stop-color="#F9E2AF" stop-opacity="0"/>
    </radialGradient>

    <!-- ── FILTERS ────────────────────────────────────────────────────── -->

    <filter id="lb-f-shadow" x="-4%" y="-14%" width="108%" height="128%">
      <feDropShadow dx="0" dy="2" stdDeviation="3"
        flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="lb-f-value-glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feFlood flood-color="#A6E3A1" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lb-f-icon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="lb-f-scales" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>

    <!-- ── CLIP PATHS ─────────────────────────────────────────────────── -->

    <clipPath id="lb-clip-all">
      <rect x="0" y="0" width="106" height="28" rx="6"/>
    </clipPath>
    <clipPath id="lb-clip-label">
      <rect x="0" y="0" width="56" height="28"/>
    </clipPath>
    <clipPath id="lb-clip-value">
      <rect x="56" y="0" width="50" height="28"/>
    </clipPath>

  </defs>

  <!-- ════════════════════════════════════════════════════════════════════
       BADGE BODY
       ════════════════════════════════════════════════════════════════════ -->
  <g clip-path="url(#lb-clip-all)" filter="url(#lb-f-shadow)">

    <!-- ── LABEL SECTION ─────────────────────────────────────────────── -->
    <g clip-path="url(#lb-clip-label)">

      <rect x="0" y="0" width="56" height="28" fill="url(#lb-g-label)"/>

      <!-- Micro dot texture -->
      <circle cx="6"  cy="6"  r="0.8" fill="#A6E3A1" opacity="0.1"/>
      <circle cx="22" cy="22" r="0.8" fill="#A6E3A1" opacity="0.08"/>
      <circle cx="44" cy="10" r="0.8" fill="#A6E3A1" opacity="0.1"/>

      <!-- Glass -->
      <rect x="0" y="0" width="56" height="13" fill="url(#lb-g-glass)"/>

      <!-- ⚖️ Scales of justice icon — custom drawn -->
      <g transform="translate(7, 7)">
        <!-- Center pole -->
        <line x1="5" y1="0" x2="5" y2="10"
          stroke="#A6E3A1" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
        <!-- Crossbar -->
        <line x1="0" y1="2" x2="10" y2="2"
          stroke="#A6E3A1" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
        <!-- Left scale pan -->
        <g class="lb-scales">
          <line x1="0" y1="2" x2="0" y2="6"
            stroke="#A6E3A1" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
          <path d="M -2 6 Q 0 8 2 6"
            fill="none" stroke="#A6E3A1" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
        </g>
        <!-- Right scale pan -->
        <g class="lb-scales-r">
          <line x1="10" y1="2" x2="10" y2="6"
            stroke="#A6E3A1" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
          <path d="M 8 6 Q 10 8 12 6"
            fill="none" stroke="#A6E3A1" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
        </g>
        <!-- Base -->
        <line x1="2" y1="10" x2="8" y2="10"
          stroke="#A6E3A1" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
      </g>

      <!-- "license" label -->
      <text class="lb-label-text"
        x="24" y="18.5"
        font-family="'SF Mono','JetBrains Mono',monospace"
        font-size="9.5"
        font-weight="600"
        letter-spacing="0.5"
        fill="#A6ADC8">license</text>

    </g>

    <!-- ── DIVIDER ─────────────────────────────────────────────────────── -->
    <rect x="55" y="0" width="1" height="28" fill="#A6E3A1" opacity="0.35"/>

    <!-- ── VALUE SECTION ─────────────────────────────────────────────── -->
    <g clip-path="url(#lb-clip-value)">

      <rect x="56" y="0" width="50" height="28" fill="url(#lb-g-value)"/>
      <rect x="56" y="0" width="50" height="28" fill="url(#lb-g-value-dark)"/>
      <rect x="56" y="0" width="50" height="12" fill="url(#lb-g-glass)"/>

      <!-- Shimmer -->
      <rect class="lb-shimmer" x="6" y="0" width="22" height="28"
        fill="url(#lb-g-shimmer)" clip-path="url(#lb-clip-value)" opacity="0.5"/>

      <!-- "MIT" value text -->
      <text class="lb-value-text"
        x="65" y="18.5"
        font-family="'SF Mono','JetBrains Mono',monospace"
        font-size="12"
        font-weight="800"
        letter-spacing="1.5"
        fill="#CDD6F4"
        filter="url(#lb-f-value-glow)">MIT</text>

      <!-- Shield checkmark icon — right side -->
      <g class="lb-shield" transform="translate(88, 7)">
        <!-- Shield outline -->
        <path d="M 5 0 L 10 2.5 L 10 7 Q 10 11 5 13 Q 0 11 0 7 L 0 2.5 Z"
          fill="#A6E3A1" opacity="0.25"/>
        <path d="M 5 0 L 10 2.5 L 10 7 Q 10 11 5 13 Q 0 11 0 7 L 0 2.5 Z"
          fill="none" stroke="#A6E3A1" stroke-width="1" stroke-opacity="0.7"/>
        <!-- Checkmark -->
        <g class="lb-checkmark" style="transform-origin:5px 6px">
          <path d="M 2 6 L 4 8.5 L 8 4"
            fill="none" stroke="#A6E3A1" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
        </g>
      </g>

    </g>

    <!-- ── OUTER BORDER ───────────────────────────────────────────────── -->
    <rect x="0.5" y="0.5" width="105" height="27" rx="5.5"
      fill="none"
      stroke="url(#lb-g-border)"
      stroke-width="1"/>

    <!-- Top accent bar -->
    <rect class="lb-accent-top"
      x="0" y="0" width="106" height="1.5" rx="0.75"
      fill="url(#lb-g-value)" opacity="0.8"
      style="transform-origin:0 0"/>

  </g>

  <!-- ── GLOW BEHIND BADGE ─────────────────────────────────────────────── -->
  <ellipse class="lb-glow" cx="53" cy="14" rx="53" ry="14"
    fill="url(#lb-g-glow)"/>

  <!-- ── SPARKS ─────────────────────────────────────────────────────────── -->
  <circle class="lb-spark-1" cx="97" cy="22" r="1.8"
    fill="url(#lb-pf1)" style="--lx:3px;--ly:-6px;--lx2:5px;--ly2:-12px"/>
  <circle class="lb-spark-2" cx="100" cy="18" r="1.4"
    fill="url(#lb-pf2)" style="--lx:-2px;--ly:-5px;--lx2:-4px;--ly2:-10px"/>
  <circle class="lb-spark-3" cx="94" cy="24" r="1.6"
    fill="url(#lb-pf3)" style="--lx:4px;--ly:-7px;--lx2:7px;--ly2:-14px"/>

</svg>