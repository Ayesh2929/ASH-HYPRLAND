<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<!--
╔══════════════════════════════════════════════════════════════════════════════╗
║  ☀️  ASH DOTFILES v5.0 OMEGA — LIGHT VARIANT LOGO                           ║
║  Optimized for light backgrounds · Catppuccin Latte palette                ║
║  Use on: light docs · GitHub README (light) · print · presentations        ║
╚══════════════════════════════════════════════════════════════════════════════╝
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 480 160"
  width="480"
  height="160"
  role="img"
  aria-labelledby="ash-light-title ash-light-desc">

  <title id="ash-light-title">ASH Dotfiles — Light Theme</title>
  <desc id="ash-light-desc">
    ASH Dotfiles logo optimized for light backgrounds,
    using Catppuccin Latte color palette.
  </desc>

  <defs>

    <!-- ── LIGHT PALETTE — Catppuccin Latte ────────────────────────── -->
    <!--
      Background:  #EFF1F5  (Base)
      Surface:     #E6E9EF  (Surface0)
      Overlay:     #ACB0BE  (Overlay0)
      Text:        #4C4F69  (Text)
      Subtext:     #6C6F85  (Subtext1)
      Blue:        #1E66F5  (Blue)
      Lavender:    #7287FD  (Lavender)
      Mauve:       #8839EF  (Mauve)
      Sapphire:    #209FB5  (Sapphire)
      Teal:        #179299  (Teal)
      Sky:         #04A5E5  (Sky)
      Green:       #40A02B  (Green)
      Peach:       #FE640B  (Peach)
      Flamingo:    #DD7878  (Flamingo)
      Pink:        #EA76CB  (Pink)
      Red:         #D20F39  (Red)
      Yellow:      #DF8E1D  (Yellow)
      Maroon:      #E64553  (Maroon)
    -->

    <style>
      .lt-wave-1 { animation: lt-wave 7s ease-in-out infinite; }
      .lt-wave-2 { animation: lt-wave 9s ease-in-out infinite reverse; }
      .lt-wave-3 { animation: lt-wave 11s ease-in-out infinite 1.5s; }
      .lt-glow    { animation: lt-pulse 4s ease-in-out infinite; }
      .lt-orbit   { animation: lt-spin 10s linear infinite; }
      .lt-orbit2  { animation: lt-spin 14s linear infinite reverse; }
      .lt-dot     { animation: lt-dot-pulse 2.5s ease-in-out infinite; }
      .lt-shine   { animation: lt-shine-move 3s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .lt-wave-1, .lt-wave-2, .lt-wave-3, .lt-glow,
        .lt-orbit,  .lt-orbit2, .lt-dot,    .lt-shine { animation: none !important; }
      }

      @keyframes lt-wave {
        0%, 100% { transform: translateY(0);   }
        50%       { transform: translateY(-4px); }
      }
      @keyframes lt-pulse {
        0%, 100% { opacity: 0.3; r: 66; }
        50%       { opacity: 0.7; r: 70; }
      }
      @keyframes lt-spin {
        from { transform: rotate(0deg);   }
        to   { transform: rotate(360deg); }
      }
      @keyframes lt-dot-pulse {
        0%, 100% { opacity: 0.7; transform: scale(1);   }
        50%       { opacity: 1;   transform: scale(1.3); }
      }
      @keyframes lt-shine-move {
        0%   { transform: translateX(-40px); opacity: 0;   }
        30%  { opacity: 0.6; }
        70%  { opacity: 0.6; }
        100% { transform: translateX(40px);  opacity: 0;   }
      }
    </style>

    <!-- ── GRADIENTS ─────────────────────────────────────────────────── -->

    <!-- Primary — deep blue to mauve (light variant) -->
    <linearGradient id="lt-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1E66F5">
        <animate attributeName="stop-color"
          values="#1E66F5;#7287FD;#8839EF;#1E66F5"
          dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8839EF">
        <animate attributeName="stop-color"
          values="#8839EF;#1E66F5;#04A5E5;#8839EF"
          dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Wave — vibrant blue to sky -->
    <linearGradient id="lt-grad-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1E66F5" stop-opacity="1"/>
      <stop offset="40%"  stop-color="#04A5E5" stop-opacity="1"/>
      <stop offset="100%" stop-color="#209FB5" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Wave 2 — mauve -->
    <linearGradient id="lt-grad-wave-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8839EF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7287FD" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Background — crisp white to very pale blue -->
    <radialGradient id="lt-grad-bg" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="60%"  stop-color="#EFF1F5"/>
      <stop offset="100%" stop-color="#E6E9EF"/>
    </radialGradient>

    <!-- Subtle halo — for circle outline bleed -->
    <radialGradient id="lt-grad-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1E66F5" stop-opacity="0.12"/>
      <stop offset="60%"  stop-color="#8839EF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1E66F5" stop-opacity="0"/>
    </radialGradient>

    <!-- Text — near black for light bg -->
    <linearGradient id="lt-grad-text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#4C4F69"/>
      <stop offset="100%" stop-color="#6C6F85"/>
    </linearGradient>

    <!-- Ring stroke -->
    <linearGradient id="lt-grad-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1E66F5" stop-opacity="0.7"/>
      <stop offset="50%"  stop-color="#8839EF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#04A5E5" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Shine overlay -->
    <linearGradient id="lt-grad-shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- ── FILTERS ────────────────────────────────────────────────────── -->

    <!-- Light drop shadow -->
    <filter id="lt-filter-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8"
        flood-color="#1E66F5" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4"
        flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <!-- Subtle glow for wave lines on light bg -->
    <filter id="lt-filter-wave-glow" x="-15%" y="-50%" width="130%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#1E66F5" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Letter glow — lighter for day mode -->
    <filter id="lt-filter-letter-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#1E66F5" flood-opacity="0.25" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Inner shadow for depth on light bg -->
    <filter id="lt-filter-inner">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#ACB0BE" flood-opacity="0.2" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <!-- ── CLIP PATHS ─────────────────────────────────────────────────── -->
    <clipPath id="lt-clip-mark">
      <circle cx="80" cy="80" r="59"/>
    </clipPath>
    <clipPath id="lt-clip-shine">
      <circle cx="80" cy="80" r="59"/>
    </clipPath>

    <!-- ── PATTERNS ──────────────────────────────────────────────────── -->
    <!-- Subtle dot pattern for mark bg -->
    <pattern id="lt-pattern-dots" x="0" y="0" width="10" height="10"
      patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="0.8" fill="#ACB0BE" opacity="0.4"/>
    </pattern>

  </defs>

  <!-- ══════════════════════════════════════════════════════════════════════
       RENDER
       ══════════════════════════════════════════════════════════════════════ -->

  <!-- ── MARK SECTION ──────────────────────────────────────────────────── -->
  <g id="lt-mark">

    <!-- Outer halo -->
    <circle class="lt-glow" cx="80" cy="80" r="66"
      fill="url(#lt-grad-halo)"/>

    <!-- Outer decorative ring -->
    <circle cx="80" cy="80" r="70"
      fill="none"
      stroke="url(#lt-grad-ring)"
      stroke-width="0.75"
      stroke-dasharray="3 9"
      opacity="0.25">
      <animateTransform attributeName="transform" type="rotate"
        from="0 80 80" to="360 80 80" dur="40s" repeatCount="indefinite"/>
    </circle>

    <!-- Main circle -->
    <circle cx="80" cy="80" r="62"
      fill="url(#lt-grad-bg)"
      stroke="url(#lt-grad-ring)"
      stroke-width="2"
      filter="url(#lt-filter-shadow)"/>

    <!-- Dot texture overlay -->
    <circle cx="80" cy="80" r="61"
      fill="url(#lt-pattern-dots)"
      opacity="0.5"/>

    <!-- ── WAVE LINES ─────────────────────────────────────────────── -->
    <g clip-path="url(#lt-clip-mark)">

      <!-- Deep wave — teal, lightest -->
      <path class="lt-wave-3"
        d="M 22 90 C 38 74, 54 106, 70 90 C 86 74, 102 106, 118 90 C 128 78, 136 94, 140 86"
        fill="none" stroke="#179299" stroke-width="2"
        stroke-linecap="round" opacity="0.2"/>

      <!-- Mid wave — mauve/lavender -->
      <path class="lt-wave-2"
        d="M 22 82 C 38 64, 56 100, 72 82 C 88 64, 104 100, 120 82 C 130 68, 138 86, 140 78"
        fill="none" stroke="url(#lt-grad-wave-2)" stroke-width="3"
        stroke-linecap="round" opacity="0.45"/>

      <!-- Primary wave — strong blue -->
      <path class="lt-wave-1"
        d="M 22 74 C 38 56, 58 92, 74 74 C 90 56, 106 92, 122 74 C 130 60, 138 78, 140 70"
        fill="none" stroke="url(#lt-grad-wave)" stroke-width="5"
        stroke-linecap="round"
        filter="url(#lt-filter-wave-glow)"/>

      <!-- Wave fill — very subtle -->
      <path
        d="M 22 74 C 38 56, 58 92, 74 74 C 90 56, 106 92, 122 74
           C 130 60, 138 78, 140 70 L 140 140 L 22 140 Z"
        fill="url(#lt-grad-wave)" opacity="0.04"/>

      <!-- Accent dots on primary wave crest -->
      <circle cx="48" cy="74" r="3" fill="#1E66F5" opacity="0.5" class="lt-dot"
        style="animation-delay:0s"/>
      <circle cx="80" cy="68" r="3" fill="#04A5E5" opacity="0.5" class="lt-dot"
        style="animation-delay:0.8s"/>
      <circle cx="112" cy="74" r="3" fill="#209FB5" opacity="0.5" class="lt-dot"
        style="animation-delay:1.6s"/>

      <!-- Shine sweep -->
      <rect class="lt-shine" x="22" y="30" width="30" height="100"
        fill="url(#lt-grad-shine)" opacity="0.4"
        clip-path="url(#lt-clip-shine)"/>

    </g>

    <!-- ── LETTER A ─────────────────────────────────────────────────── -->
    <!-- Glow layer -->
    <text x="80" y="97"
      font-family="'SF Pro Display', 'Inter', system-ui, sans-serif"
      font-size="54" font-weight="900" text-anchor="middle"
      fill="#1E66F5" opacity="0.15"
      filter="url(#lt-filter-letter-glow)">A</text>
    <!-- Main letter -->
    <text x="80" y="97"
      font-family="'SF Pro Display', 'Inter', system-ui, sans-serif"
      font-size="54" font-weight="900" text-anchor="middle"
      fill="url(#lt-grad-primary)">A</text>

    <!-- ── ORBIT INDICATORS ──────────────────────────────────────── -->
    <g class="lt-orbit" style="transform-origin:80px 80px">
      <circle cx="80" cy="26" r="3.5"
        fill="#1E66F5" opacity="0.8"
        filter="url(#lt-filter-wave-glow)"/>
    </g>
    <g class="lt-orbit2" style="transform-origin:80px 80px">
      <circle cx="130" cy="80" r="2.5"
        fill="#8839EF" opacity="0.6"
        filter="url(#lt-filter-wave-glow)"/>
    </g>

    <!-- ── STATUS INDICATOR — top right ────────────────────────── -->
    <circle cx="118" cy="42" r="5"
      fill="#40A02B" opacity="0.9"
      filter="url(#lt-filter-wave-glow)">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Pulse ring -->
    <circle cx="118" cy="42" r="5"
      fill="none" stroke="#40A02B" stroke-width="1.5"
      opacity="0">
      <animate attributeName="r"       values="5;10;5"   dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- ── WORDMARK ──────────────────────────────────────────────────────── -->
  <g id="lt-wordmark" transform="translate(172, 0)">

    <!-- ASH letters -->
    <text x="0" y="95"
      font-family="'SF Pro Display', 'Inter', 'Helvetica Neue', system-ui, sans-serif"
      font-size="74" font-weight="900" letter-spacing="-3"
      fill="url(#lt-grad-text)">ASH</text>

    <!-- S letter accent glow -->
    <text x="52" y="95"
      font-family="'SF Pro Display', 'Inter', 'Helvetica Neue', system-ui, sans-serif"
      font-size="74" font-weight="900" letter-spacing="-3"
      fill="url(#lt-grad-primary)"
      filter="url(#lt-filter-letter-glow)">S</text>

    <!-- ── SEPARATOR ──────────────────────────────────────────────── -->
    <line x1="164" y1="26" x2="164" y2="112"
      stroke="#ACB0BE" stroke-width="1.5"
      stroke-linecap="round" opacity="0.5"/>

    <!-- ── RIGHT PANEL ────────────────────────────────────────────── -->
    <g transform="translate(176, 0)">

      <!-- Brand label -->
      <text x="0" y="50"
        font-family="'SF Mono', 'JetBrains Mono', monospace"
        font-size="11" font-weight="600" letter-spacing="4" fill="#ACB0BE">DOTFILES</text>

      <!-- Version pill -->
      <rect x="0" y="58" width="112" height="18" rx="9"
        fill="#E6E9EF" stroke="#1E66F5" stroke-width="1" stroke-opacity="0.4"/>
      <text x="56" y="71"
        font-family="'SF Mono', 'JetBrains Mono', monospace"
        font-size="8.5" font-weight="700" letter-spacing="1.5"
        fill="#1E66F5" text-anchor="middle">v5.0 OMEGA ⚡</text>

      <!-- ── COLOR PALETTE SWATCHES ──────────────────────────────── -->
      <g transform="translate(0, 86)">
        <rect x="0"   y="0" width="14" height="14" rx="3.5" fill="#1E66F5">
          <title>Blue</title></rect>
        <rect x="17"  y="0" width="14" height="14" rx="3.5" fill="#8839EF">
          <title>Mauve</title></rect>
        <rect x="34"  y="0" width="14" height="14" rx="3.5" fill="#40A02B">
          <title>Green</title></rect>
        <rect x="51"  y="0" width="14" height="14" rx="3.5" fill="#D20F39">
          <title>Red</title></rect>
        <rect x="68"  y="0" width="14" height="14" rx="3.5" fill="#FE640B">
          <title>Peach</title></rect>
        <rect x="85"  y="0" width="14" height="14" rx="3.5" fill="#04A5E5">
          <title>Sky</title></rect>
        <rect x="102" y="0" width="14" height="14" rx="3.5" fill="#DF8E1D">
          <title>Yellow</title></rect>

        <!-- Hover-like shimmer on active swatch -->
        <rect x="0" y="0" width="14" height="14" rx="3.5"
          fill="#FFFFFF" opacity="0">
          <animate attributeName="opacity" values="0;0.4;0" dur="3s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Feature list -->
      <text x="0" y="122"
        font-family="'SF Mono', monospace"
        font-size="7.5" font-weight="400" letter-spacing="1.2" fill="#ACB0BE">
        250+ THEMES · 150+ PLUGINS · AI-NATIVE
      </text>

      <!-- ── QUALITY BADGE ──────────────────────────────────────── -->
      <g transform="translate(0, 128)">
        <!-- Stars -->
        <text x="0" y="14"
          font-size="10" fill="#DF8E1D" letter-spacing="2">★★★★★</text>
        <text x="58" y="14"
          font-family="'SF Mono', monospace"
          font-size="7.5" font-weight="500" letter-spacing="1" fill="#ACB0BE">5.0 OMEGA</text>
      </g>

    </g>
  </g>

  <!-- ── ACCESSIBLE TEXT ────────────────────────────────────────────────── -->
  <text x="-9999" y="-9999" aria-hidden="false">
    ASH Dotfiles Light Theme Logo.
    The most advanced Hyprland dotfiles, version 5.0 OMEGA.
    250+ themes, 150+ plugins, AI-native.
  </text>

</svg>