<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<!--
╔══════════════════════════════════════════════════════════════════════════════╗
║  🌙 ASH DOTFILES v5.0 OMEGA — DARK VARIANT LOGO                            ║
║  Optimized for dark backgrounds · Catppuccin Mocha palette                 ║
║  Use on: dark docs · dark READMEs · dark dashboards · OLED screens         ║
╚══════════════════════════════════════════════════════════════════════════════╝
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 480 160"
  width="480"
  height="160"
  role="img"
  aria-labelledby="ash-dark-title ash-dark-desc">

  <title id="ash-dark-title">ASH Dotfiles — Dark Theme</title>
  <desc id="ash-dark-desc">
    ASH Dotfiles logo optimized for dark backgrounds,
    using Catppuccin Mocha color palette.
  </desc>

  <defs>

    <!-- ── DARK PALETTE — Catppuccin Mocha ──────────────────────────── -->
    <!--
      Background:  #1E1E2E  (Base)
      Surface:     #313244  (Surface0)
      Overlay:     #585B70  (Overlay0)
      Text:        #CDD6F4  (Text)
      Subtext:     #A6ADC8  (Subtext1)
      Blue:        #89B4FA  (Blue)
      Lavender:    #B4BEFE  (Lavender)
      Mauve:       #CBA6F7  (Mauve)
      Sapphire:    #74C7EC  (Sapphire)
      Teal:        #94E2D5  (Teal)
      Sky:         #89DCEB  (Sky)
      Green:       #A6E3A1  (Green)
      Peach:       #FAB387  (Peach)
      Flamingo:    #F2CDCD  (Flamingo)
      Pink:        #F5C2E7  (Pink)
      Red:         #F38BA8  (Red)
      Yellow:      #F9E2AF  (Yellow)
      Maroon:      #EBA0AC  (Maroon)
    -->

    <style>
      .dk-animate-wave-1 { animation: dk-wave 7s ease-in-out infinite; }
      .dk-animate-wave-2 { animation: dk-wave 9s ease-in-out infinite reverse; }
      .dk-animate-wave-3 { animation: dk-wave 11s ease-in-out infinite 1s; }
      .dk-animate-glow   { animation: dk-glow  4s ease-in-out infinite; }
      .dk-animate-orbit  { animation: dk-orbit 8s linear infinite; }
      .dk-animate-orbit2 { animation: dk-orbit 12s linear infinite reverse; }
      .dk-animate-shine  { animation: dk-shine 3s ease-in-out infinite; }
      .dk-particle       { animation: dk-particle-float 5s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .dk-animate-wave-1, .dk-animate-wave-2, .dk-animate-wave-3,
        .dk-animate-glow,   .dk-animate-orbit,  .dk-animate-orbit2,
        .dk-animate-shine,  .dk-particle { animation: none !important; }
      }

      @keyframes dk-wave {
        0%, 100% { transform: translateX(0)  scaleY(1);    }
        25%       { transform: translateX(3px) scaleY(1.1); }
        75%       { transform: translateX(-3px) scaleY(0.9); }
      }
      @keyframes dk-glow {
        0%, 100% { opacity: 0.6; filter: blur(8px);  }
        50%       { opacity: 1;   filter: blur(12px); }
      }
      @keyframes dk-orbit {
        from { transform: rotate(0deg)   translateX(50px) rotate(0deg); }
        to   { transform: rotate(360deg) translateX(50px) rotate(-360deg); }
      }
      @keyframes dk-shine {
        0%   { stop-color: #89B4FA; }
        33%  { stop-color: #CBA6F7; }
        66%  { stop-color: #89DCEB; }
        100% { stop-color: #89B4FA; }
      }
      @keyframes dk-particle-float {
        0%, 100% { transform: translate(0,0)     opacity: 0.5; }
        50%       { transform: translate(2px,-6px); opacity: 1; }
      }
    </style>

    <!-- ── GRADIENTS ─────────────────────────────────────────────────── -->

    <!-- Primary — animated blue to purple -->
    <linearGradient id="dk-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#89B4FA">
        <animate attributeName="stop-color"
          values="#89B4FA;#B4BEFE;#CBA6F7;#89B4FA"
          dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#CBA6F7">
        <animate attributeName="stop-color"
          values="#CBA6F7;#89DCEB;#89B4FA;#CBA6F7"
          dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Wave — sapphire to sky -->
    <linearGradient id="dk-grad-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#89B4FA" stop-opacity="1"/>
      <stop offset="35%"  stop-color="#74C7EC" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#89DCEB" stop-opacity="1"/>
      <stop offset="100%" stop-color="#94E2D5" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Wave mid — mauve -->
    <linearGradient id="dk-grad-wave-mid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#CBA6F7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#B4BEFE" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Background — deep dark -->
    <radialGradient id="dk-grad-bg" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#313244"/>
      <stop offset="70%"  stop-color="#1E1E2E"/>
      <stop offset="100%" stop-color="#181825"/>
    </radialGradient>

    <!-- Glow halo -->
    <radialGradient id="dk-grad-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#89B4FA" stop-opacity="0.45"/>
      <stop offset="50%"  stop-color="#CBA6F7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#89B4FA" stop-opacity="0"/>
    </radialGradient>

    <!-- Text — warm white -->
    <linearGradient id="dk-grad-text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#CDD6F4"/>
      <stop offset="100%" stop-color="#A6ADC8"/>
    </linearGradient>

    <!-- Inner ring -->
    <linearGradient id="dk-grad-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#89B4FA" stop-opacity="0.8"/>
      <stop offset="50%"  stop-color="#CBA6F7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#89DCEB" stop-opacity="0.8"/>
    </linearGradient>

    <!-- ── FILTERS ────────────────────────────────────────────────────── -->

    <!-- Drop shadow for mark -->
    <filter id="dk-filter-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10"
        flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Glow for wave lines -->
    <filter id="dk-filter-wave-glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#89B4FA" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong letter glow -->
    <filter id="dk-filter-letter-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b1"/>
      <feGaussianBlur stdDeviation="8" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Noise texture overlay -->
    <filter id="dk-filter-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- ── CLIP PATHS ─────────────────────────────────────────────────── -->
    <clipPath id="dk-clip-mark">
      <circle cx="80" cy="80" r="60"/>
    </clipPath>

    <!-- ── SYMBOL (reusable mark) ─────────────────────────────────────── -->
    <symbol id="dk-mark-symbol" viewBox="0 0 160 160">

      <!-- Background circle -->
      <circle cx="80" cy="80" r="74"
        fill="url(#dk-grad-halo)"
        class="dk-animate-glow"/>

      <!-- Main circle -->
      <circle cx="80" cy="80" r="62"
        fill="url(#dk-grad-bg)"
        stroke="url(#dk-grad-ring)"
        stroke-width="2"
        filter="url(#dk-filter-shadow)"/>

      <!-- Noise texture -->
      <circle cx="80" cy="80" r="61"
        fill="#89B4FA"
        filter="url(#dk-filter-noise)"
        opacity="0.03"/>

      <!-- ── WAVE LINES ──────────────────────────────────────────── -->
      <g clip-path="url(#dk-clip-mark)">

        <!-- Deepest wave — teal, very subtle -->
        <path class="dk-animate-wave-3"
          d="M 20 90 C 36 74, 52 106, 68 90 C 84 74, 100 106, 116 90 C 128 78, 136 94, 140 86"
          fill="none" stroke="#94E2D5" stroke-width="2"
          stroke-linecap="round" opacity="0.25"
          transform-origin="80px 90px"/>

        <!-- Mid wave — mauve -->
        <path class="dk-animate-wave-2"
          d="M 20 82 C 36 64, 54 100, 70 82 C 86 64, 102 100, 118 82 C 128 68, 136 86, 140 78"
          fill="none" stroke="url(#dk-grad-wave-mid)" stroke-width="3"
          stroke-linecap="round" opacity="0.5"
          transform-origin="80px 82px"/>

        <!-- Primary wave — blue, with glow -->
        <path class="dk-animate-wave-1"
          d="M 20 74 C 36 56, 56 92, 72 74 C 88 56, 104 92, 120 74 C 130 60, 136 78, 140 70"
          fill="none" stroke="url(#dk-grad-wave)" stroke-width="4.5"
          stroke-linecap="round"
          filter="url(#dk-filter-wave-glow)"
          transform-origin="80px 74px"/>

        <!-- Shimmer dots on wave -->
        <circle cx="46" cy="74" r="2.5" fill="#89B4FA" opacity="0.6">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="r"       values="2.5;3.5;2.5" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="80" cy="68" r="2.5" fill="#74C7EC" opacity="0.5">
          <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="114" cy="74" r="2.5" fill="#89DCEB" opacity="0.6">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
        </circle>

      </g>

      <!-- ── CENTER LETTER A ──────────────────────────────────────── -->
      <!-- Glow layer -->
      <text x="80" y="96"
        font-family="'SF Pro Display', 'Inter', system-ui, sans-serif"
        font-size="54" font-weight="900" text-anchor="middle"
        fill="#89B4FA" opacity="0.3"
        filter="url(#dk-filter-letter-glow)">A</text>
      <!-- Main letter -->
      <text x="80" y="96"
        font-family="'SF Pro Display', 'Inter', system-ui, sans-serif"
        font-size="54" font-weight="900" text-anchor="middle"
        fill="url(#dk-grad-primary)">A</text>

      <!-- ── ORBITING INDICATORS ──────────────────────────────────── -->
      <g style="transform-origin: 80px 80px">
        <circle r="3.5" fill="#89B4FA" class="dk-animate-orbit"
          filter="url(#dk-filter-wave-glow)" opacity="0.9"
          style="transform-origin: 80px 80px"/>
      </g>
      <g style="transform-origin: 80px 80px">
        <circle r="2" fill="#CBA6F7" class="dk-animate-orbit2"
          filter="url(#dk-filter-wave-glow)" opacity="0.7"
          style="transform-origin: 80px 80px"/>
      </g>

      <!-- ── OUTER DECORATIVE RING ────────────────────────────────── -->
      <circle cx="80" cy="80" r="68"
        fill="none"
        stroke="url(#dk-grad-ring)"
        stroke-width="0.75"
        stroke-dasharray="4 8"
        opacity="0.3">
        <animateTransform attributeName="transform" type="rotate"
          from="0 80 80" to="360 80 80" dur="30s" repeatCount="indefinite"/>
      </circle>

    </symbol>

  </defs>

  <!-- ══════════════════════════════════════════════════════════════════════
       RENDER LAYERS
       ══════════════════════════════════════════════════════════════════════ -->

  <!-- ── MARK ──────────────────────────────────────────────────────────── -->
  <use href="#dk-mark-symbol" x="0" y="0" width="160" height="160"/>

  <!-- ── PARTICLES ─────────────────────────────────────────────────────── -->
  <g id="dk-particles">
    <circle class="dk-particle" cx="152" cy="38"  r="3"   fill="#89B4FA" opacity="0.7"
      style="animation-delay:0s"/>
    <circle class="dk-particle" cx="156" cy="64"  r="1.8" fill="#CBA6F7" opacity="0.6"
      style="animation-delay:1.2s"/>
    <circle class="dk-particle" cx="148" cy="108" r="2.5" fill="#89DCEB" opacity="0.5"
      style="animation-delay:2.4s"/>
    <circle class="dk-particle" cx="160" cy="88"  r="1.5" fill="#A6E3A1" opacity="0.6"
      style="animation-delay:0.8s"/>
    <circle class="dk-particle" cx="144" cy="122" r="2"   fill="#F9E2AF" opacity="0.4"
      style="animation-delay:3.6s"/>
  </g>

  <!-- ── WORDMARK ──────────────────────────────────────────────────────── -->
  <g id="dk-wordmark" transform="translate(172, 0)">

    <!-- Primary ASH text -->
    <text x="0" y="94"
      font-family="'SF Pro Display', 'Inter', 'Helvetica Neue', system-ui, sans-serif"
      font-size="74" font-weight="900" letter-spacing="-3"
      fill="url(#dk-grad-text)">ASH</text>

    <!-- Accent: S glow overlay -->
    <text x="52" y="94"
      font-family="'SF Pro Display', 'Inter', 'Helvetica Neue', system-ui, sans-serif"
      font-size="74" font-weight="900" letter-spacing="-3"
      fill="url(#dk-grad-primary)"
      filter="url(#dk-filter-wave-glow)">S</text>

    <!-- ── SEPARATOR ──────────────────────────────────────────────── -->
    <line x1="164" y1="28" x2="164" y2="112"
      stroke="#585B70" stroke-width="1.5"
      stroke-linecap="round" opacity="0.4"/>

    <!-- ── RIGHT SECTION ──────────────────────────────────────────── -->
    <g transform="translate(176, 0)">

      <!-- Brand label -->
      <text x="0" y="52"
        font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', monospace"
        font-size="11" font-weight="600" letter-spacing="4" fill="#585B70">DOTFILES</text>

      <!-- Version -->
      <rect x="0" y="60" width="108" height="17" rx="8.5"
        fill="#313244" stroke="#89B4FA" stroke-width="0.75" stroke-opacity="0.5"/>
      <text x="54" y="72.5"
        font-family="'SF Mono', 'JetBrains Mono', monospace"
        font-size="8.5" font-weight="700" letter-spacing="1.5"
        fill="#89B4FA" text-anchor="middle">v5.0 OMEGA ⚡</text>

      <!-- ── COLOR SWATCHES ──────────────────────────────────────── -->
      <g transform="translate(0, 88)">
        <!-- Swatch row with tooltips (for SVG viewers) -->
        <rect x="0"   y="0" width="14" height="14" rx="3" fill="#89B4FA">
          <title>Blue — 250+ Themes</title></rect>
        <rect x="17"  y="0" width="14" height="14" rx="3" fill="#CBA6F7">
          <title>Mauve — 150+ Plugins</title></rect>
        <rect x="34"  y="0" width="14" height="14" rx="3" fill="#A6E3A1">
          <title>Green — AI Engine</title></rect>
        <rect x="51"  y="0" width="14" height="14" rx="3" fill="#F38BA8">
          <title>Red — Security</title></rect>
        <rect x="68"  y="0" width="14" height="14" rx="3" fill="#FAB387">
          <title>Peach — Performance</title></rect>
        <rect x="85"  y="0" width="14" height="14" rx="3" fill="#89DCEB">
          <title>Sky — Hyprland</title></rect>
        <rect x="102" y="0" width="14" height="14" rx="3" fill="#F9E2AF">
          <title>Yellow — Web Dashboard</title></rect>

        <!-- Animated shimmer on first swatch -->
        <rect x="0" y="0" width="14" height="14" rx="3"
          fill="url(#dk-grad-primary)" opacity="0">
          <animate attributeName="opacity" values="0;0.6;0" dur="2s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- ── MICRO FEATURE TEXT ──────────────────────────────────── -->
      <text x="0" y="122"
        font-family="'SF Mono', monospace"
        font-size="7.5" font-weight="400" letter-spacing="1.2" fill="#45475A">
        250+ THEMES · 150+ PLUGINS · AI-NATIVE
      </text>

    </g>
  </g>

</svg>