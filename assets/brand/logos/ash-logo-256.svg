<?xml version="1.0" encoding="UTF-8"?>
<!--
╔══════════════════════════════════════════════════════════════════════════════╗
║  🎯 ASH DOTFILES v5.0 OMEGA — LOGO ICON 256×256                            ║
║  Optimized for small sizes: app icons · favicons · taskbar · dock           ║
║  Pixel-hinted at 256px: strokes thicker, details simplified                ║
╚══════════════════════════════════════════════════════════════════════════════╝
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 256 256"
  width="256"
  height="256"
  shape-rendering="geometricPrecision"
  text-rendering="geometricPrecision"
  role="img"
  aria-label="ASH Dotfiles icon 256px">

  <title>ASH Dotfiles — 256px Icon</title>

  <defs>

    <!-- ══════════════════════════════════════════════════════════════════
         ANIMATIONS
         ══════════════════════════════════════════════════════════════════ -->
    <style><![CDATA[
      .i256-wave-a { animation: i256-wave 7s ease-in-out infinite; transform-origin: 128px 128px; }
      .i256-wave-b { animation: i256-wave 9s ease-in-out infinite reverse 1s; transform-origin: 128px 128px; }
      .i256-wave-c { animation: i256-wave 12s ease-in-out infinite 2s; transform-origin: 128px 128px; }
      .i256-spin   { animation: i256-spin 25s linear infinite; transform-origin: 128px 128px; }
      .i256-pulse  { animation: i256-pulse 4s ease-in-out infinite; transform-origin: 128px 128px; }
      .i256-float  { animation: i256-float 6s ease-in-out infinite; }
      .i256-orbit-1 { animation: i256-orbit 8s linear infinite; transform-origin: 128px 128px; }
      .i256-orbit-2 { animation: i256-orbit 12s linear infinite reverse 2s; transform-origin: 128px 128px; }
      .i256-glow   { animation: i256-glow-pulse 3s ease-in-out infinite; }
      .i256-letter { animation: i256-letter-breathe 5s ease-in-out infinite; }
      .i256-p1 { animation: i256-particle 4.2s ease-out 0.5s infinite; }
      .i256-p2 { animation: i256-particle 5.1s ease-out 1.4s infinite; }
      .i256-p3 { animation: i256-particle 3.8s ease-out 2.3s infinite; }
      .i256-p4 { animation: i256-particle 4.7s ease-out 0.9s infinite; }
      .i256-p5 { animation: i256-particle 5.5s ease-out 3.1s infinite; }
      .i256-p6 { animation: i256-particle 4.0s ease-out 1.8s infinite; }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }

      @keyframes i256-wave {
        0%,100% { transform: translateY(0) scaleX(1); }
        33%      { transform: translateY(-6px) scaleX(1.02); }
        66%      { transform: translateY(4px) scaleX(0.98); }
      }
      @keyframes i256-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes i256-pulse {
        0%,100% { transform: scale(1);    opacity: 0.5; }
        50%      { transform: scale(1.06); opacity: 0.9; }
      }
      @keyframes i256-float {
        0%,100% { transform: translateY(0);   }
        50%      { transform: translateY(-8px); }
      }
      @keyframes i256-orbit {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes i256-glow-pulse {
        0%,100% { opacity: 0.5; r: 110; }
        50%      { opacity: 0.9; r: 118; }
      }
      @keyframes i256-letter-breathe {
        0%,100% { opacity: 0.95; filter: brightness(1); }
        50%      { opacity: 1;    filter: brightness(1.08); }
      }
      @keyframes i256-particle {
        0%   { transform: translate(0,0) scale(0); opacity: 0; }
        10%  { opacity: 1; }
        60%  { transform: translate(var(--pdx,8px),var(--pdy,-28px)) scale(1.4); opacity: 0.7; }
        100% { transform: translate(var(--pdx2,14px),var(--pdy2,-52px)) scale(0); opacity: 0; }
      }
    ]]></style>

    <!-- ── PRIMARY — animated spectrum ──────────────────────────────── -->
    <linearGradient id="i256-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#89B4FA">
        <animate attributeName="stop-color"
          values="#89B4FA;#CBA6F7;#89DCEB;#A6E3A1;#89B4FA"
          dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%"  stop-color="#CBA6F7">
        <animate attributeName="stop-color"
          values="#CBA6F7;#89DCEB;#89B4FA;#CBA6F7;#CBA6F7"
          dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#89DCEB">
        <animate attributeName="stop-color"
          values="#89DCEB;#89B4FA;#CBA6F7;#89DCEB;#89DCEB"
          dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- ── BACKGROUND — deep dark ────────────────────────────────────── -->
    <radialGradient id="i256-grad-bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%"   stop-color="#313244"/>
      <stop offset="55%"  stop-color="#1E1E2E"/>
      <stop offset="100%" stop-color="#11111B"/>
    </radialGradient>

    <!-- ── WAVE — blue-teal sweep ────────────────────────────────────── -->
    <linearGradient id="i256-grad-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#89B4FA"/>
      <stop offset="40%"  stop-color="#74C7EC"/>
      <stop offset="100%" stop-color="#89DCEB"/>
    </linearGradient>

    <!-- ── WAVE MID — purple ─────────────────────────────────────────── -->
    <linearGradient id="i256-grad-wave-mid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#CBA6F7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#B4BEFE" stop-opacity="0.5"/>
    </linearGradient>

    <!-- ── HALO ──────────────────────────────────────────────────────── -->
    <radialGradient id="i256-grad-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#89B4FA" stop-opacity="0.4">
        <animate attributeName="stop-color"
          values="#89B4FA;#CBA6F7;#89DCEB;#89B4FA"
          dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#89B4FA" stop-opacity="0"/>
    </radialGradient>

    <!-- ── GLASS HIGHLIGHT ───────────────────────────────────────────── -->
    <radialGradient id="i256-grad-glass" cx="38%" cy="28%" r="55%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- ── PARTICLE FILLS ────────────────────────────────────────────── -->
    <radialGradient id="i256-p-blue"   cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#89B4FA"/>
      <stop offset="100%" stop-color="#89B4FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i256-p-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#CBA6F7"/>
      <stop offset="100%" stop-color="#CBA6F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i256-p-teal" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#94E2D5"/>
      <stop offset="100%" stop-color="#94E2D5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i256-p-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#A6E3A1"/>
      <stop offset="100%" stop-color="#A6E3A1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i256-p-peach" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FAB387"/>
      <stop offset="100%" stop-color="#FAB387" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i256-p-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#F38BA8"/>
      <stop offset="100%" stop-color="#F38BA8" stop-opacity="0"/>
    </radialGradient>

    <!-- ── FILTERS ───────────────────────────────────────────────────── -->
    <filter id="i256-f-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="6"  result="b1"/>
      <feGaussianBlur stdDeviation="14" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="i256-f-wave-glow" x="-10%" y="-80%" width="120%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#89B4FA" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="i256-f-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16"
        flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="i256-f-inner-light">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- ── CLIP PATHS ────────────────────────────────────────────────── -->
    <clipPath id="i256-clip-main">
      <circle cx="128" cy="128" r="108"/>
    </clipPath>

    <clipPath id="i256-clip-wave">
      <circle cx="128" cy="128" r="106"/>
    </clipPath>

    <mask id="i256-mask-wave-fade">
      <rect x="20" y="0" width="216" height="256" fill="white"/>
      <rect x="20"  y="0" width="24" height="256"
        fill="url(#i256-fade-l)"/>
      <rect x="212" y="0" width="24" height="256"
        fill="url(#i256-fade-r)"/>
    </mask>

    <linearGradient id="i256-fade-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="black"/>
      <stop offset="100%" stop-color="white"/>
    </linearGradient>
    <linearGradient id="i256-fade-r" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="white"/>
      <stop offset="100%" stop-color="black"/>
    </linearGradient>

  </defs>

  <!-- ══════════════════════════════════════════════════════════════════════
       LAYER 0 — AMBIENT HALO
       ══════════════════════════════════════════════════════════════════════ -->
  <circle class="i256-glow" cx="128" cy="128" r="110"
    fill="url(#i256-grad-halo)"/>

  <!-- ══════════════════════════════════════════════════════════════════════
       LAYER 1 — OUTER DECORATIVE RINGS
       ══════════════════════════════════════════════════════════════════════ -->

  <!-- Outermost orbit ring — slow clockwise spin -->
  <g class="i256-spin">
    <circle cx="128" cy="128" r="124"
      fill="none"
      stroke="url(#i256-grad-primary)"
      stroke-width="1.5"
      stroke-dasharray="8 10"
      opacity="0.25"/>
  </g>

  <!-- Second ring — counter spin, tighter dash -->
  <circle cx="128" cy="128" r="116"
    fill="none"
    stroke="url(#i256-grad-wave-mid)"
    stroke-width="1"
    stroke-dasharray="3 14"
    opacity="0.2">
    <animateTransform attributeName="transform" type="rotate"
      from="0 128 128" to="-360 128 128" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- ══════════════════════════════════════════════════════════════════════
       LAYER 2 — MAIN CIRCLE BODY
       ══════════════════════════════════════════════════════════════════════ -->
  <g class="i256-float" filter="url(#i256-f-shadow)">

    <!-- Background fill -->
    <circle cx="128" cy="128" r="108"
      fill="url(#i256-grad-bg)"/>

    <!-- Border ring — animated gradient -->
    <circle cx="128" cy="128" r="108"
      fill="none"
      stroke="url(#i256-grad-primary)"
      stroke-width="3.5"/>

    <!-- Glass inner highlight -->
    <ellipse cx="128" cy="88" rx="72" ry="44"
      fill="url(#i256-grad-glass)"
      clip-path="url(#i256-clip-main)"/>

    <!-- ── WAVE SYSTEM ─────────────────────────────────────────────── -->
    <g clip-path="url(#i256-clip-wave)"
       mask="url(#i256-mask-wave-fade)">

      <!-- Wave C — deep background, teal -->
      <path class="i256-wave-c"
        d="M 20 148 C 48 118, 76 178, 104 148
                    C 132 118, 160 178, 188 148
                    C 206 126, 220 154, 236 142"
        fill="none"
        stroke="#94E2D5"
        stroke-width="3"
        stroke-linecap="round"
        opacity="0.28"/>

      <!-- Wave B — mid layer, purple -->
      <path class="i256-wave-b"
        d="M 20 136 C 48 104, 78 166, 108 136
                    C 138 104, 162 166, 192 136
                    C 210 112, 222 142, 236 130"
        fill="none"
        stroke="url(#i256-grad-wave-mid)"
        stroke-width="4.5"
        stroke-linecap="round"
        opacity="0.55"/>

      <!-- Wave A — front layer, blue — primary + glow -->
      <path class="i256-wave-a"
        d="M 20 124 C 50 90, 82 156, 114 124
                    C 146 90, 172 156, 202 124
                    C 216 104, 224 136, 236 118"
        fill="none"
        stroke="url(#i256-grad-wave)"
        stroke-width="7"
        stroke-linecap="round"
        filter="url(#i256-f-wave-glow)"/>

      <!-- Wave fill area -->
      <path
        d="M 20 124 C 50 90, 82 156, 114 124
                    C 146 90, 172 156, 202 124
                    C 216 104, 224 136, 236 118
                    L 236 236 L 20 236 Z"
        fill="url(#i256-grad-wave)"
        opacity="0.07"/>

      <!-- Wave crest accent dots -->
      <g filter="url(#i256-f-inner-light)">
        <circle cx="72"  cy="124" r="5" fill="#89B4FA" opacity="0.85">
          <animate attributeName="r"
            values="5;7.5;5" dur="2.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity"
            values="0.85;1;0.85" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="128" cy="112" r="5" fill="#74C7EC" opacity="0.8">
          <animate attributeName="r"
            values="5;7.5;5" dur="3.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity"
            values="0.8;1;0.8" dur="3.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="184" cy="124" r="5" fill="#89DCEB" opacity="0.85">
          <animate attributeName="r"
            values="5;7.5;5" dur="4.0s" repeatCount="indefinite"/>
          <animate attributeName="opacity"
            values="0.85;1;0.85" dur="4.0s" repeatCount="indefinite"/>
        </circle>
      </g>

    </g>

    <!-- ── CENTER LETTER A ─────────────────────────────────────────── -->

    <!-- Deep bloom glow -->
    <text x="128" y="156"
      font-family="'SF Pro Display','Inter','Helvetica Neue',system-ui,sans-serif"
      font-size="96" font-weight="900" text-anchor="middle"
      fill="#89B4FA" opacity="0.3"
      filter="url(#i256-f-glow)">A</text>

    <!-- Secondary glow layer -->
    <text x="128" y="156"
      font-family="'SF Pro Display','Inter','Helvetica Neue',system-ui,sans-serif"
      font-size="96" font-weight="900" text-anchor="middle"
      fill="#CBA6F7" opacity="0.15"
      filter="url(#i256-f-glow)">A</text>

    <!-- Main letter — animated gradient -->
    <text class="i256-letter" x="128" y="156"
      font-family="'SF Pro Display','Inter','Helvetica Neue',system-ui,sans-serif"
      font-size="96" font-weight="900" text-anchor="middle"
      fill="url(#i256-grad-primary)">A</text>

    <!-- Letter highlight stroke -->
    <text x="128" y="156"
      font-family="'SF Pro Display','Inter','Helvetica Neue',system-ui,sans-serif"
      font-size="96" font-weight="900" text-anchor="middle"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="0.75"
      opacity="0.15">A</text>

    <!-- ── ORBITAL CONSTELLATION ─────────────────────────────────── -->

    <!-- Orbital path guide — subtle ellipse -->
    <ellipse cx="128" cy="128" rx="88" ry="32"
      fill="none"
      stroke="url(#i256-grad-primary)"
      stroke-width="0.75"
      stroke-dasharray="3 9"
      opacity="0.18"
      transform="rotate(-25 128 128)"/>

    <!-- Orbit 1 — blue dot -->
    <g class="i256-orbit-1">
      <circle cx="128" cy="40" r="6"
        fill="#89B4FA"
        filter="url(#i256-f-inner-light)"
        opacity="0.9"/>
      <!-- Dot pulse ring -->
      <circle cx="128" cy="40" r="6"
        fill="none"
        stroke="#89B4FA"
        stroke-width="2"
        opacity="0">
        <animate attributeName="r"       values="6;14;6"    dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Orbit 2 — purple dot, opposite direction -->
    <g class="i256-orbit-2">
      <circle cx="216" cy="128" r="4.5"
        fill="#CBA6F7"
        filter="url(#i256-f-inner-light)"
        opacity="0.8"/>
    </g>

    <!-- ── STATUS INDICATOR ──────────────────────────────────────── -->
    <circle cx="196" cy="68" r="8"
      fill="#A6E3A1" filter="url(#i256-f-inner-light)" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="196" cy="68" r="8"
      fill="none" stroke="#A6E3A1" stroke-width="2" opacity="0">
      <animate attributeName="r"       values="8;18;8"    dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- ── PULSE RING ────────────────────────────────────────────── -->
    <circle class="i256-pulse" cx="128" cy="128" r="108"
      fill="none"
      stroke="url(#i256-grad-primary)"
      stroke-width="2.5"
      opacity="0.4"/>

  </g>

  <!-- ══════════════════════════════════════════════════════════════════════
       LAYER 3 — PARTICLE SYSTEM
       ══════════════════════════════════════════════════════════════════════ -->
  <g id="i256-particles">

    <circle class="i256-p1" cx="210" cy="88"  r="6"
      fill="url(#i256-p-blue)"
      style="--pdx:8px;--pdy:-24px;--pdx2:14px;--pdy2:-46px"/>
    <circle class="i256-p2" cx="218" cy="130" r="4.5"
      fill="url(#i256-p-purple)"
      style="--pdx:-6px;--pdy:-20px;--pdx2:-12px;--pdy2:-40px"/>
    <circle class="i256-p3" cx="208" cy="174" r="5.5"
      fill="url(#i256-p-teal)"
      style="--pdx:10px;--pdy:-28px;--pdx2:18px;--pdy2:-54px"/>
    <circle class="i256-p4" cx="214" cy="108" r="4"
      fill="url(#i256-p-green)"
      style="--pdx:-8px;--pdy:-22px;--pdx2:-16px;--pdy2:-44px"/>
    <circle class="i256-p5" cx="206" cy="152" r="6"
      fill="url(#i256-p-peach)"
      style="--pdx:12px;--pdy:-30px;--pdx2:20px;--pdy2:-58px"/>
    <circle class="i256-p6" cx="220" cy="94"  r="3.5"
      fill="url(#i256-p-pink)"
      style="--pdx:-4px;--pdy:-18px;--pdx2:-8px;--pdy2:-36px"/>

  </g>

  <!-- ══════════════════════════════════════════════════════════════════════
       ACCESSIBILITY
       ══════════════════════════════════════════════════════════════════════ -->
  <text x="-9999" y="-9999" aria-hidden="false">
    ASH Dotfiles application icon, 256 pixels.
  </text>

</svg>