# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — KITTY TERMINAL CONFIGURATION                 ║
# ║           The fast, feature-rich, GPU-accelerated terminal emulator        ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# 🎨 THEME (loaded from dynamic theme file)
# ══════════════════════════════════════════════════════════════════════════════

include themes/current.conf

# ══════════════════════════════════════════════════════════════════════════════
# 🔤 FONTS
# ══════════════════════════════════════════════════════════════════════════════

# Primary font — JetBrains Mono with Nerd Font icons
font_family         JetBrainsMono Nerd Font
bold_font           JetBrainsMono Nerd Font Bold
italic_font         JetBrainsMono Nerd Font Italic
bold_italic_font    JetBrainsMono Nerd Font Bold Italic

# Font size
font_size           12.0

# Fallback fonts for symbols
symbol_map          U+E0A0-U+E0A3,U+E0C0-U+E0C7  PowerlineSymbols
symbol_map          U+F0001-U+F1AF0               Noto Color Emoji

# Font features
font_features       JetBrainsMonoNFM-Regular +zero +onum +ss01 +ss02
font_features       JetBrainsMonoNFM-Bold    +zero +onum +ss01 +ss02

# Ligatures
# To disable: font_features JetBrainsMonoNFM-Regular -calt

# ══════════════════════════════════════════════════════════════════════════════
# 📐 WINDOW LAYOUT
# ══════════════════════════════════════════════════════════════════════════════

# Window decorations (none = no titlebar, kitty manages its own)
hide_window_decorations  yes

# Initial window size
initial_window_width   1200
initial_window_height  700

# Padding around terminal content
window_padding_width    12 14
# Top, right, bottom, left padding

# Remember window size when reopening
remember_window_size    yes

# Window border
draw_minimal_borders    no
window_border_width     1.5pt

# Focus follows mouse for kitty windows
focus_follows_mouse     no

# Resize debounce
resize_debounce_time    0.1
resize_in_steps         no

# ══════════════════════════════════════════════════════════════════════════════
# 🎨 APPEARANCE
# ══════════════════════════════════════════════════════════════════════════════

# Background opacity (0.0 = transparent, 1.0 = opaque)
background_opacity      0.92

# Background blur (requires compositor support)
background_blur         32

# Dynamic background opacity toggle
dynamic_background_opacity yes

# Dim inactive windows
dim_opacity             0.75

# Selection highlight
selection_foreground    none
selection_background    none

# Cursor settings
cursor_shape            beam
cursor_beam_thickness   1.8pt
cursor_blink_interval   0.5
cursor_stop_blinking_after 15.0

# Scrollback
scrollback_lines        12000
scrollback_pager        less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# URL handling
url_style              curly
url_prefixes           file ftp ftps http https mailto

# ══════════════════════════════════════════════════════════════════════════════
# 🖥️ PERFORMANCE
# ══════════════════════════════════════════════════════════════════════════════

# Sync with monitor refresh rate (reduces tearing)
sync_to_monitor         yes

# Repaint delay (ms)
repaint_delay           10

# Input delay (ms) — lower = more responsive
input_delay             3

# Enable GPU rendering
# opengl_debug           no

# ══════════════════════════════════════════════════════════════════════════════
# 🔔 BELL
# ══════════════════════════════════════════════════════════════════════════════

enable_audio_bell       no
visual_bell_duration    0.1
visual_bell_color       none

# Notify on window bell
window_alert_on_bell    yes
bell_on_tab             "🔔 "

# ══════════════════════════════════════════════════════════════════════════════
# 🗂️ TABS
# ══════════════════════════════════════════════════════════════════════════════

# Tab bar style
tab_bar_style          powerline
tab_powerline_style    slanted
tab_bar_edge           bottom
tab_bar_align          left
tab_bar_margin_width   0.0
tab_bar_margin_height  0.0 0.0

# Tab bar min tabs to show
tab_bar_min_tabs       2

# Tab switch strategy
tab_switch_strategy    previous

# Tab title
tab_title_template     "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}:{title}"
active_tab_title_template  "{fmt.fg.tab}󰖟 {title}"

# ══════════════════════════════════════════════════════════════════════════════
# 🖱️ MOUSE
# ══════════════════════════════════════════════════════════════════════════════

# Pointer shape on text
pointer_shape_when_grabbed    arrow
default_pointer_shape         beam
pointer_shape_when_dragging   beam

# Click interval for selection
click_interval              -1.0

# Copy on select
copy_on_select              no

# Paste confirmation
paste_actions               quote-urls-at-prompt,confirm

# Strip trailing whitespace
strip_trailing_spaces       smart

# ══════════════════════════════════════════════════════════════════════════════
# ⌨️ KEYBOARD SHORTCUTS
# ══════════════════════════════════════════════════════════════════════════════

# Map leader key (not needed — using kitty_mod)
kitty_mod               ctrl+shift

# ── Copy / Paste ──────────────────────────────────────────────────────────────
map kitty_mod+c         copy_to_clipboard
map kitty_mod+v         paste_from_clipboard
map kitty_mod+s         paste_from_selection
map shift+insert        paste_from_selection

# ── Scrollback ────────────────────────────────────────────────────────────────
map kitty_mod+up        scroll_line_up
map kitty_mod+down      scroll_line_down
map kitty_mod+k         scroll_line_up
map kitty_mod+j         scroll_line_down
map kitty_mod+page_up   scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+home      scroll_home
map kitty_mod+end       scroll_end

# ── Window Management ─────────────────────────────────────────────────────────
map kitty_mod+enter     new_window_with_cwd
map kitty_mod+n         new_os_window_with_cwd
map kitty_mod+w         close_window
map kitty_mod+]         next_window
map kitty_mod+[         previous_window
map kitty_mod+f         move_window_forward
map kitty_mod+b         move_window_backward
map kitty_mod+`         move_window_to_top
map kitty_mod+r         start_resizing_window

# Window navigation (hjkl)
map kitty_mod+h         neighboring_window left
map kitty_mod+l         neighboring_window right

# Window split
map kitty_mod+\         launch --location=vsplit --cwd=current
map kitty_mod+-         launch --location=hsplit --cwd=current

# ── Tabs ──────────────────────────────────────────────────────────────────────
map kitty_mod+t         new_tab_with_cwd
map kitty_mod+q         close_tab
map kitty_mod+right     next_tab
map kitty_mod+left      previous_tab
map kitty_mod+1         goto_tab 1
map kitty_mod+2         goto_tab 2
map kitty_mod+3         goto_tab 3
map kitty_mod+4         goto_tab 4
map kitty_mod+5         goto_tab 5

# ── Font Size ─────────────────────────────────────────────────────────────────
map kitty_mod+equal         change_font_size all +1.0
map kitty_mod+plus          change_font_size all +1.0
map kitty_mod+minus         change_font_size all -1.0
map kitty_mod+0             change_font_size all 0
map ctrl+equal              change_font_size all +1.0
map ctrl+minus              change_font_size all -1.0

# ── Search ────────────────────────────────────────────────────────────────────
map kitty_mod+f         show_scrollback

# ── Miscellaneous ─────────────────────────────────────────────────────────────
map kitty_mod+F10       toggle_maximized
map kitty_mod+F11       toggle_fullscreen
map kitty_mod+u         input_unicode_character
map kitty_mod+F2        edit_config_file
map kitty_mod+F5        load_config_file
map kitty_mod+F6        debug_config

# Open URL from scrollback
map kitty_mod+e         open_url_with_hints

# Hints (for URL, file paths, etc.)
map kitty_mod+p>f       kitten hints --type path --program -
map kitty_mod+p>l       kitten hints --type line --program -
map kitty_mod+p>w       kitten hints --type word --program -
map kitty_mod+p>h       kitten hints --type hash --program -

# ── Layouts ──────────────────────────────────────────────────────────────────
map kitty_mod+l         next_layout

# ── Opacity ───────────────────────────────────────────────────────────────────
map ctrl+shift+a>m      set_background_opacity +0.1
map ctrl+shift+a>l      set_background_opacity -0.1
map ctrl+shift+a>1      set_background_opacity 1
map ctrl+shift+a>d      set_background_opacity default

# ══════════════════════════════════════════════════════════════════════════════
# 🔌 SSH KITTEN
# ══════════════════════════════════════════════════════════════════════════════

# Make SSH feel native in Kitty
map kitty_mod+F4        kitten ssh

# ══════════════════════════════════════════════════════════════════════════════
# 🐞 LAYOUTS
# ══════════════════════════════════════════════════════════════════════════════

enabled_layouts         tall:bias=50;full_size=1;mirrored=false, fat, grid, horizontal, vertical, stack

# ══════════════════════════════════════════════════════════════════════════════
# 📋 CLIPBOARD
# ══════════════════════════════════════════════════════════════════════════════

# Wayland clipboard
clipboard_control       write-clipboard write-primary read-clipboard-ask read-primary-ask

# ══════════════════════════════════════════════════════════════════════════════
# 🔗 SHELL INTEGRATION
# ══════════════════════════════════════════════════════════════════════════════

# Kitty shell integration (enables smart features)
shell_integration       enabled no-cursor

# Shell
shell                   /usr/bin/fish

# ══════════════════════════════════════════════════════════════════════════════
# 📊 MARKS
# ══════════════════════════════════════════════════════════════════════════════

mark1_foreground    black
mark1_background    #98d3cb
mark2_foreground    black
mark2_background    #f2dcd3
mark3_foreground    black
mark3_background    #f274bc

# ══════════════════════════════════════════════════════════════════════════════
# 🌐 REMOTE CONTROL
# ══════════════════════════════════════════════════════════════════════════════

allow_remote_control    yes
listen_on               unix:/tmp/kitty

# ══════════════════════════════════════════════════════════════════════════════
# 📁 MISC
# ══════════════════════════════════════════════════════════════════════════════

# Start in current directory when opening new tab/window
# (Handled by with_cwd variants above)

# Wayland app ID
wayland_titlebar_color  system
linux_display_server    wayland

# Term variable
term                    xterm-kitty

# Allow other programs to set window title
allow_hyperlinks        yes

# ══════════════════════════════════════════════════════════════════════════════
# 🎨 ADVANCED COLOR SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

# Color table (overridden by themes/current.conf)
# Set in themes/current.conf by theme-engine.sh