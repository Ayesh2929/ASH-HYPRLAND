# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — KITTY SSH KITTEN CONFIGURATION               ║
# ║           SSH integration for seamless remote terminal experience          ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# 🔒 SHELL INTEGRATION
# ══════════════════════════════════════════════════════════════════════════════

# Share shell integration with remote (automatic for supported shells)
# shell_integration = enabled

# ══════════════════════════════════════════════════════════════════════════════
# 📋 COPY ON REMOTE
# ══════════════════════════════════════════════════════════════════════════════

# Enable clipboard sharing with remote host
# This allows copy/paste to work seamlessly over SSH
# clipboard_control = write-clipboard write-primary

# ══════════════════════════════════════════════════════════════════════════════
# 🎨 THEME FOR SSH
# ══════════════════════════════════════════════════════════════════════════════

# You can specify a different theme for SSH sessions:
# include themes/ssh-theme.conf

# ══════════════════════════════════════════════════════════════════════════════
# 🔑 HOST-SPECIFIC SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

# Example: Custom settings per host
# hostname myserver.example.com
#   env TERM=xterm-256color
#   shell /bin/bash

# Example: Different font for remote sessions
# hostname *.example.com
#   font_size 11.0

# ══════════════════════════════════════════════════════════════════════════════
# 📡 MULTIPLEXER INTEGRATION
# ══════════════════════════════════════════════════════════════════════════════

# Automatically start tmux on remote (optional)
# hostname myserver
#   shell tmux new-session -A -s main

# ══════════════════════════════════════════════════════════════════════════════
# 🛡️ SECURITY
# ══════════════════════════════════════════════════════════════════════════════

# Transfer kitty terminfo to remote on first connect
# This ensures proper terminal detection on remote systems
# The kitten automatically handles this when launched with:
#   kitty +kitten ssh hostname
#   or alias: kssh hostname