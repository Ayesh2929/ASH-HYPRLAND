# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — ALACRITTY TERMINAL                           ║
# ║           GPU-accelerated terminal with ASH theme integration              ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# 🌐 GENERAL
# ══════════════════════════════════════════════════════════════════════════════

[general]
live_config_reload = true
import              = []

# ══════════════════════════════════════════════════════════════════════════════
# 🖥️ WINDOW
# ══════════════════════════════════════════════════════════════════════════════

[window]
dimensions       = { columns = 140, lines = 40 }
position         = "None"
padding          = { x = 14, y = 10 }
dynamic_padding  = false
decorations      = "None"
opacity          = 0.92
blur             = true
startup_mode     = "Windowed"
title            = "Alacritty"
dynamic_title    = true
class            = { instance = "Alacritty", general = "Alacritty" }
resize_increments = false
option_as_alt    = "None"

# ══════════════════════════════════════════════════════════════════════════════
# 📜 SCROLLBACK
# ══════════════════════════════════════════════════════════════════════════════

[scrolling]
history     = 10000
multiplier  = 3

# ══════════════════════════════════════════════════════════════════════════════
# 🔤 FONT
# ══════════════════════════════════════════════════════════════════════════════

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style  = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style  = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style  = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style  = "Bold Italic"

[font.offset]
x = 0
y = 1

[font.glyph_offset]
x = 0
y = 0

builtin_box_drawing = true

# ══════════════════════════════════════════════════════════════════════════════
# 🎨 COLORS — Catppuccin Mocha (ASH default)
# ══════════════════════════════════════════════════════════════════════════════

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background  = "#1e1e2e"
foreground  = "#cdd6f4"
dim_foreground = "#bac2de"
bright_foreground = "#cdd6f4"

[colors.cursor]
text   = "#1e1e2e"
cursor = "#cba6f7"

[colors.vi_mode_cursor]
text   = "#1e1e2e"
cursor = "#89b4fa"

[colors.search]
matches = { background = "#89b4fa", foreground = "#1e1e2e" }
focused_match = { background = "#cba6f7", foreground = "#1e1e2e" }

[colors.selection]
text       = "#1e1e2e"
background = "#cba6f7"

[colors.hints]
start = { background = "#f9e2af", foreground = "#1e1e2e" }
end   = { background = "#f38ba8", foreground = "#1e1e2e" }

[colors.footer_bar]
background  = "#313244"
foreground  = "#cdd6f4"

[colors.normal]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#cba6f7"
cyan    = "#94e2d5"
white   = "#bac2de"

[colors.bright]
black   = "#585b70"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#cba6f7"
cyan    = "#94e2d5"
white   = "#a6adc8"

[colors.dim]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#cba6f7"
cyan    = "#94e2d5"
white   = "#bac2de"

# ══════════════════════════════════════════════════════════════════════════════
# 🔔 BELL
# ══════════════════════════════════════════════════════════════════════════════

[bell]
animation = "EaseOutExpo"
duration  = 150
color     = "#cba6f7"
command   = "None"

# ══════════════════════════════════════════════════════════════════════════════
# 🖱️ MOUSE
# ══════════════════════════════════════════════════════════════════════════════

[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse   = "Right"
action  = "PasteSelection"

[[mouse.bindings]]
mouse   = "Middle"
action  = "PasteSelection"

# ══════════════════════════════════════════════════════════════════════════════
# 🖱️ CURSOR
# ══════════════════════════════════════════════════════════════════════════════

[cursor]
style    = { shape = "Beam", blinking = "On" }
vi_mode_style  = "Block"
blink_interval = 500
blink_timeout  = 0
unfocused_hollow = true
thickness = 0.15

# ══════════════════════════════════════════════════════════════════════════════
# ⌨️ KEYBOARD BINDINGS
# ══════════════════════════════════════════════════════════════════════════════

[keyboard]
bindings = [
    { key = "C",          mods = "Control|Shift", action = "Copy" },
    { key = "V",          mods = "Control|Shift", action = "Paste" },
    { key = "Insert",     mods = "Shift",          action = "PasteSelection" },
    { key = "Key0",       mods = "Control",        action = "ResetFontSize" },
    { key = "Equals",     mods = "Control",        action = "IncreaseFontSize" },
    { key = "Plus",       mods = "Control",        action = "IncreaseFontSize" },
    { key = "Minus",      mods = "Control",        action = "DecreaseFontSize" },
    { key = "F11",        mods = "None",           action = "ToggleFullscreen" },
    { key = "L",          mods = "Control",        action = "ClearHistory" },
    { key = "PageUp",     mods = "Shift",          action = "ScrollPageUp" },
    { key = "PageDown",   mods = "Shift",          action = "ScrollPageDown" },
    { key = "Home",       mods = "Shift",          action = "ScrollToTop" },
    { key = "End",        mods = "Shift",          action = "ScrollToBottom" },
    { key = "K",          mods = "Control|Shift",  action = "ScrollLineUp" },
    { key = "J",          mods = "Control|Shift",  action = "ScrollLineDown" },
    { key = "Return",     mods = "Control|Shift",  action = "SpawnNewInstance" },
    { key = "F",          mods = "Control|Shift",  action = "SearchForward" },
    { key = "B",          mods = "Control|Shift",  action = "SearchBackward" },
]

# ══════════════════════════════════════════════════════════════════════════════
# 🔧 TERMINAL
# ══════════════════════════════════════════════════════════════════════════════

[terminal]
shell = { program = "/usr/bin/fish", args = ["-l"] }
osc52  = "CopyPaste"

# ══════════════════════════════════════════════════════════════════════════════
# ✅ SELECTION
# ══════════════════════════════════════════════════════════════════════════════

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard      = true