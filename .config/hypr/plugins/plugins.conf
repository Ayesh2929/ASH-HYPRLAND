# ══════════════════════════════════════════════════════════════════════════════
# 📦 HYPRPM PLUGINS
# ══════════════════════════════════════════════════════════════════════════════
# Install plugins with: hyprpm add <github-url>
# Enable with: hyprpm enable <plugin-name>

# ── Hyprspace (workspace overview) ────────────────────────────────────────────
# plugin = /usr/lib/hyprspace/hyprspace.so

# ── Hyprexpo (expo view for workspaces) ───────────────────────────────────────
# plugin = /usr/lib/hypr/hyprexpo.so
# plugin:hyprexpo:columns = 3
# plugin:hyprexpo:gap_size = 5
# plugin:hyprexpo:bg_col = rgb(111111)
# plugin:hyprexpo:workspace_method = center current

# ── Hyprbars (title bars for floating windows) ────────────────────────────────
# plugin = /usr/lib/hypr/hyprbars.so
# plugin:hyprbars:bar_height = 20
# plugin:hyprbars:bar_color = rgba(1e1e2ecc)
# plugin:hyprbars:col.text = rgba(cdd6f4ff)
# plugin:hyprbars:bar_text_size = 10
# plugin:hyprbars:bar_text_font = JetBrainsMono Nerd Font

# ── Hyprwinwrap (desktop widgets) ─────────────────────────────────────────────
# plugin = /usr/lib/hypr/hyprwinwrap.so

# ── Hycov (macOS-style overview) ──────────────────────────────────────────────
# plugin = /usr/lib/hypr/hycov.so
# plugin:hycov:overview_gappo = 60
# plugin:hycov:overview_gappi = 24

# ══════════════════════════════════════════════════════════════════════════════
# 📋 NOTES
# ══════════════════════════════════════════════════════════════════════════════
# To install Hyprpm:
#   sudo pacman -S hyprpm
#
# To add a plugin:
#   hyprpm add https://github.com/OWNER/PLUGIN
#   hyprpm enable PLUGIN_NAME
#
# Official plugin list:
#   https://wiki.hyprland.org/Plugins/Available-Plugins/