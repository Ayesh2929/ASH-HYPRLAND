# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — INPUT CONFIGURATION                           ║
# ║           Keyboard, Mouse, Touchpad, Tablet settings                         ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# ⌨️ KEYBOARD CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

input {
    # ── Layout ─────────────────────────────────────────────────────────────
    # Change kb_layout to your keyboard layout (us, gb, de, fr, es, etc.)
    # Multiple layouts: kb_layout = us,ru  (switch with: SUPER + Space in submap)
    kb_layout    = us
    kb_variant   =              # us: "", dvorak, colemak, workman
    kb_model     =              # Leave empty for default
    kb_options   = grp:alt_shift_toggle,caps:escape  # CapsLock = Escape
    kb_rules     =

    # ── Repeat ─────────────────────────────────────────────────────────────
    # Key repeat delay (ms before repeat starts) — lower = faster
    repeat_delay = 300
    # Key repeat rate (repeats per second) — higher = faster
    repeat_rate  = 50

    # ── Numlock ────────────────────────────────────────────────────────────
    # Enable numlock on startup
    numlock_by_default = true

    # ── Follow Mouse Focus ──────────────────────────────────────────────────
    # 0 = cursor doesn't move focus
    # 1 = cursor moves focus (default)
    # 2 = cursor moves focus but doesn't focus on move
    # 3 = cursor moves focus (fullscreen)
    follow_mouse = 1

    # ── Mouse Warping ──────────────────────────────────────────────────────
    # Mouse warps to newly focused window center
    # 0 = disabled, 1 = enabled, 2 = force (even fullscreen)
    mouse_refocus = false

    # ── Float/Window Focus ──────────────────────────────────────────────────
    float_switch_override_focus = 2

    # ── Sensitivity ────────────────────────────────────────────────────────
    # Cursor sensitivity (-1.0 to 1.0, 0 = no modification)
    sensitivity = 0.0

    # ── Accel Profile ──────────────────────────────────────────────────────
    # flat = no acceleration (recommended for gaming)
    # adaptive = mouse acceleration
    accel_profile = flat

    # ── Special Keys ───────────────────────────────────────────────────────
    # Forward binds to the compositor
    force_no_accel = true

    # ══════════════════════════════════════════════════════════════════════
    # 🖱️ MOUSE CONFIGURATION
    # ══════════════════════════════════════════════════════════════════════

    # Mouse sensitivity
    # sensitivity = 0.0

    # Scroll factor (multiplier for scroll speed)
    scroll_factor = 1.0

    # Natural scroll (reverse scroll direction — Mac-style)
    # true = natural scrolling (content follows finger direction)
    # false = traditional scrolling
    natural_scroll = false

    # Left-handed mouse
    left_handed = false

    # ══════════════════════════════════════════════════════════════════════
    # 🖱️ TOUCHPAD CONFIGURATION
    # ══════════════════════════════════════════════════════════════════════

    touchpad {
        # Natural scroll (true = recommended for touchpad)
        natural_scroll    = true

        # Tap to click (single finger tap = left click)
        tap-to-click      = true

        # Tap to drag (tap, hold, drag)
        tap-and-drag      = true

        # Drag lock (lift finger without dropping drag)
        drag_lock         = true

        # Middle click on three-finger tap
        middle_button_emulation = true

        # Two-finger right click
        clickfinger_behavior = false

        # Scroll method: two_finger, edge, on_button_down, none
        scroll_method     = two_finger

        # Scroll factor for touchpad
        scroll_factor     = 0.5

        # Disable touchpad while typing
        disable_while_typing = true

        # Touchpad sensitivity
        # sensitivity = 0.3

        # Touchpad scroll natural
        # natural_scroll = true
    }
}

# ══════════════════════════════════════════════════════════════════════════════
