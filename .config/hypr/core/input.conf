# ══════════════════════════════════════════════════════════════════════════════
# 🔧 INPUT METHOD (IME) — For CJK languages
# ══════════════════════════════════════════════════════════════════════════════

# For Japanese/Chinese/Korean input:
# Install: fcitx5 fcitx5-mozc (Japanese) or fcitx5-chinese-addons (Chinese)
# Then add to env.conf:
# env = GTK_IM_MODULE,fcitx
# env = QT_IM_MODULE,fcitx
# env = XMODIFIERS,@im=fcitx
# env = SDL_IM_MODULE,fcitx