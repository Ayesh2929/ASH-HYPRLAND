# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — CURSOR CONFIGURATION                         ║
# ║           Cursor theme, size, and behavior settings                        ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

cursor {
    # ── Cursor Theme ──────────────────────────────────────────────────────────
    # Theme name (must be installed in /usr/share/icons/ or ~/.local/share/icons/)
    theme = Bibata-Modern-Ice

    # Cursor size in pixels
    size  = 24

    # ── Cursor Behavior ───────────────────────────────────────────────────────
    # Hide cursor after N milliseconds of inactivity (0 = never hide)
    inactive_timeout = 0

    # Hide cursor when typing
    # 0 = disabled, 1 = enabled
    no_warps = false

    # Enable cursor warping (cursor jumps to center of new focused window)
    # true = warp cursor, false = cursor stays
    no_hardware_cursors = false

    # Cursor zoom factor (1.0 = normal, controlled by magnifier.sh)
    zoom_factor = 1.0

    # Zoom is rigid (cursor doesn't move when zooming)
    zoom_rigid  = false

    # ── Wayland Cursor ────────────────────────────────────────────────────────
    # Sync cursor theme to Wayland clients
    # (Uses XCURSOR_THEME and XCURSOR_SIZE env vars from env.conf)

    # ── Click Animation ───────────────────────────────────────────────────────
    # Enable ripple effect on click (requires Hyprland 0.41+)
    # enable_hyprcursor = true

    # Allow holding last cursor image (prevents cursor flicker)
    # allow_holding_last_cursor = false

    # ── Persistent Warp ───────────────────────────────────────────────────────
    # Warp cursor to center of window on focus
    # 0 = disabled (default), 1 = always, 2 = only on workspace change
    persistent_warps = false
}

# ══════════════════════════════════════════════════════════════════════════════
# 🔧 CURSOR THEME APPLICATION
# ══════════════════════════════════════════════════════════════════════════════
# Applied via autostart.conf:
#   exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# GTK cursor (via gsettings in reload-all.sh):
#   gsettings set org.gnome.desktop.interface cursor-theme "Bibata-Modern-Ice"
#   gsettings set org.gnome.desktop.interface cursor-size 24

# Qt cursor (via env.conf):
#   env = XCURSOR_THEME,Bibata-Modern-Ice
#   env = XCURSOR_SIZE,24

