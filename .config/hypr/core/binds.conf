# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — BIND OPTIONS                                  ║
# ║           Global keybind settings and modifier configuration                 ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

binds {
    # ══════════════════════════════════════════════════════════════════════
    # 🎯 FOCUS BEHAVIOR
    # ══════════════════════════════════════════════════════════════════════

    # Focus window on scroll (when hovering)
    scroll_event_delay = 300

    # ══════════════════════════════════════════════════════════════════════
    # 🔄 WORKSPACE BEHAVIOR
    # ══════════════════════════════════════════════════════════════════════

    # Navigate to monitor that matches workspace on the same row
    workspace_back_and_forth = true

    # Allow workspace back and forth on same workspace (toggle)
    allow_workspace_cycles = true

    # Move focus to the previously focused workspace
    # focus_preferred_method = 0

    # ══════════════════════════════════════════════════════════════════════
    # 🖱️ MOUSE BEHAVIOR
    # ══════════════════════════════════════════════════════════════════════

    # Scroll while dragging window changes workspace
    # drag_into_group = 2

    # ══════════════════════════════════════════════════════════════════════
    # ⌨️ PASS-THROUGH
    # ══════════════════════════════════════════════════════════════════════

    # Pass events through when no window is matched
    # pass_mouse_when_bound = false

    # ══════════════════════════════════════════════════════════════════════
    # 📋 WINDOW CYCLING
    # ══════════════════════════════════════════════════════════════════════

    # Window cycling with repeat (ALT+TAB behavior)
    # movefocus_cycles_fullscreen = false

    # ══════════════════════════════════════════════════════════════════════
    # 🔒 DISABLE BINDS IN LOCKED STATE
    # ══════════════════════════════════════════════════════════════════════

    # Disable all non-locked binds when lockscreen is active
    disable_keybinds_while_asleep = 1

    # ══════════════════════════════════════════════════════════════════════
    # 🎮 SUBMAP BEHAVIOR
    # ══════════════════════════════════════════════════════════════════════

    # True = if bind not caught by submap, pass to global
    # False = if bind not caught, do nothing
    # ignore_group_lock = false
}

# ══════════════════════════════════════════════════════════════════════════════
# 🖱️ MOUSE BUTTON BINDS
# ══════════════════════════════════════════════════════════════════════════════

# SUPER + LMB drag = move window
bindm = SUPER, mouse:272, movewindow

# SUPER + RMB drag = resize window
bindm = SUPER, mouse:273, resizewindow

# SUPER + Middle Click = toggle floating
bind = SUPER, mouse:274, togglefloating

# SUPER + Scroll Up/Down = change workspace
bind = SUPER, mouse_up, workspace, e-1
bind = SUPER, mouse_down, workspace, e+1

# ══════════════════════════════════════════════════════════════════════════════
# 🎛️ MODIFIER DEFINITIONS
# ══════════════════════════════════════════════════════════════════════════════
# Reference for keybinds.conf:
#
# SUPER    = Windows key / Command key
# SHIFT    = Shift key
# CTRL     = Control key
# ALT      = Alt key (Use ALT_L or ALT_R for left/right)
# HYPER    = Hyper key (some keyboards)
#
# Modifiers can be combined: SUPER SHIFT, CTRL ALT, etc.
#
# Special keys:
# Return      = Enter
# Space       = Spacebar
# Tab         = Tab
# Escape      = Escape
# BackSpace   = Backspace
# Delete      = Delete
# Insert      = Insert
# Home        = Home
# End         = End
# Page_Up     = Page Up
# Page_Down   = Page Down
# Print       = Print Screen
# Pause       = Pause/Break
# F1-F12      = Function keys
# left/right/up/down = Arrow keys