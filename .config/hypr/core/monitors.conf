# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — MONITOR CONFIGURATION                         ║
# ║           Configure your displays here                                       ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝
#
# 📖 SYNTAX:
#   monitor = NAME, RESOLUTION@REFRESHRATE, POSITION, SCALE
#   monitor = NAME, RESOLUTION@REFRESHRATE, POSITION, SCALE, mirror, MIRROR_OF
#
# 🔍 Find monitor names:
#   hyprctl monitors
#   wlr-randr
#   kscreen-doctor --outputs
#
# 📐 POSITION is in pixels (virtual coordinates):
#   0x0      = top-left
#   1920x0   = to the right of a 1920px wide monitor
#   -1920x0  = to the left
#   0x-1080  = above
#
# 🎯 SCALE:
#   1        = 100% (standard)
#   1.5      = 150% (HiDPI)
#   2        = 200% (4K HiDPI)
#
# ⚡ REFRESH RATE:
#   60       = 60Hz
#   144      = 144Hz
#   165      = 165Hz
#   240      = 240Hz
#   2160000  = use highest available
#
# ══════════════════════════════════════════════════════════════════════════════
# 🖥️ DEFAULT CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

# Auto-detect and use preferred settings for any connected monitor
# Remove this line when specifying monitors explicitly below
monitor = ,preferred,auto,auto

# ══════════════════════════════════════════════════════════════════════════════
# 🖥️ COMMON SINGLE MONITOR SETUPS
# ══════════════════════════════════════════════════════════════════════════════
# Uncomment ONE of the following to replace "preferred,auto,auto" above:

# 1080p 60Hz
# monitor = HDMI-A-1, 1920x1080@60, 0x0, 1

# 1080p 144Hz
# monitor = HDMI-A-1, 1920x1080@144, 0x0, 1

# 1440p 144Hz
# monitor = DP-1, 2560x1440@144, 0x0, 1

# 1440p 165Hz
# monitor = DP-1, 2560x1440@165, 0x0, 1

# 4K 60Hz (with HiDPI scaling)
# monitor = DP-1, 3840x2160@60, 0x0, 1.5

# 4K 120Hz (with HiDPI scaling)
# monitor = DP-1, 3840x2160@120, 0x0, 1.5

# Ultrawide 3440x1440
# monitor = DP-1, 3440x1440@144, 0x0, 1

# ══════════════════════════════════════════════════════════════════════════════
# 🖥️ COMMON DUAL MONITOR SETUPS
# ══════════════════════════════════════════════════════════════════════════════

# Side by side (main left, secondary right)
# monitor = HDMI-A-1, 1920x1080@144, 0x0, 1
# monitor = DP-1, 2560x1440@165, 1920x0, 1

# Side by side (main right, secondary left)
# monitor = HDMI-A-1, 1920x1080@60, 0x0, 1
# monitor = DP-1, 2560x1440@144, 1920x0, 1

# Stacked (main bottom, secondary above)
# monitor = DP-1, 2560x1440@144, 0x0, 1
# monitor = HDMI-A-1, 1920x1080@60, 320x-1080, 1

# ══════════════════════════════════════════════════════════════════════════════
# 💻 LAPTOP SPECIFIC
# ══════════════════════════════════════════════════════════════════════════════

# Built-in display (eDP) + External monitor
# monitor = eDP-1, 1920x1080@60, 0x0, 1
# monitor = HDMI-A-1, 1920x1080@60, 1920x0, 1

# HiDPI laptop + External
# monitor = eDP-1, 2560x1600@120, 0x0, 1.5
# monitor = HDMI-A-1, 1920x1080@60, 1707x0, 1

# Close laptop lid (use only external)
# monitor = eDP-1, disabled

# ══════════════════════════════════════════════════════════════════════════════
# 🎮 GAMING MONITOR SETUP
# ══════════════════════════════════════════════════════════════════════════════

# High refresh gaming display
# monitor = DP-1, 2560x1440@165, 0x0, 1
# monitor = HDMI-A-1, 1920x1080@60, 2560x180, 1

# ══════════════════════════════════════════════════════════════════════════════
# 🔧 WORKSPACE → MONITOR ASSIGNMENTS
# ══════════════════════════════════════════════════════════════════════════════
# These are defined in workspacerules.conf but documented here for reference:
#
# workspace = 1, monitor:DP-1          # Workspace 1 on DP-1
# workspace = 2, monitor:HDMI-A-1      # Workspace 2 on HDMI-A-1
# workspace = 3, monitor:DP-1
# workspace = 4, monitor:HDMI-A-1
# ... etc

# ══════════════════════════════════════════════════════════════════════════════
# 🌡️ MONITOR COLOR PROFILE
# ══════════════════════════════════════════════════════════════════════════════
# Note: Gammastep/wlsunset handles night light — see scripts/dpms.sh
#
# Default color temperature: 6500K (daylight)
# Night mode color temperature: 4000K
# These are adjusted dynamically by dpms.sh

# ══════════════════════════════════════════════════════════════════════════════
# 🔧 TROUBLESHOOTING
# ══════════════════════════════════════════════════════════════════════════════
#
# Black screen after adding monitor:
#   → Run: hyprctl reload
#   → Check: ~/.cache/ash-dots/logs/
#
# Wrong refresh rate:
#   → List available: hyprctl monitors | grep "availableModes"
#
# Scaling issues:
#   → Try scale 1.25 or 1.5 for 2K/4K
#   → Some apps need: GDK_SCALE=2 or QT_SCALE_FACTOR=1.5
#
# Monitor not detected:
#   → Try: wlr-randr
#   → Check kernel messages: dmesg | grep drm