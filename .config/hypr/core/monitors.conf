1.4 — core/input.conf
ini
# ~/.config/hypr/core/input.conf
input {
kb_layout = us
kb_variant =
kb_model =
kb_options =
kb_rules =
numlock_by_default = false
sensitivity = 0
accel_profile = flat
force_no_accel = false
follow_mouse = 1
mouse_refocus = true
float_switch_override_focus = 2
touchpad {
natural_scroll = true
disable_while_typing = true
tap-to-click = true
tap-and-drag = true
drag_lock = true
scroll_factor = 1.0
}
}