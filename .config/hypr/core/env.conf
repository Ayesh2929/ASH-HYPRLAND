# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — ENVIRONMENT CONFIGURATION                     ║
# ║           80+ environment variables for Wayland/Qt/GTK/GPU                  ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# 🖥️ WAYLAND CORE ENVIRONMENT
# ══════════════════════════════════════════════════════════════════════════════

# Force Wayland session type
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_CURRENT_DESKTOP,Hyprland

# Wayland display backend
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# ══════════════════════════════════════════════════════════════════════════════
# 🎨 QT WAYLAND CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

# Qt Wayland platform
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct

# Qt scaling and DPI
env = QT_SCALE_FACTOR,1
env = QT_ENABLE_HIGHDPI_SCALING,1

# ══════════════════════════════════════════════════════════════════════════════
# 🎨 GTK CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

# GTK theme settings
env = GTK_THEME,Catppuccin-Mocha-Standard-Blue-Dark
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24

# GTK scaling
env = GDK_SCALE,1
env = GDK_DPI_SCALE,1

# ══════════════════════════════════════════════════════════════════════════════
# 🔧 TOOLKIT BACKENDS
# ══════════════════════════════════════════════════════════════════════════════

# MOZ (Firefox/Thunderbird)
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_WAYLAND_USE_VAAPI,1
env = MOZ_DBUS_REMOTE,1

# Java applications (fix blurry windows)
env = _JAVA_AWT_WM_NONREPARENTING,1
env = AWT_TOOLKIT,MToolkit

# Electron applications
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = ELECTRON_ENABLE_WAYLAND,1

# Chromium-based applications
env = CHROMIUM_FLAGS,--ozone-platform=wayland --enable-features=UseOzonePlatform

# ══════════════════════════════════════════════════════════════════════════════
# 🎮 GPU & GRAPHICS CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

# Hardware video acceleration
env = LIBVA_DRIVER_NAME,radeonsi
# env = LIBVA_DRIVER_NAME,nvidia      # NVIDIA — uncomment if using NVIDIA
# env = LIBVA_DRIVER_NAME,iHD         # Intel — uncomment if using Intel

# DRI configuration
env = WLR_DRM_NO_ATOMIC,1

# Mesa / OpenGL
env = MESA_GL_VERSION_OVERRIDE,4.6
env = MESA_GLSL_VERSION_OVERRIDE,460
env = __GL_THREADED_OPTIMIZATIONS,1

# VDPAU
env = VDPAU_DRIVER,radeonsi
# env = VDPAU_DRIVER,nvidia           # NVIDIA — uncomment

# Vulkan
env = VK_ICD_FILENAMES,/usr/share/vulkan/icd.d/radeon_icd.x86_64.json
# env = VK_ICD_FILENAMES,/usr/share/vulkan/icd.d/nvidia_icd.json  # NVIDIA

# ══════════════════════════════════════════════════════════════════════════════
# 🖤 NVIDIA-SPECIFIC (uncomment entire section if using NVIDIA)
# ══════════════════════════════════════════════════════════════════════════════

# NVIDIA DRM modesetting (required in boot params too)
# env = LIBVA_DRIVER_NAME,nvidia
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = GBM_BACKEND,nvidia-drm
# env = WLR_NO_HARDWARE_CURSORS,1
# env = WLR_DRM_NO_ATOMIC,1
# env = NVD_BACKEND,direct
# env = __NV_PRIME_RENDER_OFFLOAD,1
# env = __VK_LAYER_NV_optimus,NVIDIA_only
# env = VK_ICD_FILENAMES,/usr/share/vulkan/icd.d/nvidia_icd.json

# ══════════════════════════════════════════════════════════════════════════════
# 💡 DISPLAY & RENDERING
# ══════════════════════════════════════════════════════════════════════════════

# Hardware cursor (set to 0 for NVIDIA)
env = WLR_NO_HARDWARE_CURSORS,0

# Renderer selection
env = WLR_RENDERER,vulkan
# env = WLR_RENDERER,gles2             # Fallback if Vulkan has issues

# OpenGL rendering
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0

# ══════════════════════════════════════════════════════════════════════════════
# 🔊 AUDIO CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

# PipeWire
env = PIPEWIRE_DEBUG,0

# PulseAudio compatibility
env = PULSE_SERVER,unix:/run/user/1000/pulse/native

# ══════════════════════════════════════════════════════════════════════════════
# 🐟 SHELL & EDITOR
# ══════════════════════════════════════════════════════════════════════════════

# Default shell
env = SHELL,/usr/bin/fish

# Default editor
env = EDITOR,nvim
env = VISUAL,nvim
env = SUDO_EDITOR,nvim

# Default terminal
env = TERMINAL,kitty
env = TERM,kitty

# Default browser
env = BROWSER,firefox
env = DEFAULT_BROWSER,firefox

# Pager
env = PAGER,less
env = LESS,-R --mouse --wheel-lines=3

# ══════════════════════════════════════════════════════════════════════════════
# 📁 XDG BASE DIRECTORIES
# ══════════════════════════════════════════════════════════════════════════════

env = XDG_DATA_HOME,$HOME/.local/share
env = XDG_CONFIG_HOME,$HOME/.config
env = XDG_CACHE_HOME,$HOME/.cache
env = XDG_STATE_HOME,$HOME/.local/state
env = XDG_RUNTIME_DIR,/run/user/1000

# XDG user directories
env = XDG_DESKTOP_DIR,$HOME/Desktop
env = XDG_DOWNLOAD_DIR,$HOME/Downloads
env = XDG_DOCUMENTS_DIR,$HOME/Documents
env = XDG_PICTURES_DIR,$HOME/Pictures
env = XDG_MUSIC_DIR,$HOME/Music
env = XDG_VIDEOS_DIR,$HOME/Videos

# ══════════════════════════════════════════════════════════════════════════════
# 🔐 SECURITY & AUTHENTICATION
# ══════════════════════════════════════════════════════════════════════════════

# GPG
env = GPG_TTY,$(tty)

# SSH agent
env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/ssh-agent.socket

# ══════════════════════════════════════════════════════════════════════════════
# 🌐 DBUS
# ══════════════════════════════════════════════════════════════════════════════

env = DBUS_SESSION_BUS_ADDRESS,unix:path=/run/user/1000/bus

# ══════════════════════════════════════════════════════════════════════════════
# 📦 DEVELOPMENT TOOLS
# ══════════════════════════════════════════════════════════════════════════════

# Rust
env = CARGO_HOME,$HOME/.cargo
env = RUSTUP_HOME,$HOME/.rustup

# Go
env = GOPATH,$HOME/go
env = GOBIN,$HOME/go/bin

# Node / NVM
env = NVM_DIR,$HOME/.nvm

# Python
env = PYTHONSTARTUP,$HOME/.config/python/startup.py
env = PYTHONDONTWRITEBYTECODE,1
env = PYTHONPYCACHEPREFIX,$HOME/.cache/python

# ══════════════════════════════════════════════════════════════════════════════
# 🎛️ ASH DOTFILES SPECIFIC
# ══════════════════════════════════════════════════════════════════════════════

# ASH dotfiles directory
env = ASH_DOTFILES,$HOME/.dotfiles
env = ASH_CONFIG,$HOME/.config
env = ASH_CACHE,$HOME/.cache/ash-dots
env = ASH_STATE,$HOME/.local/state/ash-dots
env = ASH_VERSION,3.0.0
env = ASH_WALLPAPER_DIR,$HOME/Pictures/Wallpapers

# Theme engine settings
env = ASH_THEME_COLORS,24
env = ASH_THEME_SATURATION_MIN,30

# ══════════════════════════════════════════════════════════════════════════════
