##################################################
# WAYLAND SESSION IDENTITY #
##################################################
env = WAYLAND_DISPLAY, wayland-1
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_DATA_DIRS, $HOME/.local/share:/usr/local/share:/usr/share
env = XDG_CONFIG_HOME, $HOME/.config
env = XDG_CACHE_HOME, $HOME/.cache
env = XDG_STATE_HOME, $HOME/.local/state
env = DESKTOP_SESSION, hyprland
env = HYPRLAND_CMD, Hyprland
##################################################
# QT THEMING #
##################################################
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = QT_SCALE_FACTOR, 1
env = QT_FONT_DPI, 96
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_STYLE_OVERRIDE, kvantum
env = QT_WAYLAND_FORCE_DPI, physical
##################################################
# GTK THEMING #
##################################################
env = GDK_BACKEND, wayland,x11,*
env = GDK_SCALE, 1
env = GDK_DPI_SCALE, 1
env = GTK_THEME, adw-gtk3-dark:dark
env = GTK2_RC_FILES, $HOME/.config/gtk-2.0/gtkrc
env = GTK_IM_MODULE, fcitx
##################################################
# TOOLKIT BACKENDS #
##################################################
env = SDL_VIDEODRIVER, wayland,x11,offscreen
env = SDL_DYNAMIC_API, /usr/lib/libSDL2-2.0.so
env = _JAVA_AWT_WM_NONREPARENTING, 1
env = _JAVA_OPTIONS, -Dawt.useSystemAAFontSettings=on
env = JAVA_FONTS, /usr/share/fonts
env = CLUTTER_BACKEND, wayland
env = BEMENU_BACKEND, wayland
env = ELM_ENGINE, wayland_egl
env = ECORE_EVAS_ENGINE, wayland_egl
env = GDK_PLATFORM, wayland
##################################################
# CURSOR #
##################################################
env = XCURSOR_THEME, Bibata-Modern-Ice
env = XCURSOR_SIZE, 24
env = XCURSOR_PATH, $HOME/.local/share/icons:/usr/share/icons
env = HYPRCURSOR_THEME, Bibata-Modern-Ice
env = HYPRCURSOR_SIZE, 24
env = WLR_NO_HARDWARE_CURSORS, 0
##################################################
# ELECTRON / CHROMIUM #
##################################################
env = ELECTRON_OZONE_PLATFORM_HINT, wayland
env = NIXOS_OZONE_WL, 1
env = OZONE_PLATFORM, wayland
env = CHROME_EXTRA_FLAGS, --enable-features=VaapiVideoDecodeLinuxGL
env = ELECTRON_TRASH, gio
##################################################
# FIREFOX / MOZILLA #
##################################################
env = MOZ_ENABLE_WAYLAND, 1
env = MOZ_WEBRENDER, 1
env = MOZ_ACCELERATED, 1
env = MOZ_DBUS_REMOTE, 1
env = MOZ_USE_XINPUT2, 1
##################################################
# AMD GPU (DEFAULT) #
##################################################
env = LIBVA_DRIVER_NAME, radeonsi
env = VDPAU_DRIVER, radeonsi
env = MESA_LOADER_DRIVER_OVERRIDE, radeonsi
env = AMD_VULKAN_ICD, RADV
env = RADV_PERFTEST, gpl,ngg
env = ANV_QUEUE_THREAD_DISABLE, 1
env = mesa_glthread, true
env = MESA_NO_ERROR, 1
# ■■ NVIDIA (uncomment if using NVIDIA) ■■■■■■■■■■
# env = LIBVA_DRIVER_NAME, nvidia
# env = __GLX_VENDOR_LIBRARY_NAME, nvidia
# env = GBM_BACKEND, nvidia-drm
# env = __NV_PRIME_RENDER_OFFLOAD, 1
# env = __VK_LAYER_NV_optimus, NVIDIA_only
# env = NVD_BACKEND, direct
# env = WLR_DRM_NO_ATOMIC, 1
# env = PROTON_ENABLE_NGX_UPDATER, 1
# ■■ INTEL (uncomment if using Intel) ■■■■■■■■■■■■
# env = LIBVA_DRIVER_NAME, iHD
# env = INTEL_OUTPUT_COLORIMETRY, FULL
##################################################
# PERFORMANCE &amp; RENDER #
##################################################
env = WLR_DRM_NO_ATOMIC, 0
env = WLR_RENDERER_ALLOW_SOFTWARE, 0
env = HYPRLAND_NO_SD_NOTIFY, 0
env = AQ_DRM_DEVICES, /dev/dri/card0
env = WLR_USE_LIBINPUT, 1
##################################################
# GAMING #
##################################################
env = MANGOHUD, 0
env = DXVK_ASYNC, 1
env = PROTON_NO_FSYNC, 0
env = PROTON_ENABLE_NVAPI, 0
env = GAMEMODERUNEXEC, env MANGOHUD=1
##################################################
# PORTAL &amp; DBUS #
##################################################
env = DBUS_SESSION_BUS_ADDRESS, unix:path=/run/user/1000/bus
env = GSM_SKIP_SSH_AGENT_WORKAROUND, true
env = SSH_AUTH_SOCK, $XDG_RUNTIME_DIR/gcr/ssh
##################################################
# PERSONAL DEFAULTS #
##################################################
nvim
nvim
kitty
firefox
thunar
less
nvim +Man!
80
/usr/bin/fish
1
truecolor
xterm-256color
env = TERM_PROGRAM, kitty
env = EDITOR, nvim
env = VISUAL,
env = SUDO_EDITOR,
env = TERMINAL,
env = BROWSER,
env = FILE_MANAGER,
env = PAGER,
env = MANPAGER,
env = MANWIDTH,
env = SHELL,
env = FISH_TERM24BIT,
env = COLORTERM,
env = TERM,
 ##################################################
# PATH ADDITIONS #
##################################################
env = PATH, $HOME/.local/bin:$HOME/.cargo/bin:$HOME/.go/bin:$HOME/.bun/bin:$PATH
##################################################
# ASH DOTFILES VARIABLES #
##################################################
env = ASH_DOTS, $HOME/.dotfiles
env = ASH_CFG, $HOME/.config
env = ASH_SCRIPTS, $HOME/.config/hypr/scripts
env = ASH_THEMES, $HOME/.config/hypr/themes
env = ASH_CACHE, $HOME/.cache/ash-dots
env = ASH_STATE, $HOME/.local/state/ash-dots
env = ASH_VERSION, 3.0
env = ASH_AUTHOR, Ash
env = ASH_THEME_ENGINE, $HOME/.config/hypr/scripts/theme-engine.sh
##################################################
# LESS COLORS (Man Pages) #
##################################################
env = LESS_TERMCAP_mb, \033[01;31m
env = LESS_TERMCAP_md, \033[01;35m
env = LESS_TERMCAP_me, \033[0m
env = LESS_TERMCAP_se, \033[0m
env = LESS_TERMCAP_so, \033[01;33m
env = LESS_TERMCAP_ue, \033[0m
env = LESS_TERMCAP_us, \033[04;36m
env = LESS, -R --use-color -F -X
