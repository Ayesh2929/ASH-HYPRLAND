# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — GENERAL WINDOW MANAGER SETTINGS               ║
# ║           Gaps, borders, layouts, and core behavior                          ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

general {
    # ══════════════════════════════════════════════════════════════════════
    # 📐 GAPS & SPACING
    # ══════════════════════════════════════════════════════════════════════

    # Gap between windows (pixels)
    gaps_in  = 6

    # Gap between windows and screen edge (pixels)
    gaps_out = 12

    # Gap between special workspace and edge
    gaps_workspaces = 0

    # ══════════════════════════════════════════════════════════════════════
    # 🔲 BORDERS
    # ══════════════════════════════════════════════════════════════════════

    # Border size (pixels)
    border_size = 2

    # No border on floating windows that are maximized
    no_border_on_floating = false

    # Active window border color (overridden by theme-engine.sh)
    col.active_border   = rgba(cba6f7ff) rgba(89b4faff) rgba(94e2d5ff) 60deg

    # Inactive window border color
    col.inactive_border = rgba(313244aa)

    # Group border colors (for tiled groups)
    col.group_border         = rgba(45475aff)
    col.group_border_active  = rgba(cba6f7ff)
    col.group_border_locked  = rgba(fab387ff)

    # ══════════════════════════════════════════════════════════════════════
    # 🔲 LAYOUT
    # ══════════════════════════════════════════════════════════════════════

    # Default layout (dwindle or master)
    layout = dwindle

    # Don't allow tearing
    allow_tearing = false

    # ══════════════════════════════════════════════════════════════════════
    # 🖱️ WINDOW BEHAVIOR
    # ══════════════════════════════════════════════════════════════════════

    # Resize windows from all corners by holding SUPER + RMB
    resize_on_border = true

    # Extend border grab area for easier resizing
    extend_border_grab_area = 15

    # Hover icon when hovering a resize edge
    hover_icon_on_border = true

    # Snap windows to others (floating)
    snap {
        enabled          = true
        window_gap       = 10
        monitor_gap      = 10
        border_overlap   = false
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# 🎨 XWAYLAND SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

xwayland {
    # Force scale 1 for XWayland (prevent blur for apps like Steam)
    force_zero_scaling = true

    # Use HiDPI for XWayland (may cause issues)
    # use_nearest_neighbor = true
}

# ══════════════════════════════════════════════════════════════════════════════
# 📦 OPENGL SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

opengl {
    # Nvidia-specific: force introspection
    nvidia_anti_flicker = false

    # Force EGL stream (legacy)
    force_introspection = 0
}

# ══════════════════════════════════════════════════════════════════════════════
# 🔧 RENDER SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

render {
    # Explicitly sync renderer (fixes flickering on some setups)
    explicit_sync = 0

    # Direct scanout (improves performance, may cause glitches)
    direct_scanout = false
}