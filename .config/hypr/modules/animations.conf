# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — ANIMATIONS CONFIGURATION                      ║
# ║           35+ Bezier curves, cinematic window animations                    ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

animations {
    enabled = true

    # ══════════════════════════════════════════════════════════════════════
    # 🎯 BEZIER CURVE LIBRARY — 35+ Custom Curves
    # ══════════════════════════════════════════════════════════════════════
    # Format: bezier = NAME, X1, Y1, X2, Y2
    # Uses CSS cubic-bezier format
    # Tool: https://cubic-bezier.com/ or https://easings.net/

    # ── Linear ─────────────────────────────────────────────────────────
    bezier = linear,           0.0, 0.0, 1.0, 1.0

    # ── Ease (CSS defaults) ────────────────────────────────────────────
    bezier = ease,             0.25, 0.1, 0.25, 1.0
    bezier = easeIn,           0.42, 0.0, 1.0, 1.0
    bezier = easeOut,          0.0, 0.0, 0.58, 1.0
    bezier = easeInOut,        0.42, 0.0, 0.58, 1.0

    # ── Sine ───────────────────────────────────────────────────────────
    bezier = easeInSine,       0.12, 0.0, 0.39, 0.0
    bezier = easeOutSine,      0.61, 1.0, 0.88, 1.0
    bezier = easeInOutSine,    0.37, 0.0, 0.63, 1.0

    # ── Quad ───────────────────────────────────────────────────────────
    bezier = easeInQuad,       0.11, 0.0, 0.5, 0.0
    bezier = easeOutQuad,      0.5, 1.0, 0.89, 1.0
    bezier = easeInOutQuad,    0.45, 0.0, 0.55, 1.0

    # ── Cubic ──────────────────────────────────────────────────────────
    bezier = easeInCubic,      0.32, 0.0, 0.67, 0.0
    bezier = easeOutCubic,     0.33, 1.0, 0.68, 1.0
    bezier = easeInOutCubic,   0.65, 0.0, 0.35, 1.0

    # ── Quart ──────────────────────────────────────────────────────────
    bezier = easeInQuart,      0.5, 0.0, 0.75, 0.0
    bezier = easeOutQuart,     0.25, 1.0, 0.5, 1.0
    bezier = easeInOutQuart,   0.76, 0.0, 0.24, 1.0

    # ── Quint ──────────────────────────────────────────────────────────
    bezier = easeInQuint,      0.64, 0.0, 0.78, 0.0
    bezier = easeOutQuint,     0.22, 1.0, 0.36, 1.0
    bezier = easeInOutQuint,   0.83, 0.0, 0.17, 1.0

    # ── Expo ───────────────────────────────────────────────────────────
    bezier = easeInExpo,       0.7, 0.0, 0.84, 0.0
    bezier = easeOutExpo,      0.16, 1.0, 0.3, 1.0
    bezier = easeInOutExpo,    0.87, 0.0, 0.13, 1.0

    # ── Circ ───────────────────────────────────────────────────────────
    bezier = easeInCirc,       0.55, 0.0, 1.0, 0.45
    bezier = easeOutCirc,      0.0, 0.55, 0.45, 1.0
    bezier = easeInOutCirc,    0.85, 0.0, 0.15, 1.0

    # ── Back (overshoot) ───────────────────────────────────────────────
    bezier = easeInBack,       0.36, 0.0, 0.66, -0.56
    bezier = easeOutBack,      0.34, 1.56, 0.64, 1.0
    bezier = easeInOutBack,    0.68, -0.6, 0.32, 1.6

    # ── Elastic (spring-like) ──────────────────────────────────────────
    bezier = easeOutElastic,   0.5, 1.8, 0.5, 0.8
    bezier = easeInElastic,    0.7, -0.4, 0.4, 1.4

    # ── Bounce ─────────────────────────────────────────────────────────
    bezier = easeOutBounce,    0.34, 1.4, 0.64, 1.0

    # ── ASH Custom Signatures ──────────────────────────────────────────
    # Smooth fast-in with elegant settle
    bezier = ashSmooth,        0.16, 1.0, 0.3, 1.0

    # Quick pop with gentle bounce
    bezier = ashPop,           0.34, 1.3, 0.64, 1.05

    # Cinematic — Hollywood style
    bezier = ashCinematic,     0.25, 0.46, 0.45, 0.94

    # Snappy response for UI elements
    bezier = ashSnappy,        0.0, 0.9, 0.1, 1.0

    # Fluid workspace transitions
    bezier = ashFluent,        0.4, 0.0, 0.2, 1.0

    # Overshoot and settle (macOS-like)
    bezier = ashOvershoot,     0.34, 1.4, 0.64, 1.0

    # Super fast entrance
    bezier = ashZoom,          0.0, 1.1, 0.5, 1.05

    # Gentle float effect
    bezier = ashFloat,         0.3, 0.8, 0.2, 1.0

    # ══════════════════════════════════════════════════════════════════════
    # 🎬 WINDOW ANIMATIONS
    # ══════════════════════════════════════════════════════════════════════
    # Format: animation = EVENT, ENABLE, SPEED, CURVE [, STYLE]
    # Speed: duration in 100ms units (3 = 300ms, 5 = 500ms)
    # Styles: slide, popin, fade, slidefadeout, slidein

    # ── Window Open ────────────────────────────────────────────────────
    # How windows appear when opened
    animation = windowsIn,       1, 5,  ashOvershoot,  popin 80%

    # ── Window Close ───────────────────────────────────────────────────
    # How windows disappear when closed
    animation = windowsOut,      1, 4,  easeOutExpo,   popin 80%

    # ── Window Move/Resize ─────────────────────────────────────────────
    # How windows animate when moved or resized
    animation = windowsMove,     1, 4,  ashFluent,     slide

    # ── Window General (fallback) ──────────────────────────────────────
    animation = windows,         1, 5,  ashSmooth

    # ══════════════════════════════════════════════════════════════════════
    # 🌊 BORDER ANIMATIONS
    # ══════════════════════════════════════════════════════════════════════

    # Border color transition animation
    animation = border,          1, 10, linear

    # Border angle rotation (animated gradient borders)
    animation = borderangle,     1, 8,  linear,        loop

    # ══════════════════════════════════════════════════════════════════════
    # 🎭 FADE ANIMATIONS
    # ══════════════════════════════════════════════════════════════════════

    # General fade (windows, layers)
    animation = fade,            1, 5,  ashSmooth

    # Fade in specifically
    animation = fadeIn,          1, 5,  ashSmooth

    # Fade out specifically
    animation = fadeOut,         1, 4,  easeOutExpo

    # Layer surface fade (Waybar, Rofi, Dunst)
    animation = fadeLayers,      1, 4,  easeOutQuart

    # Layer fade in
    animation = fadeLayersIn,    1, 4,  ashSmooth

    # Layer fade out
    animation = fadeLayersOut,   1, 3,  easeOutExpo

    # Fade on fullscreen switch
    animation = fadeSwitch,      1, 5,  easeInOutCubic

    # Fade on blur (optimization)
    animation = fadeDim,         1, 5,  ashSmooth

    # ══════════════════════════════════════════════════════════════════════
    # 🗂️ WORKSPACE ANIMATIONS
    # ══════════════════════════════════════════════════════════════════════

    # Workspace switch animation
    animation = workspaces,      1, 5,  ashFluent,     slide

    # Workspace switch with mouse scroll
    animation = workspacesIn,    1, 5,  ashSmooth,     slide

    animation = workspacesOut,   1, 5,  easeOutQuart,  slide

    # Special workspace (scratchpad) animation
    animation = specialWorkspace,  1, 5, ashPop,       slidevert

    # ══════════════════════════════════════════════════════════════════════
    # 🪟 LAYER ANIMATIONS
    # ══════════════════════════════════════════════════════════════════════
    # Layer surfaces: Waybar, Rofi, Dunst, Hyprlock, etc.

    # Layer animations (overridden by layerrules.conf per-layer)
    animation = layers,          1, 4,  ashSmooth,     fade

    # ══════════════════════════════════════════════════════════════════════
    # 🎯 ANIMATION PRESETS (uncomment to switch)
    # ══════════════════════════════════════════════════════════════════════

    # ── PRESET: Ultra Smooth (default above) ──────────────────────────
    # Uses: ashSmooth, ashOvershoot, ashFluent

    # ── PRESET: Snappy & Fast ─────────────────────────────────────────
    # animation = windowsIn,       1, 3,  ashSnappy,   popin 85%
    # animation = windowsOut,      1, 2,  easeOutExpo, popin 85%
    # animation = workspaces,      1, 3,  ashSnappy,   slide

    # ── PRESET: Bouncy ────────────────────────────────────────────────
    # animation = windowsIn,       1, 6,  ashPop,      popin 70%
    # animation = windowsOut,      1, 4,  easeOutBounce
    # animation = workspaces,      1, 6,  easeOutBounce, slide

    # ── PRESET: No Animations (Gaming) ────────────────────────────────
    # enabled = false

    # ── PRESET: Minimal ───────────────────────────────────────────────
    # animation = windows,         1, 3,  ease
    # animation = workspaces,      1, 3,  ease, slide
    # animation = fade,            1, 3,  ease
}