# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — WINDOW DECORATIONS                            ║
# ║           Rounding, shadows, opacity, blur, dim settings                    ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

decoration {
    # ══════════════════════════════════════════════════════════════════════
    # 🔲 WINDOW ROUNDING
    # ══════════════════════════════════════════════════════════════════════

    # Corner rounding radius (pixels, 0 = sharp corners)
    rounding = 12

    # Rounding power (higher = more round at corners)
    rounding_power = 2.0

    # ══════════════════════════════════════════════════════════════════════
    # 🌟 WINDOW OPACITY
    # ══════════════════════════════════════════════════════════════════════

    # Active window opacity (1.0 = fully opaque)
    active_opacity   = 1.0

    # Inactive window opacity (slightly transparent for depth effect)
    inactive_opacity = 0.92

    # Fullscreen window opacity
    fullscreen_opacity = 1.0

    # ══════════════════════════════════════════════════════════════════════
    # 🌑 SHADOW CONFIGURATION
    # ══════════════════════════════════════════════════════════════════════

    shadow {
        # Enable window shadows
        enabled = true

        # Shadow render power (1-4, higher = softer)
        render_power = 3

        # Shadow range (how far shadow extends in pixels)
        range = 25

        # Shadow offset (X, Y in pixels)
        offset = 0, 4

        # Shadow scale (1.0 = exact window size)
        scale = 0.97

        # Shadow color — overridden by theme-engine.sh
        color          = rgba(1a1a2e80)

        # Inactive shadow color
        color_inactive = rgba(1a1a2e40)

        # Ignore window itself in shadow (prevents self-shadowing)
        # ignore_window = true
    }

    # ══════════════════════════════════════════════════════════════════════
    # 🌫️ BLUR CONFIGURATION
    # ══════════════════════════════════════════════════════════════════════

    blur {
        # Enable background blur
        enabled = true

        # Blur size (higher = more blur, exponential cost)
        size = 10

        # Blur passes (higher = smoother, more GPU)
        passes = 4

        # Ignore opacity when blurring (true = blur behind transparent)
        ignore_opacity = true

        # New optimization (reduces GPU load)
        new_optimizations = true

        # Xray blur (blur shows through transparencies)
        xray = false

        # Noise amount (adds grain to blur — film effect)
        noise = 0.012

        # Contrast boost for blur
        contrast = 0.9

        # Brightness boost for blur
        brightness = 0.85

        # Vibrancy (saturation boost in blurred area)
        vibrancy = 0.18

        # Vibrancy darkness
        vibrancy_darkness = 0.0

        # Popups (blur context menus, tooltips)
        popups = true

        # Popup blur ignorealpha
        popups_ignorealpha = 0.2

        # Special workspace blur
        special = true
    }

    # ══════════════════════════════════════════════════════════════════════
    # 💡 DIM INACTIVE WINDOWS
    # ══════════════════════════════════════════════════════════════════════

    # Dim inactive windows (creates focus effect)
    dim_inactive = false

    # Amount of dimming (0.0-1.0)
    dim_strength = 0.25

    # Special workspace dim
    dim_special = 0.4

    # Around (dim everything around fullscreen)
    dim_around = 0.5

    # ══════════════════════════════════════════════════════════════════════
    # 🎬 SCREEN SHADER
    # ══════════════════════════════════════════════════════════════════════

    # Custom GLSL shader applied to screen
    # Set to empty string to disable
    # Options:
    #   ~/.config/hypr/assets/shaders/blue-light-filter.glsl
    #   ~/.config/hypr/assets/shaders/vibrance.glsl
    #   ~/.config/hypr/assets/shaders/crt.glsl
    screen_shader =
}

# ══════════════════════════════════════════════════════════════════════════════
# 🎨 PER-APP OPACITY OVERRIDES
# ══════════════════════════════════════════════════════════════════════════════
# These are set in windowrules.conf but documented here:
#
# Terminal transparency:
#   windowrulev2 = opacity 0.92 0.88, class:^(kitty)$
#
# File manager:
#   windowrulev2 = opacity 0.95 0.90, class:^(nemo|thunar)$
#
# Discord:
#   windowrulev2 = opacity 0.98 0.95, class:^(discord)$
#
# Floating windows (more transparent):
#   windowrulev2 = opacity 0.90 0.85, floating:1

# ══════════════════════════════════════════════════════════════════════════════
# 🔧 PERFORMANCE NOTES
# ══════════════════════════════════════════════════════════════════════════════
#
# For better performance, reduce:
#   blur.passes = 2       (was 4)
#   blur.size   = 6       (was 10)
#   shadow.range = 15     (was 25)
#
# To disable blur entirely (maximum performance):
#   blur.enabled = false
#
# To disable shadows entirely:
#   shadow.enabled = false
#
# Gaming mode (in UserOverrides/user.conf):
#   decoration {
#       blur { enabled = false }
#       shadow { enabled = false }
#   }