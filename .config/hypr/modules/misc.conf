misc {
##################################################
# VISUAL #
##################################################
disable_hyprland_logo = true
disable_splash_rendering = true
col.splash = rgba(00000000)
font_family = JetBrainsMono Nerd Font
splash_font_family = JetBrainsMono Nerd Font
background_color = rgba(0a0a14ff)
new_window_takes_over_fullscreen = 2
exit_window_retains_fullscreen = false
initial_workspace_tracking = 1
##################################################
# FOCUS #
##################################################
force_default_wallpaper = 0
mouse_move_enables_dpms = true
key_press_enables_dpms = true
always_follow_on_dnd = true
layers_hog_keyboard_focus = true
focus_on_activate = false
mouse_move_focuses_monitor = true
##################################################
# ANIMATIONS #
##################################################
animate_manual_resizes = false
animate_mouse_windowdrag = false
##################################################
# SWALLOW #
##################################################
enable_swallow = true
swallow_regex = ^(kitty|Alacritty|foot|wezterm)$
swallow_exception_regex = ^(waybar|dunst|rofi|eww|ags)$
##################################################
# SPECIAL WORKSPACES #
##################################################
close_special_on_empty = true
##################################################
# CLIPBOARD #
##################################################
middle_click_paste = true
##################################################
# PERFORMANCE #
##################################################
vfr = true
vrr = 0
no_direct_scanout = false
disable_autoreload = false
##################################################
# RENDER #
##################################################
render_ahead_of_time = false
render_ahead_safezone = 1
hide_cursor_on_key_press = false
hide_cursor_on_touch = true
}
##################################################
# XWAYLAND #
##################################################
xwayland {
enabled = true
use_nearest_neighbor = false
force_zero_scaling = false
}
##################################################
# OPENGL #
##################################################
opengl {
nvidia_anti_flicker = true
force_introspection = 2
}
##################################################
# RENDER #
##################################################
render {
explicit_sync = 2
explicit_sync_kms = 2
direct_scanout = false
expand_undersized_textures = true
xp_mode = false
}
##################################################
# ECOSYSTEM #
##################################################
ecosystem {
no_update_news = false
no_donation_nag = true
}