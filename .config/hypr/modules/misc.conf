# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — MISCELLANEOUS SETTINGS                       ║
# ║           Performance, rendering, swallow, VRR, splash screen               ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

misc {
    # ══════════════════════════════════════════════════════════════════════
    # 🚀 PERFORMANCE SETTINGS
    # ══════════════════════════════════════════════════════════════════════

    # Disable Hyprland's startup logo
    disable_hyprland_logo    = true

    # Disable splash screen text
    disable_splash_rendering  = true

    # VFR: Variable Frame Rate
    # true  = only render when needed (battery saving)
    # false = always render at max rate (gaming/smooth)
    vfr = true

    # VRR: Variable Refresh Rate (G-Sync/FreeSync)
    # 0 = off
    # 1 = full VRR
    # 2 = VRR only in fullscreen
    vrr = 0

    # No direct scanout — more compatible, slightly less performance
    no_direct_scanout = false

    # Render ahead of time (reduces input latency on some GPUs)
    render_ahead_of_time      = false
    render_ahead_safezone     = 1

    # ══════════════════════════════════════════════════════════════════════
    # 🎬 ANIMATION & VISUAL BEHAVIOR
    # ══════════════════════════════════════════════════════════════════════

    # Always opaque when dragging (performance + visual clarity)
    always_follow_on_dnd = true

    # Animate manual resizes
    animate_manual_resizes = true

    # Animate mouse window dragging
    animate_mouse_windowdragging = true

    # Move focus to newly opened windows
    focus_on_activate = false

    # Raise windows that need attention
    # raise_on_click_above = false

    # ══════════════════════════════════════════════════════════════════════
    # 🐛 CURSOR BEHAVIOR
    # ══════════════════════════════════════════════════════════════════════

    # Don't pass cursor events to Wayland windows when overlaid
    # (fixes cursor on fullscreen apps)
    mouse_move_enables_dpms  = true

    # Move cursor to newly focused monitor
    cursor_zoom_factor        = 1.0

    # Cursor zoom rigid (scale with window zoom)
    cursor_zoom_rigid         = false

    # ══════════════════════════════════════════════════════════════════════
    # 🪟 WINDOW SWALLOWING
    # ══════════════════════════════════════════════════════════════════════
    # When a terminal launches a GUI app, the terminal "swallows" into it
    # The GUI app takes the terminal's place in the layout
    # When the GUI app closes, the terminal reappears

    enable_swallow            = true

    # Regex pattern for swallowing terminals
    swallow_regex             = ^(kitty|alacritty|wezterm|foot|urxvt)$

    # Apps that terminals will NOT swallow into
    swallow_exception_regex   = ^(wev|xev|ranger|yazi|lf|nnn|mpv|imv|feh)$

    # ══════════════════════════════════════════════════════════════════════
    # 🖥️ XWAYLAND BEHAVIOR
    # ══════════════════════════════════════════════════════════════════════

    # Keep Wayland native app state when XWayland apps are fullscreen
    # xwayland_use_closest_size = true

    # ══════════════════════════════════════════════════════════════════════
    # 📱 TOUCH DEVICE
    # ══════════════════════════════════════════════════════════════════════

    # Touchscreen passthrough to windows
    # touchdevice:transform = 0

    # ══════════════════════════════════════════════════════════════════════
    # 🔔 NOTIFICATIONS & FOCUS
    # ══════════════════════════════════════════════════════════════════════

    # Focus on window when activated by program
    focus_on_activate = false

    # Close special workspace when clicking outside
    close_special_on_empty = true

    # ══════════════════════════════════════════════════════════════════════
    # 🖼️ INITIAL WORKSPACE BEHAVIOR
    # ══════════════════════════════════════════════════════════════════════

    # Default workspace for new windows (overridden by windowrules)
    # force_default_wallpaper = -1

    # Prevent window from being sent to special workspace on initial map
    # initial_workspace_tracking = 1

    # ══════════════════════════════════════════════════════════════════════
    # 🌙 IDLE & DPMS
    # ══════════════════════════════════════════════════════════════════════

    # Key/mouse presses that should re-enable DPMS
    mouse_move_enables_dpms = true
    key_press_enables_dpms  = true

    # ══════════════════════════════════════════════════════════════════════
    # 🔧 DEBUGGING (set to true temporarily if issues occur)
    # ══════════════════════════════════════════════════════════════════════

    # Enable rendering debug
    # debug_logs = false

    # Disable XWayland (only use Wayland native apps)
    # disable_xdg_env_checks = false
}

# ══════════════════════════════════════════════════════════════════════════════
# 🐛 DEBUG SECTION (commented out by default)
# ══════════════════════════════════════════════════════════════════════════════

debug {
    # Set to higher for verbose logging (0=default, 1=verbose, 2=trace)
    # log_level = 0

    # Overlay damage on screen (shows what's being redrawn)
    # overlay = false

    # Disable time-based animations
    # disable_time = false

    # Enable damage tracking (shows damage regions)
    # damage_tracking = 2

    # Slow animations for debugging
    # animation_slowdown_factor = 1.0

    # Disable logs to file (only stdout)
    # disable_logs = false

    # Enable GPU crash checks
    # enable_stdout_logs = false

    # Color damage display
    # colored_damage = false

    # Watchdog timeout
    # watchdog_timeout = 5
}