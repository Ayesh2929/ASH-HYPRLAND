$MOD = SUPER
$term = kitty
$browser = firefox
$files = thunar
$scripts = ~/.config/hypr/scripts
$rofi_s = ~/.config/rofi/scripts
# Applications
bind = $MOD, Return, exec, $term
bind = $MOD SHIFT, Return, exec, $term --class floating-term
bind = $MOD CTRL, Return, exec, $term --class scratchterm
bind = $MOD, B, exec, $browser
bind = $MOD, E, exec, $files
bind = $MOD, D, exec, discord
bind = $MOD, M, exec, spotify
bind = $MOD, T, exec, kitty --class scratchbtop -e btop
# Launchers
bind = $MOD, Space, exec, $rofi_s/launcher.sh
bind = $MOD SHIFT, Space, exec, $rofi_s/launcher-full.sh
bind = $MOD, Period, exec, $rofi_s/emoji.sh
bind = $MOD, Slash, exec, $rofi_s/keybinds.sh
bind = $MOD, Backslash,exec, $rofi_s/clipboard.sh
bind = $MOD, Y, exec, $rofi_s/clipboard.sh
bind = $MOD, Tab, exec, $rofi_s/window-switcher.sh
bind = $MOD, C, exec, $rofi_s/calc.sh
# Window focus
bind = $MOD, H, movefocus, l
bind = $MOD, L, movefocus, r
bind = $MOD, K, movefocus, u
bind = $MOD, J, movefocus, d
bind = $MOD, left, movefocus, l
bind = $MOD, right, movefocus, r
bind = $MOD, up, movefocus, u
bind = $MOD, down, movefocus, d
# Window move
bind = $MOD SHIFT, H, movewindow, l
bind = $MOD SHIFT, L, movewindow, r
bind = $MOD SHIFT, K, movewindow, u
bind = $MOD SHIFT, J, movewindow, d
# Window resize
binde = $MOD CTRL, H, resizeactive, -40 0
binde = $MOD CTRL, L, resizeactive, 40 0
binde = $MOD CTRL, K, resizeactive, 0 -40
binde = $MOD CTRL, J, resizeactive, 0 40
bind = $MOD, Q, killactive
bind = $MOD SHIFT, Q, forcekillactive
bind = $MOD, F, fullscreen, 0
bind = $MOD SHIFT, F, fullscreen, 1
bind = $MOD, V, togglefloating
bind = $MOD, P, pin
bind = $MOD, G, togglegroup
bind = $MOD SHIFT, G, moveoutofgroup
bind = $MOD, bracketleft, changegroupactive, b
# Window state
bind = $MOD, bracketright, changegroupactive, f
# Workspaces
bind = $MOD, 1, workspace, 1
bind = $MOD, 2, workspace, 2
bind = $MOD, 3, workspace, 3
bind = $MOD, 4, workspace, 4
bind = $MOD, 5, workspace, 5
bind = $MOD, 6, workspace, 6
bind = $MOD, 7, workspace, 7
bind = $MOD, 8, workspace, 8
bind = $MOD, 9, workspace, 9
bind = $MOD, 0, workspace, 10
bind = $MOD SHIFT, 1, movetoworkspace, 1
bind = $MOD SHIFT, 2, movetoworkspace, 2
bind = $MOD SHIFT, 3, movetoworkspace, 3
bind = $MOD SHIFT, 4, movetoworkspace, 4
bind = $MOD SHIFT, 5, movetoworkspace, 5
bind = $MOD SHIFT, 6, movetoworkspace, 6
bind = $MOD SHIFT, 7, movetoworkspace, 7
bind = $MOD SHIFT, 8, movetoworkspace, 8
bind = $MOD SHIFT, 9, movetoworkspace, 9
bind = $MOD SHIFT, 0, movetoworkspace, 10
bind = $MOD, mouse_up, workspace, e+1
bind = $MOD, mouse_down, workspace, e-1
bind = $MOD CTRL, right, workspace, e+1
bind = $MOD CTRL, left, workspace, e-1
# Special workspaces
bind = $MOD, S, togglespecialworkspace, magic
bind = $MOD SHIFT, S, movetoworkspace, special:magic
bind = $MOD ALT, S, togglespecialworkspace, scratch
# System
bind = $MOD, Escape, exec, $rofi_s/powermenu.sh
bind = $MOD SHIFT, Escape, exec, $scripts/lock.sh
bind = $MOD CTRL, Escape, exec, systemctl suspend
bind = $MOD SHIFT, R, exec, hyprctl reload &amp;&amp; notify-send Hyprland Reloaded
bind = $MOD CTRL, R, exec, $scripts/reload-all.sh
bind = $MOD SHIFT, Delete, exit
# Notifications
bind = $MOD, N, exec, swaync-client -t
bind = $MOD SHIFT, N, exec, swaync-client -d
bind = $MOD CTRL, N, exec, swaync-client -C
# Screenshots
bind = , Print, exec, $scripts/screenshot.sh full
bind = SHIFT, Print, exec, $scripts/screenshot.sh area
bind = CTRL, Print, exec, $scripts/screenshot.sh window
bind = ALT, Print, exec, $scripts/screenshot.sh monitor
bind = $MOD, Print, exec, $scripts/screenshot.sh area-edit
bind = $MOD CTRL, Print, exec, $scripts/screenshot.sh ocr
bind = $MOD, I, exec, $scripts/color-picker.sh pick
# Theme &amp; Wallpaper
bind = $MOD ALT, T, exec, $scripts/theme-engine.sh "" pick
bind = $MOD ALT, W, exec, $scripts/wallpaper-picker.sh pick
bind = $MOD ALT, N, exec, $scripts/wallpaper-picker.sh next
bind = $MOD ALT, P, exec, $scripts/wallpaper-picker.sh prev
bind = $MOD ALT, R, exec, $scripts/wallpaper-picker.sh random
# Special features
bind = $MOD, equal, exec, $scripts/magnifier.sh zoom-in
bind = $MOD, minus, exec, $scripts/magnifier.sh zoom-out
bind = $MOD SHIFT, I, exec, $scripts/idle-inhibit.sh toggle
# Scratchpads
bind = $MOD ALT, Return, exec, $scripts/scratchpad.sh term
bind = $MOD ALT, N, exec, $scripts/scratchpad.sh notes
bind = $MOD ALT, B, exec, $scripts/scratchpad.sh btop
# Mouse
bindm = $MOD, mouse:272, movewindow
bindm = $MOD, mouse:273, resizewindow