# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — KEYBINDS (200+ Binds)                        ║
# ║           Complete keyboard shortcut configuration                          ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝
#
# 📖 FORMAT:
#   bind  = MODS, KEY, DISPATCHER, PARAMS
#   bindm = MODS, KEY, MOUSE_DISPATCHER (for mouse binds)
#   bindr = MODS, KEY, DISPATCHER (trigger on release)
#   binde = MODS, KEY, DISPATCHER (trigger on repeat when held)
#   bindl = MODS, KEY, DISPATCHER (trigger even on lockscreen)
#   bindn = MODS, KEY, DISPATCHER (trigger without grabbing focus)
#   bindt = MODS, KEY, DISPATCHER (trigger even when mouse events locked)
#
# 📌 SUPER = Windows/Meta key

# ══════════════════════════════════════════════════════════════════════════════
# 🖥️ SYSTEM & SESSION
# ══════════════════════════════════════════════════════════════════════════════

# Reload Hyprland config
bind = SUPER SHIFT, R,         exec, hyprctl reload && notify-send "Hyprland" "Config reloaded ✓" -i dialog-information

# Kill active window
bind = SUPER, Q,               killactive

# Force kill active window (unresponsive apps)
bind = SUPER SHIFT, Q,         exec, hyprctl kill

# Quit Hyprland (logout)
bind = SUPER SHIFT, Escape,    exit

# ══════════════════════════════════════════════════════════════════════════════
# 📟 TERMINAL
# ══════════════════════════════════════════════════════════════════════════════

# Primary terminal (Kitty)
bind = SUPER, Return,          exec, kitty

# Floating terminal
bind = SUPER SHIFT, Return,    exec, kitty --class=floating-term

# Special scratch terminal (toggle)
bind = SUPER, grave,           exec, ~/.config/hypr/scripts/utils/scratchpad.sh toggle term

# WezTerm
bind = SUPER ALT, Return,      exec, wezterm

# Alacritty
bind = CTRL ALT, T,            exec, alacritty

# ══════════════════════════════════════════════════════════════════════════════
# 🚀 APPLICATION LAUNCHERS
# ══════════════════════════════════════════════════════════════════════════════

# App launcher (Rofi drun)
bind = SUPER, Space,           exec, ~/.config/rofi/scripts/launcher.sh

# Full launcher (apps + runner + ssh + more)
bind = SUPER SHIFT, Space,     exec, ~/.config/rofi/scripts/launcher-full.sh

# Run command
bind = SUPER, R,               exec, ~/.config/rofi/scripts/runner.sh

# Window switcher
bind = SUPER, Tab,             exec, ~/.config/rofi/scripts/window-switcher.sh

# SSH launcher
bind = SUPER ALT, S,          exec, ~/.config/rofi/scripts/ssh.sh

# Emoji picker
bind = SUPER ALT, E,          exec, ~/.config/rofi/scripts/emoji.sh

# Calculator
bind = SUPER ALT, C,          exec, ~/.config/rofi/scripts/calc.sh

# Man page viewer
bind = SUPER ALT, M,          exec, ~/.config/rofi/scripts/man.sh

# File picker
bind = SUPER ALT, F,          exec, ~/.config/rofi/scripts/file-picker.sh

# Translator
bind = SUPER ALT, T,          exec, ~/.config/rofi/scripts/translate.sh

# Keybind viewer
bind = SUPER SHIFT, slash,    exec, ~/.config/rofi/scripts/keybinds.sh

# Power menu
bind = SUPER, Escape,         exec, ~/.config/rofi/scripts/powermenu.sh

# ══════════════════════════════════════════════════════════════════════════════
# 🔒 LOCK & POWER
# ══════════════════════════════════════════════════════════════════════════════

# Lock screen
bind = SUPER SHIFT, L,        exec, ~/.config/hypr/scripts/system/lock.sh

# Lock screen (alternative)
bind = CTRL ALT, L,           exec, ~/.config/hypr/scripts/system/lock.sh

# Power profile picker
bind = SUPER ALT, P,          exec, ~/.config/hypr/scripts/system/power-profile.sh picker

# ══════════════════════════════════════════════════════════════════════════════
# 🎨 THEME & WALLPAPER
# ══════════════════════════════════════════════════════════════════════════════

# Wallpaper picker
bind = SUPER ALT, W,          exec, ~/.config/hypr/scripts/theme/wallpaper-picker.sh

# Random wallpaper
bind = SUPER SHIFT, W,        exec, ~/.config/hypr/scripts/theme/wallpaper-picker.sh random

# Previous wallpaper
bind = SUPER CTRL, W,         exec, ~/.config/hypr/scripts/theme/wallpaper-picker.sh prev

# Apply theme from current wallpaper
bind = SUPER ALT, A,          exec, ~/.config/hypr/scripts/theme/theme-engine.sh "" reapply

# Color picker
bind = SUPER ALT, K,          exec, ~/.config/hypr/scripts/utils/color-picker.sh

# Toggle screen shader (blue light / vibrance / crt / off)
bind = SUPER ALT, G,          exec, ~/.config/hypr/scripts/hardware/dpms.sh shader-cycle

# ══════════════════════════════════════════════════════════════════════════════
# 📸 SCREENSHOTS
# ══════════════════════════════════════════════════════════════════════════════

# Full screenshot
bind = , Print,                exec, ~/.config/hypr/scripts/utils/screenshot.sh full

# Area screenshot (interactive selection)
bind = SHIFT, Print,           exec, ~/.config/hypr/scripts/utils/screenshot.sh area

# Window screenshot
bind = ALT, Print,             exec, ~/.config/hypr/scripts/utils/screenshot.sh window

# Monitor screenshot
bind = CTRL, Print,            exec, ~/.config/hypr/scripts/utils/screenshot.sh monitor

# Screenshot → edit (swappy)
bind = SUPER, Print,           exec, ~/.config/hypr/scripts/utils/screenshot.sh edit

# Screenshot → OCR (text extraction)
bind = SUPER SHIFT, Print,     exec, ~/.config/hypr/scripts/utils/screenshot.sh ocr

# Screenshot → color picker
bind = SUPER CTRL, Print,      exec, ~/.config/hypr/scripts/utils/screenshot.sh color

# Delayed screenshot (3 seconds)
bind = SUPER ALT, Print,       exec, ~/.config/hypr/scripts/utils/screenshot.sh delay 3

# ══════════════════════════════════════════════════════════════════════════════
# 🎬 SCREEN RECORDING
# ══════════════════════════════════════════════════════════════════════════════

# Toggle recording (full screen, no audio)
bind = SUPER, F10,             exec, ~/.config/hypr/scripts/media/recorder.sh toggle

# Record area
bind = SUPER SHIFT, F10,       exec, ~/.config/hypr/scripts/media/recorder.sh area

# Record with audio
bind = SUPER CTRL, F10,        exec, ~/.config/hypr/scripts/media/recorder.sh audio

# Stop recording
bind = SUPER ALT, F10,         exec, ~/.config/hypr/scripts/media/recorder.sh stop

# ══════════════════════════════════════════════════════════════════════════════
# 📋 CLIPBOARD
# ══════════════════════════════════════════════════════════════════════════════

# Clipboard history
bind = SUPER, V,               exec, ~/.config/hypr/scripts/utils/clipboard.sh history

# Clear clipboard history
bind = SUPER SHIFT, V,         exec, ~/.config/hypr/scripts/utils/clipboard.sh clear

# ══════════════════════════════════════════════════════════════════════════════
# 🪟 WINDOW MANAGEMENT
# ══════════════════════════════════════════════════════════════════════════════

# Toggle floating
bind = SUPER, F,               togglefloating

# Toggle fullscreen
bind = SUPER, F11,             fullscreen

# Toggle maximize (fake fullscreen)
bind = SUPER SHIFT, F,         fullscreenstate, 0 2

# Toggle pseudo-tiling
bind = SUPER, P,               pseudo

# Toggle split (dwindle layout)
bind = SUPER, J,               togglesplit

# Center window (floating)
bind = SUPER, C,               centerwindow

# Pin window (visible on all workspaces)
bind = SUPER SHIFT, P,         pin

# Swap two windows
bind = SUPER SHIFT, S,         swapactive

# ══════════════════════════════════════════════════════════════════════════════
# 🔍 FOCUS NAVIGATION (Vi + Arrow keys)
# ══════════════════════════════════════════════════════════════════════════════

# Focus with Vi keys (h=left, j=down, k=up, l=right)
bind = SUPER, h,               movefocus, l
bind = SUPER, j,               movefocus, d
bind = SUPER, k,               movefocus, u
bind = SUPER, l,               movefocus, r

# Focus with arrow keys
bind = SUPER, left,            movefocus, l
bind = SUPER, down,            movefocus, d
bind = SUPER, up,              movefocus, u
bind = SUPER, right,           movefocus, r

# Cycle focus through windows
bind = ALT, Tab,               cyclenext
bind = ALT SHIFT, Tab,         cyclenext, prev

# Focus previous window (history-based)
bind = SUPER, D,               focuscurrentorlast

# ══════════════════════════════════════════════════════════════════════════════
# 📦 WINDOW MOVEMENT
# ══════════════════════════════════════════════════════════════════════════════

# Move window with Vi keys
bind = SUPER SHIFT, h,         movewindow, l
bind = SUPER SHIFT, j,         movewindow, d
bind = SUPER SHIFT, k,         movewindow, u
bind = SUPER SHIFT, l,         movewindow, r

# Move window with arrow keys
bind = SUPER SHIFT, left,      movewindow, l
bind = SUPER SHIFT, down,      movewindow, d
bind = SUPER SHIFT, up,        movewindow, u
bind = SUPER SHIFT, right,     movewindow, r

# Move floating window with keyboard (pixel-precise)
binde = SUPER ALT, h,          moveactive, -30 0
binde = SUPER ALT, j,          moveactive, 0 30
binde = SUPER ALT, k,          moveactive, 0 -30
binde = SUPER ALT, l,          moveactive, 30 0
binde = SUPER ALT, left,       moveactive, -30 0
binde = SUPER ALT, down,       moveactive, 0 30
binde = SUPER ALT, up,         moveactive, 0 -30
binde = SUPER ALT, right,      moveactive, 30 0

# ══════════════════════════════════════════════════════════════════════════════
# 📏 WINDOW RESIZE
# ══════════════════════════════════════════════════════════════════════════════

# Resize window with Vi keys
binde = SUPER CTRL, h,         resizeactive, -30 0
binde = SUPER CTRL, j,         resizeactive, 0 30
binde = SUPER CTRL, k,         resizeactive, 0 -30
binde = SUPER CTRL, l,         resizeactive, 30 0
binde = SUPER CTRL, left,      resizeactive, -30 0
binde = SUPER CTRL, down,      resizeactive, 0 30
binde = SUPER CTRL, up,        resizeactive, 0 -30
binde = SUPER CTRL, right,     resizeactive, 30 0

# ══════════════════════════════════════════════════════════════════════════════
# 🗂️ WORKSPACE NAVIGATION
# ══════════════════════════════════════════════════════════════════════════════

# Switch to workspace 1-10
bind = SUPER, 1,               workspace, 1
bind = SUPER, 2,               workspace, 2
bind = SUPER, 3,               workspace, 3
bind = SUPER, 4,               workspace, 4
bind = SUPER, 5,               workspace, 5
bind = SUPER, 6,               workspace, 6
bind = SUPER, 7,               workspace, 7
bind = SUPER, 8,               workspace, 8
bind = SUPER, 9,               workspace, 9
bind = SUPER, 0,               workspace, 10

# Navigate workspaces relative
bind = SUPER, bracketleft,     workspace, e-1
bind = SUPER, bracketright,    workspace, e+1

# Navigate with Ctrl+Alt+Arrow (traditional)
bind = CTRL ALT, left,         workspace, e-1
bind = CTRL ALT, right,        workspace, e+1

# Back and forth (toggle last two workspaces)
bind = SUPER, backslash,       workspace, previous

# Go to empty workspace
bind = SUPER, n,               workspace, empty

# Scroll workspaces with mouse on Waybar
bind = SUPER, mouse_down,      workspace, e+1
bind = SUPER, mouse_up,        workspace, e-1

# ══════════════════════════════════════════════════════════════════════════════
# 📤 MOVE WINDOW TO WORKSPACE
# ══════════════════════════════════════════════════════════════════════════════

# Move to workspace 1-10 (stay on current workspace)
bind = SUPER SHIFT, 1,         movetoworkspace, 1
bind = SUPER SHIFT, 2,         movetoworkspace, 2
bind = SUPER SHIFT, 3,         movetoworkspace, 3
bind = SUPER SHIFT, 4,         movetoworkspace, 4
bind = SUPER SHIFT, 5,         movetoworkspace, 5
bind = SUPER SHIFT, 6,         movetoworkspace, 6
bind = SUPER SHIFT, 7,         movetoworkspace, 7
bind = SUPER SHIFT, 8,         movetoworkspace, 8
bind = SUPER SHIFT, 9,         movetoworkspace, 9
bind = SUPER SHIFT, 0,         movetoworkspace, 10

# Move window to workspace (follow = go with it)
bind = SUPER CTRL, 1,          movetoworkspacesilent, 1
bind = SUPER CTRL, 2,          movetoworkspacesilent, 2
bind = SUPER CTRL, 3,          movetoworkspacesilent, 3
bind = SUPER CTRL, 4,          movetoworkspacesilent, 4
bind = SUPER CTRL, 5,          movetoworkspacesilent, 5
bind = SUPER CTRL, 6,          movetoworkspacesilent, 6
bind = SUPER CTRL, 7,          movetoworkspacesilent, 7
bind = SUPER CTRL, 8,          movetoworkspacesilent, 8
bind = SUPER CTRL, 9,          movetoworkspacesilent, 9
bind = SUPER CTRL, 0,          movetoworkspacesilent, 10

# Move to previous/next workspace (follow)
bind = SUPER SHIFT, bracketleft,  movetoworkspace, e-1
bind = SUPER SHIFT, bracketright, movetoworkspace, e+1

# ══════════════════════════════════════════════════════════════════════════════
# 🎯 SPECIAL WORKSPACES (Scratchpads)
# ══════════════════════════════════════════════════════════════════════════════

# Main scratchpad toggle
bind = SUPER, minus,           togglespecialworkspace, magic

# Music/player scratchpad
bind = SUPER, m,               togglespecialworkspace, music

# Notes scratchpad
bind = SUPER SHIFT, N,         togglespecialworkspace, notes

# Files scratchpad
bind = SUPER SHIFT, E,         togglespecialworkspace, files

# Send to special workspace
bind = SUPER SHIFT, minus,     movetoworkspace, special:magic
bind = SUPER SHIFT, m,         movetoworkspace, special:music

# ══════════════════════════════════════════════════════════════════════════════
# 🖥️ MONITOR MANAGEMENT
# ══════════════════════════════════════════════════════════════════════════════

# Focus next/prev monitor
bind = SUPER, period,          focusmonitor, +1
bind = SUPER, comma,           focusmonitor, -1

# Move window to next/prev monitor
bind = SUPER SHIFT, period,    movewindow, mon:+1
bind = SUPER SHIFT, comma,     movewindow, mon:-1

# Move workspace to next monitor
bind = SUPER CTRL, period,     movecurrentworkspacetomonitor, +1
bind = SUPER CTRL, comma,      movecurrentworkspacetomonitor, -1

# Monitor layout picker
bind = SUPER ALT, O,           exec, ~/.config/hypr/scripts/hardware/monitor-layout.sh

# ══════════════════════════════════════════════════════════════════════════════
# 🔊 AUDIO (see also media-keys.conf for XF86 keys)
# ══════════════════════════════════════════════════════════════════════════════

# Volume with SUPER (additional binds)
bind = SUPER ALT, equal,       exec, ~/.config/hypr/scripts/media/volume.sh up 5
bind = SUPER ALT, minus,       exec, ~/.config/hypr/scripts/media/volume.sh down 5
bind = SUPER ALT, 0,           exec, ~/.config/hypr/scripts/media/volume.sh mute

# ══════════════════════════════════════════════════════════════════════════════
# 🌐 NETWORK
# ══════════════════════════════════════════════════════════════════════════════

# WiFi toggle
bind = SUPER ALT, N,           exec, ~/.config/hypr/scripts/network/wifi-toggle.sh

# Bluetooth toggle
bind = SUPER ALT, B,           exec, ~/.config/hypr/scripts/network/bluetooth-toggle.sh

# ══════════════════════════════════════════════════════════════════════════════
# 💡 NIGHT LIGHT & BRIGHTNESS
# ══════════════════════════════════════════════════════════════════════════════

# Toggle night light (blue light filter)
bind = SUPER, F5,              exec, ~/.config/hypr/scripts/hardware/dpms.sh night-toggle

# Increase color temperature (warmer)
bind = SUPER SHIFT, F5,        exec, ~/.config/hypr/scripts/hardware/dpms.sh night-warmer

# ══════════════════════════════════════════════════════════════════════════════
# 🔭 MAGNIFIER
# ══════════════════════════════════════════════════════════════════════════════

# Zoom in
bind = SUPER, equal,           exec, ~/.config/hypr/scripts/hardware/magnifier.sh zoom-in
bind = SUPER, plus,            exec, ~/.config/hypr/scripts/hardware/magnifier.sh zoom-in

# Zoom out
bind = SUPER, minus,           exec, ~/.config/hypr/scripts/hardware/magnifier.sh zoom-out

# Reset zoom
bind = SUPER, 0,               exec, ~/.config/hypr/scripts/hardware/magnifier.sh reset

# ══════════════════════════════════════════════════════════════════════════════
# ⌨️ LAYOUT MANAGEMENT
# ══════════════════════════════════════════════════════════════════════════════

# Switch tiling layout (dwindle ↔ master)
bind = SUPER ALT, L,           exec, ~/.config/hypr/scripts/utils/layout-switch.sh

# Toggle Master layout orientation
bind = SUPER CTRL, m,          layoutmsg, orientationnext

# ══════════════════════════════════════════════════════════════════════════════
# 🗃️ GROUPS (Tab tiling)
# ══════════════════════════════════════════════════════════════════════════════

# Toggle group
bind = SUPER, g,               togglegroup

# Cycle group forward
bind = SUPER, semicolon,       changegroupactive, f

# Cycle group backward
bind = SUPER SHIFT, semicolon, changegroupactive, b

# Lock group (prevent new windows from joining)
bind = SUPER CTRL, g,          lockactivegroup, toggle

# Move window into group (next)
bind = SUPER SHIFT, g,         movewindoworgroup, r

# ══════════════════════════════════════════════════════════════════════════════
# 💤 IDLE INHIBITOR
# ══════════════════════════════════════════════════════════════════════════════

# Toggle idle inhibitor (prevent sleep)
bind = SUPER, i,               exec, ~/.config/hypr/scripts/system/idle-inhibit.sh toggle

# ══════════════════════════════════════════════════════════════════════════════
# 🎵 MEDIA PLAYER
# ══════════════════════════════════════════════════════════════════════════════

# Media player picker
bind = SUPER, apostrophe,      exec, ~/.config/hypr/scripts/media/player-picker.sh

# ══════════════════════════════════════════════════════════════════════════════
# 🔧 SYSTEM TOOLS
# ══════════════════════════════════════════════════════════════════════════════

# System monitor (btop)
bind = SUPER SHIFT, M,         exec, kitty --class=btop -e btop

# File manager
bind = SUPER, e,               exec, nemo

# Process killer (interactive)
bind = SUPER SHIFT, K,         exec, bash -c "kill -9 $(hyprctl activewindow -j | jq '.pid')"

# Reload all modules
bind = SUPER SHIFT, R,         exec, ~/.config/hypr/scripts/system/reload-all.sh

# Touchpad toggle
bind = SUPER, F9,              exec, ~/.config/hypr/scripts/hardware/touchpad.sh toggle