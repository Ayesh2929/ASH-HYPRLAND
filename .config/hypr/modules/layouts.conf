# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — LAYOUT CONFIGURATION                         ║
# ║           Dwindle, Master, Group tiling layouts                             ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# 🌿 DWINDLE LAYOUT
# ══════════════════════════════════════════════════════════════════════════════
# Dwindle splits each new window from the last focused window
# Creates a binary tree of splits (like BSP)

dwindle {
    # Pseudotile: float windows but constrain to their tile position
    pseudotile         = true

    # Preserve split direction (don't auto-rotate)
    preserve_split     = true

    # Allow splits to be smart (prefer ratio over alternating)
    smart_split        = false

    # Smart resizing (consider whole tree on resize)
    smart_resizing     = true

    # Force split direction: 0=auto, 1=right, 2=below
    force_split        = 0

    # Proportional splitting (use ratios for splits)
    use_active_for_splits = true

    # Special scale: scale factor for special workspace
    # special_scale_factor = 0.9

    # No gaps for single window
    # no_gaps_when_only = false

    # Default split ratio (1.0 = equal, >1 = main larger)
    split_ratio = 1.0

    # Width ratio of the "master" when adding first split
    # split_width_multiplier = 1.0
}

# ══════════════════════════════════════════════════════════════════════════════
# 👑 MASTER LAYOUT
# ══════════════════════════════════════════════════════════════════════════════
# Master layout has one "master" window and stacked "slaves"
# Good for: reading, coding with reference, streaming setup

master {
    # Which window becomes master on open:
    # true  = new window becomes master
    # false = new window becomes slave
    new_on_top         = false

    # Master window side: left, right, top, bottom
    mfact              = 0.55

    # Number of master windows
    # new_status = master

    # Inherit fullscreen for master
    inherit_fullscreen = true

    # Allow small splits
    allow_small_split  = false

    # Smart resizing
    smart_resizing     = true

    # No gaps when only one window
    # no_gaps_when_only = false

    # Orientation of master area
    orientation        = left

    # Special scale factor
    # special_scale_factor = 0.9

    # Drop at cursor for tiling
    drop_at_cursor     = true
}

# ══════════════════════════════════════════════════════════════════════════════
# 🗃️ GROUP CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
# Groups = multiple windows stacked in one tile (like tabs in a WM)
# Use: SUPER + G to toggle grouping, SUPER + Tab to cycle in group

group {
    # ── Auto Group ────────────────────────────────────────────────────────
    # Automatically group windows that are dropped onto a group
    # 0 = disabled, 1 = enabled
    auto_group = false

    # ── Group Bar ─────────────────────────────────────────────────────────
    groupbar {
        # Enable the group bar (tab bar)
        enabled       = true

        # Font size for group bar labels
        font_size     = 11

        # Font family for group bar
        font_family   = JetBrainsMono Nerd Font

        # Gradients on bar
        gradients     = true

        # Render titles in bar
        render_titles = true

        # Scrolling in bar
        scrolling     = true

        # Height of group bar
        height        = 22

        # Indicator (colored line under active tab)
        indicator     = true

        # Group bar gaps (padding)
        gaps_in       = 5

        # Priority of group bar rendering
        # priority = 3

        # Colors — overridden by theme engine
        col.active          = rgba(cba6f7ff)
        col.inactive        = rgba(45475aee)
        col.locked_active   = rgba(fab387ff)
        col.locked_inactive = rgba(585b70ee)
    }

    # ── Border Colors ─────────────────────────────────────────────────────
    col.border_active       = rgba(cba6f7ff)
    col.border_inactive     = rgba(45475aee)
    col.border_locked_active    = rgba(fab387ff)
    col.border_locked_inactive  = rgba(585b70ee)

    # ── Drag ──────────────────────────────────────────────────────────────
    # Whether dragging into a group auto-groups
    drag_into_group = 2

    # Merge groups on drag
    merge_groups_on_drag       = true
    merge_groups_on_groupbar   = true
    merge_floated_into_tiled_on_groupbar = false
}

# ══════════════════════════════════════════════════════════════════════════════
# 🎛️ LAYOUT SWITCHING
# ══════════════════════════════════════════════════════════════════════════════
# Switch layout with: SUPER + ALT + L (via layout-switch.sh)
# Or directly:
#   hyprctl keyword general:layout dwindle
#   hyprctl keyword general:layout master

# ══════════════════════════════════════════════════════════════════════════════
# 📐 MISC LAYOUT SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

misc {
    # Window swallowing (terminal swallows GUI apps it launches)
    enable_swallow     = true
    swallow_regex      = ^(kitty|alacritty|wezterm)$
    swallow_exception_regex = ^(wev|xev)$

    # Animate manual window resizing
    animate_manual_resizes    = true

    # Animate mouse window dragging
    animate_mouse_windowdragging = true
}