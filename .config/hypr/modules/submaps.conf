# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — HYPRLAND SUBMAPS                             ║
# ║           Modal keybind contexts for resize, move, power, system          ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# 📐 RESIZE SUBMAP
# ══════════════════════════════════════════════════════════════════════════════
# Activation: SUPER + R
# Purpose: Resize windows without holding modifiers

bind = SUPER, R, submap, resize
submap = resize

    # ── Vi-style resize ───────────────────────────────────────────────────────
    binde = ,h,         resizeactive, -30 0
    binde = ,j,         resizeactive, 0 30
    binde = ,k,         resizeactive, 0 -30
    binde = ,l,         resizeactive, 30 0

    # ── Arrow key resize ──────────────────────────────────────────────────────
    binde = ,left,      resizeactive, -30 0
    binde = ,down,      resizeactive, 0 30
    binde = ,up,        resizeactive, 0 -30
    binde = ,right,     resizeactive, 30 0

    # ── Fine-grained resize (10px steps) ─────────────────────────────────────
    binde = SHIFT, h,   resizeactive, -10 0
    binde = SHIFT, j,   resizeactive, 0 10
    binde = SHIFT, k,   resizeactive, 0 -10
    binde = SHIFT, l,   resizeactive, 10 0

    # ── Reset size ────────────────────────────────────────────────────────────
    bind = , r,         resizewindow

    # ── Exit resize mode ──────────────────────────────────────────────────────
    bind = , Escape,    submap, reset
    bind = , Return,    submap, reset
    bind = SUPER, R,    submap, reset

submap = reset

# ══════════════════════════════════════════════════════════════════════════════
# 🚀 MOVE SUBMAP
# ══════════════════════════════════════════════════════════════════════════════
# Activation: SUPER + M (then move with hjkl/arrows)
# Purpose: Move floating windows with keyboard precision

bind = SUPER, XF86Tools, submap, move
submap = move

    # ── Large movement (30px) ─────────────────────────────────────────────────
    binde = ,h,         moveactive, -30 0
    binde = ,j,         moveactive, 0 30
    binde = ,k,         moveactive, 0 -30
    binde = ,l,         moveactive, 30 0
    binde = ,left,      moveactive, -30 0
    binde = ,down,      moveactive, 0 30
    binde = ,up,        moveactive, 0 -30
    binde = ,right,     moveactive, 30 0

    # ── Precise movement (5px) ────────────────────────────────────────────────
    binde = SHIFT, h,   moveactive, -5 0
    binde = SHIFT, j,   moveactive, 0 5
    binde = SHIFT, k,   moveactive, 0 -5
    binde = SHIFT, l,   moveactive, 5 0

    # ── Snap to corners ───────────────────────────────────────────────────────
    bind = CTRL, 1,     moveactive, 0 0        # Top-left
    bind = CTRL, 2,     moveactive, 50% 0      # Top-center
    bind = CTRL, 3,     moveactive, 100% 0     # Top-right
    bind = CTRL, 4,     moveactive, 0 50%      # Center-left
    bind = CTRL, 5,     centerwindow           # Center
    bind = CTRL, 6,     moveactive, 100% 50%   # Center-right
    bind = CTRL, 7,     moveactive, 0 100%     # Bottom-left
    bind = CTRL, 8,     moveactive, 50% 100%   # Bottom-center
    bind = CTRL, 9,     moveactive, 100% 100%  # Bottom-right

    bind = , Escape,    submap, reset
    bind = , Return,    submap, reset

submap = reset

# ══════════════════════════════════════════════════════════════════════════════
# 📸 SCREENSHOT SUBMAP
# ══════════════════════════════════════════════════════════════════════════════
# Activation: SUPER + S (screenshot mode)

bind = SUPER, S, submap, screenshot
submap = screenshot

    # Screenshot modes
    bind = ,f,          exec, ~/.config/hypr/scripts/utils/screenshot.sh full
    bind = ,a,          exec, ~/.config/hypr/scripts/utils/screenshot.sh area
    bind = ,w,          exec, ~/.config/hypr/scripts/utils/screenshot.sh window
    bind = ,m,          exec, ~/.config/hypr/scripts/utils/screenshot.sh monitor
    bind = ,e,          exec, ~/.config/hypr/scripts/utils/screenshot.sh edit
    bind = ,o,          exec, ~/.config/hypr/scripts/utils/screenshot.sh ocr
    bind = ,c,          exec, ~/.config/hypr/scripts/utils/screenshot.sh color
    bind = SHIFT, d,    exec, ~/.config/hypr/scripts/utils/screenshot.sh delay 3

    bind = , Escape,    submap, reset
    bind = , Return,    submap, reset

submap = reset

# ══════════════════════════════════════════════════════════════════════════════
# ⚡ POWER SUBMAP
# ══════════════════════════════════════════════════════════════════════════════
# Activation: SUPER + SHIFT + X (direct power actions without Rofi)

bind = SUPER SHIFT, X, submap, power
submap = power

    bind = ,l,          exec, ~/.config/hypr/scripts/system/lock.sh
    bind = ,s,          exec, ~/.config/hypr/scripts/system/lock.sh suspend
    bind = ,h,          exec, ~/.config/hypr/scripts/system/lock.sh hibernate
    bind = ,r,          exec, systemctl reboot
    bind = ,q,          exit
    bind = SHIFT, q,    exec, systemctl poweroff

    bind = , Escape,    submap, reset
    bind = , Return,    submap, reset

submap = reset

# ══════════════════════════════════════════════════════════════════════════════
# 🎨 LAYOUT SUBMAP
# ══════════════════════════════════════════════════════════════════════════════
# Activation: SUPER + ALT + L (then choose layout)

bind = SUPER ALT, L, submap, layout
submap = layout

    bind = ,d,          exec, hyprctl keyword general:layout dwindle
    bind = ,m,          exec, hyprctl keyword general:layout master
    bind = ,t,          layoutmsg, orientationtop
    bind = ,b,          layoutmsg, orientationbottom
    bind = ,l,          layoutmsg, orientationleft
    bind = ,r,          layoutmsg, orientationright
    bind = ,c,          layoutmsg, orientationcenter
    bind = ,n,          layoutmsg, orientationnext

    bind = , Escape,    submap, reset

submap = reset

# ══════════════════════════════════════════════════════════════════════════════
# 🎮 GAMING SUBMAP
# ══════════════════════════════════════════════════════════════════════════════
# Activation: SUPER + G (toggle game mode — disable decorations)

bind = SUPER, G, submap, game
submap = game

    # Toggle animations off
    bind = ,a,  exec, hyprctl keyword animations:enabled false
    bind = SHIFT, a, exec, hyprctl keyword animations:enabled true

    # Toggle blur off (performance)
    bind = ,b,  exec, hyprctl keyword decoration:blur:enabled false
    bind = SHIFT, b, exec, hyprctl keyword decoration:blur:enabled true

    # Max performance profile
    bind = ,p,  exec, ~/.config/hypr/scripts/system/power-profile.sh performance

    # Allow tearing (reduce latency)
    bind = ,t,  exec, hyprctl keyword general:allow_tearing true
    bind = SHIFT, t, exec, hyprctl keyword general:allow_tearing false

    bind = , Escape,    submap, reset

submap = reset

# ══════════════════════════════════════════════════════════════════════════════
# 🔧 SYSTEM SUBMAP
# ══════════════════════════════════════════════════════════════════════════════
# Activation: SUPER + CTRL + S (system utilities)

bind = SUPER CTRL, S, submap, system
submap = system

    bind = ,r,  exec, ash reload
    bind = ,d,  exec, kitty -e ash doctor
    bind = ,u,  exec, kitty -e ash update
    bind = ,b,  exec, ash backup
    bind = ,t,  exec, ash theme pick
    bind = ,w,  exec, ash theme random
    bind = ,c,  exec, ash clean
    bind = ,h,  exec, kitty -e ash help
    bind = ,n,  exec, dunstctl history-pop

    bind = , Escape,    submap, reset

submap = reset