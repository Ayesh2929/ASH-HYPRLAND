$MOD = SUPER
bind = $MOD, R, submap, resize
submap = resize
binde = , H, resizeactive, -30 0
binde = , L, resizeactive, 30 0
binde = , K, resizeactive, 0 -30
binde = , J, resizeactive, 0 30
binde = , left, resizeactive, -30 0
binde = , right, resizeactive, 30 0
binde = , up, resizeactive, 0 -30
binde = , down, resizeactive, 0 30
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset
bind = $MOD ALT, S, submap, screenshot
submap = screenshot
bind = , F, exec, ~/.config/hypr/scripts/screenshot.sh full
bind = , A, exec, ~/.config/hypr/scripts/screenshot.sh area
bind = , W, exec, ~/.config/hypr/scripts/screenshot.sh window
bind = , M, exec, ~/.config/hypr/scripts/screenshot.sh monitor
bind = , E, exec, ~/.config/hypr/scripts/screenshot.sh area-edit
bind = , O, exec, ~/.config/hypr/scripts/screenshot.sh ocr
bind = , C, exec, ~/.config/hypr/scripts/screenshot.sh color
bind = , Escape, submap, reset
submap = reset
bind = $MOD SHIFT CTRL, E, submap, power
submap = power
bind = , L, exec, ~/.config/hypr/scripts/lock.sh
bind = , S, exec, systemctl suspend
bind = , H, exec, systemctl hibernate
bind = , R, exec, systemctl reboot
bind = , P, exec, systemctl poweroff
bind = , E, exit
bind = , Escape, submap, reset
submap = reset
bind = $MOD, F12, submap, system
submap = system
bind = , R, exec, hyprctl reload
bind = , W, exec, pkill waybar &amp;&amp; waybar &amp;
bind = , D, exec, pkill dunst &amp;&amp; dunst &amp;
bind = , T, exec, ~/.config/hypr/scripts/theme-engine.sh "" boot
bind = , B, exec, ~/.config/hypr/scripts/bluetooth-toggle.sh
bind = , N, exec, ~/.config/hypr/scripts/wifi-toggle.sh
bind = , I, exec, ~/.config/hypr/scripts/idle-inhibit.sh toggle
bind = , Escape, submap, reset
submap = reset
