$MOD = SUPER
##################################################
# RESIZE SUBMAP #
##################################################
bind = $MOD, R, submap, resize
submap = resize
# Vi-style resize
binde = , H, resizeactive, -30 0
binde = , L, resizeactive, 30 0
binde = , K, resizeactive, 0 -30
binde = , J, resizeactive, 0 30
# Arrow key resize
binde = , left, resizeactive, -30 0
binde = , right, resizeactive, 30 0
binde = , up, resizeactive, 0 -30
binde = , down, resizeactive, 0 30
# Fine resize (SHIFT)
binde = SHIFT, H, resizeactive, -8 0
binde = SHIFT, L, resizeactive, 8 0
binde = SHIFT, K, resizeactive, 0 -8
binde = SHIFT, J, resizeactive, 0 8
# Preset sizes
bind = , 1, resizeactive, exact 800 600
bind = , 2, resizeactive, exact 1280 720
bind = , 3, resizeactive, exact 1920 1080
# Reset
bind = , Return, submap, reset
bind = , Escape, submap, reset
bind = $MOD, R, submap, reset
submap = reset
##################################################
# MOVE SUBMAP #
##################################################
bind = $MOD, W, submap, move
submap = move
binde = , H, moveactive, -30 0
binde = , L, moveactive, 30 0
binde = , K, moveactive, 0 -30
binde = , J, moveactive, 0 30
binde = , left, moveactive, -30 0
binde = , right, moveactive, 30 0
binde = , up, moveactive, 0 -30
binde = , down, moveactive, 0 30
# Fine move
binde = SHIFT, H, moveactive, -8 0
binde = SHIFT, L, moveactive, 8 0
binde = SHIFT, K, moveactive, 0 -8
binde = SHIFT, J, moveactive, 0 8
# Center
bind = , C, centerwindow
bind = , Return, submap, reset
bind = , Escape, submap, reset
bind = $MOD, W, submap, reset
submap = reset
##################################################
# SCREENSHOT SUBMAP #
##################################################
bind = $MOD ALT, S, submap, screenshot
submap = screenshot
bind = , F, bind = , A, bind = , W, bind = , M, bind = , E, bind = , O, exec, ~/.config/hypr/scripts/screenshot.sh full
exec, ~/.config/hypr/scripts/screenshot.sh area
exec, ~/.config/hypr/scripts/screenshot.sh window
exec, ~/.config/hypr/scripts/screenshot.sh monitor
exec, ~/.config/hypr/scripts/screenshot.sh area-edit
exec, ~/.config/hypr/scripts/screenshot.sh ocr
bind = , C, exec, ~/.config/hypr/scripts/screenshot.sh color
bind = , D, exec, ~/.config/hypr/scripts/screenshot.sh delay
bind = , Escape, submap, reset
bind = , Return, submap, reset
bind = $MOD ALT, S, submap, reset
submap = reset
##################################################
# POWER SUBMAP #
##################################################
bind = $MOD SHIFT CTRL, E, submap, power
submap = power
bind = , L, exec, ~/.config/hypr/scripts/lock.sh
bind = , S, exec, systemctl suspend
bind = , H, exec, systemctl hibernate
bind = , R, exec, systemctl reboot
bind = , P, exec, systemctl poweroff
bind = , E, exit
bind = , Q, exit
bind = , Escape, submap, reset
submap = reset
##################################################
# SYSTEM SUBMAP #
##################################################
bind = $MOD, F12, submap, system
submap = system
bind = , R, exec, hyprctl reload
bind = , W, exec, pkill waybar &amp;&amp; waybar &amp;
bind = , D, exec, pkill dunst &amp;&amp; dunst &amp;
bind = , T, exec, ~/.config/hypr/scripts/theme-engine.sh "" boot
bind = , B, exec, ~/.config/hypr/scripts/bluetooth-toggle.sh
bind = , N, exec, ~/.config/hypr/scripts/wifi-toggle.sh
bind = , I, exec, ~/.config/hypr/scripts/idle-inhibit.sh toggle
bind = , F, exec, fc-cache -fv
bind = , Escape, submap, reset
bind = $MOD, F12, submap, reset
submap = reset
##################################################
# LAYOUT SUBMAP #
##################################################
bind = $MOD ALT, L, submap, layout
submap = layout
bind = , D, exec, ~/.config/hypr/scripts/layout-switch.sh dwindle
bind = , M, exec, ~/.config/hypr/scripts/layout-switch.sh master
bind = , C, exec, ~/.config/hypr/scripts/layout-switch.sh cycle
bind = , P, exec, ~/.config/hypr/scripts/layout-switch.sh pseudo
bind = , S, exec, ~/.config/hypr/scripts/layout-switch.sh split
bind = , Escape, submap, reset
bind = $MOD ALT, L, submap, reset
submap = reset