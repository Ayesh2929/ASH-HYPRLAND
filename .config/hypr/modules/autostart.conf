# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — AUTOSTART CONFIGURATION                      ║
# ║           Programs launched on Hyprland startup                             ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝
#
# 📖 FORMAT:
#   exec-once = COMMAND   # Run once on startup
#   exec      = COMMAND   # Run on every config reload
#
# ⚡ ORDER MATTERS — programs start in sequence

# ══════════════════════════════════════════════════════════════════════════════
# 🔧 PHASE 1 — SYSTEM DAEMONS (start immediately)
# ══════════════════════════════════════════════════════════════════════════════

# DBus activation (MUST be first for proper XDG portal)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# Systemd user environment update
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# XDG Desktop Portal (for file pickers, screen share, etc.)
exec-once = /usr/lib/xdg-desktop-portal-hyprland &
exec-once = /usr/lib/xdg-desktop-portal &

# ══════════════════════════════════════════════════════════════════════════════
# 🔐 PHASE 2 — AUTHENTICATION & SECURITY
# ══════════════════════════════════════════════════════════════════════════════

# Polkit authentication agent (for sudo GUI dialogs)
exec-once = /usr/lib/polkit-kde-authentication-agent-1
# Alternative:
# exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# GNOME Keyring (for password storage, SSH agent)
# exec-once = gnome-keyring-daemon --start --components=pkcs11,secrets,ssh

# SSH agent
exec-once = eval $(ssh-agent -s)

# KDE Wallet (alternative to GNOME Keyring)
# exec-once = kwalletd6

# ══════════════════════════════════════════════════════════════════════════════
# 🖼️ PHASE 3 — WALLPAPER & THEME
# ══════════════════════════════════════════════════════════════════════════════

# swww wallpaper daemon (MUST start before applying wallpaper)
exec-once = swww-daemon --format xrgb

# Apply last wallpaper & theme (after swww starts)
exec-once = sleep 0.5 && ~/.config/hypr/scripts/theme/theme-engine.sh "" boot

# ══════════════════════════════════════════════════════════════════════════════
# 📊 PHASE 4 — STATUS BAR & WIDGETS
# ══════════════════════════════════════════════════════════════════════════════

# Waybar (primary status bar)
exec-once = waybar

# AGS (additional widgets — optional)
# exec-once = ags

# EWW dashboard daemon (optional)
# exec-once = eww daemon

# ══════════════════════════════════════════════════════════════════════════════
# 🔔 PHASE 5 — NOTIFICATIONS
# ══════════════════════════════════════════════════════════════════════════════

# Dunst notification daemon
exec-once = dunst

# SwayNC (notification center — optional, choose one)
# exec-once = swaync

# ══════════════════════════════════════════════════════════════════════════════
# 💤 PHASE 6 — IDLE MANAGEMENT
# ══════════════════════════════════════════════════════════════════════════════

# Hypridle daemon (manages screen timeout, DPMS, lock)
exec-once = hypridle

# ══════════════════════════════════════════════════════════════════════════════
# 📋 PHASE 7 — CLIPBOARD MANAGEMENT
# ══════════════════════════════════════════════════════════════════════════════

# wl-paste clipboard daemon (text history)
exec-once = wl-paste --type text --watch cliphist store

# wl-paste image clipboard daemon
exec-once = wl-paste --type image --watch cliphist store

# ══════════════════════════════════════════════════════════════════════════════
# 🖱️ PHASE 8 — INPUT HELPERS
# ══════════════════════════════════════════════════════════════════════════════

# Kanata (keyboard remapping — optional)
# exec-once = kanata

# Input method (for CJK languages — optional)
# exec-once = fcitx5 -d

# Touchpad gestures via libinput-gestures
# exec-once = libinput-gestures-setup start

# ══════════════════════════════════════════════════════════════════════════════
# 🌐 PHASE 9 — NETWORK & BLUETOOTH
# ══════════════════════════════════════════════════════════════════════════════

# Network manager applet (system tray)
exec-once = nm-applet --indicator

# Bluetooth manager applet (system tray)
exec-once = blueman-applet

# Syncthing (file sync — optional)
# exec-once = syncthing --no-browser

# ══════════════════════════════════════════════════════════════════════════════
# 🎵 PHASE 10 — AUDIO
# ══════════════════════════════════════════════════════════════════════════════

# EasyEffects (audio effects — optional)
# exec-once = easyeffects --gapplication-service

# Playerctl daemon (media player control)
exec-once = playerctld daemon

# ══════════════════════════════════════════════════════════════════════════════
# 🎨 PHASE 11 — DISPLAY SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

# Apply cursor theme
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# Night light daemon (optional — managed by dpms.sh keybind)
# exec-once = wlsunset -l 48.8 -L 2.3  # Paris coordinates
# exec-once = gammastep -O 4000         # Fixed 4000K always

# ══════════════════════════════════════════════════════════════════════════════
# 📁 PHASE 12 — FILE & PORTAL SERVICES
# ══════════════════════════════════════════════════════════════════════════════

# Thumbnail generator for file managers
exec-once = tumbler-service-wrapped 2>/dev/null || true

# GIO daemon for file system events
exec-once = /usr/lib/gvfs/gvfsd &

# Mount daemon
exec-once = /usr/lib/gvfs/gvfsd-fuse "${XDG_RUNTIME_DIR}/gvfs" -f &

# ══════════════════════════════════════════════════════════════════════════════
# 🔌 PHASE 13 — UTILITIES
# ══════════════════════════════════════════════════════════════════════════════

# KDE Connect (phone integration — optional)
# exec-once = kdeconnectd

# Barrier/KVM (share mouse/keyboard — optional)
# exec-once = barrier

# SSH agent notify
# exec-once = ssh-add ~/.ssh/id_rsa 2>/dev/null

# ══════════════════════════════════════════════════════════════════════════════
# 🔄 ON RELOAD (exec — runs every time config is reloaded)
# ══════════════════════════════════════════════════════════════════════════════

# Reload GTK settings on every Hyprland reload
exec = gsettings set org.gnome.desktop.interface gtk-theme 'Catppuccin-Mocha-Standard-Blue-Dark'
exec = gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'
exec = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Ice'
exec = gsettings set org.gnome.desktop.interface cursor-size 24
exec = gsettings set org.gnome.desktop.interface font-name 'JetBrains Mono 11'

# ══════════════════════════════════════════════════════════════════════════════
# 🖥️ STARTUP APPLICATIONS (comment/uncomment as needed)
# ══════════════════════════════════════════════════════════════════════════════

# Browser (start on workspace 2)
# exec-once = [workspace 2 silent] firefox

# Email client (start on workspace 3)
# exec-once = [workspace 3 silent] thunderbird

# Music player (start in special workspace)
# exec-once = [workspace special:music silent] spotify

# Discord (start in special workspace)
# exec-once = [workspace special:chat silent] discord