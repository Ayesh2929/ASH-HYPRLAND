##################################################
# LAYER BLUR RULES #
##################################################
# ■■ Waybar ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = ignorealpha 0.15, waybar
layerrule = xray 0, waybar
# ■■ Rofi ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
layerrule = blur, rofi
layerrule = ignorezero, rofi
layerrule = ignorealpha 0.10, rofi
layerrule = dimaround, rofi
# ■■ Dunst ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
layerrule = blur, notifications
layerrule = ignorezero, notifications
layerrule = ignorealpha 0.08, notifications
layerrule = blur, dunst
layerrule = ignorezero, dunst
layerrule = ignorealpha 0.08, dunst
# ■■ SwayNC ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
layerrule = blur, swaync
layerrule = ignorezero, swaync
layerrule = ignorealpha 0.08, swaync
# ■■ GTK Layer Shell ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
layerrule = blur, gtk-layer-shell
layerrule = ignorezero, gtk-layer-shell
layerrule = ignorealpha 0.08, gtk-layer-shell
# ■■ AGS ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
layerrule = blur, ags
layerrule = ignorezero, ags
layerrule = ignorealpha 0.10, ags
# ■■ EWW ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
layerrule = blur, eww
layerrule = ignorezero, eww
# ■■ Hyprlock ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
layerrule = blur, hyprlock
layerrule = dimaround, hyprlock
# ■■ Selection overlay ■■■■■■■■■■■■■■■■■■■■■■■■■■■■
layerrule = noanim, selection
layerrule = noanim, hyprpicker
# ■■ SWWW (wallpaper) ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
layerrule = noanim, swww-daemon
layerrule = noblur, swww-daemon
##################################################
# WINDOW BLUR RULES #
##################################################
# ■■ No blur for performance-sensitive apps ■■■■■■■■
windowrulev2 = noblur, class:^(firefox)$
windowrulev2 = noblur, class:^(Brave-browser)$
windowrulev2 = noblur, class:^(chromium)$
windowrulev2 = noblur, class:^(google-chrome)$
windowrulev2 = noblur, class:^(mpv)$
windowrulev2 = noblur, class:^(vlc)$
windowrulev2 = noblur, class:^(gimp)$
windowrulev2 = noblur, class:^(inkscape)$
windowrulev2 = noblur, class:^(blender)$
windowrulev2 = noblur, class:^(steam_app_.*)$
windowrulev2 = noblur, class:^(gamescope)$
# ■■ Blur floating terminals ■■■■■■■■■■■■■■■■■■■■■■■
windowrulev2 = bordercolor rgba(7c3aedcc), \
class:^(floating-term)$
windowrulev2 = bordercolor rgba(7c3aedcc), \
class:^(scratchterm)$