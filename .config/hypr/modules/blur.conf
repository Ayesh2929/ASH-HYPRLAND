# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — BLUR LAYER RULES                             ║
# ║           Per-layer blur configuration for Waybar, Rofi, Dunst etc         ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# 🌫️ LAYER BLUR RULES
# ══════════════════════════════════════════════════════════════════════════════
# These rules are now defined in layerrules.conf
# This file focuses on window-level blur noblur exceptions

# ══════════════════════════════════════════════════════════════════════════════
# 🚫 NO-BLUR EXCEPTIONS
# ══════════════════════════════════════════════════════════════════════════════
# Disable blur for windows that shouldn't be blurred (performance/visual)

# Video players — blur ruins video quality
windowrulev2 = noblur, class:^(mpv)$
windowrulev2 = noblur, class:^(vlc)$
windowrulev2 = noblur, class:^(celluloid)$
windowrulev2 = noblur, class:^(totem)$
windowrulev2 = noblur, class:^(mplayer)$

# Games — blur wastes GPU
windowrulev2 = noblur, class:^(steam_app_.*)$
windowrulev2 = noblur, class:^(gamescope)$
windowrulev2 = noblur, class:^(osu!)$

# Screen sharing / OBS — blur causes issues
windowrulev2 = noblur, class:^(obs)$
windowrulev2 = noblur, class:^(com.obsproject.Studio)$

# Virtual machines
windowrulev2 = noblur, class:^(virt-manager)$
windowrulev2 = noblur, class:^(looking-glass-client)$
windowrulev2 = noblur, class:^(qemu)$

# ══════════════════════════════════════════════════════════════════════════════
# 🎯 BLUR FORCE RULES
# ══════════════════════════════════════════════════════════════════════════════
# Force blur on specific transparent windows

# Terminal emulators with transparency
windowrulev2 = forcergbx, class:^(kitty)$

# ══════════════════════════════════════════════════════════════════════════════
# 💡 BLUR NOTES
# ══════════════════════════════════════════════════════════════════════════════
#
# Blur is configured in decorations.conf under the blur block.
# Layer blur (Waybar, Rofi, etc.) is set in layerrules.conf.
#
# Performance impact (ascending):
#   passes=1, size=3  → Minimal (for low-end GPUs)
#   passes=2, size=6  → Light    (recommended for mid-range)
#   passes=3, size=8  → Medium   (default)
#   passes=4, size=10 → Heavy    (for high-end GPUs)
#   passes=6, size=14 → Ultra    (for RTX 4080+)
#
# Blur interaction with opacity:
#   - Window needs opacity < 1.0 to show blur through
#   - Or: blur.ignore_opacity = true
#
# Layer blur vs window blur:
#   - Layer blur: applied to Waybar/Rofi/notification surfaces
#   - Window blur: applied to window backgrounds

# ══════════════════════════════════════════════════════════════════════════════
# 🔧 BLUR LAYER RULES (shell surfaces)
# ══════════════════════════════════════════════════════════════════════════════

layerrule = blur, waybar
layerrule = blur, rofi
layerrule = blur, dunst
layerrule = blur, notifications
layerrule = blur, swaync-notification-window
layerrule = blur, swaync-control-center
layerrule = blur, logout_dialog
layerrule = blur, gtk-layer-shell

# Unblur layers that shouldn't be blurred
layerrule = unset, hyprpicker
layerrule = unset, selection

# ══════════════════════════════════════════════════════════════════════════════
# 🎨 BLUR IGNOREALPHA
# ══════════════════════════════════════════════════════════════════════════════
# Don't blur fully transparent areas (optimization)

layerrule = ignorealpha 0.2, waybar
layerrule = ignorealpha 0.2, rofi
layerrule = ignorealpha 0.2, dunst
layerrule = ignorealpha 0.2, swaync-notification-window