# ══════════════════════════════════════════════════════════════════════════════
# 📝 TOUCHPAD KEYS (laptop function row)
# ══════════════════════════════════════════════════════════════════════════════

# Touchpad toggle (F1 on some laptops)
bind = , XF86TouchpadToggle,     exec, ~/.config/hypr/scripts/hardware/touchpad.sh toggle

# Touchpad on/off
bind = , XF86TouchpadOn,         exec, ~/.config/hypr/scripts/hardware/touchpad.sh enable
bind = , XF86TouchpadOff,        exec, ~/.config/hypr/scripts/hardware/touchpad.sh disable

