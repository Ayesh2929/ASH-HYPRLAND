##################################################
# VOLUME CONTROL #
##################################################
bindel = , XF86AudioRaiseVolume, exec, \
~/.config/hypr/scripts/volume.sh up 3
bindel = , XF86AudioLowerVolume, exec, \
~/.config/hypr/scripts/volume.sh down 3
bindl = , XF86AudioMute, exec, \
~/.config/hypr/scripts/volume.sh toggle-mute
bindl = , XF86AudioMicMute, exec, \
~/.config/hypr/scripts/volume.sh toggle-mic
# Fine volume (SUPER + media keys)
bindel = SUPER, XF86AudioRaiseVolume, exec, \
~/.config/hypr/scripts/volume.sh up 1
bindel = SUPER, XF86AudioLowerVolume, exec, \
~/.config/hypr/scripts/volume.sh down 1
# Max volume (SHIFT + raise)
bindl = SHIFT, XF86AudioRaiseVolume, exec, \
~/.config/hypr/scripts/volume.sh max
##################################################
# BRIGHTNESS CONTROL #
##################################################
bindel = , XF86MonBrightnessUp, exec, \
~/.config/hypr/scripts/brightness.sh up 5
bindel = , XF86MonBrightnessDown, exec, \
~/.config/hypr/scripts/brightness.sh down 5
# Fine brightness (SUPER + brightness keys)
bindel = SUPER, XF86MonBrightnessUp, exec, \
~/.config/hypr/scripts/brightness.sh up 1
bindel = SUPER, XF86MonBrightnessDown, exec, \
~/.config/hypr/scripts/brightness.sh down 1
# Max/min brightness
bindl = SHIFT, XF86MonBrightnessUp, exec, \
~/.config/hypr/scripts/brightness.sh max
bindl = SHIFT, XF86MonBrightnessDown, exec, \
~/.config/hypr/scripts/brightness.sh min
# Keyboard backlight
bindel = , XF86KbdBrightnessUp, exec, \
~/.config/hypr/scripts/brightness.sh kbd-up 10
bindel = , XF86KbdBrightnessDown, exec, \
~/.config/hypr/scripts/brightness.sh kbd-down 10
##################################################
# MEDIA PLAYBACK #
##################################################
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioStop, exec, playerctl stop
# Spotify specific (SUPER + media keys)
bindl = SUPER, XF86AudioPlay, exec, playerctl -p spotify play-pause
bindl = SUPER, XF86AudioNext, exec, playerctl -p spotify next
bindl = SUPER, XF86AudioPrev, exec, playerctl -p spotify previous
##################################################
# DISPLAY &amp; HARDWARE #
##################################################
bind = , XF86Display, exec, \
~/.config/hypr/scripts/monitor-layout.sh pick
bind = , XF86TouchpadToggle, exec, \
~/.config/hypr/scripts/touchpad.sh toggle
bind = , XF86TouchpadOn, exec, \
~/.config/hypr/scripts/touchpad.sh on
bind = , XF86TouchpadOff, exec, \
~/.config/hypr/scripts/touchpad.sh off
bind = , XF86WLAN, exec, \
~/.config/hypr/scripts/wifi-toggle.sh
bind = , XF86Bluetooth, exec, \
~/.config/hypr/scripts/bluetooth-toggle.sh
bind = , XF86RFKill, exec, \
~/.config/hypr/scripts/wifi-toggle.sh
##################################################
# APPLICATION SHORTCUTS #
##################################################
bind = , XF86Calculator, exec, qalculate-gtk
bind = , XF86Explorer, exec, thunar
bind = , XF86Mail, exec, thunderbird
bind = , XF86Music, exec, spotify
##################################################
# POWER MANAGEMENT #
##################################################
bind = , XF86Sleep, exec, systemctl suspend
bind = , XF86PowerOff, exec, \
~/.config/rofi/scripts/powermenu.sh
bind = , XF86Suspend, exec, systemctl suspend
bind = , XF86Hibernate, exec, systemctl hibernate
##################################################
# SCREENSHOT (hardware key) #
##################################################
bind = , Print, exec, \
~/.config/hypr/scripts/screenshot.sh area