# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — MEDIA KEYS                                   ║
# ║           XF86 hardware key bindings                                        ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# 🔊 VOLUME KEYS
# ══════════════════════════════════════════════════════════════════════════════

# Volume up (with repeat on hold)
binde = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/media/volume.sh up 5

# Volume down (with repeat on hold)
binde = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/media/volume.sh down 5

# Mute toggle
bindl = , XF86AudioMute,        exec, ~/.config/hypr/scripts/media/volume.sh mute

# Microphone mute toggle
bindl = , XF86AudioMicMute,     exec, ~/.config/hypr/scripts/media/volume.sh mic-mute

# Volume up/down with SHIFT for fine-grained control (1% steps)
binde = SHIFT, XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/media/volume.sh up 1
binde = SHIFT, XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/media/volume.sh down 1

# ══════════════════════════════════════════════════════════════════════════════
# ☀️ BRIGHTNESS KEYS
# ══════════════════════════════════════════════════════════════════════════════

# Brightness up (with repeat)
binde = , XF86MonBrightnessUp,   exec, ~/.config/hypr/scripts/media/brightness.sh up 5

# Brightness down (with repeat)
binde = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/media/brightness.sh down 5

# Fine brightness control (1% steps)
binde = SHIFT, XF86MonBrightnessUp,   exec, ~/.config/hypr/scripts/media/brightness.sh up 1
binde = SHIFT, XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/media/brightness.sh down 1

# ══════════════════════════════════════════════════════════════════════════════
# 🎵 MEDIA PLAYER KEYS
# ══════════════════════════════════════════════════════════════════════════════

# Play/Pause toggle
bindl = , XF86AudioPlay,         exec, playerctl play-pause
bindl = , XF86AudioPause,        exec, playerctl pause

# Next track
bindl = , XF86AudioNext,         exec, playerctl next

# Previous track
bindl = , XF86AudioPrev,         exec, playerctl previous

# Stop playback
bindl = , XF86AudioStop,         exec, playerctl stop

# Seek forward 10 seconds
bindl = SHIFT, XF86AudioNext,    exec, playerctl position +10

# Seek backward 10 seconds
bindl = SHIFT, XF86AudioPrev,    exec, playerctl position -10

# ══════════════════════════════════════════════════════════════════════════════
# 🖥️ DISPLAY KEYS
# ══════════════════════════════════════════════════════════════════════════════

# Toggle monitor (external display)
bind = , XF86Display,            exec, ~/.config/hypr/scripts/hardware/monitor-layout.sh

# Rotate screen
# bind = , XF86RotateWindows,    exec, hyprctl keyword monitor ",transform,1"

# ══════════════════════════════════════════════════════════════════════════════
# 🔋 POWER KEYS
# ══════════════════════════════════════════════════════════════════════════════

# Sleep/Suspend key
bindl = , XF86Sleep,             exec, ~/.config/hypr/scripts/system/lock.sh suspend

# Power button (show power menu instead of immediate shutdown)
bindl = , XF86PowerOff,          exec, ~/.config/rofi/scripts/powermenu.sh

# Hibernate
bindl = , XF86Hibernate,         exec, ~/.config/hypr/scripts/system/lock.sh hibernate

# Screensaver
bindl = , XF86ScreenSaver,       exec, ~/.config/hypr/scripts/system/lock.sh

# ══════════════════════════════════════════════════════════════════════════════
# 📷 CAMERA & SCANNER
# ══════════════════════════════════════════════════════════════════════════════

# Camera toggle
# bind = , XF86WebCam,           exec, cheese

# ══════════════════════════════════════════════════════════════════════════════
# ✈️ AIRPLANE MODE & NETWORKING
# ══════════════════════════════════════════════════════════════════════════════

# WiFi toggle
bind = , XF86WLAN,               exec, ~/.config/hypr/scripts/network/wifi-toggle.sh

# Bluetooth toggle
bind = , XF86Bluetooth,          exec, ~/.config/hypr/scripts/network/bluetooth-toggle.sh

# ══════════════════════════════════════════════════════════════════════════════
# 🧮 KEYBOARD SPECIAL KEYS
# ══════════════════════════════════════════════════════════════════════════════

# Calculator key
bind = , XF86Calculator,         exec, galculator || qalculate-gtk || gnome-calculator

# File manager key
bind = , XF86Explorer,           exec, nemo || thunar || nautilus

# Home key (file manager)
bind = , XF86HomePage,           exec, nemo || thunar

# Email key
bind = , XF86Mail,               exec, thunderbird

# Search key
bind = , XF86Search,             exec, ~/.config/rofi/scripts/launcher.sh

# Favorites / Tools key
bind = , XF86Tools,              exec, ~/.config/rofi/scripts/launcher.sh

# ══════════════════════════════════════════════════════════════════════════════
