# ══════════════════════════════════════════════════════════════════════════════
# 🌈 ANIMATED BORDER GRADIENT
# ══════════════════════════════════════════════════════════════════════════════
# These are overridden by theme-engine.sh with wallpaper-derived colors
# They serve as beautiful defaults before theme is applied

# Active border — rotating gradient (updated by theme engine)
# col.active_border values are in general.conf, these are in decoration section

# ══════════════════════════════════════════════════════════════════════════════
# 💡 WINDOW LIGHTING OVERRIDES
# ══════════════════════════════════════════════════════════════════════════════
# Per-window opacity and dim overrides using windowrulev2

# ── Terminals ─────────────────────────────────────────────────────────────────
# Kitty terminal — slight transparency for depth
windowrulev2 = opacity 0.95 0.88, class:^(kitty)$
windowrulev2 = opacity 0.95 0.88, class:^(alacritty)$
windowrulev2 = opacity 0.95 0.88, class:^(wezterm)$
windowrulev2 = opacity 0.95 0.88, class:^(foot)$

# ── Code Editors ──────────────────────────────────────────────────────────────
# Neovim in terminal inherits terminal opacity
# Standalone GUI editors
windowrulev2 = opacity 0.96 0.92, class:^(code-oss)$
windowrulev2 = opacity 0.96 0.92, class:^(vscodium)$
windowrulev2 = opacity 0.96 0.92, class:^(code)$
windowrulev2 = opacity 0.96 0.92, class:^(sublime_text)$

# ── File Managers ─────────────────────────────────────────────────────────────
windowrulev2 = opacity 0.95 0.90, class:^(nemo)$
windowrulev2 = opacity 0.95 0.90, class:^(thunar)$
windowrulev2 = opacity 0.95 0.90, class:^(nautilus)$
windowrulev2 = opacity 0.95 0.90, class:^(pcmanfm)$
windowrulev2 = opacity 0.95 0.90, class:^(dolphin)$

# ── Communication Apps ────────────────────────────────────────────────────────
windowrulev2 = opacity 0.98 0.95, class:^(discord)$
windowrulev2 = opacity 0.98 0.95, class:^(WebCord)$
windowrulev2 = opacity 0.98 0.95, class:^(ArmCord)$
windowrulev2 = opacity 0.98 0.95, class:^(slack)$
windowrulev2 = opacity 0.98 0.95, class:^(telegram-desktop)$
windowrulev2 = opacity 0.98 0.95, class:^(signal)$
windowrulev2 = opacity 0.98 0.95, class:^(thunderbird)$

# ── Browsers — full opacity for readability ───────────────────────────────────
windowrulev2 = opacity 1.0 1.0, class:^(firefox)$
windowrulev2 = opacity 1.0 1.0, class:^(brave-browser)$
windowrulev2 = opacity 1.0 1.0, class:^(chromium)$
windowrulev2 = opacity 1.0 1.0, class:^(google-chrome)$

# ── System Tools ──────────────────────────────────────────────────────────────
windowrulev2 = opacity 0.94 0.88, class:^(btop)$
windowrulev2 = opacity 0.94 0.88, class:^(htop)$

# ── Settings / Dialogs ────────────────────────────────────────────────────────
windowrulev2 = opacity 0.96 0.94, class:^(pavucontrol)$
windowrulev2 = opacity 0.96 0.94, class:^(blueman-manager)$
windowrulev2 = opacity 0.96 0.94, class:^(nm-connection-editor)$

# ── Floating Windows — more transparent ───────────────────────────────────────
windowrulev2 = opacity 0.92 0.85, floating:1, class:^(kitty)$
windowrulev2 = opacity 0.92 0.85, floating:1, class:^(alacritty)$

# ── Fullscreen — always full opacity ──────────────────────────────────────────
windowrulev2 = opacity 1.0 override 1.0 override, fullscreen:1

# ── Video Players — full opacity ──────────────────────────────────────────────
windowrulev2 = opacity 1.0 1.0, class:^(mpv)$
windowrulev2 = opacity 1.0 1.0, class:^(vlc)$
windowrulev2 = opacity 1.0 1.0, class:^(celluloid)$

# ── Games — full opacity ──────────────────────────────────────────────────────
windowrulev2 = opacity 1.0 1.0, class:^(steam_app_.*)$
windowrulev2 = opacity 1.0 1.0, class:^(gamescope)$

# ══════════════════════════════════════════════════════════════════════════════
# 🌑 SHADOW PER-WINDOW OVERRIDES
# ══════════════════════════════════════════════════════════════════════════════

# No shadow for games/video (performance)
windowrulev2 = noshadow, class:^(steam_app_.*)$
windowrulev2 = noshadow, class:^(gamescope)$
windowrulev2 = noshadow, class:^(mpv)$
windowrulev2 = noshadow, fullscreen:1

# ══════════════════════════════════════════════════════════════════════════════
# 🎨 BORDER PER-WINDOW OVERRIDES
# ══════════════════════════════════════════════════════════════════════════════

# No border for games (immersive)
windowrulev2 = noborder, class:^(steam_app_.*)$
windowrulev2 = noborder, class:^(gamescope)$
windowrulev2 = noborder, fullscreen:1

# Special gold border for pinned windows
# windowrulev2 = bordercolor rgba(f9e2afff) rgba(fab387ff) 45deg, pinned:1

# ══════════════════════════════════════════════════════════════════════════════
# 🖥️ SHADER ACTIVATION (via keybind in keybinds.conf)
# ══════════════════════════════════════════════════════════════════════════════
# Blue light filter, Vibrance, CRT — toggled via SUPER+ALT+S
# Configured in keybinds.conf using hyprctl keyword decoration:screen_shader