gestures {
##################################################
# WORKSPACE SWIPE #
##################################################
workspace_swipe = true
workspace_swipe_fingers = 3
workspace_swipe_min_fingers = false
workspace_swipe_distance = 280
workspace_swipe_invert = true
workspace_swipe_min_speed_to_force = 22
workspace_swipe_cancel_ratio = 0.5
workspace_swipe_create_new = true
workspace_swipe_direction_lock = true
workspace_swipe_direction_lock_threshold = 10
workspace_swipe_forever = false
workspace_swipe_use_r = false
}
##################################################
# TOUCHPAD GESTURE BINDINGS #
##################################################
# 4-finger swipe up — show all windows (if hyprexpo installed)
# bind = , swipe:4:u, hyprexpo:expo, toggle
# 4-finger swipe down — special workspace
# bind = , swipe:4:d, togglespecialworkspace, magic
# 4-finger swipe left/right — switch apps
# bind = , swipe:4:l, exec, ~/.config/rofi/scripts/window-switcher.sh
# bind = , swipe:4:r, exec, ~/.config/rofi/scripts/window-switcher.sh
# Pinch to zoom
# bind = , pinch:in, exec, ~/.config/hypr/scripts/magnifier.sh zoom-out
# bind = , pinch:out, exec, ~/.config/hypr/scripts/magnifier.sh zoom-in