# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — GESTURE CONFIGURATION                        ║
# ║           Touchpad swipe gestures for workspace navigation                  ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

gestures {
    # ══════════════════════════════════════════════════════════════════════
    # 👆 WORKSPACE SWIPE
    # ══════════════════════════════════════════════════════════════════════

    # Enable workspace swipe with 3-finger gesture
    workspace_swipe = true

    # Number of fingers for swipe (3 or 4)
    workspace_swipe_fingers = 3

    # Minimum swipe distance (pixels) to trigger
    workspace_swipe_min_speed_to_force = 30

    # Distance needed to snap workspace (pixels)
    workspace_swipe_distance = 300

    # Invert swipe direction
    # true  = swipe left → next workspace (natural)
    # false = swipe left → previous workspace
    workspace_swipe_invert = true

    # Cancel swipe on touch (release finger without completing)
    workspace_swipe_cancel_ratio = 0.5

    # Create new workspace when swiping past last one
    workspace_swipe_create_new = true

    # Forever swipe (don't wrap at first/last workspace)
    workspace_swipe_forever = false

    # Use active workspace (include active in swipe animation)
    workspace_swipe_use_r = false

    # Minimum fingers (for compatibility)
    # workspace_swipe_min_fingers = false

    # Touch device for swipe (empty = all)
    # workspace_swipe_touch = false

    # ══════════════════════════════════════════════════════════════════════
    # 🔧 ADVANCED GESTURE NOTES
    # ══════════════════════════════════════════════════════════════════════
    # For 4-finger gestures:
    #   workspace_swipe_fingers = 4
    #
    # For smooth touchpad experience:
    #   workspace_swipe_distance = 250
    #   workspace_swipe_min_speed_to_force = 20
    #
    # Touchpad gestures beyond Hyprland's built-in:
    #   → Use: libinput-gestures (AUR) for more custom gestures
    #   → Config: ~/.config/libinput-gestures.conf
    #   → 4-finger up → overview, 4-finger down → hide all, etc.
}

# ══════════════════════════════════════════════════════════════════════════════
# 🤌 ADDITIONAL GESTURE BINDS (via gestures.sh)
# ══════════════════════════════════════════════════════════════════════════════
# These are executed by libinput-gestures or touchegg via scripts/gestures.sh
# Configured in ~/.config/hypr/scripts/utils/gestures.sh

# 4-finger pinch → Show/hide overview
# 4-finger swipe up → Show overview
# 4-finger swipe down → Show desktop
# 3-finger swipe left/right → Move window to prev/next workspace (with move)
# 2-finger swipe from edge → Back/forward in browser