# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — LAYER RULES                                  ║
# ║           Blur, animations, opacity for layer surfaces                      ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝
#
# 📖 Layer surfaces are non-window surfaces:
#   waybar, rofi, dunst, swaync, hyprlock, wlogout, etc.
#
# FORMAT: layerrule = RULE, NAMESPACE
# Find namespaces: hyprctl layers

# ══════════════════════════════════════════════════════════════════════════════
# 📊 WAYBAR
# ══════════════════════════════════════════════════════════════════════════════

layerrule = blur,             waybar
layerrule = ignorealpha 0.2,  waybar
layerrule = xray off,         waybar

# Waybar animation — slide from top
layerrule = animation slide,  waybar

# ══════════════════════════════════════════════════════════════════════════════
# 🚀 ROFI LAUNCHER
# ══════════════════════════════════════════════════════════════════════════════

layerrule = blur,             rofi
layerrule = ignorealpha 0.2,  rofi
layerrule = animation popin,  rofi

# ══════════════════════════════════════════════════════════════════════════════
# 🔔 DUNST NOTIFICATIONS
# ══════════════════════════════════════════════════════════════════════════════

layerrule = blur,             notifications
layerrule = ignorealpha 0.2,  notifications
layerrule = animation slide,  notifications

# ══════════════════════════════════════════════════════════════════════════════
# 📱 SWAYNC NOTIFICATION CENTER
# ══════════════════════════════════════════════════════════════════════════════

layerrule = blur,             swaync-notification-window
layerrule = ignorealpha 0.2,  swaync-notification-window
layerrule = animation slide,  swaync-notification-window

layerrule = blur,             swaync-control-center
layerrule = ignorealpha 0.2,  swaync-control-center
layerrule = animation slide,  swaync-control-center

# ══════════════════════════════════════════════════════════════════════════════
# 🔒 HYPRLOCK
# ══════════════════════════════════════════════════════════════════════════════

layerrule = blur,             hyprlock
layerrule = ignorezero,       hyprlock
layerrule = animation fade,   hyprlock

# ══════════════════════════════════════════════════════════════════════════════
# 🚪 WLOGOUT POWER MENU
# ══════════════════════════════════════════════════════════════════════════════

layerrule = blur,             logout_dialog
layerrule = ignorealpha 0.2,  logout_dialog
layerrule = animation popin,  logout_dialog

# ══════════════════════════════════════════════════════════════════════════════
# 🖥️ SWAYOSD (On-Screen Display)
# ══════════════════════════════════════════════════════════════════════════════

layerrule = blur,             swayosd
layerrule = ignorealpha 0.2,  swayosd
layerrule = animation popin,  swayosd

# ══════════════════════════════════════════════════════════════════════════════
# 🎨 GTK LAYER SHELL APPS
# ══════════════════════════════════════════════════════════════════════════════

layerrule = blur,             gtk-layer-shell
layerrule = ignorealpha 0.2,  gtk-layer-shell

# ══════════════════════════════════════════════════════════════════════════════
# 🔍 HYPRPICKER (Color picker)
# ══════════════════════════════════════════════════════════════════════════════

# No blur for color picker (accuracy)
layerrule = noblur,           hyprpicker

# ══════════════════════════════════════════════════════════════════════════════
# 🎯 SELECTION LAYERS
# ══════════════════════════════════════════════════════════════════════════════

# Screenshot selection overlay — no blur
layerrule = noblur,           selection
layerrule = noblur,           hyprshot