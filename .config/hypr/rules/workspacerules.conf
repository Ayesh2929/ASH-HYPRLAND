# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — WORKSPACE RULES                              ║
# ║           10 workspaces + 3 special workspaces configuration               ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# 🗂️ WORKSPACE DEFINITIONS
# ══════════════════════════════════════════════════════════════════════════════
# FORMAT: workspace = ID, RULE:VALUE, RULE:VALUE, ...
#
# Rules:
#   monitor:NAME          → assign to specific monitor
#   default:true/false    → default workspace for monitor
#   persistent:true/false → keep workspace even when empty
#   gapsin:N              → custom gap inside
#   gapsout:N             → custom gap outside
#   rounding:true/false   → corner rounding
#   decorate:true/false   → window decorations
#   border:true/false     → window borders
#   shadow:true/false     → window shadows
#   layoutopt:orientation:VALUE → layout option override

# ══════════════════════════════════════════════════════════════════════════════
# 💻 MAIN WORKSPACES (1-10)
# ══════════════════════════════════════════════════════════════════════════════

# Workspace 1 — Terminal / Development (default)
workspace = 1, persistent:true, default:true

# Workspace 2 — Browser
workspace = 2, persistent:true

# Workspace 3 — Code Editor
workspace = 3

# Workspace 4 — Files / Documents
workspace = 4

# Workspace 5 — Media / Music
workspace = 5

# Workspace 6 — Communication
workspace = 6

# Workspace 7 — Email / Calendar
workspace = 7

# Workspace 8 — Gaming (no gaps, no rounding for immersion)
workspace = 8, gapsin:0, gapsout:0, rounding:false, decorate:false

# Workspace 9 — System Monitor / Virtual Machines
workspace = 9

# Workspace 10 — Miscellaneous
workspace = 10

# ══════════════════════════════════════════════════════════════════════════════
# 🖥️ DUAL MONITOR WORKSPACE ASSIGNMENT
# ══════════════════════════════════════════════════════════════════════════════
# Uncomment and modify for dual monitor setups:

# Primary monitor (DP-1) — main workspaces
# workspace = 1,  monitor:DP-1, default:true
# workspace = 2,  monitor:DP-1
# workspace = 3,  monitor:DP-1
# workspace = 4,  monitor:DP-1
# workspace = 5,  monitor:DP-1

# Secondary monitor (HDMI-A-1) — secondary workspaces
# workspace = 6,  monitor:HDMI-A-1, default:true
# workspace = 7,  monitor:HDMI-A-1
# workspace = 8,  monitor:HDMI-A-1
# workspace = 9,  monitor:HDMI-A-1
# workspace = 10, monitor:HDMI-A-1

# ══════════════════════════════════════════════════════════════════════════════
# ✨ SPECIAL WORKSPACES (Scratchpads)
# ══════════════════════════════════════════════════════════════════════════════

# Special: Main magic scratchpad (SUPER + -)
workspace = special:magic, gapsin:20, gapsout:40

# Special: Music player scratchpad (SUPER + M)
workspace = special:music, gapsin:10, gapsout:20

# Special: Notes (SUPER + SHIFT + N)
workspace = special:notes, gapsin:15, gapsout:30

# Special: Files browser (SUPER + SHIFT + E)
workspace = special:files, gapsin:10, gapsout:20

# ══════════════════════════════════════════════════════════════════════════════
# 🎨 WORKSPACE VISUAL OVERRIDES
# ══════════════════════════════════════════════════════════════════════════════

# Gaming workspace — maximum performance, no eye candy
workspace = 8, gapsin:0, gapsout:0

# Minimal workspace — for focused work
# workspace = 3, gapsin:4, gapsout:8

# Creative workspace — more gaps for breathing room
# workspace = 5, gapsin:16, gapsout:24

