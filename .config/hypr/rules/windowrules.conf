# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — WINDOW RULES (50+ Rules)                     ║
# ║           Float, size, opacity, workspace, animation overrides              ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝
#
# 📖 FORMAT:
#   windowrulev2 = RULE, CONDITION
#
# 🔍 CONDITIONS:
#   class:^(exact-class)$       → window class (WM_CLASS)
#   title:^(exact-title)$       → window title
#   xwayland:1                  → XWayland windows
#   floating:1                  → floating windows
#   fullscreen:1                → fullscreen windows
#   pinned:1                    → pinned windows
#   focus:1                     → focused window
#   workspace:N                 → on workspace N
#
# 🔍 Find class/title:
#   hyprctl clients | grep class
#   hyprctl activewindow
#   xprop WM_CLASS (for X11 apps)

# ══════════════════════════════════════════════════════════════════════════════
# 🪟 FLOATING WINDOWS
# ══════════════════════════════════════════════════════════════════════════════

# ── System Dialogs ────────────────────────────────────────────────────────────
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(nm-applet)$
windowrulev2 = float, class:^(polkit-kde-authentication-agent-1)$
windowrulev2 = float, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = float, class:^(polkit-gnome-authentication-agent-1)$
windowrulev2 = float, class:^(lxqt-policykit-agent)$

# ── Settings & Config ──────────────────────────────────────────────────────────
windowrulev2 = float, class:^(gnome-control-center)$
windowrulev2 = float, class:^(kde-settings)$
windowrulev2 = float, class:^(qt5ct)$
windowrulev2 = float, class:^(qt6ct)$
windowrulev2 = float, class:^(nwg-look)$
windowrulev2 = float, class:^(kvantummanager)$
windowrulev2 = float, class:^(lxappearance)$

# ── Calculators ────────────────────────────────────────────────────────────────
