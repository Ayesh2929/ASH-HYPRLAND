windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = float, title:^(About Mozilla Firefox)$
windowrulev2 = float, title:^(Firefox — Sharing Indicator)$

# ── Scratchpad / Floating Terminal ────────────────────────────────────────────
windowrulev2 = float, class:^(floating-term)$
windowrulev2 = float, class:^(scratch-term)$
windowrulev2 = float, class:^(scratch-music)$
windowrulev2 = float, class:^(scratch-notes)$
windowrulev2 = float, class:^(scratch-files)$

# ── ASH Tools ─────────────────────────────────────────────────────────────────
windowrulev2 = float, class:^(hyprpicker)$
windowrulev2 = float, class:^(wlogout)$
windowrulev2 = float, class:^(swayosd)$
windowrulev2 = float, title:^(ASH.*)$

# ── Wine/Proton ───────────────────────────────────────────────────────────────
windowrulev2 = float, class:^(steam)$, title:^(Steam - Self Updater)$
windowrulev2 = float, class:^(steam)$, title:^(Update News)$
windowrulev2 = float, class:^(steam)$, title:^(Friends List)$

# ── Misc Floats ───────────────────────────────────────────────────────────────
windowrulev2 = float, class:^(zenity)$
windowrulev2 = float, class:^(yad)$
windowrulev2 = float, class:^(dialog)$
windowrulev2 = float, title:^(Confirm.*)$
windowrulev2 = float, title:^(Warning.*)$
windowrulev2 = float, title:^(Error.*)$
windowrulev2 = float, title:^(Question.*)$
windowrulev2 = float, title:^(Information.*)$

# ══════════════════════════════════════════════════════════════════════════════
# 📐 FLOATING WINDOW SIZES
# ══════════════════════════════════════════════════════════════════════════════

# Audio mixer
windowrulev2 = size 800 600,   class:^(pavucontrol)$

# Bluetooth
windowrulev2 = size 700 500,   class:^(blueman-manager)$

# Network editor
windowrulev2 = size 750 550,   class:^(nm-connection-editor)$

# Image viewer
windowrulev2 = size 1200 800,  class:^(imv)$
windowrulev2 = size 1200 800,  class:^(feh)$

# Calculator
windowrulev2 = size 400 500,   class:^(galculator)$
windowrulev2 = size 450 550,   class:^(qalculate-gtk)$

# Floating terminal
windowrulev2 = size 1000 650,  class:^(floating-term)$

# File dialog
windowrulev2 = size 900 600,   class:^(xdg-desktop-portal-gtk)$

# Scratchpads
windowrulev2 = size 1200 700,  class:^(scratch-term)$
windowrulev2 = size 900 600,   class:^(scratch-music)$
windowrulev2 = size 800 600,   class:^(scratch-notes)$

# ══════════════════════════════════════════════════════════════════════════════
# 📍 FLOATING WINDOW POSITIONS
# ══════════════════════════════════════════════════════════════════════════════

# Center floating windows by default
windowrulev2 = center, class:^(pavucontrol)$
windowrulev2 = center, class:^(blueman-manager)$
windowrulev2 = center, class:^(nm-connection-editor)$
windowrulev2 = center, class:^(floating-term)$
windowrulev2 = center, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = center, class:^(galculator)$

# Picture-in-picture — bottom right
windowrulev2 = move 100%-w-20 100%-w-20, title:^(Picture-in-Picture)$
windowrulev2 = size 640 360, title:^(Picture-in-Picture)$
windowrulev2 = keepaspectratio, title:^(Picture-in-Picture)$

# ══════════════════════════════════════════════════════════════════════════════
# 🗂️ WORKSPACE ASSIGNMENTS
# ══════════════════════════════════════════════════════════════════════════════

# 1 — Terminal workspace
# windowrulev2 = workspace 1, class:^(kitty)$

# 2 — Browser workspace
windowrulev2 = workspace 2 silent, class:^(firefox)$
windowrulev2 = workspace 2 silent, class:^(brave-browser)$
windowrulev2 = workspace 2 silent, class:^(chromium)$

# 3 — Code workspace
# windowrulev2 = workspace 3, class:^(code-oss)$
# windowrulev2 = workspace 3, class:^(vscodium)$

# 4 — Files workspace
# windowrulev2 = workspace 4, class:^(nemo)$

# 5 — Media workspace
windowrulev2 = workspace 5 silent, class:^(spotify)$
windowrulev2 = workspace 5 silent, class:^(Spotify)$

# 6 — Communication workspace
windowrulev2 = workspace 6 silent, class:^(discord)$
windowrulev2 = workspace 6 silent, class:^(WebCord)$
windowrulev2 = workspace 6 silent, class:^(telegram-desktop)$
windowrulev2 = workspace 6 silent, class:^(slack)$

# 7 — Email workspace
windowrulev2 = workspace 7 silent, class:^(thunderbird)$

# 8 — Gaming workspace
windowrulev2 = workspace 8 silent, class:^(steam)$
windowrulev2 = workspace 8 silent, class:^(lutris)$
windowrulev2 = workspace 8 silent, class:^(heroic)$

# 9 — System/Monitor workspace
windowrulev2 = workspace 9 silent, class:^(btop)$
windowrulev2 = workspace 9 silent, class:^(virt-manager)$

# ══════════════════════════════════════════════════════════════════════════════
# 🎬 ANIMATION OVERRIDES
# ══════════════════════════════════════════════════════════════════════════════

# Rofi — fade animation
windowrulev2 = animation popin 80%, class:^(rofi)$

# wlogout — slide from bottom
windowrulev2 = animation slide, class:^(wlogout)$

# Floating dialogs — scale in
windowrulev2 = animation popin 85%, floating:1

# File managers — slide
windowrulev2 = animation slide, class:^(nemo|thunar|nautilus)$

# ══════════════════════════════════════════════════════════════════════════════
# 🚫 SPECIAL BEHAVIOR
# ══════════════════════════════════════════════════════════════════════════════

# Idle inhibit (prevent sleep while these run)
windowrulev2 = idleinhibit focus, class:^(mpv)$
windowrulev2 = idleinhibit fullscreen, class:^(firefox)$
windowrulev2 = idleinhibit fullscreen, class:^(chromium)$
windowrulev2 = idleinhibit always, class:^(obs)$

# No focus on open (background apps)
windowrulev2 = noinitialfocus, class:^(nm-applet)$
windowrulev2 = noinitialfocus, class:^(blueman-applet)$
windowrulev2 = noinitialfocus, class:^(spotify)$

# Suppress maximize event (force tiling)
windowrulev2 = suppressevent maximize, class:^(firefox)$
windowrulev2 = suppressevent maximize, class:^(chromium)$

# Force XWayland for specific apps
windowrulev2 = xwayland, class:^(steam)$

# Immediate focus after open
windowrulev2 = focus, class:^(floating-term)$
windowrulev2 = focus, class:^(rofi)$

# Fullscreen specific apps
windowrulev2 = fullscreen, class:^(gamescope)$
windowrulev2 = fullscreen, class:^(steam_app_.*)$

# Maximize on open
# windowrulev2 = maximize, class:^(firefox)$

# Keep aspect ratio (for floating media)
windowrulev2 = keepaspectratio, class:^(mpv)$
windowrulev2 = keepaspectratio, class:^(imv)$