windowrulev2 = float, class:^(qalculate-gtk)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = float, class:^(kcalc)$

# ── Image Viewers ─────────────────────────────────────────────────────────────
windowrulev2 = float, class:^(imv)$
windowrulev2 = float, class:^(feh)$
windowrulev2 = float, class:^(eog)$
windowrulev2 = float, class:^(shotwell)$

# ── Archive Managers ──────────────────────────────────────────────────────────
windowrulev2 = float, class:^(file-roller)$
windowrulev2 = float, class:^(ark)$
windowrulev2 = float, class:^(nemo-fileroller)$
windowrulev2 = float, class:^(xarchiver)$

# ── Download Dialogs ──────────────────────────────────────────────────────────
windowrulev2 = float, title:^(Open Files?)$
windowrulev2 = float, title:^(Save Files?)$
windowrulev2 = float, title:^(Save As.*)$
windowrulev2 = float, title:^(Open.*)$
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = float, class:^(xdg-desktop-portal)$

# ── Media Players ─────────────────────────────────────────────────────────────
