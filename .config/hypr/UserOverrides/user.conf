# ══════════════════════════════════════════════════════════════════════════════
# 🖥️ MONITOR CONFIGURATION (REQUIRED — edit for your setup)
# ══════════════════════════════════════════════════════════════════════════════

# Auto-detect all monitors (default — works for most setups)
monitor = ,preferred,auto,auto

# Examples — uncomment and modify for your monitors:
# Single 1080p 144Hz
# monitor = DP-1, 1920x1080@144, 0x0, 1

# Dual monitors (primary left, secondary right)
# monitor = DP-1, 2560x1440@165, 0x0, 1
# monitor = HDMI-A-1, 1920x1080@60, 2560x0, 1

# Laptop with external monitor
# monitor = eDP-1, 1920x1080@60, 0x0, 1
# monitor = HDMI-A-1, 1920x1080@60, 1920x0, 1

