# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH'S HYPRLAND DOTFILES v3.0 — MASTER CONFIGURATION               ║
# ║           Epic Production-Ready Wayland Compositor Config                    ║
# ║           Version: 3.0.0 | Author: Ash                                      ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝
#
# 📋 LOAD ORDER (critical — do not reorder):
#   1. Core system settings (env, monitors, input, general)
#   2. Visual modules (decorations, animations, blur)
#   3. Window/workspace rules
#   4. Keybinds and autostart
#   5. User overrides (HIGHEST PRIORITY — loaded last)
#
# 🎨 Theme variables are injected by theme-engine.sh into:
#   ~/.cache/ash-dots/colors/current.sh  (shell)
#   ~/.config/hypr/themes/active.conf    (hyprland)

# ══════════════════════════════════════════════════════════════════════════════
# 01 — CORE SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

source = ~/.config/hypr/core/env.conf
source = ~/.config/hypr/core/monitors.conf
source = ~/.config/hypr/core/input.conf
source = ~/.config/hypr/core/general.conf
source = ~/.config/hypr/core/cursor.conf
source = ~/.config/hypr/core/binds.conf

# ══════════════════════════════════════════════════════════════════════════════
# 02 — VISUAL MODULES
# ══════════════════════════════════════════════════════════════════════════════

source = ~/.config/hypr/modules/decorations.conf
source = ~/.config/hypr/modules/animations.conf
source = ~/.config/hypr/modules/blur.conf
source = ~/.config/hypr/modules/lighting.conf
source = ~/.config/hypr/modules/layouts.conf
source = ~/.config/hypr/modules/gestures.conf
source = ~/.config/hypr/modules/misc.conf

# ══════════════════════════════════════════════════════════════════════════════
# 03 — KEYBINDS & AUTOSTART
# ══════════════════════════════════════════════════════════════════════════════

source = ~/.config/hypr/modules/submaps.conf
source = ~/.config/hypr/modules/media-keys.conf
source = ~/.config/hypr/modules/keybinds.conf
source = ~/.config/hypr/modules/autostart.conf

# ══════════════════════════════════════════════════════════════════════════════
# 04 — WINDOW & WORKSPACE RULES
# ══════════════════════════════════════════════════════════════════════════════

source = ~/.config/hypr/rules/windowrules.conf
source = ~/.config/hypr/rules/workspacerules.conf
source = ~/.config/hypr/rules/layerrules.conf

# ══════════════════════════════════════════════════════════════════════════════
# 05 — ACTIVE THEME (generated by theme-engine.sh)
# ══════════════════════════════════════════════════════════════════════════════

source = ~/.config/hypr/themes/active.conf

# ══════════════════════════════════════════════════════════════════════════════
# 99 — USER OVERRIDES (HIGHEST PRIORITY — loaded last)
# ══════════════════════════════════════════════════════════════════════════════

source = ~/.config/hypr/UserOverrides/user.conf