# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — BTOP SYSTEM MONITOR CONFIGURATION            ║
# ║           Resource monitor with beautiful ASH dark theme                   ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

#* Name of a btop++/bpytop/bashtop formatted ".theme" file, "Default" and
#* "TTY" (for TTY mode) are always available.
color_theme = "ash-dark"

#* If the theme set background should be shown, set to False if you want
#* terminal background transparency.
theme_background = False

#* Sets if 24-bit truecolor should be used, will convert 24-bit colors to
#* 256 color (6x6x6 color cube) if false.
truecolor = True

#* Enabling this will force at least 24-bit color depth for all colors.
force_tty = False

#* Define presets for the layout of the boxes.
#* Syntax: "box_name:P:G,box_name:P:G2" P = position, G = growth
#* Available boxes: cpu mem net proc gpu0-5
#* Keep in mind that terminal size affects what is possible.
presets = "cpu:1:default,proc:0:1,mem:0:1,net:0:1"

#* Set to True to enable "vim keys" for navigation in the process list.
vim_keys = True

#* Rounds the corners of all boxes, set to 0 to disable.
rounded_corners = True

#* Default symbols to use for graph creation, "braille", "block" or "tty".
#* "braille" offers the most resolution but might not be included in all
#* fonts.
#* "block" has half the resolution of braille but uses more common
#* characters.
#* "tty" uses only 3 different symbols.
graph_symbol = "braille"

# Graph symbol to use for graphs in cpu box, "default", "braille",
# "block" or "tty".
graph_symbol_cpu = "default"

# Graph symbol to use for graphs in gpu box, "default", "braille",
# "block" or "tty".
graph_symbol_gpu = "default"

# Graph symbol to use for the net box, "default", "braille", "block"
# or "tty".
graph_symbol_net = "default"

# Graph symbol to use for the mem box, "default", "braille", "block"
# or "tty".
graph_symbol_mem = "default"

#* Manually set which boxes to show. Available values are "cpu mem net
#* proc" and "gpu0" to "gpu5", separate values with whitespace.
shown_boxes = "cpu mem net proc"

#* Update time in milliseconds, recommended 2000 ms or above for correct
#* cpu usage reporting.
update_ms = 2000

#* Processes sorting, "pid" "program" "arguments" "threads" "user"
#* "memory" "cpu lazy" "cpu direct"
proc_sorting = "cpu lazy"

#* Reverse sorting order, True or False.
proc_reversed = False

#* Show processes as a tree.
proc_tree = False

#* Use the cpu graph colors in the process list.
proc_colors = True

#* Use a gradient generated from the "proc_color" and target the
#* processes cpu bar.
proc_gradient = True

#* If process cpu usage should be of the core it's running on or shared
#* between all cores.
proc_per_core = False

#* Show process memory as bytes instead of percent.
proc_mem_bytes = True

#* Show cpu graph for each process.
proc_cpu_graphs = True

#* Use /proc/[pid]/smaps for memory information in the proc info box
#* (very slow in some cases, defaults to False if swap enabled).
proc_info_smaps = False

#* Show proc box on left side of screen instead of right.
proc_left = False

#* Sets the CPU stat shown in the upper left corner of the cpu box.
#* "total-nice" = Total CPU% not including nice'd processes.
cpu_graph_upper = "total"
cpu_graph_lower = "user"

#* Toggles whether the lower CPU% graph should be inverted.
cpu_invert_lower = True

#* Set to True to completely disable the lower CPU% graph.
cpu_single_graph = False

#* Show battery info if detected.
show_battery = True

#* Which battery to use if multiple are present.
#* "Auto" to auto-select on change.
selected_battery = "Auto"

#* Set user or root (0) UID-s that should be shown in the process box.
proc_filter_kernel = False

#* Sets the CPU avg column to show cores (True) or average (False).
show_coretemp = True

#* Set a custom value for the cpu usage graph drawing threshold.
cpu_sensor = "Auto"

#* Show temperature from CPU DTS (Digital Thermal Sensor)?
check_temp = True

#* Draw a clock at top of screen, formatting according to strftime, empty
#* string to disable.
clock_format = "%H:%M:%S — %A %d %b"

#* Update main ui when menus are showing, set this to false if the menus
#* is flickering too much for comfort.
background_update = True

#* Custom cpu model name, empty string to disable.
custom_cpu_name = ""

#* Optional filter for shown disks, should be full path of a mountpoint,
#* "root" to only show "/" path, empty string to show all.
disks_filter = ""

#* Show graphs instead of meters for memory values.
mem_graphs = True

#* Show mem box below net box instead of above.
mem_below_net = False

#* Count ZFS ARC in cached and available memory.
zfs_arc_cached = True

#* If swap memory should be shown in the mem box.
show_swap = True

#* Show swap as a disk, ignores the above setting if enabled.
swap_disk = True

#* If mem box should be split to also show disks info.
show_disks = True

#* Filter out non-physical disks. Set to False to include network disks,
#* RAM disks and similar.
only_physical = True

#* Read disks info every time disks are updated.
use_fstab = True

#* Setting this to True will hide all filesystems not included in the
#* fstab file. Only meaningful if use_fstab = True.
show_io_stat = True

#* Toggles if io activity should be shown in the disk graphs.
io_mode = False

#* Set to True to show combined read/write io graphs in io mode.
io_graph_combined = False

#* Set the top speed for the io graphs in MiB/s (100 by default).
io_graph_speeds = ""

#* Set fixed values for the network graphs (0 for auto-scaling).
net_download = 100
net_upload   = 100

#* Use network graphs auto rescaling mode.
net_auto = True

#* Sync the auto rescaling for download and upload network graphs.
net_sync = True

#* Starts with the Network Interface specified here.
net_iface = ""

#* Show battery info in the cpu box.
show_battery = True

#* Sort batteries by device name (battery1, battery2 ...).
battery_sensor = "Auto"

#* Set loglevel for "~/.config/btop/btop.log".
log_level = "WARNING"