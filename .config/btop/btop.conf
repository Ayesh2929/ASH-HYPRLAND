#* Name of a btop++/bpytop/bashtop formatted ".theme" file, "Default" and "TTY" for builtin themes.
#* Themes should be placed in "../share/btop/themes" relative to binary or in "$HOME/.config/btop/themes"
color_theme = "ash-dark"

#* If the theme set backbutton = true, disabling will force all panel background to become your terminal default
theme_background = True

#* Sets if 24-bit truecolor should be used, will convert 24-bit colors to 256 color (6x6x6 color cube) if false.
truecolor = True

#* Set to true to force tty mode regardless if a real tty has been detected, will force false color and TTY theme.
#* Will also run in a more CPU efficient mode as TTY is assumed to not be able to display the complex graphs.
force_tty = False

#* Define presets for the layout of the boxes, "battery" will always fail (except on Macs and some laptops),
#* Separate each preset with a comma, preset determines the shown boxes and in which order.
#* "cpu mem net proc" should always exist as the last preset or final fallback
presets = "cpu proc;cpu mem net proc;cpu mem net proc battery"

#* Set to True to enable "proc_left" key press to switch from process view to main window
vim_keys = True

#* Rounded corners on boxes, is ignored if TTY mode is true.
rounded_corners = True

#* Default symbols to use for graph creation, "braille", "block" or "tty".
#* "braille" offers the highest resolution but might not be included in all fonts.
#* "block" is one step below and widely supported, "tty" is 1/2 resolution and uses glyphs suitable for TTY environments.
graph_symbol = "braille"

#* Default symbols to use for graphs in cpu box.
graph_symbol_cpu = "default"

#* Default symbols to use for graphs in gpu box.
graph_symbol_gpu = "default"

#* Default symbols to use for graphs in mem box.
graph_symbol_mem = "default"

#* Default symbols to use for graphs in net box.
graph_symbol_net = "default"

#* Default symbols to use for graphs in proc box.
graph_symbol_proc = "default"

#* Manually set which boxes to show, "cpu mem net proc" and "battery" are available.
shown_boxes = "cpu mem net proc"

#* Update time in milliseconds, recommended 2000 ms or above for better sample times for graphs.
update_ms = 2000

#* Processes sorting, "pid" "program" "arguments" "threads" "user" "memory" "cpu lazy" "cpu direct",
#* "cpu lazy" updates sorting over time, "cpu direct" updates every time and "cpu" is an alias for "cpu lazy"
proc_sorting = "cpu lazy"

#* Reverse sorting order, True or False.
proc_reversed = False

#* Show processes as a tree
proc_tree = False

#* Use the cpu graph colors in the process list.
proc_colors = True

#* Use a darkening gradient in the process list.
proc_gradient = True

#* If process cpu usage should be of the core it's running on or usage of the total available cpu power.
proc_per_core = True

#* Show process memory as bytes instead of percent
proc_mem_bytes = True

#* Show cpu graph for each core.
proc_cpu_graphs = True

#* Show VIRTual memory column in processes.
proc_info_smaps = False

#* Show processes running in background as well as foreground processes.
proc_left = False

#* (Linux) Filter processes tied to the Linux kernel(similar to running htop with -K flag)
proc_filter_kernel = False

#* In tree-view, always accumulate Child process resources in root process when calculating
#* CPU and MEM usage, Information from /proc may not always be correct for this calculation.
proc_aggregate = False

#* Optional filter for shown CPUs in cpu box
cpu_graph_upper_color = "auto"
cpu_graph_lower_color = "auto"

#* Enable gpu info in the cpu box, set to True or gpu name to show, if "auto" will show when detected.
cpu_show_gpu = True

#* Show temperature for each cpu core in cpu box.
check_temp = True

#* Which sensor to use for cpu temperature, use options menu to select from list of available sensors.
cpu_sensor = "Auto"

#* Show temperatures in celsius or fahrenheit, select from options menu.
show_coretemp = True

#* Set a custom temperature threshold for cpu set to 0 to disable, for gpu see "gpu_temp_high".
cpu_temp_high = 80

#* Set a custom temperature threshold for cpu set to 0 to disable, for gpu see "gpu_temp_crit".
cpu_temp_crit = 95

#* Clock formatting for cpu box, empty string to disable, see 'man strftime' for syntax.
clock_format = "%X"

#* Update main ui in background when menus are shown, set this to false if the ui is flickering too much for comfort.
background_update = True

#* Custom cpu model name, empty string to disable.
custom_cpu_name = ""

#* Optional filter for shown disks, should be full path of a mountpoint, separate multiple mountpoints with whitespace " ".
#* Begin line with "exclude=" to not include select disks, oterwise all disks not in list will be excluded,
#* No "exclude=" means all disks listed will be shown, disks not listed will be hidden.
disks_filter = ""

#* Show graphs instead of meters for memory values.
mem_graphs = True

#* Show mem box below net box instead of above.
mem_below_net = False

#* Count ZFS ARC in cached and available memory.
zfs_arc_cached = True

#* If swap memory should be shown in memory box.
show_swap = True

#* Show swap as a disk, ignores show_swap value above, inserts itself after first disk.
swap_disk = True

#* If mem box should be split to also show disks info.
show_disks = True

#* Filter out non-physical disks. Set this to False to include network disks, RAM disks and similar.
only_physical = True

#* Read disks info every 30 updates instead of every update (way less resource intensive).
use_fstab = True

#* Setting this to True will signal btop++ to look for disks not mounted when --use-fstab True is set.
detect_lowervfs = False

#* Toggles if io activity % (disk busy time) should be shown in regular disk usage view
show_io_stat = True

#* Toggles io mode for disks, showing only io speeds with sync/async and total.
io_mode = False

#* Set to True to show combined read/write io graphs in io mode.
io_graph_combined = False

#* Set the top speed for the io graphs in MiB/s (100 by default), 0 for variable (may cause performance issues)
io_graph_speeds = ""

#* Set fixed values for network graphs in Mebibits. Is only used if net_auto is also set to False.
net_download = 100

net_upload = 100

#* Use auto rescaling for network graphs, ignores any values set above and rescales down to 10 Kibibits at the lowest.
net_auto = True

#* Sync the auto scaling for download and upload to whichever currently has the highest scale.
net_sync = True

#* Starts with the Network Interface specified here.
net_iface = ""

#* Show battery stats in top right if battery is present
show_battery = True

#* Which battery to use if multiple are present. "Auto" for auto detection.
selected_battery = "Auto"

#* Set loglevel for "~/.config/btop/btop.log" levels are: "ERROR" "WARNING" "INFO" "DEBUG".
#* The level set includes all lower levels, i.e. "DEBUG" will show all logging info.
log_level = "WARNING"