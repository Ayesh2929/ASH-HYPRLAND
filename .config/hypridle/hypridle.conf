# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — HYPRIDLE CONFIGURATION                       ║
# ║           5-stage idle management: dim → lock → DPMS → suspend            ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

general {
    # Seconds before considering "locked" when lock runs
    lock_cmd          = "pidof hyprlock || hyprlock"

    # Action to run before sleeping
    before_sleep_cmd  = "loginctl lock-session"

    # Action to run after waking up
    after_sleep_cmd   = "hyprctl dispatch dpms on"

    # Ignore DPMS when idle inhibit is set
    ignore_dbus_inhibit = false

    # Ignore systemd inhibit
    ignore_systemd_inhibit = false
}

# ══════════════════════════════════════════════════════════════════════════════
# 🕐 STAGE 1 — DIM SCREEN (2.5 minutes)
# ══════════════════════════════════════════════════════════════════════════════

listener {
    timeout  = 150    # 2.5 minutes

    # Reduce brightness to 30% for idle indication
    on-timeout  = "brightnessctl -s set 30%"

    # Restore brightness on activity
    on-resume   = "brightnessctl -r"
}

# ══════════════════════════════════════════════════════════════════════════════
# 🕑 STAGE 2 — ENABLE NIGHT LIGHT (4 minutes)
# ══════════════════════════════════════════════════════════════════════════════

listener {
    timeout  = 240    # 4 minutes

    # Apply warm night light filter
    on-timeout  = "~/.config/hypr/scripts/hardware/dpms.sh night-enable"

    # Remove night light on resume
    on-resume   = "~/.config/hypr/scripts/hardware/dpms.sh night-disable"
}

# ══════════════════════════════════════════════════════════════════════════════
# 🔒 STAGE 3 — LOCK SCREEN (5 minutes)
# ══════════════════════════════════════════════════════════════════════════════

listener {
    timeout  = 300    # 5 minutes

    # Lock the screen
    on-timeout  = "loginctl lock-session"

    # No resume action needed (lock handles it)
    on-resume   = ""
}

# ══════════════════════════════════════════════════════════════════════════════
# 🖥️ STAGE 4 — TURN OFF DISPLAY (8 minutes)
# ══════════════════════════════════════════════════════════════════════════════

listener {
    timeout  = 480    # 8 minutes

    # Turn off displays
    on-timeout  = "hyprctl dispatch dpms off"

    # Turn displays back on
    on-resume   = "hyprctl dispatch dpms on && brightnessctl -r"
}

# ══════════════════════════════════════════════════════════════════════════════
# 💤 STAGE 5 — SUSPEND (15 minutes)
# ══════════════════════════════════════════════════════════════════════════════

listener {
    timeout  = 900    # 15 minutes

    # Suspend system (only if not on AC power or gaming)
    on-timeout  = "~/.config/hypr/scripts/system/lock.sh suspend"

    # Wake-up actions
    on-resume   = "hyprctl dispatch dpms on && brightnessctl -r"
}

# ══════════════════════════════════════════════════════════════════════════════
# 📝 CONFIGURATION NOTES
# ══════════════════════════════════════════════════════════════════════════════
#
# Timeline:
#   0m        → Active use
#   2.5m      → Screen dims to 30%
#   4m        → Night light enabled (warm tones)
#   5m        → Screen locks (hyprlock)
#   8m        → Display turns off (DPMS)
#   15m       → System suspends
#
# To disable specific stages, comment out the listener block.
#
# To adjust timings, change the timeout values (in seconds).
#
# Idle inhibition:
#   - ash idle-inhibit toggle    → Toggle inhibitor via keybind
#   - SUPER + I                  → Toggle from Hyprland
#   - Video players auto-inhibit via windowrulev2 in windowrules.conf
#
# Power modes:
#   - Performance profile: timeouts may not apply
#   - Battery saver: timeouts are shorter (managed by power-profile.sh)