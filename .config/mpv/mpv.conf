# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — MPV MEDIA PLAYER                             ║
# ║           Highly optimized media player configuration                      ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# 🎬 VIDEO OUTPUT
# ══════════════════════════════════════════════════════════════════════════════

# GPU hardware acceleration (best quality/performance)
vo=gpu-next

# GPU API (Wayland uses vulkan or egl)
gpu-api=vulkan

# Wayland native rendering
gpu-context=waylandvk

# Scale to window size
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell

# Downscale anti-ringing
scale-antiring=0.7
cscale-antiring=0.7

# High quality deband
deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=4

# Correct gamma
gamma-auto=yes

# HDR tone mapping
tone-mapping=bt.2390

# Video sync
video-sync=display-resample
interpolation=yes
tscale=oversample

# ══════════════════════════════════════════════════════════════════════════════
# 🔊 AUDIO
# ══════════════════════════════════════════════════════════════════════════════

# PipeWire audio output
ao=pipewire

# Volume normalization
af=dynaudnorm=f=75:o=false:m=25

# Audio channels
audio-channels=stereo

# Audio buffer
audio-buffer=0.1

# ══════════════════════════════════════════════════════════════════════════════
# 💻 HARDWARE ACCELERATION
# ══════════════════════════════════════════════════════════════════════════════

# Hardware decoding (auto-safe = use hw if available, fallback gracefully)
hwdec=auto-safe
hwdec-codecs=all

# VAAPI (AMD/Intel)
# hwdec=vaapi
# hwdec-codecs=h264,hevc,vp8,vp9,av1

# ══════════════════════════════════════════════════════════════════════════════
# 📐 WINDOW
# ══════════════════════════════════════════════════════════════════════════════

# Start in windowed mode
fullscreen=no

# Window title
title="${filename} — MPV"

# Keep window open after playback ends
keep-open=yes

# Auto-resize window to video size
autofit-larger=90%x90%
autofit-smaller=30%x30%

# Force window on top when playing
# ontop=yes

# Snap to screen edges
# snap-window=yes

# Window geometry
geometry=50%:50%

# Border
border=yes

# ══════════════════════════════════════════════════════════════════════════════
# 🎨 OSD (On-Screen Display)
# ══════════════════════════════════════════════════════════════════════════════

# OSD font
osd-font=JetBrainsMono Nerd Font
osd-font-size=36
osd-color=#cdd6f4
osd-border-color=#1e1e2e
osd-border-size=2
osd-shadow-color=#00000088
osd-shadow-offset=2

# OSD bar style
osd-bar=yes
osd-bar-align-y=-1
osd-bar-h=2.5
osd-bar-w=60
osd-bar-border-size=0.5

# OSD duration
osd-duration=2500

# OSD display conditions
osd-on-seek=msg-bar

# ══════════════════════════════════════════════════════════════════════════════
# 📜 SUBTITLE
# ══════════════════════════════════════════════════════════════════════════════

# Subtitle fonts
sub-font=JetBrainsMono Nerd Font
sub-font-size=44
sub-color=#ffffffff
sub-border-color=#000000ff
sub-border-size=3
sub-shadow-color=#00000088
sub-shadow-offset=2
sub-back-color=#00000066

# Subtitle position
sub-ass-override=strip
sub-fix-timing=yes
sub-auto=fuzzy

# Subtitle languages preference
slang=en,eng,english

# ══════════════════════════════════════════════════════════════════════════════
# 📂 FILE HANDLING
# ══════════════════════════════════════════════════════════════════════════════

# Save position in file
save-position-on-quit=yes

# Resume playback from saved position
resume-playback=yes

# Playlist behavior
loop-playlist=inf

# Cache
cache=yes
cache-default=75000
demuxer-max-bytes=150MiB
demuxer-readahead-secs=20

# Screenshot
screenshot-format=png
screenshot-png-compression=8
screenshot-template=~/Pictures/Screenshots/mpv-%F-T%wH.%wM.%wS.%wT-P%p
screenshot-directory=~/Pictures/Screenshots

# ══════════════════════════════════════════════════════════════════════════════
# 🎛️ PLAYBACK
# ══════════════════════════════════════════════════════════════════════════════

# Default volume
volume=100
volume-max=150

# Speed
speed=1.0

# Deinterlace (auto)
deinterlace=auto

# Chapters
chapter-seek-threshold=5.0

# ══════════════════════════════════════════════════════════════════════════════
# 🖥️ STREAM (YouTube/URLs)
# ══════════════════════════════════════════════════════════════════════════════

# yt-dlp integration
script-opts=ytdl_hook-ytdl_path=yt-dlp
ytdl=yes
ytdl-format=bestvideo[height<=1080]+bestaudio/best[height<=1080]

# Stream caching
stream-lavf-o=reconnect_delay_max=30

# ══════════════════════════════════════════════════════════════════════════════
# 📦 SCRIPTS
# ══════════════════════════════════════════════════════════════════════════════

# Scripts loaded from ~/.config/mpv/scripts/ automatically
# - uosc.lua        — Modern UI overlay
# - thumbfast.lua   — Thumbnail generation for seekbar
# - quality-menu.lua — Stream quality selector
# - autoload.lua    — Auto-load next file in directory

# ══════════════════════════════════════════════════════════════════════════════
# 🔧 PROFILES
# ══════════════════════════════════════════════════════════════════════════════

# High-quality profile (for powerful hardware)
[high-quality]
profile-cond=p["video-params/w"] >= 1920
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
glsl-shaders="~~/shaders/KrigBilateral.glsl"

# Low-quality / performance profile (for weaker hardware)
[low-latency]
profile-cond=false
scale=bilinear
cscale=bilinear
deband=no
interpolation=no

# Streaming profile (network streams)
[stream]
cache=yes
cache-default=150000