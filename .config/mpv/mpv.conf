# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — MPV MEDIA PLAYER CONFIGURATION               ║
# ║           Hardware-accelerated video playback                              ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# 🎮 HARDWARE ACCELERATION
# ══════════════════════════════════════════════════════════════════════════════

# Video output with hardware decoding
vo          = gpu

# GPU API (auto, vulkan, opengl)
gpu-api     = vulkan

# Hardware video decoding
hwdec       = auto-safe

# Profile (for high quality playback)
profile     = gpu-hq

# ══════════════════════════════════════════════════════════════════════════════
# 🖥️ VIDEO
# ══════════════════════════════════════════════════════════════════════════════

# Upscaling algorithm (ewa_lanczos is high quality)
scale       = ewa_lanczos

# Downscaling algorithm
dscale      = mitchell

# Chroma scaling
cscale      = ewa_lanczos

# High quality scaling
correct-downscaling = yes
linear-downscaling  = yes
sigmoid-upscaling   = yes

# Debanding (reduces color banding artifacts)
deband      = yes
deband-iterations = 2
deband-threshold  = 35
deband-range      = 16

# Motion interpolation (smoother playback)
# interpolation = yes
# video-sync    = display-resample

# Keep aspect ratio
keepaspect  = yes

# Start in window mode
fullscreen  = no

# Window title
title       = "${filename} — MPV"

# Border
border      = yes

# Remember window position
save-position-on-quit = yes

# ══════════════════════════════════════════════════════════════════════════════
# 🔊 AUDIO
# ══════════════════════════════════════════════════════════════════════════════

# Audio output
ao          = pipewire

# Audio channels
audio-channels = stereo

# Audio normalization
af          = "loudnorm=I=-16:TP=-1.5:LRA=11"

# Volume
volume      = 100
volume-max  = 150

# ══════════════════════════════════════════════════════════════════════════════
# 📝 SUBTITLES
# ══════════════════════════════════════════════════════════════════════════════

# Subtitle font
sub-font    = "JetBrainsMono Nerd Font"
sub-font-size = 42
sub-color   = "#FFFFFFFF"
sub-border-color = "#000000FF"
sub-border-size = 2.0
sub-shadow-color = "#00000088"
sub-shadow-offset = 1

# Auto-load subtitles with matching name
sub-auto    = fuzzy

# Subtitle position
sub-pos     = 95

# ══════════════════════════════════════════════════════════════════════════════
# 💾 CACHE & PERFORMANCE
# ══════════════════════════════════════════════════════════════════════════════

# Demuxer cache
demuxer-max-bytes    = 150MiB
demuxer-max-back-bytes = 75MiB

# Network cache
cache           = yes
cache-secs      = 30

# Read-ahead duration
cache-pause-initial = yes
cache-pause-wait    = 2

# ══════════════════════════════════════════════════════════════════════════════
# 🎨 OSC (On-Screen Controller)
# ══════════════════════════════════════════════════════════════════════════════

# Use uosc script instead of default OSC
osc         = no

# OSD font
osd-font    = "JetBrainsMono Nerd Font"
osd-font-size = 32
osd-color   = "#FFFFFFFF"
osd-border-color = "#000000BB"
osd-border-size = 1.5

# OSD status messages
osd-duration = 2000
osd-bar     = yes

# ══════════════════════════════════════════════════════════════════════════════
# 📜 SCRIPT OPTIONS
# ══════════════════════════════════════════════════════════════════════════════

# Screenshot config
screenshot-format       = png
screenshot-png-compression = 6
screenshot-dir          = ~/Pictures/Screenshots
screenshot-template     = "mpv-%F-%wH.%wM.%wS.%wT-x%x-y%y"

# ══════════════════════════════════════════════════════════════════════════════
# 🔄 LOOP & BEHAVIOR
# ══════════════════════════════════════════════════════════════════════════════

# Resume from last position
save-position-on-quit   = yes

# Auto-load playlist entries
# autoload                = yes (handled by autoload.lua script)

# Keep running after playlist ends
keep-open               = yes
keep-open-pause         = no

# ══════════════════════════════════════════════════════════════════════════════
# 🌐 YOUTUBE-DL / YT-DLP
# ══════════════════════════════════════════════════════════════════════════════

# Use yt-dlp for online streams
script-opts-append      = ytdl_hook-ytdl_path=yt-dlp

# Best quality format
ytdl-format             = "bestvideo[height<=?1080][fps<=?60]+bestaudio/best"

# ══════════════════════════════════════════════════════════════════════════════
# 🔌 PROFILE OVERRIDES
# ══════════════════════════════════════════════════════════════════════════════

# Low latency profile for screen sharing
[low-latency]
profile         = low-latency
cache           = no
demuxer-readahead-secs = 0

# High quality profile
[high-quality]
profile         = gpu-hq
deband          = yes
deband-iterations = 3