# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — UOSC CONFIGURATION                           ║
# ║           Modern UI overlay for MPV with ASH theme integration             ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# Timeline
timeline_size=25
timeline_size_min=2
timeline_size_max=40
timeline_start_hidden=no
timeline_persistency=paused,idle,audio
timeline_style=line
timeline_line_width=2
timeline_line_width_fullscreen=3
timeline_line_width_minimized_scale=10
timeline_cache=yes

# Colors (ASH Catppuccin Mocha)
color_foreground=cdd6f4
color_foreground_text=1e1e2e
color_background=1e1e2e
color_background_text=cdd6f4

# Scrollbar colors
color_cursor=cba6f7
color_cursor_text=1e1e2e

# Controls
controls=menu,gap,play,time:elapsed,space:2,time:remaining,space,fullscreen
controls_size=30
controls_size_fullscreen=35
controls_persistency=idle,audio
controls_margin=0
controls_spacing=2
controls_min_timeline_width=375

# Volume
volume_size=150
volume_size_fullscreen=200
volume_persistency=

# Playback speed
speed_step=0.1
speed_step_is_factor=no

# Icons
font=JetBrainsMono Nerd Font
font_bold=bold

# Chapter ranges
chapter_ranges=openings:30abf2/10,endings:30abf2/10

# Window borders
window_border_size=0

# Thumbnail (requires thumbfast.lua)
thumbnail=yes
thumbnail_size=240
thumbnail_height=135
thumbnail_border=2

# Title/filename
top_bar=no

# Menu
menu_item_height=40
menu_item_height_fullscreen=50
menu_min_width=200
menu_min_width_fullscreen=400
menu_parent_opacity=0.8
menu_opacity=1

# Navigation
sequence_f_key_shortcuts=yes

# Proximity threshold
proximity_in=40
proximity_out=120

# Click threshold
click_threshold=380