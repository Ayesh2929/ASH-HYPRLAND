# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — MPV KEY BINDINGS                             ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# ⏯️ PLAYBACK
# ══════════════════════════════════════════════════════════════════════════════

SPACE           cycle pause                     # Play/Pause
p               cycle pause                     # Play/Pause (alt)
ENTER           cycle pause                     # Play/Pause (alt2)

# Seek
RIGHT           seek 5                          # Seek forward 5s
LEFT            seek -5                         # Seek backward 5s
UP              seek 60                         # Seek forward 60s
DOWN            seek -60                        # Seek backward 60s
SHIFT+RIGHT     seek 30                         # Seek forward 30s
SHIFT+LEFT      seek -30                        # Seek backward 30s
CTRL+RIGHT      seek 300                        # Seek forward 5min
CTRL+LEFT       seek -300                       # Seek backward 5min

# Frame-by-frame
.               frame-step                      # Next frame
,               frame-back-step                 # Previous frame

# ══════════════════════════════════════════════════════════════════════════════
# 🔊 AUDIO
# ══════════════════════════════════════════════════════════════════════════════

9               add volume -5                   # Volume down
0               add volume 5                    # Volume up
WHEEL_UP        add volume 5                    # Volume up (scroll)
WHEEL_DOWN      add volume -5                   # Volume down (scroll)
m               cycle mute                      # Toggle mute
a               cycle audio                     # Cycle audio tracks
A               cycle audio down                # Cycle audio tracks (reverse)

# Audio delay
CTRL+PLUS       add audio-delay 0.1             # Delay audio
CTRL+MINUS      add audio-delay -0.1            # Advance audio

# ══════════════════════════════════════════════════════════════════════════════
# 📜 SUBTITLES
# ══════════════════════════════════════════════════════════════════════════════

v               cycle sub-visibility            # Toggle subtitles
s               cycle sub                       # Cycle subtitle tracks
S               cycle sub down                  # Cycle sub tracks (reverse)
j               cycle sub                       # Cycle subs (alt)
J               cycle sub down                  # Cycle subs reverse (alt)

# Subtitle position
r               add sub-pos -1                  # Move subs up
R               add sub-pos +1                  # Move subs down
T               cycle sub-forced-only           # Toggle forced subs

# Subtitle size
CTRL+PLUS       add sub-scale +0.1              # Increase sub size
CTRL+MINUS      add sub-scale -0.1              # Decrease sub size

# Subtitle delay
z               add sub-delay -0.1              # Delay subs
x               add sub-delay +0.1              # Advance subs
Z               add sub-delay -0.5              # Delay subs (large)
X               add sub-delay +0.5              # Advance subs (large)

# ══════════════════════════════════════════════════════════════════════════════
# 🖥️ VIDEO
# ══════════════════════════════════════════════════════════════════════════════

f               cycle fullscreen                # Toggle fullscreen
ESC             set fullscreen no               # Exit fullscreen
ENTER           cycle fullscreen                # Toggle fullscreen (alt)

# Aspect ratio
c               cycle video-aspect-override "16:9" "4:3" "2.35:1" "-1" # Cycle aspect

# Zoom
+               add video-zoom 0.1              # Zoom in
-               add video-zoom -0.1             # Zoom out
=               set video-zoom 0                # Reset zoom

# Pan
ALT+UP          add video-pan-y -0.05           # Pan up
ALT+DOWN        add video-pan-y +0.05           # Pan down
ALT+LEFT        add video-pan-x -0.05           # Pan left
ALT+RIGHT       add video-pan-x +0.05           # Pan right

# Rotation
CTRL+r          cycle video-rotate 90           # Rotate

# Deinterlace
d               cycle deinterlace               # Toggle deinterlace

# ══════════════════════════════════════════════════════════════════════════════
# 📋 PLAYLIST
# ══════════════════════════════════════════════════════════════════════════════

n               playlist-next                   # Next file
N               playlist-prev                   # Previous file
CTRL+n          playlist-next force             # Next (force)
CTRL+p          playlist-prev force             # Previous (force)
l               cycle-values loop-file "inf" "no" # Toggle loop file
L               cycle-values loop-playlist "inf" "no" # Toggle loop playlist

# ══════════════════════════════════════════════════════════════════════════════
# ⚡ SPEED
# ══════════════════════════════════════════════════════════════════════════════

[               multiply speed 1/1.1            # Slow down
]               multiply speed 1.1              # Speed up
\               set speed 1.0                   # Reset speed
BACKSPACE       set speed 1.0                   # Reset speed (alt)

# Specific speeds
1               set speed 0.5                   # 0.5x
2               set speed 1.0                   # 1.0x (normal)
3               set speed 1.5                   # 1.5x
4               set speed 2.0                   # 2.0x

# ══════════════════════════════════════════════════════════════════════════════
# 📸 SCREENSHOT
# ══════════════════════════════════════════════════════════════════════════════

PRINT           screenshot                       # Screenshot (with subs)
CTRL+PRINT      screenshot video                 # Screenshot (no subs)
SHIFT+PRINT     screenshot window                # Screenshot (window)

# ══════════════════════════════════════════════════════════════════════════════
# 🔧 MISC
# ══════════════════════════════════════════════════════════════════════════════

q               quit                            # Quit
Q               quit-watch-later                # Quit + save position
i               script-binding stats/display-stats-toggle # Stats overlay
?               script-binding stats/display-page-4       # Keybindings
`               script-binding console/enable   # Console
o               show-progress                   # Show progress bar
I               show-text "${filename}"         # Show filename
t               show-text "${time-pos} / ${duration} (${percent-pos}%)" # Show time

# Chapters
PGUP            add chapter 1                   # Next chapter
PGDWN           add chapter -1                  # Previous chapter

# OSD
O               osd                             # Toggle OSD

# Deband toggle
D               cycle deband                    # Toggle deband

# Color adjustments
4               add brightness -1               # Darker
5               add brightness 1                # Brighter
6               add contrast -1                 # Less contrast
7               add contrast 1                  # More contrast
8               add saturation -1               # Less saturation
9               add saturation 1                # More saturation

# Reset video settings
ctrl+h          set brightness 0; set contrast 0; set saturation 0; set gamma 0; set hue 0