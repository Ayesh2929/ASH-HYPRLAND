# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — HYPRLOCK CONFIGURATION                       ║
# ║           Beautiful lock screen with dynamic colors and media info         ║
# ║           Auto-generated by theme-engine.sh — DO NOT EDIT MANUALLY        ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# 🌐 GENERAL SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

general {
    # Disable auto-focus
    disable_loading_bar = false

    # Grace period (seconds to bypass lock after activation)
    grace = 0

    # No fail count hide
    hide_cursor = true

    # Ignore empty password
    ignore_empty_input = false

    # Enable fractional scaling
    fractional_scaling = 2
}

# ══════════════════════════════════════════════════════════════════════════════
# 🖼️ BACKGROUND
# ══════════════════════════════════════════════════════════════════════════════

background {
    monitor =

    # Wallpaper from last-used wallpaper
    path = $HOME/.cache/ash-dots/wallpaper/last

    # Blur settings
    blur_passes   = 4
    blur_size     = 12
    noise         = 0.012
    contrast      = 0.90
    brightness    = 0.70
    vibrancy      = 0.18
    vibrancy_darkness = 0.0

    # Color fallback (if no wallpaper)
    color = rgba(30, 30, 46, 1.0)
}

# ══════════════════════════════════════════════════════════════════════════════
# 🖼️ GRADIENT OVERLAY
# ══════════════════════════════════════════════════════════════════════════════

shape {
    monitor =
    size      = 3840, 700
    color     = rgba(30, 30, 46, 0.6)
    rounding  = 0
    border_size  = 0
    border_color = rgba(0, 0, 0, 0)
    position  = 0, 0
    halign    = center
    valign    = bottom
}

# ══════════════════════════════════════════════════════════════════════════════
# 🔒 PASSWORD INPUT
# ══════════════════════════════════════════════════════════════════════════════

input-field {
    monitor =

    # Dimensions
    size         = 380, 60
    outline_thickness = 3
    dots_size    = 0.3
    dots_spacing = 0.18
    dots_center  = true
    dots_rounding = -1

    # Colors (overridden by theme engine)
    outer_color  = rgba(203, 166, 247, 1.0)
    inner_color  = rgba(30, 30, 46, 0.85)
    font_color   = rgba(205, 214, 244, 1.0)
    check_color  = rgba(166, 227, 161, 1.0)
    fail_color   = rgba(243, 139, 168, 1.0)
    fail_text    = "❌ Authentication failed ($ATTEMPTS)"
    fail_timeout = 2000
    fail_transition = 300

    # Placeholder
    placeholder_text = "<span foreground='##cdd6f4' font_style='italic'>  Password</span>"

    # Visual
    hide_input         = false
    rounding           = 16
    fade_on_empty      = true
    fade_timeout       = 1000

    # Position
    position    = 0, -240
    halign      = center
    valign      = center

    # Capslock indicator
    capslock_color = rgba(249, 226, 175, 1.0)
    numlock_color  = rgba(0, 0, 0, 0)
    bothlock_color = rgba(249, 226, 175, 1.0)
    invert_numlock = false

    # Show asterisks
    swap_font_color = false
}

# ══════════════════════════════════════════════════════════════════════════════
# 🕐 CLOCK — Large Time Display
# ══════════════════════════════════════════════════════════════════════════════

label {
    monitor =

    # Time
    text         = cmd[update:1000] echo "<span font='JetBrainsMono Nerd Font Bold 80'>$(date +'%H:%M')</span>"
    color        = rgba(205, 214, 244, 1.0)
    font_size    = 80
    font_family  = JetBrainsMono Nerd Font Bold

    shadow_passes = 3
    shadow_size   = 4
    shadow_color  = rgba(0, 0, 0, 0.5)
    shadow_boost  = 1.2

    position     = 0, 80
    halign       = center
    valign       = center
}

# ══════════════════════════════════════════════════════════════════════════════
# 📅 DATE
# ══════════════════════════════════════════════════════════════════════════════

label {
    monitor =

    text         = cmd[update:60000] echo "<span font='JetBrainsMono Nerd Font 20'>$(date +'%A, %B %d %Y')</span>"
    color        = rgba(186, 194, 222, 0.9)
    font_size    = 20
    font_family  = JetBrainsMono Nerd Font

    shadow_passes = 2
    shadow_size   = 3
    shadow_color  = rgba(0, 0, 0, 0.4)

    position     = 0, -10
    halign       = center
    valign       = center
}

# ══════════════════════════════════════════════════════════════════════════════
# 👤 USER AVATAR
# ══════════════════════════════════════════════════════════════════════════════

image {
    monitor =

    path         = $HOME/.face
    size         = 90
    rounding     = -1
    border_size  = 4
    border_color = rgba(203, 166, 247, 1.0)

    shadow_passes = 2
    shadow_size   = 8
    shadow_color  = rgba(0, 0, 0, 0.5)

    position     = 0, -150
    halign       = center
    valign       = center
}

# ══════════════════════════════════════════════════════════════════════════════
# 👤 USERNAME
# ══════════════════════════════════════════════════════════════════════════════

label {
    monitor =

    text         = $USER
    color        = rgba(203, 166, 247, 1.0)
    font_size    = 18
    font_family  = JetBrainsMono Nerd Font Bold

    shadow_passes = 2
    shadow_size   = 3
    shadow_color  = rgba(0, 0, 0, 0.4)

    position     = 0, -200
    halign       = center
    valign       = center
}

# ══════════════════════════════════════════════════════════════════════════════
# 🔋 BATTERY STATUS (bottom left)
# ══════════════════════════════════════════════════════════════════════════════

label {
    monitor =

    text         = cmd[update:30000] ~/.config/hyprlock/scripts/battery.sh
    color        = rgba(205, 214, 244, 0.85)
    font_size    = 14
    font_family  = JetBrainsMono Nerd Font

    position     = 40, 40
    halign       = left
    valign       = bottom
}

# ══════════════════════════════════════════════════════════════════════════════
# 🌐 NETWORK STATUS (bottom left, below battery)
# ══════════════════════════════════════════════════════════════════════════════

label {
    monitor =

    text         = cmd[update:10000] ~/.config/hyprlock/scripts/network.sh
    color        = rgba(205, 214, 244, 0.85)
    font_size    = 14
    font_family  = JetBrainsMono Nerd Font

    position     = 40, 70
    halign       = left
    valign       = bottom
}

# ══════════════════════════════════════════════════════════════════════════════
# 🎵 MEDIA PLAYER (bottom center)
# ══════════════════════════════════════════════════════════════════════════════

label {
    monitor =

    text         = cmd[update:2000] ~/.config/hyprlock/scripts/player.sh
    color        = rgba(166, 227, 161, 0.90)
    font_size    = 14
    font_family  = JetBrainsMono Nerd Font

    position     = 0, 40
    halign       = center
    valign       = bottom
}

# ══════════════════════════════════════════════════════════════════════════════
# 📊 SYSTEM INFO (bottom right)
# ══════════════════════════════════════════════════════════════════════════════

label {
    monitor =

    text         = cmd[update:5000] ~/.config/hyprlock/scripts/sysinfo.sh
    color        = rgba(205, 214, 244, 0.85)
    font_size    = 13
    font_family  = JetBrainsMono Nerd Font

    position     = -40, 40
    halign       = right
    valign       = bottom
}

# ══════════════════════════════════════════════════════════════════════════════
# 💡 HINT TEXT (lock screen info)
# ══════════════════════════════════════════════════════════════════════════════

label {
    monitor =

    text         = "<span font='JetBrainsMono Nerd Font 12' foreground='##7f849c'>  Type password to unlock</span>"
    color        = rgba(127, 132, 156, 0.8)
    font_size    = 12
    font_family  = JetBrainsMono Nerd Font

    position     = 0, -300
    halign       = center
    valign       = center
}