# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — SYSTEMD USER ENVIRONMENT                     ║
# ║           Environment variables for systemd user session                   ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# ── ASH Dotfiles ──────────────────────────────────────────────────────────────
ASH_DOTFILES=%h/.dotfiles
ASH_CONFIG=%h/.config
ASH_CACHE=%h/.cache/ash-dots
ASH_VERSION=3.0.0

# ── XDG Base Directories ──────────────────────────────────────────────────────
XDG_CONFIG_HOME=%h/.config
XDG_DATA_HOME=%h/.local/share
XDG_CACHE_HOME=%h/.cache
XDG_STATE_HOME=%h/.local/state

# ── Default Applications ──────────────────────────────────────────────────────
EDITOR=nvim
VISUAL=nvim
BROWSER=firefox
TERMINAL=kitty
PAGER=less

# ── Qt Wayland ────────────────────────────────────────────────────────────────
QT_QPA_PLATFORM=wayland;xcb
QT_QPA_PLATFORMTHEME=qt6ct
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
QT_AUTO_SCREEN_SCALE_FACTOR=1

# ── GTK ───────────────────────────────────────────────────────────────────────
GTK_THEME=Catppuccin-Mocha-Standard-Mauve-Dark
XCURSOR_THEME=Bibata-Modern-Ice
XCURSOR_SIZE=24

# ── Mozilla ───────────────────────────────────────────────────────────────────
MOZ_ENABLE_WAYLAND=1
MOZ_WAYLAND_USE_VAAPI=1

# ── Electron ──────────────────────────────────────────────────────────────────
ELECTRON_OZONE_PLATFORM_HINT=auto

# ── Tools ─────────────────────────────────────────────────────────────────────
RIPGREP_CONFIG_PATH=%h/.config/ripgrep/config

# ── Development ───────────────────────────────────────────────────────────────
CARGO_HOME=%h/.cargo
GOPATH=%h/go
GOBIN=%h/go/bin