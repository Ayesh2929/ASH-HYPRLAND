# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║           ASH DOTFILES v3.0 — STARSHIP PROMPT CONFIGURATION                ║
# ║           Beautiful, informative cross-shell prompt                        ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# ═══════════════════════════════════════════════════════════════════════════════
# 🎨 GLOBAL SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

# Prompt format (left prompt)
format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$fill\
$nodejs\
$python\
$rust\
$golang\
$java\
$lua\
$php\
$ruby\
$cmd_duration\
$jobs\
$time\
$line_break\
$character"""

# Right prompt
right_format = ""

# Continuation prompt
continuation_prompt = "  ∙ "

# Add blank line before prompt
add_newline = true

# ═══════════════════════════════════════════════════════════════════════════════
# 🔷 CHARACTER (prompt symbol)
# ═══════════════════════════════════════════════════════════════════════════════

[character]
success_symbol = "[❯](bold purple)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol     = "[❮](bold purple)"
vimcmd_visual_symbol      = "[❮](bold yellow)"

# ═══════════════════════════════════════════════════════════════════════════════
# 👤 USER
# ═══════════════════════════════════════════════════════════════════════════════

[username]
style_user   = "bold purple"
style_root   = "bold red"
format       = "[$user]($style) "
show_always  = false
disabled     = false

# ═══════════════════════════════════════════════════════════════════════════════
# 🖥️ HOSTNAME
# ═══════════════════════════════════════════════════════════════════════════════

[hostname]
ssh_only = true
format   = "[@$hostname](bold blue) "
disabled = false

# ═══════════════════════════════════════════════════════════════════════════════
# 📁 DIRECTORY
# ═══════════════════════════════════════════════════════════════════════════════

[directory]
style            = "bold blue"
format           = "[ $path]($style)[$read_only]($read_only_style) "
truncation_length = 4
truncate_to_repo = true
read_only        = " 󰌾"
read_only_style  = "red"
home_symbol      = "~"

[directory.substitutions]
"Documents"  = "󰈙 "
"Downloads"  = " "
"Music"      = "󰝚 "
"Pictures"   = " "
"Videos"     = "󰕧 "
"Projects"   = "󰲋 "
".config"    = " "
".dotfiles"  = "  dots"

# ═══════════════════════════════════════════════════════════════════════════════
# 🐙 GIT
# ═══════════════════════════════════════════════════════════════════════════════

[git_branch]
symbol    = " "
style     = "bold purple"
format    = "[$symbol$branch(:$remote_branch)]($style) "
truncation_length = 20
truncation_symbol = "…"

[git_status]
format    = "([$all_status$ahead_behind]($style) )"
style     = "bold yellow"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date   = ""
untracked    = "?${count}"
stashed      = " "
modified     = "!${count}"
staged       = "+${count}"
renamed      = "»${count}"
deleted      = "✘${count}"
conflicted   = "🚩${count}"

[git_state]
format = "[\\($state( $progress_current of $progress_total)\\)]($style) "
style  = "bold yellow"
cherry_pick = "[🍒 PICKING](bold red)"
rebase      = "[REBASE](bold yellow)"
merge       = "[MERGE](bold yellow)"
revert      = "[REVERT](bold red)"
bisect      = "[BISECT](bold yellow)"
am          = "[AM](bold yellow)"
am_or_rebase = "[AM/REBASE](bold yellow)"

[git_metrics]
added_style   = "bold green"
deleted_style = "bold red"
format        = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
disabled      = false

# ═══════════════════════════════════════════════════════════════════════════════
# 💻 LANGUAGES
# ═══════════════════════════════════════════════════════════════════════════════

[nodejs]
symbol  = " "
style   = "bold green"
format  = "[$symbol($version )]($style)"

[python]
symbol       = " "
style        = "bold yellow"
format       = "[$symbol${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"
pyenv_version_name = false
pyenv_prefix = ""

[rust]
symbol  = " "
style   = "bold red"
format  = "[$symbol($version )]($style)"

[golang]
symbol  = " "
style   = "bold cyan"
format  = "[$symbol($version )]($style)"

[java]
symbol  = " "
style   = "bold red"
format  = "[$symbol($version )]($style)"

[lua]
symbol  = " "
style   = "bold blue"
format  = "[$symbol($version )]($style)"

[php]
symbol  = " "
style   = "bold purple"
format  = "[$symbol($version )]($style)"

[ruby]
symbol  = " "
style   = "bold red"
format  = "[$symbol($version )]($style)"

[docker_context]
symbol  = " "
style   = "bold blue"
format  = "[$symbol$context]($style) "
only_with_files = true

[terraform]
symbol = "󱁢 "
style  = "bold purple"
format = "[$symbol$workspace]($style) "

# ═══════════════════════════════════════════════════════════════════════════════
# ⏱️ TIMING & STATUS
# ═══════════════════════════════════════════════════════════════════════════════

[cmd_duration]
min_time         = 2000
format           = "[ $duration]($style) "
style            = "bold yellow"
show_milliseconds = false

[jobs]
symbol  = "  "
style   = "bold blue"
format  = "[$symbol$number]($style) "
number_threshold = 1

[time]
disabled   = false
format     = "[ $time]($style) "
style      = "bold dimmed white"
time_format = "%H:%M"
utc_time_offset = "local"
time_range  = "-"

# ═══════════════════════════════════════════════════════════════════════════════
# 🔷 FILL (between left and right content)
# ═══════════════════════════════════════════════════════════════════════════════

[fill]
symbol  = " "
style   = "bold black"

# ═══════════════════════════════════════════════════════════════════════════════
# 🐧 OS ICONS
# ═══════════════════════════════════════════════════════════════════════════════

[os]
format   = "[$symbol]($style) "
style    = "bold white"
disabled = false

[os.symbols]
Arch     = " "
Ubuntu   = " "
Debian   = " "
Fedora   = " "
Manjaro  = " "
NixOS    = " "
Macos    = " "
Windows  = " "
EndeavourOS = " "
CachyOS  = " "

# ═══════════════════════════════════════════════════════════════════════════════
# 🔧 MISC
# ═══════════════════════════════════════════════════════════════════════════════

[package]
symbol   = "󰏗 "
style    = "bold 208"
format   = "[$symbol$version]($style) "
disabled = false

[memory_usage]
disabled  = true
threshold = 75
symbol    = "󰍛 "
style     = "bold dimmed white"
format    = "[$symbol${ram}( | ${swap})]($style) "

[battery]
disabled  = true

[aws]
disabled  = true

[gcloud]
disabled  = true

[kubernetes]
disabled  = true
symbol    = "☸ "
format    = "[$symbol$context( \\($namespace\\))]($style) "
style     = "bold blue"

[sudo]
disabled  = false
symbol    = "⚡"
style     = "bold red"
format    = "[$symbol]($style) "