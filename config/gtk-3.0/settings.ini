[Settings]

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎨  THEME ENGINE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# GTK theme — ASH uses adw-gtk3 as base with custom overrides
# Alternatives: adw-gtk3 | adw-gtk3-dark | Catppuccin-Mocha-Standard-Mauve-Dark
# ASH engine writes the active theme name here on theme change
gtk-theme-name = adw-gtk3-dark

# Icon theme — matched to current ASH theme
# Alternatives: Papirus-Dark | Tela-dark | candy-icons | Reversal-dark
gtk-icon-theme-name = Papirus-Dark

# Cursor theme — ASH custom cursors or system default
# Alternatives: Bibata-Modern-Ice | Catppuccin-Mocha-Dark | Vimix-cursors
gtk-cursor-theme-name = Bibata-Modern-Ice

# Cursor size in pixels (24 = default, 32 = HiDPI, 48 = 4K)
gtk-cursor-theme-size = 24

# Font for GTK3 applications
# Format: "Family Style Size"
gtk-font-name = Inter 11

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🖥️  DISPLAY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Enable dark mode preference (communicated to applications via portal)
# 0 = no preference | 1 = prefer dark | 2 = prefer light
gtk-application-prefer-dark-theme = 1

# Display scaling — set to 2 for HiDPI displays
# Uses GDK_SCALE env var for Wayland (set in environment.d/)
gtk-xft-dpi = 96

# Anti-aliasing: 0=none | 1=grayscale | 2=rgba
gtk-xft-antialias = 1

# Subpixel hinting: hintnone | hintslight | hintmedium | hintfull
gtk-xft-hinting = 1
gtk-xft-hintstyle = hintslight

# Subpixel rendering order: none | rgb | bgr | vrgb | vbgr
# rgb = standard LCD (horizontal), bgr = reversed LCD
gtk-xft-rgba = rgb

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ⚡  PERFORMANCE & BEHAVIOR
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Disable overlay scrollbars (use traditional always-visible scrollbars)
# 0 = overlay (modern, hidden until hover) | 1 = classic (always visible)
gtk-overlay-scrolling = 1

# Enable smooth scrolling
gtk-enable-animations = 1

# Button images — show images in buttons (deprecated in GTK3 but still works)
gtk-button-images = 0

# Menu images — show icons in menus
gtk-menu-images = 1

# Toolbar style: icons | text | both | both-horiz
gtk-toolbar-style = GTK_TOOLBAR_ICONS

# Toolbar icon size: small-toolbar | large-toolbar | button | dnd | dialog
gtk-toolbar-icon-size = GTK_ICON_SIZE_LARGE_TOOLBAR

# Enable input method (required for CJK input, emoji, etc.)
gtk-im-module = ibus

# Double-click timeout in milliseconds
gtk-double-click-time = 400

# Double-click distance in pixels (how far mouse can move between clicks)
gtk-double-click-distance = 5

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🖱️  INPUT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Key repeat delay in milliseconds before repeat starts
gtk-key-theme-name = Default

# Entry password character (bullet or asterisk)
gtk-entry-password-hint-timeout = 0

# Show invisible characters in password fields for this many ms (0 = never)
gtk-entry-select-on-focus = 1

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ♿  ACCESSIBILITY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Show focus ring around focused widgets
gtk-visible-focus = always

# Enable accessibility features (screen reader support via AT-SPI)
gtk-modules = canberra-gtk-module

# Sound theme name (for UI sounds)
gtk-sound-theme-name = freedesktop

# Enable event sounds (click sounds etc.)
gtk-enable-event-sounds = 0

# Enable input feedback sounds (keyboard clicks)
gtk-enable-input-feedback-sounds = 0

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📁  FILE CHOOSER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Show hidden files in file chooser by default
gtk-file-chooser-backend = portal

# Recent files limit (0 = disabled)
gtk-recent-files-limit = 50

# Recent files max age in days (-1 = unlimited)
gtk-recent-files-max-age = 30

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔔  NOTIFICATIONS & DECORATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Shell shows decorations (Hyprland handles window chrome)
gtk-decoration-layout = :

# Tooltip timeout in milliseconds
gtk-tooltip-timeout = 500
gtk-tooltip-browse-timeout = 60
gtk-tooltip-browse-mode-timeout = 500

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🌐  WAYLAND SPECIFIC
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Primary clipboard behavior
# Handled by cliphist + wl-clipboard, not GTK setting

# Print dialog backend
gtk-print-backends = file,cups

# Shell portal integration
# GTK_USE_PORTAL=1 set in environment.d/wayland.conf