[[language]]
name       = "graphql"
scope      = "source.graphql"
file-types = ["gql", "graphql"]
indent     = { tab-width = 2, unit = "  " }

language-servers = ["graphql-language-service"]

[language-server.graphql-language-service]
command = "graphql-lsp"
args    = ["server", "-m", "stream"]