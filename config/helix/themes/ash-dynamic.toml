# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — HELIX THEME: ASH DYNAMIC                      ║
# ║                                                                            ║
# ║  Base Palette: Catppuccin Mocha                                            ║
# ║  Primary Accent: Mauve #cba6f7                                             ║
# ║  Style: Deep dark with perceptually-balanced syntax colors                ║
# ║                                                                            ║
# ║  Semantic Color Philosophy:                                                ║
# ║  • Keywords    → Mauve/Lavender  (special, control flow)                  ║
# ║  • Types       → Blue/Sapphire   (structural, architecture)               ║
# ║  • Functions   → Blue/Teal       (callable, behavior)                     ║
# ║  • Strings     → Green           (content, data)                          ║
# ║  • Numbers     → Peach           (literals, warm)                         ║
# ║  • Comments    → Overlay1        (deemphasized, context)                  ║
# ║  • Variables   → Text/Subtext    (ambient, neutral)                       ║
# ║  • Operators   → Sky/Teal        (connecting, functional)                 ║
# ║  • Constants   → Peach/Flamingo  (fixed, memorable)                       ║
# ║  • Errors      → Red             (critical, urgent)                       ║
# ║  • Warnings    → Yellow          (attention, caution)                     ║
# ║  • Hints       → Blue (dim)      (suggestion, subtle)                     ║
# ║                                                                            ║
# ║  Auto-updated by: ash theme apply <name>                                   ║
# ║  ASH_GENERATED=true                                                        ║
# ║  ASH_VERSION=5.0.0                                                         ║
# ║  ASH_THEME={{THEME_NAME}}                                                  ║
# ║  ASH_TIMESTAMP={{TIMESTAMP}}                                               ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎨  CATPPUCCIN MOCHA PALETTE — Named color variables
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[palette]

# ── Base surfaces ─────────────────────────────────────────────────────────────
crust           = "#11111b"
mantle          = "#181825"
base            = "#1e1e2e"
surface0        = "#313244"
surface1        = "#45475a"
surface2        = "#585b70"

# ── Overlays ──────────────────────────────────────────────────────────────────
overlay0        = "#6c7086"
overlay1        = "#7f849c"
overlay2        = "#9399b2"

# ── Text ──────────────────────────────────────────────────────────────────────
subtext0        = "#a6adc8"
subtext1        = "#bac2de"
text            = "#cdd6f4"

# ── Accent spectrum ───────────────────────────────────────────────────────────
rosewater       = "#f5e0dc"
flamingo        = "#f2cdcd"
pink            = "#f5c2e7"
mauve           = "#cba6f7"
red             = "#f38ba8"
maroon          = "#eba0ac"
peach           = "#fab387"
yellow          = "#f9e2af"
green           = "#a6e3a1"
teal            = "#94e2d5"
sky             = "#89dceb"
sapphire        = "#74c7ec"
blue            = "#89b4fa"
lavender        = "#b4befe"

# ── Computed: semi-transparent for backgrounds ────────────────────────────────
# (Helix doesn't support alpha, these are approximated solid colors)
selection_bg    = "#313244"    # Surface0 — selection background
match_bg        = "#45475a"    # Surface1 — search match background
active_line_bg  = "#1e1e2e"    # Same as base but used semantically
diff_add_bg     = "#1e3a2a"    # Deep green tint for added lines
diff_del_bg     = "#3a1e2a"    # Deep red tint for removed lines
diff_chg_bg     = "#2a2a1e"    # Deep yellow tint for changed lines

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🖥️  INTERFACE — Editor chrome and UI
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Editor Background ─────────────────────────────────────────────────────────
"ui.background"             = { bg = "base" }
"ui.background.separator"   = { fg = "surface0" }

# ── Text ──────────────────────────────────────────────────────────────────────
"ui.text"                   = { fg = "text" }
"ui.text.focus"             = { fg = "mauve", modifiers = ["bold"] }
"ui.text.inactive"          = { fg = "overlay0" }
"ui.text.info"              = { fg = "blue" }

# ── Cursor ────────────────────────────────────────────────────────────────────
"ui.cursor"                 = { fg = "base",  bg = "text"  }
"ui.cursor.normal"          = { fg = "base",  bg = "mauve" }
"ui.cursor.insert"          = { fg = "base",  bg = "blue"  }
"ui.cursor.select"          = { fg = "base",  bg = "green" }
"ui.cursor.match"           = { fg = "base",  bg = "peach",    modifiers = ["bold"] }
"ui.cursor.primary"         = { fg = "crust", bg = "mauve",    modifiers = ["bold"] }
"ui.cursor.primary.normal"  = { fg = "crust", bg = "mauve",    modifiers = ["bold"] }
"ui.cursor.primary.insert"  = { fg = "crust", bg = "blue",     modifiers = ["bold"] }
"ui.cursor.primary.select"  = { fg = "crust", bg = "green",    modifiers = ["bold"] }

# ── Selection ─────────────────────────────────────────────────────────────────
"ui.selection"              = { bg = "selection_bg" }
"ui.selection.primary"      = { bg = "surface1" }

# ── Line Numbers ──────────────────────────────────────────────────────────────
"ui.linenr"                 = { fg = "overlay0" }
"ui.linenr.selected"        = { fg = "mauve", modifiers = ["bold"] }

# ── Gutter / Cursorline ───────────────────────────────────────────────────────
"ui.cursorline.primary"     = { bg = "surface0" }
"ui.cursorline.secondary"   = { bg = "mantle"   }
"ui.cursorcolumn.primary"   = { bg = "surface0" }
"ui.cursorcolumn.secondary" = { bg = "mantle"   }

# ── Statusline ────────────────────────────────────────────────────────────────
"ui.statusline"             = { fg = "subtext1",  bg = "mantle"   }
"ui.statusline.normal"      = { fg = "base",      bg = "mauve",   modifiers = ["bold"] }
"ui.statusline.insert"      = { fg = "base",      bg = "blue",    modifiers = ["bold"] }
"ui.statusline.select"      = { fg = "base",      bg = "green",   modifiers = ["bold"] }
"ui.statusline.inactive"    = { fg = "overlay0",  bg = "crust"    }
"ui.statusline.separator"   = { fg = "surface2"   }

# ── Tab Bar ───────────────────────────────────────────────────────────────────
"ui.bufferline"             = { fg = "overlay1",  bg = "crust"  }
"ui.bufferline.active"      = { fg = "mauve",     bg = "base",  modifiers = ["bold", "underlined"] }
"ui.bufferline.background"  = { bg = "crust" }

# ── Popup / Completion ────────────────────────────────────────────────────────
"ui.popup"                  = { fg = "text",    bg = "surface0" }
"ui.popup.info"             = { fg = "blue",    bg = "surface0" }
"ui.window"                 = { fg = "surface0" }
"ui.help"                   = { fg = "subtext1", bg = "mantle" }
"ui.menu"                   = { fg = "text",    bg = "surface0" }
"ui.menu.selected"          = { fg = "crust",   bg = "mauve",   modifiers = ["bold"] }
"ui.menu.scroll"            = { fg = "overlay0", bg = "mantle" }

# ── File Picker ───────────────────────────────────────────────────────────────
"ui.picker.header.field"    = { fg = "mauve", modifiers = ["bold", "underlined"] }
"ui.picker.header.column"   = { fg = "overlay1", modifiers = ["bold"] }

# ── Prompt (command bar) ──────────────────────────────────────────────────────
"ui.prompt"                 = { bg = "mantle" }
"ui.prompt.input"           = { fg = "text",  bg = "mantle" }
"ui.prompt.separator"       = { fg = "surface0" }

# ── Virtual (non-file text) ───────────────────────────────────────────────────
"ui.virtual"                = { fg = "surface2" }
"ui.virtual.ruler"          = { bg = "surface0" }
"ui.virtual.whitespace"     = { fg = "surface1" }
"ui.virtual.indent-guide"   = { fg = "surface0" }
"ui.virtual.jump-label"     = { fg = "mauve",  modifiers = ["bold"] }
"ui.virtual.inlay-hint"     = { fg = "overlay0", modifiers = ["italic"] }
"ui.virtual.inlay-hint.parameter" = { fg = "overlay0", modifiers = ["italic"] }
"ui.virtual.inlay-hint.type"      = { fg = "overlay0", modifiers = ["italic"] }

# ── Border / Highlight ────────────────────────────────────────────────────────
"ui.highlight"              = { bg = "match_bg" }
"ui.highlight.frameline"    = { bg = "surface0" }

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔔  DIAGNOSTICS — Error/warning/hint/info
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Diagnostic underlines ─────────────────────────────────────────────────────
"diagnostic.error"          = { underline = { color = "red",    style = "curl" } }
"diagnostic.warning"        = { underline = { color = "yellow", style = "curl" } }
"diagnostic.info"           = { underline = { color = "blue",   style = "curl" } }
"diagnostic.hint"           = { underline = { color = "teal",   style = "dotted" } }
"diagnostic.unnecessary"    = { underline = { color = "overlay0", style = "dotted" }, modifiers = ["dim"] }
"diagnostic.deprecated"     = { modifiers = ["crossed_out"] }

# ── Gutter indicators ─────────────────────────────────────────────────────────
"diagnostic.error.gutter"   = { fg = "red"    }
"diagnostic.warning.gutter" = { fg = "yellow" }
"diagnostic.info.gutter"    = { fg = "blue"   }
"diagnostic.hint.gutter"    = { fg = "teal"   }

# ── Diagnostic messages ───────────────────────────────────────────────────────
"error"                     = { fg = "red"    }
"warning"                   = { fg = "yellow" }
"info"                      = { fg = "blue"   }
"hint"                       = { fg = "teal"  }

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔀  DIFF — Git change indicators
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

"diff.plus"                 = { fg = "green"  }
"diff.minus"                = { fg = "red"    }
"diff.delta"                = { fg = "yellow" }
"diff.plus.gutter"          = { fg = "green"  }
"diff.minus.gutter"         = { fg = "red"    }
"diff.delta.gutter"         = { fg = "yellow" }

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📝  MARKUP — Markdown, RST, Org
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

"markup.heading"            = { fg = "mauve",   modifiers = ["bold"] }
"markup.heading.1"          = { fg = "mauve",   modifiers = ["bold"] }
"markup.heading.2"          = { fg = "lavender",modifiers = ["bold"] }
"markup.heading.3"          = { fg = "blue",    modifiers = ["bold"] }
"markup.heading.4"          = { fg = "sapphire",modifiers = ["bold"] }
"markup.heading.5"          = { fg = "teal",    modifiers = ["bold"] }
"markup.heading.6"          = { fg = "green"                         }
"markup.heading.marker"     = { fg = "overlay0"                      }
"markup.bold"               = { fg = "yellow",  modifiers = ["bold"] }
"markup.italic"             = { fg = "pink",    modifiers = ["italic"] }
"markup.strikethrough"      = { modifiers = ["crossed_out"] }
"markup.raw"                = { fg = "green"                         }
"markup.raw.inline"         = { fg = "green"                         }
"markup.raw.block"          = { fg = "subtext1"                      }
"markup.link"               = { fg = "blue",    modifiers = ["underlined"] }
"markup.link.url"           = { fg = "sapphire",modifiers = ["underlined", "italic"] }
"markup.link.label"         = { fg = "blue"                          }
"markup.link.text"          = { fg = "blue"                          }
"markup.quote"              = { fg = "overlay1",modifiers = ["italic"] }
"markup.list"               = { fg = "blue"                          }
"markup.list.checked"       = { fg = "green"                         }
"markup.list.unchecked"     = { fg = "overlay1"                      }

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔬  SYNTAX — Tree-sitter token scopes
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Comments ──────────────────────────────────────────────────────────────────
"comment"                   = { fg = "overlay1", modifiers = ["italic"] }
"comment.line"              = { fg = "overlay1", modifiers = ["italic"] }
"comment.block"             = { fg = "overlay1", modifiers = ["italic"] }
"comment.block.documentation" = { fg = "overlay2", modifiers = ["italic"] }

# ── Constants ─────────────────────────────────────────────────────────────────
"constant"                  = { fg = "peach"   }
"constant.builtin"          = { fg = "peach",  modifiers = ["italic"] }
"constant.builtin.boolean"  = { fg = "peach",  modifiers = ["italic"] }
"constant.character"        = { fg = "peach"   }
"constant.character.escape" = { fg = "teal",   modifiers = ["bold"] }
"constant.numeric"          = { fg = "peach"   }
"constant.numeric.integer"  = { fg = "peach"   }
"constant.numeric.float"    = { fg = "peach"   }

# ── Strings ───────────────────────────────────────────────────────────────────
"string"                    = { fg = "green"   }
"string.special"            = { fg = "sky"     }
"string.special.path"       = { fg = "sky",    modifiers = ["underlined"] }
"string.special.url"        = { fg = "blue",   modifiers = ["underlined"] }
"string.special.symbol"     = { fg = "flamingo"}
"string.regexp"             = { fg = "sky"     }

# ── Keywords ──────────────────────────────────────────────────────────────────
"keyword"                   = { fg = "mauve",  modifiers = ["bold"] }
"keyword.control"           = { fg = "mauve",  modifiers = ["bold"] }
"keyword.control.conditional" = { fg = "mauve",modifiers = ["bold", "italic"] }
"keyword.control.repeat"    = { fg = "mauve",  modifiers = ["bold", "italic"] }
"keyword.control.import"    = { fg = "mauve",  modifiers = ["italic"] }
"keyword.control.return"    = { fg = "mauve",  modifiers = ["bold"] }
"keyword.control.exception" = { fg = "mauve",  modifiers = ["bold"] }
"keyword.operator"          = { fg = "sky"     }
"keyword.directive"         = { fg = "pink",   modifiers = ["italic"] }
"keyword.function"          = { fg = "mauve",  modifiers = ["bold"] }
"keyword.special"           = { fg = "mauve",  modifiers = ["bold", "italic"] }

# ── Storage / Declarations ────────────────────────────────────────────────────
"keyword.storage"           = { fg = "mauve",  modifiers = ["bold"] }
"keyword.storage.type"      = { fg = "mauve",  modifiers = ["bold"] }
"keyword.storage.modifier"  = { fg = "mauve"   }

# ── Types ─────────────────────────────────────────────────────────────────────
"type"                      = { fg = "blue"    }
"type.builtin"              = { fg = "sapphire" }
"type.enum"                 = { fg = "blue"    }
"type.enum.variant"         = { fg = "flamingo" }
"type.parameter"            = { fg = "blue",   modifiers = ["italic"] }

# ── Functions ─────────────────────────────────────────────────────────────────
"function"                  = { fg = "blue"    }
"function.builtin"          = { fg = "sapphire",modifiers = ["italic"] }
"function.call"             = { fg = "blue"    }
"function.macro"            = { fg = "pink",   modifiers = ["italic"] }
"function.special"          = { fg = "pink",   modifiers = ["italic"] }
"function.method"           = { fg = "blue"    }
"function.method.call"      = { fg = "blue"    }

# ── Constructors ──────────────────────────────────────────────────────────────
"constructor"               = { fg = "blue",   modifiers = ["bold"] }

# ── Variables ─────────────────────────────────────────────────────────────────
"variable"                  = { fg = "text"    }
"variable.builtin"          = { fg = "red",    modifiers = ["italic"] }
"variable.parameter"        = { fg = "flamingo",modifiers = ["italic"] }
"variable.parameter.builtin" = { fg = "red",   modifiers = ["italic"] }
"variable.other"            = { fg = "text"    }
"variable.other.member"     = { fg = "subtext1" }

# ── Attributes ────────────────────────────────────────────────────────────────
"attribute"                 = { fg = "pink",   modifiers = ["italic"] }
"attribute.builtin"         = { fg = "pink",   modifiers = ["italic"] }

# ── Namespaces / Modules ──────────────────────────────────────────────────────
"namespace"                 = { fg = "lavender" }
"namespace.builtin"         = { fg = "lavender",modifiers = ["italic"] }

# ── Labels ────────────────────────────────────────────────────────────────────
"label"                     = { fg = "sapphire" }

# ── Operators ─────────────────────────────────────────────────────────────────
"operator"                  = { fg = "sky"     }

# ── Punctuation ───────────────────────────────────────────────────────────────
"punctuation"               = { fg = "overlay2" }
"punctuation.delimiter"     = { fg = "overlay2" }
"punctuation.bracket"       = { fg = "overlay2" }
"punctuation.special"       = { fg = "sky"      }

# ── Special / Tags ────────────────────────────────────────────────────────────
"tag"                       = { fg = "red"      }
"tag.builtin"               = { fg = "red",    modifiers = ["italic"] }
"tag.attribute"             = { fg = "peach",  modifiers = ["italic"] }
"tag.delimiter"             = { fg = "overlay2" }

# ── Modules ───────────────────────────────────────────────────────────────────
"module"                    = { fg = "lavender" }
"module.builtin"            = { fg = "lavender",modifiers = ["italic"] }

# ── Special ───────────────────────────────────────────────────────────────────
"special"                   = { fg = "mauve"   }

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🧩  LANGUAGE-SPECIFIC OVERRIDES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Rust specific ─────────────────────────────────────────────────────────────
"attribute"                 = { fg = "pink",   modifiers = ["italic"] }

# Lifetimes — distinctive peach italic
"variable.other.member"     = { fg = "subtext1" }
"operator"                  = { fg = "sky"       }

# ── HTML/XML Tags ─────────────────────────────────────────────────────────────
"tag"                       = { fg = "red"      }
"tag.attribute"             = { fg = "peach",  modifiers = ["italic"] }

# ── CSS Properties ────────────────────────────────────────────────────────────
"property"                  = { fg = "blue"     }

# ── TOML sections ─────────────────────────────────────────────────────────────
"punctuation.special"       = { fg = "sky"      }

# ── Regex character classes ───────────────────────────────────────────────────
"string.regexp"             = { fg = "sky"      }
"string.special.regex.anchor"  = { fg = "mauve" }
"string.special.regex.group"   = { fg = "overlay2" }
"string.special.regex.quantifier" = { fg = "mauve" }

# ── Unused / Error ────────────────────────────────────────────────────────────
"error"                     = { fg = "red",    modifiers = ["bold"] }