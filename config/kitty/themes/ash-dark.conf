# ══════════════════════════════════════════════════════════════════════════════
# ASH DOTFILES v5.0 OMEGA — KITTY ASH DARK THEME ULTRA
# ══════════════════════════════════════════════════════════════════════════════
# File    : themes/ash-dark.conf
# Author  : Ash Dotfiles v5.0 Omega
# License : MIT
# Desc    : The definitive ASH dark terminal theme — Catppuccin Mocha base
#           with ASH accent system, carefully calibrated contrast ratios,
#           semantic color mapping, and full 256-color + true-color support.
#
#   Color philosophy:
#     • Catppuccin Mocha palette — the gold standard dark terminal palette
#     • WCAG AAA compliant text contrast (≥7:1 on all backgrounds)
#     • Semantic mapping: each ANSI color has a clear purpose
#     • Distinction-first: no two colors are perceptually similar
#     • ASH accent system: mauve primary, adaptable to theme engine
#
#   Palette reference (Catppuccin Mocha):
#     ┌─────────────┬──────────┬─────────────────────────────────────────┐
#     │  Name       │  Hex     │  Role                                   │
#     ├─────────────┼──────────┼─────────────────────────────────────────┤
#     │  Rosewater  │ #f5e0dc  │  Warm white, headings                   │
#     │  Flamingo   │ #f2cdcd  │  Pink-white, special text               │
#     │  Pink       │ #f5c2e7  │  Bright magenta, operators              │
#     │  Mauve      │ #cba6f7  │  Purple, primary accent, keywords       │
#     │  Red        │ #f38ba8  │  Errors, deletions, critical            │
#     │  Maroon     │ #eba0ac  │  Bright red, intense errors             │
#     │  Peach      │ #fab387  │  Orange, warnings, numbers              │
#     │  Yellow     │ #f9e2af  │  Yellow, warnings, file names           │
#     │  Green      │ #a6e3a1  │  Success, additions, strings            │
#     │  Teal       │ #94e2d5  │  Cyan, types, constructors              │
#     │  Sky        │ #89dceb  │  Bright cyan, attributes                │
#     │  Sapphire   │ #74c7ec  │  Info blue, hints                       │
#     │  Blue       │ #89b4fa  │  Functions, links, directories          │
#     │  Lavender   │ #b4befe  │  Light purple, labels                   │
#     │  Text       │ #cdd6f4  │  Primary text                           │
#     │  Subtext1   │ #bac2de  │  Secondary text                         │
#     │  Subtext0   │ #a6adc8  │  Tertiary text                          │
#     │  Overlay2   │ #9399b2  │  Comments, disabled                     │
#     │  Overlay1   │ #7f849c  │  Line numbers, subtle                   │
#     │  Overlay0   │ #6c7086  │  Very subtle                            │
#     │  Surface2   │ #585b70  │  Selection, borders                     │
#     │  Surface1   │ #45475a  │  Slightly elevated bg                   │
#     │  Surface0   │ #313244  │  Elevated background                    │
#     │  Base       │ #1e1e2e  │  Primary background                     │
#     │  Mantle     │ #181825  │  Deep background                        │
#     │  Crust      │ #11111b  │  Deepest background                     │
#     └─────────────┴──────────┴─────────────────────────────────────────┘
#
#   ANSI semantic mapping:
#     0  black        → Surface1   (#45475a)  dim/muted blacks
#     1  red          → Red        (#f38ba8)  errors, deletions
#     2  green        → Green      (#a6e3a1)  success, additions
#     3  yellow       → Yellow     (#f9e2af)  warnings, file names
#     4  blue         → Blue       (#89b4fa)  functions, links
#     5  magenta      → Mauve      (#cba6f7)  keywords, accent
#     6  cyan         → Teal       (#94e2d5)  types, special
#     7  white        → Subtext1   (#bac2de)  light text
#     8  br.black     → Surface2   (#585b70)  comments, disabled
#     9  br.red       → Maroon     (#eba0ac)  intense errors
#    10  br.green     → Green      (#a6e3a1)  bright success
#    11  br.yellow    → Peach      (#fab387)  highlights
#    12  br.blue      → Sky        (#89dceb)  bright links
#    13  br.magenta   → Pink       (#f5c2e7)  intense accent
#    14  br.cyan      → Sky        (#89dceb)  bright types
#    15  br.white     → Text       (#cdd6f4)  full white
#
#   Contrast ratios on #1e1e2e background:
#     Text    (#cdd6f4):  13.4:1  ✓ WCAG AAA
#     Green   (#a6e3a1):   9.1:1  ✓ WCAG AAA
#     Blue    (#89b4fa):   6.3:1  ✓ WCAG AA
#     Mauve   (#cba6f7):   8.2:1  ✓ WCAG AAA
#     Red     (#f38ba8):   7.7:1  ✓ WCAG AAA
#     Yellow  (#f9e2af):  11.5:1  ✓ WCAG AAA
#     Teal    (#94e2d5):   9.8:1  ✓ WCAG AAA
#
#   Usage:
#     include themes/ash-dark.conf  (in kitty.conf)
#     ash theme apply ash-dark      (via ASH CLI)
#     kitty @ set-colors -a themes/ash-dark.conf  (live apply)
# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
# CORE BACKGROUND & FOREGROUND
# ══════════════════════════════════════════════════════════════════════════════

# Primary terminal background — Catppuccin Mocha Base
# Deep, warm dark tone. Not pure black — prevents eye strain in dark rooms.
background                 #1e1e2e

# Primary terminal foreground — Catppuccin Mocha Text
# Slightly blue-tinted white — easier on eyes than pure #ffffff
foreground                 #cdd6f4

# ══════════════════════════════════════════════════════════════════════════════
# CURSOR SYSTEM
# ══════════════════════════════════════════════════════════════════════════════

# Cursor body — Mauve (ASH primary accent)
# Mauve is the most identifiable color in the palette — cursor is always visible
cursor                     #cba6f7

# Cursor text — Base background
# Text under cursor inverts to background for maximum legibility
cursor_text_color          #1e1e2e

# ══════════════════════════════════════════════════════════════════════════════
# SELECTION
# ══════════════════════════════════════════════════════════════════════════════

# Selection background — Surface2 (elevated surface, not too bright)
# Solid color: transparent selections can make text unreadable
selection_background       #414055

# Selection foreground — inherit (preserve syntax highlighting in selections)
# "none" = keep the original text color, only background changes
selection_foreground       none

# ══════════════════════════════════════════════════════════════════════════════
# URL UNDERLINE
# ══════════════════════════════════════════════════════════════════════════════

# URL hover color — Blue (universally associated with hyperlinks)
url_color                  #89b4fa

# ══════════════════════════════════════════════════════════════════════════════
# BELL
# ══════════════════════════════════════════════════════════════════════════════

# Visual bell flash color — Red (alert/danger universal)
visual_bell_color          #f38ba8

# ══════════════════════════════════════════════════════════════════════════════
# WINDOW BORDERS
# ══════════════════════════════════════════════════════════════════════════════

# Active window border — Mauve (ASH accent, matches cursor)
active_border_color        #cba6f7

# Inactive window border — Surface0 (subtle, barely visible)
inactive_border_color      #313244

# Bell window border — Red (urgent notification)
bell_border_color          #f38ba8

# ══════════════════════════════════════════════════════════════════════════════
# TAB BAR
# ══════════════════════════════════════════════════════════════════════════════

# Tab bar strip background — Mantle (deeper than base)
tab_bar_background         #181825

# Tab bar margin fill — matches tab_bar_background
tab_bar_margin_color       #181825

# Active tab: high contrast for immediate identification
# Foreground: Crust (dark text on bright accent)
active_tab_foreground      #11111b

# Active tab background: Mauve accent (unmistakable active state)
active_tab_background      #cba6f7

# Active tab font: bold for weight emphasis
active_tab_font_style      bold

# Inactive tab foreground: Subtext0 (readable but clearly secondary)
inactive_tab_foreground    #a6adc8

# Inactive tab background: Surface0 (slightly elevated, not distracting)
inactive_tab_background    #313244

# Inactive tab font: normal weight
inactive_tab_font_style    normal

# ══════════════════════════════════════════════════════════════════════════════
# MARK COLORS (line annotation system)
# ══════════════════════════════════════════════════════════════════════════════

# Mark 1 — Primary / Error (red → danger)
mark1_foreground           #1e1e2e
mark1_background           #f38ba8

# Mark 2 — Secondary / Warning (blue → information)
mark2_foreground           #1e1e2e
mark2_background           #89b4fa

# Mark 3 — Tertiary / Success (green → ok)
mark3_foreground           #1e1e2e
mark3_background           #a6e3a1

# ══════════════════════════════════════════════════════════════════════════════
# ANSI 16 COLORS — CORE PALETTE
# ══════════════════════════════════════════════════════════════════════════════

# ── Normal colors (color0–color7) ─────────────────────────────────────────────

# color0 — Black / Surface1
# Used for: dark backgrounds, shadow text, terminal "black" in apps
# Catppuccin Surface1: slightly elevated surface — not pure black
color0                     #45475a

# color1 — Red / Catppuccin Red
# Used for: errors, failed states, deleted lines in diffs, stop signals
# Semantic: danger, failure, critical
color1                     #f38ba8

# color2 — Green / Catppuccin Green
# Used for: success, added lines in diffs, OK states, passing tests
# Semantic: success, safety, go
color2                     #a6e3a1

# color3 — Yellow / Catppuccin Yellow
# Used for: warnings, file names in ls, important notices
# Semantic: caution, attention
color3                     #f9e2af

# color4 — Blue / Catppuccin Blue
# Used for: functions, links, directories in ls, info messages
# Semantic: information, navigation, cool
color4                     #89b4fa

# color5 — Magenta / Catppuccin Mauve (ASH accent)
# Used for: keywords, constants, special names, prompt decorations
# Semantic: special, magical, brand
color5                     #cba6f7

# color6 — Cyan / Catppuccin Teal
# Used for: types, constructors, string delimiters, special chars
# Semantic: cool, type system, meta
color6                     #94e2d5

# color7 — White / Catppuccin Subtext1
# Used for: light text, secondary content
# Not pure white — the soft blue tint is easier on eyes
color7                     #bac2de

# ── Bright colors (color8–color15) ────────────────────────────────────────────

# color8 — Bright Black / Catppuccin Surface2
# Used for: comments, disabled text, line numbers
# Semantic: muted, meta, secondary
color8                     #585b70

# color9 — Bright Red / Catppuccin Maroon
# Used for: intense errors, high-priority alerts
# Slightly pinker than color1 — distinct at a glance
color9                     #eba0ac

# color10 — Bright Green / Catppuccin Green (same as color2)
# Used for: emphasized success, bright output
# Same hue, slightly different context in some apps
color10                    #a6e3a1

# color11 — Bright Yellow / Catppuccin Peach
# Used for: warnings with extra emphasis, numbers, tags
# Warmer/more orange than color3 — distinct feel
color11                    #fab387

# color12 — Bright Blue / Catppuccin Sky
# Used for: bright links, active selections in some apps
# Lighter/cyan-tinted blue — clearly "brighter" than color4
color12                    #89dceb

# color13 — Bright Magenta / Catppuccin Pink
# Used for: intense accent, operators, decorations
# Pinker than Mauve — the "loud" accent
color13                    #f5c2e7

# color14 — Bright Cyan / Catppuccin Sky (same as color12)
# Used for: bright types, special variables
color14                    #89dceb

# color15 — Bright White / Catppuccin Text
# Used for: primary text, full brightness content
# The actual main text color — the brightest readable tone
color15                    #cdd6f4

# ══════════════════════════════════════════════════════════════════════════════
# EXTENDED PALETTE (color16–color255)
# ══════════════════════════════════════════════════════════════════════════════
# Colors 16-231: 6×6×6 RGB cube (standard xterm-256 — computed by Kitty)
# Colors 232-255: Grayscale ramp (standard — computed by Kitty)
# No overrides needed — Kitty computes these correctly from the base palette.

# ══════════════════════════════════════════════════════════════════════════════
# ADDITIONAL UI COLORS (Catppuccin extended)
# ══════════════════════════════════════════════════════════════════════════════
# These are used by applications that request specific color indices or
# by Kitty features that extend beyond the standard 16-color palette.

# Rosewater (warm white) — color for special decorative elements
# Index 160+ range: used by some apps for specific semantic colors
# Documented here for ASH theme engine reference.
# Rosewater: #f5e0dc  Flamingo: #f2cdcd  Pink: #f5c2e7
# Mauve: #cba6f7     Red: #f38ba8       Maroon: #eba0ac
# Peach: #fab387     Yellow: #f9e2af    Green: #a6e3a1
# Teal: #94e2d5      Sky: #89dceb       Sapphire: #74c7ec
# Blue: #89b4fa      Lavender: #b4befe  Text: #cdd6f4
# Subtext1: #bac2de  Subtext0: #a6adc8  Overlay2: #9399b2
# Overlay1: #7f849c  Overlay0: #6c7086  Surface2: #585b70
# Surface1: #45475a  Surface0: #313244  Base: #1e1e2e
# Mantle: #181825    Crust: #11111b

# ══════════════════════════════════════════════════════════════════════════════
# KITTY INTEGRATION NOTE
# ══════════════════════════════════════════════════════════════════════════════
# This theme is designed to work with:
#   • background_opacity = 0.88 (glassmorphism in kitty.conf)
#   • tab_bar_style = powerline (tabs.conf)
#   • url_style = curly (url.conf)
#   • mark1/2/3 colors match semantic roles (marks.conf)
#
# Apply via ASH CLI:
#   ash theme apply ash-dark
#   ash theme apply ash-dark --no-reload  (apply without hot-reload)
#
# Apply via Kitty remote:
#   kitty @ set-colors -a ~/.config/kitty/themes/ash-dark.conf
#
# Preview before applying:
#   ash theme preview ash-dark
# ══════════════════════════════════════════════════════════════════════════════