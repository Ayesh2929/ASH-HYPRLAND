# name: ash-dynamic
# version: 5.0.0
# generated: 2024-01-01T00:00:00Z
# wallpaper: /path/to/current/wallpaper.jpg
# algorithm: matugen
# mode: dark
# dominant_hue: 240
# palette_size: 16
# wcag_level: AA
# @ASH_THEME_META_END

