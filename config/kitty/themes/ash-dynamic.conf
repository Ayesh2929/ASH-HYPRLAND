# ASH DOTFILES v5.0 OMEGA — KITTY ASH DYNAMIC THEME ULTRA
# ══════════════════════════════════════════════════════════════════════════════
# File    : themes/ash-dynamic.conf
# Author  : Ash Dotfiles v5.0 Omega
# License : MIT
# Desc    : The ASH Dynamic terminal theme — a runtime-generated theme that
#           extracts colors from the current wallpaper using Material You /
#           pywal-style color extraction, then maps them to the Kitty color
#           system with WCAG contrast validation.
#
#   Dynamic theme architecture:
#     Stage 1 — Extraction:   matugen/pywal/imagemagick extracts 16 dominant
#                             colors from the active wallpaper
#     Stage 2 — Mapping:      ASH engine maps extracted colors to semantic
#                             roles using hue/luminance analysis
#     Stage 3 — Validation:   WCAG contrast check on all color pairs
#     Stage 4 — Adjustment:   Auto-darken/lighten until all pairs pass AA
#     Stage 5 — Injection:    kitty @ set-colors applies without restart
#     Stage 6 — Broadcast:    All other apps receive coordinated colors
#
#   The values below are PLACEHOLDERS — they are replaced at runtime.
#   The actual values depend on the current wallpaper.
#
#   Defaults (used when no wallpaper has been processed):
#     Fallback to ash-dark.conf (Catppuccin Mocha)
#     These defaults are safe, beautiful, and accessible
#
#   Dynamic update triggers:
#     • User changes wallpaper via ASH: ash wallpaper set <image>
#     • swww transition completes → hook fires → colors extracted
#     • Direct call: ash theme apply-from-wallpaper <image>
#     • Systemd timer: ash-wallpaper-slideshow.service
#
#   Color extraction algorithms (in priority order):
#     1. matugen (Material You — best for modern aesthetic)
#        matugen image <wallpaper> --type scheme-content
#     2. pywal (classic, wide format support)
#        wal -i <wallpaper> --backend colorz
#     3. imagemagick + k-means (fallback, always available)
#        magick <wallpaper> -resize 25% -colors 16 -format "%c" histogram:
#
#   Color role mapping logic:
#     background:   darkest extracted color (luminance < 0.2)
#     foreground:   lightest extracted color with 7:1 contrast on bg
#     accent/color5:dominant hue extracted color (highest chroma)
#     color1(red):  extracted color closest to H=0°   (red hue family)
#     color2(green):extracted color closest to H=120° (green hue family)
#     color3(yellow):extracted color closest to H=60° (yellow hue family)
#     color4(blue): extracted color closest to H=240° (blue hue family)
#     color6(cyan): extracted color closest to H=180° (cyan hue family)
#     All others:   systematically filled from extracted palette
#
#   Section map:
#     § 01  Theme metadata + ASH engine integration variables
#     § 02  Core colors (background/foreground — dynamic placeholders)
#     § 03  Cursor system (accent-driven)
#     § 04  Selection (surface-driven)
#     § 05  UI colors (borders/tabs/marks)
#     § 06  ANSI 16-color palette (full dynamic set)
#     § 07  Runtime update procedure documentation
#     § 08  Manual override system
#     § 09  Preview and validation tools
#     § 10  Integration with ASH ecosystem
#
#   Usage:
#     include themes/ash-dynamic.conf    (in kitty.conf — then auto-updates)
#     ash theme apply-from-wallpaper     (extract from current wallpaper)
#     ash wallpaper set <img>            (set wallpaper + extract colors)
#     ash theme apply ash-dynamic        (re-apply last extracted colors)
# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
# § 01  THEME METADATA
