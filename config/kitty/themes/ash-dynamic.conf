# ══════════════════════════════════════════════════════════════════════════════
# § 07  RUNTIME UPDATE PROCEDURE
# ══════════════════════════════════════════════════════════════════════════════
# How the ASH engine updates this file at runtime:
#
# 1. TRIGGER: wallpaper change event (inotify/swww hook)
#    swww daemon → post-exec hook → ash theme extract-wallpaper "$WALLPAPER"
#
# 2. EXTRACT: Color extraction from wallpaper image
#    Priority: matugen → pywal → imagemagick → fallback palette
#    Output: raw_palette.json with 16 colors + metadata
#
# 3. MAP: Semantic role assignment
#    background   = min(luminance(colors))          # darkest = bg
#    foreground   = max(contrast(c, background))    # most legible
#    accent       = max(chroma(colors))             # most saturated
#    color1..color6 = closest_hue(0,120,60,240,270,180)
#    color7,15    = lightest readable colors
#    color8       = surface2 equivalent
#    color9..14   = brightened variants of 1..6
#
# 4. VALIDATE: WCAG contrast checking
#    For each (foreground_color, background) pair:
#      if contrast_ratio < 4.5:
#        darken(color) until contrast_ratio >= 4.5
#    Mark colors additionally checked for ≥7:1 (mark overlay on text)
#
# 5. INJECT: Hot-reload without Kitty restart
#    a. Write new values to this file (replacing @ASH_VAR lines)
#    b. kitty @ set-colors -a ~/.config/kitty/themes/ash-dynamic.conf
#    c. Update all open Kitty instances simultaneously
#    d. Broadcast to other ASH-integrated apps (waybar, rofi, nvim, etc.)
#
# 6. LOG: Store applied palette
#    ~/.local/share/ash/themes/dynamic/history/
#    Each extraction saved with wallpaper hash as filename
#
# Full extraction pipeline script:
#   ~/.config/ash-cli/engines/color-engine/generate.sh
#   Called by: ash theme apply-from-wallpaper <image>
#
# Manual trigger:
#   ash wallpaper set /path/to/image.jpg  (set wallpaper + extract)
#   ash theme apply ash-dynamic           (re-apply last extraction)
#   ash theme extract-wallpaper <image>   (extract only, no wallpaper set)

# ══════════════════════════════════════════════════════════════════════════════
# § 08  MANUAL OVERRIDE SYSTEM
# ══════════════════════════════════════════════════════════════════════════════
# Override specific dynamic colors without re-running extraction.
# Add overrides in ~/.config/ash/themes/dynamic-overrides.conf:
#
#   # Force a specific cursor color regardless of wallpaper:
#   cursor #cba6f7
#
#   # Keep background dark even with light wallpapers:
#   background #1e1e2e
#
#   # Override ASH engine algorithm for specific color:
#   # Set env var before running: ASH_DYNAMIC_ACCENT=#89b4fa ash theme apply ash-dynamic
#
# Override file location:
#   ~/.config/ash/themes/dynamic-overrides.conf
#
# The ASH engine reads this file after extraction and applies overrides.
# Overrides persist across wallpaper changes until manually removed.
#
# Per-color override (set via ASH CLI):
#   ash theme dynamic-override cursor '#cba6f7'
#   ash theme dynamic-override background '#1e1e2e'
#   ash theme dynamic-clear-overrides

# ══════════════════════════════════════════════════════════════════════════════
# § 09  PREVIEW AND VALIDATION TOOLS
# ══════════════════════════════════════════════════════════════════════════════
# Tools for previewing and validating the dynamic theme.

# ── Preview extracted colors ─────────────────────────────────────────────────
# Print all 16 extracted colors with color blocks:
#   ash theme show ash-dynamic
#
# Or manually with fish:
#   for i in (seq 0 15)
#       printf "\033[48;5;${i}m  color$i  \033[0m "
#   end; echo

# ── Validate contrast ratios ──────────────────────────────────────────────────
# Check all pairs for WCAG compliance:
#   ash theme validate ash-dynamic
#
# Output format:
#   ✓ foreground on background:  13.4:1 (AAA)
#   ✓ color1 on background:       7.7:1 (AAA)
#   ⚠ color3 on background:       3.2:1 (FAIL) → auto-adjusted to #e8c56a

# ── A/B comparison ────────────────────────────────────────────────────────────
# Compare dynamic theme with ash-dark side by side:
#   kitty @ set-colors -a ~/.config/kitty/themes/ash-dynamic.conf
# Then in another window:
#   cat ~/.config/kitty/themes/ash-dark.conf

# ── Extraction dry-run ────────────────────────────────────────────────────────
# See what colors would be extracted without applying:
#   ash theme extract-wallpaper <image> --dry-run --verbose
#
# Output shows: raw extraction → hue mapping → contrast validation → final

# ══════════════════════════════════════════════════════════════════════════════
# § 10  ASH ECOSYSTEM INTEGRATION
# ══════════════════════════════════════════════════════════════════════════════
# When ash-dynamic updates, the following apps also receive new colors:

# ── Waybar ────────────────────────────────────────────────────────────────────
# Template: ~/.config/waybar/colors.css
# Updated via: ash hot-reload waybar (in hot-reload-engine/reload-waybar.sh)
# Colors injected: accent, background, foreground, surface, error, success

# ── Rofi ─────────────────────────────────────────────────────────────────────
# Template: ~/.config/rofi/colors.rasi
# Updated via: ash hot-reload rofi
# Colors: matches terminal palette exactly (style.rasi uses same vars)

# ── Neovim ───────────────────────────────────────────────────────────────────
# Dynamic theme via: lua/themes/ash-dynamic.lua
# Updated via: nvim server socket → lua command
# The Neovim palette mirrors the terminal for visual consistency

# ── Hyprland ─────────────────────────────────────────────────────────────────
# Border colors updated: config/hypr/themes/colors.conf
# Reloaded via: hyprctl reload
# active_border → cursor color, inactive_border → surface color

# ── GTK 3/4 ──────────────────────────────────────────────────────────────────
# Updated via: gsettings + CSS injection
# Accent color propagated to all GTK apps

# ── Spicetify / Discord / VSCode ─────────────────────────────────────────────
# Coordinated updates via their respective ASH engine templates
# All receive the same 8-color foundation derived from wallpaper

# ── Startup sequence for dynamic theme ────────────────────────────────────────
# On Hyprland session start (config/hypr/autostart.conf):
#   exec-once = ash wallpaper random --extract  # Set wallpaper + extract
#   exec-once = sleep 2 && ash theme apply ash-dynamic  # Apply after WP set
#
# Or for the last used dynamic palette:
#   exec-once = ash theme apply ash-dynamic  # Uses stored last extraction

