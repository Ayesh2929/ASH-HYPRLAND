# File    : themes/ash-neon.conf
# Author  : Ash Dotfiles v5.0 Omega
# License : MIT
# Desc    : The ASH Neon terminal theme — a cyberpunk/synthwave-inspired
#           color system with electric neon accents on deep black backgrounds.
#           Designed for night sessions, streaming, gaming, and aesthetic
#           terminal work where visual impact is the priority.
#
#   Design philosophy:
#     • Deep black base (deeper than any dark theme) — maximum neon contrast
#     • Electric neon primaries: magenta, cyan, green — cyberpunk trinity
#     • Glow effect: neon colors at high saturation create perceived glow
#     • No pastel softening — full-saturation colors only
#     • Purple mid-tones: connects the black base to the neon accents
#
#   Neon Palette System:
#     ┌─────────────────┬──────────┬──────────────────────────────────────┐
#     │  Role           │  Hex     │  Description                         │
#     ├─────────────────┼──────────┼──────────────────────────────────────┤
#     │  Void Black     │ #0d0d14  │  Deepest background — near void      │
#     │  Deep Abyss     │ #080810  │  Deeper than void                    │
#     │  Night Blue     │ #12121f  │  Primary background                  │
#     │  Dark Purple    │ #1a1a2e  │  Surface base                        │
#     │  Mid Purple     │ #16213e  │  Elevated surface                    │
#     │  Blue Dark      │ #0f3460  │  High elevation                      │
#     │  Electric Cyan  │ #00ffff  │  Neon cyan (primary cool accent)     │
#     │  Neon Magenta   │ #ff00ff  │  Electric magenta (hot accent)       │
#     │  Neon Green     │ #00ff41  │  Matrix green (success)              │
#     │  Hot Pink       │ #ff0077  │  Red-toned neon                      │
#     │  Electric Blue  │ #00b4ff  │  Deep cyan-blue                      │
#     │  Laser Yellow   │ #ffff00  │  Pure yellow (high visibility)       │
#     │  Neon Orange    │ #ff6600  │  Warning/important orange            │
#     │  Pulse Purple   │ #cc00ff  │  Deeper purple accent                │
#     │  Arc White      │ #e0e0ff  │  Slightly blue-white text            │
#     │  Ghost White    │ #c0c0e0  │  Secondary text                      │
#     │  Dim Silver     │ #8888aa  │  Muted/comment text                  │
#     │  Dark Steel     │ #44446a  │  Borders, separators                 │
#     │  Night Steel    │ #2a2a4a  │  Elevated bg border                  │
#     └─────────────────┴──────────┴──────────────────────────────────────┘
#
#   ANSI semantic mapping (neon system):
#     0  black     → Dark Purple  (#1a1a2e)  dimensional darkness
#     1  red       → Hot Pink     (#ff0077)  neon error red
#     2  green     → Neon Green   (#00ff41)  matrix success
#     3  yellow    → Laser Yellow (#ffff00)  pure warning
#     4  blue      → Electric Blue(#00b4ff)  electric info
#     5  magenta   → Neon Magenta (#ff00ff)  primary neon accent
#     6  cyan      → Electric Cyan(#00ffff)  cool accent/type
#     7  white     → Ghost White  (#c0c0e0)  secondary text
#     8  br.black  → Dark Steel   (#44446a)  comments/disabled
#     9  br.red    → Hot Pink+    (#ff3388)  intense error
#    10  br.green  → Matrix+      (#33ff66)  bright success
#    11  br.yellow → Electric+    (#ffff55)  highlighted warning
#    12  br.blue   → Ice Blue     (#55ddff)  bright info
#    13  br.mag    → Pink White   (#ff88ff)  intense accent
#    14  br.cyan   → Arctic       (#88ffff)  bright type
#    15  br.white  → Arc White    (#e0e0ff)  full brightness
#
#   Contrast on #12121f:
#     Cyan    (#00ffff): 14.1:1  ✓ WCAG AAA
#     Magenta (#ff00ff): 11.8:1  ✓ WCAG AAA
#     Green   (#00ff41): 13.6:1  ✓ WCAG AAA
#     White   (#e0e0ff): 16.2:1  ✓ WCAG AAA
#     Yellow  (#ffff00): 19.6:1  ✓ WCAG AAA
#
#   Performance note:
#     Neon theme with background_opacity=1.0 and no blur gives
#     the best gaming/streaming performance with Hyprland.
#
#   Usage:
#     include themes/ash-neon.conf  (in kitty.conf)
#     ash theme apply ash-neon      (via ASH CLI)
#     ash mode game                 (auto-applies neon theme)
# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
# CORE BACKGROUND & FOREGROUND
# ══════════════════════════════════════════════════════════════════════════════

# Primary background — Deep Night Blue (near-void darkness)
# Not pure black: the blue-tinted darkness gives depth perception
# Pure black (#000000) flattens the perception — this has dimension
background                 #12121f

# Primary foreground — Arc White (blue-tinted white)
# The slight blue tint harmonizes with the cyberpunk cold palette
# Easier on eyes than pure white against near-black
foreground                 #e0e0ff

# ══════════════════════════════════════════════════════════════════════════════
# CURSOR SYSTEM
# ══════════════════════════════════════════════════════════════════════════════

# Cursor — Neon Magenta (the iconic cyberpunk color)
# Full saturation cyan-magenta creates the "electric glow" feel
cursor                     #ff00ff

# Cursor text — Background (dark text visible on bright neon cursor)
cursor_text_color          #12121f

# ══════════════════════════════════════════════════════════════════════════════
# SELECTION
# ══════════════════════════════════════════════════════════════════════════════

# Selection background — Night Steel (dark purple elevated surface)
# Dark enough to see on near-black bg, cool purple tint
selection_background       #2a2a5a

# Selection foreground — maintain text color in selections
selection_foreground       none

# ══════════════════════════════════════════════════════════════════════════════
# URL UNDERLINE
# ══════════════════════════════════════════════════════════════════════════════

# URL color — Electric Blue (distinct, link-universal)
url_color                  #00b4ff

# ══════════════════════════════════════════════════════════════════════════════
# BELL
# ══════════════════════════════════════════════════════════════════════════════

# Visual bell — Hot Pink (neon alert)
visual_bell_color          #ff0077

# ══════════════════════════════════════════════════════════════════════════════
# WINDOW BORDERS
# ══════════════════════════════════════════════════════════════════════════════

# Active border — Neon Cyan (electric glow on active window)
active_border_color        #00ffff

# Inactive border — Dark Steel (barely visible on dark background)
inactive_border_color      #44446a

# Bell border — Hot Pink Neon
bell_border_color          #ff0077

# ══════════════════════════════════════════════════════════════════════════════
# TAB BAR
# ══════════════════════════════════════════════════════════════════════════════

# Tab bar background — Deep Abyss (deepest point in the theme)
tab_bar_background         #080810

# Tab bar margin — matches tab_bar_background
tab_bar_margin_color       #080810

# Active tab: Void text on Neon Magenta — maximum contrast
active_tab_foreground      #12121f

# Active tab background — Neon Magenta (electric active indicator)
active_tab_background      #ff00ff

# Active tab: Bold for weight in the neon context
active_tab_font_style      bold

# Inactive tab: Silver text — visible but clearly secondary
inactive_tab_foreground    #8888aa

# Inactive tab background: Mid Purple (elevated neon surface)
inactive_tab_background    #1a1a2e

# Inactive tab: Normal weight
inactive_tab_font_style    normal

# ══════════════════════════════════════════════════════════════════════════════
# MARK COLORS
# ══════════════════════════════════════════════════════════════════════════════

# Mark 1 — Error (neon hot pink — the neon danger signal)
mark1_foreground           #12121f
mark1_background           #ff0077

# Mark 2 — Info (neon electric blue)
mark2_foreground           #12121f
mark2_background           #00b4ff

# Mark 3 — Success (matrix neon green)
mark3_foreground           #12121f
mark3_background           #00ff41

# ══════════════════════════════════════════════════════════════════════════════
# ANSI 16 COLORS — NEON CYBERPUNK PALETTE
# ══════════════════════════════════════════════════════════════════════════════

# ── Normal colors ─────────────────────────────────────────────────────────────

# color0 — Black / Dark Purple (dimensional darkness, not flat)
color0                     #1a1a2e

# color1 — Red / Hot Pink Neon (cyberpunk danger — neon "red")
color1                     #ff0077

# color2 — Green / Matrix Neon Green (the iconic #00ff41 matrix green)
color2                     #00ff41

# color3 — Yellow / Laser Yellow (pure digital yellow — maximum visibility)
color3                     #ffff00

# color4 — Blue / Electric Blue (sharp blue, distinct from cyan)
color4                     #00b4ff

# color5 — Magenta / Neon Magenta (THE cyberpunk color — full saturation)
color5                     #ff00ff

# color6 — Cyan / Electric Cyan (the other half of the neon duality)
color6                     #00ffff

# color7 — White / Ghost White (blue-tinted secondary text)
color7                     #c0c0e0

# ── Bright colors ─────────────────────────────────────────────────────────────

# color8 — Bright Black / Dark Steel (for comments, disabled text)
color8                     #44446a

# color9 — Bright Red / Bright Hot Pink (more intense version)
color9                     #ff3388

# color10 — Bright Green / Bright Matrix Green
color10                    #33ff66

# color11 — Bright Yellow / Electric Yellow (slightly softened laser)
color11                    #ffff55

# color12 — Bright Blue / Ice Blue (bright, clean, arctic)
color12                    #55ddff

# color13 — Bright Magenta / Pink White (bright, softened neon)
color13                    #ff88ff

# color14 — Bright Cyan / Arctic Cyan
color14                    #88ffff

# color15 — Bright White / Arc White (the full-bright neon terminal white)
color15                    #e0e0ff

# ══════════════════════════════════════════════════════════════════════════════
# NEON THEME INTEGRATION NOTES
# ══════════════════════════════════════════════════════════════════════════════
# Recommended settings when using the neon theme:
#
#   background_opacity 1.0    (full opacity — neon doesn't need glass)
#   dim_opacity 1.0           (no dimming — all windows at full neon)
#   repaint_delay 6           (faster refresh for gaming contexts)
#   sync_to_monitor no        (lowest latency mode)
#
# These are applied automatically by: ash theme apply ash-neon
# Or manually via: ash mode game (applies neon theme + performance settings)
#
# Hyprland window rule for neon Kitty:
#   windowrulev2 = bordercolor rgb(00ffff) rgb(ff00ff), class:kitty
#   (creates a gradient border via Hyprland's dual-border feature)
#
# Waybar neon integration (colors.css):
#   The ASH engine updates Waybar CSS when neon theme is applied.
#
# VSCode/Zed neon companion theme:
#   ash theme apply ash-neon  (applies neon to VSCode/Zed simultaneously)
# ══════════════════════════════════════════════════════════════════════════════