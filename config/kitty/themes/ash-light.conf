# ══════════════════════════════════════════════════════════════════════════════
# File    : themes/ash-light.conf
# Author  : Ash Dotfiles v5.0 Omega
# License : MIT
# Desc    : The definitive ASH light terminal theme — Catppuccin Latte base
#           with ASH accent system. Designed for daylight use, presentations,
#           screen sharing, and accessibility requirements.
#
#   Design philosophy for light themes:
#     • NOT simply "inverted dark" — light themes need completely different
#       color choices because light perception is non-linear
#     • Backgrounds: warm off-white (not pure #ffffff — too harsh)
#     • Foregrounds: dark desaturated (not pure #000000 — too stark)
#     • Accents: deeply saturated to maintain visibility on light bg
#     • Surface hierarchy: subtle elevation visible on light backgrounds
#
#   Catppuccin Latte palette:
#     ┌─────────────┬──────────┬─────────────────────────────────────────┐
#     │  Name       │  Hex     │  Role                                   │
#     ├─────────────┼──────────┼─────────────────────────────────────────┤
#     │  Rosewater  │ #dc8a78  │  Warm red-orange                        │
#     │  Flamingo   │ #dd7878  │  Soft red                               │
#     │  Pink       │ #ea76cb  │  Hot pink                               │
#     │  Mauve      │ #8839ef  │  Deep purple (primary accent)           │
#     │  Red        │ #d20f39  │  Deep red (errors)                      │
#     │  Maroon     │ #e64553  │  Bright red                             │
#     │  Peach      │ #fe640b  │  Deep orange                            │
#     │  Yellow     │ #df8e1d  │  Amber/gold                             │
#     │  Green      │ #40a02b  │  Deep green (success)                   │
#     │  Teal       │ #179299  │  Deep teal                              │
#     │  Sky        │ #04a5e5  │  Bright blue                            │
#     │  Sapphire   │ #209fb5  │  Sapphire blue                          │
#     │  Blue       │ #1e66f5  │  Royal blue (links)                     │
#     │  Lavender   │ #7287fd  │  Light purple                           │
#     │  Text       │ #4c4f69  │  Primary dark text                      │
#     │  Subtext1   │ #5c5f77  │  Secondary dark text                    │
#     │  Subtext0   │ #6c6f85  │  Tertiary text                          │
#     │  Overlay2   │ #7c7f93  │  Muted text                             │
#     │  Overlay1   │ #8c8fa1  │  Very muted                             │
#     │  Overlay0   │ #9ca0b0  │  Almost invisible                       │
#     │  Surface2   │ #acb0be  │  Border/separator                       │
#     │  Surface1   │ #bcc0cc  │  Slightly elevated bg                   │
#     │  Surface0   │ #ccd0da  │  Elevated background                    │
#     │  Base       │ #eff1f5  │  Primary background                     │
#     │  Mantle     │ #e6e9ef  │  Deep background                        │
#     │  Crust      │ #dce0e8  │  Deepest background                     │
#     └─────────────┴──────────┴─────────────────────────────────────────┘
#
#   Contrast ratios on #eff1f5 background:
#     Text     (#4c4f69): 10.5:1  ✓ WCAG AAA
#     Red      (#d20f39):  6.5:1  ✓ WCAG AA+
#     Green    (#40a02b):  6.1:1  ✓ WCAG AA+
#     Blue     (#1e66f5):  5.7:1  ✓ WCAG AA
#     Mauve    (#8839ef):  7.2:1  ✓ WCAG AAA
#     Yellow   (#df8e1d):  3.4:1  ✓ WCAG AA (large text)
#     Teal     (#179299):  4.8:1  ✓ WCAG AA
#
#   Usage:
#     include themes/ash-light.conf  (in kitty.conf)
#     ash theme apply ash-light      (via ASH CLI)
#     kitty @ set-colors -a themes/ash-light.conf  (live)
# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
# CORE BACKGROUND & FOREGROUND
# ══════════════════════════════════════════════════════════════════════════════

# Primary background — Catppuccin Latte Base
# Warm cream white — significantly less harsh than pure #ffffff
# The slight warmth reduces blue light fatigue during daylight sessions
background                 #eff1f5

# Primary foreground — Catppuccin Latte Text
# Dark desaturated blue-grey — gentler than #000000, high contrast
foreground                 #4c4f69

# ══════════════════════════════════════════════════════════════════════════════
# CURSOR SYSTEM
# ══════════════════════════════════════════════════════════════════════════════

# Cursor — Deep Mauve (highly visible on light background)
# The deep purple provides maximum contrast while remaining aesthetic
cursor                     #8839ef

# Cursor text — Light background
# Text under cursor shows against the purple cursor
cursor_text_color          #eff1f5

# ══════════════════════════════════════════════════════════════════════════════
# SELECTION
# ══════════════════════════════════════════════════════════════════════════════

# Selection background — Surface1 (slightly darker than base)
# Visible selection without being garish on light background
selection_background       #b5b9cc

# Selection foreground — Text (maintain dark text in selections)
selection_foreground       #4c4f69

# ══════════════════════════════════════════════════════════════════════════════
# URL UNDERLINE
# ══════════════════════════════════════════════════════════════════════════════

# URL color — Royal Blue (universally associated with links on light bg)
url_color                  #1e66f5

# ══════════════════════════════════════════════════════════════════════════════
# BELL
# ══════════════════════════════════════════════════════════════════════════════

# Visual bell — Deep Red (visible on light background)
visual_bell_color          #d20f39

# ══════════════════════════════════════════════════════════════════════════════
# WINDOW BORDERS
# ══════════════════════════════════════════════════════════════════════════════

# Active border — Deep Mauve accent
active_border_color        #8839ef

# Inactive border — Surface2 (subtle divider on light background)
inactive_border_color      #acb0be

# Bell border — Deep Red
bell_border_color          #d20f39

# ══════════════════════════════════════════════════════════════════════════════
# TAB BAR
# ══════════════════════════════════════════════════════════════════════════════

# Tab bar background — Crust (deepest light surface)
tab_bar_background         #dce0e8

# Tab bar margin — matches background
tab_bar_margin_color       #dce0e8

# Active tab: Light text on deep accent
active_tab_foreground      #eff1f5

# Active tab background: Deep Mauve (contrast against light theme)
active_tab_background      #8839ef

# Active tab: Bold for emphasis
active_tab_font_style      bold

# Inactive tab foreground: Subtext0 (readable but secondary)
inactive_tab_foreground    #6c6f85

# Inactive tab background: Surface0 (light elevated surface)
inactive_tab_background    #ccd0da

# Inactive tab: Normal weight
inactive_tab_font_style    normal

# ══════════════════════════════════════════════════════════════════════════════
# MARK COLORS
# ══════════════════════════════════════════════════════════════════════════════

# Mark 1 — Error (deep red on light background needs stronger saturation)
mark1_foreground           #eff1f5
mark1_background           #d20f39

# Mark 2 — Info (royal blue — maximum contrast on light)
mark2_foreground           #eff1f5
mark2_background           #1e66f5

# Mark 3 — Success (deep green)
mark3_foreground           #eff1f5
mark3_background           #40a02b

# ══════════════════════════════════════════════════════════════════════════════
# ANSI 16 COLORS — LIGHT THEME PALETTE
# ══════════════════════════════════════════════════════════════════════════════
# Light theme ANSI colors must be MORE saturated than dark theme
# because light backgrounds reduce perceived color saturation.
# All colors chosen for maximum distinctiveness + AA contrast on #eff1f5.

# ── Normal colors ─────────────────────────────────────────────────────────────

# color0 — Black / Surface1
# On light bg: a medium grey (pure black would be too stark)
color0                     #bcc0cc

# color1 — Red / Catppuccin Latte Red
# Deep, vibrant red — fully readable and semantically clear
color1                     #d20f39

# color2 — Green / Catppuccin Latte Green
# Forest green — visible and cheerful on light backgrounds
color2                     #40a02b

# color3 — Yellow / Catppuccin Latte Yellow (amber/gold)
# Rich amber — yellow on white is the hardest combo, gold avoids it
color3                     #df8e1d

# color4 — Blue / Catppuccin Latte Blue
# Royal blue — the classic "link blue" for light interfaces
color4                     #1e66f5

# color5 — Magenta / Catppuccin Latte Mauve (primary accent)
# Deep purple — distinctive, accessible, brand color
color5                     #8839ef

# color6 — Cyan / Catppuccin Latte Teal
# Deep teal — readable, cool, distinct from blue
color6                     #179299

# color7 — White / Catppuccin Latte Subtext1
# Dark grey (not white!) — this is "fg on dark" in light-mode apps
color7                     #5c5f77

# ── Bright colors ─────────────────────────────────────────────────────────────

# color8 — Bright Black / Catppuccin Latte Overlay0
# Lighter grey — for comments, disabled text
color8                     #9ca0b0

# color9 — Bright Red / Catppuccin Latte Maroon
# Slightly brighter/pinker red — distinct from color1
color9                     #e64553

# color10 — Bright Green / Catppuccin Latte Green (emphasized)
# Same green — brighter context in some apps
color10                    #40a02b

# color11 — Bright Yellow / Catppuccin Latte Peach
# Deep orange — the "bright yellow" in light mode reads as orange
color11                    #fe640b

# color12 — Bright Blue / Catppuccin Latte Sky
# Bright sky blue — clearly "brighter" than the royal blue
color12                    #04a5e5

# color13 — Bright Magenta / Catppuccin Latte Pink
# Hot pink — the bright/loud variant of the purple accent
color13                    #ea76cb

# color14 — Bright Cyan / Catppuccin Latte Sky
# Same bright sky blue as color12
color14                    #04a5e5

# color15 — Bright White / Catppuccin Latte Text
# The actual primary text color (darkest usable text)
color15                    #4c4f69

# ══════════════════════════════════════════════════════════════════════════════
# LIGHT THEME INTEGRATION NOTES
# ══════════════════════════════════════════════════════════════════════════════
# Recommended overrides when using this theme:
#
#   background_opacity 1.0        (no glass on light — not aesthetic)
#   dim_opacity 0.90              (less dim needed on light theme)
#   cursor_beam_thickness 2.0     (slightly thicker for visibility)
#
# These are automatically applied by: ash theme apply ash-light
# The ASH engine sets these via: kitty @ set-option
#
# Auto-switching with redshift/hyprsunset:
#   Add to config/hypr/modes/work.conf:
#   exec-once = hyprsunset -t 6500  (disable night light → light mode)
# ══════════════════════════════════════════════════════════════════════════════