# § 04  MARK COLOR SYSTEM
# ══════════════════════════════════════════════════════════════════════════════

# ── Color design rationale ────────────────────────────────────────────────────
# The three mark colors follow universal semantic conventions:
#
#   Red   (#f38ba8) = Danger/Error    — traffic light red, stop sign
#   Blue  (#89b4fa) = Info/Warning    — info icon, "i" symbol convention
#   Green (#a6e3a1) = Success/Go      — traffic light green, checkmark
#
# On the Catppuccin Mocha background (#1e1e2e):
#   Red mark:   foreground #1e1e2e on #f38ba8 — contrast ratio: 8.5:1 ✓
#   Blue mark:  foreground #1e1e2e on #89b4fa — contrast ratio: 7.2:1 ✓
#   Green mark: foreground #1e1e2e on #a6e3a1 — contrast ratio: 7.8:1 ✓
#
# All exceed WCAG AAA threshold (7:1) for accessibility compliance.

# ── Theme engine injection ────────────────────────────────────────────────────
# The ASH theme engine updates mark colors when the theme changes.
# The semantic relationships are preserved:
#   mark1 → always the theme's error/critical color
#   mark2 → always the theme's info/accent color
#   mark3 → always the theme's success/green color
#
# Light theme example (Catppuccin Latte):
#   mark1_foreground #eff1f5  mark1_background #d20f39
#   mark2_foreground #eff1f5  mark2_background #1e66f5
#   mark3_foreground #eff1f5  mark3_background #40a02b
#
# High contrast theme (accessibility):
#   mark1_foreground #000000  mark1_background #ff0000
#   mark2_foreground #000000  mark2_background #0000ff
#   mark3_foreground #000000  mark3_background #00aa00

# ── Custom mark colors (theme variants) ───────────────────────────────────────
# For specific workflows, you can adjust mark colors:
#
# Warm workflow (instead of blue, use yellow for warnings):
#   mark2_foreground #1e1e2e
#   mark2_background #f9e2af  (Catppuccin yellow — warning feel)
#
# Monochrome (accessibility — shape-only differentiation):
#   mark1_background #888888  (gray 1)
#   mark2_background #aaaaaa  (gray 2)
#   mark3_background #cccccc  (gray 3)
#   Note: must also change foreground to ensure contrast

# ══════════════════════════════════════════════════════════════════════════════
# § 05  MARK PATTERN REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
# Pattern types available for toggle_marker and create_marker.

# ── Pattern types ─────────────────────────────────────────────────────────────
# iregex  = Case-insensitive POSIX regular expression
#           Best for: keywords that appear in various cases (Error/error/ERROR)
#           Syntax: toggle_marker iregex <channel> <pattern>
#
# regex   = Case-sensitive POSIX regular expression
#           Best for: exact-case patterns (specific function names, codes)
#           Syntax: toggle_marker regex <channel> <pattern>
#
# itext   = Case-insensitive plain text search
#           Best for: simple keyword matching without regex overhead
#           Syntax: toggle_marker itext <channel> <text>
#
# text    = Case-sensitive plain text search
#           Best for: exact string matching
#           Syntax: toggle_marker text <channel> <text>
#
# url     = Mark all detected URLs on screen
#           Best for: quickly highlighting all clickable links
#           Syntax: toggle_marker url <channel>

# ── Regex syntax reference ────────────────────────────────────────────────────
# Kitty uses POSIX ERE (Extended Regular Expressions):
#   |  = OR (ERROR|FATAL matches either)
#   ?  = Optional (WARN(?:ING)? matches WARN or WARNING)
#   +  = One or more
#   *  = Zero or more
#   .  = Any character
#   ^  = Start of line
#   $  = End of line
#   \b = Word boundary (not in POSIX ERE — use context instead)
#   [abc] = Character class
#   [^abc] = Negated class
#   (?: )  = Non-capturing group
#
# Examples:
#   FAIL(?:ED|URE)?  = FAIL, FAILED, or FAILURE
#   [Ee]rror         = Error or error (use iregex instead)
#   ^ERROR:          = Lines starting with "ERROR:"
#   \d{3}            = Three digit sequence (HTTP status codes)
#   (5[0-9]{2})      = 5xx HTTP status codes (500, 502, etc.)

# ══════════════════════════════════════════════════════════════════════════════
# § 06  MARK NAVIGATION
# ══════════════════════════════════════════════════════════════════════════════

# ── Scroll to mark ────────────────────────────────────────────────────────────
# Navigation between marked lines in scrollback.
# Defined in keybinds.conf:
#
#   map kitty_mod+shift+F1   scroll_to_mark prev  (previous marked line)
#   map kitty_mod+shift+F2   scroll_to_mark next  (next marked line)
#   map kitty_mod+z          scroll_to_mark prev  (vim-style)
#   map kitty_mod+x          scroll_to_mark next  (vim-style)
#
# scroll_to_mark navigates ALL mark types simultaneously.
# It finds the nearest marked line in the requested direction.
#
# Direction:
#   prev = scroll UP to the nearest mark above current position
#   next = scroll DOWN to the nearest mark below current position
#
# Behavior at boundaries:
#   At first mark: prev does nothing (already at earliest mark)
#   At last mark:  next does nothing (already at latest mark)
#   Wrap-around:   NOT supported — use home/end + mark navigation instead

# ── Mark-specific navigation ──────────────────────────────────────────────────
# Kitty does not support navigating between marks of a SPECIFIC type only.
# scroll_to_mark navigates all mark types together.
# Workaround: when you need type-specific navigation:
#   1. Remove marks for types you want to skip
#   2. Navigate to desired marks
#   3. Re-apply the removed mark types

# ── Create marker (interactive) ───────────────────────────────────────────────
# map kitty_mod+m create_marker
#
# Opens an interactive prompt where you can specify:
#   1. Mark type: 1, 2, or 3
#   2. Pattern type: iregex, regex, itext, text, url
#   3. Pattern text: the pattern to match
#
# This is the most flexible mark creation method.
# Use it for: one-time custom patterns, session-specific queries

# ── Remove all marks ─────────────────────────────────────────────────────────
# map kitty_mod+F4 remove_marker
#
# Removes ALL active marks from ALL channels immediately.
# Useful after finishing log analysis — clean slate.

# ══════════════════════════════════════════════════════════════════════════════
# § 07  ADVANCED MARK PATTERNS
# ══════════════════════════════════════════════════════════════════════════════
# Complex patterns for specific analysis scenarios.
# These are meant to be used with create_marker or custom keybinds.

# ── HTTP status code marking ──────────────────────────────────────────────────
# Mark 1 (red): 4xx and 5xx errors
#   Pattern: [45][0-9]{2}
#
# Mark 2 (blue): 3xx redirects
#   Pattern: 3[0-9]{2}
#
# Mark 3 (green): 2xx success
#   Pattern: 2[0-9]{2}
#
# Custom keybind example (for nginx/apache log analysis):
#   map kitty_mod+ctrl+1 toggle_marker iregex 0 " [45][0-9]{2} "
#   map kitty_mod+ctrl+2 toggle_marker iregex 1 " 3[0-9]{2} "
#   map kitty_mod+ctrl+3 toggle_marker iregex 2 " 2[0-9]{2} "

# ── Timestamp highlighting ────────────────────────────────────────────────────
# Mark lines with timestamps for time-based log analysis.
# Pattern: [0-9]{4}-[0-9]{2}-[0-9]{2}
# Or: [0-9]{2}:[0-9]{2}:[0-9]{2}

# ── IP address highlighting ───────────────────────────────────────────────────
# Pattern: [0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}

# ── UUID highlighting ─────────────────────────────────────────────────────────
# Pattern: [0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}

# ── Git commit SHA highlighting ───────────────────────────────────────────────
# Pattern: [0-9a-f]{40} or [0-9a-f]{7,8}  (short SHA)

# ── Path highlighting (for log files with file:line references) ───────────────
# Pattern: /[^ ]+\.[a-z]+:[0-9]+

# ── Python traceback highlighting ────────────────────────────────────────────
# Mark 1 (error): exception lines
#   Pattern: ^(Traceback|  File|[A-Za-z]+Error|[A-Za-z]+Exception)
#
# Mark 2 (info): line references
#   Pattern: line [0-9]+

# ── Rust error highlighting ───────────────────────────────────────────────────
# Mark 1 (error): error lines
#   Pattern: ^error\[
#
# Mark 2 (warning): warning lines
#   Pattern: ^warning\[
#
# Mark 3 (info): note/help lines
#   Pattern: ^(note|help):

# ══════════════════════════════════════════════════════════════════════════════
# § 08  LOG FORMAT PATTERNS
# ══════════════════════════════════════════════════════════════════════════════

# ── syslog / journald format ─────────────────────────────────────────────────
# Format: "Jan 01 00:00:00 hostname process[pid]: level message"
# Mark 1: err|crit|alert|emerg
# Mark 2: warning
# Mark 3: notice|info

# Custom syslog keybinds (add to keybinds.conf if needed):
#   map kitty_mod+ctrl+s toggle_marker iregex 0 \
#     \berr\b|crit|alert|emerg
#   map kitty_mod+ctrl+w toggle_marker iregex 1 \
#     \bwarning\b
#   map kitty_mod+ctrl+i toggle_marker iregex 2 \
#     \b(notice|info)\b

# ── Python logging format ─────────────────────────────────────────────────────
# Format: "2024-01-01 12:00:00,000 - module - LEVEL - message"
# Level keywords: DEBUG, INFO, WARNING, ERROR, CRITICAL
# Default keybinds (F1/F2/F3) work for Python logging out of the box.

# ── Go log format ─────────────────────────────────────────────────────────────
# Format: "2024/01/01 12:00:00 message" or with logrus: "level=error msg=..."
# Pattern: level=(error|fatal|panic)|level=(warn)|level=(info|debug)
# Default keybinds work via ERROR/WARN/INFO pattern.

# ── JSON log format (structured logging) ─────────────────────────────────────
# Format: {"level":"error","msg":"...","time":"..."}
# Mark 1: "level":"error"|"level":"fatal"
# Mark 2: "level":"warn"
# Mark 3: "level":"info"

# Custom JSON keybinds:
#   map kitty_mod+ctrl+j toggle_marker iregex 0 \
#     "level":\s*"(error|fatal|panic)"
#   map kitty_mod+ctrl+W toggle_marker iregex 1 \
#     "level":\s*"warn(?:ing)?"
#   map kitty_mod+ctrl+I toggle_marker iregex 2 \
#     "level":\s*"(info|debug)"

# ── systemd journal format ────────────────────────────────────────────────────
# journalctl output: "Jan 01 00:00:00 hostname unit[pid]: message"
# Priority prefixes shown with -p flag.
# Default patterns (ERROR/WARNING/OK) work for most journald output.

# ══════════════════════════════════════════════════════════════════════════════
# § 09  TEST RUNNER PATTERNS
# ══════════════════════════════════════════════════════════════════════════════

# ── pytest (Python) ───────────────────────────────────────────────────────────
# Mark 1 (red): FAILED, ERROR
#   Pattern: ^(FAILED|ERROR) or ::test_.*FAILED
#
# Mark 2 (blue): WARNING, SKIPPED
#   Pattern: ^(SKIPPED|WARNING|DESELECTED)
#
# Mark 3 (green): PASSED
#   Pattern: ^(PASSED|\.+) or "passed" summary line
#
# Default keybinds work for pytest! FAILED/PASSED are included.

# ── cargo test (Rust) ─────────────────────────────────────────────────────────
# Mark 1 (red): FAILED
#   Pattern: ^test .* \.\.\. FAILED
#
# Mark 2 (blue): test ... ignored
#   Pattern: ignored
#
# Mark 3 (green): ok
#   Pattern: ^test .* \.\.\. ok

# ── Jest (JavaScript/TypeScript) ─────────────────────────────────────────────
# Mark 1 (red): FAIL, ✕, ×
#   Pattern: FAIL|✕|×|\bFAILED\b
#
# Mark 2 (blue): SKIP, TODO
#   Pattern: SKIP|TODO
#
# Mark 3 (green): PASS, ✓, ✔
#   Pattern: PASS|✓|✔|\bPASSED\b

# ── go test ───────────────────────────────────────────────────────────────────
# Mark 1 (red): FAIL
#   Pattern: --- FAIL|^FAIL\s
#
# Mark 2 (blue): SKIP
#   Pattern: --- SKIP
#
# Mark 3 (green): PASS, ok
#   Pattern: --- PASS|^ok\s

# ══════════════════════════════════════════════════════════════════════════════
# § 10  BUILD SYSTEM PATTERNS
# ══════════════════════════════════════════════════════════════════════════════

# ── cargo build (Rust) ────────────────────────────────────────────────────────
# Mark 1 (red): error[E...]: or "error:" lines
#   Pattern: ^error(\[E[0-9]+\])?:
#
# Mark 2 (blue): warning[...]:
#   Pattern: ^warning(\[[A-Za-z_-]+\])?:
#
# Mark 3 (green): Finished ... in
#   Pattern: Finished .*(dev|release)

# ── make / cmake ──────────────────────────────────────────────────────────────
# Mark 1 (red): Error, error:
#   Pattern: [Ee]rror:|make\[.*\]: \*\*\*
#
# Mark 2 (blue): Warning:, warning:
#   Pattern: [Ww]arning:
#
# Mark 3 (green): Built, Linking
#   Pattern: Built|Linking|Compiling

# ── npm / yarn / pnpm build ───────────────────────────────────────────────────
# Mark 1 (red): error, ERROR, npm ERR!
#   Pattern: ^npm ERR!|\berror\b
#
# Mark 2 (blue): warn, WARN
#   Pattern: ^\s*warn\b
#
# Mark 3 (green): Done in, success, built
#   Pattern: Done in|success|^built

# ══════════════════════════════════════════════════════════════════════════════
# § 11  GIT OUTPUT PATTERNS
# ══════════════════════════════════════════════════════════════════════════════

# ── git status output ────────────────────────────────────────────────────────
# Mark 1 (red): deleted, renamed (source)
#   Pattern: ^D\s|deleted:
#
# Mark 2 (blue): modified, staged modifications
#   Pattern: ^M\s|modified:|Changes not staged
#
# Mark 3 (green): added, new file
#   Pattern: ^\?\?\s|^A\s|new file:

# ── git log output ────────────────────────────────────────────────────────────
# Mark 1 (red): Revert commits, merge conflicts
#   Pattern: ^Revert|CONFLICT
#
# Mark 2 (blue): Merge commits
#   Pattern: ^Merge (branch|pull request)
#
# Mark 3 (green): feature commits (by conventional commit prefix)
#   Pattern: ^feat:|^feature:

# ── git diff output ───────────────────────────────────────────────────────────
# Mark 1 (red): removed lines
#   Pattern: ^\-[^-]
#
# Mark 3 (green): added lines
#   Pattern: ^\+[^+]
#
# Note: For git diff, use delta (git diff pager) instead — it colors
# automatically. Marks are better for grep/log/status outputs.

# ══════════════════════════════════════════════════════════════════════════════
# § 12  DOCKER / CONTAINER PATTERNS
# ══════════════════════════════════════════════════════════════════════════════

# ── docker-compose up output ──────────────────────────────────────────────────
# Mark 1 (red): Error, restart, exit
#   Pattern: [Ee]rror|restarting|exited with
#
# Mark 2 (blue): Starting, attaching
#   Pattern: Starting|Attaching
#
# Mark 3 (green): Started, healthy, done
#   Pattern: Started|healthy|done

# ── Kubernetes kubectl output ─────────────────────────────────────────────────
# Mark 1 (red): Error, CrashLoopBackOff, OOMKilled
#   Pattern: [Ee]rror|CrashLoopBackOff|OOMKilled|Evicted
#
# Mark 2 (blue): Pending, ContainerCreating
#   Pattern: Pending|ContainerCreating|Terminating
#
# Mark 3 (green): Running, Ready
#   Pattern: Running|Ready|Completed

# ══════════════════════════════════════════════════════════════════════════════
# § 13  NETWORK OUTPUT PATTERNS
# ══════════════════════════════════════════════════════════════════════════════

# ── curl / wget output ────────────────────────────────────────────────────────
# Mark 1 (red): connection refused, 4xx/5xx
#   Pattern: (?:refused|failed|[45][0-9]{2})
#
# Mark 2 (blue): redirecting, 3xx
#   Pattern: (?:redirect|Location:|3[0-9]{2})
#
# Mark 3 (green): 200 OK, saved
#   Pattern: (?:200|saved|Downloaded)

# ── ping output ───────────────────────────────────────────────────────────────
# Mark 1 (red): Request timeout, 100% packet loss
#   Pattern: Request timeout|100% packet loss|Destination Host Unreachable
#
# Mark 3 (green): time= (successful pings)
#   Pattern: time=[0-9]+

# ── traceroute/tracepath output ───────────────────────────────────────────────
# Mark 1 (red): * * * (no response)
#   Pattern: \* \* \*
#
# Mark 3 (green): ms values
#   Pattern: [0-9]+\.[0-9]+ ms

