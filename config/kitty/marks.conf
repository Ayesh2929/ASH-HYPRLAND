# ══════════════════════════════════════════════════════════════════════════════
# § 01  MARK TYPE 1 — CRITICAL / ERROR
# ══════════════════════════════════════════════════════════════════════════════
# Mark type 1 is the highest-urgency channel.
# Color: Catppuccin Mocha red (#f38ba8) — universally recognized as "error"
# Use for: FATAL, ERROR, CRITICAL, PANIC, EXCEPTION, FAILED

# ── Color definition ──────────────────────────────────────────────────────────
# Foreground (text color) when mark 1 is applied to a line.
# [INJECTED] by ASH theme engine — tracks active theme's critical color.
mark1_foreground           #1e1e2e

# Background (line highlight color) when mark 1 is applied.
# [INJECTED] by ASH theme engine.
mark1_background           #f38ba8

# ── Default pattern: Error/Critical ──────────────────────────────────────────
# Activated by: kitty_mod+F1 (toggle_marker iregex 0 <pattern>)
# The pattern is defined in keybinds.conf:
#   map kitty_mod+F1 toggle_marker iregex 0 \
#     ERROR|FATAL|CRITICAL|PANIC|EXCEPTION|FAIL(?:ED|URE)|ABORT|SEGFAULT
#
# Pattern coverage:
#   ERROR     = Generic error (Python, Go, Rust, Node.js, systemd)
#   FATAL     = Fatal error (Java, Go, C++ logs)
#   CRITICAL  = Critical severity (Python logging, syslog)
#   PANIC     = Go panic, Rust panic!, kernel panic
#   EXCEPTION = Java/Python exception traceback header
#   FAILED    = systemd service failed, test failure
#   FAILURE   = Alternative failure word
#   ABORT     = Signal abort, runtime abort
#   SEGFAULT  = Segmentation fault
#
# Regex is case-insensitive (iregex) — matches Error, error, ERROR all.

# ══════════════════════════════════════════════════════════════════════════════
# § 02  MARK TYPE 2 — WARNING / INFO / WATCH
# ══════════════════════════════════════════════════════════════════════════════
# Mark type 2 is the medium-urgency channel.
# Color: Catppuccin Mocha blue (#89b4fa) — information, watch items
# Use for: WARNING, WARN, NOTICE, INFO (when differentiation needed)

# ── Color definition ──────────────────────────────────────────────────────────
# [INJECTED] by ASH theme engine.
mark2_foreground           #1e1e2e

# [INJECTED] by ASH theme engine.
mark2_background           #89b4fa

# ── Default pattern: Warning/Notice ──────────────────────────────────────────
# Activated by: kitty_mod+F2 (toggle_marker iregex 1 <pattern>)
# Pattern in keybinds.conf:
#   map kitty_mod+F2 toggle_marker iregex 1 \
#     WARN(?:ING)?|NOTICE|DEPRECATED|TODO|FIXME|HACK|NOTE
#
# Pattern coverage:
#   WARNING   = Python, Go, systemd, compiler warnings
#   WARN      = Short form (Java, Rust, many frameworks)
#   NOTICE    = syslog NOTICE level
#   DEPRECATED= API deprecation warnings
#   TODO      = Development notes in output
#   FIXME     = Needs fixing notes in output
#   HACK      = Hacky code markers in output
#   NOTE      = Important notes in output

# ══════════════════════════════════════════════════════════════════════════════
# § 03  MARK TYPE 3 — SUCCESS / DONE / PASSED
# ══════════════════════════════════════════════════════════════════════════════
# Mark type 3 is the positive/completion channel.
# Color: Catppuccin Mocha green (#a6e3a1) — success, completion, "go"
# Use for: PASS, OK, SUCCESS, DONE, COMPLETE

# ── Color definition ──────────────────────────────────────────────────────────
# [INJECTED] by ASH theme engine.
mark3_foreground           #1e1e2e

# [INJECTED] by ASH theme engine.
mark3_background           #a6e3a1

# ── Default pattern: Success/Pass ────────────────────────────────────────────
# Activated by: kitty_mod+F3 (toggle_marker iregex 2 <pattern>)
# Pattern in keybinds.conf:
#   map kitty_mod+F3 toggle_marker iregex 2 \
#     PASS(?:ED)?|OK|SUCCESS|DONE|COMPLETE(?:D)?|FINISH(?:ED)?
#
# Pattern coverage:
#   PASSED    = Test passed (pytest, cargo test, Jest)
#   PASS      = Short form (JUnit, test frameworks)
#   OK        = HTTP 200, operation succeeded
#   SUCCESS   = Deployment success, script success
#   DONE      = Task/build complete
#   COMPLETED = Long-running operation completed
#   FINISHED  = Job/run finished

