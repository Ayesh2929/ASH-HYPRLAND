# File    : marks.conf
# Author  : Ash Dotfiles v5.0 Omega
# License : MIT
# Desc    : Complete, ultra-optimized mark and annotation system for Kitty.
#           Marks are colored line-level annotations that allow you to visually
#           tag terminal output and navigate between tagged sections instantly.
#           This system transforms Kitty into a powerful log analysis,
#           debugging, and code review tool.
#
#   What are marks?
#     Marks are persistent colored highlights applied to lines in the
#     terminal scrollback buffer. They survive scrolling and tab switches.
#     Three independent mark "channels" (types) allow simultaneous
#     multi-category annotation with different colors.
#
#   Mark channels:
#     Mark 1 (mauve/accent): Primary attention — ERROR, FATAL, critical issues
#     Mark 2 (blue/info):    Secondary attention — WARNING, notices, watch items
#     Mark 3 (green/pass):   Success/done — PASSED, OK, completed items
#
#   Mark patterns supported:
#     iregex  = Case-insensitive regex (most flexible — used by all presets)
#     regex   = Case-sensitive regex
#     itext   = Case-insensitive plain text search
#     text    = Case-sensitive plain text search
#     url     = Marks all detected URLs
#
#   Key use cases:
#     Log analysis:       mark errors red, warnings blue, successes green
#     Test output:        mark failures red, skips blue, passes green
#     Build output:       mark errors red, warnings blue, timing info green
#     Code review diffs:  mark deletions red, additions green, context blue
#     SSH sessions:       mark your commands blue, server responses in green
#     Docker logs:        mark FATAL red, WARN blue, INFO green
#
#   Navigation:
#     kitty_mod+F1 → Toggle Error marks
#     kitty_mod+F2 → Toggle Warning marks
#     kitty_mod+F3 → Toggle Success marks
#     kitty_mod+F4 → Remove ALL marks
#     kitty_mod+m  → Interactive mark creation (custom pattern)
#     kitty_mod+shift+F1 → Scroll to previous mark
#     kitty_mod+shift+F2 → Scroll to next mark
#     kitty_mod+z / kitty_mod+x → Navigate marks (scroll_to_mark)
#
