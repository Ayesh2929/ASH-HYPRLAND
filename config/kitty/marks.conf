# § 14  CUSTOM MARK KEYBINDS
# ══════════════════════════════════════════════════════════════════════════════
# These keybinds extend the defaults from keybinds.conf.
# Add to keybinds.conf to activate.

# ── Domain-specific mark presets ──────────────────────────────────────────────
# HTTP log analysis mode:
#   map kitty_mod+ctrl+h toggle_marker iregex 0 " [45][0-9]{2} "
#   map kitty_mod+ctrl+h toggle_marker iregex 1 " 3[0-9]{2} "
#   map kitty_mod+ctrl+h toggle_marker iregex 2 " 2[0-9]{2} "

# Python log mode:
#   map kitty_mod+ctrl+p toggle_marker iregex 0 CRITICAL|ERROR
#   map kitty_mod+ctrl+p toggle_marker iregex 1 WARNING
#   map kitty_mod+ctrl+p toggle_marker iregex 2 INFO|DEBUG

# URL mark mode (mark all URLs for quick navigation):
#   map kitty_mod+ctrl+u toggle_marker url 0

# ── Clear and re-apply workflow ───────────────────────────────────────────────
# Useful workflow for switching between log analysis modes:
# 1. kitty_mod+F4    = remove all marks
# 2. Run new command / switch output
# 3. kitty_mod+F1/F2/F3 = apply new marks
# 4. kitty_mod+z/x  = navigate through marks

# ── Save / load mark presets ─────────────────────────────────────────────────
# Kitty does not persist marks between sessions.
# For persistent mark presets: create named keybinds in keybinds.conf.
# The keybinds effectively save the pattern for reuse.

# ══════════════════════════════════════════════════════════════════════════════
# § 15  MARK + SCROLLBACK WORKFLOW
# ══════════════════════════════════════════════════════════════════════════════

# ── Optimal analysis workflow ─────────────────────────────────────────────────
# Step-by-step log analysis workflow using marks + scrollback:
#
# 1. Run your command:
#    cargo test 2>&1  (or any other command with lots of output)
#
# 2. Apply marks:
#    kitty_mod+F1  = highlight FAILED/ERROR lines in red
#    kitty_mod+F3  = highlight PASSED/OK lines in green
#
# 3. Navigate to first issue:
#    kitty_mod+home       = go to beginning of scrollback
#    kitty_mod+x          = jump to first marked line
#
# 4. Inspect each error:
#    kitty_mod+x          = next marked line (error-by-error navigation)
#    kitty_mod+z          = previous marked line (go back)
#
# 5. Copy relevant output:
#    Triple-click          = select line
#    kitty_mod+c           = copy to clipboard
#    (or use hints kitten for file paths)
#
# 6. Open in editor:
#    kitty_mod+p           = hints --type path → open file
#    (jump to error file directly)
#
# 7. Clean up:
#    kitty_mod+F4          = remove all marks

# ── Marks + pager workflow ────────────────────────────────────────────────────
# For very long output:
# 1. Apply marks first (while in Kitty)
# 2. kitty_mod+g = open scrollback in bat pager
# 3. bat shows marks as colored lines
# 4. Use / search in bat/less to find patterns
# 5. Quit pager (q) to return to Kitty with marks intact

# ══════════════════════════════════════════════════════════════════════════════
# § 16  MARK PERFORMANCE
# ══════════════════════════════════════════════════════════════════════════════

# ── Regex performance ─────────────────────────────────────────────────────────
# Marks with iregex/regex patterns are applied to:
#   • All currently visible lines (immediate)
#   • All scrollback lines (background scan)
#   • New output lines as they arrive
#
# Performance characteristics:
#   Pattern matching:  O(n) where n = visible lines + scrollback length
#   At 10k lines:      ~1-5ms for a typical regex pattern
#   Complex regex:     up to 10ms for pathological patterns
#   Practical impact:  imperceptible for patterns up to ~10k lines
#
# For very large scrollbacks (50k+ lines), prefer itext over iregex:
#   itext uses simple substring matching → 5-10× faster than regex
#   Use for: exact keyword matching where regex is not needed

# ── Memory impact ─────────────────────────────────────────────────────────────
# Each active mark type adds a small memory overhead:
#   Mark data structure: ~8 bytes per marked line
#   At 10k lines with 50% match rate: ~40KB additional RAM
#   Negligible impact on overall Kitty memory budget.

# ── Multiple simultaneous marks ───────────────────────────────────────────────
# All three mark types can be active simultaneously.
# Combined performance: three passes over the scrollback (one per channel)
# Total: ~3-15ms for initial mark application on 10k lines → not perceptible

# ══════════════════════════════════════════════════════════════════════════════
# § 17  ACCESSIBILITY MARK SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

# ── Color-blind accessibility ─────────────────────────────────────────────────
# The default Red/Blue/Green mark palette has issues for:
#   • Deuteranopia (green-blindness): mark3 (green) may look similar to mark1 (red)
#   • Protanopia (red-blindness): mark1 (red) appears desaturated
#
# Accessible alternative palettes:
#
# Deuteranopia-safe (avoid red/green confusion):
#   mark1_background #f38ba8  (retain pink-red — visible to deuteranopes)
#   mark2_background #89b4fa  (blue — safe)
#   mark3_background #f9e2af  (yellow — safe, clearly different from red)
#   ASH applies via: ash mode accessibility
#
# High contrast (maximum visibility):
#   mark1_foreground #ffffff  mark1_background #cc0000  (pure red)
#   mark2_foreground #ffffff  mark2_background #0055cc  (pure blue)
#   mark3_foreground #000000  mark3_background #00aa00  (pure green)

# ── Shape-based differentiation ───────────────────────────────────────────────
# Kitty marks use color ONLY for differentiation — no shape/pattern.
# For users who cannot distinguish colors: use text patterns that
# add a visual prefix to marked lines via the hints kitten.
# Alternative: use the three mark colors with high contrast values
# that are distinguishable even in grayscale.

# ══════════════════════════════════════════════════════════════════════════════
# § 18  MARK INTEGRATION WITH EXTERNAL TOOLS
# ══════════════════════════════════════════════════════════════════════════════

# ── bat (pager) ───────────────────────────────────────────────────────────────
# When scrollback is opened in bat (kitty_mod+g), marks are visible
# as colored line highlights in the pager output.
# bat respects ANSI color codes in the input — marks translate correctly.

# ── grep integration ──────────────────────────────────────────────────────────
# For pattern discovery before applying marks:
# 1. grep -n 'PATTERN' (to identify line numbers)
# 2. Apply marks with the same pattern
# 3. Navigate via marks instead of grep output
# This is faster than scrolling through grep results.

# ── ripgrep integration ───────────────────────────────────────────────────────
# rg --with-filename output includes file:line references.
# Combine with hints kitten (kitty_mod+p) to open specific files.
# Combine with marks (kitty_mod+F1) to highlight match lines in output.

# ── delta (git diff) ──────────────────────────────────────────────────────────
# delta renders git diffs with its own coloring.
# Kitty marks work ON TOP of delta's colors — they're additive.
# Use marks to highlight specific diff sections when reviewing.

# ── tmux (if used inside Kitty) ───────────────────────────────────────────────
# Marks work on the visible Kitty terminal content.
# If tmux adds its own scrollback, marks apply to the visible pane only.
# Recommendation: use Kitty layouts instead of tmux for best mark support.

