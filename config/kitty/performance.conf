# ══════════════════════════════════════════════════════════════════════════════
# § 01  RENDERING ENGINE SELECTION
# ══════════════════════════════════════════════════════════════════════════════

# ── Display server ────────────────────────────────────────────────────────────
# Tell Kitty explicitly which display server to use.
# "wayland" = use native Wayland protocol (zero XWayland overhead)
# "x11"     = use X11 (required for some NVIDIA + XWayland setups)
# "auto"    = detect automatically (safe fallback, slight overhead)
#
# For Hyprland: always "wayland".
# For NVIDIA + Wayland issues: try "auto" first, then "x11" as last resort.
linux_display_server       wayland

# ══════════════════════════════════════════════════════════════════════════════
# § 02  FRAME TIMING (repaint_delay)
# ══════════════════════════════════════════════════════════════════════════════
# repaint_delay controls how frequently Kitty re-renders the screen (ms).
# This is the MINIMUM time between consecutive repaints.
#
# Relationship to monitor refresh rate:
#   Monitor   | Frame budget | Ideal repaint_delay
#   ──────────┼─────────────┼────────────────────
#   60 Hz     | 16.67 ms    | 10 ms  (under-budget → smooth)
#   75 Hz     | 13.33 ms    | 10 ms
#   100 Hz    | 10.00 ms    | 8 ms
#   120 Hz    | 8.33 ms     | 6 ms
#   144 Hz    | 6.94 ms     | 6 ms
#   165 Hz    | 6.06 ms     | 5 ms
#   240 Hz    | 4.17 ms     | 3 ms   (requires powerful GPU)
#   Variable  | adaptive    | 10 ms  (safe default for VRR/FreeSync)
#
# Why not 0?
#   repaint_delay=0 means "repaint every frame without any delay limit".
#   This can cause the GPU to be busy 100% of the time even with static
#   terminal content — wasting power and increasing fan noise.
#   A small delay (≥5ms) allows the GPU to idle between frames.
#
# Why not match exactly the frame budget?
#   Setting exactly 16ms for 60Hz creates a cliff-edge where a single
#   late frame causes a full-frame miss. Setting 10ms gives headroom.
#
# Active profile: Mid-range (144Hz, balanced)
repaint_delay              10

# ── High-performance profile (165Hz+, discrete GPU) ──────────────────────────
# Uncomment for high-refresh-rate gaming monitors with capable GPU:
# repaint_delay              6

# ── Battery-saver profile (laptop on battery) ────────────────────────────────
# Uncomment to reduce GPU/CPU usage on battery power:
# repaint_delay              20
# (ASH battery mode plugin applies this automatically via: ash mode battery)

# ── Ultra-low-latency profile (competitive use, NVIDIA RTX 4070+) ─────────────
# Uncomment for absolute minimum latency (higher power draw):
# repaint_delay              3

# ══════════════════════════════════════════════════════════════════════════════
# § 03  INPUT LATENCY (input_delay)
# ══════════════════════════════════════════════════════════════════════════════
# input_delay = milliseconds to wait after last input event before repainting.
#
# Purpose: batch rapid keypresses into a single repaint.
# If the user types very fast (10 chars in 20ms), we want ONE repaint
# at the end of the burst, not 10 individual repaints.
#
# This directly impacts perceived input latency:
#   input_delay=0  → repaint immediately on every event (most responsive)
#   input_delay=3  → batch events within 3ms window (excellent balance)
#   input_delay=10 → batch events within 10ms (save CPU, slightly sluggish)
#
# Hardware reality:
#   USB keyboard polling rate:     125Hz = 8ms per event
#   Bluetooth keyboard:            100Hz = 10ms per event
#   Mechanical keyboard USB:       1000Hz = 1ms per event
#   For 1000Hz polling: input_delay=3 is still optimal (batch 3 events max)
#
# Typing speed math:
#   A fast typist: 100 WPM = ~500 chars/min = ~8.3 chars/sec = 120ms/char
#   At 120ms/char, input_delay=3ms = zero perceptible impact.
#   Even at 200 WPM (elite speed): 1000 chars/min = 60ms/char vs 3ms delay.
#
# Conclusion: input_delay=3 is imperceptible at any human typing speed
# while providing meaningful CPU savings vs input_delay=0.
input_delay                3

# ── Zero-latency profile (for latency-sensitive benchmarking) ────────────────
# Uncomment to eliminate input batching entirely:
# input_delay                0

# ── High-latency-tolerant profile (battery / CI) ─────────────────────────────
# Uncomment for maximum CPU savings on slow hardware:
# input_delay                10

# ══════════════════════════════════════════════════════════════════════════════
# § 04  DISPLAY SYNC (sync_to_monitor)
# ══════════════════════════════════════════════════════════════════════════════
# Controls whether Kitty synchronizes its rendering to the monitor's
# vertical blank (VSync) interval.
#
# yes = VSync enabled
#   + Eliminates screen tearing (visible as horizontal tear line)
#   + Smooth, consistent frame presentation
#   - Adds 0.5–2ms of input-to-display latency (one VSync period)
#   - If repaint finishes just after VSync, must wait for next one
#
# no  = VSync disabled (free-running renderer)
#   + Lowest possible input-to-display latency
#   + Frame presented as soon as rendered (no VSync wait)
#   - May show tearing on some monitor/compositor combinations
#   - On Wayland with Hyprland: tearing is compositor-controlled
#
# Wayland note:
#   On Wayland, compositors (Hyprland) control VSync at the compositor level.
#   Kitty's sync_to_monitor=yes is ADVISORY on Wayland — the compositor
#   may override it. Hyprland's VRR/adaptive sync handles tearing prevention.
#   With Hyprland + FreeSync/G-Sync: setting sync_to_monitor=yes is safe
#   because Hyprland coordinates the VSync, not Kitty directly.
#
# Recommendation:
#   sync_to_monitor=yes for all setups (compositor handles the rest).
#   The latency cost is imperceptible (<2ms) vs the visual benefit.
sync_to_monitor            yes

# ── VRR / FreeSync / G-Sync consideration ─────────────────────────────────────
# With variable refresh rate displays:
#   sync_to_monitor=yes: Kitty aims for VSync, Hyprland adjusts frame rate
#   sync_to_monitor=no:  Kitty renders freely, Hyprland shows when ready
# Both work with FreeSync/G-Sync. "yes" is more power-efficient.

# ══════════════════════════════════════════════════════════════════════════════
# § 05  GPU TEXTURE MEMORY (texture_cache_size)
# ══════════════════════════════════════════════════════════════════════════════
# Kitty pre-renders glyphs to GPU textures for fast rendering.
# texture_cache_size sets the maximum GPU VRAM allocated for glyph textures.
#
# Memory sizing guide:
#   Font size | Unicode coverage | Recommended
#   ──────────┼──────────────────┼────────────
#   ≤12pt     | ASCII only       | 32 MB
#   12-14pt   | Latin + symbols  | 64 MB  ← default
#   14-16pt   | + emoji + CJK    | 128 MB
#   >16pt     | Full coverage    | 256 MB
#   HiDPI 4K  | Any              | 256 MB (glyphs are larger at HiDPI)
#
# Budget:
#   Modern dedicated GPU: 6-24GB VRAM — 64MB is trivial overhead (<1%)
#   Integrated GPU (780M): 1-4GB shared — 64MB is still fine
#   Low-end/old hardware: 256-512MB VRAM — use 32MB to be safe
#
# Setting too low:
#   Kitty evicts rarely-used glyphs from cache → re-renders on access
#   → visible micro-stutters when new unicode glyphs appear
#
# Setting too high:
#   No performance benefit beyond what's needed
#   Wastes VRAM that could be used by other applications
#
# Active: 64MB (covers JetBrains Mono + Nerd Fonts + emoji at 12.5pt)
texture_cache_size         64

# ── HiDPI / large font profile ────────────────────────────────────────────────
# Uncomment for 4K displays or fonts ≥16pt with full unicode:
# texture_cache_size         256

# ── Memory-constrained profile (old GPU, VM) ──────────────────────────────────
# Uncomment for systems with limited GPU VRAM:
# texture_cache_size         32

# ══════════════════════════════════════════════════════════════════════════════
# § 06  GLYPH RENDERING QUALITY
# ══════════════════════════════════════════════════════════════════════════════

# ── Box drawing character scale ───────────────────────────────────────────────
# Controls how Kitty scales box-drawing and block element characters.
# These are characters like ─ │ ┼ █ ▀ ▄ used in TUI interfaces.
#
# Format: "thin_width, thick_width, height_scale, width_scale"
# Default: "0.001, 1, 1.5, 2"
#
# The values control:
#   thin_width:   Width of thin lines (─, │) in pixels
#   thick_width:  Width of thick lines in pixels
#   height_scale: Scale factor for height
#   width_scale:  Scale factor for width
#
# Result: Box drawing chars render at pixel-perfect size, filling cells
# completely regardless of font metrics. This eliminates gaps between
# adjacent box characters that some fonts render with thin seams.
box_drawing_scale          0.001, 1, 1.5, 2

# ── Text antialiasing ─────────────────────────────────────────────────────────
# Override the system default antialiasing for text rendering.
# (Configured via fontconfig/FreeType — not a direct Kitty option)
# Kitty uses the system's FreeType settings by default.
# To override: configure /etc/fonts/local.conf or ~/.config/fontconfig/

# ── Subpixel rendering ────────────────────────────────────────────────────────
# For non-HiDPI LCD displays: subpixel AA gives sharper rendering.
# Set in fonts.conf via the text_fg_override_threshold.
# See fonts.conf § 03 for details.

# ══════════════════════════════════════════════════════════════════════════════
# § 07  TEXT COMPOSITION STRATEGY
# ══════════════════════════════════════════════════════════════════════════════
# How Kitty composites text glyphs onto the background.
#
# platform = Use the OS-recommended strategy
#            Linux: freetype compositing (fast, good quality)
#            macOS: CoreText compositing
#
# This is the most important setting for text rendering quality.
# Leave as "platform" unless you have a specific reason to override.
text_composition_strategy  platform

# ── Force left-to-right rendering ─────────────────────────────────────────────
# no  = Auto-detect text direction (RTL for Arabic/Hebrew — correct)
# yes = Force LTR always (faster for pure LTR workflows, breaks RTL)
force_ltr                  no

# ══════════════════════════════════════════════════════════════════════════════
# § 08  SCROLLBACK PERFORMANCE
# ══════════════════════════════════════════════════════════════════════════════

# ── Scrollback buffer size (lines) ───────────────────────────────────────────
# Already configured in scrollback.conf.
# Documented here for performance budget awareness.
# 10000 lines ≈ 1.5MB RAM per window (negligible for modern systems).
# scrollback_lines = 10000  (set in scrollback.conf)

# ── Scrollback pager history ─────────────────────────────────────────────────
# scrollback_pager_history_size = 0 (load all — OK at 10k lines)
# Set in scrollback.conf.

# ── Large output optimization ─────────────────────────────────────────────────
# When a program produces large output rapidly (cat 100MB_file.txt):
# Kitty processes output in chunks to avoid stalling the event loop.
# This is automatic — repaint_delay provides the chunking rhythm.
# The GPU batch renderer handles large text volumes efficiently.

# ── Alternate screen performance ─────────────────────────────────────────────
# Applications using the alternate screen (vim, htop, less, btop) get
# full terminal width × height render area. Performance is equivalent to
# primary screen — no additional configuration needed.

# ══════════════════════════════════════════════════════════════════════════════
# § 09  RESIZE & LAYOUT PERFORMANCE
# ══════════════════════════════════════════════════════════════════════════════

# ── Resize increments ─────────────────────────────────────────────────────────
# yes = Snap window size to font cell grid during resize
# no  = Allow any pixel size (may leave partial cells visible)
#
# "yes" is highly recommended:
#   • Terminal content always fits perfectly in the window
#   • No fractional cell rendering artifacts
#   • Consistent cursor positioning
resize_in_steps            yes

# ── Remember window size ──────────────────────────────────────────────────────
# Restore window size from last session.
# yes = Remember (slightly slower startup — reads saved size)
# no  = Always use initial_window_width × initial_window_height from kitty.conf
remember_window_size       yes

# ── Confirm OS window close ───────────────────────────────────────────────────
# 0 = Never ask (instant close — no overhead from dialog rendering)
# Already configured in kitty.conf.
confirm_os_window_close    0

# ── Window resize performance ─────────────────────────────────────────────────
# During interactive resize, Kitty re-renders every frame.
# The repaint_delay governs how often the resize preview updates.
# At 10ms repaint_delay: resize preview updates at ~100fps — very smooth.

# ══════════════════════════════════════════════════════════════════════════════
# § 10  UPDATE CHECK (DISABLE)
# ══════════════════════════════════════════════════════════════════════════════

# ── Disable automatic update check ───────────────────────────────────────────
# Kitty checks for updates periodically (network request = latency + CPU).
# On Arch Linux: Kitty is updated via pacman — no need for Kitty's updater.
# On NixOS: package manager handles updates.
#
# 0 = Never check for updates (recommended for package-managed installs)
# N = Check every N hours
update_check_interval      0

# ══════════════════════════════════════════════════════════════════════════════
# § 11  PROCESS & THREAD MODEL
# ══════════════════════════════════════════════════════════════════════════════
# Kitty is single-process but uses OS threads for:
#   • Child process management (shell subprocess)
#   • Async file operations (scrollback compression)
#   • Font rendering (FreeType calls can be slow → threaded)
#   • Network (update checks, kitten network calls)
#
# Kitty's threading is automatic — no explicit thread count configuration.
# CPU affinity and nice levels can be set externally:
#   systemd-run --user -p CPUAffinity=0,1 kitty
#   nice -n -5 kitty  (slight priority boost for terminal responsiveness)

# ── Nice level ────────────────────────────────────────────────────────────────
# Terminal emulators benefit from slightly elevated scheduling priority.
# Not a Kitty config option — set via systemd service or shell alias:
#   alias kitty='nice -n -5 kitty'
# ASH sets this via the kitty.service systemd user unit if configured.

# ── CPU governor interaction ──────────────────────────────────────────────────
# For laptops: the CPU governor (powersave vs performance) affects Kitty.
# ASH game mode sets governor to "performance" which benefits Kitty too.
# At idle: "powersave" is fine — Kitty's idle CPU use is <0.1%.

# ══════════════════════════════════════════════════════════════════════════════
# § 12  STARTUP PERFORMANCE
# ══════════════════════════════════════════════════════════════════════════════

# ── Startup session ───────────────────────────────────────────────────────────
# "none" = no pre-defined session (fastest startup — no session file parsing)
startup_session            none

# ── Shell integration ─────────────────────────────────────────────────────────
# Shell integration adds OSC sequences for:
#   • CWD tracking (used by new_window_with_cwd)
#   • Prompt markers (scroll_to_prompt)
#   • Command timing (show_last_command_output)
#
# "enabled" provides all features with minimal overhead:
#   • Fish shell integration: ~0.5ms startup overhead (negligible)
#   • The OSC sequences are tiny (< 100 bytes per prompt)
shell_integration          enabled no-sudo

# ── Kitty startup sequence ────────────────────────────────────────────────────
# Typical Kitty startup time (measured on AMD Ryzen 7 7700X):
#   Cold start (first launch): 80-120ms (GPU context creation)
#   Warm start (subsequent):   40-60ms  (GPU context cached by compositor)
#   With hyprland:             50-80ms  (Wayland protocol handshake)
#
# Startup is dominated by:
#   1. GPU OpenGL context creation (15-30ms)
#   2. Font loading + initial glyph rendering (20-40ms)
#   3. Shell initialization (fish: 50-150ms depending on plugins)
#
# Optimization tips:
#   • Keep fonts.conf symbol_map list minimal (fewer font loads at startup)
#   • Use kitty --single-instance to reuse existing Kitty instance
#   • Pre-launch Kitty at login: add to Hyprland autostart (already done)

# ══════════════════════════════════════════════════════════════════════════════
# § 13  MEMORY BUDGETS
# ══════════════════════════════════════════════════════════════════════════════
# Kitty memory usage breakdown per OS window:
#
# Component              | Size    | Notes
# ─────────────────────────────────────────────────────────────────────────
# Process overhead        | ~15 MB  | Python runtime + Kitty core
# GPU texture atlas       | 64 MB   | glyph cache (texture_cache_size)
# Scrollback (10k lines)  | ~1.5 MB | compressed ring buffer
# Font data               | ~2 MB   | loaded font metrics + hinting
# Wayland buffers         | ~4 MB   | double-buffered surface
# Tab/window state        | <1 MB   | per tab/window metadata
# Total per window        | ~85 MB  | typical development setup
#
# With 5 windows open:
#   Process overhead shared: ~15 MB (single Python process)
#   GPU textures: 64 MB (shared across all windows in same process)
#   Per-window: ~8 MB (scrollback + buffers)
#   Total: ~15 + 64 + 5×8 = ~119 MB (well within modern RAM budgets)
#
# For memory-constrained systems (≤4GB RAM):
#   Reduce texture_cache_size to 32
#   Reduce scrollback_lines to 3000
#   Use --single-instance to share one Kitty process

# ── Memory profile: development machine ──────────────────────────────────────
# 16GB+ RAM: default settings are fine
# 8GB RAM:   reduce texture_cache_size to 32, scrollback to 5000
# 4GB RAM:   reduce texture_cache_size to 16, scrollback to 2000

# ══════════════════════════════════════════════════════════════════════════════
# § 14  GPU-SPECIFIC PROFILES
# ══════════════════════════════════════════════════════════════════════════════

# ── AMD (RDNA 2/3 — RX 6000/7000 series) — Recommended ──────────────────────
# AMD's Mesa/RADV driver has excellent Wayland support.
# Zero special configuration needed. Default settings are optimal.
#
# Verified working: RX 6600, RX 6700 XT, RX 7800 XT, RX 7900 XTX
# Performance tier: Best possible Kitty performance on Linux
#
# Active settings for AMD (default):
#   linux_display_server   wayland    ← native Wayland, zero overhead
#   sync_to_monitor        yes        ← compositor handles VSync
#   repaint_delay          10         ← safe for 144Hz+ monitors
#   texture_cache_size     64         ← comfortable VRAM budget

# ── AMD Integrated (Radeon 780M / 760M in Ryzen 7000 series) ─────────────────
# Shares system RAM — VRAM is a slice of system memory.
# Lower texture_cache_size to avoid competing with system RAM.
# Uncomment for Ryzen 7040 series laptops:
# texture_cache_size         32
# repaint_delay              12

# ── Intel Arc / Iris Xe ──────────────────────────────────────────────────────
# Intel's modern drivers (i915, xe) have good Wayland support.
# Minor tuning for Arc A-series dedicated GPUs:
# Uncomment for Intel Arc:
# texture_cache_size         32
# repaint_delay              10

# ── Intel UHD (Tiger Lake, Alder Lake, Raptor Lake — laptop) ─────────────────
# Robust and well-tested. No special config needed.
# UHD 770 (desktop) and Iris Xe (laptop) perform identically.

# ── NVIDIA — Proprietary Driver (nvidia, 535+) ───────────────────────────────
# NVIDIA on Wayland has improved dramatically with driver 535+.
# Requires: LIBVA_DRIVER_NAME=nvidia, __GLX_VENDOR_LIBRARY_NAME=nvidia
# These are set in ASH environment.d/nvidia.conf
#
# NVIDIA-specific issues and workarounds:
#   1. Vsync tearing: Set sync_to_monitor=yes AND add:
#      KWIN_DRM_NO_AMS=1 (for KDE) or Hyprland's explicit-sync protocol
#   2. Slow font rendering: nvidia EGL path can be slow → use:
#      __EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
#   3. PRIME (dual GPU laptop): set DRI_PRIME=1 for discrete GPU
#
# Uncomment for NVIDIA:
# linux_display_server       auto     ← "auto" works better than "wayland" for NVIDIA
# sync_to_monitor            yes
# repaint_delay              10
# texture_cache_size         64

# ── NVIDIA — Nouveau (open source) ───────────────────────────────────────────
# Nouveau has limited Wayland support (NVK driver is improving in 2024).
# Fall back to X11 if Wayland doesn't work:
# linux_display_server       x11
# sync_to_monitor            yes
# repaint_delay              16   ← cap at 60fps, nouveau can't sustain more

# ══════════════════════════════════════════════════════════════════════════════
# § 15  VIRTUAL MACHINE / CI MODE
# ══════════════════════════════════════════════════════════════════════════════
# For Kitty running inside VMs (VirtualBox, VMware, QEMU/KVM, etc.)
# or in CI pipelines (headless rendering).

# ── VirtIO GPU (QEMU/KVM recommended GPU) ────────────────────────────────────
# Uncomment for QEMU VM with VirtIO GPU:
# linux_display_server       x11     ← VirtIO + Wayland has issues
# sync_to_monitor            no      ← No physical display to sync to
# repaint_delay              16      ← Match 60fps VM framebuffer
# texture_cache_size         32      ← Conservative VRAM usage
# input_delay                5       ← VM has higher inherent latency anyway

# ── Headless / CI mode ────────────────────────────────────────────────────────
# For screenshot generation, automated testing, CI pipelines:
# Kitty supports headless mode via the --start-as=fullscreen flag
# or via virtual framebuffer (Xvfb, weston-headless).

# ══════════════════════════════════════════════════════════════════════════════
# § 16  PERFORMANCE MONITORING
# ══════════════════════════════════════════════════════════════════════════════
# Runtime performance inspection commands.
# Run these from a terminal to profile Kitty.

# ── Real-time FPS monitoring ──────────────────────────────────────────────────
# Launch Kitty with FPS counter visible:
#   kitty --debug-rendering
# This prints frame timing to stderr continuously.

# ── Input latency measurement ─────────────────────────────────────────────────
# Show key event timestamps:
#   kitty --debug-input
# Compare timestamp of key event to timestamp of repaint.

# ── Memory usage ──────────────────────────────────────────────────────────────
# Show Kitty's memory breakdown:
#   cat /proc/$(pgrep kitty)/status | grep VmRSS
# Or use:
#   kitty @ get-text --extent all | wc -c  (scrollback size in bytes)

# ── GPU profiling ─────────────────────────────────────────────────────────────
# Watch GPU usage while using Kitty:
#   watch -n 0.5 "cat /sys/class/drm/card*/device/gpu_busy_percent"  # AMD
#   nvidia-smi dmon  # NVIDIA

# ── CPU profiling ─────────────────────────────────────────────────────────────
# Profile CPU usage during heavy output:
#   perf stat -p $(pgrep kitty) sleep 5
# Or use htop to track kitty PID in real-time.

# ══════════════════════════════════════════════════════════════════════════════
# § 17  PERFORMANCE KEYBINDS
# ══════════════════════════════════════════════════════════════════════════════
# Quick keybinds for runtime performance adjustments.
# Defined here alongside the settings they affect.

# ── Toggle VSync ──────────────────────────────────────────────────────────────
# Not directly toggleable via keybind — reload config to change.
# Use: kitty_mod+F5 (load_config_file) after editing sync_to_monitor.

# ── Adjust repaint delay ──────────────────────────────────────────────────────
# Not a runtime option — must reload config.

# ── Clear GPU texture cache ───────────────────────────────────────────────────
# Force Kitty to evict and rebuild the glyph texture atlas.
# Useful if fonts are not rendering correctly after a font update.
# From shell: kitty @ set-colors colors.conf  (triggers re-render)

# ── Font rendering debug ──────────────────────────────────────────────────────
# Show which font is rendering each character:
#   kitty_mod+F6 → debug_config (shows full config dump)
# This is defined in keybinds.conf.

# ── Battery mode performance switch ───────────────────────────────────────────
# ASH battery mode automatically applies conservative performance settings.
# Command: ash mode battery
