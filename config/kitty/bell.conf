# ══════════════════════════════════════════════════════════════════════════════
# File    : bell.conf
# Author  : Ash Dotfiles v5.0 Omega
# License : MIT
# Desc    : Complete, thoughtfully-designed bell and notification system for
#           Kitty terminal. Every bell trigger is handled with the right
#           sensory channel: audio, visual, OS notification, or tab indicator.
#           Designed for focus-friendly, distraction-minimal workflows while
#           ensuring critical alerts are never missed.
#
#   Bell philosophy:
#     • Audio bell OFF by default (respect focus, open offices, silence)
#     • Visual bell ON (brief, subtle color flash — non-disruptive)
#     • Tab indicator ON (colored border alerts for background activity)
#     • OS notifications OFF by default (bell ≠ system notification)
#     • Per-app rules: some apps (compilers, tests) deserve louder bells
#     • ASH focus mode: disable ALL bell channels completely
#     • ASH work mode: enable tab indicator only (minimal distraction)
#     • ASH game mode: enable audio bell (game sounds already on anyway)
#
#   Bell trigger scenarios:
#     • Long build completes: visual bell + tab indicator (you notice when ready)
#     • Test suite fails: visual bell + tab indicator (urgent but not audio)
#     • SSH connection drops: visual bell + OS notification (important!)
#     • Shell beep (invalid tab complete): visual only (low priority)
#     • Compilation error in watch mode: tab indicator only
#     • Remote server alert (via tmux/screen): depends on ASH mode
#
#   Terminal bell sequence:
#     Applications trigger the bell by writing \007 (ASCII BEL, ctrl+G) to
#     the terminal. Kitty intercepts this and fires all configured bell channels.
#
#   Section map:
#     § 01  Audio bell (enable_audio_bell)
#     § 02  Audio bell theme & sound
#     § 03  Visual bell (flash)
#     § 04  Visual bell color & duration
#     § 05  Window title bell indicator
#     § 06  Tab bar bell indicator
#     § 07  OS desktop notification
#     § 08  Bell on keyboard activity
#     § 09  ASH mode integration
#     § 10  Per-application bell rules
#     § 11  Bell suppression strategies
#     § 12  Accessibility bell settings
#     § 13  Testing & debugging bells
#     § 14  Quick reference
# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
# § 01  AUDIO BELL
# ══════════════════════════════════════════════════════════════════════════════

# ── Enable / disable audio bell ───────────────────────────────────────────────
# Controls whether Kitty plays a sound when the terminal BEL character (\007)
# is received from an application.
#
# no     = Completely silent (recommended for professional environments)
# yes    = Play the configured bell sound
# system = Use the system bell (speaker/audio subsystem default)
#
# Why "no" is the default:
#   1. Open office environments: audio bell disturbs colleagues
#   2. Headphone users: sudden loud beeps cause ear discomfort
#   3. Focus-mode users: unexpected sounds break concentration
#   4. Most terminal bell triggers are low-priority (invalid tab complete, etc.)
#   5. The visual bell + tab indicator provide sufficient feedback
#   6. PulseAudio/PipeWire introduces ~10-50ms audio latency anyway
#
# Enable if you: work alone, need audio feedback for long builds,
# or are using Kitty in an environment where audio is expected.
enable_audio_bell          no

# ══════════════════════════════════════════════════════════════════════════════
# § 02  AUDIO BELL THEME & SOUND
# ══════════════════════════════════════════════════════════════════════════════

# ── Bell sound theme ──────────────────────────────────────────────────────────
# The XDG sound theme used for the bell sound.
# Kitty plays the "bell" sound from the specified theme.
#
# __custom  = Use Kitty's built-in bell sound (pure tone)
# freedesktop = FreeDesktop.org default theme bell
# Any installed XDG sound theme name works here.
#
# Finding available themes:
#   ls /usr/share/sounds/
#   ls ~/.local/share/sounds/
#
# ASH provides custom bell sounds in:
#   ~/.local/share/ash/assets/sounds/notification.ogg
# To use a custom sound, set the theme to "ash" and place sounds at:
#   ~/.local/share/sounds/ash/stereo/bell.oga
linux_bell_theme           __custom

# ── Custom bell sound via script ──────────────────────────────────────────────
# For maximum bell customization, use a wrapper script:
# (This is not a Kitty config option — implemented via shell alias or wrapper)
#
# Example: Play a custom sound on bell:
#   #!/usr/bin/env bash
#   # kitty-bell.sh — wrap kitty and intercept bell
#   KITTY_BELL_SOUND="$HOME/.local/share/ash/assets/sounds/notification.ogg"
#   exec kitty "$@"
#
# Better approach: use the bell_command option if Kitty ever adds it.
# Currently, the best audio customization is via:
#   1. XDG sound theme (linux_bell_theme)
#   2. paplay/pw-play in a bell script

# ══════════════════════════════════════════════════════════════════════════════
# § 03  VISUAL BELL (FLASH)
# ══════════════════════════════════════════════════════════════════════════════

# ── Visual bell duration ──────────────────────────────────────────────────────
# How long the visual bell flash lasts, in seconds.
# 0.0    = No visual bell (disable completely)
# 0.1    = 100ms flash (barely noticeable but registered by peripheral vision)
# 0.2    = 200ms flash (clear but non-disruptive)
# 0.5    = 500ms flash (very visible, suitable for accessibility)
# 1.0    = 1 second flash (very aggressive — not recommended for normal use)
#
# Design rationale for 0.1s:
#   • Human visual processing: peripheral vision notices changes >80ms easily
#   • 100ms is long enough to register without disrupting reading flow
#   • The color choice (red overlay) makes it visible even at 100ms
#   • Combined with the tab indicator, 100ms is sufficient for non-focused bells
visual_bell_duration       0.1

# ══════════════════════════════════════════════════════════════════════════════
# § 04  VISUAL BELL COLOR
# ══════════════════════════════════════════════════════════════════════════════

# ── Flash color ───────────────────────────────────────────────────────────────
# The color of the visual bell overlay flash.
# This color briefly tints the ENTIRE terminal content area.
#
# Color psychology for bell:
#   Red (#f38ba8):    Attention-grabbing, universally recognized as "alert"
#                     Catppuccin Mocha red — matches error color = semantic
#   Yellow (#f9e2af): Warning tone, less alarming than red, good for info bells
#   White (#cdd6f4):  Neutral flash, least disruptive, pure visual indicator
#   Orange (#fab387): Intermediate urgency between red and yellow
#
# The flash is semi-transparent — the terminal content remains visible
# through it. It's an overlay, not a full screen block.
#
# [INJECTED] by ASH theme engine — tracks active theme's error color.
visual_bell_color          #f38ba8

# ── Visual bell implementation details ────────────────────────────────────────
# Kitty implements the visual bell as a GPU alpha-blended overlay.
# The overlay fades in instantly and fades out over visual_bell_duration.
# No intermediate states — it's a single linear fade.
#
# The overlay does NOT:
#   • Interrupt terminal input
#   • Pause rendering
#   • Affect terminal state
#   • Show on secondary monitors (per-window only)

# ══════════════════════════════════════════════════════════════════════════════
# § 05  WINDOW TITLE BELL INDICATOR
# ══════════════════════════════════════════════════════════════════════════════

# ── Window alert on bell ──────────────────────────────────────────────────────
# When a Kitty window in the BACKGROUND receives a bell signal,
# mark it in a way that draws the user's attention.
#
# yes = Kitty sets the "urgent" hint on the OS window.
#       Hyprland responds by: highlighting the window in the taskbar,
#       or applying the "urgent" window rule (usually a colored border flash).
#
# no  = No OS-level notification for background window bells.
#
# Hyprland handles the "urgent" state via windowrule:
#   windowrule = bordercolor rgb(f38ba8), urgent
#   windowrule = bordersize 3, urgent
# These are configured in config/hypr/windowrules.conf.
window_alert_on_bell       yes

# ── Bell in window title ──────────────────────────────────────────────────────
# Some window managers prepend "🔔" or "⚠️" to the window title on bell.
# Kitty doesn't do this natively — it sets the "urgent" WM hint instead.
# Hyprland reads the urgent hint and applies its own visual response.
#
# To customize Hyprland's urgent window response:
#   In config/hypr/windowrules.conf:
#   windowrulev2 = bordercolor rgb(f38ba8), urgent:1
#   windowrulev2 = bordersize 3, urgent:1

# ══════════════════════════════════════════════════════════════════════════════
# § 06  TAB BAR BELL INDICATOR
# ══════════════════════════════════════════════════════════════════════════════

# ── Bell border color ─────────────────────────────────────────────────────────
# When a window in a BACKGROUND TAB receives a bell, the tab border
# (or tab indicator, depending on tab_bar_style) changes to this color.
#
# This is the most useful bell notification for tabbed terminal workflows:
#   • You're working in tab 1 (coding)
#   • A long build in tab 3 completes (BEL from make/cargo)
#   • Tab 3's border turns red — you see it in peripheral vision
#   • You switch to tab 3 when ready
#
# The border remains the bell color until you FOCUS that tab.
# Upon focusing, it reverts to the normal active_border_color.
#
# [INJECTED] by ASH theme engine — Catppuccin Mocha red.
bell_border_color          #f38ba8

# ── Tab bell visual hierarchy ─────────────────────────────────────────────────
# The bell indicator uses a clear visual hierarchy:
#
#   Active window border:         #cba6f7 (mauve — accent)
#   Active window (bell):         #cba6f7 (unchanged — you're already there)
#   Background window border:     #313244 (surface0 — subtle)
#   Background window (bell):     #f38ba8 (red — urgent)
#
# This ensures:
#   • Normal state: clear but subtle
#   • Bell state: impossible to miss
#   • Active state: always highest priority

# ══════════════════════════════════════════════════════════════════════════════
# § 07  OS DESKTOP NOTIFICATION
# ══════════════════════════════════════════════════════════════════════════════
# Kitty does NOT natively support sending OS desktop notifications on bell.
# However, we can achieve this via shell integration + custom handlers.
#
# Approach 1: Shell function that sends notification on command completion
# (Configured in fish conf.d/ — not in Kitty config)
#
# Approach 2: Kitty's launch action to run notify-send
# (Triggered by application via OSC sequences, not BEL)
#
# Approach 3: External tool watching for bell events
# (e.g., using kitty's remote control API)
#
# ASH provides a build-completion notifier in scripts/notification/:
#   scripts/notification/update-notify.sh
#
# For long-running commands, use the fish-based "done" notification:
#   In fish: function fish_postexec; notify-send "Command" "$argv[1]"; end
# This is configured in config/fish/functions/fish_prompt.fish

# ── Recommended notification workflow ─────────────────────────────────────────
# Instead of relying on BEL for notifications, use:
#
# 1. Fish prompt notification (configured in ASH fish config):
#    • Automatically sends a notification when a long command completes
#    • Threshold: commands taking >10 seconds get a notification
#    • Includes: command name, duration, exit code
#
# 2. Terminal OSC 9 (iTerm2 protocol, supported by some apps):
#    • printf '\033]9;Build complete!\007'
#    • Kitty can be configured to handle OSC 9 → notification
#
# 3. ASH notification scripts:
#    • ash doctor → sends system health notification
#    • ash update check → sends update available notification

# ══════════════════════════════════════════════════════════════════════════════
# § 08  BELL ON KEYBOARD ACTIVITY
# ══════════════════════════════════════════════════════════════════════════════

# ── Keyboard bell ─────────────────────────────────────────────────────────────
# When the terminal application triggers BEL via keyboard input
# (e.g., Bash/Fish beeping on invalid tab completion):
#
# All the settings above apply equally to keyboard-triggered bells.
# No separate configuration for keyboard vs application bells.
#
# Common keyboard bell triggers:
#   • Tab completion failure: no match found
#   • Ctrl+G: explicitly send BEL in some terminal apps
#   • vim: attempting invalid command in ex mode
#   • less/man: attempting scroll past end of content
#   • Invalid key sequence in readline
#
# To disable ONLY the bash/readline completion bell:
#   Add to ~/.inputrc: set bell-style none
#   Or in fish: set fish_complete_path  (fish doesn't use readline → no bell)
#
# To disable vim bell:
#   Add to ~/.config/nvim/init.lua: vim.opt.errorbells = false
#   Or:  vim.opt.belloff = "all"  (defined in ASH Neovim config)

# ══════════════════════════════════════════════════════════════════════════════
# § 09  ASH MODE INTEGRATION
# ══════════════════════════════════════════════════════════════════════════════
# ASH modes automatically adjust bell settings by hot-reloading this file.
# The mode system modifies the settings below via: kitty @ set-options

# ── Focus mode bell settings ──────────────────────────────────────────────────
# When ASH focus mode is active: ash mode focus
# All bell channels are disabled to minimize distractions.
# Applied via: kitty @ set-option enable_audio_bell no
#              kitty @ set-option visual_bell_duration 0
#              kitty @ set-option window_alert_on_bell no
#
# Focus mode restores these settings when deactivated: ash mode default

# ── Work mode bell settings ───────────────────────────────────────────────────
# When ASH work mode is active: ash mode work
# Tab indicator only — professional balance of awareness without distraction.
# enable_audio_bell: no  (silent)
# visual_bell_duration: 0.05  (very brief flash)
# window_alert_on_bell: yes  (tab border changes)

# ── Game mode bell settings ───────────────────────────────────────────────────
# When ASH game mode is active: ash mode game
# Audio bell enabled (game audio is already on, bell fits in).
# enable_audio_bell: yes
# visual_bell_duration: 0.0  (no flash — game visuals are already complex)

# ── Battery mode bell settings ────────────────────────────────────────────────
# When ASH battery mode is active: ash mode battery
# No change to bell settings (bell has negligible power impact).

# ── Cinema mode bell settings ─────────────────────────────────────────────────
# When ASH cinema mode is active: ash mode cinema
# All bells disabled (watching content, no interruptions).
# enable_audio_bell: no
# visual_bell_duration: 0.0
# window_alert_on_bell: no

# ── Stream mode bell settings ─────────────────────────────────────────────────
# When ASH stream mode is active: ash mode stream
# Visual bell only — audio bell would be picked up by the stream microphone.
# enable_audio_bell: no
# visual_bell_duration: 0.2  (more visible for stream viewers)
# window_alert_on_bell: yes

# ── Privacy mode bell settings ────────────────────────────────────────────────
# When ASH privacy mode is active: ash mode privacy
# All bells disabled — silent operation.

# ── Mode-aware bell command ───────────────────────────────────────────────────
# ASH provides a mode-aware bell toggle command:
#   ash config set kitty.bell on/off/tab-only/flash-only
# This generates the appropriate kitty @ set-option commands.

# ══════════════════════════════════════════════════════════════════════════════
# § 10  PER-APPLICATION BELL RULES
# ══════════════════════════════════════════════════════════════════════════════
# Different applications have different bell urgency levels.
# Here we document the recommended handling per application type.
# These are implemented via fish functions and shell wrappers.

# ── Build systems (make, cargo, cmake, gradle) ────────────────────────────────
# Bell urgency: HIGH (build complete = you've been waiting for this)
# Implementation: wrap build commands to send notification on completion
#
# Fish function (in functions/timer.fish):
#   function cargo
#       command cargo $argv
#       set exit_code $status
#       if test $exit_code -eq 0
#           notify-send "✓ Cargo Build" "Success" --icon=terminal
#       else
#           notify-send "✗ Cargo Build" "Failed (exit $exit_code)" \
#               --urgency=critical --icon=dialog-error
#       end
#       return $exit_code
#   end

# ── Test runners (pytest, jest, cargo test, go test) ──────────────────────────
# Bell urgency: HIGH (test failure needs immediate attention)
# Visual bell: yes, OS notification: yes for failures
# Tab indicator: yes

# ── SSH sessions ──────────────────────────────────────────────────────────────
# Bell urgency: VARIABLE (depends on what's running on remote)
# The remote terminal forwards its BEL to the local Kitty.
# All configured bell channels fire — appropriate for monitoring remote tasks.

# ── Vim / Neovim ──────────────────────────────────────────────────────────────
# Bell urgency: LOW (vim beeps for things like "already at end of file")
# Recommendation: disable vim bell entirely in nvim config:
#   vim.opt.belloff = "all"  ← Set in ASH Neovim config

# ── Man pages / less / bat ────────────────────────────────────────────────────
# Bell urgency: LOW (less beeps at scroll boundaries)
# Recommendation: use less with --QUIET flag or set LESS= env var
# The fish conf.d sets: set -gx LESS '-R --QUIET'

# ── Make / pytest watch mode ──────────────────────────────────────────────────
# Bell urgency: MEDIUM (file watcher re-ran due to change)
# Tab indicator sufficient — don't need audio for frequent watch events.

# ══════════════════════════════════════════════════════════════════════════════
# § 11  BELL SUPPRESSION STRATEGIES
# ══════════════════════════════════════════════════════════════════════════════
# When applications generate too many bells, use these techniques.

# ── Suppress bells from specific applications ─────────────────────────────────
# Method 1: Configure the application to not send bells
#   vim:      set belloff=all (or noerrorbells, novisualbell)
#   bash:     set bell-style none in ~/.inputrc
#   zsh:      unsetopt BEEP
#   less:     LESS=--QUIET in shell environment
#   readline: set bell-style none in ~/.inputrc

# ── Suppress bells for a single command ──────────────────────────────────────
# Wrap the command to ignore BEL output:
#   command 2>&1 | tr -d '\007'  (strips BEL from stdout + stderr)
#
# Or set a no-bell subshell:
#   TERM=dumb command  (TERM=dumb disables terminal features including BEL)

# ── Temporary bell suppression keybind ────────────────────────────────────────
# Toggle visual bell on/off via a keybind (defined here for documentation).
# Actual keybind is in keybinds.conf — example only:
#
#   map kitty_mod+alt+b  set_background_opacity default  (just a placeholder)
#
# For real bell toggle, use ASH:
#   ash config set kitty.visual_bell off
#   ash reload kitty

# ── Rate limiting bells ───────────────────────────────────────────────────────
# Kitty does NOT rate-limit bells natively.
# If an application sends many BELs per second (spam), all fire.
# Solution: configure the application to reduce bell frequency.
# Alternative: use a shell wrapper that debounces BEL signals.

# ══════════════════════════════════════════════════════════════════════════════
# § 12  ACCESSIBILITY BELL SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

# ── Longer visual bell for visual impairment ──────────────────────────────────
# For users who rely on visual feedback over audio:
# Increase duration to ensure the flash is registered.
# visual_bell_duration 0.5   (500ms — very visible)
# ASH accessibility theme applies this automatically: ash mode accessibility

# ── High-contrast bell flash ──────────────────────────────────────────────────
# For low-vision users, a pure white flash is most visible against dark bg:
# visual_bell_color #ffffff  (white — maximum contrast on dark terminals)
# ASH accessibility mode sets this automatically.

# ── Audio bell for visual impairment ─────────────────────────────────────────
# Screen reader users and visually impaired users NEED audio bell.
# ASH accessibility mode enables audio bell:
#   enable_audio_bell yes  (applied by ash mode accessibility)

# ── High-volume bell ──────────────────────────────────────────────────────────
# For users who need louder audio feedback:
# The bell volume is controlled by the system audio (PulseAudio/PipeWire).
# Set via: pactl set-sink-volume @DEFAULT_SINK@ 150%
# Or via: wpctl set-volume @DEFAULT_AUDIO_SINK@ 1.5

# ── Vibration / haptic feedback ───────────────────────────────────────────────
# Not supported by Kitty — handled at system level (if applicable).
# For mobile/embedded environments with haptic hardware.

# ── Slow flash for photosensitivity ───────────────────────────────────────────
# For users with photosensitive epilepsy:
# Do NOT use short, bright flashes. Instead:
#   enable_audio_bell yes        (audio only)
#   visual_bell_duration 0.0     (disable flash)
#   enable_audio_bell yes        (rely on audio)

# ══════════════════════════════════════════════════════════════════════════════
# § 13  TESTING & DEBUGGING BELLS
# ══════════════════════════════════════════════════════════════════════════════

# ── Trigger a bell manually ───────────────────────────────────────────────────
# From the terminal, you can test all bell settings with:
#   printf '\007'         (sends BEL character — triggers all bell channels)
#   echo -e '\a'          (same — \a is the ASCII BEL escape)
#   tput bel              (uses terminfo's bell capability)
#   python3 -c "print('\a')"  (Python way)
#
# Expected results with current config:
#   1. Audio: nothing (enable_audio_bell=no)
#   2. Visual: red (#f38ba8) flash for 0.1s over terminal content
#   3. Tab bar: if in background tab, bell_border_color applied to tab
#   4. Window: urgent hint set on OS window if in background

# ── Test audio bell ───────────────────────────────────────────────────────────
# Temporarily enable to test:
#   kitty @ set-option enable_audio_bell yes
#   printf '\007'
#   kitty @ set-option enable_audio_bell no

# ── Test visual bell ──────────────────────────────────────────────────────────
# Test with current settings:
#   printf '\007'
# Test with longer duration to verify color:
#   kitty @ set-option visual_bell_duration 1.0
#   printf '\007'
#   kitty @ set-option visual_bell_duration 0.1

# ── Test tab bell indicator ───────────────────────────────────────────────────
# Open two tabs. In tab 2, run:
#   sleep 1 && printf '\007'
# Then immediately switch to tab 1.
# After 1 second, tab 2's border should turn bell_border_color.

# ── Debug: check if bell is received ─────────────────────────────────────────
# Launch Kitty with debug input to see bell events:
#   kitty --debug-input
# Then trigger a bell — you'll see the BEL event logged to stderr.

