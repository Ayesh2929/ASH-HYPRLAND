# § 14  QUICK REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  ┌──────────────────────────────────────────────────────────────────────────┐
#  │                     KITTY BELL QUICK REFERENCE                           │
#  ├─────────────────────────┬────────────────────────────────────────────────┤
#  │  Setting                │  Value     │  Effect                           │
#  ├─────────────────────────┼────────────┼───────────────────────────────────┤
#  │  enable_audio_bell      │  no        │  Silent — no audio output         │
#  │  visual_bell_duration   │  0.1s      │  100ms red overlay flash          │
#  │  visual_bell_color      │  #f38ba8   │  Catppuccin red (error color)     │
#  │  window_alert_on_bell   │  yes       │  Urgent hint → Hyprland responds  │
#  │  bell_border_color      │  #f38ba8   │  Tab border turns red on bell     │
#  │  linux_bell_theme       │  __custom  │  Built-in Kitty bell sound        │
#  ├─────────────────────────┴────────────┴───────────────────────────────────┤
#  │  Trigger bell:  printf '\007'  (in any terminal)                         │
#  │  Suppress app:  echo -e "\033[?5h"  (enable visual bell in xterm compat) │
#  │  ASH modes:     ash mode focus  (silence all bells)                      │
#  │                 ash mode accessibility  (enable audio + long flash)      │
#  ├──────────────────────────────────────────────────────────────────────────┤
#  │  When bell fires (background tab):                                       │
#  │   ① Tab border color: #313244 ──► #f38ba8 (red)                         │
#  │   ② OS window: urgent hint set → Hyprland applies urgent border rule     │
#  │   ③ Terminal: red flash (0.1s) if window is visible                      │
#  │   ④ Audio: nothing (disabled)                                            │
#  └──────────────────────────────────────────────────────────────────────────┘
# ══════════════════════════════════════════════════════════════════════════════