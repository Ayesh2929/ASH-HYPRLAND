# ══════════════════════════════════════════════════════════════════════════════
# § 01  MOUSE HIDE & CURSOR BEHAVIOR
# ══════════════════════════════════════════════════════════════════════════════

# ── Auto-hide delay ───────────────────────────────────────────────────────────
# Automatically hide the mouse cursor after N seconds of inactivity.
# The cursor reappears immediately when the mouse moves.
#
# 3.0s  = good balance (cursor visible when needed, hidden when typing)
# 0.0   = never hide (always visible)
# -1    = hide immediately when typing begins (most aggressive)
#
# For keyboard-first workflows: 2.0s is ideal.
# For mouse-heavy workflows: 5.0s or 0.0 (never hide).
mouse_hide_wait            3.0

# ── Cursor shape in normal mode ───────────────────────────────────────────────
# Shape of the mouse cursor when hovering over normal terminal content.
# beam (I-beam):  Signals text input/selection capability — most intuitive.
# arrow:          Traditional arrow cursor — less confusing for some users.
# hand:           Hand pointer — useful if you frequently click URLs.
# crosshair:      Precision cursor for pixel-level work.
pointer_shape_when_grabbed   arrow

# ── Cursor shape when dragging ────────────────────────────────────────────────
# Shape during click-drag text selection operations.
# "beam" during drag = clear indication of text selection in progress.
pointer_shape_when_dragging  beam

# ══════════════════════════════════════════════════════════════════════════════
# § 02  CLICK TIMING & SELECTION MODES
# ══════════════════════════════════════════════════════════════════════════════

# ── Click interval ────────────────────────────────────────────────────────────
# Maximum time (seconds) between consecutive clicks to be counted as
# double-click, triple-click, etc.
#
# 0.5s = 500ms between clicks to register as double-click.
# This matches most system defaults (GTK, Qt, X11 default = 400-500ms).
# Increase if you accidentally trigger double-clicks.
# Decrease if you feel double-click detection is too slow.
click_interval             0.5

# ── Word selection regex ──────────────────────────────────────────────────────
# Characters that are considered part of a "word" for double-click selection.
# The regex defines additional characters beyond alphanumerics.
#
# Default Kitty: @-./:~?&=%+#
# Extended (below): adds underscore, tilde, common programming chars
#
# Characters added beyond default:
#   _    = underscores (variable names: my_variable)
#   ~    = tildes (home directory paths: ~/Documents)
#   ?    = query strings (?param=value)
#   &    = query parameters (&key=val)
#   =    = key=value pairs
#   %    = URL encoding (%20)
#   +    = URL encoding (+)
#   #    = hex colors (#ffffff), anchors (#section), channels (#room)
#   :    = ports (localhost:8080), protocol (http:)
#   /    = path separators
#   .    = file extensions, domain names
#   -    = hyphenated-words, flags (--flag)
#   @    = email addresses, usernames (@user)
#   !    = negation, shell history (!!)
#   '    = apostrophes in words (don't)
#   "    = quoted strings
select_by_word_characters  @-./_~?&=%+#:!

# ── Paragraph boundary detection ─────────────────────────────────────────────
# For quad-click (select paragraph):
# Kitty selects text up to the next blank line.
# No configuration option — behavior is fixed.

# ══════════════════════════════════════════════════════════════════════════════
# § 03  COPY-ON-SELECT & CLIPBOARD
# ══════════════════════════════════════════════════════════════════════════════

# ── Copy on select ────────────────────────────────────────────────────────────
# Automatically copy selected text to the clipboard when selection ends.
#
# yes         = Copy to CLIPBOARD on every selection (standard X11 behavior)
# no          = Do not auto-copy (user must explicitly Ctrl+Shift+C)
# clipboard   = Copy to CLIPBOARD (Ctrl+V paste)
# primary     = Copy to PRIMARY selection (middle-click paste)
#
# Recommendation for Wayland:
#   "yes" copies to CLIPBOARD — the most reliable behavior on Wayland.
#   PRIMARY selection also works on Wayland via the primary_selection protocol.
#
# Note: Even with copy_on_select=yes, you can still use Ctrl+Shift+C
# for explicit clipboard copy. The two are additive, not exclusive.
copy_on_select             yes

# ── Strip trailing spaces ─────────────────────────────────────────────────────
# Whether to strip trailing whitespace when copying text.
#
# smart   = Strip trailing spaces only if the selection ends at line end
#           (prevents stripping intentional trailing spaces in code)
# always  = Always strip (cleanest for copying commands)
# never   = Never strip (preserves exact formatting)
#
# "smart" is the best for general use:
#   • Copying a command: "ls -la " → "ls -la" (trailing space removed)
#   • Copying code mid-line: preserves all spaces
strip_trailing_spaces      smart

# ══════════════════════════════════════════════════════════════════════════════
# § 04  URL DETECTION & HANDLING
# ══════════════════════════════════════════════════════════════════════════════

# ── Enable URL detection ──────────────────────────────────────────────────────
# Kitty scans terminal output for URL patterns.
# When detected, hovering shows an underline; clicking opens the URL.
#
# yes = Enable URL detection (recommended — essential for modern terminal use)
# no  = Disable (pure text terminal — use hints kitten instead)
detect_urls                yes

# ── URL schemes ───────────────────────────────────────────────────────────────
# Which URL prefixes Kitty recognizes as clickable URLs.
# Extended beyond defaults to include developer-relevant schemes.
#
# Standard:  http https ftp ftps
# Developer: file:// (local files), git:// (repos), ssh:// (servers)
#            sftp:// (file transfer), kitty:// (Kitty protocol)
#            gemini:// (Gemini protocol), irc:// ircs:// (IRC)
#            mailto: (email), news: (NNTP)
url_prefixes               file ftp ftps gemini git http https \
                           irc ircs kitty mailto news sftp ssh

# ── URL excluded characters ───────────────────────────────────────────────────
# Characters that break URL detection (treated as URL terminators).
# Empty string = no exclusions (Kitty uses its built-in heuristics).
# Common additions: trailing punctuation that appears after URLs in text.
url_excluded_characters    ""

# ── URL underline color ───────────────────────────────────────────────────────
# Color of the underline shown when hovering over a detected URL.
# [INJECTED] by ASH theme engine — Catppuccin Mocha blue.
url_color                  #89b4fa

# ── URL underline style ───────────────────────────────────────────────────────
# Visual style of the URL hover underline.
# none:         No underline (not recommended — URLs invisible)
# single:       Thin single underline (minimal)
# double:       Double underline (high visibility)
# curly:        Wavy curly underline (modern, distinct from selection)
# dotted:       Dotted underline (subtle)
# dashed:       Dashed underline
#
# "curly" is strongly recommended:
#   • Visually distinct from selection underlines
#   • Matches VS Code / modern editor URL styling
#   • Easily distinguishable even at small font sizes
url_style                  curly

# ── Show hyperlink targets ────────────────────────────────────────────────────
# Display the target URL in the terminal status area when hovering.
# yes = Show URL in a floating tooltip / status bar area.
# no  = No URL preview (hover underline only).
#
# Useful for verifying URLs before clicking (security-conscious behavior).
show_hyperlink_targets     yes

# ── Open URL program ──────────────────────────────────────────────────────────
# The program used to open URLs when clicked.
# default  = Use xdg-open (follows system default browser)
# firefox  = Always open with Firefox
# chromium = Always open with Chromium
# wl-copy  = Copy URL to clipboard instead of opening
#
# "default" (xdg-open) is recommended — respects user's browser preference.
open_url_with              default

# ══════════════════════════════════════════════════════════════════════════════
# § 05  POINTER SHAPES
# ══════════════════════════════════════════════════════════════════════════════
# Kitty dynamically changes the cursor shape based on what's under it.
# These are controlled automatically — no configuration options exist
# beyond pointer_shape_when_grabbed and pointer_shape_when_dragging (§ 01).
#
# Automatic pointer shape behavior:
#   Over text content:    beam (I-beam) — signals text selection available
#   Over a hyperlink:     hand — signals clickable URL
#   Over window border:   resize — signals resize available
#   Application grabbed:  @pointer_shape_when_grabbed (arrow)
#   During drag:          @pointer_shape_when_dragging (beam)
#   Over scrollbar:       default arrow
#
# Wayland note:
#   Cursor shapes use the libwayland cursor protocol.
#   The cursor theme is set by Hyprland (XCURSOR_THEME env var).
#   ASH sets: XCURSOR_THEME=Bibata-Modern-Classic in environment.d/

# ══════════════════════════════════════════════════════════════════════════════
# § 06  MOUSE BUTTON MAP — SINGLE CLICK
# ══════════════════════════════════════════════════════════════════════════════
# Syntax: mouse_map <button> <event> <modes> <action>
#
# <button>  : left, middle, right, b4, b5, b6, b7
#             Can be prefixed with: ctrl, shift, alt, super, kitty_mod
# <event>   : press, release, click, doublepress, triplepress, quadruplepress
# <modes>   : grabbed (app has mouse grab), ungrabbed (normal), or both
# <action>  : Kitty action or no-op

# ── Left click ────────────────────────────────────────────────────────────────
# Standard left click: move cursor position + start selection
map left              click ungrabbed mouse_handle_click selection link

# Shift+left click: extend current selection
map shift+left        press ungrabbed mouse_selection extend

# ── Middle click ─────────────────────────────────────────────────────────────
# Middle click: paste from PRIMARY selection (X11 convention, works on Wayland)
map middle            release ungrabbed paste_from_selection

# Ctrl+middle click: paste from clipboard instead of primary
map ctrl+middle       release ungrabbed paste_from_clipboard

# ── Right click ───────────────────────────────────────────────────────────────
# Right click: open context menu (via kitten — see § 14)
map right             press ungrabbed mouse_handle_click link

# Shift+right click: open extended context menu
map shift+right       press ungrabbed kitten hints --type url --program default

# ── Extra buttons (back/forward on gaming mice) ───────────────────────────────
# Button 4 (back button): scroll up one page
map b4                press ungrabbed scroll_page_up

# Button 5 (forward button): scroll down one page
map b5                press ungrabbed scroll_page_down

# ── Alt+left click: open URL under cursor without leaving keyboard focus ───────
map alt+left          click ungrabbed mouse_handle_click link

# ── Ctrl+left click: open URL (explicit, always triggers URL open) ─────────────
map ctrl+left         release grabbed,ungrabbed mouse_handle_click link

# ── Super+left click: open path with yazi file manager ────────────────────────
map super+left        release ungrabbed kitten hints --type path --program yazi

# ══════════════════════════════════════════════════════════════════════════════
# § 07  MOUSE BUTTON MAP — DOUBLE CLICK
# ══════════════════════════════════════════════════════════════════════════════

# ── Double left click: select word ────────────────────────────────────────────
# Uses the word boundary regex from § 02.
# Essential for quickly selecting file paths, variable names, URLs, etc.
map left              doublepress ungrabbed mouse_selection word

# ── Double Shift+left click: extend word selection ────────────────────────────
map shift+left        doublepress ungrabbed mouse_selection word

# ── Double Ctrl+left click: select between matching brackets/quotes ────────────
# No direct Kitty action — use hints kitten instead.

# ── Double middle click: select word + copy to clipboard ──────────────────────
map middle            doublepress ungrabbed mouse_selection word

# ── Double right click: select word at cursor + open URL if URL ───────────────
map right             doublepress ungrabbed mouse_selection word

# ══════════════════════════════════════════════════════════════════════════════
# § 08  MOUSE BUTTON MAP — TRIPLE CLICK
# ══════════════════════════════════════════════════════════════════════════════

# ── Triple left click: select entire line ─────────────────────────────────────
# Selects from the beginning to end of the current line.
# Essential for quickly copying command output, log entries, etc.
map left              triplepress ungrabbed mouse_selection line

# ── Triple Shift+left click: extend line selection ────────────────────────────
map shift+left        triplepress ungrabbed mouse_selection line

# ── Triple middle click: select line + paste to terminal ──────────────────────
# Powerful combo: click selects the line, middle pastes it immediately.
# (Three clicks on left, then middle = select-and-execute pattern)

# ══════════════════════════════════════════════════════════════════════════════
# § 09  MOUSE BUTTON MAP — QUAD CLICK
# ══════════════════════════════════════════════════════════════════════════════

# ── Quad left click: select paragraph (to next blank line) ────────────────────
# Selects the entire "paragraph" (block of text between blank lines).
# Perfect for selecting multi-line commands, function bodies, error blocks.
map left              quadruplepress ungrabbed mouse_selection paragraph

# ── Quad Shift+left click: extend paragraph selection ─────────────────────────
map shift+left        quadruplepress ungrabbed mouse_selection paragraph

# ══════════════════════════════════════════════════════════════════════════════
# § 10  MOUSE BUTTON MAP — PRESS (HELD DOWN)
# ══════════════════════════════════════════════════════════════════════════════
# "press" events fire when the button goes down and is held.
# Used for drag-start operations.

# ── Left press: begin selection drag ─────────────────────────────────────────
map left              press ungrabbed mouse_selection extend

# ── Shift+left press: begin extend-selection drag ─────────────────────────────
# (Standard behavior — shift+press extends from current selection anchor)
map shift+left        press ungrabbed mouse_selection extend

# ══════════════════════════════════════════════════════════════════════════════
# § 11  MOUSE BUTTON MAP — RELEASE
# ══════════════════════════════════════════════════════════════════════════════
# "release" events fire when a mouse button is released.
# Used for actions that should complete when the button is lifted.

# ── Left release: finalize selection + copy if copy_on_select=yes ─────────────
# Handled automatically by Kitty — no explicit mapping needed.

# ── Middle release: paste from primary selection ──────────────────────────────
# (Defined in § 06 — documented here for completeness)

# ── Ctrl+left release: open URL (most reliable timing for URL open) ───────────
map ctrl+left         release grabbed,ungrabbed mouse_handle_click link

# ── Shift+middle release: paste from clipboard ────────────────────────────────
map shift+middle      release ungrabbed paste_from_clipboard

# ══════════════════════════════════════════════════════════════════════════════
# § 12  SCROLL WHEEL BINDINGS
# ══════════════════════════════════════════════════════════════════════════════

# ── Vertical scroll — base speed ─────────────────────────────────────────────
# Controlled by wheel_scroll_multiplier (5.0) and wheel_scroll_min_lines (1)
# These affect ALL scroll wheel events, including the ones mapped below.
# Set in performance.conf: wheel_scroll_multiplier 5.0
wheel_scroll_multiplier    5.0
wheel_scroll_min_lines     1

# ── Touch/trackpad scroll ─────────────────────────────────────────────────────
# Multiplier for continuous scroll events from trackpads.
# 1.0 = normal speed (trackpads send their own velocity already)
# 0.5 = slower (if trackpad scrolling feels too fast in Kitty)
touch_scroll_multiplier    1.0

# ── Default scroll (up/down wheel) ───────────────────────────────────────────
# Default scroll action: scroll_page / scroll_line based on multiplier.
# These are handled by Kitty automatically.
# Explicitly mapping them for clarity + documentation:
map wheel_up          scroll_line_up
map wheel_down        scroll_line_down

# ── Shift+scroll: slow (1 line at a time, ignoring multiplier) ────────────────
# Useful for precise navigation through dense log output.
# Forces exactly 1 line regardless of wheel_scroll_multiplier.
map shift+wheel_up    scroll_line_up
map shift+wheel_down  scroll_line_down

# ══════════════════════════════════════════════════════════════════════════════
# § 13  MODIFIER + SCROLL BINDINGS
# ══════════════════════════════════════════════════════════════════════════════

# ── Ctrl+scroll: page scroll ──────────────────────────────────────────────────
# Hold Ctrl while scrolling for page-level scrolling.
# Great for quickly jumping through long log files or scrollback.
map ctrl+wheel_up     scroll_page_up
map ctrl+wheel_down   scroll_page_down

# ── Alt+scroll: scroll in alternate screen ────────────────────────────────────
# When inside vim/less/man (alternate screen apps), Alt+scroll
# sends the scroll events as arrow key sequences.
# This allows mouse scroll to work inside applications that capture input.
map alt+wheel_up      send_text all \x1b[A\x1b[A\x1b[A
map alt+wheel_down    send_text all \x1b[B\x1b[B\x1b[B

# ── Super+scroll: adjust font size ────────────────────────────────────────────
# Hold Super (Win key) + scroll to zoom font size.
# Most intuitive gesture for non-keyboard font size adjustment.
# Matches browser behavior (Ctrl+scroll in most browsers).
map super+wheel_up    change_font_size all +1.0
map super+wheel_down  change_font_size all -1.0

# ── Ctrl+Alt+scroll: adjust background opacity ────────────────────────────────
# Live-adjust the terminal transparency while running.
# Useful for quickly making the terminal more/less transparent.
map ctrl+alt+wheel_up    set_background_opacity +0.05
map ctrl+alt+wheel_down  set_background_opacity -0.05

# ══════════════════════════════════════════════════════════════════════════════
# § 14  RIGHT-CLICK CONTEXT MENU
# ══════════════════════════════════════════════════════════════════════════════
# Kitty doesn't have a built-in context menu, but we simulate one via
# the hints kitten launched on right-click.
#
# Right-click behavior:
#   On a URL: open URL with xdg-open
#   On text:  show hints for URL/path/word selection
#   Empty:    show a selection hint UI
#
# For a full context menu experience, the ASH ecosystem provides
# a rofi-based context menu kitten. See kittens/hints-kitten.py.

# ── Right click on URL ────────────────────────────────────────────────────────
# The default right-click binding (§ 06) already handles link clicks.
# Additional right-click actions for text selection:

# Shift+right click = copy URL to clipboard (instead of opening)
map shift+right       press ungrabbed \
    kitten hints --type url --program wl-copy

# Alt+right click = open path in yazi
map alt+right         press ungrabbed \
    kitten hints --type path --program yazi

# Ctrl+right click = copy path to clipboard
map ctrl+right        press ungrabbed \
    kitten hints --type path --program wl-copy

# ══════════════════════════════════════════════════════════════════════════════
# § 15  MOUSE IN GRABBED MODE
# ══════════════════════════════════════════════════════════════════════════════
# "grabbed" = an application has captured mouse input (vim, htop, etc.)
# In grabbed mode, Kitty passes most events to the application.
# Only specific modifier+click combos are intercepted by Kitty.

# ── Pass Ctrl+click to application in grabbed mode ────────────────────────────
# (Most apps don't need Ctrl+click — Kitty handles it for URLs)

# ── Allow URL opening even in grabbed mode ────────────────────────────────────
# Kitty_mod+click = always opens URL even if app has mouse grabbed
map kitty_mod+left    release grabbed,ungrabbed mouse_handle_click link

# ── Shift+click to pass through in grabbed mode ───────────────────────────────
# Some apps use shift+click for their own selection extension.
# We let this pass through in grabbed mode.

# ── Escape from grabbed mode ──────────────────────────────────────────────────
# There's no explicit "escape grab" keybind — pressing Escape in the
# application releases the grab. This is application-controlled.

# ══════════════════════════════════════════════════════════════════════════════
# § 16  DRAG BEHAVIOR
# ══════════════════════════════════════════════════════════════════════════════

# ── Text selection drag ───────────────────────────────────────────────────────
# When left-click is held and mouse moves, text selection begins.
# Selection ends when the button is released.
# During drag: cursor shape changes to beam (pointer_shape_when_dragging).
# After release: selected text is auto-copied if copy_on_select=yes.

# ── Drag scroll ───────────────────────────────────────────────────────────────
# If selection drag reaches the top/bottom of the visible area,
# Kitty automatically scrolls the view to extend the selection.
# This is automatic behavior — no configuration needed.

# ── Drag with modifiers ───────────────────────────────────────────────────────
# Shift+drag: extend existing selection from its anchor point.
# Ctrl+drag:  (application specific — passed through to app)
# Alt+drag:   (application specific — passed through to app)

# ── Column selection (block/rectangle select) ─────────────────────────────────
# Kitty supports rectangular block selection via Alt+drag in some modes.
# This is not universally available — depends on the active layout.
# The hints kitten provides a more reliable selection alternative.

# ══════════════════════════════════════════════════════════════════════════════
# § 17  TOUCH & TABLET
# ══════════════════════════════════════════════════════════════════════════════

# ── Touch scroll multiplier ───────────────────────────────────────────────────
# Already set in § 12: touch_scroll_multiplier 1.0
# Trackpad scroll on Wayland is sent as smooth scroll events.
# libinput handles deceleration — Kitty just applies the multiplier.

# ── Touch tap behavior ────────────────────────────────────────────────────────
# Tap-to-click is handled by libinput → Hyprland → Kitty receives left click.
# No additional configuration needed in Kitty for tap-to-click.

# ── Stylus / pen input ────────────────────────────────────────────────────────
# Wayland tablets (Wacom etc.) are presented as pointer devices.
# Kitty treats stylus hover as mouse hover — full URL/hint detection works.
# Pressure sensitivity is not used by Kitty.

# ── Pinch to zoom ─────────────────────────────────────────────────────────────
# Wayland multitouch gestures:
# Pinch in/out → libinput → Hyprland handles (resize window or zoom workspace)
# Kitty does not receive raw pinch gestures in Wayland mode.
# Font size zoom is handled via Super+scroll (§ 13).

# ══════════════════════════════════════════════════════════════════════════════
# § 18  MOUSE PERFORMANCE
# ══════════════════════════════════════════════════════════════════════════════

# ── Mouse event polling ───────────────────────────────────────────────────────
# Kitty processes mouse events at the repaint rate (set in performance.conf).
# Mouse events are batched to avoid excessive repaints.
# No explicit mouse polling configuration — controlled by repaint_delay.

# ── Click debounce ────────────────────────────────────────────────────────────
# The click_interval (§ 02) serves as the debounce threshold.
# Events within this window are counted as multi-click.

# ── Scroll acceleration ───────────────────────────────────────────────────────
# Kitty applies the wheel_scroll_multiplier uniformly.
# No acceleration curve — every tick scrolls the same amount.
# Acceleration (if desired) should be configured in libinput:
#   /etc/libinput/local-overrides.quirks or via Hyprland input settings.

# ── Hardware cursor ───────────────────────────────────────────────────────────
# Wayland compositors (Hyprland) use hardware cursors for zero-latency pointer.
# Kitty requests the cursor shape change via the wayland cursor protocol.
# The actual cursor rendering is done by Hyprland — Kitty has no overhead.

# ══════════════════════════════════════════════════════════════════════════════
# § 19  ACCESSIBILITY MOUSE SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

# ── Mouse trails ──────────────────────────────────────────────────────────────
# Not supported by Kitty — handled at Hyprland/compositor level.
# For pointer trails: use compositor plugins or a11y tools.

# ── Large cursor ──────────────────────────────────────────────────────────────
# Cursor size is controlled by XCURSOR_SIZE env var (set by ASH):
#   ~/.config/environment.d/ash.conf: XCURSOR_SIZE=24
# Larger cursor: set XCURSOR_SIZE=48 for low-vision accessibility.

# ── Sticky keys for mouse modifiers ──────────────────────────────────────────
# Not a Kitty feature — handled by accessibility tools at system level.

# ── Mouse-only navigation ─────────────────────────────────────────────────────
# Tab/window switching via mouse-only:
#   Click on tab bar: switch tabs
#   Click on scrollbar: scroll position
# All navigation is mouse-accessible without requiring keybinds.

# ── Slow double-click for motor impairment ────────────────────────────────────
# Increase click_interval for users with motor control difficulties.
# Comfortable range: 0.8s – 1.5s
# Default: 0.5s
# Motor accessibility: click_interval 1.0
# (Override here if needed — does not affect other users via ASH profiles)

# ══════════════════════════════════════════════════════════════════════════════
# § 20  QUICK REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  ┌──────────────────────────────────────────────────────────────────────────┐
#  │                    KITTY MOUSE QUICK REFERENCE                           │
#  ├────────────────────────────┬─────────────────────────────────────────────┤
#  │  Left click                │ Move cursor / start selection               │
#  │  Left double-click         │ Select word                                 │
#  │  Left triple-click         │ Select line                                 │
#  │  Left quad-click           │ Select paragraph                            │
#  │  Shift+left                │ Extend selection                            │
#  │  Ctrl+left release         │ Open URL under cursor                       │
#  │  Alt+left                  │ Open URL (alternate)                        │
#  │  Super+left                │ Open path in Yazi                           │
#  ├────────────────────────────┼─────────────────────────────────────────────┤
#  │  Middle click              │ Paste from PRIMARY selection                │
#  │  Ctrl+middle               │ Paste from CLIPBOARD                        │
#  │  Shift+middle              │ Paste from CLIPBOARD (alternate)            │
#  ├────────────────────────────┼─────────────────────────────────────────────┤
#  │  Right click               │ Open URL / hint UI                          │
#  │  Shift+right               │ Copy URL to clipboard                       │
#  │  Alt+right                 │ Open path in Yazi                           │
#  │  Ctrl+right                │ Copy path to clipboard                      │
#  ├────────────────────────────┼─────────────────────────────────────────────┤
#  │  Scroll up/down            │ Scroll 5 lines (×multiplier)                │
#  │  Shift+scroll              │ Scroll 1 line (precise)                     │
#  │  Ctrl+scroll               │ Scroll one page                             │
#  │  Alt+scroll                │ Send arrow keys (for apps)                  │
#  │  Super+scroll              │ Zoom font size ±1pt                         │
#  │  Ctrl+Alt+scroll           │ Adjust transparency ±5%                     │
#  ├────────────────────────────┼─────────────────────────────────────────────┤
#  │  Button 4 (back)           │ Scroll page up                              │
#  │  Button 5 (forward)        │ Scroll page down                            │
#  ├────────────────────────────┼─────────────────────────────────────────────┤
#  │  Hover over URL            │ Underline + hand cursor + target preview    │
#  │  Hover over text           │ Beam cursor                                 │
#  │  Mouse idle 3s             │ Cursor auto-hidden                          │
#  └────────────────────────────┴─────────────────────────────────────────────┘
# ══════════════════════════════════════════════════════════════════════════════