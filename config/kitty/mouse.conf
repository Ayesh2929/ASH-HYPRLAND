# Desc    : Complete, ultra-optimized mouse configuration for Kitty terminal.
#           Every mouse interaction is intentional, documented, and designed
#           for maximum productivity in a Wayland/Hyprland environment.
#
#   Design philosophy:
#     • Every mouse button + modifier combination is explicitly mapped
#     • Copy-on-select enabled for X11 PRIMARY compatibility on Wayland
#     • URL detection with smart scheme matching + hover underline
#     • Pointer shape adapts to context (text/URL/grabbed/dragging)
#     • Mouse hiding during keyboard use (zero visual noise)
#     • Click interval tuned for double/triple/quad-click ergonomics
#     • Scroll multipliers calibrated for 60fps smooth scrolling
#     • Alt+scroll for horizontal scrolling (Hyprland compatibility)
#     • Right-click context menu via kitten for URL/path actions
#     • Ctrl+click to open URLs without breaking keyboard focus
#     • All bindings conflict-free with Hyprland mouse grabs
#
#   Wayland-specific notes:
#     • Primary selection (middle-click paste) works via Wayland protocol
#     • Mouse grab state is tracked per-window by Hyprland
#     • Pointer shape uses xdg-desktop-portal-hyprland cursor protocol
#     • Touch scroll events from libinput are handled separately
#
#   Section map:
#     § 01  Mouse hide & cursor behavior
#     § 02  Click timing & selection modes
#     § 03  Copy-on-select & clipboard
