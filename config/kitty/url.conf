# ══════════════════════════════════════════════════════════════════════════════
# § 01  URL DETECTION ENGINE
# ══════════════════════════════════════════════════════════════════════════════

# ── Enable URL detection ──────────────────────────────────────────────────────
# Master switch for Kitty's built-in URL scanner.
# When enabled, Kitty continuously scans terminal output for URL patterns
# and makes them interactive (hoverable, clickable, hintable).
#
# yes = Enable full URL detection (recommended for developer workflows)
# no  = Disable all URL detection (pure text terminal)
#       Use this only if you exclusively use the hints kitten for URLs.
#
# Performance impact: negligible — URL scanning is O(n) per output line,
# runs on a background thread, does not affect render performance.
detect_urls                yes

# ── URL detection regex (Kitty internal) ─────────────────────────────────────
# Kitty uses a built-in regex for URL detection. This cannot be overridden
# directly, but the url_prefixes setting controls which schemes are recognized.
# For custom regex URL detection → use the hints kitten with --type url.
#
# Kitty's built-in URL regex (for reference):
#   (?:[a-zA-Z][a-zA-Z0-9+\-.]*://|www\.)[^\s/$.?#][^\s]*
# This matches:
#   • scheme://... URLs (http://, ftp://, git://, etc.)
#   • www.* URLs (even without scheme prefix)

# ══════════════════════════════════════════════════════════════════════════════
# § 02  URL SCHEME REGISTRY
# ══════════════════════════════════════════════════════════════════════════════

# ── URL prefixes (scheme whitelist) ──────────────────────────────────────────
# Space-separated list of URL schemes that Kitty recognizes.
# Only URLs beginning with these prefixes will be highlighted and made
# interactive. Unknown schemes remain as plain text.
#
# Scheme reference:
#   file     = Local file system (file:///home/user/doc.pdf)
#   ftp      = FTP file transfer (legacy)
#   ftps     = FTP over TLS
#   gemini   = Gemini protocol (privacy-focused web alternative)
#   git      = Git protocol (git://github.com/user/repo)
#   http     = Standard web (unencrypted)
#   https    = Standard web (TLS encrypted) — most common
#   irc      = IRC chat protocol
#   ircs     = IRC over TLS
#   kitty    = Kitty internal protocol (kitty://...)
#   mailto   = Email addresses (mailto:user@example.com)
#   news     = NNTP newsgroups
#   sftp     = Secure FTP (SFTP/SCP style)
#   ssh      = SSH protocol (ssh://user@host:port)
#   magnet   = BitTorrent magnet links
#   data     = Data URIs (data:image/png;base64,...)
#   matrix   = Matrix protocol (matrix:r/room:server.com)
# nntp    = Network News Transfer Protocol
url_prefixes               file ftp ftps gemini git http https \
                           irc ircs kitty mailto magnet \
                           news nntp sftp ssh

# ── URL excluded characters ───────────────────────────────────────────────────
# Characters that terminate URL detection.
# Empty = use Kitty's built-in heuristics (recommended).
#
# Kitty's heuristics already handle:
#   • Trailing punctuation (.,;:!?) that commonly appears after URLs in prose
#   • Matching bracket pairs: ) ] > » when URL is inside brackets
#   • Trailing quotes when URL is inside quoted text
#
# Only add characters here if Kitty's auto-detection incorrectly includes them.
# Common additions:
#   '"  = if quoted URLs with trailing quotes are misdetected
#   )   = if parenthetical URLs are misdetected (Kitty usually handles this)
url_excluded_characters    ""

# ══════════════════════════════════════════════════════════════════════════════
# § 03  URL VISUAL PRESENTATION
# ══════════════════════════════════════════════════════════════════════════════

# ── URL underline style ───────────────────────────────────────────────────────
# The visual style of the URL underline shown when a URL is detected.
# This underline is always visible on detected URLs (not just on hover).
#
# none      = No underline (URLs look like regular text — not recommended)
# single    = Thin straight underline (classic, minimal)
# double    = Two parallel underlines (high visibility, retro look)
# curly     = Wavy/curly underline (modern, distinct from selection)
# dotted    = Dotted underline (subtle, good for dense terminal output)
# dashed    = Dashed underline (between dotted and solid)
#
# Design rationale for "curly":
#   • Matches VS Code and modern IDE hyperlink rendering
#   • Instantly distinguishable from regular text underlines
#   • Visible without hovering — proactive discovery of URLs
#   • The wave shape draws the eye without overwhelming the content
#   • Industry standard for "this text is interactive" indication
url_style                  curly

# ── URL underline color ───────────────────────────────────────────────────────
# The color of the URL underline.
# [INJECTED] by ASH theme engine — updates when theme changes.
#
# Color semantics:
#   Blue (#89b4fa): universally associated with hyperlinks (web standard)
#   The Catppuccin Mocha blue has sufficient contrast on the dark background.
#
# WCAG contrast check (blue #89b4fa on base #1e1e2e):
#   Luminance ratio: 6.2:1 — passes WCAG AA (4.5:1) and nearly AAA (7:1)
url_color                  #89b4fa

# ── Hyperlink target preview ──────────────────────────────────────────────────
# Show the actual URL target in the Kitty status area when hovering.
# This displays the full, untruncated URL in a floating tooltip.
#
# yes = Show URL in status bar / floating tooltip on hover
#       Security benefit: verify URLs before clicking (phishing prevention)
#       UX benefit: see full URL when terminal output shows only domain
# no  = No target preview (underline only)
show_hyperlink_targets     yes

# ══════════════════════════════════════════════════════════════════════════════
# § 04  URL HOVER BEHAVIOR
# ══════════════════════════════════════════════════════════════════════════════
# Hover behavior is controlled by the mouse button mappings in mouse.conf.
# Documented here for the complete URL picture.

# ── Hover detection ───────────────────────────────────────────────────────────
# When the mouse pointer moves over a detected URL:
#   1. Cursor shape changes to "hand" pointer (system cursor)
#   2. URL underline appears/intensifies
#   3. If show_hyperlink_targets=yes: URL shown in status area
#   4. Ctrl+click (or click, per mouse.conf) triggers url_open

# ── Hover delay ───────────────────────────────────────────────────────────────
# Kitty detects URL hover immediately (no delay).
# The cursor shape change and target preview are instant.

# ── Hover area precision ──────────────────────────────────────────────────────
# Kitty uses exact character-cell boundaries for hover detection.
# The entire URL text region is the hover area — no padding required.
# Hover is pixel-precise: if the mouse is on the character, it's hovering.

# ══════════════════════════════════════════════════════════════════════════════
# § 05  URL CLICK ACTIONS
# ══════════════════════════════════════════════════════════════════════════════
# Click-to-open behavior is configured in mouse.conf.
# Full mapping documented here for the URL interaction picture.

# ── Left click on URL ─────────────────────────────────────────────────────────
# Default left-click behavior: combined selection/link handler
# • On plain text: start text selection
# • On URL: open URL with open_url_with program
# Configured in mouse.conf:
#   map left click ungrabbed mouse_handle_click selection link

# ── Ctrl+Left click on URL ────────────────────────────────────────────────────
# Always open URL even when in grabbed mode (vim, etc.)
# Configured in mouse.conf:
#   map ctrl+left release grabbed,ungrabbed mouse_handle_click link

# ── Alt+Left click on URL ─────────────────────────────────────────────────────
# Open URL without affecting current focus/cursor position
# Configured in mouse.conf:
#   map alt+left click ungrabbed mouse_handle_click link

# ── Right click on URL ────────────────────────────────────────────────────────
# Show hints/options for the URL
# Configured in mouse.conf:
#   map right press ungrabbed mouse_handle_click link

# ── Shift+Right click on URL ──────────────────────────────────────────────────
# Copy URL to clipboard instead of opening
# Configured in mouse.conf:
#   map shift+right press ungrabbed kitten hints --type url --program wl-copy

# ══════════════════════════════════════════════════════════════════════════════
# § 06  URL OPENER PROGRAMS
# ══════════════════════════════════════════════════════════════════════════════

# ── Primary URL opener ────────────────────────────────────────────────────────
# The program used to open URLs when clicked.
#
# default  = Use xdg-open (respects system-wide default application settings)
#            xdg-open routes URLs to the correct application based on mimetype:
#              http/https → default browser (Firefox, Chromium, etc.)
#              file://    → file manager or appropriate app
#              mailto:    → default email client
#              magnet:    → torrent client
#
# Specific program examples:
#   firefox              = Always open with Firefox
#   chromium             = Always open with Chromium
#   brave                = Always open with Brave
#   qutebrowser          = Keyboard-driven browser
#   "wl-copy && false"   = Copy URL, don't open (useful for custom routing)
#
# ASH recommendation: "default" (xdg-open) + configure mimetypes via:
#   xdg-mime default firefox.desktop x-scheme-handler/https
#   xdg-mime default firefox.desktop x-scheme-handler/http
open_url_with              default

# ── Scheme-specific URL routing (via xdg-mime) ────────────────────────────────
# Configure which application handles each URL scheme system-wide.
# These are xdg-open settings — run once to configure (not Kitty config):
#
#   xdg-mime default firefox.desktop x-scheme-handler/http
#   xdg-mime default firefox.desktop x-scheme-handler/https
#   xdg-mime default thunderbird.desktop x-scheme-handler/mailto
#   xdg-mime default org.qbittorrent.qBittorrent.desktop x-scheme-handler/magnet
#   xdg-mime default org.gnome.Nautilus.desktop x-scheme-handler/file
#   xdg-mime default gitg.desktop x-scheme-handler/git
#   xdg-mime default kitty.desktop x-scheme-handler/ssh
#
# ASH sets these via: ash setup-xdg-mimetypes

# ══════════════════════════════════════════════════════════════════════════════
# § 07  OSC 8 HYPERLINK PROTOCOL
# ══════════════════════════════════════════════════════════════════════════════
# OSC 8 is a terminal protocol that allows applications to embed semantic
# hyperlinks in their output — separate from the displayed text.
#
# Protocol format:
#   ESC ] 8 ; params ; uri ST   (start hyperlink)
#   ESC ] 8 ; ; ST              (end hyperlink)
#
# Kitty fully supports OSC 8.
# When an application outputs OSC 8 hyperlinks:
#   • The displayed text is clickable (even if not URL-shaped)
#   • The hidden URI is opened on click
#   • The url_style underline is applied to the linked text
#   • The url_color is used for the underline
#
# Applications that emit OSC 8:
#   • bat          → file paths, line references
#   • delta        → file diffs, commit references
#   • lsd          → directory entries
#   • eza          → directory entries (with --hyperlink)
#   • cargo        → error file locations
#   • gcc/clang    → error file locations (with -fansi-escape-codes)
#   • git diff     → file paths (with color.diff.new/old)
#   • man pages    → cross-references
#   • Python tracebacks → file:line references
#   • pytest       → failed test file locations
#   • ripgrep      → search result file references
#
# No additional configuration needed for OSC 8 — it works automatically.

# ── Enable OSC 8 in eza (example application config) ─────────────────────────
# Add to fish conf.d:
#   alias ls='eza --hyperlink'
# This makes file listings in Kitty clickable — clicking opens the file.

# ── OSC 8 in bat ─────────────────────────────────────────────────────────────
# bat automatically emits OSC 8 for file references in its output.
# No additional configuration needed.

# ══════════════════════════════════════════════════════════════════════════════
# § 08  HINTS KITTEN URL MODE
# ══════════════════════════════════════════════════════════════════════════════
# The hints kitten provides keyboard-driven URL selection — overlaying
# letter labels on all detected URLs for instant keyboard access.
# This is the preferred method for URL interaction in keyboard-first workflows.
#
# Keybinds (from keybinds.conf):
#   kitty_mod+e       = Open URL in browser (default action)
#   kitty_mod+shift+e = Copy URL to clipboard
#   kitty_mod+alt+e   = Open URL with hash-type detection
#   kitty_mod+ctrl+e  = Open URL with Firefox specifically
#
# The hints kitten:
#   1. Scans visible terminal + scrollback for URL patterns
#   2. Overlays single/double letter labels on each URL
#   3. User types label → action performed immediately
#   4. Esc = cancel without action

# ── Hints kitten URL configuration ───────────────────────────────────────────
# The hints kitten is configured via command-line flags (in keybinds.conf).
# Default URL detection by hints kitten:
#   --type url       = Match URLs using Kitty's URL regex
#   --type hyperlink = Match OSC 8 hyperlinks specifically
#   --type path      = Match file paths (separate from URLs)
#
# Combining URL and path detection:
# Use two keybinds: one for URLs, one for paths (defined in keybinds.conf).
# The kitten handles them with different actions.

# ── Custom hints regex for developer URLs ────────────────────────────────────
# For matching non-standard URL patterns in development output:
#
# GitHub PR/Issue references (e.g., "See #1234"):
#   kitten hints --regex '\bgh-[0-9]+\b|#[0-9]{2,6}\b' \
#     --program "bash -c 'xdg-open https://github.com/OWNER/REPO/issues/\${0##*#}'"
#
# Docker registry references:
#   kitten hints --regex '[a-z0-9./:-]+:[a-z0-9.-]+@sha256:[a-f0-9]{64}'
#
# IP:port combinations:
#   kitten hints --type ip

# ══════════════════════════════════════════════════════════════════════════════
# § 09  URL COPY & CLIPBOARD
# ══════════════════════════════════════════════════════════════════════════════
# Multiple methods for copying URLs to clipboard.

# ── Copy URL on hover (right-click) ──────────────────────────────────────────
# Shift+Right-click copies URL to wl-clipboard (Wayland)
# Configured in mouse.conf § 14:
#   map shift+right press ungrabbed kitten hints --type url --program wl-copy

# ── Copy URL via hints kitten ─────────────────────────────────────────────────
# kitty_mod+shift+e = overlay hint labels, copy selected URL
# Configured in keybinds.conf § 10:
#   map kitty_mod+shift+e kitten hints --type hyperlink --program @
#   (@ means: pass to clipboard)

# ── Pass URL to external program ──────────────────────────────────────────────
# Configured in mouse.conf § 06:
#   map kitty_mod+o pass_selection_to_program wl-copy
#   (copies current text selection to wl-clipboard)

# ── URL copy format options ───────────────────────────────────────────────────
# When copying URLs, you can choose the format:
#   Raw URL:     wl-copy (just the URL text)
#   Markdown:    bash -c "echo \"[link](${URL})\" | wl-copy"
#   HTML:        bash -c "echo \"<a href='${URL}'>${URL}</a>\" | wl-copy"
# These are implemented as custom hints kitten programs:
#   kitten hints --type url --program 'bash -c "echo \"[$0]($0)\" | wl-copy"'

# ══════════════════════════════════════════════════════════════════════════════
# § 10  DEVELOPER URL PATTERNS
# ══════════════════════════════════════════════════════════════════════════════
# Special URL patterns common in development workflows.
# These are detected by Kitty's URL scanner (via url_prefixes)
# or by custom hints kitten regex patterns.

# ── File paths as clickable links ─────────────────────────────────────────────
# File paths (not file:// URIs) are detected by the hints kitten path type.
# Kitty's URL scanner handles file:// URIs only.
#
# Common developer file path patterns in terminal output:
#   /absolute/path/to/file.py:42:3     (error with line:column)
#   ./relative/path/to/file.rs:100     (rust error)
#   file:///home/user/project/main.go  (Go error with file:// prefix)
#   ~/Documents/notes.md               (tilde-expanded paths)
#
# For path detection: use kitty_mod+p (hints --type path in keybinds.conf)
# For URL detection: use kitty_mod+e (hints --type url)

# ── localhost URLs ────────────────────────────────────────────────────────────
# URLs like http://localhost:3000, http://127.0.0.1:8080 are detected by
# the standard http:// scheme. No additional configuration needed.
#
# Common localhost patterns detected automatically:
#   http://localhost:3000          (React/Next.js dev server)
#   http://127.0.0.1:5173          (Vite dev server)
#   http://0.0.0.0:8080            (backend server)
#   http://[::1]:8080              (IPv6 localhost)

# ── Git remote URLs ───────────────────────────────────────────────────────────
# Git outputs URLs in various formats — all detected:
#   https://github.com/user/repo.git   (HTTPS clone URL)
#   git@github.com:user/repo.git       (SSH git URL — NOT detected as URL)
#   git://github.com/user/repo         (git:// scheme — detected)
#
# Note: git@ SSH URLs (user@host:path format) are NOT detected as URLs
# because they don't match the scheme:// pattern.
# Use hints kitten with --type path for these.

# ── Docker registry URLs ──────────────────────────────────────────────────────
# Docker image references like "docker.io/library/nginx:latest" are
# NOT URLs but look similar. Use hints kitten with custom regex for these.

# ── Python package index ──────────────────────────────────────────────────────
# pip output includes https://pypi.org URLs — detected automatically.
# Example: "Downloading https://files.pythonhosted.org/packages/..."

# ── Cargo/crates.io URLs ──────────────────────────────────────────────────────
# Cargo outputs https://crates.io URLs — detected automatically.
# Example: "Downloading https://static.crates.io/crates/..."

# ── Documentation URLs ────────────────────────────────────────────────────────
# Man page references (man:// scheme) are NOT standard — use the hints
# kitten with custom regex to detect "man topic(section)" patterns.

# ══════════════════════════════════════════════════════════════════════════════
# § 11  URL EXCLUSIONS & FILTERS
# ══════════════════════════════════════════════════════════════════════════════

# ── Exclude specific domains ──────────────────────────────────────────────────
# Not natively supported in Kitty URL config.
# Workaround: use the hints kitten with custom --regex instead of
# the built-in detect_urls for precise URL pattern control.

# ── Exclude shortened URLs ────────────────────────────────────────────────────
# Security consideration: bit.ly, t.co, etc. are detected as URLs.
# The show_hyperlink_targets=yes helps here — you see the full URL.
# For automatic URL expansion, use a browser extension instead.

# ── Exclude data: URIs ────────────────────────────────────────────────────────
# data: URIs can be very long (base64-encoded images, etc.).
# Currently included in url_prefixes.
# Remove "data" from url_prefixes above if they cause visual clutter.

# ══════════════════════════════════════════════════════════════════════════════
# § 12  MULTI-SCHEME ROUTING
# ══════════════════════════════════════════════════════════════════════════════
# Route different URL schemes to different applications.
# Implemented via xdg-mime system settings, not Kitty config.

# ── Routing table (xdg-mime recommendations) ──────────────────────────────────
# Scheme       → Application              → Command
# ─────────────────────────────────────────────────────────────────────────────
# http/https   → Firefox                 → xdg-mime default firefox.desktop
# file://      → Yazi file manager       → xdg-mime default yazi.desktop
# mailto:      → Thunderbird             → xdg-mime default thunderbird.desktop
# magnet:      → qBittorrent            → xdg-mime default qbittorrent.desktop
# ssh://       → Kitty SSH kitten        → custom handler via xdg-open wrapper
# git://       → Browser (GitHub page)   → xdg-mime default firefox.desktop
# gemini://    → Lagrange browser        → xdg-mime default lagrange.desktop
# irc://       → WeeChat                 → custom xdg wrapper
# sftp://      → Thunar/Nautilus         → xdg-mime default thunar.desktop
# ─────────────────────────────────────────────────────────────────────────────

# ── Custom URL handler script ─────────────────────────────────────────────────
# For maximum routing control, create ~/.local/bin/url-handler:
# #!/usr/bin/env bash
# URL="$1"
# case "$URL" in
#     ssh://*)
#         kitty kitten ssh "${URL#ssh://}"
#         ;;
#     git@*|git://*)
#         # Convert to HTTPS and open in browser
#         HTTPS="${URL/git@github.com:/https:\/\/github.com\/}"
#         HTTPS="${HTTPS%.git}"
#         firefox "$HTTPS"
#         ;;
#     http://localhost:*|http://127.0.0.1:*)
#         # Open localhost in dedicated browser profile
#         firefox --new-window "$URL"
#         ;;
#     *)
#         xdg-open "$URL"
#         ;;
# esac
#
# Then set: open_url_with url-handler

# ══════════════════════════════════════════════════════════════════════════════
# § 13  URL HISTORY & LOGGING
# ══════════════════════════════════════════════════════════════════════════════
# Kitty does not log clicked URLs by default.
# For URL history, use browser history or implement a wrapper.

# ── URL visit logging (optional, via open_url_with wrapper) ───────────────────
# Create ~/.local/bin/url-handler-logged:
# #!/usr/bin/env bash
# URL="$1"
# echo "$(date -Iseconds) $URL" >> ~/.local/share/ash/url-history.log
# xdg-open "$URL"
#
# Then: open_url_with url-handler-logged
# View history: tail -f ~/.local/share/ash/url-history.log
# Search history: grep 'github' ~/.local/share/ash/url-history.log

# ── Recent URLs via hints ─────────────────────────────────────────────────────
# The hints kitten always operates on current visible content + scrollback.
# For persistent URL history across sessions: use the ASH notes system or
# a dedicated URL manager application.

# ══════════════════════════════════════════════════════════════════════════════
# § 14  SECURITY CONSIDERATIONS
# ══════════════════════════════════════════════════════════════════════════════

# ── URL preview before opening ────────────────────────────────────────────────
# show_hyperlink_targets=yes (§ 03) helps verify URLs before clicking.
# Always inspect the URL in the preview before clicking suspicious links.

# ── OSC 8 security ───────────────────────────────────────────────────────────
# OSC 8 allows applications to set arbitrary hidden URLs.
# A malicious application could set an OSC 8 URL pointing to a dangerous target
# while displaying innocent-looking text.
#
# Mitigation: show_hyperlink_targets=yes reveals the actual URL on hover.
# The URL is visible in the status bar before you click.
# This matches browser behavior (status bar shows destination on hover).

# ── URL scheme allowlist ──────────────────────────────────────────────────────
# The url_prefixes setting effectively allowlists URL schemes.
# Unknown schemes are not made interactive → cannot be accidentally opened.
# This is a defense-in-depth measure.

# ── javascript: URLs ─────────────────────────────────────────────────────────
# "javascript:" is intentionally NOT in url_prefixes.
# XSS-style payloads cannot be triggered via URL clicking in Kitty.
# JavaScript execution only happens in browsers (not via xdg-open for js:).

# ── Local file access ─────────────────────────────────────────────────────────
# file:// URLs are in url_prefixes and will open via xdg-open.
# file:///etc/passwd → xdg-open will use the configured file manager
# or text editor — not execute arbitrary code.
# Risk level: LOW (same as clicking a file link in any application).

# ── Clipboard security ────────────────────────────────────────────────────────
# When copy_on_select=yes (mouse.conf), selected URLs auto-copy.
# This is the same security risk as any clipboard operation.
# Clipboard managers may log URLs — be aware in sensitive environments.
# ASH privacy mode disables clipboard manager (cliphist) automatically.

# ══════════════════════════════════════════════════════════════════════════════
# § 15  URL KEYBIND REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
# All URL-related keybinds defined in keybinds.conf § 10.
# Reproduced here for the complete URL picture.

# kitty_mod+e              = hints --type url → open in browser
# kitty_mod+shift+e        = hints --type hyperlink --program @ → copy URL
# kitty_mod+y              = hints --type line --program @ → copy line
# kitty_mod+alt+e          = hints --type hash --program @ → copy hash
# kitty_mod+ctrl+e         = hints --type url --program firefox → Firefox
# kitty_mod+ctrl+p         = hints --type path --program yazi → Yazi

# ── Mouse URL shortcuts ───────────────────────────────────────────────────────
# Left click on URL         → open with xdg-open
# Ctrl+Left click on URL    → open with xdg-open (even in grabbed mode)
# Shift+Right on URL        → copy URL to wl-clipboard
# Alt+Right on URL          → open path in Yazi
# Ctrl+Right on URL         → copy path to wl-clipboard

# ══════════════════════════════════════════════════════════════════════════════
# § 16  TESTING & DEBUGGING
# ══════════════════════════════════════════════════════════════════════════════

# ── Test URL detection ────────────────────────────────────────────────────────
# Run in Kitty terminal to verify URL detection:
#   echo "Test: https://example.com/path?query=value#anchor"
#   echo "Test: file:///home/user/document.pdf"
#   echo "Test: mailto:user@example.com"
#   echo "Test: git://github.com/user/repo.git"
#   echo "Test: ssh://user@host.example.com:22"
#   echo "Test: ftp://files.example.com/download.tar.gz"
#
# Expected: each URL shows curly blue underline and becomes clickable.

# ── Test OSC 8 hyperlinks ─────────────────────────────────────────────────────
# Test semantic hyperlinks:
#   printf '\033]8;;https://example.com\033\\Click here\033]8;;\033\\\n'
# Expected: "Click here" text shows url_style underline and is clickable.
# Expected URL in target preview: https://example.com

# ── Test hints kitten ─────────────────────────────────────────────────────────
# Print multiple URLs and test the hints overlay:
#   cat << 'EOF'
#   Visit https://github.com/ash-dotfiles
#   Or check https://hyprland.org/
#   Documentation at https://wiki.hyprland.org/
#   EOF
# Then press kitty_mod+e — should see labeled hints over each URL.

# ── Debug URL detection ───────────────────────────────────────────────────────
# If a URL is not detected, check:
# 1. Is the scheme in url_prefixes?
# 2. Is there a space or special char breaking the URL?
# 3. Try: kitty --debug-rendering to see what Kitty sees

# ══════════════════════════════════════════════════════════════════════════════
# § 17  QUICK REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  ┌──────────────────────────────────────────────────────────────────────────┐
#  │                      KITTY URL QUICK REFERENCE                           │
#  ├────────────────────────────────────┬─────────────────────────────────────┤
#  │  Setting                           │  Value                              │
#  ├────────────────────────────────────┼─────────────────────────────────────┤
#  │  detect_urls                       │  yes (always on)                    │
#  │  url_style                         │  curly (wavy underline)             │
#  │  url_color                         │  #89b4fa (Catppuccin blue)          │
#  │  show_hyperlink_targets            │  yes (preview on hover)             │
#  │  open_url_with                     │  default (xdg-open)                 │
#  │  url_prefixes                      │  14 schemes (http/https/git/ssh/…)  │
#  │  url_excluded_characters           │  "" (auto-heuristics)               │
#  ├────────────────────────────────────┴─────────────────────────────────────┤
#  │  KEYBOARD:                                                               │
#  │  kitty_mod+e         Open URL in browser (hints overlay)                 │
#  │  kitty_mod+shift+e   Copy URL to clipboard                               │
#  │  kitty_mod+ctrl+e    Open URL in Firefox specifically                    │
#  │  kitty_mod+ctrl+p    Open path in Yazi                                   │
#  ├──────────────────────────────────────────────────────────────────────────┤
#  │  MOUSE:                                                                  │
#  │  Click on URL        Open with xdg-open                                  │
#  │  Ctrl+Click URL      Open (even in grabbed mode)                         │
#  │  Shift+Right URL     Copy URL to clipboard                               │
#  │  Hover over URL      Show underline + target preview + hand cursor       │
#  └──────────────────────────────────────────────────────────────────────────┘
# ══════════════════════════════════════════════════════════════════════════════