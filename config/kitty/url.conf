#           Wayland/Hyprland developer workflow.
#
#   URL system architecture:
#     Layer 1 — Detection    : regex-based URL scanning of terminal output
#     Layer 2 — Presentation : hover underline, color, target preview
#     Layer 3 — Interaction  : click → open, copy, hint-select
#     Layer 4 — Programs     : per-scheme opener routing
#     Layer 5 — Hints kitten : keyboard-driven URL selection overlay
#     Layer 6 — OSC 8        : hyperlink protocol (semantic links)
#
#   URL types handled:
#     • Standard web URLs    (http/https)
#     • File URIs            (file://)
#     • Git protocols        (git://, git+https://)
#     • SSH targets          (ssh://, user@host:path)
#     • Developer protocols  (sftp://, ftp://, ftps://)
#     • Email addresses      (mailto:)
#     • IRC channels         (irc://, ircs://)
#     • Gemini protocol      (gemini://)
#     • Kitty protocol       (kitty://)
#     • News / NNTP          (news:, nntp://)
