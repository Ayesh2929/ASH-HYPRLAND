#   Geometry philosophy:
#     • Initial size: 220c×50r = wide enough for side-by-side code review
#     • Padding: 12px horizontal, 16px vertical = optical centering
#     • Opacity: 0.88 = glass effect without readability compromise
#     • Blur radius: 32px (configured in Hyprland) = depth without noise
#     • Dim: 0.80 = clear active window, readable background windows
#
#   Multi-window philosophy:
#     • Active border: accent color (mauve) = instant focus recognition
#     • Inactive border: surface0 = present but not competing
#     • Bell border: red = urgent without audio
#     • Border width: 2px = visible but not thick
#     • Window gap: 4px = spacing without wasted space
