# ══════════════════════════════════════════════════════════════════════════════
# § 01  WINDOW GEOMETRY
# ══════════════════════════════════════════════════════════════════════════════

# ── Initial window size ───────────────────────────────────────────────────────
# The size of the OS window when Kitty starts.
# Format: Nc (columns) or Np (pixels) for width
#         Nr (rows)    or Np (pixels) for height
#
# Design rationale for 220c × 50r:
#   220 columns:
#     • Standard 80c code: fits TWO side-by-side split panes with margins
#     • Wide enough for: nvim split + terminal + git status (3-way split)
#     • At 12.5pt JetBrains Mono: ~1560px wide (fits 1920px monitors)
#     • grep/find output: long file paths don't truncate
#
#   50 rows:
#     • At 12.5pt: ~750px tall (leaves room for waybar top bar)
#     • Shows ~50 lines of code without scrolling
#     • Python traceback: fits most stack traces without scrolling
#     • git log --oneline: shows ~50 recent commits
#
# Adjust for your monitor:
#   4K (3840×2160): initial_window_width 280c / initial_window_height 60r
#   1440p (2560×1440): initial_window_width 240c / initial_window_height 55r
#   1080p (1920×1080): 220c × 50r (current — optimal for 1080p)
#   Laptop 1366×768: initial_window_width 140c / initial_window_height 35r
initial_window_width       220c
initial_window_height      50r

# ── Remember window size ──────────────────────────────────────────────────────
# Restore the window to its last size when opening a new OS window.
# yes = Kitty saves window size on close and restores it on next launch.
# no  = Always use initial_window_width × initial_window_height.
#
# "yes" is more ergonomic:
#   • If you resized to fill half the screen, next window starts the same
#   • Session continuity — your workflow size is preserved
#   • Override per-launch: kitty --override initial_window_width=120c
remember_window_size       yes

# ══════════════════════════════════════════════════════════════════════════════
# § 02  WINDOW PADDING
# ══════════════════════════════════════════════════════════════════════════════

# ── Inner padding ─────────────────────────────────────────────────────────────
# Space (px) between the terminal content and the window edge.
# Format: single value (all sides), or "horizontal vertical",
#         or "top right bottom left" (CSS clockwise)
#
# Design rationale for "12 16":
#   12px horizontal: prevents text from touching the side borders
#                    Enough to visually separate content from border
#                    Maintains readability when window is tiled to edge
#
#   16px vertical:   Slightly more than horizontal for optical centering
#                    Human eyes perceive equal padding as bottom-heavy
#                    Extra vertical space improves line readability
#                    With tabs bar: 16px below tab bar before content
#
# Alternative values:
#   "8 10"   = tighter (maximizes content area — good for small screens)
#   "16 20"  = generous (more breathing room — good for large displays)
#   "0"      = no padding (maximum content, minimal visual comfort)
#   "20 24"  = very generous (excellent for screencasting / presentations)
window_padding_width       12 16

# ── Padding color ─────────────────────────────────────────────────────────────
# The color of the padding area around terminal content.
# background  = Use the terminal background color (seamless look) ← recommended
# A hex color = Custom padding color (creates a "letterbox" effect)
#
# "background" creates a uniform colored border that looks intentional.
# Particularly good with opacity < 1.0 — the padding and content blend.

# ══════════════════════════════════════════════════════════════════════════════
# § 03  WINDOW MARGINS
# ══════════════════════════════════════════════════════════════════════════════

# ── Outer margin ─────────────────────────────────────────────────────────────
# Space (px) outside the window border — between adjacent Kitty windows.
# This affects the spacing when multiple windows are open in a tab (layouts).
#
# 0px = Windows touch each other (border provides visual separation)
# 4px = Small gap between windows (floating appearance, more spacious)
# 8px = Clear separation (tiling feels more desktop-like)
#
# Design choice: 0 (zero margin)
#   • Border color already provides clear window separation
#   • Zero margin maximizes usable terminal content area
#   • Hyprland gaps (configured separately) provide OS-level window spacing
#   • The border is enough visual separator at 2px width
window_margin_width        0

# ── Single window margin ──────────────────────────────────────────────────────
# When only ONE window is in a tab (no splits), use a different margin.
# This allows a clean single-window look with a different aesthetic.
# 0 = same as window_margin_width (consistent)
# N = special margin for single-window tabs
single_window_margin_width  0

# ══════════════════════════════════════════════════════════════════════════════
# § 04  BACKGROUND OPACITY & BLUR
# ══════════════════════════════════════════════════════════════════════════════

# ── Background opacity ────────────────────────────────────────────────────────
# Terminal background translucency: 0.0 = fully transparent, 1.0 = opaque.
#
# The opacity affects ONLY the terminal background color.
# Text, UI elements, and borders remain fully opaque (RGBA compositing).
# This creates a "glass" effect where background apps show through the bg.
#
# Design rationale for 0.88 (88% opaque, 12% transparent):
#   • 12% transparency: just enough to feel "glass" without losing focus
#   • 88% opacity: text remains fully readable (no contrast degradation)
#   • WCAG compliance: at 0.88 opacity, Catppuccin contrast ratios still pass
#   • With Hyprland blur=32: wallpaper details blur into a soft backdrop
#   • Not so transparent that it distracts during long coding sessions
#
# Tuning guide:
#   0.95 = very subtle (safe for all backgrounds)
#   0.88 = noticeable glass (recommended — current)
#   0.80 = strong glass (works with muted/dark wallpapers only)
#   0.70 = heavy glass (text may struggle with complex wallpapers)
#   0.50 = very heavy glass (requires careful wallpaper selection)
#
# ASH mode adjustments:
#   focus mode:   opacity 0.95 (less distraction from background)
#   cinema mode:  opacity 1.00 (no glass during video playback)
#   game mode:    opacity 1.00 (maximum performance, no compositor blur)
#   battery mode: opacity 1.00 (no blur overhead → battery savings)
background_opacity         0.88

# ── Background image ──────────────────────────────────────────────────────────
# Optional: Set a background image for the terminal (behind the terminal text).
# This is SEPARATE from the wallpaper — it's inside the Kitty window.
# Empty = no background image (use OS/Hyprland wallpaper through opacity)
# Path  = Image file to display as terminal background
background_image           none

# ── Background image layout ───────────────────────────────────────────────────
# Only relevant if background_image is set.
# tiled | mirrored | scaled | clamped | centered | mirror-tiled
background_image_layout    scaled

# ── Background image linear ───────────────────────────────────────────────────
# yes = Use linear interpolation for background image scaling (smoother)
# no  = Use nearest-neighbor (sharper at native resolution)
background_image_linear    yes

# ── Background tint ───────────────────────────────────────────────────────────
# Blend the background image with the background color.
# 0.0 = background image only (no tint)
# 0.5 = 50% image + 50% background color
# 1.0 = background color only (image invisible)
# Useful for darkening a bright background image.
background_tint            0.0

# ── Background tint gaps ──────────────────────────────────────────────────────
# Apply the background_tint to the areas outside the terminal content
# (padding and margins) but NOT to the content area.
# 0.0 = no tint on gaps
# 1.0 = full tint on gaps only (frame effect)
background_tint_gaps       0.0

# ── Background blur ───────────────────────────────────────────────────────────
# Built-in blur applied to content visible behind the terminal background.
# 0  = No Kitty-side blur (use Hyprland's blur instead — recommended)
# N  = Apply N-radius blur within Kitty's own rendering
#
# IMPORTANT: When using Hyprland with background_blur rule:
#   Set background_blur 0 here (avoid double blur)
#   Hyprland's blur is hardware-accelerated and higher quality.
#
# Hyprland blur config (in config/hypr/decorations.conf):
#   blurls = kitty     (blur all Kitty windows)
#   blur.size = 8
#   blur.passes = 3
#   blur.new_optimizations = yes
background_blur            0

# ══════════════════════════════════════════════════════════════════════════════
# § 05  DIM (UNFOCUSED WINDOW DARKENING)
# ══════════════════════════════════════════════════════════════════════════════

# ── Dim opacity ───────────────────────────────────────────────────────────────
# Opacity multiplier for windows that are NOT currently focused.
# Applied on top of background_opacity.
#
# 1.0 = No dimming (all windows same brightness regardless of focus)
# 0.8 = 20% dimmer for unfocused windows (current — recommended)
# 0.6 = 40% dimmer (very strong separation — may be hard to read)
# 0.0 = Completely black unfocused windows (extreme)
#
# Combined effect with background_opacity=0.88:
#   Active window:     0.88 opacity (full visibility)
#   Inactive window:   0.88 × 0.80 = 0.704 effective opacity
#                      Visually: clearly dimmer, still readable
#
# The dim creates a natural focus hierarchy:
#   bright = "this is where I'm working"
#   dimmed = "this has context but is secondary"
#
# This matches Hyprland's inactive_opacity setting:
#   In config/hypr/decorations.conf:
#   inactive_opacity = 0.9 (additional dimming at compositor level)
dim_opacity                0.80

# ══════════════════════════════════════════════════════════════════════════════
# § 06  WINDOW BORDERS
# ══════════════════════════════════════════════════════════════════════════════

# ── Draw minimal borders ──────────────────────────────────────────────────────
# yes = Draw only borders between adjacent windows (no borders at window edges)
#       More screen space, cleaner look for tiling layouts
# no  = Draw borders on ALL sides of every window
#
# "yes" (minimal) is recommended for tiling layouts:
#   • Borders only appear between ADJACENT windows → reduce visual noise
#   • Single window in tab: no borders visible at all
#   • Two windows side by side: ONE shared border between them
draw_minimal_borders       yes

# ── Active window border color ────────────────────────────────────────────────
# Border color for the currently focused window.
# [INJECTED] by ASH theme engine.
# Uses accent color — most visible, immediately draws attention to active pane.
active_border_color        #cba6f7

# ── Inactive window border color ─────────────────────────────────────────────
# Border color for unfocused windows.
# [INJECTED] by ASH theme engine.
# Subtle — present for spatial orientation but not competing.
inactive_border_color      #313244

# ── Bell border color ─────────────────────────────────────────────────────────
# Border color when an unfocused window has rung the bell.
# [INJECTED] by ASH theme engine.
# Uses error/alert red — urgent without audio notification.
bell_border_color          #f38ba8

# ══════════════════════════════════════════════════════════════════════════════
# § 07  WINDOW DECORATIONS & TITLE BAR
# ══════════════════════════════════════════════════════════════════════════════

# ── Hide window decorations ───────────────────────────────────────────────────
# Controls whether Kitty draws its own window title bar and decorations.
#
# yes         = Hide all decorations (no title bar, no buttons) ← recommended
# no          = Show decorations (title bar with close/min/max buttons)
# titlebar-only = Show title bar only (no other decorations) — macOS style
#
# Why "yes" for Hyprland:
#   • Hyprland handles all window decorations (borders, rounding, shadows)
#   • Kitty's own decorations would conflict with Hyprland's
#   • No title bar = maximum vertical terminal content area
#   • Window identification via tab bar + Hyprland title overlay
#   • Window management via Hyprland keybinds (move, resize, close)
hide_window_decorations    yes

# ── Wayland titlebar color ────────────────────────────────────────────────────
# When hide_window_decorations is "no" or "titlebar-only":
# The background color of the CSD title bar.
#
# background = Match terminal background color (seamless)
# A hex color = Specific titlebar background
#
# Irrelevant when hide_window_decorations=yes, but set for completeness.
wayland_titlebar_color     background

# ══════════════════════════════════════════════════════════════════════════════
# § 08  WINDOW RESIZE BEHAVIOR
# ══════════════════════════════════════════════════════════════════════════════

# ── Resize in steps ───────────────────────────────────────────────────────────
# yes = Snap window size to font cell grid during resize
#       Terminal content always fills perfectly — no fractional cells
# no  = Allow any pixel size (fractional cells may appear)
#
# "yes" is strongly recommended:
#   • No partial characters at window edge
#   • Consistent column counts for predictable terminal width
#   • Scripts relying on $COLUMNS/$LINES get accurate values
#   • Neovim windows align perfectly with terminal grid
resize_in_steps            yes

# ── Confirm OS window close ───────────────────────────────────────────────────
# Whether to ask for confirmation before closing the OS window.
# 0  = Never ask (close immediately) ← recommended for experienced users
# -1 = Always ask
# N  = Ask only if there are more than N windows/tabs open
#
# With Hyprland: closing via the compositor (super+Q) sends SIGTERM.
# Kitty handles this gracefully — all tabs/windows close cleanly.
confirm_os_window_close    0

# ══════════════════════════════════════════════════════════════════════════════
# § 09  INITIAL WINDOW PLACEMENT
# ══════════════════════════════════════════════════════════════════════════════

# ── Placement is handled by Hyprland ──────────────────────────────────────────
# Initial window position (x, y) is determined by the compositor.
# Kitty sends the "normal" window hint — Hyprland places it according to:
#   • Active workspace layout (master, dwindle, etc.)
#   • Window rules (config/hypr/windowrules.conf)
#   • Cursor position (Hyprland default for floating windows)
#
# To configure Kitty window placement in Hyprland:
#   # In config/hypr/windowrules.conf:
#   windowrulev2 = workspace 1, class:kitty
#   windowrulev2 = float, class:kitty-floating
#   windowrulev2 = center, class:kitty-floating
#   windowrulev2 = size 1000 600, class:kitty-floating
#
# Named window classes:
#   kitty               = standard terminal instance
#   kitty-floating      = launched with --class kitty-floating
#   ash-quicknote-editor = QuickNote plugin window
#   ash-plugin-config   = Plugin config editor window

# ══════════════════════════════════════════════════════════════════════════════
# § 10  REMEMBER WINDOW SIZE & POSITION
# ══════════════════════════════════════════════════════════════════════════════

# ── Remember size (already in § 01) ──────────────────────────────────────────
# remember_window_size = yes

# ── Remember position ────────────────────────────────────────────────────────
# Kitty does NOT natively save/restore window position.
# Position is managed by:
#   1. Hyprland's window placement rules
#   2. The workspace the window was on when Kitty was closed
#   3. hyprland-scratchpad (for persistent overlay windows)
#
# For position memory: use Hyprland session restore:
#   nwg-drawer --session, hyprpm, or hyprland-autoname-workspaces

# ══════════════════════════════════════════════════════════════════════════════
# § 11  WINDOW CLOSE BEHAVIOR
# ══════════════════════════════════════════════════════════════════════════════

# ── Close on child death ──────────────────────────────────────────────────────
# Behavior when the shell process in a window exits.
#
# no      = Leave window open (shows "Process exited with code N") ← current
# yes     = Close window immediately when shell exits
# last    = Close window only if it was the last one in the tab
# wait    = Wait for user keypress before closing
#
# "no" is recommended for safety:
#   • You can read any error messages before the window disappears
#   • Accidental "exit" doesn't lose context
#   • You can restart the shell with R in the dead window prompt
close_on_child_death       no

# ── Shell for new windows ─────────────────────────────────────────────────────
# Shell used in new windows (same as main shell setting).
# Documented here as it affects window lifecycle behavior.
# Set in kitty.conf: shell fish

# ══════════════════════════════════════════════════════════════════════════════
# § 12  ACTIVE WINDOW HIGHLIGHTING
# ══════════════════════════════════════════════════════════════════════════════

# ── Visual hierarchy summary ──────────────────────────────────────────────────
# The complete active/inactive visual distinction system:
#
# ┌─────────────────────┬──────────────────┬──────────────────┐
# │  Property           │  Active window   │  Inactive window │
# ├─────────────────────┼──────────────────┼──────────────────┤
# │  Border color       │  #cba6f7 (mauve) │  #313244 (dark)  │
# │  Background opacity │  0.88            │  0.88 × 0.80     │
# │  Content opacity    │  1.0             │  1.0             │
# │  Cursor             │  visible (blink) │  static beam     │
# │  Tab style          │  bold + accent   │  normal + surface │
# └─────────────────────┴──────────────────┴──────────────────┘
#
# Combined with Hyprland compositor:
#   active_opacity   = 1.0  (in Hyprland decorations.conf)
#   inactive_opacity = 0.9  (additional composite-level dimming)
#   Full effect: active window at ~0.88, inactive at ~0.88×0.80×0.9 = 0.63

# ── Window alert on bell ──────────────────────────────────────────────────────
# Mark background windows that ring the bell.
# Configured in bell.conf: window_alert_on_bell yes

# ══════════════════════════════════════════════════════════════════════════════
# § 13  OS WINDOW (TOP-LEVEL) SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

# ── Update check interval ─────────────────────────────────────────────────────
# Already set in performance.conf: update_check_interval 0

# ── Linux display server ─────────────────────────────────────────────────────
# Already set in performance.conf: linux_display_server wayland

# ── Startup session ───────────────────────────────────────────────────────────
# none = Start with a single blank window (fastest startup)
startup_session            none

# ══════════════════════════════════════════════════════════════════════════════
# § 14  MULTI-WINDOW LAYOUT INTEGRATION
# ══════════════════════════════════════════════════════════════════════════════

# ── Enabled layouts ───────────────────────────────────────────────────────────
# Controls which layout algorithms are available for window arrangement.
# The first layout in the list is the default for new tabs.
#
# Layout reference:
#   splits     = Arbitrary tiling (like tmux) — the most flexible
#                Create splits: kitty_mod+minus (h) / kitty_mod+backslash (v)
#
#   tall       = One large main pane on left + stack of smaller on right
#                Ideal for: main editor + reference terminal
#                Bias: adjustable (kitty_mod+ctrl+./,)
#
#   fat        = One large main pane on top + row of smaller at bottom
#                Ideal for: code on top + REPL/output at bottom
#
#   grid       = Equal-sized grid of windows
#                Ideal for: monitoring dashboards, multiple servers
#
#   horizontal = Windows arranged left-to-right in equal columns
#                Ideal for: side-by-side comparison
#
#   vertical   = Windows arranged top-to-bottom in equal rows
#                Ideal for: sequential workflow steps
#
#   stack      = All windows full-size, one visible at a time
#                Ideal for: focus mode, single-task terminal
enabled_layouts            splits, tall, fat, grid, horizontal, vertical, stack

# ══════════════════════════════════════════════════════════════════════════════
# § 15  WAYLAND-SPECIFIC WINDOW SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

# ── Wayland IME ───────────────────────────────────────────────────────────────
# Enable Input Method Editor (IME) for CJK input on Wayland.
# yes = Enable (required for Japanese/Chinese/Korean input via IBus/Fcitx5)
# no  = Disable (faster startup, simpler input handling for non-CJK users)
wayland_enable_ime         yes

# ── Wayland compositor integration ───────────────────────────────────────────
# Kitty cooperates with Hyprland via:
#   • XDG activation token (focus requests)
#   • XDG decoration protocol (CSD/SSD negotiation)
#   • Wayland idle protocol (hypridle integration)
#   • Wayland clipboard protocol (wl-clipboard)
#   • Wayland primary selection protocol
#   • Wayland cursor protocol (hardware cursor shapes)
#   • XDG foreign-toplevel (taskbar/alt-tab integration)

# ── Hyprland window class ─────────────────────────────────────────────────────
# Kitty sets its Wayland app-id (window class) to "kitty" by default.
# Override per-launch: kitty --class my-class
# Used in Hyprland windowrules:
#   windowrulev2 = float, class:ash-quicknote-editor

# ══════════════════════════════════════════════════════════════════════════════
# § 16  WINDOW SIZE PRESETS
# ══════════════════════════════════════════════════════════════════════════════
# These are NOT config settings — they're launch-time overrides.
# Document them here as reference for alias definitions.

# ── Launch size presets (add to fish config as aliases) ───────────────────────
# Small (quick command):
#   alias ksmall='kitty --override initial_window_width=100c --override initial_window_height=30r'
#
# Medium (general use):
#   alias kmed='kitty --override initial_window_width=160c --override initial_window_height=45r'
#
# Large (code review):
#   alias klarge='kitty --override initial_window_width=220c --override initial_window_height=55r'
#
# Fullscreen:
#   alias kfull='kitty --start-as=fullscreen'
#
# Maximized:
#   alias kmax='kitty --start-as=maximized'
#
# Floating (for scripts launched by Hyprland keybinds):
#   alias kfloat='kitty --class kitty-floating \
#     --override initial_window_width=100c \
#     --override initial_window_height=30r'

# ── ASH integration presets ───────────────────────────────────────────────────
# ASH uses specific window classes for overlay windows:
#   ash theme preview → kitty --class ash-theme-preview
#   ash plugin config → kitty --class ash-plugin-config
#   ash quicknote    → kitty --class ash-quicknote-editor
#   ash doctor       → kitty --class ash-doctor

# ══════════════════════════════════════════════════════════════════════════════
# § 17  PER-APPLICATION WINDOW RULES
# ══════════════════════════════════════════════════════════════════════════════
# Hyprland windowrule integration — configured in Hyprland, documented here.

# ── Recommended Hyprland windowrules for Kitty ────────────────────────────────
# Add to config/hypr/windowrules.conf:
#
# Standard Kitty — tile by default
#   windowrulev2 = tile, class:kitty
#
# Floating Kitty (for quick commands)
#   windowrulev2 = float, class:kitty-floating
#   windowrulev2 = size 1000 600, class:kitty-floating
#   windowrulev2 = center, class:kitty-floating
#   windowrulev2 = animation popin, class:kitty-floating
#
# ASH overlay windows
#   windowrulev2 = float, class:ash-theme-preview
#   windowrulev2 = size 800 500, class:ash-theme-preview
#   windowrulev2 = center, class:ash-theme-preview
#   windowrulev2 = float, class:ash-quicknote-editor
#   windowrulev2 = size 900 600, class:ash-quicknote-editor
#   windowrulev2 = center, class:ash-quicknote-editor
#
# Opacity rules
#   windowrulev2 = opacity 0.88 0.80, class:kitty
#   windowrulev2 = opacity 1.0 1.0, class:kitty,title:.*game.*
#
# Workspace rules
#   windowrulev2 = workspace 1, class:kitty
#
# Border rules for bell state (managed by Hyprland urgent hint)
#   windowrulev2 = bordercolor rgb(f38ba8), urgent:1
#   windowrulev2 = bordersize 3, urgent:1

# ══════════════════════════════════════════════════════════════════════════════
# § 18  WINDOW ACCESSIBILITY SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

# ── Large padding for accessibility ──────────────────────────────────────────
# ASH accessibility mode sets larger padding:
#   window_padding_width 20 24  (via kitty @ set-option)
# This increases the visual margin around terminal content.

# ── High contrast borders ─────────────────────────────────────────────────────
# ASH accessibility theme sets high-contrast border colors:
#   active_border_color #ffffff
#   inactive_border_color #444444
# Applied via: ash theme apply accessibility-high-contrast

# ── Focus indication ──────────────────────────────────────────────────────────
# For users who need stronger focus indicators:
# ASH accessibility mode sets:
#   dim_opacity 1.0         (no dimming — all windows same brightness)
#   active_border_color #ff0000  (bright red border for active window)

# ── Animation reduction ───────────────────────────────────────────────────────
# For users with motion sensitivity:
# ASH reduces motion via:
#   Hyprland animations none (in config/hypr/animations/none.conf)
#   background_opacity 1.0  (no blur compositing)
#   dim_opacity 1.0         (no dimming transitions)

# ══════════════════════════════════════════════════════════════════════════════
# § 19  WINDOW PERFORMANCE SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

# ── Opacity performance impact ────────────────────────────────────────────────
# background_opacity < 1.0 requires compositor involvement:
#   • Kitty renders with alpha channel
#   • Hyprland composites with blur pass (if configured)
#   • GPU renders additional blur kernel pass
#
# Performance cost:
#   Opacity alone:  +0.1ms per frame (negligible)
#   Blur pass:      +0.5-2ms per frame (GPU-dependent)
#   Total:          <3ms additional frame time — imperceptible
#
# For maximum performance (game mode):
#   background_opacity 1.0  (no alpha compositing)
#   background_blur 0       (no blur pass)
#   dim_opacity 1.0         (no dim calculation)
# ASH game mode applies these automatically.

# ── Resize performance ────────────────────────────────────────────────────────
# Window resize reflows terminal content and repaints every frame.
# Performance during resize: limited by repaint_delay (10ms → 100fps resize)
# resize_in_steps=yes reduces unnecessary intermediate reflows.

