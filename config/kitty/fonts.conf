# ══════════════════════════════════════════════════════════════════════════════
# § 01  PRIMARY FONT FAMILY
# ══════════════════════════════════════════════════════════════════════════════
# JetBrains Mono Nerd Font is the primary choice for:
#   • Superior programming ligatures (->  => !=  ===  :=  >=  <=)
#   • Full Nerd Font icon coverage (powerline, devicons, fa icons)
#   • Excellent x-height and stroke width at small sizes
#   • High-quality hinting for HiDPI and 1080p displays
#
# Font naming follows Kitty's PostScript name lookup:
# Run: kitty +list-fonts --psnames | grep JetBrains
# to get exact names for your installation.

# ── Regular weight ────────────────────────────────────────────────────────────
font_family            JetBrainsMono Nerd Font Mono Regular

# ── Bold ──────────────────────────────────────────────────────────────────────
bold_font              JetBrainsMono Nerd Font Mono Bold

# ── Italic ────────────────────────────────────────────────────────────────────
# JetBrains Mono has true italic variants (not just slanted regular).
italic_font            JetBrainsMono Nerd Font Mono Italic

# ── Bold Italic ───────────────────────────────────────────────────────────────
bold_italic_font       JetBrainsMono Nerd Font Mono Bold Italic

# ══════════════════════════════════════════════════════════════════════════════
# § 02  FONT SIZE & DPI
# ══════════════════════════════════════════════════════════════════════════════

# ── Base font size ────────────────────────────────────────────────────────────
# In points (pt). Kitty converts to pixels based on monitor DPI.
# 12.5pt @ 96 DPI = ~17px  — good for 1080p
# 12.5pt @ 163 DPI = ~27px — good for HiDPI/Retina
# Adjust with: ctrl+shift+equal / ctrl+shift+minus
font_size              12.5

# ── DPI override ──────────────────────────────────────────────────────────────
# Force a specific DPI instead of auto-detection.
# 0 = auto-detect from Wayland/X11 monitor info (recommended).
# Set to 96, 144, 192, or 220 for specific display types.
# Uncomment and set if auto-detection gives wrong sizes:
# font_size 12.5  # Already set above — DPI via: force_ltr

# ── Font size limits ──────────────────────────────────────────────────────────
# Prevent accidental zoom to unreadable sizes.
# These are enforced by the change_font_size action.
# Note: Kitty doesn't have explicit min/max font_size directives —
#       limits are enforced by the keybind actions in kitty.conf.

# ── Cell size tweaks ──────────────────────────────────────────────────────────
# Add extra vertical space between lines (px).
# 0 = default spacing derived from font metrics.
# +2 to +4 improves readability at small sizes.
line_height            1.0

# Add extra horizontal space between characters (px).
# 0 = default. Increase for mono fonts that feel too tight.
# Negative values tighten spacing (useful for wide fonts like Cascadia).
column_width           1.0

# ── Box drawing character scaling ─────────────────────────────────────────────
# Scale box drawing and block element glyphs to fit the cell exactly.
# yes = Kitty renders box chars itself (clean, sharp borders).
# no  = use font's own glyphs (may have gaps depending on line_height).
box_drawing_scale      0.001, 1, 1.5, 2

# ══════════════════════════════════════════════════════════════════════════════
# § 03  RENDERING QUALITY
# ══════════════════════════════════════════════════════════════════════════════

# ── FreeType rendering approach ───────────────────────────────────────────────
# freetype:  Use FreeType for font rendering (Linux standard).
# core-text: macOS only.
# auto:      Let Kitty decide.
#
# Rendering quality stack (applied in order):
#   1. OpenType font features (calt, liga, etc.) — § 04
#   2. FreeType hinting                           — below
#   3. Subpixel antialiasing                      — below
#   4. Gamma correction                           — below

# ── Antialiasing ──────────────────────────────────────────────────────────────
# grayscale:     Standard AA for non-subpixel displays (HiDPI, OLED).
# subpixel:      RGB/BGR subpixel for 1:1 pixel density LCDs.
# none:          No antialiasing (sharp but aliased — only for very high DPI).
# auto:          Kitty detects optimal based on DPI and display type.
#
# On Wayland, subpixel layout may not be reported correctly.
# For HiDPI (>150 DPI): use grayscale.
# For standard DPI (96-110 DPI): use subpixel with rgb or bgr.
text_fg_override_threshold  0

# ── Hinting ───────────────────────────────────────────────────────────────────
# Controls FreeType's hinter aggressiveness.
# normal:  Balanced — good for most use cases.
# light:   Preserves letterform better (recommended for HiDPI).
# full:    Maximum grid-fit (sharp but can distort letterforms).
# none:    No hinting (natural font metrics — good for very high DPI).
#
# For HiDPI (2× scale): light or none.
# For 1080p (1× scale): normal or full.

# ── Gamma correction ──────────────────────────────────────────────────────────
# Boost/dim the apparent weight of rendered glyphs.
# 1.0 = linear (no correction).
# 1.8 = slightly heavier strokes (good for dark backgrounds).
# 2.2 = standard gamma (often too heavy for dark terminals).
# Range: 0.01 – 10.0

# ══════════════════════════════════════════════════════════════════════════════
# § 04  LIGATURE & OPENTYPE FEATURE CONTROL
# ══════════════════════════════════════════════════════════════════════════════

# ── Global ligature mode ──────────────────────────────────────────────────────
# always:  Enable ligatures everywhere (default for JetBrains Mono).
# never:   Disable all ligatures globally.
# cursor:  Disable ligatures only at the cursor position (for editing clarity).
#
# "cursor" is strongly recommended for programming:
#   — You see the actual characters while editing (/= != == etc.)
#   — Ligatures render everywhere else for visual clarity.
disable_ligatures      cursor

# ── Per-font OpenType feature flags ──────────────────────────────────────────
# Syntax: font_features <PostScript-name> [+/-]<feature> ...
#
# To list features for your font:
#   kitty +list-fonts --psnames | grep -i jetbrains
#   Then: python3 -c "import fonttools; ..."
#
# JetBrains Mono feature map:
#   calt  = contextual alternates (ligatures)    [on by default]
#   liga  = standard ligatures                   [on by default]
#   ss01  = single-story 'a'
#   ss02  = single-story 'g'
#   ss03  = simplified 'r' (curved bottom)
#   ss04  = simplified 'f' (without ascender flag)
#   ss05  = Cyrillic letterforms
#   ss06  = Serbian/Macedonian Cyrillic
#   ss07  = disambiguation: 0, l, 1, I
#   ss08  = strict monospace (equal-width all)
#   ss09  = top flat '3'
#   ss10  = flat 6/9
#   ss11  = flat v/w bottoms
#   ss12  = simplified u
#   ss13  = simplified k
#   ss14  = simplified t (no foot)
#   ss15  = additional ligatures
#   ss16  = extra diacritics
#   ss17  = stylistic set 17
#   ss18  = stylistic set 18
#   ss19  = stylistic set 19
#   ss20  = stylistic set 20
#   zero  = slashed zero                         [recommended]
#   cv01-cv99 = character variant selectors

# ── JetBrains Mono Nerd Font features ────────────────────────────────────────
# Enable all ligatures, slashed zero, single-story letterforms.
# ss01 (single a) + ss02 (single g) = cleaner at small sizes.
# zero = slashed zero (0 vs O disambiguation).
font_features JetBrainsMonoNF-Regular        +calt +liga +zero +ss01 +ss02
font_features JetBrainsMonoNF-Bold           +calt +liga +zero +ss01 +ss02
font_features JetBrainsMonoNF-Italic         +calt +liga +zero +ss01 +ss02
font_features JetBrainsMonoNF-BoldItalic     +calt +liga +zero +ss01 +ss02

# Also target the Mono variant PostScript names:
font_features JetBrainsMonoNFM-Regular       +calt +liga +zero +ss01 +ss02
font_features JetBrainsMonoNFM-Bold          +calt +liga +zero +ss01 +ss02
font_features JetBrainsMonoNFM-Italic        +calt +liga +zero +ss01 +ss02
font_features JetBrainsMonoNFM-BoldItalic    +calt +liga +zero +ss01 +ss02

# ── Fira Code features (if using as alternate) ────────────────────────────────
# Fira Code uses different feature names for some sets.
# ss01 = r with curved tail    ss02 = disambiguation
# ss03 = & ligature            ss04 = $ sign
# ss05 = @ sign                ss06 = \ backslash
# ss07 = * star                ss08 = . dot
# ss09 = >= <=                 ss10 = ++ --
# cv01-cv31 = character variants
font_features FiraCodeNFM-Regular            +calt +liga +zero +cv29
font_features FiraCodeNFM-Bold               +calt +liga +zero +cv29
font_features FiraCodeNFM-Retina             +calt +liga +zero +cv29

# ── Cascadia Code features ────────────────────────────────────────────────────
font_features CascadiaCodeNF-Regular         +calt +liga +zero
font_features CascadiaCodeNF-Bold            +calt +liga +zero
font_features CascadiaCodeNF-Italic          +calt +liga +zero

# ══════════════════════════════════════════════════════════════════════════════
# § 05  SYMBOL FALLBACK CHAIN
# ══════════════════════════════════════════════════════════════════════════════
# When the primary font lacks a glyph, Kitty falls through this chain.
# Order matters: earlier entries have higher priority.
#
# Syntax:
#   symbol_map U+<start>-U+<end> <font-name>
#   symbol_map U+<single>       <font-name>
#
# Nerd Font codepoint ranges (Nerd Fonts v3.x):
#   Seti-UI + Custom:         U+E000–U+E0A0
#   Devicons:                 U+E0A3,U+E0B4–U+E0C8,U+E0CA,U+E0CC–U+E0D7
#   Powerline:                U+E0A0–U+E0A2,U+E0B0–U+E0B3
#   Powerline Extra:          U+E0B4–U+E0C8,U+E0CA,U+E0CC–U+E0D4
#   Material Design Icons:    U+F0001–U+F1AF0
#   Font Awesome:             U+F000–U+F2E0
#   Font Awesome Extension:   U+E200–U+E2A9
#   Octicons:                 U+F400–U+F533,U+2665,U+26A1
#   Codicons:                 U+EA60–U+EBEB
#   Weather Icons:            U+E300–U+E3E3
#   Font Linux:               U+F300–U+F375
#   IEC Power Symbols:        U+23FB–U+23FE,U+2B58
#   Pomicons:                 U+E000–U+E00D
#   Powerline Extra Arrows:   U+276E,U+2770–U+2771,U+276F,U+27A1
#   Box Drawing:              U+2500–U+259F (handled separately in § 11)
#   Braille Patterns:         U+2800–U+28FF

# ── Primary: Symbols Nerd Font Mono ──────────────────────────────────────────
# A font containing ONLY Nerd Font symbols (no letters).
# Ideal as the first fallback — zero interference with text rendering.

# Powerline separators & triangle arrows
symbol_map U+E0A0-U+E0A3   Symbols Nerd Font Mono
symbol_map U+E0B0-U+E0B3   Symbols Nerd Font Mono
symbol_map U+E0B4-U+E0C8   Symbols Nerd Font Mono
symbol_map U+E0CA           Symbols Nerd Font Mono
symbol_map U+E0CC-U+E0D7   Symbols Nerd Font Mono

# Seti-UI custom icons (editor/file type icons)
symbol_map U+E000-U+E00D   Symbols Nerd Font Mono
symbol_map U+E060-U+E0A0   Symbols Nerd Font Mono

# Devicons (programming language logos)
symbol_map U+E700-U+E7C5   Symbols Nerd Font Mono

# Font Awesome 4 (solid icons, brands)
symbol_map U+F000-U+F2E0   Symbols Nerd Font Mono

# Font Awesome 5 Extension
symbol_map U+E200-U+E2A9   Symbols Nerd Font Mono

# Octicons (GitHub icons)
symbol_map U+F400-U+F533   Symbols Nerd Font Mono

# Codicons (VS Code icons)
symbol_map U+EA60-U+EBEB   Symbols Nerd Font Mono

# Weather Icons
symbol_map U+E300-U+E3E3   Symbols Nerd Font Mono

# Font Linux (Linux distro logos)
symbol_map U+F300-U+F375   Symbols Nerd Font Mono

# IEC Power Symbols
symbol_map U+23FB-U+23FE   Symbols Nerd Font Mono
symbol_map U+2B58           Symbols Nerd Font Mono

# Material Design Icons (massive icon set)
symbol_map U+F0001-U+F1AF0  Symbols Nerd Font Mono

# Pomicons
symbol_map U+E000-U+E00A   Symbols Nerd Font Mono

# ── Secondary: JetBrains Mono Nerd Font ───────────────────────────────────────
# The primary font itself contains Nerd Font glyphs — use for ranges
# not covered by Symbols Nerd Font Mono.

# Nerd Font extra ranges in JetBrains Mono NF
symbol_map U+E001-U+E00D   JetBrainsMono Nerd Font Mono Regular
symbol_map U+E0D0           JetBrainsMono Nerd Font Mono Regular
symbol_map U+E276           JetBrainsMono Nerd Font Mono Regular

# ── Mathematical operators ────────────────────────────────────────────────────
# Ensure proper rendering of math in Jupyter, documentation, etc.
symbol_map U+2200-U+22FF   JetBrainsMono Nerd Font Mono Regular

# ── Arrows and dingbats ───────────────────────────────────────────────────────
symbol_map U+2190-U+21FF   JetBrainsMono Nerd Font Mono Regular
symbol_map U+2700-U+27BF   JetBrainsMono Nerd Font Mono Regular

# ── Enclosed alphanumerics ────────────────────────────────────────────────────
# Circled numbers ①②③ etc.
symbol_map U+2460-U+24FF   JetBrainsMono Nerd Font Mono Regular

# ══════════════════════════════════════════════════════════════════════════════
# § 06  EMOJI RENDERING
# ══════════════════════════════════════════════════════════════════════════════
# Emoji require a color font — cannot be rendered by monochrome mono fonts.
# Noto Color Emoji is the recommended choice for Linux (open source, complete).
#
# Emoji codepoint ranges:
#   Basic Emoji:          U+1F300–U+1F9FF   (primary block)
#   Supplemental Symbols: U+1FA00–U+1FAFF
#   Emoticons:            U+1F600–U+1F64F   (subset of above)
#   Miscellaneous:        U+2600–U+26FF
#   Dingbats:             U+2700–U+27BF
#   Transport:            U+1F680–U+1F6FF
#   Flags:                U+1F1E0–U+1F1FF   (flag sequences)
#   Skin tone modifiers:  U+1F3FB–U+1F3FF
#   Zero-width joiner:    U+200D             (emoji ZWJ sequences)
#   Variation selectors:  U+FE00–U+FE0F     (text vs emoji presentation)

# ── Noto Color Emoji (primary emoji font) ────────────────────────────────────
symbol_map U+1F300-U+1F9FF   Noto Color Emoji
symbol_map U+1FA00-U+1FAFF   Noto Color Emoji
symbol_map U+2600-U+26FF     Noto Color Emoji
symbol_map U+2702-U+27B0     Noto Color Emoji
symbol_map U+1F1E0-U+1F1FF   Noto Color Emoji
symbol_map U+1F004           Noto Color Emoji
symbol_map U+1F0CF           Noto Color Emoji
symbol_map U+1F200-U+1F251   Noto Color Emoji
symbol_map U+1F680-U+1F6FF   Noto Color Emoji
symbol_map U+1F700-U+1F77F   Noto Color Emoji
symbol_map U+1F780-U+1F7FF   Noto Color Emoji
symbol_map U+1F800-U+1F8FF   Noto Color Emoji
symbol_map U+1F900-U+1F9FF   Noto Color Emoji
symbol_map U+FE00-U+FE0F     Noto Color Emoji
symbol_map U+1F3FB-U+1F3FF   Noto Color Emoji

# ── Twemoji (Twitter emoji — alternative) ────────────────────────────────────
# Uncomment to use Twemoji instead of Noto Color Emoji:
# symbol_map U+1F300-U+1FAFF   Twitter Color Emoji
# symbol_map U+2600-U+26FF     Twitter Color Emoji

# ══════════════════════════════════════════════════════════════════════════════
# § 07  CJK / MULTILINGUAL FALLBACK
# ══════════════════════════════════════════════════════════════════════════════
# CJK = Chinese, Japanese, Korean
# These Unicode blocks require dedicated CJK fonts for correct rendering.
#
# Noto Sans CJK is the recommended choice:
#   • Unified Han Ideographs: U+4E00–U+9FFF (most common)
#   • Extension A:            U+3400–U+4DBF
#   • Extension B:            U+20000–U+2A6DF
#   • Katakana + Hiragana:    U+3040–U+30FF
#   • Hangul:                 U+AC00–U+D7AF
#   • Bopomofo:               U+3100–U+312F

# ── CJK Unified Ideographs ───────────────────────────────────────────────────
symbol_map U+4E00-U+9FFF     Noto Sans CJK SC Regular
symbol_map U+3400-U+4DBF     Noto Sans CJK SC Regular
symbol_map U+F900-U+FAFF     Noto Sans CJK SC Regular

# ── CJK Extension B (rare, but covers classical texts) ───────────────────────
symbol_map U+20000-U+2A6DF   Noto Sans CJK SC Regular

# ── Hiragana & Katakana ───────────────────────────────────────────────────────
symbol_map U+3040-U+309F     Noto Sans CJK JP Regular
symbol_map U+30A0-U+30FF     Noto Sans CJK JP Regular
symbol_map U+31F0-U+31FF     Noto Sans CJK JP Regular

# ── Hangul Syllables ──────────────────────────────────────────────────────────
symbol_map U+AC00-U+D7AF     Noto Sans CJK KR Regular
symbol_map U+1100-U+11FF     Noto Sans CJK KR Regular
symbol_map U+3130-U+318F     Noto Sans CJK KR Regular

# ── Arabic (for multilingual workflows) ──────────────────────────────────────
symbol_map U+0600-U+06FF     Noto Sans Arabic Regular
symbol_map U+0750-U+077F     Noto Sans Arabic Regular
symbol_map U+FB50-U+FDFF     Noto Sans Arabic Regular
symbol_map U+FE70-U+FEFF     Noto Sans Arabic Regular

# ── Hebrew ────────────────────────────────────────────────────────────────────
symbol_map U+0590-U+05FF     Noto Sans Hebrew Regular
symbol_map U+FB1D-U+FB4F     Noto Sans Hebrew Regular

# ── Devanagari (Hindi, Sanskrit) ─────────────────────────────────────────────
symbol_map U+0900-U+097F     Noto Sans Devanagari Regular

# ── Thai ──────────────────────────────────────────────────────────────────────
symbol_map U+0E00-U+0E7F     Noto Sans Thai Regular

# ── Georgian ──────────────────────────────────────────────────────────────────
symbol_map U+10A0-U+10FF     Noto Sans Georgian Regular

# ── Armenian ──────────────────────────────────────────────────────────────────
symbol_map U+0530-U+058F     Noto Sans Armenian Regular

# ── Greek Extended ────────────────────────────────────────────────────────────
symbol_map U+1F00-U+1FFF     JetBrainsMono Nerd Font Mono Regular

# ══════════════════════════════════════════════════════════════════════════════
# § 08  PER-CODEPOINT GLYPH OVERRIDES
# ══════════════════════════════════════════════════════════════════════════════
# Override specific glyphs that look better from alternate fonts.
# Syntax: symbol_map U+<hex> <font-name>

# ── Ambiguous-width symbols ───────────────────────────────────────────────────
# Some symbols are "ambiguous width" in Unicode — different apps treat them
# as either 1 or 2 cells wide. Force 1-cell width via narrow_symbols.

# narrow_symbols: Treat these code points as narrow (1 cell wide) even if
# they could be wide. Useful for Nerd Font icons in powerline prompts.
narrow_symbols U+E0A0-U+E0A3 1
narrow_symbols U+E0B0-U+E0B3 1

# ── Box drawing characters ────────────────────────────────────────────────────
# Kitty renders box chars itself (see § 11) but these override specific glyphs
# that the primary font renders incorrectly.

# ── Special punctuation ───────────────────────────────────────────────────────
# Ensure typographic quotes, dashes, and ellipsis render from the primary font.
symbol_map U+2018-U+201F     JetBrainsMono Nerd Font Mono Regular
symbol_map U+2013-U+2015     JetBrainsMono Nerd Font Mono Regular
symbol_map U+2026           JetBrainsMono Nerd Font Mono Regular

# ── Superscripts / subscripts ─────────────────────────────────────────────────
symbol_map U+2070-U+209F     JetBrainsMono Nerd Font Mono Regular

# ── Fraction forms ────────────────────────────────────────────────────────────
symbol_map U+00BC-U+00BE     JetBrainsMono Nerd Font Mono Regular
symbol_map U+2150-U+215F     JetBrainsMono Nerd Font Mono Regular

# ── Currency symbols ──────────────────────────────────────────────────────────
# Ensure all currency symbols render from primary font (not emoji substituted).
symbol_map U+20A0-U+20CF     JetBrainsMono Nerd Font Mono Regular

# ══════════════════════════════════════════════════════════════════════════════
# § 09  OPENTYPE FEATURES (ADVANCED)
# ══════════════════════════════════════════════════════════════════════════════
# Fine-grained control over how specific glyph shapes render.

# ── Modify cursive italic rendering ──────────────────────────────────────────
# JetBrains Mono italic uses cursive-style alternates.
# These are controlled per-font via font_features above (§ 04).

# ── Tabular numbers ───────────────────────────────────────────────────────────
# tnum = tabular numbers (all digits same width) — better for tables/logs.
# onum = oldstyle numbers (varying heights) — better for prose.
# Default is proportional lining — tnum for terminals is usually preferred.
# Add +tnum to font_features lines above if you want tabular numbers.

# ══════════════════════════════════════════════════════════════════════════════
# § 10  ALTERNATE FONT PROFILES
# ══════════════════════════════════════════════════════════════════════════════
# These are NOT active by default — switch to them via:
#   kitty @ set-font --size 12 'Fira Code'
# or define session-specific configs via kitty sessions.

# ── Fira Code (wider ligature set) ───────────────────────────────────────────
# Pros: More ligatures (&&, ||, !!, +++ etc.), wider community support.
# Cons: Slightly wider metrics, heavier at small sizes.
# Activate: Remove comment and change font_family above to FiraCode Nerd Font

# font_family      FiraCode Nerd Font Mono Retina
# bold_font        FiraCode Nerd Font Mono Bold
# italic_font      FiraCode Nerd Font Mono Light Italic
# bold_italic_font FiraCode Nerd Font Mono Bold Italic

# ── Cascadia Code (Microsoft, moderate ligatures) ─────────────────────────────
# Pros: Natural stroke width, excellent at large sizes, good italic.
# Cons: Fewer ligatures than JBM/FiraCode.

# font_family      CascadiaCode Nerd Font Mono
# bold_font        CascadiaCode Nerd Font Mono Bold
# italic_font      CascadiaCode Nerd Font Mono Italic
# bold_italic_font CascadiaCode Nerd Font Mono Bold Italic

# ── Iosevka (ultra-narrow, maximum density) ────────────────────────────────
# Pros: Fits significantly more code on screen. Highly customizable.
# Cons: Too narrow for some users. Many variant builds available.

# font_family      Iosevka Nerd Font Mono
# bold_font        Iosevka Nerd Font Mono Bold
# italic_font      Iosevka Nerd Font Mono Italic
# bold_italic_font Iosevka Nerd Font Mono Bold Italic

# ── Hack (maximum legibility, no ligatures) ───────────────────────────────────
# Pros: Optimized specifically for source code. Excellent x-height.
# Cons: No programming ligatures.

# font_family      Hack Nerd Font Mono Regular
# bold_font        Hack Nerd Font Mono Bold
# italic_font      Hack Nerd Font Mono Italic
# bold_italic_font Hack Nerd Font Mono Bold Italic

# ── Monaspace (GitHub/GitHub Copilot's font) ─────────────────────────────────
# Pros: Variable weight, texture healing (advanced spacing).
# Cons: Newer, less widely adopted.

# font_family      MonaspiceNe Nerd Font Mono Regular
# bold_font        MonaspiceNe Nerd Font Mono Bold
# italic_font      MonaspiceKr Nerd Font Mono Italic
# bold_italic_font MonaspiceNe Nerd Font Mono Bold Italic

# ══════════════════════════════════════════════════════════════════════════════
# § 11  BOX DRAWING & BLOCK ELEMENTS
# ══════════════════════════════════════════════════════════════════════════════
# Kitty can render box drawing and block elements itself (not from font glyphs).
# This gives pixel-perfect rendering regardless of font metrics.

# ── Box drawing characters ────────────────────────────────────────────────────
# U+2500–U+257F: Box drawing (─ │ ╔ ╗ ╚ ╝ ┼ etc.)
# U+2580–U+259F: Block elements (█ ▀ ▄ ▌ ▐ etc.)
# U+25A0–U+25FF: Geometric shapes (■ ● ▲ ▼ ◆ etc.)
# U+2800–U+28FF: Braille patterns (⣿ etc.) — used by btop, ncurses UI

# Override these with Kitty's own renderer for pixel-perfect results.
# (Kitty renders these internally — no font_family needed for these ranges.)

# ── Braille (used by btop, progress bars in fish) ─────────────────────────────
# Kitty renders braille patterns itself — no override needed.
# If you see gaps: set box_drawing_scale appropriately.

# ── Powerline extra arrows ────────────────────────────────────────────────────
# Override powerline arrow characters specifically for clean rendering.
symbol_map U+E0B0-U+E0B3   Symbols Nerd Font Mono
symbol_map U+E0B4-U+E0B7   Symbols Nerd Font Mono
symbol_map U+E0B8-U+E0BB   Symbols Nerd Font Mono
symbol_map U+E0BC-U+E0BF   Symbols Nerd Font Mono
symbol_map U+E0C0-U+E0C7   Symbols Nerd Font Mono
symbol_map U+E0C8           Symbols Nerd Font Mono
symbol_map U+E0D0           Symbols Nerd Font Mono

# ══════════════════════════════════════════════════════════════════════════════
# § 12  FONT DIAGNOSTICS & REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
# Reference commands — run these in a terminal to diagnose font issues.
#
# List all fonts Kitty can find:
#   kitty +list-fonts
#
# List fonts with PostScript names (needed for font_features):
#   kitty +list-fonts --psnames
#
# Filter for a specific family:
#   kitty +list-fonts --psnames | grep -i jetbrains
#
# Test a specific font:
#   kitty --config 'font_family Fira Code' --override font_size=14
#
# Show what font is rendering a specific character:
#   In Kitty: ctrl+shift+F2 → opens debug overlay
#   Then: hover over any character
#
# Check if a glyph renders from the correct font:
#   kitty +runpy "from kitty.fonts.render import render_string; print(render_string('→'))"
#
# Validate symbol_map coverage:
#   echo -e "\ue0b0\ue0b2\ue0b4" | kitty +runpy "import sys; print(sys.stdin.read())"
#
# Profile font rendering performance:
#   kitty --debug-font-fallback
#
# Refresh font cache (system-wide):
#   fc-cache -fv
#
# Show font details for a specific font file:
#   fc-query /usr/share/fonts/TTF/JetBrainsMonoNerdFont-Regular.ttf
#
# ── ASH theme engine font sync ────────────────────────────────────────────────
# To change the primary font via ASH:
#   ash config set kitty.font "Fira Code Nerd Font Mono"
#   ash reload kitty
#
# To scale font size for the current session only:
#   kitty @ set-font-size 14
#
# ── Kitty debug flags ─────────────────────────────────────────────────────────
# These are command-line flags, not config options:
#   kitty --debug-font-fallback    Show which font renders each glyph
#   kitty --debug-config           Print parsed config and exit
#   kitty --debug-gl               Print OpenGL info and exit
# ══════════════════════════════════════════════════════════════════════════════