# Desc    : Complete, ultra-optimized font configuration for Kitty terminal.
#           Covers rendering quality, ligatures, symbol fallback chains,
#           emoji rendering, and per-codepoint font mapping.
#
#   Architecture:
#     § 01  Primary font family      (regular, bold, italic, bold-italic)
#     § 02  Font size & DPI          (base size, DPI scaling, zoom limits)
#     § 03  Rendering quality        (hinting, antialiasing, subpixel)
#     § 04  Ligature control         (per-font liga, calt, ss01–ss20)
#     § 05  Symbol fallback chain    (Nerd Fonts, icons, symbols)
#     § 06  Emoji rendering          (Noto, Twemoji, Apple Color Emoji)
#     § 07  CJK / Unicode fallback   (CJK unified, Hangul, Hiragana)
#     § 08  Per-codepoint mapping    (precise glyph overrides)
#     § 09  Font features            (OpenType feature flags)
#     § 10  Alternate fonts          (mono variants for different workflows)
#     § 11  Box drawing              (line drawing, block elements)
#     § 12  Font diagnostics         (debug flags, list command reference)
#
#   Recommended font stack (install all for best coverage):
#     • JetBrains Mono Nerd Font     (primary — ligatures + Nerd icons)
#     • Fira Code Nerd Font          (alternate — wider ligature set)
#     • Cascadia Code NF             (alternate — Microsoft-style)
#     • Noto Color Emoji             (emoji — Google/Android style)
#     • Symbols Nerd Font Mono       (icon-only fallback)
#     • Noto Sans CJK                (CJK unified ideographs)
#     • Noto Sans Arabic             (Arabic/RTL script)
#     • Noto Sans Hebrew             (Hebrew/RTL script)
#
#   Install on Arch Linux:
#     paru -S ttf-jetbrains-mono-nerd noto-fonts-emoji \
#             ttf-firacode-nerd ttf-cascadia-code-nerd \
#             noto-fonts-cjk noto-fonts-arabic \
#             ttf-nerd-fonts-symbols-mono
