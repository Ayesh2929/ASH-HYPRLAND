font_family JetBrains Mono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0

background #1e1e2e
foreground #cdd6f4
selection_background #45475a
selection_foreground #f5e0dc

cursor #f5e0dc
cursor_text_color #1e1e2e

url_color #89b4fa

color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #f5c2e7
color6 #94e2d5
color7 #bac2de
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

window_padding_width 10
window_margin_width 5

tab_bar_style fade
tab_bar_edge bottom
tab_bar_align left
tab_title_template "{title}"

scrollback_lines 10000
scrollback_pager less

mouse_map ctrl+left click open_url

shell_integration no-rc

include current-theme.conf