# ══════════════════════════════════════════════════════════════════════════════
# ASH DOTFILES v5.0 OMEGA — KITTY TERMINAL ULTRA CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
# File    : kitty.conf
# Author  : Ash Dotfiles v5.0 Omega
# License : MIT
# Desc    : Ultra-premium Kitty terminal configuration with full feature
#           coverage, performance optimization, Wayland-native settings,
#           advanced tab management, custom keybinds, session support,
#           GPU acceleration tuning, and ASH theme engine integration.
#
#   Architecture:
#     § 01  Include chain           (colors · fonts · keybinds · tabs)
#     § 02  Performance & GPU       (rendering · sync · frame budget)
#     § 03  Window geometry         (size · padding · borders · opacity)
#     § 04  Cursor                  (shape · blink · beam · color)
#     § 05  Scrollback              (buffer · pager · search)
#     § 06  Mouse                   (hide · copy · URLs · pointer)
#     § 07  Bell                    (audio · visual · window attention)
#     § 08  Tab bar                 (style · position · title format)
#     § 09  Color scheme            (256 colors · true-color · dim)
#     § 10  Advanced shell          (shell · editor · cwd · title)
#     § 11  Keyboard                (keybinds · hints · marks)
#     § 12  URL handling            (openers · detection · style)
#     § 13  Selection               (clipboard · primary · regex)
#     § 14  Terminal compatibility  (TERM · CSI · OSC · bracketed paste)
#     § 15  Accessibility           (text zoom · high contrast · flash)
#     § 16  Remote control          (socket · auth · API)
#     § 17  Startup session         (default layout · window sizing)
#     § 18  Wayland                 (title-bar · decorations · IME)
#     § 19  OS-specific tweaks      (Linux · macOS stubs)
#     § 20  Kitten integration      (ssh · diff · theme · broadcast)
#
#   Key design decisions:
#     • Zero compromises on render quality (GPU, frame sync, font hinting)
#     • Sub-millisecond input latency (repaint delay, sync delay tuning)
#     • Consistent Wayland-first approach (no XWayland fallbacks needed)
#     • ASH theme engine integration via include colors.conf (hot-reload)
#     • Semantic versioning in header — bump on major config changes
#
# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
# § 01  INCLUDE CHAIN
# ══════════════════════════════════════════════════════════════════════════════
# Load order matters — later includes override earlier ones.
# colors.conf is auto-regenerated by: ash theme apply <name>

include colors.conf
include fonts.conf

# ══════════════════════════════════════════════════════════════════════════════
# § 02  PERFORMANCE & GPU RENDERING
# ══════════════════════════════════════════════════════════════════════════════

# ── Renderer ─────────────────────────────────────────────────────────────────
# opengl-single: best latency for single GPU systems (AMD/Intel)
# opengl-sdl:    fallback for compatibility
# auto:          Kitty chooses (recommended for NVIDIA)
linux_display_server   wayland

# ── Frame timing ─────────────────────────────────────────────────────────────
# How often Kitty repaints the screen (ms). 0 = every frame of monitor.
# 10ms = 100fps cap — ideal for 60/120/144 Hz monitors.
# Set to 0 only if you have a 144Hz+ display and GPU headroom.
repaint_delay          10

# ── Input delay ──────────────────────────────────────────────────────────────
# Milliseconds to wait before repainting after the last input event.
# Lower = more responsive typing, higher CPU use.
# 3ms is ideal for <50ms total input lag.
input_delay            3

# ── Sync to monitor ──────────────────────────────────────────────────────────
# Synchronize rendering with the monitor refresh rate.
# yes = tear-free, slight latency increase (recommended).
sync_to_monitor        yes

# ── GPU memory ───────────────────────────────────────────────────────────────
# Max texture memory (MB) for glyph atlas.
# 64MB covers large fonts + many unicode glyphs comfortably.
# Increase to 128 for 4K displays or when using many emoji.
texture_cache_size     64

# ── Glyph rendering ──────────────────────────────────────────────────────────
# Quality of freetype hinting passed to the font renderer.
# normal: balanced quality/performance
# full:   maximum quality (slight performance cost)
# none:   fastest, lower quality
text_composition_strategy  platform
force_ltr              no

# ══════════════════════════════════════════════════════════════════════════════
# § 03  WINDOW GEOMETRY & DECORATION
# ══════════════════════════════════════════════════════════════════════════════

# ── Default window size (columns × rows) ─────────────────────────────────────
initial_window_width   220c
initial_window_height  50c

# ── Padding ──────────────────────────────────────────────────────────────────
# Inner padding (px) around the terminal content.
# Asymmetric: more top/bottom for visual breathing room.
window_padding_width   12 16

# ── Borders ──────────────────────────────────────────────────────────────────
# Single-pixel inactive border for clear window separation.
# active_border_color set in colors.conf (accent color).
draw_minimal_borders   yes
window_margin_width    0

# ── Background opacity ───────────────────────────────────────────────────────
# Requires compositor with blur support (Hyprland ✓).
# 0.88 = 12% transparent — glass effect without readability loss.
# Blur radius configured in Hyprland windowrules.
background_opacity     0.88

# ── Background blur (Kitty's own blur, if compositor blur disabled) ───────────
background_blur        32

# ── Dim unfocused windows ────────────────────────────────────────────────────
# 0.0 = completely dim, 1.0 = no dim.
# 0.75 keeps unfocused windows readable while highlighting active one.
dim_opacity            0.80

# ── Resize increments ────────────────────────────────────────────────────────
resize_in_steps        yes
confirm_os_window_close  0

# ── Window decorations ───────────────────────────────────────────────────────
# Handled entirely by Hyprland — disable Kitty's own title bar.
hide_window_decorations  yes

# ── Remember window size ─────────────────────────────────────────────────────
remember_window_size   yes

# ══════════════════════════════════════════════════════════════════════════════
# § 04  CURSOR
# ══════════════════════════════════════════════════════════════════════════════

# ── Shape ────────────────────────────────────────────────────────────────────
# beam:  insert mode feel (default)
# block: vi/modal feel
# underline: compact
# Shapes per mode set in shell integration (fish shell config).
cursor_shape           beam

# ── Blink ────────────────────────────────────────────────────────────────────
# Blink interval in seconds. 0 disables blinking.
# 0.5s matches most system defaults. Unfocused window: always static.
cursor_blink_interval  0.5
cursor_stop_blinking_after  15.0

# ── Beam thickness ───────────────────────────────────────────────────────────
# Width of the beam cursor in pts. 1.5 = crisp without being invisible.
cursor_beam_thickness  1.5
cursor_underline_thickness  2.0

# ── Color ────────────────────────────────────────────────────────────────────
# Defined in colors.conf as @cursor / @cursor_text.
# Fallback values here in case colors.conf is missing.
cursor                 #cba6f7
cursor_text_color      #1e1e2e

# ══════════════════════════════════════════════════════════════════════════════
# § 05  SCROLLBACK
# ══════════════════════════════════════════════════════════════════════════════

# ── Buffer size ──────────────────────────────────────────────────────────────
# Number of lines to keep in scrollback buffer.
# 10000 = ~10MB RAM for typical terminal output. Increase for log-heavy work.
scrollback_lines       10000

# ── Pager ────────────────────────────────────────────────────────────────────
# Program to use when viewing scrollback in full-screen mode.
# Uses bat for syntax highlighting + less for navigation.
# %G = number of lines, %l = current line.
scrollback_pager       bash -c "exec bat --paging=always --style=grid --color=always -l bash"
scrollback_pager_history_size  10

# ── Scroll multiplier ────────────────────────────────────────────────────────
# Lines scrolled per mouse wheel tick.
wheel_scroll_multiplier   5.0
wheel_scroll_min_lines    1
touch_scroll_multiplier   1.0

# ── Fast scroll ──────────────────────────────────────────────────────────────
# Multiplier applied when holding Ctrl + scroll.
# 10x = page-level jumping.
# Configured in keybinds section.

# ══════════════════════════════════════════════════════════════════════════════
# § 06  MOUSE
# ══════════════════════════════════════════════════════════════════════════════

# ── Auto-hide cursor ─────────────────────────────────────────────────────────
# Hide mouse cursor after N seconds of inactivity.
# 3.0s is unobtrusive for most workflows.
mouse_hide_wait        3.0

# ── Click actions ────────────────────────────────────────────────────────────
# Single  click: move cursor
# Double  click: select word (regex-based)
# Triple  click: select line
# Quad    click: select paragraph (to blank line)
click_interval         0.5

# ── Selection ────────────────────────────────────────────────────────────────
# Copy selected text to clipboard on selection (like xterm).
copy_on_select         yes

# ── Pointer shape ────────────────────────────────────────────────────────────
# Kitty sets pointer shape based on content type.
pointer_shape_when_grabbed   arrow
pointer_shape_when_dragging  beam

# ── URL mouse-over ───────────────────────────────────────────────────────────
# Show underline + hand cursor when hovering URLs.
# Actual URL opening defined in § 12.
detect_urls            yes
url_excluded_characters  ""

# ══════════════════════════════════════════════════════════════════════════════
# § 07  BELL
# ══════════════════════════════════════════════════════════════════════════════

# ── Audio bell ───────────────────────────────────────────────────────────────
# disabled: silent terminal (recommended for focus/productivity).
# system:   use system bell sound.
enable_audio_bell      no

# ── Visual bell ──────────────────────────────────────────────────────────────
# Flash the window for N seconds instead of audio bell.
# 0 = no visual bell either.
visual_bell_duration   0.1
visual_bell_color      #f38ba8

# ── Window title bell ────────────────────────────────────────────────────────
# Mark the window title with a bell emoji when unfocused and bell rings.
window_alert_on_bell   yes

# ══════════════════════════════════════════════════════════════════════════════
# § 08  TAB BAR
# ══════════════════════════════════════════════════════════════════════════════

# ── Position ─────────────────────────────────────────────────────────────────
tab_bar_edge           top

# ── Style ────────────────────────────────────────────────────────────────────
# powerline: segmented powerline arrows (requires Nerd Font).
# slant:     diagonal cuts (modern look).
# separator: custom separator.
# custom:    use tab_bar.py kitten for full control.
tab_bar_style          powerline

# ── Powerline style ──────────────────────────────────────────────────────────
# slanted | round | angled | bevel
tab_powerline_style    slanted

# ── Separator ────────────────────────────────────────────────────────────────
tab_separator          " ┇ "

# ── Minimum tabs to show ─────────────────────────────────────────────────────
# Only show the tab bar when more than 1 tab is open.
tab_bar_min_tabs       2

# ── Tab title format ─────────────────────────────────────────────────────────
# Dynamic tab titles with: index, process icon, CWD, command.
# Nerd Font icons: 󰆍 = terminal, 󰊤 = git, 󰌠 = python, etc.
tab_title_template     "{fmt.fg.tab}{index}:{fmt.fg.default} {tab.active_exe}  {title[:20]}"
active_tab_title_template  "❯ {tab.active_exe}  {title[:24]}"

# ── Tab bar alignment ─────────────────────────────────────────────────────────
tab_bar_align          left

# ── Tab bar margin ────────────────────────────────────────────────────────────
tab_bar_margin_width   0.0
tab_bar_margin_height  0.0 0.0

# ── Tab bar background ───────────────────────────────────────────────────────
# Overridden in colors.conf with theme colors.
tab_bar_background     none
tab_bar_margin_color   none

# ── Active tab colors ─────────────────────────────────────────────────────────
# Set in colors.conf via: active_tab_foreground / active_tab_background.
active_tab_font_style    bold
inactive_tab_font_style  normal

# ══════════════════════════════════════════════════════════════════════════════
# § 09  COLOR SCHEME FOUNDATION
# ══════════════════════════════════════════════════════════════════════════════
# All actual color values live in colors.conf.
# This section sets structural color behavior.

# ── True color ───────────────────────────────────────────────────────────────
# Kitty always supports true color — this is a documentation marker.
# Applications should set COLORTERM=truecolor (done in § 10).

# ── Color count ──────────────────────────────────────────────────────────────
# Number of colors in the terminal palette.
# Extended to 256 via the standard xterm-256color sequence.

# ── Transparent color ────────────────────────────────────────────────────────
# Color index treated as transparent (none = disabled).
transparent_background_colors  none

# ── Dim colors ───────────────────────────────────────────────────────────────
# When background_opacity < 1, dim the background further for unfocused.
# Already handled by dim_opacity — leave at default.

# ── Mark colors ──────────────────────────────────────────────────────────────
# Colors used for the three mark types (set via ctrl+shift+f1/f2/f3).
mark1_foreground   #1e1e2e
mark1_background   #cba6f7
mark2_foreground   #1e1e2e
mark2_background   #89b4fa
mark3_foreground   #1e1e2e
mark3_background   #a6e3a1

# ══════════════════════════════════════════════════════════════════════════════
# § 10  SHELL & ENVIRONMENT
# ══════════════════════════════════════════════════════════════════════════════

# ── Shell ─────────────────────────────────────────────────────────────────────
# Use Fish shell as default. Falls back to $SHELL if fish not found.
shell      fish
shell_integration  enabled no-sudo

# ── Editor ────────────────────────────────────────────────────────────────────
# Used by edit-in-kitty kitten and scrollback edit.
editor     nvim

# ── Close on exit ─────────────────────────────────────────────────────────────
# window: close the OS window when shell exits.
# tab:    close the tab.
# last:   close only when last tab closes.
close_on_child_death   no

# ── Working directory ─────────────────────────────────────────────────────────
# New windows/tabs start in the same CWD as the current active window.
# last_reported: uses shell integration to get accurate CWD.
# current:       uses /proc filesystem (less accurate).
startup_session        none

# ── Environment variables ─────────────────────────────────────────────────────
# Inject critical env vars for Wayland + true-color + ASH integration.
env COLORTERM=truecolor
env TERM=xterm-256color
env TERM_PROGRAM=kitty
env TERM_PROGRAM_VERSION=0.36.0
env KITTY_ENABLE_WAYLAND=1
env WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
env XDG_CURRENT_DESKTOP=Hyprland
env ASH_TERMINAL=kitty

# ── Window title ──────────────────────────────────────────────────────────────
# Dynamic title: set by the running process or shell integration.
# Format: "process — CWD — Kitty"
# Shells can override this via OSC 2 / OSC 0 sequences.

# ── Allow programs to change title ───────────────────────────────────────────
allow_remote_control   yes
listen_on              unix:/tmp/kitty-{kitty_pid}.sock

# ── Update check ──────────────────────────────────────────────────────────────
update_check_interval  0

# ══════════════════════════════════════════════════════════════════════════════
# § 11  KEYBOARD SHORTCUTS
# ══════════════════════════════════════════════════════════════════════════════
# All mappings use: map <modifiers>+<key> <action>
# Kitty modifier names: ctrl shift alt super meta

# ── Clear ALL defaults first ─────────────────────────────────────────────────
# We define our own complete keybind set below.
clear_all_shortcuts    no

# ── Leader key ────────────────────────────────────────────────────────────────
# Kitty supports a two-key leader sequence.
# kitty_mod is the primary modifier (ctrl+shift by default).
kitty_mod              ctrl+shift

# ════════════════════════════
# WINDOW MANAGEMENT
# ════════════════════════════

# New window (same CWD)
map kitty_mod+enter          new_window_with_cwd
map kitty_mod+n              new_os_window_with_cwd
map super+enter              new_window_with_cwd

# Close window / tab
map kitty_mod+q              close_window
map kitty_mod+w              close_tab

# Window focus navigation
map kitty_mod+h              neighboring_window left
map kitty_mod+l              neighboring_window right
map kitty_mod+k              neighboring_window up
map kitty_mod+j              neighboring_window down
map kitty_mod+Left           neighboring_window left
map kitty_mod+Right          neighboring_window right
map kitty_mod+Up             neighboring_window up
map kitty_mod+Down           neighboring_window down

# Window resize
map kitty_mod+r              start_resizing_window
map kitty_mod+shift+h        resize_window narrower 5
map kitty_mod+shift+l        resize_window wider 5
map kitty_mod+shift+k        resize_window taller 5
map kitty_mod+shift+j        resize_window shorter 5

# Move window in layout
map kitty_mod+shift+Left     move_window left
map kitty_mod+shift+Right    move_window right
map kitty_mod+shift+Up       move_window up
map kitty_mod+shift+Down     move_window down

# Window swapping
map kitty_mod+f              swap_with_window

# ════════════════════════════
# TAB MANAGEMENT
# ════════════════════════════

# New tab
map kitty_mod+t              new_tab_with_cwd
map super+t                  new_tab_with_cwd

# Tab navigation
map kitty_mod+]              next_tab
map kitty_mod+[              previous_tab
map ctrl+tab                 next_tab
map ctrl+shift+tab           previous_tab
map super+1                  goto_tab 1
map super+2                  goto_tab 2
map super+3                  goto_tab 3
map super+4                  goto_tab 4
map super+5                  goto_tab 5
map super+6                  goto_tab 6
map super+7                  goto_tab 7
map super+8                  goto_tab 8
map super+9                  goto_tab 9

# Move tab
map kitty_mod+shift+]        move_tab_forward
map kitty_mod+shift+[        move_tab_backward

# Rename tab
map kitty_mod+alt+t          set_tab_title

# ════════════════════════════
# LAYOUTS
# ════════════════════════════

# Cycle through layouts
map kitty_mod+space          next_layout

# Switch to specific layouts
map kitty_mod+alt+1          goto_layout tall
map kitty_mod+alt+2          goto_layout fat
map kitty_mod+alt+3          goto_layout grid
map kitty_mod+alt+4          goto_layout horizontal
map kitty_mod+alt+5          goto_layout vertical
map kitty_mod+alt+6          goto_layout splits
map kitty_mod+alt+7          goto_layout stack

# ════════════════════════════
# SPLITS (splits layout)
# ════════════════════════════
map kitty_mod+minus          launch --location=hsplit --cwd=current
map kitty_mod+backslash      launch --location=vsplit --cwd=current
map kitty_mod+shift+minus    launch --location=hsplit
map kitty_mod+shift+backslash  launch --location=vsplit

# ════════════════════════════
# CLIPBOARD
# ════════════════════════════

map kitty_mod+c              copy_to_clipboard
map kitty_mod+v              paste_from_clipboard
map kitty_mod+s              paste_from_selection
map shift+insert             paste_from_selection
map kitty_mod+o              pass_selection_to_program wl-copy
map kitty_mod+shift+v        show_scrollback

# ════════════════════════════
# SCROLLBACK
# ════════════════════════════

map kitty_mod+up             scroll_line_up
map kitty_mod+down           scroll_line_down
map kitty_mod+page_up        scroll_page_up
map kitty_mod+page_down      scroll_page_down
map kitty_mod+home           scroll_home
map kitty_mod+end            scroll_end

# Fast scroll (ctrl+wheel)
map ctrl+shift+up            scroll_line_up
map ctrl+shift+down          scroll_line_down

# Open scrollback in pager
map kitty_mod+g              show_scrollback
map kitty_mod+shift+g        show_last_command_output

# ════════════════════════════
# FONT SIZE
# ════════════════════════════

map kitty_mod+equal          change_font_size all +1.0
map kitty_mod+plus           change_font_size all +1.0
map kitty_mod+minus          change_font_size all -1.0
map kitty_mod+0              change_font_size all 0
map super+equal              change_font_size all +2.0
map super+minus              change_font_size all -2.0
map super+0                  change_font_size all 0

# ════════════════════════════
# SEARCH
# ════════════════════════════

map kitty_mod+f              launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --no-mouse --exact -i --tac

# ════════════════════════════
# KITTENS
# ════════════════════════════

# Hints: open/copy URLs, file paths, words
map kitty_mod+e              kitten hints
map kitty_mod+p              kitten hints --type path --program -
map kitty_mod+shift+p        kitten hints --type path
map kitty_mod+y              kitten hints --type hyperlink
map kitty_mod+shift+y        kitten hints --type word --program wl-copy

# Diff kitten
map kitty_mod+d              kitten diff

# SSH kitten
map kitty_mod+shift+s        kitten ssh

# Unicode input
map kitty_mod+u              kitten unicode_input

# ════════════════════════════
# MARKS
# ════════════════════════════

map kitty_mod+shift+z        scroll_to_mark prev
map kitty_mod+z              scroll_to_mark next
map kitty_mod+f1             create_marker
map kitty_mod+f2             toggle_marker iregex 0 ERROR
map kitty_mod+f3             toggle_marker iregex 1 WARNING
map kitty_mod+f4             remove_marker

# ════════════════════════════
# MISCELLANEOUS
# ════════════════════════════

# Toggle fullscreen
map kitty_mod+F11            toggle_fullscreen
map super+f                  toggle_fullscreen

# Toggle maximized
map kitty_mod+F10            toggle_maximized

# Debug rendering
map kitty_mod+F6             debug_config

# Reload config without restart
map kitty_mod+F5             load_config_file

# Send text sequences
map kitty_mod+alt+enter      send_text all \x1b[13;5u

# Broadcast to all windows (useful for admin tasks)
map kitty_mod+b              kitten broadcast

# Clear terminal + scrollback
map kitty_mod+delete         clear_terminal scrollback active

# ════════════════════════════
# ASH INTEGRATION
# ════════════════════════════

# Open ASH theme picker
map super+shift+t            launch --type=overlay ash theme pick

# Open ASH mode selector
map super+shift+m            launch --type=overlay ash mode

# Open plugin manager
map super+shift+p            launch --type=overlay ash plugin browse

# ══════════════════════════════════════════════════════════════════════════════
# § 12  URL HANDLING
# ══════════════════════════════════════════════════════════════════════════════

# ── URL opener ────────────────────────────────────────────────────────────────
open_url_with          default

# ── URL underline style ───────────────────────────────────────────────────────
url_style              curly
url_color              #89b4fa

# ── URL regex patterns ────────────────────────────────────────────────────────
# Extended URL detection: include git repos, file:// URIs, localhost URLs.
url_prefixes           file ftp ftps gemini git http https irc ircs kitty mailto news sftp ssh

# ── Copy URL on click ─────────────────────────────────────────────────────────
# Left click opens URL. Shift+click copies URL.
mouse_map left click ungrabbed mouse_handle_click selection link

# ── Show URL in hover bar ─────────────────────────────────────────────────────
show_hyperlink_targets  yes

# ══════════════════════════════════════════════════════════════════════════════
# § 13  SELECTION & CLIPBOARD
# ══════════════════════════════════════════════════════════════════════════════

# ── Regex for word selection (double-click) ───────────────────────────────────
# Extended to include common programming characters.
select_by_word_characters  @-./_~?&=%+#:

# ── Strip trailing spaces ─────────────────────────────────────────────────────
# Remove trailing whitespace when copying to clipboard.
strip_trailing_spaces  smart

# ── Clipboard control ─────────────────────────────────────────────────────────
# Allow OSC 52 clipboard read/write (for remote terminal clipboard sync).
clipboard_control      write-clipboard write-primary read-clipboard-ask read-primary-ask

# ── Clipboard max size ────────────────────────────────────────────────────────
# Maximum bytes Kitty will send/receive via OSC 52. 0 = unlimited.
clipboard_max_size     512

# ══════════════════════════════════════════════════════════════════════════════
# § 14  TERMINAL COMPATIBILITY
# ══════════════════════════════════════════════════════════════════════════════

# ── Terminal ID ───────────────────────────────────────────────────────────────
# What Kitty reports itself as to applications.
# xterm-kitty: full Kitty protocol (best).
# xterm-256color: maximum compatibility fallback.
term                   xterm-kitty

# ── Bracketed paste ──────────────────────────────────────────────────────────
# Enable bracketed paste mode (prevents paste injection attacks).
# Controlled by applications, not Kitty config.

# ── Modify keys ───────────────────────────────────────────────────────────────
# How to encode modified keys (Ctrl+letter, Alt+letter, etc.)
# 3 = CSI-u format (best for Neovim, Zsh, etc.)
modify_keyboard_shortcuts  yes

# ── Extended key encoding ────────────────────────────────────────────────────
# 0: legacy xterm encoding
# 2: CSI-u + disambiguate
# Full CSI-u for maximum Neovim compatibility.
kitty_key_encoding     3

# ── Application keypad ───────────────────────────────────────────────────────
# Translate numpad keys correctly.

# ══════════════════════════════════════════════════════════════════════════════
# § 15  ACCESSIBILITY
# ══════════════════════════════════════════════════════════════════════════════

# ── Font size zoom range ─────────────────────────────────────────────────────
# Minimum and maximum font size Kitty will resize to.
# Prevents accidentally making text unreadable.
# These are absolute sizes (pt), not relative.

# ── Flash on bell ────────────────────────────────────────────────────────────
# Duration of visual bell flash animation (seconds). 0 = disabled.
# See § 07 for bell configuration.

# ── High contrast ────────────────────────────────────────────────────────────
# Managed by ASH accessibility mode plugin:
#   ash mode accessibility
# Which auto-applies the high-contrast color theme.

# ══════════════════════════════════════════════════════════════════════════════
# § 16  REMOTE CONTROL
# ══════════════════════════════════════════════════════════════════════════════

# ── Enable remote control ─────────────────────────────────────────────────────
# Required for: kitten broadcast, ASH theme hot-reload, session scripts.
allow_remote_control   yes

# ── Socket path ──────────────────────────────────────────────────────────────
# Unix socket for kitty @ commands.
# {kitty_pid} is replaced with the actual PID at startup.
listen_on              unix:/tmp/kitty-{kitty_pid}.sock

# ── Remote control password ───────────────────────────────────────────────────
# Empty = no auth (acceptable for local socket).
# For network sockets, always set a password.
# remote_control_password ""

# ══════════════════════════════════════════════════════════════════════════════
# § 17  LAYOUTS
# ══════════════════════════════════════════════════════════════════════════════

# ── Enabled layout types ──────────────────────────────────────────────────────
# Order determines cycling sequence (ctrl+shift+space).
enabled_layouts        splits,tall,fat,grid,horizontal,vertical,stack

# ── Tall layout ───────────────────────────────────────────────────────────────
# Default bias for the tall layout (main pane width %).
# 65% main + 35% stack = good code + terminal split.

# ── Stack layout ──────────────────────────────────────────────────────────────
# All windows full-screen, switch with ctrl+shift+h/l.

# ══════════════════════════════════════════════════════════════════════════════
# § 18  WAYLAND INTEGRATION
# ══════════════════════════════════════════════════════════════════════════════

# ── Display server ────────────────────────────────────────────────────────────
linux_display_server   wayland

# ── Wayland CSD ───────────────────────────────────────────────────────────────
# Client-side decorations: Hyprland handles all decorations.
# no  = Kitty draws nothing (recommended for Hyprland + rounding).
# yes = Kitty draws a minimal title bar.
wayland_titlebar_color  background

# ── Wayland enable IME ────────────────────────────────────────────────────────
# Enable Input Method Editor support for CJK input.
wayland_enable_ime     yes

# ── Cursor protocol ──────────────────────────────────────────────────────────
# Use the Wayland cursor protocol for hardware cursors.

# ── DPI detection ────────────────────────────────────────────────────────────
# Wayland provides accurate physical DPI — let Kitty use it.
# Override with: kitty --config 'font_size 14' for specific DPI.

# ══════════════════════════════════════════════════════════════════════════════
# § 19  OS-SPECIFIC TWEAKS
# ══════════════════════════════════════════════════════════════════════════════

# ── Linux ─────────────────────────────────────────────────────────────────────
# XDG desktop integration for file associations.
linux_bell_theme       __custom

# ── macOS stubs ──────────────────────────────────────────────────────────────
# These are ignored on Linux but kept for cross-platform config sharing.
# macos_option_as_alt       yes
# macos_quit_when_last_window_closed  yes
# macos_traditional_fullscreen  no
# macos_show_window_title_in  window

# ══════════════════════════════════════════════════════════════════════════════
# § 20  KITTEN INTEGRATION
# ══════════════════════════════════════════════════════════════════════════════

# ── SSH kitten ────────────────────────────────────────────────────────────────
# Automatically copy kitty terminfo to remote hosts.
# Aliases: kssh → kitten ssh (set in fish conf.d/43-neovim.fish)

# ── Diff kitten ───────────────────────────────────────────────────────────────
# Use bat syntax highlighting in diff output.
# Configured in kittens/diff-kitten.py

# ── Broadcast kitten ──────────────────────────────────────────────────────────
# Send input to all windows simultaneously.
# map kitty_mod+b → kitten broadcast (set in § 11)

# ── Unicode input kitten ──────────────────────────────────────────────────────
# Search and insert unicode characters.
# map kitty_mod+u → kitten unicode_input (set in § 11)

# ── Hints kitten configuration ────────────────────────────────────────────────
# Customize what hint kitten matches.
# Full config in kittens/hints-kitten.py

# ── Theme preview kitten ─────────────────────────────────────────────────────
# Live theme preview without applying.
# Launched by: ash theme preview <name>
# Full config in kittens/theme-preview-kitten.py

# ══════════════════════════════════════════════════════════════════════════════
