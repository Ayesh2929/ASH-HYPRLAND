# File    : scrollback.conf
# Author  : Ash Dotfiles v5.0 Omega
# License : MIT
# Desc    : Complete scrollback, pager, and history configuration for Kitty.
#           Covers buffer sizing, pager programs, search integration,
#           mouse scroll multipliers, shell prompt navigation,
#           and full-text scrollback search via fzf.
#
#   Design philosophy:
#     • Large buffer (10k lines) for log-heavy development work
#     • bat as primary pager: syntax highlighting + line numbers
#     • fzf integration: fuzzy scrollback search with live preview
#     • Prompt-aware navigation (requires fish shell integration)
#     • Configurable multipliers for mouse + touch scroll velocity
#     • Shell integration for: last command output, visited prompts
#
#   Dependencies:
#     Required:  Kitty ≥ 0.35.0
#     Optional:  bat (syntax-highlighted pager)
#                less (fallback pager)
#                fzf (fuzzy search overlay)
#                delta (git diff in pager)
#
#   Install:
#     paru -S bat less fzf git-delta
#
#   Section map:
#     § 01  Scrollback buffer        (size · compression · lines)
#     § 02  Primary pager            (bat + less command)
#     § 03  Alternate pagers         (less · cat · delta · nvim)
#     § 04  Pager environment        (env vars for bat/less)
#     § 05  Mouse scroll             (multipliers · min lines · touch)
#     § 06  Shell prompt navigation  (scroll_to_prompt bindings)
#     § 07  Search integration       (fzf overlay · color scheme)
#     § 08  Scrollback fill          (on-demand pager launch)
#     § 09  History export           (save scrollback to file)
#     § 10  Performance              (memory · disk cache · limits)
# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
# § 01  SCROLLBACK BUFFER
# ══════════════════════════════════════════════════════════════════════════════

# ── Buffer line count ─────────────────────────────────────────────────────────
# Number of lines stored in the scrollback ring buffer.
# Memory impact: ~1KB per line of typical terminal output.
# 10000 lines ≈ 10MB RAM — appropriate for daily development work.
# 50000 lines ≈ 50MB — for log-intensive workflows (servers, testing).
# -1 = unlimited (use with caution — can consume significant RAM).
scrollback_lines           10000

# ── Pager history size ────────────────────────────────────────────────────────
# How much of the scrollback is loaded into the pager (bat/less).
# 0 = load all scrollback lines (may be slow for very large buffers).
# A positive number limits pager history to N most recent lines.
# For daily use, loading the full buffer is fine at 10k lines.
scrollback_pager_history_size  0

# ── Scrollback indicator ──────────────────────────────────────────────────────
# Show a visual indicator when the scrollback is in use.
# (Position + color of the "viewing scrollback" indicator.)
# This is rendered automatically by Kitty — no config needed.

# ══════════════════════════════════════════════════════════════════════════════
# § 02  PRIMARY PAGER (bat + less)
# ══════════════════════════════════════════════════════════════════════════════
# The pager is opened when:
#   1. User presses kitty_mod+g (show_scrollback)
#   2. User presses kitty_mod+shift+g (show_last_command_output)
#   3. Any shell integration event triggers pager display
#
# bat provides:
#   • Syntax highlighting for common file types / shell output
#   • Line numbers with --style=numbers
#   • Git diff integration with --style=changes
#   • ANSI color passthrough with --color=always
#   • True-color support matching Kitty's color scheme
#
# Shell flags passed by Kitty:
#   %G = placeholder for "go to line N" (replaced with +N for less/bat)
#   %l = current line number of the scrollback view
#
# The command is run as a child process of Kitty.

# ── Primary pager: bat with full styling ─────────────────────────────────────
# This is the default pager — rich, color-aware, feature-packed.
scrollback_pager           bash -c "\
    exec bat \
        --paging=always \
        --color=always \
        --style=numbers,changes,header-filename,grid \
        --theme='Catppuccin Mocha' \
        --wrap=never \
        --tabs=4 \
        --line-range=':${LINES}' \
        --italic-text=always \
        -l bash \
        --file-name='scrollback' \
        -- - \
    <&0"

# ── Pager with jump-to-line support ──────────────────────────────────────────
# Alternative: use less directly for faster startup, with jump-to-line.
# Uncomment to use less instead of bat:
# scrollback_pager    less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ── Pager for plain terminal output (no highlighting needed) ──────────────────
# Uncomment if bat causes issues with binary or control-character-heavy output:
# scrollback_pager    less --chop-long-lines --RAW-CONTROL-CHARS

# ══════════════════════════════════════════════════════════════════════════════
# § 03  ALTERNATE PAGER CONFIGURATIONS
# ══════════════════════════════════════════════════════════════════════════════
# These are commented out. Copy the desired block to § 02 to activate.

# ── Option A: bat (minimal) ───────────────────────────────────────────────────
# Minimal bat invocation — no grid, no header, just colors + line numbers.
# Fastest startup, cleanest appearance for plain log output.
#
# scrollback_pager    bash -c "bat \
#     --paging=always \
#     --color=always \
#     --style=numbers \
#     --theme='Catppuccin Mocha' \
#     -l bash -- -"

# ── Option B: less (classic) ─────────────────────────────────────────────────
# The Unix classic. Fastest pager, no syntax highlighting.
# Best for binary output, very large buffers, or low-spec systems.
#
# scrollback_pager    less \
#     --chop-long-lines \
#     --RAW-CONTROL-CHARS \
#     --ignore-case \
#     --hilite-search \
#     --QUIET \
#     +INPUT_LINE_NUMBER

# ── Option C: bat + delta (git diff aware) ───────────────────────────────────
# Uses delta (git diff highlighter) when output looks like a diff,
# falls back to bat otherwise. Requires: git-delta
#
# scrollback_pager    bash -c "\
#     if head -5 | grep -qE '^(diff|index|---|\+\+\+)'; then \
#         delta --dark --syntax-theme='Catppuccin Mocha'; \
#     else \
#         bat --paging=always --color=always -l bash --; \
#     fi"

# ── Option D: Neovim as pager ────────────────────────────────────────────────
# Full Neovim editor for reading + editing scrollback content.
# Overkill for most uses, but great for searching/editing large logs.
# WARNING: slow startup for large buffers.
#
# scrollback_pager    bash -c "\
#     tmpfile=$(mktemp /tmp/kitty-scrollback-XXXXXX.sh); \
#     cat > $tmpfile; \
#     nvim -R \
#         -c 'setlocal buftype=nofile bufhidden=delete noswapfile' \
#         -c 'nnoremap q :q!<CR>' \
#         $tmpfile; \
#     rm -f $tmpfile"

# ── Option E: cat (no pager, just print) ─────────────────────────────────────
# No pager at all — just print scrollback to the terminal.
# Useful for piping to other tools.
#
# scrollback_pager    cat

# ══════════════════════════════════════════════════════════════════════════════
# § 04  PAGER ENVIRONMENT
# ══════════════════════════════════════════════════════════════════════════════
# Environment variables that control pager behavior.
# These are passed via the shell → pager process.

# ── bat configuration ─────────────────────────────────────────────────────────
# bat respects BAT_OPTS and BAT_THEME environment variables.
# Set via shell (fish conf.d/44-bat.fish) rather than here.
#
# Relevant fish config (for reference):
#   set -gx BAT_THEME 'Catppuccin Mocha'
#   set -gx BAT_OPTS  '--style=numbers,changes --color=always'
#   set -gx MANPAGER  'sh -c "col -bx | bat -l man -p"'
#   set -gx MANROFFOPT -c

# ── less configuration ────────────────────────────────────────────────────────
# LESS env var controls less behavior globally.
# Set via shell (fish conf.d/02-env.fish) rather than here.
#
# Relevant fish config (for reference):
#   set -gx LESS '-R --chop-long-lines --ignore-case --QUIET --hilite-search'
#   set -gx LESSOPEN '| bat --color=always %s'
#   set -gx LESSCLOSE ''

# ══════════════════════════════════════════════════════════════════════════════
# § 05  MOUSE SCROLL VELOCITY
# ══════════════════════════════════════════════════════════════════════════════

# ── Wheel scroll multiplier ───────────────────────────────────────────────────
# How many lines to scroll per mouse wheel tick.
# 5.0 = fast and snappy (good for large scrollback buffers).
# 1.0 = slow, precise (good for reading code line by line).
# 3.0 = balanced default.
wheel_scroll_multiplier    5.0

# ── Wheel scroll minimum ──────────────────────────────────────────────────────
# Minimum lines scrolled per wheel event, even for slow/precise mice.
# 1 = at least one line per tick (prevents zero-scroll jitter).
wheel_scroll_min_lines     1

# ── Touch scroll multiplier ───────────────────────────────────────────────────
# Multiplier for trackpad / touchscreen scroll events.
# Trackpads send continuous scroll events — 1.0 is typically correct.
# Increase if your trackpad feels too slow in Kitty.
touch_scroll_multiplier    1.0

# ── Mouse map: Ctrl+Wheel = fast scroll ──────────────────────────────────────
# Hold Ctrl while scrolling for 3× speed boost.
# These override Kitty's default ctrl+scroll behavior.
mouse_map ctrl+wheel_up    scroll_page_up
mouse_map ctrl+wheel_down  scroll_page_down

# Shift+Wheel = fine scroll (1 line per tick, ignores multiplier)
mouse_map shift+wheel_up   scroll_line_up
mouse_map shift+wheel_down scroll_line_down

# Alt+Wheel = scroll in alternate screen (useful in vim/less)
mouse_map alt+wheel_up     scroll_line_up
mouse_map alt+wheel_down   scroll_line_down

# ── Mouse: Middle click to paste from primary ─────────────────────────────────
mouse_map middle            release ungrabbed paste_from_selection

# ── Mouse: Double click = select word ────────────────────────────────────────
mouse_map left              doublepress ungrabbed mouse_selection word

# ── Mouse: Triple click = select line ────────────────────────────────────────
mouse_map left              triplepress ungrabbed mouse_selection line

# ── Mouse: Quad click = select paragraph (to next blank line) ────────────────
mouse_map left              quadruplepress ungrabbed mouse_selection paragraph

# ── Mouse: Ctrl+Click = open URL ─────────────────────────────────────────────
mouse_map ctrl+left         release grabbed,ungrabbed mouse_handle_click link

# ── Mouse: Shift+Click = extend selection ────────────────────────────────────
mouse_map shift+left        press ungrabbed mouse_selection extend

# ══════════════════════════════════════════════════════════════════════════════
# § 06  SHELL PROMPT NAVIGATION
# ══════════════════════════════════════════════════════════════════════════════
# Shell integration allows Kitty to know where each shell prompt is.
# This enables "scroll to previous/next prompt" navigation.
#
# Requirements:
#   1. shell_integration enabled (set in kitty.conf)
#   2. Fish: source ~/.config/fish/conf.d/19-starship.fish
#      (Kitty's fish integration is auto-loaded via shell_integration)
#
# How it works:
#   Kitty inserts OSC 133 escape sequences at each prompt.
#   scroll_to_prompt navigates between these markers.

# ── Keybinds for prompt navigation ────────────────────────────────────────────
# These are defined in keybinds.conf § 06:
#   kitty_mod+z     → scroll_to_prompt -1   (previous prompt)
#   kitty_mod+x     → scroll_to_prompt +1   (next prompt)

# Jump back N prompts (positive = newer, negative = older)
# kitty_mod+shift+z  → scroll_to_prompt -5  (jump back 5 prompts)
# Defined in keybinds.conf — documented here for cross-reference.

# ── Show last command output ──────────────────────────────────────────────────
# kitty_mod+shift+g = show_last_command_output
# Opens the output of the most recent shell command in the pager.
# Requires shell integration to detect command boundaries.

# ── Show last visited output ──────────────────────────────────────────────────
# kitty_mod+ctrl+g = show_last_visited_command_output
# Opens the output of the most recently visited (via prompt nav) command.

# ══════════════════════════════════════════════════════════════════════════════
# § 07  FZF SEARCH INTEGRATION
# ══════════════════════════════════════════════════════════════════════════════
# Fuzzy search through the scrollback buffer using fzf.
# Launched as a Kitty overlay (full-screen, closes when done).
# Keybind: kitty_mod+f (defined in keybinds.conf § 12)
#
# The fzf color scheme matches the active Catppuccin Mocha palette.
# Colors are injected by the ASH theme engine when the theme changes.
# Run: ash theme apply <name>  to update fzf colors automatically.

# ── fzf color configuration ───────────────────────────────────────────────────
# These env vars are set in fish conf.d to keep config DRY.
# Shown here for documentation / manual override reference.
#
# Fish: set -gx FZF_DEFAULT_OPTS (in conf.d/17-fzf.fish):
#
#   --color='bg:#1e1e2e'           → Catppuccin Mocha base (background)
#   --color='bg+:#313244'          → Surface0 (selected item background)
#   --color='fg:#cdd6f4'           → Text (foreground)
#   --color='fg+:#cdd6f4'          → Text (selected item foreground)
#   --color='hl:#cba6f7'           → Mauve (highlight / match)
#   --color='hl+:#cba6f7'          → Mauve (selected + match)
#   --color='info:#89b4fa'         → Blue (info line)
#   --color='prompt:#cba6f7'       → Mauve (prompt character)
#   --color='pointer:#cba6f7'      → Mauve (cursor pointer ›)
#   --color='marker:#a6e3a1'       → Green (multi-select marker)
#   --color='spinner:#f5c2e7'      → Pink (spinner animation)
#   --color='border:#585b70'       → Surface2 (border color)
#   --color='header:#89b4fa'       → Blue (header text)

# ── fzf layout in scrollback overlay ─────────────────────────────────────────
# Full configuration of the fzf search overlay is in keybinds.conf § 12.
# Key options used:
#   --no-sort:    Keep chronological order (tac reverses to newest-first)
#   --tac:        Reverse input (newest lines shown first in list)
#   --exact:      Substring match by default (faster than fuzzy for logs)
#   -i:           Case-insensitive matching
#   --preview:    Show context around the selected line
#   --bind ctrl-y:execute-silent(wl-copy)  → Copy selected line to clipboard

# ══════════════════════════════════════════════════════════════════════════════
# § 08  SCROLLBACK FILL STRATEGY
# ══════════════════════════════════════════════════════════════════════════════

# ── On-screen fill ────────────────────────────────────────────────────────────
# When Kitty starts, it fills the visible area before the scrollback.
# This is automatic — no configuration needed.

# ── Resize behavior ───────────────────────────────────────────────────────────
# When the window is resized, Kitty reflowes the scrollback buffer.
# This can shift line boundaries for long-wrapped output.
# The scrollback is always stored as raw bytes — reflow is on-the-fly.

# ── Scrollback encoding ───────────────────────────────────────────────────────
# All scrollback content is stored in UTF-8.
# Non-UTF-8 content from applications is handled via replacement characters.
# This is automatic — no configuration needed.

# ── Scrollback and alternate screen ──────────────────────────────────────────
# Content from alternate screen programs (vim, less, htop) is NOT added to
# the scrollback buffer. This is the standard terminal behavior.
# When the alternate screen app exits, the primary screen + scrollback returns.

# ══════════════════════════════════════════════════════════════════════════════
# § 09  SCROLLBACK EXPORT
# ══════════════════════════════════════════════════════════════════════════════
# Save scrollback content to a file for analysis or archiving.
# These are shell commands (run from terminal) — not Kitty config directives.
# Documented here because they relate to scrollback functionality.

# ── Save current scrollback to file ──────────────────────────────────────────
# From the terminal, run:
#   kitty @ get-text --extent scrollback > ~/kitty-scrollback.txt
#
# Save with ANSI colors preserved:
#   kitty @ get-text --extent scrollback --ansi > ~/kitty-scrollback-color.txt
#
# Save last N lines of scrollback:
#   kitty @ get-text --extent scrollback | tail -n 100 > ~/last100.txt

# ── Send scrollback to clipboard ─────────────────────────────────────────────
# Copy entire scrollback to clipboard:
#   kitty @ get-text --extent scrollback | wl-copy
#
# Copy last command output to clipboard:
#   kitty @ get-text --extent last_cmd_output | wl-copy

# ── Filter scrollback for specific content ────────────────────────────────────
# Extract only error lines from scrollback:
#   kitty @ get-text --extent scrollback | grep -i 'error\|fatal\|critical'
#
# Save only Python tracebacks:
#   kitty @ get-text --extent scrollback | \
#       awk '/Traceback/,/^$/' > ~/python-traceback.txt

# ══════════════════════════════════════════════════════════════════════════════
# § 10  PERFORMANCE & MEMORY
# ══════════════════════════════════════════════════════════════════════════════

# ── Memory estimate ───────────────────────────────────────────────────────────
# scrollback_lines = 10000 lines
# Average line length ≈ 80 bytes = ~800KB text
# + ANSI escape sequence overhead ≈ 30% = ~1.04MB
# + Kitty internal metadata ≈ 30% = ~1.35MB
# Total: ~1.5MB per Kitty window (negligible for modern systems)
#
# For 20 tabs × 5 windows each = 100 Kitty windows:
# 100 × 1.5MB = ~150MB total scrollback RAM
# This is well within acceptable limits for development machines.

# ── Scrollback compression ────────────────────────────────────────────────────
# Kitty automatically compresses old scrollback content.
# Older lines that are not recently accessed are compressed transparently.
# This is automatic — no configuration option.

# ── Garbage collection ────────────────────────────────────────────────────────
# Kitty frees scrollback memory for closed windows immediately.
# No explicit GC configuration needed.

# ── Large output performance ──────────────────────────────────────────────────
# When a program outputs very large amounts of data quickly (cat largefile.txt):
# Kitty handles this efficiently via batch rendering.
# The main performance bottleneck is usually the GPU texture upload, not RAM.
#
# Tip: For processing very large files, redirect output to a file + view with bat:
#   some-command > /tmp/output.txt && bat /tmp/output.txt

# ══════════════════════════════════════════════════════════════════════════════
# SCROLLBACK QUICK REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  Navigation:
#    kitty_mod+g           Open full scrollback in pager (bat)
#    kitty_mod+shift+g     Open last command output in pager
#    kitty_mod+f           Fuzzy search scrollback with fzf
#    kitty_mod+shift+f     Fuzzy search last command output
#    kitty_mod+z           Scroll to previous shell prompt
#    kitty_mod+x           Scroll to next shell prompt
#    kitty_mod+up/down     Scroll one line
#    kitty_mod+page_up/dn  Scroll one page
#    kitty_mod+home/end    Jump to start/end of scrollback
#
#  Mouse:
#    Scroll wheel          5 lines per tick (configurable)
#    Ctrl+Scroll           Page up/down (fast scroll)
#    Shift+Scroll          1 line per tick (precise)
#
#  In pager (bat/less):
#    ↑/↓ or k/j            Scroll line
#    Space / b             Page down / up
#    /                     Search forward
#    ?                     Search backward
#    n / N                 Next / previous match
#    g / G                 Go to start / end
#    q                     Quit pager
#
#  Export (from shell):
#    kitty @ get-text --extent scrollback   Print scrollback to stdout
