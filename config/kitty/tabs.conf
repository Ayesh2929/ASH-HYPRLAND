# License : MIT
# Desc    : Complete, ultra-optimized tab bar configuration for Kitty.
#           Covers tab bar style, position, rendering, title templates,
#           activity indicators, close confirmations, and full color theming.
#           Designed to be the most informative, beautiful, and efficient
#           tab bar possible within Kitty's rendering system.
#
#   Design goals:
#     • Maximum information density without visual noise
#     • Dynamic titles: process name + truncated path + status indicators
#     • Powerline-style separators using Nerd Font glyphs
#     • Activity indicators for background windows (bell, output, focus)
#     • Color matches ASH active theme (injected via colors.conf)
#     • Only shown when >1 tab exists (clean single-tab experience)
#     • Efficient font rendering (same Nerd Font as primary font)
#
#   Tab title information hierarchy:
#     1. Tab index (always visible — for super+N quick-jump)
#     2. Active process icon (Nerd Font glyph auto-lookup)
#     3. Current working directory (truncated to basename)
#     4. Active window title (set by shell/application via OSC 0/2)
#     5. Status indicators: ● active, ◉ bell, ⏸ paused, ↻ running
#
#   Section map:
#     § 01  Tab bar position & visibility
#     § 02  Tab bar style & separators
#     § 03  Tab title templates
#     § 04  Tab bar colors (active · inactive · background)
#     § 05  Font settings for tab bar
#     § 06  Activity & bell indicators
#     § 07  Tab bar margins & padding
#     § 08  Close behavior & confirmations
#     § 09  Tab layout behavior
#     § 10  Custom tab bar (tab_bar.py kitten reference)
# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
# § 01  TAB BAR POSITION & VISIBILITY
# ══════════════════════════════════════════════════════════════════════════════

# ── Position ──────────────────────────────────────────────────────────────────
# top:    Tab bar at the top of the OS window (below title bar on macOS)
# bottom: Tab bar at the bottom of the OS window
#
# "top" is the most natural position for terminal users:
#   • Matches browser tab conventions
#   • Eyes travel to top naturally after launching
#   • Keeps tab bar away from shell output area
tab_bar_edge               top

# ── Minimum tabs to show ──────────────────────────────────────────────────────
# The tab bar is only rendered when this many or more tabs are open.
# 1 = always show tab bar (even with a single tab)
# 2 = hide tab bar when only one tab exists (recommended — cleaner look)
# Benefit: Single-tab Kitty windows look like a pure terminal.
#          Tab bar appears only when needed, reducing visual noise.
tab_bar_min_tabs           2

# ── Tab bar alignment ─────────────────────────────────────────────────────────
# left:   Tabs left-aligned (standard)
# center: Tabs centered in the bar
# right:  Tabs right-aligned
tab_bar_align              left

# ══════════════════════════════════════════════════════════════════════════════
# § 02  TAB BAR STYLE & SEPARATORS
# ══════════════════════════════════════════════════════════════════════════════

# ── Style ─────────────────────────────────────────────────────────────────────
# The tab bar style controls the visual appearance of each tab:
#
#   powerline   : Powerline-style angled separators ()
#                 Each tab has a leading / trailing separator glyph.
#                 Most visually distinctive. Requires Nerd Font.
#
#   slant       : Diagonal slant cuts (  )
#                 Similar to powerline but with slanted shape.
#                 Very modern look.
#
#   separator   : Thin vertical separator between tabs
#                 Clean, minimal. Good for many tabs.
#
#   fade        : Active tab is full opacity, inactive tabs fade to transparent
#                 Elegant gradient effect.
#
#   hidden      : No tab bar visible even with multiple tabs.
#                 Use keyboard navigation only.
#
#   custom      : Use a Python kitten for full control (see § 10)
#
# "powerline" with "slanted" style gives the best Nerd Font visual result.
tab_bar_style              powerline

# ── Powerline separator shape ─────────────────────────────────────────────────
# Controls the shape of the powerline separator glyphs.
#
#   slanted   : Classic powerline arrow (  ) — most widely used
#   round     : Rounded capsule shape (  ) — modern, softer look
#   angled    : 45° angle cut — sharp, geometric
#   bevel     : Beveled/chamfered corners — classic editor tabs look
tab_powerline_style        slanted

# ── Separator (for separator style) ──────────────────────────────────────────
# The separator string used in "separator" tab_bar_style.
# This is the character printed between adjacent tabs.
# Only used when tab_bar_style is "separator".
tab_separator              "  │  "

# ══════════════════════════════════════════════════════════════════════════════
# § 03  TAB TITLE TEMPLATES
# ══════════════════════════════════════════════════════════════════════════════
# Templates use Python f-string-style placeholders.
# Full list of available variables:
#   {index}           = Tab number (1-indexed)
#   {title}           = Title of the active window in the tab
#   {tab.active_exe}  = Name of the active foreground process
#   {tab.num_windows} = Number of windows in this tab
#   {tab.active_path} = CWD of the active window (full path)
#   {layout_name}     = Name of the current layout
#   {num_tabs}        = Total number of open tabs
#   {tab.enabled_layouts} = Available layouts in this tab
#
# Formatting:
#   {fmt.bold}           Start bold text
#   {fmt.nobold}         End bold text
#   {fmt.italic}         Start italic text
#   {fmt.noitalic}       End italic text
#   {fmt.fg.COLOR}       Set foreground color (hex or name)
#   {fmt.bg.COLOR}       Set background color
#   {fmt.fg.default}     Reset to tab foreground color
#   {fmt.bg.default}     Reset to tab background color
#   {fmt.fg.tab}         Use the tab's defined fg color
#
# Title variable behavior:
#   Kitty sets {title} from the OSC 0 (window title) escape sequence.
#   Fish sets this to: "<command> — <cwd>" when running a command,
#   and to "<cwd>" when at the prompt.
#   Neovim sets it to the file being edited.

# ── Inactive tab title ────────────────────────────────────────────────────────
# Format for tabs that are NOT currently focused.
# Goal: compact, shows index + process + truncated title
#
# Breaking it down:
#   {index}         = tab number for super+N navigation reference
#   {tab.active_exe}= current process (nvim, fish, python, etc.)
#   {title[:18]}    = title truncated to 18 chars (prevents overflow)
tab_title_template         "{fmt.fg.tab}{index}:{fmt.fg.default} {tab.active_exe}  {title[:18]}"

# ── Active tab title ──────────────────────────────────────────────────────────
# Format for the currently focused tab.
# More detailed than inactive — shows full context.
#
# The ❯ prefix is a visual "active" indicator (Fish prompt style).
active_tab_title_template  "❯ {fmt.bold}{tab.active_exe}{fmt.nobold}  {title[:24]}"

# ── Title template examples ───────────────────────────────────────────────────
# Minimal (index only):
#   tab_title_template  "{index}"
#
# With window count:
#   tab_title_template  "{index}:{tab.active_exe} [{tab.num_windows}w]"
#
# With layout name:
#   tab_title_template  "{index} {tab.active_exe} ({layout_name})"
#
# With full path basename:
#   tab_title_template  "{index} {tab.active_exe}:{tab.active_path[-20:]}"
#
# With color-coded process:
#   tab_title_template  "{fmt.fg.#a6e3a1}{index}{fmt.fg.default}:{tab.active_exe}"
#
# Emoji status indicator:
#   active_tab_title_template  "● {tab.active_exe}  {title[:20]}"

# ══════════════════════════════════════════════════════════════════════════════
# § 04  TAB BAR COLORS
# ══════════════════════════════════════════════════════════════════════════════
# Colors are also set in colors.conf (auto-generated by ash theme apply).
# The values here serve as defaults / fallbacks.
# [INJECTED] values are overwritten by the ASH theme engine.

# ── Tab bar strip background ──────────────────────────────────────────────────
# The background color of the entire tab bar area (including between tabs).
# "none" = use the terminal background (seamless look).
# A specific color = distinct tab bar (more prominent, like VS Code).
# [INJECTED] — Catppuccin Mocha: mantle (#181825)
tab_bar_background         #181825

# ── Tab bar margin color ──────────────────────────────────────────────────────
# Color of the margin areas at edges of the tab bar.
# Should match tab_bar_background for a seamless look.
tab_bar_margin_color       #181825

# ── Active tab: foreground ────────────────────────────────────────────────────
# Text color of the currently focused tab.
# Should contrast strongly with active_tab_background.
# [INJECTED] — Catppuccin Mocha: crust (#11111b) on mauve
active_tab_foreground      #1e1e2e

# ── Active tab: background ────────────────────────────────────────────────────
# Background color of the currently focused tab.
# Uses accent color — makes the active tab immediately identifiable.
# [INJECTED] — Catppuccin Mocha: mauve (#cba6f7)
active_tab_background      #cba6f7

# ── Inactive tab: foreground ──────────────────────────────────────────────────
# Text color of unfocused tabs.
# Should be readable but clearly secondary to active tab.
# [INJECTED] — Catppuccin Mocha: subtext0 (#a6adc8)
inactive_tab_foreground    #a6adc8

# ── Inactive tab: background ──────────────────────────────────────────────────
# Background of unfocused tabs.
# [INJECTED] — Catppuccin Mocha: surface0 (#313244)
inactive_tab_background    #313244

# ══════════════════════════════════════════════════════════════════════════════
# § 05  FONT SETTINGS FOR TAB BAR
# ══════════════════════════════════════════════════════════════════════════════

# ── Font weight per state ─────────────────────────────────────────────────────
# bold / normal / italic / bold_italic
#
# Active tab bold: makes the current tab title visually pop.
# Combined with the accent background, creates clear focus hierarchy.
active_tab_font_style      bold
inactive_tab_font_style    normal

# ── Note on font family ───────────────────────────────────────────────────────
# The tab bar uses the same font as the terminal content.
# Font family is set in fonts.conf (JetBrainsMono Nerd Font Mono).
# Nerd Font glyphs in tab titles (  etc.) render from the same font.
# No separate font configuration is needed for the tab bar.

# ── Tab title character encoding ──────────────────────────────────────────────
# Kitty renders tab titles as UTF-8.
# Emoji, Nerd Font icons, and any Unicode character can be used in templates.
# The font must support the glyphs — handled by fonts.conf symbol_map chains.

# ══════════════════════════════════════════════════════════════════════════════
# § 06  ACTIVITY & BELL INDICATORS
# ══════════════════════════════════════════════════════════════════════════════

# ── Bell border ───────────────────────────────────────────────────────────────
# When an unfocused tab has a window that rang the bell,
# its border (or tab indicator, depending on style) flashes.
# The color used for this notification. [INJECTED]
# Catppuccin Mocha: red (#f38ba8)
bell_border_color          #f38ba8

# ── Active border ─────────────────────────────────────────────────────────────
# Border color for the currently focused window. [INJECTED]
# Catppuccin Mocha: mauve (#cba6f7) — matches active tab background
active_border_color        #cba6f7

# ── Inactive border ───────────────────────────────────────────────────────────
# Border color for unfocused windows. [INJECTED]
# Catppuccin Mocha: surface0 (#313244)
inactive_border_color      #313244

# ── Window alert on bell ──────────────────────────────────────────────────────
# When a window in a background tab rings the bell,
# Kitty marks that tab in the tab bar with the bell_border_color.
# yes = enable this visual bell indicator in the tab bar
window_alert_on_bell       yes

# ── Activity indicator via title template ─────────────────────────────────────
# The tab title can include dynamic content via Python code in templates.
# Example: show ● if the tab has recent activity:
#   tab_title_template  "{index} {'●' if tab.is_active else '○'} {title[:16]}"
#
# Show different icons based on the active process:
# This is handled via the active Python tab bar kitten (see § 10).

# ══════════════════════════════════════════════════════════════════════════════
# § 07  TAB BAR MARGINS & PADDING
# ══════════════════════════════════════════════════════════════════════════════

# ── Tab bar margin width ──────────────────────────────────────────────────────
# Horizontal margin on left and right of the entire tab bar.
# 0px = flush to edges (full-width tab bar).
# >0px = floating tab bar with space on sides.
tab_bar_margin_width       0.0

# ── Tab bar margin height ─────────────────────────────────────────────────────
# Vertical margin above and below the tab bar.
# Format: "top bottom" in pixels.
# 0 0 = tab bar flush with window edges (most common).
# 4 0 = 4px gap above tab bar (floating appearance at top).
tab_bar_margin_height      0.0 0.0

# ── Individual tab padding ────────────────────────────────────────────────────
# Internal padding within each tab (around the tab title text).
# Controlled indirectly by the tab bar style and font metrics.
# For powerline style: padding is determined by the separator glyphs.
# For separator style: controlled by the separator string content.
#
# To increase tab width: add spaces to tab_title_template:
#   tab_title_template  " {index} {title[:16]} "  (note leading/trailing spaces)

# ══════════════════════════════════════════════════════════════════════════════
# § 08  CLOSE BEHAVIOR & CONFIRMATIONS
# ══════════════════════════════════════════════════════════════════════════════

# ── OS window close confirmation ─────────────────────────────────────────────
# Whether to ask for confirmation before closing an OS window with multiple tabs.
# 0 = never ask (close immediately)
# -1 = always ask
# N  = only ask if there are more than N tabs open
#
# 0 = no confirmation dialog (recommended for keyboard users who know what they do)
# -1 = always confirm (safer for shared/production machines)
confirm_os_window_close    0

# ── Close on shell exit ───────────────────────────────────────────────────────
# Behavior when the shell process in a window exits.
# no         = leave the window open (show exit message)
# yes        = close the window immediately
# last        = close the window only if it was the last window in the tab
# wait        = wait for user input before closing (useful for debug)
close_on_child_death       no

# ── Close behavior for "no" mode ──────────────────────────────────────────────
# When close_on_child_death is "no", the terminal shows:
#   "Process exited with code N. Press any key or click to close."
# This is handled automatically by Kitty — no config needed.

# ══════════════════════════════════════════════════════════════════════════════
# § 09  TAB LAYOUT BEHAVIOR
# ══════════════════════════════════════════════════════════════════════════════

# ── Remember layout per tab ───────────────────────────────────────────────────
# Each tab remembers its layout independently.
# Switching tabs restores the layout that tab was using.
# This is automatic in Kitty — no configuration needed.

# ── Default layout for new tabs ───────────────────────────────────────────────
# New tabs start with the first layout in enabled_layouts.
# To start new tabs with a specific layout, make it first in enabled_layouts.
# Set in kitty.conf: enabled_layouts splits,tall,fat,grid,...

# ── Tab size constraints ──────────────────────────────────────────────────────
# Kitty distributes tab bar space evenly.
# When many tabs are open, titles are truncated to fit.
# The {title[:N]} truncation in tab_title_template controls max chars shown.

# ── Tab overflow behavior ─────────────────────────────────────────────────────
# When tabs exceed the tab bar width:
# Kitty automatically scrolls the tab bar horizontally.
# Use ctrl+tab / super+N to navigate when many tabs are open.

# ══════════════════════════════════════════════════════════════════════════════
# § 10  CUSTOM TAB BAR (tab_bar.py kitten reference)
# ══════════════════════════════════════════════════════════════════════════════
# Kitty supports a fully custom tab bar via a Python kitten.
# The custom kitten replaces the built-in tab bar entirely.
# Location: ~/.config/kitty/tab_bar/tab_bar.py
#
# To activate custom tab bar:
#   tab_bar_style  custom
#
# The tab bar kitten receives tab state from Kitty and renders
# the tab bar as a standalone kitty window. Full control over:
#   • Per-tab icon based on active process (Nerd Font lookup)
#   • Progress bars in tabs (for long-running commands)
#   • Git branch display in tab title
#   • Network activity indicator
#   • Virtual environment indicator
#   • Battery level indicator in rightmost tab area
#   • Custom powerline segments
#   • Gradients, transparency, animations
#
# Reference implementations in kittens/tab_bar/:
#   tab_bar.py             ← Standard powerline implementation
#   tab_bar_fade.py        ← Fade effect between active/inactive
#   tab_bar_slant.py       ← Slanted separators
#   tab_bar_powerline.py   ← Full powerline with git + env indicators
#
# To use the powerline kitten with git support:
#   tab_bar_style          custom
#   # (tab_bar.py must be in ~/.config/kitty/tab_bar/)

# ── Custom tab bar activation ─────────────────────────────────────────────────
# Uncomment to activate the custom Python tab bar:
# tab_bar_style            custom

# ── Process icon map (used by custom tab bar) ─────────────────────────────────
# The custom tab bar looks up process names to assign Nerd Font icons.
# This map is also used by dynamic-icons.sh for consistency.
# Defined in: ~/.config/kitty/tab_bar/tab_bar.py
#
# Quick reference of process → icon mappings used:
#   nvim / vim / neovim    → 󰕷  (nf-md-language_lua)
#   fish / bash / zsh      → 󰆍  (nf-md-console_line)
#   python / python3       → 󰌠  (nf-md-language_python)
#   node / node_modules    → 󰎙  (nf-md-language_javascript)
#   cargo / rust           → 󱘗  (nf-md-language_rust)
#   go / gopls             → 󰟓  (nf-md-language_go)
#   docker / docker-compose→ 󰡨  (nf-md-docker)
#   git / lazygit          → 󰊤  (nf-md-git)
#   ssh / sshd             → 󰣀  (nf-md-server_network)
#   htop / btop / top      → 󰓅  (nf-md-chart_line)
#   yazi / ranger / lf     → 󰉋  (nf-md-folder)
#   curl / wget / http     → 󰖟  (nf-md-web)
#   kubectl / helm / k9s   → 󱃾  (nf-md-kubernetes)
#   terraform / tofu       → 󱁢  (nf-md-terraform)
#   make / cmake / ninja   → 󰒓  (nf-md-hammer_wrench)
#   mysql / psql / sqlite  → 󱏗  (nf-md-database)
#   cat / bat / less       → 󰈙  (nf-md-file_document)
#   default (unknown)      → 󰆍  (nf-md-console_line)

# ══════════════════════════════════════════════════════════════════════════════
# TAB SYSTEM QUICK REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  Creating tabs:
#    kitty_mod+t          New tab (same CWD)
#    super+t              New tab (same CWD) — system shortcut
#    kitty_mod+w          Close current tab
#
#  Navigating tabs:
#    super+1…9            Go to tab N directly
#    super+0              Go to last tab
#    ctrl+tab             Next tab
#    ctrl+shift+tab       Previous tab
#    kitty_mod+]          Next tab
#    kitty_mod+[          Previous tab
#
#  Managing tabs:
#    kitty_mod+F2         Rename current tab (interactive)
#    kitty_mod+shift+]    Move tab forward (to right)
#    kitty_mod+shift+[    Move tab backward (to left)
#    kitty_mod+shift+t    Detach window to new tab
#
#  Tab layout:
#    kitty_mod+space      Cycle layout for current tab
#    kitty_mod+alt+1-7    Switch to specific layout
#    kitty_mod+z          Maximize current pane (stack layout)
#    kitty_mod+shift+z    Return to previous layout
#
#  Windows within tabs:
#    kitty_mod+enter      New window (same CWD)
#    kitty_mod+q          Close window
#    kitty_mod+hjkl       Navigate between windows
#    kitty_mod+r          Start resize mode
#    kitty_mod+minus      Split horizontally
#    kitty_mod+backslash  Split vertically
# ══════════════════════════════════════════════════════════════════════════════