# ASH DOTFILES v5.0 OMEGA — KITTY KEYBINDS ULTRA SYSTEM
# ══════════════════════════════════════════════════════════════════════════════
# File    : keybinds.conf
# Author  : Ash Dotfiles v5.0 Omega
# License : MIT
# Desc    : Complete, ultra-optimized keyboard binding system for Kitty.
#           Every binding is intentional, documented, and conflict-free.
#           Designed for keyboard-driven power users with Neovim, Fish,
#           Hyprland, and the full ASH ecosystem in mind.
#
#   Design principles:
#     • Zero conflicts with Neovim, tmux, fish, or Hyprland bindings
#     • Logical grouping: kitty_mod = ctrl+shift (terminal ops)
#                         super = system-level ops
#                         alt   = semantic actions
#                         ctrl  = application pass-through
#     • CSI-u extended key encoding for Neovim compatibility
#     • Every group ends with a blank line + comment separator
#     • Kitten bindings for: hints, unicode, diff, ssh, broadcast
#     • ASH ecosystem bindings: theme, mode, snapshot, plugin
#
#   Modifier reference:
#     kitty_mod   → ctrl+shift   (primary Kitty modifier)
#     super       → Win/Cmd key  (system-level operations)
#     alt         → Alt/Meta     (semantic / secondary)
#     ctrl        → Ctrl         (passed to applications)
#
#   Section map:
#     § 01  Modifier definition & clear defaults
#     § 02  Window management      (new · close · focus · resize · swap)
#     § 03  Split management       (hsplit · vsplit · navigate · balance)
#     § 04  Tab management         (new · close · nav · move · rename)
#     § 05  Layout system          (cycle · goto · specific layouts)
#     § 06  Scrollback             (line · page · home/end · pager · search)
#     § 07  Clipboard              (copy · paste · selection · primary)
#     § 08  Font size              (zoom in/out · reset · presets)
#     § 09  Cursor & marks         (mark create · navigate · remove)
#     § 10  Hints kitten           (URL · path · word · hash · IP · line)
#     § 11  Kittens & tools        (unicode · diff · ssh · broadcast · icat)
#     § 12  Search & filter        (fzf integration · scrollback search)
#     § 13  Terminal control       (clear · reset · fullscreen · debug)
#     § 14  Remote control         (kitty @ commands via keybind)
#     § 15  ASH ecosystem          (theme · mode · snapshot · plugin · doctor)
#     § 16  Application launch     (editor · file manager · multiplexer)
#     § 17  Send text sequences    (escape codes · special chars)
#     § 18  Submap / modal keys    (resize mode · scroll mode)
#     § 19  Numpad & function keys (F1–F12 · numpad passthrough)
#     § 20  Accessibility          (high contrast · font boost · slow keys)
# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
# § 01  MODIFIER DEFINITION & DEFAULTS
# ══════════════════════════════════════════════════════════════════════════════

# Primary modifier: ctrl+shift
# This is the universal Kitty modifier — it never conflicts with applications
# because applications receive ctrl+key without the shift modifier.
kitty_mod              ctrl+shift

# Keep all of Kitty's built-in defaults, then selectively override below.
# Setting this to "yes" would wipe everything — we overlay instead.
clear_all_shortcuts    no

# ── Key encoding ──────────────────────────────────────────────────────────────
# CSI-u extended encoding: level 3 (disambiguate + report all)
# Required for Neovim to distinguish: ctrl+i vs Tab, ctrl+m vs Enter, etc.
# Set in kitty.conf — documented here for cross-reference.
# kitty_key_encoding 3

# ══════════════════════════════════════════════════════════════════════════════
# § 02  WINDOW MANAGEMENT
# ══════════════════════════════════════════════════════════════════════════════
# Kitty "windows" = panes within a tab (not OS windows).
# OS windows (actual Kitty processes) use "os_window" terminology.

# ── Create windows ────────────────────────────────────────────────────────────
# Open a new pane in the current directory (CWD tracking via shell integration)
map kitty_mod+enter          new_window_with_cwd

# Open a new OS window (separate Kitty process) with same CWD
map kitty_mod+n              new_os_window_with_cwd

# Open a new OS window (default CWD = home)
map kitty_mod+shift+n        new_os_window

# Super+Enter: like terminal multiplexer "new pane" in Hyprland workflow
map super+enter              new_window_with_cwd

# ── Close windows ─────────────────────────────────────────────────────────────
# Close the active window/pane (does NOT close if it's the last pane in tab)
map kitty_mod+q              close_window

# Force close — close even if it's the only window in the tab
map kitty_mod+shift+q        close_window

# Close OS window
map kitty_mod+alt+q          close_os_window

# ── Window focus navigation ────────────────────────────────────────────────────
# Vim-style navigation (hjkl) — matches Hyprland & Neovim muscle memory
map kitty_mod+h              neighboring_window left
map kitty_mod+j              neighboring_window down
map kitty_mod+k              neighboring_window up
map kitty_mod+l              neighboring_window right

# Arrow key navigation (for non-vim users)
map kitty_mod+left           neighboring_window left
map kitty_mod+down           neighboring_window down
map kitty_mod+up             neighboring_window up
map kitty_mod+right          neighboring_window right

# Cycle windows forward / backward
map kitty_mod+]              next_window
map kitty_mod+[              previous_window

# Focus window by visual position (1-indexed)
map kitty_mod+1              first_window
map kitty_mod+2              second_window
map kitty_mod+3              third_window
map kitty_mod+4              fourth_window
map kitty_mod+5              fifth_window
map kitty_mod+6              sixth_window
map kitty_mod+7              seventh_window
map kitty_mod+8              eighth_window
map kitty_mod+9              ninth_window
map kitty_mod+0              tenth_window

# ── Window resize ─────────────────────────────────────────────────────────────
# Interactive resize mode (press Enter or Escape to exit)
map kitty_mod+r              start_resizing_window

# Direct resize: shift+hjkl for fine control
map kitty_mod+shift+h        resize_window narrower 3
map kitty_mod+shift+l        resize_window wider 3
map kitty_mod+shift+k        resize_window taller 3
map kitty_mod+shift+j        resize_window shorter 3

# Large resize steps with alt+hjkl
map kitty_mod+alt+h          resize_window narrower 10
map kitty_mod+alt+l          resize_window wider 10
map kitty_mod+alt+k          resize_window taller 10
map kitty_mod+alt+j          resize_window shorter 10

# Reset window to equal size (balance layout)
map kitty_mod+alt+r          resize_window reset

# ── Window movement ───────────────────────────────────────────────────────────
# Move the active window in the layout grid
map kitty_mod+shift+left     move_window left
map kitty_mod+shift+right    move_window right
map kitty_mod+shift+up       move_window up
map kitty_mod+shift+down     move_window down

# Move window to specific position in list
map kitty_mod+shift+1        move_window_to_top
map kitty_mod+shift+f        swap_with_window

# Detach window to a new tab
map kitty_mod+shift+d        detach_window new-tab

# Detach window to a specific tab (interactive picker)
map kitty_mod+shift+t        detach_window ask

# ── Window swap ───────────────────────────────────────────────────────────────
# Swap with the previous/next window in layout order
map kitty_mod+shift+]        move_window_forward
map kitty_mod+shift+[        move_window_backward

# ══════════════════════════════════════════════════════════════════════════════
# § 03  SPLIT MANAGEMENT (splits layout)
# ══════════════════════════════════════════════════════════════════════════════
# The "splits" layout allows arbitrary tiling (like tmux pane splitting).
# These bindings only make sense when the splits layout is active.
# Switch to splits: kitty_mod+alt+s (§ 05)

# ── Create splits ─────────────────────────────────────────────────────────────
# Horizontal split (new pane below, same CWD)
map kitty_mod+minus          launch --location=hsplit --cwd=current

# Vertical split (new pane to the right, same CWD)
map kitty_mod+backslash      launch --location=vsplit --cwd=current

# Horizontal split (new pane below, default CWD)
map kitty_mod+shift+minus    launch --location=hsplit

# Vertical split (new pane to right, default CWD)
map kitty_mod+shift+backslash  launch --location=vsplit

# Split with specific command (new pane runs htop)
map kitty_mod+alt+minus      launch --location=hsplit --cwd=current htop
map kitty_mod+alt+backslash  launch --location=vsplit --cwd=current htop

# ── Navigate splits ────────────────────────────────────────────────────────────
# Same as window navigation above — splits ARE windows in Kitty.
# kitty_mod+hjkl = navigate between splits/panes (already defined in § 02)

# ── Rotate & flip splits ──────────────────────────────────────────────────────
# Rotate the splits layout clockwise/counterclockwise
map kitty_mod+ctrl+r         layout_action rotate

# Mirror the splits layout horizontally
map kitty_mod+ctrl+h         layout_action mirror horizontal

# Mirror the splits layout vertically
map kitty_mod+ctrl+v         layout_action mirror vertical

# ── Balance splits ────────────────────────────────────────────────────────────
# Make all splits equal size
map kitty_mod+ctrl+b         layout_action balance

# ══════════════════════════════════════════════════════════════════════════════
# § 04  TAB MANAGEMENT
# ══════════════════════════════════════════════════════════════════════════════
# Tabs = separate workspaces within one Kitty OS window.
# Each tab can have its own layout, windows, and sessions.

# ── Create tabs ───────────────────────────────────────────────────────────────
# New tab with same CWD as current window
map kitty_mod+t              new_tab_with_cwd
map super+t                  new_tab_with_cwd

# New tab with home directory
map kitty_mod+shift+ctrl+t   new_tab

# New tab with a specific title (prompts for input)
map kitty_mod+alt+t          new_tab_with_cwd
# Then immediately rename it:
# Tip: use kitty_mod+F2 for tab rename (defined below)

# ── Close tabs ────────────────────────────────────────────────────────────────
# Close the current tab (closes all windows in it)
map kitty_mod+w              close_tab
map super+w                  close_tab

# ── Tab navigation ────────────────────────────────────────────────────────────
# Go to next / previous tab (wraps around)
map kitty_mod+right          next_tab
map kitty_mod+left           previous_tab

# Alt variants (convenient for one-handed)
map alt+shift+]              next_tab
map alt+shift+[              previous_tab

# Ctrl+Tab / Ctrl+Shift+Tab (system-wide convention)
map ctrl+tab                 next_tab
map ctrl+shift+tab           previous_tab

# ── Tab quick-jump by number ──────────────────────────────────────────────────
# Super+1-9 = jump directly to tab N
map super+1                  goto_tab 1
map super+2                  goto_tab 2
map super+3                  goto_tab 3
map super+4                  goto_tab 4
map super+5                  goto_tab 5
map super+6                  goto_tab 6
map super+7                  goto_tab 7
map super+8                  goto_tab 8
map super+9                  goto_tab 9

# Super+0 = last tab
map super+0                  goto_tab -1

# Alt+1-9 = alternate tab quick-jump
map alt+1                    goto_tab 1
map alt+2                    goto_tab 2
map alt+3                    goto_tab 3
map alt+4                    goto_tab 4
map alt+5                    goto_tab 5

# ── Move tabs ─────────────────────────────────────────────────────────────────
# Reorder the current tab left or right in the tab bar
map kitty_mod+shift+right    move_tab_forward
map kitty_mod+shift+left     move_tab_backward

# Move tab to the first / last position
map kitty_mod+shift+home     move_tab_forward
map kitty_mod+shift+end      move_tab_backward

# ── Rename tab ────────────────────────────────────────────────────────────────
# Interactive prompt to rename the current tab
map kitty_mod+F2             set_tab_title

# ── Tab with specific layout ──────────────────────────────────────────────────
# Open a new tab pre-configured with a specific layout
map kitty_mod+ctrl+1         launch --type=tab --layout=tall --cwd=current
map kitty_mod+ctrl+2         launch --type=tab --layout=grid --cwd=current
map kitty_mod+ctrl+3         launch --type=tab --layout=splits --cwd=current

# ══════════════════════════════════════════════════════════════════════════════
# § 05  LAYOUT SYSTEM
# ══════════════════════════════════════════════════════════════════════════════
# Kitty's layout system controls how windows are arranged within a tab.
# Layouts: tall, fat, grid, horizontal, vertical, splits, stack

# ── Cycle layouts ─────────────────────────────────────────────────────────────
# Cycle through all enabled layouts in order
map kitty_mod+space          next_layout

# Cycle backwards
map kitty_mod+shift+space    next_layout

# ── Go to specific layout ─────────────────────────────────────────────────────
map kitty_mod+alt+1          goto_layout tall
map kitty_mod+alt+2          goto_layout fat
map kitty_mod+alt+3          goto_layout grid
map kitty_mod+alt+4          goto_layout horizontal
map kitty_mod+alt+5          goto_layout vertical
map kitty_mod+alt+6          goto_layout splits
map kitty_mod+alt+7          goto_layout stack

# ── Layout shortcuts ──────────────────────────────────────────────────────────
# Stack = fullscreen single window (like maximized in splits)
map kitty_mod+z              goto_layout stack
# Return from stack to previous layout
map kitty_mod+shift+z        last_used_layout

# ── Tall layout actions ────────────────────────────────────────────────────────
# Adjust the bias (main pane width %) in tall layout
map kitty_mod+ctrl+.         layout_action increase_num_full_size_windows
map kitty_mod+ctrl+,         layout_action decrease_num_full_size_windows

# ══════════════════════════════════════════════════════════════════════════════
# § 06  SCROLLBACK
# ══════════════════════════════════════════════════════════════════════════════
# Full scrollback control — all navigation modes covered.
# Scrollback config (buffer size, pager program) is in scrollback.conf.

# ── Line scrolling ────────────────────────────────────────────────────────────
# Scroll one line up / down
map kitty_mod+up             scroll_line_up
map kitty_mod+down           scroll_line_down
map kitty_mod+k              scroll_line_up
map kitty_mod+j              scroll_line_down

# ── Page scrolling ────────────────────────────────────────────────────────────
# Scroll one page (screen height) up / down
map kitty_mod+page_up        scroll_page_up
map kitty_mod+page_down      scroll_page_down
map super+page_up            scroll_page_up
map super+page_down          scroll_page_down

# ── Home / End ────────────────────────────────────────────────────────────────
# Jump to start or end of scrollback buffer
map kitty_mod+home           scroll_home
map kitty_mod+end            scroll_end
map super+home               scroll_home
map super+end                scroll_end

# ── Scrollback pager ──────────────────────────────────────────────────────────
# Open full scrollback in the configured pager (bat + less)
map kitty_mod+g              show_scrollback

# Open just the last command's output in pager
map kitty_mod+shift+g        show_last_command_output

# Open last shell prompt's output (requires shell integration)
map kitty_mod+ctrl+g         show_last_visited_command_output

# ── Scrollback search ─────────────────────────────────────────────────────────
# Search scrollback with fzf (defined more fully in § 12)
map kitty_mod+f              launch --type=overlay \
    --stdin-source=@screen_scrollback \
    fzf --no-sort --no-mouse --exact -i --tac \
    --preview 'echo {}' --preview-window=up:3:wrap

# ── Scroll to prompt ──────────────────────────────────────────────────────────
# Jump between previous shell prompts (requires shell integration)
map kitty_mod+z              scroll_to_prompt -1
map kitty_mod+x              scroll_to_prompt 1

# ── Mouse scroll ──────────────────────────────────────────────────────────────
# Ctrl+Scroll = fast scroll (5× multiplier configured in scrollback.conf)
mouse_map ctrl+wheel_up      no-op
mouse_map ctrl+wheel_down    no-op

# ══════════════════════════════════════════════════════════════════════════════
# § 07  CLIPBOARD
# ══════════════════════════════════════════════════════════════════════════════

# ── Copy ──────────────────────────────────────────────────────────────────────
# Copy selected text to system clipboard
map kitty_mod+c              copy_to_clipboard
map super+c                  copy_to_clipboard

# Copy + clear selection (removes selection highlight after copy)
map kitty_mod+shift+c        copy_and_clear_or_interrupt

# ── Paste ─────────────────────────────────────────────────────────────────────
# Paste from system clipboard
map kitty_mod+v              paste_from_clipboard
map super+v                  paste_from_clipboard

# Paste from PRIMARY selection (middle-click buffer on X11/Wayland)
map kitty_mod+s              paste_from_selection
map shift+insert             paste_from_selection

# ── Clipboard utilities ───────────────────────────────────────────────────────
# Copy current selection to wl-clipboard (for Wayland interop)
map kitty_mod+o              pass_selection_to_program wl-copy

# Open selected URL/path in default application
map kitty_mod+shift+o        pass_selection_to_program xdg-open

# Copy selected text and show confirmation notification
map kitty_mod+alt+c          copy_to_clipboard

# ── Bracketed paste protection ────────────────────────────────────────────────
# Kitty enables bracketed paste automatically — no keybind needed.
# Apps that support it will receive pasted text safely.

# ══════════════════════════════════════════════════════════════════════════════
# § 08  FONT SIZE
# ══════════════════════════════════════════════════════════════════════════════

# ── Increase font size ────────────────────────────────────────────────────────
# All windows: +1pt
map kitty_mod+equal          change_font_size all +1.0
map kitty_mod+plus           change_font_size all +1.0
map kitty_mod+kp_add         change_font_size all +1.0

# All windows: +2pt (fast zoom for presentations)
map super+equal              change_font_size all +2.0
map super+plus               change_font_size all +2.0

# Current window only: +1pt
map kitty_mod+shift+equal    change_font_size current +1.0

# ── Decrease font size ────────────────────────────────────────────────────────
# All windows: -1pt
map kitty_mod+minus          change_font_size all -1.0
map kitty_mod+kp_subtract    change_font_size all -1.0

# All windows: -2pt
map super+minus              change_font_size all -2.0

# Current window only: -1pt
map kitty_mod+shift+minus    change_font_size current -1.0

# ── Reset font size ───────────────────────────────────────────────────────────
# Reset all windows to the configured base font_size
map kitty_mod+0              change_font_size all 0
map super+0                  change_font_size all 0
map kitty_mod+kp_0           change_font_size all 0

# ── Font size presets ─────────────────────────────────────────────────────────
# Jump directly to specific sizes for different contexts
# Small (dense coding):
map kitty_mod+F9             change_font_size all 10.0
# Medium (default):
map kitty_mod+F10            change_font_size all 12.5
# Large (presentations):
map kitty_mod+F11            change_font_size all 16.0
# Extra large (screencasting):
map kitty_mod+F12            change_font_size all 20.0

# ══════════════════════════════════════════════════════════════════════════════
# § 09  CURSOR & MARKS
# ══════════════════════════════════════════════════════════════════════════════
# Marks are colored annotations you can place on terminal output.
# Three independent mark types, each with its own color (set in colors.conf).

# ── Create marks ──────────────────────────────────────────────────────────────
# Interactive mark creation (prompts for type and pattern)
map kitty_mod+m              create_marker

# Toggle a mark of each type (pre-defined patterns)
# Mark type 1 (mauve): highlight ERROR lines
map kitty_mod+F1             toggle_marker iregex 0 ERROR|FATAL|CRITICAL

# Mark type 2 (blue): highlight WARNING lines
map kitty_mod+F2             toggle_marker iregex 1 WARNING|WARN

# Mark type 3 (green): highlight SUCCESS / OK lines
map kitty_mod+F3             toggle_marker iregex 2 SUCCESS|PASSED|OK|DONE

# ── Navigate marks ────────────────────────────────────────────────────────────
# Jump to previous marked line
map kitty_mod+shift+F1       scroll_to_mark prev

# Jump to next marked line
map kitty_mod+shift+F2       scroll_to_mark next

# ── Remove marks ──────────────────────────────────────────────────────────────
# Remove all active marks
map kitty_mod+F4             remove_marker

# ══════════════════════════════════════════════════════════════════════════════
# § 10  HINTS KITTEN
# ══════════════════════════════════════════════════════════════════════════════
# The hints kitten makes text on screen interactively selectable.
# It overlays a selection UI that lets you click/type to choose items.

# ── URL hints ─────────────────────────────────────────────────────────────────
# Open URL in browser (default action: xdg-open)
map kitty_mod+e              kitten hints

# Copy URL to clipboard (instead of opening)
map kitty_mod+shift+e        kitten hints --type hyperlink --program @

# ── File path hints ───────────────────────────────────────────────────────────
# Copy a file path from the terminal output
map kitty_mod+p              kitten hints --type path --program @

# Open a file path with the default application
map kitty_mod+shift+p        kitten hints --type path --program default

# Open a file path in Neovim
map kitty_mod+alt+p          kitten hints --type path --program nvim

# Open a file path in the configured editor
map super+p                  kitten hints --type path

# ── Line hints ────────────────────────────────────────────────────────────────
# Select an entire line and copy to clipboard
map kitty_mod+y              kitten hints --type line --program @

# Select a line and paste into the terminal
map kitty_mod+shift+y        kitten hints --type line --program -

# ── Word hints ────────────────────────────────────────────────────────────────
# Select any word on screen and copy
map kitty_mod+alt+y          kitten hints --type word --program @

# Select a word and insert at cursor
map kitty_mod+alt+shift+y    kitten hints --type word --program -

# ── Hash hints (git SHAs, docker IDs) ────────────────────────────────────────
# Detect and copy commit hashes, container IDs, etc.
map kitty_mod+alt+e          kitten hints --type hash --program @

# ── IP address hints ──────────────────────────────────────────────────────────
# Detect IPv4/IPv6 addresses and copy
map kitty_mod+alt+i          kitten hints --type ip --program @

# ── Regex hints ───────────────────────────────────────────────────────────────
# Custom regex: match anything that looks like a number
map kitty_mod+alt+n          kitten hints --regex '\d+' --program @

# ── Open selection with custom program ────────────────────────────────────────
# Select URL and open with Firefox specifically
map kitty_mod+ctrl+e         kitten hints --type url --program firefox

# Select path and open with yazi file manager
map kitty_mod+ctrl+p         kitten hints --type path --program yazi

# ══════════════════════════════════════════════════════════════════════════════
# § 11  KITTENS & TOOLS
# ══════════════════════════════════════════════════════════════════════════════

# ── Unicode input ─────────────────────────────────────────────────────────────
# Open the unicode character picker
map kitty_mod+u              kitten unicode_input

# ── Diff kitten ───────────────────────────────────────────────────────────────
# Side-by-side diff viewer (uses bat for syntax highlighting)
map kitty_mod+d              kitten diff

# ── SSH kitten ────────────────────────────────────────────────────────────────
# SSH with automatic kitty terminfo copying to remote host
map kitty_mod+shift+s        kitten ssh

# ── Broadcast kitten ──────────────────────────────────────────────────────────
# Send keystrokes to ALL windows simultaneously (admin / sysadmin use)
map kitty_mod+b              kitten broadcast

# Broadcast to all windows in current tab only
map kitty_mod+shift+b        kitten broadcast --match-tab current

# ── icat kitten ──────────────────────────────────────────────────────────────
# Display an image in the terminal (using Kitty's graphics protocol)
# Useful for quickly previewing images from the command line.
# Usage via command: kitty +kitten icat image.png
# No default keybind — invoked from shell.

# ── Theme preview kitten ─────────────────────────────────────────────────────
# Preview a theme without applying it (defined in kittens/theme-preview-kitten.py)
map super+shift+p            launch --type=overlay \
    bash -c "ash theme pick --preview"

# ── Clipboard history kitten ─────────────────────────────────────────────────
# Open clipboard history via cliphist + fzf
map kitty_mod+alt+v          launch --type=overlay \
    bash -c "cliphist list | fzf --no-sort -e | cliphist decode | wl-copy"

# ══════════════════════════════════════════════════════════════════════════════
# § 12  SEARCH & FILTER
# ══════════════════════════════════════════════════════════════════════════════

# ── Scrollback fzf search ─────────────────────────────────────────────────────
# Fuzzy search through scrollback buffer with fzf
# Uses full-screen overlay for immersive search experience
map kitty_mod+f              launch --type=overlay \
    --stdin-source=@screen_scrollback \
    bash -c "fzf \
        --no-sort \
        --no-mouse \
        --exact \
        --tac \
        -i \
        --color='bg:#1e1e2e,fg:#cdd6f4,hl:#cba6f7,hl+:#cba6f7' \
        --color='bg+:#313244,fg+:#cdd6f4,info:#89b4fa,border:#585b70' \
        --color='prompt:#cba6f7,pointer:#cba6f7,marker:#a6e3a1,spinner:#f5c2e7' \
        --prompt='  Search scrollback › ' \
        --pointer='›' \
        --preview 'echo {}' \
        --preview-window=up:3:wrap \
        --bind 'ctrl-y:execute-silent(echo {} | wl-copy)'"

# ── Command output search ─────────────────────────────────────────────────────
# Search only the last command's output
map kitty_mod+shift+f        launch --type=overlay \
    --stdin-source=@last_cmd_output \
    bash -c "fzf \
        --no-sort \
        --tac \
        -i \
        --color='bg:#1e1e2e,fg:#cdd6f4,hl:#cba6f7' \
        --prompt='  Last output › '"

# ── Process search ────────────────────────────────────────────────────────────
# Interactive process viewer/killer via fzf + ps
map kitty_mod+alt+f          launch --type=overlay \
    bash -c "ps aux | fzf \
        --header-lines=1 \
        --multi \
        --color='bg:#1e1e2e,fg:#cdd6f4,hl:#f38ba8' \
        --prompt='  Process › ' \
        --bind 'ctrl-k:execute-silent(kill -9 {2})'"

# ══════════════════════════════════════════════════════════════════════════════
# § 13  TERMINAL CONTROL
# ══════════════════════════════════════════════════════════════════════════════

# ── Clear terminal ────────────────────────────────────────────────────────────
# Clear visible screen only (like Ctrl+L — keeps scrollback)
map kitty_mod+ctrl+l         clear_terminal scroll active

# Clear screen + scrollback completely (nuclear option)
map kitty_mod+delete         clear_terminal scrollback active

# Reset terminal to default state (fixes broken terminals)
map kitty_mod+ctrl+delete    clear_terminal reset active

# ── Fullscreen ────────────────────────────────────────────────────────────────
# Toggle OS window fullscreen
map kitty_mod+F11            toggle_fullscreen
map super+f                  toggle_fullscreen

# ── Maximize / minimize ───────────────────────────────────────────────────────
# Toggle maximized state (not fullscreen — keeps title bar)
map kitty_mod+F10            toggle_maximized
map super+m                  toggle_maximized

# ── Config reload ─────────────────────────────────────────────────────────────
# Reload kitty.conf + all includes without restarting Kitty
map kitty_mod+F5             load_config_file

# ── Debug rendering ───────────────────────────────────────────────────────────
# Show rendering information overlay (FPS, GPU usage, font metrics)
map kitty_mod+F6             debug_config

# ── Input method ──────────────────────────────────────────────────────────────
# Toggle IME (Wayland input method editor) for CJK input
map super+i                  kitten show_key

# ── Interrupt (Ctrl+C equivalent) ────────────────────────────────────────────
# Send interrupt signal to the foreground process
# (This is already handled by the terminal — no keybind needed,
#  but documented here for completeness.)

# ══════════════════════════════════════════════════════════════════════════════
# § 14  REMOTE CONTROL (kitty @ commands)
# ══════════════════════════════════════════════════════════════════════════════
# These bindings execute kitty @ commands to control Kitty remotely.
# Requires: allow_remote_control yes (set in kitty.conf)

# ── Send text to specific window ──────────────────────────────────────────────
# Send a command to the first window in the current tab
# (Useful for sending commands to a running REPL/server without switching)
map kitty_mod+ctrl+enter     launch --type=overlay \
    bash -c "kitty @ send-text --match-tab current --stdin"

# ── Focus window by title ─────────────────────────────────────────────────────
# Focus the window running nvim
map kitty_mod+ctrl+n         kitten focus_window nvim

# Focus the window running fish
map kitty_mod+ctrl+f         kitten focus_window fish

# ── Set background ────────────────────────────────────────────────────────────
# Change Kitty's background opacity on the fly
map kitty_mod+ctrl+minus     set_background_opacity -0.1
map kitty_mod+ctrl+equal     set_background_opacity +0.1
map kitty_mod+ctrl+0         set_background_opacity default

# ══════════════════════════════════════════════════════════════════════════════
# § 15  ASH ECOSYSTEM INTEGRATION
# ══════════════════════════════════════════════════════════════════════════════
# Direct keyboard access to the ASH dotfiles management system.

# ── Theme operations ──────────────────────────────────────────────────────────
# Open the ASH theme picker (rofi-based, floating overlay)
map super+shift+t            launch --type=overlay \
    bash -c "rofi -show theme-picker \
        -modi 'theme-picker:~/.config/rofi/menus/theme-picker/theme-picker.sh' \
        -theme ~/.config/rofi/menus/theme-picker/theme-picker.rasi"

# Apply a random theme
map super+alt+t              launch --type=background \
    bash -c "ash theme random && notify-send '🎨 Theme' 'Random theme applied'"

# Reload current theme (re-apply without changing)
map super+ctrl+t             launch --type=background \
    bash -c "ash theme reload && notify-send '🔄 Theme' 'Theme reloaded'"

# ── Mode operations ───────────────────────────────────────────────────────────
# Open the ASH mode selector
map super+shift+m            launch --type=overlay \
    bash -c "rofi -show mode-selector \
        -modi 'mode-selector:~/.config/rofi/menus/mode-selector/mode-selector.sh' \
        -theme ~/.config/rofi/menus/mode-selector/mode-selector.rasi"

# Toggle game mode
map super+alt+g              launch --type=background \
    bash -c "ash mode game && notify-send '🎮 Mode' 'Game mode activated'"

# Toggle focus mode
map super+alt+f              launch --type=background \
    bash -c "ash mode focus && notify-send '🧘 Mode' 'Focus mode activated'"

# ── Snapshot operations ───────────────────────────────────────────────────────
# Create a quick ASH snapshot (config backup)
map kitty_mod+ctrl+s         launch --type=overlay \
    bash -c "ash snapshot create --name 'kitty-session' \
        && echo '✓ Snapshot created'"

# ── Plugin manager ────────────────────────────────────────────────────────────
# Open the plugin manager rofi interface
map super+shift+x            launch --type=overlay \
    bash -c "rofi -show plugin-manager \
        -modi 'plugin-manager:~/.config/rofi/menus/plugin-manager/plugin-manager.sh' \
        -theme ~/.config/rofi/menus/plugin-manager/plugin-manager.rasi"

# ── Doctor ────────────────────────────────────────────────────────────────────
# Run ASH doctor in an overlay window
map kitty_mod+ctrl+d         launch --type=overlay \
    bash -c "ash doctor full; echo ''; echo 'Press any key to close…'; read -rn1"

# ── QuickNote ─────────────────────────────────────────────────────────────────
# Open the ASH QuickNote interface
map super+shift+n            launch --type=overlay \
    bash -c "rofi -show quicknote \
        -modi 'quicknote:~/.config/rofi/menus/quicknote/quicknote.sh' \
        -theme ~/.config/rofi/menus/quicknote/quicknote.rasi"

# ═══════════════════════════════════════════════════════════════════════════════
# § 16  APPLICATION LAUNCH
# ══════════════════════════════════════════════════════════════════════════════
# Quickly launch common applications in new windows or overlays.

# ── Editor ────────────────────────────────────────────────────────────────────
# Open Neovim in a new window (current CWD)
map super+e                  launch --cwd=current nvim

# Open Neovim in a new tab
map super+shift+e            launch --type=tab --cwd=current nvim

# ── File manager ──────────────────────────────────────────────────────────────
# Open Yazi file manager in an overlay
map super+y                  launch --type=overlay --cwd=current yazi

# Open Yazi in a new window
map super+shift+y            launch --cwd=current yazi

# ── System monitor ────────────────────────────────────────────────────────────
# Open btop system monitor
map kitty_mod+ctrl+m         launch --type=overlay btop

# Open htop
map kitty_mod+ctrl+h         launch --type=overlay htop

# ── Git interface ─────────────────────────────────────────────────────────────
# Open lazygit in an overlay (current CWD)
map kitty_mod+ctrl+g         launch --type=overlay --cwd=current lazygit

# ── Python REPL ───────────────────────────────────────────────────────────────
map kitty_mod+ctrl+p         launch --type=overlay \
    bash -c "python3 -q"

# ── Node.js REPL ──────────────────────────────────────────────────────────────
map kitty_mod+ctrl+j         launch --type=overlay node

# ── Database client ───────────────────────────────────────────────────────────
# Open pgcli (PostgreSQL) in a new window
map kitty_mod+ctrl+q         launch --cwd=current \
    bash -c "pgcli 2>/dev/null || sqlite3 2>/dev/null || echo 'No DB client found'"

# ══════════════════════════════════════════════════════════════════════════════
# § 17  SEND TEXT SEQUENCES
# ══════════════════════════════════════════════════════════════════════════════
# Send raw escape sequences or text strings to the terminal.
# Useful for triggering special terminal features or fixing stuck states.

# ── Escape sequences ──────────────────────────────────────────────────────────
# Send Ctrl+C (interrupt) — redundant with actual Ctrl+C but useful in macros
map kitty_mod+ctrl+c         send_text all \x03

# Send Ctrl+Z (suspend to background)
map kitty_mod+ctrl+z         send_text all \x1a

# Send Ctrl+D (EOF / logout)
map kitty_mod+alt+d          send_text all \x04

# ── Special Neovim sequences ──────────────────────────────────────────────────
# Send <Esc> to Neovim when needed (useful in insert mode with CSI-u)
map kitty_mod+escape         send_text all \x1b

# Send <CR> (Enter) explicitly
map kitty_mod+alt+enter      send_text all \r

# ── Fix stuck terminal ────────────────────────────────────────────────────────
# Send 'reset' command followed by Enter (recovers from garbled display)
map kitty_mod+ctrl+r         send_text all reset\r

# ══════════════════════════════════════════════════════════════════════════════
# § 18  SUBMAPS / MODAL KEYS
# ══════════════════════════════════════════════════════════════════════════════
# Submaps = modal key binding layers (like vim modes, but for Kitty).
# Enter a submap → bindings change → press Esc to exit.
#
# Currently defined submaps:
#   resize_window  → kitty_mod+r enters it (§ 02 start_resizing_window)
#   scroll         → see below

# ── Scroll submap ─────────────────────────────────────────────────────────────
# Enter scroll mode: hjkl / arrows for navigation, q/Esc to exit.
# Note: Kitty's built-in scrolling already works in normal mode.
# This is for a "locked scroll mode" workflow if preferred.

# Enter scroll submap (demonstrates the concept)
# map kitty_mod+ctrl+scroll   push_keyboard_mode scroll_mode
# map --subset scroll_mode h  scroll_line_up
# map --subset scroll_mode l  scroll_line_down
# map --subset scroll_mode k  scroll_page_up
# map --subset scroll_mode j  scroll_page_down
# map --subset scroll_mode q  pop_keyboard_mode
# map --subset scroll_mode escape  pop_keyboard_mode

# ══════════════════════════════════════════════════════════════════════════════
# § 19  FUNCTION KEYS & NUMPAD
# ══════════════════════════════════════════════════════════════════════════════

# ── Function key reference ────────────────────────────────────────────────────
# F1–F4:  Mark operations     (§ 09)
# F5:     Reload config       (§ 13)
# F6:     Debug config        (§ 13)
# F9-F12: Font size presets   (§ 08)

# ── Pass-through function keys ────────────────────────────────────────────────
# Ensure F1-F12 are passed to applications unmodified.
# Kitty passes these through by default — listed here for documentation.

# ── Numpad ────────────────────────────────────────────────────────────────────
# Ensure numpad keys are passed to applications.
# kitty_mod+kp_add    = font size increase (§ 08)
# kitty_mod+kp_subtract = font size decrease (§ 08)
# kitty_mod+kp_0     = font size reset (§ 08)

# Pass numpad enter as Enter (not as a special key)
map kp_enter                 send_text all \r

# ══════════════════════════════════════════════════════════════════════════════
# § 20  ACCESSIBILITY
# ══════════════════════════════════════════════════════════════════════════════

# ── High contrast mode ────────────────────────────────────────────────────────
# Switch to the ASH high-contrast accessibility theme
map super+alt+h              launch --type=background \
    bash -c "ash theme apply accessibility-high-contrast \
        && notify-send '♿ Accessibility' 'High contrast mode enabled'"

# ── Font boost for low vision ─────────────────────────────────────────────────
# Increase font size significantly for low-vision accessibility
map super+alt+plus           change_font_size all +4.0

# Mega boost (for screencasting / sharing screen)
map super+alt+shift+plus     change_font_size all +8.0

# ── Reduce motion ─────────────────────────────────────────────────────────────
# Disable animations via ASH config
map super+alt+a              launch --type=background \
    bash -c "ash config set hyprland.animations none \
        && hyprctl reload \
        && notify-send '♿ Accessibility' 'Animations disabled'"

# ── Screen magnification ──────────────────────────────────────────────────────
# These are handled at the Hyprland level (wl-gammarelay etc.)
# Mapped here as documentation markers.

