# § 10  SEMANTIC COLOR DOCUMENTATION
# ══════════════════════════════════════════════════════════════════════════════
# Documentation of how theme colors map to terminal semantics.
# This section is reference-only — no actual Kitty directives here.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  Semantic Role          → color_name       → Hex (Mocha default)        │
# ├─────────────────────────────────────────────────────────────────────────┤
# │  terminal background    → background       → #1e1e2e                    │
# │  terminal foreground    → foreground       → #cdd6f4                    │
# │  cursor                 → cursor           → #cba6f7  (accent)          │
# │  cursor text            → cursor_text      → #1e1e2e                    │
# │  selection bg           → selection_bg     → #414055                    │
# │  URLs                   → url_color        → #89b4fa  (blue)            │
# │  errors (ANSI)          → color1 / color9  → #f38ba8 / #eba0ac          │
# │  success (ANSI)         → color2 / color10 → #a6e3a1                    │
# │  warnings (ANSI)        → color3 / color11 → #f9e2af / #fab387          │
# │  info / links (ANSI)    → color4 / color12 → #89b4fa / #89dceb          │
# │  accent / special       → color5 / color13 → #cba6f7 / #f5c2e7          │
# │  strings / types (ANSI) → color6 / color14 → #94e2d5 / #89dceb          │
# │  active tab             → active_tab_bg    → #cba6f7  (accent)          │
# │  inactive tab           → inactive_tab_bg  → #313244                    │
# │  active border          → active_border    → #cba6f7  (accent)          │
# │  bell border            → bell_border      → #f38ba8  (red)             │
# └─────────────────────────────────────────────────────────────────────────┘
