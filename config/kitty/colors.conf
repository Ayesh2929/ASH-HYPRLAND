# § 09  DIM COLORS (unfocused window rendering)
# ══════════════════════════════════════════════════════════════════════════════
# When dim_opacity < 1.0, Kitty blends the foreground/background.
# These values control the target of that blend.
# Dim is handled automatically by dim_opacity in kitty.conf — no overrides
# needed here unless you want fully custom dim color control.

