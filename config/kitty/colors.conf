# ══════════════════════════════════════════════════════════════════════════════
# § 03  TERMINAL 16 COLORS — ANSI STANDARD MAPPING
# ══════════════════════════════════════════════════════════════════════════════
# Each ANSI color maps to a palette entry.
# Naming convention: color0-7 = normal, color8-15 = bright variants.
#
# ANSI Index → Standard name → Catppuccin Mocha mapping:
#
#   0  black         → surface1   (#45475a)  — dimmed black
#   1  red           → red        (#f38ba8)  — errors, git deletions
#   2  green         → green      (#a6e3a1)  — success, git additions
#   3  yellow        → yellow     (#f9e2af)  — warnings, file names
#   4  blue          → blue       (#89b4fa)  — info, links
#   5  magenta       → mauve      (#cba6f7)  — special, accent
#   6  cyan          → teal       (#94e2d5)  — strings, types
#   7  white         → subtext1   (#bac2de)  — text in light contexts
#   8  bright black  → surface2   (#585b70)  — comments, line numbers
#   9  bright red    → maroon     (#eba0ac)  — intense errors
#  10  bright green  → green      (#a6e3a1)  — same (no bright variant)
#  11  bright yellow → peach      (#fab387)  — highlights, warnings+
#  12  bright blue   → sky        (#89dceb)  — bright links
#  13  bright magenta→ pink       (#f5c2e7)  — intense accent
#  14  bright cyan   → sky        (#89dceb)  — bright strings
#  15  bright white  → text       (#cdd6f4)  — primary text

# ── Normal (dark) colors ──────────────────────────────────────────────────────
# color0 = Black / Surface1 [INJECTED]
color0                 #45475a

# color1 = Red [INJECTED]
color1                 #f38ba8

# color2 = Green [INJECTED]
color2                 #a6e3a1

# color3 = Yellow [INJECTED]
color3                 #f9e2af

# color4 = Blue [INJECTED]
color4                 #89b4fa

# color5 = Magenta / Mauve [INJECTED]
color5                 #cba6f7

# color6 = Cyan / Teal [INJECTED]
color6                 #94e2d5

# color7 = White / Subtext1 [INJECTED]
color7                 #bac2de

# ── Bright colors ─────────────────────────────────────────────────────────────
# color8 = Bright Black / Surface2 [INJECTED]
color8                 #585b70

# color9 = Bright Red / Maroon [INJECTED]
color9                 #eba0ac

# color10 = Bright Green [INJECTED]
color10                #a6e3a1

# color11 = Bright Yellow / Peach [INJECTED]
color11                #fab387

# color12 = Bright Blue / Sky [INJECTED]
color12                #89dceb

# color13 = Bright Magenta / Pink [INJECTED]
color13                #f5c2e7

# color14 = Bright Cyan / Sky [INJECTED]
color14                #89dceb

# color15 = Bright White / Text [INJECTED]
color15                #cdd6f4

# ══════════════════════════════════════════════════════════════════════════════
# § 04  EXTENDED 256-COLOR COMPLIANCE
# ══════════════════════════════════════════════════════════════════════════════
# Colors 16–255 follow the xterm-256color standard exactly.
# These are computed by Kitty from the base palette — no override needed.
# Colors 232–255 are the grayscale ramp (always standard).
# We pin color16 and color232 as anchors for tools that depend on them.

# Extended color anchors (leave as standard xterm values)
# color16  = #000000  (xterm standard)
# color232 = #080808  (grayscale ramp start)
# ...these are auto-computed by Kitty — no explicit override needed.

# ══════════════════════════════════════════════════════════════════════════════
# § 05  SPECIAL UI COLORS
# ══════════════════════════════════════════════════════════════════════════════

# ── Cursor ────────────────────────────────────────────────────────────────────
# Main cursor color (beam / block / underline).
# Uses theme accent color for visibility. [INJECTED]
cursor                 #cba6f7

# Text color when cursor covers a character (block cursor only). [INJECTED]
cursor_text_color      #1e1e2e

# ── Selection ─────────────────────────────────────────────────────────────────
# Background of selected text. [INJECTED]
# Uses surface0 at 60% opacity effect — Kitty doesn't support alpha here,
# so we use a solid color that approximates the glass selection look.
selection_background   #414055

# Foreground of selected text. [INJECTED]
# none = inherit text color (recommended — preserves syntax highlighting).
selection_foreground   none

# ── URL underline ─────────────────────────────────────────────────────────────
# Color of URL underlines when hovering. [INJECTED]
url_color              #89b4fa

# ── Visual bell flash ─────────────────────────────────────────────────────────
# Color of the visual bell flash overlay. [INJECTED]
visual_bell_color      #f38ba8

# ── Search highlight ──────────────────────────────────────────────────────────
# Background of text matching the current search pattern.
# (Used by Kitty's built-in search mode.)
search_fg_color        #1e1e2e
search_bg_color        #f9e2af

