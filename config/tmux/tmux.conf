# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ⚙️  CORE — Essential settings applied first
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Terminal ──────────────────────────────────────────────────────────────────

# Set terminal to support 24-bit true color
set -g  default-terminal   "tmux-256color"

# Override terminal color capability for proper true-color inside tmux
# Required for Neovim, bat, lazygit etc. to render colors correctly
set -ga terminal-overrides  ",xterm-256color:Tc"
set -ga terminal-overrides  ",alacritty:Tc"
set -ga terminal-overrides  ",kitty:Tc"
set -ga terminal-overrides  ",wezterm:Tc"

# Enable RGB color override (alternative to Tc)
set -ga terminal-overrides  ",*256col*:Tc"

# Enable undercurl support (for Neovim diagnostics)
set -ga terminal-overrides  ',*:Smulx=\E[4::%p1%dm'
set -ga terminal-overrides  ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ── Shell ─────────────────────────────────────────────────────────────────────

# Default shell (use fish as ASH default)
set -g  default-shell       "/usr/bin/fish"

# Default command for new windows/panes
# (empty = use default-shell)
set -g  default-command     ""

# ── Prefix Key ────────────────────────────────────────────────────────────────

# Change prefix from C-b to C-a (screen-like, easier to reach)
unbind C-b
set -g  prefix              C-a
bind    C-a                 send-prefix

# Alternative prefix: C-Space (more ergonomic on some layouts)
# set -g prefix2 C-Space
# bind C-Space send-prefix -2

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🖥️  DISPLAY — Visual and timing settings
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Timing ────────────────────────────────────────────────────────────────────

# Escape key delay (ms) — set to 0 for instant Neovim mode switching
set -sg escape-time         0

# Repeat time for repeatable bindings (ms)
set -g  repeat-time         600

# Status refresh interval (ms)
set -g  status-interval     5

# Display time for messages (ms)
set -g  display-time        3000

# Display pane numbers timeout (ms)
set -g  display-panes-time  2000

# ── History ───────────────────────────────────────────────────────────────────

# Scrollback buffer lines per pane
# 50000 ≈ 50MB RAM per large pane — generous for long outputs
set -g  history-limit       50000

# ── Indexing ──────────────────────────────────────────────────────────────────

# Start windows from 1 (not 0) — easier keyboard access
set -g  base-index          1

# Start panes from 1
setw -g pane-base-index     1

# Renumber windows when one is closed (no gaps)
set -g  renumber-windows    on

# ── Activity ──────────────────────────────────────────────────────────────────

# Monitor activity in background windows
setw -g monitor-activity    on

# Show visual notification on window activity
set -g  visual-activity     off

# Don't monitor silence (too noisy)
setw -g monitor-silence     0

# ── Mouse ─────────────────────────────────────────────────────────────────────

# Enable mouse support
# Allows: click to select pane/window, scroll, resize panes
set -g  mouse               on

# ── Focus Events ──────────────────────────────────────────────────────────────

# Pass focus events to applications (needed for Neovim autoread)
set -g  focus-events        on

# ── Window ────────────────────────────────────────────────────────────────────

# Aggressive resize: resize to smallest active client for current window
setw -g aggressive-resize   on

# Don't automatically rename windows
setw -g automatic-rename    off

# Allow programs to rename windows
setw -g allow-rename        true

# ── Clipboard ─────────────────────────────────────────────────────────────────

# Use system clipboard (Wayland: wl-copy)
set -g  set-clipboard       on

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📋  COPY MODE — Vim-style text selection
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Use vi keys in copy mode
setw -g mode-keys           vi

# ── Copy Mode Bindings ────────────────────────────────────────────────────────

# Enter copy mode with prefix+[ or v
bind [ copy-mode
bind v copy-mode

# In copy mode: vim-style navigation and selection
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi V     send -X select-line
bind -T copy-mode-vi C-v   send -X rectangle-toggle
bind -T copy-mode-vi y     send -X copy-selection-and-cancel
bind -T copy-mode-vi Y     send -X copy-end-of-line

# Navigation in copy mode
bind -T copy-mode-vi h     send -X cursor-left
bind -T copy-mode-vi j     send -X cursor-down
bind -T copy-mode-vi k     send -X cursor-up
bind -T copy-mode-vi l     send -X cursor-right
bind -T copy-mode-vi w     send -X next-word
bind -T copy-mode-vi W     send -X next-space
bind -T copy-mode-vi b     send -X previous-word
bind -T copy-mode-vi B     send -X previous-space
bind -T copy-mode-vi e     send -X next-word-end
bind -T copy-mode-vi 0     send -X start-of-line
bind -T copy-mode-vi \$    send -X end-of-line
bind -T copy-mode-vi g     send -X history-top
bind -T copy-mode-vi G     send -X history-bottom
bind -T copy-mode-vi C-u   send -X halfpage-up
bind -T copy-mode-vi C-d   send -X halfpage-down
bind -T copy-mode-vi C-b   send -X page-up
bind -T copy-mode-vi C-f   send -X page-down

# Search in copy mode
bind -T copy-mode-vi /     send -X search-forward
bind -T copy-mode-vi ?     send -X search-backward
bind -T copy-mode-vi n     send -X search-again
bind -T copy-mode-vi N     send -X search-reverse

# Quit copy mode
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi q     send -X cancel

# Copy to Wayland clipboard
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"

# Mouse drag to copy
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ⌨️  KEYBINDINGS — Ergonomic vim-style navigation
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Config Reload ─────────────────────────────────────────────────────────────

# Reload config without restarting tmux
bind r   source-file ~/.config/tmux/tmux.conf \; \
         display "✓  tmux config reloaded"

# Edit config in Neovim
bind e   new-window -n "tmux-config" \
         "nvim ~/.config/tmux/tmux.conf"

# ── Sessions ──────────────────────────────────────────────────────────────────

# New session
bind S   command-prompt -p "Session name:" \
         "new-session -s '%%'"

# Kill current session (keeps server running)
bind K   confirm-before -p "Kill session #S? (y/n)" kill-session

# Switch to last session
bind L   switch-client -l

# Session picker with fzf (via tmux-fzf)
bind C-s display-popup -E \
         "tmux list-sessions | fzf --reverse --border rounded \
          --color='bg:#1e1e2e,fg:#cdd6f4,hl:#cba6f7,border:#313244' \
          | cut -d: -f1 | xargs tmux switch-client -t"

# ── Windows ───────────────────────────────────────────────────────────────────

# New window
bind c   new-window

# New window with name
bind C   command-prompt -p "Window name:" \
         "new-window -n '%%'"

# Rename current window
bind ,   command-prompt -I "#W" \
         "rename-window '%%'"

# Kill current window
bind &   confirm-before -p "Kill window #W? (y/n)" kill-window

# Switch to previous/next window
bind C-h previous-window
bind C-l next-window
bind -r Left  previous-window
bind -r Right next-window

# Move window left/right
bind -r M-Left  swap-window -d -t -1
bind -r M-Right swap-window -d -t +1

# Switch to last window
bind Tab last-window

# Choose window from list
bind w   choose-window

# Find window by name
bind f   command-prompt -p "Find window:" \
         "find-window -Z '%%'"

# Number shortcuts (direct window access)
bind 1   select-window -t :1
bind 2   select-window -t :2
bind 3   select-window -t :3
bind 4   select-window -t :4
bind 5   select-window -t :5
bind 6   select-window -t :6
bind 7   select-window -t :7
bind 8   select-window -t :8
bind 9   select-window -t :9
bind 0   select-window -t :10

# ── Panes ─────────────────────────────────────────────────────────────────────

# Split panes (keep current directory)
bind |   split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"
bind _   split-window -v -c "#{pane_current_path}"
bind \   split-window -h -c "#{pane_current_path}"

# Full-width splits
bind '"' split-window -v -f -c "#{pane_current_path}"
bind %   split-window -h -f -c "#{pane_current_path}"

# Navigate panes (vim-style, no prefix needed after binding)
bind h   select-pane -L
bind j   select-pane -D
bind k   select-pane -U
bind l   select-pane -R

# Navigate with arrows (no prefix)
bind -n M-h  select-pane -L
bind -n M-j  select-pane -D
bind -n M-k  select-pane -U
bind -n M-l  select-pane -R
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# Resize panes (repeatable with -r)
bind -r H  resize-pane -L 5
bind -r J  resize-pane -D 5
bind -r K  resize-pane -U 5
bind -r L  resize-pane -R 5

# Fine resize (1 cell at a time)
bind -r M-H resize-pane -L 1
bind -r M-J resize-pane -D 1
bind -r M-K resize-pane -U 1
bind -r M-L resize-pane -R 1

# Maximize/restore current pane
bind z   resize-pane -Z

# Kill current pane
bind x   confirm-before -p "Kill pane? (y/n)" kill-pane

# Kill all other panes
bind X   confirm-before -p "Kill other panes? (y/n)" \
         "kill-pane -a"

# Rotate panes
bind o   rotate-window

# Swap pane with previous
bind -r {  swap-pane -U
bind -r }  swap-pane -D

# Choose pane layout
bind M-1   select-layout even-horizontal
bind M-2   select-layout even-vertical
bind M-3   select-layout main-horizontal
bind M-4   select-layout main-vertical
bind M-5   select-layout tiled
bind space next-layout

# Mark/unmark pane
bind m   select-pane -m
bind M   select-pane -M

# ── Quick App Launchers ───────────────────────────────────────────────────────

# Open lazygit in popup
bind g   display-popup -E -w 90% -h 90% \
         "lazygit"

# Open btop in popup
bind t   display-popup -E -w 90% -h 90% \
         "btop"

# Open yazi file manager in popup
bind y   display-popup -E -w 80% -h 80% \
         "yazi"

# Open Neovim in new window
bind n   new-window -n "nvim" \
         "nvim"

# Open floating scratch terminal
bind '`' display-popup -E -w 60% -h 50% \
         "fish"

# ASH theme picker in popup
bind T   display-popup -E -w 70% -h 60% \
         "ash theme pick"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎨  APPEARANCE — Status bar and UI elements
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Status Bar Position ───────────────────────────────────────────────────────

# Position: "bottom" | "top"
set -g  status-position     top

# Status bar length limits
set -g  status-left-length  80
set -g  status-right-length 200

# ── Pane Borders ──────────────────────────────────────────────────────────────

# Style: "single" | "double" | "heavy" | "simple" | "number" | "pipework"
set -g  pane-border-style   "fg=#313244"
set -g  pane-active-border-style "fg=#cba6f7"

# ── Message / Command Input ───────────────────────────────────────────────────

set -g  message-style        "fg=#cdd6f4,bg=#313244"
set -g  message-command-style "fg=#cba6f7,bg=#181825,bold"

# ── Copy Mode ─────────────────────────────────────────────────────────────────

setw -g mode-style           "fg=#1e1e2e,bg=#cba6f7"

# ── Clock ─────────────────────────────────────────────────────────────────────

setw -g clock-mode-colour    "#cba6f7"
setw -g clock-mode-style     24

# ── Display Pane Numbers ──────────────────────────────────────────────────────

set -g  display-panes-colour        "#7f849c"
set -g  display-panes-active-colour "#cba6f7"

# ── Popup ─────────────────────────────────────────────────────────────────────

set -g  popup-border-style   "fg=#cba6f7"
set -g  popup-border-lines   rounded

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎭  THEME — Load active theme
#  Override by sourcing a specific theme file:
#  source ~/.config/tmux/themes/ash-dark.tmux
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Load the dynamic theme (auto-updated by ASH theme engine)
source-file ~/.config/tmux/themes/ash-dynamic.tmux

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔌  PLUGINS — TPM plugin manager
#  Install: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#  Install plugins: prefix + I
#  Update plugins:  prefix + U
#  Remove plugins:  prefix + alt + u
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Plugin List ───────────────────────────────────────────────────────────────

# Core: TPM plugin manager (required)
set -g @plugin 'tmux-plugins/tpm'

# Essential plugins
set -g @plugin 'tmux-plugins/tmux-sensible'        # Sensible defaults
set -g @plugin 'tmux-plugins/tmux-yank'            # Copy to system clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'       # Session persistence
set -g @plugin 'tmux-plugins/tmux-continuum'       # Auto-save/restore sessions
set -g @plugin 'tmux-plugins/tmux-pain-control'    # Pane navigation utilities
set -g @plugin 'tmux-plugins/tmux-open'            # Open files/URLs
set -g @plugin 'tmux-plugins/tmux-copycat'         # Enhanced copy mode search

# Navigation
set -g @plugin 'christoomey/vim-tmux-navigator'    # Seamless vim/tmux splits
set -g @plugin 'tmux-plugins/tmux-sessionist'      # Session management

# UI enhancements
set -g @plugin 'tmux-plugins/tmux-prefix-highlight' # Highlight when prefix pressed
set -g @plugin 'omerxx/tmux-floax'                 # Floating pane toggle

# Dev tools
set -g @plugin 'tmux-plugins/tmux-fpp'             # File path picker
set -g @plugin 'laktak/extrakto'                   # Fuzzy extract text

# ── Plugin Options ────────────────────────────────────────────────────────────

# tmux-resurrect: save/restore program state
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim         'session'
set -g @resurrect-strategy-vim          'session'
set -g @resurrect-save-shell-history    'on'

# tmux-continuum: auto-save sessions every 15 minutes
set -g @continuum-restore               'on'
set -g @continuum-save-interval        '15'
set -g @continuum-boot                 'on'

# tmux-yank: copy to both primary and clipboard
set -g @yank_selection                 'clipboard'
set -g @yank_selection_mouse           'clipboard'
set -g @yank_with_mouse                'on'

# vim-tmux-navigator: navigate without prefix in both vim and tmux
set -g @vim_navigator_mapping_left     "M-h"
set -g @vim_navigator_mapping_right    "M-l"
set -g @vim_navigator_mapping_up       "M-k"
set -g @vim_navigator_mapping_down     "M-j"

# tmux-prefix-highlight: show prefix indicator in status bar
set -g @prefix_highlight_fg            '#1e1e2e'
set -g @prefix_highlight_bg            '#cba6f7'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=#1e1e2e,bg=#f9e2af,bold'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_sync_mode_attr 'fg=#1e1e2e,bg=#f38ba8,bold'
set -g @prefix_highlight_prefix_prompt ' ⌨  WAIT '
set -g @prefix_highlight_copy_prompt   ' ✂  COPY '
set -g @prefix_highlight_empty_prompt  '       '
set -g @prefix_highlight_empty_attr    'fg=#313244,bg=#181825'

# tmux-floax: floating pane toggle
set -g @floax-bind                     'p'
set -g @floax-bind-new-window          'P'
set -g @floax-width                    '80%'
set -g @floax-height                   '80%'
set -g @floax-border-color             '#cba6f7'
set -g @floax-text-color               '#cdd6f4'
set -g @floax-change-path              'true'

# extrakto: extract text with fzf
set -g @extrakto_fzf_tool              'fzf'
set -g @extrakto_grab_key             'tab'
set -g @extrakto_fzf_layout           'reverse'

# ── Initialize TPM (MUST be last) ─────────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'