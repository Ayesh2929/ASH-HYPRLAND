[Settings]

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎨  THEME ENGINE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# GTK4 theme — adw-gtk4 provides Adwaita-compatible base
# ASH color overrides are applied via gtk.css (this file is minimal)
# Alternatives: adw-gtk4 | adw-gtk4-dark | Catppuccin-Mocha-Standard-Mauve-Dark
# Note: GTK4 apps using libadwaita ignore this — use AdwStyleManager instead
gtk-theme-name = adw-gtk4-dark

# Icon theme — applies to GTK4 apps
# Papirus-Dark has excellent coverage including Adwaita symbolic icons
gtk-icon-theme-name = Papirus-Dark

# Cursor theme — same as GTK3 for consistency
gtk-cursor-theme-name = Bibata-Modern-Ice

# Cursor size (24=standard, 32=HiDPI 2x, 48=4K)
gtk-cursor-theme-size = 24

# System font for GTK4 applications
# Inter is the recommended premium font for modern UIs
gtk-font-name = Inter 11

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🌙  DARK MODE — Adwaita Style Manager
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Dark mode preference communicated to libadwaita apps via portal
# 0 = no preference | 1 = prefer dark | 2 = prefer light
# libadwaita apps read this via AdwStyleManager.color-scheme
gtk-application-prefer-dark-theme = 1

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🖥️  DISPLAY & RENDERING
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# DPI — used for font rendering (96=1x, 192=2x HiDPI)
# For Wayland fractional scaling, set GDK_SCALE in environment.d/
gtk-xft-dpi = 96

# Font antialiasing
# 0=none | 1=grayscale | 2=rgba subpixel
gtk-xft-antialias = 1

# Subpixel hinting
gtk-xft-hinting = 1
gtk-xft-hintstyle = hintslight

# Subpixel RGB order
# rgb=standard horizontal LCD | bgr=reversed | vrgb/vbgr=vertical
gtk-xft-rgba = rgb

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ⚡  PERFORMANCE & BEHAVIOR
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Enable CSS animations and transitions
gtk-enable-animations = 1

# Overlay scrollbars — GTK4 style (appears on hover)
# 1 = overlay (modern, space-efficient) | 0 = classic
gtk-overlay-scrolling = 1

# Double-click timing
gtk-double-click-time = 400
gtk-double-click-distance = 5

# Long-press duration for touch/stylus events (ms)
gtk-long-press-time = 500

# Input method — for CJK, emoji, special chars
gtk-im-module = ibus

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🖱️  INPUT & INTERACTION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Select text on focus in entry widgets
gtk-entry-select-on-focus = 1

# Password reveal timeout (0 = never show)
gtk-entry-password-hint-timeout = 0

# Key theme
gtk-key-theme-name = Default

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ♿  ACCESSIBILITY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Always show focus indicators (not just keyboard navigation)
gtk-visible-focus = always

# AT-SPI accessibility bus
gtk-modules = canberra-gtk-module

# Sound events (disabled — ASH uses custom notification sounds)
gtk-enable-event-sounds = 0
gtk-enable-input-feedback-sounds = 0
gtk-sound-theme-name = freedesktop

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔔  WINDOW DECORATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Remove client-side decorations (Hyprland handles window chrome)
# Empty after colon = no decorations on right side
# "close" = only close button (minimal), ":" = none
gtk-decoration-layout = :

# Tooltip display timing
gtk-tooltip-timeout = 500
gtk-tooltip-browse-timeout = 60
gtk-tooltip-browse-mode-timeout = 500

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📁  FILE & PORTALS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# File chooser backend — uses XDG Desktop Portal (required for Wayland)
gtk-file-chooser-backend = portal

# Recent files
gtk-recent-files-limit = 50
gtk-recent-files-max-age = 30

# Print dialog
gtk-print-backends = file,cups

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🌐  WAYLAND / PORTAL INTEGRATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Force Wayland backend (set via GDK_BACKEND=wayland in environment.d/)
# GTK_USE_PORTAL=1 enables XDG portal for file/screenshot/etc

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📊  GTK4 INSPECTOR (development)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Enable GTK inspector (Ctrl+Shift+D in GTK4 apps)
# Set GSK_RENDERER=cairo/gl/vulkan to test rendering backends
# GTK_DEBUG=interactive enables overlay inspector automatically