# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔧  GUI — Interface settings
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

gui:

  # ── Layout ────────────────────────────────────────────────────────────────

  # Scroll speed for mouse wheel (lines per tick)
  scrollHeight: 5

  # Scroll past end of content
  scrollPastBottom: true

  # Wrap lines in side panels
  sidePanelWidth: 0.3333

  # Expand focused side panel
  expandFocusedSidePanel: false

  # Main panel split direction (split main panel horizontally or not)
  # "vertical" | "horizontal"
  mainPanelSplitMode: vertical

  # Use entire terminal width for main panel
  enlargedSideViewLocation: left

  # ── Language ──────────────────────────────────────────────────────────────

  # Language for keyboard shortcuts display
  language: auto

  # ── Time Format ───────────────────────────────────────────────────────────

  # Relative time display (e.g., "2 hours ago")
  # "" = use git default | "relative" | "local" | custom strftime
  timeFormat: "02 Jan 06 15:04 MST"

  # Short time format (shown in compact views)
  shortTimeFormat: "15:04"

  # ── Commit Length ─────────────────────────────────────────────────────────

  commitLength:
    # Show warning when commit message exceeds this length
    show: true

  # ── Pager ─────────────────────────────────────────────────────────────────

  # External pager command for viewing diffs
  # Delta provides superior diff visualization
  pager: delta

  # ── Show file tree ────────────────────────────────────────────────────────
  showFileTree: true

  # ── Show list footer ──────────────────────────────────────────────────────
  showListFooter: true

  # ── Show random tip ───────────────────────────────────────────────────────
  showRandomTip: false

  # ── Show command log ──────────────────────────────────────────────────────
  showCommandLog: true
  commandLogSize: 8

  # ── Show bottom line ──────────────────────────────────────────────────────
  showBottomLine: true

  # ── Borders ───────────────────────────────────────────────────────────────
  # "rounded" | "single" | "double" | "hidden"
  border: rounded

  # ── Animated gif frames ───────────────────────────────────────────────────
  animateExplosion: false

  # ── Nerd Fonts Version ────────────────────────────────────────────────────
  # 2 = Nerd Fonts v2 (old) | 3 = Nerd Fonts v3 (current)
  nerdFontsVersion: "3"

  # ── Status Icon ───────────────────────────────────────────────────────────
  # "menu" | "prepend" | "inline"
  statusPanelView: tabs

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎨  THEME — Catppuccin Mocha
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

theme:

  # ── Active Border ─────────────────────────────────────────────────────────
  # Color of the border of the focused panel
  # Catppuccin Mauve — primary accent
  activeBorderColor:
    - "#cba6f7"
    - bold

  # ── Inactive Border ───────────────────────────────────────────────────────
  # Color of unfocused panel borders
  # Catppuccin Surface1
  inactiveBorderColor:
    - "#45475a"

  # ── Options Text ──────────────────────────────────────────────────────────
  # Key hints at bottom of panels
  # Catppuccin Overlay1
  optionsTextColor:
    - "#7f849c"

  # ── Selected Line ─────────────────────────────────────────────────────────
  # Background of selected/highlighted item
  # Catppuccin Blue (bright, readable)
  selectedLineBgColor:
    - "#313244"

  # ── Collapsed Branch ──────────────────────────────────────────────────────
  collapsedBranchBgColor:
    - "#45475a"

  # ── Cherry-pick ───────────────────────────────────────────────────────────
  # Marker for cherry-picked commits
  # Catppuccin Teal
  cherryPickedCommitBgColor:
    - "#94e2d5"

  cherryPickedCommitFgColor:
    - "#1e1e2e"

  # ── Marked Base Commit ────────────────────────────────────────────────────
  # Rebase base marker color — Catppuccin Yellow
  markedBaseCommitBgColor:
    - "#f9e2af"

  markedBaseCommitFgColor:
    - "#1e1e2e"

  # ── Unselected Merge Conflict ─────────────────────────────────────────────
  unselectedArg:
    - "#585b70"

  # ── Merge Conflict Active ─────────────────────────────────────────────────
  selectedArg:
    - "#cba6f7"

  # ── Pager Colors ──────────────────────────────────────────────────────────
  # Used when no external pager configured
  diffTerminalColors:
    bold: false
    green: "#a6e3a1"
    red: "#f38ba8"
    cyan: "#89dceb"
    blue: "#89b4fa"
    yellow: "#f9e2af"
    orange: "#fab387"
    magenta: "#cba6f7"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔗  GIT — Git behavior settings
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

git:

  # ── Paging ────────────────────────────────────────────────────────────────

  paging:
    # External diff viewer
    # "delta" = richest output | "diff-so-fancy" | "bat" | ""
    colorArg: always
    pager: delta --dark --paging=never --line-numbers --side-by-side -n
    useConfig: false

  # ── Commit ────────────────────────────────────────────────────────────────

  commit:
    # Sign commits with GPG
    signOff: false
    # Auto-wrap commit messages
    autoWrapCommitMessage: true
    autoWrapWidth: 72

  # ── Merging ───────────────────────────────────────────────────────────────

  merging:
    # Manually choose merge strategy
    # "none" | "rebase" | "merge" | "squash"
    manualCommit: false
    # Pass extra args to git merge
    args: ""
    # Squash all commits when merging
    squash: false

  # ── Main branches ─────────────────────────────────────────────────────────

  # Regex patterns for "main" branches (affects branch colors)
  mainBranches:
    - master
    - main
    - develop
    - dev

  # ── Log ───────────────────────────────────────────────────────────────────

  log:
    # Initial log order: "topo-order" | "date-order" | "author-date-order"
    order: topo-order
    # Show git log graph decorations
    showGraph: always
    # Show whole git graph (vs just current branch)
    showWholeGraph: false

  # ── Skip Hooks ────────────────────────────────────────────────────────────

  # Skip pre-commit and commit-msg hooks (use with caution!)
  skipHookPrefix: WIP

  # ── Credentials ───────────────────────────────────────────────────────────

  # Auto-fetch remote
  autoFetch: true
  autoFetchInterval: 60     # Fetch every 60 seconds
  autoFetchRemote: origin

  # Auto-refresh on focus
  autoRefreshInterval: 10

  # ── Branches ──────────────────────────────────────────────────────────────

  branchLogCmd: "git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --"

  # ── All branches log ──────────────────────────────────────────────────────

  allBranchesLogCmd: "git log --graph --all --color=always --abbrev-commit --decorate --date=relative --pretty=medium"

  # ── Overridden commit message ──────────────────────────────────────────────

  # Override commit message file (leave empty for default)
  overrideGpg: false

  # ── Disable force push ────────────────────────────────────────────────────

  disableForcePushing: false

  # ── Parse emoji in log ────────────────────────────────────────────────────

  parseEmoji: true

  # ── Show diff context ─────────────────────────────────────────────────────

  diffContextSize: 3

  # ── Ignore whitespace in diffs ────────────────────────────────────────────

  ignoreWhitespaceInDiffView: false

  # ── Stash prefix ──────────────────────────────────────────────────────────

  stashPrefix: "stash:"

  # ── Worktrees ─────────────────────────────────────────────────────────────

  worktreeLinkedToPath: true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ⌨️  KEYBINDINGS — Custom key mappings
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

keybinding:

  universal:
    # Quit
    quit: q
    quit-alt1: "<c-c>"

    # Return to previous panel
    return: <escape>

    # Toggle item selection
    toggleRangeSelectForMerge: v

    # Scroll
    scrollUpMain: "<pgup>"
    scrollDownMain: "<pgdn>"
    scrollUpMain-alt1: K
    scrollDownMain-alt1: J
    scrollUpMain-alt2: <c-u>
    scrollDownMain-alt2: <c-d>

    # Panel navigation
    prevItem: <up>
    nextItem: <down>
    prevItem-alt: k
    nextItem-alt: j
    prevPage: <c-b>
    nextPage: <c-f>
    gotoTop: g
    gotoBottom: G

    # Panel switching
    prevBlock: <left>
    nextBlock: <right>
    prevBlock-alt: h
    nextBlock-alt: l
    prevBlock-alt2: <backtab>
    nextBlock-alt2: <tab>

    # Help
    optionMenu: "<c-h>"
    optionMenu-alt1: "?"

    # Jump to main panel
    jumpToBlock:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"

    # Focus commit message
    focusMainView: <enter>

    # Search (filter panel content)
    search: /

    # Close search
    closeSearch: <escape>

    # Copy text to clipboard
    copyToClipboard: "<c-o>"

    # Open file in editor
    openRepoInEditor: "<c-e>"

    # Submit/confirm action
    submitEditorInfo: <enter>

    # Edit in external editor
    edit: e

    # Open system editor
    openFile: o

    # Scroll left/right in diff
    scrollLeft: H
    scrollRight: L

    # Cycle sort order
    nextScreenMode: "+"
    prevScreenMode: "_"

    # Refresh
    refresh: R

    # Undo last lazygit action
    undo: z

    # Redo
    redo: "<c-z>"

    # Toggle sidebar
    toggleWhitespaceInDiffView: "<c-w>"

    # Increase/decrease diff context size
    increaseContextInDiffView: "}"
    decreaseContextInDiffView: "{"

    # Toggle file tree vs flat list
    toggleTreeView: "`"

  # ── Files Panel ─────────────────────────────────────────────────────────

  files:
    # Stage/unstage all files at once
    commitChanges: c
    commitChangesWithoutHook: W
    amendLastCommit: A
    commitChangesWithEditor: C
    findBaseCommitForFixup: "<c-f>"

    # Confirm discard all changes
    confirmDiscard: x

    # Stage/unstage toggle
    toggleStagedAll: a

    # Stage/unstage selected range
    viewResetOptions: "<c-r>"

    # Refresh file status
    fetch: f

    # Toggle/show file details in main pane
    toggleTreeView: "`"

    # Open git flow menu (if gitflow installed)
    openMergeTool: M

    # Open diff in editor
    openFile: o

    # Open file in external pager
    ignoreFile: i

    # Refresh index
    refreshFiles: R

    # Stash all changes
    stashAllChanges: S

  # ── Branches Panel ──────────────────────────────────────────────────────

  branches:
    # Checkout selected branch
    createPullRequest: o

    # View pull request on GitHub
    viewPullRequestOptions: O

    # Copy branch name to clipboard
    copyPullRequestURL: "<c-y>"

    # Fetch branch
    checkoutBranch: <space>

    # Create new branch from current
    setUpstream: u

    # Merge branch into current
    mergeIntoCurrentBranch: M

    # Rebase current onto selected
    rebaseBranch: r

    # Fast-forward selected branch
    fastForward: f

    # Create tag on branch
    createTag: T

    # Push branch
    pushTag: P

    # Delete branch
    deleteBranch: d

    # Rename branch
    renameBranch: R

  # ── Commits Panel ───────────────────────────────────────────────────────

  commits:
    # Squash commit with parent
    squashDown: S

    # Rename/reword commit message
    renameCommit: r
    renameCommitWithEditor: R

    # Move commit up/down in rebase
    moveUpCommit: "<c-k>"
    moveDownCommit: "<c-j>"

    # Toggle amend mode
    amendToCommit: A

    # Apply commit on top of current branch (cherry-pick)
    pickCommit: p

    # Revert commit
    revertCommit: t

    # Fixup commit (squash without editing message)
    createFixupCommit: f
    squashAboveCommits: F

    # Delete commit (drop in rebase)
    deleteCommit: d

    # Copy commit hash
    copyCommitAttributeToClipboard: y

    # Open commit in browser
    openLogMenu: "<c-l>"

    # View commit tree
    viewBisectOptions: b

    # Tag commit
    tagCommit: T

    # Reset to commit
    checkoutCommit: <space>

    # Mark as base commit for rebase
    markAsBaseCommit: B

    # Interactive rebase (git rebase -i)
    startInteractiveRebase: i

  # ── Stash Panel ─────────────────────────────────────────────────────────

  stash:
    # Apply stash (keep in list)
    popStash: g

    # Apply and remove from stash
    renameStash: r

  # ── Worktrees Panel ─────────────────────────────────────────────────────

  worktrees:
    viewWorktreeOptions: w

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🛠️  CUSTOM COMMANDS — Power user actions
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

customCommands:

  # ── Commit with Conventional Commits format ───────────────────────────────
  - key: "<c-v>"
    description: "Conventional commit"
    context: files
    prompts:
      - type: menu
        title: "Commit type"
        key: Type
        options:
          - name: "feat"
            description: "✨ A new feature"
            value: "feat"
          - name: "fix"
            description: "🐛 A bug fix"
            value: "fix"
          - name: "docs"
            description: "📄 Documentation only changes"
            value: "docs"
          - name: "style"
            description: "💅 Code style changes (formatting, missing semi colons)"
            value: "style"
          - name: "refactor"
            description: "♻️  Code refactoring (no features, no bugs)"
            value: "refactor"
          - name: "perf"
            description: "⚡ Performance improvements"
            value: "perf"
          - name: "test"
            description: "🧪 Adding or updating tests"
            value: "test"
          - name: "build"
            description: "🏗️  Build system or external dependencies"
            value: "build"
          - name: "ci"
            description: "👷 CI configuration"
            value: "ci"
          - name: "chore"
            description: "🔧 Other changes (no src or test changes)"
            value: "chore"
          - name: "revert"
            description: "⏪ Reverts a previous commit"
            value: "revert"
          - name: "wip"
            description: "🚧 Work in progress"
            value: "wip"
      - type: input
        title: "Scope (optional — e.g. auth, api, ui)"
        key: Scope
        initialValue: ""
      - type: menu
        title: "Breaking change?"
        key: Breaking
        options:
          - name: "No"
            value: ""
          - name: "Yes (!)"
            value: "!"
      - type: input
        title: "Commit message"
        key: Message
        initialValue: ""
      - type: confirm
        title: "Create commit?"
        body: "{{.Form.Type}}{{if .Form.Scope}}({{.Form.Scope}}){{end}}{{.Form.Breaking}}: {{.Form.Message}}"
    command: "git commit --message '{{.Form.Type}}{{if .Form.Scope}}({{.Form.Scope}}){{end}}{{.Form.Breaking}}: {{.Form.Message}}'"
    loadingText: "Creating conventional commit..."

  # ── Git Flow: Feature ─────────────────────────────────────────────────────
  - key: "F"
    description: "Git flow: new feature branch"
    context: localBranches
    prompts:
      - type: input
        title: "Feature name"
        key: FeatureName
    command: "git flow feature start {{.Form.FeatureName}}"
    loadingText: "Creating feature branch..."
    after:
      refreshFiles: true

  # ── Interactive Rebase Onto Main ──────────────────────────────────────────
  - key: "<c-m>"
    description: "Rebase onto main/master"
    context: localBranches
    command: "git rebase -i $(git merge-base HEAD main 2>/dev/null || git merge-base HEAD master)"
    loadingText: "Starting interactive rebase onto main..."
    subprocess: true

  # ── Push with Force-with-Lease (safer force push) ─────────────────────────
  - key: "<c-p>"
    description: "Force push with lease (safe)"
    context: localBranches
    command: "git push --force-with-lease origin {{.SelectedLocalBranch.Name}}"
    loadingText: "Force-pushing with lease..."
    after:
      refreshFiles: true

  # ── Copy branch name to clipboard ─────────────────────────────────────────
  - key: "y"
    description: "Copy branch name to clipboard"
    context: localBranches
    command: "echo -n '{{.SelectedLocalBranch.Name}}' | wl-copy"
    loadingText: "Copying branch name..."

  # ── Copy commit hash ──────────────────────────────────────────────────────
  - key: "y"
    description: "Copy commit hash (short)"
    context: commits
    command: "echo -n '{{.SelectedLocalCommit.Sha | substr 0 8}}' | wl-copy"
    loadingText: "Copying commit hash..."

  # ── Open GitHub PR for current branch ─────────────────────────────────────
  - key: "O"
    description: "Open GitHub PR page"
    context: localBranches
    command: "xdg-open $(git remote get-url origin | sed 's|git@github.com:|https://github.com/|; s|\\.git$||')/compare/{{.SelectedLocalBranch.Name}}"
    loadingText: "Opening GitHub..."

  # ── Stash with message ────────────────────────────────────────────────────
  - key: "n"
    description: "Stash with name"
    context: files
    prompts:
      - type: input
        title: "Stash name"
        key: StashName
        initialValue: ""
    command: "git stash push -m '{{.Form.StashName}}'"
    loadingText: "Stashing changes..."
    after:
      refreshFiles: true

  # ── Sign last commit ──────────────────────────────────────────────────────
  - key: "S"
    description: "GPG sign last commit (amend)"
    context: commits
    command: "git commit --amend --no-edit -S"
    loadingText: "Signing commit..."
    after:
      refreshFiles: true

  # ── Open delta diff in pager ──────────────────────────────────────────────
  - key: "D"
    description: "View diff with delta"
    context: commits
    command: "git show {{.SelectedLocalCommit.Sha}} | delta | less -R"
    subprocess: true

  # ── Set upstream tracking ─────────────────────────────────────────────────
  - key: "U"
    description: "Set upstream: origin/{{branch}}"
    context: localBranches
    command: "git branch --set-upstream-to=origin/{{.SelectedLocalBranch.Name}} {{.SelectedLocalBranch.Name}}"
    loadingText: "Setting upstream..."

  # ── Prune remote branches ─────────────────────────────────────────────────
  - key: "P"
    description: "Prune remote tracking branches"
    context: remotes
    command: "git remote prune {{.SelectedRemote.Name}}"
    loadingText: "Pruning remote..."
    after:
      refreshFiles: true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📋  OS — Operating system integration
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

os:

  # ── Open command ──────────────────────────────────────────────────────────
  # Command to open files/URLs
  open: "xdg-open {{filename}}"
  openLink: "xdg-open {{link}}"

  # ── Copy to clipboard ─────────────────────────────────────────────────────
  # Wayland clipboard
  copyToClipboard: "wl-copy"

  # ── Edit command ──────────────────────────────────────────────────────────
  # Default editor (falls back to $EDITOR)
  edit: "nvim {{filename}}"
  editAtLine: "nvim +{{line}} {{filename}}"
  editAtLineAndWait: "nvim +{{line}} {{filename}}"

  # ── Suspend command ───────────────────────────────────────────────────────
  suspendOnEdit: false

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📝  SERVICES — External service integration
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

services:
  # GitHub — enables PR integration
  "github.com": "github:github.com"
  # GitLab
  "gitlab.com": "gitlab:gitlab.com"
  # Gitea (self-hosted)
  # "git.example.com": "gitea:git.example.com"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔄  UPDATE — Update behavior
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

update:
  # Check for updates on launch
  method: prompt
  days: 14

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📊  REPORTING — Telemetry (disabled for privacy)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

reporting: "never"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔧  MISC — Miscellaneous settings
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Don't show intro on first launch
notARepository: "skip"

# Disable confirmation for safe operations
disabledStartupPopups:
  - "donationsPopup"

