# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🔥 ASH DOTFILES v5.0 OMEGA — MPD CONFIG ULTRA                             ║
# ║  🎵 Music Player Daemon • PipeWire • Visualizer • High Quality Audio       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📁  PATHS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Music library directory
music_directory         "~/Music"

# Playlist directory
playlist_directory      "~/.local/share/mpd/playlists"

# MPD database file
db_file                 "~/.local/share/mpd/database"

# Log file
log_file                "~/.local/share/mpd/mpd.log"

# PID file
pid_file                "~/.local/share/mpd/mpd.pid"

# State file (saves playback state)
state_file              "~/.local/share/mpd/mpdstate"

# Sticker database (stores per-song metadata)
sticker_file            "~/.local/share/mpd/sticker.sql"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔌  NETWORK
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# TCP port
port                    "6600"

# Bind to localhost only (security)
bind_to_address         "localhost"

# Max connections
max_connections         "30"

# Connection timeout (seconds)
connection_timeout      "60"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎵  AUDIO OUTPUT — PIPEWIRE (Primary)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

audio_output {
    type            "pipewire"
    name            "PipeWire Audio"
    # Optional: set sample format
    # format        "44100:24:2"
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📊  AUDIO OUTPUT — FIFO (Visualizer)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

audio_output {
    type            "fifo"
    name            "mpd_visualizer"
    path            "/tmp/mpd.fifo"
    format          "44100:16:2"
    enabled         "yes"
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔊  AUDIO OUTPUT — NULL (Silent fallback)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

audio_output {
    type            "null"
    name            "Null Output (Fallback)"
    enabled         "no"
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎚️  AUDIO QUALITY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Audio buffer size (milliseconds)
audio_buffer_size       "2048"

# Buffer before playing (percentage)
buffer_before_play      "10%"

# Replay gain mode: off | track | album | auto
replaygain              "auto"

# Replay gain extra preamp (dB)
replaygain_preamp       "0"

# Replay gain limit (prevent clipping)
replaygain_limit        "yes"

# Volume normalization
volume_normalization    "no"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🗄️  DATABASE & SCANNING
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Automatically update database on startup
auto_update             "yes"

# Depth limit for auto update (0 = no limit)
auto_update_depth       "0"

# Follow symlinks in music directory
follow_outside_symlinks "yes"
follow_inside_symlinks  "yes"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🏷️  METADATA
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Metadata to read from tags
metadata_to_use         "+comment"

# ID3v1 encoding fallback
id3v1_encoding          "UTF-8"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📻  INPUT PLUGINS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# HTTP stream buffering
input {
    plugin          "curl"
    # proxy         "http://proxy:8080"
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎬  DECODER PLUGINS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# FLAC — Lossless (primary format)
decoder {
    plugin          "flac"
    enabled         "yes"
}

# ALAC — Apple Lossless
decoder {
    plugin          "audiofile"
    enabled         "yes"
}

# MP3 — libmad / mpg123
decoder {
    plugin          "mad"
    enabled         "yes"
}

# AAC / M4A
decoder {
    plugin          "faad"
    enabled         "yes"
}

# Opus
decoder {
    plugin          "opus"
    enabled         "yes"
}

# Vorbis (OGG)
decoder {
    plugin          "vorbis"
    enabled         "yes"
}

# WAV
decoder {
    plugin          "pcm"
    enabled         "yes"
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🌐  ZEROCONF / AVAHI
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# zeroconf_enabled      "yes"
# zeroconf_name         "ASH Music Server"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔒  PERMISSIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Default permissions (no password)
default_permissions     "read,add,control,admin"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📝  LOGGING
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Log verbosity: default | secure | verbose
log_level               "default"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ⚡  PERFORMANCE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Max output buffer size (bytes, 8MB)
max_output_buffer_size  "8192"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎭  PLAYLIST PLUGINS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

playlist_plugin {
    name            "m3u"
    enabled         "yes"
}

playlist_plugin {
    name            "extm3u"
    enabled         "yes"
}

playlist_plugin {
    name            "pls"
    enabled         "yes"
}

playlist_plugin {
    name            "xspf"
    enabled         "yes"
}

playlist_plugin {
    name            "cue"
    enabled         "yes"
}