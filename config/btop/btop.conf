#  Round corners on boxes (requires compatible terminal + Nerd Fonts)
rounded_corners = True

#  Show vim-style keybindings hint at bottom
vim_keys = False

#  Number of error notices to keep in log
log_level = "WARNING"

#  Manually set the number of available CPUs shown
#  0 = auto-detect
shown_boxes = "cpu mem net proc"

#  Set the boxes shown and their sizes
#  Format: "box:height_percentage:width_percentage"
#  Preset layouts:
#    Large screen (>= 100 cols): CPU + MEM side by side, PROC + NET below
#    Medium screen (>= 80 cols): stacked
#    Small screen: minimal
#
#  ASH default: premium 4-box layout
#  cpu:35:100,mem:40:45,net:40:55,proc:65:100
#

#  Whether to ask for confirmation on quit
#  True = show confirmation dialog
base_10_sizes = False

#  Use base-10 (SI) for sizes (MB=1000KB vs MiB=1024KiB)
#  False = base-2 (binary, KiB/MiB/GiB — more accurate for RAM)
#  True  = base-10 (SI, KB/MB/GB — matches disk manufacturers)
base_10_sizes = False

#  Enable mouse support
#  True = click boxes, scroll, etc.
mouse_support = True

#  Left mouse button click action
click_to_expand = True

#  Keyboard shortcuts (hjkl = vim-style navigation)
vim_keys = True

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
