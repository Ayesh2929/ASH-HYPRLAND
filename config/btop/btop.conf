state_path = ""

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎨  ASH INTEGRATION — Dynamic Theme Bridge
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

#  ASH theme engine will automatically:
#  1. Generate colors.conf from current wallpaper/theme
#  2. Write updated ash-dynamic.theme
#  3. Send SIGUSR1 to btop to hot-reload without restart
#
