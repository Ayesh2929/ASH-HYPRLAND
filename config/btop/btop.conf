#  Active color theme
#  Values: "ash-dark" | "ash-light" | "ash-dynamic" | any theme in themes/
#  ASH theme engine will auto-update this via: ash theme apply <name>
color_theme = "ash-dynamic"

#  If true, use the terminal's own foreground/background colors
#  Disable for full ASH theme control
theme_background = False

#  Enable true 24-bit color (requires compatible terminal)
truecolor = True

#  Enable Nerd Fonts / Unicode symbols for premium icons
force_tty = False

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ⚡  PERFORMANCE — Ultra-Optimized Polling
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

#  Update interval in milliseconds
#  2000ms = smooth visuals with minimal CPU overhead
#  Range: 100 - 86400000
update_ms = 2000

#  CPU graph update speed multiplier (1 = same as update_ms)
#  Higher = smoother CPU graph animation
cpu_single_graph = False

#  Number of CPU graph history entries shown
#  More = wider historical view
cpu_graph_upper_limit = 100

#  Disable cpu frequency and temps in cpu box when True
#  (enable if sensors not available)
cpu_invert_lower = True

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🖥️  LAYOUT — Premium Dashboard Configuration
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

#  Preset for layout sizes
#  Values: "small" | "medium" | "large"
presets = "cpu:1:default,proc:0:default,mem:0:default,net:0:default"

#  Show detailed CPU view with per-core graphs
#  True = full core breakdown (recommended)
cpu_single_graph = False

#  Draw a clock at top of screen
#  Values: "" (disabled) | "%X" (time) | "%c" (full) | strftime format
draw_clock = "%H:%M:%S  │  %A %d %B %Y  │  W%V"

#  Background update fix for certain terminals
background_update = True

#  Custom start command (empty = none)
custom_cpu_name = ""

#  Show disks and network in mem box
mem_graphs = True

#  Show page table size in mem box
mem_page_size = True

#  Display swap as memory graph
show_swap = True

#  Swap disk I/O stats in the disk section
swap_disk = True

#  Filter to show only these disks (comma separated, empty = show all)
#  Example: "/, /home, /boot"
disks_filter = ""

#  Show IO stats for disks
io_mode = False

#  Show combined disk read+write in single graph
io_graph_combined = False

#  Set max value for disk I/O graph in MiB/s (0 = auto-scale)
io_graph_speeds = ""

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
