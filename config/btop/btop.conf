#
#  The ash-dynamic theme reads from:
#  ~/.config/ash/state/current-theme.json

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📋  KEYBIND REFERENCE (vim_keys = True)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
#  Navigation:
#    h/j/k/l      ─ move focus left/down/up/right
#    g/G          ─ jump to top/bottom of process list
#    Tab          ─ cycle through boxes
#    Shift+Tab    ─ cycle boxes reverse
#
#  Process actions:
#    Enter        ─ expand/show process details
#    f            ─ toggle process filter
#    e            ─ toggle process tree
#    r            ─ reverse sort
#    c            ─ clear process filter
#    Delete/k     ─ kill selected process
#    t            ─ send SIGTERM
#    s            ─ sort field selection
#    p            ─ toggle per-cpu
#
#  View:
#    m            ─ toggle memory display (bytes/percent)
#    n            ─ toggle network auto-scale
#    b            ─ toggle box focus
#    +/-          ─ increase/decrease update rate
#    1-4          ─ toggle CPU/MEM/NET/PROC box
#    z            ─ toggle net graph zoom
#    a            ─ toggle disk I/O mode
#    d            ─ select disk
#    i            ─ select network interface
#    T            ─ toggle temperature unit (C/F)
#    u            ─ toggle GPU monitoring
#
#  Theme:
#    Ctrl+Alt+T   ─ cycle themes (ASH extension)
#
#  System:
#    q/Ctrl+C     ─ quit
#    Esc          ─ close popup / cancel
#    ?            ─ show help
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━