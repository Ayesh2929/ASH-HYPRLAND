#  Network graph type
graph_symbol_net = "default"

#  Network interface to display first
#  Values: "auto" | interface name (e.g. "eth0", "wlan0", "enp3s0")
net_iface = "auto"

#  Set fixed max value for network graph upload (kbps, 0 = auto)
net_upload = ""

#  Set fixed max value for network graph download (kbps, 0 = auto)
net_download = ""

#  Auto-detect maximum network speed for graph scaling
net_auto = True

#  Network graph sync upload and download scales
net_sync = False

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ⚙️  PROCESS BOX — Advanced Process Management
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

#  Process graph type
graph_symbol_proc = "default"

#  Default sort field for process list
#  Values: "pid" | "program" | "arguments" | "threads" | "user"
#        | "memory" | "cpu lazy" | "cpu responsive" | "cpu direct"
proc_sorting = "cpu lazy"

#  Reverse sort order (highest on top)
proc_reversed = False

#  Show process tree view
proc_tree = False

#  Show process arguments (full command line)
proc_colors = True

#  Show process gradient colors based on resource usage
proc_gradient = True

#  CPU usage calculation per process
#  "total cpu" = usage of all cores combined
#  "user + system" = split usage view
proc_per_cpu = False

#  Show memory as bytes instead of percentage
proc_mem_bytes = True

#  Filter processes by current user only
proc_info_smaps = False

#  Show processes in tree mode by default
proc_left = False

#  CPU graph calculation for process box
proc_filter_kernel = False

#  Trace child processes
proc_aggregate = False

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎛️  INTERFACE — UI / UX Premium Settings
