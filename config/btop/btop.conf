#  Memory graph type
graph_symbol_mem = "default"

#  Show available memory as main value
mem_shows_avail = False

#  Warning threshold for memory usage (percentage)
mem_warning = 80

#  Critical threshold for memory usage (percentage)
mem_critical = 95

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
