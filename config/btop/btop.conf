#  Show CPU temperature
#  Requires lm-sensors or acpi
check_temp = True

#  Which temperature sensor to display
#  Values: "Auto" | "Package id 0" | sensor name
cpu_sensor = "Auto"

#  Show temps in Celsius or Fahrenheit
temp_scale = "celsius"

#  CPU graph type
#  Values: "normal" | "braille" | "block"
graph_symbol = "braille"

#  CPU graph symbol type when using "braille"
graph_symbol_cpu = "default"

#  Show CPU frequency in CPU box
show_cpu_freq = True

#  CPU usage graph size (height in lines)
#  This is set by the preset, can override here
cpu_graph_upper_limit = 100

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🧠  MEMORY BOX — Premium Memory Visualization
