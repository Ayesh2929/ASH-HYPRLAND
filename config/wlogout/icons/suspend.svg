<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>

    <filter id="suspend-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0.580 0.886 0.835 0 0
                0.580 0.886 0.835 0 0
                0.580 0.886 0.835 0 0
                0     0     0     1 0" result="c"/>
      <feMerge>
        <feMergeNode in="c"/>
        <feMergeNode in="c"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="suspend-soft">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Moon gradient: Teal → Sky -->
    <linearGradient id="suspend-moon-grad" x1="30%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#89dceb"/>
      <stop offset="100%" stop-color="#94e2d5"/>
    </linearGradient>

    <!-- Stars gradient -->
    <radialGradient id="suspend-star-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#cdd6f4"/>
      <stop offset="100%" stop-color="#94e2d5" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Crescent inner fill (cut-out simulate) -->
    <radialGradient id="suspend-crescent-cutout" cx="35%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="rgba(30,30,46,0.92)"/>
      <stop offset="100%" stop-color="rgba(17,17,27,0.88)"/>
    </radialGradient>

    <!-- Glow ring around moon -->
    <radialGradient id="suspend-moon-aura" cx="50%" cy="50%" r="50%">
      <stop offset="60%"  stop-color="rgba(148,226,213,0.00)"/>
      <stop offset="100%" stop-color="rgba(148,226,213,0.18)"/>
    </radialGradient>

  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30"
    fill="rgba(148,226,213,0.05)"
    stroke="rgba(148,226,213,0.12)"
    stroke-width="0.5"/>

  <!-- ── Moon aura glow ──────────────────────────────────────────────────── -->
  <circle cx="30" cy="34" r="20"
    fill="url(#suspend-moon-aura)"
    filter="url(#suspend-soft)"/>

  <!-- ── Crescent moon ──────────────────────────────────────────────────── -->
  <g filter="url(#suspend-glow)">
    <!-- Full moon circle -->
    <circle cx="30" cy="34" r="17"
      fill="url(#suspend-moon-grad)"
      stroke="rgba(148,226,213,0.50)"
      stroke-width="1"/>

    <!-- Crescent cutout — offset circle -->
    <circle cx="36" cy="29" r="14"
      fill="url(#suspend-crescent-cutout)"/>

    <!-- Moon terminator highlight -->
    <path d="M23 24 Q15 34 23 44"
      fill="none"
      stroke="rgba(255,255,255,0.25)"
      stroke-width="1.5"
      stroke-linecap="round"/>

    <!-- Rim light on bright edge -->
    <circle cx="30" cy="34" r="17"
      fill="none"
      stroke="rgba(255,255,255,0.10)"
      stroke-width="0.8"/>
  </g>

  <!-- ── Stars ──────────────────────────────────────────────────────────── -->
  <g filter="url(#suspend-soft)">

    <!-- Star 1 — large -->
    <g transform="translate(50, 16) rotate(0)">
      <polygon points="0,-5 1.4,-1.4 5,0 1.4,1.4 0,5 -1.4,1.4 -5,0 -1.4,-1.4"
        fill="url(#suspend-star-grad)"
        opacity="0.90"/>
    </g>

    <!-- Star 2 — medium -->
    <g transform="translate(55, 30) rotate(15)">
      <polygon points="0,-3.5 1,-1 3.5,0 1,1 0,3.5 -1,1 -3.5,0 -1,-1"
        fill="#cdd6f4"
        opacity="0.75"/>
    </g>

    <!-- Star 3 — small -->
    <g transform="translate(48, 44) rotate(-10)">
      <polygon points="0,-2.5 0.7,-0.7 2.5,0 0.7,0.7 0,2.5 -0.7,0.7 -2.5,0 -0.7,-0.7"
        fill="#94e2d5"
        opacity="0.70"/>
    </g>

    <!-- Star 4 — tiny -->
    <circle cx="44" cy="10" r="1.8"
      fill="#cdd6f4"
      opacity="0.80"/>
    <circle cx="42" cy="10" r="0.6"
      fill="#ffffff"
      opacity="0.9"/>

    <!-- Star 5 — tiny dot cluster -->
    <circle cx="58" cy="20" r="1.2" fill="#94e2d5" opacity="0.65"/>
    <circle cx="60" cy="17" r="0.8" fill="#cdd6f4" opacity="0.55"/>
    <circle cx="56" cy="14" r="1.0" fill="#89dceb" opacity="0.60"/>

    <!-- Twinkle cross on large star -->
    <line x1="50" y1="8" x2="50" y2="24"
      stroke="rgba(205,214,244,0.25)"
      stroke-width="0.7"
      stroke-linecap="round"/>
    <line x1="43" y1="16" x2="57" y2="16"
      stroke="rgba(205,214,244,0.25)"
      stroke-width="0.7"
      stroke-linecap="round"/>

  </g>

  <!-- ── Sleep Z's (subtle) ─────────────────────────────────────────────── -->
  <g opacity="0.40" fill="rgba(148,226,213,0.7)" font-family="sans-serif">
    <text x="8" y="20" font-size="9" font-weight="700" transform="rotate(-15, 14, 18)">z</text>
    <text x="13" y="13" font-size="7" font-weight="700" transform="rotate(-15, 18, 12)">z</text>
    <text x="17" y="8"  font-size="5" font-weight="700" transform="rotate(-15, 21, 7)">z</text>
  </g>

</svg>