# ══════════════════════════════════════════════════════════════════════════════
# §01  GESTURE FORMAT REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  gestures {
#    workspace_swipe              BOOL    — enable 3-finger ws swipe
#    workspace_swipe_fingers      N       — finger count (3 or 4)
#    workspace_swipe_min_fingers  BOOL    — N+ fingers (not exact N)
#    workspace_swipe_distance     N       — travel distance to trigger (px)
#    workspace_swipe_touch        BOOL    — enable for touchscreens too
#    workspace_swipe_invert       BOOL    — reverse swipe direction
#    workspace_swipe_min_speed_to_force N — speed to instantly trigger
#    workspace_swipe_cancel_ratio N       — 0.0–1.0 cancel threshold
#    workspace_swipe_create_new   BOOL    — create new ws at boundary
#    workspace_swipe_direction_lock BOOL  — lock to horizontal after start
#    workspace_swipe_direction_lock_threshold N — px before locking
#    workspace_swipe_forever      BOOL    — keep switching past end
#    workspace_swipe_use_r        BOOL    — use r+N relative workspaces
#    workspace_swipe_touch_invert BOOL    — invert touch swipe separately
#  }
#
#  ── Plugin: hyprgrass (custom gestures via Hyprland plugin API) ──────────────
#  bindgesture = GESTURE, DISPATCHER [, ARGS]
#
#  GESTURE format: DIRECTION:FINGERS[:EDGES]
#    DIRECTION: swipe:left | swipe:right | swipe:up | swipe:down
#               pinch:in   | pinch:out
#               edge:l>r   | edge:r>l | edge:u>d | edge:d>u (edge swipes)
#    FINGERS:   3 | 4 | 5
#
# ══════════════════════════════════════════════════════════════════════════════
# §02  BUILT-IN WORKSPACE SWIPE (libinput native)
# ══════════════════════════════════════════════════════════════════════════════

gestures {

    # ── Enable 3-finger horizontal swipe for workspace navigation ─────────────
    workspace_swipe                        = true

    # ── Finger count ─────────────────────────────────────────────────────────
    # 3 fingers = standard (conflicts with some 3-finger gestures in plugins)
    # 4 fingers = reserve 3-finger for other gestures (needs hyprgrass)
    workspace_swipe_fingers                = 3

    # Allow N+ fingers (not strictly N) — useful if you want 3+ to all work
    workspace_swipe_min_fingers            = false

    # ── Travel distance ───────────────────────────────────────────────────────
    # Pixels of finger travel before workspace changes
    # Lower = more sensitive (200–250 feels natural on 13" laptops)
    # Higher = requires more deliberate gesture (300–400 for 15"+ laptops)
    workspace_swipe_distance               = 280

    # ── Touch screen swipe support ────────────────────────────────────────────
    workspace_swipe_touch                  = true

    # ── Direction ─────────────────────────────────────────────────────────────
    # true  = swipe right → previous workspace (natural/macOS style)
    # false = swipe right → next workspace (traditional)
    workspace_swipe_invert                 = true

    # ── Invert separately for touchscreen ────────────────────────────────────
    workspace_swipe_touch_invert           = false

    # ── Minimum speed to force instant switch (don't need full distance) ──────
    # px/ms — fast flick immediately switches without waiting for distance
    workspace_swipe_min_speed_to_force     = 30

    # ── Cancel ratio ──────────────────────────────────────────────────────────
    # If user reverses gesture, cancel if they've traveled back N ratio of distance
    # 0.5 = cancel when back at 50% of travel distance
    workspace_swipe_cancel_ratio           = 0.5

    # ── Create new workspace when swiping past the last one ───────────────────
    workspace_swipe_create_new             = true

    # ── Direction lock ────────────────────────────────────────────────────────
    # Lock swipe to horizontal axis after detecting horizontal intent
    # Prevents diagonal drift from changing workspaces accidentally
    workspace_swipe_direction_lock         = true

    # px of horizontal movement before locking axis
    workspace_swipe_direction_lock_threshold = 12

    # ── Keep switching past workspace limits ──────────────────────────────────
    # false = bounce back at ws 1 / ws 10
    # true  = wrap around or create new
    workspace_swipe_forever                = false

    # ── Use relative workspace (r+1, r-1) instead of absolute numbers ─────────
    workspace_swipe_use_r                  = false
}

# ══════════════════════════════════════════════════════════════════════════════
# §03  HYPRGRASS PLUGIN GESTURES
#      Requires: hyprgrass plugin loaded in plugins.conf
#      Install:  hyprpm add https://github.com/horriblename/hyprgrass
#                hyprpm enable hyprgrass
#
#  All bindgesture lines are no-ops if hyprgrass is not loaded.
#  Comment them out if not using the plugin.
# ══════════════════════════════════════════════════════════════════════════════

# ── 3-finger gestures ─────────────────────────────────────────────────────────

# 3-finger swipe left  → go to next workspace
bindgesture = swipe:3:l,      workspace,  +1

# 3-finger swipe right → go to previous workspace
bindgesture = swipe:3:r,      workspace,  -1

# 3-finger swipe up    → toggle overview / hyprexpo
bindgesture = swipe:3:u,      hyprexpo:expo,  toggle

# 3-finger swipe down  → toggle special scratch workspace
bindgesture = swipe:3:d,      togglespecialworkspace, scratch

# ── 4-finger gestures ─────────────────────────────────────────────────────────

# 4-finger swipe left  → move active window to next workspace
bindgesture = swipe:4:l,      movetoworkspace, +1

# 4-finger swipe right → move active window to previous workspace
bindgesture = swipe:4:r,      movetoworkspace, -1

# 4-finger swipe up    → toggle fullscreen
bindgesture = swipe:4:u,      fullscreen, 0

# 4-finger swipe down  → minimize / move to special workspace
bindgesture = swipe:4:d,      movetoworkspace, special:scratch

# ── Pinch gestures ────────────────────────────────────────────────────────────

# Pinch in  (2+ fingers) → toggle floating for active window
bindgesture = pinch:in,       togglefloating

# Pinch out (2+ fingers) → maximize active window
bindgesture = pinch:out,      fullscreen, 1

# ── Edge swipe gestures (swipe from screen edges) ─────────────────────────────

# Edge swipe from left  → toggle app launcher (rofi)
bindgesture = edge:l>r,       exec, $launcher

# Edge swipe from right → toggle notification center (swaync)
bindgesture = edge:r>l,       exec, $notifCenter

# Edge swipe from top   → toggle quick settings
bindgesture = edge:u>d,       exec, swaync-client --toggle-panel

# Edge swipe from bottom → toggle special scratch workspace
bindgesture = edge:d>u,       togglespecialworkspace, scratch

# ══════════════════════════════════════════════════════════════════════════════
# §04  TOUCHSCREEN SPECIFIC GESTURES
#      Tablet / touchscreen devices (e.g. Surface, iPad-style tablets)
#      These use the same bindgesture system with touch input
# ══════════════════════════════════════════════════════════════════════════════

# ── Two-finger edge swipes (for tablet mode) ──────────────────────────────────
# Swipe from left edge with 2 fingers → go back (browser/file manager)
# bindgesture = edge:l>r:2,   sendshortcut, ALT, LEFT

# Swipe from right edge with 2 fingers → go forward
# bindgesture = edge:r>l:2,   sendshortcut, ALT, RIGHT

# ── Rotation gesture (for screen rotation in tablet mode) ─────────────────────
# bindgesture = rotate:180,   exec, hyprctl keyword monitor "eDP-1,preferred,auto,1,transform,2"

# ══════════════════════════════════════════════════════════════════════════════
# §05  PER-MODE GESTURE OVERRIDES
#      Applied dynamically by ASH mode engine
# ══════════════════════════════════════════════════════════════════════════════

# ── Game mode: disable touchpad gestures to prevent accidental triggers ───────
# gestures { workspace_swipe = false }

# ── Presentation mode: 2-finger swipe advances slides ─────────────────────────
# bindgesture = swipe:2:l, exec, xdotool key Next
# bindgesture = swipe:2:r, exec, xdotool key Prior

# ── Focus mode: 3-finger down hides all windows (show desktop) ────────────────
# bindgesture = swipe:3:d, exec, hyprctl dispatch workspaceopt allfloat

# ══════════════════════════════════════════════════════════════════════════════
# §06  SCROLL GESTURE CONFIGURATION
#      Fine-tune scroll behavior per device in input.conf §08
# ══════════════════════════════════════════════════════════════════════════════

# Natural scroll direction is set per-device in input.conf
# Global override (uncomment if needed):
# input { natural_scroll = true }

# ══════════════════════════════════════════════════════════════════════════════
# §07  GESTURE DEBUGGING
#      Use to identify gesture names and coordinates
# ══════════════════════════════════════════════════════════════════════════════

# Enable gesture debug logging:
# debug { disable_logs = false }
# Then: journalctl -f -t hyprland | grep -i gesture

# List available gesture events:
# hyprctl dispatch gestures

