# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Autostart Configuration                          ║
# ║  exec-once  = run once on Hyprland start                                    ║
# ║  exec       = run on every config reload                                    ║
# ║  exec-shutdown = run on Hyprland exit                                       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  SYSTEM DAEMONS & INFRASTRUCTURE
#      Must start before anything UI-facing.
#      Order matters — dependencies cascade downward.
# ══════════════════════════════════════════════════════════════════════════════

# ── D-Bus session (should already be running via systemd, belt-and-suspenders) ─
exec-once = hash dbus-update-activation-environment 2>/dev/null && \
            dbus-update-activation-environment --systemd \
              WAYLAND_DISPLAY \
              XDG_CURRENT_DESKTOP \
              XDG_SESSION_TYPE \
              HYPRLAND_INSTANCE_SIGNATURE \
              QT_QPA_PLATFORM \
              GDK_BACKEND

# ── Systemd user session environment sync ────────────────────────────────────
exec-once = systemctl --user import-environment \
              WAYLAND_DISPLAY \
              XDG_CURRENT_DESKTOP \
              XDG_SESSION_TYPE \
              HYPRLAND_INSTANCE_SIGNATURE \
              PATH

# ── XDG Desktop Portals (file pickers, screen sharing, clipboard) ─────────────
exec-once = sleep 0.5 && /usr/lib/xdg-desktop-portal-hyprland &
exec-once = sleep 1.0 && /usr/lib/xdg-desktop-portal &

# ── GNOME Keyring / Secret Service ───────────────────────────────────────────
exec-once = gnome-keyring-daemon --start --components=pkcs11,secrets,ssh

# ── PolicyKit agent (for privilege escalation dialogs) ───────────────────────
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# ── Pipewire audio stack ──────────────────────────────────────────────────────
exec-once = pipewire
exec-once = pipewire-pulse
exec-once = wireplumber

# ── Bluetooth manager daemon ──────────────────────────────────────────────────
exec-once = /usr/lib/bluetooth/bluetoothd
exec-once = blueman-applet

# ── NetworkManager applet (system tray) ──────────────────────────────────────
exec-once = nm-applet --indicator

# ══════════════════════════════════════════════════════════════════════════════
# §02  DISPLAY & INPUT INFRASTRUCTURE
# ══════════════════════════════════════════════════════════════════════════════

# ── Wallpaper daemon (swww — GPU-accelerated, animated wallpapers) ────────────
exec-once = swww-daemon --format xrgb
exec-once = sleep 0.8 && ash wallpaper set --file $ASH_WALLPAPERS/default-dark.jpg

# ── Hyprcursor (HyprCursor theme loader) ─────────────────────────────────────
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# ── Gamma / color temperature (hyprsunset — blue light filter) ───────────────
exec-once = hyprsunset -t 6500     # Daytime neutral (ASH night-light engine controls this)

# ── Monitor hot-plug handler ──────────────────────────────────────────────────
exec-once = ~/.config/hypr/scripts/monitor-hotplug.sh --daemon

# ── Kanshi (dynamic monitor configuration profiles) ──────────────────────────
exec-once = kanshi --config ~/.config/kanshi/config

# ── Input remapping (for special keyboards / stream decks) ────────────────────
exec-once = kanata --cfg ~/.config/kanata/kanata.kbd &

# ══════════════════════════════════════════════════════════════════════════════
# §03  BAR & SHELL COMPONENTS
# ══════════════════════════════════════════════════════════════════════════════

# ── Waybar (status bar) ───────────────────────────────────────────────────────
exec-once = waybar --config ~/.config/waybar/config.jsonc \
                   --style  ~/.config/waybar/style.css

# ── SwayNC (notification center + quick settings) ─────────────────────────────
exec-once = swaync

# ── AGS (Aylur's GTK Shell — OSD, overview, app launcher) ────────────────────
# exec-once = ags run ~/.config/ags/app.ts

# ── EWW widgets (alternative to AGS) ─────────────────────────────────────────
# exec-once = eww daemon && eww open bar

# ══════════════════════════════════════════════════════════════════════════════
# §04  IDLE & POWER MANAGEMENT
# ══════════════════════════════════════════════════════════════════════════════

# ── Hypridle (idle timeout manager → dim → lock → sleep) ─────────────────────
exec-once = hypridle --config ~/.config/hypridle/hypridle.conf

# ── DPMS — handled by hypridle, but fallback power event hook ─────────────────
# exec-once = ~/.config/hypr/scripts/idle-handler.sh --daemon

# ── UPower listener (battery alerts) ─────────────────────────────────────────
exec-once = ~/.config/hypr/scripts/battery-monitor.sh &

# ══════════════════════════════════════════════════════════════════════════════
# §05  INPUT METHOD & CLIPBOARD
# ══════════════════════════════════════════════════════════════════════════════

# ── Fcitx5 input method framework (CJK / IME) ────────────────────────────────
exec-once = fcitx5 -d --replace

# ── Cliphist (clipboard history manager) ─────────────────────────────────────
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ── wl-clip-persist (keep clipboard contents after app closes) ───────────────
exec-once = wl-clip-persist --clipboard regular

# ══════════════════════════════════════════════════════════════════════════════
# §06  SECURITY & AUTHENTICATION
# ══════════════════════════════════════════════════════════════════════════════

# ── SSH agent (for key management) ───────────────────────────────────────────
exec-once = eval $(ssh-agent -s) && \
            ssh-add ~/.ssh/id_ed25519 2>/dev/null; \
            echo $SSH_AUTH_SOCK > $XDG_RUNTIME_DIR/ssh-agent-sock

# ── GPG agent ────────────────────────────────────────────────────────────────
exec-once = gpg-connect-agent updatestartuptty /bye >/dev/null 2>&1

# ── KeePassXC (password manager, tray mode) ──────────────────────────────────
# exec-once = keepassxc --minimized

# ── VPN auto-connect (optional) ───────────────────────────────────────────────
# exec-once = ~/.config/hypr/scripts/vpn-auto.sh

# ══════════════════════════════════════════════════════════════════════════════
# §07  ASH DOTFILES CORE DAEMONS
# ══════════════════════════════════════════════════════════════════════════════

# ── ASH session initialization (sets up state, checks deps) ──────────────────
exec-once = ash session init

# ── ASH IPC server (WebSocket + Unix socket for external control) ─────────────
exec-once = ash ipc server --daemonize

# ── ASH hot-reload watcher (monitors config changes & reloads) ───────────────
exec-once = ash hot-reload watch --daemonize

# ── ASH plugin daemon (manages plugin lifecycle) ──────────────────────────────
exec-once = ash plugin daemon --daemonize

# ── ASH theme engine — apply saved theme on startup ──────────────────────────
exec-once = sleep 1.2 && ash theme apply --current --silent

# ── ASH REST API server (local web API for dashboard/mobile) ─────────────────
exec-once = ash api start --background

# ══════════════════════════════════════════════════════════════════════════════
# §08  MEDIA & AUDIO EXTRAS
# ══════════════════════════════════════════════════════════════════════════════

# ── Playerctl daemon (media player control) ───────────────────────────────────
exec-once = playerctld daemon

# ── MPD (music player daemon) ────────────────────────────────────────────────
# exec-once = mpd ~/.config/mpd/mpd.conf

# ── EasyEffects (audio EQ / effects) ─────────────────────────────────────────
# exec-once = easyeffects --gapplication-service

# ── Spotify (minimized) ───────────────────────────────────────────────────────
# exec-once = spotify --minimized

# ══════════════════════════════════════════════════════════════════════════════
# §09  DEVELOPMENT TOOLS (opt-in)
# ══════════════════════════════════════════════════════════════════════════════

# ── Docker daemon check ───────────────────────────────────────────────────────
exec-once = systemctl --user is-active docker.service || true

# ── Syncthing (file sync daemon, web UI on localhost:8384) ────────────────────
# exec-once = syncthing --no-browser

# ── Tailscale VPN ─────────────────────────────────────────────────────────────
# exec-once = tailscale up

# ── Ollama AI daemon (local LLM for ASH AI features) ─────────────────────────
# exec-once = ollama serve &

# ══════════════════════════════════════════════════════════════════════════════
# §10  SYSTEM TRAY & APPLETS
# ══════════════════════════════════════════════════════════════════════════════

# ── Thunderbird / mail (minimized to tray) ───────────────────────────────────
# exec-once = thunderbird

# ── Calendar daemon (khal — terminal calendar sync) ──────────────────────────
# exec-once = vdirsyncer sync &

# ── Espanso (text expander) ───────────────────────────────────────────────────
exec-once = espanso start

# ── KDE Connect / GSConnect (phone integration) ──────────────────────────────
# exec-once = /usr/lib/kdeconnectd

# ── Rclone mount (cloud storage) ─────────────────────────────────────────────
# exec-once = rclone mount gdrive: ~/Cloud/Google --daemon

# ══════════════════════════════════════════════════════════════════════════════
# §11  ON CONFIG RELOAD (exec — runs on every `hyprctl reload`)
# ══════════════════════════════════════════════════════════════════════════════

# ── Reload wallpaper ──────────────────────────────────────────────────────────
exec = ash wallpaper reload --silent

# ── Reload waybar (kills & restarts) ─────────────────────────────────────────
exec = pkill -x waybar;   sleep 0.3 && \
       waybar --config ~/.config/waybar/config.jsonc \
              --style  ~/.config/waybar/style.css &

# ── Reload swaync ─────────────────────────────────────────────────────────────
exec = swaync-client --reload-config

# ── Reload AGS ────────────────────────────────────────────────────────────────
# exec = ags quit; sleep 0.2 && ags run ~/.config/ags/app.ts

# ── Sync GTK theme ────────────────────────────────────────────────────────────
exec = gsettings set org.gnome.desktop.interface gtk-theme       'Catppuccin-Mocha-Standard-Mauve-dark'
exec = gsettings set org.gnome.desktop.interface icon-theme      'Papirus-Dark'
exec = gsettings set org.gnome.desktop.interface cursor-theme    'Bibata-Modern-Ice'
exec = gsettings set org.gnome.desktop.interface cursor-size      24
exec = gsettings set org.gnome.desktop.interface font-name       'Noto Sans 11'
exec = gsettings set org.gnome.desktop.interface monospace-font-name 'JetBrainsMono Nerd Font 11'
exec = gsettings set org.gnome.desktop.interface document-font-name  'Noto Sans 11'
exec = gsettings set org.gnome.desktop.interface color-scheme    'prefer-dark'
exec = gsettings set org.gnome.desktop.interface accent-color    'purple'

# ── Re-apply ASH theme colors (hot-reload without full restart) ───────────────
exec = sleep 0.5 && ash theme apply --current --silent --skip-wallpaper

# ══════════════════════════════════════════════════════════════════════════════
# §12  STARTUP WORKSPACE LAYOUT
#      Open default applications in assigned workspaces on first boot.
#      Comment out anything you don't want auto-started.
# ══════════════════════════════════════════════════════════════════════════════

# ── Workspace 1 — Terminal ────────────────────────────────────────────────────
exec-once = sleep 2.0 && hyprctl dispatch workspace 1 && kitty

# ── Workspace 2 — Browser ─────────────────────────────────────────────────────
# exec-once = sleep 2.2 && hyprctl dispatch workspace 2 && firefox

# ── Workspace 3 — Editor ──────────────────────────────────────────────────────
# exec-once = sleep 2.4 && hyprctl dispatch workspace 3 && kitty -e nvim

# ── Workspace 9 — Music ───────────────────────────────────────────────────────
# exec-once = sleep 3.0 && hyprctl dispatch workspace 9 && spotify

# ── Workspace 10 — Monitoring ─────────────────────────────────────────────────
# exec-once = sleep 3.2 && hyprctl dispatch workspace 10 && kitty -e btop

# ── Return to workspace 1 after layout ────────────────────────────────────────
exec-once = sleep 4.0 && hyprctl dispatch workspace 1

# ══════════════════════════════════════════════════════════════════════════════
# §13  SHUTDOWN HOOKS
# ══════════════════════════════════════════════════════════════════════════════

exec-shutdown = ash session cleanup
exec-shutdown = swww kill
exec-shutdown = pkill -x waybar
exec-shutdown = pkill -x swaync
exec-shutdown = pkill -x hypridle
exec-shutdown = pkill -x kanshi
exec-shutdown = ash api stop
exec-shutdown = ash ipc stop