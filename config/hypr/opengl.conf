# §03  AMD GPU OPTIMIZATIONS
#      Mesa RADV/RadeonSI — applied via exec-once or env.conf
# ══════════════════════════════════════════════════════════════════════════════

# ── RDNA2+ (RX 6000 / RX 7000 series) ────────────────────────────────────────
# opengl {
#     nvidia_anti_flicker  = false    # Not needed on AMD
#     force_introspection  = 0        # Mesa optimizes internally
# }
# Additional env (in env.conf):
# env = AMD_VULKAN_ICD,              RADV
# env = MESA_SHADER_CACHE_MAX_SIZE,  4G
# env = RADV_PERFTEST,               ngg,rt,ext_ms
# env = ACO_DEBUG,                   forcestores        # ACO shader compiler flag

# ── RDNA1 (RX 5000 series) ────────────────────────────────────────────────────
# env = AMD_VULKAN_ICD,              RADV
# env = MESA_SHADER_CACHE_MAX_SIZE,  2G
# env = RADV_PERFTEST,               ngg

# ── GCN (RX 400/500/Vega series — legacy) ────────────────────────────────────
# env = AMD_VULKAN_ICD,              RADV
# env = MESA_GL_VERSION_OVERRIDE,    4.6
# env = MESA_GLSL_VERSION_OVERRIDE,  460

# ── APU (Ryzen with Radeon Graphics — iGPU) ───────────────────────────────────
# opengl {
#     nvidia_anti_flicker  = false
#     force_introspection  = 0
# }
# env = AMD_VULKAN_ICD,              RADV
# env = MESA_SHADER_CACHE_MAX_SIZE,  512M   # Shared RAM — conservative

