# ══════════════════════════════════════════════════════════════════════════════
# §06  HYBRID GRAPHICS (PRIME / Optimus / MUX)
# ══════════════════════════════════════════════════════════════════════════════

# ── AMD iGPU + AMD dGPU (RDNA2 laptop, e.g. Framework 16) ────────────────────
# Use dGPU as primary:
# env = DRI_PRIME,                    1
# env = AMD_VULKAN_ICD,               RADV
# env = WLR_DRM_DEVICES,              /dev/dri/card1:/dev/dri/card0

# ── Intel iGPU + AMD dGPU (most AMD Advantage laptops) ───────────────────────
# env = DRI_PRIME,                    pci-0000_03_00_0  # Use lspci to find ID
# env = AMD_VULKAN_ICD,               RADV

# ── Intel iGPU + Nvidia dGPU (PRIME offload mode) ────────────────────────────
# Primary display on iGPU, render on dGPU:
# env = __NV_PRIME_RENDER_OFFLOAD,    1
# env = __NV_PRIME_RENDER_OFFLOAD_PROVIDER, NVIDIA-G0
# env = __GLX_VENDOR_LIBRARY_NAME,    nvidia
# env = __VK_LAYER_NV_optimus,        NVIDIA_only

# ── MUX Switch (direct dGPU mode) ─────────────────────────────────────────────
# When laptop MUX switch is set to dGPU-only:
# env = WLR_DRM_DEVICES,              /dev/dri/card1    # dGPU only

# ══════════════════════════════════════════════════════════════════════════════
# §07  SHADER CACHE MANAGEMENT
# ══════════════════════════════════════════════════════════════════════════════

# ── Mesa shader cache ─────────────────────────────────────────────────────────
# Default location: ~/.cache/mesa_shader_cache/
# Size grows to MESA_SHADER_CACHE_MAX_SIZE then prunes old entries
#
# Clear cache (if experiencing artifacts after driver update):
# rm -rf ~/.cache/mesa_shader_cache/
#
# Inspect cache:
# du -sh ~/.cache/mesa_shader_cache/
# ls -la ~/.cache/mesa_shader_cache/

# ── Nvidia shader cache ───────────────────────────────────────────────────────
# Default: managed by driver internally (~/.nv/ComputeCache/)
# Custom location via env:
# env = __GL_SHADER_DISK_CACHE_PATH,  $HOME/.cache/nv-shader-cache
#
# Clear:
# rm -rf ~/.nv/ComputeCache/
# rm -rf ~/.cache/nv-shader-cache/

# ── Vulkan pipeline cache ─────────────────────────────────────────────────────
# Default: ~/.cache/vulkan/
# Clear:
# rm -rf ~/.cache/vulkan/

