# §08  PERFORMANCE PROFILING & DIAGNOSTICS
# ══════════════════════════════════════════════════════════════════════════════

# ── GPU usage monitoring ──────────────────────────────────────────────────────
# AMD:      radeontop -c               → terminal GPU monitor
#           amdgpu_top                 → detailed GPU stats
# Nvidia:   nvidia-smi dmon -s u       → utilization stream
#           nvtop                      → terminal GPU top
# Intel:    intel_gpu_top              → Intel GPU utilization
# All:      btop                       → integrated system monitor

# ── OpenGL information ────────────────────────────────────────────────────────
# glxinfo -B                           → OpenGL renderer + version
# glxinfo | grep -E "renderer|version|vendor"
# eglinfo                              → EGL extensions and platforms
# vulkaninfo --summary                 → Vulkan device info

# ── Frame timing ──────────────────────────────────────────────────────────────
# LIBGL_SHOW_FPS=1 application        → show FPS in terminal
# vblank_mode=0 application           → disable vsync for max FPS test
# mesa_glthread=true application      → enable Mesa GL threading

# ── Hyprland render benchmark ─────────────────────────────────────────────────
# hyprctl dispatch bench renderloop 300
# debug { overlay = true }            → show per-frame GPU time

# ── DRM/KMS information ───────────────────────────────────────────────────────
# drm_info                             → detailed DRM device info
# wlr-randr                            → Wayland output info
# hyprctl monitors                     → Hyprland monitor state

# ══════════════════════════════════════════════════════════════════════════════
# §09  COMMON OPENGL ISSUES & FIXES
# ══════════════════════════════════════════════════════════════════════════════

# ── Black screen on startup ──────────────────────────────────────────────────
# Cause:  GPU driver / DRM mismatch
# Fix 1:  env = WLR_DRM_DEVICES, /dev/dri/card0   (specify card explicitly)
# Fix 2:  env = WLR_RENDERER, gles2               (force GLES2 renderer)
# Fix 3:  Disable direct_scanout in render.conf

# ── Cursor invisible ──────────────────────────────────────────────────────────
# Cause:  Hardware cursor unsupported
# Fix:    env = WLR_NO_HARDWARE_CURSORS, 1
# Fix:    cursor { no_hardware_cursors = true }

# ── Tearing / screen tear ─────────────────────────────────────────────────────
# Cause:  VRR mismatch or direct scanout issue
# Fix 1:  misc { vrr = 0 }                        (disable VRR)
# Fix 2:  render { direct_scanout = false }
# Fix 3:  windowrulev2 = immediate, class:^(gamename)$  (per-game tearing)

# ── App appears blurry (XWayland HiDPI) ──────────────────────────────────────
# Fix:    xwayland { force_zero_scaling = true }
# Fix:    env = GDK_SCALE, 2  (for GTK apps)
# Fix:    env = QT_SCALE_FACTOR, 2  (for Qt apps)

# ── Hyprland crashes on shader compile ────────────────────────────────────────
# Fix 1:  rm -rf ~/.cache/mesa_shader_cache/
# Fix 2:  opengl { force_introspection = 0 }      (disable shader analysis)
# Fix 3:  env = MESA_NO_ERROR, 1                  (skip GL error checking)

# ── High CPU usage idle ───────────────────────────────────────────────────────
# Cause:  Constant redraws from animations or shader
# Fix 1:  misc { vfr = true }                     (enable variable framerate)
# Fix 2:  Disable screen_shader in decorations.conf
# Fix 3:  debug { damage_blink = true }            (identify redraws)

# ── Nvidia: EGL_BAD_ALLOC error ───────────────────────────────────────────────
# Cause:  EGL context creation failure (usually driver version)
# Fix 1:  Update nvidia-dkms to latest
# Fix 2:  env = __EGL_VENDOR_LIBRARY_FILENAMES, /usr/share/glvnd/egl_vendor.d/10_nvidia.json
# Fix 3:  env = GBM_BACKEND, nvidia-drm

