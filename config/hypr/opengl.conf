# ── Nvidia RTX 40xx (Ada Lovelace) ────────────────────────────────────────────
# opengl {
#     nvidia_anti_flicker  = true     # Keep enabled
#     force_introspection  = 2        # Nvidia benefits from this
# }
# env = __GL_MaxFramesAllowed,        1      # Reduce buffered frames
# env = __GL_SHADER_DISK_CACHE,       1
# env = __GL_SHADER_DISK_CACHE_PATH,  $HOME/.cache/nv-shader-cache
# env = __GL_YIELD,                   USLEEP

# ── Nvidia RTX 30xx (Ampere) ──────────────────────────────────────────────────
# opengl {
#     nvidia_anti_flicker  = true
#     force_introspection  = 2
# }
# env = __GL_MaxFramesAllowed,        1
# env = __GL_SHADER_DISK_CACHE,       1
# env = GBM_BACKEND,                  nvidia-drm
# env = __GLX_VENDOR_LIBRARY_NAME,    nvidia

# ── Nvidia GTX 10xx/16xx/RTX 20xx (legacy Wayland) ───────────────────────────
# opengl {
#     nvidia_anti_flicker  = true
#     force_introspection  = 1        # Force on for older drivers
# }
# env = WLR_NO_HARDWARE_CURSORS,      1      # Software cursor required
# env = XWAYLAND_NO_GLAMOR,           1      # Disable Glamor for XWayland
# env = GBM_BACKEND,                  nvidia-drm
# env = __GLX_VENDOR_LIBRARY_NAME,    nvidia

# ── Nvidia Optimus (iGPU + Nvidia dGPU) ──────────────────────────────────────
# opengl {
#     nvidia_anti_flicker  = true
#     force_introspection  = 2
# }
# env = __NV_PRIME_RENDER_OFFLOAD,    1
# env = __VK_LAYER_NV_optimus,        NVIDIA_only
# env = __GLX_VENDOR_LIBRARY_NAME,    nvidia
# env = WLR_DRM_DEVICES,              /dev/dri/card1:/dev/dri/card0

