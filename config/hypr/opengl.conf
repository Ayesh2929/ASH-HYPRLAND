# ══════════════════════════════════════════════════════════════════════════════
# §01  OPENGL FORMAT REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  opengl {
#    nvidia_anti_flicker    BOOL — sleep before buffer swap to prevent Nvidia flicker
#    force_introspection    N    — shader analysis depth
#                                  0 = disabled
#                                  1 = always analyze all shaders
#                                  2 = Nvidia GPU only (recommended)
#  }
#
#  ── Extended GPU control via environment variables (set in env.conf) ──────────
#
#  ── Mesa (AMD / Intel) ────────────────────────────────────────────────────────
#  MESA_GL_VERSION_OVERRIDE=4.6       — report higher GL version to apps
#  MESA_GLSL_VERSION_OVERRIDE=460     — report higher GLSL version
#  MESA_NO_ERROR=1                    — disable GL error checking (perf boost)
#  MESA_SHADER_CACHE_DIR=PATH         — custom shader cache location
#  MESA_SHADER_CACHE_MAX_SIZE=4G      — max shader cache size
#  MESA_LOADER_DRIVER_OVERRIDE=radeonsi — force specific Mesa driver
#  AMD_VULKAN_ICD=RADV                — force RADV Vulkan (vs AMDVLK)
#  RADV_PERFTEST=ngg,rt               — enable RADV experimental features
#  RADV_DEBUG=nocache                 — disable RADV shader cache (debug)
#  ANV_QUEUE_THREAD_DISABLE=1         — Intel queue thread workaround
#
#  ── Nvidia proprietary ────────────────────────────────────────────────────────
#  __GL_YIELD=USLEEP                  — reduce CPU usage in GL driver
#  __GL_MaxFramesAllowed=1            — reduce buffered frames (lower latency)
#  __GL_THREADED_OPTIMIZATIONS=1      — enable threaded GL optimizations
#  __GL_SHADER_DISK_CACHE=1           — enable shader disk cache
#  __GL_SHADER_DISK_CACHE_PATH=PATH   — shader cache location
#  __GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1 — keep all cache entries
#  __GLX_VENDOR_LIBRARY_NAME=nvidia   — force Nvidia GLX library
#  __NV_PRIME_RENDER_OFFLOAD=1        — enable PRIME render offload
#  __VK_LAYER_NV_optimus=NVIDIA_only  — Vulkan on Nvidia only
#  NV_PRIME_RENDER_OFFLOAD_PROVIDER=NVIDIA-G0 — PRIME provider selection
#
#  ── EGL / Wayland ─────────────────────────────────────────────────────────────
#  EGL_PLATFORM=wayland               — force EGL Wayland platform
#  LIBGL_ALWAYS_SOFTWARE=1            — force software rendering (debug only)
#  LIBGL_DRI3_DISABLE=1               — disable DRI3 (legacy fix)
#  WLR_RENDERER=vulkan                — use Vulkan renderer in wlroots
#  WLR_RENDERER=gles2                 — use GLES2 renderer in wlroots
#  WLR_NO_HARDWARE_CURSORS=1          — software cursor (Nvidia fix)
#
# ══════════════════════════════════════════════════════════════════════════════
# §02  CORE OPENGL SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

opengl {

    # ── Nvidia Anti-Flicker ───────────────────────────────────────────────────
    # Inserts a controlled sleep before OpenGL buffer swap operations.
    # Eliminates the characteristic "Nvidia flicker" seen on some driver
    # versions where frames appear torn or flash briefly black.
    #
    # Mechanism: Adds ~0.5ms sleep before eglSwapBuffers()
    # Cost:      Negligible latency increase (< 1ms per frame)
    # Benefit:   Eliminates frame-boundary flicker artifacts
    #
    # ENABLE if:
    #   • You have an Nvidia dGPU (any generation)
    #   • You see occasional screen flashes / micro-flickers
    #   • Running Nvidia proprietary driver (any version)
    #
    # DISABLE if:
    #   • AMD or Intel GPU only system (no effect, slight waste)
    #   • Using open-source Nouveau driver (unneeded)
    #   • Confirmed no flicker present (saves the sleep overhead)
    nvidia_anti_flicker          = true

    # ── Shader Introspection ──────────────────────────────────────────────────
    # Analyzes GLSL shader code before compilation to:
    #   • Detect redundant texture samples
    #   • Eliminate dead code branches
    #   • Simplify complex blur kernels
    #   • Optimize uniform variable access patterns
    #
    # Introspection runs once per unique shader at startup/first-use.
    # Results are cached — subsequent launches use cached optimizations.
    #
    # 0 = Disabled
    #     → Fastest startup, no analysis overhead
    #     → Shaders compile as-is without optimization
    #     → Use for: Intel iGPU, software rendering, CI/testing
    #
    # 1 = Always enabled
    #     → Analyze ALL shaders regardless of GPU vendor
    #     → Slower first startup (shader analysis time)
    #     → Best optimization across all GPU types
    #     → Use for: AMD GPUs, Intel Arc, any non-Nvidia GPU
    #
    # 2 = Nvidia only (RECOMMENDED)
    #     → Only enables introspection when Nvidia GPU is detected
    #     → Nvidia proprietary compiler benefits most from pre-analysis
    #     → AMD/Intel Mesa compiler already optimizes internally
    #     → Safe default: no-op on non-Nvidia, beneficial on Nvidia
    force_introspection          = 2
}

