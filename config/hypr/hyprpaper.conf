#
# Referenced by config/hypr/themes/wallpaper.conf. Preload entries keep the
# switch instant; splash is disabled so the wallpaper never covers the bar.

preload = ~/.config/ash-dotfiles/assets/wallpapers/default-dark.jpg
wallpaper = , ~/.config/ash-dotfiles/assets/wallpapers/default-dark.jpg
splash = false
ipc = on
