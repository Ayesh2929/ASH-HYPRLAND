# §08  GLOBAL SHORTCUTS REGISTRY
#      Apps register global shortcuts via xdg-desktop-portal
#      List registered shortcuts: hyprctl globalshortcuts
# ══════════════════════════════════════════════════════════════════════════════

# Common app shortcuts that register globally:
#
# ── OBS Studio ────────────────────────────────────────────────────────────────
# Start recording:   Ctrl+Alt+R (registered by OBS)
# Stop recording:    Ctrl+Alt+S
# Push-to-talk:      varies
#
# ── KDE Connect / GSConnect ───────────────────────────────────────────────────
# Media controls:    registered automatically
#
# ── Flameshot ─────────────────────────────────────────────────────────────────
# Screenshot:        registered via xdg portal
#
# To override an app's global shortcut, use sendshortcut dispatcher:
# bind = $mainMod, F9, sendshortcut, CTRL ALT, R, class:^(com.obsproject.Studio)$

# ══════════════════════════════════════════════════════════════════════════════
# §09  REPEAT RATE TUNING FOR HELD BINDS
#      binde = uses input.repeat_rate for how fast it fires while held
#      Configured in input.conf: repeat_rate = 50 (50 events/sec)
# ══════════════════════════════════════════════════════════════════════════════

# ── Volume step calculation ───────────────────────────────────────────────────
# At repeat_rate=50, hold VolumeUp for 1 second = 50 events
# With 2% per event = +100% in 1s (way too fast)
# Solution: use smaller step (1%) or add delay via script debounce
#
# Recommended volume bind:
# binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_SINK@ 1%+

# ── Resize step calculation ───────────────────────────────────────────────────
# At repeat_rate=50, hold resize for 1 second = 50 × 20px = 1000px moved
# Appropriate for most monitor sizes
#
# Recommended resize bind:
# binde = $mainMod, Right, resizeactive, 20 0

