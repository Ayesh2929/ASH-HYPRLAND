# §05  SUBMAP REGISTRY
#      Submap definitions live in keybinds/SUBMAP-submap.conf files.
#      This section documents all available submaps for reference.
# ══════════════════════════════════════════════════════════════════════════════

# ── Resize submap ─────────────────────────────────────────────────────────────
# Activated:    $mainMod + R
# Deactivated:  Escape | Return
# Purpose:      Resize active window with arrow keys / HJKL
# Source:       keybinds/resize-submap.conf

# ── Move submap ───────────────────────────────────────────────────────────────
# Activated:    $mainMod + Shift + M
# Deactivated:  Escape | Return
# Purpose:      Move active window with arrow keys / HJKL
# Source:       keybinds/move-submap.conf

# ── Group submap ──────────────────────────────────────────────────────────────
# Activated:    $mainMod + G
# Deactivated:  Escape | Return
# Purpose:      Manage window groups (lock, move, tab)
# Source:       keybinds/group-submap.conf

# ── Power submap ──────────────────────────────────────────────────────────────
# Activated:    $mainMod + Shift + E
# Deactivated:  Escape | any key
# Purpose:      Power actions (lock, suspend, shutdown, reboot)
# Source:       keybinds/power-submap.conf

# ── Monitor submap ────────────────────────────────────────────────────────────
# Activated:    $mainMod + Shift + O
# Deactivated:  Escape | Return
# Purpose:      Monitor layout management (mirror, extend, disable)
# Source:       keybinds/monitor-submap.conf

# ── Passthrough submap ────────────────────────────────────────────────────────
# Activated:    $mainMod + F2
# Deactivated:  $mainMod + F2
# Purpose:      Pass ALL keys to focused window (VM, remote desktop)
# Source:       keybinds/passthrough-submap.conf

