# ══════════════════════════════════════════════════════════════════════════════
# §01  BINDS FORMAT REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  binds {
#    pass_mouse_when_bound    BOOL — pass mouse clicks through to windows
#    scroll_event_delay       N    — ms debounce for scroll-triggered binds
#    workspace_back_and_forth BOOL — toggle prev/current ws with same key
#    allow_workspace_cycles   BOOL — wrap around at ws boundary
#    workspace_center_on      N    — 0=last-active 1=cursor position
#    focus_preferred_method   N    — 0=history 1=geometric nearest
#    ignore_group_lock        BOOL — let binds work inside locked groups
#    movefocus_cycles_fullscreen BOOL — cycle through fullscreen windows
#    movefocus_cycles_groupfirst BOOL — focus group before moving out
#    disable_keybind_grabbing BOOL — prevent exclusive input capture
#    window_direction_monitor_fallback BOOL — cross monitors on movefocus
#  }
#
#  ── Bind flags ───────────────────────────────────────────────────────────────
#  bind  = MOD, KEY, DISPATCHER [, ARGS]     — standard bind
#  bindm = MOD, KEY, DISPATCHER [, ARGS]     — mouse bind
#  bindr = MOD, KEY, DISPATCHER [, ARGS]     — on release
#  binde = MOD, KEY, DISPATCHER [, ARGS]     — repeat while held
#  bindl = MOD, KEY, DISPATCHER [, ARGS]     — locked (active in lockscreen)
#  bindt = MOD, KEY, DISPATCHER [, ARGS]     — transparent (passes to app)
#  bindp = MOD, KEY, DISPATCHER [, ARGS]     — per-device
#  bindgesture = GESTURE, DISPATCHER [, ARGS]
#
#  ── Bind flag combinations ────────────────────────────────────────────────────
#  binde  = repeat while held (volume keys, resize)
#  bindel = repeat + locked (media keys on lock screen)
#  bindrl = release + locked
#  bindl  = works on lock screen (play/pause, brightness)
#
#  ── Dispatcher reference ─────────────────────────────────────────────────────
#  exec             CMD                — run shell command
#  execr            CMD                — run command (don't track pid)
#  pass             WINDOW             — pass keybind to matching window
#  killactive                          — close focused window
#  closewindow      WINDOW             — close specific window
#  workspace        N|name|prev|next|empty|back_and_forth
#  movetoworkspace  N|name|prev|next|empty|back_and_forth[,window]
#  movetoworkspacesilent  N            — move without switching
#  togglefloating   [WINDOW]           — float/unfloat window
#  setfloating      [WINDOW]           — force float
#  settiled         [WINDOW]           — force tile
#  fullscreen       0|1|2              — 0=real 1=maximize 2=fullscreen no-bar
#  fullscreenstate  INT INT            — set internal+client fullscreen state
#  fakefullscreen                      — fullscreen within window geometry
#  dpms             on|off|toggle [MON]— display power
#  pseudo                              — toggle pseudo-tiling
#  pin              [WINDOW]           — pin to all workspaces
#  movefocus        l|r|u|d            — move focus by direction
#  movewindow       l|r|u|d [,silent]  — move window by direction
#  swapwindow       l|r|u|d            — swap with neighbor
#  resizeactive     W H                — resize focused window by delta
#  resizewindowpixel W H, WINDOW       — resize specific window
#  moveactive       X Y                — move floating window
#  movewindowpixel  X Y, WINDOW        — move specific window
#  centerwindow     [0|1]              — center floating window
#  cyclenext        [prev]             — cycle focus forward/backward
#  focuswindow      WINDOW             — focus matching window
#  focusmonitor     MON|dir            — focus monitor
#  splitratio       N                  — adjust split ratio by N
#  movecursortocorner 0-3              — snap cursor to corner
#  movecursor       X Y                — move cursor to abs position
#  renameworkspace  N NAME             — rename workspace
#  renamewindow     ADDR NAME          — rename window
#  setprop          WINDOW PROP VAL    — set window property
#  togglegroup                         — create/toggle group
#  changegroupactive f|b               — switch active in group fwd/back
#  focusurgent                         — focus urgent window
#  togglespecialworkspace NAME         — show/hide special workspace
#  movetoworkspacesilent special:NAME  — send to special workspace silently
#  forcerendererreload                 — force GPU shader reload
#  sendshortcut MOD KEY WINDOW         — send keybind to window
#  global NAME                         — trigger global shortcut
#  hyprexpo:expo toggle                — hyprexpo overview (plugin)
#  submap NAME                         — activate submap
#  submap reset                        — exit active submap
#
# ══════════════════════════════════════════════════════════════════════════════
# §02  BIND BEHAVIOR SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

binds {

    # ── Mouse pass-through ────────────────────────────────────────────────────
    # When a mouse button is bound (bindm), should the click also pass
    # through to the underlying window?
    # false = bind intercepts click (window doesn't receive it)
    # true  = bind fires AND window receives the click
    pass_mouse_when_bound        = false

    # ── Scroll event debounce ─────────────────────────────────────────────────
    # Minimum milliseconds between scroll-triggered bind activations.
    # Prevents scroll wheels from firing binds multiple times per notch.
    # Higher = more control but less responsive for fast scrollers.
    # 300ms = good for workspace switching (prevents accidental double-skip)
    scroll_event_delay           = 300

    # ── Workspace back-and-forth ──────────────────────────────────────────────
    # Press the same workspace key twice → return to previous workspace.
    # Example: on WS2, press Super+2 → jumps to WS2 (no-op normally)
    # With this enabled: on WS2, press Super+2 → jumps to last WS
    workspace_back_and_forth     = true

    # ── Allow workspace cycling ───────────────────────────────────────────────
    # At WS10 → Super+Right → wraps to WS1 (and vice versa at WS1)
    # false = stops at boundary workspaces (no wrap-around)
    allow_workspace_cycles       = true

    # ── Workspace center-on behavior ──────────────────────────────────────────
    # When switching workspaces, which window gets initial focus?
    # 0 = the last-active window on that workspace (memory-based)
    # 1 = the window closest to the cursor position (spatial)
    workspace_center_on          = 1

    # ── Focus preferred method ────────────────────────────────────────────────
    # When using movefocus (directional focus navigation), how to choose
    # the target window when multiple candidates exist in the direction?
    # 0 = history-based (most recently focused in that direction)
    # 1 = geometric nearest (physically closest window center)
    focus_preferred_method       = 0

    # ── Group lock bypass ─────────────────────────────────────────────────────
    # Groups can be "locked" to prevent accidental window switching inside.
    # false = locked groups block all keybind navigation inside them
    # true  = keybinds work inside groups even when locked
    ignore_group_lock            = false

    # ── Fullscreen focus cycling ──────────────────────────────────────────────
    # When using movefocus/cyclenext, should fullscreen windows be included
    # in the focus cycle?
    # true  = yes, cycle through fullscreen windows normally
    # false = skip fullscreen windows in focus cycle
    movefocus_cycles_fullscreen  = true

    # ── Group-first focus movement ────────────────────────────────────────────
    # When focused window is part of a group:
    # true  = movefocus first cycles through group members, then exits group
    # false = movefocus immediately exits group to next window
    movefocus_cycles_groupfirst  = false

    # ── Exclusive input grab prevention ──────────────────────────────────────
    # Prevent layer shells (bars, launchers) from exclusively grabbing keyboard
    # false = allow exclusive input (normal behavior, rofi/wlogout grab keys)
    # true  = disable exclusive grab (keybinds always work, may break launchers)
    disable_keybind_grabbing     = false

    # ── Monitor fallback for directional focus ────────────────────────────────
    # When using movefocus and there's no window in that direction on the
    # current monitor, should focus jump to the adjacent monitor?
    # true  = yes, cross monitor boundaries with movefocus
    # false = stop at monitor edge (only switch monitors explicitly)
    window_direction_monitor_fallback = true
}

# ══════════════════════════════════════════════════════════════════════════════
# §03  GLOBAL BIND MODIFIER DEFINITIONS
#      These variables are defined in env.conf and used throughout keybinds/
# ══════════════════════════════════════════════════════════════════════════════

# $mainMod  = SUPER           — primary modifier (Windows/Meta key)
# $altMod   = ALT             — secondary modifier
# $shiftMod = SHIFT           — shift
# $ctrlMod  = CTRL            — control
# $hyperMod = SUPER SHIFT CTRL ALT  — hyper key combination

# ══════════════════════════════════════════════════════════════════════════════
# §04  BIND FLAG USAGE GUIDE
# ══════════════════════════════════════════════════════════════════════════════

# ── Standard bind (press and release) ─────────────────────────────────────────
# bind = $mainMod, Q, killactive

# ── Repeat while held (for resizing, volume, scrolling) ──────────────────────
# binde = $mainMod, Right, resizeactive, 20 0
# binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_SINK@ 2%+

# ── On key release (for one-shot behaviors) ───────────────────────────────────
# bindr = $mainMod, Super_L, exec, $launcher

# ── Works on lock screen (media keys, brightness) ────────────────────────────
# bindl  = , XF86AudioPlay, exec, playerctl play-pause
# bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+

# ── Mouse button bind ─────────────────────────────────────────────────────────
# bindm = $mainMod, mouse:272, movewindow
# bindm = $mainMod, mouse:273, resizewindow

