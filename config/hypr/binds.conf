# §07  BIND TIMING PRESETS
#      Applied dynamically by ASH mode engine
# ══════════════════════════════════════════════════════════════════════════════

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  GAME MODE: Fast scroll, no workspace cycling                           │
# └─────────────────────────────────────────────────────────────────────────┘
# binds {
#     scroll_event_delay           = 100   # Fast response
#     workspace_back_and_forth     = false # Prevent accidental ws jumps
#     allow_workspace_cycles       = false # No wrap-around in games
#     pass_mouse_when_bound        = true  # Pass clicks to game
# }

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  FOCUS MODE: Slower scroll, deliberate navigation                       │
# └─────────────────────────────────────────────────────────────────────────┘
# binds {
#     scroll_event_delay           = 500   # Slower, deliberate
#     workspace_back_and_forth     = true
#     focus_preferred_method       = 1     # Geometric — more predictable
# }

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  PRESENTATION MODE: No scroll binds, deliberate movement only           │
# └─────────────────────────────────────────────────────────────────────────┘
# binds {
#     scroll_event_delay           = 1000  # Very slow scroll
#     workspace_back_and_forth     = false
#     allow_workspace_cycles       = false
#     disable_keybind_grabbing     = true  # Allow app to catch all keys
# }

