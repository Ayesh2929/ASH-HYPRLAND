# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Snappy Animation Profile                         ║
# ║                                                                              ║
# ║  Razor-sharp, hyper-responsive animations that get out of your way.        ║
# ║  Instant feedback with micro-polish — you feel speed, not sluggishness.    ║
# ║  Optimized for keyboard-driven power users and productivity workflows.      ║
# ║                                                                              ║
# ║  Profile:    snappy                                                          ║
# ║  Speed tier: fast (2–4 steps)                                               ║
# ║  Character:  Instant · Decisive · Sharp · Responsive · Pro                  ║
# ║  GPU cost:   Very Low                                                        ║
# ║  Activate:   ash mode focus  OR  source this file                          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

animations {

    enabled                  = true
    first_launch_animation   = true

    # ══════════════════════════════════════════════════════════════════════════
    # §01  SNAPPY BEZIER CURVE LIBRARY
    #
    #  All curves tuned for maximum perceived responsiveness.
    #  Short duration + aggressive deceleration = instant feel
    #  with just enough polish to not look broken.
    # ══════════════════════════════════════════════════════════════════════════

    # ── Foundation ────────────────────────────────────────────────────────────
    bezier = linear,            0.000, 0.000, 1.000, 1.000

    # ── Snap core: near-instant deceleration ──────────────────────────────────
    #  Arrives at destination almost immediately, barely any tail
    bezier = snapCore,          0.050, 0.900, 0.100, 1.000

    # ── Snap hard: brutally fast, zero hesitation ─────────────────────────────
    bezier = snapHard,          0.020, 0.950, 0.050, 1.000

    # ── Snap pop: instant pop-in for window open ──────────────────────────────
    bezier = snapPop,           0.100, 1.050, 0.200, 1.000

    # ── Snap slide: fast workspace switch with minimal travel ─────────────────
    bezier = snapSlide,         0.150, 0.900, 0.100, 1.000

    # ── Snap fade: rapid opacity change ───────────────────────────────────────
    bezier = snapFade,          0.200, 0.000, 0.600, 1.000

    # ── Snap drop: instant scratchpad reveal ──────────────────────────────────
    bezier = snapDrop,          0.080, 1.020, 0.150, 1.000

    # ── Snap exit: decisive window close ─────────────────────────────────────
    bezier = snapExit,          0.050, 0.800, 0.100, 1.000

    # ── Snap micro: for border/shadow transitions ─────────────────────────────
    bezier = snapMicro,         0.100, 1.000, 0.100, 1.000

    # ── Snap spin: faster gradient rotation ───────────────────────────────────
    bezier = snapSpin,          0.500, 0.000, 0.500, 1.000

    # ══════════════════════════════════════════════════════════════════════════
    # §02  WINDOW ANIMATIONS — SNAPPY PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    animation = windows,            1, 3, snapCore

    # ── Window open — fast pop from 82% ──────────────────────────────────────
    #  82% = small scale range → barely noticeable pop, maximum speed
    #  Speed 3 = 3x faster than default
    animation = windowsIn,          1, 3, snapPop,            popin 82%

    # ── Window close — instant shrink ────────────────────────────────────────
    animation = windowsOut,         1, 2, snapExit,           popin 88%

    # ── Window move — snaps to position ──────────────────────────────────────
    animation = windowsMove,        1, 3, snapCore

    # ══════════════════════════════════════════════════════════════════════════
    # §03  FADE ANIMATIONS — SNAPPY PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    animation = fade,               1, 3, snapFade

    animation = fadeIn,             1, 3, snapFade
    animation = fadeOut,            1, 2, snapExit
    animation = fadeSwitch,         1, 3, snapFade
    animation = fadeShadow,         1, 3, snapFade
    animation = fadeDim,            1, 3, snapFade
    animation = fadeLayers,         1, 2, snapFade
    animation = fadeLayersIn,       1, 3, snapCore
    animation = fadeLayersOut,      1, 2, snapExit

    # ══════════════════════════════════════════════════════════════════════════
    # §04  BORDER — SNAPPY PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    # ── Instant border color change ───────────────────────────────────────────
    animation = border,             1, 4, snapMicro

    # ── Fast gradient rotation ────────────────────────────────────────────────
    #  Speed 50 ≈ 3s per full rotation — snappy and energetic
    animation = borderangle,        1, 50, linear,             loop

    # ══════════════════════════════════════════════════════════════════════════
    # §05  WORKSPACE — SNAPPY PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    animation = workspaces,         1, 3, snapSlide,           slidefade 10%

    # ── Minimal travel distance (10%) + fast curve ────────────────────────────
    #  Barely slides — just enough to show direction, then instantly at target
    animation = workspacesIn,       1, 3, snapSlide,           slidefade 10%
    animation = workspacesOut,      1, 2, snapExit,            slidefade 10%

    # ══════════════════════════════════════════════════════════════════════════
    # §06  SPECIAL WORKSPACE — SNAPPY PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    animation = specialWorkspace,       1, 3, snapDrop,        slidefadevert -20%

    # ── Instant drop — scratchpad appears with minimal travel ─────────────────
    animation = specialWorkspaceIn,     1, 3, snapDrop,        slidefadevert -20%
    animation = specialWorkspaceOut,    1, 2, snapExit,        slidefadevert -20%

    # ══════════════════════════════════════════════════════════════════════════
    # §07  LAYERS — SNAPPY PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    animation = layers,             1, 2, snapCore,            fade
    animation = layersIn,           1, 2, snapCore,            fade
    animation = layersOut,          1, 1, snapExit,            fade
}

# Profile: snappy | GPU: Very Low | Best for: power users, focus work, VMs