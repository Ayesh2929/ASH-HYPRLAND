# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Performance Animation Profile                    ║
# ║                                                                              ║
# ║  Surgically optimized animations that preserve just enough visual          ║
# ║  feedback to avoid disorientation while consuming near-zero GPU time.      ║
# ║  Every curve chosen to minimize frame time, every duration minimized.      ║
# ║  The performance-per-visual-quality ratio is maximized.                    ║
# ║                                                                              ║
# ║  Profile:    performance                                                     ║
# ║  Speed tier: ultra-fast (1–3 steps, selective disabling)                   ║
# ║  Character:  Efficient · Lightweight · Unobtrusive · Max FPS              ║
# ║  GPU cost:   Extremely Low                                                   ║
# ║  Activate:   ash mode battery  OR  ash mode game (light variant)           ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

animations {

    enabled                  = true
    first_launch_animation   = false   # Skip compositor intro

    # ══════════════════════════════════════════════════════════════════════════
    # §01  PERFORMANCE BEZIER LIBRARY
    #
    #  Designed for minimum GPU render time per animation frame.
    #  GPU cost factors:
    #   • Duration  — fewer frames = less GPU work
    #   • Style     — fade < slide < popin (GPU complexity)
    #   • Layers    — fewer simultaneous animations = lower peak load
    # ══════════════════════════════════════════════════════════════════════════

    bezier = linear,            0.000, 0.000, 1.000, 1.000

    # ── Perf core: fastest deceleration curve ─────────────────────────────────
    #  Near-linear, completes in minimum frames
    bezier = perfCore,          0.020, 0.980, 0.050, 1.000

    # ── Perf fade: minimum-cost opacity transition ────────────────────────────
    bezier = perfFade,          0.100, 0.000, 0.900, 1.000

    # ── Perf pop: minimal scale animation ─────────────────────────────────────
    bezier = perfPop,           0.050, 1.000, 0.100, 1.000

    # ── Perf slide: minimum workspace travel ──────────────────────────────────
    bezier = perfSlide,         0.100, 0.950, 0.100, 1.000

    # ══════════════════════════════════════════════════════════════════════════
    # §02  WINDOW — PERFORMANCE PROFILE
    #
    #  GPU OPTIMIZATION NOTES:
    #  popin uses scale transform → GPU scales texture (cheap)
    #  slidefade uses position + alpha → two channels but minimal overdraw
    #  Speed 2 = 2 frames per 60fps tick ≈ 33ms total duration
    # ══════════════════════════════════════════════════════════════════════════

    animation = windows,            1, 2, perfCore

    # ── Pop from 90% — barely visible, near-zero render time ─────────────────
    animation = windowsIn,          1, 2, perfPop,             popin 90%

    # ── Ultra-fast close ──────────────────────────────────────────────────────
    animation = windowsOut,         1, 1, perfCore,            popin 95%

    # ── Instant move snap ─────────────────────────────────────────────────────
    animation = windowsMove,        1, 2, perfCore

    # ══════════════════════════════════════════════════════════════════════════
    # §03  FADE — PERFORMANCE PROFILE
    #
    #  Fades are cheap (alpha only, no geometry) but still consume frames.
    #  Keep at speed 2-3 maximum.
    # ══════════════════════════════════════════════════════════════════════════

    animation = fade,               1, 2, perfFade
    animation = fadeIn,             1, 2, perfFade
    animation = fadeOut,            1, 1, perfFade
    animation = fadeSwitch,         1, 2, perfFade

    # ── Shadow disabled in performance mode ───────────────────────────────────
    #  shadows consume extra GPU compositing passes
    animation = fadeShadow,         1, 1, perfFade

    # ── Dim transition ────────────────────────────────────────────────────────
    animation = fadeDim,            1, 2, perfFade

    animation = fadeLayers,         1, 2, perfFade
    animation = fadeLayersIn,       1, 2, perfCore
    animation = fadeLayersOut,      1, 1, perfFade

    # ══════════════════════════════════════════════════════════════════════════
    # §04  BORDER — PERFORMANCE PROFILE
    #
    #  borderangle (animated gradient) continuously renders every frame.
    #  DISABLED in performance profile — single biggest GPU saver.
    # ══════════════════════════════════════════════════════════════════════════

    # ── Near-instant border focus change ─────────────────────────────────────
    animation = border,             1, 2, perfCore

    # ── Gradient rotation DISABLED — saves continuous GPU render cycle ─────────
    #  Enable = 0 disables borderangle entirely
    #  This alone can save 0.5-1ms per frame on some GPUs
    animation = borderangle,        0, 1, linear,              loop

    # ══════════════════════════════════════════════════════════════════════════
    # §05  WORKSPACE — PERFORMANCE PROFILE
    #
    #  slidefade uses both position and alpha — two channels.
    #  At speed 2 and 5% travel: total GPU work is near-negligible.
    # ══════════════════════════════════════════════════════════════════════════

    animation = workspaces,         1, 2, perfSlide,           slidefade 5%
    animation = workspacesIn,       1, 2, perfSlide,           slidefade 5%
    animation = workspacesOut,      1, 1, perfCore,            slidefade 5%

    # ══════════════════════════════════════════════════════════════════════════
    # §06  SPECIAL WORKSPACE — PERFORMANCE PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    # ── Fade-only (no slide) — cheapest possible special ws animation ──────────
    animation = specialWorkspace,       1, 2, perfFade,        fade
    animation = specialWorkspaceIn,     1, 2, perfFade,        fade
    animation = specialWorkspaceOut,    1, 1, perfFade,        fade

    # ══════════════════════════════════════════════════════════════════════════
    # §07  LAYERS — PERFORMANCE PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    animation = layers,             1, 1, perfFade,            fade
    animation = layersIn,           1, 2, perfCore,            fade
    animation = layersOut,          1, 1, perfFade,            fade
}

# ══════════════════════════════════════════════════════════════════════════════
# §08  COMPLEMENTARY PERFORMANCE SETTINGS
#      These should be applied alongside this animation profile
#      for maximum performance. Set via hyprctl or in decorations.conf
# ══════════════════════════════════════════════════════════════════════════════

# ── Apply alongside this profile for maximum effect ───────────────────────────
# decoration { blur { enabled = false } }          — save blur GPU passes
# decoration { shadow { enabled = false } }         — save shadow rendering
# decoration { dim_inactive = false }               — skip dim compositing
# misc { vfr = true }                               — variable frame rate
# misc { vrr = 0 }                                  — disable VRR overhead
# misc { render_unfocused_fps = 5 }                 — throttle background win
# opengl { nvidia_anti_flicker = false }            — skip NV sleep (non-NV)

# ── Activate full performance mode via ASH ────────────────────────────────────
# ash mode game    → applies this profile + disables blur + shadow + decoration
# ash mode battery → applies this profile + power-saver power profile

# Profile: performance | GPU: Extremely Low | Best for: gaming, battery, CI