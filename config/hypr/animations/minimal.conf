# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Minimal Animation Profile                        ║
# ║                                                                              ║
# ║  The essence of animation — only what's necessary to prevent jarring        ║
# ║  jumps, nothing that costs attention or GPU cycles. Every transition        ║
# ║  completes before you notice it started. Zero visual noise.                 ║
# ║                                                                              ║
# ║  Profile:    minimal                                                         ║
# ║  Speed tier: ultra-fast (1–2 steps)                                         ║
# ║  Character:  Invisible · Efficient · Clean · Zen · Distraction-free        ║
# ║  GPU cost:   Minimal                                                         ║
# ║  Activate:   ash mode focus  OR  ash mode work (minimal variant)           ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

animations {

    enabled                  = true
    first_launch_animation   = false   # Skip intro animation entirely

    # ══════════════════════════════════════════════════════════════════════════
    # §01  MINIMAL BEZIER CURVE LIBRARY
    #
    #  Flat, near-instant curves. Animation happens, just too fast to register
    #  as animation. Prevents visual discontinuity without any perceptible cost.
    # ══════════════════════════════════════════════════════════════════════════

    bezier = linear,            0.000, 0.000, 1.000, 1.000

    # ── Minimal instant: virtually immediate transition ───────────────────────
    bezier = minInstant,        0.010, 0.990, 0.010, 1.000

    # ── Minimal fade: ultra-short opacity fade ────────────────────────────────
    bezier = minFade,           0.100, 0.000, 0.900, 1.000

    # ── Minimal slide: near-zero workspace transition ─────────────────────────
    bezier = minSlide,          0.050, 0.990, 0.050, 1.000

    # ══════════════════════════════════════════════════════════════════════════
    # §02  WINDOW — MINIMAL PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    animation = windows,            1, 2, minInstant
    animation = windowsIn,          1, 2, minInstant,           popin 92%
    animation = windowsOut,         1, 1, minInstant,           popin 95%
    animation = windowsMove,        1, 2, minInstant

    # ══════════════════════════════════════════════════════════════════════════
    # §03  FADE — MINIMAL PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    animation = fade,               1, 2, minFade
    animation = fadeIn,             1, 2, minFade
    animation = fadeOut,            1, 1, minFade
    animation = fadeSwitch,         1, 2, minFade
    animation = fadeShadow,         1, 2, minFade
    animation = fadeDim,            1, 2, minFade
    animation = fadeLayers,         1, 2, minFade
    animation = fadeLayersIn,       1, 2, minInstant
    animation = fadeLayersOut,      1, 1, minInstant

    # ══════════════════════════════════════════════════════════════════════════
    # §04  BORDER — MINIMAL PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    # ── Near-instant border change ────────────────────────────────────────────
    animation = border,             1, 2, minInstant

    # ── No animated gradient — static color only ──────────────────────────────
    #  Disabled borderangle = no continuous GPU rendering for gradient spin
    animation = borderangle,        0, 1, linear,               loop

    # ══════════════════════════════════════════════════════════════════════════
    # §05  WORKSPACE — MINIMAL PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    animation = workspaces,         1, 2, minSlide,             slidefade 5%
    animation = workspacesIn,       1, 2, minSlide,             slidefade 5%
    animation = workspacesOut,      1, 1, minInstant,           slidefade 5%

    # ══════════════════════════════════════════════════════════════════════════
    # §06  SPECIAL WORKSPACE — MINIMAL PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    animation = specialWorkspace,       1, 2, minInstant,       fade
    animation = specialWorkspaceIn,     1, 2, minInstant,       fade
    animation = specialWorkspaceOut,    1, 1, minInstant,       fade

    # ══════════════════════════════════════════════════════════════════════════
    # §07  LAYERS — MINIMAL PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    animation = layers,             1, 1, minInstant,           fade
    animation = layersIn,           1, 1, minInstant,           fade
    animation = layersOut,          1, 1, minInstant,           fade
}

# Profile: minimal | GPU: Minimal | Best for: focus work, low-end hardware, Zen