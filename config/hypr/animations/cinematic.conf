# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Cinematic Animation Profile                      ║
# ║                                                                              ║
# ║  Hollywood-grade motion design. Every transition is a micro-film.          ║
# ║  Slow, majestic, deeply satisfying animations with film-grade easing,      ║
# ║  dramatic workspace reveals, sweeping window entries and long graceful      ║
# ║  exits. Perfect for demos, screenshots, recording and showcasing.           ║
# ║                                                                              ║
# ║  Profile:    cinematic                                                       ║
# ║  Speed tier: slow (7–12 steps)                                              ║
# ║  Character:  Majestic · Dramatic · Luxurious · Film-grade · Awe-inspiring  ║
# ║  GPU cost:   Medium-High                                                     ║
# ║  Activate:   ash mode cinema  OR  ash mode present                         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

animations {

    enabled                  = true
    first_launch_animation   = true

    # ══════════════════════════════════════════════════════════════════════════
    # §01  CINEMATIC BEZIER CURVE LIBRARY
    #
    #  Inspired by professional motion design and film VFX easing.
    #  Long, deliberate curves that feel intentional and weighty.
    #
    #  Reference easing styles:
    #   easeInExpo  → fast out, very slow approach
    #   easeOutExpo → instant start, very long tail
    #   film ease   → imperceptibly slow start, smooth plateau, perfect stop
    # ══════════════════════════════════════════════════════════════════════════

    # ── Foundation ────────────────────────────────────────────────────────────
    bezier = linear,            0.000, 0.000, 1.000, 1.000

    # ── Cinema core: the "great reveal" curve ─────────────────────────────────
    #  Ultra-slow start → building momentum → perfect deceleration
    #  Like a camera dolly moving on a precision track
    bezier = cinemaCore,        0.000, 0.850, 0.100, 1.000

    # ── Cinema dramatic: maximum build-up ─────────────────────────────────────
    #  Barely moves at first → explosive acceleration → graceful stop
    #  Like a bow being drawn then releasing an arrow
    bezier = cinemaDrama,       0.000, 0.700, 0.050, 1.000

    # ── Cinema sweep: lateral motion for workspace transitions ────────────────
    #  Content sweeps across screen like a panoramic camera move
    bezier = cinemaSweep,       0.000, 0.900, 0.050, 1.050

    # ── Cinema reveal: window appearing like a stage curtain ──────────────────
    bezier = cinemaReveal,      0.000, 0.800, 0.150, 1.000

    # ── Cinema close: dignified, unhurried exit ───────────────────────────────
    bezier = cinemaClose,       0.000, 0.600, 0.150, 1.000

    # ── Cinema fade: film dissolve effect ─────────────────────────────────────
    #  Like a film cross-dissolve — smooth, intentional opacity shift
    bezier = cinemaFade,        0.250, 0.000, 0.450, 1.000

    # ── Cinema drop: scratchpad falls like a stage backdrop ───────────────────
    bezier = cinemaDrop,        0.000, 1.100, 0.100, 1.000

    # ── Cinema border: majestic slow gradient ─────────────────────────────────
    bezier = cinemaSpin,        0.500, 0.000, 0.500, 1.000

    # ── Cinema micro: subtle detail animations ────────────────────────────────
    bezier = cinemaMicro,       0.200, 1.000, 0.200, 1.000

    # ══════════════════════════════════════════════════════════════════════════
    # §02  WINDOW ANIMATIONS — CINEMATIC PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    animation = windows,            1, 10, cinemaCore

    # ── Window open — slow majestic reveal from 55% ───────────────────────────
    #  55% = large scale range → dramatic pop-in
    #  Speed 10 = very slow, deliberate
    #  cinemaReveal = gradual build then satisfying arrival
    animation = windowsIn,          1, 10, cinemaReveal,        popin 55%

    # ── Window close — long dignified fade-out ────────────────────────────────
    animation = windowsOut,         1, 8, cinemaClose,          popin 70%

    # ── Window move — floats gracefully to new home ───────────────────────────
    animation = windowsMove,        1, 9, cinemaCore

    # ══════════════════════════════════════════════════════════════════════════
    # §03  FADE ANIMATIONS — CINEMATIC PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    animation = fade,               1, 10, cinemaFade

    # ── Film dissolve window appear ───────────────────────────────────────────
    animation = fadeIn,             1, 10, cinemaFade

    # ── Dignified fade-out ────────────────────────────────────────────────────
    animation = fadeOut,            1, 8, cinemaClose

    # ── Slow focus switch ─────────────────────────────────────────────────────
    animation = fadeSwitch,         1, 8, cinemaFade

    # ── Shadow: deep deliberate change ────────────────────────────────────────
    animation = fadeShadow,         1, 10, cinemaFade

    # ── Dim: slow onset, like theatre lights fading ───────────────────────────
    animation = fadeDim,            1, 12, cinemaFade

    # ── Layer fade parent ─────────────────────────────────────────────────────
    animation = fadeLayers,         1, 8, cinemaFade

    # ── Bar/panel appearing — a stage curtain rising ──────────────────────────
    animation = fadeLayersIn,       1, 9, cinemaCore

    # ── Bar/panel disappearing ────────────────────────────────────────────────
    animation = fadeLayersOut,      1, 7, cinemaClose

    # ══════════════════════════════════════════════════════════════════════════
    # §04  BORDER — CINEMATIC PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    # ── Long deliberate border color transition ───────────────────────────────
    animation = border,             1, 14, cinemaMicro

    # ── Ultra-slow gradient rotation — hypnotic and serene ───────────────────
    #  Speed 140 ≈ 8s per full rotation — mesmerizing
    animation = borderangle,        1, 140, linear,             loop

    # ══════════════════════════════════════════════════════════════════════════
    # §05  WORKSPACE — CINEMATIC PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    animation = workspaces,         1, 9, cinemaSweep,          slidefade 35%

    # ── Panoramic workspace sweep — cinematic camera move ────────────────────
    #  35% travel = content visibly sweeps across screen
    #  cinemaSweep = slight overshoot gives landing weight
    animation = workspacesIn,       1, 9, cinemaSweep,          slidefade 35%
    animation = workspacesOut,      1, 8, cinemaClose,          slidefade 35%

    # ══════════════════════════════════════════════════════════════════════════
    # §06  SPECIAL WORKSPACE — CINEMATIC PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    animation = specialWorkspace,       1, 9, cinemaDrop,       slidefadevert -50%

    # ── Dramatic backdrop drop from 50% above screen center ──────────────────
    animation = specialWorkspaceIn,     1, 9, cinemaDrop,       slidefadevert -50%
    animation = specialWorkspaceOut,    1, 8, cinemaClose,      slidefadevert -50%

    # ══════════════════════════════════════════════════════════════════════════
    # §07  LAYERS — CINEMATIC PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    animation = layers,             1, 6, cinemaCore,           fade
    animation = layersIn,           1, 7, cinemaCore,           fade
    animation = layersOut,          1, 6, cinemaClose,          fade
}

# Profile: cinematic | GPU: Medium-High | Best for: demos, streaming, showcase