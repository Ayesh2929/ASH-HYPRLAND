# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — No Animation Profile                             ║
# ║                                                                              ║
# ║  Complete animation system shutdown. Zero visual transitions anywhere.     ║
# ║  Maximum compositor responsiveness, accessibility compliance for           ║
# ║  motion sensitivity, lowest possible GPU overhead.                          ║
# ║                                                                              ║
# ║  Profile:    none                                                            ║
# ║  Speed tier: disabled                                                        ║
# ║  Character:  Instant · Static · Accessible · Maximum performance           ║
# ║  GPU cost:   Zero animation overhead                                         ║
# ║  Activate:   ash mode game (auto) OR ash config set animations none        ║
# ║                                                                              ║
# ║  Use cases:                                                                  ║
# ║  • Vestibular disorder / motion sensitivity (accessibility)                 ║
# ║  • Maximum gaming performance (zero compositor animation overhead)          ║
# ║  • Remote desktop / VNC (animations waste bandwidth)                        ║
# ║  • Extremely low-end hardware (saves GPU entirely)                          ║
# ║  • Screen readers and assistive technology compatibility                    ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

animations {

    # ══════════════════════════════════════════════════════════════════════════
    # §01  MASTER DISABLE
    #      Single line disables ALL animation system processing.
    #      Hyprland skips the animation pipeline entirely.
    # ══════════════════════════════════════════════════════════════════════════

    enabled                  = false

    # When enabled = false, ALL animation = lines below are ignored.
    # They are documented here for clarity and as fallback values
    # in case enabled is toggled on dynamically via hyprctl.

    # ══════════════════════════════════════════════════════════════════════════
    # §02  FALLBACK CURVES (active only if enabled = true override)
    #      These fire only if someone enables animations externally:
    #      hyprctl keyword animations:enabled true
    # ══════════════════════════════════════════════════════════════════════════

    bezier = linear,            0.000, 0.000, 1.000, 1.000
    bezier = noneInstant,       0.000, 1.000, 0.000, 1.000

    # ── If somehow enabled, use ultra-fast 1-step animations ──────────────────
    animation = windows,            1, 1, noneInstant
    animation = windowsIn,          1, 1, noneInstant,         popin 100%
    animation = windowsOut,         1, 1, noneInstant,         popin 100%
    animation = windowsMove,        1, 1, noneInstant
    animation = fade,               1, 1, noneInstant
    animation = fadeIn,             1, 1, noneInstant
    animation = fadeOut,            1, 1, noneInstant
    animation = fadeSwitch,         1, 1, noneInstant
    animation = fadeShadow,         1, 1, noneInstant
    animation = fadeDim,            1, 1, noneInstant
    animation = fadeLayers,         1, 1, noneInstant
    animation = fadeLayersIn,       1, 1, noneInstant
    animation = fadeLayersOut,      1, 1, noneInstant
    animation = border,             1, 1, noneInstant
    animation = borderangle,        0, 1, linear,              loop
    animation = workspaces,         1, 1, noneInstant,         fade
    animation = workspacesIn,       1, 1, noneInstant,         fade
    animation = workspacesOut,      1, 1, noneInstant,         fade
    animation = specialWorkspace,   1, 1, noneInstant,         fade
    animation = specialWorkspaceIn, 1, 1, noneInstant,         fade
    animation = specialWorkspaceOut,1, 1, noneInstant,         fade
    animation = layers,             1, 1, noneInstant,         fade
    animation = layersIn,           1, 1, noneInstant,         fade
    animation = layersOut,          1, 1, noneInstant,         fade
}

# ══════════════════════════════════════════════════════════════════════════════
# §03  ACCESSIBILITY NOTES
# ══════════════════════════════════════════════════════════════════════════════

# ── Prefers-reduced-motion compliance ────────────────────────────────────────
# This profile fulfills the CSS prefers-reduced-motion: reduce media query
# equivalent for the desktop environment.
#
# To auto-apply based on system accessibility settings:
# exec-once = gsettings get org.gnome.desktop.interface enable-animations \
#   | grep -q false && hyprctl keyword animations:enabled false
#
# ── Gaming performance notes ──────────────────────────────────────────────────
# With animations disabled, the compositor skips the animation tick entirely.
# This frees ~0.5-2ms of compositor time per frame — measurable in frame
# pacing for competitive gaming scenarios.
#
# ── Toggle animation on/off dynamically ──────────────────────────────────────
# Turn on:  hyprctl keyword animations:enabled true
# Turn off: hyprctl keyword animations:enabled false
# Via ASH:  ash config set animations.enabled false

# Profile: none | GPU: Zero | Best for: accessibility, gaming, remote desktop