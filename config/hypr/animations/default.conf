# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Default Animation Profile                        ║
# ║                                                                              ║
# ║  The balanced reference animation set — buttery smooth at 60fps,           ║
# ║  natural deceleration curves, cinematic workspace transitions,              ║
# ║  spring-based window open/close and subtle layer fade polish               ║
# ║                                                                              ║
# ║  Profile:    default                                                         ║
# ║  Speed tier: medium (4–6 steps)                                             ║
# ║  Character:  Natural · Fluid · Professional                                 ║
# ║  GPU cost:   Low-Medium                                                      ║
# ║  Activate:   ash mode default  OR  source this file                        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

animations {

    # ══════════════════════════════════════════════════════════════════════════
    # §01  MASTER TOGGLE
    # ══════════════════════════════════════════════════════════════════════════

    enabled                  = true
    first_launch_animation   = true

    # ══════════════════════════════════════════════════════════════════════════
    # §02  BEZIER CURVE LIBRARY — DEFAULT PROFILE
    #
    #  Bezier format: bezier = NAME, x0, y0, x1, y1
    #  Control points for cubic-bezier(x0,y0,x1,y1)
    #  P0 = (0,0) — always  │  P3 = (1,1) — always
    #  P1 = (x0,y0)         │  P2 = (x1,y1)
    #
    #  Visualizer: https://cubic-bezier.com/
    #              https://easings.net/
    # ══════════════════════════════════════════════════════════════════════════

    # ── Neutral / mathematical ────────────────────────────────────────────────
    bezier = linear,            0.000, 0.000, 1.000, 1.000
    bezier = ease,              0.250, 0.100, 0.250, 1.000
    bezier = easeIn,            0.420, 0.000, 1.000, 1.000
    bezier = easeOut,           0.000, 0.000, 0.580, 1.000
    bezier = easeInOut,         0.420, 0.000, 0.580, 1.000

    # ── ASH Default signature curves ─────────────────────────────────────────
    #
    #  ashDefault    — core curve: slow start → fast middle → soft land
    #                  The main curve used for 80% of animations
    bezier = ashDefault,        0.160, 1.000, 0.300, 1.000

    #  ashDecel      — pure deceleration: fast start → gradual stop
    #                  Used for: window close, fade out
    bezier = ashDecel,          0.000, 0.900, 0.200, 1.000

    #  ashAccel      — pure acceleration: slow start → fast end
    #                  Used for: window enter (pop in)
    bezier = ashAccel,          0.400, 0.000, 0.800, 0.200

    #  ashSlide      — workspace slide: momentum + soft deceleration
    bezier = ashSlide,          0.260, 1.000, 0.200, 1.000

    #  ashFade       — pure opacity transitions
    bezier = ashFade,           0.350, 0.000, 0.550, 1.000

    #  ashSnap       — quick decisive settle
    bezier = ashSnap,           0.080, 0.820, 0.170, 1.000

    #  ashFloat      — slow graceful float (panels, overlays)
    bezier = ashFloat,          0.230, 1.000, 0.320, 1.000

    #  ashMicro      — ultra-short snappy (1-2 step animations)
    bezier = ashMicro,          0.100, 1.000, 0.100, 1.000

    #  ashBorder     — smooth gradient rotation (used for border angle)
    bezier = ashBorderSpin,     0.500, 0.000, 0.500, 1.000

    # ══════════════════════════════════════════════════════════════════════════
    # §03  WINDOW OPEN / CLOSE / MOVE
    # ══════════════════════════════════════════════════════════════════════════

    # ── Windows: parent category (inherits to In/Out/Move if not overridden) ──
    animation = windows,            1, 5, ashDefault

    # ── Window open — pop in from 72% with smooth acceleration ───────────────
    #  Feel: window appears with light pop, settles naturally
    animation = windowsIn,          1, 5, ashDefault,         popin 72%

    # ── Window close — quick shrink to 80%, fast exit ────────────────────────
    #  Feel: decisive close, doesn't linger
    animation = windowsOut,         1, 4, ashDecel,           popin 80%

    # ── Window move / resize — smooth follow cursor ───────────────────────────
    #  Feel: window follows without lag, settles at target
    animation = windowsMove,        1, 4, ashDefault

    # ══════════════════════════════════════════════════════════════════════════
    # §04  FADE TRANSITIONS
    # ══════════════════════════════════════════════════════════════════════════

    # ── Fade: parent (inherits to all fade* if not overridden) ───────────────
    animation = fade,               1, 5, ashFade

    # ── Window appearing opacity ──────────────────────────────────────────────
    animation = fadeIn,             1, 5, ashFade

    # ── Window disappearing opacity ───────────────────────────────────────────
    animation = fadeOut,            1, 4, ashSnap

    # ── Focus switch dim (active→inactive dimming) ────────────────────────────
    animation = fadeSwitch,         1, 4, ashFade

    # ── Shadow fade on focus change ───────────────────────────────────────────
    animation = fadeShadow,         1, 5, ashFade

    # ── Inactive window dim strength change ───────────────────────────────────
    animation = fadeDim,            1, 6, ashFade

    # ── Layer surface fade (bars, notifications) ──────────────────────────────
    animation = fadeLayers,         1, 4, ashFade

    # ── Layer appearing ────────────────────────────────────────────────────────
    animation = fadeLayersIn,       1, 5, ashFloat

    # ── Layer disappearing ─────────────────────────────────────────────────────
    animation = fadeLayersOut,      1, 3, ashSnap

    # ══════════════════════════════════════════════════════════════════════════
    # §05  BORDER ANIMATION
    # ══════════════════════════════════════════════════════════════════════════

    # ── Border color transition on focus change ───────────────────────────────
    animation = border,             1, 8, ashDefault

    # ── Animated gradient border — continuous rotation ────────────────────────
    #  Speed 80 ≈ 4.5s per full 360° rotation at 60fps
    #  Lower number = faster rotation
    animation = borderangle,        1, 80, linear,             loop

    # ══════════════════════════════════════════════════════════════════════════
    # §06  WORKSPACE TRANSITIONS
    # ══════════════════════════════════════════════════════════════════════════

    # ── Workspace: parent category ────────────────────────────────────────────
    animation = workspaces,         1, 5, ashSlide,            slidefade 20%

    # ── Entering workspace ─────────────────────────────────────────────────────
    #  Style: slidefade — slides from edge while fading in
    #  20% = 20% of monitor width as travel distance
    animation = workspacesIn,       1, 5, ashSlide,            slidefade 20%

    # ── Leaving workspace ──────────────────────────────────────────────────────
    animation = workspacesOut,      1, 4, ashSnap,             slidefade 20%

    # ══════════════════════════════════════════════════════════════════════════
    # §07  SPECIAL WORKSPACE (SCRATCHPAD)
    # ══════════════════════════════════════════════════════════════════════════

    # ── Special workspace: parent ─────────────────────────────────────────────
    animation = specialWorkspace,       1, 5, ashFloat,        slidefadevert -30%

    # ── Special workspace appearing (drops from above) ────────────────────────
    #  -30% = slides down from 30% above screen center
    animation = specialWorkspaceIn,     1, 5, ashFloat,        slidefadevert -30%

    # ── Special workspace disappearing (rises back up) ────────────────────────
    animation = specialWorkspaceOut,    1, 4, ashSnap,         slidefadevert -30%

    # ══════════════════════════════════════════════════════════════════════════
    # §08  LAYER SURFACES
    #      Bars, notifications, launchers, lock screens, overlays
    # ══════════════════════════════════════════════════════════════════════════

    # ── Layers: parent ────────────────────────────────────────────────────────
    animation = layers,             1, 3, ashSnap,             fade

    # ── Layer appearing (e.g. bar on Hyprland start) ──────────────────────────
    animation = layersIn,           1, 3, ashFloat,            fade

    # ── Layer disappearing (e.g. bar when hidden) ─────────────────────────────
    animation = layersOut,          1, 2, ashSnap,             fade
}

# ══════════════════════════════════════════════════════════════════════════════
