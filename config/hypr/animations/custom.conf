# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Custom Animation Profile                         ║
# ║                                                                              ║
# ║  Your personal animation sandbox. Mix curves from any built-in profile,   ║
# ║  craft entirely new bezier curves, build hybrid speed tiers and define    ║
# ║  per-animation-type overrides. This file survives all ASH updates.        ║
# ║                                                                              ║
# ║  Profile:    custom                                                          ║
# ║  Speed tier: user-defined                                                   ║
# ║  Activate:   ash config set animations custom  OR  source this file        ║
# ║  Edit:       ash config edit animations-custom                             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

animations {

    # ══════════════════════════════════════════════════════════════════════════
    # §01  QUICK-START — CHOOSE YOUR BASE STYLE
    #      Uncomment ONE base section below as your starting point,
    #      then override individual animations in §04 onwards.
    # ══════════════════════════════════════════════════════════════════════════

    enabled                  = true
    first_launch_animation   = true

    # ══════════════════════════════════════════════════════════════════════════
    # §02  BEZIER CURVE REFERENCE LIBRARY
    #
    #  ── Built-in ASH curves (always available) ───────────────────────────────
    #
    #  From default.conf:
    #    ashDefault  ashDecel  ashAccel  ashSlide  ashFade
    #    ashSnap     ashFloat  ashMicro  ashBorderSpin
    #
    #  From smooth.conf:
    #    smoothCore  smoothIn  smoothOut  smoothSlide  smoothFloat
    #    smoothExit  smoothFade  smoothDrop  smoothPop
    #
    #  From bouncy.conf:
    #    springLight  springMed  springStrong  springElastic
    #    springSlide  springPop  springDrop  springClose
    #    springFade   springJiggle  springMicro
    #
    #  From snappy.conf:
    #    snapCore  snapHard  snapPop  snapSlide  snapFade
    #    snapDrop  snapExit  snapMicro
    #
    #  From cinematic.conf:
    #    cinemaCore  cinemaDrama  cinemaSweep  cinemaReveal
    #    cinemaClose  cinemaFade  cinemaDrop  cinemaMicro
    #
    #  From performance.conf:
    #    perfCore  perfFade  perfPop  perfSlide
    #
    #  ── Define your own custom curves below ────────────────────────────────
    #
    #  Format: bezier = NAME, x0, y0, x1, y1
    #  Tool:   https://cubic-bezier.com/#x0,y0,x1,y1
    #  Tool:   https://easings.net/
    # ══════════════════════════════════════════════════════════════════════════

    # ── linear (always defined — do not remove) ───────────────────────────────
    bezier = linear,            0.000, 0.000, 1.000, 1.000

    # ── EXAMPLE CUSTOM CURVES — uncomment and rename as desired ───────────────

    # Material Design 3 standard easing:
    # bezier = materialStandard,  0.200, 0.000, 0.000, 1.000

    # Material Design 3 emphasized easing:
    # bezier = materialEmphasized, 0.050, 0.700, 0.100, 1.000

    # Apple iOS spring approximation:
    # bezier = iosSpring,         0.360, 1.560, 0.640, 1.000

    # Windows 11 fluent easing:
    # bezier = fluentEase,        0.130, 0.000, 0.000, 1.000

    # Pure ease-in-expo (dramatic build):
    # bezier = expoIn,            0.950, 0.050, 0.795, 0.035

    # Pure ease-out-expo (explosive start):
    # bezier = expoOut,           0.190, 1.000, 0.220, 1.000

    # Gentle ease-in-out-sine:
    # bezier = sineInOut,         0.370, 0.000, 0.630, 1.000

    # Back easing (overshoots then returns):
    # bezier = backEase,          0.680, -0.600, 0.320, 1.600

    # Aggressive snap:
    # bezier = mySnap,            0.030, 0.970, 0.030, 1.000

    # ══════════════════════════════════════════════════════════════════════════
    # §03  HYBRID SPEED TIER BUILDER
    #
    #  You can mix speeds freely per animation type:
    #
    #  Speed reference (at 60fps):
    #    1  step  ≈  16ms  (single frame — barely visible)
    #    2  steps ≈  33ms  (ultra-fast)
    #    3  steps ≈  50ms  (very fast — snappy feel)
    #    4  steps ≈  66ms  (fast — responsive)
    #    5  steps ≈  83ms  (medium-fast — default range)
    #    6  steps ≈  100ms (medium — smooth feel)
    #    7  steps ≈  116ms (medium-slow)
    #    8  steps ≈  133ms (slow — premium feel)
    #    10 steps ≈  166ms (very slow — cinematic)
    #    12 steps ≈  200ms (ultra-slow — majestic)
    # ══════════════════════════════════════════════════════════════════════════

    # ══════════════════════════════════════════════════════════════════════════
    # §04  WINDOW ANIMATIONS — YOUR CUSTOM VALUES
    #      Uncomment and modify the lines you want to customize.
    #      Lines left commented use values from the base profile.
    # ══════════════════════════════════════════════════════════════════════════

    # ── Parent (fallback for windowsIn/Out/Move if not specified) ────────────
    # animation = windows,            1, 5, ashDefault

    # ── Window open ───────────────────────────────────────────────────────────
    #  Style options: popin N% | slidefade N% | fade | slide
    #  popin 65% → scale from 65% to 100%
    #  popin 95% → barely visible scale (subtle)
    # animation = windowsIn,          1, 5, ashDefault,         popin 72%

    # ── Window close ──────────────────────────────────────────────────────────
    # animation = windowsOut,         1, 4, ashDecel,           popin 80%

    # ── Window move and resize ────────────────────────────────────────────────
    # animation = windowsMove,        1, 4, ashDefault

    # ══════════════════════════════════════════════════════════════════════════
    # §05  FADE ANIMATIONS — YOUR CUSTOM VALUES
    # ══════════════════════════════════════════════════════════════════════════

    # animation = fade,               1, 5, ashFade
    # animation = fadeIn,             1, 5, ashFade
    # animation = fadeOut,            1, 4, ashSnap
    # animation = fadeSwitch,         1, 4, ashFade
    # animation = fadeShadow,         1, 5, ashFade
    # animation = fadeDim,            1, 6, ashFade
    # animation = fadeLayers,         1, 4, ashFade
    # animation = fadeLayersIn,       1, 5, ashFloat
    # animation = fadeLayersOut,      1, 3, ashSnap

    # ══════════════════════════════════════════════════════════════════════════
    # §06  BORDER ANIMATIONS — YOUR CUSTOM VALUES
    # ══════════════════════════════════════════════════════════════════════════

    # ── Focus change border transition ────────────────────────────────────────
    # animation = border,             1, 8, ashDefault

    # ── Gradient border rotation ──────────────────────────────────────────────
    #  Speed N → lower = faster spin
    #  loop   → continuous rotation (remove for ping-pong)
    #  Set first param to 0 to disable entirely
    # animation = borderangle,        1, 80, linear,            loop

    # ══════════════════════════════════════════════════════════════════════════
    # §07  WORKSPACE ANIMATIONS — YOUR CUSTOM VALUES
    # ══════════════════════════════════════════════════════════════════════════

    #  Style options:
    #    slidefade N%     — slide + fade combined (N% = travel distance)
    #    slidefadevert N% — vertical slide + fade
    #    slide            — pure slide
    #    fade             — pure fade (no movement)
    #
    # animation = workspaces,         1, 5, ashSlide,           slidefade 20%
    # animation = workspacesIn,       1, 5, ashSlide,           slidefade 20%
    # animation = workspacesOut,      1, 4, ashSnap,            slidefade 20%

    # ══════════════════════════════════════════════════════════════════════════
    # §08  SPECIAL WORKSPACE — YOUR CUSTOM VALUES
    # ══════════════════════════════════════════════════════════════════════════

    #  Positive % → slides from below  (e.g. +30% = drops from 30% below)
    #  Negative % → slides from above  (e.g. -30% = drops from 30% above)
    #
    # animation = specialWorkspace,       1, 5, ashFloat,       slidefadevert -30%
    # animation = specialWorkspaceIn,     1, 5, ashFloat,       slidefadevert -30%
    # animation = specialWorkspaceOut,    1, 4, ashSnap,        slidefadevert -30%

    # ══════════════════════════════════════════════════════════════════════════
    # §09  LAYER ANIMATIONS — YOUR CUSTOM VALUES
    # ══════════════════════════════════════════════════════════════════════════

    # animation = layers,             1, 3, ashSnap,            fade
    # animation = layersIn,           1, 3, ashFloat,           fade
    # animation = layersOut,          1, 2, ashSnap,            fade
}

# ══════════════════════════════════════════════════════════════════════════════
# §10  PROFILE SWITCHING CHEATSHEET
# ══════════════════════════════════════════════════════════════════════════════

# ── Load a built-in profile instantly (via hyprctl) ───────────────────────────
# hyprctl keyword source ~/.config/hypr/animations/smooth.conf
# hyprctl keyword source ~/.config/hypr/animations/bouncy.conf
# hyprctl keyword source ~/.config/hypr/animations/snappy.conf
# hyprctl keyword source ~/.config/hypr/animations/cinematic.conf
# hyprctl keyword source ~/.config/hypr/animations/minimal.conf
# hyprctl keyword source ~/.config/hypr/animations/performance.conf
# hyprctl keyword source ~/.config/hypr/animations/none.conf

# ── Via ASH commands ──────────────────────────────────────────────────────────
# ash config set animations.profile smooth
# ash config set animations.profile bouncy
# ash config set animations.profile snappy
# ash config set animations.profile cinematic
# ash config set animations.profile minimal
# ash config set animations.profile performance
# ash config set animations.profile none
# ash config set animations.profile custom

# ── Toggle animations on/off without changing profile ─────────────────────────
# hyprctl keyword animations:enabled false   → disable
# hyprctl keyword animations:enabled true    → enable
# ash config toggle animations               → toggle

# ══════════════════════════════════════════════════════════════════════════════
# §11  BEZIER CURVE COOKBOOK
#      Copy-paste recipes for common animation personalities
# ══════════════════════════════════════════════════════════════════════════════

# ── "macOS-like" (Apple spring approximation) ────────────────────────────────
# bezier = macSpring,         0.360, 1.300, 0.640, 1.000
# animation = windowsIn,      1, 6, macSpring, popin 70%
# animation = workspaces,     1, 5, macSpring, slidefade 20%

# ── "Material 3" (Google's standard easing) ──────────────────────────────────
# bezier = m3Standard,        0.200, 0.000, 0.000, 1.000
# bezier = m3Emphasized,      0.050, 0.700, 0.100, 1.000
# animation = windowsIn,      1, 5, m3Emphasized, popin 75%
# animation = workspaces,     1, 6, m3Standard, slidefade 18%

# ── "Fluent Design" (Windows 11) ─────────────────────────────────────────────
# bezier = fluent,            0.130, 0.000, 0.000, 1.000
# animation = windowsIn,      1, 4, fluent, popin 80%
# animation = workspaces,     1, 4, fluent, slidefade 15%

# ── "Jelly" (exaggerated elastic) ────────────────────────────────────────────
# bezier = jelly,             0.500, 1.800, 0.500, 0.700
# animation = windowsIn,      1, 7, jelly, popin 55%
# animation = windowsMove,    1, 6, jelly

# ── "GNOME-like" (GNOME Shell inspired) ──────────────────────────────────────
# bezier = gnome,             0.250, 1.000, 0.250, 1.000
# animation = windowsIn,      1, 5, gnome, popin 75%
# animation = workspaces,     1, 4, gnome, slidefade 10%

# ── "KDE Plasma-like" (Plasma animation style) ───────────────────────────────
# bezier = plasma,            0.400, 0.000, 0.200, 1.000
# animation = windowsIn,      1, 4, plasma, popin 80%
# animation = workspaces,     1, 4, plasma, slidefade 15%

# ── "Instant-but-visible" (speed with awareness) ─────────────────────────────
# bezier = flash,             0.010, 0.990, 0.010, 1.000
# animation = windowsIn,      1, 2, flash, popin 90%
# animation = workspaces,     1, 2, flash, slidefade 8%

# ══════════════════════════════════════════════════════════════════════════════
# §12  TESTING YOUR ANIMATIONS
# ══════════════════════════════════════════════════════════════════════════════

# ── Reload without full config restart ────────────────────────────────────────
# hyprctl reload
#
# ── Test workspace transition ─────────────────────────────────────────────────
# hyprctl dispatch workspace 2 && sleep 0.5 && hyprctl dispatch workspace 1
#
# ── Test window open/close ────────────────────────────────────────────────────
# kitty & sleep 1 && hyprctl dispatch killactive
#
# ── Test scratchpad ───────────────────────────────────────────────────────────
# hyprctl dispatch togglespecialworkspace scratch
#
# ── Benchmark animation frame time ───────────────────────────────────────────
# debug { overlay = true }   → enable FPS counter, watch during animations
#
# ── ASH animation testing ─────────────────────────────────────────────────────
# ash benchmark theme-apply  → measures full theme transition time
# ash benchmark startup       → measures compositor start animation time

# ══════════════════════════════════════════════════════════════════════════════
# EOF — custom.conf (animations)
# Edit:      ash config edit animations-custom
# Validate:  ash doctor check --animations
# Reload:    hyprctl reload
# ══════════════════════════════════════════════════════════════════════════════