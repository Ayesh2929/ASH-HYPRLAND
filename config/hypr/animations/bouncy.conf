# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Bouncy Animation Profile                         ║
# ║                                                                              ║
# ║  Physics-inspired spring animations with overshooting, elastic rebounds,   ║
# ║  playful window behavior, jiggly workspace transitions and energetic        ║
# ║  layer entries. Every interaction feels alive and responsive.               ║
# ║                                                                              ║
# ║  Profile:    bouncy                                                          ║
# ║  Speed tier: medium (4–7 steps) with overshoot                              ║
# ║  Character:  Playful · Energetic · Springy · Joyful · Physical             ║
# ║  GPU cost:   Medium                                                          ║
# ║  Activate:   source this file  OR  ash config set animations bouncy        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

animations {

    enabled                  = true
    first_launch_animation   = true

    # ══════════════════════════════════════════════════════════════════════════
    # §01  SPRING / BOUNCY BEZIER CURVE LIBRARY
    #
    #  Overshoot curves go beyond 1.0 on Y axis temporarily,
    #  creating the "bounce past target then settle" effect.
    #
    #  Physics analogy:
    #    Low damping → more bouncy (oscillates longer)
    #    High damping → settles faster (like thick fluid)
    # ══════════════════════════════════════════════════════════════════════════

    # ── Foundation ────────────────────────────────────────────────────────────
    bezier = linear,            0.000, 0.000, 1.000, 1.000

    # ── Spring Light — subtle, tasteful overshoot ─────────────────────────────
    #  Like a fresh spring — just barely overshoots target
    #  Overshoot: ~4% past target
    bezier = springLight,       0.340, 1.040, 0.640, 1.000

    # ── Spring Medium — classic iOS/macOS spring feel ─────────────────────────
    #  The "Apple spring" — satisfying, not excessive
    #  Overshoot: ~8% past target
    bezier = springMed,         0.340, 1.080, 0.640, 1.000

    # ── Spring Strong — dramatic bounce with clear overshoot ──────────────────
    #  Overshoot: ~15% past target — very visible spring
    bezier = springStrong,      0.200, 1.150, 0.400, 1.000

    # ── Spring Elastic — double-bounce rubber band effect ─────────────────────
    #  Overshoots, springs back slightly, settles
    #  Overshoot: ~20% peak
    bezier = springElastic,     0.500, 1.200, 0.500, 0.900

    # ── Spring Workspace — momentum + soft overshoot on landing ───────────────
    #  For lateral workspace slides — feels weighty and alive
    bezier = springSlide,       0.300, 1.120, 0.200, 1.020

    # ── Spring Pop — scale-up pop for window open ─────────────────────────────
    #  Scales past 100% then settles — classic "pop" effect
    bezier = springPop,         0.160, 1.250, 0.340, 1.000

    # ── Spring Drop — scratchpad drops with bounce on landing ─────────────────
    bezier = springDrop,        0.100, 1.300, 0.200, 1.000

    # ── Spring Close — quick decisive close (no overshoot needed) ─────────────
    bezier = springClose,       0.080, 0.820, 0.170, 1.000

    # ── Spring Fade — slightly bouncy opacity transition ──────────────────────
    bezier = springFade,        0.400, 0.000, 0.600, 1.000

    # ── Spring Jiggle — max bounce for special celebration moments ────────────
    #  Use sparingly — very dramatic overshoot
    bezier = springJiggle,      0.500, 1.600, 0.500, 0.850

    # ── Spring Border — smooth continuous rotation ────────────────────────────
    bezier = springSpin,        0.500, 0.000, 0.500, 1.000

    # ── Spring Micro — tiny instant feedback spring ────────────────────────────
    bezier = springMicro,       0.100, 1.100, 0.200, 1.000

    # ══════════════════════════════════════════════════════════════════════════
    # §02  WINDOW ANIMATIONS — BOUNCY PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    # ── Windows parent ────────────────────────────────────────────────────────
    animation = windows,            1, 5, springMed

    # ── Window open — pops in from 60% with visible spring ───────────────────
    #  Feel: window snaps into existence, overshoots slightly then settles
    #  60% start = dramatic pop-in scale range
    #  springPop = goes to ~112% then returns to 100%
    animation = windowsIn,          1, 6, springPop,          popin 60%

    # ── Window close — quick spring-out shrink ────────────────────────────────
    #  Feel: windows bounces as it closes, then zips away
    animation = windowsOut,         1, 4, springClose,        popin 80%

    # ── Window move — bouncy drift to new position ────────────────────────────
    #  Feel: window wobbles to destination like a jelly
    animation = windowsMove,        1, 5, springMed

    # ══════════════════════════════════════════════════════════════════════════
    # §03  FADE ANIMATIONS — BOUNCY PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    animation = fade,               1, 6, springFade

    # ── Window appearing ──────────────────────────────────────────════════────
    animation = fadeIn,             1, 6, springFade

    # ── Window disappearing ───────────────────────────────────────────────────
    animation = fadeOut,            1, 4, springClose

    # ── Focus switch dimming ─────────────────────────────────────────────────
    animation = fadeSwitch,         1, 5, springFade

    # ── Shadow fade ───────────────────────────────────────────────────────────
    animation = fadeShadow,         1, 6, springFade

    # ── Inactive dim ──────────────────────────────────────────────────────────
    animation = fadeDim,            1, 6, springFade

    # ── Layers fade parent ────────────────────────────────────────────────────
    animation = fadeLayers,         1, 5, springFade

    # ── Layer appearing ───────────────────────────────────────────────────────
    #  springLight = subtle spring on bar/panel appear
    animation = fadeLayersIn,       1, 6, springLight

    # ── Layer disappearing ────────────────────────────────────────────────────
    animation = fadeLayersOut,      1, 3, springClose

    # ══════════════════════════════════════════════════════════════════════════
    # §04  BORDER — BOUNCY PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    # ── Border color transition — springy focus change ─────────────────────
    animation = border,             1, 7, springMed

    # ── Faster spinning gradient — energetic and lively ────────────────────
    #  Speed 60 ≈ 3.5s per rotation — more energetic than default
    animation = borderangle,        1, 60, linear,             loop

    # ══════════════════════════════════════════════════════════════════════════
    # §05  WORKSPACE — BOUNCY PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    # ── Workspace parent ──────────────────────────────────────────────────────
    animation = workspaces,         1, 6, springSlide,         slidefade 25%

    # ── Entering workspace — momentum overshoot on arrival ───────────────────
    #  springSlide slightly overshoots → feels like the content has inertia
    #  25% travel = visible horizontal motion
    animation = workspacesIn,       1, 6, springSlide,         slidefade 25%

    # ── Leaving workspace ─────────────────────────────────────────────────────
    animation = workspacesOut,      1, 5, springClose,         slidefade 25%

    # ══════════════════════════════════════════════════════════════════════════
    # §06  SPECIAL WORKSPACE — BOUNCY PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    # ── Scratchpad parent ─────────────────────────────────────────────────────
    animation = specialWorkspace,       1, 6, springDrop,      slidefadevert -40%

    # ── Scratchpad appearing — falls from above, bounces on land ─────────────
    #  springDrop = ~30% overshoot → bounces like a ball dropped
    #  -40% = starts 40% above center, longer fall distance
    animation = specialWorkspaceIn,     1, 6, springDrop,      slidefadevert -40%

    # ── Scratchpad disappearing — springs back up ─────────────────────────────
    animation = specialWorkspaceOut,    1, 5, springClose,     slidefadevert -40%

    # ══════════════════════════════════════════════════════════════════════════
    # §07  LAYERS — BOUNCY PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    # ── Layers parent ─────────────────────────────────────────────────────────
    animation = layers,             1, 4, springMed,           fade

    # ── Layer appearing — bars/menus spring in ─────────────────────────────
    animation = layersIn,           1, 5, springLight,         fade

    # ── Layer disappearing — clean spring-out ─────────────────────────────
    animation = layersOut,          1, 3, springClose,         fade
}

# ══════════════════════════════════════════════════════════════════════════════
# §08  BOUNCY PROFILE METADATA
# ══════════════════════════════════════════════════════════════════════════════

# Profile:      bouncy
# Description:  Physics-inspired spring animations with overshoot and rebound
# Author:       ASH Dotfiles v5.0 OMEGA
# GPU load:     Medium
# Best for:     Fun daily use, showcasing, younger aesthetic, personality
# Switch to:    ash config set animations.profile bouncy
# Notes:        Overshoot curves (>1.0 Y) are intentional physics simulation
#               Disable if motion sensitivity is a concern
#               For less bounce: switch springStrong→springLight throughout