# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Smooth Animation Profile                         ║
# ║                                                                              ║
# ║  Ultra-premium fluid animations with extended duration, deep overshoot      ║
# ║  recovery, velvety workspace transitions and organic window physics.        ║
# ║  Every motion feels like butter on glass.                                   ║
# ║                                                                              ║
# ║  Profile:    smooth                                                          ║
# ║  Speed tier: medium-slow (5–8 steps)                                        ║
# ║  Character:  Silky · Organic · Premium · Luxurious                         ║
# ║  GPU cost:   Medium                                                          ║
# ║  Activate:   ash mode work  OR  source this file                           ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

animations {

    enabled                  = true
    first_launch_animation   = true

    # ══════════════════════════════════════════════════════════════════════════
    # §01  SMOOTH BEZIER CURVE LIBRARY
    #      Every curve tuned for maximum perceived smoothness
    # ══════════════════════════════════════════════════════════════════════════

    # ── Foundation curves ────────────────────────────────────────────────────
    bezier = linear,            0.000, 0.000, 1.000, 1.000

    # ── Smooth core: very gradual start, long deceleration tail ──────────────
    #  Signature "smooth" feel — like pushing a heavy object on ice
    bezier = smoothCore,        0.060, 0.960, 0.120, 1.000

    # ── Smooth in: easing into motion from rest ────────────────────────────
    #  Imperceptibly slow start → accelerates → glides to stop
    bezier = smoothIn,          0.000, 0.500, 0.150, 1.000

    # ── Smooth out: gliding to a perfect stop ─────────────────────────────
    #  Fast enter → long graceful deceleration tail
    bezier = smoothOut,         0.000, 0.800, 0.200, 1.000

    # ── Smooth workspace: cinematic lateral slide ─────────────────────────
    #  Momentum-driven, content feels weighty and natural
    bezier = smoothSlide,       0.200, 0.900, 0.100, 1.050

    # ── Smooth float: organic floating motion ─────────────────────────────
    #  Used for overlays, panels — like a feather settling
    bezier = smoothFloat,       0.180, 1.050, 0.220, 1.000

    # ── Smooth exit: dignified disappear ──────────────────────────────────
    #  Fast initial move → rapid fade → gone
    bezier = smoothExit,        0.050, 0.700, 0.100, 1.000

    # ── Smooth fade: pure opacity with soft curve ─────────────────────────
    bezier = smoothFade,        0.300, 0.000, 0.500, 1.000

    # ── Smooth scratchpad: vertical drop from above ────────────────────────
    bezier = smoothDrop,        0.100, 1.100, 0.150, 1.000

    # ── Smooth border: continuous gradient rotation ────────────────────────
    bezier = smoothSpin,        0.500, 0.000, 0.500, 1.000

    # ── Smooth micro: tiny movements (border focus change) ─────────────────
    bezier = smoothMicro,       0.200, 1.000, 0.200, 1.000

    # ── Smooth pop: scale animations for special moments ──────────────────
    bezier = smoothPop,         0.050, 1.050, 0.200, 1.000

    # ══════════════════════════════════════════════════════════════════════════
    # §02  WINDOW ANIMATIONS — SMOOTH PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    # ── Windows parent ────────────────────────────────────────────────────────
    animation = windows,            1, 6, smoothCore

    # ── Window open — scale up from 68% with organic pop ────────────────────
    #  Feel: window breathes into existence, soft and premium
    #  68% = start size (smaller = more dramatic pop)
    #  Speed 6 = slightly slower than default for luxurious feel
    animation = windowsIn,          1, 6, smoothPop,          popin 68%

    # ── Window close — smooth shrink and fade ────────────────────────────────
    #  Feel: dignified disappear, not jarring
    animation = windowsOut,         1, 5, smoothExit,         popin 78%

    # ── Window move — velvety follow ─────────────────────────────────────────
    #  Feel: window glides effortlessly to new position
    animation = windowsMove,        1, 5, smoothCore

    # ══════════════════════════════════════════════════════════════════════════
    # §03  FADE ANIMATIONS — SMOOTH PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    animation = fade,               1, 6, smoothFade

    # ── Window appearing ──────────────────────────────────────────────────────
    #  Longer duration for premium feel (6 steps)
    animation = fadeIn,             1, 6, smoothFade

    # ── Window disappearing ───────────────────────────────────────────────────
    animation = fadeOut,            1, 5, smoothExit

    # ── Focus switch ──────────────────────────────────────────────────────────
    animation = fadeSwitch,         1, 5, smoothFade

    # ── Shadow ────────────────────────────────────────────────────────────────
    animation = fadeShadow,         1, 6, smoothFade

    # ── Dim inactive ─────────────────────────────────────────────────────────
    animation = fadeDim,            1, 7, smoothFade

    # ── Layer fade parent ─────────────────────────────────────────────────────
    animation = fadeLayers,         1, 5, smoothFade

    # ── Layer appearing ───────────────────────────────────────────────────────
    animation = fadeLayersIn,       1, 6, smoothFloat

    # ── Layer disappearing ────────────────────────────────────────────────────
    animation = fadeLayersOut,      1, 4, smoothExit

    # ══════════════════════════════════════════════════════════════════════════
    # §04  BORDER — SMOOTH PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    # ── Slow, deliberate border color transition ──────────────────────────────
    animation = border,             1, 10, smoothCore

    # ── Graceful continuous gradient rotation ─────────────────────────────────
    #  Speed 100 ≈ 5.5s per full rotation — slow and elegant
    animation = borderangle,        1, 100, linear,            loop

    # ══════════════════════════════════════════════════════════════════════════
    # §05  WORKSPACE — SMOOTH PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    # ── Workspace parent ──────────────────────────────────────────────────────
    animation = workspaces,         1, 6, smoothSlide,         slidefade 25%

    # ── Entering workspace ────────────────────────────────────────────────────
    #  25% travel = content has visible momentum and weight
    #  smoothSlide = slight overshoot on arrival for organic feel
    animation = workspacesIn,       1, 6, smoothSlide,         slidefade 25%

    # ── Leaving workspace ─────────────────────────────────────────────────────
    animation = workspacesOut,      1, 5, smoothExit,          slidefade 25%

    # ══════════════════════════════════════════════════════════════════════════
    # §06  SPECIAL WORKSPACE — SMOOTH PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    # ── Scratchpad parent ─────────────────────────────────────────────────────
    animation = specialWorkspace,       1, 6, smoothDrop,      slidefadevert -35%

    # ── Scratchpad appearing ──────────────────────────────────────────────────
    #  -35% = drops from 35% above, longer travel = more dramatic reveal
    animation = specialWorkspaceIn,     1, 6, smoothDrop,      slidefadevert -35%

    # ── Scratchpad disappearing ───────────────────────────────────────────────
    animation = specialWorkspaceOut,    1, 5, smoothExit,      slidefadevert -35%

    # ══════════════════════════════════════════════════════════════════════════
    # §07  LAYERS — SMOOTH PROFILE
    # ══════════════════════════════════════════════════════════════════════════

    animation = layers,             1, 4, smoothCore,          fade
    animation = layersIn,           1, 5, smoothFloat,         fade
    animation = layersOut,          1, 3, smoothExit,          fade
}

# ══════════════════════════════════════════════════════════════════════════════
