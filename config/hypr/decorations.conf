# ══════════════════════════════════════════════════════════════════════════════
# §01  DECORATION FORMAT REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  decoration {
#    rounding         N      — corner radius in pixels
#    rounding_power   N      — squircle factor (2.0=circle, higher=squircle)
#    active_opacity   N      — focused window opacity (0.0–1.0)
#    inactive_opacity N      — unfocused window opacity (0.0–1.0)
#    fullscreen_opacity N    — fullscreen window opacity
#    dim_inactive [true|false]  — dim unfocused windows
#    dim_strength     N      — dim amount (0.0–1.0)
#    dim_special      N      — dim special workspace behind (0.0–1.0)
#    dim_around       N      — dim for floating windows (0.0–1.0)
#    screen_shader    PATH   — GLSL fragment shader path (empty = off)
#
#    shadow {
#      enabled        [true|false]
#      range          N      — shadow spread radius (px)
#      render_power   N      — 1–4, higher = sharper falloff
#      ignore_window  [true|false]  — render shadow behind transparent regions
#      color          rgba   — focused window shadow color
#      color_inactive rgba   — unfocused window shadow color
#      offset         X,Y    — shadow offset in pixels
#      scale          N      — shadow size multiplier
#      sharp          [true|false]  — pixel-perfect hard shadow
#    }
#
#    blur {
#      enabled        [true|false]
#      size           N      — kernel size (odd integers, 1–20)
#      passes         N      — blur quality (1–10, higher=more GPU)
#      ignore_opacity [true|false]  — blur regardless of window opacity
#      new_optimizations [true|false]  — optimized blur algorithm
#      xray           [true|false]  — blur through layershells
#      noise          N      — film grain overlay (0.0–1.0)
#      contrast       N      — blur contrast adjustment (0.0–2.0)
#      brightness     N      — blur brightness adjustment (0.0–2.0)
#      vibrancy       N      — color saturation boost (0.0–1.0)
#      vibrancy_darkness N   — darken vibrancy (0.0–1.0)
#      special        [true|false]  — blur special workspace content
#      popups         [true|false]  — blur popup surfaces
#      popups_ignorealpha N  — ignore popup pixels below this alpha
#    }
#  }
#
# ══════════════════════════════════════════════════════════════════════════════
# §02  CORE DECORATION SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

decoration {

    # ── Corner rounding ───────────────────────────────────────────────────────
    # Catppuccin-inspired: soft but not too rounded
    # ASH theme engine overrides this per-theme via hot-reload
    rounding         = 12           # px corner radius (0 = sharp, 20+ = pill)
    rounding_power   = 2.0          # 2.0 = true circle arc
                                    # 3.0–4.0 = squircle (iOS-style)

    # ── Window opacity ────────────────────────────────────────────────────────
    # Per-app overrides live in windowrules.conf
    # ASH mode engine adjusts these dynamically
    active_opacity   = 1.00         # Focused windows: fully opaque
    inactive_opacity = 0.92         # Unfocused: slight transparency
    fullscreen_opacity = 1.00       # Fullscreen: always opaque

    # ── Inactive window dimming ───────────────────────────────────────────────
    dim_inactive     = true
    dim_strength     = 0.08         # Subtle 8% dim — noticeable but not harsh
    dim_special      = 0.35         # Dim background when special WS is open
    dim_around       = 0.50         # Dim behind floating windows (modal feel)

    # ── Screen shader ─────────────────────────────────────────────────────────
    # Uncomment to apply a GLSL shader to the entire screen.
    # ASH night-light plugin manages this dynamically.
    # screen_shader = ~/.config/hypr/shaders/blue-light-filter.frag
    # screen_shader = ~/.config/hypr/shaders/vibrance.frag
    # screen_shader = ~/.config/hypr/shaders/crt-retro.frag

    # ══════════════════════════════════════════════════════════════════════════
    # §03  DROP SHADOW CONFIGURATION
    # ══════════════════════════════════════════════════════════════════════════

    shadow {
        enabled          = true

        # Shadow spread — larger = softer/wider
        range            = 30           # px

        # Falloff sharpness (1=soft gaussian, 4=sharp cutoff)
        render_power     = 3

        # Render shadow behind transparent window regions
        ignore_window    = true

        # Shadow color — subtle dark with slight color tint
        # Format: rgba(R,G,B,A) where RGBA are hex 00–FF
        color            = rgba(0,0,0,0.60)      # Active window
        color_inactive   = rgba(0,0,0,0.35)      # Inactive window

        # Offset — slight downward offset (Y positive = down)
        offset           = 0, 6

        # Scale — 1.0 = exact window size, >1 = slightly larger shadow
        scale            = 1.02

        # Sharp shadows (false = gaussian blur, true = pixel-perfect hard edge)
        sharp            = false
    }

    # ══════════════════════════════════════════════════════════════════════════
    # §04  BLUR CONFIGURATION
    # ══════════════════════════════════════════════════════════════════════════

    blur {
        # ── Master toggle ─────────────────────────────────────────────────────
        enabled          = true

        # ── Kernel & quality ─────────────────────────────────────────────────
        # size: blur kernel radius — larger = more blurry, more GPU cost
        #   1 = minimal, 4 = subtle, 8 = medium, 12 = heavy, 20 = extreme
        size             = 8

        # passes: how many times to apply the blur kernel
        #   1 = fast but less smooth, 3 = balanced, 6+ = GPU intensive
        passes           = 3

        # ── Opacity handling ─────────────────────────────────────────────────
        # ignore_opacity: blur even fully opaque windows
        #   true  = always blur (for glassmorphism effects on all windows)
        #   false = only blur where window is transparent
        ignore_opacity   = false

        # new_optimizations: uses newer, faster blur algorithm
        new_optimizations = true

        # ── X-ray mode ────────────────────────────────────────────────────────
        # xray: what gets blurred behind a surface
        #   false = blur the wallpaper (frosted glass on wallpaper)
        #   true  = blur windows beneath (frosted glass through windows)
        xray             = false

        # ── Post-processing ───────────────────────────────────────────────────
        # noise: adds film grain texture to blurred regions (0.0–1.0)
        #   0.0 = clean, 0.01–0.02 = subtle grain, 0.05+ = heavy grain
        noise            = 0.0117

        # contrast: adjust contrast of blurred region
        #   1.0 = neutral, <1.0 = lower, >1.0 = higher
        contrast         = 0.88

        # brightness: adjust brightness of blurred region
        #   1.0 = neutral, <1.0 = darker, >1.0 = brighter
        brightness       = 0.82

        # vibrancy: boost color saturation in blur (chromatic glass effect)
        #   0.0 = no boost, 0.2 = subtle, 0.5+ = strong
        vibrancy         = 0.18

        # vibrancy_darkness: reduce vibrancy in darker regions
        vibrancy_darkness = 0.0

        # ── Special workspace blur ────────────────────────────────────────────
        # Blur content visible behind special (scratchpad) workspace
        special          = true

        # ── Popup blur ────────────────────────────────────────────────────────
        # Blur tooltip/popup surfaces
        popups           = true

        # Ignore transparent pixels in popups for blur
        popups_ignorealpha = 0.2
    }
}

