# ══════════════════════════════════════════════════════════════════════════════
# §06  SHADER QUICK-REFERENCE
#      Activated by: hyprctl keyword decoration:screen_shader PATH
#      Or:           ash doctor fix --shader NAME
# ══════════════════════════════════════════════════════════════════════════════
#
#  ~/.config/hypr/shaders/blue-light-filter.frag  — Warm/orange night light
#  ~/.config/hypr/shaders/vibrance.frag           — Boost color saturation
#  ~/.config/hypr/shaders/grayscale.frag          — Monochrome mode
#  ~/.config/hypr/shaders/invert.frag             — Invert colors
#  ~/.config/hypr/shaders/crt-retro.frag          — CRT scanline effect
#  ~/.config/hypr/shaders/chromatic-aberration.frag — RGB fringe effect
#  ~/.config/hypr/shaders/vignette.frag           — Dark edges
#  ~/.config/hypr/shaders/film-grain.frag         — Analog film noise
#  ~/.config/hypr/shaders/sharpen.frag            — Subtle sharpening
#  ~/.config/hypr/shaders/sepia.frag              — Warm retro sepia
#  ~/.config/hypr/shaders/noir.frag               — High contrast B&W
#  ~/.config/hypr/shaders/matrix-rain.frag        — Matrix rain effect
#
# ══════════════════════════════════════════════════════════════════════════════
# EOF — decorations.conf
# Hot-reload: ash reload --decorations
# Benchmark:  ash benchmark memory --blur
# Validate:   ash doctor check --decorations
