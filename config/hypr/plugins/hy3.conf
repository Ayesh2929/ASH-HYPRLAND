# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — hy3 Plugin Configuration                         ║
# ║                                                                              ║
# ║  i3/Sway-compatible manual tiling layout for Hyprland. Full BSP tree       ║
# ║  manipulation: split directions, tabbed containers, stacking,              ║
# ║  i3-style move/focus/resize with keyboard-driven ergonomics.               ║
# ║                                                                              ║
# ║  Repo:     https://github.com/outfoxxed/hy3                                 ║
# ║  Install:  hyprpm add https://github.com/outfoxxed/hy3                     ║
# ║            hyprpm enable hy3                                                ║
# ║  Plugin:   plugin = ~/.local/share/hyprpm/plugins/hy3.so                   ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  PLUGIN LOAD
# ══════════════════════════════════════════════════════════════════════════════

plugin = ~/.local/share/hyprpm/plugins/hy3.so

# ══════════════════════════════════════════════════════════════════════════════
# §02  HY3 LAYOUT CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

plugin {
    hy3 {

        # ── Node behavior ─────────────────────────────────────────────────────
        # When a container has only one child, collapse it automatically
        no_gaps_when_only        = false

        # Node collapse policy
        # 0 = never collapse
        # 1 = always collapse single-child containers
        # 2 = collapse only tail nodes (default — most i3-like)
        node_collapse_policy     = 2

        # ── Group/tab styling ─────────────────────────────────────────────────
        tabs {

            # Tab bar height (px) — appears above tabbed container
            height                   = 22

            # Padding within each tab label
            padding                  = 6

            # Tab bar position: top | bottom
            # from_top = true  → bar on top  (default, i3 style)
            from_top                 = true

            # Corner rounding for tab pill (px)
            rounding                 = 6

            # Render tab title text
            render_text              = true

            # Center text in tab
            text_center              = true

            # Font for tab text
            text_font                = JetBrainsMono Nerd Font

            # Font size
            text_height              = 11

            # Text padding inside tab
            text_padding             = 5

            # ── Tab colors — ASH Catppuccin Mocha ─────────────────────────────

            # Active tab (focused window)
            col.active               = rgba(cba4f7ff)   # Mauve
            col.active.text          = rgba(1e1e2eff)   # Base (dark text on accent)

            # Inactive tab (unfocused window in this group)
            col.inactive             = rgba(31324499)   # Surface0 60%
            col.inactive.text        = rgba(cdd6f4cc)   # Text 80%

            # Urgent tab (window requesting attention)
            col.urgent               = rgba(f38ba8ff)   # Red
            col.urgent.text          = rgba(1e1e2eff)

            # ── Focused group border (outer group indicator) ──────────────────
            col.child_border         = rgba(cba4f7aa)   # Mauve 67%
        }

        # ── Autotile ──────────────────────────────────────────────────────────
        # Automatically choose split direction based on window dimensions
        autotile {
            enable                   = true
            # Trigger threshold: split horizontal if width > height × ratio
            trigger_width            = 1.3
        }
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# §03  HY3 KEYBINDS
#      Full i3-style keyboard control
# ══════════════════════════════════════════════════════════════════════════════

# ── Focus navigation ──────────────────────────────────────────────────────────
bind = $mainMod, H,         hy3:movefocus,      l
bind = $mainMod, J,         hy3:movefocus,      d
bind = $mainMod, K,         hy3:movefocus,      u
bind = $mainMod, L,         hy3:movefocus,      r

bind = $mainMod, left,      hy3:movefocus,      l
bind = $mainMod, down,      hy3:movefocus,      d
bind = $mainMod, up,        hy3:movefocus,      u
bind = $mainMod, right,     hy3:movefocus,      r

# ── Window movement ───────────────────────────────────────────────────────────
bind = $mainMod SHIFT, H,   hy3:movewindow,     l
bind = $mainMod SHIFT, J,   hy3:movewindow,     d
bind = $mainMod SHIFT, K,   hy3:movewindow,     u
bind = $mainMod SHIFT, L,   hy3:movewindow,     r

bind = $mainMod SHIFT, left,  hy3:movewindow,   l
bind = $mainMod SHIFT, down,  hy3:movewindow,   d
bind = $mainMod SHIFT, up,    hy3:movewindow,   u
bind = $mainMod SHIFT, right, hy3:movewindow,   r

# ── Split direction ───────────────────────────────────────────────────────────
# Create horizontal split (side by side)
bind = $mainMod, E,         hy3:makegroup,      h, ephemeral
# Create vertical split (top / bottom)
bind = $mainMod SHIFT, E,   hy3:makegroup,      v, ephemeral
# Create tabbed group
bind = $mainMod, W,         hy3:makegroup,      tab, ephemeral
# Create stacked group
bind = $mainMod SHIFT, W,   hy3:makegroup,      stacking, ephemeral

# ── Tab navigation ────────────────────────────────────────────────────────────
# Cycle forward in tabbed/stacked group
bind = $mainMod, Tab,       hy3:changefocus,    tab
# Cycle backward
bind = $mainMod SHIFT, Tab, hy3:changefocus,    tabprev

# ── Group focus ───────────────────────────────────────────────────────────────
# Focus the parent container
bind = $mainMod, A,         hy3:changefocus,    raise
# Focus the child / descend
bind = $mainMod SHIFT, A,   hy3:changefocus,    lower

# ── Focus urgent ──────────────────────────────────────────────────────────────
bind = $mainMod, U,         hy3:changefocus,    urgent

# ── Move window into group ────────────────────────────────────────────────────
bind = $mainMod CTRL, H,    hy3:moveintogroup,  l
bind = $mainMod CTRL, J,    hy3:moveintogroup,  d
bind = $mainMod CTRL, K,    hy3:moveintogroup,  u
bind = $mainMod CTRL, L,    hy3:moveintogroup,  r

# ── Smart move (move or merge into group) ─────────────────────────────────────
bind = $mainMod ALT, H,     hy3:movewindoworgroup, l
bind = $mainMod ALT, J,     hy3:movewindoworgroup, d
bind = $mainMod ALT, K,     hy3:movewindoworgroup, u
bind = $mainMod ALT, L,     hy3:movewindoworgroup, r

# ── Move window out of group ──────────────────────────────────────────────────
bind = $mainMod SHIFT, G,   hy3:movetoworkspace, e+0

# ── Expand/shrink split ratio ─────────────────────────────────────────────────
binde = $mainMod, equal,    hy3:resizenode,     +20 0
binde = $mainMod, minus,    hy3:resizenode,     -20 0
binde = $mainMod SHIFT, equal, hy3:resizenode,  0 +20
binde = $mainMod SHIFT, minus, hy3:resizenode,  0 -20

# ── Set layout for workspace ──────────────────────────────────────────────────
# (hy3 replaces standard layout system when active)

# ══════════════════════════════════════════════════════════════════════════════
# §04  HY3 LAYER RULES
# ══════════════════════════════════════════════════════════════════════════════

layerrule = blur,       hy3
layerrule = ignorezero, hy3

# ══════════════════════════════════════════════════════════════════════════════
# EOF — hy3.conf
# Status:  hyprctl plugin list | grep hy3
# Dispatch: hyprctl dispatch hy3:movefocus l
