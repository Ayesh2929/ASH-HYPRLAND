# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Hyprfocus Plugin Configuration                   ║
# ║                                                                              ║
# ║  Adds visual focus highlight effects when window focus changes.            ║
# ║  Supports flash, shrink, and zoom animations to draw attention to the      ║
# ║  newly focused window without distracting the flow of work.                ║
# ║                                                                              ║
# ║  Repo:     https://github.com/VortexCoyote/hyprfocus                       ║
# ║  Install:  hyprpm add https://github.com/VortexCoyote/hyprfocus            ║
# ║            hyprpm enable hyprfocus                                          ║
# ║  Plugin:   plugin = ~/.local/share/hyprpm/plugins/hyprfocus.so             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  PLUGIN LOAD
# ══════════════════════════════════════════════════════════════════════════════

plugin = ~/.local/share/hyprpm/plugins/hyprfocus.so

# ══════════════════════════════════════════════════════════════════════════════
# §02  HYPRFOCUS CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

plugin {
    hyprfocus {

        # ── Master enable ─────────────────────────────────────────────────────
        enabled                  = true

        # ── Keyboard focus only ───────────────────────────────────────────────
        # true  = only animate when focus changes via keyboard
        # false = animate on ALL focus changes (mouse + keyboard)
        keyboard_focus_animation = true
        mouse_focus_animation    = false

        # ══════════════════════════════════════════════════════════════════════
        # §03  FLASH EFFECT
        #      Brief opacity flash on the newly focused window
        # ══════════════════════════════════════════════════════════════════════

        flash {

            # Enable flash effect
            enabled              = true

            # Target opacity during flash (0.0 = transparent, 1.0 = opaque)
            # Typically slightly below 1.0 for a visible but tasteful flash
            flash_opacity        = 0.88

            # Bezier curve for flash-in (opacity drops to flash_opacity)
            in_bezier            = ashSnappy

            # Speed of flash-in (steps × Hyprland animation speed factor)
            # 0.5 = very fast, 1.0 = default, 2.0 = slower
            in_speed             = 0.4

            # Bezier curve for recovery (opacity returns to 1.0)
            out_bezier           = ashSmooth

            # Speed of recovery
            out_speed            = 3.0
        }

        # ══════════════════════════════════════════════════════════════════════
        # §04  SHRINK EFFECT
        #      Brief scale-down then scale-back-up on focus change
        # ══════════════════════════════════════════════════════════════════════

        shrink {

            # Enable shrink effect
            enabled              = false   # Disabled by default — too distracting

            # Scale factor during shrink (0.95 = 95% of normal size)
            shrink_percentage    = 0.97

            # Bezier for shrink-in (scale decreases)
            in_bezier            = ashBounce

            # Speed of shrink-in
            in_speed             = 1.2

            # Bezier for recovery (scale returns to 1.0)
            out_bezier           = ashSmooth

            # Speed of recovery
            out_speed            = 3.0
        }
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# §05  HYPRFOCUS TOGGLE BIND
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle focus animation on/off ────────────────────────────────────────────
bind = $hyperMod,       F,      exec, \
    CURRENT=$(hyprctl -j getoption plugin:hyprfocus:enabled | jq '.int'); \
    if [ "$CURRENT" = "1" ]; then \
        hyprctl keyword plugin:hyprfocus:enabled 0 && \
        notify-send "ASH" "👁 Focus animation: OFF" \
        --urgency=low --expire-time=1500; \
    else \
        hyprctl keyword plugin:hyprfocus:enabled 1 && \
        notify-send "ASH" "👁 Focus animation: ON" \
        --urgency=low --expire-time=1500; \
    fi

# ══════════════════════════════════════════════════════════════════════════════
# §06  MODE INTEGRATION
#      Auto-disable in game mode (no animation overhead)
# ══════════════════════════════════════════════════════════════════════════════

# In game.conf:
# exec = hyprctl keyword plugin:hyprfocus:enabled 0

# In default.conf (restore):
# exec = hyprctl keyword plugin:hyprfocus:enabled 1

# ══════════════════════════════════════════════════════════════════════════════
# EOF — hyprfocus.conf
# Status:  hyprctl plugin list | grep hyprfocus
# Toggle:  $hyperMod + F
# ══════════════════════════════════════════════════════════════════════════════