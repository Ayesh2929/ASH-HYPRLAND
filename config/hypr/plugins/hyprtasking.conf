# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Hyprtasking Plugin Configuration                 ║
# ║                                                                              ║
# ║  Taskbar-style window switcher overlay. Shows live previews of all         ║
# ║  open windows in a horizontal strip. Click or keyboard navigate to         ║
# ║  switch — like Alt+Tab but with spatial context and visual previews.       ║
# ║                                                                              ║
# ║  Repo:     https://github.com/dasisdormax/hyprtasking                       ║
# ║  Install:  hyprpm add https://github.com/dasisdormax/hyprtasking            ║
# ║            hyprpm enable hyprtasking                                        ║
# ║  Plugin:   plugin = ~/.local/share/hyprpm/plugins/hyprtasking.so           ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  PLUGIN LOAD
# ══════════════════════════════════════════════════════════════════════════════

plugin = ~/.local/share/hyprpm/plugins/hyprtasking.so

# ══════════════════════════════════════════════════════════════════════════════
# §02  HYPRTASKING CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

plugin {
    hyprtasking {

        # ── Layout ────────────────────────────────────────────────────────────
        # Number of rows in the task switcher
        # 1 = single horizontal strip (Alt+Tab style)
        # 2 = two rows for many windows
        rows                         = 1

        # Gap between window previews (px)
        gap                          = 10

        # ── Exit behavior ─────────────────────────────────────────────────────
        # Focus window on click and close switcher
        exit_on_click                = true

        # Close switcher when cursor leaves the panel area
        exit_on_move_out             = false

        # ── Background ────────────────────────────────────────────────────────
        # Switcher panel background color
        # Catppuccin Mantle with 95% opacity
        bg_color                     = rgba(181825f2)

        # ── Panel border ──────────────────────────────────────────────────────
        border_color                 = rgba(cba4f7aa)
        border_size                  = 2

        # Panel corner rounding (px)
        rounding                     = 14

        # ── Window preview borders ────────────────────────────────────────────
        # Border around individual window previews
        window_border_color          = rgba(45475aaa)
        window_border_active_color   = rgba(cba4f7ff)
        window_border_size           = 2
        window_rounding              = 10

        # ── Window title rendering ────────────────────────────────────────────
        render_title                 = true
        title_font                   = JetBrainsMono Nerd Font
        title_size                   = 11
        title_color                  = rgba(cdd6f4ff)

        # ── Shadow ────────────────────────────────────────────────────────────
        shadow                       = true
        shadow_color                 = rgba(00000066)

        # ── Blur (requires decoration.blur.enabled) ───────────────────────────
        blur                         = true
        blur_passes                  = 3
        blur_size                    = 8

        # ── Dimming ───────────────────────────────────────────────────────────
        # Dim background windows when switcher is open
        dim_inactive                 = true
        dim_strength                 = 0.30

        # ── Trigger ───────────────────────────────────────────────────────────
        # Show on gesture or keybind
        # gesture | keybind | both
        show                         = both
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# §03  HYPRTASKING KEYBINDS
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle task switcher ──────────────────────────────────────────────────────
bind = $mainMod,        X,          hyprtasking:toggle
bind = $altMod,         Tab,        hyprtasking:toggle

# ── Navigate within switcher ──────────────────────────────────────────────────
# (While switcher is open)
bind = $altMod,         H,          hyprtasking:prev
bind = $altMod,         L,          hyprtasking:next
bind = $altMod,         left,       hyprtasking:prev
bind = $altMod,         right,      hyprtasking:next

# ── Select focused window ─────────────────────────────────────────────────────
bind = $altMod,         Return,     hyprtasking:select
bind = $altMod,         space,      hyprtasking:select

# ── Close window from switcher ────────────────────────────────────────────────
bind = $altMod,         Q,          hyprtasking:close

# ── Close switcher ────────────────────────────────────────────────────────────
bind = $altMod,         Escape,     hyprtasking:close
bind = , Escape,                    hyprtasking:close

# ── 3-finger swipe down → task switcher ──────────────────────────────────────
bindgesture = swipe:3:d,            hyprtasking:toggle

# ══════════════════════════════════════════════════════════════════════════════
# §04  LAYER RULES — HYPRTASKING OVERLAY
# ══════════════════════════════════════════════════════════════════════════════

layerrule = blur,                   hyprtasking
layerrule = xray 0,                 hyprtasking
layerrule = ignorezero,             hyprtasking
layerrule = ignorealpha 0.05,       hyprtasking
layerrule = animation slide bottom, hyprtasking
layerrule = dimaround,              hyprtasking

# ══════════════════════════════════════════════════════════════════════════════
# §05  WINDOW RULES — HYPRTASKING EXCLUSIONS
#      Prevent specific windows from appearing in the task switcher
# ══════════════════════════════════════════════════════════════════════════════

# ── System overlay windows (not user tasks) ───────────────────────────────────
windowrulev2 = plugin:hyprtasking:exclude, class:^(rofi)$
windowrulev2 = plugin:hyprtasking:exclude, class:^(wlogout)$
windowrulev2 = plugin:hyprtasking:exclude, class:^(hyprlock)$
windowrulev2 = plugin:hyprtasking:exclude, class:^(mangohud)$

# ── Background windows ────────────────────────────────────────────────────────
windowrulev2 = plugin:hyprtasking:exclude, class:^(ash-background)$

# ══════════════════════════════════════════════════════════════════════════════
# §06  HYPRTASKING THEME INTEGRATION
#      Colors sync with ASH theme engine
# ══════════════════════════════════════════════════════════════════════════════

# ASH engine updates these on theme change:
# bg_color              = rgba({mantle}f2)
# border_color          = rgba({accent}aa)
# window_border_active_color = rgba({accent}ff)
# title_color           = rgba({text}ff)
# shadow_color          = rgba(00000066)

# ══════════════════════════════════════════════════════════════════════════════
# EOF — hyprtasking.conf
# Toggle:  Super+X  OR  Alt+Tab
# Status:  hyprctl plugin list | grep hyprtasking
# Update:  hyprpm update hyprtasking
# ══════════════════════════════════════════════════════════════════════════════