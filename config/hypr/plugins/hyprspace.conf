# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Hyprspace Plugin Configuration                   ║
# ║                                                                              ║
# ║  Workspace overview with smooth zoom-out animation, showing all active     ║
# ║  workspaces as a navigable spatial grid. Mission Control for Hyprland.     ║
# ║                                                                              ║
# ║  Repo:     https://github.com/KGAFT/hyprspace                               ║
# ║  Install:  hyprpm add https://github.com/KGAFT/hyprspace                   ║
# ║            hyprpm enable hyprspace                                          ║
# ║  Plugin:   plugin = ~/.local/share/hyprpm/plugins/hyprspace.so             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  PLUGIN LOAD
# ══════════════════════════════════════════════════════════════════════════════

plugin = ~/.local/share/hyprpm/plugins/hyprspace.so

# ══════════════════════════════════════════════════════════════════════════════
# §02  HYPRSPACE CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

plugin {
    hyprspace {

        # ── Overview behavior ─────────────────────────────────────────────────
        # Show overview on Super key release (like macOS Mission Control)
        # true  = show when Super is held (gesture-like)
        # false = toggle on bind press
        on_open_use_active_workspace = true

        # ── Workspace grid layout ─────────────────────────────────────────────
        # Number of columns in the overview grid
        # 0 = auto-calculate based on workspace count
        columns                      = 0

        # Gap between workspace preview panels (px)
        gap_size                     = 8

        # ── Zoom behavior ─────────────────────────────────────────────────────
        # Duration of zoom-out animation (ms)
        # Lower = snappier feel
        # Higher = cinematic reveal
        zoom_duration                = 300

        # Bezier curve for zoom animation
        # Uses Hyprland's named bezier curves
        zoom_bezier                  = ashSmooth

        # ── Background ────────────────────────────────────────────────────────
        # Background color/blur behind the workspace grid
        bg_color                     = rgba(17111bef)

        # Blur behind overview (requires blur enabled in decoration)
        blur                         = true

        # ── Workspace panel appearance ────────────────────────────────────────
        # Panel rounding (px)
        panel_rounding               = 12

        # Panel border width
        panel_border_width           = 2

        # Active workspace panel border color (catppuccin mauve)
        panel_border_color           = rgba(cba4f7ff)

        # Inactive workspace panel border color
        panel_inactive_border_color  = rgba(31324466)

        # Shadow beneath panels
        panel_shadow                 = true
        panel_shadow_color           = rgba(00000088)

        # ── Workspace labels ──────────────────────────────────────────────────
        # Show workspace name/number over each panel
        show_workspace_label         = true
        workspace_label_font         = JetBrainsMono Nerd Font Bold
        workspace_label_size         = 14
        workspace_label_color        = rgba(cdd6f4ff)
        workspace_label_position     = top-center

        # Show workspace icon (number badge)
        show_workspace_icon          = true

        # ── Empty workspace handling ──────────────────────────────────────────
        # Hide workspaces that have no windows
        hide_empty_workspaces        = false

        # Minimum opacity for empty workspace panels
        empty_workspace_opacity      = 0.35

        # ── Window previews inside panels ────────────────────────────────────
        # Scale of window previews within overview panels
        # 1.0 = no extra scaling (uses the auto-computed panel scale)
        window_preview_scale         = 1.0

        # Draw window borders inside overview panels
        window_border                = true
        window_border_size           = 1
        window_border_color          = rgba(45475aaa)

        # ── Interaction ───────────────────────────────────────────────────────
        # Click on workspace → switch to it
        click_to_switch              = true

        # Hover highlights active panel
        hover_highlight              = true
        hover_highlight_color        = rgba(cba4f720)

        # ── Scrolling ─────────────────────────────────────────────────────────
        # Mouse scroll in overview cycles workspaces
        scroll_to_switch             = true

        # Drag windows between workspace panels
        drag_window                  = true

        # ── Keyboard navigation ───────────────────────────────────────────────
        # HJKL / Arrow keys navigate between panels in overview
        keyboard_navigation          = true

        # Enter key = switch to highlighted workspace
        # Escape = exit overview without switching
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# §03  HYPRSPACE KEYBINDS
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle workspace overview ─────────────────────────────────────────────────
bind = $mainMod,        Super_L,    overview:toggle
bind = $mainMod,        F1,         overview:toggle
bind = $mainMod,        Tab,        overview:toggle

# ── Open overview ─────────────────────────────────────────────────────────────
bind = $mainMod,        o,          overview:open
bind = $mainMod SHIFT,  o,          overview:close

# ── Navigate in overview mode (arrows and vim keys) ──────────────────────────
# (Active only while overview is open)
bind = $mainMod,        left,       overview:left
bind = $mainMod,        right,      overview:right
bind = $mainMod,        up,         overview:up
bind = $mainMod,        down,       overview:down
bind = $mainMod,        h,          overview:left
bind = $mainMod,        l,          overview:right
bind = $mainMod,        k,          overview:up
bind = $mainMod,        j,          overview:down

# ══════════════════════════════════════════════════════════════════════════════
# §04  LAYER RULES FOR HYPRSPACE OVERLAY
# ══════════════════════════════════════════════════════════════════════════════

layerrule = blur,           hyprspace
layerrule = xray 0,         hyprspace
layerrule = ignorezero,     hyprspace
layerrule = animation fade, hyprspace

# ══════════════════════════════════════════════════════════════════════════════
# EOF — hyprspace.conf
# Toggle:  Super+Tab  OR  Super+F1
# Status:  hyprctl plugin list | grep hyprspace
# Update:  hyprpm update hyprspace
# ══════════════════════════════════════════════════════════════════════════════