# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Hyprbars Plugin Configuration                    ║
# ║                                                                              ║
# ║  Adds configurable title bars to tiled and floating windows.               ║
# ║  macOS-style traffic light buttons, blur support, custom fonts,            ║
# ║  per-window rules and ASH theme integration.                                ║
# ║                                                                              ║
# ║  Repo:     https://github.com/hyprwm/hyprland-plugins                      ║
# ║  Install:  hyprpm add https://github.com/hyprwm/hyprland-plugins           ║
# ║            hyprpm enable hyprbars                                           ║
# ║  Plugin:   plugin = ~/.local/share/hyprpm/plugins/hyprbars.so              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  PLUGIN LOAD
# ══════════════════════════════════════════════════════════════════════════════

plugin = ~/.local/share/hyprpm/plugins/hyprbars.so

# ══════════════════════════════════════════════════════════════════════════════
# §02  HYPRBARS CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

plugin {
    hyprbars {

        # ── Bar dimensions ────────────────────────────────────────────────────
        # Total bar height in pixels
        # 24–28 = compact  │  32 = standard  │  40+ = large
        bar_height               = 28

        # ── Bar background ────────────────────────────────────────────────────
        # Catppuccin Mocha Mantle with 95% opacity — frosted glass feel
        bar_color                = rgba(181825f0)

        # ── Text ─────────────────────────────────────────────────────────────
        col.text                 = rgba(cdd6f4e0)   # Slightly transparent text
        bar_text_size            = 11
        bar_text_font            = JetBrainsMono Nerd Font

        # Text alignment: left | center | right
        bar_text_align           = center

        # Horizontal padding before text (px)
        bar_padding              = 10

        # ── Blur ─────────────────────────────────────────────────────────────
        # Enable blur behind title bar (requires decoration.blur.enabled)
        bar_blur                 = true
        bar_blur_passes          = 2
        bar_blur_size            = 6

        # ── Border overlap ────────────────────────────────────────────────────
        # Draw bar overlapping the window border (macOS style = false)
        bar_precedence_over_border = false

        # ── Bar position ──────────────────────────────────────────────────────
        # top = traditional title bar position
        # bottom = reverse / bottom title bar
        # bar_position           = top   # (default = top)

        # ══════════════════════════════════════════════════════════════════════
        # §03  WINDOW BUTTONS (TRAFFIC LIGHTS)
        # ══════════════════════════════════════════════════════════════════════
        #
        #  Format: hyprbars-button = COLOR, DIAMETER, ICON, DISPATCHER [, ARGS]
        #
        #  Buttons render right-to-left (first defined = rightmost)
        #  Icon:   Nerd Font glyph or empty for solid circle
        #  Color:  rgba() or rgb() format
        # ══════════════════════════════════════════════════════════════════════

        # ── Close button (red) ────────────────────────────────────────────────
        # catppuccin red: #f38ba8
        hyprbars-button = rgba(f38ba8ff), 14, 󰖭, killactive

        # ── Maximize button (yellow) ──────────────────────────────────────────
        # catppuccin yellow: #f9e2af
        hyprbars-button = rgba(f9e2afff), 14, 󰖯, fullscreen, 1

        # ── Float/tile toggle button (green) ─────────────────────────────────
        # catppuccin green: #a6e3a1
        hyprbars-button = rgba(a6e3a1ff), 14, 󰖮, togglefloating

        # ── Pin button (teal) ─────────────────────────────────────────────────
        # Uncomment to add a 4th pin-to-all-workspaces button
        # hyprbars-button = rgba(94e2d5ff), 14, 󰐃, pin

        # ── Minimize to special workspace ─────────────────────────────────────
        # hyprbars-button = rgba(cba4f7ff), 14, 󰘳, movetoworkspace, special:scratch
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# §04  WINDOW RULES — HYPRBARS EXCLUSIONS
#      Disable title bar for apps that have their own chrome
# ══════════════════════════════════════════════════════════════════════════════

# ── Apps with native title bars (disable hyprbars) ────────────────────────────
windowrulev2 = plugin:hyprbars:nobar, class:^(firefox)$
windowrulev2 = plugin:hyprbars:nobar, class:^(chromium|google-chrome|brave-browser)$
windowrulev2 = plugin:hyprbars:nobar, class:^(code-oss|Code|code)$
windowrulev2 = plugin:hyprbars:nobar, class:^(jetbrains-.*)$
windowrulev2 = plugin:hyprbars:nobar, class:^(libreoffice.*)$
windowrulev2 = plugin:hyprbars:nobar, class:^(gimp|GIMP)$
windowrulev2 = plugin:hyprbars:nobar, class:^(obs|com.obsproject.Studio)$
windowrulev2 = plugin:hyprbars:nobar, class:^(discord|Discord|vesktop|WebCord)$
windowrulev2 = plugin:hyprbars:nobar, class:^(Spotify|spotify)$
windowrulev2 = plugin:hyprbars:nobar, class:^(steam|Steam)$

# ── Terminals (they have their own tabs) ──────────────────────────────────────
windowrulev2 = plugin:hyprbars:nobar, class:^(kitty|foot|wezterm|alacritty)$

# ── System dialogs: keep bar for windowing context ───────────────────────────
# (These use the bar — no exclusion needed)

# ── Launchers / overlays: no bar ──────────────────────────────────────────────
windowrulev2 = plugin:hyprbars:nobar, class:^(rofi|wofi|wlogout|hyprlock)$

# ══════════════════════════════════════════════════════════════════════════════
# §05  HYPRBARS THEME INTEGRATION
#      Colors updated on theme change by ASH engine
# ══════════════════════════════════════════════════════════════════════════════

# ASH theme engine writes these dynamically:
# bar_color     = rgba({mantle}{opacity})
# col.text      = rgba({text}e0)
# button colors = rgba({red}ff) rgba({yellow}ff) rgba({green}ff)

# ══════════════════════════════════════════════════════════════════════════════
# EOF — hyprbars.conf
# Status:  hyprctl plugin list | grep hyprbars
# Update:  hyprpm update hyprbars
