# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Hyprscroller Plugin Configuration                ║
# ║                                                                              ║
# ║  Scrollable column layout inspired by PaperWM. Windows arrange in         ║
# ║  columns that scroll horizontally — infinite virtual desktop with          ║
# ║  spatial consistency. Keyboard-driven, fluid, spacious.                    ║
# ║                                                                              ║
# ║  Repo:     https://github.com/dawsers/hyprscroller                         ║
# ║  Install:  hyprpm add https://github.com/dawsers/hyprscroller              ║
# ║            hyprpm enable hyprscroller                                       ║
# ║  Plugin:   plugin = ~/.local/share/hyprpm/plugins/hyprscroller.so          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  PLUGIN LOAD
# ══════════════════════════════════════════════════════════════════════════════

plugin = ~/.local/share/hyprpm/plugins/hyprscroller.so

# ══════════════════════════════════════════════════════════════════════════════
# §02  HYPRSCROLLER CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

plugin {
    scroller {

        # ── Column width defaults ─────────────────────────────────────────────
        # Width of new windows as fraction of monitor width
        # onethird = 33%  │  onehalf = 50%  │  twothirds = 67%  │  one = 100%
        column_default_width         = onehalf

        # Available width presets (cycled with setwidth command)
        column_widths                = onethird onehalf twothirds one

        # ── Window height defaults ─────────────────────────────────────────────
        # Height of new windows as fraction of monitor height
        window_default_height        = one

        # Available height presets
        window_heights               = onethird onehalf twothirds one

        # ── Focus behavior ────────────────────────────────────────────────────
        # Wrap focus at end of column list
        focus_wrap                   = false

        # ── Center on focus ───────────────────────────────────────────────────
        # Scroll the viewport to center the focused column
        center_column_on_focus       = true

        # ── Gaps inside scroller viewport ─────────────────────────────────────
        column_gaps                  = true

        # ── Edge pinning ──────────────────────────────────────────────────────
        # Pin columns to screen edges when near
        # 0 = no pinning  │  N = snap distance in px
        # column_pin                 = 0
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# §03  HYPRSCROLLER KEYBINDS
# ══════════════════════════════════════════════════════════════════════════════

# ── Focus navigation ──────────────────────────────────────────────────────────
bind = $mainMod, left,          scroller:movefocus,     l
bind = $mainMod, right,         scroller:movefocus,     r
bind = $mainMod, up,            scroller:movefocus,     u
bind = $mainMod, down,          scroller:movefocus,     d

bind = $mainMod, H,             scroller:movefocus,     l
bind = $mainMod, L,             scroller:movefocus,     r
bind = $mainMod, K,             scroller:movefocus,     u
bind = $mainMod, J,             scroller:movefocus,     d

# ── Window movement ───────────────────────────────────────────────────────────
bind = $mainMod SHIFT, left,    scroller:movewindow,    l
bind = $mainMod SHIFT, right,   scroller:movewindow,    r
bind = $mainMod SHIFT, up,      scroller:movewindow,    u
bind = $mainMod SHIFT, down,    scroller:movewindow,    d

bind = $mainMod SHIFT, H,       scroller:movewindow,    l
bind = $mainMod SHIFT, L,       scroller:movewindow,    r
bind = $mainMod SHIFT, K,       scroller:movewindow,    u
bind = $mainMod SHIFT, J,       scroller:movewindow,    d

# ── Column management ─────────────────────────────────────────────────────────
# Admit window into adjacent column (left or right)
bind = $mainMod CTRL, left,     scroller:admitwindow
bind = $mainMod CTRL, H,        scroller:admitwindow

# Expel window out of column into its own column
bind = $mainMod CTRL, right,    scroller:expelwindow
bind = $mainMod CTRL, L,        scroller:expelwindow

# ── Column width control ──────────────────────────────────────────────────────
# Cycle through width presets
bind = $mainMod, bracketleft,   scroller:setwidth,      onethird
bind = $mainMod, bracketright,  scroller:setwidth,      twothirds
bind = $mainMod, backslash,     scroller:setwidth,      one
bind = $mainMod, equal,         scroller:setwidth,      onehalf

# ── Fit/align columns ────────────────────────────────────────────────────────
# Fit all columns to screen width
bind = $mainMod, F,             scroller:fitwidth,      toscreen
# Center viewport on focused column
bind = $mainMod, C,             scroller:alignwindow,   center
# Align to screen edge
bind = $mainMod SHIFT, C,       scroller:alignwindow,   left

# ── Jump to column edges ──────────────────────────────────────────────────────
bind = $mainMod, Home,          scroller:movefocus,     begin
bind = $mainMod, End,           scroller:movefocus,     end

# ── Overview ──────────────────────────────────────────────────────────────────
bind = $mainMod, Tab,           scroller:toggleoverview

# ── Marks ─────────────────────────────────────────────────────────────────────
# Set mark on current window
bind = $mainMod, m,             scroller:setmark, A
# Jump to marked window
bind = $mainMod ALT, m,         scroller:jumptomark, A

# ══════════════════════════════════════════════════════════════════════════════
# EOF — hyprscroller.conf
# Status:  hyprctl plugin list | grep hyprscroller
