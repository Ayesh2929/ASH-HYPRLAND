# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Hyprexpo Plugin Configuration                    ║
# ║                                                                              ║
# ║  Official Hyprland expose/overview plugin. Renders a live grid of all      ║
# ║  workspaces with real window previews. Click to teleport, scroll to        ║
# ║  browse, keyboard navigate the full workspace landscape.                    ║
# ║                                                                              ║
# ║  Repo:     https://github.com/hyprwm/hyprland-plugins                      ║
# ║  Install:  hyprpm add https://github.com/hyprwm/hyprland-plugins           ║
# ║            hyprpm enable hyprexpo                                           ║
# ║  Plugin:   plugin = ~/.local/share/hyprpm/plugins/hyprexpo.so              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  PLUGIN LOAD
# ══════════════════════════════════════════════════════════════════════════════

plugin = ~/.local/share/hyprpm/plugins/hyprexpo.so

# ══════════════════════════════════════════════════════════════════════════════
# §02  HYPREXPO CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

plugin {
    hyprexpo {

        # ── Grid layout ───────────────────────────────────────────────────────
        # Number of columns in the workspace grid
        # 5 = 5×2 for 10 workspaces (recommended for standard setup)
        # 3 = 3×4 for 12 workspaces
        # 0 = auto (square-ish grid)
        columns                  = 5

        # Gap between workspace panels (px)
        gap_size                 = 6

        # ── Background ────────────────────────────────────────────────────────
        # Background color visible behind the grid
        bg_col                   = rgba(11111bef)

        # ── Workspace method ──────────────────────────────────────────────────
        # How to position/focus the view when entering expo
        # first         — always show workspace 1
        # center current — center on current workspace
        # center previous — center on previously active workspace
        workspace_method         = center current

        # ── Drop shadow ───────────────────────────────────────────────────────
        enable_shadows           = true
        shadow_color             = rgba(00000070)

        # ── Panel rounding ────────────────────────────────────────────────────
        panel_rounding           = 12

        # ── Workspace name rendering ──────────────────────────────────────────
        draw_ws_names            = true
        workspace_text_font      = JetBrainsMono Nerd Font Bold
        workspace_text_size      = 14

        # ── Hide empty workspaces ─────────────────────────────────────────────
        # false = show all 10 workspace slots (consistent grid)
        # true  = only show occupied workspaces (dynamic grid)
        hide_empty               = false

        # ── Interaction ───────────────────────────────────────────────────────
        # Middle click closes focused window in overview
        # Right click opens context menu (if supported)
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# §03  HYPREXPO KEYBINDS
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle overview ───────────────────────────────────────────────────────────
bind = $mainMod,        grave,      hyprexpo:expo,  toggle
bind = $mainMod,        Tab,        hyprexpo:expo,  toggle
bind = $mainMod SHIFT,  Tab,        hyprexpo:expo,  toggle

# ── Force open/close ──────────────────────────────────────────────────────────
bind = $mainMod ALT,    e,          hyprexpo:expo,  open
bind = $mainMod ALT SHIFT, e,       hyprexpo:expo,  close

# ── 4-finger swipe up → overview (via hyprgrass gesture) ─────────────────────
bindgesture = swipe:4:u,            hyprexpo:expo,  toggle

# ══════════════════════════════════════════════════════════════════════════════
# §04  LAYER RULES — HYPREXPO OVERLAY
# ══════════════════════════════════════════════════════════════════════════════

layerrule = blur,           hyprexpo
layerrule = xray 0,         hyprexpo
layerrule = ignorezero,     hyprexpo
layerrule = ignorealpha 0.05, hyprexpo
layerrule = animation fade, hyprexpo
layerrule = dimaround,      hyprexpo

# ══════════════════════════════════════════════════════════════════════════════
# EOF — hyprexpo.conf
# Toggle:  Super+` (grave)  OR  Super+Tab
# Status:  hyprctl plugin list | grep hyprexpo
# ══════════════════════════════════════════════════════════════════════════════