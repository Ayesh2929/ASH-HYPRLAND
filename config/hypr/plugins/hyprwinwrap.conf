# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Hyprwinwrap Plugin Configuration                 ║
# ║                                                                              ║
# ║  Embeds any window behind all surfaces as a live wallpaper/background.     ║
# ║  Power: run CAVA visualizer, mpv video, shadertoy GLSL, or live stats      ║
# ║  as your wallpaper — fully interactive if desired.                          ║
# ║                                                                              ║
# ║  Repo:     https://github.com/hyprwm/hyprland-plugins                      ║
# ║  Install:  hyprpm add https://github.com/hyprwm/hyprland-plugins           ║
# ║            hyprpm enable hyprwinwrap                                        ║
# ║  Plugin:   plugin = ~/.local/share/hyprpm/plugins/hyprwinwrap.so           ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  PLUGIN LOAD
# ══════════════════════════════════════════════════════════════════════════════

plugin = ~/.local/share/hyprpm/plugins/hyprwinwrap.so

# ══════════════════════════════════════════════════════════════════════════════
# §02  HYPRWINWRAP CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

plugin {
    hyprwinwrap {

        # ── Target window class ───────────────────────────────────────────────
        # Windows with this class will be embedded as wallpaper.
        # Launch target app with: --class ash-background
        class                    = ash-background

        # ── Multiple wrap targets ─────────────────────────────────────────────
        # Uncomment to support additional classes:
        # class                  = kitty-background
        # class                  = mpv-background
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# §03  BACKGROUND WINDOW RULES
#      These rules ensure the wrapped window behaves as wallpaper
# ══════════════════════════════════════════════════════════════════════════════

windowrulev2 = noblur,          class:^(ash-background)$
windowrulev2 = noanim,          class:^(ash-background)$
windowrulev2 = noshadow,        class:^(ash-background)$
windowrulev2 = noborder,        class:^(ash-background)$
windowrulev2 = nofocus,         class:^(ash-background)$
windowrulev2 = noinitialfocus,  class:^(ash-background)$
windowrulev2 = opacity 1.0 1.0, class:^(ash-background)$
windowrulev2 = pin,             class:^(ash-background)$
windowrulev2 = fullscreen,      class:^(ash-background)$
windowrulev2 = noanim,          class:^(ash-background)$
windowrulev2 = size 100% 100%,  class:^(ash-background)$

# ══════════════════════════════════════════════════════════════════════════════
# §04  BACKGROUND PRESETS
#      Uncomment the background preset to use.
#      Only ONE should be active at a time.
# ══════════════════════════════════════════════════════════════════════════════

# ── CAVA audio visualizer as wallpaper ───────────────────────────────────────
# exec-once = kitty \
#     --class ash-background \
#     --override background_opacity=0.0 \
#     --override font_size=8.0 \
#     --override remember_window_size=no \
#     --override background=#00000000 \
#     -e cava

# ── MPV looping video wallpaper ───────────────────────────────────────────────
# exec-once = mpv \
#     --wid=0 \
#     --loop-file=inf \
#     --mute \
#     --no-osc \
#     --no-input-default-bindings \
#     --class=ash-background \
#     --video-unscaled=no \
#     ~/Videos/Wallpapers/my-wallpaper.mp4

# ── Shadertoy / GLSL shader wallpaper ─────────────────────────────────────────
# exec-once = shadertoy-renderer \
#     --class ash-background \
#     --shader ~/.config/hypr/shaders/matrix-rain.frag

# ── btop system monitor as wallpaper ─────────────────────────────────────────
# exec-once = kitty \
#     --class ash-background \
#     --override background_opacity=0.0 \
#     --override font_size=7.0 \
#     -e btop

# ── Animated fractal (terminal) ───────────────────────────────────────────────
# exec-once = kitty \
#     --class ash-background \
#     --override background_opacity=0.0 \
#     -e asciiquarium

# ══════════════════════════════════════════════════════════════════════════════
# §05  BACKGROUND TOGGLE BIND
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle CAVA background ────────────────────────────────────────────────────
bind = $hyperMod,       b,      exec, \
    if hyprctl -j clients | jq -e '.[] | select(.class == "ash-background")' > /dev/null 2>&1; then \
        hyprctl dispatch closewindow "class:ash-background" && \
        notify-send "ASH" "Live wallpaper stopped" --expire-time=2000; \
    else \
        kitty --class ash-background \
              --override background_opacity=0.0 \
              --override font_size=8.0 \
              -e cava & \
        notify-send "ASH" "Live wallpaper started: CAVA" --expire-time=2000; \
    fi

# ══════════════════════════════════════════════════════════════════════════════
# EOF — hyprwinwrap.conf
# Status:  hyprctl plugin list | grep hyprwinwrap
# Check:   hyprctl clients | jq '.[] | select(.class == "ash-background")'
# ══════════════════════════════════════════════════════════════════════════════