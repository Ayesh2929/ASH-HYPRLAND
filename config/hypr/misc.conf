# ══════════════════════════════════════════════════════════════════════════════
# §01  MISC FORMAT REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  misc {
#    ── Rendering & Performance ─────────────────────────────────────────────────
#    vfr                    BOOL    — Variable Frame Rate (reduces GPU idle load)
#    vrr                    N       — 0=off 1=fullscreen-VRR 2=always-VRR
#    render_ahead_of_time   BOOL    — speculative rendering (reduces latency)
#    render_ahead_safezone  N       — ms safety margin for render ahead
#    render_unfocused_fps   N       — fps cap for unfocused windows
#    no_direct_scanout      BOOL    — disable DRM direct scanout
#
#    ── DPMS (Display Power Management) ─────────────────────────────────────────
#    mouse_move_enables_dpms BOOL   — wake monitors on mouse move
#    key_press_enables_dpms  BOOL   — wake monitors on key press
#
#    ── Window Behavior ──────────────────────────────────────────────────────────
#    always_follow_on_dnd   BOOL    — follow window on drag-and-drop
#    focus_on_activate      BOOL    — steal focus when app requests activation
#    animate_manual_resizes BOOL    — animate windows being manually resized
#    animate_mouse_windowdragging BOOL — animate windows being dragged
#    enable_swallow         BOOL    — terminal swallowing
#    swallow_regex          REGEX   — terminals that support swallowing
#    swallow_exception_regex REGEX  — apps that prevent swallowing
#    new_window_takes_over_fullscreen N — 0=no 1=unfullscreen 2=kill fullscreen
#    exit_window_retains_fullscreen BOOL — keep fullscreen after child closes
#    close_special_on_empty BOOL    — close special ws when last window leaves
#    initial_workspace_tracking N   — 0=off 1=remember 2=remember+follow
#    groupbar_gradients     BOOL    — enable groupbar gradient colors
#
#    ── Cursor ───────────────────────────────────────────────────────────────────
#    cursor_zoom_factor     N       — cursor magnification (experimental)
#    cursor_zoom_rigid      BOOL    — zoom centered on cursor
#    middle_click_paste     BOOL    — middle click pastes selection clipboard
#    hide_cursor_on_touch   BOOL    — hide cursor when touch input detected
#    mouse_move_focuses_monitor BOOL — move focus to monitor cursor enters
#
#    ── Splash Screen ────────────────────────────────────────────────────────────
#    disable_splash_rendering BOOL  — disable Hyprland startup splash
#    splash_font_family     STRING  — font for splash text
#    force_default_wallpaper N      — -1=random, 0=none, 1-3=built-in
#
#    ── Session ──────────────────────────────────────────────────────────────────
#    suppress_portal_warnings BOOL  — suppress XDG portal warnings
#    allow_session_lock_restore BOOL — allow session lock after vt-switch
#    background_color       COLOR   — fallback color when no wallpaper set
#  }
#
# ══════════════════════════════════════════════════════════════════════════════
# §02  RENDERING & PERFORMANCE
# ══════════════════════════════════════════════════════════════════════════════

misc {

    # ── Variable Frame Rate ───────────────────────────────────────────────────
    # VFR reduces GPU usage when nothing is moving by dropping to lower fps.
    # Highly recommended for battery life on laptops.
    # Disable only if you notice stuttering with specific apps.
    vfr                          = true

    # ── Variable Refresh Rate (hardware sync) ─────────────────────────────────
    # Requires: monitor with G-Sync/FreeSync/Adaptive-Sync support
    # 0 = disabled (stable, works everywhere)
    # 1 = enabled only when a fullscreen window is present (gaming)
    # 2 = always enabled (best smoothness, may cause issues on some setups)
    vrr                          = 1

    # ── Speculative rendering (render-ahead) ──────────────────────────────────
    # Pre-renders the next frame to reduce latency at cost of GPU power.
    # Best for: gaming, interactive demos
    # Disable for: battery saving, if artifacts appear
    render_ahead_of_time         = false
    render_ahead_safezone        = 1           # ms — safety margin

    # ── Unfocused window render cap ───────────────────────────────────────────
    # Limits FPS of background windows (saves GPU/CPU significantly)
    # 0 = unlimited, 15 = good balance, 30 = smooth background video
    render_unfocused_fps         = 15

    # ── Direct scanout ────────────────────────────────────────────────────────
    # Allows fullscreen windows to bypass compositor (lowest latency for games)
    # Disable if fullscreen games show artifacts or black screens
    no_direct_scanout            = false

    # ══════════════════════════════════════════════════════════════════════════
    # §03  DPMS — DISPLAY POWER MANAGEMENT
    # ══════════════════════════════════════════════════════════════════════════

    # Wake all monitors when mouse moves (after hypridle dims them)
    mouse_move_enables_dpms      = true

    # Wake all monitors on any key press
    key_press_enables_dpms       = true

    # ══════════════════════════════════════════════════════════════════════════
    # §04  WINDOW BEHAVIOR
    # ══════════════════════════════════════════════════════════════════════════

    # ── Drag and drop follow ──────────────────────────────────────────────────
    # Follow cursor to new monitor when dragging a window across monitors
    always_follow_on_dnd         = true

    # ── Layer keyboard focus ──────────────────────────────────────────────────
    # Allow layershell surfaces (bars, menus) to capture keyboard focus
    layers_hog_keyboard_focus    = true

    # ── Focus stealing prevention ─────────────────────────────────────────────
    # false = apps cannot steal focus by calling activate/focus requests
    # true  = apps CAN steal focus (legacy behavior, disruptive)
    # ASH recommendation: false — prevents notification popups stealing focus
    focus_on_activate            = false

    # ── Manual resize animation ───────────────────────────────────────────────
    # Animate windows as you drag their borders to resize
    animate_manual_resizes       = true

    # ── Mouse drag animation ──────────────────────────────────────────────────
    # Animate windows while being dragged by mouse
    animate_mouse_windowdragging = true

    # ── Config auto-reload ────────────────────────────────────────────────────
    # false = Hyprland watches config files and reloads on change
    # true  = manual reload only via `hyprctl reload`
    disable_autoreload           = false

    # ══════════════════════════════════════════════════════════════════════════
    # §05  TERMINAL WINDOW SWALLOWING
    # ══════════════════════════════════════════════════════════════════════════
    #
    #  When you launch a GUI app from terminal, the terminal "swallows" itself
    #  (hides) until the app closes, then reappears. Keeps workspace clean.
    #
    #  Example: $ mpv video.mp4
    #  → kitty disappears, mpv appears. When mpv closes, kitty reappears.

    enable_swallow               = true

    # Terminals that support swallowing (regex against wm_class)
    swallow_regex                = ^(kitty|foot|alacritty|wezterm|ghostty|st|urxvt)$

    # Apps that should NOT trigger swallowing even if launched from terminal
    # (File managers, other terminals, TUI apps you want to keep visible)
    swallow_exception_regex      = ^(mpv|imv|feh|swayimg|qimgv|eog|ristretto|gimp|inkscape|blender|godot|obs|steam)$

    # ══════════════════════════════════════════════════════════════════════════
    # §06  FULLSCREEN MANAGEMENT
    # ══════════════════════════════════════════════════════════════════════════

    # Behavior when a new window opens while another is fullscreen:
    # 0 = new window opens beneath fullscreen (fullscreen stays)
    # 1 = current window exits fullscreen, new window opens normally
    # 2 = fullscreen window is closed/killed to make room
    new_window_takes_over_fullscreen = 2

    # When the child/spawned window closes, does the parent stay fullscreen?
    exit_window_retains_fullscreen   = false

    # ══════════════════════════════════════════════════════════════════════════
    # §07  SPECIAL WORKSPACE BEHAVIOR
    # ══════════════════════════════════════════════════════════════════════════

    # Automatically close special workspace when its last window is moved away
    close_special_on_empty       = true

    # ══════════════════════════════════════════════════════════════════════════
    # §08  WORKSPACE PERSISTENCE
    # ══════════════════════════════════════════════════════════════════════════

    # Remember which workspace each app was on after restart:
    # 0 = don't remember
    # 1 = remember workspace number
    # 2 = remember workspace + follow to it on focus
    initial_workspace_tracking   = 1

    # ══════════════════════════════════════════════════════════════════════════
    # §09  CURSOR BEHAVIOR
    # ══════════════════════════════════════════════════════════════════════════

    # Middle click pastes the selection (primary) clipboard
    # Set false if you accidentally paste when scrolling
    middle_click_paste           = true

    # Hide hardware cursor when touch input is detected
    # (Clean look on touchscreen tablets)
    hide_cursor_on_touch         = true

    # Moving cursor to a different monitor switches focus to that monitor
    mouse_move_focuses_monitor   = true

    # Cursor magnification (experimental, requires compositor support)
    cursor_zoom_factor           = 1.0      # 1.0 = normal size
    cursor_zoom_rigid            = false    # true = zoom centered, not cursor-relative

    # ══════════════════════════════════════════════════════════════════════════
    # §10  SPLASH & STARTUP
    # ══════════════════════════════════════════════════════════════════════════

    # Disable Hyprland's built-in startup splash screen
    # (ASH shows its own boot animation via AGS/EWW)
    disable_splash_rendering     = false

    # Font for the splash message (empty = JetBrains Mono fallback)
    splash_font_family           = JetBrainsMono Nerd Font

    # Force a specific built-in Hyprland wallpaper on startup
    # -1 = random built-in, 0 = none (use swww/hyprpaper), 1-3 = specific
    # ASH sets wallpaper via swww in autostart.conf, so use 0
    force_default_wallpaper      = 0

    # ══════════════════════════════════════════════════════════════════════════
    # §11  PORTAL & SESSION
    # ══════════════════════════════════════════════════════════════════════════

    # Suppress XDG Desktop Portal version mismatch warnings in logs
    suppress_portal_warnings     = false

    # Allow session lock to be restored after virtual terminal switch
    allow_session_lock_restore   = false

    # ══════════════════════════════════════════════════════════════════════════
    # §12  BACKGROUND & VISUAL FALLBACKS
    # ══════════════════════════════════════════════════════════════════════════

    # Fallback background color shown before wallpaper loads
    # Matches Catppuccin Mocha Crust — seamless with ASH dark themes
    background_color             = rgba(17,17,27,ff)

    # ══════════════════════════════════════════════════════════════════════════
    # §13  GROUP BAR
    # ══════════════════════════════════════════════════════════════════════════

    # Enable gradient rendering in group titlebars
    # (Requires group { groupbar { gradients = true } } in hyprland.conf)
    groupbar_gradients           = true

}

# ══════════════════════════════════════════════════════════════════════════════
# §14  BINDS SETTINGS
#      Controls keybind behavior, timing, and edge cases
# ══════════════════════════════════════════════════════════════════════════════

binds {

    # ── Scroll event debounce ─────────────────────────────────────────────────
    # Minimum ms between scroll-based keybind triggers
    # Prevents double-triggering on high-resolution scroll wheels
    scroll_event_delay           = 300

    # ── Workspace navigation ──────────────────────────────────────────────────
    # Allow toggling back to previous workspace with same key
    workspace_back_and_forth     = true

    # Allow cycling past ws 1/10 to wrap around
    allow_workspace_cycles       = true

    # Which window to center on when switching workspace
    # 0 = last-active window center, 1 = cursor position center
    workspace_center_on          = 1

    # ── Focus preference for directional focus ────────────────────────────────
    # 0 = history-based (most recently active), 1 = geometric (nearest)
    focus_preferred_method       = 0

    # ── Group lock bypass ─────────────────────────────────────────────────────
    # Allow keybinds to work even when window group is locked
    ignore_group_lock            = false

    # ── Fullscreen cycling ────────────────────────────────────────────────────
    # When using movefocus, cycle through fullscreen windows too
    movefocus_cycles_fullscreen  = true

    # ── Group first on movefocus ──────────────────────────────────────────────
    # When focused window is in a group, focus group first before moving out
    movefocus_cycles_groupfirst  = false

    # ── Mouse pass-through when bound ─────────────────────────────────────────
    # If a bind intercepts mouse button, pass event to window too
    pass_mouse_when_bound        = false

    # ── Disable keybind grabbing ──────────────────────────────────────────────
    # Prevents keybinds from capturing input in exclusive input mode apps
    disable_keybind_grabbing     = false

    # ── Monitor fallback for directional focus ────────────────────────────────
    # If no window in direction on current monitor, move to adjacent monitor
    window_direction_monitor_fallback = true
}

# ══════════════════════════════════════════════════════════════════════════════
# §15  XWAYLAND SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

xwayland {
    # Enable XWayland for legacy X11 applications
    enabled                      = true

    # Use nearest-neighbor scaling for X11 apps on HiDPI
    # true  = pixel-perfect crisp (good for old games, retro apps)
    # false = bilinear smooth (better for modern X11 apps)
    use_nearest_neighbor         = true

    # Force X11 apps to render at scale 1 (let compositor upscale)
    # Fixes blur/double-scaling issues on HiDPI with some X11 apps
    force_zero_scaling           = false
}

# ══════════════════════════════════════════════════════════════════════════════
# §16  OPENGL SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

opengl {
    # Nvidia-specific flicker fix (enable only on Nvidia systems)
    # Adds a sleep before buffer swap to prevent screen tearing/flicker
    nvidia_anti_flicker          = true

    # Force introspection (shader analysis for optimization)
    # 0 = off, 1 = always, 2 = Nvidia only
    force_introspection          = 2
}

# ══════════════════════════════════════════════════════════════════════════════
# §17  RENDER SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

render {
    # Explicit synchronization (reduces tearing, improves frame pacing)
    # 0 = off, 1 = force on, 2 = auto-detect
    explicit_sync                = 2

    # Explicit sync for KMS/DRM layer
    explicit_sync_kms            = 2

    # Direct scanout bypass for fullscreen windows (lower latency)
    direct_scanout               = false

    # Expand textures that are smaller than screen to fill
    expand_undersized_textures   = true

    # Unload complex shaders when no longer in use (saves VRAM)
    unload_heavy_shaders         = true

    # CTM (Color Transform Matrix) animation for color corrections
    # 0 = instant, 1 = direct, 2 = smooth fading transition
    ctm_animation                = 2

    # Color management support
    cm_enabled                   = true

    # Fullscreen HDR/color passthrough
    # 0 = always remap, 1 = never passthrough, 2 = auto (passthrough when safe)
    cm_fs_passthrough            = 2
}

# ══════════════════════════════════════════════════════════════════════════════
# §18  CURSOR SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

cursor {
    # ── Hardware cursor ───────────────────────────────────────────────────────
    # false = use hardware cursor plane (best performance)
    # true  = software cursor (fix for Nvidia/PRIME setups)
    no_hardware_cursors          = false

    # Don't break VRR when cursor is on screen
    no_break_fs_vrr              = false

    # Minimum refresh rate when cursor is static (VFR mode)
    min_refresh_rate             = 24

    # Padding between cursor hotspot and window border
    hotspot_padding              = 1

    # Seconds of inactivity before cursor auto-hides
    # 0 = never hide, 5 = hide after 5s, 10 = comfortable for most
    inactive_timeout             = 8

    # Prevent cursor from warping to newly focused windows
    no_warps                     = false

    # Keep cursor warp position between sessions
    persistent_warps             = false

    # Warp cursor to center of workspace when switching
    warp_on_change_workspace     = false

    # Default monitor for cursor spawn (empty = last active)
    default_monitor              =

    # Cursor magnification (1.0 = normal)
    zoom_factor                  = 1.0
    zoom_rigid                   = false

    # Enable HyprCursor format (required for ASH cursor themes)
    enable_hyprcursor            = true

    # Hide cursor on key press (useful for presentations/typing focus)
    hide_on_key_press            = false

    # Hide cursor when touch input detected
    hide_on_touch                = true

    # Allow sub-optimal copy for cursors (minor quality trade-off for speed)
    allow_dumb_copy              = false

    # CPU/GPU buffer preference for cursor rendering
    # 0 = auto, 1 = force CPU, 2 = force GPU
    use_cpu_buffer               = 0
}

# ══════════════════════════════════════════════════════════════════════════════
# §19  ECOSYSTEM (Hyprland network features)
# ══════════════════════════════════════════════════════════════════════════════

ecosystem {
    # Show update available notification in Hyprland
    no_update_news               = false

    # Show donation suggestion notification
    no_donation_nag              = false
}

# ══════════════════════════════════════════════════════════════════════════════
# §20  DEBUG SETTINGS (production = minimal logging)
# ══════════════════════════════════════════════════════════════════════════════

debug {
    # ── Overlays ──────────────────────────────────────────────────────────────
    # Render debug overlay showing render times, damage regions, etc.
    overlay                      = false

    # Flash damaged screen regions red (shows what compositor is redrawing)
    damage_blink                 = false

    # ── Logging ───────────────────────────────────────────────────────────────
    # Disable most log output in production (enable for troubleshooting)
    disable_logs                 = true

    # Disable timestamp prefix in logs
    disable_time                 = true

    # Mirror logs to stdout (journalctl captures by default)
    enable_stdout_logs           = false

    # Color-code stdout logs (requires enable_stdout_logs = true)
    colored_stdout_logs          = true

    # ── Safety ────────────────────────────────────────────────────────────────
    # Watchdog timeout — kill compositor if it hangs > N seconds
    watchdog_timeout             = 5

    # Don't validate monitor scale values (useful for fractional scaling debug)
    disable_scale_checks         = false

    # Where to show error messages (0 = bottom-left of screen)
    error_position               = 0

    # Suppress non-critical errors from being displayed
    suppress_errors              = false

    # Trigger manual crash (for testing crash handler — DO NOT SET IN PROD)
    manual_crash                 = 0
}

