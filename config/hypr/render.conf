# ══════════════════════════════════════════════════════════════════════════════
# §01  RENDER FORMAT REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  render {
#    direct_scanout              BOOL  — present fullscreen buffers straight to
#                                        the display, bypassing the compositor.
#                                        Cheapest path, but the usual culprit for
#                                        tearing and black screens on some GPUs.
#    expand_undersized_textures  BOOL  — upscale textures that are smaller than
#                                        the surface they're drawn on
#    xp_mode                     BOOL  — allow XWayland to use real pixel formats
#                                        (needed by some legacy GL apps)
#    ctm_animation               BOOL  — animate colour-transformation-matrix
#                                        changes instead of snapping
#    use_fp16                    BOOL  — 16-bit colour pipeline; lower bandwidth,
#                                        small risk of banding
#    cm_enabled                  BOOL  — colour management (ICC / HDR)
#  }
#
# ══════════════════════════════════════════════════════════════════════════════
# §02  WHY EVERYTHING HERE IS COMMENTED OUT
# ══════════════════════════════════════════════════════════════════════════════
#
#  Hyprland's available render keys differ between versions, and an unknown key
#  produces a config warning on every start. More importantly, scanout defaults
#  have changed across releases, so pinning a value here would silently override
#  a faster default on newer builds.
#
#  The ASH default is therefore "let Hyprland decide", with the knobs documented
#  below so tuning is a one-line uncomment rather than a search.

# ── Default: no overrides ────────────────────────────────────────────────────
# render {
# }

# ══════════════════════════════════════════════════════════════════════════════
# §03  COMMON FIXES  (uncomment the block you need)
# ══════════════════════════════════════════════════════════════════════════════

# ── Screen tearing / stutter in fullscreen video or games ────────────────────
#  Direct scanout is the usual cause. Disabling it costs a little GPU time but
#  routes every frame through the compositor, which removes the tearing.
#
# render {
#     direct_scanout = 0
# }
#
#  Also worth trying, in order:
#    1. misc { vrr = 0 }                       # disable variable refresh
#    2. windowrulev2 = immediate, class:^(game)$   # per-game, in windowrules.conf
#    3. opengl.conf §09 for the driver-level fixes

# ── Black screen after login / on wake ───────────────────────────────────────
#  Try in this order:
#    1. env = WLR_DRM_DEVICES, /dev/dri/card0   (in env.conf — pick the right card)
#    2. env = WLR_RENDERER, gles2               (force the GLES2 renderer)
#    3. render { direct_scanout = 0 }           (below)
#
# render {
#     direct_scanout = 0
# }

# ── Banding in gradients, wallpapers or video ────────────────────────────────
#  The 10-bit pipeline removes most banding on capable displays.
#
# render {
#     use_fp16 = true
# }

# ── Legacy GL app renders a black or garbled window (XWayland) ───────────────
# render {
#     xp_mode = true
#     expand_undersized_textures = true
# }

# ── Colour management / HDR display ──────────────────────────────────────────
#  Requires a calibrated profile; see `ash theme wcag` for contrast checks.
#
# render {
#     cm_enabled = true
#     ctm_animation = true
# }

# ══════════════════════════════════════════════════════════════════════════════
# §04  DIAGNOSTICS
# ══════════════════════════════════════════════════════════════════════════════
#
#  hyprctl systeminfo              → GPU, driver, renderer in use
#  hyprctl getoption render:direct_scanout
#                                  → effective value of a render option
#  hyprctl reload                  → apply changes without restarting
#
#  ASH equivalents:
#     ash hw                       → detected GPU and capability summary
#     ash doctor                   → flags renderer/driver mismatches
