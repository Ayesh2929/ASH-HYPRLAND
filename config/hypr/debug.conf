# ══════════════════════════════════════════════════════════════════════════════
# §01  DEBUG FORMAT REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  debug {
#    overlay             BOOL  — render compositor debug overlay (FPS, damage)
#    damage_blink        BOOL  — flash redrawn screen regions red/green
#    disable_logs        BOOL  — suppress most log output
#    disable_time        BOOL  — remove timestamps from log entries
#    enable_stdout_logs  BOOL  — mirror journal logs to stdout
#    colored_stdout_logs BOOL  — ANSI colors in stdout log output
#    manual_crash        N     — intentional crash trigger (0=off, 1=SIGSEGV)
#    suppress_errors     BOOL  — hide error popups on-screen
#    watchdog_timeout    N     — seconds before watchdog kills compositor
#    disable_scale_checks BOOL — skip monitor scale validation
#    error_position      N     — screen corner for error display (0-3)
#  }
#
#  ── Log levels (controlled via HYPRLAND_LOG env var) ─────────────────────────
#  HYPRLAND_LOG=0    — errors only
#  HYPRLAND_LOG=1    — errors + warnings
#  HYPRLAND_LOG=2    — errors + warnings + info
#  HYPRLAND_LOG=3    — full verbose (very noisy)
#
#  ── Debug IPC commands ────────────────────────────────────────────────────────
#  hyprctl version              — compositor version & build info
#  hyprctl monitors             — monitor list with resolutions/scales
#  hyprctl workspaces           — active workspaces
#  hyprctl clients              — all open windows with class/title/geometry
#  hyprctl layers               — all layer surfaces (bars, overlays)
#  hyprctl devices              — input devices (keyboards, mice, touchpads)
#  hyprctl binds                — active keybindings
#  hyprctl activewindow         — focused window info
#  hyprctl cursorpos            — current cursor position
#  hyprctl animations           — animation state
#  hyprctl instances            — running Hyprland instances
#  hyprctl plugin list          — loaded plugins
#  hyprctl globalshortcuts      — registered global shortcuts
#  hyprctl systeminfo           — full system info dump
#  hyprctl rollinglog           — last N log lines (rolling buffer)
#  hyprctl crash                — intentional crash for testing
#
# ══════════════════════════════════════════════════════════════════════════════
# §02  PRODUCTION DEBUG SETTINGS (safe defaults)
# ══════════════════════════════════════════════════════════════════════════════

debug {

    # ── Visual overlays (OFF in production) ──────────────────────────────────
    # Renders FPS counter, render time, and damage rectangles on screen
    overlay                  = false

    # Flash redrawn regions: red = scheduled redraw, green = actual damage
    # Useful for identifying unnecessary redraws and performance bottlenecks
    damage_blink             = false

    # ── Logging (minimal in production) ──────────────────────────────────────
    # Disable verbose logs (errors still appear in journal)
    disable_logs             = true

    # Remove timestamp prefix from each log line
    disable_time             = true

    # Don't mirror logs to stdout (journalctl handles it)
    enable_stdout_logs       = false

    # Use ANSI color codes in stdout log output
    colored_stdout_logs      = true

    # ── Safety & stability ────────────────────────────────────────────────────
    # Watchdog timeout: kill and restart compositor if frozen for N seconds
    # Lower = faster recovery, Higher = more tolerance for heavy loads
    watchdog_timeout         = 5

    # Skip monitor scale validation (useful for non-standard fractional scales)
    disable_scale_checks     = false

    # Suppress on-screen error popup overlays
    suppress_errors          = false

    # Position of error display on screen (0=bottom-left, 1=top-left, 2=top-right, 3=bottom-right)
    error_position           = 0

    # ── Crash testing (NEVER enable in production) ────────────────────────────
    # 0 = disabled, 1 = crash on next render cycle (SIGSEGV)
    manual_crash             = 0
}

