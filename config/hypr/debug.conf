# ══════════════════════════════════════════════════════════════════════════════
# §04  ASH DEBUG COMMANDS
#      Wrappers around hyprctl + journalctl for easy debugging
# ══════════════════════════════════════════════════════════════════════════════

# ── Quick commands (run in terminal) ─────────────────────────────────────────
#
#  ash debug overlay on/off          — toggle debug overlay
#  ash debug damage on/off           — toggle damage blink
#  ash debug logs tail               — tail Hyprland journal logs
#  ash debug logs grep PATTERN       — search logs for pattern
#  ash debug clients                 — pretty-print all window info
#  ash debug layers                  — pretty-print all layer surfaces
#  ash debug monitors                — monitor info with color coding
#  ash debug devices                 — input device list
#  ash debug binds                   — keybind table
#  ash debug perf                    — enable performance profiling
#  ash debug verbose                 — enable verbose logging
#  ash debug reset                   — restore production debug settings

# ══════════════════════════════════════════════════════════════════════════════
# §05  HYPRLAND IPC MONITORING
#      Real-time event stream for debugging window/workspace events
# ══════════════════════════════════════════════════════════════════════════════

# ── Connect to Hyprland IPC socket ───────────────────────────────────────────
# socat - UNIX-CONNECT:$XDG_RUNTIME_DIR/hypr/$HYPRLAND_INSTANCE_SIGNATURE/.socket2.sock

# ── Event types emitted on socket2 ───────────────────────────────────────────
# workspace>>N              — workspace switch
# workspacev2>>N,name       — workspace switch with name
# focusedmon>>MON,WS        — monitor focus change
# activewindow>>CLASS,TITLE — active window changed
# activewindowv2>>ADDR      — active window (address)
# fullscreen>>0|1           — fullscreen state change
# monitorremoved>>MON       — monitor disconnected
# monitoradded>>MON         — monitor connected
# createworkspace>>N        — workspace created
# destroyworkspace>>N       — workspace destroyed
# moveworkspace>>N,MON      — workspace moved to monitor
# renameworkspace>>N,NAME   — workspace renamed
# activespecial>>NAME,MON   — special workspace toggled
# activelayout>>KB,LAYOUT   — keyboard layout changed
# openwindow>>ADDR,WS,CLASS,TITLE — window opened
# closewindow>>ADDR         — window closed
# movewindow>>ADDR,WS       — window moved to workspace
# openlayer>>NS             — layer surface opened
# closelayer>>NS            — layer surface closed
# submap>>NAME              — submap activated
# changefloatingmode>>ADDR,0|1 — window float state changed
# urgent>>ADDR              — window requested urgent attention
# minimize>>ADDR,0|1        — window minimized
# screencast>>0|1,OWNER     — screen capture started/stopped
# windowtitle>>ADDR         — window title changed
# ignoredeltathreshold      — input threshold crossed
# configreloaded            — config file reloaded
# pin>>ADDR,0|1             — window pin state changed

