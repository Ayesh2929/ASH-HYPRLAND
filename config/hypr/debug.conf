# ══════════════════════════════════════════════════════════════════════════════
# §07  LOG FILTERING RECIPES
#      Useful journalctl filters for targeted debugging
# ══════════════════════════════════════════════════════════════════════════════

# ── All Hyprland logs ─────────────────────────────────────────────────────────
# journalctl -f -t hyprland

# ── Errors only ───────────────────────────────────────────────────────────────
# journalctl -f -t hyprland -p err

# ── Window events ─────────────────────────────────────────────────────────────
# journalctl -f -t hyprland | grep -iE "window|client|class"

# ── Animation events ──────────────────────────────────────────────────────────
# journalctl -f -t hyprland | grep -iE "anim|bezier|frame"

# ── Input events ──────────────────────────────────────────────────────────────
# journalctl -f -t hyprland | grep -iE "input|key|mouse|touch|gesture"

# ── Render pipeline ───────────────────────────────────────────────────────────
# journalctl -f -t hyprland | grep -iE "render|damage|gl|shader|gpu"

# ── Plugin logs ───────────────────────────────────────────────────────────────
# journalctl -f -t hyprland | grep -iE "plugin|hyprpm"

# ── IPC calls ─────────────────────────────────────────────────────────────────
# journalctl -f -t hyprland | grep -iE "ipc|dispatch|keyword"

# ── Config loading ────────────────────────────────────────────────────────────
# journalctl -f -t hyprland | grep -iE "config|source|parse|reload"

# ── Monitor events ────────────────────────────────────────────────────────────
# journalctl -f -t hyprland | grep -iE "monitor|output|dpms|vrr"

# ── Full session log since last boot ─────────────────────────────────────────
# journalctl -b -t hyprland > ~/hyprland-session.log

# ══════════════════════════════════════════════════════════════════════════════
# §08  COMMON DEBUG SCENARIOS
# ══════════════════════════════════════════════════════════════════════════════

# ── Blank/black screen after wake ────────────────────────────────────────────
# hyprctl dispatch dpms on
# hyprctl monitors → check if outputs are active

# ── Window not responding to rules ───────────────────────────────────────────
# hyprctl clients | grep -A10 "CLASS_NAME"
# Check: class vs initialClass, title regex, xwayland status

# ── High GPU usage idle ───────────────────────────────────────────────────────
# Enable: debug { damage_blink = true }
# Look for constant red flashing → unnecessary redraws
# Common cause: animated wallpaper, CAVA visualizer, blinking cursor in term

# ── Animation stuttering ──────────────────────────────────────════════════────
# Enable: debug { overlay = true }
# Monitor FPS drops during animation
# Check: animations { enabled = false } → if stutter gone, it's animation
# Try: lower animation speed values or switch to snappy preset

# ── Cursor invisible on Nvidia ────────────────────────────────────────────────
# cursor { no_hardware_cursors = true }
# env = WLR_NO_HARDWARE_CURSORS, 1

# ── Apps not scaling correctly (XWayland) ────────────────────────────────────
# hyprctl clients | grep -E "xwayland|class"
# xdpyinfo | grep resolution → check reported DPI
# Try: xwayland { force_zero_scaling = true }

# ── Keybind not triggering ────────────────────────────────────────────────────
# hyprctl binds | grep -i "KEY_NAME"
# xev -event keyboard → identify exact key/modifiers
# Check: binds { resolve_binds_by_sym = true/false }

# ── Memory leak investigation ─────────────────────────────────────────────────
# watch -n2 'hyprctl systeminfo | grep -E "mem|pid"'
# valgrind --leak-check=full hyprland (dev builds only)

