# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Workspace Rules Configuration                    ║
# ║                                                                              ║
# ║  Per-workspace behavior, layout, gaps, border, animation, persistence,      ║
