# ══════════════════════════════════════════════════════════════════════════════
# §01  WORKSPACE RULE FORMAT REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  workspace = SELECTOR, RULE[, RULE...]
#
#  ── SELECTOR types ───────────────────────────────────────────────────────────
#   N                    — workspace number (1-based)
#   name:NAME            — named workspace
#   special:NAME         — special (scratchpad) workspace
#   m[monitor]:NAME      — workspaces on specific monitor
#   r[previous]          — relative workspace
#   empty                — any empty workspace
#
#  ── Persistent & Lifecycle Rules ─────────────────────────────────────────────
#   persistent [true|false]   — keep workspace alive even when empty
#   default [true|false]      — set as default for its monitor
#   on-created-empty:CMD      — run CMD when workspace created empty
#
#  ── Layout Rules ─────────────────────────────────────────────────────────────
#   layoutopt:layout:VALUE    — override layout (dwindle|master)
#   layoutopt:orientation:VALUE — master orientation (left|right|top|bottom)
#   layoutopt:mfact:N         — master area factor
#   layoutopt:nodimwindows:1  — don't dim windows on this workspace
#
#  ── Visual Rules ─────────────────────────────────────────────────────────────
#   gapsin:N              — inner gap override (px)
#   gapsout:N             — outer gap override (px)
#   bordersize:N          — border width override
#   border [true|false]   — enable/disable borders
#   shadow [true|false]   — enable/disable shadows
#   rounding [true|false] — enable/disable rounding
#   decorate [true|false] — enable/disable all decoration
#
#  ── Behavior Rules ───────────────────────────────────────────────────────────
#   monitor:NAME          — pin workspace to monitor
#   defaultName:NAME      — set display name in bars
#
# ══════════════════════════════════════════════════════════════════════════════
# §02  WORKSPACE ICON MAP (for Waybar / bars)
# ══════════════════════════════════════════════════════════════════════════════
#
#  WS 1  →  󰆍  Terminal     (nf-md-console)
#  WS 2  →  󰖟  Browser      (nf-md-web)
#  WS 3  →  󰅩  Code         (nf-md-code_braces)
#  WS 4  →  󱁉  Files        (nf-md-folder_open)
#  WS 5  →  󰝚  Music        (nf-md-music_note)
#  WS 6  →  󰊗  Gaming       (nf-md-gamepad_variant)
#  WS 7  →  󰙯  Social       (nf-md-chat)
#  WS 8  →  󰍡  Mail         (nf-md-email)
#  WS 9  →  󰙺  Stream/Media (nf-md-video)
#  WS 10 →  󰓅  System       (nf-md-monitor_dashboard)
#
# ══════════════════════════════════════════════════════════════════════════════
# §03  WORKSPACE 1 — TERMINAL / SHELL
# ══════════════════════════════════════════════════════════════════════════════

workspace = 1,
    monitor:DP-1,
    default:true,
    persistent:true,
    layoutopt:layout:dwindle,
    gapsin:4,
    gapsout:12,
    on-created-empty:kitty

# ══════════════════════════════════════════════════════════════════════════════
# §04  WORKSPACE 2 — BROWSER
# ══════════════════════════════════════════════════════════════════════════════

workspace = 2,
    monitor:DP-1,
    persistent:true,
    layoutopt:layout:master,
    layoutopt:orientation:left,
    layoutopt:mfact:0.65,
    gapsin:4,
    gapsout:12,
    on-created-empty:firefox

# ══════════════════════════════════════════════════════════════════════════════
# §05  WORKSPACE 3 — DEVELOPMENT / CODE
# ══════════════════════════════════════════════════════════════════════════════

workspace = 3,
    monitor:DP-1,
    persistent:true,
    layoutopt:layout:dwindle,
    gapsin:4,
    gapsout:12,
    on-created-empty:kitty -e nvim

# ══════════════════════════════════════════════════════════════════════════════
# §06  WORKSPACE 4 — FILE MANAGEMENT
# ══════════════════════════════════════════════════════════════════════════════

workspace = 4,
    monitor:DP-1,
    layoutopt:layout:master,
    layoutopt:orientation:left,
    layoutopt:mfact:0.50,
    gapsin:4,
    gapsout:12,
    on-created-empty:kitty -e yazi

# ══════════════════════════════════════════════════════════════════════════════
# §07  WORKSPACE 5 — MUSIC / AUDIO
# ══════════════════════════════════════════════════════════════════════════════

workspace = 5,
    monitor:DP-1,
    layoutopt:layout:master,
    layoutopt:mfact:0.60,
    gapsin:6,
    gapsout:14,
    on-created-empty:kitty --class music -e ncmpcpp

# ══════════════════════════════════════════════════════════════════════════════
# §08  WORKSPACE 6 — GAMING
# ══════════════════════════════════════════════════════════════════════════════

workspace = 6,
    monitor:DP-1,
    layoutopt:layout:master,
    layoutopt:mfact:1.0,
    gapsin:0,
    gapsout:0,
    border:false,
    shadow:false,
    rounding:false,
    on-created-empty:steam

# ── Gaming workspace: no decoration for maximum performance ───────────────────
# bordersize:0 via windowrule for steam_app_* handles individual games

# ══════════════════════════════════════════════════════════════════════════════
# §09  WORKSPACE 7 — SOCIAL / COMMUNICATION
# ══════════════════════════════════════════════════════════════════════════════

workspace = 7,
    monitor:DP-1,
    layoutopt:layout:master,
    layoutopt:orientation:left,
    layoutopt:mfact:0.55,
    gapsin:4,
    gapsout:12,
    on-created-empty:discord

# ══════════════════════════════════════════════════════════════════════════════
# §10  WORKSPACE 8 — EMAIL / PRODUCTIVITY
# ══════════════════════════════════════════════════════════════════════════════

workspace = 8,
    monitor:DP-1,
    layoutopt:layout:master,
    layoutopt:orientation:left,
    layoutopt:mfact:0.60,
    gapsin:4,
    gapsout:12,
    on-created-empty:thunderbird

# ══════════════════════════════════════════════════════════════════════════════
# §11  WORKSPACE 9 — MEDIA / STREAMING
# ══════════════════════════════════════════════════════════════════════════════

workspace = 9,
    monitor:DP-1,
    layoutopt:layout:master,
    layoutopt:orientation:top,
    layoutopt:mfact:0.70,
    gapsin:4,
    gapsout:12,
    on-created-empty:spotify

# ══════════════════════════════════════════════════════════════════════════════
# §12  WORKSPACE 10 — SYSTEM MONITORING / DEVOPS
# ══════════════════════════════════════════════════════════════════════════════

workspace = 10,
    monitor:DP-1,
    layoutopt:layout:dwindle,
    gapsin:3,
    gapsout:8,
    on-created-empty:kitty --class monitoring -e btop

# ══════════════════════════════════════════════════════════════════════════════
# §13  SPECIAL WORKSPACES (Scratchpads)
# ══════════════════════════════════════════════════════════════════════════════

# ── Main scratchpad ───────────────────────────────────────────────────────────
workspace = special:scratch,
    gapsin:12,
    gapsout:30,
    shadow:true,
    on-created-empty:kitty --class scratch

# ── Music scratchpad ──────────────────────────────────────────────────────────
workspace = special:music,
    gapsin:8,
    gapsout:24,
    on-created-empty:kitty --class music -e ncmpcpp

# ── Notes scratchpad ──────────────────────────────────────────────────────────
workspace = special:notes,
    gapsin:10,
    gapsout:26,
    on-created-empty:obsidian

# ── System monitoring scratchpad ──────────────────────────────────────────────
workspace = special:monitoring,
    gapsin:6,
    gapsout:20,
    on-created-empty:kitty --class monitoring -e btop

# ── Docker / container manager ────────────────────────────────────────────────
workspace = special:docker,
    gapsin:6,
    gapsout:20,
    on-created-empty:kitty --class docker -e lazydocker

# ── Calculator scratchpad ─────────────────────────────────────────────────────
workspace = special:calc,
    gapsin:8,
    gapsout:24,
    on-created-empty:kitty --class calc -e bc -l

# ── Password manager scratchpad ───────────────────────────────────────────────
workspace = special:pass,
    gapsin:8,
    gapsout:24,
    on-created-empty:keepassxc

# ══════════════════════════════════════════════════════════════════════════════
# §14  NAMED WORKSPACE PROFILES (ASH mode overrides)
#      Applied dynamically by: ash mode [game|work|focus|cinema]
# ══════════════════════════════════════════════════════════════════════════════

# ── Game mode: WS 6 goes borderless zero-gap ──────────────────────────────────
# (Applied via ash mode game → hyprctl dispatch)

# ── Focus mode: all workspaces get larger gaps ────────────────────────────────
# workspace = 1, gapsin:10, gapsout:24  (applied dynamically)

# ── Cinema mode: WS 9 gets zero-gap fullscreen optimized ─────────────────────
# workspace = 9, gapsin:0, gapsout:0, border:false (applied dynamically)

# ══════════════════════════════════════════════════════════════════════════════
# §15  MULTI-MONITOR WORKSPACE DISTRIBUTION
#      Uncomment the block matching your monitor setup.
#      Single-monitor setups use §03-§12 above as-is.
# ══════════════════════════════════════════════════════════════════════════════

# ── Dual monitor: eDP-1 (laptop) + HDMI-A-1 (external) ───────────────────────
# workspace = 1,  monitor:eDP-1,    default:true, persistent:true
# workspace = 2,  monitor:eDP-1
# workspace = 3,  monitor:eDP-1
# workspace = 4,  monitor:eDP-1
# workspace = 5,  monitor:eDP-1
# workspace = 6,  monitor:HDMI-A-1, default:true, persistent:true, gapsin:0, gapsout:0, border:false
# workspace = 7,  monitor:HDMI-A-1
# workspace = 8,  monitor:HDMI-A-1
# workspace = 9,  monitor:HDMI-A-1
# workspace = 10, monitor:HDMI-A-1

# ── Triple monitor: DP-1 (center) + DP-2 (left) + DP-3 (right) ──────────────
# workspace = 1,  monitor:DP-1, default:true, persistent:true
# workspace = 2,  monitor:DP-1
# workspace = 3,  monitor:DP-1
# workspace = 4,  monitor:DP-2, default:true
# workspace = 5,  monitor:DP-2
# workspace = 6,  monitor:DP-2, gapsin:0, gapsout:0, border:false
# workspace = 7,  monitor:DP-3, default:true
# workspace = 8,  monitor:DP-3
# workspace = 9,  monitor:DP-3
# workspace = 10, monitor:DP-3

