# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Animations Master Configuration                  ║
# ║                                                                              ║
# ║  Defines all bezier curves, animation presets and the active profile.       ║
# ║  Individual preset files live in animations/                                ║
# ║  Active profile is hot-swapped by: ash mode [game|work|focus|cinema]        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  ANIMATION FORMAT REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  bezier  = NAME, X0, Y0, X1, Y1
#             CSS cubic-bezier format (control points only, P0=0,0 P3=1,1)
#             Tool: https://cubic-bezier.com/
#
#  animation = NAME, ENABLE, SPEED, BEZIER [, STYLE [PARAM]]
#    NAME    — see §02 for full tree
#    ENABLE  — 1=on, 0=off
#    SPEED   — animation speed multiplier (lower=slower, higher=faster)
#              measured in "animation steps" per frame (not milliseconds)
#              approx: steps ≈ frames / (60/speed)
#    BEZIER  — named bezier from above
#    STYLE   — optional style modifier
#    PARAM   — optional style parameter
#
#  ── Animation NAME tree ──────────────────────────────────────────────────────
#   global               — master toggle (inherits to all)
#   │
#   ├── windows          — window open/close/move (inherits windowsIn/Out/Move)
#   │   ├── windowsIn    — window open
#   │   ├── windowsOut   — window close
#   │   └── windowsMove  — window move/resize
#   │
#   ├── fade             — window opacity transitions (inherits all fade*)
#   │   ├── fadeIn       — window appearing
#   │   ├── fadeOut      — window disappearing
#   │   ├── fadeSwitch   — focus switch dimming
#   │   ├── fadeShadow   — shadow fade on focus change
#   │   ├── fadeDim      — inactive window dimming
#   │   ├── fadeLayers   — layer surface fade
#   │   ├── fadeLayersIn — layer appearing
#   │   └── fadeLayersOut— layer disappearing
#   │
#   ├── border           — border color transition animation
#   └── borderangle      — animated gradient border angle
#
#   ├── workspaces       — workspace transitions (inherits workspacesIn/Out)
#   │   ├── workspacesIn — entering workspace
#   │   └── workspacesOut— leaving workspace
#   │
#   ├── specialWorkspace — special ws transitions (inherits specialIn/Out)
#   │   ├── specialWorkspaceIn
#   │   └── specialWorkspaceOut
#   │
#   └── layers           — layer surface transitions (inherits layersIn/Out)
#       ├── layersIn     — layer appearing
#       └── layersOut    — layer disappearing
#
#  ── STYLE values ─────────────────────────────────────────────────────────────
#   slide                — slide from screen edge (default: direction auto)
#   slide top            — from top
#   slide bottom         — from bottom
#   slide left           — from left
#   slide right          — from right
#   slidevert            — slide vertically
#   slidefade N%         — slide + fade combined (N% = travel distance)
#   slidefadevert N%     — vertical slidefade
#   popin N%             — scale from N% to 100% (center)
#   fade                 — opacity only, no movement
#
# ══════════════════════════════════════════════════════════════════════════════
# §02  BEZIER CURVE LIBRARY
# ══════════════════════════════════════════════════════════════════════════════

animations {
    enabled = true
    first_launch_animation = true

    # ── Standard mathematical curves ─────────────────────────────────────────
    bezier = linear,           0.000, 0.000, 1.000, 1.000
    bezier = ease,             0.250, 0.100, 0.250, 1.000
    bezier = easeIn,           0.420, 0.000, 1.000, 1.000
    bezier = easeOut,          0.000, 0.000, 0.580, 1.000
    bezier = easeInOut,        0.420, 0.000, 0.580, 1.000

    # ── ASH signature curves (ultra-premium feel) ─────────────────────────────
    # ashSmooth  — buttery smooth, natural deceleration
    bezier = ashSmooth,        0.160, 1.000, 0.300, 1.000

    # ashBounce  — slight overshoot spring (playful)
    bezier = ashBounce,        0.340, 1.560, 0.640, 1.000

    # ashSnappy  — fast start, quick settle
    bezier = ashSnappy,        0.080, 0.820, 0.170, 1.000

    # ashOvershoot — bigger overshoot, energetic
    bezier = ashOvershoot,     0.200, 1.300, 0.400, 1.000

    # ashElastic — double bounce (elastic rubber)
    bezier = ashElastic,       0.500, 1.600, 0.500, 0.900

    # ashCinematic — slow majestic entry, quick exit
    bezier = ashCinematic,     0.000, 0.850, 0.150, 1.000

    # ashSwoosh — quick deceleration (material design feel)
    bezier = ashSwoosh,        0.390, 0.575, 0.565, 1.000

    # ashGravity — accelerating fall, gravity-like
    bezier = ashGravity,       0.550, 0.055, 0.675, 0.190

    # ashFloat — slow float (for overlays and panels)
    bezier = ashFloat,         0.230, 1.000, 0.320, 1.000

    # ashPop — instant pop with soft land
    bezier = ashPop,           0.100, 1.100, 0.200, 1.000

    # ashFade — pure ease for opacity-only transitions
    bezier = ashFade,          0.400, 0.000, 0.600, 1.000

    # ashSlide — for workspace sliding
    bezier = ashSlide,         0.260, 1.000, 0.200, 1.000

    # ashRebound — quick out, slow rebound
    bezier = ashRebound,       0.050, 0.900, 0.100, 1.050

    # ══════════════════════════════════════════════════════════════════════════
    # §03  WINDOW OPEN / CLOSE / MOVE
    # ══════════════════════════════════════════════════════════════════════════

    # Windows open — pop in from 75%, smooth acceleration
    animation = windowsIn,      1,  5,  ashSmooth,    popin 75%

    # Windows close — quick fade-shrink to 80%
    animation = windowsOut,     1,  4,  ashSnappy,    popin 80%

    # Windows move / resize — buttery follow
    animation = windowsMove,    1,  4,  ashSmooth

    # ══════════════════════════════════════════════════════════════════════════
    # §04  FADE TRANSITIONS
    # ══════════════════════════════════════════════════════════════════════════

    # Fade in (window appearing)
    animation = fadeIn,         1,  5,  ashFade

    # Fade out (window disappearing)
    animation = fadeOut,        1,  4,  ashSnappy

    # Focus switch (active/inactive transition)
    animation = fadeSwitch,     1,  4,  ashFade

    # Shadow fade on focus change
    animation = fadeShadow,     1,  5,  ashFade

    # Inactive window dim
    animation = fadeDim,        1,  6,  ashFade

    # Layer fade (bars, overlays)
    animation = fadeLayers,     1,  4,  ashFade

    # Layer appearing
    animation = fadeLayersIn,   1,  5,  ashFloat

    # Layer disappearing
    animation = fadeLayersOut,  1,  3,  ashSnappy

    # ══════════════════════════════════════════════════════════════════════════
    # §05  BORDER ANIMATION
    # ══════════════════════════════════════════════════════════════════════════

    # Border color transition on focus change
    animation = border,         1,  8,  ashSmooth

    # Animated gradient border — continuous rotation
    # Speed 80 = ~4.5 seconds per full rotation at 60fps
    animation = borderangle,    1,  80, linear,       loop

    # ══════════════════════════════════════════════════════════════════════════
    # §06  WORKSPACE TRANSITIONS
    # ══════════════════════════════════════════════════════════════════════════

    # Workspace switch (catch-all parent)
    animation = workspaces,     1,  5,  ashSlide,     slidefade 20%

    # Entering new workspace
    animation = workspacesIn,   1,  5,  ashSlide,     slidefade 20%

    # Leaving workspace
    animation = workspacesOut,  1,  4,  ashSnappy,    slidefade 20%

    # ══════════════════════════════════════════════════════════════════════════
    # §07  SPECIAL WORKSPACE (SCRATCHPAD)
    # ══════════════════════════════════════════════════════════════════════════

    # Special workspace catch-all
    animation = specialWorkspace,    1, 5, ashFloat,   slidefadevert -30%

    # Special workspace appearing (drops from top)
    animation = specialWorkspaceIn,  1, 5, ashFloat,   slidefadevert -30%

    # Special workspace disappearing (slides back up)
    animation = specialWorkspaceOut, 1, 4, ashSnappy,  slidefadevert -30%

    # ══════════════════════════════════════════════════════════════════════════
    # §08  LAYER SURFACES (bars, notifications, menus)
    # ══════════════════════════════════════════════════════════════════════════

    # Layer catch-all
    animation = layers,         1,  3,  ashSnappy,    fade

    # Layer appearing
    animation = layersIn,       1,  3,  ashFloat,     fade

    # Layer disappearing
    animation = layersOut,      1,  2,  ashSnappy,    fade
}

# ══════════════════════════════════════════════════════════════════════════════
# §09  PRESET PROFILES (sourced dynamically by ASH mode engine)
#      Each preset overrides only the animation block above.
#      Active preset is determined by: $ASH_CURRENT_MODE
# ══════════════════════════════════════════════════════════════════════════════

# ── Load active preset from sub-directory ─────────────────────────────────────
# Uncomment exactly ONE of these, or let ASH manage it dynamically:
# source = ~/.config/hypr/animations/default.conf
# source = ~/.config/hypr/animations/smooth.conf
# source = ~/.config/hypr/animations/bouncy.conf
# source = ~/.config/hypr/animations/snappy.conf
# source = ~/.config/hypr/animations/cinematic.conf
# source = ~/.config/hypr/animations/minimal.conf
# source = ~/.config/hypr/animations/performance.conf
# source = ~/.config/hypr/animations/none.conf

