# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Monitor Submap                                   ║
# ║                                                                              ║
# ║  Complete monitor management modal: layout switching, resolution,           ║
# ║  refresh rate, scaling, VRR, HDR, mirroring, rotation, multi-monitor        ║
# ║  workspace control, DPMS per-display, and hotplug response                 ║
# ║                                                                              ║
# ║  ENTER:  $mainMod + ALT + F8 ─────────────────────────────────────────────── ║
# ║  EXIT:   Escape │ Return                                                    ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  MONITOR SUBMAP ACTIVATION
# ══════════════════════════════════════════════════════════════════════════════

bind = $mainMod ALT,    F8,         submap,     monitor
bind = $mainMod SHIFT,  O,          submap,     monitor

submap = monitor

# ══════════════════════════════════════════════════════════════════════════════
# §02  ENTRY NOTIFICATION
# ══════════════════════════════════════════════════════════════════════════════

bind = , catchall, exec, \
    MON_COUNT=$(hyprctl -j monitors | jq 'length'); \
    ACTIVE=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name + " " + (.width|tostring) + "×" + (.height|tostring) + "@" + (.refreshRate|tostring) + "Hz"'); \
    notify-send "🖥 MONITOR MODE ($MON_COUNT displays)" \
    "Active: $ACTIVE\n\nH/J/K/L — focus monitor\nR — resolution\nF — refresh rate\nS — scale\nV — VRR toggle\nM — mirror\nX — disable/enable\nEsc — exit" \
    --app-name=ASH-Monitor \
    --icon=video-display \
    --urgency=low \
    --expire-time=6000 \
    --hint=string:x-dunst-stack-tag:monitor-submap

# ══════════════════════════════════════════════════════════════════════════════
# §03  MONITOR FOCUS NAVIGATION
#      Move focus between displays
# ══════════════════════════════════════════════════════════════════════════════

# ── Focus by direction ────────────────────────────────────────────────────────
bind = , H,         focusmonitor,   l
bind = , J,         focusmonitor,   d
bind = , K,         focusmonitor,   u
bind = , L,         focusmonitor,   r

bind = , left,      focusmonitor,   l
bind = , down,      focusmonitor,   d
bind = , up,        focusmonitor,   u
bind = , right,     focusmonitor,   r

# ── Focus by number ───────────────────────────────────────────────────────────
bind = , 1, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[0].name') && \
    hyprctl dispatch focusmonitor "$MON" && \
    notify-send "ASH" "🖥 Monitor 1: $MON" \
    --urgency=low --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:monitor-focus

bind = , 2, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[1].name // "N/A"') && \
    [ "$MON" != "N/A" ] && \
    hyprctl dispatch focusmonitor "$MON" && \
    notify-send "ASH" "🖥 Monitor 2: $MON" \
    --urgency=low --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:monitor-focus

bind = , 3, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[2].name // "N/A"') && \
    [ "$MON" != "N/A" ] && \
    hyprctl dispatch focusmonitor "$MON" && \
    notify-send "ASH" "🖥 Monitor 3: $MON" \
    --urgency=low --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:monitor-focus

# ── Cycle through monitors ────────────────────────────────────────────────────
bind = , Tab,   focusmonitor,   +1
bind = SHIFT, Tab, focusmonitor, -1

# ══════════════════════════════════════════════════════════════════════════════
# §04  WORKSPACE TO MONITOR
#      Move workspaces between displays
# ══════════════════════════════════════════════════════════════════════════════

# ── Move current workspace to adjacent monitor ────────────────────────────────
bind = SHIFT, H,    movecurrentworkspacetomonitor,  l
bind = SHIFT, J,    movecurrentworkspacetomonitor,  d
bind = SHIFT, K,    movecurrentworkspacetomonitor,  u
bind = SHIFT, L,    movecurrentworkspacetomonitor,  r

bind = SHIFT, left,  movecurrentworkspacetomonitor, l
bind = SHIFT, right, movecurrentworkspacetomonitor, r

# ── Move active window to adjacent monitor ────────────────────────────────────
bind = CTRL, H,     movewindow,     mon:l
bind = CTRL, J,     movewindow,     mon:d
bind = CTRL, K,     movewindow,     mon:u
bind = CTRL, L,     movewindow,     mon:r

bind = CTRL, left,  movewindow,     mon:l
bind = CTRL, right, movewindow,     mon:r

# ── Move window to monitor (follow focus) ────────────────────────────────────
bind = ALT, H, exec, \
    hyprctl dispatch movewindow mon:l && \
    hyprctl dispatch focusmonitor l && \
    notify-send "ASH" "Window → left monitor" \
    --urgency=low --expire-time=1200
bind = ALT, L, exec, \
    hyprctl dispatch movewindow mon:r && \
    hyprctl dispatch focusmonitor r && \
    notify-send "ASH" "Window → right monitor" \
    --urgency=low --expire-time=1200

# ══════════════════════════════════════════════════════════════════════════════
# §05  RESOLUTION CONTROL
# ══════════════════════════════════════════════════════════════════════════════

# ── R — Interactive resolution picker ────────────────────────────────────────
bind = , R, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    RES=$(hyprctl -j monitors | jq -r '.[] | select(.name == "'"$MON"'") | .availableModes // [] | .[]' 2>/dev/null | \
    rofi -dmenu -p "📺 Resolution: $MON" \
    -theme-str 'window {width: 28%;} listview {lines: 12;}' || \
    echo -e "3840x2160@60\n2560x1440@144\n1920x1080@60\n1920x1080@144\n1280x720@60" | \
    rofi -dmenu -p "📺 Resolution: $MON" \
    -theme-str 'window {width: 28%;} listview {lines: 8;}') && \
    [ -n "$RES" ] && \
    hyprctl keyword monitor "$MON,$RES,auto,auto" && \
    notify-send "ASH" "📺 $MON: $RES" \
    --urgency=normal --expire-time=3000 \
    --hint=string:x-dunst-stack-tag:monitor-res
bind = , R, submap, reset

# ── Quick resolution presets ──────────────────────────────────────────────────
bind = CTRL, 1, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    hyprctl keyword monitor "$MON,1920x1080@60,auto,auto" && \
    notify-send "ASH" "📺 $MON: 1080p@60" \
    --urgency=low --expire-time=2000
bind = CTRL, 1, submap, reset

bind = CTRL, 2, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    hyprctl keyword monitor "$MON,1920x1080@144,auto,auto" && \
    notify-send "ASH" "📺 $MON: 1080p@144" \
    --urgency=low --expire-time=2000
bind = CTRL, 2, submap, reset

bind = CTRL, 3, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    hyprctl keyword monitor "$MON,2560x1440@144,auto,auto" && \
    notify-send "ASH" "📺 $MON: 1440p@144" \
    --urgency=low --expire-time=2000
bind = CTRL, 3, submap, reset

bind = CTRL, 4, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    hyprctl keyword monitor "$MON,3840x2160@60,auto,auto" && \
    notify-send "ASH" "📺 $MON: 4K@60" \
    --urgency=low --expire-time=2000
bind = CTRL, 4, submap, reset

# ── Preferred (monitor default) ───────────────────────────────────────────────
bind = CTRL, 0, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    hyprctl keyword monitor "$MON,preferred,auto,auto" && \
    notify-send "ASH" "📺 $MON: preferred mode" \
    --urgency=low --expire-time=2000
bind = CTRL, 0, submap, reset

# ══════════════════════════════════════════════════════════════════════════════
# §06  REFRESH RATE CONTROL
# ══════════════════════════════════════════════════════════════════════════════

# ── F — Interactive refresh rate picker ──────────────────────────────────────
bind = , F, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    W=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .width'); \
    H=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .height'); \
    RR=$(echo -e "240\n165\n144\n120\n75\n60\n30" | \
    rofi -dmenu -p "⚡ Refresh rate (Hz)" \
    -theme-str 'window {width: 18%;} listview {lines: 7;}') && \
    [ -n "$RR" ] && \
    SCALE=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .scale') && \
    hyprctl keyword monitor "$MON,${W}x${H}@${RR},auto,$SCALE" && \
    notify-send "ASH" "⚡ $MON: ${W}×${H}@${RR}Hz" \
    --urgency=normal --expire-time=3000 \
    --hint=string:x-dunst-stack-tag:monitor-rr
bind = , F, submap, reset

# ── Refresh rate increment/decrement ─────────────────────────────────────────
bind = , plus, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    W=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .width'); \
    H=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .height'); \
    RR=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .refreshRate | round + 60'); \
    SCALE=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .scale'); \
    hyprctl keyword monitor "$MON,${W}x${H}@${RR},auto,$SCALE" && \
    notify-send "ASH" "⚡ Refresh: ${RR}Hz" \
    --urgency=low --expire-time=1500

bind = , minus, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    W=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .width'); \
    H=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .height'); \
    RR=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .refreshRate | round - 60'); \
    [ $RR -lt 30 ] && RR=30; \
    SCALE=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .scale'); \
    hyprctl keyword monitor "$MON,${W}x${H}@${RR},auto,$SCALE" && \
    notify-send "ASH" "⚡ Refresh: ${RR}Hz" \
    --urgency=low --expire-time=1500

# ══════════════════════════════════════════════════════════════════════════════
# §07  SCALE / DPI CONTROL
# ══════════════════════════════════════════════════════════════════════════════

# ── S — Interactive scale picker ──────────────────────────────────────────────
bind = , S, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    CURRENT=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .scale'); \
    SCALE=$(echo -e "1.0\n1.25\n1.5\n1.75\n2.0\n2.5\n3.0" | \
    rofi -dmenu -p "🔍 Scale (current: $CURRENT)" \
    -theme-str 'window {width: 20%;} listview {lines: 7;}') && \
    [ -n "$SCALE" ] && \
    hyprctl keyword monitor "$MON,preferred,auto,$SCALE" && \
    notify-send "ASH" "🔍 $MON: scale $SCALE" \
    --urgency=normal --expire-time=3000 \
    --hint=string:x-dunst-stack-tag:monitor-scale
bind = , S, submap, reset

# ── Scale up (larger UI) ──────────────────────────────────────────────────────
binde = SHIFT, S, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    W=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .width'); \
    H=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .height'); \
    RR=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .refreshRate | round'); \
    SCALE=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .scale + 0.25'); \
    hyprctl keyword monitor "$MON,${W}x${H}@${RR},auto,$SCALE" && \
    notify-send "ASH" "🔍 Scale: $SCALE" \
    --urgency=low --expire-time=1200

# ── Scale down (smaller UI) ───────────────────────────────────────────────────
binde = CTRL, S, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    W=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .width'); \
    H=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .height'); \
    RR=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .refreshRate | round'); \
    SCALE=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .scale - 0.25 | if . < 1.0 then 1.0 else . end'); \
    hyprctl keyword monitor "$MON,${W}x${H}@${RR},auto,$SCALE" && \
    notify-send "ASH" "🔍 Scale: $SCALE" \
    --urgency=low --expire-time=1200

# ── Reset scale to 1.0 ────────────────────────────────────────────────────────
bind = ALT, S, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    hyprctl keyword monitor "$MON,preferred,auto,1" && \
    notify-send "ASH" "🔍 Scale reset: 1.0" \
    --urgency=low --expire-time=2000
bind = ALT, S, submap, reset

# ══════════════════════════════════════════════════════════════════════════════
# §08  VRR / ADAPTIVE SYNC
# ══════════════════════════════════════════════════════════════════════════════

# ── V — Cycle VRR modes ───────────────────────────────────────────────────────
bind = , V, exec, \
    CURRENT=$(hyprctl -j getoption misc:vrr | jq -r '.int'); \
    case "$CURRENT" in \
        0) NEXT=1; LABEL="Fullscreen only (FreeSync gaming)" ;; \
        1) NEXT=2; LABEL="Always on (G-Sync everywhere)" ;; \
        2) NEXT=0; LABEL="Disabled" ;; \
        *) NEXT=0; LABEL="Disabled" ;; \
    esac && \
    hyprctl keyword misc:vrr $NEXT && \
    notify-send "ASH" "🔄 VRR Mode $NEXT: $LABEL" \
    --urgency=normal --expire-time=3000 \
    --hint=string:x-dunst-stack-tag:monitor-vrr
bind = , V, submap, reset

# ── Explicit VRR states ───────────────────────────────────────────────────────
bind = CTRL, V, exec, \
    hyprctl keyword misc:vrr 0 && \
    notify-send "ASH" "🔄 VRR: Disabled" \
    --urgency=low --expire-time=2000
bind = CTRL, V, submap, reset

bind = ALT, V, exec, \
    hyprctl keyword misc:vrr 1 && \
    notify-send "ASH" "🔄 VRR: Fullscreen only" \
    --urgency=low --expire-time=2000
bind = ALT, V, submap, reset

bind = SHIFT, V, exec, \
    hyprctl keyword misc:vrr 2 && \
    notify-send "ASH" "🔄 VRR: Always on" \
    --urgency=low --expire-time=2000
bind = SHIFT, V, submap, reset

# ══════════════════════════════════════════════════════════════════════════════
# §09  MIRROR / CLONE MODES
# ══════════════════════════════════════════════════════════════════════════════

# ── M — Mirror active monitor to all others ───────────────────────────────────
bind = , M, exec, \
    PRIMARY=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    OTHERS=$(hyprctl -j monitors | jq -r '.[] | select(.focused == false) | .name'); \
    for MON in $OTHERS; do \
        hyprctl keyword monitor "$MON,preferred,auto,1,mirror,$PRIMARY"; \
    done && \
    notify-send "ASH" "🖥 Mirroring $PRIMARY to all displays" \
    --urgency=normal --expire-time=3000 \
    --hint=string:x-dunst-stack-tag:monitor-mirror
bind = , M, submap, reset

# ── Select mirror target interactively ────────────────────────────────────────
bind = SHIFT, M, exec, \
    SOURCE=$(hyprctl -j monitors | jq -r '.[].name' | \
    rofi -dmenu -p "Mirror source:" \
    -theme-str 'window {width: 22%;} listview {lines: 5;}') && \
    TARGET=$(hyprctl -j monitors | jq -r '.[].name' | \
    grep -v "$SOURCE" | \
    rofi -dmenu -p "Mirror target (clone $SOURCE to):" \
    -theme-str 'window {width: 25%;} listview {lines: 5;}') && \
    [ -n "$SOURCE" ] && [ -n "$TARGET" ] && \
    hyprctl keyword monitor "$TARGET,preferred,auto,1,mirror,$SOURCE" && \
    notify-send "ASH" "🖥 $TARGET mirrors $SOURCE" \
    --urgency=normal --expire-time=3000
bind = SHIFT, M, submap, reset

# ── Disable mirroring (restore extend mode) ───────────────────────────────────
bind = CTRL, M, exec, \
    hyprctl -j monitors | jq -r '.[].name' | \
    while read MON; do \
        hyprctl keyword monitor "$MON,preferred,auto,auto"; \
    done && \
    notify-send "ASH" "🖥 Mirror disabled — extend mode" \
    --urgency=normal --expire-time=3000
bind = CTRL, M, submap, reset

# ══════════════════════════════════════════════════════════════════════════════
# §10  MONITOR ROTATION
# ══════════════════════════════════════════════════════════════════════════════

# ── T — Cycle transform/rotation ──────────────────────────────────────────────
bind = , T, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    CURRENT=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .transform'); \
    case "$CURRENT" in \
        0) NEXT=1; LABEL="90° (portrait)" ;; \
        1) NEXT=2; LABEL="180° (upside down)" ;; \
        2) NEXT=3; LABEL="270° (portrait flipped)" ;; \
        3) NEXT=0; LABEL="Normal (landscape)" ;; \
        *) NEXT=0; LABEL="Normal (landscape)" ;; \
    esac && \
    W=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .width'); \
    H=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .height'); \
    RR=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .refreshRate | round'); \
    SCALE=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .scale'); \
    hyprctl keyword monitor "$MON,${W}x${H}@${RR},auto,$SCALE,transform,$NEXT" && \
    notify-send "ASH" "🔄 $MON rotation: $LABEL" \
    --urgency=normal --expire-time=3000
bind = , T, submap, reset

# ── Portrait mode (90°) ───────────────────────────────────────────────────────
bind = SHIFT, T, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    hyprctl keyword monitor "$MON,preferred,auto,auto,transform,1" && \
    notify-send "ASH" "🔄 Portrait mode" \
    --urgency=low --expire-time=2000
bind = SHIFT, T, submap, reset

# ── Reset to landscape ────────────────────────────────────────────────────────
bind = CTRL, T, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    hyprctl keyword monitor "$MON,preferred,auto,auto,transform,0" && \
    notify-send "ASH" "🔄 Landscape mode (normal)" \
    --urgency=low --expire-time=2000
bind = CTRL, T, submap, reset

# ══════════════════════════════════════════════════════════════════════════════
# §11  MONITOR ENABLE / DISABLE
# ══════════════════════════════════════════════════════════════════════════════

# ── X — Toggle focused monitor ───────────────────────────────────────────────
bind = , X, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    ALL_MONS=$(hyprctl -j monitors | jq 'length'); \
    if [ "$ALL_MONS" -le 1 ]; then \
        notify-send "ASH" "❌ Cannot disable only monitor" \
        --urgency=normal --expire-time=2000; \
    else \
        hyprctl keyword monitor "$MON,disable" && \
        notify-send "ASH" "🖥 Monitor disabled: $MON" \
        --urgency=normal --expire-time=3000; \
    fi
bind = , X, submap, reset

# ── Enable disabled monitor ───────────────────────────────────────────────────
bind = SHIFT, X, exec, \
    MON=$(echo -e "$(hyprctl -j monitors | jq -r '.[].name')\nDP-1\nDP-2\nHDMI-A-1\nHDMI-A-2\neDP-1" | \
    sort -u | \
    rofi -dmenu -p "Enable monitor:" \
    -theme-str 'window {width: 22%;} listview {lines: 8;}') && \
    [ -n "$MON" ] && \
    hyprctl keyword monitor "$MON,preferred,auto,auto" && \
    notify-send "ASH" "🖥 Monitor enabled: $MON" \
    --urgency=normal --expire-time=3000
bind = SHIFT, X, submap, reset

# ── DPMS toggle for focused monitor ──────────────────────────────────────────
bind = , D, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    hyprctl dispatch dpms toggle "$MON" && \
    notify-send "ASH" "🖥 DPMS toggled: $MON" \
    --urgency=low --expire-time=1500
bind = , D, submap, reset

# ── DPMS all monitors ─────────────────────────────────────────────────────────
bind = SHIFT, D, exec, \
    hyprctl dispatch dpms toggle && \
    notify-send "ASH" "🖥 All displays DPMS toggled" \
    --urgency=low --expire-time=1500
bind = SHIFT, D, submap, reset

# ══════════════════════════════════════════════════════════════════════════════
# §12  LAYOUT PRESETS
#      Apply common multi-monitor configurations instantly
# ══════════════════════════════════════════════════════════════════════════════

# ── P — Apply layout preset interactively ─────────────────────────────────────
bind = , P, exec, \
    PRESET=$(echo -e \
    "Laptop only (eDP-1)\nExternal only (DP-1)\nDual: side-by-side\nDual: stacked\nDual: laptop left\nDual: laptop right\nTriple: center primary\nMirror all" | \
    rofi -dmenu -p "🖥 Monitor layout preset" \
    -theme-str 'window {width: 35%;} listview {lines: 8;}') && \
    case "$PRESET" in \
        "Laptop only (eDP-1)") \
            hyprctl keyword monitor "eDP-1,preferred,0x0,auto" && \
            hyprctl keyword monitor ",disable" ;; \
        "External only (DP-1)") \
            hyprctl keyword monitor "DP-1,preferred,0x0,auto" && \
            hyprctl keyword monitor "eDP-1,disable" ;; \
        "Dual: side-by-side") \
            hyprctl keyword monitor "DP-1,preferred,0x0,1" && \
            hyprctl keyword monitor "eDP-1,preferred,auto,1" ;; \
        "Dual: stacked") \
            hyprctl keyword monitor "DP-1,preferred,0x0,1" && \
            hyprctl keyword monitor "eDP-1,preferred,0x1080,1" ;; \
        "Dual: laptop left") \
            hyprctl keyword monitor "eDP-1,preferred,0x0,1" && \
            hyprctl keyword monitor "DP-1,preferred,1920x0,1" ;; \
        "Dual: laptop right") \
            hyprctl keyword monitor "DP-1,preferred,0x0,1" && \
            hyprctl keyword monitor "eDP-1,preferred,2560x0,1" ;; \
        "Triple: center primary") \
            hyprctl keyword monitor "DP-2,preferred,0x0,1" && \
            hyprctl keyword monitor "DP-1,preferred,1920x0,1" && \
            hyprctl keyword monitor "HDMI-A-1,preferred,3840x0,1" ;; \
        "Mirror all") \
            PRIMARY=$(hyprctl -j monitors | jq -r '.[0].name'); \
            hyprctl -j monitors | jq -r '.[1:][].name' | \
            while read M; do hyprctl keyword monitor "$M,preferred,auto,1,mirror,$PRIMARY"; done ;; \
    esac && \
    notify-send "ASH" "🖥 Layout: $PRESET" \
    --urgency=normal --expire-time=3000 \
    --hint=string:x-dunst-stack-tag:monitor-layout
bind = , P, submap, reset

# ── Kanshi profile switching ──────────────────────────────────────────────────
bind = SHIFT, P, exec, \
    PROFILE=$(kanshictl list 2>/dev/null | \
    rofi -dmenu -p "Kanshi profile:" \
    -theme-str 'window {width: 30%;} listview {lines: 8;}') && \
    [ -n "$PROFILE" ] && \
    kanshictl switch "$PROFILE" && \
    notify-send "ASH" "🖥 Kanshi profile: $PROFILE" \
    --urgency=normal --expire-time=3000
bind = SHIFT, P, submap, reset

# ══════════════════════════════════════════════════════════════════════════════
# §13  HDR CONTROL
# ══════════════════════════════════════════════════════════════════════════════

# ── Y — Toggle HDR on focused monitor ────────────────────────────────────────
bind = , Y, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    W=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .width'); \
    H=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .height'); \
    RR=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .refreshRate | round'); \
    SCALE=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .scale'); \
    HDR=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .hdr // false'); \
    if [ "$HDR" = "true" ]; then \
        hyprctl keyword monitor "$MON,${W}x${H}@${RR},auto,$SCALE" && \
        notify-send "ASH" "🌅 HDR: OFF on $MON" \
        --urgency=normal --expire-time=3000; \
    else \
        hyprctl keyword monitor "$MON,${W}x${H}@${RR},auto,$SCALE,bitdepth,10,hdr" && \
        notify-send "ASH" "🌅 HDR: ON on $MON (10-bit)" \
        --urgency=normal --expire-time=3000; \
    fi
bind = , Y, submap, reset

# ══════════════════════════════════════════════════════════════════════════════
# §14  MONITOR INFORMATION
# ══════════════════════════════════════════════════════════════════════════════

# ── I — Show comprehensive monitor info ───────────────────────────────────────
bind = , I, exec, \
    hyprctl -j monitors | jq -r \
    '.[] | "🖥 \(.name)\n  Resolution: \(.width)×\(.height)@\(.refreshRate | round)Hz\n  Position:   \(.x),\(.y)\n  Scale:      \(.scale)\n  Transform:  \(.transform)\n  VRR:        \(.vrr)\n  HDR:        \(.hdr // false)\n  Focused:    \(.focused)\n  Workspaces: \(.activeWorkspace.name)\n"' | \
    notify-send "Monitor Information" "$(cat)" \
    --urgency=low --expire-time=12000 \
    --hint=string:x-dunst-stack-tag:monitor-info

# ── C — Copy monitor config snippet ───────────────────────────────────────────
bind = , C, exec, \
    hyprctl -j monitors | jq -r \
    '.[] | "monitor = \(.name), \(.width)x\(.height)@\(.refreshRate | round), \(.x)x\(.y), \(.scale)"' | \
    wl-copy && \
    notify-send "ASH" "📋 Monitor config copied to clipboard" \
    --urgency=low --expire-time=2000

# ── A — Show all available modes for focused monitor ─────────────────────────
bind = , A, exec, \
    MON=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name'); \
    MODES=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .availableModes // [] | .[]' 2>/dev/null | head -20); \
    if [ -z "$MODES" ]; then MODES="(modes list not available — use R for preset resolution)"; fi && \
    notify-send "Available modes: $MON" "$MODES" \
    --urgency=low --expire-time=10000

# ══════════════════════════════════════════════════════════════════════════════
# §15  HELP DISPLAY
# ══════════════════════════════════════════════════════════════════════════════

bind = , question, exec, \
    notify-send "ASH Monitor Mode — Full Reference" \
    "── FOCUS ────────────────────────────────\n\
H/J/K/L / Arrows → focus by direction\n\
1/2/3            → focus monitor 1/2/3\n\
Tab / Shift+Tab  → cycle monitors\n\
\n── WORKSPACE ────────────────────────────\n\
Shift+H/L        → workspace to monitor\n\
Ctrl+H/L         → window to monitor\n\
Alt+H/L          → window + follow focus\n\
\n── DISPLAY SETTINGS ─────────────────────\n\
R                → resolution picker\n\
Ctrl+1-4         → resolution preset\n\
F                → refresh rate picker\n\
+/-              → refresh rate ±60Hz\n\
S                → scale picker\n\
Shift+S / Ctrl+S → scale ±0.25\n\
Alt+S            → reset scale 1.0\n\
V                → cycle VRR mode\n\
\n── MIRROR / ROTATION ────────────────────\n\
M                → mirror to all\n\
Shift+M          → mirror: pick source/target\n\
Ctrl+M           → disable mirror (extend)\n\
T                → rotate (cycle transforms)\n\
Shift+T          → portrait mode (90°)\n\
Ctrl+T           → landscape (normal)\n\
\n── ENABLE / DISABLE ─────────────────────\n\
X                → disable focused monitor\n\
Shift+X          → enable a monitor\n\
D                → DPMS toggle (focused)\n\
Shift+D          → DPMS toggle (all)\n\
\n── PRESETS ──────────────────────────────\n\
P                → layout preset picker\n\
Shift+P          → kanshi profile switch\n\
\n── HDR ──────────────────────────────────\n\
Y                → toggle HDR (10-bit)\n\
\n── INFO ─────────────────────────────────\n\
I                → monitor info\n\
A                → available modes\n\
C                → copy config snippet\n\
?                → this help\n\
\n── EXIT ─────────────────────────────────\n\
Escape / Return  → exit" \
    --urgency=low \
    --expire-time=25000 \
    --hint=string:x-dunst-stack-tag:monitor-help

# ══════════════════════════════════════════════════════════════════════════════
# §16  EXIT MONITOR SUBMAP
# ══════════════════════════════════════════════════════════════════════════════

bind = , Escape,                    submap,     reset
bind = , Return,                    submap,     reset
bind = $mainMod ALT,    F8,         submap,     reset
bind = $mainMod SHIFT,  O,          submap,     reset

submap = reset

