# §08  IMAGE VIEWERS & GRAPHICS
# ══════════════════════════════════════════════════════════════════════════════

# ── imv (lightweight image viewer) ───────────────────────────────────────────
bind = $hyperMod,           J,              exec,   \
    FILE=$(find ~/Pictures -type f \
    \( -name "*.jpg" -o -name "*.png" \
    -o -name "*.webp" -o -name "*.svg" \) 2>/dev/null | \
    fzf --preview 'kitty +kitten icat --scale-up --transfer-mode=memory \
        --stdin=no --place 40x20@0x0 {}' \
        --preview-window=right:60%) && \
    [ -n "$FILE" ] && imv "$FILE"

# ── GIMP (image editor) ───────────────────────────────────────────────────────
bind = $hyperMod SHIFT,     J,              exec,   \
    $focus_or_launch gimp gimp

# ── Inkscape (vector graphics) ────────────────────────────────────────────────
