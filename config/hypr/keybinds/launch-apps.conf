# ══════════════════════════════════════════════════════════════════════════════
# §01  LAUNCH HELPER FUNCTIONS
#      Shell wrappers for smart launch behavior
# ══════════════════════════════════════════════════════════════════════════════

# ── Focus-or-launch helper ────────────────────────────────────────────────────
# Focuses existing window if running, launches if not
# Usage: $focus_or_launch CLASS COMMAND
$focus_or_launch    = bash -c '\
    CLASS="$1"; CMD="${@:2}"; \
    if hyprctl -j clients | jq -e ".[] | select(.class == \"$CLASS\")" > /dev/null 2>&1; then \
        hyprctl dispatch focuswindow "class:$CLASS"; \
    else \
        $CMD & \
    fi' --

# ── Workspace-launch helper ───────────────────────────────────────────────────
# Launch app on specific workspace if not already there
$ws_launch          = bash -c '\
    WS="$1"; CLASS="$2"; CMD="${@:3}"; \
    if hyprctl -j clients | jq -e ".[] | select(.class == \"$CLASS\")" > /dev/null 2>&1; then \
        hyprctl dispatch focuswindow "class:$CLASS"; \
    else \
        hyprctl dispatch workspace "$WS"; \
        sleep 0.1; \
        $CMD & \
    fi' --

# ── Float-launch helper ───────────────────────────────────────────────────────
# Launch app in centered floating window
$float_launch       = bash -c '\
    CLASS="$1"; W="$2"; H="$3"; CMD="${@:4}"; \
    $CMD & sleep 0.3; \
    hyprctl dispatch setfloating "class:$CLASS"; \
    hyprctl dispatch resizewindowpixel "exact $W $H,class:$CLASS"; \
    hyprctl dispatch centerwindow "class:$CLASS"' --

# ══════════════════════════════════════════════════════════════════════════════
# §02  TERMINAL EMULATORS
# ══════════════════════════════════════════════════════════════════════════════

# ── Kitty (primary terminal) ──────────────────────────────────────────────────
# Standard launch
bind = $mainMod,            Return,         exec,   kitty
# Floating terminal overlay (80x24 centered)
bind = $mainMod SHIFT,      Return,         exec,   kitty \
                                                        --class float-term \
                                                        --override remember_window_size=no \
                                                        --override initial_window_width=900 \
                                                        --override initial_window_height=550
# Terminal in CWD of active window
bind = $mainMod CTRL,       Return,         exec,   \
    CWD=$(readlink /proc/$(hyprctl -j activewindow \
    | jq -r '.pid')/cwd 2>/dev/null || echo $HOME) && \
    kitty --directory "$CWD"
# New kitty OS window
bind = $mainMod ALT,        Return,         exec,   kitty --single-instance --new-window

# ── Alternative terminals ─────────────────────────────────────────────────────
# Foot (lightweight)
bind = $hyperMod,           F,              exec,   foot
# WezTerm
bind = $hyperMod,           W,              exec,   wezterm start
# Alacritty
bind = $hyperMod,           A,              exec,   alacritty
# Ghostty
bind = $hyperMod,           G,              exec,   ghostty
# Zellij (terminal multiplexer)
bind = $hyperMod,           Z,              exec,   kitty --class zellij -e zellij

