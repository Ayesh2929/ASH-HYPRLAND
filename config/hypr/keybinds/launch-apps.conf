# ── MPV (primary media player) ───────────────────────────────────────────────
bind = $hyperMod,           M,              exec,   \
    FILE=$(find ~/Videos ~/Downloads -type f \
    \( -name "*.mp4" -o -name "*.mkv" -o -name "*.avi" \
    -o -name "*.webm" -o -name "*.mov" \) 2>/dev/null | \
    fzf --preview 'echo "{}"\
        --preview-window=right:40%) && \
    [ -n "$FILE" ] && mpv "$FILE"

# ── VLC ───────────────────────────────────────────────────────────────────────
bind = $hyperMod SHIFT,     M,              exec,   \
    $focus_or_launch vlc vlc

# ── Celluloid (GTK MPV frontend) ─────────────────────────────────────────────
bind = $hyperMod,           Y,              exec,   \
    $focus_or_launch io.github.celluloid_player.Celluloid celluloid

