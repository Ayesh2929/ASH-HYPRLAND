# ══════════════════════════════════════════════════════════════════════════════
# §15  UTILITIES & QUICK TOOLS
# ══════════════════════════════════════════════════════════════════════════════

# ── Calculator ────────────────────────────────────────────────────────────────
bind = $mainMod ALT,        equal,          exec,   \
    kitty --class calc \
          --override initial_window_width=500 \
          --override initial_window_height=400 \
          --override remember_window_size=no \
          -e bc -l
# GNOME Calculator (GUI)
bind = $mainMod ALT SHIFT,  equal,          exec,   gnome-calculator

# ── OCR screen capture ────────────────────────────────────────────────────────
bind = $mainMod ALT,        F2,             exec,   \
    grimblast save area - | \
    tesseract stdin stdout | \
    wl-copy && \
    notify-send "ASH" "📋 OCR text copied to clipboard" \
    --expire-time=3000

# ── QR code generator ────────────────────────────────────────────────────────
bind = $mainMod ALT,        Q,              exec,   \
    TEXT=$(rofi -dmenu -p "󰐲 QR Code text") && \
    [ -n "$TEXT" ] && \
    qrencode -t PNG -o /tmp/ash-qr.png "$TEXT" && \
    imv /tmp/ash-qr.png

# ── Password generator ────────────────────────────────────────────────────────
bind = $mainMod ALT,        X,              exec,   \
    PASS=$(openssl rand -base64 24 | tr -d "=+/") && \
    echo -n "$PASS" | wl-copy && \
    notify-send "ASH" "🔐 Password generated & copied\n$PASS" \
    --expire-time=4000

# ── Dictionary lookup ────────────────────────────────────────────────────────
bind = $mainMod ALT,        F3,             exec,   \
    WORD=$(wl-paste 2>/dev/null || echo "") && \
    WORD=$(rofi -dmenu -p "📖 Define word" \
    -filter "$WORD" -theme-str 'window {width: 30%;}') && \
    [ -n "$WORD" ] && \
    notify-send "Definition: $WORD" \
    "$(dict "$WORD" 2>/dev/null | head -30 || echo 'Not found')" \
    --expire-time=10000

# ── Screen recorder ───────────────────────────────────────────────────────────
bind = $mainMod ALT,        F4,             exec,   \
    ash shot record

# ── Process manager (GUI) ─────────────────────────────────────────────────────
bind = $mainMod CTRL,       Escape,         exec,   \
    $float_launch \
    gnome-system-monitor 900 600 \
    gnome-system-monitor

