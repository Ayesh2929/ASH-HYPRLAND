# ── Firefox ───────────────────────────────────────────────────────────────────
bind = $mainMod,            B,              exec,   \
    $focus_or_launch firefox firefox
bind = $mainMod SHIFT,      B,              exec,   firefox --private-window
# Firefox with specific URL
bind = $mainMod CTRL,       B,              exec,   \
    URL=$(rofi -dmenu -p "󰖟 URL" -theme-str 'window {width: 50%;}') && \
    [ -n "$URL" ] && firefox "$URL"
# Firefox profile picker
bind = $mainMod ALT,        B,              exec,   firefox --ProfileManager

# ── Chromium / Chrome ─────────────────────────────────────────────────────────
bind = $hyperMod,           C,              exec,   \
    $focus_or_launch chromium chromium
# Chrome incognito
bind = $hyperMod SHIFT,     C,              exec,   \
    chromium --incognito

# ── qutebrowser (keyboard-driven) ────────────────────────────────────────────
bind = $hyperMod,           Q,              exec,   \
    $focus_or_launch qutebrowser qutebrowser

# ── Brave ─────────────────────────────────────────────────────────────────────
bind = $hyperMod,           B,              exec,   \
