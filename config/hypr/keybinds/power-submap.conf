# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Power Submap                                     ║
# ║                                                                              ║
# ║  System power management modal with visual safety confirmation,             ║
# ║  session control, display management, performance profiles,                 ║
# ║  hardware kill switches and emergency recovery options                      ║
# ║                                                                              ║
# ║  ENTER:  $mainMod + Escape ───────────────────────────────────────────────── ║
# ║  EXIT:   Escape │ any unbound key │ 10s auto-timeout                        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  POWER SUBMAP ACTIVATION
# ══════════════════════════════════════════════════════════════════════════════

# ── Primary activation ────────────────────────────────────────────────────────
bind = $mainMod, Escape,            submap,     power
# ── Alternative ──────────────────────────────────────────────────────────────
bind = $mainMod SHIFT, Escape,      submap,     power
bind = $hyperMod, Escape,           submap,     power

# ══════════════════════════════════════════════════════════════════════════════
# §02  POWER SUBMAP — FULL DEFINITION
# ══════════════════════════════════════════════════════════════════════════════

submap = power

# ══════════════════════════════════════════════════════════════════════════════
# §03  ENTRY ANNOUNCEMENT
#      Full-screen visible prompt showing all available options
# ══════════════════════════════════════════════════════════════════════════════

bind = , catchall, exec, \
    notify-send \
    "⚡ POWER MENU" \
    "$(printf \
    '%-4s  %s\n' \
    'L'   '🔒  Lock screen' \
    'S'   '💤  Suspend (sleep)' \
    'H'   '❄   Hibernate' \
    'E'   '🚪  Logout (exit Hyprland)' \
    'R'   '🔄  Reboot' \
    'P'   '⏻   Shutdown' \
    'M'   '🎨  Power menu (Rofi)' \
    'D'   '🖥  Toggle displays (DPMS)' \
    'N'   '🌙  Night light toggle' \
    'B'   '🔋  Battery saver mode' \
    'F'   '⚡  Performance mode' \
    'K'   '💀  Emergency kill compositor' \
    'Esc' '✖   Cancel')" \
    --app-name=ASH-Power \
    --icon=system-shutdown \
    --urgency=normal \
    --expire-time=10000 \
    --hint=string:x-dunst-stack-tag:power-menu

# ══════════════════════════════════════════════════════════════════════════════
# §04  SESSION CONTROL
# ══════════════════════════════════════════════════════════════════════════════

# ── L — Lock screen ───────────────────────────────────────────────────────────
bind = , L, exec, \
    notify-send "🔒 Locking..." \
    --urgency=low --expire-time=1000 \
    --hint=string:x-dunst-stack-tag:power-action && \
    sleep 0.2 && \
    hyprlock --immediate
bind = , L, submap, reset

# ── L — Lock + immediate display off ─────────────────────────────────────────
bind = SHIFT, L, exec, \
    hyprlock --immediate & \
    sleep 0.5 && \
    hyprctl dispatch dpms off && \
    notify-send "🔒 Locked + Display off" \
    --urgency=low --expire-time=1000
bind = SHIFT, L, submap, reset

# ── E — Logout / Exit Hyprland ────────────────────────────────────────────────
bind = , E, exec, \
    notify-send "🚪 Logging out..." \
    --urgency=normal --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:power-action && \
    ash session cleanup && \
    sleep 0.5
bind = , E, exit
bind = , E, submap, reset

# ── Confirmed logout (Shift+E) ────────────────────────────────────────────────
bind = SHIFT, E, exec, \
    CONFIRM=$(echo -e "Yes\nNo" | \
    rofi -dmenu -p "🚪 Confirm logout?" \
    -theme-str 'window {width: 20%; height: 8%;} listview {lines: 2;}') && \
    [ "$CONFIRM" = "Yes" ] && \
    ash session cleanup && \
    hyprctl dispatch exit
bind = SHIFT, E, submap, reset

# ══════════════════════════════════════════════════════════════════════════════
# §05  POWER STATES
# ══════════════════════════════════════════════════════════════════════════════

# ── S — Suspend (sleep / RAM) ─────────────────────────────────────────────────
bind = , S, exec, \
    notify-send "💤 Suspending..." \
    --urgency=normal --expire-time=2000 \
    --hint=string:x-dunst-stack-tag:power-action && \
    hyprlock --immediate & \
    sleep 1 && \
    systemctl suspend
bind = , S, submap, reset

# ── S — Suspend without lock ─────────────────────────────────────────────────
bind = SHIFT, S, exec, \
    notify-send "💤 Suspending (no lock)..." \
    --urgency=normal --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:power-action && \
    sleep 0.5 && \
    systemctl suspend
bind = SHIFT, S, submap, reset

# ── H — Hibernate ─────────────────────────────────────────────────────────────
bind = , H, exec, \
    CONFIRM=$(echo -e "Yes\nNo" | \
    rofi -dmenu -p "❄ Confirm hibernate?" \
    -theme-str 'window {width: 22%; height: 8%;} listview {lines: 2;}') && \
    [ "$CONFIRM" = "Yes" ] && \
    notify-send "❄ Hibernating..." \
    --urgency=normal --expire-time=2000 && \
    hyprlock --immediate & sleep 0.5 && systemctl hibernate
bind = , H, submap, reset

# ── R — Reboot ────────────────────────────────────────────────────────────────
bind = , R, exec, \
    CONFIRM=$(echo -e "Yes\nNo" | \
    rofi -dmenu -p "🔄 Confirm reboot?" \
    -theme-str 'window {width: 20%; height: 8%;} listview {lines: 2;}') && \
    [ "$CONFIRM" = "Yes" ] && \
    notify-send "🔄 Rebooting..." \
    --urgency=critical --expire-time=3000 \
    --hint=string:x-dunst-stack-tag:power-action && \
    ash session cleanup && \
    sleep 1 && \
    systemctl reboot
bind = , R, submap, reset

# ── R — Quick reboot (Shift — no confirmation) ───────────────────────────────
bind = SHIFT, R, exec, \
    notify-send "🔄 Rebooting NOW..." \
    --urgency=critical --expire-time=2000 \
    --hint=string:x-dunst-stack-tag:power-action && \
    ash session cleanup && \
    sleep 0.8 && \
    systemctl reboot
bind = SHIFT, R, submap, reset

# ── P — Power off / Shutdown ──────────────────────────────────────────────────
bind = , P, exec, \
    CONFIRM=$(echo -e "Yes\nNo" | \
    rofi -dmenu -p "⏻ Confirm shutdown?" \
    -theme-str 'window {width: 22%; height: 8%;} listview {lines: 2;}') && \
    [ "$CONFIRM" = "Yes" ] && \
    notify-send "⏻ Shutting down..." \
    --urgency=critical --expire-time=3000 \
    --hint=string:x-dunst-stack-tag:power-action && \
    ash session cleanup && \
    sleep 1 && \
    systemctl poweroff
bind = , P, submap, reset

# ── P — Immediate shutdown (Shift — no confirmation) ─────────────────────────
bind = SHIFT, P, exec, \
    notify-send "⏻ SHUTDOWN — 3 seconds..." \
    --urgency=critical --expire-time=3000 && \
    sleep 3 && \
    ash session cleanup && \
    systemctl poweroff
bind = SHIFT, P, submap, reset

# ── Reboot to UEFI/BIOS firmware ─────────────────────────────────────────────
bind = CTRL, R, exec, \
    CONFIRM=$(echo -e "Yes\nNo" | \
    rofi -dmenu -p "🔧 Reboot to BIOS/UEFI?" \
    -theme-str 'window {width: 24%; height: 8%;} listview {lines: 2;}') && \
    [ "$CONFIRM" = "Yes" ] && \
    systemctl reboot --firmware-setup
bind = CTRL, R, submap, reset

# ── Reboot to bootloader ──────────────────────────────────────────────────────
bind = ALT, R, exec, \
    ENTRY=$(bootctl list 2>/dev/null | grep title | \
    awk '{print $2}' | \
    rofi -dmenu -p "🔧 Boot entry" \
    -theme-str 'window {width: 35%;}') && \
    [ -n "$ENTRY" ] && \
    systemctl reboot "$ENTRY"
bind = ALT, R, submap, reset

# ══════════════════════════════════════════════════════════════════════════════
# §06  DISPLAY POWER (DPMS)
# ══════════════════════════════════════════════════════════════════════════════

# ── D — Toggle all displays on/off ────────────────────────────────────────────
bind = , D, exec, \
    hyprctl dispatch dpms toggle && \
    STATUS=$(hyprctl -j monitors | jq -r '.[0].dpmsStatus') && \
    notify-send "🖥 Display $([ "$STATUS" = "true" ] && echo "ON" || echo "OFF")" \
    --urgency=low --expire-time=2000 \
    --hint=string:x-dunst-stack-tag:power-action
bind = , D, submap, reset

# ── D — Turn displays off (Shift — force off) ────────────────────────────────
bind = SHIFT, D, exec, \
    hyprctl dispatch dpms off && \
    notify-send "🖥 Displays OFF" \
    --urgency=low --expire-time=1500
bind = SHIFT, D, submap, reset

# ── D — Turn displays on (Ctrl) ──────────────────────────────────────────────
bind = CTRL, D, exec, \
    hyprctl dispatch dpms on && \
    notify-send "🖥 Displays ON" \
    --urgency=low --expire-time=1500
bind = CTRL, D, submap, reset

# ══════════════════════════════════════════════════════════════════════════════
# §07  NIGHT LIGHT / BLUE LIGHT FILTER
# ══════════════════════════════════════════════════════════════════════════════

# ── N — Toggle night light ────────────────────────────────────────────────────
bind = , N, exec, \
    if pgrep -x hyprsunset > /dev/null; then \
        pkill hyprsunset && \
        notify-send "🌙 Night light: OFF" \
        --urgency=low --expire-time=2000 \
        --hint=string:x-dunst-stack-tag:night-light; \
    else \
        hyprsunset -t 3500 & \
        notify-send "🌙 Night light: ON (3500K)" \
        --urgency=low --expire-time=2000 \
        --hint=string:x-dunst-stack-tag:night-light; \
    fi
bind = , N, submap, reset

# ── N — Set temperature interactively (Shift) ────────────────────────────────
bind = SHIFT, N, exec, \
    TEMP=$(echo -e "6500K (Daylight)\n5500K (Warm)\n4500K (Evening)\n3500K (Night)\n2700K (Bedtime)" | \
    rofi -dmenu -p "🌙 Color temperature" \
    -theme-str 'window {width: 28%;} listview {lines: 5;}' | \
    grep -oP '\d+(?=K)') && \
    [ -n "$TEMP" ] && \
    pkill hyprsunset 2>/dev/null; \
    hyprsunset -t $TEMP & \
    notify-send "🌙 Night light: ${TEMP}K" \
    --urgency=low --expire-time=2000
bind = SHIFT, N, submap, reset

# ══════════════════════════════════════════════════════════════════════════════
# §08  PERFORMANCE PROFILES
# ══════════════════════════════════════════════════════════════════════════════

# ── B — Battery saver mode ────────────────────────────────────────────────────
bind = , B, exec, \
    powerprofilesctl set power-saver 2>/dev/null || true && \
    ash mode battery && \
    notify-send "🔋 Battery saver activated" \
    "Display: dimmed | Animations: minimal | VRR: off\nPower profile: power-saver" \
    --app-name=ASH-Power \
    -i ~/.config/ash-dotfiles/assets/icons/ash-system/battery-mode.svg \
    --urgency=normal --expire-time=4000 \
    --hint=string:x-dunst-stack-tag:power-profile
bind = , B, submap, reset

# ── F — Performance mode ──────────────────────────────────────────────────────
bind = , F, exec, \
    powerprofilesctl set performance 2>/dev/null || true && \
    notify-send "⚡ Performance mode activated" \
    "GPU: full power | VRR: enabled | Animations: minimal" \
    --app-name=ASH-Power \
    -i ~/.config/ash-dotfiles/assets/icons/ash-system/game-mode.svg \
    --urgency=normal --expire-time=4000 \
    --hint=string:x-dunst-stack-tag:power-profile
bind = , F, submap, reset

# ── O — Balanced mode ─────────────────────────────────────────────────────────
bind = , O, exec, \
    powerprofilesctl set balanced 2>/dev/null || true && \
    ash mode default && \
    notify-send "⚖ Balanced mode activated" \
    "Power profile: balanced" \
    --app-name=ASH-Power \
    --urgency=normal --expire-time=3000 \
    --hint=string:x-dunst-stack-tag:power-profile
bind = , O, submap, reset

# ── G — Game mode ─────────────────────────────────────────────────────────────
bind = , G, exec, \
    powerprofilesctl set performance 2>/dev/null || true && \
    ash mode game && \
    notify-send "🎮 Game mode activated" \
    "Blur: off | Shadows: off | Rounding: off | VRR: fullscreen" \
    --app-name=ASH-Power \
    -i ~/.config/ash-dotfiles/assets/icons/ash-system/game-mode.svg \
    --urgency=normal --expire-time=4000 \
    --hint=string:x-dunst-stack-tag:power-profile
bind = , G, submap, reset

# ══════════════════════════════════════════════════════════════════════════════
# §09  ROFI POWER MENU
# ══════════════════════════════════════════════════════════════════════════════

# ── M — Full Rofi power menu ──────────────────────────────────────────────────
bind = , M, exec, ~/.config/rofi/menus/powermenu/powermenu.sh
bind = , M, submap, reset

# ── W — Wlogout full-screen power menu ───────────────────────────────────────
bind = , W, exec, wlogout --protocol layer-shell
bind = , W, submap, reset

# ══════════════════════════════════════════════════════════════════════════════
# §10  EMERGENCY / RECOVERY OPTIONS
# ══════════════════════════════════════════════════════════════════════════════

# ── K — Kill compositor (emergency exit) ──────────────────────────────────────
# Triple-fire safety: must press K three times mentally (no actual protection
# against accidental press — use ONLY in emergency)
bind = , K, exec, \
    notify-send \
    "💀 EMERGENCY: Killing Hyprland in 3s" \
    "Press Escape NOW to cancel!\n\nAll unsaved work will be LOST." \
    --app-name=ASH-Emergency \
    --urgency=critical \
    --expire-time=3000 && \
    sleep 3 && \
    pkill -9 Hyprland
bind = , K, submap, reset

# ── X — Kill active application ───────────────────────────────────────────────
bind = , X, exec, \
    CLASS=$(hyprctl -j activewindow | jq -r '.class'); \
    CONFIRM=$(echo -e "Yes\nNo" | \
    rofi -dmenu -p "💀 Kill: $CLASS?" \
    -theme-str 'window {width: 25%; height: 8%;} listview {lines: 2;}') && \
    [ "$CONFIRM" = "Yes" ] && \
    hyprctl dispatch closewindow active && \
    notify-send "💀 Killed: $CLASS" \
    --urgency=normal --expire-time=2000
bind = , X, submap, reset

# ── Z — Kill all windows on workspace ────────────────────────────────────────
bind = , Z, exec, \
    WS=$(hyprctl -j activeworkspace | jq -r '.id'); \
    COUNT=$(hyprctl -j clients | jq "[.[] | select(.workspace.id == $WS)] | length"); \
    CONFIRM=$(echo -e "Yes\nNo" | \
    rofi -dmenu -p "💀 Kill ALL $COUNT windows on workspace?" \
    -theme-str 'window {width: 35%; height: 8%;} listview {lines: 2;}') && \
    [ "$CONFIRM" = "Yes" ] && \
    hyprctl -j clients | jq -r \
    ".[] | select(.workspace.id == $WS) | .address" | \
    xargs -I{} hyprctl dispatch closewindow address:{} && \
    notify-send "💀 Killed $COUNT windows" \
    --urgency=normal --expire-time=2000
bind = , Z, submap, reset

# ── C — GPU/display recovery (force re-render) ────────────────────────────────
bind = , C, exec, \
    hyprctl dispatch forcerendererreload && \
    notify-send "🔧 Renderer reloaded" \
    "GPU shaders recompiled, display pipeline reset." \
    --urgency=normal --expire-time=3000
bind = , C, submap, reset

# ── V — Restart Waybar ────────────────────────────────────────────────────────
bind = , V, exec, \
    pkill -x waybar; sleep 0.3 && \
    waybar --config ~/.config/waybar/config.jsonc \
           --style ~/.config/waybar/style.css & \
    notify-send "🔄 Waybar restarted" \
    --urgency=low --expire-time=2000
bind = , V, submap, reset

# ── U — Restart notification daemon ──────────────────────────────────────────
bind = , U, exec, \
    pkill -x swaync; sleep 0.2 && swaync & \
    notify-send "🔔 Notification daemon restarted" \
    --urgency=low --expire-time=2000
bind = , U, submap, reset

# ══════════════════════════════════════════════════════════════════════════════
# §11  STATUS & INFORMATION
# ══════════════════════════════════════════════════════════════════════════════

# ── I — System info before power action ──────────────────────────────────────
bind = , I, exec, \
    UPTIME=$(uptime -p 2>/dev/null || uptime | awk '{print $3,$4}'); \
    BATTERY=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1 || echo "N/A"); \
    CHARGING=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -1 || echo "N/A"); \
    PROFILE=$(powerprofilesctl get 2>/dev/null || echo "N/A"); \
    LOAD=$(uptime | awk -F'load average:' '{print $2}' | xargs); \
    SESSIONS=$(loginctl list-sessions 2>/dev/null | wc -l); \
    notify-send "System Status" \
    "⏱ Uptime: $UPTIME\n\
🔋 Battery: $BATTERY% ($CHARGING)\n\
⚡ Profile: $PROFILE\n\
📊 Load avg: $LOAD\n\
👤 Sessions: $((SESSIONS-2))" \
    --urgency=low --expire-time=8000 \
    --hint=string:x-dunst-stack-tag:power-info

# ── A — ASH session snapshot before power action ──────────────────────────────
bind = , A, exec, \
    ash snapshot create --tag "pre-power-$(date +%H%M%S)" && \
    notify-send "ASH" "💾 Config snapshot saved (pre-power)" \
    --urgency=low --expire-time=3000 \
    --hint=string:x-dunst-stack-tag:power-action
bind = , A, submap, reset

# ══════════════════════════════════════════════════════════════════════════════
# §12  HELP DISPLAY
# ══════════════════════════════════════════════════════════════════════════════

bind = , question, exec, \
    notify-send "ASH Power Menu — Reference" \
    "── SESSION ─────────────────────────────\n\
L          →  🔒  Lock screen\n\
Shift+L    →  🔒🖥  Lock + display off\n\
E          →  🚪  Logout (confirmed)\n\
Shift+E    →  🚪  Logout (double-confirm)\n\
\n── POWER ──────────────────────────────\n\
S          →  💤  Suspend\n\
Shift+S    →  💤  Suspend (no lock)\n\
H          →  ❄   Hibernate (confirmed)\n\
R          →  🔄  Reboot (confirmed)\n\
Shift+R    →  🔄  Reboot (immediate)\n\
Ctrl+R     →  🔧  Reboot to BIOS/UEFI\n\
Alt+R      →  🔧  Reboot to bootloader\n\
P          →  ⏻   Shutdown (confirmed)\n\
Shift+P    →  ⏻   Shutdown (3s countdown)\n\
\n── DISPLAY ─────────────────────────────\n\
D          →  🖥  Toggle displays\n\
Shift+D    →  🖥  Displays OFF\n\
Ctrl+D     →  🖥  Displays ON\n\
N          →  🌙  Night light toggle\n\
Shift+N    →  🌙  Night light temperature\n\
\n── PROFILES ────────────────────────────\n\
B          →  🔋  Battery saver\n\
O          →  ⚖   Balanced mode\n\
F          →  ⚡  Performance mode\n\
G          →  🎮  Game mode\n\
\n── MENUS ───────────────────────────────\n\
M          →  🎨  Rofi power menu\n\
W          →  🪟  Wlogout full-screen\n\
\n── EMERGENCY ───────────────────────────\n\
K          →  💀  Kill compositor (3s delay)\n\
X          →  💀  Kill active window\n\
Z          →  💀  Kill workspace windows\n\
C          →  🔧  Reload GPU renderer\n\
V          →  🔄  Restart Waybar\n\
U          →  🔔  Restart notifications\n\
\n── INFO ────────────────────────────────\n\
I          →  📊  System status\n\
A          →  💾  Create config snapshot\n\
?          →  ❓  This help" \
    --urgency=low \
    --expire-time=20000 \
    --hint=string:x-dunst-stack-tag:power-help

# ══════════════════════════════════════════════════════════════════════════════
# §13  AUTO-RESET (safety — exits after any unbound key)
# ══════════════════════════════════════════════════════════════════════════════

# Auto-cancel: any unrecognized keypress exits power mode
# This prevents accidental power actions from stray keypresses
bind = , catchall, submap, reset

# ── Exit power submap ──────────────────────────────────────────────────────────
bind = , Escape,            submap, reset
bind = $mainMod, Escape,    submap, reset
bind = , Return,            submap, reset
bind = , q,                 submap, reset

submap = reset

# ══════════════════════════════════════════════════════════════════════════════
# EOF — power-submap.conf
# Direct power actions (skip submap):
#   ash power lock          → lock screen
#   ash power suspend       → suspend
#   ash power reboot        → reboot (confirmed)
#   ash power shutdown      → shutdown (confirmed)
# ══════════════════════════════════════════════════════════════════════════════