# ══════════════════════════════════════════════════════════════════════════════
# §01  CUSTOM BIND QUICK-START REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  ── Bind formats ─────────────────────────────────────────────────────────────
#
#  bind    = MOD, KEY, DISPATCHER [, ARGS]   — on keypress
#  bindm   = MOD, KEY, DISPATCHER [, ARGS]   — mouse bind
#  bindr   = MOD, KEY, DISPATCHER [, ARGS]   — on key release
#  binde   = MOD, KEY, DISPATCHER [, ARGS]   — repeat while held
#  bindl   = MOD, KEY, DISPATCHER [, ARGS]   — active on lock screen
#  bindel  = MOD, KEY, DISPATCHER [, ARGS]   — held + lock screen
#
#  ── Modifier aliases (from env.conf) ─────────────────────────────────────────
#  $mainMod  = SUPER       $altMod   = ALT
#  $shiftMod = SHIFT       $ctrlMod  = CTRL
#  $hyperMod = SUPER+SHIFT+CTRL+ALT
#
#  ── Application variables (from default.conf) ────────────────────────────────
#  $terminal $browser $editor $launcher $fileManager
#
#  ── ASH variables ────────────────────────────────────────────────────────────
#  $ashTheme $ashSnapshot $ashReload $ashDoctor $ashUpdate
#  $themePicker $wallpaperPicker $modeSelector
#
#  ── Common dispatchers ───────────────────────────────────────────────────────
#  exec              CMD              — run shell command
#  killactive                         — close focused window
#  togglefloating                     — float/tile toggle
#  fullscreen        [0|1|2]          — fullscreen modes
#  workspace         N|name|+1|-1     — switch workspace
#  movetoworkspace   N                — move window to workspace
#  focusmonitor      dir|name         — focus monitor
#  submap            NAME             — enter submap
#
#  ── Key names reference ───────────────────────────────────────────────────────
#  Letters:     A-Z (uppercase in config = key name, not shift)
#  Numbers:     0-9
#  F-keys:      F1-F35
#  Special:     Return Escape Tab space BackSpace Delete
#               Insert Home End Prior Next (PageUp/Down)
#               Print Pause Scroll_Lock
#  Numpad:      KP_0-KP_9 KP_Add KP_Subtract KP_Multiply
#               KP_Divide KP_Enter KP_Decimal KP_Insert
#  Arrow:       left right up down
#  Symbols:     comma period slash backslash bracketleft bracketright
#               semicolon apostrophe grave minus equal
#  Media:       XF86AudioPlay XF86AudioNext XF86AudioPrev
#               XF86AudioMute XF86AudioRaiseVolume XF86AudioLowerVolume
#               XF86MonBrightnessUp XF86MonBrightnessDown
#               XF86Calculator XF86Sleep XF86Display
#  Mouse:       mouse:272(left) mouse:273(right) mouse:274(middle)
#               mouse_up mouse_down (scroll)
#
# ══════════════════════════════════════════════════════════════════════════════
