# ══════════════════════════════════════════════════════════════════════════════
# §17  BIND MANAGEMENT COMMANDS
#      Useful commands for managing your custom binds
# ══════════════════════════════════════════════════════════════════════════════

#  ── Testing & validation ─────────────────────────────────────────────────────
#
#  Reload config to test new binds:
#    hyprctl reload
#
#  List all active binds (searchable):
#    hyprctl binds | jq '.[] | "\(.modmask) \(.key) → \(.dispatcher) \(.arg)"'
#
#  Search for specific bind:
#    hyprctl binds | jq '.[] | select(.key == "F7")'
#
#  Check for bind conflicts:
#    ash doctor check --binds
#
#  Interactive bind viewer:
#    ash keybind search PATTERN
#
#  List only custom binds:
#    ash keybind list --file custom
#
#  ── Syntax reference for this file ───────────────────────────────────────────
#
#  bind = $mainMod, KEY, dispatcher [, args]
#  #      ────────  ───  ──────────────────
#  #       mods     key    action
#
#  Common modifier combos:
#    $mainMod            = Super alone
#    $mainMod SHIFT      = Super + Shift
#    $mainMod ALT        = Super + Alt
#    $mainMod CTRL       = Super + Ctrl
#    $mainMod SHIFT ALT  = Super + Shift + Alt
#    $mainMod CTRL SHIFT = Super + Ctrl + Shift
#    $hyperMod           = Super + Shift + Ctrl + Alt

# ══════════════════════════════════════════════════════════════════════════════
# §18  ASH CUSTOM BIND HOOKS
#      Executed by ASH on specific events — integrate your workflows
# ══════════════════════════════════════════════════════════════════════════════

# These are NOT keybinds — they are hook scripts called by ASH internals.
# Edit the corresponding hook files to run code on system events:
#
#  ~/.config/hypr/scripts/hooks/on-login.sh         — on session start
#  ~/.config/hypr/scripts/hooks/post-theme-change.sh — after theme switch
#  ~/.config/hypr/scripts/hooks/on-battery.sh        — when on battery
#  ~/.config/hypr/scripts/hooks/on-ac-power.sh       — when plugged in
#  ~/.config/hypr/scripts/hooks/on-monitor-connect.sh — display connected
#  ~/.config/hypr/scripts/hooks/on-window-open.sh    — any window opens
#  ~/.config/hypr/scripts/hooks/on-workspace-change.sh — workspace switch

