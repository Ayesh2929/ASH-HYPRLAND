# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Group Submap                                     ║
# ║                                                                              ║
# ║  Modal window group management. Provides full tabbed-layout control:        ║
# ║  create, navigate, merge, split, lock, rearrange and style groups           ║
# ║                                                                              ║
# ║  ENTER:  $mainMod + G ────────────────────────────────────────────────────── ║
# ║  EXIT:   Escape │ Return │ $mainMod + G                                     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  ACTIVATE GROUP SUBMAP
# ══════════════════════════════════════════════════════════════════════════════

bind = $mainMod, G,     submap, group

submap = group

# ══════════════════════════════════════════════════════════════════════════════
# §02  ENTRY NOTIFICATION
# ══════════════════════════════════════════════════════════════════════════════

bind = , catchall, exec, \
    notify-send "ASH Group Mode" \
    "G — toggle group\nTab/N/P — next/prev tab\nL — lock\nR — remove\nH/J/K/L — merge direction\nEsc — exit" \
    --app-name=ASH-Submap \
    --icon=window-new \
    --urgency=low \
    --expire-time=4000 \
    --hint=string:x-dunst-stack-tag:submap

# ══════════════════════════════════════════════════════════════════════════════
# §03  GROUP CREATION & DESTRUCTION
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle group (create new / add to existing) ───────────────────────────────
bind = , G,         togglegroup
bind = , space,     togglegroup
bind = , Return,    togglegroup

# ── Remove current window from its group ──────────────────────────────────────
bind = , R,         moveoutofgroup
bind = , E,         moveoutofgroup
bind = , Delete,    moveoutofgroup
bind = , BackSpace, moveoutofgroup

# ── Burst all group members out (explode group) ───────────────────────────────
bind = SHIFT, E,    exec, \
    GROUP_SIZE=$(hyprctl -j activewindow | jq '.grouped | length'); \
    if [ "$GROUP_SIZE" -gt 0 ]; then \
        for i in $(seq 1 $GROUP_SIZE); do \
            hyprctl dispatch moveoutofgroup; \
            sleep 0.05; \
        done; \
        notify-send "ASH" "💥 Group exploded ($GROUP_SIZE windows)" \
        --urgency=low --expire-time=2000 \
        --hint=string:x-dunst-stack-tag:group; \
    else \
        notify-send "ASH" "No group to explode" \
        --urgency=low --expire-time=1500; \
    fi

# ══════════════════════════════════════════════════════════════════════════════
# §04  TAB NAVIGATION
#      Cycle through windows within a group
# ══════════════════════════════════════════════════════════════════════════════

# ── Next tab (forward) ────────────────────────────────────────────────────────
bind = , Tab,       changegroupactive,  f
bind = , N,         changegroupactive,  f
bind = , L,         changegroupactive,  f
bind = , right,     changegroupactive,  f
bind = , period,    changegroupactive,  f

# ── Previous tab (backward) ──────────────────────────────────────────────────
bind = SHIFT, Tab,  changegroupactive,  b
bind = , P,         changegroupactive,  b
bind = , H,         changegroupactive,  b
bind = , left,      changegroupactive,  b
bind = , comma,     changegroupactive,  b

# ── Jump to specific tab by number ────────────────────────────────────────────
bind = , 1, exec, \
    for i in $(seq 1 10); do \
        hyprctl dispatch changegroupactive b; \
    done && \
    notify-send "ASH" "Tab: first" \
    --urgency=low --expire-time=800 \
    --hint=string:x-dunst-stack-tag:group

bind = , 2, exec, \
    for i in $(seq 1 10); do hyprctl dispatch changegroupactive b; done && \
    hyprctl dispatch changegroupactive f && \
    notify-send "ASH" "Tab: 2" \
    --urgency=low --expire-time=800

bind = , 3, exec, \
    for i in $(seq 1 10); do hyprctl dispatch changegroupactive b; done && \
    for i in $(seq 1 2); do hyprctl dispatch changegroupactive f; done && \
    notify-send "ASH" "Tab: 3" \
    --urgency=low --expire-time=800

bind = , 4, exec, \
    for i in $(seq 1 10); do hyprctl dispatch changegroupactive b; done && \
    for i in $(seq 1 3); do hyprctl dispatch changegroupactive f; done && \
    notify-send "ASH" "Tab: 4" \
    --urgency=low --expire-time=800

bind = , 5, exec, \
    for i in $(seq 1 10); do hyprctl dispatch changegroupactive b; done && \
    for i in $(seq 1 4); do hyprctl dispatch changegroupactive f; done && \
    notify-send "ASH" "Tab: 5" \
    --urgency=low --expire-time=800

# ══════════════════════════════════════════════════════════════════════════════
# §05  MERGE OPERATIONS
#      Merge current window into adjacent group
# ══════════════════════════════════════════════════════════════════════════════

# ── Move into group by direction ──────────────────────────────────────────────
bind = CTRL, H,     moveintogroup,  l
bind = CTRL, J,     moveintogroup,  d
bind = CTRL, K,     moveintogroup,  u
bind = CTRL, L,     moveintogroup,  r

bind = CTRL, left,  moveintogroup,  l
bind = CTRL, down,  moveintogroup,  d
bind = CTRL, up,    moveintogroup,  u
bind = CTRL, right, moveintogroup,  r

# ── Smart move (move window or merge into group) ──────────────────────────────
bind = ALT, H,      movewindoworgroup,  l
bind = ALT, J,      movewindoworgroup,  d
bind = ALT, K,      movewindoworgroup,  u
bind = ALT, L,      movewindoworgroup,  r

bind = ALT, left,   movewindoworgroup,  l
bind = ALT, down,   movewindoworgroup,  d
bind = ALT, up,     movewindoworgroup,  u
bind = ALT, right,  movewindoworgroup,  r

# ══════════════════════════════════════════════════════════════════════════════
# §06  GROUP LOCK / UNLOCK
#      Prevent accidental tab switches or group changes
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle all group locks ────────────────────────────────────────────────────
bind = , L,         lockgroups,         toggle
bind = SHIFT, L,    lockgroups,         lock
bind = CTRL, L,     lockgroups,         unlock

# ── Lock with notification ────────────────────────────────────────────────────
bind = , semicolon, exec, \
    hyprctl dispatch lockgroups toggle && \
    STATUS=$(hyprctl -j activewindow | jq -r '.grouped | if length > 0 then "locked" else "unlocked" end') && \
    notify-send "ASH Group" "🔒 Groups: $STATUS" \
    --urgency=normal --expire-time=2000 \
    --hint=string:x-dunst-stack-tag:group

# ── Ignore group lock for this bind session ───────────────────────────────────
bind = , X,         setignoregrouplock, toggle

# ══════════════════════════════════════════════════════════════════════════════
# §07  GROUP INFORMATION & STATUS
# ══════════════════════════════════════════════════════════════════════════════

# ── Show group info ───────────────────────────────────────────────────────────
bind = , I, exec, \
    WININFO=$(hyprctl -j activewindow); \
    GROUP=$(echo $WININFO | jq -r '.grouped | length'); \
    CLASS=$(echo $WININFO | jq -r '.class'); \
    TITLE=$(echo $WININFO | jq -r '.title | .[0:60]'); \
    if [ "$GROUP" -gt 0 ]; then \
        notify-send "Group Info" \
        "📑 Group size: $GROUP tabs\nActive: $CLASS\nTitle: $TITLE\n\nPress Tab to cycle tabs" \
        --urgency=low --expire-time=6000 \
        --hint=string:x-dunst-stack-tag:group-info; \
    else \
        notify-send "Group Info" \
        "❌ No group — press G to create one\nClass: $CLASS" \
        --urgency=low --expire-time=3000 \
        --hint=string:x-dunst-stack-tag:group-info; \
    fi

# ── List all group members ────────────────────────────────────────────────────
bind = SHIFT, I, exec, \
    GROUPED=$(hyprctl -j clients | jq -r \
    '[.[] | select(.grouped | length > 0)] | \
    group_by(.grouped[0]) | \
    map({group: .[0].grouped[0], \
         members: map(.class + ": " + (.title | .[0:40])), \
         count: length}) | \
    .[] | "Group \(.count) windows: \(.members | join(", "))"'); \
    if [ -n "$GROUPED" ]; then \
        notify-send "All Groups" "$GROUPED" \
        --urgency=low --expire-time=8000; \
    else \
        notify-send "All Groups" "No window groups currently active" \
        --urgency=low --expire-time=2000; \
    fi

# ══════════════════════════════════════════════════════════════════════════════
# §08  ADVANCED GROUP OPERATIONS
# ══════════════════════════════════════════════════════════════════════════════

# ── Auto-group all windows on workspace ──────────────────────────────────────
bind = SHIFT, A, exec, \
    WS=$(hyprctl -j activeworkspace | jq -r '.id'); \
    COUNT=$(hyprctl -j clients | jq "[.[] | select(.workspace.id == $WS)] | length"); \
    notify-send "ASH" "Grouping $COUNT windows on workspace $WS..." \
    --urgency=low --expire-time=2000 && \
    for i in $(seq 1 $COUNT); do \
        hyprctl dispatch moveintogroup r; \
        sleep 0.1; \
    done && \
    notify-send "ASH" "✅ All workspace windows grouped" \
    --urgency=low --expire-time=3000

# ── Split active tab to new tiling window ─────────────────────────────────────
bind = SHIFT, S, exec, \
    hyprctl dispatch moveoutofgroup && \
    hyprctl dispatch settiled && \
    notify-send "ASH" "🗂 Tab split to tiling window" \
    --urgency=low --expire-time=2000 \
    --hint=string:x-dunst-stack-tag:group

# ── Float entire group as single unit ────────────────────────────────────────
bind = , F, exec, \
    hyprctl dispatch togglefloating && \
    hyprctl dispatch centerwindow && \
    notify-send "ASH" "⬜ Group set to floating" \
    --urgency=low --expire-time=2000 \
    --hint=string:x-dunst-stack-tag:group

# ── Send entire group to workspace ───────────────────────────────────────────
bind = SHIFT, 1, exec, \
    hyprctl dispatch movetoworkspacesilent 1 && \
    notify-send "ASH" "Group → Workspace 1" \
    --urgency=low --expire-time=1500
bind = SHIFT, 2, exec, \
    hyprctl dispatch movetoworkspacesilent 2 && \
    notify-send "ASH" "Group → Workspace 2" \
    --urgency=low --expire-time=1500
bind = SHIFT, 3, exec, \
    hyprctl dispatch movetoworkspacesilent 3 && \
    notify-send "ASH" "Group → Workspace 3" \
    --urgency=low --expire-time=1500

# ── Move active tab to specific workspace (take it out of group) ──────────────
bind = ALT, 1, exec, \
    hyprctl dispatch moveoutofgroup && \
    hyprctl dispatch movetoworkspacesilent 1 && \
    notify-send "ASH" "Tab → Workspace 1 (removed from group)" \
    --urgency=low --expire-time=2000
bind = ALT, 2, exec, \
    hyprctl dispatch moveoutofgroup && \
    hyprctl dispatch movetoworkspacesilent 2 && \
    notify-send "ASH" "Tab → Workspace 2 (removed from group)" \
    --urgency=low --expire-time=2000

# ══════════════════════════════════════════════════════════════════════════════
# §09  GROUP VISUAL STYLE SHORTCUTS
#      Quick theme overrides for active group
# ══════════════════════════════════════════════════════════════════════════════

# ── Set accent border color on group ─────────────────────────────────────────
bind = , A, exec, \
    ADDR=$(hyprctl -j activewindow | jq -r '.address'); \
    hyprctl setprop address:$ADDR bordercolor rgba(cba4f7ff) && \
    notify-send "ASH" "🎨 Group border: Mauve" \
    --urgency=low --expire-time=1500

# ── Set green border (focus group) ───────────────────────────────────────────
bind = SHIFT, G, exec, \
    ADDR=$(hyprctl -j activewindow | jq -r '.address'); \
    hyprctl setprop address:$ADDR bordercolor rgba(a6e3a1ff) && \
    notify-send "ASH" "🎨 Group border: Green (focus)" \
    --urgency=low --expire-time=1500

# ── Set red border (alert group) ─────────────────────────────────────────────
bind = SHIFT, R, exec, \
    ADDR=$(hyprctl -j activewindow | jq -r '.address'); \
    hyprctl setprop address:$ADDR bordercolor rgba(f38ba8ff) && \
    notify-send "ASH" "🎨 Group border: Red (alert)" \
    --urgency=low --expire-time=1500

# ── Reset to theme default ────────────────────────────────────────────────────
bind = CTRL, D, exec, \
    ADDR=$(hyprctl -j activewindow | jq -r '.address'); \
    hyprctl setprop address:$ADDR bordercolor 0 && \
    notify-send "ASH" "🎨 Group border: theme default" \
    --urgency=low --expire-time=1500

# ══════════════════════════════════════════════════════════════════════════════
# §10  HELP DISPLAY
# ══════════════════════════════════════════════════════════════════════════════

bind = , question, exec, \
    notify-send "ASH Group Mode — Full Reference" \
    "── CREATION ──────────────────────\n\
G / Space  →  toggle group\n\
R / Delete →  remove from group\n\
Shift+E    →  explode (all out)\n\
\n── NAVIGATION ────────────────────\n\
Tab / N / L / → → next tab\n\
Shift+Tab / P / H / ← → prev tab\n\
1-5        →  jump to tab N\n\
\n── MERGE ─────────────────────────\n\
Ctrl+HJKL  →  merge into group (dir)\n\
Alt+HJKL   →  smart move or merge\n\
\n── LOCK ───────────────────────────\n\
L          →  toggle lock\n\
Shift+L    →  force lock\n\
Ctrl+L     →  force unlock\n\
X          →  toggle ignore lock\n\
\n── WORKSPACE ──────────────────────\n\
Shift+1-3  →  send group to workspace\n\
Alt+1-2    →  remove tab, send to ws\n\
\n── VISUAL ─────────────────────────\n\
A          →  mauve border\n\
Shift+G    →  green border\n\
Shift+R    →  red border\n\
Ctrl+D     →  reset border\n\
\n── INFO ────────────────────────────\n\
I          →  group info\n\
Shift+I    →  all groups\n\
?          →  this help\n\
\n── EXIT ────────────────────────────\n\
Escape     →  exit mode" \
    --urgency=low \
    --expire-time=20000 \
    --hint=string:x-dunst-stack-tag:group-help

# ══════════════════════════════════════════════════════════════════════════════
# §11  EXIT GROUP SUBMAP
# ══════════════════════════════════════════════════════════════════════════════

bind = , Escape,        submap,     reset
bind = $mainMod, G,     submap,     reset
bind = CTRL, bracketleft, submap,   reset

submap = reset

# ══════════════════════════════════════════════════════════════════════════════
# EOF — group-submap.conf
# Inspect groups: hyprctl -j clients | jq '.[] | select(.grouped | length > 0)'
# Group dispatch: hyprctl dispatch togglegroup
# ASH groups:     ash window list --grouped
# ══════════════════════════════════════════════════════════════════════════════