# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Window Management Keybinds                       ║
# ║                                                                              ║
# ║  Focus navigation, window movement, tiling/floating toggle, resize,         ║
# ║  fullscreen, grouping, pinning, opacity control and window swapping          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  FOCUS NAVIGATION
#      Move keyboard focus between windows without moving them
# ══════════════════════════════════════════════════════════════════════════════

# ── Vim-style directional focus (HJKL) ───────────────────────────────────────
bind = $mainMod,        H,          movefocus,      l
bind = $mainMod,        J,          movefocus,      d
bind = $mainMod,        K,          movefocus,      u
bind = $mainMod,        L,          movefocus,      r

# ── Arrow key directional focus ───────────────────────────────────────────────
bind = $mainMod,        Left,       movefocus,      l
bind = $mainMod,        Down,       movefocus,      d
bind = $mainMod,        Up,         movefocus,      u
bind = $mainMod,        Right,      movefocus,      r

# ── Cycle through windows (forward / backward) ────────────────────────────────
# Next window in focus history
bind = $altMod,         Tab,        cyclenext
# Previous window in focus history
bind = $altMod SHIFT,   Tab,        cyclenext,      prev

# ── Focus most recent urgent window ──────────────────────────────────────────
bind = $mainMod,        U,          focusurgent

# ── Focus specific window by class (quick launchers) ─────────────────────────
# Focus Firefox if open (or launch it)
bind = $mainMod CTRL,   F,          exec, \
    hyprctl dispatch focuswindow class:firefox || firefox
# Focus Kitty terminal
bind = $mainMod CTRL,   T,          exec, \
    hyprctl dispatch focuswindow class:kitty || kitty
# Focus last floating window
bind = $mainMod CTRL,   space,      exec, \
    hyprctl dispatch focuswindow floating:1

# ══════════════════════════════════════════════════════════════════════════════
# §02  WINDOW MOVEMENT (SWAP / MOVE IN TILING)
#      Move windows within the tiling layout or across workspaces
# ══════════════════════════════════════════════════════════════════════════════

# ── Swap window with neighbor (Vim HJKL) ─────────────────────────────────────
bind = $mainMod SHIFT,  H,          swapwindow,     l
bind = $mainMod SHIFT,  J,          swapwindow,     d
bind = $mainMod SHIFT,  K,          swapwindow,     u
bind = $mainMod SHIFT,  L,          swapwindow,     r

# ── Swap window with neighbor (Arrow keys) ────────────────────────────────────
bind = $mainMod SHIFT,  Left,       swapwindow,     l
bind = $mainMod SHIFT,  Down,       swapwindow,     d
bind = $mainMod SHIFT,  Up,         swapwindow,     u
bind = $mainMod SHIFT,  Right,      swapwindow,     r

# ── Move window directionally (without swapping) ──────────────────────────────
bind = $mainMod CTRL,   H,          movewindow,     l silent
bind = $mainMod CTRL,   J,          movewindow,     d silent
bind = $mainMod CTRL,   K,          movewindow,     u silent
bind = $mainMod CTRL,   L,          movewindow,     r silent

# ── Move floating window with keys ────────────────────────────────────────────
# Move by 40px increments (smooth repositioning)
binde = $mainMod ALT,   H,          moveactive,     -40 0
binde = $mainMod ALT,   J,          moveactive,     0 40
binde = $mainMod ALT,   K,          moveactive,     0 -40
binde = $mainMod ALT,   L,          moveactive,     40 0

# ── Center floating window ────────────────────────────────────────────────────
bind = $mainMod,        slash,      centerwindow,   1
# Center on cursor (1 = cursor-relative centering)
bind = $mainMod SHIFT,  slash,      centerwindow,   0

# ══════════════════════════════════════════════════════════════════════════════
# §03  WINDOW RESIZE
#      Resize active window with keyboard
# ══════════════════════════════════════════════════════════════════════════════

# ── Resize with Super+Ctrl+Arrow (continuous while held) ─────────────────────
binde = $mainMod CTRL,   Right,     resizeactive,   30 0
binde = $mainMod CTRL,   Left,      resizeactive,   -30 0
binde = $mainMod CTRL,   Down,      resizeactive,   0 30
binde = $mainMod CTRL,   Up,        resizeactive,   0 -30

# ── Resize with Super+Ctrl+HJKL ──────────────────────────────────────────────
# binde = $mainMod CTRL,   L,         resizeactive,   30 0
# binde = $mainMod CTRL,   H,         resizeactive,   -30 0
# binde = $mainMod CTRL,   J,         resizeactive,   0 30
# binde = $mainMod CTRL,   K,         resizeactive,   0 -30

# ── Split ratio adjustment ────────────────────────────────────────────────────
# Expand master/primary pane
bind = $mainMod,        equal,      splitratio,     +0.05
# Shrink master/primary pane
bind = $mainMod,        minus,      splitratio,     -0.05
# Reset split ratio
bind = $mainMod SHIFT,  equal,      splitratio,     0

# ══════════════════════════════════════════════════════════════════════════════
# §04  TILING / FLOATING TOGGLE
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle floating state ─────────────────────────────────────────────────────
bind = $mainMod,        F,          togglefloating
# Force float with preset size (centered 1200x750)
bind = $mainMod SHIFT,  F,          exec, \
    hyprctl dispatch setfloating && \
    hyprctl dispatch resizeactive exact 1200 750 && \
    hyprctl dispatch centerwindow

# ── Float and pin to all workspaces ──────────────────────────────────────────
bind = $mainMod,        P,          pin
# Float + pin with specific position (top-right corner PiP)
bind = $mainMod SHIFT,  P,          exec, \
    hyprctl dispatch setfloating && \
    hyprctl dispatch resizeactive exact 480 270 && \
    hyprctl dispatch pin && \
    hyprctl dispatch moveactive 100%-495 100%-285

# ── Toggle pseudo-tiling (respects floating size in tiling) ───────────────────
bind = $mainMod,        Y,          pseudo

# ══════════════════════════════════════════════════════════════════════════════
# §05  FULLSCREEN MODES
# ══════════════════════════════════════════════════════════════════════════════

# ── True fullscreen (covers everything including bar) ─────────────────────────
bind = $mainMod,        F11,        fullscreen,     0
# Maximize (fullscreen respecting reserved bar area)
bind = $mainMod,        F10,        fullscreen,     1
# Fake fullscreen (app thinks it's fullscreen, compositor shows it normal)
bind = $mainMod SHIFT,  F11,        fakefullscreen

# ── Fullscreen toggle (alternate binding) ────────────────────────────────────
bind = $mainMod SHIFT,  Return,     fullscreen,     1

# ══════════════════════════════════════════════════════════════════════════════
# §06  WINDOW OPACITY CONTROL
#      Fine-grained transparency for active window
# ══════════════════════════════════════════════════════════════════════════════

# ── Opacity increase / decrease (hold to repeat) ─────────────────────────────
binde = $mainMod ALT,   O,          exec, \
    hyprctl setprop address:$(hyprctl -j activewindow | jq -r '.address') \
    alpha $(hyprctl -j activewindow \
    | jq 'if .alpha > 0.05 then .alpha - 0.05 else 0.05 end')

binde = $mainMod ALT SHIFT, O,      exec, \
    hyprctl setprop address:$(hyprctl -j activewindow | jq -r '.address') \
    alpha $(hyprctl -j activewindow \
    | jq 'if .alpha < 0.95 then .alpha + 0.05 else 1.0 end')

# ── Preset opacity levels ─────────────────────────────────────────────────────
# Full opacity
bind = $mainMod CTRL,   0,          exec, \
    hyprctl setprop address:$(hyprctl -j activewindow | jq -r '.address') \
    alpha 1.0
# 80% opacity
bind = $mainMod CTRL,   8,          exec, \
    hyprctl setprop address:$(hyprctl -j activewindow | jq -r '.address') \
    alpha 0.8
# 50% opacity (ghosting effect)
bind = $mainMod CTRL,   5,          exec, \
    hyprctl setprop address:$(hyprctl -j activewindow | jq -r '.address') \
    alpha 0.5

# ══════════════════════════════════════════════════════════════════════════════
# §07  WINDOW GROUPING (TABBED LAYOUT)
#      Window groups allow tabbing multiple windows in one container
# ══════════════════════════════════════════════════════════════════════════════

# ── Group creation / toggle ───────────────────────────────────────────────────
# Create new group / toggle current window into existing group
bind = $mainMod,        G,          togglegroup
# Remove focused window from its group
bind = $mainMod SHIFT,  G,          moveoutofgroup

# ── Navigate group tabs ───────────────────────────────────────────────────────
# Next tab in group
bind = $mainMod,        Tab,        changegroupactive,  f
# Previous tab in group
bind = $mainMod SHIFT,  Tab,        changegroupactive,  b

# ── Move window into adjacent group ──────────────────────────────────────────
bind = $mainMod CTRL,   H,          moveintogroup,      l
bind = $mainMod CTRL,   L,          moveintogroup,      r
bind = $mainMod CTRL,   K,          moveintogroup,      u
bind = $mainMod CTRL,   J,          moveintogroup,      d

# ── Smart move (move window or merge into group) ─────────────────────────────
bind = $mainMod ALT,    H,          movewindoworgroup,  l
bind = $mainMod ALT,    L,          movewindoworgroup,  r
bind = $mainMod ALT,    K,          movewindoworgroup,  u
bind = $mainMod ALT,    J,          movewindoworgroup,  d

# ── Lock group (prevent accidental tab changes) ───────────────────────────────
bind = $mainMod SHIFT,  G,          lockgroups,         toggle

# ══════════════════════════════════════════════════════════════════════════════
# §08  LAYOUT MANAGEMENT
#      Control tiling layout behavior
# ══════════════════════════════════════════════════════════════════════════════

# ── Switch layout engine ──────────────────────────────────────────────────────
# Toggle between dwindle and master layouts
bind = $mainMod ALT,    space,      exec, \
    CURRENT=$(hyprctl -j getoption general:layout | jq -r '.str'); \
    if [ "$CURRENT" = "dwindle" ]; then \
        hyprctl keyword general:layout master; \
    else \
        hyprctl keyword general:layout dwindle; \
    fi && notify-send "ASH" "Layout: $(hyprctl -j getoption general:layout | jq -r '.str')" \
    --expire-time=2000

# ── Master layout: swap master/slave ──────────────────────────────────────────
bind = $mainMod,        Return,     layoutmsg,      swapwithmaster
# Add to master stack
bind = $mainMod SHIFT,  i,          layoutmsg,      addmaster
# Remove from master stack
bind = $mainMod SHIFT,  d,          layoutmsg,      removemaster
# Cycle through master orientations (left/right/top/bottom)
bind = $mainMod ALT,    Return,     layoutmsg,      orientationcycle
# Next/previous window in master rotation
bind = $mainMod,        comma,      layoutmsg,      rollnext
bind = $mainMod SHIFT,  comma,      layoutmsg,      rollprev

# ── Dwindle layout: toggle split direction ────────────────────────────────────
bind = $mainMod,        T,          layoutmsg,      togglesplit
# Preserve split direction on open
bind = $mainMod SHIFT,  T,          layoutmsg,      preselect d

# ══════════════════════════════════════════════════════════════════════════════
# §09  WINDOW PROPERTIES & RULES
#      Dynamic property overrides for active window
# ══════════════════════════════════════════════════════════════════════════════

# ── Border override ───────────────────────────────────────────────────────────
# Force active border color to accent (override theme)
bind = $mainMod CTRL,   A,          exec, \
    hyprctl setprop address:$(hyprctl -j activewindow | jq -r '.address') \
    bordercolor rgba(203164f7ff)

# Remove border from active window
bind = $mainMod CTRL,   D,          exec, \
    hyprctl setprop address:$(hyprctl -j activewindow | jq -r '.address') \
    noborder 1

# ── Rounding override ────────────────────────────────────────────────────────
# Toggle rounding on active window
bind = $mainMod CTRL,   R,          exec, \
    hyprctl setprop address:$(hyprctl -j activewindow | jq -r '.address') \
    rounding $(hyprctl -j activewindow | jq 'if .rounding == 0 then 12 else 0 end')

# ── Immediate (tearing) toggle for current window ────────────────────────────
# Enable tearing (maximum performance for games)
bind = $hyperMod,       T,          exec, \
    hyprctl setprop address:$(hyprctl -j activewindow | jq -r '.address') \
    immediate 1 && notify-send "ASH" "⚡ Tearing enabled for this window" \
    --expire-time=2000

# ══════════════════════════════════════════════════════════════════════════════
# §10  WINDOW INFORMATION
# ══════════════════════════════════════════════════════════════════════════════

# ── Show active window info ───────────────────────────────────────────────────
bind = $mainMod,        I,          exec, \
    WININFO=$(hyprctl -j activewindow); \
    notify-send "Window Info" \
    "$(echo $WININFO | jq -r '"Class: \(.class)\nTitle: \(.title)\nWorkspace: \(.workspace.name)\nFloat: \(.floating)\nSize: \(.size[0])×\(.size[1])\nPos: \(.at[0]),\(.at[1])\nPID: \(.pid)"')" \
    --expire-time=6000 \
    -i dialog-information

# ── Copy window class to clipboard ───────────────────────────────────────────
bind = $mainMod SHIFT,  I,          exec, \
    hyprctl -j activewindow | jq -r '.class' | \
    wl-copy && notify-send "ASH" "Window class copied to clipboard" \
    --expire-time=2000

# ══════════════════════════════════════════════════════════════════════════════
# §11  RESIZE SUBMAP
#      Enter with: $mainMod + F8
#      Exit with:  Escape or Return
# ══════════════════════════════════════════════════════════════════════════════

submap = resize

# ── Resize with HJKL (vim-style) ─────────────────────────────────────────────
binde =         , H,        resizeactive,   -20 0
binde =         , J,        resizeactive,   0 20
binde =         , K,        resizeactive,   0 -20
binde =         , L,        resizeactive,   20 0

# ── Resize with arrow keys ────────────────────────────────────────────────────
binde =         , left,     resizeactive,   -20 0
binde =         , down,     resizeactive,   0 20
binde =         , up,       resizeactive,   0 -20
binde =         , right,    resizeactive,   20 0

# ── Fine-grained resize with Shift ────────────────────────────────────────────
binde = SHIFT,  , H,        resizeactive,   -5 0
binde = SHIFT,  , J,        resizeactive,   0 5
binde = SHIFT,  , K,        resizeactive,   0 -5
binde = SHIFT,  , L,        resizeactive,   5 0

# ── Coarse resize with Ctrl ───────────────────────────────────────────────────
binde = CTRL,   , H,        resizeactive,   -80 0
binde = CTRL,   , J,        resizeactive,   0 80
binde = CTRL,   , K,        resizeactive,   0 -80
binde = CTRL,   , L,        resizeactive,   80 0

# ── Reset window to default size ──────────────────────────────────────────────
bind =          , R,        exec,           hyprctl dispatch resizeactive exact 800 600
# Center after resize
bind =          , C,        centerwindow

# ── Exit resize submap ────────────────────────────────────────────────────────
bind =          , Return,   submap,         reset
bind =          , Escape,   submap,         reset
bind = $mainMod,, F8,       submap,         reset

submap = reset

# ══════════════════════════════════════════════════════════════════════════════
# §12  MOVE SUBMAP
#      Enter with: $mainMod + Shift + F8
#      Exit with:  Escape or Return
# ══════════════════════════════════════════════════════════════════════════════

submap = move

# ── Move floating window with HJKL ───────────────────────────────────────────
binde =         , H,        moveactive,     -20 0
binde =         , J,        moveactive,     0 20
binde =         , K,        moveactive,     0 -20
binde =         , L,        moveactive,     20 0

# ── Move with arrow keys ──────────────────────────────────────────────────────
binde =         , left,     moveactive,     -20 0
binde =         , down,     moveactive,     0 20
binde =         , up,       moveactive,     0 -20
binde =         , right,    moveactive,     20 0

# ── Fine move with Shift ──────────────────────────────────────────────────────
binde = SHIFT,  , H,        moveactive,     -4 0
binde = SHIFT,  , J,        moveactive,     0 4
binde = SHIFT,  , K,        moveactive,     0 -4
binde = SHIFT,  , L,        moveactive,     4 0

# ── Snap to corners ───────────────────────────────────────────────────────────
bind =          , 7,        moveactive,     0 0
bind =          , 9,        exec, \
    hyprctl dispatch moveactive \
    $(hyprctl -j monitors | jq -r '.[0].width - (.activewindow // {size:[800,0]} | .size[0]) | tostring') 0
bind =          , 1,        exec, \
    hyprctl dispatch moveactive 0 \
    $(hyprctl -j monitors | jq -r '.[0].height - (.activewindow // {size:[0,600]} | .size[1]) | tostring')
bind =          , 3,        exec, \
    hyprctl dispatch moveactive \
    $(hyprctl -j monitors | jq -r '.[0].width - (.activewindow // {size:[800,0]} | .size[0]) | tostring') \
    $(hyprctl -j monitors | jq -r '.[0].height - (.activewindow // {size:[0,600]} | .size[1]) | tostring')
# Center
bind =          , 5,        centerwindow

# ── Exit move submap ──────────────────────────────────────────────────────────
bind =          , Return,   submap,         reset
bind =          , Escape,   submap,         reset
bind = $mainMod SHIFT,, F8, submap,         reset

submap = reset

# ══════════════════════════════════════════════════════════════════════════════
# §13  GROUP SUBMAP
#      Enter with: $mainMod + G
#      Exit with:  Escape or Return
# ══════════════════════════════════════════════════════════════════════════════

submap = group

# ── Create / manage group ─────────────────────────────────────────────────────
bind =          , G,        togglegroup
bind =          , space,    togglegroup
# Remove from group
bind =          , R,        moveoutofgroup
# Lock group
bind =          , L,        lockgroups,     toggle

# ── Tab navigation in group ───────────────────────────────────────────────────
bind =          , Tab,      changegroupactive,  f
bind = SHIFT,   , Tab,      changegroupactive,  b
bind =          , N,        changegroupactive,  f
bind =          , P,        changegroupactive,  b
bind =          , H,        changegroupactive,  b
bind =          , L,        changegroupactive,  f

# ── Merge into adjacent group ─────────────────────────────────────────────────
bind =          , left,     moveintogroup,  l
bind =          , right,    moveintogroup,  r
bind =          , up,       moveintogroup,  u
bind =          , down,     moveintogroup,  d

# ── Exit group submap ─────────────────────────────────────────────────────────
bind =          , Return,   submap,         reset
bind =          , Escape,   submap,         reset

submap = reset

