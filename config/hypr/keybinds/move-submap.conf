# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Move Submap                                      ║
# ║                                                                              ║
# ║  Modal window movement mode for precise floating window positioning.        ║
# ║  Supports: pixel-step, fine-grained, corner snap, edge snap,               ║
# ║  monitor-aware positioning, grid alignment and coordinate input             ║
# ║                                                                              ║
# ║  ENTER:  $mainMod + Shift + F8 ──────────────────────────────────────────── ║
# ║  EXIT:   Escape │ Return │ $mainMod + Shift + F8                            ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  ACTIVATE MOVE SUBMAP
# ══════════════════════════════════════════════════════════════════════════════

bind = $mainMod SHIFT, F8,      submap, move
bind = $mainMod CTRL,  M,       submap, move

submap = move

# ══════════════════════════════════════════════════════════════════════════════
# §02  ENTRY NOTIFICATION
# ══════════════════════════════════════════════════════════════════════════════

bind = , catchall, exec, \
    notify-send "ASH Move Mode" \
    "HJKL / Arrows — move\nShift — fine (4px)\nCtrl — jump (80px)\nNumpad — snap to position\nEsc — exit" \
    --app-name=ASH-Submap \
    --icon=transform-move \
    --urgency=low \
    --expire-time=4000 \
    --hint=string:x-dunst-stack-tag:submap

# ══════════════════════════════════════════════════════════════════════════════
# §03  STANDARD MOVE (20px per step)
#      Primary movement with HJKL and arrow keys
# ══════════════════════════════════════════════════════════════════════════════

# ── Vim-style HJKL movement ───────────────────────────────────────────────────
binde = , H,        moveactive,     -20  0
binde = , J,        moveactive,      0   20
binde = , K,        moveactive,      0  -20
binde = , L,        moveactive,      20  0

# ── Arrow key movement ────────────────────────────────────────────────────────
binde = , left,     moveactive,     -20  0
binde = , down,     moveactive,      0   20
binde = , up,       moveactive,      0  -20
binde = , right,    moveactive,      20  0

# ══════════════════════════════════════════════════════════════════════════════
# §04  FINE MOVEMENT (4px per step — Shift modifier)
#      Pixel-perfect sub-grid positioning
# ══════════════════════════════════════════════════════════════════════════════

binde = SHIFT, H,       moveactive,     -4   0
binde = SHIFT, J,       moveactive,      0   4
binde = SHIFT, K,       moveactive,      0  -4
binde = SHIFT, L,       moveactive,      4   0

binde = SHIFT, left,    moveactive,     -4   0
binde = SHIFT, down,    moveactive,      0   4
binde = SHIFT, up,      moveactive,      0  -4
binde = SHIFT, right,   moveactive,      4   0

# ── Ultra-fine (1px) ──────────────────────────────────────────────────────────
binde = CTRL SHIFT, H,      moveactive, -1   0
binde = CTRL SHIFT, J,      moveactive,  0   1
binde = CTRL SHIFT, K,      moveactive,  0  -1
binde = CTRL SHIFT, L,      moveactive,  1   0

# ══════════════════════════════════════════════════════════════════════════════
# §05  COARSE MOVEMENT (80px per step — Ctrl modifier)
#      Large jumps for rapid repositioning
# ══════════════════════════════════════════════════════════════════════════════

binde = CTRL, H,        moveactive,     -80  0
binde = CTRL, J,        moveactive,      0   80
binde = CTRL, K,        moveactive,      0  -80
binde = CTRL, L,        moveactive,      80  0

binde = CTRL, left,     moveactive,     -80  0
binde = CTRL, down,     moveactive,      0   80
binde = CTRL, up,       moveactive,      0  -80
binde = CTRL, right,    moveactive,      80  0

# ══════════════════════════════════════════════════════════════════════════════
# §06  NUMPAD POSITION PRESETS
#      Snap window to screen regions via numpad layout
#      7=top-left  8=top-center  9=top-right
#      4=mid-left  5=center      6=mid-right
#      1=bot-left  2=bot-center  3=bot-right
# ══════════════════════════════════════════════════════════════════════════════

# ── Get monitor geometry helper ───────────────────────────────────────────────
# $MON_W and $MON_H extracted per bind via hyprctl

# ── KP_7 — Top Left ───────────────────────────────────────────────────────────
bind = , KP_7, exec, \
    hyprctl dispatch moveactive 12 12 && \
    notify-send "ASH" "↖ Top Left" \
    --urgency=low --expire-time=800 \
    --hint=string:x-dunst-stack-tag:move-pos

# ── KP_8 — Top Center ─────────────────────────────────────────────────────────
bind = , KP_8, exec, \
    MON_W=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    WIN_W=$(hyprctl -j activewindow | jq '.size[0]'); \
    X=$(( ($MON_W - $WIN_W) / 2 )); \
    hyprctl dispatch moveactive $X 12 && \
    notify-send "ASH" "↑ Top Center" \
    --urgency=low --expire-time=800 \
    --hint=string:x-dunst-stack-tag:move-pos

# ── KP_9 — Top Right ──────────────────────────────────────────────────────────
bind = , KP_9, exec, \
    MON_W=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    WIN_W=$(hyprctl -j activewindow | jq '.size[0]'); \
    X=$(( $MON_W - $WIN_W - 12 )); \
    hyprctl dispatch moveactive $X 12 && \
    notify-send "ASH" "↗ Top Right" \
    --urgency=low --expire-time=800 \
    --hint=string:x-dunst-stack-tag:move-pos

# ── KP_4 — Middle Left ────────────────────────────────────────────────────────
bind = , KP_4, exec, \
    MON_H=$(hyprctl -j monitors | jq '.[] | select(.focused) | .height'); \
    WIN_H=$(hyprctl -j activewindow | jq '.size[1]'); \
    Y=$(( ($MON_H - $WIN_H) / 2 )); \
    hyprctl dispatch moveactive 12 $Y && \
    notify-send "ASH" "← Middle Left" \
    --urgency=low --expire-time=800 \
    --hint=string:x-dunst-stack-tag:move-pos

# ── KP_5 — Center (true center of monitor) ────────────────────────────────────
bind = , KP_5, exec, \
    hyprctl dispatch centerwindow && \
    notify-send "ASH" "⊕ Centered" \
    --urgency=low --expire-time=800 \
    --hint=string:x-dunst-stack-tag:move-pos

# ── KP_6 — Middle Right ───────────────────────────────────────────────────────
bind = , KP_6, exec, \
    MON_W=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    MON_H=$(hyprctl -j monitors | jq '.[] | select(.focused) | .height'); \
    WIN_W=$(hyprctl -j activewindow | jq '.size[0]'); \
    WIN_H=$(hyprctl -j activewindow | jq '.size[1]'); \
    X=$(( $MON_W - $WIN_W - 12 )); \
    Y=$(( ($MON_H - $WIN_H) / 2 )); \
    hyprctl dispatch moveactive $X $Y && \
    notify-send "ASH" "→ Middle Right" \
    --urgency=low --expire-time=800 \
    --hint=string:x-dunst-stack-tag:move-pos

# ── KP_1 — Bottom Left ────────────────────────────────────────────────────────
bind = , KP_1, exec, \
    MON_H=$(hyprctl -j monitors | jq '.[] | select(.focused) | .height'); \
    WIN_H=$(hyprctl -j activewindow | jq '.size[1]'); \
    Y=$(( $MON_H - $WIN_H - 12 )); \
    hyprctl dispatch moveactive 12 $Y && \
    notify-send "ASH" "↙ Bottom Left" \
    --urgency=low --expire-time=800 \
    --hint=string:x-dunst-stack-tag:move-pos

# ── KP_2 — Bottom Center ──────────────────────────────────────────────────────
bind = , KP_2, exec, \
    MON_W=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    MON_H=$(hyprctl -j monitors | jq '.[] | select(.focused) | .height'); \
    WIN_W=$(hyprctl -j activewindow | jq '.size[0]'); \
    WIN_H=$(hyprctl -j activewindow | jq '.size[1]'); \
    X=$(( ($MON_W - $WIN_W) / 2 )); \
    Y=$(( $MON_H - $WIN_H - 12 )); \
    hyprctl dispatch moveactive $X $Y && \
    notify-send "ASH" "↓ Bottom Center" \
    --urgency=low --expire-time=800 \
    --hint=string:x-dunst-stack-tag:move-pos

# ── KP_3 — Bottom Right ───────────────────────────────────────────────────────
bind = , KP_3, exec, \
    MON_W=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    MON_H=$(hyprctl -j monitors | jq '.[] | select(.focused) | .height'); \
    WIN_W=$(hyprctl -j activewindow | jq '.size[0]'); \
    WIN_H=$(hyprctl -j activewindow | jq '.size[1]'); \
    X=$(( $MON_W - $WIN_W - 12 )); \
    Y=$(( $MON_H - $WIN_H - 12 )); \
    hyprctl dispatch moveactive $X $Y && \
    notify-send "ASH" "↘ Bottom Right" \
    --urgency=low --expire-time=800 \
    --hint=string:x-dunst-stack-tag:move-pos

# ══════════════════════════════════════════════════════════════════════════════
# §07  LETTER-BASED POSITION SHORTCUTS
#      Mnemonic position keys without numpad
# ══════════════════════════════════════════════════════════════════════════════

# ── C — Center ────────────────────────────────────────────────────────────────
bind = , C, exec, \
    hyprctl dispatch centerwindow && \
    notify-send "ASH" "⊕ Window centered" \
    --urgency=low --expire-time=1000 \
    --hint=string:x-dunst-stack-tag:move-pos

# ── T — Top center ────────────────────────────────────────────────────────────
bind = , T, exec, \
    MON_W=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    WIN_W=$(hyprctl -j activewindow | jq '.size[0]'); \
    X=$(( ($MON_W - $WIN_W) / 2 )); \
    hyprctl dispatch moveactive $X 12 && \
    notify-send "ASH" "↑ Top center" \
    --urgency=low --expire-time=1000 \
    --hint=string:x-dunst-stack-tag:move-pos

# ── B — Bottom center ─────────────────────────────────────────────────────────
bind = , B, exec, \
    MON_W=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    MON_H=$(hyprctl -j monitors | jq '.[] | select(.focused) | .height'); \
    WIN_W=$(hyprctl -j activewindow | jq '.size[0]'); \
    WIN_H=$(hyprctl -j activewindow | jq '.size[1]'); \
    X=$(( ($MON_W - $WIN_W) / 2 )); \
    Y=$(( $MON_H - $WIN_H - 12 )); \
    hyprctl dispatch moveactive $X $Y && \
    notify-send "ASH" "↓ Bottom center" \
    --urgency=low --expire-time=1000 \
    --hint=string:x-dunst-stack-tag:move-pos

# ── F — Far right edge ────────────────────────────────────────────────────────
bind = , F, exec, \
    MON_W=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    WIN_W=$(hyprctl -j activewindow | jq '.size[0]'); \
    X=$(( $MON_W - $WIN_W - 12 )); \
    hyprctl dispatch moveactive $X \
        $(hyprctl -j activewindow | jq '.at[1]') && \
    notify-send "ASH" "→ Far right" \
    --urgency=low --expire-time=1000 \
    --hint=string:x-dunst-stack-tag:move-pos

# ── PiP — Picture-in-Picture position (bottom-right corner) ──────────────────
bind = , P, exec, \
    MON_W=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    MON_H=$(hyprctl -j monitors | jq '.[] | select(.focused) | .height'); \
    WIN_W=$(hyprctl -j activewindow | jq '.size[0]'); \
    WIN_H=$(hyprctl -j activewindow | jq '.size[1]'); \
    X=$(( $MON_W - $WIN_W - 20 )); \
    Y=$(( $MON_H - $WIN_H - 20 )); \
    hyprctl dispatch moveactive $X $Y && \
    notify-send "ASH" "🎬 PiP position (bottom-right)" \
    --urgency=low --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:move-pos

# ══════════════════════════════════════════════════════════════════════════════
# §08  EDGE SNAPPING
#      Snap window to monitor edges with configurable margin
# ══════════════════════════════════════════════════════════════════════════════

# ── Snap to left edge ─────────────────────────────────────────────────────────
bind = ALT, H, exec, \
    Y=$(hyprctl -j activewindow | jq '.at[1]'); \
    hyprctl dispatch moveactive 12 $Y && \
    notify-send "ASH" "⊢ Snapped to left edge" \
    --urgency=low --expire-time=800 \
    --hint=string:x-dunst-stack-tag:snap

# ── Snap to right edge ────────────────────────────────────────────────────────
bind = ALT, L, exec, \
    MON_W=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    WIN_W=$(hyprctl -j activewindow | jq '.size[0]'); \
    Y=$(hyprctl -j activewindow | jq '.at[1]'); \
    X=$(( $MON_W - $WIN_W - 12 )); \
    hyprctl dispatch moveactive $X $Y && \
    notify-send "ASH" "⊣ Snapped to right edge" \
    --urgency=low --expire-time=800 \
    --hint=string:x-dunst-stack-tag:snap

# ── Snap to top edge ──────────────────────────────────────────────────────────
bind = ALT, K, exec, \
    X=$(hyprctl -j activewindow | jq '.at[0]'); \
    hyprctl dispatch moveactive $X 12 && \
    notify-send "ASH" "⊤ Snapped to top edge" \
    --urgency=low --expire-time=800 \
    --hint=string:x-dunst-stack-tag:snap

# ── Snap to bottom edge ───────────────────────────────────────────────────────
bind = ALT, J, exec, \
    MON_H=$(hyprctl -j monitors | jq '.[] | select(.focused) | .height'); \
    WIN_H=$(hyprctl -j activewindow | jq '.size[1]'); \
    X=$(hyprctl -j activewindow | jq '.at[0]'); \
    Y=$(( $MON_H - $WIN_H - 12 )); \
    hyprctl dispatch moveactive $X $Y && \
    notify-send "ASH" "⊥ Snapped to bottom edge" \
    --urgency=low --expire-time=800 \
    --hint=string:x-dunst-stack-tag:snap

# ══════════════════════════════════════════════════════════════════════════════
# §09  MONITOR-RELATIVE POSITIONS
#      Thirds and quarters of monitor space
# ══════════════════════════════════════════════════════════════════════════════

# ── Left third of monitor ─────────────────────────────────────────────────────
bind = CTRL ALT, H, exec, \
    MON_W=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    MON_H=$(hyprctl -j monitors | jq '.[] | select(.focused) | .height'); \
    W=$(( $MON_W / 3 )); \
    hyprctl dispatch resizeactive exact $W $MON_H && \
    hyprctl dispatch moveactive 0 0 && \
    notify-send "ASH" "◧ Left third" \
    --urgency=low --expire-time=1000 \
    --hint=string:x-dunst-stack-tag:snap

# ── Right two-thirds ──────────────────────────────────────────────────────────
bind = CTRL ALT, L, exec, \
    MON_W=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    MON_H=$(hyprctl -j monitors | jq '.[] | select(.focused) | .height'); \
    W=$(( $MON_W * 2 / 3 )); \
    X=$(( $MON_W - $W )); \
    hyprctl dispatch resizeactive exact $W $MON_H && \
    hyprctl dispatch moveactive $X 0 && \
    notify-send "ASH" "◨ Right two-thirds" \
    --urgency=low --expire-time=1000 \
    --hint=string:x-dunst-stack-tag:snap

# ── Top half ──────────────────────────────────────────────────────────────────
bind = CTRL ALT, K, exec, \
    MON_W=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    MON_H=$(hyprctl -j monitors | jq '.[] | select(.focused) | .height'); \
    H=$(( $MON_H / 2 )); \
    hyprctl dispatch resizeactive exact $MON_W $H && \
    hyprctl dispatch moveactive 0 0 && \
    notify-send "ASH" "⬒ Top half" \
    --urgency=low --expire-time=1000 \
    --hint=string:x-dunst-stack-tag:snap

# ── Bottom half ───────────────────────────────────────────────────────────────
bind = CTRL ALT, J, exec, \
    MON_W=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    MON_H=$(hyprctl -j monitors | jq '.[] | select(.focused) | .height'); \
    H=$(( $MON_H / 2 )); \
    hyprctl dispatch resizeactive exact $MON_W $H && \
    hyprctl dispatch moveactive 0 $H && \
    notify-send "ASH" "⬓ Bottom half" \
    --urgency=low --expire-time=1000 \
    --hint=string:x-dunst-stack-tag:snap

# ══════════════════════════════════════════════════════════════════════════════
# §10  COORDINATE INPUT
#      Move window to exact pixel coordinates
# ══════════════════════════════════════════════════════════════════════════════

bind = , G, exec, \
    INPUT=$(rofi -dmenu \
        -p "📍 Position (X,Y)" \
        -theme-str 'window {width: 25%;}' \
        -filter "100,100") && \
    [ -n "$INPUT" ] && \
    X=$(echo "$INPUT" | cut -d, -f1) && \
    Y=$(echo "$INPUT" | cut -d, -f2) && \
    [ -n "$X" ] && [ -n "$Y" ] && \
    hyprctl dispatch moveactive "$X" "$Y" && \
    notify-send "ASH" "📍 Moved to: ${X},${Y}" \
    --urgency=low --expire-time=2000 \
    --hint=string:x-dunst-stack-tag:move-pos

# ══════════════════════════════════════════════════════════════════════════════
# §11  WINDOW INFO WHILE IN MOVE MODE
# ══════════════════════════════════════════════════════════════════════════════

bind = , I, exec, \
    WININFO=$(hyprctl -j activewindow); \
    X=$(echo $WININFO | jq '.at[0]'); \
    Y=$(echo $WININFO | jq '.at[1]'); \
    W=$(echo $WININFO | jq '.size[0]'); \
    H=$(echo $WININFO | jq '.size[1]'); \
    CLASS=$(echo $WININFO | jq -r '.class'); \
    notify-send "Window Position" \
    "📍 Position: ${X},${Y}\n📐 Size: ${W}×${H}\nClass: $CLASS" \
    --urgency=low --expire-time=5000 \
    --hint=string:x-dunst-stack-tag:move-info

# ── Copy position to clipboard ────────────────────────────────────────────────
bind = , V, exec, \
    X=$(hyprctl -j activewindow | jq '.at[0]'); \
    Y=$(hyprctl -j activewindow | jq '.at[1]'); \
    echo -n "${X},${Y}" | wl-copy && \
    notify-send "ASH" "📋 Position copied: ${X},${Y}" \
    --urgency=low --expire-time=2000

# ══════════════════════════════════════════════════════════════════════════════
# §12  EXIT MOVE SUBMAP
# ══════════════════════════════════════════════════════════════════════════════

bind = , Escape,                    submap, reset
bind = , Return,                    submap, reset
bind = $mainMod SHIFT, F8,          submap, reset
bind = $mainMod CTRL,  M,           submap, reset

submap = reset

# ══════════════════════════════════════════════════════════════════════════════
# EOF — move-submap.conf
# Window position: hyprctl -j activewindow | jq '.at'
# Monitor info:    hyprctl -j monitors | jq '.[] | select(.focused)'
# ══════════════════════════════════════════════════════════════════════════════