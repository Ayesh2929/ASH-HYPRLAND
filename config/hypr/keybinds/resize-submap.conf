# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Resize Submap                                    ║
# ║                                                                              ║
# ║  Modal resize mode for precise window dimension control.                    ║
# ║  Supports: pixel-perfect, percentage-based, preset sizes,                  ║
# ║  edge-aware, split-ratio, aspect-ratio lock and multi-monitor resize        ║
# ║                                                                              ║
# ║  ENTER:  $mainMod + F8  ─────────────────────────────────────────────────── ║
# ║  EXIT:   Escape │ Return │ $mainMod + F8                                    ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  SUBMAP ENTRY BIND
#      Defined in window-management.conf — duplicated here for reference
# ══════════════════════════════════════════════════════════════════════════════

# bind = $mainMod, F8, submap, resize
# Entering resize submap:
#   → Waybar shows "RESIZE" mode indicator
#   → Cursor changes to resize cursor
#   → All binds below become active

# ══════════════════════════════════════════════════════════════════════════════
# §02  ACTIVATE RESIZE SUBMAP
# ══════════════════════════════════════════════════════════════════════════════

bind = $mainMod, F8, submap, resize
bind = $mainMod CTRL, R, submap, resize

submap = resize

# ══════════════════════════════════════════════════════════════════════════════
# §03  ENTRY NOTIFICATION
#      Notify user that resize mode is active
# ══════════════════════════════════════════════════════════════════════════════

# Announce submap entry (fires once on activation)
bind = , catchall, exec, \
    notify-send "ASH Resize Mode" \
    "HJKL / Arrows — resize\nShift — fine (5px)\nCtrl — coarse (80px)\n1-9 — presets\nAspect — A\nEsc — exit" \
    --app-name=ASH-Submap \
    --icon=preferences-system-windows \
    --urgency=low \
    --expire-time=4000 \
    --hint=string:x-dunst-stack-tag:submap

# ══════════════════════════════════════════════════════════════════════════════
# §04  STANDARD RESIZE (20px per step)
#      Primary resize with HJKL and arrow keys
# ══════════════════════════════════════════════════════════════════════════════

# ── Vim-style resize (HJKL) ───────────────────────────────────────────────────
# H = shrink width       L = grow width
# J = grow height        K = shrink height
binde = , H,        resizeactive,       -20  0
binde = , J,        resizeactive,        0   20
binde = , K,        resizeactive,        0  -20
binde = , L,        resizeactive,        20  0

# ── Arrow key resize ──────────────────────────────────────────────────────────
binde = , left,     resizeactive,       -20  0
binde = , down,     resizeactive,        0   20
binde = , up,       resizeactive,        0  -20
binde = , right,    resizeactive,        20  0

# ══════════════════════════════════════════════════════════════════════════════
# §05  FINE RESIZE (5px per step — Shift modifier)
#      Sub-pixel precision for exact sizing
# ══════════════════════════════════════════════════════════════════════════════

binde = SHIFT,  H,      resizeactive,   -5   0
binde = SHIFT,  J,      resizeactive,    0   5
binde = SHIFT,  K,      resizeactive,    0  -5
binde = SHIFT,  L,      resizeactive,    5   0

binde = SHIFT,  left,   resizeactive,   -5   0
binde = SHIFT,  down,   resizeactive,    0   5
binde = SHIFT,  up,     resizeactive,    0  -5
binde = SHIFT,  right,  resizeactive,    5   0

# ══════════════════════════════════════════════════════════════════════════════
# §06  COARSE RESIZE (80px per step — Ctrl modifier)
#      Fast large adjustments for dramatic size changes
# ══════════════════════════════════════════════════════════════════════════════

binde = CTRL,   H,      resizeactive,   -80  0
binde = CTRL,   J,      resizeactive,    0   80
binde = CTRL,   K,      resizeactive,    0  -80
binde = CTRL,   L,      resizeactive,    80  0

binde = CTRL,   left,   resizeactive,   -80  0
binde = CTRL,   down,   resizeactive,    0   80
binde = CTRL,   up,     resizeactive,    0  -80
binde = CTRL,   right,  resizeactive,    80  0

# ══════════════════════════════════════════════════════════════════════════════
# §07  PRESET WINDOW SIZES
#      Number keys 1-9 apply common size presets
#      Format: exact WIDTH HEIGHT
# ══════════════════════════════════════════════════════════════════════════════

# ── Preset 1 — Micro (480×320) — e.g. compact utility ────────────────────────
bind = , 1, exec, \
    hyprctl dispatch resizeactive exact 480 320 && \
    hyprctl dispatch centerwindow && \
    notify-send "ASH" "📐 Size: 480×320 (Micro)" \
    --urgency=low --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:resize

# ── Preset 2 — Tiny (640×480) — e.g. classic 4:3 ─────────────────────────────
bind = , 2, exec, \
    hyprctl dispatch resizeactive exact 640 480 && \
    hyprctl dispatch centerwindow && \
    notify-send "ASH" "📐 Size: 640×480 (Tiny 4:3)" \
    --urgency=low --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:resize

# ── Preset 3 — Small (800×600) ────────────────────────────────────────────────
bind = , 3, exec, \
    hyprctl dispatch resizeactive exact 800 600 && \
    hyprctl dispatch centerwindow && \
    notify-send "ASH" "📐 Size: 800×600 (Small)" \
    --urgency=low --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:resize

# ── Preset 4 — Medium (1024×768) ─────────────────────────────────────────────
bind = , 4, exec, \
    hyprctl dispatch resizeactive exact 1024 768 && \
    hyprctl dispatch centerwindow && \
    notify-send "ASH" "📐 Size: 1024×768 (Medium)" \
    --urgency=low --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:resize

# ── Preset 5 — HD (1280×720) — 16:9 ──────────────────────────────────────────
bind = , 5, exec, \
    hyprctl dispatch resizeactive exact 1280 720 && \
    hyprctl dispatch centerwindow && \
    notify-send "ASH" "📐 Size: 1280×720 (HD 16:9)" \
    --urgency=low --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:resize

# ── Preset 6 — Large (1400×900) ───────────────────────────────────────────────
bind = , 6, exec, \
    hyprctl dispatch resizeactive exact 1400 900 && \
    hyprctl dispatch centerwindow && \
    notify-send "ASH" "📐 Size: 1400×900 (Large)" \
    --urgency=low --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:resize

# ── Preset 7 — FHD (1920×1080) — 16:9 ────────────────────────────────────────
bind = , 7, exec, \
    hyprctl dispatch resizeactive exact 1920 1080 && \
    hyprctl dispatch centerwindow && \
    notify-send "ASH" "📐 Size: 1920×1080 (FHD)" \
    --urgency=low --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:resize

# ── Preset 8 — QHD (2560×1440) ────────────────────────────────────────────────
bind = , 8, exec, \
    hyprctl dispatch resizeactive exact 2560 1440 && \
    hyprctl dispatch centerwindow && \
    notify-send "ASH" "📐 Size: 2560×1440 (QHD)" \
    --urgency=low --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:resize

# ── Preset 9 — Maximize (fill monitor minus gaps) ────────────────────────────
bind = , 9, exec, \
    MONW=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    MONH=$(hyprctl -j monitors | jq '.[] | select(.focused) | .height'); \
    W=$(($MONW - 24)); H=$(($MONH - 24)); \
    hyprctl dispatch resizeactive exact $W $H && \
    hyprctl dispatch centerwindow && \
    notify-send "ASH" "📐 Size: ${W}×${H} (Monitor fill)" \
    --urgency=low --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:resize

# ── Preset 0 — Golden ratio (monitor × 0.618) ────────────────────────────────
bind = , 0, exec, \
    MONW=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    MONH=$(hyprctl -j monitors | jq '.[] | select(.focused) | .height'); \
    W=$(echo "$MONW * 0.618" | bc | cut -d. -f1); \
    H=$(echo "$MONH * 0.618" | bc | cut -d. -f1); \
    hyprctl dispatch resizeactive exact $W $H && \
    hyprctl dispatch centerwindow && \
    notify-send "ASH" "📐 Size: ${W}×${H} (Golden ratio)" \
    --urgency=low --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:resize

# ══════════════════════════════════════════════════════════════════════════════
# §08  PERCENTAGE-BASED RESIZE
#      Resize to percentage of monitor resolution
# ══════════════════════════════════════════════════════════════════════════════

# ── 25% of monitor ───────────────────────────────────────────────────────────
bind = ALT, 1, exec, \
    MONW=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    MONH=$(hyprctl -j monitors | jq '.[] | select(.focused) | .height'); \
    W=$(($MONW / 4)); H=$(($MONH / 4)); \
    hyprctl dispatch resizeactive exact $W $H && \
    hyprctl dispatch centerwindow && \
    notify-send "ASH" "📐 25% monitor: ${W}×${H}" \
    --urgency=low --expire-time=1500

# ── 33% of monitor ───────────────────────────────────────────────────────────
bind = ALT, 3, exec, \
    MONW=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    MONH=$(hyprctl -j monitors | jq '.[] | select(.focused) | .height'); \
    W=$(($MONW / 3)); H=$(($MONH / 3)); \
    hyprctl dispatch resizeactive exact $W $H && \
    hyprctl dispatch centerwindow && \
    notify-send "ASH" "📐 33% monitor: ${W}×${H}" \
    --urgency=low --expire-time=1500

# ── 50% of monitor ───────────────────────────────────────────────────────────
bind = ALT, 5, exec, \
    MONW=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    MONH=$(hyprctl -j monitors | jq '.[] | select(.focused) | .height'); \
    W=$(($MONW / 2)); H=$(($MONH / 2)); \
    hyprctl dispatch resizeactive exact $W $H && \
    hyprctl dispatch centerwindow && \
    notify-send "ASH" "📐 50% monitor: ${W}×${H}" \
    --urgency=low --expire-time=1500

# ── 75% of monitor ───────────────────────────────────────────────────────────
bind = ALT, 7, exec, \
    MONW=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    MONH=$(hyprctl -j monitors | jq '.[] | select(.focused) | .height'); \
    W=$(($MONW * 3 / 4)); H=$(($MONH * 3 / 4)); \
    hyprctl dispatch resizeactive exact $W $H && \
    hyprctl dispatch centerwindow && \
    notify-send "ASH" "📐 75% monitor: ${W}×${H}" \
    --urgency=low --expire-time=1500

# ── 90% of monitor ───────────────────────────────────────────────────────────
bind = ALT, 9, exec, \
    MONW=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    MONH=$(hyprctl -j monitors | jq '.[] | select(.focused) | .height'); \
    W=$(($MONW * 9 / 10)); H=$(($MONH * 9 / 10)); \
    hyprctl dispatch resizeactive exact $W $H && \
    hyprctl dispatch centerwindow && \
    notify-send "ASH" "📐 90% monitor: ${W}×${H}" \
    --urgency=low --expire-time=1500

# ══════════════════════════════════════════════════════════════════════════════
# §09  ASPECT RATIO LOCK
#      Maintain window aspect ratio while resizing
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle aspect ratio lock ──────────────────────────────────────────────────
bind = , A, exec, \
    notify-send "ASH Resize" \
    "🔒 Aspect ratio: use Shift+HJKL to resize with lock\n(manual implementation)" \
    --urgency=low --expire-time=3000 \
    --hint=string:x-dunst-stack-tag:resize

# ── 16:9 aspect ratio ─────────────────────────────────────────────────────────
bind = CTRL, 9, exec, \
    W=$(hyprctl -j activewindow | jq -r '.size[0]'); \
    H=$(echo "$W * 9 / 16" | bc); \
    hyprctl dispatch resizeactive exact $W $H && \
    notify-send "ASH" "📐 Aspect: 16:9 (${W}×${H})" \
    --urgency=low --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:resize

# ── 4:3 aspect ratio ──────────────────────────────────────────────────────────
bind = CTRL, 4, exec, \
    W=$(hyprctl -j activewindow | jq -r '.size[0]'); \
    H=$(echo "$W * 3 / 4" | bc); \
    hyprctl dispatch resizeactive exact $W $H && \
    notify-send "ASH" "📐 Aspect: 4:3 (${W}×${H})" \
    --urgency=low --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:resize

# ── 21:9 ultrawide ────────────────────────────────────────────────────────────
bind = CTRL, 2, exec, \
    W=$(hyprctl -j activewindow | jq -r '.size[0]'); \
    H=$(echo "$W * 9 / 21" | bc); \
    hyprctl dispatch resizeactive exact $W $H && \
    notify-send "ASH" "📐 Aspect: 21:9 (${W}×${H})" \
    --urgency=low --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:resize

# ── Square ────────────────────────────────────────────────────────────────────
bind = CTRL, 1, exec, \
    W=$(hyprctl -j activewindow | jq -r '.size[0]'); \
    hyprctl dispatch resizeactive exact $W $W && \
    notify-send "ASH" "📐 Aspect: 1:1 Square (${W}×${W})" \
    --urgency=low --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:resize

# ══════════════════════════════════════════════════════════════════════════════
# §10  SPLIT RATIO CONTROL (tiling layout)
#      Adjust master/slave split in tiling
# ══════════════════════════════════════════════════════════════════════════════

# ── Increase master pane ──────────────────────────────────────────────────────
binde = , equal, splitratio, +0.02
# ── Decrease master pane ──────────────────────────────────────────────────────
binde = , minus, splitratio, -0.02
# ── Fine split adjust ─────────────────────────────────────────────────────────
binde = SHIFT, equal, splitratio, +0.005
binde = SHIFT, minus, splitratio, -0.005
# ── Reset to 50/50 ────────────────────────────────────────────────────────────
bind = , backslash, exec, \
    hyprctl keyword dwindle:split_width_multiplier 1.0 && \
    notify-send "ASH" "⚖ Split ratio reset to 50/50" \
    --urgency=low --expire-time=1500

# ══════════════════════════════════════════════════════════════════════════════
# §11  WINDOW INFORMATION IN RESIZE MODE
# ══════════════════════════════════════════════════════════════════════════════

# ── Show current window dimensions ────────────────────────────────────────────
bind = , I, exec, \
    WININFO=$(hyprctl -j activewindow); \
    W=$(echo $WININFO | jq -r '.size[0]'); \
    H=$(echo $WININFO | jq -r '.size[1]'); \
    FLOATING=$(echo $WININFO | jq -r '.floating'); \
    CLASS=$(echo $WININFO | jq -r '.class'); \
    notify-send "Window Size" \
    "📐 ${W}×${H}px\nClass: $CLASS\nFloat: $FLOATING\n\nAspect: $(echo "scale=2; $W/$H" | bc):1" \
    --urgency=low --expire-time=5000 \
    --hint=string:x-dunst-stack-tag:resize-info

# ── Copy dimensions to clipboard ──────────────────────────────────────────────
bind = , C, exec, \
    W=$(hyprctl -j activewindow | jq -r '.size[0]'); \
    H=$(hyprctl -j activewindow | jq -r '.size[1]'); \
    echo -n "${W}x${H}" | wl-copy && \
    notify-send "ASH" "📋 Dimensions copied: ${W}x${H}" \
    --urgency=low --expire-time=2000

# ══════════════════════════════════════════════════════════════════════════════
# §12  CUSTOM SIZE INPUT
#      Enter exact dimensions via rofi prompt
# ══════════════════════════════════════════════════════════════════════════════

bind = , T, exec, \
    INPUT=$(rofi -dmenu \
        -p "📐 Size (WxH)" \
        -theme-str 'window {width: 25%;}' \
        -filter "1280x720") && \
    [ -n "$INPUT" ] && \
    W=$(echo "$INPUT" | cut -dx -f1) && \
    H=$(echo "$INPUT" | cut -dx -f2) && \
    [ -n "$W" ] && [ -n "$H" ] && \
    hyprctl dispatch resizeactive exact "$W" "$H" && \
    hyprctl dispatch centerwindow && \
    notify-send "ASH" "📐 Size set: ${W}×${H}" \
    --urgency=low --expire-time=2000 \
    --hint=string:x-dunst-stack-tag:resize

# ══════════════════════════════════════════════════════════════════════════════
# §13  CENTER WINDOW (convenience while in resize mode)
# ══════════════════════════════════════════════════════════════════════════════

bind = , space, centerwindow
bind = , Return, centerwindow

# ══════════════════════════════════════════════════════════════════════════════
# §14  EXIT RESIZE SUBMAP
# ══════════════════════════════════════════════════════════════════════════════

bind = , Escape,            submap,     reset
bind = $mainMod, F8,        submap,     reset
bind = $mainMod CTRL, R,    submap,     reset

submap = reset

# ══════════════════════════════════════════════════════════════════════════════
# EOF — resize-submap.conf
# Active window size: hyprctl -j activewindow | jq '.size'
# Monitor geometry:   hyprctl -j monitors | jq '.[] | select(.focused) | {w:.width,h:.height}'
# ══════════════════════════════════════════════════════════════════════════════