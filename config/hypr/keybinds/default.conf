# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Default Keybinds                                 ║
# ║                                                                              ║
# ║  Master keybind file — core system binds, modifier definitions,             ║
# ║  application launchers, ASH CLI integration, and quick-action binds         ║
# ║                                                                              ║
# ║  Modifier Legend:                                                            ║
# ║  $mainMod  = SUPER (Win/Meta key)    $altMod   = ALT                        ║
# ║  $shiftMod = SHIFT                   $ctrlMod  = CTRL                       ║
# ║  $hyperMod = SUPER+SHIFT+CTRL+ALT   (Hyper key)                             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  MODIFIER KEY DEFINITIONS
#      Sourced from env.conf — redefined here for clarity
# ══════════════════════════════════════════════════════════════════════════════

$mainMod        = SUPER
$altMod         = ALT
$shiftMod       = SHIFT
$ctrlMod        = CTRL
$hyperMod       = SUPER SHIFT CTRL ALT

# ══════════════════════════════════════════════════════════════════════════════
# §02  APPLICATION LAUNCHER DEFINITIONS
#      Central app variable registry — change here, applies everywhere
# ══════════════════════════════════════════════════════════════════════════════

# ── Core applications ─────────────────────────────────────────────────────────
$terminal           = kitty
$termFloat          = kitty --class float-term
$fileManager        = kitty --class yazi -e yazi
$fileManagerGUI     = thunar
$browser            = firefox
$browserPrivate     = firefox --private-window
$editor             = kitty --class nvim -e nvim
$editorGUI          = code
$calculator         = kitty --class calc -e bc -l
$calendar           = kitty --class calendar -e khal interactive
$systemMonitor      = kitty --class monitoring -e btop
$colorPicker        = hyprpicker -a

# ── Launchers & menus ─────────────────────────────────────────────────────────
$launcher           = rofi -show drun \
                        -config ~/.config/rofi/launchers/type-4-center/launcher.rasi
$runner             = rofi -show run \
                        -config ~/.config/rofi/launchers/type-6-dmenu/launcher.rasi
$windowSwitcher     = rofi -show window \
                        -config ~/.config/rofi/launchers/type-4-center/launcher.rasi
$emojiPicker        = ~/.config/rofi/menus/emoji/emoji.sh
$clipboardPicker    = cliphist list | \
                        rofi -dmenu -p "󰅌 Clipboard" | \
                        cliphist decode | wl-copy
$wifiMenu           = ~/.config/rofi/menus/wifi/wifi.sh
$bluetoothMenu      = ~/.config/rofi/menus/bluetooth/bluetooth.sh
$audioSwitcher      = ~/.config/rofi/menus/audio-switcher/audio-switcher.sh
$screenshotMenu     = ~/.config/rofi/menus/screenshot/screenshot.sh
$powermenu          = ~/.config/rofi/menus/powermenu/powermenu.sh
$wallpaperPicker    = ash wallpaper pick
$themePicker        = ash theme pick
$modeSelector       = ash mode pick
$keybindViewer      = ~/.config/rofi/menus/keybind-viewer/keybind-viewer.sh
$processKiller      = ~/.config/rofi/menus/process-killer/process-killer.sh
$sshConnect         = ~/.config/rofi/menus/ssh-connect/ssh-connect.sh
$dockerManager      = ~/.config/rofi/menus/docker-manager/docker-manager.sh
$translationMenu    = ~/.config/rofi/menus/translation/translation.sh
$quickNote          = ~/.config/rofi/menus/quicknote/quicknote.sh
$pluginManager      = rofi -show p -modi \
                        "p:~/.config/rofi/menus/plugin-manager/plugin-manager.sh"

# ── ASH CLI commands ──────────────────────────────────────────────────────────
$ashReload          = ash reload --silent
$ashDoctor          = kitty --class float-term -e ash doctor
$ashSnapshot        = ash snapshot create --auto
$ashSnapshotRestore = ash snapshot restore
$ashThemeRandom     = ash theme random
$ashThemeToggle     = ash theme toggle-dark-light
$ashModeGame        = ash mode game
$ashModeWork        = ash mode work
$ashModeFocus       = ash mode focus
$ashModeDefault     = ash mode default
$ashUpdate          = kitty --class float-term -e ash update all

# ── Notification center ───────────────────────────────────────────────────────
$notifCenter        = swaync-client --toggle-panel
$notifDND           = swaync-client --toggle-dnd

# ══════════════════════════════════════════════════════════════════════════════
# §03  ESSENTIAL SYSTEM BINDS
# ══════════════════════════════════════════════════════════════════════════════

# ── Hyprland control ─────────────────────────────────────────────────────────
# Reload configuration
bind = $mainMod SHIFT, R,       exec,           hyprctl reload && $ashReload
# Kill Hyprland session (emergency exit)
bind = $mainMod SHIFT, M,       exit
# Toggle debug overlay
bind = $mainMod SHIFT, F12,     exec,           hyprctl keyword debug:overlay \
                                                    $(hyprctl -j getoption debug:overlay \
                                                    | jq '.int == 0')

# ── Kill / close windows ──────────────────────────────────────────────────────
# Graceful close (sends WM_DELETE_WINDOW)
bind = $mainMod,        Q,      killactive
# Force-kill current window's process
bind = $mainMod SHIFT,  Q,      exec,           hyprctl kill

# ── Compositor actions ────────────────────────────────────────────────────────
# Force renderer reload (GPU shader recompile)
bind = $hyperMod,       R,      forcerendererreload
# Toggle VFR (Variable Frame Rate)
bind = $hyperMod,       V,      exec, \
    hyprctl keyword misc:vfr \
    $(hyprctl -j getoption misc:vfr | jq '.int == 0')

# ══════════════════════════════════════════════════════════════════════════════
# §04  TERMINAL LAUNCHERS
# ══════════════════════════════════════════════════════════════════════════════

# ── Primary terminal ──────────────────────────────────────────────────────────
bind = $mainMod,        Return,     exec,       $terminal
# Floating terminal (centered overlay)
bind = $mainMod SHIFT,  Return,     exec,       $termFloat
# Terminal in current directory (requires hyprland-direnv or CWD detection)
bind = $mainMod CTRL,   Return,     exec,       kitty --working-directory \
                                                    $(hyprctl -j activewindow \
                                                    | jq -r '.pid' \
                                                    | xargs -I{} readlink /proc/{}/cwd \
                                                    2>/dev/null || echo $HOME)

# ── Specific terminal applications ────────────────────────────────────────────
bind = $mainMod,        E,          exec,       $fileManager
bind = $mainMod SHIFT,  E,          exec,       $fileManagerGUI
bind = $mainMod,        B,          exec,       $browser
bind = $mainMod SHIFT,  B,          exec,       $browserPrivate
bind = $mainMod,        C,          exec,       $editor
bind = $mainMod CTRL,   C,          exec,       $editorGUI
bind = $mainMod,        X,          exec,       $systemMonitor
bind = $mainMod SHIFT,  X,          exec,       $calculator

# ══════════════════════════════════════════════════════════════════════════════
# §05  LAUNCHER & MENU BINDS
# ══════════════════════════════════════════════════════════════════════════════

# ── Application launcher ──────────────────────────────────────────────────────
bind = $mainMod,        D,          exec,       $launcher
bind = $mainMod,        space,      exec,       $launcher
# Command runner (run arbitrary commands)
bind = $mainMod,        R,          exec,       $runner
# Window switcher
bind = $mainMod,        W,          exec,       $windowSwitcher
# Emoji picker
bind = $mainMod,        period,     exec,       $emojiPicker
# Clipboard manager
bind = $mainMod,        V,          exec,       $clipboardPicker
# SSH connection manager
bind = $mainMod SHIFT,  S,          exec,       $sshConnect
# Process killer
bind = $mainMod ALT,    X,          exec,       $processKiller
# Docker manager
bind = $mainMod ALT,    D,          exec,       $dockerManager
# Translation
bind = $mainMod ALT,    T,          exec,       $translationMenu
# Quick note
bind = $mainMod ALT,    N,          exec,       $quickNote
# Keybind reference viewer
bind = $mainMod,        F1,         exec,       $keybindViewer

# ══════════════════════════════════════════════════════════════════════════════
# §06  ASH DOTFILES INTEGRATION BINDS
# ══════════════════════════════════════════════════════════════════════════════

# ── Theme control ─────────────────────────────────────────────────────────────
# Open theme picker
bind = $mainMod ALT,    T,          exec,       $themePicker
# Apply random theme
bind = $mainMod ALT,    R,          exec,       $ashThemeRandom
# Toggle dark/light mode
bind = $mainMod ALT,    L,          exec,       $ashThemeToggle

# ── Wallpaper control ─────────────────────────────────────────────────────────
# Open wallpaper picker
bind = $mainMod ALT,    W,          exec,       $wallpaperPicker
# Apply random wallpaper
bind = $mainMod ALT,    Q,          exec,       ash wallpaper random --transition fade

# ── Mode switching ────────────────────────────────────────────────────────────
# Open mode selector
bind = $mainMod ALT,    M,          exec,       $modeSelector
# Quick mode shortcuts
bind = $hyperMod,       G,          exec,       $ashModeGame
bind = $hyperMod,       W,          exec,       $ashModeWork
bind = $hyperMod,       F,          exec,       $ashModeFocus
bind = $hyperMod,       D,          exec,       $ashModeDefault

# ── Snapshots ─────────────────────────────────────────────────────────────────
# Create configuration snapshot
bind = $mainMod ALT,    S,          exec,       $ashSnapshot && \
                                                notify-send "ASH" "Snapshot created" \
                                                -i ~/.config/ash-dotfiles/assets/icons/ash-system/snapshot.svg
# Restore snapshot (interactive)
bind = $mainMod ALT SHIFT, S,       exec,       $ashSnapshotRestore

# ── Doctor & diagnostics ──────────────────────────────────────────────────────
bind = $mainMod ALT,    F12,        exec,       $ashDoctor
# System update
bind = $hyperMod,       U,          exec,       $ashUpdate

# ══════════════════════════════════════════════════════════════════════════════
# §07  NOTIFICATION CENTER
# ══════════════════════════════════════════════════════════════════════════════

# Toggle notification panel
bind = $mainMod,        N,          exec,       $notifCenter
# Toggle Do Not Disturb
bind = $mainMod SHIFT,  N,          exec,       $notifDND
# Clear all notifications
bind = $mainMod CTRL,   N,          exec,       swaync-client --close-all

# ══════════════════════════════════════════════════════════════════════════════
# §08  NETWORK & CONNECTIVITY
# ══════════════════════════════════════════════════════════════════════════════

bind = $mainMod ALT,    I,          exec,       $wifiMenu
bind = $mainMod ALT,    K,          exec,       $bluetoothMenu
bind = $mainMod ALT,    A,          exec,       $audioSwitcher

# ══════════════════════════════════════════════════════════════════════════════
# §09  SPECIAL WORKSPACE (SCRATCHPAD) BINDS
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle special workspaces ─────────────────────────────────────────────────
# Main scratch terminal
bind = $mainMod,        grave,      togglespecialworkspace,     scratch
bind = $mainMod,        apostrophe, togglespecialworkspace,     scratch
# Music player
bind = $mainMod,        m,          togglespecialworkspace,     music
# Notes (Obsidian)
bind = $mainMod ALT,    O,          togglespecialworkspace,     notes
# System monitoring (btop)
bind = $mainMod,        F10,        togglespecialworkspace,     monitoring
# Docker manager
bind = $mainMod,        F11,        togglespecialworkspace,     docker
# Calculator
bind = $mainMod ALT,    C,          togglespecialworkspace,     calc

# ── Send window to special workspace (silently) ───────────────────────────────
bind = $mainMod SHIFT,  grave,      movetoworkspace,            special:scratch
bind = $mainMod SHIFT,  m,          movetoworkspace,            special:music

# ══════════════════════════════════════════════════════════════════════════════
# §10  DISPLAY & MONITOR BINDS
# ══════════════════════════════════════════════════════════════════════════════

# ── DPMS (Display Power Management) ──────────────────────────────────────────
# Toggle all displays on/off
bind = $mainMod SHIFT,  P,          exec,       hyprctl dispatch dpms toggle
# Force displays on
bind = $hyperMod,       P,          exec,       hyprctl dispatch dpms on

# ── Wallpaper refresh ─────────────────────────────────────────────────────────
bind = $mainMod CTRL,   W,          exec,       ash wallpaper reload

# ── Screen color temperature ─────────────────────────────────────────────────
# Increase warmth (night mode)
bind = $mainMod ALT,    bracketleft,  exec,     hyprsunset -D
# Decrease warmth (daylight mode)
bind = $mainMod ALT,    bracketright, exec,     hyprsunset -I
# Reset to daylight
bind = $mainMod ALT,    backslash,    exec,     hyprsunset -t 6500

# ══════════════════════════════════════════════════════════════════════════════
# §11  CLIPBOARD & COLOR PICKER
# ══════════════════════════════════════════════════════════════════════════════

# ── Color picker ──────────────────────────────────────────────────────────────
# Pick color from screen → copy hex to clipboard
bind = $mainMod SHIFT,  C,          exec,       $colorPicker

# ── Clipboard ─────────────────────────────────────────────────────────────────
bind = $mainMod,        V,          exec,       $clipboardPicker
# Clear clipboard history
bind = $mainMod CTRL,   V,          exec,       cliphist wipe && \
                                                notify-send "ASH" "Clipboard cleared" --expire-time=2000

# ══════════════════════════════════════════════════════════════════════════════
# §12  KEYBOARD LAYOUT SWITCHING
# ══════════════════════════════════════════════════════════════════════════════

# Switch to next keyboard layout (when multiple layouts configured)
bind = $mainMod,        F2,         exec,       hyprctl switchxkblayout all next
# Switch to previous layout
bind = $mainMod SHIFT,  F2,         exec,       hyprctl switchxkblayout all prev

# ══════════════════════════════════════════════════════════════════════════════
# §13  LOCK SCREEN
# ══════════════════════════════════════════════════════════════════════════════

# Lock screen
bind = $mainMod,        L,          exec,       hyprlock --immediate
# Lock + suspend
bind = $mainMod SHIFT,  L,          exec,       hyprlock --immediate && systemctl suspend

# ══════════════════════════════════════════════════════════════════════════════
# §14  QUICK SETTINGS PANEL
# ══════════════════════════════════════════════════════════════════════════════

# Toggle quick settings (swaync panel)
bind = $mainMod,        F12,        exec,       swaync-client --toggle-panel
# Toggle waybar visibility
bind = $mainMod CTRL,   B,          exec,       pkill -SIGUSR1 waybar

# ══════════════════════════════════════════════════════════════════════════════
# §15  MOUSE BINDS (bindm)
# ══════════════════════════════════════════════════════════════════════════════

# ── Window drag & resize with mouse ──────────────────────────────────────────
# Super + Left click → move floating window
bindm = $mainMod,       mouse:272,  movewindow
# Super + Right click → resize window
bindm = $mainMod,       mouse:273,  resizewindow
# Super + Middle click → toggle float
bind  = $mainMod,       mouse:274,  togglefloating

# ── Mouse button binds ────────────────────────────────────────────────────────
# Super + Mouse Forward (button 4) → next workspace
bind  = $mainMod,       mouse_up,   workspace,   +1
# Super + Mouse Back (button 5) → previous workspace
bind  = $mainMod,       mouse_down, workspace,   -1
# Alt + Mouse Forward → next window
bind  = $altMod,        mouse_up,   cyclenext
# Alt + Mouse Back → prev window
bind  = $altMod,        mouse_down, cyclenext,   prev

# ══════════════════════════════════════════════════════════════════════════════
# §16  SUBMAP ACTIVATION BINDS
#      Submaps are defined in their respective conf files
# ══════════════════════════════════════════════════════════════════════════════

# ── Enter Resize submap ───────────────────────────────────────────────────────
# Visual indicator: cursor changes, waybar shows "RESIZE" mode
bind = $mainMod,        F8,         submap,     resize
# ── Enter Move submap ─────────────────────────────────────────────────────────
bind = $mainMod SHIFT,  F8,         submap,     move
# ── Enter Group submap ────────────────────────────────────────────────────────
bind = $mainMod,        G,          submap,     group
# ── Enter Power submap ────────────────────────────────────────────────────────
# 3-second safety: press key within 3s to confirm
bind = $mainMod,        Escape,     submap,     power
# ── Enter Monitor submap ─────────────────────────────────────────────────────
bind = $mainMod ALT,    F8,         submap,     monitor
# ── Enter Passthrough submap ─────────────────────────────────────────────────
# All keys pass directly to focused window (useful for VMs)
bind = $mainMod,        F9,         submap,     passthrough

# ══════════════════════════════════════════════════════════════════════════════
# §17  SPECIAL FUNCTION KEYS (Media-adjacent)
# ══════════════════════════════════════════════════════════════════════════════

# ── Idle inhibit toggle ───────────────────────────────────────────────────────
bind = $mainMod,        F3,         exec, \
    if pgrep -x caffeine > /dev/null; then \
        pkill caffeine && notify-send "ASH" "☕ Caffeine OFF — screen may sleep" \
        --expire-time=3000; \
    else \
        caffeine & notify-send "ASH" "☕ Caffeine ON — screen stays awake" \
        --expire-time=3000; \
    fi

# ── Plugin manager ────────────────────────────────────────────────────────────
bind = $mainMod,        F4,         exec,       $pluginManager

# ── Hyprexpo overview (requires hyprexpo plugin) ─────────────────────────────
bind = $mainMod,        Tab,        hyprexpo:expo,  toggle
bind = $mainMod SHIFT,  Tab,        hyprexpo:expo,  toggle

# ══════════════════════════════════════════════════════════════════════════════
