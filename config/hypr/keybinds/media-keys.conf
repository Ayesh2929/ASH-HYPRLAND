# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Media Keys & Hardware Control Keybinds           ║
# ║                                                                              ║
# ║  XF86 hardware keys: Volume · Brightness · Media playback ·                ║
# ║  Microphone · Camera · Display · Power · Keyboard backlight ·              ║
# ║  Fan control · Performance profiles · OSD notifications                    ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  OSD NOTIFICATION HELPERS
#      Display on-screen overlay for hardware key feedback
# ══════════════════════════════════════════════════════════════════════════════

# ── Volume OSD via ASH notification engine ────────────────────────────────────
$volumeOSD          = bash -c '\
    VOL=$(wpctl get-volume @DEFAULT_SINK@ | awk "{print int(\$2*100)}"); \
    MUTE=$(wpctl get-volume @DEFAULT_SINK@ | grep -c MUTED || echo 0); \
    if [ "$MUTE" -gt 0 ]; then \
        ICON="audio-volume-muted"; MSG="Muted"; \
    elif [ "$VOL" -ge 67 ]; then \
        ICON="audio-volume-high"; MSG="Volume: $VOL%%"; \
    elif [ "$VOL" -ge 33 ]; then \
        ICON="audio-volume-medium"; MSG="Volume: $VOL%%"; \
    else \
        ICON="audio-volume-low"; MSG="Volume: $VOL%%"; \
    fi && \
    notify-send "$MSG" "" \
        --app-name=ASH-OSD \
        --icon=$ICON \
        --expire-time=1500 \
        --hint=int:value:$VOL \
        --hint=string:x-dunst-stack-tag:volume \
        --urgency=low'

# ── Brightness OSD ────────────────────────────────────────────────────────────
$brightnessOSD      = bash -c '\
    BRIGHT=$(brightnessctl -m | awk -F, "{print int(\$4)}"); \
    notify-send "Brightness: $BRIGHT%%" "" \
        --app-name=ASH-OSD \
        --icon=display-brightness \
        --expire-time=1500 \
        --hint=int:value:$BRIGHT \
        --hint=string:x-dunst-stack-tag:brightness \
        --urgency=low'

# ── Mic OSD ───────────────────────────────────────────────────────────────────
$micOSD             = bash -c '\
    MUTE=$(wpctl get-volume @DEFAULT_SOURCE@ | grep -c MUTED || echo 0); \
    if [ "$MUTE" -gt 0 ]; then \
        notify-send "🎙️ Microphone Muted" "" \
            --app-name=ASH-OSD \
            --icon=microphone-sensitivity-muted \
            --hint=string:x-dunst-stack-tag:mic --urgency=normal; \
    else \
        VOL=$(wpctl get-volume @DEFAULT_SOURCE@ | awk "{print int(\$2*100)}"); \
        notify-send "🎙️ Microphone: $VOL%%" "" \
            --app-name=ASH-OSD \
            --icon=microphone-sensitivity-high \
            --hint=string:x-dunst-stack-tag:mic --urgency=low; \
    fi'

# ── Play/Pause OSD ────────────────────────────────────────────────────────────
$mediaOSD           = bash -c '\
    STATUS=$(playerctl status 2>/dev/null || echo "No player"); \
    TITLE=$(playerctl metadata title 2>/dev/null | head -c 60 || echo ""); \
    ARTIST=$(playerctl metadata artist 2>/dev/null | head -c 40 || echo ""); \
    ICON=$([ "$STATUS" = "Playing" ] && echo "media-playback-start" || echo "media-playback-pause"); \
    notify-send "$TITLE" "$ARTIST" \
        --app-name=ASH-OSD \
        --icon=$ICON \
        --expire-time=3000 \
        --hint=string:x-dunst-stack-tag:media \
        --urgency=low'

# ══════════════════════════════════════════════════════════════════════════════
# §02  VOLUME CONTROL
#      XF86Audio* keys + alternative bindings
#      bindel = repeat while held (continuous volume change)
#      bindl  = also works on lock screen
# ══════════════════════════════════════════════════════════════════════════════

# ── Volume Up ─────────────────────────────────────────────────────────────────
bindel = ,    XF86AudioRaiseVolume,     exec, \
    wpctl set-volume -l 1.0 @DEFAULT_SINK@ 2%+ && $volumeOSD
# Fine-grained volume up (1%)
bindel = SHIFT, XF86AudioRaiseVolume,  exec, \
    wpctl set-volume -l 1.0 @DEFAULT_SINK@ 1%+ && $volumeOSD
# Volume up on lock screen
bindel = ,    XF86AudioRaiseVolume,    exec, \
    wpctl set-volume -l 1.0 @DEFAULT_SINK@ 2%+

# ── Volume Down ───────────────────────────────────────────────────────────────
bindel = ,    XF86AudioLowerVolume,    exec, \
    wpctl set-volume @DEFAULT_SINK@ 2%- && $volumeOSD
# Fine-grained volume down (1%)
bindel = SHIFT, XF86AudioLowerVolume, exec, \
    wpctl set-volume @DEFAULT_SINK@ 1%- && $volumeOSD

# ── Volume Mute ───────────────────────────────────────────────────────────────
bindl = ,     XF86AudioMute,           exec, \
    wpctl set-mute @DEFAULT_SINK@ toggle && $volumeOSD

# ── Alternative volume binds (no XF86 keys) ───────────────────────────────────
binde = $mainMod CTRL,    Up,          exec, \
    wpctl set-volume -l 1.0 @DEFAULT_SINK@ 2%+ && $volumeOSD
binde = $mainMod CTRL,    Down,        exec, \
    wpctl set-volume @DEFAULT_SINK@ 2%- && $volumeOSD
bind  = $mainMod CTRL,    m,           exec, \
    wpctl set-mute @DEFAULT_SINK@ toggle && $volumeOSD

# ── Set exact volume levels (numpad shortcuts) ────────────────────────────────
bind = $hyperMod,         KP_0,        exec, \
    wpctl set-volume @DEFAULT_SINK@ 0% && \
    notify-send "ASH" "🔇 Volume: 0%" --hint=string:x-dunst-stack-tag:volume \
    --urgency=low --expire-time=1500
bind = $hyperMod,         KP_5,        exec, \
    wpctl set-volume @DEFAULT_SINK@ 50% && \
    notify-send "ASH" "🔊 Volume: 50%" --hint=string:x-dunst-stack-tag:volume \
    --urgency=low --expire-time=1500
bind = $hyperMod,         KP_Insert,   exec, \
    wpctl set-volume @DEFAULT_SINK@ 100% && \
    notify-send "ASH" "🔊 Volume: 100%" --hint=string:x-dunst-stack-tag:volume \
    --urgency=low --expire-time=1500

# ══════════════════════════════════════════════════════════════════════════════
# §03  MICROPHONE CONTROL
# ══════════════════════════════════════════════════════════════════════════════

# ── Mic mute toggle ───────────────────────────────────────────────────────────
bindl = ,     XF86AudioMicMute,        exec, \
    wpctl set-mute @DEFAULT_SOURCE@ toggle && $micOSD
# Alternative mic mute
bind = $mainMod SHIFT,    m,           exec, \
    wpctl set-mute @DEFAULT_SOURCE@ toggle && $micOSD

# ── Mic volume control ────────────────────────────────────────────────────────
bindel = CTRL, XF86AudioRaiseVolume,   exec, \
    wpctl set-volume @DEFAULT_SOURCE@ 5%+ && $micOSD
bindel = CTRL, XF86AudioLowerVolume,   exec, \
    wpctl set-volume @DEFAULT_SOURCE@ 5%- && $micOSD

# ── Push-to-talk (hold Super+F4 to unmute, release to mute) ──────────────────
# Unmute mic on press
bind  = $mainMod,         F4,          exec, \
    wpctl set-mute @DEFAULT_SOURCE@ unmute && \
    notify-send "🎙️ PTT Active" "Microphone is HOT" \
    --app-name=ASH-OSD \
    --hint=string:x-dunst-stack-tag:mic \
    --urgency=critical \
    --expire-time=600000
# Re-mute mic on release
bindr = $mainMod,         F4,          exec, \
    wpctl set-mute @DEFAULT_SOURCE@ mute && \
    notify-send "🎙️ PTT Released" "Microphone muted" \
    --app-name=ASH-OSD \
    --hint=string:x-dunst-stack-tag:mic \
    --urgency=normal \
    --expire-time=2000

# ══════════════════════════════════════════════════════════════════════════════
# §04  DISPLAY BRIGHTNESS
#      brightnessctl for backlight, ddcutil for external monitors
# ══════════════════════════════════════════════════════════════════════════════

# ── Laptop backlight brightness ───────────────────────────────────────────────
bindel = ,    XF86MonBrightnessUp,     exec, \
    brightnessctl set 5%+ && $brightnessOSD
bindel = ,    XF86MonBrightnessDown,   exec, \
    brightnessctl set 5%- && $brightnessOSD

# ── Fine-grained brightness (1%) ──────────────────────────────────────────────
bindel = SHIFT, XF86MonBrightnessUp,   exec, \
    brightnessctl set 1%+ && $brightnessOSD
bindel = SHIFT, XF86MonBrightnessDown, exec, \
    brightnessctl set 1%- && $brightnessOSD

# ── Minimum brightness (emergency low) ───────────────────────────────────────
bind = $mainMod ALT,      F1,          exec, \
    brightnessctl set 1% && \
    notify-send "ASH" "☀ Brightness: minimum" \
    --hint=string:x-dunst-stack-tag:brightness \
    --urgency=low --expire-time=1500

# ── Maximum brightness ────────────────────────────────────────────────────────
bind = $mainMod ALT,      F2,          exec, \
    brightnessctl set 100% && \
    notify-send "ASH" "☀ Brightness: maximum" \
    --hint=string:x-dunst-stack-tag:brightness \
    --urgency=low --expire-time=1500

# ── External monitor brightness (ddcutil via DDC/CI) ─────────────────────────
bindel = ALT, XF86MonBrightnessUp,     exec, \
    ddcutil setvcp 10 + 10 && \
    notify-send "ASH" "🖥 External brightness ↑" \
    --hint=string:x-dunst-stack-tag:brightness \
    --urgency=low --expire-time=1500
bindel = ALT, XF86MonBrightnessDown,   exec, \
    ddcutil setvcp 10 - 10 && \
    notify-send "ASH" "🖥 External brightness ↓" \
    --hint=string:x-dunst-stack-tag:brightness \
    --urgency=low --expire-time=1500

# ── Alternative brightness binds ──────────────────────────────────────────────
binde = $mainMod CTRL,    Prior,       exec, \
    brightnessctl set 5%+ && $brightnessOSD
binde = $mainMod CTRL,    Next,        exec, \
    brightnessctl set 5%- && $brightnessOSD

# ══════════════════════════════════════════════════════════════════════════════
# §05  MEDIA PLAYBACK CONTROL
#      Works with Spotify, MPD, MPV, Firefox, VLC, and any MPRIS2 player
#      bindl = active on lock screen (safe for media keys)
# ══════════════════════════════════════════════════════════════════════════════

# ── Play / Pause ──────────────────────────────────────────────────────────────
bindl = ,     XF86AudioPlay,           exec, \
    playerctl play-pause && $mediaOSD
bindl = ,     XF86AudioPause,          exec, \
    playerctl play-pause && $mediaOSD
# Alternative
bind = $mainMod,          F5,          exec, \
    playerctl play-pause && $mediaOSD

# ── Next track ────────────────────────────────────────────────────────────────
bindl = ,     XF86AudioNext,           exec, \
    playerctl next && sleep 0.3 && $mediaOSD
bind = $mainMod,          F6,          exec, \
    playerctl next && sleep 0.3 && $mediaOSD

# ── Previous track ────────────────────────────────────────────────────────────
bindl = ,     XF86AudioPrev,           exec, \
    playerctl previous && sleep 0.3 && $mediaOSD
bind = $mainMod,          F5,          exec, \
    playerctl previous && sleep 0.3 && $mediaOSD

# ── Stop playback ─────────────────────────────────────────────────────────────
bindl = ,     XF86AudioStop,           exec, \
    playerctl stop && \
    notify-send "ASH" "⏹ Playback stopped" \
    --hint=string:x-dunst-stack-tag:media \
    --urgency=low --expire-time=2000

# ── Seek forward/backward ─────────────────────────────────────────────────────
binde = $mainMod SHIFT,   Right,       exec, \
    playerctl position 5+
binde = $mainMod SHIFT,   Left,        exec, \
    playerctl position 5-

# ── Shuffle toggle ────────────────────────────────────────────────────────────
bind = $mainMod ALT,      F5,          exec, \
    playerctl shuffle toggle && \
    notify-send "ASH" "🔀 Shuffle: $(playerctl shuffle)" \
    --hint=string:x-dunst-stack-tag:media \
    --urgency=low --expire-time=2000

# ── Repeat/loop toggle ────────────────────────────────────────────────────────
bind = $mainMod ALT,      F6,          exec, \
    playerctl loop track && \
    notify-send "ASH" "🔁 Loop: $(playerctl loop)" \
    --hint=string:x-dunst-stack-tag:media \
    --urgency=low --expire-time=2000

# ── Select specific player for control ───────────────────────────────────────
bind = $mainMod SHIFT,    F5,          exec, \
    PLAYER=$(playerctl -l 2>/dev/null | \
    rofi -dmenu -p "🎵 Control player" \
    -theme-str 'window {width: 30%;}') && \
    [ -n "$PLAYER" ] && \
    export PLAYERCTL_PLAYER="$PLAYER" && \
    playerctl --player="$PLAYER" play-pause && $mediaOSD

# ══════════════════════════════════════════════════════════════════════════════
# §06  KEYBOARD BACKLIGHT
#      For laptops with RGB or white keyboard backlight
# ══════════════════════════════════════════════════════════════════════════════

# ── Keyboard backlight up ─────────────────────────────────────────────────────
bindel = ,    XF86KbdBrightnessUp,     exec, \
    brightnessctl -d '*::kbd_backlight' set 10%+ && \
    notify-send "ASH" "⌨ Keyboard backlight ↑" \
    --urgency=low --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:kbd-bright

# ── Keyboard backlight down ───────────────────────────────────────────────────
bindel = ,    XF86KbdBrightnessDown,   exec, \
    brightnessctl -d '*::kbd_backlight' set 10%- && \
    notify-send "ASH" "⌨ Keyboard backlight ↓" \
    --urgency=low --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:kbd-bright

# ── Keyboard backlight toggle ─────────────────────────────────────────────────
bind = $mainMod,          F3,          exec, \
    CURRENT=$(brightnessctl -d '*::kbd_backlight' g); \
    if [ "$CURRENT" = "0" ]; then \
        brightnessctl -d '*::kbd_backlight' set 100%; \
        notify-send "ASH" "⌨ Keyboard backlight ON" \
        --urgency=low --expire-time=1500; \
    else \
        brightnessctl -d '*::kbd_backlight' set 0; \
        notify-send "ASH" "⌨ Keyboard backlight OFF" \
        --urgency=low --expire-time=1500; \
    fi

# ══════════════════════════════════════════════════════════════════════════════
# §07  POWER & PERFORMANCE KEYS
# ══════════════════════════════════════════════════════════════════════════════

# ── Power button ──────────────────────────────────────────────────────────────
# Single press: show power menu (not immediate shutdown)
bindl = ,     XF86PowerOff,            exec,   $powermenu
# Long-press handled by logind (configured in /etc/systemd/logind.conf)

# ── Sleep / suspend ───────────────────────────────────────────────────────────
bindl = ,     XF86Sleep,               exec, \
    systemctl suspend
bindl = ,     XF86Suspend,             exec, \
    systemctl suspend

# ── Hibernate ────────────────────────────────────────────────────────────────
bindl = ,     XF86Hibernate,           exec, \
    systemctl hibernate

# ── Screen off toggle ─────────────────────────────────────────────────────────
bind = ,      XF86ScreenSaver,         exec, \
    hyprctl dispatch dpms toggle && \
    notify-send "ASH" "🖥 Display toggled" \
    --urgency=low --expire-time=1000

# ── Airplane mode toggle ──────────────────────────────────────────────────────
bind = ,      XF86RFKill,              exec, \
    rfkill toggle all && \
    notify-send "ASH" "✈ Airplane mode toggled" \
    --urgency=normal --expire-time=3000

# ══════════════════════════════════════════════════════════════════════════════
# §08  PERFORMANCE PROFILE KEYS
#      Laptop power/performance mode control via power-profiles-daemon
# ══════════════════════════════════════════════════════════════════════════════

# ── Battery mode (max power saving) ──────────────────────────────────────────
bind = ,      XF86Launch4,             exec, \
    powerprofilesctl set power-saver && \
    ash mode battery && \
    notify-send "ASH" "🔋 Battery save mode" \
    -i ~/.config/ash-dotfiles/assets/icons/ash-system/battery-mode.svg \
    --urgency=normal --expire-time=3000

# ── Balanced mode ─────────────────────────────────────────────────────────────
bind = ,      XF86Launch5,             exec, \
    powerprofilesctl set balanced && \
    ash mode default && \
    notify-send "ASH" "⚖ Balanced mode" \
    --urgency=normal --expire-time=3000

# ── Performance mode ──────────────────────────────────────────────────────────
bind = ,      XF86Launch6,             exec, \
    powerprofilesctl set performance && \
    notify-send "ASH" "⚡ Performance mode" \
    -i ~/.config/ash-dotfiles/assets/icons/ash-system/game-mode.svg \
    --urgency=normal --expire-time=3000

# ── Cycle power profiles ──────────────────────────────────────────────────────
bind = $mainMod,          F9,          exec, \
    CURRENT=$(powerprofilesctl get); \
    case "$CURRENT" in \
        power-saver) NEXT="balanced"; ICON="⚖" ;; \
        balanced)    NEXT="performance"; ICON="⚡" ;; \
        *)           NEXT="power-saver"; ICON="🔋" ;; \
    esac; \
    powerprofilesctl set "$NEXT" && \
    notify-send "ASH" "$ICON Profile: $NEXT" \
    --urgency=normal --expire-time=2500

# ══════════════════════════════════════════════════════════════════════════════
# §09  DISPLAY CONTROL KEYS (XF86 Display/Touchpad)
# ══════════════════════════════════════════════════════════════════════════════

# ── Display switch (XF86Display / Fn+F7 on ThinkPad) ─────────────────────────
bind = ,      XF86Display,             exec, \
    ash monitor layout --interactive

# ── Touchpad toggle ───────────────────────────────────────────────────────────
bind = ,      XF86TouchpadToggle,      exec, \
    bash -c '\
    STATE=$(hyprctl -j devices | jq -r ".touchpads[0].enabled"); \
    if [ "$STATE" = "true" ]; then \
        hyprctl keyword device:synps/2-synaptics-touchpad:enabled false && \
        notify-send "ASH" "🖱 Touchpad disabled" --urgency=normal --expire-time=2000; \
    else \
        hyprctl keyword device:synps/2-synaptics-touchpad:enabled true && \
        notify-send "ASH" "🖱 Touchpad enabled" --urgency=normal --expire-time=2000; \
    fi'

bind = ,      XF86TouchpadOn,          exec, \
    hyprctl keyword device:synps/2-synaptics-touchpad:enabled true && \
    notify-send "ASH" "🖱 Touchpad ON" --urgency=normal --expire-time=2000

bind = ,      XF86TouchpadOff,         exec, \
    hyprctl keyword device:synps/2-synaptics-touchpad:enabled false && \
    notify-send "ASH" "🖱 Touchpad OFF" --urgency=normal --expire-time=2000

# ── Rotate screen ─────────────────────────────────────────────────────────────
bind = ,      XF86RotateWindows,       exec, \
    hyprctl dispatch dpms toggle

# ══════════════════════════════════════════════════════════════════════════════
# §10  LOCK SCREEN COMPATIBLE BINDS
#      These binds are active even when hyprlock is running
# ══════════════════════════════════════════════════════════════════════════════

# All volume/brightness/media keys above are already using bindl/bindel
# Additional lock-screen compatible binds:

# ── Emergency display wake (if screen went black) ─────────────────────────────
bindl = $mainMod,         XF86MonBrightnessUp,    exec, \
    hyprctl dispatch dpms on

