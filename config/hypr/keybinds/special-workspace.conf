    hyprctl dispatch togglespecialworkspace dev

# ══════════════════════════════════════════════════════════════════════════════
# §14  CHAT / COMMUNICATION SCRATCHPAD
#      Discord / Telegram quick access
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle chat scratchpad ────────────────────────────────────────────────────
bind = $mainMod ALT,        c,              togglespecialworkspace,     chat
bind = $mainMod ALT SHIFT,  c,              movetoworkspacesilent,      special:chat

# ── Focus Discord in chat scratchpad ─────────────────────────────────────────
bind = $mainMod ALT CTRL,   c,              exec, \
    if ! hyprctl -j clients | jq -e '.[] | select(.class == "vesktop")' > /dev/null 2>&1; then \
        vesktop & sleep 2; \
    fi && \
    hyprctl dispatch movetoworkspacesilent \
    "special:chat,class:vesktop" && \
    hyprctl dispatch togglespecialworkspace chat

# ── Focus Telegram in chat scratchpad ─────────────────────────────────────────
bind = $hyperMod,           c,              exec, \
    if ! hyprctl -j clients | jq -e '.[] | select(.class == "org.telegram.desktop")' > /dev/null 2>&1; then \
        telegram-desktop & sleep 2; \
    fi && \
    hyprctl dispatch movetoworkspacesilent \
    "special:chat,class:org.telegram.desktop" && \
    hyprctl dispatch togglespecialworkspace chat

# ══════════════════════════════════════════════════════════════════════════════
# §15  SPECIAL WORKSPACE MANAGEMENT
#      Meta-operations on all special workspaces
# ══════════════════════════════════════════════════════════════════════════════

# ── List all special workspaces ───────────────────────────────────────────────
bind = $mainMod CTRL,       grave,          exec, \
    SPECIALS=$(hyprctl -j workspaces | \
    jq -r '.[] | select(.name | startswith("special:")) | \
    "[\(.windows) win] \(.name | ltrimstr("special:")) — \(.lastwindow)"' | \
    sort); \
    if [ -n "$SPECIALS" ]; then \
        CHOICE=$(echo "$SPECIALS" | \
        rofi -dmenu -p "󰐃 Special workspace" \
        -theme-str 'window {width: 45%;} listview {lines: 10;}') && \
        WS=$(echo "$CHOICE" | grep -oP 'special:\K\S+' | head -1) && \
        [ -n "$WS" ] && hyprctl dispatch togglespecialworkspace "$WS"; \
    else \
        notify-send "ASH" "No active special workspaces" \
        --urgency=low --expire-time=2000; \
    fi

# ── Close all special workspaces ─────────────────────────────────────────────
bind = $mainMod CTRL SHIFT, grave,          exec, \
    hyprctl -j workspaces | \
    jq -r '.[] | select(.name | startswith("special:")) | .name | ltrimstr("special:")' | \
    while read WS; do \
        hyprctl dispatch togglespecialworkspace "$WS" 2>/dev/null; \
    done && \
    notify-send "ASH" "All scratchpads closed" \
    --urgency=low --expire-time=2000 \
    --hint=string:x-dunst-stack-tag:scratchpad

# ── Move all special workspace windows to current workspace ───────────────────
bind = $hyperMod,           grave,          exec, \
    WS=$(hyprctl -j activeworkspace | jq -r '.id') && \
    hyprctl -j clients | \
    jq -r '.[] | select(.workspace.name | startswith("special:")) | .address' | \
    while read ADDR; do \
        hyprctl dispatch movetoworkspace "$WS,address:$ADDR"; \
    done && \
    notify-send "ASH" "All scratchpad windows moved to workspace $WS" \
    --urgency=low --expire-time=2500

# ── Cycle through active special workspaces ───────────────────────────────────
bind = $mainMod,            F9,             exec, \
    ACTIVE_SPECIALS=$(hyprctl -j workspaces | \
    jq -r '.[] | select(.name | startswith("special:")) | .name | ltrimstr("special:")' | \
    head -5); \
    if [ -n "$ACTIVE_SPECIALS" ]; then \
        FIRST=$(echo "$ACTIVE_SPECIALS" | head -1) && \
        hyprctl dispatch togglespecialworkspace "$FIRST"; \
    else \
        notify-send "ASH" "No active scratchpads" \
        --urgency=low --expire-time=1500; \
    fi

# ══════════════════════════════════════════════════════════════════════════════
# §16  SPECIAL WORKSPACE OPACITY CONTROL
#      Adjust transparency of special workspace content
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle opacity on special workspace windows ───────────────────────────────
bind = $mainMod CTRL,       backslash,      exec, \
    ADDR=$(hyprctl -j activewindow | jq -r '.address') && \
    CURRENT=$(hyprctl -j activewindow | jq -r '.alpha // 1.0') && \
    if echo "$CURRENT" | grep -q "0\.8"; then \
        hyprctl setprop address:$ADDR alpha 1.0 && \
        notify-send "ASH" "Scratchpad: opaque" \
        --urgency=low --expire-time=1200; \
    else \
        hyprctl setprop address:$ADDR alpha 0.88 && \
        notify-send "ASH" "Scratchpad: 88% opacity" \
        --urgency=low --expire-time=1200; \
    fi

# ══════════════════════════════════════════════════════════════════════════════
# EOF — special-workspace.conf
# List specials:  hyprctl -j workspaces | jq '.[] | select(.name | startswith("special:"))'
# Active clients: hyprctl -j clients | jq '.[] | select(.workspace.name | startswith("special:"))'
# ASH commands:   ash workspace list --special
# ══════════════════════════════════════════════════════════════════════════════