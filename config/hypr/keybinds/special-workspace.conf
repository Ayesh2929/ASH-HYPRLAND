# ══════════════════════════════════════════════════════════════════════════════
# §01  SMART SPAWN-OR-SHOW HELPER
#      Focuses existing window if present, spawns if not, toggles if focused
# ══════════════════════════════════════════════════════════════════════════════

# ── Core helper function ──────────────────────────────────────────────────────
# Usage: $spawn_or_show WS_NAME CLASS COMMAND [SIZE_W SIZE_H]
$spawn_or_show = bash -c '\
    WS="$1"; CLASS="$2"; CMD="$3"; W="${4:-1100}"; H="${5:-700}"; \
    EXISTING=$(hyprctl -j clients | \
        jq -r ".[] | select(.class == \"$CLASS\") | .address" | head -1); \
    if [ -n "$EXISTING" ]; then \
        CURWS=$(hyprctl -j clients | \
            jq -r ".[] | select(.address == \"$EXISTING\") | .workspace.name"); \
        if [ "$CURWS" = "special:$WS" ]; then \
            hyprctl dispatch togglespecialworkspace "$WS"; \
        else \
            hyprctl dispatch togglespecialworkspace "$WS"; \
        fi; \
    else \
        hyprctl dispatch togglespecialworkspace "$WS"; \
        sleep 0.15; \
        eval "$CMD" & \
        sleep 0.5; \
        NEWADDR=$(hyprctl -j clients | \
            jq -r ".[] | select(.class == \"$CLASS\") | .address" | head -1); \
        [ -n "$NEWADDR" ] && \
        hyprctl dispatch movetoworkspacesilent "special:$WS,address:$NEWADDR" && \
        hyprctl dispatch resizewindowpixel "exact $W $H,address:$NEWADDR" && \
        hyprctl dispatch centerwindow "address:$NEWADDR"; \
    fi' --

# ── Notification helper ───────────────────────────────────────────────────────
$ws_notify = bash -c '\
    NAME="$1"; ICON="$2"; ACTION="$3"; \
    notify-send "ASH Scratchpad" \
    "$ICON $NAME $ACTION" \
    --app-name=ASH-Scratchpad \
    --urgency=low \
    --expire-time=1500 \
    --hint=string:x-dunst-stack-tag:scratchpad' --

# ══════════════════════════════════════════════════════════════════════════════
# §02  MAIN SCRATCH TERMINAL
#      Primary general-purpose scratchpad terminal
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle scratch terminal ───────────────────────────────────────────────────
bind = $mainMod,            grave,          togglespecialworkspace,     scratch
bind = $mainMod,            apostrophe,     togglespecialworkspace,     scratch
bind = CTRL ALT,            t,              togglespecialworkspace,     scratch

# ── Send focused window → scratch (silently) ──────────────────────────────────
bind = $mainMod SHIFT,      grave,          movetoworkspacesilent,      special:scratch
bind = $mainMod SHIFT,      apostrophe,     movetoworkspacesilent,      special:scratch

# ── Spawn new kitty in scratch ────────────────────────────────────────────────
bind = $mainMod CTRL,       grave,          exec, \
    kitty \
        --class scratch-term \
        --override remember_window_size=no \
        --override initial_window_width=1200 \
        --override initial_window_height=750 \
        --override background_opacity=0.96 &
bind = $mainMod CTRL,       grave,          movetoworkspacesilent,      special:scratch

# ── Scratch terminal size variants ───────────────────────────────────────────
# Fullscreen scratch
bind = $mainMod ALT,        grave,          exec, \
    hyprctl dispatch togglespecialworkspace scratch && \
    sleep 0.1 && \
    hyprctl dispatch resizewindowpixel \
    "exact $(hyprctl -j monitors | jq '.[] | select(.focused) | .width - 48') \
    $(hyprctl -j monitors | jq '.[] | select(.focused) | .height - 48'), \
    class:scratch-term" && \
    hyprctl dispatch centerwindow class:scratch-term

# ══════════════════════════════════════════════════════════════════════════════
# §03  MUSIC PLAYER SCRATCHPAD
#      ncmpcpp / Spotify controller
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle music scratchpad ───────────────────────────────────────────────────
bind = $mainMod,            m,              togglespecialworkspace,     music

# ── Send current window to music scratchpad ───────────────────────────────────
bind = $mainMod SHIFT,      m,              movetoworkspacesilent,      special:music

# ── Spawn ncmpcpp in music scratchpad ────────────────────────────────────────
bind = $mainMod CTRL,       m,              exec, \
    kitty \
        --class music-player \
        --override font_size=12.0 \
        --override remember_window_size=no \
        --override initial_window_width=1000 \
        --override initial_window_height=600 \
        -e ncmpcpp & \
    sleep 0.4 && \
    hyprctl dispatch movetoworkspacesilent \
    "special:music,class:music-player"

# ── Spotify focus ─────────────────────────────────────────────────────────────
bind = $mainMod ALT,        m,              exec, \
    if hyprctl -j clients | jq -e '.[] | select(.class == "spotify")' > /dev/null 2>&1; then \
        hyprctl dispatch focuswindow class:spotify; \
    else \
        spotify &; \
    fi

# ── Media notification ────────────────────────────────────────────────────────
bind = $mainMod SHIFT CTRL, m,              exec, \
    TITLE=$(playerctl metadata title 2>/dev/null | head -c 60 || echo "No player"); \
    ARTIST=$(playerctl metadata artist 2>/dev/null | head -c 40 || echo ""); \
    STATUS=$(playerctl status 2>/dev/null || echo "Stopped"); \
    notify-send "🎵 Now Playing" \
    "$TITLE\n$ARTIST\nStatus: $STATUS" \
    --urgency=low --expire-time=4000 \
    --hint=string:x-dunst-stack-tag:music-info

# ══════════════════════════════════════════════════════════════════════════════
# §04  NOTES / KNOWLEDGE BASE SCRATCHPAD
#      Obsidian / Neovim notes
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle notes scratchpad ───────────────────────────────────────────────────
bind = $mainMod ALT,        n,              togglespecialworkspace,     notes

# ── Send to notes scratchpad ──────────────────────────────────────────────────
bind = $mainMod ALT SHIFT,  n,              movetoworkspacesilent,      special:notes

# ── Spawn Obsidian in notes scratchpad ───────────────────────────────────────
bind = $mainMod ALT CTRL,   n,              exec, \
    if ! hyprctl -j clients | jq -e '.[] | select(.class == "obsidian")' > /dev/null 2>&1; then \
        obsidian & sleep 1; \
    fi && \
    hyprctl dispatch movetoworkspacesilent \
    "special:notes,class:obsidian" && \
    hyprctl dispatch togglespecialworkspace notes

# ── Quick Neovim note ─────────────────────────────────────────────════════────
bind = $mainMod,            n,              exec, \
    NOTE_FILE="$HOME/Notes/$(date '+%Y-%m-%d').md" && \
    kitty \
        --class quick-note \
        --override remember_window_size=no \
        --override initial_window_width=900 \
        --override initial_window_height=600 \
        -e nvim "$NOTE_FILE" & \
    sleep 0.3 && \
    hyprctl dispatch movetoworkspacesilent \
    "special:notes,class:quick-note" && \
    hyprctl dispatch togglespecialworkspace notes

# ══════════════════════════════════════════════════════════════════════════════
# §05  SYSTEM MONITORING SCRATCHPAD
#      btop / htop / system stats
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle monitoring scratchpad ──────────────────────────────────────────────
bind = $mainMod,            F10,            togglespecialworkspace,     monitoring
bind = $mainMod SHIFT,      F10,            movetoworkspacesilent,      special:monitoring

# ── Spawn btop in monitoring scratchpad ──────────────────────────────────────
bind = $mainMod CTRL,       F10,            exec, \
    kitty \
        --class monitoring \
        --override font_size=11.0 \
        --override remember_window_size=no \
        --override initial_window_width=1400 \
        --override initial_window_height=800 \
        -e btop & \
    sleep 0.5 && \
    hyprctl dispatch movetoworkspacesilent \
    "special:monitoring,class:monitoring" && \
    hyprctl dispatch togglespecialworkspace monitoring

# ── Spawn full-width monitoring layout ────────────────────────────────────────
bind = $mainMod ALT,        F10,            exec, \
    MON_W=$(hyprctl -j monitors | jq '.[] | select(.focused) | .width'); \
    kitty \
        --class monitoring \
        --override initial_window_width=$((MON_W - 60)) \
        --override initial_window_height=850 \
        -e btop & \
    sleep 0.5 && \
    hyprctl dispatch movetoworkspacesilent \
    "special:monitoring,class:monitoring" && \
    hyprctl dispatch togglespecialworkspace monitoring

# ── Quick system info popup ───────────────────────────────────────────────────
bind = $hyperMod,           F10,            exec, \
    CPU=$(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | cut -d. -f1); \
    MEM=$(free -h | awk '/^Mem:/ {print $3 "/" $2}'); \
    DISK=$(df -h / | awk 'NR==2 {print $3 "/" $2 " (" $5 ")"}'); \
    LOAD=$(uptime | awk -F'load average:' '{print $2}' | xargs); \
    notify-send "System Status" \
    "🖥 CPU: ${CPU}%\n💾 RAM: $MEM\n💿 Disk: $DISK\n📊 Load: $LOAD" \
    --urgency=low --expire-time=6000 \
    --hint=string:x-dunst-stack-tag:sysinfo

