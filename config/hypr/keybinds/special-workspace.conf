# ══════════════════════════════════════════════════════════════════════════════
# §07  CALCULATOR SCRATCHPAD
#      bc / Python REPL / calculator
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle calculator scratchpad ──────────────────────────────────────────────
bind = $mainMod ALT,        equal,          togglespecialworkspace,     calc
bind = $mainMod ALT,        KP_Add,         togglespecialworkspace,     calc
bind = $mainMod SHIFT,      equal,          movetoworkspacesilent,      special:calc

# ── Spawn bc calculator ───────────────────────────────────────────────────────
bind = $mainMod CTRL,       equal,          exec, \
    kitty \
        --class calculator \
        --override font_size=14.0 \
        --override remember_window_size=no \
        --override initial_window_width=500 \
        --override initial_window_height=400 \
        --override background_opacity=0.95 \
        -e bc -l & \
    sleep 0.3 && \
    hyprctl dispatch movetoworkspacesilent \
    "special:calc,class:calculator" && \
    hyprctl dispatch togglespecialworkspace calc

# ── Spawn Python REPL ─────────────────────────────────────────────────────────
bind = $mainMod ALT CTRL,   equal,          exec, \
    kitty \
        --class py-repl \
        --override font_size=13.0 \
        --override initial_window_width=700 \
        --override initial_window_height=500 \
        -e python3 & \
    sleep 0.3 && \
    hyprctl dispatch movetoworkspacesilent \
    "special:calc,class:py-repl" && \
    hyprctl dispatch togglespecialworkspace calc

# ── Quick calculation from clipboard ─────────────────────────────────────────
bind = $hyperMod,           equal,          exec, \
    EXPR=$(wl-paste 2>/dev/null | tr -d '\n') && \
    RESULT=$(echo "$EXPR" | bc -l 2>/dev/null || echo "Invalid expression") && \
    echo -n "$RESULT" | wl-copy && \
    notify-send "🧮 Calculator" \
    "$EXPR = $RESULT\n\n(Result copied to clipboard)" \
    --urgency=low --expire-time=5000 \
    --hint=string:x-dunst-stack-tag:calc

# ══════════════════════════════════════════════════════════════════════════════
# §08  PASSWORD MANAGER SCRATCHPAD
#      KeePassXC / pass / gopass
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle password manager scratchpad ───────────────────────────────────────
bind = $mainMod ALT,        p,              togglespecialworkspace,     pass
bind = $mainMod ALT SHIFT,  p,              movetoworkspacesilent,      special:pass

# ── Spawn KeePassXC ────────────────────────────────────────────────────────────
bind = $mainMod ALT CTRL,   p,              exec, \
    if ! hyprctl -j clients | jq -e '.[] | select(.class == "org.keepassxc.KeePassXC")' > /dev/null 2>&1; then \
        keepassxc & sleep 1; \
    fi && \
    hyprctl dispatch movetoworkspacesilent \
    "special:pass,class:org.keepassxc.KeePassXC" && \
    hyprctl dispatch togglespecialworkspace pass

# ── TUI pass picker ───────────────────────────────────────────────────────────
bind = $hyperMod,           p,              exec, \
    ENTRY=$(pass ls 2>/dev/null | \
    grep -v '^Password Store$' | \
    sed 's/[├└│─ ]*//' | \
    grep '\.' | \
    rofi -dmenu -p "🔐 Password entry" \
    -theme-str 'window {width: 35%;} listview {lines: 12;}') && \
    [ -n "$ENTRY" ] && \
    pass -c "$ENTRY" 2>/dev/null && \
    notify-send "ASH" "🔐 Password copied: $ENTRY" \
    --urgency=normal --expire-time=30000 \
    --hint=string:x-dunst-stack-tag:pass-manager

# ══════════════════════════════════════════════════════════════════════════════
# §09  AI ASSISTANT SCRATCHPAD
#      Ollama / LLM chat interface
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle AI scratchpad ──────────────────────────────────────────────────────
bind = $mainMod ALT,        a,              togglespecialworkspace,     ai
bind = $mainMod ALT SHIFT,  a,              movetoworkspacesilent,      special:ai

# ── Spawn Ollama chat in AI scratchpad ───────────────────────────────────────
bind = $mainMod ALT CTRL,   a,              exec, \
    kitty \
        --class ash-ai \
        --override font_size=12.5 \
        --override remember_window_size=no \
        --override initial_window_width=1100 \
        --override initial_window_height=700 \
        -e ash ai chat & \
    sleep 0.5 && \
    hyprctl dispatch movetoworkspacesilent \
    "special:ai,class:ash-ai" && \
    hyprctl dispatch togglespecialworkspace ai

# ── Spawn Open WebUI in browser scratchpad ────────────────────────────────────
bind = $hyperMod,           a,              exec, \
    firefox --new-window http://localhost:3000 & \
    sleep 1 && \
    hyprctl dispatch movetoworkspacesilent \
    "special:ai,class:firefox" && \
    hyprctl dispatch togglespecialworkspace ai

# ── AI quick query from clipboard ────────────────────────────────────────────
bind = $hyperMod SHIFT,     a,              exec, \
    QUERY=$(wl-paste 2>/dev/null | head -c 200) && \
    [ -n "$QUERY" ] && \
    RESPONSE=$(echo "$QUERY" | ollama run llama3.2 2>/dev/null | head -c 400) && \
    notify-send "ASH AI" "$RESPONSE" \
    --urgency=low --expire-time=15000 \
    --hint=string:x-dunst-stack-tag:ai-response

# ══════════════════════════════════════════════════════════════════════════════
# §10  GIT MANAGER SCRATCHPAD
#      lazygit / git TUI
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle git scratchpad ─────────────────────────────────────────────────────
bind = $mainMod ALT,        g,              togglespecialworkspace,     git
bind = $mainMod ALT SHIFT,  g,              movetoworkspacesilent,      special:git

# ── Spawn lazygit in current directory ───────────────────────────────────────
bind = $mainMod ALT CTRL,   g,              exec, \
    CWD=$(readlink /proc/$(hyprctl -j activewindow | jq -r '.pid')/cwd \
    2>/dev/null || echo $HOME) && \
    kitty \
        --class lazygit-scratch \
        --override font_size=12.0 \
        --override remember_window_size=no \
        --override initial_window_width=1300 \
        --override initial_window_height=800 \
        -e lazygit --path "$CWD" & \
    sleep 0.5 && \
    hyprctl dispatch movetoworkspacesilent \
    "special:git,class:lazygit-scratch" && \
    hyprctl dispatch togglespecialworkspace git

# ── Git status quick popup ────────────────────────────────────────────────────
bind = $hyperMod,           g,              exec, \
    CWD=$(readlink /proc/$(hyprctl -j activewindow | jq -r '.pid')/cwd \
    2>/dev/null || echo $HOME) && \
    STATUS=$(git -C "$CWD" status --short 2>/dev/null | head -15 || echo "Not a git repo") && \
    BRANCH=$(git -C "$CWD" branch --show-current 2>/dev/null || echo "N/A") && \
    AHEAD=$(git -C "$CWD" rev-list --count @{u}..HEAD 2>/dev/null || echo 0) && \
    notify-send "Git: $BRANCH (↑$AHEAD)" \
    "$STATUS" \
    --urgency=low --expire-time=6000 \
    --hint=string:x-dunst-stack-tag:git-status

