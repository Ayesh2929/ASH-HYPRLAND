# ══════════════════════════════════════════════════════════════════════════════
# §12  POMODORO / FOCUS TIMER SCRATCHPAD
#      Focus timer with break notifications
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle pomodoro scratchpad ────────────────────────────────────────────────
bind = $mainMod ALT,        F4,             togglespecialworkspace,     pomodoro
bind = $mainMod ALT SHIFT,  F4,             movetoworkspacesilent,      special:pomodoro

# ── Start 25min focus session ─────────────────────────────────────────────────
bind = $mainMod ALT CTRL,   F4,             exec, \
    kitty \
        --class pomodoro-timer \
        --override font_size=14.0 \
        --override remember_window_size=no \
        --override initial_window_width=600 \
        --override initial_window_height=400 \
        --override background_opacity=0.97 \
        -e ash plugin enable focus-timer & \
    sleep 0.3 && \
    hyprctl dispatch movetoworkspacesilent \
    "special:pomodoro,class:pomodoro-timer" && \
    hyprctl dispatch togglespecialworkspace pomodoro

# ── Quick 25min countdown (terminal) ─────────────────────────────────────────
bind = $hyperMod,           F4,             exec, \
    notify-send "🍅 Pomodoro Started" \
    "25 minutes focus session\nBreak in 25:00" \
    --urgency=normal --expire-time=5000 \
    --hint=string:x-dunst-stack-tag:pomodoro && \
    (sleep 1500 && \
    notify-send "🍅 Pomodoro Complete!" \
    "Time for a 5 minute break! 🎉" \
    --urgency=critical --expire-time=30000 \
    --hint=string:x-dunst-stack-tag:pomodoro) &

# ── Stop active pomodoro ──────────────────────────────────────────────────────
bind = $hyperMod SHIFT,     F4,             exec, \
    pkill -f "sleep 1500" 2>/dev/null && \
    notify-send "🍅 Pomodoro Stopped" \
    "Focus session cancelled" \
    --urgency=normal --expire-time=3000 \
    --hint=string:x-dunst-stack-tag:pomodoro

