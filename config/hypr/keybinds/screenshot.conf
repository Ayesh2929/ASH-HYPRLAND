# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Screenshot & Recording Keybinds                  ║
# ║                                                                              ║
# ║  Full screen · Region · Window · Monitor · OCR · Color pick ·              ║
# ║  Screen recording · GIF capture · Annotation · Upload · History            ║
# ║  Backend: grimblast (grim + slurp) + wl-copy + swappy + ffmpeg             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  SCREENSHOT CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

# ── Screenshot directory ──────────────────────────────────────────────────────
$screenshotDir      = $HOME/Pictures/Screenshots
$recordingDir       = $HOME/Videos/Recordings

# ── Filename templates ────────────────────────────────────────────────────────
$screenshotFile     = screenshot_$(date '+%Y-%m-%d_%H-%M-%S')
$recordingFile      = recording_$(date '+%Y-%m-%d_%H-%M-%S')
$gifFile            = gif_$(date '+%Y-%m-%d_%H-%M-%S')

# ── grimblast base command ────────────────────────────────────────────────────
$grimblast          = grimblast --notify --cursor
$grimblastNoNotify  = grimblast --cursor

# ── Notification helper ───────────────────────────────────────────────────────
$shotNotify         = bash -c '\
    FILE="$1"; \
    notify-send "Screenshot saved" "$FILE" \
        --app-name=ASH-Screenshot \
        --icon=image-x-generic \
        --expire-time=4000 \
        --action="open:Open" \
        --action="edit:Annotate" \
        --action="copy:Copy path"' --

# ══════════════════════════════════════════════════════════════════════════════
# §02  BASIC SCREENSHOTS (Print Screen)
# ══════════════════════════════════════════════════════════════════════════════

# ── Full screen → save to file ────────────────────────────────────────────────
bind = ,              Print,          exec, \
    mkdir -p $screenshotDir && \
    $grimblast copy screen && \
    FILE="$screenshotDir/$screenshotFile.png" && \
    $grimblast save screen "$FILE" && \
    $shotNotify "$FILE"

# ── Full screen → copy to clipboard only ─────────────────────────────────────
bind = CTRL,          Print,          exec, \
    $grimblast copy screen && \
    notify-send "📋 Screenshot copied" "Full screen → clipboard" \
        --app-name=ASH-Screenshot \
        --icon=image-x-generic \
        --expire-time=2000

# ── Region selection → save to file ──────────────────────────────────────────
bind = SHIFT,         Print,          exec, \
    mkdir -p $screenshotDir && \
    FILE="$screenshotDir/$screenshotFile.png" && \
    $grimblast save area "$FILE" && \
    wl-copy < "$FILE" && \
    notify-send "📸 Area screenshot saved" "$FILE" \
        --app-name=ASH-Screenshot \
        --icon=image-x-generic \
        --expire-time=4000

# ── Region selection → copy to clipboard ─────────────────────────────────────
bind = CTRL SHIFT,    Print,          exec, \
    $grimblast copy area && \
    notify-send "📋 Area screenshot copied" "Region → clipboard" \
        --app-name=ASH-Screenshot \
        --expire-time=2000

# ── Active window → save to file ─────────────────────────────────────────────
bind = ALT,           Print,          exec, \
    mkdir -p $screenshotDir && \
    FILE="$screenshotDir/$screenshotFile.png" && \
    $grimblast save active "$FILE" && \
    wl-copy < "$FILE" && \
    notify-send "📸 Window screenshot saved" "$FILE" \
        --app-name=ASH-Screenshot \
        --icon=image-x-generic \
        --expire-time=4000

# ── Active window → copy to clipboard ────────────────────────────────────────
bind = CTRL ALT,      Print,          exec, \
    $grimblast copy active && \
    notify-send "📋 Window screenshot copied" "Active window → clipboard" \
        --app-name=ASH-Screenshot \
        --expire-time=2000

# ══════════════════════════════════════════════════════════════════════════════
# §03  ASH SCREENSHOT COMMANDS
#      Full-featured screenshot via ASH CLI
# ══════════════════════════════════════════════════════════════════════════════

# ── ASH screenshot menu (rofi picker) ────────────────────────────────────────
bind = $mainMod,            Print,      exec,   ~/.config/rofi/menus/screenshot/screenshot.sh

# ── Full screen ───────────────────────────────────────────────────────────────
bind = $mainMod SHIFT,      F1,         exec,   ash shot full

# ── Region / area selection ───────────────────────────────────────────────────
bind = $mainMod,            F2,         exec,   ash shot area
# Region with 3-second delay
bind = $mainMod SHIFT,      F2,         exec,   ash shot area --delay 3

# ── Active window ─────────────────────────────────────────────────────────────
bind = $mainMod,            F3,         exec,   ash shot window
# Window with shadow included
bind = $mainMod SHIFT,      F3,         exec,   ash shot window --include-shadow

# ── Specific monitor ──────────────────────────────────────────────────────────
bind = $mainMod,            F4,         exec,   ash shot monitor

# ══════════════════════════════════════════════════════════════════════════════
# §04  ANNOTATED SCREENSHOTS (swappy editor)
# ══════════════════════════════════════════════════════════════════════════════

# ── Region → annotate in swappy → save ───────────────────────────────────────
bind = $mainMod ALT,        Print,      exec, \
    mkdir -p $screenshotDir && \
    $grimblastNoNotify save area - | \
    swappy -f - -o "$screenshotDir/$screenshotFile-annotated.png" && \
    notify-send "✏ Annotated screenshot saved" \
        "$screenshotDir/$screenshotFile-annotated.png" \
        --app-name=ASH-Screenshot \
        --expire-time=4000

# ── Full screen → annotate in swappy ─────────────────────────────────────────
bind = $mainMod CTRL,       Print,      exec, \
    mkdir -p $screenshotDir && \
    $grimblastNoNotify save screen - | \
    swappy -f - -o "$screenshotDir/$screenshotFile-annotated.png" && \
    notify-send "✏ Full screen annotation saved" \
        "$screenshotDir/$screenshotFile-annotated.png" \
        --app-name=ASH-Screenshot \
        --expire-time=4000

# ── Window → annotate ────────────────────────────────────────────────────────
bind = $mainMod SHIFT ALT,  Print,      exec, \
    mkdir -p $screenshotDir && \
    $grimblastNoNotify save active - | \
    swappy -f - -o "$screenshotDir/$screenshotFile-annotated.png"

# ══════════════════════════════════════════════════════════════════════════════
# §05  TIMED / DELAYED SCREENSHOTS
# ══════════════════════════════════════════════════════════════════════════════

# ── 3-second countdown → full screen ─────────────────────────────────────────
bind = $mainMod CTRL,       F1,         exec, \
    for i in 3 2 1; do \
        notify-send "ASH Screenshot" "⏱ Screenshot in $i..." \
            --urgency=normal --expire-time=900; \
        sleep 1; \
    done && \
    mkdir -p $screenshotDir && \
    FILE="$screenshotDir/$screenshotFile.png" && \
    $grimblast save screen "$FILE" && \
    wl-copy < "$FILE" && \
    notify-send "📸 Screenshot taken!" "$FILE" \
        --app-name=ASH-Screenshot --expire-time=4000

# ── 5-second countdown → region ──────────────────────────────────────────────
bind = $mainMod CTRL,       F2,         exec, \
    notify-send "ASH Screenshot" "⏱ Select region in 5s..." \
        --urgency=normal --expire-time=5000 && \
    sleep 5 && \
    mkdir -p $screenshotDir && \
    FILE="$screenshotDir/$screenshotFile.png" && \
    $grimblast save area "$FILE" && \
    wl-copy < "$FILE"

# ── Repeating screenshot (every N seconds) ────────────────────────────────────
# Start: every 30 seconds full screenshot
bind = $hyperMod,           F1,         exec, \
    bash -c '\
    notify-send "ASH" "📸 Auto-screenshot started (30s interval)" \
        --urgency=normal --expire-time=3000; \
    while true; do \
        mkdir -p $screenshotDir; \
        FILE="$screenshotDir/$screenshotFile.png"; \
        grimblast save screen "$FILE"; \
        sleep 30; \
    done &'
# Stop auto-screenshot
bind = $hyperMod SHIFT,     F1,         exec, \
    pkill -f "grimblast save screen" && \
    notify-send "ASH" "📸 Auto-screenshot stopped" \
        --urgency=normal --expire-time=2000

# ══════════════════════════════════════════════════════════════════════════════
# §06  OCR SCREENSHOT (Text extraction)
# ══════════════════════════════════════════════════════════════════════════════

# ── Region OCR → copy text to clipboard ───────────────────────────────────────
bind = $mainMod,            O,          exec, \
    $grimblastNoNotify save area - | \
    tesseract stdin stdout -l eng+osd quiet 2>/dev/null | \
    tr -s ' \n' | \
    wl-copy && \
    notify-send "ASH OCR" "📋 Text extracted to clipboard" \
        --app-name=ASH-Screenshot \
        --icon=edit-copy \
        --expire-time=3000

# ── Region OCR with language selection ───────────────────────────────────────
bind = $mainMod SHIFT,      O,          exec, \
    LANG=$(echo -e "eng\njpn\nkor\nchi_sim\nchi_tra\ndeu\nfra\nrus\nspa" | \
    rofi -dmenu -p "OCR Language" -theme-str 'window {width: 25%;}') && \
    [ -n "$LANG" ] && \
    $grimblastNoNotify save area - | \
    tesseract stdin stdout -l "$LANG" quiet 2>/dev/null | \
    tr -s ' \n' | \
    wl-copy && \
    notify-send "ASH OCR ($LANG)" "📋 Text extracted to clipboard" \
        --app-name=ASH-Screenshot \
        --expire-time=3000

# ── Full screen OCR ───────────────────────────────────────────────────────────
bind = $mainMod CTRL,       O,          exec, \
    $grimblastNoNotify save screen - | \
    tesseract stdin stdout -l eng quiet 2>/dev/null | \
    wl-copy && \
    notify-send "ASH OCR" "📋 Full screen text extracted" \
        --app-name=ASH-Screenshot \
        --expire-time=3000

# ── OCR + translate ───────────────────────────────────────────────────────────
bind = $mainMod ALT,        O,          exec, \
    $grimblastNoNotify save area - | \
    tesseract stdin stdout -l auto quiet 2>/dev/null | \
    xargs -I{} bash -c 'trans -b "{}" | wl-copy' && \
    notify-send "ASH OCR+Translate" "📋 Translated text in clipboard" \
        --app-name=ASH-Screenshot \
        --expire-time=3000

# ══════════════════════════════════════════════════════════════════════════════
# §07  COLOR PICKER
# ══════════════════════════════════════════════════════════════════════════════

# ── Pick color from screen → copy hex ────────────────────────────────────────
bind = $mainMod SHIFT,      C,          exec, \
    hyprpicker --autocopy && \
    COLOR=$(wl-paste) && \
    notify-send "🎨 Color picked" "$COLOR" \
        --app-name=ASH-Screenshot \
        --hint=string:bgcolor:$COLOR \
        --expire-time=4000

# ── Pick color → show in multiple formats ─────────────────────────────────────
bind = $mainMod CTRL,       C,          exec, \
    COLOR=$(hyprpicker 2>/dev/null) && \
    [ -n "$COLOR" ] && \
    R=$((16#${COLOR:1:2})); G=$((16#${COLOR:3:2})); B=$((16#${COLOR:5:2})); \
    echo -n "$COLOR" | wl-copy && \
    notify-send "🎨 Color: $COLOR" \
        "RGB: $R, $G, $B\nHex: $COLOR\nCopied to clipboard" \
        --app-name=ASH-Screenshot \
        --expire-time=5000

# ══════════════════════════════════════════════════════════════════════════════
# §08  SCREENSHOT UPLOAD
# ══════════════════════════════════════════════════════════════════════════════

# ── Region screenshot → upload to 0x0.st (temp file sharing) ─────────────────
bind = $mainMod ALT,        F10,        exec, \
    $grimblastNoNotify save area - | \
    curl -sSF file=@- https://0x0.st | \
    wl-copy && \
    URL=$(wl-paste) && \
    notify-send "📤 Screenshot uploaded" "$URL" \
        --app-name=ASH-Screenshot \
        --action="open:Open in browser" \
        --expire-time=8000

# ── Full screenshot → upload ──────────────────────────────────────────────────
bind = $mainMod SHIFT ALT,  F10,        exec, \
    $grimblastNoNotify save screen - | \
    curl -sSF file=@- https://0x0.st | \
    wl-copy && \
    URL=$(wl-paste) && \
    notify-send "📤 Screenshot uploaded" "$URL" \
        --app-name=ASH-Screenshot \
        --expire-time=8000

# ── Upload latest screenshot in directory ─────────────────────────────────────
bind = $mainMod CTRL ALT,   F10,        exec, \
    LATEST=$(ls -t $screenshotDir/*.png 2>/dev/null | head -1) && \
    [ -n "$LATEST" ] && \
    curl -sSF file=@"$LATEST" https://0x0.st | \
    wl-copy && \
    notify-send "📤 Latest screenshot uploaded" "$(wl-paste)" \
        --app-name=ASH-Screenshot \
        --expire-time=8000

# ══════════════════════════════════════════════════════════════════════════════
# §09  SCREEN RECORDING
#      ffmpeg + wf-recorder backend
# ══════════════════════════════════════════════════════════════════════════════

# ── Start/stop full screen recording ──────────────────────────────────────────
bind = $mainMod,            F12,        exec, \
    if pgrep -x wf-recorder > /dev/null; then \
        pkill --signal SIGINT wf-recorder && \
        sleep 0.5 && \
        LATEST=$(ls -t $recordingDir/*.mp4 2>/dev/null | head -1) && \
        notify-send "⏹ Recording stopped" "$LATEST" \
            --app-name=ASH-Recording \
            --icon=camera-video \
            --expire-time=5000; \
    else \
        mkdir -p $recordingDir && \
        FILE="$recordingDir/$recordingFile.mp4" && \
        notify-send "🔴 Recording started" "$FILE" \
            --app-name=ASH-Recording \
            --icon=camera-video \
            --urgency=normal \
            --expire-time=3000 && \
        wf-recorder \
            --audio \
            --codec libx264 \
            --codec-param crf=23 \
            --codec-param preset=fast \
            --filename "$FILE"; \
    fi

# ── Region screen recording ───────────────────────────────────────────────────
bind = $mainMod SHIFT,      F12,        exec, \
    if pgrep -x wf-recorder > /dev/null; then \
        pkill --signal SIGINT wf-recorder && \
        sleep 0.5 && \
        LATEST=$(ls -t $recordingDir/*.mp4 2>/dev/null | head -1) && \
        notify-send "⏹ Region recording stopped" "$LATEST" \
            --app-name=ASH-Recording \
            --expire-time=5000; \
    else \
        mkdir -p $recordingDir && \
        REGION=$(slurp) && \
        [ -n "$REGION" ] && \
        FILE="$recordingDir/$recordingFile-region.mp4" && \
        notify-send "🔴 Region recording started" "$FILE" \
            --app-name=ASH-Recording \
            --urgency=normal \
            --expire-time=3000 && \
        wf-recorder \
            --audio \
            --geometry "$REGION" \
            --codec libx264 \
            --codec-param crf=23 \
            --filename "$FILE"; \
    fi

# ── Screen recording without audio ───────────────────────────────────────────
bind = $mainMod CTRL,       F12,        exec, \
    if pgrep -x wf-recorder > /dev/null; then \
        pkill --signal SIGINT wf-recorder; \
    else \
        mkdir -p $recordingDir && \
        FILE="$recordingDir/$recordingFile-silent.mp4" && \
        notify-send "🔴 Recording (no audio)" "$FILE" \
            --app-name=ASH-Recording --expire-time=3000 && \
        wf-recorder \
            --filename "$FILE" \
            --codec libx264 \
            --codec-param crf=18; \
    fi

# ── Recording status indicator ────────────────────────────────────────────────
bind = $mainMod ALT,        F12,        exec, \
    if pgrep -x wf-recorder > /dev/null; then \
        notify-send "🔴 Recording IN PROGRESS" \
            "PID: $(pgrep wf-recorder)\nPress Super+F12 to stop" \
            --urgency=critical --expire-time=3000; \
    else \
        notify-send "ASH Recording" "No active recording" \
            --urgency=low --expire-time=2000; \
    fi

# ══════════════════════════════════════════════════════════════════════════════
# §10  GIF RECORDING
#      Capture region as animated GIF
# ══════════════════════════════════════════════════════════════════════════════

# ── GIF record region → save ──────────────────────────────────────────────────
bind = $mainMod,            F11,        exec, \
    if pgrep -f "wf-recorder.*gif" > /dev/null; then \
        pkill --signal SIGINT wf-recorder && \
        sleep 0.5 && \
        RAWFILE=$(ls -t /tmp/ash-gif-raw-*.mp4 2>/dev/null | head -1) && \
        [ -n "$RAWFILE" ] && \
        mkdir -p $recordingDir && \
        GIFFILE="$recordingDir/$gifFile.gif" && \
        notify-send "ASH GIF" "⚙ Converting to GIF..." \
            --app-name=ASH-Recording --expire-time=5000 && \
        ffmpeg -i "$RAWFILE" \
            -vf "fps=15,scale=720:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse" \
            -loop 0 \
            "$GIFFILE" && \
        rm -f "$RAWFILE" && \
        wl-copy < "$GIFFILE" && \
        notify-send "🎞 GIF saved & copied" "$GIFFILE" \
            --app-name=ASH-Recording \
            --icon=image-gif \
            --expire-time=6000; \
    else \
        REGION=$(slurp) && \
        [ -n "$REGION" ] && \
        RAWFILE="/tmp/ash-gif-raw-$(date +%s).mp4" && \
        notify-send "🔴 GIF recording started" \
            "Region selected — press Super+F11 to stop" \
            --app-name=ASH-Recording \
            --urgency=normal \
            --expire-time=4000 && \
        wf-recorder \
            --geometry "$REGION" \
            --codec libx264 \
            --codec-param crf=18 \
            --filename "$RAWFILE"; \
    fi

# ══════════════════════════════════════════════════════════════════════════════
# §11  SCREENSHOT HISTORY & MANAGEMENT
# ══════════════════════════════════════════════════════════════════════════════

# ── Browse screenshot history in rofi ────────────────────────────────────────
bind = $mainMod,            F10,        exec, \
    FILE=$(ls -t $screenshotDir/*.{png,jpg,webp} 2>/dev/null | \
    rofi -dmenu \
        -p "📸 Screenshots" \
        -display-columns 1 \
        -theme-str 'window {width: 60%; height: 70%;}' \
        -show-icons) && \
    [ -n "$FILE" ] && imv "$FILE"

# ── Open screenshot directory ─────────────────────────────────────────────────
bind = $mainMod SHIFT,      F10,        exec,   thunar $screenshotDir

# ── Delete latest screenshot ──────────────────────────────────────────────────
bind = $mainMod CTRL,       F10,        exec, \
    LATEST=$(ls -t $screenshotDir/*.png 2>/dev/null | head -1) && \
    [ -n "$LATEST" ] && \
    rm "$LATEST" && \
    notify-send "ASH" "🗑 Deleted: $(basename $LATEST)" \
        --urgency=normal --expire-time=3000

# ── Copy latest screenshot to clipboard ──────────────────────────────────────
bind = $mainMod ALT,        F9,         exec, \
    LATEST=$(ls -t $screenshotDir/*.png 2>/dev/null | head -1) && \
    [ -n "$LATEST" ] && \
    wl-copy < "$LATEST" && \
    notify-send "📋 Latest screenshot copied" "$(basename $LATEST)" \
        --app-name=ASH-Screenshot \
        --expire-time=2000

# ══════════════════════════════════════════════════════════════════════════════
# §12  QUICK ACTION SCREENSHOT BINDS (compact section)
# ══════════════════════════════════════════════════════════════════════════════

# ── Screenshot and immediately share / email ──────────────────────────────────
bind = $hyperMod,           F10,        exec, \
    FILE=$(grimblast --cursor save area - | \
    tee "$screenshotDir/$screenshotFile.png") && \
    thunderbird -compose "attachment=$screenshotDir/$screenshotFile.png"

# ── Window screenshot → set as wallpaper ─────────────────────────────────────
bind = $hyperMod SHIFT,     F10,        exec, \
    $grimblastNoNotify save active - | \
    tee /tmp/ash-wallpaper-shot.png | \
    swww img /tmp/ash-wallpaper-shot.png \
        --transition-type fade \
        --transition-duration 0.8 && \
    notify-send "ASH" "🖼 Window set as wallpaper" \
        --app-name=ASH-Screenshot --expire-time=3000

# ══════════════════════════════════════════════════════════════════════════════
# EOF — screenshot.conf
# Dependencies:
#   grimblast (grimblast-git AUR)    — screenshot wrapper
#   grim                             — Wayland screenshot tool
#   slurp                            — region selector
#   swappy                           — screenshot annotation editor
#   wl-copy / wl-paste               — Wayland clipboard
#   hyprpicker                       — color picker
#   tesseract                        — OCR engine
#   wf-recorder                      — Wayland screen recorder
#   ffmpeg                           — video/gif conversion
#   imv                              — image viewer
#
# Install: paru -S grimblast-git grim slurp swappy wl-clipboard \
#                  hyprpicker tesseract tesseract-data-eng \
#                  wf-recorder ffmpeg imv
#
# ASH commands:
#   ash shot full         — full screenshot
#   ash shot area         — region screenshot
#   ash shot window       — window screenshot
#   ash shot record       — screen recording
#   ash shot gif          — GIF recording
#   ash shot history      — browse history
# ══════════════════════════════════════════════════════════════════════════════