# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Passthrough Submap                               ║
# ║                                                                              ║
# ║  Raw keyboard passthrough mode — sends ALL keypresses directly to the       ║
# ║  focused window without Hyprland interception.                              ║
# ║                                                                              ║
# ║  Use cases:                                                                  ║
# ║  • Virtual machines (VMware, VirtualBox, QEMU/virt-manager)                 ║
# ║  • Remote desktop clients (RDP, VNC, NoMachine, Rustdesk)                   ║
# ║  • Nested Wayland/X11 compositors                                           ║
# ║  • Games that capture keyboard (fullscreen Steam games)                     ║
# ║  • Windows emulation (WINE, Proton) with special key needs                  ║
# ║  • Terminal apps requiring Super/Meta key (tmux, specialized TUIs)          ║
# ║                                                                              ║
# ║  ENTER:  $mainMod + F9  ─────────────────────────────────────────────────── ║
# ║  EXIT:   $mainMod + F9  (same key — ONLY escape route)                      ║
# ║                                                                              ║
# ║  ⚠  WARNING: ALL other keybinds are DISABLED in passthrough mode           ║
# ║              Only $mainMod + F9 returns to normal operation                 ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  PASSTHROUGH ACTIVATION
#      Multiple entry methods for different use cases
# ══════════════════════════════════════════════════════════════════════════════

# ── Primary toggle (Super+F9) ─────────────────────────────────────────────────
bind = $mainMod, F9,            submap,     passthrough

# ── Alternative activation via CLI ───────────────────────────────────────────
# ash keybind passthrough on    → activates passthrough
# ash keybind passthrough off   → deactivates passthrough

# ══════════════════════════════════════════════════════════════════════════════
# §02  PASSTHROUGH SUBMAP ENTRY
# ══════════════════════════════════════════════════════════════════════════════

submap = passthrough

# ── Entry notification ────────────────────────────────────────────────────────
# Fired once when passthrough activates — uses critical urgency for visibility
bind = , catchall, exec, \
    notify-send \
    "⌨  PASSTHROUGH MODE ACTIVE" \
    "ALL keys pass directly to focused window.\n\nOnly $mainMod+F9 returns to normal.\n\nActive window: $(hyprctl -j activewindow | jq -r '.class + \": \" + (.title | .[0:50])')" \
    --app-name=ASH-Passthrough \
    --icon=input-keyboard \
    --urgency=critical \
    --expire-time=5000 \
    --hint=string:x-dunst-stack-tag:passthrough

# ══════════════════════════════════════════════════════════════════════════════
# §03  THE ONLY EXIT BIND
#      $mainMod + F9 is the SOLE method to exit passthrough.
#      Everything else passes through to the focused window.
# ══════════════════════════════════════════════════════════════════════════════

bind = $mainMod, F9, exec, \
    hyprctl dispatch submap reset && \
    notify-send \
    "✅ Passthrough Mode DEACTIVATED" \
    "Hyprland keybinds restored.\nAll shortcuts are active again." \
    --app-name=ASH-Passthrough \
    --icon=input-keyboard \
    --urgency=normal \
    --expire-time=3000 \
    --hint=string:x-dunst-stack-tag:passthrough

bind = $mainMod, F9,            submap,     reset

# ══════════════════════════════════════════════════════════════════════════════
# §04  SUBMAP CONTENTS
#      In passthrough mode, Hyprland processes NO other binds.
#      The submap block is intentionally empty except for the exit bind.
#      All keypresses bubble through to the focused window's event queue.
# ══════════════════════════════════════════════════════════════════════════════

# ── Visual indicators ─────────────────────────────────────────────────────────
# Waybar reads $ASH_PASSTHROUGH_MODE env var to show indicator
# The env var is set/unset by the activation script below.

# ── Waybar passthrough indicator activation ───────────────────────────────────
# These execs run at entry/exit and notify Waybar via signal
bind = , catchall, exec, \
    export ASH_PASSTHROUGH_MODE=1 && \
    pkill -SIGUSR1 waybar 2>/dev/null || true

submap = reset

# ══════════════════════════════════════════════════════════════════════════════
# §05  EXIT NOTIFICATION & CLEANUP
#      Restore normal state after passthrough
# ══════════════════════════════════════════════════════════════════════════════

# Waybar signal on exit (resets indicator)
bind = $mainMod, F9, exec, \
    unset ASH_PASSTHROUGH_MODE && \
    pkill -SIGUSR1 waybar 2>/dev/null || true

# ══════════════════════════════════════════════════════════════════════════════
# §06  ASH PASSTHROUGH MANAGEMENT COMMANDS
# ══════════════════════════════════════════════════════════════════════════════

# Direct hyprctl control (for scripts):
# hyprctl dispatch submap passthrough   → enter
# hyprctl dispatch submap reset         → exit
#
# ASH wrappers:
# ash keybind passthrough on            → enter with logging
# ash keybind passthrough off           → exit with logging
# ash keybind passthrough status        → check if active
# ash keybind passthrough auto CLASS    → auto-enter for specific window class
#
# Auto-passthrough via windowrule (for VMs):
# windowrulev2 = submap passthrough, class:^(virt-viewer)$, floating:0
# (Not recommended — makes it impossible to exit without kill signal)
#
# Per-application passthrough toggles in launch-apps.conf:
# bind = $mainMod, F9, exec, kitty --class vm-console -e virsh console DOMAIN
# bind = $mainMod, F9, submap, passthrough  ← activates alongside app launch

# ══════════════════════════════════════════════════════════════════════════════
# §07  ALTERNATIVE PASSTHROUGH METHODS
#      Softer alternatives that pass specific keys only
# ══════════════════════════════════════════════════════════════════════════════

# ── sendshortcut (pass specific bind to window) ───────────────────────────────
# Send Ctrl+Alt+Del to VM without entering passthrough:
# bind = $hyperMod, Delete, sendshortcut, CTRL ALT, Delete, class:^(virt-viewer)$

# ── Pass modifier key events only ─────────────────────────────────────────────
# bind = $mainMod, Super_L,    pass, class:^(virt-viewer)$
# bind = $mainMod, Super_R,    pass, class:^(virt-viewer)$

# ── Forward all input to specific window class (alternative) ──────────────────
# bind = $mainMod SHIFT, F9, exec, \
#     hyprctl dispatch focuswindow class:virt-viewer && \
#     hyprctl dispatch submap passthrough

# ══════════════════════════════════════════════════════════════════════════════
# EOF — passthrough-submap.conf
# Status:      hyprctl dispatch submap  (shows current submap)
# Active win:  hyprctl -j activewindow | jq '{class,title}'
# ASH:         ash keybind passthrough status
# ══════════════════════════════════════════════════════════════════════════════