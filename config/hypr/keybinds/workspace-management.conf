# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Workspace Management Keybinds                    ║
# ║                                                                              ║
# ║  Workspace switching, window-to-workspace movement, named workspaces,       ║
# ║  multi-monitor workspace control, dynamic workspace creation, and           ║
# ║  workspace overview integration                                             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  WORKSPACE ICON MAP
#      Referenced by Waybar and workspace-name displays
# ══════════════════════════════════════════════════════════════════════════════
#
#  WS 1  →  󰆍  Terminal / Shell
#  WS 2  →  󰖟  Browser / Web
#  WS 3  →  󰅩  Code / Development
#  WS 4  →  󱁉  Files / Documents
#  WS 5  →  󰝚  Music / Audio
#  WS 6  →  󰊗  Gaming
#  WS 7  →  󰙯  Social / Communication
#  WS 8  →  󰍡  Mail / Email
#  WS 9  →  󰙺  Media / Streaming
#  WS 10 →  󰓅  System / Monitoring
#

# ══════════════════════════════════════════════════════════════════════════════
# §02  DIRECT WORKSPACE SWITCH (1-10)
#      Super + NUMBER → switch to workspace N
# ══════════════════════════════════════════════════════════════════════════════

# ── Workspaces 1-9 ────────────────────────────────────────────────────────────
bind = $mainMod,        1,          workspace,      1
bind = $mainMod,        2,          workspace,      2
bind = $mainMod,        3,          workspace,      3
bind = $mainMod,        4,          workspace,      4
bind = $mainMod,        5,          workspace,      5
bind = $mainMod,        6,          workspace,      6
bind = $mainMod,        7,          workspace,      7
bind = $mainMod,        8,          workspace,      8
bind = $mainMod,        9,          workspace,      9

# ── Workspace 10 (mapped to 0 key) ────────────────────────────────────────────
bind = $mainMod,        0,          workspace,      10

# ── Workspace names (Waybar displays these) ───────────────────────────────────
# Applied via workspacerules.conf — defaultName sets display name
# Rename dynamically:
# hyprctl dispatch renameworkspace 1 "󰆍 term"
# hyprctl dispatch renameworkspace 2 "󰖟 web"

# ══════════════════════════════════════════════════════════════════════════════
# §03  MOVE WINDOW TO WORKSPACE (Super+Shift+NUMBER)
#      Window follows to new workspace (focus stays on current ws)
# ══════════════════════════════════════════════════════════════════════════════

# ── Move to workspace 1-9 (silent — focus stays) ─────────────────────────────
bind = $mainMod SHIFT,  1,          movetoworkspacesilent,  1
bind = $mainMod SHIFT,  2,          movetoworkspacesilent,  2
bind = $mainMod SHIFT,  3,          movetoworkspacesilent,  3
bind = $mainMod SHIFT,  4,          movetoworkspacesilent,  4
bind = $mainMod SHIFT,  5,          movetoworkspacesilent,  5
bind = $mainMod SHIFT,  6,          movetoworkspacesilent,  6
bind = $mainMod SHIFT,  7,          movetoworkspacesilent,  7
bind = $mainMod SHIFT,  8,          movetoworkspacesilent,  8
bind = $mainMod SHIFT,  9,          movetoworkspacesilent,  9
bind = $mainMod SHIFT,  0,          movetoworkspacesilent,  10

# ── Move to workspace AND follow (focus jumps too) ────────────────────────────
bind = $mainMod CTRL,   1,          movetoworkspace,        1
bind = $mainMod CTRL,   2,          movetoworkspace,        2
bind = $mainMod CTRL,   3,          movetoworkspace,        3
bind = $mainMod CTRL,   4,          movetoworkspace,        4
bind = $mainMod CTRL,   5,          movetoworkspace,        5
bind = $mainMod CTRL,   6,          movetoworkspace,        6
bind = $mainMod CTRL,   7,          movetoworkspace,        7
bind = $mainMod CTRL,   8,          movetoworkspace,        8
bind = $mainMod CTRL,   9,          movetoworkspace,        9
bind = $mainMod CTRL,   0,          movetoworkspace,        10

# ══════════════════════════════════════════════════════════════════════════════
# §04  RELATIVE WORKSPACE NAVIGATION
#      Navigate without knowing exact workspace number
# ══════════════════════════════════════════════════════════════════════════════

# ── Next / previous workspace ─────────────────────────────────────────────────
bind = $mainMod,        bracketright,   workspace,  +1
bind = $mainMod,        bracketleft,    workspace,  -1
# Ctrl+Alt+Arrow (system-standard navigation)
bind = CTRL ALT,        Right,          workspace,  +1
bind = CTRL ALT,        Left,           workspace,  -1

# ── Move window to next/previous workspace ────────────────────────────────────
bind = $mainMod SHIFT,  bracketright,   movetoworkspace,    +1
bind = $mainMod SHIFT,  bracketleft,    movetoworkspace,    -1

# ── Move window silently to next/previous workspace ───────────────────────────
bind = $mainMod CTRL,   bracketright,   movetoworkspacesilent, +1
bind = $mainMod CTRL,   bracketleft,    movetoworkspacesilent, -1

# ── Back-and-forth (toggle between current and previous workspace) ────────────
bind = $mainMod,        backslash,      workspace,  previous
bind = $mainMod ALT,    backslash,      workspace,  back_and_forth

# ══════════════════════════════════════════════════════════════════════════════
# §05  EMPTY WORKSPACE NAVIGATION
#      Jump to the next/first empty workspace
# ══════════════════════════════════════════════════════════════════════════════

# ── Focus next empty workspace ────────────────────────────────────────────────
bind = $mainMod,        F5,             workspace,  empty
# Move window to next empty workspace
bind = $mainMod SHIFT,  F5,             movetoworkspace, empty
# Move window silently to next empty workspace
bind = $mainMod CTRL,   F5,             movetoworkspacesilent, empty

# ══════════════════════════════════════════════════════════════════════════════
# §06  NAMED WORKSPACE SHORTCUTS
#      Jump to specific named workspaces by semantic purpose
# ══════════════════════════════════════════════════════════════════════════════

# ── ASH workflow workspaces ───────────────────────────────────────────────────
# Terminal workspace
bind = $hyperMod,       1,          workspace,      name:term
# Browser workspace
bind = $hyperMod,       2,          workspace,      name:web
# Code workspace
bind = $hyperMod,       3,          workspace,      name:code
# Gaming workspace
bind = $hyperMod,       6,          workspace,      name:game
# Social workspace
bind = $hyperMod,       7,          workspace,      name:social

# ══════════════════════════════════════════════════════════════════════════════
# §07  WORKSPACE OVERVIEW (hyprexpo plugin)
#      Visual grid of all workspaces with live previews
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle expo overview ──────────────────────────────────────────────────────
bind = $mainMod,        Tab,        hyprexpo:expo,  toggle
# Open overview and enter workspace selection
bind = $mainMod SHIFT,  Tab,        hyprexpo:expo,  toggle

# ══════════════════════════════════════════════════════════════════════════════
# §08  MULTI-MONITOR WORKSPACE MANAGEMENT
#      Control workspace distribution across multiple monitors
# ══════════════════════════════════════════════════════════════════════════════

# ── Focus monitor by direction ────────────────────────────────────────────────
bind = $mainMod,        comma,      focusmonitor,   l
bind = $mainMod,        period,     focusmonitor,   r
# Focus monitor by name
bind = $mainMod ALT,    1,          focusmonitor,   DP-1
bind = $mainMod ALT,    2,          focusmonitor,   HDMI-A-1
bind = $mainMod ALT,    3,          focusmonitor,   DP-2

# ── Move workspace to monitor ─────────────────────────────────────────────────
# Move current workspace left/right to other monitor
bind = $mainMod SHIFT,  comma,      movecurrentworkspacetomonitor,  l
bind = $mainMod SHIFT,  period,     movecurrentworkspacetomonitor,  r

# ── Move window to specific monitor ──────────────────────────────────────────
bind = $mainMod CTRL,   comma,      movewindow,     mon:l
bind = $mainMod CTRL,   period,     movewindow,     mon:r

# ── Move active window to other monitor workspace (follow focus) ──────────────
bind = $mainMod ALT,    comma,      exec, \
    WINADDR=$(hyprctl -j activewindow | jq -r '.address'); \
    hyprctl dispatch focusmonitor l; \
    WSID=$(hyprctl -j activeworkspace | jq -r '.id'); \
    hyprctl dispatch movewindowpixel exact 0 0,address:$WINADDR; \
    hyprctl dispatch movetoworkspace $WSID,address:$WINADDR

bind = $mainMod ALT,    period,     exec, \
    WINADDR=$(hyprctl -j activewindow | jq -r '.address'); \
    hyprctl dispatch focusmonitor r; \
    WSID=$(hyprctl -j activeworkspace | jq -r '.id'); \
    hyprctl dispatch movetoworkspace $WSID,address:$WINADDR

# ── Cycle focused monitor ─────────────────────────────────────────────────────
bind = $mainMod,        F6,         focusmonitor,   +1
bind = $mainMod SHIFT,  F6,         focusmonitor,   -1

# ══════════════════════════════════════════════════════════════════════════════
# §09  WORKSPACE CREATION & DELETION
#      Dynamic workspace management
# ══════════════════════════════════════════════════════════════════════════════

# ── Create and switch to new workspace ───────────────────────────────────────
bind = $mainMod,        F7,         exec, \
    hyprctl dispatch workspace \
    $(($(hyprctl -j workspaces | jq 'map(.id) | max') + 1)) && \
    notify-send "ASH" "󰝠 New workspace created" --expire-time=1500

# ── Rename current workspace ──────────────────────────────────────────────────
bind = $mainMod ALT,    F7,         exec, \
    NAME=$(rofi -dmenu -p "󰙑 Workspace name" -theme-str \
    'window {width: 30%;}') && \
    [ -n "$NAME" ] && \
    hyprctl dispatch renameworkspace \
    $(hyprctl -j activeworkspace | jq -r '.id') "$NAME" && \
    notify-send "ASH" "Workspace renamed: $NAME" --expire-time=2000

# ── Close empty workspace ─────────────────────────────────────────────────────
bind = $mainMod CTRL,   F7,         exec, \
    WSID=$(hyprctl -j activeworkspace | jq -r '.id'); \
    COUNT=$(hyprctl -j clients | jq "[.[] | select(.workspace.id == $WSID)] | length"); \
    if [ "$COUNT" = "0" ]; then \
        hyprctl dispatch workspace previous && \
        notify-send "ASH" "Empty workspace removed" --expire-time=1500; \
    else \
        notify-send "ASH" "Workspace has $COUNT windows — not removed" --expire-time=2000; \
    fi

# ══════════════════════════════════════════════════════════════════════════════
# §10  WORKSPACE SCROLL (mousewheel on desktop)
#      Scroll on empty desktop to change workspace
# ══════════════════════════════════════════════════════════════════════════════

# ── Scroll workspaces ─────────────────────────────────────────────────────────
# Mouse scroll on desktop (no window focused)
bind = $mainMod,        mouse_up,   workspace,      -1
bind = $mainMod,        mouse_down, workspace,      +1

# ══════════════════════════════════════════════════════════════════════════════
# §11  WORKSPACE INFORMATION
# ══════════════════════════════════════════════════════════════════════════════

# ── Show workspace info notification ─────────────────────────────────────────
bind = $mainMod,        F6,         exec, \
    WSINFO=$(hyprctl -j workspaces | jq '.[] | select(.id == \
    ('$(hyprctl -j activeworkspace | jq -r '.id')'|tonumber))'); \
    WINCOUNT=$(hyprctl -j clients | jq \
    "[.[] | select(.workspace.id == ('$(hyprctl -j activeworkspace \
    | jq -r '.id')'|tonumber))] | length"); \
    notify-send "Workspace Info" \
    "$(echo $WSINFO | jq -r '"Name: \(.name)\nID: \(.id)\nMonitor: \(.monitor)"')\nWindows: $WINCOUNT" \
    --expire-time=4000 -i dialog-information

# ── List all workspaces ───────────────────────────────────────────────────────
bind = $mainMod CTRL,   F6,         exec, \
    hyprctl -j workspaces | jq -r \
    '.[] | "WS \(.id): \(.name) [\(.windows) windows] on \(.monitor)"' | \
    rofi -dmenu -p "󰝠 Workspaces" \
    -theme-str 'window {width: 40%;} listview {lines: 12;}' | \
    grep -oP '^\S+\s+\K\d+' | \
    xargs -I{} hyprctl dispatch workspace {}

# ══════════════════════════════════════════════════════════════════════════════
# §12  SPECIAL WORKSPACE (SCRATCHPAD) MANAGEMENT
#      All scratchpad binds centralized here
# ══════════════════════════════════════════════════════════════════════════════

# ── Toggle special workspaces ─────────────────────────────────────────────────
# Main scratch terminal
bind = $mainMod,        grave,              togglespecialworkspace,     scratch
# Music player scratch
bind = $mainMod,        m,                  togglespecialworkspace,     music
# Notes scratch (Obsidian)
bind = $mainMod ALT,    O,                  togglespecialworkspace,     notes
# System monitoring scratch
bind = $mainMod,        F10,                togglespecialworkspace,     monitoring
# Docker manager scratch
bind = $mainMod,        F11,                togglespecialworkspace,     docker
# Calculator scratch
bind = $mainMod ALT,    equal,              togglespecialworkspace,     calc
# Password manager scratch
bind = $mainMod ALT,    P,                  togglespecialworkspace,     pass

# ── Send window to special workspace ─────────────────────────────────────────
# Send to scratch (silently)
bind = $mainMod SHIFT,  grave,              movetoworkspacesilent,      special:scratch
# Send to music
bind = $mainMod SHIFT,  m,                  movetoworkspacesilent,      special:music

# ── Special workspace on all monitors ─────────────────────────────────────────
# Cycle special workspaces
bind = $mainMod ALT,    grave,              exec, \
    SPECIALS=$(hyprctl -j workspaces | jq -r '.[] | select(.name | startswith("special:")) | .name'); \
    echo "$SPECIALS" | rofi -dmenu -p "󰐃 Special Workspace" \
    -theme-str 'window {width: 30%;}' | \
    xargs -I{} hyprctl dispatch togglespecialworkspace {}

# ══════════════════════════════════════════════════════════════════════════════
# §13  WORKSPACE MONITOR SUBMAP
#      Manage monitor layouts and workspace assignment
# ══════════════════════════════════════════════════════════════════════════════

submap = monitor

# ── Monitor focus ─────────────────────────────────────────────────────────────
bind = , left,          focusmonitor,       l
bind = , right,         focusmonitor,       r
bind = , up,            focusmonitor,       u
bind = , down,          focusmonitor,       d
bind = , H,             focusmonitor,       l
bind = , L,             focusmonitor,       r
bind = , K,             focusmonitor,       u
bind = , J,             focusmonitor,       d

# ── Move workspace to monitor ─────────────────────────────────────────────────
bind = SHIFT, left,     movecurrentworkspacetomonitor,  l
bind = SHIFT, right,    movecurrentworkspacetomonitor,  r
bind = SHIFT, H,        movecurrentworkspacetomonitor,  l
bind = SHIFT, L,        movecurrentworkspacetomonitor,  r

# ── Move active window to monitor ─────────────────────────────────────────────
bind = CTRL,  left,     movewindow,         mon:l
bind = CTRL,  right,    movewindow,         mon:r
bind = CTRL,  H,        movewindow,         mon:l
bind = CTRL,  L,        movewindow,         mon:r

# ── Toggle mirror mode ────────────────────────────────────────────────────────
bind = , M,             exec, \
    ash monitor mirror --toggle && \
    notify-send "ASH" "Monitor mirror toggled" --expire-time=2000

# ── DPMS per monitor ──────────────────────────────────────────────────────────
bind = , D,             exec, \
    hyprctl dispatch dpms toggle \
    $(hyprctl -j monitors | jq -r '.[] | select(.focused) | .name')

# ── Resolution picker ─────────────────────────────────────────────────────────
bind = , R,             exec, \
    ash monitor resolution --interactive

# ── Refresh rate picker ───────────────────────────────────────────────────────
bind = , F,             exec, \
    ash monitor refresh-rate --interactive

# ── Exit monitor submap ───────────────────────────────────────────────────────
bind = , Return,        submap,             reset
bind = , Escape,        submap,             reset

submap = reset

# ══════════════════════════════════════════════════════════════════════════════
# §14  POWER SUBMAP
#      System power actions with confirmation safety
#      Enter with: $mainMod + Escape
#      Must press action key within timeout or submap resets
# ══════════════════════════════════════════════════════════════════════════════

submap = power

# ── Power actions ─────────────────────────────────────────────────────────────
# Lock screen
bind = , L,             exec,               hyprlock --immediate
bind = , L,             submap,             reset
# Suspend to RAM
bind = , S,             exec,               systemctl suspend
bind = , S,             submap,             reset
# Hibernate
bind = , H,             exec,               systemctl hibernate
bind = , H,             submap,             reset
# Logout (exit Hyprland)
bind = , E,             exit
# Reboot
bind = , R,             exec,               systemctl reboot
bind = , R,             submap,             reset
# Shutdown
bind = , P,             exec,               systemctl poweroff
bind = , P,             submap,             reset
# Power menu (rofi)
bind = , M,             exec,               $powermenu
bind = , M,             submap,             reset

# ── Cancel (any other key exits) ──────────────────────────────────────────────
bind = , Return,        submap,             reset
bind = , Escape,        submap,             reset
bind = , catchall,      submap,             reset

submap = reset

# ══════════════════════════════════════════════════════════════════════════════
# §15  PASSTHROUGH SUBMAP
#      All keypresses pass directly to focused window
#      Useful for: VMs, remote desktop, games that capture keyboard
#      Enter: $mainMod + F9   Exit: $mainMod + F9 (same key)
# ══════════════════════════════════════════════════════════════════════════════

submap = passthrough

# ── Exit passthrough ──────────────────────────────────────────────────────────
# ONLY this bind exits — everything else passes through
bind = $mainMod,        F9,             submap,         reset

submap = reset

