windowrulev2 = pin,                 class:^(firefox)$, title:^(Picture-in-Picture)$
windowrulev2 = size 480 270,        class:^(firefox)$, title:^(Picture-in-Picture)$
windowrulev2 = move 100%-495 100%-285, class:^(firefox)$, title:^(Picture-in-Picture)$
windowrulev2 = noborder,            class:^(firefox)$, title:^(Picture-in-Picture)$
windowrulev2 = noshadow,            class:^(firefox)$, title:^(Picture-in-Picture)$
windowrulev2 = keepaspectratio,     class:^(firefox)$, title:^(Picture-in-Picture)$
