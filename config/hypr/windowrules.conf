# ══════════════════════════════════════════════════════════════════════════════
# §01  WINDOW RULE FORMAT REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  windowrulev2 = RULE, CONDITION[, CONDITION...]
#
#  ── CONDITION types ──────────────────────────────────────────────────────────
#   class:REGEX        — match window class (wm_class)
#   title:REGEX        — match window title
#   tag:NAME           — match ASH window tag
#   xwayland:0|1       — 0=native Wayland, 1=XWayland
#   floating:0|1       — 0=tiled, 1=floating
#   fullscreen:0|1     — match fullscreen state
#   pinned:0|1         — match pinned state
#   focus:0|1          — 0=unfocused, 1=focused
#   workspace:N        — match workspace number or name
#   monitor:NAME       — match monitor name
#   onworkspace:N      — match window on specific workspace
#   initialClass:REGEX — match initial class (before first map)
#   initialTitle:REGEX — match initial title
#
#  ── Useful RULES ─────────────────────────────────────────────────────────────
#   float                       — make window float
#   tile                        — force tile
#   center [1]                  — center (1=cursor-relative)
#   size W H                    — set size (px or %)
#   move X Y                    — set position (px, %, or cursor)
#   fullscreen [0|1|2]          — 0=real 1=max 2=fullscreen no-gaps
#   maximize                    — maximize
#   pseudo                      — pseudo-tile (float size in tile)
#   pin                         — pin to all workspaces
#   stayfocused                 — grab focus and keep it
#   forceinput                  — force input even when not focused
#   minsize W H                 — minimum size
#   maxsize W H                 — maximum size
#   opacity ACTIVE [INACTIVE]   — opacity values
#   opaque                      — force opaque
#   opaqueoverride              — override even blur
#   blur                        — enable blur (for transparent windows)
#   noblur                      — disable blur
#   noshadow                    — disable shadow
#   noborder                    — disable border
#   noanim                      — disable animation
#   nodim                       — don't dim when inactive
#   nofocus                     — don't auto-focus
#   noinitialfocus              — don't focus on open
#   workspace N [silent]        — open on workspace N
#   idleinhibit always|focus|fullscreen|none  — inhibit idle
#   suppressevent fullscreen|maximize|activate|activatefocus
#   tag NAME [+|-]              — assign/add/remove tag
#   group [set|lock|new|barred] — group behavior
#   renderunfocused             — render even when unfocused (e.g. video)
#   xray [0|1]                  — blur xray
#   bordercolor COLOR           — per-window border color
#   bordersize N                — per-window border size
#   rounding N                  — per-window corner rounding
#   keepaspectratio             — maintain aspect ratio when resizing
#   animation STYLE             — per-window animation override
#   scrollmouse N               — 0=scroll 1=volume
#   scrolltouchpad N
#   allowsinput                 — allow input pass-through
#   swallowing:0|1              — control swallow behavior
#   immediate                   — allow tearing (for this window)
#   monitor NAME                — force monitor for floating
#
# ══════════════════════════════════════════════════════════════════════════════
# §02  GLOBAL DEFAULTS & CLEANUP
# ══════════════════════════════════════════════════════════════════════════════

# ── Fix XWayland apps ─────────────────────────────────────────────────────────
windowrulev2 = rounding 0,         xwayland:1
windowrulev2 = noblur,             xwayland:1
windowrulev2 = noshadow,           xwayland:1, floating:0

# ── Disable animations for very large windows (performance) ───────────────────
windowrulev2 = noanim,             class:^(.*),   fullscreen:1

# ── Smart blur — only for transparent/frosted windows ────────────────────────
windowrulev2 = blur,               class:^(waybar|swaync|rofi|wlogout|wofi|ags)$

# ══════════════════════════════════════════════════════════════════════════════
# §03  TERMINAL EMULATORS
# ══════════════════════════════════════════════════════════════════════════════

# ── Kitty ─────────────────────────────────────────────────────────────────────
windowrulev2 = opacity 0.94 0.88,   class:^(kitty)$
windowrulev2 = blur,                class:^(kitty)$
windowrulev2 = rounding 12,         class:^(kitty)$
windowrulev2 = tag +terminal,       class:^(kitty)$

# ── Kitty floating instances (scratchpads, dialogs) ───────────────────────────
windowrulev2 = float,               class:^(kitty)$, title:^(float-.*)$
windowrulev2 = center,              class:^(kitty)$, title:^(float-.*)$
windowrulev2 = size 900 600,        class:^(kitty)$, title:^(float-.*)$

# ── Specific kitty window classes ─────────────────────────────────────────────
windowrulev2 = float,               class:^(monitoring)$
windowrulev2 = size 1200 700,       class:^(monitoring)$
windowrulev2 = center,              class:^(monitoring)$
windowrulev2 = workspace special:monitoring silent, class:^(monitoring)$

windowrulev2 = float,               class:^(music)$
windowrulev2 = size 1000 600,       class:^(music)$
windowrulev2 = center,              class:^(music)$
windowrulev2 = workspace special:music silent, class:^(music)$

windowrulev2 = float,               class:^(docker)$
windowrulev2 = size 1200 750,       class:^(docker)$
windowrulev2 = center,              class:^(docker)$

# ── Foot ──────────────────────────────────────────────────────────────────────
windowrulev2 = opacity 0.94 0.88,   class:^(foot)$
windowrulev2 = blur,                class:^(foot)$
windowrulev2 = tag +terminal,       class:^(foot)$

# ── Alacritty ─────────────────────────────────────────────────────────────────
windowrulev2 = opacity 0.94 0.88,   class:^(Alacritty)$
windowrulev2 = blur,                class:^(Alacritty)$
windowrulev2 = tag +terminal,       class:^(Alacritty)$

# ── WezTerm ───────────────────────────────────────────────────────────────────
