windowrulev2 = idleinhibit always,  class:^(mpv)$
windowrulev2 = keepaspectratio,     class:^(mpv)$
windowrulev2 = renderunfocused,     class:^(mpv)$
windowrulev2 = tag +media,          class:^(mpv)$
windowrulev2 = immediate,           class:^(mpv)$      # Allow tearing for smooth playback

# MPV float mode ───────────────────────────────────────────────────────────────
windowrulev2 = float,               class:^(mpv)$, title:^(float.*)$
windowrulev2 = center,              class:^(mpv)$, title:^(float.*)$
windowrulev2 = size 960 540,        class:^(mpv)$, title:^(float.*)$

