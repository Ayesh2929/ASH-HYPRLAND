# ── GameScope (nested compositor for games) ───────────────────────────────────
windowrulev2 = immediate,           class:^(gamescope)$
windowrulev2 = idleinhibit always,  class:^(gamescope)$
windowrulev2 = fullscreen,          class:^(gamescope)$
windowrulev2 = noborder,            class:^(gamescope)$
windowrulev2 = noanim,              class:^(gamescope)$

# ── MangoHUD overlay ──────────────────────────────────────────────────────────
windowrulev2 = nofocus,             class:^(mangohud)$
windowrulev2 = float,               class:^(mangohud)$
windowrulev2 = pin,                 class:^(mangohud)$
windowrulev2 = noborder,            class:^(mangohud)$
windowrulev2 = noshadow,            class:^(mangohud)$
windowrulev2 = noanim,              class:^(mangohud)$
windowrulev2 = move 0 0,            class:^(mangohud)$

# ── Wine / Proton windows ─────────────────────────────────────────────────────
windowrulev2 = immediate,           class:^(wine)$, xwayland:1
windowrulev2 = noanim,              class:^(wine)$, title:^()$
windowrulev2 = noborder,            class:^(wine)$, title:^()$

# ══════════════════════════════════════════════════════════════════════════════
# §12  PRODUCTIVITY & OFFICE
# ══════════════════════════════════════════════════════════════════════════════

# ── LibreOffice ───────────────────────────────────────────────────────────────
windowrulev2 = tag +office,         class:^(libreoffice.*)$
windowrulev2 = float,               class:^(libreoffice.*)$, \
                                     title:^(Macro|Basic IDE|Template Manager.*)$
windowrulev2 = center,              class:^(libreoffice.*)$, \
                                     title:^(Macro|Basic IDE|Template Manager.*)$

# ── Obsidian ──────────────────────────────────────────────────────────────────
windowrulev2 = tag +notes,          class:^(obsidian|Obsidian)$
windowrulev2 = opacity 0.97 0.92,   class:^(obsidian|Obsidian)$
windowrulev2 = blur,                class:^(obsidian|Obsidian)$
windowrulev2 = workspace special:notes silent, class:^(obsidian|Obsidian)$

# ── Notion / Notion Enhanced ──────────────────────────────────────────────────
windowrulev2 = tag +notes,          class:^(notion.*)$

# ── Todoist ───────────────────────────────────────────────────────────────────
windowrulev2 = float,               class:^(todoist)$
windowrulev2 = center,              class:^(todoist)$
windowrulev2 = size 850 600,        class:^(todoist)$

# ── Calendar (GNOME Calendar) ─────────────────────────────────────────────────
windowrulev2 = float,               class:^(org.gnome.Calendar)$
windowrulev2 = center,              class:^(org.gnome.Calendar)$
windowrulev2 = size 700 500,        class:^(org.gnome.Calendar)$

# ══════════════════════════════════════════════════════════════════════════════
# §13  VIRTUAL MACHINES & CONTAINERS
# ══════════════════════════════════════════════════════════════════════════════

# ── GNOME Boxes ───────────────────────────────────────────────────────────────
windowrulev2 = tag +vm,             class:^(gnome-boxes)$
windowrulev2 = idleinhibit always,  class:^(gnome-boxes)$

# ── VirtualBox ────────────────────────────────────────────────────────────────
windowrulev2 = tag +vm,             class:^(VirtualBox.*)$
windowrulev2 = idleinhibit always,  class:^(VirtualBox Machine)$
windowrulev2 = float,               class:^(VirtualBox Manager)$, \
                                     title:^(.*Preference.*)$
windowrulev2 = center,              class:^(VirtualBox Manager)$, \
                                     title:^(.*Preference.*)$

# ── VMware ────────────────────────────────────────────────────────────────────
windowrulev2 = tag +vm,             class:^(vmware)$
windowrulev2 = idleinhibit always,  class:^(vmware)$

# ── virt-manager (QEMU/KVM) ───────────────────────────────────────────────────
windowrulev2 = tag +vm,             class:^(virt-manager)$
windowrulev2 = idleinhibit focus,   class:^(virt-viewer)$
windowrulev2 = float,               class:^(virt-manager)$, \
                                     title:^(.*Preference.*)$

# ══════════════════════════════════════════════════════════════════════════════
# §14  COMMON DIALOG BOXES (generic float rules)
# ══════════════════════════════════════════════════════════════════════════════

# ── XDG file pickers ──────────────────────────────────────────────────────────
windowrulev2 = float,               class:^(xdg-desktop-portal-gtk)$
windowrulev2 = center,              class:^(xdg-desktop-portal-gtk)$
windowrulev2 = size 900 600,        class:^(xdg-desktop-portal-gtk)$

# ── KDE file dialog ───────────────────────────────────────────────────────────
windowrulev2 = float,               class:^(kdialog)$
windowrulev2 = center,              class:^(kdialog)$

# ── GTK file chooser standalone ───────────────────────────────────────────────
windowrulev2 = float,               title:^(Open File.*)$
windowrulev2 = center,              title:^(Open File.*)$
windowrulev2 = float,               title:^(Save File.*)$
windowrulev2 = center,              title:^(Save File.*)$
windowrulev2 = float,               title:^(Choose Files?.*)$
windowrulev2 = center,              title:^(Choose Files?.*)$
windowrulev2 = float,               title:^(Select.*(File|Folder|Directory).*)$
windowrulev2 = center,              title:^(Select.*(File|Folder|Directory).*)$

# ── Authentication / sudo dialogs ─────────────────────────────────────────────
windowrulev2 = float,               class:^(polkit-gnome-authentication-agent-1)$
windowrulev2 = center,              class:^(polkit-gnome-authentication-agent-1)$
windowrulev2 = stayfocused,         class:^(polkit-gnome-authentication-agent-1)$

# ── SSH pinentry ──────────────────────────────────────────────────────────────
windowrulev2 = float,               class:^(gcr-prompter|pinentry.*)$
windowrulev2 = center,              class:^(gcr-prompter|pinentry.*)$
windowrulev2 = stayfocused,         class:^(gcr-prompter|pinentry.*)$

# ── Confirm / alert dialogs (generic title match) ────────────────────────────
windowrulev2 = float,               title:^(Confirm.*)$
windowrulev2 = center,              title:^(Confirm.*)$
windowrulev2 = float,               title:^(Alert.*)$
windowrulev2 = center,              title:^(Alert.*)$
windowrulev2 = float,               title:^(Warning.*)$
windowrulev2 = center,              title:^(Warning.*)$
windowrulev2 = float,               title:^(Error.*)$
windowrulev2 = center,              title:^(Error.*)$
windowrulev2 = float,               title:^(Question.*)$
windowrulev2 = center,              title:^(Question.*)$

# ── About dialogs ─────────────────────────────────────────────────────────────
windowrulev2 = float,               title:^(About.*)$
windowrulev2 = center,              title:^(About.*)$
windowrulev2 = size 500 400,        title:^(About.*)$

# ── Preference dialogs ────────────────────────────────────────────────────────
windowrulev2 = float,               title:^(Preferences.*)$
windowrulev2 = center,              title:^(Preferences.*)$
windowrulev2 = float,               title:^(Settings.*)$,   \
                                     floating:0
windowrulev2 = center,              title:^(Settings.*)$,   \
                                     floating:0

# ══════════════════════════════════════════════════════════════════════════════
# §15  SCREEN SHARING & RECORDING INDICATORS
# ══════════════════════════════════════════════════════════════════════════════

# ── xdg-desktop-portal-hyprland screenshare picker ───────────────────────────
windowrulev2 = float,               title:^(.*Share.*)$, \
                                     class:^(xdg-desktop-portal-hyprland)$
windowrulev2 = center,              title:^(.*Share.*)$, \
                                     class:^(xdg-desktop-portal-hyprland)$

# ── OBS projector / preview ───────────────────────────────────────────────────
windowrulev2 = idleinhibit always,  title:^(.*Projector.*)$, \
                                     class:^(com.obsproject.Studio)$
windowrulev2 = noborder,            title:^(.*Projector.*)$, \
                                     class:^(com.obsproject.Studio)$

# ══════════════════════════════════════════════════════════════════════════════
# §16  ASH-SPECIFIC RULES
# ══════════════════════════════════════════════════════════════════════════════

# ── ASH Doctor (floating terminal) ────────────────────────────────────────────
windowrulev2 = float,               class:^(floating)$
windowrulev2 = center,              class:^(floating)$
windowrulev2 = size 1000 650,       class:^(floating)$
windowrulev2 = blur,                class:^(floating)$
windowrulev2 = opacity 0.95 0.90,   class:^(floating)$
windowrulev2 = rounding 16,         class:^(floating)$

# ── ASH Theme Picker ──────────────────────────────────────────────────────────
windowrulev2 = float,               class:^(ash-theme-picker)$
windowrulev2 = center,              class:^(ash-theme-picker)$
windowrulev2 = size 1100 700,       class:^(ash-theme-picker)$
windowrulev2 = blur,                class:^(ash-theme-picker)$
windowrulev2 = rounding 16,         class:^(ash-theme-picker)$
windowrulev2 = stayfocused,         class:^(ash-theme-picker)$

# ── ASH Web Dashboard ─────────────────────────────────────────────────────────
windowrulev2 = float,               class:^(ash-dashboard)$
windowrulev2 = center,              class:^(ash-dashboard)$
windowrulev2 = size 1400 900,       class:^(ash-dashboard)$

# ══════════════════════════════════════════════════════════════════════════════
# §17  SPECIAL WORKSPACE RULES
# ══════════════════════════════════════════════════════════════════════════════

# ── Scratch workspace ─────────────────────────────────────────────────────────
windowrulev2 = float,               onworkspace:special:scratch
windowrulev2 = center,              onworkspace:special:scratch
windowrulev2 = size 90% 85%,        onworkspace:special:scratch
windowrulev2 = opacity 0.95 0.90,   onworkspace:special:scratch
windowrulev2 = blur,                onworkspace:special:scratch
windowrulev2 = rounding 16,         onworkspace:special:scratch

# ══════════════════════════════════════════════════════════════════════════════
# §18  LAYER RULES
#      Controls surfaces rendered at compositor level (bars, overlays)
# ══════════════════════════════════════════════════════════════════════════════

# ── Waybar ────────────────────────────────────────────────────────────────────
layerrule = blur,       waybar
layerrule = xray 0,     waybar
layerrule = ignorezero, waybar
layerrule = animation slide top, waybar

# ── SwayNC ────────────────────────────────────────────────────────────────────
layerrule = blur,       swaync
layerrule = xray 0,     swaync
layerrule = ignorezero, swaync
layerrule = animation slide right, swaync-notification-window
layerrule = animation slide right, swaync-control-center

# ── Rofi ──────────────────────────────────────────────────────────────────────
layerrule = blur,       rofi
layerrule = xray 0,     rofi
layerrule = animation   fade, rofi

# ── Wlogout ───────────────────────────────────────────────────────────────────
layerrule = blur,       wlogout
layerrule = animation   fade, wlogout

# ── AGS ───────────────────────────────────────────────────────────────────────
layerrule = blur,       ags
layerrule = ignorezero, ags
layerrule = xray 0,     ags

# ── OSD overlays ──────────────────────────────────────────────────────────────
layerrule = noanim,     ^(selection)$
layerrule = noanim,     ^(osd)$

# ── Hyprlock ──────────────────────────────────────────────────────────────────
layerrule = blur,       ^(hyprlock)$

