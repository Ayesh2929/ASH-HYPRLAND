# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Window Rules                                     ║
# ║  Comprehensive per-application window behavior, geometry, blur,             ║
# ║  opacity, tearing, workspace assignment and tag rules                       ║
