layerrule = ignorezero,             swaync-control-center
layerrule = ignorealpha 0.05,       swaync-control-center
layerrule = animation slide right,  swaync-control-center

# ── SwayNC — individual notification popups ───────────────────────────────────
layerrule = blur,                   swaync-notification-window
layerrule = xray 0,                 swaync-notification-window
layerrule = ignorezero,             swaync-notification-window
layerrule = ignorealpha 0.05,       swaync-notification-window
layerrule = animation slide right,  swaync-notification-window

# ── Dunst ─────────────────────────────────────────────────────────────────────
layerrule = blur,                   notifications
layerrule = xray 0,                 notifications
layerrule = ignorezero,             notifications
layerrule = animation slide right,  notifications

# ── Mako ──────────────────────────────────────────────────────────────────────
layerrule = blur,                   mako
layerrule = xray 0,                 mako
layerrule = ignorezero,             mako
layerrule = animation slide right,  mako

# ── fnott ─────────────────────────────────────────────────────────────────────
