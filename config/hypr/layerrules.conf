layerrule = xray 0,                 rofi
layerrule = ignorezero,             rofi
layerrule = ignorealpha 0.10,       rofi
layerrule = dimaround,              rofi
layerrule = animation popin 85%,    rofi

# ── Wofi ──────────────────────────────────────────────────────────────────────
layerrule = blur,                   wofi
layerrule = xray 0,                 wofi
layerrule = ignorezero,             wofi
layerrule = dimaround,              wofi
layerrule = animation popin 85%,    wofi

# ── walker ────────────────────────────────────────────────────────────────────
layerrule = blur,                   walker
layerrule = xray 0,                 walker
layerrule = ignorezero,             walker
layerrule = dimaround,              walker
layerrule = animation popin 90%,    walker

# ── fuzzel ────────────────────────────────────────────────────────────────────
layerrule = blur,                   fuzzel
layerrule = xray 0,                 fuzzel
layerrule = ignorezero,             fuzzel
layerrule = animation popin 85%,    fuzzel

# ── tofi ──────────────────────────────────────────────────────────────────────
layerrule = blur,                   tofi
layerrule = ignorezero,             tofi
layerrule = animation fade,         tofi

# ══════════════════════════════════════════════════════════════════════════════
# §05  POWER / SESSION MENUS
# ══════════════════════════════════════════════════════════════════════════════

