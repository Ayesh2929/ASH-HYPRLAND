# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Layer Rules Configuration                        ║
# ║                                                                              ║
# ║  Layer surfaces are compositor-level overlays rendered above/below windows  ║
# ║  Examples: bars, notifications, launchers, lock screens, OSD overlays       ║
# ║                                                                              ║
# ║  Format:  layerrule = RULE, NAMESPACE|REGEX                                 ║
# ║           layerrule = RULE, address:0xADDR                                  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  LAYER RULE FORMAT REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  ── Selectors ────────────────────────────────────────────────────────────────
#   NAMESPACE        — exact namespace string (e.g. waybar, rofi, swaync)
#   regex:PATTERN    — regex match against namespace
#   address:0xADDR   — exact surface address (from `hyprctl layers`)
#
#  ── Visual Rules ─────────────────────────────────────────────────────────────
#   blur             — enable gaussian blur behind layer
#   noblur           — disable blur
#   xray [0|1]       — 0=blur from wallpaper 1=blur from windows beneath
#   ignorealpha N    — ignore pixels below alpha N for blur (0.0-1.0)
#   ignorezero       — ignore fully transparent pixels (= ignorealpha 0)
#   opacity N        — set opacity (0.0-1.0)
#   dimaround        — dim windows below this layer
#
#  ── Behavior Rules ───────────────────────────────────────────────────────────
#   noanim           — disable animation for this layer
#   animation STYLE  — override animation style
#   order N          — z-order override (higher = on top)
#
#  ── Input Rules ──────────────────────────────────────────────────────────────
#   interactable 0   — make layer non-interactive (click-through)
#   keyboard_interactive N — 0=never 1=on_demand 2=exclusive
#
#  ── Animation STYLE values ───────────────────────────────────────────────────
#   fade             — fade in/out
#   slide            — slide from edge (default: bottom)
#   slide top        — slide from top
#   slide bottom     — slide from bottom
#   slide left       — slide from left
#   slide right      — slide from right
#   popin N%         — pop/scale from N% size
#
# ══════════════════════════════════════════════════════════════════════════════
# §02  STATUS BARS
# ══════════════════════════════════════════════════════════════════════════════

# ── Waybar ────────────────────────────────────────────────────────────────────
layerrule = blur,                   waybar
layerrule = xray 0,                 waybar
layerrule = ignorezero,             waybar
layerrule = ignorealpha 0.05,       waybar
layerrule = animation slide top,    waybar

# ── EWW bar ───────────────────────────────────────────────────────────────────
layerrule = blur,                   eww
layerrule = xray 0,                 eww
layerrule = ignorezero,             eww
layerrule = animation slide top,    eww

# ── AGS bar (Aylur's GTK Shell) ───────────────────────────────────────────────
layerrule = blur,                   ags
layerrule = xray 0,                 ags
layerrule = ignorezero,             ags
layerrule = ignorealpha 0.05,       ags
layerrule = animation fade,         ags

# ── Polybar ───────────────────────────────────────────────────────────────────
layerrule = blur,                   polybar
layerrule = ignorezero,             polybar
layerrule = animation slide top,    polybar

# ── Swaybar ───────────────────────────────────────────────────────────────────
layerrule = blur,                   swaybar
layerrule = ignorezero,             swaybar

# ══════════════════════════════════════════════════════════════════════════════
