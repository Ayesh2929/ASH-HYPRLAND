layerrule = xray 0,                 wlogout
layerrule = ignorealpha 0.05,       wlogout
layerrule = dimaround,              wlogout
layerrule = animation fade,         wlogout

# ── SDDM greeter (display manager surface) ───────────────────────────────────
layerrule = noanim,                 sddm-greeter

