layerrule = xray 0,                 osd
layerrule = ignorezero,             osd
layerrule = noanim,                 osd

# ── avizo (volume/brightness OSD) ────────────────────────────────────────────
layerrule = blur,                   avizo
layerrule = xray 0,                 avizo
layerrule = ignorezero,             avizo
layerrule = animation slide bottom, avizo

# ── swayosd ───────────────────────────────────────────────────────────────────
layerrule = blur,                   swayosd
layerrule = xray 0,                 swayosd
layerrule = ignorezero,             swayosd
layerrule = noanim,                 swayosd

# ── wob (Wayland overlay bar) ────────────────────────────────────────────────
layerrule = blur,                   wob
layerrule = ignorezero,             wob
layerrule = noanim,                 wob

# ── EWWOSD ────────────────────────────────────────────────────────────────────
layerrule = blur,                   ewwosd
layerrule = ignorezero,             ewwosd
layerrule = animation fade,         ewwosd

