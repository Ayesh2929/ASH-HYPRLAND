# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Environment Variables                            ║
# ║  Loaded first by hyprland.conf — establishes all runtime env vars           ║
# ║  Sources: Wayland, XDG, GPU, Toolkit, ASH, Language runtimes               ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  WAYLAND CORE
# ══════════════════════════════════════════════════════════════════════════════

# Force Wayland mode for all compatible toolkits
env = WAYLAND_DISPLAY,          wayland-1
env = XDG_SESSION_TYPE,         wayland
env = XDG_SESSION_DESKTOP,      Hyprland
env = XDG_CURRENT_DESKTOP,      Hyprland
env = DESKTOP_SESSION,          Hyprland
env = GDK_BACKEND,              wayland,x11,*        # GTK: Wayland first, X11 fallback
env = QT_QPA_PLATFORM,          wayland;xcb          # Qt: Wayland first, XCB fallback
env = SDL_VIDEODRIVER,          wayland,x11,offscreen # SDL: Wayland first
env = CLUTTER_BACKEND,          wayland
env = BEMENU_BACKEND,           wayland

# ══════════════════════════════════════════════════════════════════════════════
# §02  XDG BASE DIRECTORIES
# ══════════════════════════════════════════════════════════════════════════════

env = XDG_DATA_HOME,            $HOME/.local/share
env = XDG_CONFIG_HOME,          $HOME/.config
env = XDG_STATE_HOME,           $HOME/.local/state
env = XDG_CACHE_HOME,           $HOME/.cache
env = XDG_RUNTIME_DIR,          /run/user/1000

# XDG user dirs (populated by xdg-user-dirs-update)
env = XDG_DESKTOP_DIR,          $HOME/Desktop
env = XDG_DOWNLOAD_DIR,         $HOME/Downloads
env = XDG_DOCUMENTS_DIR,        $HOME/Documents
env = XDG_PICTURES_DIR,         $HOME/Pictures
env = XDG_VIDEOS_DIR,           $HOME/Videos
env = XDG_MUSIC_DIR,            $HOME/Music
env = XDG_TEMPLATES_DIR,        $HOME/Templates
env = XDG_PUBLICSHARE_DIR,      $HOME/Public

# ══════════════════════════════════════════════════════════════════════════════
# §03  QT TOOLKIT CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

env = QT_AUTO_SCREEN_SCALE_FACTOR, 1                 # HiDPI auto-scaling
env = QT_SCALE_FACTOR,             1                 # Global Qt scale factor
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1         # Remove Qt CSD on Wayland
env = QT_WAYLAND_RECONNECT,        1                 # Auto-reconnect on Wayland errors
env = QT_QPA_PLATFORMTHEME,        qt6ct             # Qt theme manager (qt6ct)
env = QT_STYLE_OVERRIDE,                             # unset — let qt6ct decide
env = QTWEBENGINE_CHROMIUM_FLAGS,  --enable-features=UseOzonePlatform --ozone-platform=wayland

# ══════════════════════════════════════════════════════════════════════════════
# §04  GTK TOOLKIT CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

env = GTK_THEME,                Adwaita-dark         # System GTK theme
env = GTK2_RC_FILES,            $HOME/.config/gtk-2.0/gtkrc
env = GDK_SCALE,                1                    # Integer HiDPI scale
env = GDK_DPI_SCALE,            1                    # Fractional DPI scale
env = GDK_DEBUG,                portals              # Use XDG portals for file dialogs

# ══════════════════════════════════════════════════════════════════════════════
# §05  GPU — AUTO-DETECTED SECTION
#      Uncomment the block matching your hardware.
#      The ASH doctor command (ash doctor fix) handles this automatically.
# ══════════════════════════════════════════════════════════════════════════════

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  AMD GPU (recommended — default for most setups)                        │
# └─────────────────────────────────────────────────────────────────────────┘
env = LIBVA_DRIVER_NAME,        radeonsi             # VA-API AMD driver
env = VDPAU_DRIVER,             radeonsi             # VDPAU AMD driver
env = AMD_VULKAN_ICD,           RADV                 # Use RADV Vulkan driver (Mesa)
# env = MESA_VK_DEVICE_SELECT,  prefer_discrete      # Multi-GPU: force discrete

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  NVIDIA GPU — uncomment if primary GPU is NVIDIA                        │
# │  Requires: nvidia-dkms nvidia-utils lib32-nvidia-utils                  │
# └─────────────────────────────────────────────────────────────────────────┘
# env = LIBVA_DRIVER_NAME,      nvidia               # VA-API Nvidia driver
# env = NVD_BACKEND,            direct               # Firefox/Chromium GPU decode
# env = GBM_BACKEND,            nvidia-drm           # Nvidia GBM backend
# env = __GLX_VENDOR_LIBRARY_NAME, nvidia            # Force GLX Nvidia
# env = __NV_PRIME_RENDER_OFFLOAD, 1                 # PRIME offload
# env = __VK_LAYER_NV_optimus,  NVIDIA_only          # Vulkan Optimus
# env = VK_ICD_FILENAMES,       /usr/share/vulkan/icd.d/nvidia_icd.json
# env = XWAYLAND_NO_GLAMOR,     1                    # Fix Xwayland on Nvidia

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  Intel GPU                                                              │
# └─────────────────────────────────────────────────────────────────────────┘
# env = LIBVA_DRIVER_NAME,      iHD                  # Intel Media Driver
# env = VDPAU_DRIVER,           va_gl                # VDPAU via VA-API bridge

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  PRIME / Hybrid graphics (e.g. Intel iGPU + AMD/NVIDIA dGPU)           │
# └─────────────────────────────────────────────────────────────────────────┘
# env = DRI_PRIME,              1                    # Force discrete GPU
# env = __VK_LAYER_NV_optimus,  NVIDIA_only
# env = __NV_PRIME_RENDER_OFFLOAD, 1
# env = __NV_PRIME_RENDER_OFFLOAD_PROVIDER, NVIDIA-G0
# env = __GLX_VENDOR_LIBRARY_NAME, nvidia

# ── Common GPU/rendering ───────────────────────────────────────────────────
env = WLR_NO_HARDWARE_CURSORS,  0                    # 1 = software cursors (Nvidia fix)
env = WLR_RENDERER_ALLOW_SOFTWARE, 0                 # Safety net
env = MESA_GL_VERSION_OVERRIDE, 4.6                  # Force Mesa GL version if needed
env = MESA_GLSL_VERSION_OVERRIDE, 460
env = PROTON_ENABLE_NGX_UPDATER, 0                   # Skip Nvidia NGX in Proton

# ══════════════════════════════════════════════════════════════════════════════
# §06  ELECTRON / CHROMIUM APPLICATIONS
# ══════════════════════════════════════════════════════════════════════════════

env = ELECTRON_OZONE_PLATFORM_HINT, auto             # Electron Wayland auto-detect
env = ELECTRON_ENABLE_LOGGING,  0
env = GOOGLE_API_KEY,           no
env = GOOGLE_DEFAULT_CLIENT_ID, no
env = GOOGLE_DEFAULT_CLIENT_SECRET, no

# ── Chromium flags (also see ~/.config/chromium-flags.conf) ──────────────────
# env = CHROMIUM_FLAGS,         --ozone-platform=wayland --enable-features=VaapiVideoDecodeLinuxGL

# ══════════════════════════════════════════════════════════════════════════════
# §07  MOZILLA FIREFOX
# ══════════════════════════════════════════════════════════════════════════════

env = MOZ_ENABLE_WAYLAND,       1                    # Enable Firefox Wayland
env = MOZ_DBUS_REMOTE,          1                    # DBus remote control
env = MOZ_USE_XINPUT2,          1                    # Better touchscreen/stylus
env = MOZ_WEBRENDER,            1                    # Force WebRender GPU compositor
env = MOZ_ACCELERATED,          1
env = MOZ_DISABLE_RDD_SANDBOX,  0                    # Keep sandbox enabled

# ══════════════════════════════════════════════════════════════════════════════
# §08  ACCESSIBILITY & INPUT METHOD
# ══════════════════════════════════════════════════════════════════════════════

env = XMODIFIERS,               @im=fcitx           # Input method framework
env = GTK_IM_MODULE,            fcitx               # GTK input method
env = QT_IM_MODULE,             fcitx               # Qt input method
env = INPUT_METHOD,             fcitx
env = IMSETTINGS_MODULE,        fcitx
env = SDL_IM_MODULE,            fcitx
env = GLFW_IM_MODULE,           ibus

# ── Accessibility ─────────────────────────────────────────────────────────────
env = NO_AT_BRIDGE,             0                    # Keep AT-SPI bridge enabled
env = ACCESSIBILITY_ENABLED,    1
env = GTK_A11Y,                 none                 # none | atspi | dconf

# ══════════════════════════════════════════════════════════════════════════════
# §09  AUDIO (PipeWire / PulseAudio)
# ══════════════════════════════════════════════════════════════════════════════

env = PIPEWIRE_LATENCY,         256/48000            # 256 frames @ 48kHz
env = PULSE_LATENCY_MSEC,       60
env = AE_SINK,                  PULSEAUDIO
env = SDL_AUDIODRIVER,          pipewire,pulse

# ══════════════════════════════════════════════════════════════════════════════
# §10  TERMINAL & SHELL DEFAULTS
# ══════════════════════════════════════════════════════════════════════════════

env = TERMINAL,                 kitty
env = TERM,                     kitty
env = TERM_PROGRAM,             kitty
env = SHELL,                    /usr/bin/fish
env = COLORTERM,                truecolor
env = FORCE_COLOR,              3
env = CLICOLOR,                 1
env = CLICOLOR_FORCE,           1
env = MANPAGER,                 nvim +Man!
env = MANWIDTH,                 120
env = PAGER,                    less
env = LESS,                     -RF --use-color
env = LESSOPEN,                 ||/usr/bin/lesspipe.sh %s

# ══════════════════════════════════════════════════════════════════════════════
# §11  EDITOR & DEVELOPMENT TOOLS
# ══════════════════════════════════════════════════════════════════════════════

env = EDITOR,                   nvim
env = VISUAL,                   nvim
env = SUDO_EDITOR,              nvim
env = GIT_EDITOR,               nvim
env = DIFFPROG,                 nvim -d
env = FCEDIT,                   nvim
env = KUBE_EDITOR,              nvim

# ── Development paths ─────────────────────────────────────────────────────────
env = GOPATH,                   $HOME/.local/share/go
env = GOBIN,                    $HOME/.local/share/go/bin
env = GOMODCACHE,               $HOME/.local/share/go/pkg/mod
env = GOPROXY,                  https://proxy.golang.org,direct
env = GOTELEMETRY,              off
env = CARGO_HOME,               $HOME/.local/share/cargo
env = RUSTUP_HOME,              $HOME/.local/share/rustup
env = RUSTFLAGS,                -C target-cpu=native
env = JAVA_HOME,                /usr/lib/jvm/default
env = GRADLE_USER_HOME,         $HOME/.local/share/gradle
env = MAVEN_HOME,               /usr/share/java/maven
env = NODE_PATH,                $HOME/.local/lib/node_modules
env = NPM_CONFIG_PREFIX,        $HOME/.local
env = PNPM_HOME,                $HOME/.local/share/pnpm
env = BUN_INSTALL,              $HOME/.local/share/bun
env = DENO_INSTALL,             $HOME/.local/share/deno
env = PYTHON_HISTORY,           $HOME/.local/state/python/history
env = PYTHONSTARTUP,            $HOME/.config/python/startup.py
env = PYTHONDONTWRITEBYTECODE,  1
env = VIRTUAL_ENV_DISABLE_PROMPT, 1
env = UV_CACHE_DIR,             $HOME/.cache/uv
env = CONDA_AUTO_ACTIVATE_BASE, false

# ── PATH additions (evaluated left-to-right, first match wins) ────────────────
env = PATH, $HOME/.local/bin:$HOME/.local/share/cargo/bin:$HOME/.local/share/go/bin:$HOME/.local/share/pnpm:$HOME/.local/share/bun/bin:$HOME/.local/share/deno/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:$PATH

# ══════════════════════════════════════════════════════════════════════════════
# §12  ASH DOTFILES RUNTIME VARIABLES
# ══════════════════════════════════════════════════════════════════════════════

# ── Core paths ────────────────────────────────────────────────────────────────
env = ASH_ROOT,                 $HOME/.config/ash-dotfiles
env = ASH_CONFIG,               $HOME/.config/ash-dotfiles/ash-cli/data/ash.conf
env = ASH_DATA,                 $HOME/.local/share/ash-dotfiles
env = ASH_CACHE,                $HOME/.cache/ash-dotfiles
env = ASH_STATE,                $HOME/.local/state/ash-dotfiles
env = ASH_LOG,                  $HOME/.local/state/ash-dotfiles/logs
env = ASH_PLUGINS,              $HOME/.local/share/ash-dotfiles/plugins
env = ASH_THEMES,               $HOME/.local/share/ash-dotfiles/themes
env = ASH_SNAPSHOTS,            $HOME/.local/share/ash-dotfiles/snapshots
env = ASH_WALLPAPERS,           $HOME/.local/share/ash-dotfiles/wallpapers
env = ASH_BACKUPS,              $HOME/.local/share/ash-dotfiles/backups
env = ASH_PROFILES,             $HOME/.local/share/ash-dotfiles/profiles

# ── Runtime state ─────────────────────────────────────────────────────────────
env = ASH_VERSION,              5.0.0
env = ASH_CURRENT_THEME,        catppuccin-mocha
env = ASH_CURRENT_MODE,         default
env = ASH_CURRENT_PROFILE,      default

# ── Feature flags ─────────────────────────────────────────────────────────────
env = ASH_HOT_RELOAD,           1                    # Enable live config reloading
env = ASH_ANIMATIONS,           1                    # Enable ASH animations
env = ASH_SOUNDS,               1                    # Enable UI sound feedback
env = ASH_TELEMETRY,            0                    # Disable analytics by default
env = ASH_AI,                   1                    # Enable AI features
env = ASH_API,                  1                    # Enable REST API server
env = ASH_PLUGINS_ENABLED,      1                    # Enable plugin system
env = ASH_AUTOBACKUP,           1                    # Enable auto-backups
env = ASH_CLOUD_SYNC,           0                    # Disable cloud sync by default
env = ASH_DEBUG,                0                    # Debug mode off in production
env = ASH_COLOR_SCHEME,         dark                 # dark | light | auto

# ── API server ────────────────────────────────────────────────────────────────
env = ASH_API_HOST,             127.0.0.1
env = ASH_API_PORT,             2580
env = ASH_API_TOKEN_FILE,       $HOME/.local/state/ash-dotfiles/api.token

# ── IPC socket ────────────────────────────────────────────────────────────────
env = ASH_IPC_SOCKET,           $XDG_RUNTIME_DIR/ash-ipc.sock

# ── Wallpaper engine ──────────────────────────────────────────────────────────
env = ASH_WALLPAPER_BACKEND,    swww                 # swww | hyprpaper | swaybg | feh
env = ASH_WALLPAPER_TRANSITION, fade                 # fade | wipe | grow | outer
env = ASH_WALLPAPER_DURATION,   300                  # seconds between slideshow changes

# ── Notification engine ───────────────────────────────────────────────────────
env = ASH_NOTIF_BACKEND,        swaync               # swaync | dunst | mako
env = ASH_NOTIF_SOUNDS,         1

# ── Screenshot engine ─────────────────────────────────────────────────────────
env = ASH_SCREENSHOT_DIR,       $HOME/Pictures/Screenshots
env = ASH_SCREENSHOT_BACKEND,   grimblast            # grimblast | grim | hyprshot

# ── Color extraction ──────────────────────────────────────────────────────────
env = ASH_COLOR_EXTRACTOR,      matugen              # matugen | pywal | colorthief
env = ASH_COLOR_SCHEME_MODE,    dark                 # dark | light | auto

# ══════════════════════════════════════════════════════════════════════════════
# §13  SECURITY & PRIVACY
# ══════════════════════════════════════════════════════════════════════════════

# ── Secrets / credential stores ───────────────────────────────────────────────
env = GNUPGHOME,                $HOME/.local/share/gnupg
env = PASSWORD_STORE_DIR,       $HOME/.local/share/pass
env = KEEPASSXC_DB_DIR,         $HOME/.local/share/keepassxc
env = SSH_AUTH_SOCK,            $XDG_RUNTIME_DIR/ssh-agent.socket

# ── Browser privacy ───────────────────────────────────────────────────────────
env = BROWSER,                  firefox
env = DEFAULT_BROWSER,          firefox

# ── Keyring ───────────────────────────────────────────────────────────────────
env = LIBSECRET_MOCK,           0

# ══════════════════════════════════════════════════════════════════════════════
# §14  LOCALE & INTERNATIONALIZATION
# ══════════════════════════════════════════════════════════════════════════════

env = LANG,                     en_US.UTF-8
env = LANGUAGE,                 en_US:en
env = LC_ALL,                   en_US.UTF-8
env = LC_COLLATE,               en_US.UTF-8
env = LC_CTYPE,                 en_US.UTF-8
env = LC_MESSAGES,              en_US.UTF-8
env = LC_MONETARY,              en_US.UTF-8
env = LC_NUMERIC,               en_US.UTF-8
env = LC_TIME,                  en_US.UTF-8

# ── Unicode / encoding ────────────────────────────────────────────────────────
env = PYTHONIOENCODING,         UTF-8
env = JAVA_TOOL_OPTIONS,        -Dfile.encoding=UTF-8

# ══════════════════════════════════════════════════════════════════════════════
# §15  PERFORMANCE & POWER
# ══════════════════════════════════════════════════════════════════════════════

# ── CPU governor hints ────────────────────────────────────────────────────────
env = RUST_MIN_STACK,           8388608              # 8MB Rust thread stack size
env = OMP_NUM_THREADS,          0                    # Auto-detect CPU threads

# ── Build optimization ────────────────────────────────────────────────────────
env = MAKEFLAGS,                -j$(nproc)
env = CMAKE_BUILD_PARALLEL_LEVEL, $(nproc)
env = CFLAGS,                   -O2 -march=native -pipe
env = CXXFLAGS,                 -O2 -march=native -pipe

# ── Java performance ──────────────────────────────────────────────────────────
env = _JAVA_AWT_WM_NONREPARENTING, 1                 # Fix Java GUI in tiling WMs
env = _JAVA_OPTIONS,            -Dawt.useSystemAAFontSettings=on -Dswing.aatext=true

# ── Power management ──────────────────────────────────────────────────────────
env = POWERSAVE_MODE,           0                    # 0=performance 1=balanced 2=save

# ══════════════════════════════════════════════════════════════════════════════
# §16  HARDWARE-SPECIFIC OVERRIDES
#      These are auto-populated by: ash doctor fix
#      or by sourcing per-device profiles:
#      source = ~/.config/hypr/per-device/laptop-thinkpad.conf
# ══════════════════════════════════════════════════════════════════════════════

# ── HiDPI / Fractional scaling ────────────────────────────────────────────────
# env = GDK_SCALE,              2
# env = GDK_DPI_SCALE,          0.5
# env = QT_SCALE_FACTOR,        2

# ── Touchpad force-libinput ───────────────────────────────────────────────────
# env = WLR_LIBINPUT_NO_DEVICES, 1

# ── SDDM / display manager passthrough ───────────────────────────────────────
# env = LIBSEAT_BACKEND,        logind

# ══════════════════════════════════════════════════════════════════════════════
# §17  MISC APPLICATION OVERRIDES
# ══════════════════════════════════════════════════════════════════════════════

# ── Gaming ────────────────────────────────────────────────────────────────────
env = DXVK_STATE_CACHE_PATH,    $HOME/.cache/dxvk
env = DXVK_LOG_LEVEL,           none
env = VKD3D_CONFIG,             dxr,dxr11
env = WINE_FULLSCREEN_INTEGER_SCALING, 1
env = PROTON_HIDE_NVIDIA_GPU,   0
env = PROTON_USE_WINED3D,       0
env = PROTON_NO_ESYNC,          0
env = PROTON_NO_FSYNC,          0
env = STEAM_COMPAT_MOUNTS,      /run/media

# ── MPV video ─────────────────────────────────────────────────────────────────
env = MPV_HOME,                 $HOME/.config/mpv

# ── Neovim ────────────────────────────────────────────────────────────────────
env = NVIM_LOG_FILE,            $HOME/.local/state/nvim/log
env = NVIM_APPNAME,             nvim

# ── Docker / container tools ──────────────────────────────────────────────────
env = DOCKER_CONFIG,            $HOME/.config/docker
env = DOCKER_BUILDKIT,          1
env = COMPOSE_DOCKER_CLI_BUILD, 1
env = PODMAN_USERNS,            auto

# ── Kubernetes ────────────────────────────────────────────────────────────────
env = KUBECONFIG,               $HOME/.config/kubernetes/config
env = KUBECTL_EXTERNAL_DIFF,    diff -u

# ── AWS / Cloud CLIs ──────────────────────────────────────────────────────────
env = AWS_DEFAULT_OUTPUT,       json
env = AWS_PAGER,                less
env = GCLOUD_HOME,              $HOME/.local/share/google-cloud-sdk

# ── Terraform ─────────────────────────────────────────────────────────────────
env = TF_CLI_ARGS,              -no-color
env = TF_PLUGIN_CACHE_DIR,      $HOME/.cache/terraform/plugins

# ── FZF default options ───────────────────────────────────────────────────────
env = FZF_DEFAULT_COMMAND,      fd --type f --hidden --follow --exclude .git
env = FZF_DEFAULT_OPTS,         --height 60% --layout=reverse --border --info=inline --color=bg+:#313244,bg:#1e1e2e,spinner:#f5e0dc,hl:#f38ba8 --color=fg:#cdd6f4,header:#f38ba8,info:#cba4f7,pointer:#f5e0dc --color=marker:#f5e0dc,fg+:#cdd6f4,prompt:#cba4f7,hl+:#f38ba8

# ── Bat (better cat) ──────────────────────────────────────────────────────────
env = BAT_THEME,                Catppuccin-mocha
env = BAT_PAGER,                less -RF

# ── Ripgrep ───────────────────────────────────────────────────────────────────
env = RIPGREP_CONFIG_PATH,      $HOME/.config/ripgrep/config

# ── Zoxide ────────────────────────────────────────────────────────────────────
env = _ZO_DATA_DIR,             $HOME/.local/share/zoxide
env = _ZO_ECHO,                 1
env = _ZO_EXCLUDE_DIRS,         $HOME

# ── Starship ──────────────────────────────────────────────────────────────────
env = STARSHIP_CONFIG,          $HOME/.config/starship/starship.toml
env = STARSHIP_CACHE,           $HOME/.cache/starship

# ── Atuin shell history ───────────────────────────────────────────────────────
env = ATUIN_CONFIG_DIR,         $HOME/.config/atuin
env = ATUIN_DATA_DIR,           $HOME/.local/share/atuin

# ── Less pager colors ─────────────────────────────────────────────────────────
env = LESS_TERMCAP_mb,          $'\e[1;31m'
env = LESS_TERMCAP_md,          $'\e[1;36m'
env = LESS_TERMCAP_me,          $'\e[0m'
env = LESS_TERMCAP_se,          $'\e[0m'
env = LESS_TERMCAP_so,          $'\e[01;33m'
env = LESS_TERMCAP_ue,          $'\e[0m'
env = LESS_TERMCAP_us,          $'\e[1;32m'

# ══════════════════════════════════════════════════════════════════════════════
# §18  HYPRLAND-SPECIFIC VARS (used inside hyprland.conf blocks)
# ══════════════════════════════════════════════════════════════════════════════

# ── Super / Mod key ───────────────────────────────────────────────────────────
$mainMod          = SUPER
$altMod           = ALT
$shiftMod         = SHIFT
$ctrlMod          = CTRL
$hyperMod         = SUPER SHIFT CTRL ALT

# ── Application launchers ─────────────────────────────────────────────────────
$terminal         = kitty
$fileManager      = yazi
$fileManagerGUI   = thunar
$browser          = firefox
$editor           = kitty --class editor -e nvim
$launcher         = rofi -show drun -config ~/.config/rofi/config.rasi
$runner           = rofi -show run  -config ~/.config/rofi/config.rasi
$powermenu        = ~/.config/rofi/menus/powermenu/powermenu.sh
$screenshotter    = ~/.config/hypr/scripts/screenshot.sh
$colorpicker      = hyprpicker -a
$clipboardManager = cliphist list | rofi -dmenu | cliphist decode | wl-copy
$notifCenter      = swaync-client -t

# ── ASH CLI shortcuts ─────────────────────────────────────────────────────────
$ashTheme         = ash theme pick
$ashSnapshot      = ash snapshot create
$ashMode          = ash mode
$ashReload        = ash reload
$ashDoctor        = kitty --class floating -e ash doctor

# ── Wallpaper ─────────────────────────────────────────────────────────────────
$wallpaperRandom  = ash wallpaper random
$wallpaperPicker  = ash wallpaper pick

# ══════════════════════════════════════════════════════════════════════════════
# §19  THEME ENGINE VARIABLES
#      These are overwritten at runtime by the ASH theme engine.
#      Default values reflect catppuccin-mocha.
# ══════════════════════════════════════════════════════════════════════════════

# ── Background / Surface ──────────────────────────────────────────────────────
$colorBase        = rgb(1e1e2e)
$colorMantle      = rgb(181825)
$colorCrust       = rgb(11111b)
$colorSurface0    = rgb(313244)
$colorSurface1    = rgb(45475a)
$colorSurface2    = rgb(585b70)

# ── Overlays ──────────────────────────────────────────────────────────────────
$colorOverlay0    = rgb(6c7086)
$colorOverlay1    = rgb(7f849c)
$colorOverlay2    = rgb(9399b2)

# ── Text ──────────────────────────────────────────────────────────────────────
$colorText        = rgb(cdd6f4)
