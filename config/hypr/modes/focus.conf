# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Focus Mode Configuration                         ║
# ║                                                                              ║
# ║  Deep work / flow state mode. Maximum visual clarity on active window,     ║
# ║  aggressive inactive dimming, all notifications silenced, minimal           ║
# ║  peripheral distraction. Your eyes go exactly where they should.            ║
# ║                                                                              ║
# ║  Activate:   ash mode focus                                                 ║
# ║  Deactivate: ash mode default                                               ║
# ║  Hotkey:     $hyperMod + F                                                  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

decoration {
    rounding                 = 8
    rounding_power           = 2.0
    active_opacity           = 1.0
    inactive_opacity         = 0.72     # Very dark inactive — forces tunnel vision
    fullscreen_opacity       = 1.0

    # ── Strong inactive dim — everything except focus recedes ─────────────────
    dim_inactive             = true
    dim_strength             = 0.28     # Aggressive dim
    dim_special              = 0.55
    dim_around               = 0.65     # Modal windows heavily dim background

    shadow {
        enabled              = true
        range                = 25
        render_power         = 4        # Sharp shadow on focused = clear depth
        color                = rgba(0,0,0,0.65)
        color_inactive       = rgba(0,0,0,0.15)
        offset               = 0 6
    }

    blur {
        enabled              = true
        size                 = 5
        passes               = 2
        brightness           = 0.78    # Slightly darken blurred background
        contrast             = 0.92
        noise                = 0.006
    }
}

animations {
    enabled                  = true
    first_launch_animation   = false

    bezier = focusCore,      0.160, 1.000, 0.300, 1.000
    bezier = focusFade,      0.350, 0.000, 0.550, 1.000
    bezier = focusSnap,      0.050, 0.900, 0.100, 1.000

    # ── Slightly slower fade transitions make focus feel calmer ───────────────
    animation = windowsIn,      1, 5, focusCore,  popin 78%
    animation = windowsOut,     1, 4, focusSnap,  popin 85%
    animation = windowsMove,    1, 4, focusCore
    animation = fadeIn,         1, 6, focusFade   # Slower fade-in = calmer
    animation = fadeOut,        1, 4, focusSnap
    animation = fadeSwitch,     1, 5, focusFade
    animation = fadeDim,        1, 7, focusFade   # Very slow dim = smooth attention shift
    animation = fadeLayers,     1, 3, focusFade
    animation = border,         1, 9, focusCore
    animation = borderangle,    1, 70, linear, loop
    animation = workspaces,     1, 5, focusCore,  slidefade 15%
    animation = workspacesIn,   1, 5, focusCore,  slidefade 15%
    animation = workspacesOut,  1, 4, focusSnap,  slidefade 15%
    animation = specialWorkspace,    1, 5, focusCore, slidefadevert -25%
    animation = specialWorkspaceIn,  1, 5, focusCore, slidefadevert -25%
    animation = specialWorkspaceOut, 1, 4, focusSnap, slidefadevert -25%
    animation = layers,     1, 2, focusSnap, fade
    animation = layersIn,   1, 3, focusCore, fade
    animation = layersOut,  1, 2, focusSnap, fade
}

general {
    gaps_in                  = 6
    gaps_out                 = 16       # Larger gaps = focus frame effect
    border_size              = 2

    # ── Accent border on active = clear focal point indicator ─────────────────
    col.active_border        = rgba(cba4f7ff) rgba(89b4faff) 45deg
    col.inactive_border      = rgba(31324444) # Nearly invisible inactive border

    allow_tearing            = false
    resize_on_border         = false    # Prevent accidental resize in deep work
}

misc {
    vfr                      = true
    vrr                      = 0
    render_unfocused_fps     = 8
    focus_on_activate        = false    # NOTHING steals focus
    animate_manual_resizes   = true
}

cursor {
    inactive_timeout         = 4        # Hide cursor quickly — remove visual noise
    hide_on_key_press        = true     # Cursor disappears while typing
}

# ── Notification silence ──────────────────────────────────────────────────────
exec = swaync-client --dnd-on 2>/dev/null || true
exec = hyprctl keyword misc:layers_hog_keyboard_focus false

exec = powerprofilesctl set balanced 2>/dev/null || true
exec = hyprsunset -t 5000 2>/dev/null || true   # Warm temp for eye comfort

exec = notify-send \
    "🎯 Focus Mode ACTIVE" \
    "DND ON • Cursor: auto-hide • Inactive: dimmed\nAll distractions suppressed\nEsc: ash mode default" \
    --app-name=ASH-Mode \
    --icon=~/.config/ash-dotfiles/assets/icons/ash-system/focus-mode.svg \
    --urgency=low \
    --expire-time=3000 \
    --hint=string:x-dunst-stack-tag:ash-mode

exec = echo "focus" > ~/.local/state/ash-dotfiles/current-mode

# ══════════════════════════════════════════════════════════════════════════════
# EOF — focus.conf | ash mode focus | Restore: ash mode default
# ══════════════════════════════════════════════════════════════════════════════