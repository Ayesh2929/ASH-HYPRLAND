# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Work Mode Configuration                          ║
# ║                                                                              ║
# ║  Optimized for deep professional work. Clean layout, reduced visual        ║
# ║  noise, comfortable opacity, smooth animations preserved for UX clarity,   ║
# ║  notification management and ergonomic focus aids.                          ║
# ║                                                                              ║
# ║  Activate:   ash mode work                                                  ║
# ║  Deactivate: ash mode default                                               ║
# ║  Hotkey:     $hyperMod + W                                                  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  DECORATION — WORK OPTIMIZED
# ══════════════════════════════════════════════════════════════════════════════

decoration {
    # ── Rounding: comfortable for long sessions ────────────────────────────────
    rounding                 = 10
    rounding_power           = 2.0

    # ── Opacity: full active, noticeable dim inactive ─────────────────────────
    active_opacity           = 1.0
    inactive_opacity         = 0.88      # Strong inactive dim reduces distraction
    fullscreen_opacity       = 1.0

    # ── Dimming: enabled — inactive windows visually recede ───────────────────
    dim_inactive             = true
    dim_strength             = 0.14      # Stronger than default for focus
    dim_special              = 0.40
    dim_around               = 0.55

    # ── Shadow: subtle — depth without distraction ────────────────────────────
    shadow {
        enabled              = true
        range                = 20
        render_power         = 3
        color                = rgba(0,0,0,0.45)
        color_inactive       = rgba(0,0,0,0.25)
        offset               = 0 4
        scale                = 1.01
    }

    # ── Blur: enabled — subtle glassmorphism ───────────────────────────────────
    blur {
        enabled              = true
        size                 = 6
        passes               = 2
        noise                = 0.008
        contrast             = 0.90
        brightness           = 0.85
        vibrancy             = 0.10
        special              = true
        popups               = true
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# §02  ANIMATIONS — WORK SMOOTH PROFILE
# ══════════════════════════════════════════════════════════════════════════════

animations {
    enabled                  = true
    first_launch_animation   = false

    bezier = workCore,       0.160, 1.000, 0.300, 1.000
    bezier = workSlide,      0.260, 1.000, 0.200, 1.000
    bezier = workFade,       0.350, 0.000, 0.550, 1.000
    bezier = workSnap,       0.080, 0.820, 0.170, 1.000

    animation = windowsIn,   1, 5, workCore,  popin 75%
    animation = windowsOut,  1, 4, workSnap,  popin 82%
    animation = windowsMove, 1, 4, workCore
    animation = fadeIn,      1, 5, workFade
    animation = fadeOut,     1, 4, workSnap
    animation = fadeSwitch,  1, 4, workFade
    animation = fadeDim,     1, 6, workFade
    animation = fadeLayers,  1, 3, workFade
    animation = border,      1, 8, workCore
    animation = borderangle, 1, 90, linear, loop
    animation = workspaces,  1, 5, workSlide, slidefade 18%
    animation = workspacesIn,  1, 5, workSlide, slidefade 18%
    animation = workspacesOut, 1, 4, workSnap,  slidefade 18%
    animation = specialWorkspace,    1, 5, workCore, slidefadevert -28%
    animation = specialWorkspaceIn,  1, 5, workCore, slidefadevert -28%
    animation = specialWorkspaceOut, 1, 4, workSnap, slidefadevert -28%
    animation = layers,      1, 3, workSnap, fade
    animation = layersIn,    1, 3, workCore, fade
    animation = layersOut,   1, 2, workSnap, fade
}

# ══════════════════════════════════════════════════════════════════════════════
# §03  GENERAL — WORK LAYOUT
# ══════════════════════════════════════════════════════════════════════════════

general {
    gaps_in                  = 5
    gaps_out                 = 14
    border_size              = 2

    col.active_border        = rgba(cba4f7ff) rgba(89b4faff) 45deg
    col.inactive_border      = rgba(31324488)

    allow_tearing            = false
    resize_on_border         = true
}

misc {
    vfr                      = true
    vrr                      = 0
    render_unfocused_fps     = 12
    focus_on_activate        = false
    animate_manual_resizes   = true
    animate_mouse_windowdragging = true
}

# ══════════════════════════════════════════════════════════════════════════════
# §04  WINDOW RULES — WORK MODE
# ══════════════════════════════════════════════════════════════════════════════

# ── Focus aids: communication apps subtle opacity ─────────────────────────────
windowrulev2 = opacity 0.95 0.85, class:^(discord|Discord|vesktop|Slack)$
windowrulev2 = opacity 0.95 0.85, class:^(thunderbird)$

# ── Prevent notifications from stealing focus ─────────────────────────────────
windowrulev2 = noinitialfocus, class:^(swaync|dunst|mako)$

# ── Productivity apps: full opacity, priority ─────────────────────────────────
windowrulev2 = opacity 1.0 0.95, class:^(code-oss|Code|nvim|kitty)$

# ══════════════════════════════════════════════════════════════════════════════
# §05  WORKSPACE RULES — WORK OPTIMIZED
# ══════════════════════════════════════════════════════════════════════════════

workspace = 1, gapsin:5, gapsout:14, layoutopt:layout:dwindle
workspace = 2, gapsin:5, gapsout:14, layoutopt:layout:master
workspace = 3, gapsin:5, gapsout:14, layoutopt:layout:dwindle

# ══════════════════════════════════════════════════════════════════════════════
# §06  EXEC — WORK MODE ENTRY
# ══════════════════════════════════════════════════════════════════════════════

exec = powerprofilesctl set balanced 2>/dev/null || true
exec = swaync-client --toggle-dnd 2>/dev/null || true    # Enable DND in work mode
exec = hyprsunset -t 5500 2>/dev/null || true            # Slightly warm color temp

exec = notify-send \
    "💼 Work Mode ACTIVE" \
    "DND ON • Smooth animations • Focus layout\nColor temp: 5500K warm\nDistractions minimized" \
    --app-name=ASH-Mode \
    --icon=~/.config/ash-dotfiles/assets/icons/ash-system/work-mode.svg \
    --urgency=low \
    --expire-time=3000 \
    --hint=string:x-dunst-stack-tag:ash-mode

exec = echo "work" > ~/.local/state/ash-dotfiles/current-mode

# ══════════════════════════════════════════════════════════════════════════════
# EOF — work.conf | ash mode work | Restore: ash mode default
# ══════════════════════════════════════════════════════════════════════════════