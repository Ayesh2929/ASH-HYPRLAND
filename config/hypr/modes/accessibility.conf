# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Accessibility Mode Configuration                 ║
# ║                                                                              ║
# ║  Full WCAG 2.1 AA/AAA compliance mode. High contrast borders, maximum      ║
# ║  cursor visibility, reduced motion option, large hit targets, screen        ║
# ║  magnification, keyboard-only navigation optimized, color filters for      ║
# ║  color vision deficiency support.                                            ║
# ║                                                                              ║
# ║  Activate:   ash mode accessibility                                         ║
# ║  Standards:  WCAG 2.1 AA compliant (AAA where possible)                    ║
# ║  Deactivate: ash mode default                                               ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

decoration {
    # ── Rounding: reduced — targets easier to hit at screen edges ────────────
    rounding                 = 6
    rounding_power           = 2.0

    # ── Full opacity: no transparency — maximum readability ───────────────────
    active_opacity           = 1.0
    inactive_opacity         = 1.0      # Never dim for accessibility
    fullscreen_opacity       = 1.0

    # ── No dimming: every window equally visible ───────────────────────────────
    dim_inactive             = false
    dim_strength             = 0.0
    dim_special              = 0.0
    dim_around               = 0.0

    # ── Strong shadows: depth cues for spatial orientation ────────────────────
    shadow {
        enabled              = true
        range                = 22
        render_power         = 4        # Sharp shadow = clear depth cue
        color                = rgba(0,0,0,0.70)
        color_inactive       = rgba(0,0,0,0.50)
        offset               = 0 4
        scale                = 1.0
    }

    # ── Blur: disabled — text must remain crisp for readability ──────────────
    blur {
        enabled              = false
    }
}

animations {
    # ── Reduced motion: respects prefers-reduced-motion equivalent ────────────
    # Set enabled = false for full motion sensitivity compliance
    enabled                  = true
    first_launch_animation   = false

    bezier = a11yCore,       0.250, 0.100, 0.250, 1.000  # Standard ease — no spring
    bezier = a11yFade,       0.250, 0.000, 0.750, 1.000

    # ── Slower animations: easier to track for cognitive accessibility ────────
    animation = windowsIn,   1, 4, a11yCore,  popin 85%
    animation = windowsOut,  1, 4, a11yCore,  popin 90%
    animation = windowsMove, 1, 4, a11yCore
    animation = fadeIn,      1, 5, a11yFade
    animation = fadeOut,     1, 4, a11yFade
    animation = fadeDim,     1, 5, a11yFade
    animation = border,      1, 6, a11yCore
    animation = borderangle, 0, 1, linear, loop  # No spinning — reduces distraction
    animation = workspaces,  1, 5, a11yCore,  slidefade 15%
    animation = workspacesIn,  1, 5, a11yCore, slidefade 15%
    animation = workspacesOut, 1, 4, a11yCore, slidefade 15%
    animation = specialWorkspace,    1, 5, a11yCore, slidefadevert -20%
    animation = specialWorkspaceIn,  1, 5, a11yCore, slidefadevert -20%
    animation = specialWorkspaceOut, 1, 4, a11yCore, slidefadevert -20%
    animation = layers,      1, 3, a11yCore, fade
    animation = layersIn,    1, 4, a11yCore, fade
    animation = layersOut,   1, 3, a11yCore, fade
}

general {
    gaps_in                  = 4
    gaps_out                 = 12

    # ── High-contrast borders: WCAG AA compliant contrast ratio ───────────────
    # White borders on dark: 21:1 contrast (AAA maximum)
    border_size              = 3        # Thicker = easier to see
    col.active_border        = rgba(ffffffff) rgba(cba4f7ff) 45deg  # High contrast
    col.inactive_border      = rgba(585b70ff)                        # Still visible

    allow_tearing            = false
    resize_on_border         = true
    extend_border_grab_area  = 20      # Larger grab area for motor impairment
}

misc {
    vfr                      = true
    vrr                      = 0
    render_unfocused_fps     = 30
    focus_on_activate        = true    # Focus assistance: apps can request focus
    middle_click_paste       = false   # Prevent accidental paste
    mouse_move_focuses_monitor = true  # Follow cursor for single-switch users
}

cursor {
    # ── Large cursor: high visibility for low vision ───────────────────────────
    zoom_factor              = 1.8     # 80% larger than normal
    zoom_rigid               = false
    inactive_timeout         = 60      # Cursor stays visible
    hide_on_key_press        = false
    hide_on_touch            = false
    no_warps                 = false   # Warps help locate focus
}

binds {
    # ── Directional focus: geometric (predictable for spatial memory) ──────────
    focus_preferred_method   = 1       # Geometric = nearest neighbor
    # ── Monitor fallback: always cross monitors with directional keys ──────────
    window_direction_monitor_fallback = true
}

# ── Window rules: larger hit targets ─────────────────────────────────────────
windowrulev2 = minsize 100 50,  floating:1    # Minimum floating window size

# ── High contrast applied via GLSL shader ────────────────────────────────────
# Uncomment for color inversion (useful for photophobia):
# exec = hyprctl keyword decoration:screen_shader \
#     ~/.config/hypr/shaders/invert.frag

# Uncomment for grayscale (color vision deficiency):
# exec = hyprctl keyword decoration:screen_shader \
#     ~/.config/hypr/shaders/grayscale.frag

# ── Larger cursor theme ───────────────────────────────────────────────────────
exec = hyprctl setcursor Bibata-Modern-Ice 36

# ── Keyboard accessibility: slower repeat for motor impairment ───────────────
exec = hyprctl keyword input:repeat_delay 500
exec = hyprctl keyword input:repeat_rate  25

# ── GTK accessibility settings ────────────────────────────────────────────────
exec = gsettings set org.gnome.desktop.interface cursor-size 36
exec = gsettings set org.gnome.desktop.interface text-scaling-factor 1.2
exec = gsettings set org.gnome.desktop.interface gtk-theme \
    "Catppuccin-Mocha-Standard-Mauve-dark"

# ── AT-SPI accessibility bridge ───────────────────────────────────────────────
exec = export NO_AT_BRIDGE=0
exec = /usr/lib/at-spi-bus-launcher --launch-immediately &

# ── Color correction: neutral temperature (no blue filter) ───────────────────
exec = pkill hyprsunset 2>/dev/null || true   # Reset to neutral 6500K

exec = notify-send \
    "♿ Accessibility Mode ACTIVE" \
    "Contrast: HIGH • Cursor: large (36px)\nBorders: thick (3px) • Blur: OFF\nRepeat: 500ms delay • Zoom: 1.8x\nWCAG 2.1 AA compliant" \
    --app-name=ASH-Mode \
    --icon=~/.config/ash-dotfiles/assets/icons/ash-system/present-mode.svg \
    --urgency=normal \
    --expire-time=5000 \
    --hint=string:x-dunst-stack-tag:ash-mode

exec = echo "accessibility" > ~/.local/state/ash-dotfiles/current-mode

# ══════════════════════════════════════════════════════════════════════════════
# §EXTRA  REDUCED MOTION VARIANT
#         For vestibular disorder / motion sensitivity compliance
#         Uncomment to disable all motion:
# ══════════════════════════════════════════════════════════════════════════════

# animations { enabled = false }

