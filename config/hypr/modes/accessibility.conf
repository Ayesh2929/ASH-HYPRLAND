# §EXTRA  COLOR VISION DEFICIENCY VARIANTS
#         Uncomment the appropriate shader for CVD support:
# ══════════════════════════════════════════════════════════════════════════════

# ── Deuteranopia (red-green, green-weak) ──────────────────────────────────────
# exec = hyprctl keyword decoration:screen_shader \
#     ~/.config/hypr/shaders/grayscale.frag

# ── Protanopia (red-green, red-weak) ──────────────────────────────────────────
# exec = hyprctl keyword decoration:screen_shader \
#     ~/.config/hypr/shaders/grayscale.frag

# ── Achromatopsia (total color blindness) ────────────────────────────────────
# exec = hyprctl keyword decoration:screen_shader \
#     ~/.config/hypr/shaders/grayscale.frag

