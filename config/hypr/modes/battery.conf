# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Battery Save Mode Configuration                  ║
# ║                                                                              ║
# ║  Aggressive power conservation. Strips GPU-intensive visual effects,       ║
# ║  caps render rates, enables power governor, dims display, reduces           ║
# ║  compositor tick rate. Extends battery by 30-60% in typical use.           ║
# ║                                                                              ║
# ║  Activate:   ash mode battery                                               ║
# ║  Auto:       ash plugin enable battery-alerts (auto at 20%)                ║
# ║  Deactivate: ash mode default                                               ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

decoration {
    rounding                 = 8
    rounding_power           = 2.0
    active_opacity           = 1.0
    inactive_opacity         = 1.0      # No opacity rendering cost
    fullscreen_opacity       = 1.0

    dim_inactive             = false    # Skip dim compositor pass
    dim_strength             = 0.0

    shadow {
        enabled              = false    # Save shadow render pass
    }

    blur {
        enabled              = false    # Biggest single GPU saver
    }
}

animations {
    enabled                  = true     # Keep minimal for UX
    first_launch_animation   = false

    bezier = batCore,        0.020, 0.980, 0.050, 1.000
    bezier = batFade,        0.100, 0.000, 0.900, 1.000

    animation = windowsIn,   1, 2, batCore,  popin 90%   # Ultra fast
    animation = windowsOut,  1, 1, batCore,  popin 95%
    animation = windowsMove, 1, 2, batCore
    animation = fadeIn,      1, 2, batFade
    animation = fadeOut,     1, 1, batFade
    animation = fadeDim,     1, 2, batFade
    animation = border,      1, 2, batCore
    animation = borderangle, 0, 1, linear, loop    # Disable gradient spin
    animation = workspaces,  1, 2, batCore,  slidefade 8%
    animation = workspacesIn,  1, 2, batCore, slidefade 8%
    animation = workspacesOut, 1, 1, batCore, slidefade 8%
    animation = specialWorkspace,    1, 2, batCore, slidefadevert -15%
    animation = specialWorkspaceIn,  1, 2, batCore, slidefadevert -15%
    animation = specialWorkspaceOut, 1, 1, batCore, slidefadevert -15%
    animation = layers,      1, 1, batCore, fade
    animation = layersIn,    1, 1, batCore, fade
    animation = layersOut,   1, 1, batCore, fade
}

general {
    gaps_in                  = 3
    gaps_out                 = 8
    border_size              = 1        # Thinner border = smaller render
    col.active_border        = rgba(cba4f7cc)
    col.inactive_border      = rgba(31324466)
    allow_tearing            = false
}

misc {
    vfr                      = true
    vrr                      = 0        # Disable VRR overhead
    render_unfocused_fps     = 5        # Very aggressive background throttle
    no_direct_scanout        = true     # Skip scanout optimize (power variance)
    animate_manual_resizes   = false
    animate_mouse_windowdragging = false
}

render {
    unload_heavy_shaders     = true     # Free VRAM shader cache
    direct_scanout           = false
}

cursor {
    inactive_timeout         = 5        # Fast cursor hide
    min_refresh_rate         = 24       # Low floor for VFR
}

# ── Power governor: power-saver ───────────────────────────────────────────────
exec = powerprofilesctl set power-saver 2>/dev/null || true

exec = echo powersave | \
    sudo tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor \
    > /dev/null 2>/dev/null || true

# ── Display brightness reduction ─────────────────────────────────────────────
exec = brightnessctl set 60% 2>/dev/null || true

# ── Hyprsunset: warm (reduces display power on OLEDs) ────────────────────────
exec = hyprsunset -t 4000 2>/dev/null || true

# ── Disable heavy compositor layers ──────────────────────────────────────────
exec = hyprctl keyword decoration:blur:enabled false
exec = hyprctl keyword decoration:shadow:enabled false

exec = notify-send \
    "🔋 Battery Save Mode ACTIVE" \
    "Blur OFF • Shadow OFF • Anim: minimal\nGPU throttled • CPU: power-saver\nDisplay: 60% • Est. +45min battery" \
    --app-name=ASH-Mode \
    --icon=~/.config/ash-dotfiles/assets/icons/ash-system/battery-mode.svg \
    --urgency=normal \
    --expire-time=4000 \
    --hint=string:x-dunst-stack-tag:ash-mode

exec = echo "battery" > ~/.local/state/ash-dotfiles/current-mode

# ══════════════════════════════════════════════════════════════════════════════
# EOF — battery.conf | ash mode battery | Restore: ash mode default
# ══════════════════════════════════════════════════════════════════════════════