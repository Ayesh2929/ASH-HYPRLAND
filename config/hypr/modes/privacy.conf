# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Privacy Mode Configuration                       ║
# ║                                                                              ║
# ║  Operational security profile for sensitive work. Disables screen         ║
# ║  sharing indicators, blurs all inactive windows for shoulder surfing       ║
# ║  protection, disables clipboard persistence, VPN enforcement,              ║
# ║  window title sanitization and aggressive idle lock.                        ║
# ║                                                                              ║
# ║  Activate:   ash mode privacy                                               ║
# ║  Deactivate: ash mode default                                               ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

decoration {
    rounding                 = 10
    rounding_power           = 2.0
    active_opacity           = 1.0
    inactive_opacity         = 0.30     # Extreme blur on inactive for shoulder privacy
    fullscreen_opacity       = 1.0

    dim_inactive             = true
    dim_strength             = 0.35     # Strong dim makes inactive unreadable
    dim_special              = 0.60
    dim_around               = 0.70

    shadow {
        enabled              = false    # No shadow — reduces information leakage
    }

    # ── Aggressive blur on all inactive content ───────────────────────────────
    blur {
        enabled              = true
        size                 = 16       # Heavy blur for shoulder-surf protection
        passes               = 5
        ignore_opacity       = true     # Blur even fully opaque inactive windows
        xray                 = false
        noise                = 0.0
        brightness           = 0.75
        contrast             = 0.80
    }
}

animations {
    enabled                  = true
    first_launch_animation   = false

    bezier = privCore,       0.160, 1.000, 0.300, 1.000
    bezier = privSnap,       0.080, 0.820, 0.170, 1.000
    bezier = privFade,       0.350, 0.000, 0.550, 1.000

    animation = windowsIn,   1, 4, privCore,  popin 80%
    animation = windowsOut,  1, 3, privSnap,  popin 86%
    animation = windowsMove, 1, 4, privCore
    animation = fadeIn,      1, 5, privFade
    animation = fadeOut,     1, 4, privSnap
    animation = fadeDim,     1, 5, privFade
    animation = border,      1, 6, privCore
    animation = borderangle, 1, 80, linear, loop
    animation = workspaces,  1, 4, privCore,  slidefade 15%
    animation = workspacesIn,  1, 4, privCore, slidefade 15%
    animation = workspacesOut, 1, 3, privSnap, slidefade 15%
    animation = specialWorkspace,    1, 4, privCore, slidefadevert -25%
    animation = specialWorkspaceIn,  1, 4, privCore, slidefadevert -25%
    animation = specialWorkspaceOut, 1, 3, privSnap, slidefadevert -25%
    animation = layers,      1, 2, privSnap, fade
    animation = layersIn,    1, 3, privCore, fade
    animation = layersOut,   1, 2, privSnap, fade
}

general {
    gaps_in                  = 5
    gaps_out                 = 14
    border_size              = 2

    # ── Muted border color — avoid drawing attention ───────────────────────────
    col.active_border        = rgba(585b70ff)
    col.inactive_border      = rgba(31324466)

    allow_tearing            = false
}

misc {
    vfr                      = true
    focus_on_activate        = false
    # ── Middle click paste: OFF — prevent accidental sensitive paste ──────────
    middle_click_paste       = false
}

cursor {
    inactive_timeout         = 3
    hide_on_key_press        = false
}

# ── Aggressive idle lock (1 minute) ──────────────────────────────────────────
exec = hyprctl keyword general:lock_dead_zone 100
exec = hypridle &

# ── Clear clipboard on activation ────────────────────────────────────────────
exec = cliphist wipe 2>/dev/null || true
exec = wl-copy --clear 2>/dev/null || true

# ── VPN check / activation ────────────────────────────────────────────────────
exec = \
    if ! ip link show tun0 > /dev/null 2>&1 && \
       ! ip link show wg0 > /dev/null 2>&1; then \
        notify-send "ASH Privacy" \
        "⚠ VPN not detected!\nConnect VPN for full privacy protection." \
        --urgency=critical --expire-time=10000; \
    fi

# ── Camera kill ───────────────────────────────────────────────────────────────
exec = systemctl stop pipewire-camera 2>/dev/null || true

# ── Microphone: mute all inputs ───────────────────────────────────────────────
exec = wpctl set-mute @DEFAULT_SOURCE@ 1 2>/dev/null || true

# ── Screen sharing: block ─────────────────────────────────────────────────────
exec = systemctl --user stop xdg-desktop-portal-hyprland 2>/dev/null || true

exec = notify-send \
    "🔒 Privacy Mode ACTIVE" \
    "Clipboard: cleared • Mic: muted\nCamera: disabled • Screen share: blocked\nInactive windows: heavily blurred\nIdle lock: 60 seconds" \
    --app-name=ASH-Mode \
    --icon=~/.config/ash-dotfiles/assets/icons/ash-system/privacy-mode.svg \
    --urgency=critical \
    --expire-time=6000 \
    --hint=string:x-dunst-stack-tag:ash-mode

exec = echo "privacy" > ~/.local/state/ash-dotfiles/current-mode

# ══════════════════════════════════════════════════════════════════════════════
# EOF — privacy.conf | ash mode privacy | Restore: ash mode default
# ══════════════════════════════════════════════════════════════════════════════