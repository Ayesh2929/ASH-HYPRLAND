# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Stream Mode Configuration                        ║
# ║                                                                              ║
# ║  Live streaming / content creation profile. Polished visual appearance,   ║
# ║  OBS-aware window management, idle inhibited, privacy zones for            ║
# ║  sensitive windows, enhanced visual quality for on-screen capture.          ║
# ║                                                                              ║
# ║  Activate:   ash mode stream                                                ║
# ║  Deactivate: ash mode default                                               ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

decoration {
    rounding                 = 12       # Premium look for stream viewers
    rounding_power           = 2.2
    active_opacity           = 1.0
    inactive_opacity         = 0.94
    fullscreen_opacity       = 1.0

    dim_inactive             = true
    dim_strength             = 0.06     # Very subtle — stream viewers need context
    dim_special              = 0.35
    dim_around               = 0.45

    shadow {
        enabled              = true
        range                = 28
        render_power         = 3
        color                = rgba(0,0,0,0.60)
        color_inactive       = rgba(0,0,0,0.30)
        offset               = 0 6
        scale                = 1.02
    }

    blur {
        enabled              = true
        size                 = 10       # High blur for premium look
        passes               = 4
        noise                = 0.010
        contrast             = 0.88
        brightness           = 0.84
        vibrancy             = 0.20
        special              = true
        popups               = true
    }
}

animations {
    enabled                  = true
    first_launch_animation   = false

    bezier = streamCore,     0.160, 1.000, 0.300, 1.000
    bezier = streamSlide,    0.200, 0.900, 0.100, 1.050
    bezier = streamFade,     0.250, 0.000, 0.450, 1.000
    bezier = streamSnap,     0.080, 0.820, 0.170, 1.000

    # ── Smooth, cinematic transitions look great on stream ────────────────────
    animation = windowsIn,   1, 6, streamCore,  popin 68%
    animation = windowsOut,  1, 5, streamSnap,  popin 78%
    animation = windowsMove, 1, 5, streamCore
    animation = fadeIn,      1, 7, streamFade
    animation = fadeOut,     1, 5, streamFade
    animation = fadeSwitch,  1, 5, streamFade
    animation = fadeDim,     1, 6, streamFade
    animation = fadeLayers,  1, 4, streamFade
    animation = border,      1, 9, streamCore
    animation = borderangle, 1, 70, linear, loop
    animation = workspaces,  1, 6, streamSlide, slidefade 22%
    animation = workspacesIn,  1, 6, streamSlide, slidefade 22%
    animation = workspacesOut, 1, 5, streamSnap,  slidefade 22%
    animation = specialWorkspace,    1, 6, streamCore, slidefadevert -32%
    animation = specialWorkspaceIn,  1, 6, streamCore, slidefadevert -32%
    animation = specialWorkspaceOut, 1, 5, streamSnap, slidefadevert -32%
    animation = layers,      1, 3, streamSnap, fade
    animation = layersIn,    1, 4, streamCore, fade
    animation = layersOut,   1, 3, streamSnap, fade
}

general {
    gaps_in                  = 5
    gaps_out                 = 14
    border_size              = 2
    col.active_border        = rgba(cba4f7ff) rgba(89b4faff) 45deg
    col.inactive_border      = rgba(31324488)
    allow_tearing            = false
    resize_on_border         = true
}

misc {
    vfr                      = true
    vrr                      = 0
    render_unfocused_fps     = 30       # Keep background smooth — OBS captures
    focus_on_activate        = false
}

# ── OBS: always visible, capture-aware ────────────────────────────────────────
windowrulev2 = idleinhibit always, class:^(com.obsproject.Studio)$
windowrulev2 = workspace 8, class:^(com.obsproject.Studio)$

# ── Privacy: hide sensitive windows from OBS capture ─────────────────────────
windowrulev2 = noanim,       class:^(keepassxc|org.keepassxc.KeePassXC)$
windowrulev2 = float,        class:^(keepassxc)$

# ── Chat overlay windows: always on top ───────────────────────────────────────
windowrulev2 = pin,          class:^(streamlabs)$
windowrulev2 = float,        class:^(streamlabs)$

exec = powerprofilesctl set performance 2>/dev/null || true
exec = systemd-inhibit --what=idle:sleep --who=ash-stream \
    --why="Stream mode active" sleep infinity &

exec = notify-send \
    "📡 Stream Mode ACTIVE" \
    "Idle: inhibited • OBS: workspace 8\nBlur: HIGH • Animations: cinematic\nLooking good on stream! 🎥" \
    --app-name=ASH-Mode \
    --icon=~/.config/ash-dotfiles/assets/icons/ash-system/stream-mode.svg \
    --urgency=low \
    --expire-time=4000 \
    --hint=string:x-dunst-stack-tag:ash-mode

exec = echo "stream" > ~/.local/state/ash-dotfiles/current-mode

# ══════════════════════════════════════════════════════════════════════════════
# EOF — stream.conf | ash mode stream | Restore: ash mode default
# ══════════════════════════════════════════════════════════════════════════════