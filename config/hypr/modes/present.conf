# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Presentation Mode Configuration                  ║
# ║                                                                              ║
# ║  Professional presentation profile. Clean desktop, cursor stays visible,   ║
# ║  no transparency, mirrored display support, inhibit sleep, pointer          ║
# ║  visible at all times, oversized cursor for screen visibility.              ║
# ║                                                                              ║
# ║  Activate:   ash mode present                                               ║
# ║  Deactivate: ash mode default                                               ║
# ║  Hotkey:     defined in keybinds/default.conf                              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

decoration {
    rounding                 = 10       # Professional rounded corners
    rounding_power           = 2.0
    active_opacity           = 1.0
    inactive_opacity         = 1.0      # All windows fully opaque — readable
    fullscreen_opacity       = 1.0

    dim_inactive             = false    # No dimming — audience sees everything
    dim_strength             = 0.0
    dim_special              = 0.0
    dim_around               = 0.0

    shadow {
        enabled              = true     # Shadows give depth on projected screen
        range                = 18
        render_power          = 3
        color                = rgba(0,0,0,0.40)
        color_inactive       = rgba(0,0,0,0.20)
        offset               = 0 3
    }

    blur {
        enabled              = false    # No blur — clean for projection
    }
}

animations {
    enabled                  = true
    first_launch_animation   = false

    bezier = presentCore,    0.160, 1.000, 0.300, 1.000
    bezier = presentSlide,   0.260, 1.000, 0.200, 1.000
    bezier = presentSnap,    0.080, 0.820, 0.170, 1.000

    # ── Smooth, deliberate animations look professional on screen ─────────────
    animation = windowsIn,   1, 6, presentCore,  popin 75%
    animation = windowsOut,  1, 5, presentSnap,  popin 82%
    animation = windowsMove, 1, 5, presentCore
    animation = fadeIn,      1, 6, presentCore
    animation = fadeOut,     1, 5, presentSnap
    animation = fadeDim,     1, 1, linear        # Instant dim (disabled anyway)
    animation = border,      1, 8, presentCore
    animation = borderangle, 0, 1, linear        # No spinning border in pres.
    animation = workspaces,  1, 6, presentSlide, slidefade 20%
    animation = workspacesIn,  1, 6, presentSlide, slidefade 20%
    animation = workspacesOut, 1, 5, presentSnap,  slidefade 20%
    animation = specialWorkspace,    1, 6, presentCore, slidefadevert -30%
    animation = specialWorkspaceIn,  1, 6, presentCore, slidefadevert -30%
    animation = specialWorkspaceOut, 1, 5, presentSnap, slidefadevert -30%
    animation = layers,      1, 3, presentSnap, fade
    animation = layersIn,    1, 4, presentCore, fade
    animation = layersOut,   1, 3, presentSnap, fade
}

general {
    gaps_in                  = 6
    gaps_out                 = 16       # Clean breathing room around content
    border_size              = 2

    col.active_border        = rgba(cba4f7ff) rgba(89b4faff) 45deg
    col.inactive_border      = rgba(45475aff)

    allow_tearing            = false
    resize_on_border         = false    # No accidental resize mid-presentation
}

misc {
    vfr                      = true
    vrr                      = 0
    render_unfocused_fps     = 30       # Keep secondary windows smooth
    focus_on_activate        = false
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
    middle_click_paste       = false    # No accidental paste during pres
}

cursor {
    inactive_timeout         = 30       # Cursor stays visible — audience follows
    hide_on_key_press        = false
    zoom_factor              = 1.4      # Larger cursor visible on projection
    zoom_rigid               = false
    no_warps                 = true     # Stable cursor — no surprise jumps
}

# ── Idle inhibit during presentation ──────────────────────────────────────────
exec = systemd-inhibit --what=idle:sleep --who=ash-present \
    --why="Presentation mode active" sleep infinity &

exec = swaync-client --dnd-on 2>/dev/null || true
exec = hyprctl setcursor Bibata-Modern-Ice 32   # Larger cursor

exec = notify-send \
    "🎤 Presentation Mode ACTIVE" \
    "Idle: inhibited • Cursor: large (32px)\nTransparency: OFF • Gestures: stable\nGood luck! 👊" \
    --app-name=ASH-Mode \
    --icon=~/.config/ash-dotfiles/assets/icons/ash-system/present-mode.svg \
    --urgency=low \
    --expire-time=4000 \
    --hint=string:x-dunst-stack-tag:ash-mode

exec = echo "present" > ~/.local/state/ash-dotfiles/current-mode

# ══════════════════════════════════════════════════════════════════════════════
# EOF — present.conf | ash mode present | Restore: ash mode default
# ══════════════════════════════════════════════════════════════════════════════