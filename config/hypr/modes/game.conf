# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Game Mode Configuration                          ║
# ║                                                                              ║
# ║  Maximum performance profile for gaming. Strips all compositor             ║
# ║  overhead: blur, shadows, animations, rounding — gone. Direct scanout,     ║
# ║  VRR fullscreen, minimum latency pipeline, GPU fully freed for games.      ║
# ║                                                                              ║
# ║  Activate:   ash mode game                                                  ║
# ║  Deactivate: ash mode default                                               ║
# ║  Auto:       ash plugin enable game-mode                                    ║
# ║  Hotkey:     $hyperMod + G  (defined in keybinds/default.conf)             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  PERFORMANCE — DECORATION KILL SWITCH
#      Every disabled feature = fewer GPU render passes = more FPS
# ══════════════════════════════════════════════════════════════════════════════

decoration {
    # ── Rounding: OFF — no rounded rect shader cost ───────────────────────────
    rounding                 = 0
    rounding_power           = 2.0

    # ── Opacity: full — no alpha compositing overhead ─────────────────────────
    active_opacity           = 1.0
    inactive_opacity         = 1.0
    fullscreen_opacity       = 1.0

    # ── Dimming: OFF — skip dim compositor pass ────────────────────────────────
    dim_inactive             = false
    dim_strength             = 0.0
    dim_special              = 0.0
    dim_around               = 0.0

    # ── Screen shader: OFF — skip shader pass ─────────────────────────────────
    # screen_shader          =

    # ── Shadow: OFF — save shadow render pass ─────────────────────────────────
    shadow {
        enabled              = false
    }

    # ── Blur: OFF — biggest single GPU saver ──────────────────────────────────
    blur {
        enabled              = false
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# §02  PERFORMANCE — ANIMATION KILL SWITCH
# ══════════════════════════════════════════════════════════════════════════════

animations {
    enabled                  = false    # ALL animations OFF
    first_launch_animation   = false
}

# ══════════════════════════════════════════════════════════════════════════════
# §03  PERFORMANCE — GENERAL SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

general {
    # ── Borders: OFF — no border shader ───────────────────────────────────────
    border_size              = 0

    # ── Gaps: ZERO — maximum usable screen real estate ────────────────────────
    gaps_in                  = 0
    gaps_out                 = 0

    # ── Colors: irrelevant with border_size=0, set anyway ─────────────────────
    col.active_border        = rgba(00000000)
    col.inactive_border      = rgba(00000000)

    # ── Tearing: ALLOW — for games that benefit from it ───────────────────────
    allow_tearing            = true

    # ── Resize on border: OFF — accidental resize during game ─────────────────
    resize_on_border         = false
}

# ══════════════════════════════════════════════════════════════════════════════
# §04  PERFORMANCE — RENDER & COMPOSITOR
# ══════════════════════════════════════════════════════════════════════════════

misc {
    # ── VFR: OFF — stable frame delivery, no variable rate dips ──────────────
    vfr                      = false

    # ── VRR: fullscreen only — G-Sync/FreeSync for games ─────────────────────
    vrr                      = 1

    # ── Background FPS cap: very low — don't waste GPU on background apps ─────
    render_unfocused_fps     = 5

    # ── No direct scanout disable — allow bypass for lowest latency ───────────
    no_direct_scanout        = false

    # ── Focus on activate: OFF — prevent Steam popups stealing game focus ─────
    focus_on_activate        = false

    # ── Swallowing: OFF — skip process tracking overhead ──────────────────────
    enable_swallow           = false

    # ── Animations: ensure off ────────────────────────────────────────────────
    animate_manual_resizes   = false
    animate_mouse_windowdragging = false
}

render {
    # ── Explicit sync: auto — proper GPU pipeline sync ────────────────────────
    explicit_sync            = 2
    explicit_sync_kms        = 2

    # ── Direct scanout: allow fullscreen bypass ───────────────────────────────
    direct_scanout           = true

    # ── Shader unload: ON — free VRAM for game textures ──────────────────────
    unload_heavy_shaders     = true
}

cursor {
    # ── Hide cursor in fullscreen (games handle own cursor) ───────────────────
    inactive_timeout         = 2
    hide_on_key_press        = false
    no_break_fs_vrr          = true     # Don't break VRR for cursor
    min_refresh_rate         = 60       # Never drop below 60hz
}

# ══════════════════════════════════════════════════════════════════════════════
# §05  WINDOW RULES — GAME MODE OVERRIDES
# ══════════════════════════════════════════════════════════════════════════════

# ── All windows: opaque, no border, no shadow ─────────────────────────────────
windowrulev2 = opaque,          class:^(.*)$
windowrulev2 = noshadow,        class:^(.*)$
windowrulev2 = noborder,        class:^(.*)$
windowrulev2 = noblur,          class:^(.*)$
windowrulev2 = noanim,          class:^(.*)$

# ── Fullscreen apps: immediate tearing allowed ────────────────────────────────
windowrulev2 = immediate,       fullscreen:1
windowrulev2 = idleinhibit always, fullscreen:1

# ── Steam games: dedicated game rules ─────────────────────────────────────────
windowrulev2 = immediate,       class:^(steam_app_.*)$
windowrulev2 = fullscreen,      class:^(steam_app_.*)$
windowrulev2 = idleinhibit always, class:^(steam_app_.*)$
windowrulev2 = noanim,          class:^(steam_app_.*)$
windowrulev2 = noborder,        class:^(steam_app_.*)$
windowrulev2 = noshadow,        class:^(steam_app_.*)$

# ── MangoHUD: always-visible performance overlay ──────────────────────────────
windowrulev2 = nofocus,         class:^(mangohud)$
windowrulev2 = float,           class:^(mangohud)$
windowrulev2 = pin,             class:^(mangohud)$
windowrulev2 = noanim,          class:^(mangohud)$
windowrulev2 = noborder,        class:^(mangohud)$
windowrulev2 = noshadow,        class:^(mangohud)$
windowrulev2 = move 0 0,        class:^(mangohud)$

# ══════════════════════════════════════════════════════════════════════════════
# §06  WORKSPACE RULES — GAME WORKSPACE
# ══════════════════════════════════════════════════════════════════════════════

workspace = 6,
    monitor:DP-1,
    gapsin:0,
    gapsout:0,
    border:false,
    shadow:false,
    rounding:false,
    decorate:false

# ══════════════════════════════════════════════════════════════════════════════
# §07  EXEC — MODE ENTRY ACTIONS
# ══════════════════════════════════════════════════════════════════════════════

# ── Apply power performance profile ───────────────────────────────────────────
exec = powerprofilesctl set performance 2>/dev/null || true

# ── CPU performance governor ──────────────────────────────────────────────────
exec = echo performance | \
    sudo tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor \
    > /dev/null 2>/dev/null || true

# ── Disable compositor blur explicitly ────────────────────────────────────────
exec = hyprctl keyword decoration:blur:enabled false

# ── Disable shadow explicitly ─────────────────────────────────────────────────
exec = hyprctl keyword decoration:shadow:enabled false

# ── Switch to Workspace 6 (gaming workspace) ──────────────────────────────────
exec = hyprctl dispatch workspace 6

# ── Reload Waybar to show game mode indicator ────────────────────────────────
exec = pkill -SIGUSR1 waybar 2>/dev/null || true

# ── Notification ─────────────────────────────────────────────────────────────
exec = notify-send \
    "🎮 Game Mode ACTIVE" \
    "Blur OFF • Shadow OFF • Anim OFF\nVRR: Fullscreen • Tearing: Allowed\nGPU fully freed for gaming" \
    --app-name=ASH-Mode \
    --icon=~/.config/ash-dotfiles/assets/icons/ash-system/game-mode.svg \
    --urgency=normal \
    --expire-time=4000 \
    --hint=string:x-dunst-stack-tag:ash-mode

# ── Update ASH state ──────────────────────────────────────────────────────────
exec = echo "game" > ~/.local/state/ash-dotfiles/current-mode

# ══════════════════════════════════════════════════════════════════════════════
# EOF — game.conf | ash mode game | Restore: ash mode default
# ══════════════════════════════════════════════════════════════════════════════