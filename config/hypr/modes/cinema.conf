# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Cinema Mode Configuration                        ║
# ║                                                                              ║
# ║  Immersive media consumption mode. Zero visual chrome, content fills       ║
# ║  screen edge-to-edge, idle inhibited, DND active, color temperature        ║
# ║  warmed for evening viewing comfort, VRR for smooth video playback.         ║
# ║                                                                              ║
# ║  Activate:   ash mode cinema                                                ║
# ║  Deactivate: ash mode default                                               ║
# ║  Auto:       via windowrule on mpv fullscreen                              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

decoration {
    rounding                 = 0        # No rounding — pure screen fill
    rounding_power           = 2.0
    active_opacity           = 1.0
    inactive_opacity         = 0.75
    fullscreen_opacity       = 1.0

    dim_inactive             = true
    dim_strength             = 0.25
    dim_special              = 0.70     # Very dark special workspace backdrop
    dim_around               = 0.00

    shadow {
        enabled              = false    # No shadows in cinema
    }

    blur {
        enabled              = true
        size                 = 4
        passes               = 2
        brightness           = 0.72    # Darker blur for cinema atmosphere
        contrast             = 0.88
        noise                = 0.005
    }
}

animations {
    enabled                  = true
    first_launch_animation   = false

    bezier = cinemaCore,     0.000, 0.850, 0.100, 1.000
    bezier = cinemaFade,     0.250, 0.000, 0.450, 1.000
    bezier = cinemaSnap,     0.050, 0.800, 0.100, 1.000

    # ── Slow, deliberate transitions feel cinematic ────────────────────────────
    animation = windowsIn,   1, 8, cinemaCore, popin 65%
    animation = windowsOut,  1, 7, cinemaFade, popin 75%
    animation = windowsMove, 1, 8, cinemaCore
    animation = fadeIn,      1, 9, cinemaFade
    animation = fadeOut,     1, 7, cinemaFade
    animation = fadeDim,     1, 10, cinemaFade
    animation = fadeLayers,  1, 6, cinemaFade
    animation = border,      1, 12, cinemaCore
    animation = borderangle, 1, 120, linear, loop  # Very slow gradient
    animation = workspaces,  1, 8, cinemaCore, slidefade 28%
    animation = workspacesIn,  1, 8, cinemaCore, slidefade 28%
    animation = workspacesOut, 1, 7, cinemaFade, slidefade 28%
    animation = specialWorkspace,    1, 8, cinemaCore, slidefadevert -45%
    animation = specialWorkspaceIn,  1, 8, cinemaCore, slidefadevert -45%
    animation = specialWorkspaceOut, 1, 7, cinemaFade, slidefadevert -45%
    animation = layers,      1, 5, cinemaFade, fade
    animation = layersIn,    1, 6, cinemaCore, fade
    animation = layersOut,   1, 5, cinemaFade, fade
}

general {
    gaps_in                  = 0        # No gaps in cinema
    gaps_out                 = 0
    border_size              = 0        # No borders
    col.active_border        = rgba(00000000)
    col.inactive_border      = rgba(00000000)
    allow_tearing            = false
}

misc {
    vfr                      = true
    vrr                      = 1        # VRR for smooth video
    render_unfocused_fps     = 5
    focus_on_activate        = false
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
    background_color         = rgba(000000ff)  # Pure black letterbox
}

cursor {
    inactive_timeout         = 3        # Hide quickly during playback
    hide_on_key_press        = false
}

# ── Workspace: cinema workspace with no decoration ────────────────────────────
workspace = 9,
    gapsin:0,
    gapsout:0,
    border:false,
    shadow:false,
    rounding:false,
    decorate:false

# ── Window rules ──────────────────────────────────────────────────────────────
windowrulev2 = idleinhibit always, class:^(mpv|vlc|celluloid|totem)$
windowrulev2 = noanim,             class:^(mpv|vlc)$, fullscreen:1
windowrulev2 = noborder,           class:^(mpv|vlc)$
windowrulev2 = noshadow,           class:^(mpv|vlc)$
windowrulev2 = opaque,             class:^(mpv|vlc|celluloid)$

exec = swaync-client --dnd-on 2>/dev/null || true
exec = hyprctl dispatch workspace 9
exec = hyprsunset -t 3800 2>/dev/null || true   # Warm evening tone
exec = powerprofilesctl set balanced 2>/dev/null || true

exec = notify-send \
    "🎬 Cinema Mode ACTIVE" \
    "Borders OFF • Gaps ZERO • Idle inhibited\nColor: 3800K warm • VRR: Fullscreen\nSit back and enjoy 🍿" \
    --app-name=ASH-Mode \
    --icon=~/.config/ash-dotfiles/assets/icons/ash-system/cinema-mode.svg \
    --urgency=low \
    --expire-time=3000 \
    --hint=string:x-dunst-stack-tag:ash-mode

exec = echo "cinema" > ~/.local/state/ash-dotfiles/current-mode

# ══════════════════════════════════════════════════════════════════════════════
# EOF — cinema.conf | ash mode cinema | Restore: ash mode default
# ══════════════════════════════════════════════════════════════════════════════