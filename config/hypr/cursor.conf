# Applied via: hyprctl keyword cursor:no_break_fs_vrr true

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  PRESENTATION MODE — Visible, accessible                                │
# └─────────────────────────────────────────────────────────────────────────┘
