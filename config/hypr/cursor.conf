# ══════════════════════════════════════════════════════════════════════════════
# §01  CURSOR FORMAT REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  cursor {
#    ── Hardware rendering ────────────────────────────────────────────────────
#    no_hardware_cursors      BOOL — software cursor plane (Nvidia fix)
#    no_break_fs_vrr          BOOL — don't disable VRR when cursor on screen
#    min_refresh_rate         N    — minimum refresh when cursor is static (VFR)
#    use_cpu_buffer           N    — 0=auto 1=force-CPU 2=force-GPU buffer
#    allow_dumb_copy          BOOL — sub-optimal cursor copy (compat)
#
#    ── Behavior ──────────────────────────────────────────────────────────────
#    hotspot_padding          N    — distance from hotspot to window edge (px)
#    inactive_timeout         N    — hide cursor after N seconds idle
#    no_warps                 BOOL — prevent cursor warp on focus change
#    persistent_warps         BOOL — remember warp position between sessions
#    warp_on_change_workspace BOOL — warp to last pos when switching workspace
#    default_monitor          STR  — monitor for cursor spawn (empty=last)
#    hide_on_key_press        BOOL — hide cursor when typing
#    hide_on_touch            BOOL — hide cursor when touch detected
#
#    ── Zoom ──────────────────────────────────────────────────────────────────
#    zoom_factor              N    — cursor magnification (1.0 = normal)
#    zoom_rigid               BOOL — zoom centered vs cursor-relative
#
#    ── HyprCursor ────────────────────────────────────────────────────────────
#    enable_hyprcursor        BOOL — use HyprCursor theme format
#  }
#
#  ── Cursor theme environment variables (set in env.conf) ─────────────────────
#  HYPRCURSOR_THEME=NAME       — HyprCursor theme name
#  HYPRCURSOR_SIZE=N           — HyprCursor size in pixels
#  XCURSOR_THEME=NAME          — XCursor theme (XWayland / legacy apps)
#  XCURSOR_SIZE=N              — XCursor size
#
#  ── Cursor theme locations ────────────────────────────────────────────────────
#  ~/.local/share/icons/THEME/ — user-installed cursor themes
#  /usr/share/icons/THEME/     — system-wide cursor themes
#  ~/.icons/THEME/             — legacy user location (still supported)
#
#  ── HyprCursor theme structure ────────────────────────────────────────────────
#  THEME_DIR/
#  ├── manifest.hl             — theme metadata (name, description, version)
#  └── cursors/
#      ├── default.hl          — cursor definition with SVG + hotspot
#      ├── pointer.hl
#      ├── text.hl
#      └── ... (all standard cursor names)
#
# ══════════════════════════════════════════════════════════════════════════════
# §02  CORE CURSOR SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

cursor {

    # ══════════════════════════════════════════════════════════════════════════
    # §03  HARDWARE CURSOR PLANE
    # ══════════════════════════════════════════════════════════════════════════

    # ── Hardware cursor (DRM cursor plane) ───────────────────────────────────
    # false = use DRM hardware cursor plane (best performance)
    #   • Cursor rendered by display hardware, zero compositor overhead
    #   • Moves without waiting for compositor frame cycle
    #   • Lowest possible cursor latency
    #
    # true = software cursor (compositor renders cursor in frame)
    #   • Required for some Nvidia setups that don't support hw cursor
    #   • Slightly higher latency (tied to compositor frame rate)
    #   • Always correct position but may stutter under heavy load
    #
    # ENABLE (true) if: cursor appears invisible, offset, or mispositioned
    # KEEP (false) if:  cursor works correctly (better performance)
    no_hardware_cursors          = false

    # ── VRR cursor compatibility ──────────────────────────────────────────────
    # When VRR (G-Sync/FreeSync) is active, some displays disable it
    # while the cursor is visible (cursor plane conflicts with VRR).
    #
    # false = allow display to break VRR when cursor shows (may drop VRR)
    # true  = force VRR to stay active even with cursor visible
    #
    # RECOMMENDED: false (default) — let display handle cursor/VRR interaction
    no_break_fs_vrr              = false

    # ── Minimum refresh rate in VFR mode ─────────────────────────────────────
    # When VFR (Variable Frame Rate) is active and cursor is static,
    # compositor drops to a low refresh rate to save power.
    # This sets the floor: compositor won't go below this rate.
    #
    # 24 = cinematic minimum (good for most idle states)
    # 30 = standard minimum (slightly more responsive)
    # 60 = no VFR reduction (always full rate — disables power saving)
    min_refresh_rate             = 24

    # ── CPU/GPU buffer selection ──────────────────────────────────────────────
    # Controls which memory pool cursor textures are stored in.
    # 0 = auto-detect based on GPU vendor and driver capabilities (RECOMMENDED)
    # 1 = force CPU buffer (system RAM — slower but universally compatible)
    # 2 = force GPU buffer (VRAM — faster, requires GPU memory mapping support)
    use_cpu_buffer               = 0

    # ── Dumb cursor copy ──────────────────────────────────────────────────────
    # Allow sub-optimal buffer copy path for cursor textures.
    # Enables compatibility with display drivers that don't support
    # direct DMA cursor buffer operations.
    # Enable only if experiencing cursor rendering glitches.
    allow_dumb_copy              = false

    # ══════════════════════════════════════════════════════════════════════════
    # §04  CURSOR BEHAVIOR
    # ══════════════════════════════════════════════════════════════════════════

    # ── Hotspot padding ───────────────────────────────────────────────────────
    # Minimum distance (px) between cursor hotspot and window/screen edge
    # before focus events trigger. Prevents accidental focus changes when
    # cursor is near but not quite at a border.
    # 1 = minimal padding (precise, responsive)
    # 4 = comfortable padding (prevents edge accidents)
    hotspot_padding              = 1

    # ── Inactive cursor timeout ───────────────────────────────────────────────
    # Automatically hide cursor after N seconds without movement.
    # Useful for: presentations, reading, coding focus sessions.
    # 0 = never hide (cursor always visible)
    # 5 = hide after 5 seconds idle (aggressive)
    # 8 = comfortable balance for most users
    # 10 = relaxed (good for presentations)
    # 30 = very relaxed (barely noticeable hiding)
    inactive_timeout             = 8

    # ── Cursor warp prevention ────────────────────────────────────────────────
    # When focus changes (window switch, workspace change), Hyprland normally
    # warps the cursor to center of the newly focused window.
    #
    # false = allow warps (cursor jumps to focused window center)
    # true  = no warps (cursor stays where it is, focus moves independently)
    #
    # RECOMMENDED: false — warping helps locate focus on large monitors
    no_warps                     = false

    # ── Persistent warp memory ────────────────────────────────────────────────
    # Remember cursor position per window — when focus returns to a window,
    # cursor warps to where it was when that window was last focused.
    # Creates muscle memory: cursor "remembers" position in each app.
    persistent_warps             = false

    # ── Workspace warp ────────────────────────────────────────────────────────
    # When switching workspaces, warp cursor to last position on that workspace.
    # Creates consistent spatial memory across workspace switches.
    warp_on_change_workspace     = false

    # ── Default monitor for cursor ────────────────────────────────────────────
    # Monitor where cursor spawns on compositor start.
    # Empty = appears on monitor with last active window.
    # Set to monitor name (e.g. "DP-1") to force a specific output.
    default_monitor              =

    # ── Hide on key press ─────────────────────────────────────────────────────
    # Cursor disappears when you start typing.
    # Reappears when mouse is moved.
    # Useful for: distraction-free writing, presentations.
    # Annoying for: coding (cursor disappears when typing in editor)
    hide_on_key_press            = false

    # ── Hide on touch ─────────────────────────────────────────────────────────
    # Cursor hides when touch/stylus input is detected.
    # Creates clean tablet experience without visible cursor.
    hide_on_touch                = true

    # ══════════════════════════════════════════════════════════════════════════
    # §05  CURSOR ZOOM (ACCESSIBILITY / MAGNIFICATION)
    # ══════════════════════════════════════════════════════════════════════════

    # ── Zoom factor ───────────────────────────────────────────────────────────
    # Magnify the cursor and screen area around it.
    # 1.0 = normal size (disabled)
    # 1.5 = 50% larger cursor + magnified region
    # 2.0 = double size
    # 3.0 = triple size (high-visibility / accessibility mode)
    #
    # Note: zoom_factor > 1.0 enables a screen magnification mode —
    # not just a larger cursor. The entire viewport zooms around cursor.
    # For just a larger cursor icon: use XCURSOR_SIZE environment variable.
    zoom_factor                  = 1.0

    # ── Zoom mode ─────────────────────────────────────────────────────────────
    # Controls the focal point of the zoom magnification.
    # false = zoom follows cursor (cursor at center of zoomed view)
    #         Content shifts to keep cursor centered — intuitive scrolling
    # true  = zoom is rigid (cursor position fixed, content doesn't shift)
    #         Better for: reading zoomed text without cursor moving view
    zoom_rigid                   = false

    # ══════════════════════════════════════════════════════════════════════════
    # §06  HYPRCURSOR ENGINE
    # ══════════════════════════════════════════════════════════════════════════

    # ── HyprCursor format support ─────────────────────────────────────────────
    # HyprCursor is Hyprland's native cursor theme format featuring:
    #   • SVG-based cursors (resolution-independent, crisp at any size)
    #   • GPU-rendered cursor shapes (no pre-rendered PNG sprite sheets)
    #   • Per-cursor hotspot definition (precise click registration)
    #   • Theme metadata (name, author, license in manifest.hl)
    #   • Backward-compatible (falls back to XCursor if theme not found)
    #
    # true  = use HyprCursor format (RECOMMENDED — best quality)
    # false = use XCursor format only (legacy PNG sprite sheets)
    enable_hyprcursor            = true
}

# ══════════════════════════════════════════════════════════════════════════════
# §07  CURSOR THEME ENVIRONMENT VARIABLES
#      Applied in env.conf — duplicated here for documentation
# ══════════════════════════════════════════════════════════════════════════════

# ── Primary: HyprCursor theme ────────────────────────────────────────────────
# env = HYPRCURSOR_THEME,          Bibata-Modern-Ice
# env = HYPRCURSOR_SIZE,           24

# ── Fallback: XCursor theme (for XWayland and GTK/Qt apps) ──────────────────
# env = XCURSOR_THEME,             Bibata-Modern-Ice
# env = XCURSOR_SIZE,              24

# ── Per-resolution size guide ─────────────────────────────────────────────────
# 1080p @ scale 1.0 → size 24  (standard)
# 1440p @ scale 1.0 → size 24  (standard)
# 1440p @ scale 1.25 → size 30
# 4K    @ scale 1.5  → size 36
# 4K    @ scale 2.0  → size 48  (matches 24px at 1x visual size)
# HiDPI laptop 2K   → size 28-32

