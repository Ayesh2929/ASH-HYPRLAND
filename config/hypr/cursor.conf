#     no_hardware_cursors      = false    # Keep hardware cursor
#     no_break_fs_vrr          = true     # Don't break VRR for cursor
#     min_refresh_rate         = 60       # Never drop below 60hz
#     inactive_timeout         = 3        # Hide quickly — less distraction
#     hide_on_key_press        = false    # Games need cursor visible
#     zoom_factor              = 1.0      # No zoom in games
