# }

# ══════════════════════════════════════════════════════════════════════════════
# §10  CURSOR DIAGNOSTICS
# ══════════════════════════════════════════════════════════════════════════════

# ── Verify cursor theme loading ───────────────────────────────────────────────
# hyprctl cursor                   → current cursor state
# echo $HYPRCURSOR_THEME           → env var check
# echo $XCURSOR_THEME              → XCursor fallback check

# ── HyprCursor theme validation ──────────────────────────────────────────────
# ls ~/.local/share/icons/         → installed themes
# cat ~/.local/share/icons/THEME/manifest.hl  → theme metadata

# ── XCursor compatibility check ──────────────────────────────────────────────
# xrdb -query | grep Xcursor       → X resources cursor settings
# xcur2png /usr/share/icons/Adwaita/cursors/default  → validate XCursor file

# ── Hardware cursor support ───────────────────────────────────────────────────
# journalctl -t hyprland | grep -i "cursor\|hw_cursor"
# drm_info | grep cursor           → DRM cursor plane capability

# ── Cursor invisible on specific app ─────────────────────────────────────────
# Cause: App uses its own cursor surface (SDL, SFML games)
# Fix:   Game sets cursor = cursor is game-controlled (expected)
# Fix:   windowrulev2 = nocursor, class:^(gamename)$  (if needed)

# ── Cursor too small on HiDPI ────────────────────────────────────────────────
# Fix 1: env = XCURSOR_SIZE, 48
# Fix 2: env = HYPRCURSOR_SIZE, 48
# Fix 3: hyprctl setcursor THEME 48
# Fix 4: ash config set cursor.size 48

# ══════════════════════════════════════════════════════════════════════════════
# EOF — cursor.conf
# Apply theme:  hyprctl setcursor THEME SIZE
# ASH command:  ash theme apply --cursor THEME
# Diagnose:     ash doctor check --cursor
