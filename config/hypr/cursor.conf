#     no_warps                 = true     # Don't jump around unexpectedly
# }

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  FOCUS / WRITING MODE — Minimal distraction                             │
# └─────────────────────────────────────────────────────────────────────────┘
