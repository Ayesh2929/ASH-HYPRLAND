# ══════════════════════════════════════════════════════════════════════════════
# §01  XWAYLAND FORMAT REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  xwayland {
#    enabled              BOOL   — enable/disable XWayland entirely
#    use_nearest_neighbor BOOL   — nearest-neighbor vs bilinear scaling
#    force_zero_scaling   BOOL   — render at 1:1, compositor upscales
#  }
#
#  ── Environment variables that affect XWayland apps (set in env.conf) ────────
#
#  GDK_SCALE=2            — GTK apps scale 2x
#  GDK_DPI_SCALE=0.5      — compensate GDK_SCALE for HiDPI
#  QT_AUTO_SCREEN_SCALE_FACTOR=1  — Qt auto HiDPI
#  QT_SCALE_FACTOR=2      — Qt manual scale
#  _JAVA_AWT_WM_NONREPARENTING=1  — fix Java GUI in tiling WMs
#  XWAYLAND_NO_GLAMOR=1   — disable Glamor for Nvidia XWayland fix
#
#  ── XWayland DPI calculation ──────────────────────────────────────────────────
#  Logical DPI = Physical DPI / scale_factor
#  For 27" 4K (163 ppi) at scale 2:  Xft.dpi = 96 * 2 = 192
#  For 13" 2K (226 ppi) at scale 1.5: Xft.dpi = 96 * 1.5 = 144
#  Standard 1080p at scale 1:         Xft.dpi = 96
#
# ══════════════════════════════════════════════════════════════════════════════
# §02  CORE XWAYLAND SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

xwayland {
    # ── Enable XWayland ───────────────────────────────────────────────────────
    # Required for: Steam, many games, legacy GTK2/Qt4 apps, WINE, Electron v<28
    # Set false only if you run 100% native Wayland applications
    enabled              = true

    # ── Pixel scaling algorithm ───────────────────────────────────────────────
    # Applies when compositor scales up XWayland surfaces on HiDPI displays
    #
    # true  = nearest-neighbor (sharp pixel art, crisp icons, no blur)
    #         Best for: retro games, pixel art, apps with fixed-size assets
    # false = bilinear smooth (smoother text/icons at non-integer scales)
    #         Best for: modern X11 apps, VS Code, JetBrains IDEs
    use_nearest_neighbor = true

    # ── Force zero scaling ────────────────────────────────────────────────────
    # When enabled: XWayland renders all surfaces at scale=1
    # Compositor then upscales to match monitor DPI
    #
    # Pros: Prevents X11 apps from applying their own broken HiDPI scaling
    # Cons: Compositor upscaling may look blurry on non-integer scales
    #
    # Recommended: true for HiDPI with fractional scaling (1.25x, 1.5x, 1.75x)
    #              false for integer scaling (1x, 2x) or when apps handle DPI correctly
    force_zero_scaling   = false
}

# ══════════════════════════════════════════════════════════════════════════════
# §03  XRESOURCES CONFIGURATION
#      Controls font rendering, DPI, and appearance for X11 applications
#      Applied via: exec-once = xrdb -merge ~/.Xresources (in autostart.conf)
#      Or dynamically: exec-once = xrdb -merge - <<< "Xft.dpi: 96"
# ══════════════════════════════════════════════════════════════════════════════

# The following settings are applied via exec-once in autostart.conf:
#
# ── Standard 1080p (scale 1.0) ────────────────────────────────────────────────
# exec-once = xrdb -merge - << 'XRESOURCES'
# Xft.dpi:       96
# Xft.antialias: true
# Xft.hinting:   true
# Xft.hintstyle: hintfull
# Xft.rgba:      rgb
# Xft.lcdfilter: lcddefault
# XRESOURCES
#
# ── HiDPI 4K (scale 2.0) ──────────────────────────────────────────────────────
# exec-once = xrdb -merge - << 'XRESOURCES'
# Xft.dpi:       192
# Xft.antialias: true
# Xft.hinting:   true
# Xft.hintstyle: hintslight
# Xft.rgba:      rgb
# Xft.lcdfilter: lcdlight
# XRESOURCES
#
# ── Fractional 1.5x (e.g. 1440p on 27") ──────────────────────────────────────
# exec-once = xrdb -merge - << 'XRESOURCES'
# Xft.dpi:       144
# Xft.antialias: true
# Xft.hinting:   true
# Xft.hintstyle: hintslight
# Xft.rgba:      rgb
# XRESOURCES

# ══════════════════════════════════════════════════════════════════════════════
# §04  PER-APPLICATION XWAYLAND WINDOW RULES
#      These supplement windowrules.conf for XWayland-specific issues
# ══════════════════════════════════════════════════════════════════════════════

# ── Fix blurry/double-scaled XWayland apps on HiDPI ──────────────────────────
windowrulev2 = noblur,          xwayland:1, floating:0
windowrulev2 = noshadow,        xwayland:1, floating:0
windowrulev2 = rounding 0,      xwayland:1

# ── Override opacity for XWayland apps (force opaque for performance) ─────────
# windowrulev2 = opaque,         xwayland:1

# ── Prevent XWayland apps from requesting fullscreen via _NET_WM_STATE ────────
windowrulev2 = suppressevent fullscreen, xwayland:1, class:^(steam)$
windowrulev2 = suppressevent fullscreen, xwayland:1, class:^(xterm|urxvt|rxvt)$

# ── Fix Java/Swing GUI rendering in XWayland ──────────────────────────────────
windowrulev2 = noblur,          class:^(jetbrains-.*)$, xwayland:1
windowrulev2 = noanim,          class:^(jetbrains-.*)$, title:^(splash)$

# ── Fix wine/proton windows appearing at wrong position ───────────────────────
windowrulev2 = center,          class:^(wine)$,      floating:1, xwayland:1
windowrulev2 = noanim,          class:^(wine)$,      title:^()$
windowrulev2 = noborder,        class:^(wine)$,      title:^()$, xwayland:1

# ── Fix Steam XWayland popups ─────────────────────────────────────────────────
windowrulev2 = float,           class:^(steam)$,     title:^()$, xwayland:1
windowrulev2 = noanim,          class:^(steam)$,     title:^()$, xwayland:1
windowrulev2 = center,          class:^(steam)$,     title:^(Steam Guard.*)$

# ── Fix GIMP XWayland toolbox windows ─────────────────────────────────────────
windowrulev2 = float,           class:^(gimp|GIMP)$, xwayland:1, title:^((?!.*GIMP).*)$
windowrulev2 = noblur,          class:^(gimp|GIMP)$, xwayland:1

# ── Fix Chromium/Electron apps running as XWayland ────────────────────────────
windowrulev2 = noblur,          class:^(code-oss)$,  xwayland:1
windowrulev2 = noblur,          class:^(discord)$,   xwayland:1

# ── VirtualBox XWayland fixes ─────────────────────────────────────────────────
windowrulev2 = float,           class:^(VirtualBox Machine)$, xwayland:1
windowrulev2 = noanim,          class:^(VirtualBox Machine)$, xwayland:1
windowrulev2 = noblur,          class:^(VirtualBox Machine)$, xwayland:1
windowrulev2 = idleinhibit always, class:^(VirtualBox Machine)$, xwayland:1

# ── Fix xterm / legacy terminals ──────────────────────────────────────────────
windowrulev2 = float,           class:^(xterm)$
windowrulev2 = size 900 550,    class:^(xterm)$
windowrulev2 = center,          class:^(xterm)$
windowrulev2 = opacity 0.94,    class:^(xterm)$

# ══════════════════════════════════════════════════════════════════════════════
# §05  XWAYLAND CLIPBOARD BRIDGE
#      Ensures clipboard sync between X11 and Wayland applications
#      Managed by wl-clipboard + xclip/xsel bridge
# ══════════════════════════════════════════════════════════════════════════════

# Clipboard bridge is started in autostart.conf:
# exec-once = wl-paste --type text --watch xclip -selection clipboard

# Additional clipboard sync options:
# exec-once = xclipboard   — X11 clipboard manager (fallback)

# ══════════════════════════════════════════════════════════════════════════════
# §06  XWAYLAND SATELLITE (rootless XWayland)
#      xwayland-satellite provides better XWayland integration
#      without running a full X server root window
# ══════════════════════════════════════════════════════════════════════════════

# If using xwayland-satellite:
# exec-once = xwayland-satellite
# layerrule = noanim, xwayland-satellite
# layerrule = noblur, xwayland-satellite

# ══════════════════════════════════════════════════════════════════════════════
# §07  NVIDIA XWAYLAND SPECIFIC FIXES
#      Required when primary or discrete GPU is NVIDIA
# ══════════════════════════════════════════════════════════════════════════════

# Applied via env.conf when Nvidia GPU detected:
# env = XWAYLAND_NO_GLAMOR,      1    — disable Glamor acceleration
# env = __GLX_VENDOR_LIBRARY_NAME, nvidia
# env = GBM_BACKEND,             nvidia-drm

# XWayland cursor fix for Nvidia (if cursor appears invisible):
# cursor { no_hardware_cursors = true }

