# plugin = ~/.local/share/hyprpm/plugins/split-monitor-workspaces.so

# ══════════════════════════════════════════════════════════════════════════════
# §03  HYPREXPO CONFIGURATION
#      Expose-style overview of all workspaces with window previews
#      Repo: built into hyprland-plugins (official)
# ══════════════════════════════════════════════════════════════════════════════

plugin {
    hyprexpo {
        # ── Grid layout ────────────────────────────────────────────────────
        # Number of columns in the overview grid
        # 5 = 5x2 for 10 workspaces (recommended for 10-ws setup)
        # 3 = 3x? (good for 9-ws setup)
        columns             = 5

        # Gap between workspace previews in the grid (px)
        gap_size            = 8

        # Background color behind the overview grid
        bg_col              = rgba(17,17,27,0.95)

        # ── Workspace panel styling ────────────────────────────────────────
        # Workspace name rendering
        workspace_method    = center current  # first | center current | center previous

        # Enable drop shadows on workspace preview panels
        enable_shadows      = true

        # Shadow color for preview panels
        shadow_color        = rgba(0,0,0,0.6)

        # Panel corner rounding (px)
        panel_rounding      = 12

        # Show only workspaces that have at least one window
        # false = always show all 10 workspace slots
        hide_empty          = false

        # ── Workspace name overlays ────────────────────────────────────────
        # Draw workspace number/name on each panel
        draw_ws_names       = true

        # Font for workspace name labels
        workspace_text_font = JetBrainsMono Nerd Font Bold

        # Font size for workspace name labels
        workspace_text_size = 14

        # ── Interactions ──────────────────────────────────────────────────
        # Click a workspace to switch, or press Escape to cancel
        # Scroll in overview to cycle workspaces
    }
}

# ── hyprexpo keybinds ─────────────────────────────────────────────────────────
# Toggle overview (defined in keybinds/default.conf):
# bind = $mainMod, grave, hyprexpo:expo, toggle
# bind = $mainMod, Tab,   hyprexpo:expo, toggle

# ══════════════════════════════════════════════════════════════════════════════
# §04  HYPRBARS CONFIGURATION
#      Adds configurable title bars to tiled and floating windows
#      Repo: built into hyprland-plugins (official)
# ══════════════════════════════════════════════════════════════════════════════

plugin {
    hyprbars {
        # ── Bar dimensions ─────────────────────────────────────────────────
        # Height of the title bar in pixels
        bar_height          = 28

        # ── Color scheme ───────────────────────────────────────────────────
        # Colors populated by ASH theme engine
        bar_color           = rgba(30,30,46,0.95)    # Crust with alpha
        col.text            = rgba(205,214,244,0.90) # Text
        bar_text_size       = 12
        bar_text_font       = JetBrainsMono Nerd Font

        # ── Text alignment ────────────────────────────────────────────────
        # left | center | right
        bar_text_align      = left

        # ── Padding ───────────────────────────────────────────────────────
        bar_padding         = 8

        # ── Blur behind bar ───────────────────────────────────────────────
        bar_blur            = true
        bar_blur_passes     = 2
        bar_blur_size       = 6

        # ── Precedence ────────────────────────────────────────────────────
        # Where bar is placed relative to window content
        # top | bottom (top = classic macOS/Windows style)
        bar_precedence_over_border = false

        # ── Window buttons (traffic lights) ──────────────────────────────
        # Format: button_size, BUTTON_COLOR_IDLE, BUTTON_COLOR_HOVER, DISPATCHER, ARGS
        buttons {
            # Close button — red
            hyprbars-button = rgba(243,139,168,0.90), 14, 󰖭, killactive

            # Maximize button — yellow
            hyprbars-button = rgba(249,226,175,0.90), 14, 󰖯, fullscreen, 1

            # Float button — green
            hyprbars-button = rgba(166,227,161,0.90), 14, 󰖮, togglefloating
        }

        # ── Per-class title bar rules ──────────────────────────────────────
        # Disable title bar for specific apps (they have their own):
        # windowrulev2 = plugin:hyprbars:nobar, class:^(firefox)$
        # windowrulev2 = plugin:hyprbars:nobar, class:^(code-oss)$
        # windowrulev2 = plugin:hyprbars:nobar, class:^(discord)$
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# §05  HYPRWINWRAP CONFIGURATION
#      Embed windows as live wallpaper behind all other surfaces
#      Repo: built into hyprland-plugins (official)
# ══════════════════════════════════════════════════════════════════════════════

plugin {
    hyprwinwrap {
        # ── Window class to wrap ───────────────────────────────────────────
        # The window with this class will be embedded as wallpaper.
        # Launch the target app with: --class CLASSNAME
        # Examples:
        #   kitty --class background-terminal -e cava
        #   mpv --wid=$(hyprctl -j monitors | jq '.[0].id') video.mp4
        class               = ash-background

        # Usage examples:
        # Live CAVA visualizer as wallpaper:
        #   exec-once = kitty --class ash-background -e cava
        #
        # MPV animated wallpaper:
        #   exec-once = mpv --no-osc --loop-file --wid=... video.mp4
        #
        # Shadertoy-style GLSL background:
        #   exec-once = shadertoy-renderer --class ash-background
    }
}

# ── hyprwinwrap window rules ──────────────────────────────────────────────────
windowrulev2 = noblur,       class:^(ash-background)$
windowrulev2 = noanim,       class:^(ash-background)$
windowrulev2 = noshadow,     class:^(ash-background)$
windowrulev2 = noborder,     class:^(ash-background)$
windowrulev2 = nofocus,      class:^(ash-background)$
windowrulev2 = noinitialfocus, class:^(ash-background)$
windowrulev2 = opacity 1.0,  class:^(ash-background)$
windowrulev2 = pin,          class:^(ash-background)$

# ══════════════════════════════════════════════════════════════════════════════
# §06  HYPRTRAILS CONFIGURATION
#      Renders motion trails behind moving windows
#      Repo: built into hyprland-plugins (official)
# ══════════════════════════════════════════════════════════════════════════════

plugin {
    hyprtrails {
        # ── Trail color ────────────────────────────────────────────────────
        # Color of the motion trail (matches active border color)
        color               = rgba(203,164,247,0.25)    # Mauve 25% opacity

        # ── Trail length ──────────────────────────────────────────────────
        # How many historical positions to render (controls trail length)
        # Higher = longer trail, more GPU cost
        # 20–30 = good visual effect with minimal overhead
        history_points      = 20

        # ── Trail rendering interval ──────────────────────────────────────
        # Sample window position every N frames for trail rendering
        # 2 = sample every 2nd frame (30 positions/sec at 60fps)
        history_step        = 2

        # ── Bezier interpolation ──────────────────────────────────────────
        # Smooth trail using bezier curves between sampled positions
        bezier_step         = 0.05
    }
}

