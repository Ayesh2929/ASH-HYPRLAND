# ══════════════════════════════════════════════════════════════════════════════
# §01  PLUGIN SYSTEM OVERVIEW
# ══════════════════════════════════════════════════════════════════════════════
#
#  Hyprland Plugin Architecture:
#  ┌─────────────────────────────────────────────────────────────────────────┐
#  │  hyprpm (official plugin manager)                                       │
#  │    → downloads plugin source from GitHub                                │
#  │    → builds against current Hyprland headers                            │
#  │    → installs .so files to ~/.local/share/hyprpm/plugins/               │
#  │    → manages enable/disable state                                        │
#  │                                                                          │
#  │  Hyprland loads plugins via:                                             │
#  │    plugin = /path/to/plugin.so  ← in this file                          │
#  │    OR hyprctl plugin load PATH                                           │
#  │    OR hyprpm enable PLUGIN_NAME (manages loading automatically)          │
#  └─────────────────────────────────────────────────────────────────────────┘
#
#  ── Plugin variables in hypr configs ──────────────────────────────────────────
#  $HYPRPM_PLUGIN_DIR = ~/.local/share/hyprpm/plugins
#
#  ── Plugin loading format ─────────────────────────────────────────────────────
#  plugin = ABSOLUTE_PATH_TO_PLUGIN.so
#
#  ── hyprpm commands ───────────────────────────────────────────────────────────
#  hyprpm add    URL              — add plugin repo
#  hyprpm remove PLUGIN_NAME      — remove plugin
#  hyprpm enable PLUGIN_NAME      — enable (builds if needed)
#  hyprpm disable PLUGIN_NAME     — disable plugin
#  hyprpm update                  — update all plugins
#  hyprpm update PLUGIN_NAME      — update one plugin
#  hyprpm list                    — list installed plugins
#  hyprpm reload                  — reload plugin state
#
#  ── ASH plugin wrappers ───────────────────────────────────────────────────────
#  ash plugin install  NAME        — install + enable via hyprpm
#  ash plugin remove   NAME        — disable + remove
#  ash plugin update               — update all
#  ash plugin list                 — pretty list with status
#  ash plugin browse               — interactive browser
#  ash plugin info     NAME        — show plugin details
#  ash plugin publish  PATH        — publish to ASH store
#
# ══════════════════════════════════════════════════════════════════════════════
# §02  PLUGIN LOADING
#      Each plugin = line loads a compiled .so at Hyprland startup.
#      Comment out plugins you don't have installed.
# ══════════════════════════════════════════════════════════════════════════════

# ── Official Hyprland plugins (hyprwm/hyprland-plugins repo) ─────────────────
# Install: hyprpm add https://github.com/hyprwm/hyprland-plugins

# Workspace overview with expose effect
plugin = ~/.local/share/hyprpm/plugins/hyprexpo.so

# Window title bars (adds macOS-style titlebars to tiled windows)
plugin = ~/.local/share/hyprpm/plugins/hyprbars.so

# Embed windows as wallpaper background (mpv, cava, etc.)
plugin = ~/.local/share/hyprpm/plugins/hyprwinwrap.so

# Window movement trails / particle effects
plugin = ~/.local/share/hyprpm/plugins/hyprtrails.so

# ── i3-like layout plugin ─────────────────────────────────────────────────────
# Install: hyprpm add https://github.com/outfoxxed/hy3
# plugin = ~/.local/share/hyprpm/plugins/hy3.so

# ── Scrolling layout plugin ───────────────────────────────────────────────────
# Install: hyprpm add https://github.com/dawsers/hyprscroller
# plugin = ~/.local/share/hyprpm/plugins/hyprscroller.so

# ── Focus effects / dimming ───────────────────────────────────────────────────
# Install: hyprpm add https://github.com/VortexCoyote/hyprfocus
# plugin = ~/.local/share/hyprpm/plugins/hyprfocus.so

# ── Taskbar-style window management ──────────────────────────────────────────
# Install: hyprpm add https://github.com/dasisdormax/hyprtasking
# plugin = ~/.local/share/hyprpm/plugins/hyprtasking.so

# ── Advanced gesture support ──────────────────────────────────────────────────
# Install: hyprpm add https://github.com/horriblename/hyprgrass
# plugin = ~/.local/share/hyprpm/plugins/hyprgrass.so

# ── Space / workspace overview ────────────────────────────────────────────────
# Install: hyprpm add https://github.com/KGAFT/hyprspace
# plugin = ~/.local/share/hyprpm/plugins/hyprspace.so

# ── Dynamic cursors (cursor change on window events) ─────────────────────────
# Install: hyprpm add https://github.com/VirtCode/hypr-dynamic-cursors
# plugin = ~/.local/share/hyprpm/plugins/dynamic-cursors.so

# ── Split monitor workspaces ──────────────────────────────────────────────────
