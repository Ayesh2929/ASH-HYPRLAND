# ══════════════════════════════════════════════════════════════════════════════
# §13  ASH PLUGIN ECOSYSTEM BRIDGE
#      ASH manages additional plugins beyond hyprpm
#      These load via the ASH plugin daemon (ash-plugin-daemon.service)
# ══════════════════════════════════════════════════════════════════════════════

# ── ASH plugin registry ───────────────────────────────────────────────────────
# ASH plugins are shell scripts / systemd services, not .so files.
# They hook into Hyprland via IPC (hyprctl dispatch / hyprland socket).
# Managed by: ash plugin [install|remove|update|list|enable|disable]

# ── Core ASH plugins (auto-loaded by ash-plugin-daemon) ──────────────────────
# game-mode         — disable compositor effects, optimize for gaming
# caffeine          — prevent screen lock / DPMS
# auto-wallpaper    — dynamic wallpaper based on time/weather/music
# blur-toggle       — toggle blur based on active application
# focus-timer       — Pomodoro timer with UI integration
# night-light       — blue light filter with schedule
# do-not-disturb    — silence notifications
# color-picker      — integrated color picker with clipboard
# weather-display   — weather data in bar/notifications
# media-controls    — advanced media key handling
# pomodoro-plus     — full Pomodoro implementation

# ══════════════════════════════════════════════════════════════════════════════
# §14  PLUGIN HEALTH MONITORING
# ══════════════════════════════════════════════════════════════════════════════

# ── Check plugin status ───────────────────────────────────────────────────────
# hyprctl plugin list                        → list loaded .so plugins
# hyprpm list                                → list hyprpm-managed plugins
# ash plugin list                            → all ASH + hyprpm plugins
# journalctl -t hyprland | grep -i plugin    → plugin load/error logs

# ── Plugin failed to load ─────────────────────────────────────────────────────
# Cause:  Hyprland version mismatch (plugin built against different headers)
# Fix:    hyprpm update PLUGIN_NAME          → rebuild against current headers
# Fix:    hyprpm disable PLUGIN_NAME         → disable broken plugin

# ── Plugin causes compositor crash ───────────────────────────────────────────
# Identify: journalctl -b-1 -t hyprland | tail -50
# Disable:  Comment out plugin = line, hyprctl reload
# Report:   ash bug-report --plugin PLUGIN_NAME

# ── Rebuild all plugins after Hyprland update ────────────────────────────────
# hyprpm update                              → rebuild everything
# ash update plugins                         → ASH wrapper (same + validation)

# ══════════════════════════════════════════════════════════════════════════════
# §15  PLUGIN INSTALLATION QUICK REFERENCE
# ══════════════════════════════════════════════════════════════════════════════

# ── Official plugins (one-time setup) ─────────────────────────────────────────
# hyprpm add https://github.com/hyprwm/hyprland-plugins
# hyprpm enable hyprexpo
# hyprpm enable hyprbars
# hyprpm enable hyprwinwrap
# hyprpm enable hyprtrails

# ── Community plugins ─────────────────────────────────────────────────────────
# hyprpm add https://github.com/outfoxxed/hy3              && hyprpm enable hy3
# hyprpm add https://github.com/dawsers/hyprscroller       && hyprpm enable hyprscroller
# hyprpm add https://github.com/VortexCoyote/hyprfocus     && hyprpm enable hyprfocus
# hyprpm add https://github.com/horriblename/hyprgrass     && hyprpm enable hyprgrass
# hyprpm add https://github.com/dasisdormax/hyprtasking    && hyprpm enable hyprtasking
# hyprpm add https://github.com/VirtCode/hypr-dynamic-cursors && hyprpm enable dynamic-cursors
# hyprpm add https://github.com/Duckonaut/split-monitor-workspaces && hyprpm enable split-monitor-workspaces

# ── ASH automated install ─────────────────────────────────────────────────────
# ash plugin install hyprexpo hyprbars hyprwinwrap hyprtrails
# ash plugin install hy3 hyprscroller hyprfocus hyprgrass

