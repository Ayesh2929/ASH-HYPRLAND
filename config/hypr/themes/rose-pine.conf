# Rose Pine Theme

$bg = rgba(191724ee)
$fg = rgba(e0def4ee)
$accent = rgba(ebbcbaee)
$surface = rgba(1f1d2eee)

general {
    col.active_border = $accent $accent 45deg
    col.inactive_border = $surface
}

decoration {
    col.shadow = $bg
}

windowrulev2 = opacity 0.95, class:^(kitty|alacritty|foot)$