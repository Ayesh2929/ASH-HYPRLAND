# Everforest Theme

$bg = rgba(2d353bee)
$fg = rgba(d3c6aaee)
$accent = rgba(a7c080ee)
$surface = rgba(343f44ee)

general {
    col.active_border = $accent $accent 45deg
    col.inactive_border = $surface
}

decoration {
    col.shadow = $bg
}

windowrulev2 = opacity 0.95, class:^(kitty|alacritty|foot)$