# ══════════════════════════════════════════════════════════════════════════════
# §01  WALLPAPER SYSTEM CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

# ── Backend selection ─────────────────────────────────────────────────────────
#  swww        — GPU-accelerated, animated transitions, animated wallpapers
#  hyprpaper   — Official Hyprland wallpaper daemon, instant load, no anim
#  swaybg      — Simple static, no transitions, lowest resource use
#  mpvpaper    — Video wallpaper via mpv (high resource use)
$wallpaperBackend       = swww

# ── Global paths ─────────────────────────────────────────────────════════════
$wallpaperDir           = $HOME/.local/share/ash-dotfiles/wallpapers
$wallpaperCache         = $HOME/.cache/ash-dotfiles/wallpapers
$wallpaperActive        = $HOME/.cache/ash-dotfiles/current-wallpaper.jpg
$wallpaperQueue         = $HOME/.cache/ash-dotfiles/wallpaper-queue.txt
$wallpaperHistory       = $HOME/.local/state/ash-dotfiles/wallpaper-history.log
$wallpaperGenerated     = $HOME/.local/share/ash-dotfiles/wallpapers/generated

# ── Default wallpaper (fallback when no theme wallpaper set) ──────────────────
$wallpaperDefault       = ~/.config/ash-dotfiles/assets/wallpapers/default-dark.jpg
$wallpaperDefaultLight  = ~/.config/ash-dotfiles/assets/wallpapers/default-light.jpg
$wallpaperDefaultMin    = ~/.config/ash-dotfiles/assets/wallpapers/default-minimal.jpg

# ══════════════════════════════════════════════════════════════════════════════
# §02  CURRENT WALLPAPER ASSIGNMENT
#      Updated atomically by ASH wallpaper engine on every change.
#      Per-monitor support: assign different wallpapers per output.
# ══════════════════════════════════════════════════════════════════════════════

# ── Single monitor (most common setup) ───────────────────────────────────────
$wallpaperCurrent       = ~/.config/ash-dotfiles/assets/wallpapers/default-dark.jpg

# ── Multi-monitor assignments ─────────────────────────────────────────────────
#  Format: $wallpaperMONNAME = PATH
#  Monitor names from: hyprctl monitors | jq '.[].name'
$wallpaperDP1           = ~/.config/ash-dotfiles/assets/wallpapers/default-dark.jpg
$wallpaperHDMIA1        = ~/.config/ash-dotfiles/assets/wallpapers/default-dark.jpg
$wallpaperDP2           = ~/.config/ash-dotfiles/assets/wallpapers/default-minimal.jpg
$wallpaperEDP1          = ~/.config/ash-dotfiles/assets/wallpapers/default-dark.jpg

# ══════════════════════════════════════════════════════════════════════════════
# §03  SWWW TRANSITION CONFIGURATION
#      Controls the animation when wallpaper changes
# ══════════════════════════════════════════════════════════════════════════════

# ── Transition type ───────────────────────────────────────────────────────────
#  none         — instant swap, no animation
#  fade         — cross-fade between wallpapers
#  left         — wipe from left edge
#  right        — wipe from right edge
#  top          — wipe from top edge
#  bottom       — wipe from bottom edge
#  wipe         — directional wipe (with angle)
#  wave         — wave/ripple effect
#  grow         — radial grow from center or point
#  center       — grow from screen center
#  any          — random transition each time
#  outer        — grow from corners inward
$wallpaperTransition    = fade

# ── Transition duration ───────────────────────────────────────────────────────
#  In seconds (accepts decimals)
#  0.1 = near-instant  │  0.5 = default  │  2.0 = cinematic
$wallpaperTransDuration = 0.800

# ── Transition FPS ────────────────────────────────────────────────────────────
$wallpaperTransFPS      = 60

# ── Transition position (for grow/center/wipe) ───────────────────────────────
#  Format: X,Y in pixels  OR  percentage: 0.5,0.5
#  grow from cursor:  use swww img --transition-pos $(hyprctl cursorpos)
$wallpaperTransPos      = 0.5,0.5

# ── Transition bezier ─────────────────────────────────────────────────────────
#  Cubic bezier for easing: x0,y0,x1,y1
$wallpaperTransBezier   = 0.16,1.00,0.30,1.00

# ── Transition angle (for wipe) ───────────────────────────────────────────────
#  0 = left-to-right  │  90 = top-to-bottom  │  45 = diagonal
$wallpaperTransAngle    = 0

# ── Wave parameters ───────────────────────────────────────────────────────────
#  Format: WIDTH,HEIGHT in pixels
$wallpaperWaveSize      = 20,20

# ══════════════════════════════════════════════════════════════════════════════
# §04  PER-CONTEXT TRANSITION PRESETS
#      Different transitions for different wallpaper change triggers
# ══════════════════════════════════════════════════════════════════════════════

# ── Theme change transition (called by: ash theme apply) ─────────────────────
$themeTransition        = fade
$themeTransDuration     = 1.200
$themeTransBezier       = 0.000,0.850,0.150,1.000

# ── Random wallpaper transition (called by: ash wallpaper random) ─────────────
$randomTransition       = any           # Random type each time
$randomTransDuration    = 0.600

# ── Slideshow transition (called by: ash wallpaper slideshow) ─────────────────
$slideshowTransition    = fade
$slideshowTransDuration = 1.500
$slideshowTransBezier   = 0.160,1.000,0.300,1.000

# ── Manual pick transition (called by: ash wallpaper pick) ────────────────────
$pickTransition         = grow
$pickTransDuration      = 0.800
$pickTransPos           = 0.5,0.5

# ── Session restore transition (on login) ─────────────────────────────────────
$loginTransition        = fade
$loginTransDuration     = 1.000

# ══════════════════════════════════════════════════════════════════════════════
# §05  SLIDESHOW CONFIGURATION
#      Automatic wallpaper rotation
# ══════════════════════════════════════════════════════════════════════════════

# ── Slideshow enabled ─────────────────────────────────────────────────────────
$slideshowEnabled       = false         # Toggle via: ash wallpaper slideshow on/off

# ── Interval ─────────────────────────────────────────────────────────────────
#  Seconds between wallpaper changes
#  300 = 5 minutes  │  1800 = 30 minutes  │  3600 = 1 hour
$slideshowInterval      = 300

# ── Slideshow source directory ────────────────────────────────────────────────
$slideshowDir           = $wallpaperDir/dark

# ── Ordering ──────────────────────────────────────────────────────────────────
#  random    — random selection (no repeat until all shown)
#  alpha     — alphabetical order
#  modified  — most recently modified first
#  size      — by file size
$slideshowOrder         = random

# ── Filter by theme ───────────────────────────────────────────────────────────
#  true = only show wallpapers matching current theme palette
$slideshowThemeMatch    = false

# ── Pause conditions ──────────────────────────────────────────────────────────
#  true = pause slideshow during these conditions
$slideshowPauseFullscreen = true       # Don't change while fullscreen app
$slideshowPauseGame       = true       # Don't change in game mode
$slideshowPausePowerSave  = false      # Continue in battery mode

# ══════════════════════════════════════════════════════════════════════════════
# §06  WALLPAPER PROCESSING OPTIONS
#      Pre-processing applied before setting wallpaper
# ══════════════════════════════════════════════════════════════════════════════

# ── Blur (for lock screen blur preview) ───────────────────────────────────────
$wallpaperBlurEnabled   = true
$wallpaperBlurRadius    = 20           # px — lock screen blur amount
$wallpaperBlurFile      = $wallpaperCache/blurred-current.png

# ── Resize mode ───────────────────────────────────────────────────────────────
#  fill    — fill screen, crop if needed (maintains aspect ratio)
#  fit     — fit within screen, letterbox if needed
#  stretch — stretch to fill exactly (distorts if different aspect)
#  center  — center original size, black borders
#  tile    — tile pattern
$wallpaperFit           = fill

# ── Color extraction (for AI theme generation) ───────────────────────────────
#  true = extract dominant colors after wallpaper change
#  Used by: ash theme ai-wallpaper
$wallpaperExtractColors = true
$wallpaperColorCount    = 8             # Number of colors to extract
$wallpaperColorCache    = $wallpaperCache/extracted-colors.json

# ══════════════════════════════════════════════════════════════════════════════
# §07  ANIMATED WALLPAPER CONFIGURATION
#      For GIF/MP4 animated backgrounds via mpvpaper or swww
# ══════════════════════════════════════════════════════════════════════════════

# ── Animated wallpaper enabled ────────────────────────────────────────────────
$animWallpaperEnabled   = false

# ── Source file ───────────────────────────────────────────────────────────────
$animWallpaperFile      = $wallpaperDir/animated/default.gif

# ── MPV options (for mpvpaper backend) ───────────────────────────────────────
$animWallpaperMpvOpts   = --loop-file=inf --mute --no-osc --no-input-default-bindings

# ── GIF via swww (native support) ─────────────────────────────────────────────
$animWallpaperSwwwOpts  = --transition-type none

# ── FPS cap ───────────────────────────────────────────────────────────────────
$animWallpaperFPS       = 30            # Cap FPS to reduce GPU load

# ── Pause on battery ──────────────────────────────────────────────────────────
$animWallpaperPauseBat  = true          # Stop animation when on battery

# ══════════════════════════════════════════════════════════════════════════════
# §08  WALLPAPER SOURCES
#      Online sources for ash wallpaper download command
# ══════════════════════════════════════════════════════════════════════════════

# ── Unsplash configuration ───────────────────────────────────────────────────
$unsplashEnabled        = true
$unsplashKey            =               # Set via: ash cloud configure --unsplash-key
$unsplashQuery          = dark abstract minimal
$unsplashOrientation    = landscape
$unsplashResolution     = 3840x2160

# ── Wallhaven configuration ───────────────────────────────────────────────────
$wallhavenEnabled       = true
$wallhavenKey           =               # Set via: ash cloud configure --wallhaven-key
$wallhavenCategories    = 111           # 1=general 2=anime 4=people (bitflag)
$wallhavenPurity        = 100           # 1=sfw 2=sketchy 4=nsfw (bitflag)
$wallhavenSorting       = toplist       # date_added | relevance | random | toplist
$wallhavenResolutions   = 3840x2160,2560x1440

# ── Reddit wallpaper scraper ──────────────────────────────────────────────────
$redditEnabled          = false
$redditSubs             = wallpaper,wallpapers,MinimalWallpaper,mochawallpaper
$redditSort             = top           # hot | new | top | rising
$redditTime             = week          # hour | day | week | month | all

# ── AI generation (Stable Diffusion / DALL-E) ────────────────────────────────
$aiGenEnabled           = false
$aiGenBackend           = stable-diffusion  # stable-diffusion | dalle | midjourney
$aiGenPromptBase        = minimal wallpaper abstract dark
$aiGenResolution        = 1920x1080
$aiGenSteps             = 30
$aiGenCFG               = 7.5

# ══════════════════════════════════════════════════════════════════════════════
# §09  WALLPAPER APPLY DIRECTIVES
#      Executed when this config is sourced (on theme apply / hyprctl reload)
# ══════════════════════════════════════════════════════════════════════════════

# ── Apply wallpaper via swww ──────────────────────────────────────────────────
exec = \
    if pgrep -x swww-daemon > /dev/null; then \
        swww img "$wallpaperCurrent" \
            --transition-type $wallpaperTransition \
            --transition-duration $wallpaperTransDuration \
            --transition-fps $wallpaperTransFPS \
            --transition-bezier $wallpaperTransBezier \
            --transition-pos $wallpaperTransPos; \
    else \
        swww-daemon --format xrgb & \
        sleep 0.5 && \
        swww img "$wallpaperCurrent" \
            --transition-type none; \
    fi

# ── Generate blur preview for hyprlock ───────────────────────────────────────
exec = \
    [ "$wallpaperBlurEnabled" = "true" ] && \
    convert \
        "$wallpaperCurrent" \
        -resize 1920x1080 \
        -blur 0x$wallpaperBlurRadius \
        "$wallpaperBlurFile" \
        2>/dev/null || true

# ── Update ASH state ──────────────────────────────────────────────────────────
exec = \
    echo "$wallpaperCurrent" > "$wallpaperActive" && \
    echo "$(date -Iseconds) $wallpaperCurrent" >> "$wallpaperHistory"

# ── Notify wallpaper change (silent) ─────────────────────────────────────────
exec = \
    notify-send "ASH" \
    "🖼 Wallpaper: $(basename $wallpaperCurrent)" \
    --app-name=ASH-Wallpaper \
    --icon=image-x-generic \
    --urgency=low \
    --expire-time=2000 \
    --hint=string:x-dunst-stack-tag:wallpaper \
    2>/dev/null || true

# ══════════════════════════════════════════════════════════════════════════════
# §10  HYPRPAPER STATIC CONFIGURATION
#      Used when backend = hyprpaper (alternative to swww)
# ══════════════════════════════════════════════════════════════════════════════

# ── Preload list (hyprpaper loads these at startup) ──────────────────────────
#  Uncomment and set to your wallpaper paths if using hyprpaper:
#
# exec-once = hyprpaper
#
# hyprpaper config ($HOME/.config/hypr/hyprpaper.conf):
# preload = ~/.config/ash-dotfiles/assets/wallpapers/default-dark.jpg
# wallpaper = ,~/.config/ash-dotfiles/assets/wallpapers/default-dark.jpg
# splash = false
# splash_offset = 2.0
# ipc = on

# ══════════════════════════════════════════════════════════════════════════════
# §11  WALLPAPER SMART FEATURES
# ══════════════════════════════════════════════════════════════════════════════

# ── Auto dark/light wallpaper switching ──────────────────────────────────────
#  Switches wallpaper variant based on active theme mode
$wallpaperAutoModeSwitch = true

# ── Time-based wallpaper schedule ────────────────────────────────────────────
#  Managed by systemd timer: ash-wallpaper-slideshow.timer
$wallpaperScheduleEnabled = false
$wallpaperScheduleMorning = 06:00       # Switch to morning wallpaper
$wallpaperScheduleDay     = 09:00       # Switch to day wallpaper
$wallpaperScheduleEvening = 18:00       # Switch to evening wallpaper
$wallpaperScheduleNight   = 22:00       # Switch to night wallpaper

# ── Weather-based wallpaper ───────────────────────────────────────────────────
$wallpaperWeatherSync     = false       # Match wallpaper to weather conditions

# ── Music-synced wallpaper ────────────────────────────────────────────────────
$wallpaperMusicSync       = false       # Extract album art and set as wallpaper

# ── Color scheme extraction ───────────────────────────────────────────────────
$wallpaperColorExtract    = false       # Generate theme from wallpaper colors
$wallpaperColorExtractor  = matugen     # matugen | pywal | colorthief

# ══════════════════════════════════════════════════════════════════════════════
# §12  PER-MONITOR WALLPAPER APPLY
#      Directives for multi-monitor setups
# ══════════════════════════════════════════════════════════════════════════════

# ── Apply per-monitor wallpapers ──────────────────────────────────────────────
exec = \
    if hyprctl -j monitors | jq -e 'length > 1' > /dev/null 2>&1; then \
        MON_COUNT=$(hyprctl -j monitors | jq 'length'); \
        for i in $(seq 0 $((MON_COUNT - 1))); do \
            MON_NAME=$(hyprctl -j monitors | jq -r ".[$i].name"); \
            swww img \
                --outputs "$MON_NAME" \
                "$wallpaperCurrent" \
                --transition-type $wallpaperTransition \
                --transition-duration $wallpaperTransDuration \
                2>/dev/null || true; \
        done; \
    fi

# ══════════════════════════════════════════════════════════════════════════════
# EOF — wallpaper.conf
# Set wallpaper:    ash wallpaper set PATH
# Random:           ash wallpaper random
# Slideshow on/off: ash wallpaper slideshow toggle
# Download:         ash wallpaper download --source wallhaven
# Generate:         ash wallpaper generate --prompt "dark forest"
# Current info:     cat ~/.cache/ash-dotfiles/current-wallpaper.jpg
# History:          cat ~/.local/state/ash-dotfiles/wallpaper-history.log
