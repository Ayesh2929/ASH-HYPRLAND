# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Wallpaper Configuration                          ║
# ║                                                                              ║
# ║  Complete wallpaper system: per-monitor assignment, transition config,     ║
# ║  slideshow scheduling, blur overlays, animated wallpapers, AI generation  ║
# ║  triggers, source management and hot-swap orchestration                    ║
# ║                                                                              ║
# ║  Backend: swww (primary) │ hyprpaper (static) │ mpvpaper (animated)        ║
