# Kanagawa Theme

$bg = rgba(1f1f28ee)
$fg = rgba(dcd7baee)
$accent = rgba(7e9cd8ee)
$surface = rgba(2a2a37ee)

general {
    col.active_border = $accent $accent 45deg
    col.inactive_border = $surface
}

decoration {
    col.shadow = $bg
}

windowrulev2 = opacity 0.95, class:^(kitty|alacritty|foot)$