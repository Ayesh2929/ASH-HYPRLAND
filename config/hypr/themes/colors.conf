# ══════════════════════════════════════════════════════════════════════════════
# §01  COLOR FORMAT REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  Hyprland accepts these color formats in $variable = VALUE:
#
#  rgb(RRGGBB)          — hex triplet, no alpha     e.g. rgb(1e1e2e)
#  rgba(RRGGBBAA)       — hex with alpha (00-ff)    e.g. rgba(1e1e2ecc)
#  rgba(RRGGBBAA)       — used in col.* properties
#  0xAARRGGBB           — legacy format (avoid)
#
#  Color gradient syntax (for borders, groupbar):
#  $var $var2 ANGLE deg — e.g. $colorAccent $colorBlue 45deg
#  rgba(hex) rgba(hex) ANGLEdeg
#
#  ALPHA values (hex):
#  ff = 100%    e6 = 90%    cc = 80%    b3 = 70%
#  99 = 60%    80 = 50%    66 = 40%    4d = 30%
#  33 = 20%    1a = 10%    0d = 5%     00 = 0%
#
# ══════════════════════════════════════════════════════════════════════════════
# §02  CATPPUCCIN MOCHA — BASE PALETTE
#      Full palette definition — all 26 colors
#      Source: https://github.com/catppuccin/catppuccin
# ══════════════════════════════════════════════════════════════════════════════

# ── Background layer (darkest → lightest) ─────────────────────────────────────
$colorCrust         = rgb(11111b)    # #11111b  — deepest background
$colorMantle        = rgb(181825)    # #181825  — secondary background
$colorBase          = rgb(1e1e2e)    # #1e1e2e  — primary background
$colorSurface0      = rgb(313244)    # #313244  — surface / inactive element
$colorSurface1      = rgb(45475a)    # #45475a  — raised surface
$colorSurface2      = rgb(585b70)    # #585b70  — elevated surface

# ── Overlay layer (subdued text / icons) ──────────────────────────────────────
$colorOverlay0      = rgb(6c7086)    # #6c7086  — comments, disabled
$colorOverlay1      = rgb(7f849c)    # #7f849c  — subtle text
$colorOverlay2      = rgb(9399b2)    # #9399b2  — muted text

# ── Text layer ────────────────────────────────────────────────────────────────
$colorSubtext0      = rgb(a6adc8)    # #a6adc8  — secondary text
$colorSubtext1      = rgb(bac2de)    # #bac2de  — body text
$colorText          = rgb(cdd6f4)    # #cdd6f4  — primary text

# ── Accent palette (all named colors) ────────────────────────────────────────
$colorRosewater     = rgb(f5e0dc)    # #f5e0dc  — rosewater
$colorFlamingo      = rgb(f2cdcd)    # #f2cdcd  — flamingo
$colorPink          = rgb(f5c2e7)    # #f5c2e7  — pink
$colorMauve         = rgb(cba4f7)    # #cba4f7  — mauve    ← primary accent
$colorRed           = rgb(f38ba8)    # #f38ba8  — red      ← error
$colorMaroon        = rgb(eba0ac)    # #eba0ac  — maroon
$colorPeach         = rgb(fab387)    # #fab387  — peach    ← warning
$colorYellow        = rgb(f9e2af)    # #f9e2af  — yellow
$colorGreen         = rgb(a6e3a1)    # #a6e3a1  — green    ← success
$colorTeal          = rgb(94e2d5)    # #94e2d5  — teal
$colorSky           = rgb(89dceb)    # #89dceb  — sky
$colorSapphire      = rgb(74c7ec)    # #74c7ec  — sapphire
$colorBlue          = rgb(89b4fa)    # #89b4fa  — blue     ← secondary accent
$colorLavender      = rgb(b4befe)    # #b4befe  — lavender

# ══════════════════════════════════════════════════════════════════════════════
# §03  SEMANTIC COLOR TOKENS
#      Named by function, not by hue — use these in config blocks
#      ASH theme engine only needs to update §02 — semantics auto-follow
# ══════════════════════════════════════════════════════════════════════════════

# ── Primary semantic roles ────────────────────────────────────────────────────
$colorAccent        = $colorMauve       # Primary accent (borders, indicators)
$colorAccent2       = $colorBlue        # Secondary accent (gradients)
$colorAccentTri     = $colorSapphire    # Tertiary accent (hover states)
$colorAccentMuted   = $colorLavender    # Muted accent (inactive tabs)

# ── State colors ──────────────────────────────────────────────────────────────
$colorSuccess       = $colorGreen       # ✅ Success states
$colorWarning       = $colorPeach       # ⚠  Warning states
$colorError         = $colorRed         # ❌ Error states
$colorInfo          = $colorSky         # ℹ  Info states
$colorDestructive   = $colorMaroon      # 💥 Destructive actions

# ── Background semantic roles ─────────────────────────────────────────────────
$colorBg            = $colorBase        # Primary background
$colorBgAlt         = $colorMantle      # Secondary background
$colorBgDeep        = $colorCrust       # Deepest background layer
$colorBgElevated    = $colorSurface0    # Elevated surface
$colorBgFloat       = $colorSurface1    # Floating elements
$colorBgHighlight   = $colorSurface2    # Highlighted surface

# ── Text semantic roles ───────────────────────────────────────────────────────
$colorFg            = $colorText        # Primary foreground text
$colorFgMuted       = $colorSubtext0    # Secondary/muted text
$colorFgSubtle      = $colorOverlay1    # Subtle/placeholder text
$colorFgDisabled    = $colorOverlay0    # Disabled state text
$colorFgInverse     = $colorBase        # Text on accent background

# ── Border semantic roles ─────────────────────────────────────────────────────
$colorBorderActive  = $colorAccent      # Active/focused window border
$colorBorderInactive = $colorSurface0   # Inactive window border
$colorBorderFloat   = $colorSurface1    # Floating window border
$colorBorderUrgent  = $colorRed         # Urgent/attention border
$colorBorderGroup   = $colorMauve       # Group/tab border

# ══════════════════════════════════════════════════════════════════════════════
# §04  RGBA TRANSPARENCY VARIANTS
#      Pre-computed alpha variants for glassmorphism, blur layers, overlays
# ══════════════════════════════════════════════════════════════════════════════

# ── Base transparency stack ───────────────────────────────────────────────────
$colorBase95        = rgba(1e1e2ef2)    # Base at 95% — frosted glass
$colorBase90        = rgba(1e1e2ee6)    # Base at 90% — panels / bars
$colorBase85        = rgba(1e1e2ed9)    # Base at 85% — menus
$colorBase80        = rgba(1e1e2ecc)    # Base at 80% — overlays
$colorBase75        = rgba(1e1e2ebf)    # Base at 75%
$colorBase70        = rgba(1e1e2eb3)    # Base at 70% — modals
$colorBase60        = rgba(1e1e2e99)    # Base at 60% — translucent
$colorBase50        = rgba(1e1e2e80)    # Base at 50% — semi-transparent
$colorBase30        = rgba(1e1e2e4d)    # Base at 30% — ghost
$colorBaseZero      = rgba(1e1e2e00)    # Base at 0%  — transparent

# ── Accent transparency stack ─────────────────────────────────────────────────
$colorAccent80      = rgba(cba4f7cc)    # Accent at 80% — active highlights
$colorAccent60      = rgba(cba4f799)    # Accent at 60% — hover states
$colorAccent40      = rgba(cba4f766)    # Accent at 40% — selection bg
$colorAccent20      = rgba(cba4f733)    # Accent at 20% — subtle tint
$colorAccent10      = rgba(cba4f71a)    # Accent at 10% — barely visible
$colorAccentZero    = rgba(cba4f700)    # Accent at 0%  — transparent

# ── Surface transparency stack ────────────────────────────────────────────────
$colorSurface080    = rgba(313244cc)    # Surface0 at 80%
$colorSurface060    = rgba(31324499)    # Surface0 at 60%
$colorSurface040    = rgba(31324466)    # Surface0 at 40%
$colorSurface020    = rgba(31324433)    # Surface0 at 20%

# ── Multi-accent gradient pairs ───────────────────────────────────────────────
$gradientAccent     = $colorAccent $colorBlue                   # Mauve → Blue
$gradientWarm       = $colorPeach $colorYellow                  # Peach → Yellow
$gradientCool       = $colorSapphire $colorTeal                 # Sapphire → Teal
$gradientError      = $colorRed $colorMaroon                    # Red → Maroon
$gradientSuccess    = $colorGreen $colorTeal                    # Green → Teal
$gradientRainbow    = $colorMauve $colorBlue $colorTeal         # Full arc

# ══════════════════════════════════════════════════════════════════════════════
# §05  WINDOW DECORATION COLORS
#      Used directly by Hyprland config blocks in hyprland.conf
# ══════════════════════════════════════════════════════════════════════════════

# ── Active window borders ─────────────────────────────────────────────────────
$colActiveBorder    = $colorMauve $colorBlue 45deg
# Alternate gradients:
# $colActiveBorder  = $colorSapphire $colorTeal 45deg
# $colActiveBorder  = $colorPink $colorMauve 45deg
# $colActiveBorder  = $colorMauve $colorBlue $colorSapphire 90deg

# ── Inactive window borders ───────────────────────────────────────────────────
$colInactiveBorder  = $colorSurface0

# ── Group borders ─────────────────────────────────────────────────────────────
$colGroupActive     = $colorMauve $colorBlue 45deg
$colGroupInactive   = $colorSurface1
$colGroupLocked     = $colorRed $colorMaroon 45deg
$colGroupLockedInact = $colorSurface0

# ── Groupbar tab colors ───────────────────────────────────────────────────────
$colGroupbarActive  = $colorMauve $colorBlue 45deg
$colGroupbarInactive = $colorSurface0
$colGroupbarText    = $colorText

# ══════════════════════════════════════════════════════════════════════════════
# §06  SPECIAL CONTEXT COLORS
#      Named for specific UI contexts across the ASH ecosystem
# ══════════════════════════════════════════════════════════════════════════════

# ── Notifications ─────────────────────────────────────────────────────────────
$colorNotifBg       = $colorMantle
$colorNotifBorder   = $colorAccent
$colorNotifCritical = $colorRed
$colorNotifUrgent   = $colorPeach
$colorNotifNormal   = $colorAccent

# ── Status bar indicators ────────────────────────────────────────────────────
$colorBarBg         = $colorMantle
$colorBarText       = $colorText
$colorBarMuted      = $colorOverlay1
$colorBarAccent     = $colorAccent
$colorBarWarning    = $colorPeach
$colorBarDanger     = $colorRed

# ── Workspace indicators ──────────────────────────────────────────────────────
$colorWsActive      = $colorAccent
$colorWsOccupied    = $colorBlue
$colorWsEmpty       = $colorSurface2
$colorWsUrgent      = $colorRed
$colorWsSpecial     = $colorTeal

# ── Lock screen ───────────────────────────────────────────────────────────────
$colorLockBg        = $colorCrust
$colorLockInput     = $colorSurface0
$colorLockInputFg   = $colorText
$colorLockClock     = $colorText
$colorLockSubtext   = $colorSubtext0
$colorLockOuter     = $colorMauve
$colorLockInner     = $colorBlue
$colorLockFail      = $colorRed
$colorLockOk        = $colorGreen

# ── Rofi launcher ────────────────────────────────────────────────────────────
$colorRofiBg        = $colorMantle
$colorRofiInput     = $colorSurface0
$colorRofiSelected  = $colorSurface1
$colorRofiFg        = $colorText
$colorRofiPrompt    = $colorAccent
$colorRofiMatch     = $colorPeach
$colorRofiBorder    = $colorAccent

# ── Screenshot annotation ────────────────────────────────────────────────────
$colorAnnotatePen   = $colorRed
$colorAnnotateText  = $colorYellow
$colorAnnotateArrow = $colorAccent
$colorAnnotateBg    = $colorBase80

# ── Terminal colors (exported to kitty, wezterm, etc.) ───────────────────────
$colorTermBg        = $colorBase
$colorTermFg        = $colorText
$colorTermCursor    = $colorRosewater
$colorTermCursorFg  = $colorCrust
$colorTermSelection = $colorSurface2
$colorTermSelFg     = $colorText

# ── Code editor (Neovim theme sync) ──────────────────────────────────────────
$colorEditorBg      = $colorBase
$colorEditorFg      = $colorText
$colorEditorLineNum = $colorOverlay0
$colorEditorCurLine = $colorMantle
$colorEditorBg2     = $colorSurface0

# ══════════════════════════════════════════════════════════════════════════════
# §07  ASH THEME ENGINE METADATA
#      Read by ASH to identify current theme and last update time
# ══════════════════════════════════════════════════════════════════════════════

$ashThemeName       = catppuccin-mocha
$ashThemeVariant    = mocha
$ashThemeFamily     = catppuccin
$ashThemeMode       = dark
$ashThemeAccentName = mauve
$ashThemeVersion    = 5.0.0

