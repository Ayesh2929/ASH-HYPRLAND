# Tokyo Night Theme

$bg = rgba(1a1b26ee)
$fg = rgba(c0caf5ee)
$accent = rgba(7aa2f7ee)
$surface = rgba(24283bee)

general {
    col.active_border = $accent $accent 45deg
    col.inactive_border = $surface
}

decoration {
    col.shadow = $bg
}

windowrulev2 = opacity 0.95, class:^(kitty|alacritty|foot)$