# Catppuccin Mocha Theme

$bg = rgba(1e1e2eee)
$fg = rgba(cdd6f4ee)
$accent = rgba(89b4faee)
$surface = rgba(313244ee)

general {
    col.active_border = $accent $accent 45deg
    col.inactive_border = $surface
}

decoration {
    col.shadow = $bg
}

windowrulev2 = opacity 0.95, class:^(kitty|alacritty|foot)$