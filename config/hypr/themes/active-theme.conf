# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Active Theme Runtime Configuration               ║
# ║                                                                              ║
# ║  This file bridges the ASH Theme Engine with Hyprland's live config.       ║
# ║  Updated atomically on every theme change — never edit manually.            ║
# ║                                                                              ║
# ║  Contents:                                                                   ║
# ║  • Active theme identity & metadata                                         ║
# ║  • Applied Hyprland visual settings                                         ║
# ║  • Per-component theme overrides                                            ║
# ║  • Theme capability flags                                                   ║
# ║  • Cross-app sync state                                                     ║
# ║                                                                              ║
# ║  Current theme: catppuccin-mocha                                            ║
# ║  Applied at:    managed by ASH engine                                       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  THEME IDENTITY
#      Core metadata about the currently active theme
# ══════════════════════════════════════════════════════════════════════════════

$ashCurrentTheme        = catppuccin-mocha
$ashCurrentVariant      = mocha
$ashCurrentFamily       = catppuccin
$ashCurrentMode         = dark              # dark | light | auto
$ashCurrentAccent       = mauve
$ashCurrentStyle        = default           # default | glassmorphism | neumorphism | minimal
$ashCurrentVersion      = 5.0.0
$ashThemePath           = ~/.local/share/ash-dotfiles/themes/dark/catppuccin-mocha
$ashThemeAppliedAt      = 2024-01-01T00:00:00Z   # ISO8601 — set by engine

# ══════════════════════════════════════════════════════════════════════════════
# §02  DECORATION OVERRIDES
#      Theme-specific values applied to Hyprland's decoration block.
#      These override the base values in decorations.conf.
# ══════════════════════════════════════════════════════════════════════════════

# ── Corner rounding ───────────────────────────────────────────────────────────
#  catppuccin-mocha signature: soft rounded (12px)
#  Flat themes: 0   │  Pill themes: 24+  │  Squircle: rounding_power = 3.5
$themeRounding          = 12
$themeRoundingPower     = 2.0

# ── Window opacity ────────────────────────────────────────────────────────────
$themeActiveOpacity     = 1.00
$themeInactiveOpacity   = 0.92
$themeFullscreenOpacity = 1.00

# ── Inactive dim ─────────────────────────────────────────────────────────────
$themeDimInactive       = true
$themeDimStrength       = 0.08
$themeDimSpecial        = 0.35
$themeDimAround         = 0.50

# ── Shadow ────────────────────────────────────────────────────────────────────
$themeShadowEnabled     = true
$themeShadowRange       = 30
$themeShadowPower       = 3
$themeShadowColor       = rgba(0,0,0,0.55)
$themeShadowColorInact  = rgba(0,0,0,0.30)
$themeShadowOffset      = 0 6
$themeShadowScale       = 1.02

# ── Blur ──────────────────────────────────────────────────────────────────────
$themeBlurEnabled       = true
$themeBlurSize          = 8
$themeBlurPasses        = 3
$themeBlurNoise         = 0.0117
$themeBlurContrast      = 0.88
$themeBlurBrightness    = 0.82
$themeBlurVibrancy      = 0.18

# ══════════════════════════════════════════════════════════════════════════════
# §03  BORDER CONFIGURATION
#      Theme's border colors and animation style
# ══════════════════════════════════════════════════════════════════════════════

# ── Active window border ──────────────────────────────────────────────────────
# Gradient: Mauve → Blue at 45° — catppuccin signature
$themeBorderActive      = rgba(cba4f7ff) rgba(89b4faff) 45deg

# ── Inactive window border ────────────────────────────────────────────────────
$themeBorderInactive    = rgba(313244ff)

# ── Floating window border (slightly different from tiled) ───────────────────
$themeBorderFloat       = rgba(45475aff)

# ── Group borders ────────────────────────────────────────────────────────────
$themeGroupActive       = rgba(cba4f7ff) rgba(89b4faff) 45deg
$themeGroupInactive     = rgba(31324499)
$themeGroupLocked       = rgba(f38ba8ff) rgba(eba0acff) 45deg
$themeGroupLockedInact  = rgba(313244cc)

# ── Border width ──────────────────────────────────────────────────────────────
$themeBorderSize        = 2

# ── Animated gradient rotation speed ─────────────────────────────────────────
#  Higher = slower rotation  │  Lower = faster rotation
$themeBorderAngleSpeed  = 80

# ══════════════════════════════════════════════════════════════════════════════
# §04  GENERAL SETTINGS OVERRIDES
#      Theme-driven values for general {} block
# ══════════════════════════════════════════════════════════════════════════════

# ── Gaps ──────────────────────────────────────────────────────────────────────
$themeGapsIn            = 4             # Inner gaps (between windows)
$themeGapsOut           = 12            # Outer gaps (screen edge)
$themeGapsWorkspace     = 0             # Between workspaces

# ── Background color ──────────────────────────────────────────────────────────
#  Shown before wallpaper loads / on empty workspace
$themeBgColor           = rgba(17111bff)

# ══════════════════════════════════════════════════════════════════════════════
# §05  CURSOR THEME
#      Per-theme cursor selection
# ══════════════════════════════════════════════════════════════════════════════

$themeCursorTheme       = Bibata-Modern-Ice
$themeCursorSize        = 24
$themeHyprCursorTheme   = Bibata-Modern-Ice
$themeXCursorTheme      = Bibata-Modern-Ice

# ══════════════════════════════════════════════════════════════════════════════
# §06  ANIMATION PROFILE
#      Which animation preset this theme recommends
# ══════════════════════════════════════════════════════════════════════════════

$themeAnimProfile       = smooth        # default | smooth | bouncy | snappy | cinematic | minimal | none
$themeAnimEnabled       = true

# ══════════════════════════════════════════════════════════════════════════════
# §07  GTK / QT THEME SYNC
#      Desktop toolkit theme applied with this Hyprland theme
# ══════════════════════════════════════════════════════════════════════════════

$themeGtkTheme          = Catppuccin-Mocha-Standard-Mauve-dark
$themeGtk4Theme         = Catppuccin-Mocha-Standard-Mauve-dark
$themeIconTheme         = Papirus-Dark
$themeQtTheme           = catppuccin-mocha-mauve
$themeKvantumTheme      = CatppuccinMocha-Mauve
$themeFontFamily        = Noto Sans
$themeFontSize          = 11
$themeMonoFont          = JetBrainsMono Nerd Font
$themeMonoSize          = 11

# ══════════════════════════════════════════════════════════════════════════════
# §08  WAYBAR INTEGRATION
#      Tells Waybar which color file and layout to use
# ══════════════════════════════════════════════════════════════════════════════

$themeWaybarConfig      = ~/.config/waybar/config.jsonc
$themeWaybarStyle       = ~/.config/waybar/style.css
$themeWaybarColors      = ~/.config/waybar/colors.css
$themeWaybarLayout      = top-bar           # top-bar | bottom-bar | floating | minimal

# ══════════════════════════════════════════════════════════════════════════════
# §09  TERMINAL THEME SYNC
#      Which terminal color file to link for this theme
# ══════════════════════════════════════════════════════════════════════════════

$themeKittyColors       = ~/.config/kitty/colors.conf
$themeWezTermTheme      = catppuccin-mocha
$themeTmuxTheme         = ~/.config/tmux/themes/ash-dark.tmux
$themeStarshipPreset    = catppuccin

# ══════════════════════════════════════════════════════════════════════════════
# §10  APPLICATION-SPECIFIC OVERRIDES
#      Special per-app settings driven by theme
# ══════════════════════════════════════════════════════════════════════════════

# ── Hyprlock ─────────────────────────────────────────────────────────────────
$themeLockLayout        = default          # default | minimal | photo-frame
$themeLockBgBlur        = 8
$themeLockBgBlurPasses  = 3

# ── Rofi ──────────────────────────────────────────────────────────────────────
$themeRofiStyle         = glassmorphism    # glassmorphism | flat | rounded | sharp

# ── Swaync ────────────────────────────────────────────────────────────────────
$themeNotifStyle        = default

# ── Wlogout ───────────────────────────────────────────────────────────────────
$themeLogoutStyle       = default

# ══════════════════════════════════════════════════════════════════════════════
# §11  THEME CAPABILITY FLAGS
#      Feature flags that vary by theme — read by ASH plugins/modes
# ══════════════════════════════════════════════════════════════════════════════

$themeSupportsLight     = false    # Has a paired light variant
$themeSupportsHDR       = false    # Has HDR-calibrated colors
$themeIsAnimated        = false    # Is itself animated (e.g. video wallpaper)
$themeHasGlassStyle     = true     # Has glassmorphism variant
$themeHasNeonVariant    = false    # Has neon/glow variant
$themeIsAccessible      = true     # Passes WCAG AA contrast requirements
$themeWCAGLevel         = AA       # AA | AAA
$themeHasSeasonalAlt    = false    # Has seasonal color variants

# ══════════════════════════════════════════════════════════════════════════════
# §12  LIVE APPLY DIRECTIVES
#      These exec lines fire when this conf is sourced by hyprctl reload.
#      They handle cross-app sync that can't be done via variables alone.
# ══════════════════════════════════════════════════════════════════════════════

# ── Sync cursor theme to X11/GTK ─────────────────────────────────────────────
exec = gsettings set org.gnome.desktop.interface cursor-theme \
    "Bibata-Modern-Ice"
exec = gsettings set org.gnome.desktop.interface cursor-size 24

# ── Sync GTK theme ────────────────────────────────────────────────────────────
exec = gsettings set org.gnome.desktop.interface gtk-theme \
    "Catppuccin-Mocha-Standard-Mauve-dark"
exec = gsettings set org.gnome.desktop.interface icon-theme \
    "Papirus-Dark"
exec = gsettings set org.gnome.desktop.interface color-scheme \
    "prefer-dark"
exec = gsettings set org.gnome.desktop.interface accent-color \
    "purple"

# ── Reload Waybar ─────────────────────────────────────────────────────────────
exec = pkill -SIGUSR2 waybar 2>/dev/null || true

# ── Reload Swaync ─────────────────────────────────────────────────────────────
exec = swaync-client --reload-config 2>/dev/null || true

# ── Set Kitty remote colors ───────────────────────────────────────────────────
exec = kitty @ --to unix:/tmp/kitty-theme-socket \
    set-colors --all ~/.config/kitty/colors.conf \
    2>/dev/null || true

# ── Apply Spicetify (Spotify) ─────────────────────────────────────────────────
exec = spicetify apply 2>/dev/null || true

# ══════════════════════════════════════════════════════════════════════════════
# EOF — active-theme.conf
# Never edit manually — managed by ASH Theme Engine
# Apply theme:   ash theme apply THEME_NAME
# List themes:   ash theme list
# Validate:      ash doctor check --theme
# Export:        ash theme export --format json > theme-backup.json
