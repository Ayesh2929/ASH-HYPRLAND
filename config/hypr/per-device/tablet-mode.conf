# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Tablet Mode Configuration                        ║
# ║                                                                              ║
# ║  Optimized for: convertible laptops, 2-in-1 devices, Surface Pro,         ║
# ║                 ROG Flow X13, ThinkPad X1 Fold, Yoga series               ║
# ║                                                                              ║
# ║  Hardware:      Touch display, stylus/pen, accelerometer,                  ║
# ║                 on-screen keyboard, rotation sensor                         ║
# ║                                                                              ║
# ║  Auto-detect:   ash doctor fix --device                                     ║
# ║  Toggle:        ash mode tablet  /  bind in keybinds/default.conf         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  MONITOR — TABLET DISPLAY CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

# ── Default portrait orientation (tablet held vertically) ─────────────────────
# monitor = eDP-1, 1920x1080@60, 0x0, 1.0, transform,1   # 90° portrait

# ── Landscape tablet mode (horizontal) ────────────────────────────────────────
monitor = eDP-1, 1920x1080@60, 0x0, 1.0

# ── HiDPI tablet (Surface Pro / high-DPI 2-in-1) ─────────────────────────────
# monitor = eDP-1, 2880x1920@60, 0x0, 2.0

# ── Surface Pro 9 (2880×1920) ─────────────────────────────────────────────────
# monitor = eDP-1, 2880x1920@120, 0x0, 2.0

monitor = , preferred, auto, auto

# ══════════════════════════════════════════════════════════════════════════════
# §02  INPUT — TOUCH & STYLUS CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

# ── Touchscreen ───────────────────────────────────────────────────────────────
touchdevice {
    transform                = 0         # Match monitor transform
    output                   = eDP-1
    enabled                  = true
}

# ── Tablet / stylus / pen ─────────────────────────────────────────────────────
tablet {
    transform                = 0
    output                   = eDP-1    # Bind stylus to built-in display
    left_handed              = false
    active_area_size         = [0, 0]   # Full tablet area
    active_area_position     = [0, 0]
}

# ── Keyboard: larger repeat delay (touch keyboard latency) ────────────────────
input {
    kb_layout                = us
    repeat_delay             = 400      # Slower — prevents typos on touch KB
    repeat_rate              = 30
    sensitivity              = 0.0

    # ── Touchpad settings ─────────────────────────────────────────────────────
    touchpad {
        natural_scroll       = true
        tap-to-click         = true
        clickfinger_behavior = true
        disable_while_typing = false    # Touch keyboard needs concurrent input
        scroll_factor        = 1.0
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# §03  GESTURES — TABLET ENHANCED
# ══════════════════════════════════════════════════════════════════════════════

gestures {
    workspace_swipe              = true
    workspace_swipe_fingers      = 3
    workspace_swipe_distance     = 200   # Shorter = more sensitive for touch
    workspace_swipe_touch        = true  # Enable for touchscreen
    workspace_swipe_invert       = true
    workspace_swipe_min_speed_to_force = 20
    workspace_swipe_cancel_ratio = 0.4
    workspace_swipe_create_new   = true
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 8
    workspace_swipe_forever      = false
}

# ══════════════════════════════════════════════════════════════════════════════
# §04  DECORATION — TABLET FINGER-FRIENDLY
# ══════════════════════════════════════════════════════════════════════════════

decoration {
    # ── Large rounding: finger-friendly tap targets ───────────────────────────
    rounding                 = 16        # iOS-style large radius
    rounding_power           = 3.0       # Squircle
    active_opacity           = 1.0
    inactive_opacity         = 0.96
    fullscreen_opacity       = 1.0
    dim_inactive             = true
    dim_strength             = 0.05

    shadow {
        enabled              = true
        range                = 20
        render_power         = 2
        color                = rgba(0,0,0,0.45)
        color_inactive       = rgba(0,0,0,0.20)
        offset               = 0 4
    }

    blur {
        enabled              = true
        size                 = 8
        passes               = 3
        brightness           = 0.85
        vibrancy             = 0.15
        special              = true
        popups               = true
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# §05  LAYOUT — TABLET TILING (FULLSCREEN FIRST)
# ══════════════════════════════════════════════════════════════════════════════

general {
    # ── No gaps — use full screen real estate ─────────────────────────────────
    gaps_in                  = 2
    gaps_out                 = 6
    border_size              = 2
    col.active_border        = rgba(cba4f7ff) rgba(89b4faff) 45deg
    col.inactive_border      = rgba(31324466)
    # ── Resize on border: easier with finger ──────────────────────────────────
    resize_on_border         = true
    extend_border_grab_area  = 20       # Larger grab zone for fingers
}

dwindle {
    no_gaps_when_only        = 0        # Keep gaps even with 1 window
    smart_resizing           = true
    preserve_split           = true
}

# ══════════════════════════════════════════════════════════════════════════════
# §06  CURSOR — HIDE FOR TABLET
# ══════════════════════════════════════════════════════════════════════════════

cursor {
    inactive_timeout         = 1        # Hide cursor almost immediately
    hide_on_touch            = true     # Critical for tablet mode
    no_hardware_cursors      = false
    zoom_factor              = 1.0      # No zoom needed (touch is accurate)
}

misc {
    vfr                      = true
    vrr                      = 0
    hide_cursor_on_touch     = true
    render_unfocused_fps     = 15
    focus_on_activate        = false
}

# ══════════════════════════════════════════════════════════════════════════════
# §07  ANIMATIONS — TABLET TOUCH-OPTIMIZED
# ══════════════════════════════════════════════════════════════════════════════

animations {
    enabled                  = true
    first_launch_animation   = false

    # ── iOS-inspired spring curves for touch ──────────────────────────────────
    bezier = tabletSpring,   0.360, 1.300, 0.640, 1.000
    bezier = tabletSlide,    0.200, 0.900, 0.100, 1.050
    bezier = tabletFade,     0.250, 0.000, 0.450, 1.000
    bezier = tabletSnap,     0.080, 0.820, 0.170, 1.000

    animation = windowsIn,   1, 5, tabletSpring, popin 70%
    animation = windowsOut,  1, 4, tabletSnap,   popin 82%
    animation = windowsMove, 1, 5, tabletSpring
    animation = fadeIn,      1, 5, tabletFade
    animation = fadeOut,     1, 4, tabletSnap
    animation = fadeDim,     1, 5, tabletFade
    animation = border,      1, 8, tabletSpring
    animation = borderangle, 1, 80, linear, loop
    animation = workspaces,  1, 5, tabletSlide, slidefade 25%
    animation = workspacesIn,  1, 5, tabletSlide, slidefade 25%
    animation = workspacesOut, 1, 4, tabletSnap,  slidefade 25%
    animation = specialWorkspace,    1, 5, tabletSpring, slidefadevert -35%
    animation = specialWorkspaceIn,  1, 5, tabletSpring, slidefadevert -35%
    animation = specialWorkspaceOut, 1, 4, tabletSnap,   slidefadevert -35%
    animation = layers,      1, 3, tabletSnap, fade
    animation = layersIn,    1, 4, tabletSpring, fade
    animation = layersOut,   1, 3, tabletSnap, fade
}

# ══════════════════════════════════════════════════════════════════════════════
# §08  TABLET WINDOW RULES
# ══════════════════════════════════════════════════════════════════════════════

# ── Floating windows: centered and appropriately sized ───────────────────────
windowrulev2 = center,          floating:1
windowrulev2 = minsize 300 200, floating:1     # Minimum touch target size

# ── On-screen keyboard: always on top ────────────────────────────────────────
windowrulev2 = float,           class:^(maliit-keyboard|squeekboard|onboard)$
windowrulev2 = pin,             class:^(maliit-keyboard|squeekboard|onboard)$
windowrulev2 = nofocus,         class:^(maliit-keyboard|squeekboard|onboard)$
windowrulev2 = noborder,        class:^(maliit-keyboard|squeekboard|onboard)$
windowrulev2 = noshadow,        class:^(maliit-keyboard|squeekboard|onboard)$
windowrulev2 = noanim,          class:^(maliit-keyboard|squeekboard|onboard)$
windowrulev2 = move 0 100%-300, class:^(maliit-keyboard|squeekboard|onboard)$

# ══════════════════════════════════════════════════════════════════════════════
# §09  WORKSPACE RULES — TABLET LAYOUT
# ══════════════════════════════════════════════════════════════════════════════

# ── All workspaces: single-window-focused layout ──────────────────────────────
workspace = 1, layoutopt:layout:master, layoutopt:mfact:1.0, gapsin:2, gapsout:6
workspace = 2, layoutopt:layout:master, layoutopt:mfact:0.60, gapsin:2, gapsout:6
workspace = 3, layoutopt:layout:master, layoutopt:mfact:0.55, gapsin:2, gapsout:6

# ── Special workspaces ────────────────────────────────────────────────────────
workspace = special:scratch, gapsin:10, gapsout:20

# ══════════════════════════════════════════════════════════════════════════════
# §10  TABLET KEYBINDS — TOUCH-ACCESSIBLE SHORTCUTS
# ══════════════════════════════════════════════════════════════════════════════

# ── Screen rotation ───────────────────────────────────────────────────────────
bind = $mainMod, F10,           exec, \
    TRANSFORM=$(hyprctl -j monitors | jq -r '.[] | select(.focused) | .transform'); \
    case "$TRANSFORM" in \
        0) hyprctl keyword monitor "eDP-1,preferred,0x0,1,transform,1" && \
           notify-send "ASH" "📱 Portrait (90°)" --expire-time=1500 ;; \
        1) hyprctl keyword monitor "eDP-1,preferred,0x0,1,transform,2" && \
           notify-send "ASH" "🔄 Landscape flip (180°)" --expire-time=1500 ;; \
        2) hyprctl keyword monitor "eDP-1,preferred,0x0,1,transform,3" && \
           notify-send "ASH" "📱 Portrait flip (270°)" --expire-time=1500 ;; \
        3) hyprctl keyword monitor "eDP-1,preferred,0x0,1,transform,0" && \
           notify-send "ASH" "💻 Landscape (0°)" --expire-time=1500 ;; \
        *) hyprctl keyword monitor "eDP-1,preferred,0x0,1,transform,0" ;; \
    esac

# ── On-screen keyboard toggle ────────────────────────────────────────────────
bind = $mainMod, F11,           exec, \
    if pgrep -x squeekboard > /dev/null; then \
        pkill squeekboard; \
    else \
        squeekboard &; \
    fi

# ── Fullscreen toggle (common in tablet use) ──────────────────────────────────
bind = $mainMod, Return,        fullscreen, 1

# ═══════════════════════════════════════════════════════════════════════════════
# §11  EXEC — TABLET MODE ENTRY
# ══════════════════════════════════════════════════════════════════════════════

# ── Auto-rotation daemon ─────────────────────────────────────────────────────
exec-once = iio-sensor-proxy 2>/dev/null || true
exec-once = \
    bash -c '\
    while true; do \
        ORIENTATION=$(monitor-sensor 2>/dev/null | grep "orientation" | head -1); \
        case "$ORIENTATION" in \
            *normal*)        hyprctl keyword monitor "eDP-1,preferred,0x0,auto,transform,0" ;; \
            *bottom-up*)     hyprctl keyword monitor "eDP-1,preferred,0x0,auto,transform,2" ;; \
            *left-up*)       hyprctl keyword monitor "eDP-1,preferred,0x0,auto,transform,1" ;; \
            *right-up*)      hyprctl keyword monitor "eDP-1,preferred,0x0,auto,transform,3" ;; \
        esac; \
        sleep 1; \
    done' &

# ── Touch gestures via hyprgrass (plugin must be loaded) ─────────────────────
# Edge swipe from bottom → launcher
bindgesture = edge:d>u, exec, $launcher

# Edge swipe from top → notification center
bindgesture = edge:u>d, exec, swaync-client --toggle-panel

# Edge swipe from left → back
bindgesture = edge:l>r, exec, \
    hyprctl dispatch workspace previous

# 3-finger swipe → workspace switch
bindgesture = swipe:3:l, workspace, +1
bindgesture = swipe:3:r, workspace, -1

# 3-finger swipe up → show all windows
bindgesture = swipe:3:u, hyprexpo:expo, toggle

exec = notify-send "ASH" \
    "📱 Tablet Mode ACTIVE\nTouch: enabled • Rotation: auto\nCursor: auto-hide • Gestures: touch-optimized\nSqueekboard: Super+F11" \
    --app-name=ASH-Mode \
    --icon=~/.config/ash-dotfiles/assets/icons/ash-system/present-mode.svg \
    --urgency=normal \
    --expire-time=5000

exec = echo "tablet" > ~/.local/state/ash-dotfiles/current-mode

# ══════════════════════════════════════════════════════════════════════════════
# EOF — tablet-mode.conf
# Toggle:     ash mode tablet
# Rotate:     Super + F10
# OSK:        Super + F11
# Restore:    ash mode default
