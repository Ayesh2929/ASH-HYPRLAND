# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Desktop NVIDIA GPU Profile                       ║
# ║                                                                              ║
# ║  Optimized for: RTX 40xx / 30xx / 20xx series (proprietary driver)        ║
# ║  Hardware:      NVIDIA proprietary + GBM, explicit sync, G-Sync            ║
# ║  Driver req:    nvidia-dkms 555+ for explicit sync support                 ║
# ║                                                                              ║
# ║  Auto-detect:   ash doctor fix --device                                     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  MONITOR — NVIDIA DISPLAY PROFILES
# ══════════════════════════════════════════════════════════════════════════════

# ── Primary 4K @ 144Hz (RTX 4080/4090) ───────────────────────────────────────
# monitor = DP-1, 3840x2160@144, 0x0, 1.5, bitdepth,10, vrr,1

# ── Primary QHD @ 240Hz (RTX 4070 Ti / 3080 tier) ───────────────────────────
# monitor = DP-1, 2560x1440@240, 0x0, 1.0, vrr,1

# ── Primary QHD @ 165Hz ───────────────────────────────────────────────────────
monitor = DP-1, 2560x1440@165, 0x0, 1.0, vrr,1

# ── Secondary ─────────────────────────────────────────────────────────────────
monitor = HDMI-A-1, preferred, auto, 1.0
monitor = DP-2,     preferred, auto, 1.0
monitor = ,         preferred, auto, 1.0

# ══════════════════════════════════════════════════════════════════════════════
# §02  NVIDIA GPU ENVIRONMENT (driver 555+)
# ══════════════════════════════════════════════════════════════════════════════

# ── Core NVIDIA Wayland environment ───────────────────────────────────────────
env = GBM_BACKEND,              nvidia-drm      # GBM backend
env = __GLX_VENDOR_LIBRARY_NAME, nvidia         # GLX library
env = LIBVA_DRIVER_NAME,        nvidia          # VA-API hardware decode
env = NVD_BACKEND,              direct          # Firefox/Chrome GPU decode

# ── Performance settings ──────────────────────────────────────────────────────
env = __GL_MaxFramesAllowed,    1               # Low buffering = low latency
env = __GL_SHADER_DISK_CACHE,   1
env = __GL_SHADER_DISK_CACHE_PATH, $HOME/.cache/nv-shader-cache
env = __GL_THREADED_OPTIMIZATIONS, 1
env = __GL_YIELD,               USLEEP

# ── Vulkan ICD ────────────────────────────────────────────────────────────────
env = VK_ICD_FILENAMES,         /usr/share/vulkan/icd.d/nvidia_icd.json

# ── XWayland fix ─────────────────────────────────────────────────────────────
# env = XWAYLAND_NO_GLAMOR,     1    # Only needed for older drivers

# ══════════════════════════════════════════════════════════════════════════════
# §03  OPENGL & RENDER — NVIDIA OPTIMAL
# ══════════════════════════════════════════════════════════════════════════════

opengl {
    nvidia_anti_flicker      = true     # Required on NVIDIA
    force_introspection      = 2        # NVIDIA benefits from shader analysis
}

render {
    explicit_sync            = 2        # Requires driver 555+
    explicit_sync_kms        = 2
    direct_scanout           = false    # Keep false unless confirmed working
    unload_heavy_shaders     = true
    cm_enabled               = true
    cm_fs_passthrough        = 2
    ctm_animation            = 2
}

cursor {
    no_hardware_cursors      = false    # Set true if cursor invisible
    use_cpu_buffer           = 0
    no_break_fs_vrr          = true
    min_refresh_rate         = 60
    inactive_timeout         = 10
}

# ══════════════════════════════════════════════════════════════════════════════
# §04  PERFORMANCE — NVIDIA DESKTOP
# ══════════════════════════════════════════════════════════════════════════════

misc {
    vfr                      = true
    vrr                      = 1        # G-Sync fullscreen
    render_unfocused_fps     = 15
    no_direct_scanout        = false
    focus_on_activate        = false
}

# ══════════════════════════════════════════════════════════════════════════════
# §05  NVIDIA POWER MANAGEMENT
# ══════════════════════════════════════════════════════════════════════════════

exec-once = \
    nvidia-smi --persistence-mode=1 > /dev/null 2>&1 || true
exec-once = \
    nvidia-smi -pl 300 > /dev/null 2>&1 || true    # Power limit — adjust to GPU TDP
exec-once = \
    systemctl enable --now nvidia-persistenced 2>/dev/null || true
exec-once = powerprofilesctl set performance 2>/dev/null || true

exec = notify-send "ASH" \
    "🖥 NVIDIA Desktop profile loaded\nDriver 555+ • Explicit sync\nG-Sync: Fullscreen • Anti-flicker: ON" \
    --urgency=low --expire-time=3000

# ══════════════════════════════════════════════════════════════════════════════
# EOF — desktop-nvidia.conf
