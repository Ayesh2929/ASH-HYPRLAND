# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Dual Monitor Configuration                       ║
# ║                                                                              ║
# ║  Layout templates for 2-monitor setups:                                    ║
# ║  Side-by-side · Stacked · PiP · Laptop+External · Portrait+Landscape      ║
# ║                                                                              ║
# ║  Activate:   source this file  OR  ash monitor layout --dual               ║
# ║  Interactive: ash monitor layout --interactive                             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  DUAL MONITOR LAYOUT TEMPLATES
#      Uncomment exactly ONE layout block
# ══════════════════════════════════════════════════════════════════════════════

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  LAYOUT A — Laptop (left) + External QHD (right) — MOST COMMON         │
# │  [eDP-1 1920×1080] [DP-1 2560×1440]                                    │
# └─────────────────────────────────────────────────────────────────────────┘
monitor = eDP-1,    1920x1080@60,   0x180,    1.0
monitor = DP-1,     2560x1440@144,  1920x0,   1.0,    vrr,1
monitor = ,         preferred,      auto,     1.0

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  LAYOUT B — Twin QHD side by side (home office symmetric)              │
# │  [DP-1 2560×1440] [DP-2 2560×1440]                                    │
# └─────────────────────────────────────────────────────────────────────────┘
# monitor = DP-1,   2560x1440@165,  0x0,      1.0,    vrr,1
# monitor = DP-2,   2560x1440@165,  2560x0,   1.0,    vrr,1

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  LAYOUT C — 4K primary + 1080p secondary (right)                       │
# │  [DP-1 3840×2160] [HDMI-A-1 1920×1080]                                │
# └─────────────────────────────────────────────────────────────────────────┘
# monitor = DP-1,       3840x2160@60,  0x0,      1.5,  vrr,1
# monitor = HDMI-A-1,   1920x1080@60,  2560x540, 1.0

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  LAYOUT D — Primary landscape + Secondary portrait (vertical right)    │
# │  [DP-1 2560×1440] [HDMI-A-1 1080×1920 portrait]                       │
# └─────────────────────────────────────────────────────────────────────────┘
# monitor = DP-1,       2560x1440@144, 0x240,    1.0,  vrr,1
# monitor = HDMI-A-1,   1920x1080@60,  2560x0,   1.0,  transform,1

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  LAYOUT E — Stacked (primary top, secondary bottom)                    │
# │  [DP-1 2560×1440]                                                      │
# │  [HDMI-A-1 1920×1080]                                                  │
# └─────────────────────────────────────────────────────────────────────────┘
# monitor = DP-1,       2560x1440@144, 0x0,      1.0
# monitor = HDMI-A-1,   1920x1080@60,  320x1440, 1.0

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  LAYOUT F — Ultrawide primary + standard secondary                     │
# │  [DP-1 3440×1440 ultrawide] [HDMI-A-1 1920×1080]                      │
# └─────────────────────────────────────────────────────────────────────────┘
# monitor = DP-1,       3440x1440@160, 0x0,      1.0,  vrr,1
# monitor = HDMI-A-1,   1920x1080@60,  3440x180, 1.0

# ══════════════════════════════════════════════════════════════════════════════
# §02  WORKSPACE ASSIGNMENT — DUAL MONITOR
# ══════════════════════════════════════════════════════════════════════════════

# ── Primary monitor (DP-1): workspaces 1-5 ───────────────────────────────────
workspace = 1,  monitor:DP-1,     default:true, persistent:true
workspace = 2,  monitor:DP-1
workspace = 3,  monitor:DP-1
workspace = 4,  monitor:DP-1
workspace = 5,  monitor:DP-1

# ── Secondary monitor (eDP-1/HDMI-A-1): workspaces 6-10 ─────────────────────
workspace = 6,  monitor:eDP-1,    default:true, persistent:true
workspace = 7,  monitor:eDP-1
workspace = 8,  monitor:eDP-1
workspace = 9,  monitor:eDP-1
workspace = 10, monitor:eDP-1

# ── Special workspaces ────────────────────────────────────────────────────────
workspace = special:scratch,    on-created-empty:$terminal
workspace = special:music,      on-created-empty:kitty -e ncmpcpp
workspace = special:monitoring, on-created-empty:kitty -e btop

# ══════════════════════════════════════════════════════════════════════════════
# §03  CURSOR WARP — DUAL MONITOR
# ══════════════════════════════════════════════════════════════════════════════

cursor {
    warp_on_change_workspace = false
    no_warps                 = false
    mouse_move_focuses_monitor = true
}

misc {
    mouse_move_focuses_monitor = true
}

binds {
    window_direction_monitor_fallback = true   # Cross monitors with movefocus
}

# ══════════════════════════════════════════════════════════════════════════════
# §04  DUAL MONITOR KEYBINDS
# ══════════════════════════════════════════════════════════════════════════════

# ── Move workspace to other monitor ──────────────────────────────────────────
bind = $mainMod SHIFT,      comma,      movecurrentworkspacetomonitor,  l
bind = $mainMod SHIFT,      period,     movecurrentworkspacetomonitor,  r

# ── Focus other monitor ───────────────────────────────────────────────────────
bind = $mainMod,            comma,      focusmonitor,   l
bind = $mainMod,            period,     focusmonitor,   r

# ── Move window to other monitor ─────────────────────────────────────────────
bind = $mainMod CTRL,       comma,      movewindow,     mon:l
bind = $mainMod CTRL,       period,     movewindow,     mon:r

# ══════════════════════════════════════════════════════════════════════════════
# §05  EXEC — DUAL MONITOR SETUP
# ══════════════════════════════════════════════════════════════════════════════

exec-once = ~/.config/hypr/scripts/monitor-hotplug.sh --daemon
exec-once = kanshi --config ~/.config/kanshi/config 2>/dev/null || true

exec = notify-send "ASH" \
    "🖥 Dual monitor layout loaded\nPrimary: DP-1 (WS 1-5)\nSecondary: eDP-1 (WS 6-10)" \
    --urgency=low --expire-time=3000

