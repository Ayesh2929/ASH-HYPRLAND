# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — ASUS ROG / TUF Laptop Profile                   ║
# ║                                                                              ║
# ║  Optimized for: ROG Zephyrus G14/G16, ROG Strix G15/G16, TUF A15/A16,    ║
# ║                 ROG Flow X13/X16, ROG Ally                                 ║
# ║  Hardware:      AMD Ryzen + NVIDIA RTX hybrid, 240Hz+ display,            ║
# ║                 ROG BIOS, Armory Crate keys, RGB keyboard, MUX switch     ║
# ║                                                                              ║
# ║  Auto-detect:   ash doctor fix --device                                     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  MONITOR — ROG HIGH-REFRESH DISPLAY PROFILES
# ══════════════════════════════════════════════════════════════════════════════

# ── ROG Zephyrus G14 2024 — 2880×1800 @ 120Hz OLED ───────────────────────────
# monitor = eDP-1, 2880x1800@120, 0x0, 1.8, bitdepth,10

# ── ROG Zephyrus G14 2023 — 2560×1600 @ 165Hz ────────────────────────────────
# monitor = eDP-1, 2560x1600@165, 0x0, 1.6, vrr,2

# ── ROG Strix G15 — 1920×1080 @ 300Hz ───────────────────────────────────────
# monitor = eDP-1, 1920x1080@300, 0x0, 1.0, vrr,2

# ── ROG Flow X13 2023 — 2560×1600 @ 165Hz ────────────────────────────────────
# monitor = eDP-1, 2560x1600@165, 0x0, 1.6

# ── TUF A16 — 2560×1600 @ 165Hz ──────────────────────────────────────────────
# monitor = eDP-1, 2560x1600@165, 0x0, 1.6, vrr,2

# ── Default safe profile (QHD @ 144Hz) ───────────────────────────────────────
monitor = eDP-1, 2560x1440@144, 0x0, 1.25, vrr,1

# ── External via USB-C / HDMI ─────────────────────────────────────────────────
monitor = DP-1,     preferred, auto, 1.0
monitor = HDMI-A-1, preferred, auto, 1.0
monitor = ,         preferred, auto, 1.0

# ══════════════════════════════════════════════════════════════════════════════
# §02  INPUT — ASUS ROG TOUCHPAD
# ══════════════════════════════════════════════════════════════════════════════

# ── ASUS ROG Elan touchpad ────────────────────────────────────────────────────
device {
    name                     = elan1406:00-04f3:30d7-touchpad
    accel_profile            = flat
    sensitivity              = 0.0
    natural_scroll           = true
    tap-to-click             = true
    clickfinger_behavior     = true
    disable_while_typing     = true
    scroll_factor            = 0.85
    drag_lock                = false
}

# ── ASUS ROG Ally gamepad ────────────────────────────────────────────────────
# (Handled by steam input / SDL — no special config needed in Hyprland)

input {
    kb_layout                = us
    kb_options               = caps:escape_shifted_capslock
    repeat_delay             = 220
    repeat_rate              = 60
    sensitivity              = 0.0
    accel_profile            = flat    # Flat for gaming
    touchpad {
        natural_scroll       = true
        disable_while_typing = true
        clickfinger_behavior = true
        tap-to-click         = true
        scroll_factor        = 0.85
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# §03  GPU — AMD + NVIDIA HYBRID (PRIME / MUX)
# ══════════════════════════════════════════════════════════════════════════════

# ── AMD iGPU (display output) + NVIDIA dGPU (render) ─────────────────────────
env = LIBVA_DRIVER_NAME,        radeonsi        # AMD VA-API for iGPU
env = AMD_VULKAN_ICD,           RADV
env = RADV_PERFTEST,            ngg,rt

# ── NVIDIA PRIME offload (render on NVIDIA, display via AMD) ──────────────────
env = __NV_PRIME_RENDER_OFFLOAD,           1
env = __VK_LAYER_NV_optimus,              NVIDIA_only
env = __GLX_VENDOR_LIBRARY_NAME,          nvidia
env = __NV_PRIME_RENDER_OFFLOAD_PROVIDER, NVIDIA-G0
env = WLR_NO_HARDWARE_CURSORS,            0

# ── NVIDIA driver settings ────────────────────────────────────────────────────
env = __GL_MaxFramesAllowed,               1
env = __GL_SHADER_DISK_CACHE,             1
env = GBM_BACKEND,                        nvidia-drm

opengl {
    nvidia_anti_flicker      = true
    force_introspection      = 2
}

# ── MUX switch mode (dGPU direct to display) — uncomment if MUX ON ───────────
# env = WLR_DRM_DEVICES,                  /dev/dri/card1
# Removes AMD iGPU from pipeline — lowest latency for gaming

# ══════════════════════════════════════════════════════════════════════════════
# §04  PERFORMANCE — ROG GAMING OPTIMIZED
# ══════════════════════════════════════════════════════════════════════════════

misc {
    vfr                      = false        # Stable frame delivery for gaming
    vrr                      = 1           # VRR fullscreen (G-Sync Compatible)
    render_unfocused_fps     = 10
    focus_on_activate        = false
    no_direct_scanout        = false
}

render {
    explicit_sync            = 2
    explicit_sync_kms        = 2
    direct_scanout           = true
}

cursor {
    no_hardware_cursors      = false
    no_break_fs_vrr          = true        # Don't break G-Sync for cursor
    min_refresh_rate         = 60
    inactive_timeout         = 3
}

# ══════════════════════════════════════════════════════════════════════════════
# §05  ASUS ROG SPECIAL KEYS
# ══════════════════════════════════════════════════════════════════════════════

# ── Armory Crate key → ASH mode toggle ───────────────────────────────────────
bind = , XF86Launch3,           exec, \
    CURRENT=$(cat ~/.local/state/ash-dotfiles/current-mode 2>/dev/null || echo default); \
    if [ "$CURRENT" = "game" ]; then \
        ash mode default; \
    else \
        ash mode game; \
    fi

# ── ASUS fn+F5 → fan profile toggle ─────────────────────────────────────────
bind = , XF86Launch4,           exec, \
    notify-send "ASH" "Fan profile toggle (use asusctl -n)" \
    --urgency=low --expire-time=2000

# ── ASUS ROG/TUF keyboard backlight ──────────────────────────────────────────
bindel = , XF86KbdBrightnessUp,   exec, \
    asusctl -n 2>/dev/null || \
    brightnessctl -d '*::kbd_backlight' set 33%+
bindel = , XF86KbdBrightnessDown, exec, \
    asusctl -p 2>/dev/null || \
    brightnessctl -d '*::kbd_backlight' set 33%-

# ── MyASUS key (XF86Launch1) → launcher ──────────────────────────────────────
bind = , XF86Launch1,           exec,       $launcher

# ══════════════════════════════════════════════════════════════════════════════
# §06  EXEC — ASUS ROG SPECIFIC
# ══════════════════════════════════════════════════════════════════════════════

# ── supergfxctl: GPU switching daemon ─────────────────────────────────────────
exec-once = systemctl enable --now supergfxd 2>/dev/null || true

# ── asusctl: ASUS platform driver daemon ─────────────────────────────────────
exec-once = systemctl enable --now asusd 2>/dev/null || true

# ── ROG fan curve: balanced mode ─────────────────────────────────────────────
exec-once = asusctl fan-curve -m balanced 2>/dev/null || true

# ── Power profile: balanced (switch to performance for gaming) ────────────────
exec-once = powerprofilesctl set balanced 2>/dev/null || true

exec = notify-send "ASH" \
    "🖥 ASUS ROG profile loaded\nAMD+NVIDIA PRIME • VRR: Fullscreen\nArmory key: mode toggle" \
    --urgency=low --expire-time=3000

