# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Desktop Intel GPU Profile                        ║
# ║                                                                              ║
# ║  Optimized for: Intel Arc A770/A750/B580, Intel Iris Xe (iGPU desktop),   ║
# ║                 NUC / mini-PC with Intel graphics                          ║
# ║  Hardware:      ANV Vulkan (Mesa), iHD VA-API, XeSS                       ║
# ║                                                                              ║
# ║  Auto-detect:   ash doctor fix --device                                     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  MONITOR — INTEL DISPLAY PROFILES
# ══════════════════════════════════════════════════════════════════════════════

# ── Intel Arc A770 — 4K @ 60Hz ───────────────────────────────────────────────
# monitor = DP-1, 3840x2160@60, 0x0, 1.5

# ── Intel Arc A770 — QHD @ 165Hz ─────────────────────────────────────────────
# monitor = DP-1, 2560x1440@165, 0x0, 1.0, vrr,1

# ── Intel Arc B580 — QHD @ 165Hz ─────────────────────────────────────────────
# monitor = DP-1, 2560x1440@165, 0x0, 1.0, vrr,1

# ── NUC / Iris Xe iGPU — FHD @ 60Hz ─────────────────────────────────────────
monitor = DP-1, 1920x1080@60, 0x0, 1.0

monitor = HDMI-A-1, preferred, auto, 1.0
monitor = DP-2,     preferred, auto, 1.0
monitor = ,         preferred, auto, 1.0

# ══════════════════════════════════════════════════════════════════════════════
# §02  INTEL GPU ENVIRONMENT
# ══════════════════════════════════════════════════════════════════════════════

# ── ANV (Intel Vulkan) via Mesa ───────────────────────────────────────────────
env = LIBVA_DRIVER_NAME,        iHD             # Intel Media Driver VA-API
env = VDPAU_DRIVER,             va_gl           # VDPAU via VA-API bridge
env = MESA_GL_VERSION_OVERRIDE, 4.6
env = MESA_GLSL_VERSION_OVERRIDE, 460
env = MESA_SHADER_CACHE_MAX_SIZE, 2G

# ── Intel Arc specific ────────────────────────────────────────────────────────
# env = ANV_QUEUE_THREAD_DISABLE, 0
# env = INTEL_DEBUG,             perf

# ══════════════════════════════════════════════════════════════════════════════
# §03  OPENGL & RENDER — INTEL
# ══════════════════════════════════════════════════════════════════════════════

opengl {
    nvidia_anti_flicker      = false
    force_introspection      = 1        # Arc benefits from shader analysis
}

render {
    explicit_sync            = 2
    explicit_sync_kms        = 2
    direct_scanout           = true     # Intel supports DRM scanout
    unload_heavy_shaders     = true
    cm_enabled               = true
    cm_fs_passthrough        = 2
    ctm_animation            = 1        # Direct CTM (less overhead on iGPU)
}

misc {
    vfr                      = true
    vrr                      = 1
    render_unfocused_fps     = 15
}

exec-once = powerprofilesctl set performance 2>/dev/null || true

exec = notify-send "ASH" \
    "🖥 Intel GPU profile loaded\nANV Vulkan • iHD VA-API\nDirect scanout: ON" \
    --urgency=low --expire-time=3000

# ══════════════════════════════════════════════════════════════════════════════
# EOF — desktop-intel.conf
# ══════════════════════════════════════════════════════════════════════════════