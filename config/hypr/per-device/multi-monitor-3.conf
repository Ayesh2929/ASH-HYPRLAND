# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Triple Monitor Configuration                     ║
# ║                                                                              ║
# ║  Layout templates for 3-monitor setups:                                    ║
# ║  Center primary · Symmetric · Mixed resolution · Vertical stack            ║
# ║                                                                              ║
# ║  Activate:   source this file  OR  ash monitor layout --triple             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  TRIPLE MONITOR LAYOUT TEMPLATES
# ══════════════════════════════════════════════════════════════════════════════

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  LAYOUT A — Symmetric triple QHD (home office pro)                     │
# │  [DP-2 2560×1440] [DP-1 2560×1440 PRIMARY] [HDMI-A-1 2560×1440]       │
# └─────────────────────────────────────────────────────────────────────────┘
monitor = DP-2,     2560x1440@165,  0x0,    1.0,    vrr,1
monitor = DP-1,     2560x1440@165,  2560x0, 1.0,    vrr,1
monitor = HDMI-A-1, 2560x1440@165,  5120x0, 1.0,    vrr,1
monitor = ,         preferred,      auto,   1.0

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  LAYOUT B — Center 4K + twin 1080p flanks                              │
# │  [HDMI-A-1 1920×1080] [DP-1 3840×2160 PRIMARY] [DP-2 1920×1080]       │
# └─────────────────────────────────────────────────────────────────────────┘
# monitor = HDMI-A-1, 1920x1080@60,  0x540,    1.0
# monitor = DP-1,     3840x2160@60,  1920x0,   1.5,  vrr,1
# monitor = DP-2,     1920x1080@60,  4480x540, 1.0

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  LAYOUT C — Ultrawide center + two standard ─────────────────────────  │
# │  [DP-2 1920×1080] [DP-1 3440×1440 UW] [HDMI-A-1 1920×1080]           │
# └─────────────────────────────────────────────────────────────────────────┘
# monitor = DP-2,     1920x1080@60,  0x180,    1.0
# monitor = DP-1,     3440x1440@160, 1920x0,   1.0,  vrr,1
# monitor = HDMI-A-1, 1920x1080@60,  5360x180, 1.0

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  LAYOUT D — Portrait + Landscape + Portrait                            │
# │  [DP-2 1080×1920] [DP-1 2560×1440] [HDMI-A-1 1080×1920]              │
# └─────────────────────────────────────────────────────────────────────────┘
# monitor = DP-2,     1920x1080@60,  0x0,      1.0,  transform,1  # left portrait
# monitor = DP-1,     2560x1440@144, 1080x240, 1.0               # center landscape
# monitor = HDMI-A-1, 1920x1080@60,  3640x0,   1.0,  transform,1  # right portrait

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  LAYOUT E — Laptop + dual external (travel workstation)                │
# │  [eDP-1 1920×1080] [DP-1 2560×1440] [HDMI-A-1 1920×1080]             │
# └─────────────────────────────────────────────────────────────────────────┘
# monitor = eDP-1,    1920x1080@60,  0x360,    1.0
# monitor = DP-1,     2560x1440@144, 1920x0,   1.0,  vrr,1
# monitor = HDMI-A-1, 1920x1080@60,  4480x180, 1.0

# ══════════════════════════════════════════════════════════════════════════════
# §02  WORKSPACE ASSIGNMENT — TRIPLE MONITOR
# ══════════════════════════════════════════════════════════════════════════════

# ── Left monitor (DP-2): WS 1-3 ──────────────────────────────────────────────
workspace = 1,  monitor:DP-2,     default:true,  persistent:true
workspace = 2,  monitor:DP-2
workspace = 3,  monitor:DP-2

# ── Center monitor (DP-1): WS 4-7 (primary workflow) ─────────────────────────
workspace = 4,  monitor:DP-1,     default:true,  persistent:true
workspace = 5,  monitor:DP-1
workspace = 6,  monitor:DP-1
workspace = 7,  monitor:DP-1

# ── Right monitor (HDMI-A-1): WS 8-10 ────────────────────────────────────────
workspace = 8,  monitor:HDMI-A-1, default:true,  persistent:true
workspace = 9,  monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

# ── Special workspaces ────────────────────────────────────────────────────────
workspace = special:scratch,    on-created-empty:$terminal
workspace = special:monitoring, on-created-empty:kitty -e btop
workspace = special:music,      on-created-empty:kitty -e ncmpcpp

# ══════════════════════════════════════════════════════════════════════════════
# §03  TRIPLE MONITOR KEYBINDS
# ══════════════════════════════════════════════════════════════════════════════

# ── Navigate between 3 monitors ───────────────────────────────────────────────
bind = $mainMod,            comma,          focusmonitor,   l
bind = $mainMod,            period,         focusmonitor,   r
bind = $mainMod,            slash,          focusmonitor,   +1

# ── Move workspaces between monitors ─────────────────────────────────────────
bind = $mainMod SHIFT,      comma,          movecurrentworkspacetomonitor,  l
bind = $mainMod SHIFT,      period,         movecurrentworkspacetomonitor,  r
bind = $mainMod SHIFT,      slash,          movecurrentworkspacetomonitor,  +1

# ── Move windows between monitors ─────────────────────────────────────────────
bind = $mainMod CTRL,       comma,          movewindow,     mon:l
bind = $mainMod CTRL,       period,         movewindow,     mon:r

# ── Direct monitor focus ──────────────────────────────────────────────────────
bind = $mainMod ALT,        1,              focusmonitor,   DP-2        # Left
bind = $mainMod ALT,        2,              focusmonitor,   DP-1        # Center
bind = $mainMod ALT,        3,              focusmonitor,   HDMI-A-1   # Right

# ══════════════════════════════════════════════════════════════════════════════
# §04  CURSOR — TRIPLE MONITOR
# ══════════════════════════════════════════════════════════════════════════════

misc {
    mouse_move_focuses_monitor = true
}

binds {
    window_direction_monitor_fallback = true
    workspace_center_on = 1     # Cursor position determines focus
}

# ══════════════════════════════════════════════════════════════════════════════
# §05  EXEC — TRIPLE MONITOR SETUP
# ══════════════════════════════════════════════════════════════════════════════

exec-once = ~/.config/hypr/scripts/monitor-hotplug.sh --daemon
exec-once = kanshi --config ~/.config/kanshi/config 2>/dev/null || true

exec = notify-send "ASH" \
    "🖥 Triple monitor layout loaded\nLeft: DP-2 (WS 1-3)\nCenter: DP-1 (WS 4-7)\nRight: HDMI-A-1 (WS 8-10)" \
    --urgency=low --expire-time=4000

# ══════════════════════════════════════════════════════════════════════════════
# EOF — multi-monitor-3.conf
