# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Desktop AMD GPU Profile                          ║
# ║                                                                              ║
# ║  Optimized for: RX 6000/7000 series (RDNA2/3), Radeon Pro, APU rigs       ║
# ║  Hardware:      RADV Vulkan, Mesa VA-API, FreeSync/VRR, HDR capable       ║
# ║  Best config:   Mesa 24+ | Kernel 6.6+ | amdgpu driver                    ║
# ║                                                                              ║
# ║  Auto-detect:   ash doctor fix --device                                     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  MONITOR — AMD DESKTOP DISPLAY PROFILES
# ══════════════════════════════════════════════════════════════════════════════

# ── Primary 4K @ 144Hz (RX 7900 XT/XTX tier) ─────────────────────────────────
# monitor = DP-1, 3840x2160@144, 0x0, 1.5, bitdepth,10, vrr,1

# ── Primary QHD @ 240Hz (RX 7900 GRE / 6800 XT tier) ────────────────────────
# monitor = DP-1, 2560x1440@240, 0x0, 1.0, vrr,1

# ── Primary QHD @ 165Hz (mainstream) ─────────────────────────────────────────
monitor = DP-1, 2560x1440@165, 0x0, 1.0, vrr,1

# ── Primary 1080p @ 144Hz (budget AMD) ───────────────────────────────────────
# monitor = HDMI-A-1, 1920x1080@144, 0x0, 1.0, vrr,1

# ── Secondary monitor ─────────────────────────────────────────────────────────
monitor = HDMI-A-1, preferred, 2560x0, 1.0
monitor = DP-2,     preferred, auto,   1.0
monitor = ,         preferred, auto,   1.0

# ══════════════════════════════════════════════════════════════════════════════
# §02  AMD GPU ENVIRONMENT
# ══════════════════════════════════════════════════════════════════════════════

# ── RADV Vulkan (Mesa — best for gaming, open source) ─────────────────────────
env = AMD_VULKAN_ICD,           RADV
env = RADV_PERFTEST,            ngg,rt,ext_ms   # NGG, raytracing, perf features
env = ACO_DEBUG,                forcestores      # ACO compiler optimization

# ── Mesa VA-API hardware decode ───────────────────────────────────────────────
env = LIBVA_DRIVER_NAME,        radeonsi
env = VDPAU_DRIVER,             radeonsi

# ── Mesa shader cache ─────────────────────────────────────────────────────────
env = MESA_SHADER_CACHE_MAX_SIZE, 4G            # Large cache for desktop
env = MESA_SHADER_CACHE_DIR,    $HOME/.cache/mesa_shader_cache

# ── GPU selection (multi-GPU) ────────────────────────────────────────────────
# env = DRI_PRIME,               pci-0000_0c_00_0   # Force specific GPU
# env = MESA_VK_DEVICE_SELECT,   prefer_discrete

# ══════════════════════════════════════════════════════════════════════════════
# §03  OPENGL & RENDER — AMD OPTIMAL
# ══════════════════════════════════════════════════════════════════════════════

opengl {
    nvidia_anti_flicker      = false    # Not needed on AMD
    force_introspection      = 0        # Mesa optimizes internally
}

render {
    explicit_sync            = 2        # Full explicit sync (AMD supports it)
    explicit_sync_kms        = 2
    direct_scanout           = true     # AMD supports DRM scanout cleanly
    unload_heavy_shaders     = false    # Keep shaders loaded (desktop = VRAM)
    cm_enabled               = true     # Color management
    cm_fs_passthrough        = 2
    ctm_animation            = 2
}

# ══════════════════════════════════════════════════════════════════════════════
# §04  PERFORMANCE — AMD DESKTOP MAXIMUM
# ══════════════════════════════════════════════════════════════════════════════

misc {
    vfr                      = true
    vrr                      = 1        # FreeSync / VRR fullscreen
    render_unfocused_fps     = 15
    no_direct_scanout        = false
    focus_on_activate        = false
}

cursor {
    no_hardware_cursors      = false    # AMD HW cursor works well
    no_break_fs_vrr          = false
    min_refresh_rate         = 24
    inactive_timeout         = 10
}

# ══════════════════════════════════════════════════════════════════════════════
# §05  AMD-SPECIFIC GAMEMODE INTEGRATION
# ══════════════════════════════════════════════════════════════════════════════

# ── GameMode daemon: AMD CPU+GPU optimizations ────────────────────────────────
exec-once = systemctl enable --now gamemode 2>/dev/null || true

# ── CPU governor: performance ─────────────────────────────────────────────────
exec-once = powerprofilesctl set performance 2>/dev/null || true

# ── AMD GPU performance: high ─────────────────────────────────────────────────
exec-once = \
    echo high | sudo tee /sys/class/drm/card*/device/power_dpm_force_performance_level \
    > /dev/null 2>/dev/null || true

exec = notify-send "ASH" \
    "🖥 AMD Desktop profile loaded\nRADV Vulkan • RDNA3 optimized\nVRR: Fullscreen • Direct scanout: ON" \
    --urgency=low --expire-time=3000

# ══════════════════════════════════════════════════════════════════════════════
