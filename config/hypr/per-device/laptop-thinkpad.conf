# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — ThinkPad Laptop Profile                          ║
# ║                                                                              ║
# ║  Optimized for: ThinkPad X1 Carbon, T14s, T16, X13, L14, E14              ║
# ║  Hardware:      Intel/AMD iGPU, TrackPoint, UltraNav touchpad,             ║
# ║                 IPS/OLED display, fingerprint reader, hardware dock         ║
# ║                                                                              ║
# ║  Auto-detect:   ash doctor fix --device                                     ║
# ║  Manual apply:  source ~/.config/hypr/per-device/laptop-thinkpad.conf      ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  MONITOR — THINKPAD DISPLAY PROFILES
# ══════════════════════════════════════════════════════════════════════════════

# ── X1 Carbon Gen 11/12 — 2.8K OLED (2880×1800 @ 120Hz) ─────────────────────
# monitor = eDP-1, 2880x1800@120, 0x0, 1.8, bitdepth,10

# ── X1 Carbon Gen 11/12 — 2K IPS (2560×1600 @ 60Hz) ─────────────────────────
# monitor = eDP-1, 2560x1600@60, 0x0, 1.6

# ── T14s Gen 4 AMD — 2.8K OLED (2880×1800 @ 90Hz) ───────────────────────────
# monitor = eDP-1, 2880x1800@90, 0x0, 1.8

# ── T14 Gen 4 — FHD IPS (1920×1200 @ 60Hz) ───────────────────────────────────
# monitor = eDP-1, 1920x1200@60, 0x0, 1.25

# ── T16 Gen 2 — 2.5K IPS (2560×1600 @ 60Hz) ─────────────────────────────────
# monitor = eDP-1, 2560x1600@60, 0x0, 1.6

# ── X13 Gen 4 — WUXGA IPS (1920×1200 @ 60Hz) ────────────────────────────────
# monitor = eDP-1, 1920x1200@60, 0x0, 1.25

# ── E14 Gen 5 — FHD IPS (1920×1080 @ 60Hz) — default safe profile ───────────
monitor = eDP-1, 1920x1080@60, 0x0, 1.0

# ── Dock / external monitor (right of laptop) ────────────────────────────────
monitor = DP-1, preferred, 1920x0, 1.0
monitor = HDMI-A-1, preferred, 1920x0, 1.0
monitor = DP-2, preferred, auto, 1.0

# ── Fallback catch-all ────────────────────────────────────────────────────────
monitor = , preferred, auto, 1.0

# ══════════════════════════════════════════════════════════════════════════════
# §02  INPUT — THINKPAD TRACKPOINT & ULTRADEV TOUCHPAD
# ══════════════════════════════════════════════════════════════════════════════

# ── TrackPoint (red nipple) — adaptive acceleration for precision ─────────────
device {
    name                     = tpps/2-ibm-trackpoint
    accel_profile            = adaptive
    sensitivity              = 0.45         # Boosted — TrackPoint needs it
    scroll_method            = on_button_down
    scroll_button            = 274           # Middle button scroll
    scroll_button_lock       = true
    natural_scroll           = false
    left_handed              = false
    middle_button_emulation  = false
}

# ── UltraNav Touchpad (Synaptics) ─────────────────────────────────────────────
device {
    name                     = synps/2-synaptics-touchpad
    accel_profile            = flat
    sensitivity              = 0.0
    natural_scroll           = true
    tap-to-click             = true
    clickfinger_behavior     = true
    disable_while_typing     = true
    drag_lock                = false
    tap-and-drag             = true
    scroll_factor            = 0.80
    middle_button_emulation  = false
}

# ── ThinkPad Elan Touchpad (newer models) ────────────────────────────────────
device {
    name                     = elan0676:00-04f3:3195-touchpad
    accel_profile            = flat
    sensitivity              = 0.0
    natural_scroll           = true
    tap-to-click             = true
    clickfinger_behavior     = true
    disable_while_typing     = true
    scroll_factor            = 0.85
}

# ── ThinkPad keyboard ─────────────────────────────────────────────────────────
input {
    kb_layout                = us
    kb_options               = caps:escape_shifted_capslock
    repeat_delay             = 220         # Fast — ThinkPad users type fast
    repeat_rate              = 55
    touchpad {
        natural_scroll       = true
        disable_while_typing = true
        clickfinger_behavior = true
        tap-to-click         = true
        scroll_factor        = 0.80
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# §03  GPU — INTEL/AMD THINKPAD (HYBRID OPTIONAL)
# ══════════════════════════════════════════════════════════════════════════════

# ── Environment: Intel iGPU (most ThinkPads) ──────────────────────────────────
env = LIBVA_DRIVER_NAME,        iHD         # Intel Media Driver VA-API
env = VDPAU_DRIVER,             va_gl       # VDPAU via VA-API bridge
env = WLR_NO_HARDWARE_CURSORS,  0

# ── Environment: AMD iGPU (T14 AMD, X13 AMD) — uncomment if AMD ──────────────
# env = LIBVA_DRIVER_NAME,      radeonsi
# env = VDPAU_DRIVER,           radeonsi
# env = AMD_VULKAN_ICD,         RADV

# ── NVIDIA MX discrete (some ThinkPad models) — uncomment if Nvidia dGPU ─────
# env = __NV_PRIME_RENDER_OFFLOAD,           1
# env = __GLX_VENDOR_LIBRARY_NAME,           nvidia
# env = __VK_LAYER_NV_optimus,              NVIDIA_only
# env = WLR_DRM_DEVICES,                    /dev/dri/card1:/dev/dri/card0

env = MESA_SHADER_CACHE_MAX_SIZE,  512M    # Conservative — shared RAM

# ══════════════════════════════════════════════════════════════════════════════
# §04  POWER MANAGEMENT — THINKPAD SPECIFIC
# ══════════════════════════════════════════════════════════════════════════════

# ── Compositor power settings ─────────────────────────────────────────────────
misc {
    vfr                      = true         # Essential for battery life
    vrr                      = 0
    render_unfocused_fps     = 12
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
}

# ── Cursor: auto-hide for laptop use ─────────────────────────────────────────
cursor {
    inactive_timeout         = 8
    hide_on_touch            = true
    no_hardware_cursors      = false
}

# ══════════════════════════════════════════════════════════════════════════════
# §05  THINKPAD SPECIAL KEYS
# ══════════════════════════════════════════════════════════════════════════════

# ── ThinkPad Star / Favorites key (XF86Favorites) ────────────────────────────
bind = , XF86Favorites,         exec,       $launcher
bind = , XF86Launch1,           exec,       kitty

# ── ThinkPad microphone mute key ─────────────────────────────────────────────
bindl = , XF86AudioMicMute,     exec, \
    wpctl set-mute @DEFAULT_SOURCE@ toggle && \
    notify-send "🎙 Mic $(wpctl get-volume @DEFAULT_SOURCE@ | grep -c MUTED > /dev/null && echo 'MUTED' || echo 'ACTIVE')" \
    --urgency=low --expire-time=2000 \
    --hint=string:x-dunst-stack-tag:mic

# ── Keyboard backlight (ThinkPad Fn+Space) ───────────────────────────────────
bindel = , XF86KbdBrightnessUp,   exec, \
    brightnessctl -d '*::kbd_backlight' set 33%+ && \
    notify-send "⌨ KBD Backlight ↑" --urgency=low --expire-time=1000
bindel = , XF86KbdBrightnessDown, exec, \
    brightnessctl -d '*::kbd_backlight' set 33%- && \
    notify-send "⌨ KBD Backlight ↓" --urgency=low --expire-time=1000

# ── ThinkPad lid switch (handled by systemd logind) ──────────────────────────
# /etc/systemd/logind.conf:
# HandleLidSwitch=suspend
# HandleLidSwitchExternalPower=lock

# ══════════════════════════════════════════════════════════════════════════════
# §06  DOCKING STATION SUPPORT
# ══════════════════════════════════════════════════════════════════════════════

# ── Hot-plug monitor handler script ───────────────────────────────────────────
exec-once = ~/.config/hypr/scripts/monitor-hotplug.sh --daemon

# ── Workspace assignment when docked ──────────────────────────────────────────
# Managed by kanshi — see ~/.config/kanshi/config for dock profiles

# ══════════════════════════════════════════════════════════════════════════════
# §07  FINGERPRINT READER INTEGRATION
# ══════════════════════════════════════════════════════════════════════════════

# ── fprintd integration with hyprlock ────────────────────────────────────────
# Configured in hyprlock.conf — uses fprintd-verify for auth
# exec-once = fprintd-enroll (first run only)

# ══════════════════════════════════════════════════════════════════════════════
# §08  THINKPAD-SPECIFIC EXEC
# ══════════════════════════════════════════════════════════════════════════════

# ── TLP power management ─────────────────────────────────────────────────────
exec-once = systemctl enable --now tlp.service 2>/dev/null || true

# ── ThinkFan (temperature-controlled fan) ────────────────────────────────────
exec-once = systemctl enable --now thinkfan.service 2>/dev/null || true

# ── Battery charge threshold (80% max for longevity) ─────────────────────────
exec-once = \
    echo 80 | sudo tee /sys/class/power_supply/BAT0/charge_control_end_threshold \
    > /dev/null 2>/dev/null || true

exec = notify-send "ASH" \
    "🖥 ThinkPad profile loaded\niGPU optimized • TrackPoint configured\nBattery threshold: 80%" \
    --urgency=low --expire-time=3000

