# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Framework Laptop Profile                         ║
# ║                                                                              ║
# ║  Optimized for: Framework 13 (Intel/AMD), Framework 16 (AMD + dGPU)       ║
# ║  Hardware:      Modular design, AMD Ryzen/Intel Core, DDR5,                ║
# ║                 USB4/Thunderbolt expansion, high-DPI display               ║
# ║                                                                              ║
# ║  Auto-detect:   ash doctor fix --device                                     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  MONITOR — FRAMEWORK DISPLAY PROFILES
# ══════════════════════════════════════════════════════════════════════════════

# ── Framework 13 Intel 13th Gen — 2256×1504 @ 60Hz ───────────────────────────
# monitor = eDP-1, 2256x1504@60, 0x0, 1.5

# ── Framework 13 AMD 7040 Series — 2256×1504 @ 60Hz ─────────────────────────
# monitor = eDP-1, 2256x1504@60, 0x0, 1.5

# ── Framework 13 AMD (Ryzen 7640U/7840U) — 2256×1504 @ 60Hz ─────────────────
monitor = eDP-1, 2256x1504@60, 0x0, 1.5

# ── Framework 16 — 2560×1600 @ 165Hz (matte QHD+) ───────────────────────────
# monitor = eDP-1, 2560x1600@165, 0x0, 1.6, vrr,1

# ── Framework 16 with AMD RX 7700S dGPU ──────────────────────────────────────
# monitor = eDP-1, 2560x1600@165, 0x0, 1.6, vrr,1

# ── External via USB4/Thunderbolt expansion ───────────────────────────────────
monitor = DP-1, preferred, auto, 1.0
monitor = HDMI-A-1, preferred, auto, 1.0
monitor = , preferred, auto, 1.0

# ══════════════════════════════════════════════════════════════════════════════
# §02  INPUT — FRAMEWORK TOUCHPAD
# ══════════════════════════════════════════════════════════════════════════════

# ── Framework 13 touchpad ────────────────────────────────────────────────────
device {
    name                     = elan0676:00-04f3:3195-touchpad
    accel_profile            = flat
    sensitivity              = 0.0
    natural_scroll           = true
    tap-to-click             = true
    clickfinger_behavior     = true
    disable_while_typing     = true
    drag_lock                = false
    tap-and-drag             = true
    scroll_factor            = 0.90
    middle_button_emulation  = false
}

# ── Framework 16 touchpad (larger) ────────────────────────────────────────────
device {
    name                     = elan06fa:00-04f3:31f8-touchpad
    accel_profile            = flat
    sensitivity              = 0.0
    natural_scroll           = true
    tap-to-click             = true
    clickfinger_behavior     = true
    disable_while_typing     = true
    scroll_factor            = 0.85
}

input {
    kb_layout                = us
    kb_options               = caps:escape_shifted_capslock
    repeat_delay             = 240
    repeat_rate              = 50
    touchpad {
        natural_scroll       = true
        disable_while_typing = true
        clickfinger_behavior = true
        tap-to-click         = true
        scroll_factor        = 0.90
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# §03  GPU — FRAMEWORK AMD/INTEL PROFILES
# ══════════════════════════════════════════════════════════════════════════════

# ── Framework 13 AMD (7040 series — RDNA3 iGPU) ──────────────────────────────
env = LIBVA_DRIVER_NAME,        radeonsi
env = VDPAU_DRIVER,             radeonsi
env = AMD_VULKAN_ICD,           RADV
env = RADV_PERFTEST,            ngg,ext_ms
env = MESA_SHADER_CACHE_MAX_SIZE, 1G

# ── Framework 13 Intel — uncomment if Intel ──────────────────────────────────
# env = LIBVA_DRIVER_NAME,      iHD
# env = MESA_SHADER_CACHE_MAX_SIZE, 512M

# ── Framework 16 AMD + RX 7700S dGPU ─────────────────────────────────────────
# env = LIBVA_DRIVER_NAME,      radeonsi
# env = AMD_VULKAN_ICD,         RADV
# env = DRI_PRIME,              1           # Use dGPU
# env = WLR_DRM_DEVICES,        /dev/dri/card1:/dev/dri/card0

# ══════════════════════════════════════════════════════════════════════════════
# §04  FRAMEWORK-SPECIFIC POWER CONFIG
# ══════════════════════════════════════════════════════════════════════════════

misc {
    vfr                      = true
    vrr                      = 0
    render_unfocused_fps     = 15
}

cursor {
    inactive_timeout         = 8
    hide_on_touch            = true
}

# ── Framework 16: enable VRR for high-refresh display ────────────────────────
# misc { vrr = 2 }   # Enable if Framework 16 @ 165Hz

# ══════════════════════════════════════════════════════════════════════════════
# §05  FRAMEWORK INPUT MODULE SUPPORT
#      Framework's modular input area (numpad, macro pad, etc.)
# ══════════════════════════════════════════════════════════════════════════════

# ── Macro pad binds (Framework 16) ────────────────────────────────────────────
# bind = , XF86Launch1,         exec,       $launcher
# bind = , XF86Launch2,         exec,       kitty
# bind = , XF86Launch3,         exec,       $browser

# ── LED matrix module control ─────────────────────────────────────────────────
# exec-once = framework-matrix-control --pattern idle &

# ══════════════════════════════════════════════════════════════════════════════
# §06  EXEC — FRAMEWORK SPECIFIC
# ══════════════════════════════════════════════════════════════════════════════

# ── power-profiles-daemon for balanced power ──────────────────────────────────
exec-once = systemctl enable --now power-profiles-daemon 2>/dev/null || true
exec-once = powerprofilesctl set balanced 2>/dev/null || true

# ── Battery conservation (Framework supports charge limit) ───────────────────
exec-once = \
    echo 80 | sudo tee \
    /sys/class/power_supply/BAT1/charge_control_end_threshold \
    > /dev/null 2>/dev/null || true

exec = notify-send "ASH" \
    "🖥 Framework profile loaded\nAMD RDNA3 iGPU • Scale: 1.5x\nPower: balanced mode" \
    --urgency=low --expire-time=3000

# ══════════════════════════════════════════════════════════════════════════════
