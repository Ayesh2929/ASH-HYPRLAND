# ══════════════════════════════════════════════════════════════════════════════
# §00  MODULAR INCLUDE TREE
#      All sub-configs are sourced in dependency order.
#      Edit individual files — this master file rarely needs changes.
# ══════════════════════════════════════════════════════════════════════════════

# ── Core environment & variables (must load first) ───────────────────────────
source = ~/.config/hypr/env.conf

# ── Hardware / device profiles ───────────────────────────────────────────────
source = ~/.config/hypr/monitors.conf

# ── Visual & theme colors (populated by ASH theme engine) ────────────────────
source = ~/.config/hypr/themes/colors.conf
source = ~/.config/hypr/themes/active-theme.conf

# ── Animation presets ────────────────────────────────────────────────────────
source = ~/.config/hypr/animations/default.conf

# ── Core compositor settings ─────────────────────────────────────────────────
source = ~/.config/hypr/decorations.conf
source = ~/.config/hypr/render.conf
source = ~/.config/hypr/opengl.conf
source = ~/.config/hypr/cursor.conf

# ── Input devices ────────────────────────────────────────────────────────────
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/gestures.conf

# ── Window / layer / workspace rules ─────────────────────────────────────────
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/layerrules.conf
source = ~/.config/hypr/workspacerules.conf

# ── Groups & tabbing ─────────────────────────────────────────────────────────
source = ~/.config/hypr/group.conf

# ── Misc & XWayland ──────────────────────────────────────────────────────────
source = ~/.config/hypr/misc.conf
source = ~/.config/hypr/xwayland.conf
source = ~/.config/hypr/ecosystem.conf

# ── Keybinds (all submaps) ───────────────────────────────────────────────────
source = ~/.config/hypr/keybinds/default.conf
source = ~/.config/hypr/keybinds/window-management.conf
source = ~/.config/hypr/keybinds/workspace-management.conf
source = ~/.config/hypr/keybinds/launch-apps.conf
source = ~/.config/hypr/keybinds/media-keys.conf
source = ~/.config/hypr/keybinds/screenshot.conf
source = ~/.config/hypr/keybinds/resize-submap.conf
source = ~/.config/hypr/keybinds/move-submap.conf
source = ~/.config/hypr/keybinds/group-submap.conf
source = ~/.config/hypr/keybinds/power-submap.conf
source = ~/.config/hypr/keybinds/monitor-submap.conf
source = ~/.config/hypr/keybinds/special-workspace.conf
source = ~/.config/hypr/keybinds/passthrough-submap.conf
source = ~/.config/hypr/keybinds/custom.conf

# ── Hyprland plugin configs ───────────────────────────────────────────────────
source = ~/.config/hypr/plugins.conf

# ── Autostart applications & daemons ─────────────────────────────────────────
source = ~/.config/hypr/autostart.conf

# ── Debug (disabled in production) ───────────────────────────────────────────
# source = ~/.config/hypr/debug.conf

# ══════════════════════════════════════════════════════════════════════════════
# §01  MONITOR CONFIGURATION
#      Fallback inline definition — overridden by monitors.conf
#      Format: monitor = name, resolution@hz, position, scale
# ══════════════════════════════════════════════════════════════════════════════

# Catch-all for unknown monitors — auto-configure safely
monitor = , preferred, auto, auto

# ══════════════════════════════════════════════════════════════════════════════
# §02  GENERAL COMPOSITOR SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

general {
    # ── Layout engine ────────────────────────────────────────────────────────
    layout                   = dwindle      # dwindle | master | manual

    # ── Gap sizing (px) — overridden by ASH mode engine ──────────────────────
    gaps_in                  = 4            # Inner gaps between windows
    gaps_out                 = 12           # Outer gaps between windows & screen
    gaps_workspaces          = 0            # Extra gaps between workspaces

    # ── Border widths (px) ───────────────────────────────────────────────────
    border_size              = 2

    # ── Colors (populated from themes/colors.conf) ───────────────────────────
    col.active_border        = $colorAccent $colorAccent2 45deg
    col.inactive_border      = $colorSurface0
    col.nogroup_border       = $colorRed
    col.nogroup_border_active= $colorPeach

    # ── Cursor / focus behavior ───────────────────────────────────────────────
    no_focus_fallback        = false
    resize_on_border         = true         # Drag window edges to resize
    extend_border_grab_area  = 8            # px outside border for grab
    hover_icon_on_border     = true         # Show resize cursor on border hover

    # ── Sensitivity & snapping ───────────────────────────────────────────────
    sensitivity              = 1.0          # Global cursor sensitivity
    snap {
        enabled              = true
        window_gap           = 10           # px snap threshold
        monitor_gap          = 10
        border_overlap       = true
    }

    # ── Allow tearing (per-window via windowrule) ────────────────────────────
    allow_tearing            = true
}

# ══════════════════════════════════════════════════════════════════════════════
# §03  DECORATION (VISUAL POLISH)
# ══════════════════════════════════════════════════════════════════════════════

decoration {
    # ── Corner rounding ──────────────────────────────────────────────────────
    rounding                 = 12           # px — overridden by theme
    rounding_power           = 2.0          # 2.0 = circular, higher = squircle

    # ── Window opacity (overridden by ASH mode engine) ────────────────────────
    active_opacity           = 1.0
    inactive_opacity         = 0.92
    fullscreen_opacity       = 1.0

    # ── Drop shadow ──────────────────────────────────────────────────────────
    shadow {
        enabled              = true
        range                = 24
        render_power         = 3            # 1-4, higher = sharper falloff
        color                = rgba(0,0,0,0.55)
        color_inactive       = rgba(0,0,0,0.35)
        offset               = 0, 4
        scale                = 1.0
        sharp                = false
    }

    # ── Blur ─────────────────────────────────────────────────────────────────
    blur {
        enabled              = true
        size                 = 8            # Kernel size (odd number)
        passes               = 3            # Higher = more blur, more GPU
        ignore_opacity       = false
        new_optimizations    = true
        xray                 = false        # Blur through layershells
        noise                = 0.0117       # Film grain noise amount
        contrast             = 0.88
        brightness           = 0.82
        vibrancy             = 0.18
        vibrancy_darkness    = 0.0
        special              = true         # Blur on special workspace
        popups               = true         # Blur popups / tooltips
        popups_ignorealpha   = 0.2
    }

    # ── Screen shader (loaded by ASH theme engine) ────────────────────────────
    # screen_shader          = ~/.config/hypr/shaders/blue-light-filter.frag
}

# ══════════════════════════════════════════════════════════════════════════════
# §04  ANIMATIONS
# ══════════════════════════════════════════════════════════════════════════════

animations {
    enabled                  = true
    first_launch_animation   = true

    # ── Bezier curves ────────────────────────────────────────────────────────
    # Format: bezier = name, x0, y0, x1, y1
    bezier = linear,       0.0,  0.0,  1.0,  1.0
    bezier = ease,         0.25, 0.1,  0.25, 1.0
    bezier = easeIn,       0.4,  0.0,  1.0,  1.0
    bezier = easeOut,      0.0,  0.0,  0.6,  1.0
    bezier = easeInOut,    0.4,  0.0,  0.6,  1.0

    # ASH signature curves
    bezier = ashSmooth,    0.16, 1.0,  0.3,  1.0
    bezier = ashBounce,    0.34, 1.56, 0.64, 1.0
    bezier = ashSnappy,    0.08, 0.82, 0.17, 1.0
    bezier = ashOvershoot, 0.2,  1.3,  0.4,  1.0
    bezier = ashElastic,   0.5,  1.6,  0.5,  0.9
    bezier = ashCinematic, 0.0,  0.85, 0.15, 1.0

    # ── Window open/close ────────────────────────────────────────────────────
    animation = windowsIn,       1, 5,  ashSmooth,    popin 60%
    animation = windowsOut,      1, 4,  ashSnappy,    popin 60%
    animation = windowsMove,     1, 4,  ashSmooth

    # ── Fade ─────────────────────────────────────────────────────────────────
    animation = fadeIn,          1, 5,  ashSmooth
    animation = fadeOut,         1, 4,  ashSnappy
    animation = fadeSwitch,      1, 5,  ashSmooth
    animation = fadeShadow,      1, 5,  ashSmooth
    animation = fadeDim,         1, 5,  ashSmooth
    animation = fadeLayers,      1, 5,  ashSmooth
    animation = fadeLayersIn,    1, 5,  ashSmooth
    animation = fadeLayersOut,   1, 4,  ashSnappy

    # ── Workspace transitions ─────────────────────────────────────────────────
    animation = workspaces,      1, 5,  ashSmooth,    slidefade 20%
    animation = workspacesIn,    1, 5,  ashSmooth,    slidefade 20%
    animation = workspacesOut,   1, 4,  ashSnappy,    slidefade 20%

    # ── Special workspace (scratchpad) ────────────────────────────────────────
    animation = specialWorkspace,   1, 5, ashSmooth,  slidefadevert -30%
    animation = specialWorkspaceIn, 1, 5, ashSmooth,  slidefadevert -30%
    animation = specialWorkspaceOut,1, 4, ashSnappy,  slidefadevert -30%

    # ── Layers (bars, menus, notifications) ──────────────────────────────────
    animation = layers,          1, 3,  ashSnappy,    fade
    animation = layersIn,        1, 3,  ashSmooth,    fade
    animation = layersOut,       1, 2,  ashSnappy,    fade

    # ── Border ───────────────────────────────────────────────────────────────
    animation = border,          1, 8,  ashSmooth
    animation = borderangle,     1, 80, linear,       loop
}

# ══════════════════════════════════════════════════════════════════════════════
# §05  INPUT CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

input {
    # ── Keyboard ─────────────────────────────────────────────────────────────
    kb_layout                = us
    kb_variant               =
    kb_model                 =
    kb_options               = caps:escape_shifted_capslock
    kb_rules                 =

    # ── Key repeat ───────────────────────────────────────────────────────────
    repeat_rate              = 50           # keys/sec after delay
    repeat_delay             = 250          # ms before repeat starts

    # ── Mouse ────────────────────────────────────────────────────────────────
    sensitivity              = 0.0          # -1.0 to 1.0 libinput accel
    accel_profile            = flat         # flat | adaptive | custom
    force_no_accel           = false
    left_handed              = false
    middle_button_emulation  = false
    scroll_method            = 2fg          # no_scroll | 2fg | edge | on_button_down
    scroll_button            = 0
    scroll_button_lock       = false
    scroll_factor            = 1.0
    natural_scroll           = false
    emulate_discrete_scroll  = 1

    # ── Touchpad ─────────────────────────────────────────────────────────────
    touchpad {
        natural_scroll       = true
        disable_while_typing = true
        clickfinger_behavior = true         # 2-finger = right click
        middle_button_emulation = false
        tap-to-click         = true
        drag_lock            = false
        tap-and-drag         = true
        scroll_factor        = 0.85
    }

    # ── Touchscreen ──────────────────────────────────────────────────────────
    touchdevice {
        transform            = 0
        output               =
        enabled              = true
    }

    # ── Tablet ───────────────────────────────────────────────────────────────
    tablet {
        transform            = 0
        output               =
        left_handed          = false
        active_area_size     = [ 0, 0 ]
        active_area_position = [ 0, 0 ]
    }

    # ── Focus & follow ───────────────────────────────────────────────────────
    follow_mouse             = 1            # 0=off 1=full 2=loose 3=clickonly
    follow_mouse_threshold   = 0
    special_fallthrough      = false
    off_window_steps         = false
    mouse_refocus            = true
    focus_on_close           = 1           # 0=none 1=history 2=recent_mon
    float_switch_override_focus = 1
    workspace_back_and_forth = false
}

# ══════════════════════════════════════════════════════════════════════════════
# §06  GESTURES
# ══════════════════════════════════════════════════════════════════════════════

gestures {
    workspace_swipe              = true
    workspace_swipe_fingers      = 3
    workspace_swipe_min_fingers  = false
    workspace_swipe_distance     = 300      # px — swipe travel for ws change
    workspace_swipe_touch        = true
    workspace_swipe_invert       = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new   = true
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_forever      = false
    workspace_swipe_use_r        = false
    workspace_swipe_touch_invert = false
}

# ══════════════════════════════════════════════════════════════════════════════
# §07  LAYOUTS
# ══════════════════════════════════════════════════════════════════════════════

# ── Dwindle (BSP-like) ────────────────────────────────────────────────────────
dwindle {
    pseudotile               = false        # Pseudo-tiling (respects float size)
    force_split              = 0            # 0=follow mouse 1=always left 2=always right
    preserve_split           = true
    smart_split              = false
    smart_resizing           = true
    permanent_direction_override = false
    special_scale_factor     = 0.85
    split_width_multiplier   = 1.0
    no_gaps_when_only        = 0            # 0=always gaps 1=1-win-no-gaps 2=1/full-no-gaps
    use_active_for_splits    = true
    default_split_ratio      = 1.0
}

# ── Master layout ─────────────────────────────────────────────────────────────
master {
    allow_small_split        = false
    special_scale_factor     = 0.85
    mfact                    = 0.55         # Master area factor 0.0–1.0
    new_status               = slave        # slave | master
    new_on_top               = false
    new_on_active            = none         # none | before | after
    no_gaps_when_only        = 0
    orientation              = left         # left | right | top | bottom | center
    inherit_fullscreen       = true
    always_center_master     = false
    slave_count_for_center_master = 2
    smart_resizing           = true
    drop_at_cursor           = true
}

# ══════════════════════════════════════════════════════════════════════════════
# §08  MISC SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

misc {
    # ── VFR & rendering ──────────────────────────────────────────────────────
    vfr                      = true         # Variable frame rate (saves power)
    vrr                      = 1            # 0=off 1=full 2=fullscreen-only
    render_ahead_of_time     = false
    render_ahead_safezone     = 1

    # ── Focus & mouse ────────────────────────────────────────────────────────
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
    always_follow_on_dnd     = true
    layers_hog_keyboard_focus = true
    animate_manual_resizes   = true
    animate_mouse_windowdragging = true
    disable_autoreload       = false        # true = manual hyprctl reload only
    enable_swallow           = true         # Swallow terminal when launching app
    swallow_regex            = ^(kitty|foot|alacritty|wezterm)$
    swallow_exception_regex  = ^(mpv|imv|feh|swayimg)$
    focus_on_activate        = false        # Prevent apps stealing focus
    no_direct_scanout        = false        # Allow DRM scanout optimization
    hide_cursor_on_touch     = true
    mouse_move_focuses_monitor = true
    suppress_portal_warnings = false
    render_unfocused_fps     = 15           # fps for unfocused windows

    # ── Splash screen ────────────────────────────────────────────────────────
    disable_splash_rendering = false
    splash_font_family       =              # Empty = default font
    force_default_wallpaper  = 0            # -1=random 0=none 1-3=default

    # ── Cursor behavior ───────────────────────────────────────────────────────
    cursor_zoom_factor       = 1.0
    cursor_zoom_rigid        = false
    middle_click_paste       = true

    # ── Workspace ────────────────────────────────────────────────────────────
    initial_workspace_tracking = 1         # 0=off 1=remember 2=remember+follow
    close_special_on_empty   = true
    new_window_takes_over_fullscreen = 2   # 0=never 1=unfull 2=always
    exit_window_retains_fullscreen = false
    allow_session_lock_restore = false
    groupbar_gradients       = true

    # ── Layerrule notify ─────────────────────────────────────────────────────
    background_color         = rgba(17,17,27,ff)   # fallback bg color
}

# ══════════════════════════════════════════════════════════════════════════════
# §09  XWAYLAND
# ══════════════════════════════════════════════════════════════════════════════

xwayland {
    enabled                  = true
    use_nearest_neighbor     = true         # Sharp pixel scaling for legacy apps
    force_zero_scaling       = false        # Force 1:1 scaling (bypass HiDPI)
}

# ══════════════════════════════════════════════════════════════════════════════
# §10  OPENGL
# ══════════════════════════════════════════════════════════════════════════════

opengl {
    nvidia_anti_flicker      = true         # Nvidia specific fix
    force_introspection      = 2            # 0=off 1=force 2=nvidia-only
}

# ══════════════════════════════════════════════════════════════════════════════
# §11  RENDER
# ══════════════════════════════════════════════════════════════════════════════

render {
    explicit_sync            = 2            # 0=off 1=force 2=auto
    explicit_sync_kms        = 2
    direct_scanout           = false
    expand_undersized_textures = true
    unload_heavy_shaders     = true
    ctm_animation            = 2            # 0=off 1=direct 2=fading
    cm_enabled               = true         # Color management
    cm_fs_passthrough        = 2            # Fullscreen HDR passthrough
}

# ══════════════════════════════════════════════════════════════════════════════
# §12  CURSOR
# ══════════════════════════════════════════════════════════════════════════════

cursor {
    no_hardware_cursors      = false        # false = use hardware cursor plane
    no_break_fs_vrr          = false
    min_refresh_rate         = 24
    hotspot_padding          = 1
    inactive_timeout         = 10           # s before cursor auto-hides
    no_warps                 = false        # Prevent cursor warp on focus change
    persistent_warps         = false
    warp_on_change_workspace = false
    default_monitor          =
    zoom_factor              = 1.0
    zoom_rigid               = false
    enable_hyprcursor        = true         # Use HyprCursor format
    hide_on_key_press        = false
    hide_on_touch            = true
    allow_dumb_copy          = false
    use_cpu_buffer           = 0            # 0=auto 1=force-cpu 2=force-gpu
}

# ══════════════════════════════════════════════════════════════════════════════
# §13  ECOSYSTEM (Hyprland Cloud features)
# ══════════════════════════════════════════════════════════════════════════════

ecosystem {
    no_update_news           = false        # Show update notification
    no_donation_nag          = false        # Show donation nag
}

# ══════════════════════════════════════════════════════════════════════════════
# §14  DEBUG (production = commented)
# ══════════════════════════════════════════════════════════════════════════════

debug {
    overlay                  = false        # Debug overlay
    damage_blink             = false        # Flash damaged regions
    disable_logs             = true         # Disable most logging in prod
    disable_time             = true
    enable_stdout_logs       = false
    manual_crash             = 0
    suppress_errors          = false
    watchdog_timeout         = 5            # s before compositor is killed
    disable_scale_checks     = false
    error_position           = 0
    colored_stdout_logs      = true
}

# ══════════════════════════════════════════════════════════════════════════════
# §15  BINDS SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

binds {
    pass_mouse_when_bound    = false
    scroll_event_delay       = 300          # ms between scroll events for binds
    workspace_back_and_forth = true
    allow_workspace_cycles   = true
    workspace_center_on      = 1            # 0=last-active 1=current-cursor
    focus_preferred_method   = 0            # 0=history 1=length
    ignore_group_lock        = false
    movefocus_cycles_fullscreen = true
    disable_keybind_grabbing = false
    window_direction_monitor_fallback = true
    movefocus_cycles_groupfirst = false
}

# ══════════════════════════════════════════════════════════════════════════════
# §16  GROUP SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

group {
    insert_after_current     = true
    focus_removed_window     = true
    drag_into_group          = 1            # 0=off 1=on-drag 2=on-release
    merge_groups_on_drag     = true
    merge_groups_on_groupbar = true
    merge_floated_into_tiled_on_groupbar = false
    auto_group               = false
    col.border_active        = $colorAccent $colorMauve 45deg
    col.border_inactive      = $colorSurface1
    col.border_locked_active = $colorRed
    col.border_locked_inactive = $colorSurface0

    groupbar {
        enabled              = true
        font_family          = JetBrainsMono Nerd Font
        font_size            = 11
        gradients            = true
        gradient_rounding    = 4
        round_only_edges     = true
        render_titles        = true
        scrolling            = true
        text_color           = $colorText
        col.active           = $colorAccent $colorMauve 45deg
        col.inactive         = $colorSurface0
        col.locked_active    = $colorRed
        col.locked_inactive  = $colorSurface0
        gaps_in              = 2
        gaps_out             = 2
        height               = 20
        stacked              = false
        lazy                 = false
        priority             = 3
        indicator_height     = 3
        indicator_style      = bar         # bar | dot
    }
}