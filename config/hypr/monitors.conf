# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — Monitor Configuration                            ║
# ║  Hyprland monitor setup with per-device profiles, HiDPI, multi-monitor,    ║
# ║  VRR, HDR, color profiles, and hot-plug handling                           ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ══════════════════════════════════════════════════════════════════════════════
# §01  MONITOR FORMAT REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  monitor = NAME, RESOLUTION@HZ, POSITION, SCALE [, extra flags]
#
#  NAME       : connector name  (e.g. eDP-1, HDMI-A-1, DP-1, DP-2)
#               Use `hyprctl monitors all` to list connected outputs.
#               Use `,` (empty) as catch-all for unknown monitors.
#
#  RESOLUTION : WxH              e.g. 2560x1440
#               preferred        — use monitor's preferred resolution
#               highres          — highest available resolution
#               highrr           — highest available refresh rate
#               peak             — highest res + highest rr
#
#  POSITION   : XxY coordinates  e.g. 0x0, 2560x0, auto, auto-left
#               auto             — Hyprland picks position
#               auto-left        — place left of current monitors
#               auto-right       — place right of current monitors
#               auto-up / auto-down
#
#  SCALE      : 1, 1.25, 1.5, 2  (fractional requires render_unfocused_fps)
#
#  EXTRA FLAGS (space-separated after scale):
#    mirror,NAME          — mirror another output
#    transform,N          — 0=normal 1=90° 2=180° 3=270°
#                           4=flip 5=flip+90° 6=flip+180° 7=flip+270°
#    vrr,N                — 0=off 1=full 2=fullscreen-only
#    bitdepth,N           — 8 | 10 (for HDR)
#    hdr                  — enable HDR
#    sdrbrightness,N      — SDR brightness in HDR mode (0.0–1.0)
#    cm,NAME              — ICC color profile name
#    workspace,N          — bind workspace to monitor
#
#  EXAMPLE — 4K OLED with HDR, 120Hz, bitdepth 10:
#    monitor = DP-1, 3840x2160@120, 0x0, 1.5, bitdepth,10, hdr
#
# ══════════════════════════════════════════════════════════════════════════════
# §02  GLOBAL CATCH-ALL (Fallback for unknown / hotplug monitors)
# ══════════════════════════════════════════════════════════════════════════════

# Any unrecognized monitor → preferred resolution, auto position, scale 1
monitor = , preferred, auto, 1

# ══════════════════════════════════════════════════════════════════════════════
# §03  LAPTOP BUILT-IN DISPLAY (eDP-1)
#      Covers: ThinkPad, Framework, ASUS ROG, Dell XPS, etc.
#      Uncomment the profile matching your panel.
# ══════════════════════════════════════════════════════════════════════════════

# ── ThinkPad X1 Carbon / T14s — 2K IPS 14" (2560x1600 @ 60Hz) ───────────────
# monitor = eDP-1, 2560x1600@60, 0x0, 1.6

# ── Framework 13 — 2K IPS 13.5" (2256x1504 @ 60Hz) ──────────────────────────
# monitor = eDP-1, 2256x1504@60, 0x0, 1.5

# ── Framework 16 — QHD 16" (2560x1600 @ 165Hz) ───────────────────────────────
# monitor = eDP-1, 2560x1600@165, 0x0, 1.6

# ── ASUS ROG Zephyrus — QHD 16" (2560x1600 @ 240Hz, VRR) ────────────────────
# monitor = eDP-1, 2560x1600@240, 0x0, 1.6, vrr,1

# ── Dell XPS 13/15 — 4K OLED (3840x2400 @ 60Hz) ─────────────────────────────
# monitor = eDP-1, 3840x2400@60, 0x0, 2.0

# ── Generic FHD Laptop (1920x1080 @ 60Hz) ────────────────────────────────────
monitor = eDP-1, 1920x1080@60, 0x0, 1.0

# ── Generic 2K Laptop (2560x1440 @ 144Hz) ────────────────────────────────────
# monitor = eDP-1, 2560x1440@144, 0x0, 1.25

# ── HiDPI 4K Laptop (3840x2160 @ 60Hz) ──────────────────────────────────────
# monitor = eDP-1, 3840x2160@60, 0x0, 2.0

# ══════════════════════════════════════════════════════════════════════════════
# §04  EXTERNAL MONITORS — SINGLE DISPLAY
# ══════════════════════════════════════════════════════════════════════════════

# ── HDMI-A-1 — 1080p @ 144Hz (e.g. gaming monitor) ──────────────────────────
# monitor = HDMI-A-1, 1920x1080@144, 0x0, 1.0, vrr,2

# ── HDMI-A-1 — 1440p @ 144Hz ─────────────────────────────────────────────────
# monitor = HDMI-A-1, 2560x1440@144, 0x0, 1.0, vrr,2

# ── HDMI-A-1 — 4K @ 60Hz ─────────────────────────────────────────────────────
# monitor = HDMI-A-1, 3840x2160@60,  0x0, 1.5

# ── DP-1 — 1440p @ 165Hz, VRR ────────────────────────────────────────────────
# monitor = DP-1,     2560x1440@165, 0x0, 1.0, vrr,1

# ── DP-1 — 4K @ 144Hz, 10-bit, VRR ──────────────────────────────────────────
# monitor = DP-1,     3840x2160@144, 0x0, 1.5, bitdepth,10, vrr,1

# ── DP-1 — Ultrawide 21:9 3440x1440 @ 160Hz ──────────────────────────────────
# monitor = DP-1,     3440x1440@160, 0x0, 1.0, vrr,1

# ── DP-2 — Super-ultrawide 32:9 5120x1440 @ 120Hz ────────────────────────────
# monitor = DP-2,     5120x1440@120, 0x0, 1.0

# ══════════════════════════════════════════════════════════════════════════════
# §05  MULTI-MONITOR LAYOUTS
# ══════════════════════════════════════════════════════════════════════════════

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  DUAL MONITOR — Laptop (left) + External (right)                        │
# │  Layout:  [eDP-1 1920x1080] [HDMI-A-1 2560x1440]                       │
# └─────────────────────────────────────────────────────────────────────────┘
# monitor = eDP-1,    1920x1080@60,  0x180,    1.0
# monitor = HDMI-A-1, 2560x1440@144, 1920x0,   1.0, vrr,2

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  DUAL MONITOR — Two identical QHD side by side                          │
# │  Layout:  [DP-1 2560x1440] [DP-2 2560x1440]                            │
# └─────────────────────────────────────────────────────────────────────────┘
# monitor = DP-1, 2560x1440@165, 0x0,    1.0, vrr,1
# monitor = DP-2, 2560x1440@165, 2560x0, 1.0, vrr,1

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  DUAL MONITOR — Primary 4K + Secondary 1080p portrait                  │
# │  Layout:  [DP-1 3840x2160]  [HDMI-A-1 1080x1920 portrait right]        │
# └─────────────────────────────────────────────────────────────────────────┘
# monitor = DP-1,     3840x2160@60,  0x0,    1.5, vrr,2
# monitor = HDMI-A-1, 1920x1080@60,  2560x0, 1.0, transform,1

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  TRIPLE MONITOR — 1440p center + two 1080p flanks                      │
# │  Layout:  [HDMI-A-1 1920x1080] [DP-1 2560x1440] [DP-2 1920x1080]      │
# └─────────────────────────────────────────────────────────────────────────┘
# monitor = HDMI-A-1, 1920x1080@60,  0x180,   1.0
# monitor = DP-1,     2560x1440@144, 1920x0,  1.0, vrr,2
# monitor = DP-2,     1920x1080@60,  4480x180, 1.0

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  TRIPLE MONITOR — Three 4K displays (extreme setup)                    │
# └─────────────────────────────────────────────────────────────────────────┘
# monitor = DP-1, 3840x2160@60, 0x0,    1.5, vrr,1
# monitor = DP-2, 3840x2160@60, 2560x0, 1.5, vrr,1
# monitor = DP-3, 3840x2160@60, 5120x0, 1.5, vrr,1

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  LAPTOP DOCKED — Lid closed, external only                              │
# │  Note: disable eDP-1 when docked via autostart hook                    │
# └─────────────────────────────────────────────────────────────────────────┘
# monitor = eDP-1,    disable
# monitor = HDMI-A-1, 2560x1440@144, 0x0, 1.0, vrr,2

# ══════════════════════════════════════════════════════════════════════════════
# §06  HDR / HIGH BIT DEPTH SETUPS
# ══════════════════════════════════════════════════════════════════════════════

# ── OLED 4K 144Hz with HDR + 10-bit ──────────────────────────────────────────
# monitor = DP-1, 3840x2160@144, 0x0, 1.5, bitdepth,10, hdr, sdrbrightness,0.7, vrr,1

# ── Mini-LED 2K 240Hz with 10-bit ─────────────────────────────────────────────
# monitor = DP-1, 2560x1440@240, 0x0, 1.0, bitdepth,10, vrr,1

# ══════════════════════════════════════════════════════════════════════════════
# §07  WORKSPACE BINDINGS
#      Assign workspaces to specific monitors.
#      Workspace 1-5 → primary, 6-10 → secondary.
# ══════════════════════════════════════════════════════════════════════════════

# ── Single monitor — all workspaces on DP-1 ──────────────────────────────────
workspace = 1,  monitor:DP-1,     default:true
workspace = 2,  monitor:DP-1
workspace = 3,  monitor:DP-1
workspace = 4,  monitor:DP-1
workspace = 5,  monitor:DP-1
workspace = 6,  monitor:DP-1
workspace = 7,  monitor:DP-1
workspace = 8,  monitor:DP-1
workspace = 9,  monitor:DP-1
workspace = 10, monitor:DP-1

# ── Dual monitor splits ───────────────────────────────────────────────────────
# workspace = 1,  monitor:eDP-1,    default:true
# workspace = 2,  monitor:eDP-1
# workspace = 3,  monitor:eDP-1
# workspace = 4,  monitor:eDP-1
# workspace = 5,  monitor:eDP-1
# workspace = 6,  monitor:HDMI-A-1, default:true
# workspace = 7,  monitor:HDMI-A-1
# workspace = 8,  monitor:HDMI-A-1
# workspace = 9,  monitor:HDMI-A-1
# workspace = 10, monitor:HDMI-A-1

# ── Special workspaces ────────────────────────────────────────────────────────
workspace = special:scratch,    on-created-empty:$terminal
workspace = special:music,      on-created-empty:kitty --class music -e ncmpcpp
workspace = special:notes,      on-created-empty:obsidian
workspace = special:monitoring, on-created-empty:kitty --class monitoring -e btop
workspace = special:docker,     on-created-empty:kitty --class docker -e lazydocker

# ══════════════════════════════════════════════════════════════════════════════
# §08  MONITOR MIRROR / CLONE
# ══════════════════════════════════════════════════════════════════════════════

# ── Mirror eDP-1 to HDMI (for presentations) ─────────────────────────────────
# monitor = HDMI-A-1, preferred, auto, 1, mirror, eDP-1

# ── Mirror to all external monitors (presentation mode) ──────────────────────
# monitor = ,         preferred, auto, 1, mirror, DP-1

# ══════════════════════════════════════════════════════════════════════════════
# §09  MONITOR RULES (dynamic per-output settings)
# ══════════════════════════════════════════════════════════════════════════════

# Disable monitor when not connected
# monitorRule = name:eDP-1, disabled, when:disconnected

# ── Per-monitor render settings ───────────────────────────────────────────────
# Use `wl-randr` or `hyprctl monitors` to get exact monitor descriptions

# ══════════════════════════════════════════════════════════════════════════════
# §10  HOT-PLUG SCRIPT HOOK
#      Called by systemd/udev when a monitor is connected/disconnected.
#      Script path: ~/.config/hypr/scripts/monitor-hotplug.sh
# ══════════════════════════════════════════════════════════════════════════════

# Hotplug is handled by autostart.conf via kanshi or hyprland's built-in
# monitor reconnect. See scripts/monitor-hotplug.sh for logic.

