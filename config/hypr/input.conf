# ║  ASH DOTFILES v5.0 OMEGA — Input Configuration                              ║
# ║                                                                              ║
# ║  Covers: keyboard, mouse, touchpad, touchscreen, tablet, stylus,            ║
# ║  per-device overrides, libinput tuning, focus behavior, scroll config       ║
