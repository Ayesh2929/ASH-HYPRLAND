# §10  ACCESSIBILITY INPUT OPTIONS
# ══════════════════════════════════════════════════════════════════════════════

# ── Slow keys (for motor impairments) ────────────────────────────────────────
# Requires: kb_options = slowkeys:delay_300
# input { kb_options = accessx:slow_keys }

# ── Sticky keys (for one-handed typing) ──────────────────────────────────────
# input { kb_options = accessx:sticky_keys }

# ── Mouse keys (control cursor with numpad) ───────────────────────────────────
# input { kb_options = keypad:pointerkeys }

# ── Large cursor for visibility (set in cursor.conf) ─────────────────────────
# cursor { zoom_factor = 1.5 }

