# ══════════════════════════════════════════════════════════════════════════════
# §01  INPUT FORMAT REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  input {
#    ── Keyboard ───────────────────────────────────────────────────────────────
#    kb_layout        STRING   — XKB layout (e.g. "us", "us,de", "us,ru")
#    kb_variant       STRING   — XKB variant (e.g. "dvorak", "colemak")
#    kb_model         STRING   — XKB model  (e.g. "pc105", "hhkb")
#    kb_options       STRING   — XKB options (e.g. "caps:escape,compose:ralt")
#    kb_rules         STRING   — XKB rules file
#    kb_file          PATH     — custom XKB keymap file (overrides kb_*)
#    numlock_by_default BOOL   — start with numlock on
#    resolve_binds_by_sym BOOL — resolve binds by symbol not scan code
#    repeat_rate      N        — key repeat rate (keys/s, default 25)
#    repeat_delay     N        — key repeat delay (ms, default 600)
#
#    ── Mouse ──────────────────────────────────────────────────────────────────
#    sensitivity      N        — -1.0 to 1.0 (libinput accel, 0 = no change)
#    accel_profile    STRING   — flat | adaptive | custom
#    force_no_accel   BOOL     — bypass libinput accel (raw input)
#    left_handed      BOOL     — swap buttons
#    scroll_method    STRING   — no_scroll | 2fg | edge | on_button_down
#    scroll_button    N        — button number for on_button_down
#    scroll_button_lock BOOL   — lock scroll button state
#    scroll_factor    N        — scroll speed multiplier
#    natural_scroll   BOOL     — reverse scroll direction
#    emulate_discrete_scroll N — 0=never 1=always 2=non-wheel devices only
#    middle_button_emulation BOOL — simulate middle click via L+R
#    follow_mouse     N        — 0=off 1=full 2=loose 3=click-only
#    follow_mouse_threshold N  — distance before follow triggers (px)
#    mouse_refocus    BOOL     — refocus on click even if already focused window
#    float_switch_override_focus N — 0=off 1=on 2=on+float
#    focus_on_close   N        — 0=none 1=history 2=recent_on_monitor
#    special_fallthrough BOOL  — let mouse events fall through special ws
#    off_window_steps BOOL     — move focus when cursor leaves window edge
#    workspace_back_and_forth BOOL
#
#    touchpad { ... }           — touchpad-specific settings
#    touchdevice { ... }        — touchscreen device settings
#    tablet { ... }             — drawing tablet settings
#  }
#
#  device {                     — per-device override block
#    name     STRING            — device name from `hyprctl devices`
#    ...same keys as input{}
#  }
#
# ══════════════════════════════════════════════════════════════════════════════
# §02  GLOBAL KEYBOARD CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

input {

    # ── XKB keyboard layout ───────────────────────────────────────────────────
    # Primary layout: US English
    # Multi-layout: comma-separated (switch with Super+Space via keybind)
    kb_layout            = us
    kb_variant           =                 # Empty = default variant
    kb_model             =                 # Empty = default model (pc105)
    kb_rules             =                 # Empty = evdev rules

    # XKB extra options (colon-separated)
    # caps:escape_shifted_capslock  — Esc on tap, CapsLock on Shift+Caps
    # compose:ralt                  — Right Alt as Compose key
    # terminate:ctrl_alt_bksp       — Ctrl+Alt+Backspace = kill compositor
    # grp:alt_shift_toggle          — Alt+Shift to switch layout
    kb_options           = caps:escape_shifted_capslock,compose:ralt

    # Custom XKB file (overrides all kb_* if set)
    # kb_file = ~/.config/xkb/custom.xkb

    # ── Numlock ───────────────────────────────────────────────────────────────
    numlock_by_default   = false

    # ── Symbol vs scancode binding resolution ─────────────────────────────────
    # true  = binds match keyboard symbol regardless of layout
    # false = binds match hardware scancode position
    resolve_binds_by_sym = false

    # ── Key repeat ────────────────────────────────────────────────────────────
    # repeat_delay: ms before key begins repeating (lower = faster start)
    # repeat_rate:  keys/second during repeat (higher = faster repeat)
    # Balanced for coding: fast enough, not overwhelming
    repeat_delay         = 240             # ms  (default 600 — much faster)
    repeat_rate          = 50              # k/s (default 25  — double speed)

    # ══════════════════════════════════════════════════════════════════════════
    # §03  MOUSE / POINTER CONFIGURATION
    # ══════════════════════════════════════════════════════════════════════════

    # ── Acceleration ──────────────────────────────────────────────────────────
    # flat:     no acceleration, direct 1:1 (for gaming mice / raw input)
    # adaptive: libinput adaptive acceleration (for trackpads, office mice)
    # custom:   user-defined acceleration curve
    accel_profile        = flat
    sensitivity          = 0.0             # 0.0 = unchanged DPI from hardware
    force_no_accel       = false           # true = completely bypass libinput

    # ── Button layout ─────────────────────────────────────────────────────────
    left_handed          = false
    middle_button_emulation = false        # L+R click = middle click

    # ── Scroll configuration ──────────────────────────────────────────────────
    # 2fg = two-finger scroll (touchpad)
    # edge = scroll from touchpad edge
    # no_scroll = no touchpad scroll
    # on_button_down = hold scroll_button and move mouse
    scroll_method        = 2fg
    scroll_button        = 274             # 274 = Middle click (for on_button_down)
    scroll_button_lock   = false
    scroll_factor        = 1.0             # Multiplier for scroll speed
    natural_scroll       = false           # false = traditional (not reversed)

    # Emulate discrete scroll events for trackballs/other devices
    # 0=never, 1=always, 2=non-wheel devices only
    emulate_discrete_scroll = 1

    # ══════════════════════════════════════════════════════════════════════════
    # §04  FOCUS & CURSOR BEHAVIOR
    # ══════════════════════════════════════════════════════════════════════════

    # follow_mouse:
    #   0 = disabled (click to focus only)
    #   1 = full sloppy focus (cursor moves = focus moves)
    #   2 = loose (focus on cursor entry, but clicking still required for some)
    #   3 = click-only (no sloppy, but cursor still controls scroll focus)
    follow_mouse         = 1

    # Minimum cursor movement to trigger focus change (px)
    follow_mouse_threshold = 0

    # Refocus window even if clicking on already-focused window
    mouse_refocus        = true

    # Focus behavior on window close
    # 0=none 1=history-based 2=most-recent on monitor
    focus_on_close       = 1

    # Override focus when switching between tiled/floating
    # 0=off 1=override 2=override+prefer-float
    float_switch_override_focus = 1

    # Let mouse events fall through to windows behind special workspace
    special_fallthrough  = false

    # Don't change focus when cursor moves off window edge (stays in window)
    off_window_steps     = false

    # Switch workspace back-and-forth with same key
    workspace_back_and_forth = true

    # ══════════════════════════════════════════════════════════════════════════
    # §05  TOUCHPAD CONFIGURATION
    # ══════════════════════════════════════════════════════════════════════════

    touchpad {
        # ── Core behavior ─────────────────────────────────────────────────────
        # Natural scroll: true = macOS style (content follows finger)
        natural_scroll       = true

        # Disable touchpad while typing to prevent accidental input
        disable_while_typing = true

        # Middle click emulation (press both left+right = middle)
        middle_button_emulation = false

        # Clickfinger behavior:
        # true  = 1 finger = left, 2 fingers = right, 3 fingers = middle
        # false = click anywhere = left (traditional button areas)
        clickfinger_behavior = true

        # Tap-to-click: touch to click without physical press
        tap-to-click         = true

        # Tap-and-drag: tap + hold + move = drag
        tap-and-drag         = true

        # Drag lock: lift finger mid-drag without releasing
        drag_lock            = false

        # ── Scrolling ─────────────────────────────────────────────────────────
        # Scroll speed multiplier for touchpad two-finger scroll
        # 1.0 = libinput default, 0.7 = slightly slower, 1.5 = faster
        scroll_factor        = 0.85

        # ── Gestures (handled in gestures.conf) ───────────────────────────────
        # Additional touchpad gestures are configured in gestures.conf
    }

    # ══════════════════════════════════════════════════════════════════════════
    # §06  TOUCHSCREEN CONFIGURATION
    # ══════════════════════════════════════════════════════════════════════════

    touchdevice {
        # Screen transform (for rotated displays)
        # 0=normal 1=90° 2=180° 3=270° 4=flip 5=flip+90° 6=flip+180° 7=flip+270°
        transform            = 0

        # Bind touchscreen to specific output
        # Empty = auto-detect by proximity
        output               =

        # Enable/disable touchscreen input
        enabled              = true
    }

    # ══════════════════════════════════════════════════════════════════════════
    # §07  DRAWING TABLET CONFIGURATION
    # ══════════════════════════════════════════════════════════════════════════

    tablet {
        # Transform for rotated tablet orientation
        transform            = 0

        # Bind tablet to specific monitor output
        # Empty = follows cursor across all monitors
        output               =

        # Left-handed mode (flip tablet orientation)
        left_handed          = false

        # Active area restriction (for smaller working area)
        # [width_mm, height_mm] — [0,0] = full tablet area
        active_area_size     = [0, 0]

        # Active area starting position from tablet origin
        active_area_position = [0, 0]
    }

}

# ══════════════════════════════════════════════════════════════════════════════
# §08  PER-DEVICE OVERRIDES
#      Get device names: hyprctl devices
#      Format: device { name = "exact-device-name"; KEY = VALUE; ... }
# ══════════════════════════════════════════════════════════════════════════════

# ── ThinkPad TrackPoint ───────────────────────────────────────────────────────
# TrackPoint benefits from adaptive acceleration (not flat)
device {
    name                 = tpps/2-ibm-trackpoint
    accel_profile        = adaptive
    sensitivity          = 0.3             # Slightly boosted
    scroll_method        = on_button_down
    scroll_button        = 274             # Middle button = scroll
    scroll_button_lock   = true
    natural_scroll       = false
    middle_button_emulation = false
}

# ── ThinkPad / Synaptics Touchpad ─────────────────────────────────────────────
device {
    name                 = synps/2-synaptics-touchpad
    sensitivity          = 0.0
    accel_profile        = flat
    natural_scroll       = true
    tap-to-click         = true
    clickfinger_behavior = true
    disable_while_typing = true
    scroll_factor        = 0.80
}

# ── Framework Touchpad ────────────────────────────────────────────────────────
device {
    name                 = elan0676:00-04f3:3195-touchpad
    sensitivity          = 0.0
    natural_scroll       = true
    tap-to-click         = true
    clickfinger_behavior = true
    disable_while_typing = true
    scroll_factor        = 0.90
    drag_lock            = false
}

# ── ASUS ROG Touchpad ─────────────────────────────────────────────────────────
device {
    name                 = elan1406:00-04f3:30d7-touchpad
    sensitivity          = 0.0
    natural_scroll       = true
    tap-to-click         = true
    clickfinger_behavior = true
    scroll_factor        = 0.85
}

# ── Logitech MX Master 3 (USB/Bluetooth) ─────────────────────────────────────
device {
    name                 = logitech-mx-master-3
    accel_profile        = flat
    sensitivity          = 0.0
    scroll_factor        = 1.2             # MX Master has smooth scroll wheel
    natural_scroll       = false
    middle_button_emulation = false
}

# ── Logitech G Pro / G502 (gaming mice) ──────────────────────────────────────
device {
    name                 = logitech-g-pro-wireless-gaming-mouse
    accel_profile        = flat
    force_no_accel       = true            # Raw input for gaming
    sensitivity          = 0.0
    natural_scroll       = false
}

# ── Razer gaming mice ─────────────────────────────────────────────────────────
device {
    name                 = razer-razer-deathadder-v2
    accel_profile        = flat
    force_no_accel       = true
    sensitivity          = 0.0
    natural_scroll       = false
}

# ── Wacom tablet ──────────────────────────────────────────────────────────────
device {
    name                 = wacom-intuos-pro-m-pen
    output               = DP-1           # Bind to primary monitor
    transform            = 0
    left_handed          = false
}

# ── Apple Magic Trackpad (Bluetooth) ─────────────────────────────────────────
device {
    name                 = apple-magic-trackpad
    natural_scroll       = true
    tap-to-click         = true
    clickfinger_behavior = true
    scroll_factor        = 0.90
    accel_profile        = flat
}

# ── Steam Controller / Deck Touchpad ─────────────────────────────────────────
device {
    name                 = valve-software-steam-controller-touchpad
    accel_profile        = flat
    sensitivity          = 0.5
}

