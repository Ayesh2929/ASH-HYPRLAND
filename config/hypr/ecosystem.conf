# §09  ASH ECOSYSTEM SERVICES REGISTRY
#      All ASH background services and their management
# ══════════════════════════════════════════════════════════════════════════════

# ┌──────────────────────────────────────────────────────────────────────────┐
# │  Service                    │ Manager    │ Socket/PID                   │
# ├──────────────────────────────────────────────────────────────────────────┤
# │  ash-ipc-server             │ systemd    │ $XDG_RUNTIME_DIR/ash-ipc.sock│
# │  ash-hot-reload             │ systemd    │ watches ~/.config/hypr/       │
# │  ash-plugin-daemon          │ systemd    │ manages plugin lifecycle      │
# │  ash-api-server             │ systemd    │ localhost:2580/api/v1         │
# │  ash-theme-scheduler        │ systemd    │ cron-style theme scheduling   │
# │  ash-wallpaper-slideshow    │ systemd    │ timed wallpaper rotation      │
# │  ash-snapshot-auto          │ systemd    │ periodic config snapshots     │
# │  ash-battery-monitor        │ systemd    │ battery level alerts          │
# │  ash-weather-fetch          │ systemd    │ weather data refresh          │
# │  ash-cloud-sync             │ systemd    │ config sync (if enabled)      │
# │  ash-analytics              │ systemd    │ usage tracking (opt-in)       │
# └──────────────────────────────────────────────────────────────────────────┘

# ── Service management ────────────────────────────────────────────────────────
# systemctl --user status ash-ipc-server
# systemctl --user restart ash-hot-reload
# systemctl --user stop ash-analytics      → disable analytics
# ash service list                          → show all ASH services
# ash service restart all                   → restart all ASH services
# ash service logs ash-api-server           → tail service logs

# ══════════════════════════════════════════════════════════════════════════════
# §10  UPDATE POLICY CONFIGURATION
#      How ASH and Hyprland handle updates in this installation
# ══════════════════════════════════════════════════════════════════════════════

# ── ASH update channels ───────────────────────────────────────────────────────
# stable   — latest tagged release (recommended)
# beta     — pre-release builds (may have breaking changes)
# nightly  — git main branch builds (bleeding edge)
# pin:SHA  — pinned to specific commit hash

# ── Update check schedule ─────────────────────────────────────────────────────
# Managed by: systemd/user/ash-update-check.timer
# Default: weekly on Monday 09:00
# Override: systemctl --user edit ash-update-check.timer

# ── Automatic update behavior ────────────────────────────────────────────────
# ash config set update.auto false         → disable auto-updates
# ash config set update.notify true        → notify on available updates
# ash config set update.channel stable     → set update channel
# ash config set update.snapshot true      → snapshot before updating

# ── Manual update ─────────────────────────────────────────────────────────────
# ash update check                 → check for available updates
# ash update all                   → update everything (dotfiles + plugins + themes)
# ash update dotfiles              → update ASH dotfiles only
# ash update plugins               → update all plugins via hyprpm
# ash update themes                → update theme presets
# ash update nvim                  → update Neovim plugins
# ash update system                → update system packages (pacman/paru)

# ── Rollback if update breaks things ──────────────────────────────────────────
# ash snapshot restore             → restore pre-update snapshot
# ash update rollback              → rollback ASH to previous version
# hyprpm update --rollback PLUGIN  → rollback specific plugin

