# ══════════════════════════════════════════════════════════════════════════════
# §01  ECOSYSTEM FORMAT REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  ecosystem {
#    no_update_news   BOOL  — suppress Hyprland update notification banner
#    no_donation_nag  BOOL  — suppress donation suggestion notification
#  }
#
#  ── Hyprland Ecosystem Components ────────────────────────────────────────────
#
#  hyprpm          — Hyprland Plugin Manager (official)
#  hyprlock        — GPU-accelerated lock screen
#  hypridle        — idle timeout management daemon
#  hyprcursor      — high-resolution cursor theme format
#  hyprpaper       — wallpaper daemon (alternative to swww)
#  hyprpicker      — color picker
#  hyprshot        — screenshot utility
#  hyprsunset      — blue light filter / night mode
#  xdg-desktop-portal-hyprland — Wayland portal backend
#
#  ── Plugin ecosystem (hyprpm) ─────────────────────────────────────────────────
#  hyprspace       — workspace overview animation
#  hyprexpo        — expose/overview effect
#  hyprbars        — window title bars
#  hyprwinwrap     — embed window as wallpaper/background
#  hy3             — i3-like layout for Hyprland
#  hyprscroller    — scrolling window layout
#  hyprfocus       — window focus dimming effects
#  hyprtasking     — taskbar-style window management
#  hyprgrass       — advanced gesture support
#  hyprtrails      — window movement trails
#
# ══════════════════════════════════════════════════════════════════════════════
# §02  CORE ECOSYSTEM SETTINGS
# ══════════════════════════════════════════════════════════════════════════════

ecosystem {

    # ── Update notification ───────────────────────────────────────────────────
    # Controls whether Hyprland shows an in-session notification when
    # a new Hyprland version is available on GitHub releases.
    #
    # false = show notification (keep informed about updates)
    # true  = suppress notification (manage updates manually via ASH)
    #
    # ASH manages Hyprland updates via: ash update system
    # Notification handled by: ash update check (systemd timer)
    no_update_news               = false

    # ── Donation nag suppression ──────────────────────────────────────────────
    # Hyprland occasionally shows a "support the project" notification.
    #
    # false = show the donation suggestion (support the developers!)
    # true  = suppress donation notifications
    #
    # If ASH brings you value, consider supporting Hyprland development:
    # https://github.com/sponsors/vaxerski
    no_donation_nag              = false
}

# ══════════════════════════════════════════════════════════════════════════════
# §03  HYPRPM — PLUGIN MANAGER CONFIGURATION
#      Plugin definitions live in plugins.conf
#      hyprpm manages downloading, building and loading plugins
# ══════════════════════════════════════════════════════════════════════════════

# ── hyprpm configuration (stored in ~/.config/hypr/hyprpm/) ──────────────────
# hyprpm add URL            — add plugin repository
# hyprpm remove PLUGIN      — remove plugin
# hyprpm enable PLUGIN      — enable plugin (builds if needed)
# hyprpm disable PLUGIN     — disable plugin
# hyprpm update             — update all plugins
# hyprpm update PLUGIN      — update specific plugin
# hyprpm list               — list all installed plugins

# ── ASH plugin management wraps hyprpm ────────────────────────────────────────
# ash plugin install  PLUGIN_NAME
# ash plugin remove   PLUGIN_NAME
# ash plugin update
# ash plugin list
# ash plugin browse

# ── Plugin health check ───────────────────────────────────────────────────────
# hyprctl plugin list                   → list loaded plugins
# journalctl -t hyprland | grep plugin  → plugin load logs

# ══════════════════════════════════════════════════════════════════════════════
# §04  XDG DESKTOP PORTAL INTEGRATION
#      xdg-desktop-portal-hyprland provides:
#      • Screen capture / sharing
#      • File picker dialogs
#      • AppChooser dialogs
#      • Notification routing
#      • Global shortcuts registration
#      • Color picker
#      • Remote desktop
# ══════════════════════════════════════════════════════════════════════════════

# ── Portal startup (managed by autostart.conf) ────────────────────────────────
# exec-once = /usr/lib/xdg-desktop-portal-hyprland &
# exec-once = /usr/lib/xdg-desktop-portal &

# ── Portal configuration files ───────────────────────────────────────────────
# ~/.config/xdg-desktop-portal/hyprland-portals.conf
# Content:
# [preferred]
# default=hyprland;gtk
# org.freedesktop.impl.portal.FileChooser=gtk
# org.freedesktop.impl.portal.Notification=gtk

# ── Verify portal is running ──────────────────────────────────────────────────
# systemctl --user status xdg-desktop-portal-hyprland
# systemctl --user status xdg-desktop-portal
# busctl --user list | grep portal    → verify D-Bus registration

# ── Portal troubleshooting ────────────────────────────────────────────────────
# Screen sharing not working:
#   systemctl --user restart xdg-desktop-portal-hyprland
#   systemctl --user restart xdg-desktop-portal
#
# File picker showing wrong theme:
#   GTK_THEME=Adwaita-dark xdg-desktop-portal-gtk &
#
# Portal not found by apps:
#   Check: echo $XDG_CURRENT_DESKTOP  → should be "Hyprland"
#   Check: echo $WAYLAND_DISPLAY      → should be set

# ══════════════════════════════════════════════════════════════════════════════
# §05  HYPRLOCK INTEGRATION
#      Lock screen daemon configuration lives in config/hyprlock/
#      This section documents how ASH integrates with hyprlock
# ══════════════════════════════════════════════════════════════════════════════

# ── Hyprlock is started by: ───────────────────────────────────────────────────
# • hypridle timeout → exec: hyprlock (configured in hypridle.conf)
# • keybind: $mainMod SHIFT, L → exec, hyprlock
# • power submap: L → lock
# • systemd: loginctl lock-session → triggers hyprlock via logind

# ── Hyprlock configuration ────────────────────────────────────────────────────
# Source: ~/.config/hyprlock/hyprlock.conf
# Theme:  Applied by ASH theme engine on theme change
# Command: ash config edit hyprlock

# ── PAM authentication ────────────────────────────────────────────────────────
# /etc/pam.d/hyprlock should contain:
# auth include login
#
# Verify: pamtester hyprlock $USER authenticate

# ── hyprlock IPC ──────────────────────────────────────────────────────────────
# hyprlock --immediate            — lock immediately
# hyprlock --no-fade-in           — skip fade animation
# hyprlock --immediate --no-fade-in — instant lock (for scripts)
# hyprlock is running: pidof hyprlock

# ── ASH lock integration ──────────────────────────────────────────────────────
# ash power lock                  — lock with theme-matched hyprlock
# ash power lock --mode minimal   — lock with minimal layout
# ash power lock --photo          — lock with photo frame layout

# ══════════════════════════════════════════════════════════════════════════════
# §06  HYPRIDLE INTEGRATION
#      Idle daemon configuration lives in config/hypridle/
# ══════════════════════════════════════════════════════════════════════════════

# ── Hypridle timeout chain ────────────────────────────────────────────────────
# 2m  → dim screen to 20% brightness (reversible on input)
# 5m  → lock screen with hyprlock
# 8m  → turn off displays (DPMS off)
# 15m → suspend to RAM

# ── Hypridle IPC ──────────────────────────────────────────────────────────────
# hypridle status                 — check current idle state
# loginctl lock-session           — trigger lock via logind
# systemctl --user status hypridle

# ── Idle inhibit management ───────────────────────────────────────────────────
# ASH manages idle inhibit via:
# • ash mode cinema → enable idle inhibit (hypridle paused)
# • ash mode game   → enable idle inhibit for active game
# • Waybar idle-inhibitor module
# • windowrulev2 = idleinhibit ... (per app, in windowrules.conf)

# ── Manual idle inhibit ───────────────────────────────────────────────────────
# systemd-inhibit --what=idle --who=ash --why=manual sleep infinity &
# Or via wayland protocol: wlr-idle-inhibit-unstable-v1

# ══════════════════════════════════════════════════════════════════════════════
# §07  HYPRSUNSET INTEGRATION (Night Light / Blue Light Filter)
# ══════════════════════════════════════════════════════════════════════════════

# ── hyprsunset configuration ──────────────────────────────────────────────────
# Started in autostart.conf with daytime color temperature
# ASH night-light plugin manages dynamic transitions

# ── Color temperature guide ───────────────────────────────────────────────────
# 6500K = standard daylight (neutral white, no filter)
# 5500K = slightly warm (comfortable daytime)
# 4500K = warm (early evening)
# 3500K = very warm (late evening)
# 2700K = incandescent warmth (bedtime reading)

# ── ASH night light control ───────────────────────────────────────────────────
# ash night-light on              — enable with schedule
# ash night-light off             — disable
# ash night-light temp 4000       — set specific temperature
# ash night-light schedule        — configure auto schedule

# ── Manual hyprsunset control ─────────────────────────────────────────────────
# hyprsunset -t 6500              — daytime neutral
# hyprsunset -t 3500              — evening warm
# hyprsunset -I                   — increase temperature by step
# hyprsunset -D                   — decrease temperature by step
# pkill hyprsunset                — disable filter (kills daemon)

# ══════════════════════════════════════════════════════════════════════════════
# §08  HYPRCURSOR INTEGRATION
#      Custom cursor theme format with resolution-independent SVG cursors
# ══════════════════════════════════════════════════════════════════════════════

# ── HyprCursor theme structure ────────────────────────────────────────────────
# ~/.local/share/icons/THEME_NAME/
# ├── manifest.hl           — theme metadata
# ├── cursors/
# │   ├── default.hl        — per-cursor definition files
# │   ├── pointer.hl
# │   └── ... (see assets/icons/cursors-src/ for sources)

# ── Apply cursor theme ────────────────────────────────────────────────────────
# hyprctl setcursor THEME_NAME SIZE
# Example: hyprctl setcursor Bibata-Modern-Ice 24

# ── ASH cursor management ─────────────────────────────────────────────────────
# ash theme apply --cursor Bibata-Modern-Ice
# ash config set cursor.theme Bibata-Modern-Ice
# ash config set cursor.size 24

# ── GTK/Qt cursor sync ────────────────────────────────────────────────────────
# gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Ice'
# gsettings set org.gnome.desktop.interface cursor-size 24
# Set in ~/.config/gtk-3.0/settings.ini and env.conf XCURSOR_* vars

# ── Cursor theme verification ─────────────────────────────────────────────────
# hyprctl cursor                  → current cursor state
# echo $HYPRCURSOR_THEME          → env var check
# ls ~/.local/share/icons/        → installed themes

