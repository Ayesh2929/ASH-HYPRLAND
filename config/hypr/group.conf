# ══════════════════════════════════════════════════════════════════════════════
# §01  GROUP FORMAT REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  group {
#    ── Group Core Behavior ────────────────────────────────────────────────────
#    insert_after_current  BOOL   — insert new members after focused window
#    focus_removed_window  BOOL   — focus window that was removed from group
#    drag_into_group       N      — 0=off 1=on-drag-in 2=on-release
#    merge_groups_on_drag  BOOL   — merge two groups when one dragged into other
#    merge_groups_on_groupbar BOOL — merge groups via groupbar click
#    merge_floated_into_tiled_on_groupbar BOOL — merge float into tiled group
#    auto_group            BOOL   — automatically group new windows
#
#    ── Group Border Colors ────────────────────────────────────────────────────
#    col.border_active         COLOR — focused group border (active member)
#    col.border_inactive       COLOR — unfocused group border
#    col.border_locked_active  COLOR — locked group border (active)
#    col.border_locked_inactive COLOR — locked group border (inactive)
#
#    groupbar {
#      ── Visibility & Font ──────────────────────────────────────────────────
#      enabled         BOOL    — show/hide groupbar titlebar
#      font_family     STRING  — font for tab labels
#      font_size       N       — font size in points
#      render_titles   BOOL    — render window title text in tabs
#      scrolling       BOOL    — scroll through group members on scroll
#
#      ── Visual ────────────────────────────────────────────────────────────
#      gradients       BOOL    — gradient background for active tab
#      gradient_rounding N     — corner radius for gradient bar
#      round_only_edges BOOL   — only round outer corners of bar
#      stacked         BOOL    — stack tabs vertically (sidebar style)
#      lazy            BOOL    — lazy render (skip hidden tabs)
#      height          N       — groupbar height in pixels
#      gaps_in         N       — inner padding between tab and bar edge
#      gaps_out        N       — outer padding around entire bar
#      indicator_style STRING  — bar | dot
#      indicator_height N      — height of active indicator strip
#      priority        N       — render priority (higher = on top of title)
#
#      ── Colors ────────────────────────────────────────────────────────────
#      text_color           COLOR — tab label text color
#      col.active           COLOR — active tab background
#      col.inactive         COLOR — inactive tab background
#      col.locked_active    COLOR — locked group active tab
#      col.locked_inactive  COLOR — locked group inactive tab
#    }
#  }
#
#  ── Group Dispatchers ─────────────────────────────────────────────────────────
#  togglegroup                    — create group / toggle active window into group
#  changegroupactive f|b          — cycle active tab forward/backward
#  focuswindow class:REGEX        — focus specific window in group
#  moveoutofgroup [l|r|u|d]       — move focused window out of group
#  moveintogroup   l|r|u|d        — move focused window into adjacent group
#  movewindoworgroup l|r|u|d      — move or merge into group intelligently
#  lockgroups     lock|unlock|toggle — lock/unlock all groups
#  setignoregrouplock on|off      — toggle bind group-lock bypass
#
# ══════════════════════════════════════════════════════════════════════════════
# §02  GROUP CORE BEHAVIOR
# ══════════════════════════════════════════════════════════════════════════════

group {

    # ── Insertion policy ──────────────────────────────────────────────────────
    # true  = new windows join group after currently active tab
    # false = new windows join at end of group
    insert_after_current             = true

    # ── Focus on removal ──────────────────────────────────────────────────────
    # When a window is removed from a group, focus it automatically
    focus_removed_window             = true

    # ── Drag-to-group ─────────────────────────────────────────────────────────
    # Controls behavior when dragging a window over another window or group
    # 0 = disabled (dragging never creates or joins groups)
    # 1 = join group when window dragged into group region (on drag start)
    # 2 = join group when window dropped into group region (on release)
    drag_into_group                  = 1

    # ── Group merging ─────────────────────────────────────────────────────────
    # Merge two existing groups when one is dragged onto the other
    merge_groups_on_drag             = true

    # Merge groups by clicking groupbar of target group
    merge_groups_on_groupbar         = true

    # Allow floating window to merge into tiled group via groupbar click
    merge_floated_into_tiled_on_groupbar = false

    # ── Auto grouping ─────────────────────────────────────────────────────────
    # Automatically group new windows that open into the focused window's group
    # Useful for keeping related windows together (IDE windows, browser tabs)
    auto_group                       = false

    # ══════════════════════════════════════════════════════════════════════════
    # §03  GROUP BORDER COLORS
    #      Populated by ASH theme engine — defaults = Catppuccin Mocha
    # ══════════════════════════════════════════════════════════════════════════

    # ── Active group (focused window, focused group) ───────────────────────────
    # Animated gradient: Mauve → Blue at 45° angle
    col.border_active                = $colorMauve $colorBlue 45deg

    # ── Inactive group (unfocused group) ──────────────────────────────────────
    col.border_inactive              = $colorSurface1

    # ── Locked group — active window ──────────────────────────────────────────
    # Red accent indicates lock state clearly
    col.border_locked_active         = $colorRed $colorMaroon 45deg

    # ── Locked group — inactive window ────────────────────────────────────────
    col.border_locked_inactive       = $colorSurface0

    # ══════════════════════════════════════════════════════════════════════════
    # §04  GROUP BAR (TAB BAR) CONFIGURATION
    # ══════════════════════════════════════════════════════════════════════════

    groupbar {

        # ── Visibility ────────────────────────────────────────────────────────
        enabled                      = true

        # ── Typography ────────────────────────────────────────────────────────
        font_family                  = JetBrainsMono Nerd Font
        font_size                    = 11

        # ── Title rendering ───────────────────────────────────────────────────
        # true  = show window title text in each tab
        # false = show only colored tabs (icon-only if icons configured)
        render_titles                = true

        # ── Tab scroll ────────────────────────────────────────────────────────
        # Allow scrolling mouse wheel on groupbar to cycle through tabs
        scrolling                    = true

        # ── Visual style ──────────────────────────────────────────────────────
        # Gradient background for active tab (requires misc.groupbar_gradients)
        gradients                    = true

        # Corner radius for gradient tab background
        gradient_rounding            = 6

        # Round only the outer left/right corners (not inner tab edges)
        round_only_edges             = true

        # Stack tabs vertically (sidebar-style instead of horizontal bar)
        # Useful for ultra-wide monitors or vertical monitor setups
        stacked                      = false

        # Lazy rendering: skip hidden/inactive tabs (performance optimization)
        lazy                         = false

        # ── Dimensions ────────────────────────────────────────────────────────
        # Total groupbar height in pixels
        height                       = 22

        # Inner padding between tab content and bar edges
        gaps_in                      = 3

        # Outer padding around the entire groupbar
        gaps_out                     = 3

        # ── Active indicator ──────────────────────────────────────────────────
        # Style: bar = full-width underline, dot = small centered dot
        indicator_style              = bar

        # Height of the active tab indicator strip (px)
        # For style=bar: height of the bottom underline
        # For style=dot: diameter of the dot
        indicator_height             = 3

        # ── Z-order ───────────────────────────────────────────────────────────
        # Render priority relative to other decorations
        # Higher = rendered on top (covers other decorations)
        priority                     = 3

        # ── Colors ────────────────────────────────────────────────────────────
        # Tab label text color (all states)
        text_color                   = $colorText

        # Active tab background — gradient: Mauve → Blue
        col.active                   = $colorMauve $colorBlue 45deg

        # Inactive tab background — subtle surface
        col.inactive                 = $colorSurface0

        # Locked group active tab — red warning
        col.locked_active            = $colorRed $colorMaroon 45deg

        # Locked group inactive tab
        col.locked_inactive          = $colorSurface0
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# §05  GROUP KEYBIND INTEGRATION
#      Actual binds defined in keybinds/group-submap.conf
#      This section documents the full group bind surface
# ══════════════════════════════════════════════════════════════════════════════

# ── Core group operations ─────────────────────────────────────────────────────
# bind = $mainMod,       G,           togglegroup
# bind = $mainMod SHIFT, G,           moveoutofgroup
# bind = $mainMod,       Tab,         changegroupactive, f
# bind = $mainMod SHIFT, Tab,         changegroupactive, b

# ── Move windows into/out of groups ──────────────────────────────────────────
# bind = $mainMod CTRL,  H,           moveintogroup,        l
# bind = $mainMod CTRL,  L,           moveintogroup,        r
# bind = $mainMod CTRL,  K,           moveintogroup,        u
# bind = $mainMod CTRL,  J,           moveintogroup,        d

# ── Smart move (move window OR merge into adjacent group) ─────────────────────
# bind = $mainMod ALT,   H,           movewindoworgroup,    l
# bind = $mainMod ALT,   L,           movewindoworgroup,    r
# bind = $mainMod ALT,   K,           movewindoworgroup,    u
# bind = $mainMod ALT,   J,           movewindoworgroup,    d

# ── Lock all groups ───────────────────────────────────────────────────────────
# bind = $mainMod SHIFT, L,           lockgroups,           toggle

# ── Ignore group lock for current bind ───────────────────────────────────────
# bind = $mainMod,       I,           setignoregrouplock,   toggle

