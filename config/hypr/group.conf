# ══════════════════════════════════════════════════════════════════════════════
# §07  GROUP WINDOW RULES
#      Auto-group specific applications when they open
# ══════════════════════════════════════════════════════════════════════════════

# ── Auto-group browser windows (all Firefox windows in one group) ─────────────
# windowrulev2 = group set,         class:^(firefox)$

# ── Auto-group JetBrains IDE tool windows ─────────────────────────────────────
# windowrulev2 = group set,         class:^(jetbrains-.*)$, \
#                                    title:^((?!.*Welcome).*)$
# windowrulev2 = group barred,      class:^(jetbrains-.*)$, \
#                                    title:^(splash)$

# ── Prevent terminal windows from auto-grouping ────────────────────────────────
# windowrulev2 = group new,         class:^(kitty)$

# ── Lock specific groups by application ───────────────────────────────────────
# windowrulev2 = group lock,        class:^(obsidian)$

