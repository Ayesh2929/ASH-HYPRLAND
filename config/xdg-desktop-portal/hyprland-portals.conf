# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — xdg-desktop-portal backend selection              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📁 Location : ~/.config/xdg-desktop-portal/hyprland-portals.conf
# 📖 Docs     : https://wiki.hyprland.org/Useful-Utilities/Hyprland-desktop-portal/
#
# Referenced by config/hypr/ecosystem.conf. Install the implementations with:
#     paru -S xdg-desktop-portal-hyprland xdg-desktop-portal-gtk

[preferred]
# Hyprland's own backend handles screencast/screenshot/global-shortcuts.
default=hyprland;gtk
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.GlobalShortcuts=hyprland
org.freedesktop.impl.portal.Secret=gnome-keyring
# GTK backend covers the remaining desktop-agnostic interfaces (file chooser,
# notifications, settings, appearance…) so dialogs match the active GTK theme.
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.AppChooser=gtk
org.freedesktop.impl.portal.Notification=gtk
org.freedesktop.impl.portal.Settings=gtk
org.freedesktop.impl.portal.Access=gtk
