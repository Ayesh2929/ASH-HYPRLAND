# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔑  SSH AGENT SUPPORT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Enable SSH agent emulation
# This allows using GPG authentication keys as SSH keys
# Usage: export SSH_AUTH_SOCK=$(gpgconf --list-dirs agent-ssh-socket)
enable-ssh-support

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🖥️  PINENTRY — Wayland / GTK passphrase prompt
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Pinentry program (choose one):
# GTK4 (modern, Wayland-native)
pinentry-program /usr/bin/pinentry-gnome3

# Qt5 (KDE)
# pinentry-program /usr/bin/pinentry-qt

# GTK2
# pinentry-program /usr/bin/pinentry-gtk-2

# Curses (terminal fallback)
# pinentry-program /usr/bin/pinentry-curses

# GNOME 3 (recommended for Wayland/Hyprland)
# pinentry-program /usr/bin/pinentry-gnome3

# Rofi (ASH integrated — custom rofi pinentry)
# pinentry-program /usr/local/bin/pinentry-rofi

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ⏱️  CACHE SETTINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# How long the passphrase is cached after last use (seconds)
# 600 = 10 minutes
default-cache-ttl 600

# How long the passphrase is cached after first entry (max TTL)
# Even if used continuously, re-enter after this time
# 7200 = 2 hours
max-cache-ttl 7200

# Cache TTL for SSH keys (seconds)
# 1800 = 30 minutes
default-cache-ttl-ssh 1800

# Maximum SSH cache TTL (seconds)
# 7200 = 2 hours
max-cache-ttl-ssh 7200

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔒  SECURITY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Disable grab-wait (allows GUI pinentry to take over input)
# no-grab

# Allow loopback pinentry (for scripted / SSH agent use)
allow-loopback-pinentry

# Allow EMACS pinentry
# allow-emacs-pinentry

# Extra sockets (for ssh-agent forwarding on X11)
extra-socket /run/user/1000/gnupg/S.gpg-agent.extra

# Browser socket (PassFF extension)
browser-socket /run/user/1000/gnupg/S.gpg-agent.browser

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  💳  SMARTCARD / YUBIKEY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Enable Scdaemon (smartcard daemon) for YubiKey support
# The scdaemon is auto-started; debug it via ~/.gnupg/scdaemon.conf

# Requirements for YubiKey usage:
#  - gpg --card-status
#  - pcscd / pcsc-lite running

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📝  LOGGING
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Log file (comment out to suppress logging)
# log-file ~/.local/share/gnupg/gpg-agent.log

