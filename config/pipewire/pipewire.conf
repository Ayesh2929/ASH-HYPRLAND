# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🔥 ASH DOTFILES v5.0 OMEGA — PIPEWIRE ULTRA CONFIG                        ║
# ║  🔊 Low latency • High quality • Wayland native • Full audio graph          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

context.properties = {
    # ── Identity ──────────────────────────────────────────────────────────────
    application.name            = "PipeWire — ASH Audio Engine"
    application.language        = ""
    context.name                = pipewire-0

    # ── Logging ───────────────────────────────────────────────────────────────
    # 0=error 1=warning 2=info 3=debug 4=trace
    log.level                   = 2

    # ── CPU scheduling ────────────────────────────────────────────────────────
    # Enable realtime scheduling for the daemon
    support.dbus                = true
    mem.allow-mlock             = true
    mem.warn-mlock              = false

    # ── Daemon ────────────────────────────────────────────────────────────────
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔧  SPA PLUGINS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

context.spa-libs = {
    audio.convert.*     = audioconvert/libspa-audioconvert
    avb.*               = avb/libspa-avb
    api.alsa.*          = alsa/libspa-alsa
    api.v4l2.*          = v4l2/libspa-v4l2
    api.libcamera.*     = libcamera/libspa-libcamera
    api.bluez5.*        = bluez5/libspa-bluez5
    api.vulkan.*        = vulkan/libspa-vulkan
    api.jack.*          = jack/libspa-jack
    support.*           = support/libspa-support
    video.convert.*     = videoconvert/libspa-videoconvert
    media.session.*     = media-session/libspa-media-session
    filter.graph.*      = filter-graph/libspa-filter-graph
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔌  MODULES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

context.modules = [
    # ── Core RT ───────────────────────────────────────────────────────────────
    {   name = libpipewire-module-rt
        args = {
            nice.level          = -11
            rt.prio             = 88
            rt.time.soft        = -1
            rt.time.hard        = -1
        }
        flags = [ ifexists nofail ]
    }

    # ── Protocol Native ───────────────────────────────────────────────────────
    {   name = libpipewire-module-protocol-native }

    # ── Profiler ──────────────────────────────────────────────────────────────
    {   name = libpipewire-module-profiler }

    # ── Metadata ──────────────────────────────────────────────────────────────
    {   name = libpipewire-module-metadata }

    # ── SPA Device ────────────────────────────────────────────────────────────
    {   name = libpipewire-module-spa-device-factory }

    # ── SPA Node ──────────────────────────────────────────────────────────────
    {   name = libpipewire-module-spa-node-factory }

    # ── Client ────────────────────────────────────────────────────────────────
    {   name = libpipewire-module-client-node }

    # ── Client Device ─────────────────────────────────────────────────────────
    {   name = libpipewire-module-client-device }

    # ── Portal ────────────────────────────────────────────────────────────────
    {   name = libpipewire-module-portal
        flags = [ ifexists nofail ]
    }

    # ── Access ────────────────────────────────────────────────────────────────
    {   name = libpipewire-module-access
        args = {
            access.allowed       = [
                flatpak
                pipewire
                wireplumber
            ]
            access.rejected      = [ ]
            access.restricted    = [ ]
            access.force         = flatpak
        }
    }

    # ── Adapter ───────────────────────────────────────────────────────────────
    {   name = libpipewire-module-adapter }

    # ── Link Factory ──────────────────────────────────────────────────────────
    {   name = libpipewire-module-link-factory }

    # ── Session Manager ───────────────────────────────────────────────────────
    {   name = libpipewire-module-session-manager }

    # ── Filter Chain (DSP effects) ────────────────────────────────────────────
    {   name = libpipewire-module-filter-chain
        flags = [ ifexists nofail ]
    }

    # ── Loopback ──────────────────────────────────────────────────────────────
    {   name = libpipewire-module-loopback
        flags = [ ifexists nofail ]
    }

    # ── PulseAudio compatibility ───────────────────────────────────────────────
    {   name = libpipewire-module-protocol-pulse
        args = {
            server.address  = [ "unix:native" ]
        }
        flags = [ ifexists nofail ]
    }
]

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎛️  OBJECTS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

context.objects = [
    # ── ALSA PCM source ───────────────────────────────────────────────────────
    {   factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = Dummy-Driver
            node.group      = pipewire.dummy
            node.virtual    = true
            priority.driver = 20000
        }
    }

    # ── Combine sink ──────────────────────────────────────────────────────────
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "Null Output"
            node.description = "Null Output"
            media.class      = "Audio/Sink"
            audio.position   = "FL,FR"
            adapter.auto-port-config = {
                mode     = dsp
                monitor  = false
                control  = false
                position = preserve
            }
        }
    }
]

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ⚙️  EXEC (wireplumber)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

context.exec = [
    {   path = "/usr/bin/wireplumber"
        args = ""
    }
    {   path = "/usr/bin/pipewire-pulse"
        args = ""
    }
]
