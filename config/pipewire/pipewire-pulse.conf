# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🔥 ASH DOTFILES v5.0 OMEGA — PIPEWIRE-PULSE ULTRA CONFIG                  ║
# ║  🔊 PulseAudio compatibility layer • Zero latency • Full feature parity     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

context.properties = {
    # ── Identity ──────────────────────────────────────────────────────────────
    application.name            = "PipeWire PulseAudio — ASH"

    # ── Logging ───────────────────────────────────────────────────────────────
    log.level                   = 2

    # ── Scheduling ────────────────────────────────────────────────────────────
    mem.allow-mlock             = true

    # ── Clock ─────────────────────────────────────────────────────────────────
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 16
    default.clock.max-quantum   = 8192
    default.clock.quantum-floor = 16
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔧  SPA LIBRARIES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

context.spa-libs = {
    audio.convert.*  = audioconvert/libspa-audioconvert
    support.*        = support/libspa-support
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔌  MODULES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

context.modules = [
    # ── Real-time scheduling ───────────────────────────────────────────────────
    {   name = libpipewire-module-rt
        args = {
            nice.level          = -11
            rt.prio             = 88
            rt.time.soft        = -1
            rt.time.hard        = -1
        }
        flags = [ ifexists nofail ]
    }

    # ── Protocol native ───────────────────────────────────────────────────────
    {   name = libpipewire-module-protocol-native }

    # ── Client node ───────────────────────────────────────────────────────────
    {   name = libpipewire-module-client-node }

    # ── Metadata ──────────────────────────────────────────────────────────────
    {   name = libpipewire-module-metadata }

    # ── Session manager ───────────────────────────────────────────────────────
    {   name = libpipewire-module-session-manager }

    # ── PulseAudio Protocol ───────────────────────────────────────────────────
    {   name = libpipewire-module-protocol-pulse
        args = {
            # ── Server addresses ──────────────────────────────────────────────
            server.address = [
                "unix:native"
                "unix:/run/user/%{uid}/pulse/native"
            ]

            # ── PulseAudio compatibility properties ───────────────────────────
            vm.overrides = {
                pulse.min.req           = 16/48000     # 0.33ms
                pulse.default.req       = 512/48000    # 10.7ms
                pulse.min.frag          = 16/48000
                pulse.default.frag      = 1024/48000   # 21.3ms
                pulse.default.tlength   = 4096/48000   # 85.3ms
                pulse.min.quantum       = 16/48000
                pulse.idle.timeout      = 0
            }

            # ── PulseAudio quirks ─────────────────────────────────────────────
            pulse.fix.resampler         = true

            # ── Stateful ─────────────────────────────────────────────────────
            pulse.state.path            = "~/.local/state/pipewire/pulse-state.db"

            # ── Default sink / source ─────────────────────────────────────────
            # pulse.default.sink   = "@DEFAULT_SINK@"
            # pulse.default.source = "@DEFAULT_SOURCE@"

            # ── Extra properties ─────────────────────────────────────────────
            pulse.rules = [
                {
                    matches = [
                        { application.process.binary = "mpv" }
                    ]
                    actions = {
                        update-props = {
                            pulse.min.req       = 512/48000
                            pulse.min.quantum   = 512/48000
                        }
                    }
                }
                {
                    matches = [
                        { application.process.binary = "obs" }
                        { application.process.binary = "obs-studio" }
                    ]
                    actions = {
                        update-props = {
                            pulse.min.req       = 1024/48000
                            pulse.min.quantum   = 1024/48000
                        }
                    }
                }
                {
                    matches = [
                        { application.process.binary = "spotify" }
                    ]
                    actions = {
                        update-props = {
                            pulse.min.req       = 2048/48000
                            pulse.default.req   = 2048/48000
                        }
                    }
                }
            ]
        }
    }

    # ── Combine sink ──────────────────────────────────────────────────────────
    {   name = libpipewire-module-combine-stream
        flags = [ ifexists nofail ]
        args = {
            combine.mode    = sink
            node.name       = "combine-sink"
            node.description= "Combined Sink"
            combine.props   = {
                audio.position  = [ FL FR ]
            }
            stream.props = {
                audio.position  = [ FL FR ]
            }
        }
    }

    # ── Zeroconf discovery ────────────────────────────────────────────────────
    {   name = libpipewire-module-zeroconf-discover
        flags = [ ifexists nofail ]
    }

    # ── RAOP (AirPlay) ────────────────────────────────────────────────────────
    {   name = libpipewire-module-raop-discover
        flags = [ ifexists nofail ]
    }
]

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎛️  STREAM RULES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

stream.properties = {
    # ── Resample quality (1-15) ───────────────────────────────────────────────
    # 10 = high quality, 15 = highest (CPU-intensive)
    resample.quality    = 10

    # ── Avoid resampling when possible ────────────────────────────────────────
    resample.disable    = false
}
