# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🔥 ASH DOTFILES v5.0 OMEGA — PIPEWIRE VIRTUAL MIC ULTRA                   ║
# ║  🎙️  Multi-purpose virtual audio devices • Loopback • DSP chain             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

context.modules = [

    # ─────────────────────────────────────────────────────────────────────────
    #  🎙️  Virtual Microphone — Loopback from Desktop Audio
    #      Captures all desktop audio and exposes as a source
    #      Use case: share desktop audio in video calls
    # ─────────────────────────────────────────────────────────────────────────
    {
        name = libpipewire-module-loopback
        args = {
            node.description    = "🖥️ ASH Desktop Loopback Mic"

            capture.props = {
                node.name       = "capture.desktop-loopback"
                media.class     = "Audio/Sink"
                node.description= "Desktop Loopback — Capture"
                audio.position  = [ FL FR ]
                node.passive    = false
            }

            playback.props = {
                node.name       = "playback.desktop-loopback"
                media.class     = "Audio/Source/Virtual"
                node.description= "🖥️ Desktop Audio as Mic"
                audio.position  = [ FL FR ]
                stream.dont-remix = false
            }
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    #  🎚️  EQ Virtual Microphone — Compressor + EQ DSP chain
    #      Adds broadcast-quality processing to your microphone
    # ─────────────────────────────────────────────────────────────────────────
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description    = "🎚️ ASH Broadcast Mic (EQ + Comp)"
            media.name          = "ASH Broadcast Mic"

            filter.graph = {
                nodes = [
                    # ── High-pass filter (remove rumble below 80Hz) ───────────
                    {
                        type    = ladspa
                        name    = "highpass"
                        plugin  = "mbeq_1197"
                        label   = "mbeq"
                        control = {
                            "50Hz gain (dB)"    = -70
                            "100Hz gain (dB)"   = -70
                            "156Hz gain (dB)"   = 0
                            "220Hz gain (dB)"   = 0
                            "311Hz gain (dB)"   = 0
                            "440Hz gain (dB)"   = 0
                            "622Hz gain (dB)"   = 0
                            "880Hz gain (dB)"   = 0
                            "1250Hz gain (dB)"  = 0
                            "1750Hz gain (dB)"  = 0
                            "2500Hz gain (dB)"  = 0
                            "3500Hz gain (dB)"  = 0
                            "5000Hz gain (dB)"  = 0
                            "10000Hz gain (dB)" = 0
                            "20000Hz gain (dB)" = 0
                        }
                    }
                    # ── Compressor ────────────────────────────────────────────
                    {
                        type    = ladspa
                        name    = "compressor"
                        plugin  = "sc4_1882"
                        label   = "sc4"
                        control = {
                            "RMS/peak"          = 0
                            "Attack time (ms)"  = 6.0
                            "Release time (ms)" = 200.0
                            "Threshold level (dB)" = -18.0
                            "Ratio (1:n)"       = 4.0
                            "Knee radius (dB)"  = 3.0
                            "Makeup gain (dB)"  = 6.0
                        }
                    }
                    # ── Presence boost (voice clarity 3-5kHz) ────────────────
                    {
                        type    = builtin
                        name    = "eq"
                        label   = "bq_peaking"
                        control = {
                            "Freq"  = 4000
                            "Q"     = 0.8
                            "Gain"  = 2.5
                        }
                    }
                ]
                links = [
                    { output = "highpass:output" input = "compressor:input" }
                    { output = "compressor:output" input = "eq:input"       }
                ]
                inputs  = [ "highpass:input" ]
                outputs = [ "eq:output" ]
            }

            capture.props = {
                node.name       = "capture.broadcast-mic"
                node.description= "Broadcast Mic — Input"
                media.class     = "Audio/Source/Virtual"
                audio.position  = [ MONO ]
            }

            playback.props = {
                node.name       = "playback.broadcast-mic"
                node.description= "🎚️ ASH Broadcast Mic Output"
                media.class     = "Audio/Source"
                node.passive    = true
                audio.position  = [ FL FR ]
            }
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    #  🎵  Music Mix Virtual Mic
    #      Combines microphone + music for streaming/recording
    # ─────────────────────────────────────────────────────────────────────────
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description    = "🎵 ASH Music + Mic Mix"
            media.name          = "ASH Music Mix"

            filter.graph = {
                nodes = [
                    # ── Simple passthrough mixer (combine handled by routing)
                    {
                        type    = builtin
                        name    = "mixer"
                        label   = "mixer"
                        control = {
                            "Gain 1" = 1.0
                            "Gain 2" = 0.3
                        }
                    }
                ]
                inputs  = [ "mixer:In 1" "mixer:In 2" ]
                outputs = [ "mixer:Out" ]
            }

            capture.props = {
                node.name       = "capture.music-mix"
                media.class     = "Audio/Sink"
                node.description= "Music Mix — Input"
                audio.position  = [ FL FR ]
            }

            playback.props = {
                node.name       = "playback.music-mix"
                media.class     = "Audio/Source/Virtual"
                node.description= "🎵 ASH Music + Mic Mix"
                audio.position  = [ FL FR ]
            }
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    #  🎧  Monitor Source — Hear your own mic (sidetone)
    #      Routes mic → speakers with slight delay for monitoring
    # ─────────────────────────────────────────────────────────────────────────
    {
        name = libpipewire-module-loopback
        args = {
            node.description    = "🎧 ASH Mic Monitor (Sidetone)"

            capture.props = {
                node.name       = "capture.sidetone"
                media.class     = "Audio/Source/Virtual"
                node.description= "Sidetone — Mic In"
                audio.position  = [ FL FR ]
                node.passive    = true
                target.object   = "capture.rnnoise-stereo"
            }

            playback.props = {
                node.name       = "playback.sidetone"
                media.class     = "Audio/Sink/Virtual"
                node.description= "🎧 Sidetone Output"
                audio.position  = [ FL FR ]
                # Very low volume to avoid feedback
                node.volume     = 0.15
            }
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    #  📡  OBS Virtual Camera Audio Source
    #      Dedicated audio routing for OBS Studio
    # ─────────────────────────────────────────────────────────────────────────
    {
        name = libpipewire-module-loopback
        args = {
            node.description    = "📡 ASH OBS Audio Source"

            capture.props = {
                node.name       = "capture.obs-audio"
                media.class     = "Audio/Sink"
                node.description= "OBS Audio — Input"
                audio.position  = [ FL FR ]
                stream.dont-remix = false
            }

            playback.props = {
                node.name       = "playback.obs-audio"
                media.class     = "Audio/Source/Virtual"
                node.description= "📡 ASH OBS Audio Source"
                audio.position  = [ FL FR ]
            }
        }
    }
]
