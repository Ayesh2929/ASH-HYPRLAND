# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🔥 ASH DOTFILES v5.0 OMEGA — PIPEWIRE NOISE CANCELLATION ULTRA            ║
# ║  🎙️  RNNoise + WebRTC • Virtual mic • Zero latency noise suppression        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔇  RNNoise — Deep Learning Noise Suppressor
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
#  Creates a virtual sink+source chain:
#    [Microphone] → [RNNoise DSP] → [Virtual Mic Source]
#
#  Applications should capture from:
#    "noise-cancelled-mic" or "ASH Noise Cancelled Mic"
#
#  Install: pacman -S noise-suppression-for-voice
#           (provides /usr/lib/ladspa/librnnoise_ladspa.so)
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

context.modules = [

    # ─────────────────────────────────────────────────────────────────────────
    #  Stage 1: RNNoise virtual microphone
    # ─────────────────────────────────────────────────────────────────────────
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description    = "🎙️ ASH Noise Cancelled Mic (RNNoise)"
            media.name          = "ASH Noise Cancelled Mic"

            filter.graph = {
                nodes = [
                    # ── Capture from physical microphone ──────────────────────
                    {
                        type    = ladspa
                        name    = "rnnoise"
                        plugin  = "librnnoise_ladspa"
                        label   = "noise_suppressor_mono"
                        control = {
                            "VAD Threshold (%)" = 50.0
                        }
                    }
                ]
            }

            capture.props = {
                node.name           = "capture.rnnoise"
                node.description    = "Capture — RNNoise Input"
                media.class         = "Audio/Source/Virtual"
                audio.position      = [ MONO ]
            }

            playback.props = {
                node.name           = "playback.rnnoise"
                node.description    = "Playback — RNNoise Output"
                media.class         = "Audio/Source"
                node.passive        = true
                audio.position      = [ MONO ]
            }
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    #  Stage 2: Stereo noise-cancelled output (upmix mono → stereo)
    # ─────────────────────────────────────────────────────────────────────────
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description    = "🎙️ ASH Noise Cancelled Mic — Stereo"
            media.name          = "ASH Noise Cancelled Mic Stereo"

            filter.graph = {
                nodes = [
                    # ── Convert mono → stereo ─────────────────────────────────
                    {
                        type    = builtin
                        name    = "upmix"
                        label   = "copy"
                    }
                ]
                links = [
                    { output = "upmix:Out L" input = "output:FL" }
                    { output = "upmix:Out R" input = "output:FR" }
                ]
                inputs  = [ "upmix:In" ]
                outputs = [ "output:FL" "output:FR" ]
            }

            capture.props = {
                node.name       = "capture.rnnoise-stereo"
                media.class     = "Audio/Source/Virtual"
                audio.position  = [ MONO ]
                stream.dont-remix = false
            }

            playback.props = {
                node.name       = "playback.rnnoise-stereo"
                media.class     = "Audio/Source"
                node.passive    = true
                audio.position  = [ FL FR ]
            }
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    #  Stage 3: EchoCancellation via WebRTC
    #  Requires: pipewire-module-echo-cancel (PipeWire >= 0.3.45)
    # ─────────────────────────────────────────────────────────────────────────
    {
        name  = libpipewire-module-echo-cancel
        flags = [ ifexists nofail ]
        args  = {
            node.description    = "🔇 ASH Echo Cancelled Mic"

            # ── WebRTC AEC settings ───────────────────────────────────────────
            aec.args = "analog_gain_control=0 digital_gain_control=1 \
                        noise_suppression=1 voice_detection=1 \
                        extended_filter=1 delay_agnostic=1 \
                        refined_adaptive_filter=1"

            monitor.mode        = false

            capture.props = {
                node.name       = "capture.echo-cancel"
                node.description= "Echo Cancel Capture"
                media.class     = "Audio/Source/Virtual"
                audio.position  = [ FL FR ]
            }

            source.props = {
                node.name       = "source.echo-cancel"
                node.description= "🔇 ASH Echo Cancelled Source"
                media.class     = "Audio/Source"
                audio.position  = [ FL FR ]
            }

            sink.props = {
                node.name       = "sink.echo-cancel"
                node.description= "🔇 ASH Echo Cancelled Sink"
                media.class     = "Audio/Sink"
                audio.position  = [ FL FR ]
            }

            playback.props = {
                node.name       = "playback.echo-cancel"
                node.description= "Echo Cancel Playback"
                media.class     = "Audio/Sink/Virtual"
                audio.position  = [ FL FR ]
            }
        }
    }
]
