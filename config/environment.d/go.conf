# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🔥 ASH DOTFILES v5.0 OMEGA — GO ENVIRONMENT ULTRA                         ║
# ║  🐹 Module proxy • Cache • Build • CGO • Performance                        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📁  PATHS (XDG-compliant)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Go workspace root
GOPATH=${HOME}/go

# Module cache (downloaded module sources)
GOMODCACHE=${GOPATH}/pkg/mod

# Build cache (compiled packages)
GOCACHE=${HOME}/.cache/go/build

# Installed binaries (go install)
# GOBIN=${HOME}/.local/bin  # uncomment to install to ~/.local/bin instead

# PATH extension (Go binaries)
PATH=${GOPATH}/bin:${PATH}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🌐  MODULE PROXY & PRIVACY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Module proxy (official proxy)
GOPROXY=https://proxy.golang.org,direct

# Checksum database
GONOSUMDB=*.corp.example.com,*.internal.*

# Private modules (bypass proxy + checksum for these)
GOPRIVATE=*.corp.example.com,github.com/your-private-org/*

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🏗️  BUILD
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# CGO (C interop, disable for pure static builds)
CGO_ENABLED=1

# Toolchain auto-selection
GOTOOLCHAIN=auto

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ⚡  PERFORMANCE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# GC tuning (default 100 = GC when heap doubles)
GOGC=100

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔒  PRIVACY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Disable telemetry (Go 1.23+)
GOTELEMETRY=off
GOTELEMETRYDIR=${HOME}/.local/share/go/telemetry