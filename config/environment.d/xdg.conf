#
# XDG Base Directory Specification:
# https://specifications.freedesktop.org/basedir-spec/basedir-spec-latest.html

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📁  XDG BASE DIRECTORIES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# User-specific config files (default: ~/.config)
XDG_CONFIG_HOME=${HOME}/.config

# User-specific data files (default: ~/.local/share)
XDG_DATA_HOME=${HOME}/.local/share

# User-specific state files (default: ~/.local/state)
XDG_STATE_HOME=${HOME}/.local/state

# User-specific non-essential cache files (default: ~/.cache)
XDG_CACHE_HOME=${HOME}/.cache

# User-specific runtime files (set by systemd pam module)
# XDG_RUNTIME_DIR=/run/user/${UID}  — set by systemd, don't override

# System-wide data directories (colon-separated, searched in order)
XDG_DATA_DIRS=/usr/local/share:/usr/share:/var/lib/flatpak/exports/share:${HOME}/.local/share/flatpak/exports/share

# System-wide configuration directories
XDG_CONFIG_DIRS=/etc/xdg

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🗂️  XDG USER DIRECTORIES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# (Also defined in user-dirs.dirs, but exported here for app compatibility)

XDG_DESKTOP_DIR=${HOME}/Desktop
XDG_DOWNLOAD_DIR=${HOME}/Downloads
XDG_TEMPLATES_DIR=${HOME}/Templates
XDG_PUBLICSHARE_DIR=${HOME}/Public
XDG_DOCUMENTS_DIR=${HOME}/Documents
XDG_MUSIC_DIR=${HOME}/Music
XDG_PICTURES_DIR=${HOME}/Pictures
XDG_VIDEOS_DIR=${HOME}/Videos

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔧  APPLICATION-SPECIFIC XDG OVERRIDES
#  (force apps to respect XDG — many ignore it by default)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Development Tools ──────────────────────────────────────────────────────────

# Cargo (Rust package manager)
CARGO_HOME=${XDG_DATA_HOME}/cargo

# Rustup (Rust toolchain manager)
RUSTUP_HOME=${XDG_DATA_HOME}/rustup

# Go workspace
GOPATH=${HOME}/go
GOMODCACHE=${GOPATH}/pkg/mod
GOCACHE=${XDG_CACHE_HOME}/go/build

# Node.js / npm
NPM_CONFIG_USERCONFIG=${XDG_CONFIG_HOME}/npm/.npmrc
NPM_CONFIG_CACHE=${XDG_CACHE_HOME}/npm
NODE_REPL_HISTORY=${XDG_STATE_HOME}/node/repl_history

# pnpm
PNPM_HOME=${XDG_DATA_HOME}/pnpm

# Deno
DENO_DIR=${XDG_CACHE_HOME}/deno
DENO_INSTALL_ROOT=${XDG_DATA_HOME}/deno/bin
DENO_CERT=

# Bun
BUN_INSTALL=${XDG_DATA_HOME}/bun

# Python
PYTHONSTARTUP=${XDG_CONFIG_HOME}/python/startup.py
PYTHONPYCACHEPREFIX=${XDG_CACHE_HOME}/python
PYTHONUSERBASE=${XDG_DATA_HOME}/python
PYENV_ROOT=${XDG_DATA_HOME}/pyenv
POETRY_HOME=${XDG_DATA_HOME}/pypoetry
POETRY_CACHE_DIR=${XDG_CACHE_HOME}/pypoetry
RUFF_CACHE_DIR=${XDG_CACHE_HOME}/ruff
MYPY_CACHE_DIR=${XDG_CACHE_HOME}/mypy
UV_CACHE_DIR=${XDG_CACHE_HOME}/uv
UV_DATA_DIR=${XDG_DATA_HOME}/uv
UV_CONFIG_FILE=${XDG_CONFIG_HOME}/uv/uv.toml

# Zig
ZIG_GLOBAL_CACHE_DIR=${XDG_CACHE_HOME}/zig

# Java
GRADLE_USER_HOME=${XDG_DATA_HOME}/gradle
MAVEN_OPTS=-Duser.home=${XDG_DATA_HOME}/maven

# Ruby
GEM_HOME=${XDG_DATA_HOME}/gem
GEM_SPEC_CACHE=${XDG_CACHE_HOME}/gem

# Lua
LUAROCKS_CONFIG=${XDG_CONFIG_HOME}/luarocks/config.lua

# Perl
PERL_LOCAL_LIB_ROOT=${XDG_DATA_HOME}/perl5
PERL_MB_OPT=--install_base ${XDG_DATA_HOME}/perl5
PERL_MM_OPT=INSTALL_BASE=${XDG_DATA_HOME}/perl5
PERL5LIB=${XDG_DATA_HOME}/perl5/lib/perl5

# Haskell / GHCup
GHCUP_USE_XDG_DIRS=1

# ── Shell Tools ────────────────────────────────────────────────────────────────

# Bash
HISTFILE=${XDG_STATE_HOME}/bash/history

# Readline
INPUTRC=${XDG_CONFIG_HOME}/readline/inputrc

# Atuin (shell history)
ATUIN_CONFIG_DIR=${XDG_CONFIG_HOME}/atuin

# zoxide
_ZO_DATA_DIR=${XDG_DATA_HOME}/zoxide

# fzf
FZF_DEFAULT_OPTS_FILE=${XDG_CONFIG_HOME}/fzf/fzf.conf

# ── Editors ────────────────────────────────────────────────────────────────────

# Neovim (comes with built-in XDG support in newer versions)
NVIM_APPNAME=nvim

# Vim (force XDG-ish config location)
VIMINIT='let $MYVIMRC="${XDG_CONFIG_HOME}/vim/vimrc" | source $MYVIMRC'

# ── Version Managers ──────────────────────────────────────────────────────────

# asdf
ASDF_DATA_DIR=${XDG_DATA_HOME}/asdf
ASDF_CONFIG_FILE=${XDG_CONFIG_HOME}/asdf/asdfrc

# mise (replaces asdf)
MISE_DATA_DIR=${XDG_DATA_HOME}/mise
MISE_CONFIG_DIR=${XDG_CONFIG_HOME}/mise
MISE_CACHE_DIR=${XDG_CACHE_HOME}/mise

# nvm
NVM_DIR=${XDG_DATA_HOME}/nvm

# ── DevOps & Cloud ────────────────────────────────────────────────────────────

# Docker
DOCKER_CONFIG=${XDG_CONFIG_HOME}/docker

# Kubernetes
KUBECONFIG=${XDG_CONFIG_HOME}/kubernetes/config

# Helm
HELM_DATA_HOME=${XDG_DATA_HOME}/helm
HELM_CONFIG_HOME=${XDG_CONFIG_HOME}/helm
HELM_CACHE_HOME=${XDG_CACHE_HOME}/helm

# Terraform
TF_CLI_ARGS=
TERRAFORM_PLUGINS_CACHE=${XDG_CACHE_HOME}/terraform

# AWS CLI
AWS_CONFIG_FILE=${XDG_CONFIG_HOME}/aws/config
AWS_SHARED_CREDENTIALS_FILE=${XDG_CONFIG_HOME}/aws/credentials

# ── Media ──────────────────────────────────────────────────────────────────────

# FFmpeg
FFMPEG_DATADIR=${XDG_DATA_HOME}/ffmpeg

# ── Security ───────────────────────────────────────────────────────────────────

# GnuPG
GNUPGHOME=${XDG_DATA_HOME}/gnupg

# pass (password manager)
PASSWORD_STORE_DIR=${XDG_DATA_HOME}/pass

# ── Gaming ─────────────────────────────────────────────────────────────────────

# Steam (cannot be fully relocated, but set cache)
# STEAM_DIR=${XDG_DATA_HOME}/Steam

# Wine
WINEPREFIX=${XDG_DATA_HOME}/wine

# ── Misc ───────────────────────────────────────────────────────────────────────

# wget
WGETRC=${XDG_CONFIG_HOME}/wget/wgetrc

# curl
CURL_HOME=${XDG_CONFIG_HOME}/curl

# ripgrep
RIPGREP_CONFIG_PATH=${XDG_CONFIG_HOME}/ripgrep/config

# bat
BAT_CONFIG_PATH=${XDG_CONFIG_HOME}/bat/config
BAT_CACHE_PATH=${XDG_CACHE_HOME}/bat

# fd
# (uses XDG_CONFIG_HOME/fd/ automatically)

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔀  PATH EXTENSIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Prepend user local bin and tool bins to PATH (xdg convention)
PATH=${HOME}/.local/bin:${CARGO_HOME}/bin:${GOPATH}/bin:${XDG_DATA_HOME}/pnpm:${BUN_INSTALL}/bin:${XDG_DATA_HOME}/bun/bin:${PYENV_ROOT}/bin:${ASDF_DATA_HOME}/shims:${GEM_HOME}/bin:${PATH}