# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔥  ASH CORE IDENTITY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Sentinel — marks the ASH environment as active
ASH_DOTFILES=1

# Version
ASH_VERSION=5.0.0

# Release name
ASH_RELEASE=omega

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📁  ASH DIRECTORY STRUCTURE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Root of the ASH dotfiles repository
ASH_ROOT=${HOME}/.config/ash-dotfiles

# ASH CLI binary location
ASH_BIN=${ASH_ROOT}/ash-cli/ash

# Configuration directory (symlinked or direct)
ASH_CONFIG_DIR=${HOME}/.config

# Local data directory (state, databases, history)
ASH_DATA_DIR=${HOME}/.local/share/ash-dotfiles

# Cache directory (theme previews, wallpaper cache, color extracts)
ASH_CACHE_DIR=${HOME}/.cache/ash-dotfiles

# Runtime directory (IPC sockets, PID files, temp state)
ASH_RUNTIME_DIR=/run/user/${UID}/ash-dotfiles

# Log directory
ASH_LOG_DIR=${HOME}/.local/state/ash-dotfiles/logs

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎨  THEME ENGINE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Active theme name
ASH_THEME=catppuccin-mocha

# Active theme variant (dark | light | neon | custom)
ASH_THEME_VARIANT=dark

# Theme directory
ASH_THEMES_DIR=${ASH_ROOT}/themes

# Active theme path
ASH_THEME_PATH=${ASH_THEMES_DIR}/presets/dark/catppuccin-mocha

# Dynamic theme path (live-generated)
ASH_THEME_DYNAMIC=${ASH_DATA_DIR}/themes/dynamic

# User themes directory (personal themes)
ASH_THEMES_USER=${ASH_THEMES_DIR}/user

# Color extraction quality (1-10, higher = slower but more accurate)
ASH_COLOR_QUALITY=8

# Color space (srgb | p3 | oklch)
ASH_COLOR_SPACE=srgb

# Theme transition duration (ms, 0 = instant)
ASH_THEME_TRANSITION=350

# ── Active Theme Colors (set by ash theme apply) ──────────────────────────────
# These are populated at runtime by the ASH theme engine

ASH_COLOR_ROSEWATER=#f5e0dc
ASH_COLOR_FLAMINGO=#f2cdcd
ASH_COLOR_PINK=#f5c2e7
ASH_COLOR_MAUVE=#cba6f7
ASH_COLOR_RED=#f38ba8
ASH_COLOR_MAROON=#eba0ac
ASH_COLOR_PEACH=#fab387
ASH_COLOR_YELLOW=#f9e2af
ASH_COLOR_GREEN=#a6e3a1
ASH_COLOR_TEAL=#94e2d5
ASH_COLOR_SKY=#89dceb
ASH_COLOR_SAPPHIRE=#74c7ec
ASH_COLOR_BLUE=#89b4fa
ASH_COLOR_LAVENDER=#b4befe
ASH_COLOR_TEXT=#cdd6f4
ASH_COLOR_SUBTEXT1=#bac2de
ASH_COLOR_SUBTEXT0=#a6adc8
ASH_COLOR_OVERLAY2=#9399b2
ASH_COLOR_OVERLAY1=#7f849c
ASH_COLOR_OVERLAY0=#6c7086
ASH_COLOR_SURFACE2=#585b70
ASH_COLOR_SURFACE1=#45475a
ASH_COLOR_SURFACE0=#313244
ASH_COLOR_BASE=#1e1e2e
ASH_COLOR_MANTLE=#181825
ASH_COLOR_CRUST=#11111b

# Semantic aliases
ASH_COLOR_ACCENT=#cba6f7
ASH_COLOR_BG=#1e1e2e
ASH_COLOR_FG=#cdd6f4

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔌  PLUGIN SYSTEM
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Plugin directory
ASH_PLUGINS_DIR=${ASH_ROOT}/plugins

# Enabled plugins (colon-separated list)
# (managed by ash plugin enable/disable commands)
ASH_PLUGINS_ENABLED=game-mode:caffeine:auto-wallpaper:blur-toggle:focus-timer:night-light:do-not-disturb:battery-alerts:clipboard-manager:weather-display

# Plugin data directory
ASH_PLUGINS_DATA=${ASH_DATA_DIR}/plugins

# Plugin registry (local copy of remote registry)
ASH_PLUGIN_REGISTRY=${ASH_CACHE_DIR}/plugin-registry.json

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📸  SNAPSHOT SYSTEM
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Snapshot storage directory
ASH_SNAPSHOTS_DIR=${ASH_DATA_DIR}/snapshots

# Maximum snapshots to keep (0 = unlimited)
ASH_SNAPSHOT_MAX=50

# Auto-snapshot before theme changes
ASH_SNAPSHOT_AUTO=1

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🖼️  WALLPAPER ENGINE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Wallpaper directory
ASH_WALLPAPERS_DIR=${ASH_ROOT}/wallpapers

# Current wallpaper path
ASH_WALLPAPER_CURRENT=${ASH_DATA_DIR}/state/current-wallpaper

# Wallpaper setter backend (swww | swaybg | hyprpaper | mpvpaper)
ASH_WALLPAPER_BACKEND=swww

# Wallpaper transition (for swww)
ASH_WALLPAPER_TRANSITION=grow

# Blur wallpaper for lock screen
ASH_WALLPAPER_BLUR=15

# Slideshow interval (minutes, 0 = disabled)
ASH_WALLPAPER_SLIDESHOW=0

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎭  MODES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Current operating mode (default | game | work | focus | cinema | present | battery | stream | privacy)
ASH_MODE=default

# Mode data directory
ASH_MODES_DIR=${ASH_ROOT}/config/hypr/modes

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🤖  AI ENGINE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Ollama API endpoint (local AI)
ASH_AI_ENDPOINT=http://127.0.0.1:11434

# Ollama model for theme generation
ASH_AI_MODEL=llama3.2

# AI features enabled
ASH_AI_ENABLED=1

# AI model cache
ASH_AI_CACHE=${ASH_CACHE_DIR}/ai-models

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🌐  REST API SERVER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# API server host & port
ASH_API_HOST=127.0.0.1
ASH_API_PORT=7070

# API base URL
ASH_API_URL=http://${ASH_API_HOST}:${ASH_API_PORT}

# API authentication token (auto-generated on first run)
# ASH_API_TOKEN=  (set at runtime)

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📡  IPC
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# IPC socket path
ASH_IPC_SOCKET=/run/user/${UID}/ash-dotfiles/ash.sock

# IPC protocol version
ASH_IPC_VERSION=1

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔄  HOT RELOAD
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Enable hot reload watcher
ASH_HOT_RELOAD=1

# Debounce time for hot reload (ms)
ASH_HOT_RELOAD_DEBOUNCE=300

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📊  ANALYTICS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Local analytics enabled (never leaves your machine)
ASH_ANALYTICS=1

# Analytics database
ASH_ANALYTICS_DB=${ASH_DATA_DIR}/analytics/analytics.db

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔒  SECURITY & PRIVACY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Send anonymous telemetry to ASH developers (0 = disabled, 1 = enabled)
ASH_TELEMETRY=0

# Auto-update check (0 = manual, 1 = check on startup)
ASH_UPDATE_CHECK=1

# Update channel (stable | beta | nightly)
ASH_UPDATE_CHANNEL=stable

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔧  DEVELOPER & DEBUG
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Log level (error | warn | info | debug | trace)
ASH_LOG_LEVEL=warn

# Debug mode (0 = off, 1 = verbose logging)
ASH_DEBUG=0

# Dry run mode (0 = apply changes, 1 = show what would change)
ASH_DRY_RUN=0

# Performance profiling
ASH_PROFILE=0

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔤  FONTS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# UI font (used by AGS, waybar, rofi)
ASH_FONT_UI=Inter

# Monospace font (used by terminal, editor, code blocks)
ASH_FONT_MONO=JetBrainsMono Nerd Font

# Font size
ASH_FONT_SIZE=12

# Icon font
ASH_FONT_ICON=Material Design Icons

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🌤️  INTEGRATIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Weather API key (for weather-based themes)
# ASH_WEATHER_API_KEY=your-openweathermap-key

# Weather location (city name or lat,lon)
# ASH_WEATHER_LOCATION=New York

# Discord webhook for notifications (optional)
# ASH_DISCORD_WEBHOOK=

# Home Assistant URL (for smart home integration)
# ASH_HA_URL=http://homeassistant.local:8123

# Home Assistant token
# ASH_HA_TOKEN=

# Spotify client ID (for music-reactive themes)
# ASH_SPOTIFY_CLIENT_ID=

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🗄️  STORE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ASH theme store URL
ASH_STORE_URL=https://themes.ash-dotfiles.dev

# ASH plugin store URL
ASH_PLUGIN_STORE_URL=https://plugins.ash-dotfiles.dev

# Local store cache
ASH_STORE_CACHE=${ASH_CACHE_DIR}/store