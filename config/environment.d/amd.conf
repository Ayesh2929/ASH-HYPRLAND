# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🔥 ASH DOTFILES v5.0 OMEGA — AMD GPU ENVIRONMENT ULTRA                    ║
# ║  🔴 RDNA • VA-API • ROCm • Vulkan • VRR • Performance tuning               ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ⚠️  ONLY SOURCE THIS FILE ON AMD GPU SYSTEMS
#
# ASH auto-detection in fish/conf.d/amd.fish:
#   if lspci | grep -qi 'amd\|radeon\|amdgpu'; source this file; end

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🖥️  MESA / RADV (AMDGPU)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Force RADV (RADEON Vulkan) over AMDVLK for better performance
AMD_VULKAN_ICD=RADV
VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/radeon_icd.x86_64.json

# Mesa driver (force amdgpu for modern AMD cards)
MESA_LOADER_DRIVER_OVERRIDE=radeonsi

# Disable Vulkan validation layers (enable for debugging)
# RADV_DEBUG=

# Enable ACO shader compiler (default in Mesa, but make explicit)
# RADV_PERFTEST=aco

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎬  VA-API (VIDEO ACCELERATION)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# VA-API driver for AMD (radeonsi via Mesa)
LIBVA_DRIVER_NAME=radeonsi

# VA-API display backend (DRM is correct for Wayland)
LIBVA_DISPLAY=drm

# Enable VA-API in Firefox
MOZ_DISABLE_RDD_SANDBOX=1

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🚀  ROCm (GPU COMPUTE)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ROCm installation path
ROCM_PATH=/opt/rocm

# ROCm device visibility (all = use all AMD GPUs)
HIP_VISIBLE_DEVICES=0

# HSA (Heterogeneous System Architecture) override
# For RX 6000/7000 series RDNA2/3 cards not officially supported by ROCm
HSA_OVERRIDE_GFX_VERSION=11.0.0

# ROCm HIP compiler
HIPCC_COMPILE_FLAGS_APPEND=--offload-arch=gfx1100

# OpenCL platform (ROCm)
# OCL_ICD_VENDORS=/etc/OpenCL/vendors/amdocl64.icd

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎮  GAMING & PERFORMANCE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# DXVK async shader compilation (faster game starts)
DXVK_ASYNC=1

# VKD3D-Proton performance
VKD3D_FEATURE_LEVEL=12_2
VKD3D_SHADER_CACHE_PATH=${XDG_CACHE_HOME:-${HOME}/.cache}/vkd3d-proton

# MESA shader cache (speeds up shader compilation)
MESA_SHADER_CACHE_DIR=${XDG_CACHE_HOME:-${HOME}/.cache}/mesa_shader_cache
MESA_SHADER_CACHE_MAX_SIZE=10G

# Mesa Gallium Nine (for older DX9 games, if using nine)
# MESA_NINE_QUIRK=nofp64

# Radeon performance level (auto | low | high | manual)
# Set dynamically for gaming via ASH game mode:
# echo "high" > /sys/class/drm/card0/device/power_dpm_force_performance_level

# FreeSync / VRR (enable in Hyprland config)
# FREESYNC=1

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔧  DEBUGGING & PROFILING
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Mesa debug (uncomment for troubleshooting)
# MESA_DEBUG=1
# LIBGL_DEBUG=verbose
# RADV_DEBUG=startup

# GPU performance overlay (enable with MangoHud)
# MANGOHUD=1

# AMD GPU sensor access
# (requires amdgpu kernel module)
# GPU_MAX_HEAP_SIZE=100
# GPU_MAX_ALLOC_PERCENT=100
# GPU_SINGLE_ALLOC_PERCENT=100
# GPU_MAX_SINGLE_ALLOC_PERCENT=100