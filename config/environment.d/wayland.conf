#
# Loaded by systemd user session (pam_env / environment.d)
# Path: ~/.config/environment.d/wayland.conf
# All vars exported to the entire user session (GUI apps, terminals, etc.)

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🖥️  WAYLAND DISPLAY PROTOCOL
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Force Wayland backend for GTK4 apps
GDK_BACKEND=wayland,x11

# Force Wayland backend for Qt apps
QT_QPA_PLATFORM=wayland;xcb

# Qt Wayland decoration style
# server-side: let compositor decorate (Hyprland does this)
# client-side: app draws its own decorations
QT_WAYLAND_DECORATION=adwaita

# Disable Qt window icon (reduces visual noise)
QT_WAYLAND_DISABLE_WINDOWDECORATION=1

# Force Wayland for SDL2 (games, emulators)
SDL_VIDEODRIVER=wayland

# Force Wayland for CLUTTER (GNOME apps)
CLUTTER_BACKEND=wayland

# Force Wayland for EFL/Enlightenment apps
ELM_DISPLAY=wl
ELM_ACCEL=opengl

# XWayland scaling (2x scaling for 4K)
# Uncomment if XWayland apps appear tiny on HiDPI
# XWAYLAND_FORCE_DPI=192

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔊  AUDIO — PIPEWIRE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# PipeWire runtime directory
PIPEWIRE_RUNTIME_DIR=/run/user/${UID}

# PipeWire latency hint (lower = less latency, more CPU)
# Format: NUMERATOR/DENOMINATOR (e.g., 128/48000 ≈ 2.7ms)
# PIPEWIRE_LATENCY=128/48000

# Force PipeWire backend for ALSA apps
ALSA_CONFIG_PATH=/usr/share/alsa/alsa.conf

# PulseAudio compat socket (via PipeWire)
PULSE_SERVER=unix:/run/user/${UID}/pulse/native

# PulseAudio runtime dir
PULSE_RUNTIME_PATH=/run/user/${UID}/pulse

# JACK compat via PipeWire
# JACK_DEFAULT_SERVER=pipewire

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔔  DBUS & PORTALS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# DBus session address (set by systemd, but ensure availability)
# DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${UID}/bus

# XDG Desktop Portal backend for Hyprland
# (required for file picker, screen sharing, etc.)
XDG_CURRENT_DESKTOP=Hyprland
XDG_SESSION_TYPE=wayland
XDG_SESSION_DESKTOP=Hyprland

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔍  SCREEN SHARING & CAPTURE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# PipeWire camera portal
LIBCAMERA_LOG_LEVELS=0

# Enable PipeWire screen capture for Chrome/Electron
# CHROME_FLAGS_EXTRA=--enable-features=WebRTCPipeWireCapturer

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📏  SCALING & HiDPI
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Qt scaling factor (1.0 = 100%, 1.5 = 150%, 2.0 = 200%)
# Set to match your Hyprland monitor scale setting
QT_SCALE_FACTOR=1

# GTK scale (integer only: 1, 2)
# GDK_SCALE=1

# GTK DPI override
# GDK_DPI_SCALE=1.0

# Enable fractional scaling support for Qt
QT_ENABLE_HIGHDPI_SCALING=1

# Cursor size (px) — match your Hyprland cursor_size setting
XCURSOR_SIZE=24

# Cursor theme — match Hyprland cursor theme
XCURSOR_THEME=Catppuccin-Mocha-Dark-Cursors

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎨  THEMING
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Qt platform theme (qt5ct / qt6ct for theming without KDE)
QT_QPA_PLATFORMTHEME=qt6ct

# Qt style override
# QT_STYLE_OVERRIDE=kvantum

# GTK theme (set via gsettings, but can override here)
# GTK_THEME=Catppuccin-Mocha-Standard-Mauve-Dark

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🖱️  INPUT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Disable middle-click paste globally (annoying on Linux)
# (set per-app or via xsettings)

# libinput — disable pointer acceleration (set in Hyprland config instead)
# LIBINPUT_DISABLE_TOUCHPAD_WHILE_TYPING=1

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔒  SECURITY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# SSH agent (GPG agent as SSH agent)
SSH_AUTH_SOCK=/run/user/${UID}/gnupg/S.gpg-agent.ssh

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🌍  LOCALE & INPUT METHOD
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Input method framework (for CJK and other scripts)
# GTK_IM_MODULE=fcitx
# QT_IM_MODULE=fcitx
# XMODIFIERS=@im=fcitx

# Or for IBus
# GTK_IM_MODULE=ibus
# QT_IM_MODULE=ibus
# XMODIFIERS=@im=ibus

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📋  CLIPBOARD
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Clipboard manager socket (cliphist)
# CLIPHIST_SOCK=/run/user/${UID}/cliphist.sock

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🖥️  TERMINAL
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Default terminal emulator
TERMINAL=kitty

# Terminal color support
COLORTERM=truecolor
TERM=xterm-256color

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🌐  BROWSER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Default browser
BROWSER=firefox

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ✏️  EDITOR
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Default editor
EDITOR=nvim
VISUAL=nvim

# Pager
PAGER=less

# less config
LESS=-RFXi
LESS_TERMCAP_mb=$'\e[1;31m'
LESS_TERMCAP_md=$'\e[1;36m'
LESS_TERMCAP_me=$'\e[0m'
LESS_TERMCAP_so=$'\e[01;44;33m'
LESS_TERMCAP_se=$'\e[0m'
LESS_TERMCAP_us=$'\e[1;32m'
LESS_TERMCAP_ue=$'\e[0m'