# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📁  PATHS (XDG-compliant)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# pyenv root (Python version manager)
PYENV_ROOT=${HOME}/.local/share/pyenv

# PATH extension
PATH=${PYENV_ROOT}/bin:${PYENV_ROOT}/shims:${HOME}/.local/bin:${PATH}

# pip user base
PYTHONUSERBASE=${HOME}/.local

# pyc cache (keep __pycache__ out of source dirs)
PYTHONPYCACHEPREFIX=${HOME}/.cache/python

# Python startup script (runs on interactive Python start)
PYTHONSTARTUP=${HOME}/.config/python/startup.py

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔧  RUNTIME BEHAVIOR
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Don't write .pyc files (set to 2 to disable entirely)
# PYTHONDONTWRITEBYTECODE=1

# Don't buffer stdout/stderr (better for logging / piping)
PYTHONUNBUFFERED=1

# UTF-8 mode (default in Python 3.15+, good to set explicitly)
PYTHONUTF8=1

# Suppress deprecation warnings in user code
# PYTHONWARNINGS=ignore::DeprecationWarning

# Hash randomization seed (for reproducible builds/tests, set to specific value)
# PYTHONHASHSEED=0  # 0 = random (secure default)

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📦  PACKAGE MANAGERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Poetry
POETRY_HOME=${HOME}/.local/share/pypoetry
POETRY_CACHE_DIR=${HOME}/.cache/pypoetry
POETRY_VIRTUALENVS_IN_PROJECT=true
POETRY_VIRTUALENVS_CREATE=true
POETRY_NO_INTERACTION=1

# uv (ultra-fast pip replacement)
UV_CACHE_DIR=${HOME}/.cache/uv
UV_DATA_DIR=${HOME}/.local/share/uv
UV_CONFIG_FILE=${HOME}/.config/uv/uv.toml
UV_PYTHON_INSTALL_DIR=${HOME}/.local/share/uv/python
UV_TOOL_DIR=${HOME}/.local/share/uv/tools

# pip
PIP_CACHE_DIR=${HOME}/.cache/pip
PIP_DISABLE_PIP_VERSION_CHECK=1
PIP_NO_INPUT=1

# pipx (install Python apps in isolated envs)
PIPX_HOME=${HOME}/.local/share/pipx
PIPX_BIN_DIR=${HOME}/.local/bin

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔬  TYPE CHECKING & LINTING
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# mypy cache
MYPY_CACHE_DIR=${HOME}/.cache/mypy

# Ruff cache
RUFF_CACHE_DIR=${HOME}/.cache/ruff

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ⚡  PERFORMANCE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Enable Python 3.11+ specializing adaptive interpreter
# (default on in 3.11+, explicit for clarity)
# PYTHON_SPECIALIZATION=1

# JIT compiler (Python 3.13+ experimental)
# PYTHON_JIT=1

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔒  SECURITY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# SSL certificate bundle
SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
SSL_CERT_DIR=/etc/ssl/certs

# Requests / httpx CA bundle
REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt