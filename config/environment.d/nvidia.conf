# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🔥 ASH DOTFILES v5.0 OMEGA — NVIDIA ENVIRONMENT ULTRA                     ║
# ║  🎮 CUDA • VA-API • NVENC • Wayland • DRM • Performance mode               ║
