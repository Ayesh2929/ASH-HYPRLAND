#
# ⚠️  ONLY SOURCE THIS FILE ON NVIDIA SYSTEMS
#
# ASH auto-detection in fish/conf.d/nvidia.fish:
#   if lspci | grep -qi nvidia; source this file; end
#
# Or enable permanently by symlinking:
#   ln -sf nvidia.conf ~/.config/environment.d/20-nvidia.conf

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🖥️  NVIDIA WAYLAND (DRM / KMS)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Enable DRM kernel mode setting (required for Wayland with NVIDIA)
# Must also set: GRUB_CMDLINE_LINUX="nvidia-drm.modeset=1"
# and add nvidia_drm to MODULES in /etc/mkinitcpio.conf
LIBVA_DRIVER_NAME=nvidia

# Force GBM backend for NVIDIA (required for Wayland)
GBM_BACKEND=nvidia-drm

# __GLX_VENDOR_LIBRARY_NAME overrides the default GLVND vendor
__GLX_VENDOR_LIBRARY_NAME=nvidia

# NVIDIA DRM backend for KWin/Hyprland
__NV_PRIME_RENDER_OFFLOAD=1
__NV_PRIME_RENDER_OFFLOAD_PROVIDER=NVIDIA-G0

# Vulkan ICD (use NVIDIA Vulkan implementation)
VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/nvidia_icd.json

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎬  VA-API (VIDEO ACCELERATION)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# VA-API driver for NVIDIA (requires libva-nvidia-driver)
LIBVA_DRIVER_NAME=nvidia

# VA-API display backend
LIBVA_DISPLAY=drm

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ⚡  CUDA
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# CUDA cache directory
CUDA_CACHE_PATH=${XDG_CACHE_HOME:-${HOME}/.cache}/nv/ComputeCache

# CUDA device visibility (all GPUs)
CUDA_VISIBLE_DEVICES=all

# CUDA device order (PCI bus order for determinism)
CUDA_DEVICE_ORDER=PCI_BUS_ID

# TensorRT / cuDNN cache
TRT_TIMING_CACHE_PATH=${XDG_CACHE_HOME:-${HOME}/.cache}/tensorrt

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎮  GAMING & PERFORMANCE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Enable NVIDIA GPU performance mode (requires nvidia-smi or coolbits)
# Set at runtime: nvidia-smi -pm ENABLED
# __GL_THREADED_OPTIMIZATIONS=1

# Force full GPU power state (performance mode)
# (set via nvidia-settings or nvidia-smi, not env)

# G-Sync / VRR
__GL_GSYNC_ALLOWED=1

# Adaptive V-Sync
__GL_VRR_ALLOWED=1

# Maximum pre-rendered frames (lower = less input lag, 1-4)
__GL_MaxFramesAllowed=1

# OpenGL sync to vblank (0 = disable for max FPS in games)
# __GL_SYNC_TO_VBLANK=0

# Enable FXAA (Fast Approximate Anti-Aliasing) globally
# __GL_LOG_MAX_ANISO=1

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔧  WINE / PROTON NVIDIA
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# DXVK async shader compilation
DXVK_ASYNC=1

# Mesa / Zink (fallback for OpenGL)
# MESA_LOADER_DRIVER_OVERRIDE=zink

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🖥️  MULTI-GPU (PRIME / Optimus)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# PRIME render offload (for hybrid Intel+NVIDIA laptops)
# Uncomment if you have a hybrid graphics laptop
# __NV_PRIME_RENDER_OFFLOAD=1
# __VK_LAYER_NV_optimus=NVIDIA_only
# __GLX_VENDOR_LIBRARY_NAME=nvidia

# Force NVIDIA for specific apps (in fish alias):
# alias app="__NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia app"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📺  HARDWARE VIDEO DECODE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Mozilla Firefox VA-API
MOZ_DISABLE_RDD_SANDBOX=1

# MPV / ffmpeg VA-API
# (set in mpv.conf: hwdec=vaapi)

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔬  OPENCL
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# OpenCL ICD loader
# OCL_ICD_VENDORS=/etc/OpenCL/vendors