# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📁  PATHS (XDG-compliant)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Cargo home (packages, registry, binaries)
CARGO_HOME=${HOME}/.local/share/cargo

# Rustup home (toolchains, components)
RUSTUP_HOME=${HOME}/.local/share/rustup

# PATH addition (Cargo binaries)
PATH=${CARGO_HOME}/bin:${PATH}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🚀  BUILD PERFORMANCE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Use mold linker (much faster than ld / lld for development)
# Install: sudo pacman -S mold
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=clang
RUSTFLAGS=-C link-arg=-fuse-ld=mold

# Parallel codegen units (more = faster compile, less = better runtime perf)
# CARGO_BUILD_JOBS=0  # 0 = auto (logical CPUs)

# sccache — distributed compilation cache (speeds up repeated builds)
# Install: cargo install sccache
# RUSTC_WRAPPER=sccache
# SCCACHE_DIR=${HOME}/.cache/sccache
# SCCACHE_CACHE_SIZE=10G

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎯  TARGET CPU OPTIMIZATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Target native CPU (WARNING: binaries won't run on older CPUs)
# Add to RUSTFLAGS for release builds:
# RUSTFLAGS_RELEASE=-C target-cpu=native

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔐  REGISTRY & NETWORK
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Use sparse registry protocol (much faster crate index updates)
# (now default in Rust 1.70+, but explicit for older versions)
CARGO_UNSTABLE_SPARSE_REGISTRY=true
CARGO_REGISTRY_DEFAULT=crates-io

# Private registry token (if needed)
# CARGO_REGISTRY_TOKEN=your-token-here

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔬  TOOLCHAIN & FEATURES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Default Rust edition for new projects
# CARGO_EDITION=2021

# Nightly features (uncomment to enable)
# CARGO_UNSTABLE_FEATURES=true

# Bindgen (for -sys crates)
BINDGEN_EXTRA_CLANG_ARGS=-I/usr/include

# LLVM version (for llvm-sys, etc.)
LLVM_SYS_180_PREFIX=/usr

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔧  DEVELOPER EXPERIENCE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Colored output
CARGO_TERM_COLOR=always

# Cargo progress
CARGO_TERM_PROGRESS_WHEN=auto

# Rustdoc theme
# RUSTDOCFLAGS=--default-theme=ayu

# Enable nightly features warnings
RUSTUP_TOOLCHAIN=stable

# Backtrace in panic (full | 1 | 0)
RUST_BACKTRACE=1

# Log level for Rust log crate
RUST_LOG=warn

# Miri (undefined behavior detector)
# MIRI_SYSROOT=${RUSTUP_HOME}/toolchains/nightly-x86_64-unknown-linux-gnu/lib/rustlib