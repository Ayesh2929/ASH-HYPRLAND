# ════════════════════════════════════════════════════════════════════════════════
# SECTION A — BACKGROUND RENDERING
# ════════════════════════════════════════════════════════════════════════════════
# Controls the background { } block in hyprlock.conf.
# Brightness and vibrancy affect how the wallpaper is displayed after blur.

# Darken factor: 0.0 = no darkening, 1.0 = fully black
# Dark themes: 0.65–0.75 | Light themes: 0.80–0.90 | Neon: 0.55–0.65
$HL_BG_BRIGHTNESS     = 0.70

# Vibrancy: boost wallpaper color saturation under blur (0.0–1.0)
# Higher = more colorful backdrop, lower = more neutral/muted
$HL_BG_VIBRANCY       = 0.17

# Noise texture intensity: adds film grain to blur (0.0–1.0)
# Prevents banding on large uniform-color areas. Recommended: 0.01–0.02
$HL_BG_NOISE          = 0.0117

# ════════════════════════════════════════════════════════════════════════════════
# SECTION B — FOREGROUND TEXT HIERARCHY
# ════════════════════════════════════════════════════════════════════════════════
# Five-tier text color system for visual hierarchy.
# Primary → Secondary → Subtle → Muted → Disabled (ascending transparency)
# All values use rgba() for hyprlock label { color = } fields.

# Tier 1: Primary text — clock digits, username, critical labels
# Maximum visibility. Should pass WCAG AA (4.5:1) against darkened background.
$HL_FG_PRIMARY        = rgba(205, 214, 244, 1.0)    # Catppuccin text

# Tier 2: Secondary text — date, greeting line, important metadata
# Slightly reduced from primary — visually subordinate but clearly readable.
$HL_FG_SECONDARY      = rgba(186, 194, 222, 0.92)    # Catppuccin subtext1

# Tier 3: Subtle text — weather, battery, supplementary indicators
# Noticeably softer — provides info without competing with primary content.
$HL_FG_SUBTLE         = rgba(166, 173, 200, 0.78)    # Catppuccin subtext0

# Tier 4: Muted text — hostname, week number, theme name, hints
# Low-key — for ancillary information read only when specifically sought.
$HL_FG_MUTED          = rgba(147, 153, 178, 0.60)    # Catppuccin overlay1

# Tier 5: Disabled — placeholder, separator decorators
# Barely visible — decorative or inactive-state elements only.
$HL_FG_DISABLED       = rgba(110, 115, 141, 0.38)    # Catppuccin overlay0

# ════════════════════════════════════════════════════════════════════════════════
# SECTION C — ACCENT & BRAND COLORS
# ════════════════════════════════════════════════════════════════════════════════
# Theme accent colors used for interactive elements and highlights.
# Avatar border, music progress bar, notification badge, active input border.

# Primary accent — most prominently themed color
# Should be visually distinct from all FG tiers for clear interactive signaling
$HL_ACCENT            = rgba(203, 166, 247, 1.0)     # Catppuccin mauve
$HL_ACCENT_HEX        = cba6f7                        # For Pango: ##$HL_ACCENT_HEX

# Secondary accent — complementary to primary, used for hover/active states
$HL_ACCENT2           = rgba(137, 180, 250, 1.0)     # Catppuccin blue
$HL_ACCENT2_HEX       = 89b4fa

# Success / positive state color (unlock success animation)
$HL_SUCCESS           = rgba(166, 227, 161, 1.0)     # Catppuccin green
$HL_SUCCESS_HEX       = a6e3a1

# Warning color (caps lock active, battery low)
$HL_WARN              = rgba(249, 226, 175, 1.0)     # Catppuccin yellow
$HL_WARN_HEX          = f9e2af

# Error / failure color (auth failure, battery critical)
$HL_ERROR             = rgba(243, 139, 168, 1.0)     # Catppuccin red
$HL_ERROR_HEX         = f38ba8

# ════════════════════════════════════════════════════════════════════════════════
# SECTION D — CLOCK WIDGET COLORS
# ════════════════════════════════════════════════════════════════════════════════
# Individual color control for clock digit groups.
# Hours/minutes can differ from seconds for visual hierarchy.
# Separator (colon) slightly dimmed from digits for depth effect.
# All HEX variants for Pango markup injection via ##$HL_*_HEX syntax.

# Hour digits — maximum prominence (same as FG_PRIMARY or accent variant)
$HL_CLOCK_HRS_HEX     = cdd6f4                       # rgba(205,214,244)

# Minute digits — same or slightly reduced from hours
$HL_CLOCK_MIN_HEX     = cdd6f4                       # rgba(205,214,244)

# Seconds — clearly subordinate, matches FG_SUBTLE range
$HL_CLOCK_SEC_HEX     = 6c7086                       # rgba(108,112,134)

# Colon separator — between hours and minutes
$HL_CLOCK_SEP_HEX     = 9399b2                       # rgba(147,153,178)

# Clock format preference: "12h" displays AM/PM badge, "24h" hides it
$HL_CLOCK_FORMAT      = 24h

# ════════════════════════════════════════════════════════════════════════════════
# SECTION E — INPUT FIELD COLORS
# ════════════════════════════════════════════════════════════════════════════════
# Full state-machine color set for the password input field.
# States: IDLE → ACTIVE (typing) → CHECKING → SUCCESS/FAIL → IDLE
# Smooth transitions between states are handled by hyprlock animation engine.

# Background fill of input field (semi-transparent surface)
$HL_INPUT_BG          = rgba(30, 30, 46, 0.72)       # Catppuccin base (72% opacity)

# Border color in idle state (not focused, waiting for input)
$HL_INPUT_BORDER      = rgba(108, 112, 134, 0.55)    # Catppuccin overlay0

# Foreground color of typed text / dot indicators
$HL_INPUT_FG          = rgba(205, 214, 244, 1.0)     # Catppuccin text

# Placeholder text color (shown when field is empty)
$HL_INPUT_PLACEHOLDER_HEX = 585b70                   # Catppuccin surface2

# Active border (while typing — draws attention to input field)
$HL_INPUT_ACTIVE      = rgba(203, 166, 247, 0.90)    # Catppuccin mauve

# Checking state (animating while PAM verifies password)
$HL_INPUT_CHECK       = rgba(249, 226, 175, 1.0)     # Catppuccin yellow — "wait"

# Failure state (wrong password — brief flash before reset)
$HL_INPUT_FAIL        = rgba(243, 139, 168, 1.0)     # Catppuccin red
$HL_FAIL_HEX          = f38ba8                        # For Pango fail_text markup

# Corner rounding — matches Hyprland window rounding value for visual coherence
# Set by ash theme engine from Hyprland decoration.rounding setting
$HL_INPUT_ROUNDING    = 12

# ════════════════════════════════════════════════════════════════════════════════
# SECTION F — SURFACE & DECORATION COLORS
# ════════════════════════════════════════════════════════════════════════════════
# Colors for UI chrome elements: separators, backgrounds of panels, overlays.

# Horizontal separator line between clock and auth sections
$HL_SEPARATOR         = rgba(108, 112, 134, 0.28)

# Card/panel surface (if using image overlays or background cards)
$HL_SURFACE_0         = rgba(24, 24, 37, 0.70)       # Catppuccin mantle (70%)
$HL_SURFACE_1         = rgba(30, 30, 46, 0.65)       # Catppuccin base (65%)
$HL_SURFACE_2         = rgba(49, 50, 68, 0.55)       # Catppuccin surface0 (55%)

# ════════════════════════════════════════════════════════════════════════════════
# SECTION G — BEHAVIOR & FEATURE FLAGS
# ════════════════════════════════════════════════════════════════════════════════
# Boolean and scalar configuration values read by scripts and conditional labels.
# Scripts reference these via environment variable injection from ash state.

# Show "Type your password to unlock" hint for new users
# Automatically set to false after first successful unlock by on-unlock.sh hook
$HL_SHOW_HINT         = true

# Enable/disable avatar display (set false if no ~/.face file and no fallback)
$HL_SHOW_AVATAR       = true

# Enable/disable media player widget (set false if no MPRIS players in use)
$HL_SHOW_MEDIA        = true

# Enable/disable weather widget (set false if no API key or no network)
$HL_SHOW_WEATHER      = true

# Enable/disable battery widget (auto-set by ash doctor based on power supply)
$HL_SHOW_BATTERY      = true

# Enable/disable notification count badge
$HL_SHOW_NOTIF        = true

# User display name for greeting script (can differ from $USER system username)
# Set via: ash config set hyprlock.user_name "Your Name"
$HL_USER_NAME         = Ash

