# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — HYPRLOCK LAYOUT: DEFAULT                        ║
# ║  The flagship lock screen layout — balanced, informative, premium           ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  LAYOUT BLUEPRINT                                                            │
# │                                                                              │
# │  ┌───────────────────────────────────────────────────────────────────────┐  │
# │  │ 🔋 bat  📶 net                              🌤️ weather   🔔 notif    │  │
# │  │─────────────────────────────────────────────────────────────────────  │  │
# │  │                                                                       │  │
# │  │                                                                       │  │
# │  │                    ┌────────────────────┐                            │  │
# │  │                    │   ██  HH : MM  ██  │  SS                       │  │
# │  │                    │   Wednesday, Jan 15 │                            │  │
# │  │                    │   Week 03  •  UTC   │                            │  │
# │  │                    │   Good evening ✨   │                            │  │
# │  │                    └────────────────────┘                            │  │
# │  │                         ─────────────                                │  │
# │  │                         [  avatar  ]                                 │  │
# │  │                           username                                   │  │
# │  │                    ┌──────────────────────┐                          │  │
# │  │                    │  ●  ●  ●  password   │                          │  │
# │  │                    └──────────────────────┘                          │  │
# │  │                    ✗ Authentication failed                            │  │
# │  │                    󰎆  Artist — Track Title                           │  │
# │  │                    ████████░░  2:34 / 4:12                           │  │
# │  │                                                                       │  │
# │  │ 󰌢 hostname • uptime                              theme-name  󰟢      │  │
# │  └───────────────────────────────────────────────────────────────────────┘  │
# │                                                                              │
# │  WIDGET GRID (26 elements total):                                            │
# │    Row TOP    : battery, network, weather, notifications                     │
# │    Row CENTER : clock-hrs, clock-sep, clock-min, seconds, ampm              │
# │    Row SUB-1  : date-full                                                    │
# │    Row SUB-2  : week-number + timezone                                       │
# │    Row SUB-3  : greeting                                                     │
# │    Row DIVIDER: horizontal separator                                          │
# │    Row AUTH-1 : avatar image                                                 │
# │    Row AUTH-2 : username label                                               │
# │    Row AUTH-3 : input-field (password)                                       │
# │    Row AUTH-4 : fail message                                                 │
# │    Row MEDIA  : now-playing, progress bar                                    │
# │    Row FOOTER : hostname+uptime, theme-name                                  │
# │                                                                              │
# │  USAGE:                                                                      │
# │    Source in hyprlock.conf or activate via:                                  │
# │      ash config set hyprlock.layout default                                  │
# │    Direct:                                                                   │
# │      hyprlock --config ~/.config/hyprlock/layouts/default.conf              │
# └─────────────────────────────────────────────────────────────────────────────┘

# ── Inherit global colors and settings ────────────────────────────────────────
source = ~/.config/hyprlock/colors.conf

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# GLOBAL
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    disable_loading_bar  = false
    hide_cursor          = true
    grace                = 0
    ignore_empty_input   = true
    immediate_render     = true
    fractional_scaling   = 2
    enable_screencopy    = true
    text_trim            = true
    pam_module           = hyprlock
    no_fade_in           = false
    no_fade_out          = false
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# BACKGROUND
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

background {
    monitor      =
    path         = $HOME/.cache/hyprlock/wallpaper-cache.png
    blur_size    = 7
    blur_passes  = 3
    noise        = $HL_BG_NOISE
    brightness   = $HL_BG_BRIGHTNESS
    vibrancy     = $HL_BG_VIBRANCY
    contrast     = 1.0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════  ROW: TOP STATUS BAR  ═══════════════════════════════
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── TOP-LEFT: Battery Status ──────────────────────────────────────────────────
# Dynamically hidden on AC-only desktop systems (script returns empty string).
# Icon tier: 󱊡 100% → 󰂁 80% → 󰂀 60% → 󰁾 40% → 󰁼 20% → 󰂃 10% → 󰁺 crit
# Charging overlay: 󰂄 active charge | 󰂅 full+plugged

label {
    monitor      =
    text         = cmd[update:60000] $HOME/.config/hyprlock/scripts/battery-status.sh
    font_family  = JetBrainsMono Nerd Font
    font_size    = 13
    color        = $HL_FG_SUBTLE
    position     = 40, -36
    halign       = left
    valign       = top
    shadow_passes = 2
    shadow_size  = 3
    shadow_color = rgba(0,0,0,0.45)
    shadow_boost = 1.1
    rotate       = 0
}

# ── TOP-LEFT-2: Network Interface ─────────────────────────────────────────────
# Shows active interface: 󰤨 wifi SSID | 󰈀 Wired | 󰤭 offline
# Truncated to 18 chars to prevent overflow at small font sizes

label {
    monitor      =
    text         = cmd[update:15000] bash -c 'iface=$(nmcli -t -f TYPE,CONNECTION device status 2>/dev/null | grep -E "^wifi|^ethernet" | head -1); [[ -z "$iface" ]] && echo "󰤭  offline" && exit; type=$(echo "$iface"|cut -d: -f1); name=$(echo "$iface"|cut -d: -f2|cut -c1-14); [[ "$type" == "wifi" ]] && echo "󰤨  $name" || echo "󰈀  $name"'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 11
    color        = $HL_FG_MUTED
    position     = 40, -56
    halign       = left
    valign       = top
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.35)
    shadow_boost = 1.0
    rotate       = 0
}

# ── TOP-RIGHT: Weather Widget ─────────────────────────────────────────────────
# Reads from pre-fetched ash weather cache file (no network call on lock).
# Cache written by ash-weather-fetch.timer every 30 minutes.
# Graceful: shows "─" if cache missing or expired (>2h old).
# Format: "condition-icon  temp  feels-like  💧humidity"

label {
    monitor      =
    text         = cmd[update:1800000] $HOME/.config/hyprlock/scripts/weather-lock.sh
    font_family  = JetBrainsMono Nerd Font
    font_size    = 13
    color        = $HL_FG_SUBTLE
    position     = -40, -36
    halign       = right
    valign       = top
    shadow_passes = 2
    shadow_size  = 3
    shadow_color = rgba(0,0,0,0.45)
    shadow_boost = 1.1
    rotate       = 0
}

# ── TOP-RIGHT-2: Notification Count Badge ─────────────────────────────────────
# Empty (invisible) when zero notifications. Accent-colored when pending.
# Reads swaync notification count via IPC socket.

label {
    monitor      =
    text         = cmd[update:20000] bash -c 'c=$(swaync-client -c 2>/dev/null | tr -d "\n"); [[ "$c" =~ ^[0-9]+$ ]] && [[ "$c" -gt 0 ]] && echo "󱅫  $c new" || echo ""'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 12
    color        = $HL_ACCENT
    position     = -40, -56
    halign       = right
    valign       = top
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.35)
    shadow_boost = 1.0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════  ROW: CLOCK ASSEMBLY  ═══════════════════════════════
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Clock is constructed from four discrete label elements for independent
# styling of hours, separator colon, minutes, and seconds.
# This approach allows per-element color, size, shadow, and animation control
# — impossible with a single monolithic time-format string.
#
# Layout (all horizontally composed at valign=center, different x positions):
#
#     ┌──────────────────────────────────────────┐
#     │    HH    :    MM    SS  (AM/PM)           │
#     │   96pt  sep   96pt  36pt  14pt            │
#     │  x=-96  x=0  x=96  x=200 x=202           │
#     └──────────────────────────────────────────┘

# ── CLOCK: Hour Digits ────────────────────────────────────────────────────────
label {
    monitor      =
    text         = cmd[update:1000] date +'%H'
    font_family  = JetBrainsMono Nerd Font Bold
    font_size    = 96
    color        = $HL_FG_PRIMARY
    position     = -96, 182
    halign       = center
    valign       = center
    shadow_passes = 3
    shadow_size  = 10
    shadow_color = rgba(0,0,0,0.60)
    shadow_boost = 1.2
    shadow_x_offset = 0
    shadow_y_offset = 3
    rotate       = 0
}

# ── CLOCK: Separator Colon ────────────────────────────────────────────────────
# Animated blink effect achieved via the blinking-colon variant:
# even seconds → ":" | odd seconds → " " for classic digital-clock blink.
# To disable blink, replace with static: text = :

label {
    monitor      =
    text         = cmd[update:1000] bash -c '[[ $(($(date +%S) % 2)) -eq 0 ]] && echo ":" || echo " "'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 80
    color        = $HL_FG_MUTED
    position     = 0, 186
    halign       = center
    valign       = center
    shadow_passes = 2
    shadow_size  = 6
    shadow_color = rgba(0,0,0,0.50)
    shadow_boost = 1.1
    rotate       = 0
}

# ── CLOCK: Minute Digits ──────────────────────────────────────────────────────
label {
    monitor      =
    text         = cmd[update:1000] date +'%M'
    font_family  = JetBrainsMono Nerd Font Bold
    font_size    = 96
    color        = $HL_FG_PRIMARY
    position     = 96, 182
    halign       = center
    valign       = center
    shadow_passes = 3
    shadow_size  = 10
    shadow_color = rgba(0,0,0,0.60)
    shadow_boost = 1.2
    shadow_x_offset = 0
    shadow_y_offset = 3
    rotate       = 0
}

# ── CLOCK: Seconds Counter ────────────────────────────────────────────────────
# Smaller, muted — optically offset to align with minute digit baseline.
# Positioned 200px right of center = immediately after minute digits.

label {
    monitor      =
    text         = cmd[update:1000] date +'%S'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 32
    color        = $HL_FG_MUTED
    position     = 198, 152
    halign       = center
    valign       = center
    shadow_passes = 2
    shadow_size  = 4
    shadow_color = rgba(0,0,0,0.40)
    shadow_boost = 1.0
    rotate       = 0
}

# ── CLOCK: AM/PM Badge ────────────────────────────────────────────────────────
# Only visible when HL_CLOCK_FORMAT=12h. Returns "" in 24h mode.
# Positioned above seconds digits as a superscript badge.

label {
    monitor      =
    text         = cmd[update:3600000] bash -c '[[ "$HL_CLOCK_FORMAT" == "12h" ]] && date +"%p" || echo ""'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 12
    color        = $HL_FG_DISABLED
    position     = 199, 197
    halign       = center
    valign       = center
    shadow_passes = 0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════  ROW: DATE METADATA  ════════════════════════════════
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Full Date: Weekday + Month Day ────────────────────────────────────────────
# Format: "󰃭  Wednesday, January 15"
# Icon: 󰃭 (calendar nerd font glyph)
# Updates every minute — date doesn't change more frequently.

label {
    monitor      =
    text         = cmd[update:60000] echo "󰃭  $(date +'%A, %B %-d')"
    font_family  = Noto Sans
    font_size    = 22
    color        = $HL_FG_SECONDARY
    position     = 0, 90
    halign       = center
    valign       = center
    shadow_passes = 2
    shadow_size  = 4
    shadow_color = rgba(0,0,0,0.45)
    shadow_boost = 1.1
    rotate       = 0
}

# ── ISO Week + Timezone ───────────────────────────────────────────────────────
# Format: "Week 03  •  UTC+2"
# Useful for planning/scheduling context at a glance.
# Updates every hour (timezone offset only changes during DST transitions).

label {
    monitor      =
    text         = cmd[update:3600000] echo "Week $(date +'%V')  •  $(date +'%Z')"
    font_family  = JetBrainsMono Nerd Font
    font_size    = 12
    color        = $HL_FG_MUTED
    position     = 0, 62
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.30)
    shadow_boost = 1.0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════  ROW: GREETING  ═════════════════════════════════════
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Time-aware greeting from greeting.sh script.
# Bands: 05:00–11:59 morning 🌅 | 12:00–17:59 afternoon ☀️
#        18:00–21:59 evening 🌆 | 22:00–04:59 night 🌙
# Name pulled from $HL_USER_NAME variable in colors.conf.

label {
    monitor      =
    text         = cmd[update:3600000] $HOME/.config/hyprlock/scripts/greeting.sh
    font_family  = Noto Sans
    font_size    = 17
    color        = $HL_FG_SECONDARY
    position     = 0, 36
    halign       = center
    valign       = center
    shadow_passes = 2
    shadow_size  = 3
    shadow_color = rgba(0,0,0,0.40)
    shadow_boost = 1.0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════  ROW: SECTION DIVIDER  ══════════════════════════════
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Ultra-thin hairline separator between informational and auth sections.
# Width visually matches the input-field (320px) for compositional alignment.
# Uses Unicode HORIZONTAL RULE (─) repeated to approximate correct width.

label {
    monitor      =
    text         = ──────────────────────────────
    font_family  = JetBrainsMono Nerd Font
    font_size    = 9
    color        = $HL_SEPARATOR
    position     = 0, 2
    halign       = center
    valign       = center
    shadow_passes = 0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════  ROW: AVATAR + IDENTITY  ════════════════════════════
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Avatar: Circular Profile Image ───────────────────────────────────────────
# Fallback chain: ~/.face → $XDG_CONFIG_HOME/ash/avatar.png → hidden
# rounding = -1 → full circle (size/2 auto-calculated by hyprlock)
# Border color matches theme accent for brand coherence.

image {
    monitor      =
    path         = $HOME/.face
    size         = 82
    rounding     = -1
    border_size  = 3
    border_color = $HL_ACCENT
    position     = 0, -52
    halign       = center
    valign       = center
    shadow_passes = 3
    shadow_size  = 8
    shadow_color = rgba(0,0,0,0.50)
    shadow_boost = 1.3
    zoom         = 1.0
    rotate       = 0
}

# ── Username Label ────────────────────────────────────────────────────────────
# $USER is environment-expanded by hyprlock directly — no subprocess needed.
# Positioned 50px below avatar center.

label {
    monitor      =
    text         = $USER
    font_family  = Noto Sans Bold
    font_size    = 16
    color        = $HL_FG_PRIMARY
    position     = 0, -100
    halign       = center
    valign       = center
    shadow_passes = 2
    shadow_size  = 3
    shadow_color = rgba(0,0,0,0.45)
    shadow_boost = 1.1
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════  ROW: PASSWORD INPUT  ═══════════════════════════════
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Primary authentication widget. Full state-machine:
# idle → typing (border: accent) → checking (border: warn) → fail/success

input-field {
    monitor           =
    size              = 320, 56
    position          = 0, -152
    halign            = center
    valign            = center

    # ── Visuals ──────────────────────────────────────────────────────────────
    outline_thickness = 2
    outer_color       = $HL_INPUT_BORDER
    inner_color       = $HL_INPUT_BG
    font_color        = $HL_INPUT_FG
    font_family       = JetBrainsMono Nerd Font
    font_size         = 15
    rounding          = $HL_INPUT_ROUNDING

    # ── Placeholder ───────────────────────────────────────────────────────────
    placeholder_text  = <span foreground="##$HL_INPUT_PLACEHOLDER_HEX" font_size="13pt"> Enter password…</span>

    # ── Dot Style ─────────────────────────────────────────────────────────────
    dots_size         = 0.28
    dots_spacing      = 0.16
    dots_center       = true
    dots_rounding     = -1

    # ── Animation ─────────────────────────────────────────────────────────────
    fade_on_empty     = true
    fade_timeout      = 1200

    # ── State Colors ──────────────────────────────────────────────────────────
    check_color       = $HL_INPUT_CHECK
    fail_color        = $HL_INPUT_FAIL
    fail_timeout      = 2000
    fail_transition   = 300

    # ── Fail Message ─────────────────────────────────────────────────────────
    fail_text         = <span foreground="##$HL_FAIL_HEX" font_size="12pt"> Authentication failed</span>

    # ── Capslock Warning ──────────────────────────────────────────────────────
    capslock_color    = $HL_WARN
    numlock_color     = -1

    # ── Shadow ────────────────────────────────────────────────────────────────
    shadow_passes     = 3
    shadow_size       = 6
    shadow_color      = rgba(0,0,0,0.50)
    shadow_boost      = 1.2
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════  ROW: UNLOCK HINT  ══════════════════════════════════
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Shown only on first lock (hint-shown cache file not yet created).
# Hidden permanently once user has successfully unlocked once.
# Provides discoverability for new setups without polluting experienced UX.

label {
    monitor      =
    text         = cmd[update:0] bash -c '[[ "$HL_SHOW_HINT" == "true" ]] && [[ ! -f "$HOME/.cache/hyprlock/hint-shown" ]] && echo "󰌑  Type your password to unlock" || echo ""'
    font_family  = Noto Sans
    font_size    = 12
    color        = $HL_FG_DISABLED
    position     = 0, -194
    halign       = center
    valign       = center
    shadow_passes = 0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════  ROW: MEDIA PLAYER  ═════════════════════════════════
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Now-playing info via MPRIS playerctl.
# Handles: Spotify, Firefox, Chromium, MPD, VLC, Rhythmbox, any MPRIS app.
# Both widgets return empty string when no player active → invisible.

# ── Now Playing: Artist + Title ───────────────────────────────────────────────
label {
    monitor      =
    text         = cmd[update:3000] $HOME/.config/hyprlock/scripts/songdetail.sh
    font_family  = Noto Sans
    font_size    = 13
    color        = $HL_FG_SUBTLE
    position     = 0, -222
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.35)
    shadow_boost = 1.0
    rotate       = 0
}

# ── Now Playing: Unicode Progress Bar ────────────────────────────────────────
# Format: "████████░░░░░░  2:34 / 4:12"
# Block fill calculated by songdetail.sh --progress from playerctl position/duration.

label {
    monitor      =
    text         = cmd[update:3000] $HOME/.config/hyprlock/scripts/songdetail.sh --progress
    font_family  = JetBrainsMono Nerd Font
    font_size    = 11
    color        = $HL_ACCENT
    position     = 0, -244
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.30)
    shadow_boost = 1.0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════  ROW: FOOTER  ═══════════════════════════════════════
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── FOOTER-LEFT: Hostname + Uptime ────────────────────────────────────────────
# Format: "󰌢  archbox  •  up 4d 3h 22m"
# uptime -p produces human-readable "up X days, Y hours" format.
# sed strips the leading "up " prefix.

label {
    monitor      =
    text         = cmd[update:60000] echo "󰌢  $HOSTNAME  •  $(uptime -p | sed 's/up //')"
    font_family  = JetBrainsMono Nerd Font
    font_size    = 10
    color        = $HL_FG_MUTED
    position     = 36, 36
    halign       = left
    valign       = bottom
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.25)
    shadow_boost = 1.0
    rotate       = 0
}

# ── FOOTER-RIGHT: Active ASH Theme Name ──────────────────────────────────────
# Reads current theme from ash state cache JSON.
# The  glyph (nerd font palette icon) reinforces theme context.

label {
    monitor      =
    text         = cmd[update:30000] printf "󰟢  %s" "$(cat "$HOME/.cache/ash/state/current-theme.json" 2>/dev/null | grep -oP '"name"\s*:\s*"\K[^"]+' | head -1 || echo "default")"
    font_family  = JetBrainsMono Nerd Font
    font_size    = 10
    color        = $HL_FG_MUTED
    position     = -36, 36
    halign       = right
    valign       = bottom
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.25)
    shadow_boost = 1.0
    rotate       = 0
}

