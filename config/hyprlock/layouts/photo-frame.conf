# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — HYPRLOCK LAYOUT: PHOTO-FRAME                    ║
# ║  Your lock screen as a gallery — wallpaper is the artwork, UI is the mat   ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  LAYOUT BLUEPRINT                                                            │
# │                                                                              │
# │  ┌───────────────────────────────────────────────────────────────────────┐  │
# │  │░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░│  │
# │  │░░  ┌───────────────────────────────────────────────────────────┐  ░░│  │
# │  │░░  │                                                           │  ░░│  │
# │  │░░  │                                                           │  ░░│  │
# │  │░░  │                                                           │  ░░│  │
# │  │░░  │              [  WALLPAPER — ZERO BLUR  ]                  │  ░░│  │
# │  │░░  │              The image in full clarity                    │  ░░│  │
# │  │░░  │              as photographic art                          │  ░░│  │
# │  │░░  │                                                           │  ░░│  │
# │  │░░  │                                                           │  ░░│  │
# │  │░░  └───────────────────────────────────────────────────────────┘  ░░│  │
# │  │░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░│  │
# │  │░░░░░░░  MATTING BORDER — solid dark frame around image  ░░░░░░░░░░░░░│  │
# │  │░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░│  │
# │  │                                                                       │  │
# │  │   HH : MM                      12  Jan  2025                         │  │
# │  │   Subtitle greeting            Aperture ƒ/2.0  📷  Location          │  │
# │  │                                                                       │  │
# │  │              ┌────────────────────────────────┐                      │  │
# │  │              │   ●  ●  ●  Enter passcode      │                      │  │
# │  │              └────────────────────────────────┘                      │  │
# │  │                                                                       │  │
# │  └───────────────────────────────────────────────────────────────────────┘  │
# │                                                                              │
# │  DESIGN PHILOSOPHY:                                                          │
# │    • NO blur on wallpaper — it is the artwork, presented with respect       │
# │    • Heavy matte border (dark overlay frame) creates gallery framing        │
# │    • Clock rendered in a bottom-of-frame caption bar (museum label style)   │
# │    • EXIF-style metadata: date, "exposure" (uptime), "location" (hostname)  │
# │    • Minimal authentication — small, unobtrusive input in caption area      │
# │    • Font choices: serif-adjacent for editorial/gallery feel                 │
# │    • Zero animation — stillness is the aesthetic                            │
# │                                                                              │
# │  WALLPAPER ARTWORK MODE:                                                     │
# │    ash wallpaper set --mode photo-frame <path>                               │
# │    (Disables wallpaper slideshow, selects a single "featured" image)        │
# │                                                                              │
# │  EXIF DATA SOURCE:                                                           │
# │    Script reads EXIF via exiftool if available.                             │
# │    Falls back to file metadata (mtime, dimensions) if exiftool absent.      │
# │    Wallpaper path sourced from ash wallpaper state cache.                   │
# └─────────────────────────────────────────────────────────────────────────────┘

source = ~/.config/hyprlock/colors.conf

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# GLOBAL
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    disable_loading_bar  = true
    hide_cursor          = true
    grace                = 0
    ignore_empty_input   = true
    immediate_render     = true
    fractional_scaling   = 2
    enable_screencopy    = true
    text_trim            = true
    pam_module           = hyprlock
    no_fade_in           = false
    no_fade_out          = false
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# BACKGROUND LAYER 1 — MATTE BORDER (full-screen dark overlay)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Renders the gallery matte — a near-black background that:
#   (a) Frames the wallpaper artwork image above it
#   (b) Provides a neutral dark surface for the caption area below
#
# blur_size=0, blur_passes=0 = completely sharp, unblurred.
# brightness=0.08 = almost black — museum/gallery neutral gray.
# The "wallpaper" here is the full-bleed background, which we suppress.
# The actual artwork is shown in LAYER 2 as an image widget.

background {
    monitor      =
    path         = $HOME/.cache/hyprlock/solid-dark.png
    blur_size    = 0
    blur_passes  = 0
    noise        = 0.0
    brightness   = 1.0
    vibrancy     = 0.0
    contrast     = 1.0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# BACKGROUND LAYER 2 — ARTWORK FRAME (wallpaper as gallery print)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# The wallpaper is displayed as a framed image widget.
# Zero blur — the image must be crisp and uncompromised.
# Positioned in upper portion of screen, leaving caption space below.
# Size 880px = approximate width for 1920px display with comfortable matte.
# rounding=4 = very subtle corner softening — like a print mat opening.
# border_color: thin white inner mat edge — classic fine-art framing technique.

image {
    monitor      =
    path         = $HOME/.cache/hyprlock/wallpaper-cache.png
    size         = 880
    rounding     = 4
    border_size  = 1
    border_color = rgba(255, 255, 255, 0.12)
    position     = 0, 148
    halign       = center
    valign       = center
    shadow_passes = 6
    shadow_size  = 32
    shadow_color = rgba(0,0,0,0.80)
    shadow_boost = 1.8
    zoom         = 1.0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 01 — CAPTION BAR: CLOCK (left-aligned, editorial style)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Clock in the caption bar reads like a museum exhibit label — left-aligned,
# smaller than other layouts, dignified typeface weight (Light/Thin).
# Hours and minutes on separate lines give a vertical "caption list" feel.

# ── Time: HH:MM on caption left ───────────────────────────────────────────────
label {
    monitor      =
    text         = cmd[update:1000] date +'%H:%M'
    font_family  = JetBrainsMono Nerd Font Thin
    font_size    = 64
    color        = rgba(205, 214, 244, 0.90)
    position     = -380, -182
    halign       = center
    valign       = center
    shadow_passes = 2
    shadow_size  = 6
    shadow_color = rgba(0,0,0,0.55)
    shadow_boost = 1.2
    rotate       = 0
}

# ── Time: Seconds (caption sub-line) ─────────────────────────────────────────
label {
    monitor      =
    text         = cmd[update:1000] date +' :%S'
    font_family  = JetBrainsMono Nerd Font Thin
    font_size    = 18
    color        = rgba(108, 112, 134, 0.60)
    position     = -340, -222
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.35)
    shadow_boost = 1.0
    rotate       = 0
}

# ── Greeting: below time, left-column ────────────────────────────────────────
label {
    monitor      =
    text         = cmd[update:3600000] $HOME/.config/hyprlock/scripts/greeting.sh --short
    font_family  = Noto Sans Light
    font_size    = 14
    color        = rgba(147, 153, 178, 0.72)
    position     = -380, -248
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.30)
    shadow_boost = 1.0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 02 — CAPTION BAR: EXIF METADATA (right-aligned)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Right column of caption bar mimics photo metadata panel.
# Styled like EXIF data: date taken, "exposure" (uptime), hostname as location.
# If exiftool is available, reads actual EXIF from wallpaper file.

# ── EXIF: Date + Dimensions ───────────────────────────────────────────────────
label {
    monitor      =
    text         = cmd[update:60000] bash -c 'wp=$(cat "$HOME/.cache/ash/state/current-wallpaper.txt" 2>/dev/null); if command -v exiftool &>/dev/null && [[ -f "$wp" ]]; then d=$(exiftool -s3 -DateTimeOriginal "$wp" 2>/dev/null | awk -F"[: ]" "{printf \"%s %s %s\", \$3, \$2, \$1}"); [[ -n "$d" ]] && echo "📅  $d" || echo "📅  $(date +'%-d %b %Y')"; else echo "📅  $(date +'%-d %b %Y')"; fi'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 13
    color        = rgba(147, 153, 178, 0.80)
    position     = 380, -178
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.35)
    shadow_boost = 1.0
    rotate       = 0
}

# ── EXIF: Camera / Dimensions ────────────────────────────────────────────────
label {
    monitor      =
    text         = cmd[update:3600000] bash -c 'wp=$(cat "$HOME/.cache/ash/state/current-wallpaper.txt" 2>/dev/null); if command -v exiftool &>/dev/null && [[ -f "$wp" ]]; then cam=$(exiftool -s3 -Model "$wp" 2>/dev/null | cut -c1-22); ap=$(exiftool -s3 -FNumber "$wp" 2>/dev/null); [[ -n "$cam" ]] && echo "📷  $cam  ƒ/${ap}" || dims=$(identify -format "%wx%h" "$wp" 2>/dev/null) && echo "󰋩  $dims px"; else dims=$(file "$wp" 2>/dev/null | grep -oP "\d+ x \d+" | head -1); echo "󰋩  ${dims:-wallpaper}"; fi'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 12
    color        = rgba(108, 112, 134, 0.65)
    position     = 380, -202
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.30)
    shadow_boost = 1.0
    rotate       = 0
}

# ── EXIF: Location / Hostname as studio ──────────────────────────────────────
label {
    monitor      =
    text         = cmd[update:3600000] bash -c 'wp=$(cat "$HOME/.cache/ash/state/current-wallpaper.txt" 2>/dev/null); if command -v exiftool &>/dev/null && [[ -f "$wp" ]]; then loc=$(exiftool -s3 -City "$wp" 2>/dev/null); [[ -n "$loc" ]] && echo "󰍎  $loc" || echo "󰍎  $HOSTNAME"; else echo "󰍎  $HOSTNAME"; fi'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 12
    color        = rgba(108, 112, 134, 0.65)
    position     = 380, -224
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.30)
    shadow_boost = 1.0
    rotate       = 0
}

# ── EXIF: Wallpaper Filename / Title ─────────────────────────────────────────
label {
    monitor      =
    text         = cmd[update:3600000] bash -c 'wp=$(cat "$HOME/.cache/ash/state/current-wallpaper.txt" 2>/dev/null); if [[ -n "$wp" ]]; then base=$(basename "$wp" | sed "s/\.[^.]*$//;s/[-_]/ /g;s/\b\(.\)/\u\1/g" | cut -c1-28); echo "  \"$base\""; else echo "  Untitled"; fi'
    font_family  = Noto Sans Light Italic
    font_size    = 13
    color        = rgba(186, 194, 222, 0.75)
    position     = 380, -248
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.30)
    shadow_boost = 1.0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 03 — CAPTION VERTICAL DIVIDER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Thin vertical divider between left (clock) and right (exif) caption columns.
# Rendered using Unicode Box Drawing vertical bar, rotated via font trickery.
# Positioned exactly at horizontal center between the two caption columns.

label {
    monitor      =
    text         = │
    font_family  = JetBrainsMono Nerd Font
    font_size    = 80
    color        = rgba(108, 112, 134, 0.20)
    position     = 0, -214
    halign       = center
    valign       = center
    shadow_passes = 0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 04 — TOP CAPTION BAR DIVIDER (below artwork, above caption)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Hairline rule separating the artwork from the caption area below it.
# Matches gallery mat edge — thin, precise, intentional.

label {
    monitor      =
    text         = ────────────────────────────────────────────────────────────────────────────
    font_family  = JetBrainsMono Nerd Font
    font_size    = 8
    color        = rgba(108, 112, 134, 0.30)
    position     = 0, -158
    halign       = center
    valign       = center
    shadow_passes = 0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 05 — PASSWORD INPUT (minimal, inline with caption)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Ultra-minimal input field — sits below the caption row.
# Width chosen to span the full caption area (~880px artwork width equivalent).
# Very thin border, nearly transparent bg — doesn't compete with artwork.
# Placeholder uses italic style to match gallery label typography.

input-field {
    monitor           =
    size              = 440, 48
    position          = 0, -308
    halign            = center
    valign            = center
    outline_thickness = 1
    outer_color       = rgba(108, 112, 134, 0.28)
    inner_color       = rgba(10, 10, 18, 0.60)
    font_color        = rgba(205, 214, 244, 0.90)
    font_family       = JetBrainsMono Nerd Font Light
    font_size         = 14
    rounding          = 6
    placeholder_text  = <span foreground="##585b70" font_size="12pt" font_style="italic">  passcode</span>
    dots_size         = 0.24
    dots_spacing      = 0.18
    dots_center       = true
    dots_rounding     = -1
    fade_on_empty     = true
    fade_timeout      = 1000
    check_color       = rgba(249, 226, 175, 0.80)
    fail_color        = rgba(243, 139, 168, 0.85)
    fail_timeout      = 2000
    fail_transition   = 250
    fail_text         = <span foreground="##f38ba8" font_size="11pt" font_style="italic">  incorrect — try again</span>
    capslock_color    = $HL_WARN
    numlock_color     = -1
    shadow_passes     = 2
    shadow_size       = 4
    shadow_color      = rgba(0,0,0,0.40)
    shadow_boost      = 1.1
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 06 — BOTTOM RULE + COLLECTION CREDIT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Final bottom rule completes the frame composition.
# Credit line renders like a museum collection attribution.

label {
    monitor      =
    text         = ────────────────────────────────────────────────────────────────────────────
    font_family  = JetBrainsMono Nerd Font
    font_size    = 8
    color        = rgba(108, 112, 134, 0.20)
    position     = 0, -336
    halign       = center
    valign       = center
    shadow_passes = 0
    rotate       = 0
}

# ── Collection Credit ─────────────────────────────────────────────────────────
# Reads wallpaper collection name from ash metadata if tagged.
# Falls back to "Personal Collection" as default attribution.

label {
    monitor      =
    text         = cmd[update:3600000] bash -c 'coll=$(cat "$HOME/.cache/ash/state/wallpaper-collection.txt" 2>/dev/null | cut -c1-38); echo "ASH Dotfiles Collection  ·  ${coll:-Personal Wallpapers}  ·  $HOSTNAME"'
    font_family  = Noto Sans Light
    font_size    = 10
    color        = rgba(88, 91, 112, 0.55)
    position     = 0, -354
    halign       = center
    valign       = center
    shadow_passes = 0
    rotate       = 0
}

