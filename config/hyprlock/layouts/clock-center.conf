# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — HYPRLOCK LAYOUT: CLOCK-CENTER                   ║
# ║  The hero clock — full-viewport typographic statement                       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  LAYOUT BLUEPRINT                                                            │
# │                                                                              │
# │  ┌───────────────────────────────────────────────────────────────────────┐  │
# │  │                                                                       │  │
# │  │                                                                       │  │
# │  │              🌤️  22°C  Feels 19°C  💧 65%                            │  │
# │  │                                                                       │  │
# │  │                                                                       │  │
# │  │        ╔══════════════════════════════════════╗                      │  │
# │  │        ║                                      ║                      │  │
# │  │        ║         2  2  :  3  4                ║                      │  │
# │  │        ║              ↑ 144pt                 ║                      │  │
# │  │        ║                                      ║                      │  │
# │  │        ║   Wednesday, January 15  •  Week 03  ║                      │  │
# │  │        ║        Good evening, Ash ✨          ║                      │  │
# │  │        ╚══════════════════════════════════════╝                      │  │
# │  │                                                                       │  │
# │  │              ┌────────────────────────────┐                          │  │
# │  │              │   ●  ●  ●  ●  ●  password  │                          │  │
# │  │              └────────────────────────────┘                          │  │
# │  │                    󰎆  Tame Impala — Let It Happen                    │  │
# │  │                                                                       │  │
# │  │  🔋 94%                                             󰟢  tokyo-night   │  │
# │  └───────────────────────────────────────────────────────────────────────┘  │
# │                                                                              │
# │  DESIGN PHILOSOPHY:                                                          │
# │    • Clock is the unambiguous hero — 144pt, perfectly centered              │
# │    • Glassmorphism card frames the entire clock/date/greeting block         │
# │    • Weather prominent above card — atmospheric context at a glance         │
# │    • Input field lives below card — clean separation of info vs action      │
# │    • Media + footer at bottom — non-intrusive status layer                  │
# │    • 18 total widgets — rich but not cluttered                              │
# │                                                                              │
# │  UNIQUE TO THIS LAYOUT:                                                      │
# │    • Glassmorphism card background image (simulated via dark overlay image) │
# │    • Larger clock (144pt vs 96pt default)                                   │
# │    • Weather moved to center-top (prominent) vs corner (subtle in default)  │
# │    • No avatar — identity established by greeting text instead              │
# │    • Seconds rendered as flowing sub-label below main clock                 │
# └─────────────────────────────────────────────────────────────────────────────┘

source = ~/.config/hyprlock/colors.conf

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# GLOBAL
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    disable_loading_bar  = false
    hide_cursor          = true
    grace                = 0
    ignore_empty_input   = true
    immediate_render     = true
    fractional_scaling   = 2
    enable_screencopy    = true
    text_trim            = true
    pam_module           = hyprlock
    no_fade_in           = false
    no_fade_out          = false
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# BACKGROUND LAYER 1 — Wallpaper with moderate blur
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Clock-center uses a slightly lighter blur than minimal.
# The wallpaper remains identifiable — it is the atmospheric canvas.
# brightness=0.62 keeps the scene moody without losing wallpaper character.

background {
    monitor      =
    path         = $HOME/.cache/hyprlock/wallpaper-cache.png
    blur_size    = 6
    blur_passes  = 3
    noise        = 0.0100
    brightness   = 0.62
    vibrancy     = 0.14
    contrast     = 1.02
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# GLASSMORPHISM CARD — Background image overlay
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Hyprlock does not have a native rectangle/card widget.
# Glass card is simulated using an image widget with a pre-rendered
# semi-transparent frosted glass PNG (generated by ash install at setup time).
# The card is positioned to frame the clock + date + greeting cluster.
#
# Generation: scripts/install/setup-hyprlock-assets.sh creates:
#   ~/.cache/hyprlock/glass-card-480x260.png — 480×260 rgba(20,20,30,0.55) PNG
#   ~/.cache/hyprlock/glass-card-480x260-light.png — light variant
#
# Alternative: if card PNG missing, this image widget renders nothing (graceful).
# The layout remains fully functional — card is purely decorative layer.

image {
    monitor      =
    path         = $HOME/.cache/hyprlock/glass-card-520x280.png
    size         = 520
    rounding     = 20
    border_size  = 1
    border_color = rgba(255, 255, 255, 0.08)
    position     = 0, 108
    halign       = center
    valign       = center
    shadow_passes = 4
    shadow_size  = 20
    shadow_color = rgba(0,0,0,0.55)
    shadow_boost = 1.4
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════  TOP: WEATHER HERO  ═════════════════════════════════
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Weather is promoted to top-center in this layout — the atmospheric context
# sets the mood before the clock draws the eye downward.
# Larger font than default (15pt vs 13pt) to match the heroic scale.

label {
    monitor      =
    text         = cmd[update:1800000] $HOME/.config/hyprlock/scripts/weather-lock.sh --full
    font_family  = JetBrainsMono Nerd Font
    font_size    = 15
    color        = $HL_FG_SUBTLE
    position     = 0, 280
    halign       = center
    valign       = center
    shadow_passes = 2
    shadow_size  = 4
    shadow_color = rgba(0,0,0,0.45)
    shadow_boost = 1.1
    rotate       = 0
}

# ── Weather Location Label ────────────────────────────────────────────────────
# Displays city name + country code below weather line.
# Reads from ash weather cache — same source as main weather widget.

label {
    monitor      =
    text         = cmd[update:3600000] $HOME/.config/hyprlock/scripts/weather-lock.sh --location
    font_family  = JetBrainsMono Nerd Font
    font_size    = 11
    color        = $HL_FG_MUTED
    position     = 0, 256
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.30)
    shadow_boost = 1.0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════  HERO CLOCK (144pt)  ════════════════════════════════
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# The defining feature of this layout: maximum-scale clock.
# 144pt renders at approximately 192px cap-height on 1× displays.
# At 2× HiDPI this becomes a 384px tall typographic anchor — unmissable.
# Font: Thin weight for editorial, high-fashion watch-face aesthetic.
# Positioned inside the glass card vertically.

# ── Clock: Hours (Hero Scale) ─────────────────────────────────────────────────
label {
    monitor      =
    text         = cmd[update:1000] date +'%H'
    font_family  = JetBrainsMono Nerd Font Thin
    font_size    = 144
    color        = rgba(205, 214, 244, 0.96)
    position     = -86, 138
    halign       = center
    valign       = center
    shadow_passes = 4
    shadow_size  = 18
    shadow_color = rgba(0,0,0,0.65)
    shadow_boost = 1.3
    shadow_x_offset = 0
    shadow_y_offset = 4
    rotate       = 0
}

# ── Clock: Separator (Hero Scale) ────────────────────────────────────────────
# Blinking colon at this scale has significant visual weight — used sparingly.
# 2-second blink rate (even=on, odd=off) chosen over 1s for calm aesthetics.

label {
    monitor      =
    text         = cmd[update:2000] bash -c '[[ $(($(date +%S) % 4)) -lt 2 ]] && echo ":" || echo " "'
    font_family  = JetBrainsMono Nerd Font Thin
    font_size    = 120
    color        = rgba(147, 153, 178, 0.45)
    position     = 0, 142
    halign       = center
    valign       = center
    shadow_passes = 2
    shadow_size  = 8
    shadow_color = rgba(0,0,0,0.40)
    shadow_boost = 1.1
    rotate       = 0
}

# ── Clock: Minutes (Hero Scale) ───────────────────────────────────────────────
label {
    monitor      =
    text         = cmd[update:1000] date +'%M'
    font_family  = JetBrainsMono Nerd Font Thin
    font_size    = 144
    color        = rgba(205, 214, 244, 0.96)
    position     = 86, 138
    halign       = center
    valign       = center
    shadow_passes = 4
    shadow_size  = 18
    shadow_color = rgba(0,0,0,0.65)
    shadow_boost = 1.3
    shadow_x_offset = 0
    shadow_y_offset = 4
    rotate       = 0
}

# ── Clock: Seconds (Sub-label, below main digits) ─────────────────────────────
# Rendered as a flowing ticker below the main time block.
# Positioned at bottom edge of glass card interior.
# Dot-separated between minutes value and seconds — reads as "22:34 · 07"

label {
    monitor      =
    text         = cmd[update:1000] date +'·  %S'
    font_family  = JetBrainsMono Nerd Font ExtraLight
    font_size    = 28
    color        = rgba(108, 112, 134, 0.65)
    position     = 110, 96
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 4
    shadow_color = rgba(0,0,0,0.35)
    shadow_boost = 1.0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════  DATE + GREETING (in card)  ═════════════════════════
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Both date and greeting sit inside the glass card footprint.
# Compact format to fit within 520px card width at readable sizes.

# ── Full Date + Week ──────────────────────────────────────────────────────────
# Combined into one line to save vertical space within card bounds.
# Format: "Wednesday, January 15  •  Week 03"

label {
    monitor      =
    text         = cmd[update:60000] echo "$(date +'%A, %B %-d')  •  Week $(date +'%V')"
    font_family  = Noto Sans
    font_size    = 17
    color        = $HL_FG_SECONDARY
    position     = 0, 50
    halign       = center
    valign       = center
    shadow_passes = 2
    shadow_size  = 4
    shadow_color = rgba(0,0,0,0.40)
    shadow_boost = 1.0
    rotate       = 0
}

# ── Greeting (inside card) ────────────────────────────────────────────────────
label {
    monitor      =
    text         = cmd[update:3600000] $HOME/.config/hyprlock/scripts/greeting.sh
    font_family  = Noto Sans Light
    font_size    = 15
    color        = $HL_FG_SUBTLE
    position     = 0, 22
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 3
    shadow_color = rgba(0,0,0,0.30)
    shadow_boost = 1.0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════  INPUT FIELD (below card)  ══════════════════════════
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Input field positioned clearly below the glass card with deliberate gap.
# Wider than default (360px) to match the card's visual width impression.
# Border style slightly more prominent — important element needs clear affordance.

input-field {
    monitor           =
    size              = 360, 58
    position          = 0, -136
    halign            = center
    valign            = center

    outline_thickness = 2
    outer_color       = $HL_INPUT_BORDER
    inner_color       = rgba(17, 17, 27, 0.76)
    font_color        = $HL_INPUT_FG
    font_family       = JetBrainsMono Nerd Font
    font_size         = 15
    rounding          = 14

    placeholder_text  = <span foreground="##585b70" font_size="13pt"> password</span>

    dots_size         = 0.30
    dots_spacing      = 0.15
    dots_center       = true
    dots_rounding     = -1

    fade_on_empty     = true
    fade_timeout      = 1000

    check_color       = $HL_INPUT_CHECK
    fail_color        = $HL_INPUT_FAIL
    fail_timeout      = 2000
    fail_transition   = 300

    fail_text         = <span foreground="##f38ba8" font_size="12pt"> Authentication failed</span>

    capslock_color    = $HL_WARN
    numlock_color     = -1

    shadow_passes     = 3
    shadow_size       = 8
    shadow_color      = rgba(0,0,0,0.55)
    shadow_boost      = 1.3
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════  MEDIA PLAYER  ══════════════════════════════════════
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

label {
    monitor      =
    text         = cmd[update:3000] $HOME/.config/hyprlock/scripts/songdetail.sh
    font_family  = Noto Sans Light
    font_size    = 13
    color        = $HL_FG_SUBTLE
    position     = 0, -192
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.30)
    shadow_boost = 1.0
    rotate       = 0
}

label {
    monitor      =
    text         = cmd[update:3000] $HOME/.config/hyprlock/scripts/songdetail.sh --progress
    font_family  = JetBrainsMono Nerd Font
    font_size    = 10
    color        = $HL_ACCENT
    position     = 0, -212
    halign       = center
    valign       = center
    shadow_passes = 0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════  FOOTER STATUS STRIP  ═══════════════════════════════
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── FOOTER-LEFT: Battery ──────────────────────────────────────────────────────
label {
    monitor      =
    text         = cmd[update:60000] $HOME/.config/hyprlock/scripts/battery-status.sh
    font_family  = JetBrainsMono Nerd Font
    font_size    = 12
    color        = $HL_FG_MUTED
    position     = 36, 36
    halign       = left
    valign       = bottom
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.25)
    shadow_boost = 1.0
    rotate       = 0
}

# ── FOOTER-RIGHT: Active Theme ───────────────────────────────────────────────
label {
    monitor      =
    text         = cmd[update:30000] printf "󰟢  %s" "$(cat "$HOME/.cache/ash/state/current-theme.json" 2>/dev/null | grep -oP '"name"\s*:\s*"\K[^"]+' | head -1 || echo "default")"
    font_family  = JetBrainsMono Nerd Font
    font_size    = 11
    color        = $HL_FG_MUTED
    position     = -36, 36
    halign       = right
    valign       = bottom
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.25)
    shadow_boost = 1.0
    rotate       = 0
}

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  END: layouts/clock-center.conf  •  18 widgets  •  ASH v5.0 OMEGA          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝