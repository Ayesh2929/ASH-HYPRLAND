# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — HYPRLOCK LAYOUT: MINIMAL                        ║
# ║  Zero-distraction lock screen — maximum focus, minimum chrome              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  LAYOUT BLUEPRINT                                                            │
# │                                                                              │
# │  ┌───────────────────────────────────────────────────────────────────────┐  │
# │  │                                                                       │  │
# │  │                                                                       │  │
# │  │                                                                       │  │
# │  │                                                                       │  │
# │  │                                                                       │  │
# │  │                       HH : MM                                        │  │
# │  │                    Wednesday 15                                       │  │
# │  │                                                                       │  │
# │  │                    ┌────────────────┐                                 │  │
# │  │                    │  ●  ●  ●  ●   │                                 │  │
# │  │                    └────────────────┘                                 │  │
# │  │                                                                       │  │
# │  │                                                                       │  │
# │  │                                                                       │  │
# │  └───────────────────────────────────────────────────────────────────────┘  │
# │                                                                              │
# │  DESIGN PHILOSOPHY:                                                          │
# │    • Absolute minimum: clock + date + password only (7 elements)            │
# │    • Maximum blur (passes=4, size=8) for deep focus aesthetic               │
# │    • No weather, no media, no battery, no footer clutter                    │
# │    • No avatar — authentication is frictionless and anonymous               │
# │    • Monochromatic — uses only FG_PRIMARY and FG_MUTED, no accent pops     │
# │    • Ideal for: cinema mode, focus mode, presentation setups                │
# │    • Keyboard shortcut: ash config set hyprlock.layout minimal              │
# │                                                                              │
# │  WIDGET COUNT: 7 (vs 26 in default — 73% reduction in render load)          │
# └─────────────────────────────────────────────────────────────────────────────┘

source = ~/.config/hyprlock/colors.conf

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# GLOBAL
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Minimal layout optimizes for speed and silence.
# disable_loading_bar=true removes progress indicator during init.
# no_fade_in=false keeps the elegant fade-in even on minimal.

general {
    disable_loading_bar  = true
    hide_cursor          = true
    grace                = 0
    ignore_empty_input   = true
    immediate_render     = true
    fractional_scaling   = 2
    enable_screencopy    = true
    text_trim            = true
    pam_module           = hyprlock
    no_fade_in           = false
    no_fade_out          = false
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# BACKGROUND
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Minimal uses maximum blur to render the wallpaper nearly unrecognizable.
# The result is a soft, atmospheric color field — no distracting imagery.
# blur_size=8 + blur_passes=4 = near-total abstraction of source image.
# brightness lowered further than default to push content into foreground.

background {
    monitor      =
    path         = $HOME/.cache/hyprlock/wallpaper-cache.png
    blur_size    = 8
    blur_passes  = 4
    noise        = 0.0080
    brightness   = 0.55
    vibrancy     = 0.06
    contrast     = 0.95
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════  CLOCK  ═════════════════════════════════════════════
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Minimal clock renders hours and minutes as a single concatenated string.
# No separate element for seconds — reduces widget count and visual noise.
# Font weight: Light variant for understated elegance (not Bold).
# No blinking colon — static separator for calm, unmoving aesthetic.

# ── Hours ─────────────────────────────────────────────────────────────────────
label {
    monitor      =
    text         = cmd[update:60000] date +'%H'
    font_family  = JetBrainsMono Nerd Font Light
    font_size    = 112
    color        = rgba(205, 214, 244, 0.92)
    position     = -68, 60
    halign       = center
    valign       = center
    shadow_passes = 2
    shadow_size  = 12
    shadow_color = rgba(0,0,0,0.35)
    shadow_boost = 1.0
    rotate       = 0
}

# ── Separator ─────────────────────────────────────────────────────────────────
# Static colon — no blink in minimal mode (tranquility over liveliness).

label {
    monitor      =
    text         = :
    font_family  = JetBrainsMono Nerd Font ExtraLight
    font_size    = 90
    color        = rgba(147, 153, 178, 0.40)
    position     = 0, 64
    halign       = center
    valign       = center
    shadow_passes = 0
    rotate       = 0
}

# ── Minutes ───────────────────────────────────────────────────────────────────
label {
    monitor      =
    text         = cmd[update:60000] date +'%M'
    font_family  = JetBrainsMono Nerd Font Light
    font_size    = 112
    color        = rgba(205, 214, 244, 0.92)
    position     = 68, 60
    halign       = center
    valign       = center
    shadow_passes = 2
    shadow_size  = 12
    shadow_color = rgba(0,0,0,0.35)
    shadow_boost = 1.0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════  DATE  ══════════════════════════════════════════════
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Compact date: abbreviated weekday + numeric day only.
# No icons, no month name — minimal cognitive load.
# Format: "Wed  15" — brevity over completeness.

label {
    monitor      =
    text         = cmd[update:60000] date +'%a  %-d'
    font_family  = JetBrainsMono Nerd Font Light
    font_size    = 18
    color        = rgba(147, 153, 178, 0.60)
    position     = 0, -14
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 3
    shadow_color = rgba(0,0,0,0.25)
    shadow_boost = 1.0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════  SPACE BUFFER  ══════════════════════════════════════
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Invisible spacer label — creates vertical breathing room between date
# and input field. Hyprlock has no native margin/padding system,
# so empty labels at strategic positions serve as layout anchors.

label {
    monitor      =
    text         =
    font_size    = 24
    color        = rgba(0,0,0,0)
    position     = 0, -58
    halign       = center
    valign       = center
    shadow_passes = 0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ═══════════════════════  INPUT FIELD  ═══════════════════════════════════════
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Minimal input: narrower width, thinner border, no placeholder text icon.
# Border uses a very subtle color — nearly invisible until active state.
# Active border brightens dramatically to signal attention.
# No shadow on input — shadows are "decoration", minimal avoids decoration.

input-field {
    monitor           =
    size              = 280, 50
    position          = 0, -100
    halign            = center
    valign            = center

    # ── Minimal Visuals ───────────────────────────────────────────────────────
    # Near-invisible idle border — only the dot indicators show presence.
    # bg transparency is higher than default (more glass-like).
    outline_thickness = 1
    outer_color       = rgba(108, 112, 134, 0.30)
    inner_color       = rgba(24, 24, 37, 0.58)
    font_color        = rgba(205, 214, 244, 0.95)
    font_family       = JetBrainsMono Nerd Font Light
    font_size         = 14
    rounding          = $HL_INPUT_ROUNDING

    # ── Placeholder: text-only, no icon ───────────────────────────────────────
    placeholder_text  = <span foreground="##585b70" font_size="12pt">password</span>

    # ── Dots: smaller, tighter ────────────────────────────────────────────────
    dots_size         = 0.24
    dots_spacing      = 0.20
    dots_center       = true
    dots_rounding     = -1

    fade_on_empty     = true
    fade_timeout      = 800

    # ── State Colors ──────────────────────────────────────────────────────────
    # Active state uses accent but at lower opacity than default layout.
    check_color       = rgba(249, 226, 175, 0.80)
    fail_color        = rgba(243, 139, 168, 0.85)
    fail_timeout      = 1800
    fail_transition   = 250

    # ── Fail Text: minimal — no icon, plain text ──────────────────────────────
    fail_text         = <span foreground="##f38ba8" font_size="11pt">incorrect</span>

    capslock_color    = $HL_WARN
    numlock_color     = -1

    # ── No shadow on minimal ─────────────────────────────────────────────────
    shadow_passes     = 0
}

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  END: layouts/minimal.conf  •  7 widgets  •  ASH v5.0 OMEGA                ║
