# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — HYPRLOCK LAYOUT: DUAL-MONITOR                   ║
# ║  Purpose-built for multi-display setups — each screen tells its own story  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  LAYOUT BLUEPRINT — DUAL MONITOR                                             │
# │                                                                              │
# │  ╔═══════════════════════════╗  ╔═══════════════════════════╗               │
# │  ║   DISPLAY PRIMARY (DP-1)  ║  ║  DISPLAY SECONDARY (DP-2) ║               │
# │  ║                           ║  ║                           ║               │
# │  ║  🔋 bat    📶 net         ║  ║  🌤️ weather  🔔 notif    ║               │
# │  ║                           ║  ║                           ║               │
# │  ║      ██ HH : MM ██  SS   ║  ║   ┌─────────────────────┐ ║               │
# │  ║      Wednesday, Jan 15    ║  ║   │  System Dashboard   │ ║               │
# │  ║      Week 03  •  UTC      ║  ║   │                     │ ║               │
# │  ║      Good evening ✨      ║  ║   │  CPU  ████░  42%    │ ║               │
# │  ║      ─────────────────    ║  ║   │  RAM  ██░░░  31%    │ ║               │
# │  ║      [  avatar  ]         ║  ║   │  DISK ███░░  58%    │ ║               │
# │  ║        username           ║  ║   │  NET  ↑ 2.1  ↓ 8.4 │ ║               │
# │  ║   ┌──────────────────┐    ║  ║   │  GPU  █████  71%    │ ║               │
# │  ║   │  ● ● ● password  │    ║  ║   │                     │ ║               │
# │  ║   └──────────────────┘    ║  ║   │  🌐 home-network    │ ║               │
# │  ║   󰎆 Artist — Track        ║  ║   │  󰣀 VPN: inactive    │ ║               │
# │  ║   ████████░░  2:34/4:12   ║  ║   └─────────────────────┘ ║               │
# │  ║                           ║  ║                           ║               │
# │  ║  󰌢 hostname • uptime      ║  ║      󰐝 Docker: 3 up      ║               │
# │  ║                 󰟢 theme   ║  ║      󰒍 K8s: prod-ctx      ║               │
# │  ╚═══════════════════════════╝  ╚═══════════════════════════╝               │
# │                                                                              │
# │  MONITOR TARGETING STRATEGY:                                                 │
# │    Primary (DP-1)  → Auth flow: clock + identity + input + media            │
# │    Secondary (DP-2) → Info panel: system stats + network + services         │
# │                                                                              │
# │  AUTO-DETECTION:                                                             │
# │    Monitor names are read from $ASH_PRIMARY_MONITOR / $ASH_SECONDARY_MONITOR│
# │    env vars set by ash monitor detection during session init.                │
# │    Fallback: DP-1 / DP-2 if env vars absent.                               │
# │    Override: ash config set monitors.primary "HDMI-A-1"                     │
# │                                                                              │
# │  CONFIGURATION:                                                              │
# │    ash config set hyprlock.layout dual-monitor                              │
# │    ash config set monitors.primary "DP-1"                                   │
# │    ash config set monitors.secondary "HDMI-A-1"                             │
# └─────────────────────────────────────────────────────────────────────────────┘

source = ~/.config/hyprlock/colors.conf

# ── Monitor name resolution ───────────────────────────────────────────────────
# These variables are injected by the ash theme engine from monitor detection.
# If not set, hyprlock falls back to matching all monitors (monitor = "").
# To manually set: add to colors.conf via `ash config set hyprlock.*`
# $HL_MON_PRIMARY   = DP-1       # Primary display (auth)
# $HL_MON_SECONDARY = DP-2       # Secondary display (info panel)

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# GLOBAL
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    disable_loading_bar  = false
    hide_cursor          = true
    grace                = 0
    ignore_empty_input   = true
    immediate_render     = true
    fractional_scaling   = 2
    enable_screencopy    = true
    text_trim            = true
    pam_module           = hyprlock
    no_fade_in           = false
    no_fade_out          = false
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# BACKGROUND — PRIMARY MONITOR
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Primary: standard blur — matches default layout aesthetic.
# Auth UI needs clear contrast without being harsh.

background {
    monitor      = $HL_MON_PRIMARY
    path         = $HOME/.cache/hyprlock/wallpaper-cache.png
    blur_size    = 7
    blur_passes  = 3
    noise        = 0.0117
    brightness   = $HL_BG_BRIGHTNESS
    vibrancy     = $HL_BG_VIBRANCY
    contrast     = 1.0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# BACKGROUND — SECONDARY MONITOR
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Secondary: heavier blur + darker — turns secondary into a dark ambient canvas.
# The info dashboard panel sits on top as the clear focal point.
# This contrast deliberately de-emphasizes the secondary relative to primary.

background {
    monitor      = $HL_MON_SECONDARY
    path         = $HOME/.cache/hyprlock/wallpaper-cache.png
    blur_size    = 8
    blur_passes  = 4
    noise        = 0.0080
    brightness   = 0.45
    vibrancy     = 0.05
    contrast     = 0.92
}

# ════════════════════════════════════════════════════════════════════════════════
# ██████████████████████  PRIMARY MONITOR WIDGETS  ██████████████████████████████
# ════════════════════════════════════════════════════════════════════════════════

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PRIMARY — ROW: TOP STATUS BAR
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── P-TOP-LEFT: Battery ───────────────────────────────────────────────────────
label {
    monitor      = $HL_MON_PRIMARY
    text         = cmd[update:60000] $HOME/.config/hyprlock/scripts/battery-status.sh
    font_family  = JetBrainsMono Nerd Font
    font_size    = 13
    color        = $HL_FG_SUBTLE
    position     = 40, -36
    halign       = left
    valign       = top
    shadow_passes = 2
    shadow_size  = 3
    shadow_color = rgba(0,0,0,0.45)
    shadow_boost = 1.1
    rotate       = 0
}

# ── P-TOP-LEFT-2: Network ─────────────────────────────────────────────────────
label {
    monitor      = $HL_MON_PRIMARY
    text         = cmd[update:15000] bash -c 'iface=$(nmcli -t -f TYPE,CONNECTION device status 2>/dev/null | grep -E "^wifi|^ethernet" | head -1); [[ -z "$iface" ]] && echo "󰤭  offline" && exit; type=$(echo "$iface"|cut -d: -f1); name=$(echo "$iface"|cut -d: -f2|cut -c1-14); [[ "$type" == "wifi" ]] && echo "󰤨  $name" || echo "󰈀  $name"'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 11
    color        = $HL_FG_MUTED
    position     = 40, -56
    halign       = left
    valign       = top
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.35)
    shadow_boost = 1.0
    rotate       = 0
}

# ── P-TOP-RIGHT: VPN Indicator ───────────────────────────────────────────────
# Primary-only VPN status — security context always on the auth screen.
# Green padlock when active, gray when inactive.

label {
    monitor      = $HL_MON_PRIMARY
    text         = cmd[update:20000] bash -c 'if ip link show | grep -q "tun0\|wg0\|vpn"; then echo "󰦝  VPN active"; else echo "󰦞  VPN off"; fi'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 11
    color        = $HL_FG_MUTED
    position     = -40, -56
    halign       = right
    valign       = top
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.30)
    shadow_boost = 1.0
    rotate       = 0
}

# ── P-TOP-RIGHT: Notification Count ──────────────────────────────────────────
label {
    monitor      = $HL_MON_PRIMARY
    text         = cmd[update:20000] bash -c 'c=$(swaync-client -c 2>/dev/null | tr -d "\n"); [[ "$c" =~ ^[0-9]+$ ]] && [[ "$c" -gt 0 ]] && echo "󱅫  $c new" || echo ""'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 12
    color        = $HL_ACCENT
    position     = -40, -36
    halign       = right
    valign       = top
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.30)
    shadow_boost = 1.0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PRIMARY — ROW: HERO CLOCK
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Hours ─────────────────────────────────────────────────────────────────────
label {
    monitor      = $HL_MON_PRIMARY
    text         = cmd[update:1000] date +'%H'
    font_family  = JetBrainsMono Nerd Font Bold
    font_size    = 96
    color        = $HL_FG_PRIMARY
    position     = -96, 182
    halign       = center
    valign       = center
    shadow_passes = 3
    shadow_size  = 10
    shadow_color = rgba(0,0,0,0.60)
    shadow_boost = 1.2
    shadow_x_offset = 0
    shadow_y_offset = 3
    rotate       = 0
}

# ── Separator ─────────────────────────────────────────────────────────────────
label {
    monitor      = $HL_MON_PRIMARY
    text         = cmd[update:1000] bash -c '[[ $(($(date +%S) % 2)) -eq 0 ]] && echo ":" || echo " "'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 80
    color        = $HL_FG_MUTED
    position     = 0, 186
    halign       = center
    valign       = center
    shadow_passes = 2
    shadow_size  = 6
    shadow_color = rgba(0,0,0,0.50)
    shadow_boost = 1.1
    rotate       = 0
}

# ── Minutes ───────────────────────────────────────────────────────────────────
label {
    monitor      = $HL_MON_PRIMARY
    text         = cmd[update:1000] date +'%M'
    font_family  = JetBrainsMono Nerd Font Bold
    font_size    = 96
    color        = $HL_FG_PRIMARY
    position     = 96, 182
    halign       = center
    valign       = center
    shadow_passes = 3
    shadow_size  = 10
    shadow_color = rgba(0,0,0,0.60)
    shadow_boost = 1.2
    shadow_x_offset = 0
    shadow_y_offset = 3
    rotate       = 0
}

# ── Seconds ───────────────────────────────────────────────────────────────────
label {
    monitor      = $HL_MON_PRIMARY
    text         = cmd[update:1000] date +'%S'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 32
    color        = $HL_FG_MUTED
    position     = 198, 152
    halign       = center
    valign       = center
    shadow_passes = 2
    shadow_size  = 4
    shadow_color = rgba(0,0,0,0.40)
    shadow_boost = 1.0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PRIMARY — ROW: DATE METADATA
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

label {
    monitor      = $HL_MON_PRIMARY
    text         = cmd[update:60000] echo "󰃭  $(date +'%A, %B %-d')"
    font_family  = Noto Sans
    font_size    = 22
    color        = $HL_FG_SECONDARY
    position     = 0, 90
    halign       = center
    valign       = center
    shadow_passes = 2
    shadow_size  = 4
    shadow_color = rgba(0,0,0,0.45)
    shadow_boost = 1.1
    rotate       = 0
}

label {
    monitor      = $HL_MON_PRIMARY
    text         = cmd[update:3600000] echo "Week $(date +'%V')  •  $(date +'%Z')"
    font_family  = JetBrainsMono Nerd Font
    font_size    = 12
    color        = $HL_FG_MUTED
    position     = 0, 62
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.30)
    shadow_boost = 1.0
    rotate       = 0
}

label {
    monitor      = $HL_MON_PRIMARY
    text         = cmd[update:3600000] $HOME/.config/hyprlock/scripts/greeting.sh
    font_family  = Noto Sans
    font_size    = 17
    color        = $HL_FG_SECONDARY
    position     = 0, 36
    halign       = center
    valign       = center
    shadow_passes = 2
    shadow_size  = 3
    shadow_color = rgba(0,0,0,0.40)
    shadow_boost = 1.0
    rotate       = 0
}

# ── Divider ───────────────────────────────────────────────────────────────────
label {
    monitor      = $HL_MON_PRIMARY
    text         = ──────────────────────────────
    font_family  = JetBrainsMono Nerd Font
    font_size    = 9
    color        = $HL_SEPARATOR
    position     = 0, 2
    halign       = center
    valign       = center
    shadow_passes = 0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PRIMARY — ROW: AVATAR + IDENTITY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

image {
    monitor      = $HL_MON_PRIMARY
    path         = $HOME/.face
    size         = 82
    rounding     = -1
    border_size  = 3
    border_color = $HL_ACCENT
    position     = 0, -52
    halign       = center
    valign       = center
    shadow_passes = 3
    shadow_size  = 8
    shadow_color = rgba(0,0,0,0.50)
    shadow_boost = 1.3
    rotate       = 0
}

label {
    monitor      = $HL_MON_PRIMARY
    text         = $USER
    font_family  = Noto Sans Bold
    font_size    = 16
    color        = $HL_FG_PRIMARY
    position     = 0, -100
    halign       = center
    valign       = center
    shadow_passes = 2
    shadow_size  = 3
    shadow_color = rgba(0,0,0,0.45)
    shadow_boost = 1.1
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PRIMARY — INPUT FIELD
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Input-field monitor targeting: input only renders on primary.
# Secondary monitor has no input — prevents confusion about where to type.

input-field {
    monitor           = $HL_MON_PRIMARY
    size              = 320, 56
    position          = 0, -152
    halign            = center
    valign            = center
    outline_thickness = 2
    outer_color       = $HL_INPUT_BORDER
    inner_color       = $HL_INPUT_BG
    font_color        = $HL_INPUT_FG
    font_family       = JetBrainsMono Nerd Font
    font_size         = 15
    rounding          = $HL_INPUT_ROUNDING
    placeholder_text  = <span foreground="##$HL_INPUT_PLACEHOLDER_HEX" font_size="13pt"> Enter password…</span>
    dots_size         = 0.28
    dots_spacing      = 0.16
    dots_center       = true
    dots_rounding     = -1
    fade_on_empty     = true
    fade_timeout      = 1200
    check_color       = $HL_INPUT_CHECK
    fail_color        = $HL_INPUT_FAIL
    fail_timeout      = 2000
    fail_transition   = 300
    fail_text         = <span foreground="##$HL_FAIL_HEX" font_size="12pt"> Authentication failed</span>
    capslock_color    = $HL_WARN
    numlock_color     = -1
    shadow_passes     = 3
    shadow_size       = 6
    shadow_color      = rgba(0,0,0,0.50)
    shadow_boost      = 1.2
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PRIMARY — MEDIA PLAYER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

label {
    monitor      = $HL_MON_PRIMARY
    text         = cmd[update:3000] $HOME/.config/hyprlock/scripts/songdetail.sh
    font_family  = Noto Sans
    font_size    = 13
    color        = $HL_FG_SUBTLE
    position     = 0, -222
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.35)
    shadow_boost = 1.0
    rotate       = 0
}

label {
    monitor      = $HL_MON_PRIMARY
    text         = cmd[update:3000] $HOME/.config/hyprlock/scripts/songdetail.sh --progress
    font_family  = JetBrainsMono Nerd Font
    font_size    = 11
    color        = $HL_ACCENT
    position     = 0, -244
    halign       = center
    valign       = center
    shadow_passes = 0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PRIMARY — FOOTER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

label {
    monitor      = $HL_MON_PRIMARY
    text         = cmd[update:60000] echo "󰌢  $HOSTNAME  •  $(uptime -p | sed 's/up //')"
    font_family  = JetBrainsMono Nerd Font
    font_size    = 10
    color        = $HL_FG_MUTED
    position     = 36, 36
    halign       = left
    valign       = bottom
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.25)
    shadow_boost = 1.0
    rotate       = 0
}

label {
    monitor      = $HL_MON_PRIMARY
    text         = cmd[update:30000] printf "󰟢  %s" "$(cat "$HOME/.cache/ash/state/current-theme.json" 2>/dev/null | grep -oP '"name"\s*:\s*"\K[^"]+' | head -1 || echo "default")"
    font_family  = JetBrainsMono Nerd Font
    font_size    = 10
    color        = $HL_FG_MUTED
    position     = -36, 36
    halign       = right
    valign       = bottom
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.25)
    shadow_boost = 1.0
    rotate       = 0
}

# ════════════════════════════════════════════════════════════════════════════════
# ██████████████████████  SECONDARY MONITOR WIDGETS  ████████████████████████████
# ════════════════════════════════════════════════════════════════════════════════
# The secondary monitor shows a real-time system dashboard.
# All widgets target $HL_MON_SECONDARY explicitly.
# No input-field on secondary — authentication always on primary only.

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECONDARY — GLASS DASHBOARD CARD
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Pre-rendered glass card PNG frames the entire system dashboard block.
# Card dimensions: 420×420px — contains all stat rows with comfortable padding.
# Generated by ash install: scripts/install/setup-hyprlock-assets.sh

image {
    monitor      = $HL_MON_SECONDARY
    path         = $HOME/.cache/hyprlock/glass-card-420x440.png
    size         = 420
    rounding     = 18
    border_size  = 1
    border_color = rgba(255, 255, 255, 0.07)
    position     = 0, 20
    halign       = center
    valign       = center
    shadow_passes = 5
    shadow_size  = 24
    shadow_color = rgba(0,0,0,0.65)
    shadow_boost = 1.5
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECONDARY — DASHBOARD HEADER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Dashboard Title ───────────────────────────────────────────────────────────
label {
    monitor      = $HL_MON_SECONDARY
    text         =  System Status
    font_family  = Noto Sans Bold
    font_size    = 18
    color        = $HL_FG_SECONDARY
    position     = 0, 218
    halign       = center
    valign       = center
    shadow_passes = 2
    shadow_size  = 4
    shadow_color = rgba(0,0,0,0.45)
    shadow_boost = 1.1
    rotate       = 0
}

# ── Dashboard Subtitle: Last Updated Timestamp ────────────────────────────────
label {
    monitor      = $HL_MON_SECONDARY
    text         = cmd[update:5000] echo "󰔚  Updated $(date +'%H:%M:%S')"
    font_family  = JetBrainsMono Nerd Font
    font_size    = 10
    color        = $HL_FG_MUTED
    position     = 0, 196
    halign       = center
    valign       = center
    shadow_passes = 0
    rotate       = 0
}

# ── Header Divider ─────────────────────────────────────────────────────────────
label {
    monitor      = $HL_MON_SECONDARY
    text         = ─────────────────────────────────
    font_family  = JetBrainsMono Nerd Font
    font_size    = 9
    color        = $HL_SEPARATOR
    position     = 0, 178
    halign       = center
    valign       = center
    shadow_passes = 0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECONDARY — CPU STAT ROW
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Format: "  CPU   [████████░░░░░░░░]  42%  3.8 GHz"
# Bar: 16-char unicode block fill using █ (filled) and ░ (empty).
# Freq: reads from /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq
# Temp: reads from sensors or /sys/class/thermal/thermal_zone*/temp

# ── CPU Label ─────────────────────────────────────────────────────────────────
label {
    monitor      = $HL_MON_SECONDARY
    text         = cmd[update:3000] bash -c 'cpu=$(grep -o "cpu[0-9]*" /proc/stat | head -1); read cpu u n s id wa ir si st < <(grep "^cpu " /proc/stat); active=$((u+n+s+wa+ir+si+st)); total=$((active+id)); pct=$((active*100/total)); filled=$((pct*16/100)); bar=$(printf "%.0s█" $(seq 1 $filled 2>/dev/null)); empty=$(printf "%.0s░" $(seq 1 $((16-filled)) 2>/dev/null)); freq=$(awk "{printf \"%.1f\", \$1/1000000}" /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq 2>/dev/null || echo "?"); echo "  CPU   [${bar}${empty}]  ${pct}%  ${freq}GHz"'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 13
    color        = $HL_FG_SUBTLE
    position     = 0, 148
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.35)
    shadow_boost = 1.0
    rotate       = 0
}

# ── CPU Temperature ────────────────────────────────────────────────────────────
# Reads from sensors (lm-sensors). Falls back to thermal_zone if unavailable.
# Color hint: below 60°C → muted, 60–80°C → warn, 80°C+ → error (via Pango)

label {
    monitor      = $HL_MON_SECONDARY
    text         = cmd[update:5000] bash -c 'temp=$(sensors 2>/dev/null | grep -oP "Package id 0:.*?\+\K[0-9.]+" | head -1 || cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null | awk "{printf \"%.0f\", \$1/1000}"); [[ -z "$temp" ]] && echo "" && exit; if (( $(echo "$temp > 80" | bc -l) )); then echo "<span foreground=\"##f38ba8\">󰔐  ${temp}°C  ⚠ HOT</span>"; elif (( $(echo "$temp > 60" | bc -l) )); then echo "<span foreground=\"##f9e2af\">󰔐  ${temp}°C  WARM</span>"; else echo "<span foreground=\"##a6e3a1\">󰔐  ${temp}°C</span>"; fi'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 11
    color        = $HL_FG_MUTED
    position     = 0, 128
    halign       = center
    valign       = center
    shadow_passes = 0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECONDARY — RAM STAT ROW
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Format: "󰍛  RAM   [██████░░░░░░░░░░]  31%  4.9/16.0 GiB"
# Reads from /proc/meminfo — MemTotal, MemAvailable.

label {
    monitor      = $HL_MON_SECONDARY
    text         = cmd[update:5000] bash -c 'total=$(awk "/MemTotal/{print \$2}" /proc/meminfo); avail=$(awk "/MemAvailable/{print \$2}" /proc/meminfo); used=$((total-avail)); pct=$((used*100/total)); filled=$((pct*16/100)); bar=$(printf "%.0s█" $(seq 1 $filled 2>/dev/null)); empty=$(printf "%.0s░" $(seq 1 $((16-filled)) 2>/dev/null)); printf "󰍛  RAM   [%s%s]  %d%%  %.1f/%.1f GiB" "$bar" "$empty" "$pct" "$(echo "$used" | awk "{printf \"%.1f\", \$1/1048576}")" "$(echo "$total" | awk "{printf \"%.1f\", \$1/1048576}")"'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 13
    color        = $HL_FG_SUBTLE
    position     = 0, 100
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.35)
    shadow_boost = 1.0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECONDARY — DISK STAT ROW
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Format: "󰋊  DISK  [████████░░░░░░░░]  58%  234/400 GiB"
# Monitors root filesystem (/).

label {
    monitor      = $HL_MON_SECONDARY
    text         = cmd[update:30000] bash -c 'read -r size used avail pct mp < <(df -BG / | tail -1 | awk "{print \$2,\$3,\$4,\$5,\$6}"); p=${pct//%/}; filled=$((p*16/100)); bar=$(printf "%.0s█" $(seq 1 $filled 2>/dev/null)); empty=$(printf "%.0s░" $(seq 1 $((16-filled)) 2>/dev/null)); printf "󰋊  DISK  [%s%s]  %s  %s/%s" "$bar" "$empty" "$pct" "$used" "$size"'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 13
    color        = $HL_FG_SUBTLE
    position     = 0, 54
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.35)
    shadow_boost = 1.0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECONDARY — NETWORK THROUGHPUT ROW
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Format: "󰊗  NET   ↑ 2.1 MB/s   ↓ 8.4 MB/s   via eth0"
# Calculates instantaneous throughput from /proc/net/dev diffs.
# Delta stored in /tmp to compute rate between readings.

label {
    monitor      = $HL_MON_SECONDARY
    text         = cmd[update:3000] bash -c 'iface=$(ip route get 1.1.1.1 2>/dev/null | awk "{print \$5}" | head -1); [[ -z "$iface" ]] && echo "󰊗  NET   no route" && exit; rx=$(cat /sys/class/net/$iface/statistics/rx_bytes 2>/dev/null || echo 0); tx=$(cat /sys/class/net/$iface/statistics/tx_bytes 2>/dev/null || echo 0); cache=/tmp/ash-lock-net-$iface; if [[ -f "$cache" ]]; then read prx ptx pt < "$cache"; dt=$(echo "$(date +%s%N) $pt" | awk "{printf \"%.3f\", (\$1-\$2)/1e9}"); rxr=$(echo "$rx $prx $dt" | awk "{printf \"%.1f\", (\$1-\$2)/\$3/1048576}"); txr=$(echo "$tx $ptx $dt" | awk "{printf \"%.1f\", (\$1-\$2)/\$3/1048576}"); echo "󰊗  NET   ↑ ${txr} MB/s   ↓ ${rxr} MB/s   $iface"; fi; echo "$(date +%s%N) $rx $tx" > "$cache"'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 13
    color        = $HL_FG_SUBTLE
    position     = 0, 8
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.35)
    shadow_boost = 1.0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECONDARY — GPU STAT ROW
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Supports NVIDIA (nvidia-smi) and AMD (radeontop / sysfs).
# Falls back gracefully to Intel integrated if discrete unavailable.

label {
    monitor      = $HL_MON_SECONDARY
    text         = cmd[update:3000] bash -c 'if command -v nvidia-smi &>/dev/null; then read util temp vram < <(nvidia-smi --query-gpu=utilization.gpu,temperature.gpu,memory.used --format=csv,noheader,nounits | head -1 | tr "," " "); filled=$((util*16/100)); bar=$(printf "%.0s█" $(seq 1 $filled 2>/dev/null)); empty=$(printf "%.0s░" $(seq 1 $((16-filled)) 2>/dev/null)); printf "󰖺  GPU   [%s%s]  %s%%  %s°C  %sMiB" "$bar" "$empty" "$util" "$temp" "$vram"; elif [[ -f /sys/class/drm/card0/device/gpu_busy_percent ]]; then util=$(cat /sys/class/drm/card0/device/gpu_busy_percent); filled=$((util*16/100)); bar=$(printf "%.0s█" $(seq 1 $filled 2>/dev/null)); empty=$(printf "%.0s░" $(seq 1 $((16-filled)) 2>/dev/null)); printf "󰘙  GPU   [%s%s]  %s%%  (AMD)" "$bar" "$empty" "$util"; else echo "󰘙  GPU   no data"; fi'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 13
    color        = $HL_FG_SUBTLE
    position     = 0, -38
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.35)
    shadow_boost = 1.0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECONDARY — MID DIVIDER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

label {
    monitor      = $HL_MON_SECONDARY
    text         = ─────────────────────────────────
    font_family  = JetBrainsMono Nerd Font
    font_size    = 9
    color        = $HL_SEPARATOR
    position     = 0, -74
    halign       = center
    valign       = center
    shadow_passes = 0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECONDARY — SERVICES STATUS PANEL
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Docker Running Containers ─────────────────────────────────────────────────
label {
    monitor      = $HL_MON_SECONDARY
    text         = cmd[update:10000] bash -c 'if command -v docker &>/dev/null; then c=$(docker ps -q 2>/dev/null | wc -l); t=$(docker ps -aq 2>/dev/null | wc -l); echo "󰡨  Docker   $c running  /  $t total"; else echo "󰡨  Docker   not running"; fi'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 12
    color        = $HL_FG_SUBTLE
    position     = 0, -100
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.30)
    shadow_boost = 1.0
    rotate       = 0
}

# ── Kubernetes Context ────────────────────────────────────────────────────────
label {
    monitor      = $HL_MON_SECONDARY
    text         = cmd[update:30000] bash -c 'if command -v kubectl &>/dev/null; then ctx=$(kubectl config current-context 2>/dev/null | cut -c1-22); ns=$(kubectl config view --minify --output "jsonpath={..namespace}" 2>/dev/null); echo "󱃾  K8s      ${ctx:-none}  ::  ${ns:-default}"; else echo "󱃾  K8s      not configured"; fi'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 12
    color        = $HL_FG_SUBTLE
    position     = 0, -122
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.30)
    shadow_boost = 1.0
    rotate       = 0
}

# ── Failed Systemd Units ──────────────────────────────────────────────────────
# Highlights any failed systemd user services — immediate visibility at lock.
# Green "All services OK" when healthy, red count when units are failed.

label {
    monitor      = $HL_MON_SECONDARY
    text         = cmd[update:30000] bash -c 'failed=$(systemctl --user list-units --state=failed --no-legend 2>/dev/null | wc -l); if [[ "$failed" -eq 0 ]]; then echo "󰄬  Services  All OK"; else echo "<span foreground=\"##f38ba8\">󰅙  Services  $failed failed</span>"; fi'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 12
    color        = $HL_FG_SUBTLE
    position     = 0, -144
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.30)
    shadow_boost = 1.0
    rotate       = 0
}

# ── Pending System Updates ────────────────────────────────────────────────────
# Reads from ash update-check cache (written by ash-update-check.timer).
# Shows package count without triggering live network check on lock.

label {
    monitor      = $HL_MON_SECONDARY
    text         = cmd[update:300000] bash -c 'cache="$HOME/.cache/ash/state/pending-updates.txt"; if [[ -f "$cache" ]]; then n=$(wc -l < "$cache"); [[ "$n" -gt 0 ]] && echo "󰚰  Updates  $n available" || echo "󰄬  Updates  System current"; else echo "󰚰  Updates  checking…"; fi'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 12
    color        = $HL_FG_SUBTLE
    position     = 0, -166
    halign       = center
    valign       = center
    shadow_passes = 1
    shadow_size  = 2
    shadow_color = rgba(0,0,0,0.30)
    shadow_boost = 1.0
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECONDARY — WEATHER + TOP STATUS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

label {
    monitor      = $HL_MON_SECONDARY
    text         = cmd[update:1800000] $HOME/.config/hyprlock/scripts/weather-lock.sh
    font_family  = JetBrainsMono Nerd Font
    font_size    = 13
    color        = $HL_FG_SUBTLE
    position     = -30, -36
    halign       = right
    valign       = top
    shadow_passes = 2
    shadow_size  = 3
    shadow_color = rgba(0,0,0,0.40)
    shadow_boost = 1.1
    rotate       = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECONDARY — FOOTER: LOCK INSTRUCTION HINT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Reminds user which monitor has the password field — prevents typing on wrong screen.

label {
    monitor      = $HL_MON_SECONDARY
    text         = 󰌑  Enter password on primary display
    font_family  = Noto Sans
    font_size    = 11
    color        = $HL_FG_DISABLED
    position     = 0, 36
    halign       = center
    valign       = bottom
    shadow_passes = 0
    rotate       = 0
}

