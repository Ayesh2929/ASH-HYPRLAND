# ║  ASH DOTFILES v5.0 OMEGA — HYPRLOCK WIDGET: WEATHER                        ║
# ║  Live atmospheric data with 6 display variants & graceful degradation      ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  WIDGET ARCHITECTURE                                                         │
# │                                                                              │
# │  DATA PIPELINE:                                                              │
# │    1. ash-weather-fetch.timer fires every 30 minutes (systemd)              │
# │    2. scripts/notification/weather.sh → fetches wttr.in JSON API           │
# │    3. Parsed data written to ~/.cache/ash/weather/current.json              │
# │    4. This widget reads the cache file — ZERO network calls on lock         │
# │                                                                              │
# │  CACHE STRUCTURE (~/.cache/ash/weather/current.json):                       │
# │  {                                                                           │
# │    "temp_c": 22,        "temp_f": 71,                                       │
# │    "feels_c": 19,       "feels_f": 66,                                      │
# │    "humidity": 65,      "wind_kph": 14,                                     │
# │    "condition": "Partly cloudy",                                            │
# │    "code": 1003,        "is_day": 1,                                        │
# │    "city": "London",    "country": "UK",                                    │
# │    "uv_index": 4,       "visibility_km": 10,                                │
# │    "pressure_mb": 1013, "precipitation_mm": 0.0,                           │
# │    "sunrise": "07:24",  "sunset": "16:48",                                 │
# │    "fetched_at": "2025-01-15T14:30:00Z"                                    │
# │  }                                                                           │
# │                                                                              │
# │  WEATHER CONDITION → NERD FONT ICON MAPPING:                                │
# │    Sunny/Clear     → 󰖙 (day) / 󰖔 (night)                                   │
# │    Partly Cloudy   → 󰖕 (day) / 󰖔 (night)                                   │
# │    Cloudy/Overcast → 󰖐                                                      │
# │    Mist/Fog        → 󰖑                                                      │
# │    Drizzle         → 󰖗                                                      │
# │    Rain            → 󰖖                                                      │
# │    Heavy Rain      → 󰖖                                                      │
# │    Thunderstorm    → 󰖓                                                      │
# │    Snow            → 󰖘                                                      │
# │    Blizzard        → 󰖒                                                      │
# │    Sleet           → 󰖘                                                      │
# │    Hail            → 󰖙                                                      │
# │    Wind            → 󰖤                                                      │
# │    Unknown         → 󰖐                                                      │
# │                                                                              │
# │  GRACEFUL DEGRADATION:                                                       │
# │    • Cache missing    → "─  Weather unavailable"                            │
# │    • Cache stale >2h  → "󰖑  Data may be outdated"                          │
# │    • No city set      → uses IP geolocation from wttr.in                   │
# │    • API unreachable  → last known good data persisted                      │
# │                                                                              │
# │  UNIT CONFIGURATION:                                                         │
# │    ash config set weather.units metric    # Celsius, km/h, km              │
# │    ash config set weather.units imperial  # Fahrenheit, mph, miles          │
# │    $HL_WEATHER_UNITS variable in colors.conf drives unit selection          │
# └─────────────────────────────────────────────────────────────────────────────┘

# ════════════════════════════════════════════════════════════════════════════════
# ▓▓▓▓▓▓▓▓▓▓▓▓▓▓  VARIANT 1: FULL-ROW (Default — icon + all data)  ▓▓▓▓▓▓▓▓▓▓
# ════════════════════════════════════════════════════════════════════════════════
# Comprehensive weather row with all key meteorological data on two lines.
# Line 1: condition icon + temperature + feels-like + condition text
# Line 2: humidity + wind + UV index + visibility
# Used in: default.conf (top-right), dual-monitor.conf (secondary top-right)
#
# Script: weather-lock.sh reads ~/.cache/ash/weather/current.json
# Falls back to plain "─" if cache absent or JSON malformed.

# ── Weather Line 1: Primary conditions ───────────────────────────────────────
label {
    monitor      =
    # Output: "󰖕  22°C  Feels 19°C  Partly cloudy"
    # Unit selection: metric (°C/km/h) vs imperial (°F/mph) via $HL_WEATHER_UNITS
    # Icon mapped from WMO weather code stored in cache
    text         = cmd[update:1800000] $HOME/.config/hyprlock/scripts/weather-lock.sh --line1
    font_family  = JetBrainsMono Nerd Font
    font_size    = 14
    color        = $HL_FG_SUBTLE
    position     = -40, -36
    halign       = right
    valign       = top
    shadow_passes    = 2
    shadow_size      = 3
    shadow_color     = rgba(0,0,0,0.45)
    shadow_boost     = 1.1
    rotate           = 0
}

# ── Weather Line 2: Secondary atmospheric data ────────────────────────────────
label {
    monitor      =
    # Output: "💧 65%  💨 14 km/h  ☀ UV4  👁 10km"
    # Compact icon + value format for maximum info density at small size
    text         = cmd[update:1800000] $HOME/.config/hyprlock/scripts/weather-lock.sh --line2
    font_family  = JetBrainsMono Nerd Font
    font_size    = 11
    color        = $HL_FG_MUTED
    position     = -40, -56
    halign       = right
    valign       = top
    shadow_passes    = 1
    shadow_size      = 2
    shadow_color     = rgba(0,0,0,0.35)
    shadow_boost     = 1.0
    rotate           = 0
}

# ── Weather: Location Label ───────────────────────────────────────────────────
# City name displayed below weather data — context for multi-location users.
# Reads from cache JSON "city" + "country" fields.
# Hidden (empty) if location not configured or geolocation unavailable.

label {
    monitor      =
    text         = cmd[update:3600000] $HOME/.config/hyprlock/scripts/weather-lock.sh --location
    font_family  = JetBrainsMono Nerd Font
    font_size    = 10
    color        = $HL_FG_DISABLED
    position     = -40, -72
    halign       = right
    valign       = top
    shadow_passes    = 0
    rotate           = 0
}

