# ════════════════════════════════════════════════════════════════════════════════
# ▓▓▓▓▓▓▓▓▓▓▓▓  VARIANT 1: TIME-AWARE (Default — hour-band greetings)  ▓▓▓▓▓▓▓▓
# ════════════════════════════════════════════════════════════════════════════════
# Greeting changes based on hour of day — 5 distinct time bands:
#
#   05:00–08:59  "Good morning, {name}  🌅"     (dawn / early morning)
#   09:00–11:59  "Good morning, {name}  ☀️"      (mid-morning)
#   12:00–13:59  "Good afternoon, {name}  🌤️"    (midday)
#   14:00–17:59  "Good afternoon, {name}  ☀️"    (afternoon)
#   18:00–21:59  "Good evening, {name}  🌆"      (evening)
#   22:00–23:59  "Good night, {name}  🌙"        (late night)
#   00:00–04:59  "Working late, {name}?  🦉"     (owl hours)
#
# Two-label system: main greeting + secondary sub-line.
# Sub-line provides contextual flavor without crowding main greeting.
# Both update every hour (time band boundaries are hour-based).

# ── Primary Greeting Line ─────────────────────────────────────────────────────
label {
    monitor      =
    text         = cmd[update:3600000] $HOME/.config/hyprlock/scripts/greeting.sh --time-aware
    font_family  = Noto Sans
    font_size    = 18
    color        = $HL_FG_SECONDARY
    position     = 0, 20
    halign       = center
    valign       = center
    shadow_passes    = 2
    shadow_size      = 4
    shadow_color     = rgba(0,0,0,0.40)
    shadow_boost     = 1.1
    rotate           = 0
}

# ── Secondary Context Sub-line ────────────────────────────────────────────────
# Pairs a soft contextual message with the main greeting:
#   Morning:   "Rise and shine ✨"
#   Afternoon: "Hope your day is going well"
#   Evening:   "Time to wind down 🌿"
#   Night:     "Sweet dreams await 💤"
#   Owl hours: "The world is quiet now 🌌"
# Updates every hour — same band logic as primary line.

label {
    monitor      =
    text         = cmd[update:3600000] $HOME/.config/hyprlock/scripts/greeting.sh --sub
    font_family  = Noto Sans Light
    font_size    = 13
    color        = $HL_FG_SUBTLE
    position     = 0, -4
    halign       = center
    valign       = center
    shadow_passes    = 1
    shadow_size      = 2
    shadow_color     = rgba(0,0,0,0.30)
    shadow_boost     = 1.0
    rotate           = 0
}

