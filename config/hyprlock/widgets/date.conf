# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  WIDGET ARCHITECTURE                                                         │
# │                                                                              │
# │  AVAILABLE VARIANTS:                                                         │
# │  ┌──────────────────────┬───────────────────────────────────────────────┐  │
# │  │ VARIANT              │ OUTPUT EXAMPLE                                │  │
# │  ├──────────────────────┼───────────────────────────────────────────────┤  │
# │  │ full-stack           │ Wednesday  /  15 January  /  Week 03  / UTC  │  │
# │  │ compact-inline       │ 󰃭  Wednesday, January 15  •  Week 03          │  │
# │  │ calendar-mini        │ Unicode calendar art with day highlighted     │  │
# │  │ iso-strict           │ 2025-01-15  W03  Wed  UTC+0                  │  │
# │  │ relative             │ 12 days until February  •  Day 15 of 365     │  │
# │  │ cultural             │ Lunar date + zodiac + season                  │  │
# │  │ minimal-strip        │ Wed 15                                        │  │
# │  └──────────────────────┴───────────────────────────────────────────────┘  │
# │                                                                              │
# │  POSITIONING CONTEXT:                                                        │
# │  Date widget typically sits directly below the clock widget.                 │
# │  Default y-offset assumes clock bottom at ~y=130 (center-relative).         │
# │  All positions use halign=center for horizontal auto-centering.             │
# │                                                                              │
# │  UPDATE INTERVALS:                                                           │
# │  • Date-only labels: 60000ms (1 min) — date never changes mid-second       │
# │  • Week number: 3600000ms (1 hour) — changes at midnight Monday            │
# │  • Timezone offset: 3600000ms (1 hour) — changes at DST boundaries         │
# │  • Lunar/cultural: 86400000ms (24 hours) — daily astronomical data         │
# └─────────────────────────────────────────────────────────────────────────────┘

# ════════════════════════════════════════════════════════════════════════════════
# ▓▓▓▓▓▓▓▓▓▓▓▓  VARIANT 1: FULL-STACK (Default — 4-row hierarchy)  ▓▓▓▓▓▓▓▓▓▓
# ════════════════════════════════════════════════════════════════════════════════
# Four distinct rows with descending visual weight — creates a structured
# "information cascade" below the clock:
#
#   Row 1: Weekday name (largest — primary temporal anchor)
#   Row 2: Day + Month (secondary — specific date identification)
#   Row 3: ISO week + timezone (tertiary — context for planners)
#   Row 4: Greeting (quaternary — human touch, time-of-day aware)
#
# Each row uses a smaller font and more muted color than the row above.
# The four-tier system mirrors print typographic hierarchy conventions.

# ── Row 1: Full Weekday Name ──────────────────────────────────────────────────
# Nerd Font calendar icon (󰃭) prefix adds visual anchor without text overhead.
# Format: "󰃭  Wednesday"
# Noto Sans chosen over JetBrainsMono — proportional spacing feels warmer
# for natural language content vs monospace (better for time/code).

label {
    monitor      =
    text         = cmd[update:60000] echo "󰃭  $(date +'%A')"
    font_family  = Noto Sans Bold
    font_size    = 26
    color        = $HL_FG_SECONDARY
    position     = 0, 90
    halign       = center
    valign       = center
    shadow_passes    = 2
    shadow_size      = 5
    shadow_color     = rgba(0,0,0,0.45)
    shadow_boost     = 1.1
    rotate           = 0
}

# ── Row 2: Day + Month (long-form) ────────────────────────────────────────────
# "%-d" strips leading zero: "5 January" not "05 January".
# Month name localized to system locale automatically by date command.
# Slightly smaller than weekday — secondary in the hierarchy.

label {
    monitor      =
    text         = cmd[update:60000] date +'%-d %B'
    font_family  = Noto Sans
    font_size    = 20
    color        = $HL_FG_SECONDARY
    position     = 0, 60
    halign       = center
    valign       = center
    shadow_passes    = 2
    shadow_size      = 4
    shadow_color     = rgba(0,0,0,0.40)
    shadow_boost     = 1.0
    rotate           = 0
}

# ── Row 3: ISO Week + Year + Timezone ─────────────────────────────────────────
# ISO 8601 week number (W01–W53) with 4-digit year for unambiguous dating.
# Bullet separator (•) provides visual breathing room between segments.
# Timezone abbreviation (UTC, EST, JST etc.) always important for multi-TZ users.
# Year included because lock screens may persist across midnight Jan 1.

label {
    monitor      =
    text         = cmd[update:3600000] echo "W$(date +'%V')  •  $(date +'%Y')  •  $(date +'%Z')"
    font_family  = JetBrainsMono Nerd Font
    font_size    = 12
    color        = $HL_FG_MUTED
    position     = 0, 34
    halign       = center
    valign       = center
    shadow_passes    = 1
    shadow_size      = 2
    shadow_color     = rgba(0,0,0,0.30)
    shadow_boost     = 1.0
    rotate           = 0
}

# ── Row 4: Greeting ───────────────────────────────────────────────────────────
# Time-aware greeting from greeting.sh.
# Quaternary row uses FG_SUBTLE — present but not demanding attention.
# Updates every hour (greeting band changes at 05, 12, 18, 22).

label {
    monitor      =
    text         = cmd[update:3600000] $HOME/.config/hyprlock/scripts/greeting.sh
    font_family  = Noto Sans Light
    font_size    = 16
    color        = $HL_FG_SUBTLE
    position     = 0, 10
    halign       = center
    valign       = center
    shadow_passes    = 1
    shadow_size      = 3
    shadow_color     = rgba(0,0,0,0.35)
    shadow_boost     = 1.0
    rotate           = 0
}

