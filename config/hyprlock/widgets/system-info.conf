# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — HYPRLOCK WIDGET: SYSTEM-INFO                    ║
# ║  Real-time system telemetry — CPU, RAM, disk, GPU, network, services       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  WIDGET ARCHITECTURE                                                         │
# │                                                                              │
# │  VARIANT SYSTEM — 7 display modes:                                          │
# │  ┌─────────────────────┬──────────────────────────────────────────────────┐ │
# │  │ VARIANT             │ CONTENT                                          │ │
# │  ├─────────────────────┼──────────────────────────────────────────────────┤ │
# │  │ hostname-strip      │ 󰌢 hostname  •  uptime  •  kernel                │ │
# │  │ full-dashboard      │ CPU + RAM + DISK + NET + GPU rows               │ │
# │  │ minimal-footer      │ hostname + uptime only (bottom-left corner)     │ │
# │  │ resource-bars       │ Visual bar charts for CPU/RAM/DISK               │ │
# │  │ load-monitor        │ 1/5/15 min load averages + process count        │ │
# │  │ network-detail      │ IP + interfaces + throughput + VPN status       │ │
# │  │ theme-info          │ Active theme + mode + profile + ash version     │ │
# │  └─────────────────────┴──────────────────────────────────────────────────┘ │
# │                                                                              │
# │  PERFORMANCE BUDGET:                                                         │
# │  All system-info scripts designed for <5ms execution time.                  │
# │  Read from /proc and /sys directly — no external tool subprocess unless     │
# │  the tool is specifically required (nvidia-smi, sensors, etc.).             │
# │  Update intervals chosen to match rate-of-change of each metric:           │
# │    CPU:     3000ms  — changes fast, needs frequent update                  │
# │    RAM:     5000ms  — changes moderately                                   │
# │    Disk:    30000ms — changes slowly (writes accumulate over time)         │
# │    Network: 3000ms  — throughput is real-time                              │
# │    GPU:     3000ms  — changes fast during load                             │
# │    Uptime:  60000ms — changes every second but display rounds to minutes   │
# │    Kernel:  0ms     — static, read once on lock                           │
# └─────────────────────────────────────────────────────────────────────────────┘

# ════════════════════════════════════════════════════════════════════════════════
# ▓▓▓▓▓▓▓▓▓▓▓▓▓  VARIANT 1: HOSTNAME-STRIP (Default — footer identity)  ▓▓▓▓▓▓▓
# ════════════════════════════════════════════════════════════════════════════════
# Compact single-line system identity for bottom-left footer position.
# Two rows: hostname+uptime on line 1, kernel+distro on line 2.
# Provides just enough context without dominating the layout.
# Format:
#   "󰌢  archbox  •  up 4d 3h 22m"
#   "  6.12.1-arch1  •  Arch Linux"

# ── Footer Line 1: Hostname + Uptime ─────────────────────────────────────────
# $HOSTNAME expanded directly by hyprlock — no subprocess for hostname.
# uptime -p gives human-readable: "up 4 days, 3 hours, 22 minutes"
# sed strips "up " prefix for cleaner display.

label {
    monitor      =
    text         = cmd[update:60000] echo "󰌢  $HOSTNAME  •  $(uptime -p | sed 's/up //')"
    font_family  = JetBrainsMono Nerd Font
    font_size    = 10
    color        = $HL_FG_MUTED
    position     = 36, 36
    halign       = left
    valign       = bottom
    shadow_passes    = 1
    shadow_size      = 2
    shadow_color     = rgba(0,0,0,0.25)
    shadow_boost     = 1.0
    rotate           = 0
}

# ── Footer Line 2: Kernel + Distro ────────────────────────────────────────────
# Kernel: uname -r gives "6.12.1-arch1-1" — trimmed for display.
# Distro: /etc/os-release ID_LIKE or NAME field.
# Static data — updates once on lock (0ms interval).

label {
    monitor      =
    text         = cmd[update:0] bash -c '
        kernel=$(uname -r | cut -d- -f1-2);
        distro=$(grep "^NAME=" /etc/os-release 2>/dev/null | cut -d= -f2 | tr -d "\"");
        echo "  ${kernel}  •  ${distro:-Linux}"'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 10
    color        = $HL_FG_DISABLED
    position     = 36, 22
    halign       = left
    valign       = bottom
    shadow_passes    = 0
    rotate           = 0
}

