# ║  ASH DOTFILES v5.0 OMEGA — HYPRLOCK WIDGET: BATTERY                        ║
# ║  Intelligent power awareness — desktop-safe, threshold-reactive, rich UX   ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  WIDGET ARCHITECTURE                                                         │
# │                                                                              │
# │  HARDWARE DETECTION:                                                         │
# │    Script auto-detects battery presence via /sys/class/power_supply/.       │
# │    Returns empty string on desktop/AC-only systems → widget invisible.      │
# │    Detects: laptop batteries (BAT0, BAT1, BATT), UPS, USB-C PD sources.   │
# │    Multi-battery support: shows aggregate % if BAT0 + BAT1 present.        │
# │                                                                              │
# │  STATE MACHINE:                                                              │
# │    CHARGING    → 󰂄 icon + bolt overlay + "Charging X%"                    │
# │    DISCHARGING → tiered icon (see below) + "X%  Yh Zm remaining"           │
# │    FULL        → 󰁹 icon + "Full" (AC connected, 100%)                     │
# │    UNKNOWN     → 󰂑 icon + "Status unknown"                                │
# │    NOT_PRESENT → "" (empty string — widget hidden entirely)                │
# │                                                                              │
# │  ICON TIER SYSTEM (Nerd Font battery icons):                                │
# │    100%         → 󰁹  Full                                                  │
# │    80–99%       → 󰂂  High                                                  │
# │    60–79%       → 󰂀  Medium-High                                           │
# │    40–59%       → 󰁾  Medium                                                │
# │    20–39%       → 󰁼  Low                                                   │
# │    10–19%       → 󰂃  Very Low (color shifts to $HL_WARN)                  │
# │    0–9%         → 󰁺  Critical (color shifts to $HL_ERROR, pulse effect)   │
# │                                                                              │
# │  CHARGING OVERLAYS:                                                          │
# │    󰂄  Charging (0–79%)                                                     │
# │    󰂅  Charging (80–99%)                                                    │
# │    󰂆  Fully charged (100% + AC)                                            │
# │                                                                              │
# │  TIME REMAINING:                                                             │
# │    Reads from upower (preferred) → /sys/class/power_supply/BAT0/time_to*   │
# │    Falls back to percentage-rate calculation if upower unavailable.         │
# │    Not shown when charging (time varies during charge curve).               │
# │                                                                              │
# │  COLOR BEHAVIOR:                                                             │
# │    ≥20%  → $HL_FG_SUBTLE  (normal state, low visual weight)                │
# │    10–19% → $HL_WARN      (yellow caution — time to find power)            │
# │    <10%  → $HL_ERROR      (red critical — charge immediately)              │
# │    Charging → $HL_SUCCESS (green — positive reinforcement)                  │
# │                                                                              │
# │  SCRIPTS:                                                                    │
# │    battery-status.sh           → full status line                          │
# │    battery-status.sh --short   → "94%" only (for ticker)                   │
# │    battery-status.sh --icon    → icon glyph only                           │
# │    battery-status.sh --pct     → bare integer (for progress bar)           │
# │    battery-status.sh --bar     → unicode block fill bar                     │
# │    battery-status.sh --ampm    → AM/PM for clock widget (dual-use)         │
# └─────────────────────────────────────────────────────────────────────────────┘

# ════════════════════════════════════════════════════════════════════════════════
# ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓  VARIANT 1: STATUS-LINE (Default — full info)  ▓▓▓▓▓▓▓▓▓▓▓▓
# ════════════════════════════════════════════════════════════════════════════════
# Complete battery status on one line — the standard layout widget.
# Output examples:
#   Discharging: "󰁾  58%  2h 34m remaining"
#   Charging:    "󰂄  67%  Charging"
#   Full:        "󰂆  Full  (AC)"
#   Desktop:     "" (empty — widget renders nothing, takes no space)
#
# Color is dynamically applied by the script using Pango markup:
#   Normal:   default $HL_FG_SUBTLE
#   Warning:  <span foreground="##f9e2af"> wraps the output
#   Critical: <span foreground="##f38ba8"> wraps the output
#   Charging: <span foreground="##a6e3a1"> wraps the output
#
# Update interval: 60000ms (1 minute).
# Battery % changes ≤1%/min under normal load — more frequent is wasteful.
# Exception: critical threshold (≤5%) → 15000ms for rapid-change scenarios.

label {
    monitor      =
    text         = cmd[update:60000] $HOME/.config/hyprlock/scripts/battery-status.sh
    font_family  = JetBrainsMono Nerd Font
    font_size    = 13
    color        = $HL_FG_SUBTLE
    position     = 40, -36
    halign       = left
    valign       = top
    shadow_passes    = 2
    shadow_size      = 3
    shadow_color     = rgba(0,0,0,0.45)
    shadow_boost     = 1.1
    rotate           = 0
}

# ── Battery: Progress Bar ─────────────────────────────────────────────────────
# 16-char unicode block fill bar below the status line.
# Empty on desktop (script returns "").
# Bar fill: percentage-proportional block fill.
# Color transitions match icon tier color logic.
# Compact format: "[████████░░░░░░░░]"

label {
    monitor      =
    text         = cmd[update:60000] $HOME/.config/hyprlock/scripts/battery-status.sh --bar
    font_family  = JetBrainsMono Nerd Font
    font_size    = 10
    color        = $HL_FG_MUTED
    position     = 40, -56
    halign       = left
    valign       = top
    shadow_passes    = 0
    rotate           = 0
}

# ── Battery: Power Source Indicator ───────────────────────────────────────────
# Shows active power source: battery name, AC adapter, or UPS.
# Format: "via BAT0  •  LiPo  •  3000 mAh"
# Reads battery chemistry and design capacity from sysfs.
# Hidden when no battery present.

label {
    monitor      =
    text         = cmd[update:3600000] bash -c '
        bat_path=$(ls /sys/class/power_supply/ 2>/dev/null | grep -E "^BAT" | head -1);
        [[ -z "$bat_path" ]] && exit;
        tech=$(cat "/sys/class/power_supply/$bat_path/technology" 2>/dev/null || echo "Li-ion");
        cap=$(cat "/sys/class/power_supply/$bat_path/charge_full_design" 2>/dev/null || cat "/sys/class/power_supply/$bat_path/energy_full_design" 2>/dev/null || echo 0);
        cap_mah=$(( cap / 1000 ));
        echo "via $bat_path  •  $tech  •  ${cap_mah}mAh"'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 10
    color        = $HL_FG_DISABLED
    position     = 40, -72
    halign       = left
    valign       = top
    shadow_passes    = 0
    rotate           = 0
}

