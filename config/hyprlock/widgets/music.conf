# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — HYPRLOCK WIDGET: MUSIC                          ║
# ║  MPRIS-native now-playing system — album art, progress, rich metadata      ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  WIDGET ARCHITECTURE                                                         │
# │                                                                              │
# │  DATA PIPELINE:                                                              │
# │    playerctl (MPRIS2) → songdetail.sh → hyprlock label                     │
# │                                                                              │
# │  SUPPORTED PLAYERS (MPRIS2 compatible):                                     │
# │    󰓇 Spotify          󰖟 Firefox        󰊯 Chromium                          │
# │    󰍚 MPD/ncmpcpp      󰕼 VLC            󰑈 Rhythmbox                         │
# │    󰌳 Cantata          󰋊 Clementine     󱍸 Tidal                             │
# │    󰨾 YouTube Music    󰓀 Strawberry     Any MPRIS2 player                   │
# │                                                                              │
# │  GRACEFUL STATES:                                                            │
# │    PLAYING    → full metadata display                                        │
# │    PAUSED     → dimmed display with ⏸ indicator                             │
# │    STOPPED    → empty string (widget invisible)                              │
# │    NO PLAYER  → empty string (widget invisible)                              │
# │                                                                              │
# │  ALBUM ART PIPELINE:                                                         │
# │    1. playerctl metadata mpris:artUrl → URL or file:// path                 │
# │    2. songdetail.sh --art downloads/copies to ~/.cache/hyprlock/album-art/  │
# │    3. Image widget reads cached file                                         │
# │    4. Fallback: ~/.config/ash/assets/music-fallback.png                    │
# │                                                                              │
# │  PROGRESS CALCULATION:                                                       │
# │    position  = playerctl position (seconds, float)                          │
# │    duration  = playerctl metadata mpris:length (microseconds → seconds)     │
# │    progress% = (position / duration) * 100                                  │
# │    bar_fill  = round(progress% * bar_width / 100)                          │
# │                                                                              │
# │  SCRIPT FLAGS:                                                               │
# │    songdetail.sh              → "󰎆  Artist — Title  [via Player]"          │
# │    songdetail.sh --title      → Track title only (truncated 32 chars)       │
# │    songdetail.sh --artist     → Artist name only                            │
# │    songdetail.sh --album      → Album name only                             │
# │    songdetail.sh --player     → Player name + icon                         │
# │    songdetail.sh --progress   → Unicode bar "████░░░░  2:34 / 4:12"       │
# │    songdetail.sh --pct        → Integer percentage "62"                    │
# │    songdetail.sh --time       → "2:34 / 4:12"                             │
# │    songdetail.sh --art        → Outputs art cache path (side effect: dl)  │
# │    songdetail.sh --status     → "playing" / "paused" / "stopped"          │
# │    songdetail.sh --compact    → "Artist — Title  ████░  2:34"            │
# │    songdetail.sh --paused     → Full line only when paused                 │
# └─────────────────────────────────────────────────────────────────────────────┘

# ════════════════════════════════════════════════════════════════════════════════
# ▓▓▓▓▓▓▓▓▓▓▓▓▓  VARIANT 1: FULL-STACK (Default — album art + all metadata)  ▓▓
# ════════════════════════════════════════════════════════════════════════════════
# Premium now-playing experience with 5 stacked elements:
#   [1] Album art (image widget, circular crop, accent border)
#   [2] Track title (bold, primary color, truncated at 36 chars)
#   [3] Artist + Album (secondary, dimmer)
#   [4] Player source badge ("via Spotify", "via MPD")
#   [5] Progress bar + timestamp
#
# All elements return empty/hidden when nothing is playing.
# Album art updates on track change (3s polling via songdetail.sh --art).
# Positioned in bottom-center area, above input field.
#
# LAYOUT (center-relative, negative y = below center):
#   Art image  → y=-148  (top of music block)
#   Title      → y=-210  (below art)
#   Artist     → y=-232  (below title)
#   Player     → y=-252  (below artist)
#   Progress   → y=-270  (bottom of music block)

# ── [1] Album Art Image ───────────────────────────────────────────────────────
# Circular crop with 2px accent border — premium thumbnail presentation.
# Cache path resolved by songdetail.sh --art each update cycle.
# Fallback PNG prevents empty widget on load before first art download.
# size=72: large enough for visual recognition, compact enough for layout.

image {
    monitor      =
    # songdetail.sh --art writes art to cache and outputs the path.
    # hyprlock re-reads path on each update interval.
    # If output is empty, image widget renders nothing (graceful hide).
    path         = $HOME/.cache/hyprlock/album-art/current.png
    size         = 72
    rounding     = -1
    border_size  = 2
    border_color = $HL_ACCENT
    position     = 0, -148
    halign       = center
    valign       = center
    shadow_passes    = 3
    shadow_size      = 8
    shadow_color     = rgba(0,0,0,0.55)
    shadow_boost     = 1.3
    rotate           = 0
}

# ── [2] Track Title ───────────────────────────────────────────────────────────
# Primary text — most visible element in the music block.
# Pango markup: bold weight for song title prominence.
# Truncation: songdetail.sh --title limits to 36 chars + "…" if longer.
# Returns empty string when stopped → label invisible.

label {
    monitor      =
    text         = cmd[update:3000] $HOME/.config/hyprlock/scripts/songdetail.sh --title
    font_family  = Noto Sans Bold
    font_size    = 15
    color        = $HL_FG_SECONDARY
    position     = 0, -210
    halign       = center
    valign       = center
    shadow_passes    = 2
    shadow_size      = 3
    shadow_color     = rgba(0,0,0,0.45)
    shadow_boost     = 1.1
    rotate           = 0
}

# ── [3] Artist + Album ────────────────────────────────────────────────────────
# Secondary metadata on one line: "Artist  ·  Album"
# Truncated to 42 chars total — artist gets priority if long.
# Light weight reinforces hierarchy (title=bold, artist=regular).

label {
    monitor      =
    text         = cmd[update:3000] $HOME/.config/hyprlock/scripts/songdetail.sh --artist-album
    font_family  = Noto Sans Light
    font_size    = 13
    color        = $HL_FG_SUBTLE
    position     = 0, -232
    halign       = center
    valign       = center
    shadow_passes    = 1
    shadow_size      = 2
    shadow_color     = rgba(0,0,0,0.35)
    shadow_boost     = 1.0
    rotate           = 0
}

# ── [4] Player Source Badge ───────────────────────────────────────────────────
# Shows which player is active: "󰓇 via Spotify" / "󰍚 via mpd" / "󰖟 via Firefox"
# Player icon mapped from playerctl player name in songdetail.sh.
# Uses $HL_FG_MUTED — intentionally subtle, just source attribution.

label {
    monitor      =
    text         = cmd[update:5000] $HOME/.config/hyprlock/scripts/songdetail.sh --player
    font_family  = JetBrainsMono Nerd Font
    font_size    = 11
    color        = $HL_FG_MUTED
    position     = 0, -252
    halign       = center
    valign       = center
    shadow_passes    = 0
    rotate           = 0
}

# ── [5] Progress Bar + Timestamp ─────────────────────────────────────────────
# Unicode block-fill progress bar with current/total timestamps.
# Format: "────────────────────────────────────"
#         "██████████████░░░░░░░░  2:34 / 4:12"
# Bar width: 16 blocks (████ = filled, ░░░░ = empty)
# Updates every 3s — smooth enough for visual feedback, not wasteful.

label {
    monitor      =
    text         = cmd[update:3000] $HOME/.config/hyprlock/scripts/songdetail.sh --progress
    font_family  = JetBrainsMono Nerd Font
    font_size    = 11
    color        = $HL_ACCENT
    position     = 0, -272
    halign       = center
    valign       = center
    shadow_passes    = 1
    shadow_size      = 2
    shadow_color     = rgba(0,0,0,0.30)
    shadow_boost     = 1.0
    rotate           = 0
}

# ── Playback State Indicator ─────────────────────────────────────────────────
# Shows ⏸ PAUSED overlay when track is paused but player is active.
# Invisible when playing (returns ""). Hidden when stopped.
# Accent color for pause state — draws eye to status change.

label {
    monitor      =
    text         = cmd[update:2000] bash -c 'status=$(playerctl status 2>/dev/null | tr -d "\n"); [[ "$status" == "Paused" ]] && echo "⏸  Paused" || echo ""'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 12
    color        = $HL_FG_DISABLED
    position     = 0, -292
    halign       = center
    valign       = center
    shadow_passes    = 0
    rotate           = 0
}

