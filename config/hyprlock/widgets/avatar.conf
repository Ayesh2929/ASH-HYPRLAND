# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — HYPRLOCK WIDGET: AVATAR                         ║
# ║  Identity display system — image + username + session metadata             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  WIDGET ARCHITECTURE                                                         │
# │                                                                              │
# │  IMAGE FALLBACK CHAIN:                                                       │
# │    1. ~/.face                     (freedesktop standard location)           │
# │    2. ~/.face.icon                (alternative freedesktop path)            │
# │    3. ~/.config/ash/avatar.png    (ash-managed custom avatar)               │
# │    4. $XDG_DATA_HOME/icons/avatar (XDG data path)                          │
# │    5. /usr/share/pixmaps/$USER    (system avatar store)                     │
# │    6. Generated initials image    (script generates from username letters)  │
# │    → If all fail: image widget renders nothing (zero footprint)             │
# │                                                                              │
# │  AVATAR MANAGEMENT COMMANDS:                                                 │
# │    ash config set avatar <path>     Set avatar from file path               │
# │    ash config set avatar --url <u>  Download and set from URL               │
# │    ash config set avatar --camera   Capture from webcam                     │
# │    ash config set avatar --gravatar Generate from email gravatar            │
# │                                                                              │
# │  SHAPE VARIANTS:                                                             │
# │    circular   → rounding=-1  (hyprlock auto-calculates size/2)             │
# │    rounded    → rounding=16  (generous corner radius)                       │
# │    squircle   → rounding=8   (iOS-style squircle approximation)            │
# │    square     → rounding=0   (sharp corners — minimal/corporate aesthetic)  │
# │                                                                              │
# │  BORDER VARIANTS:                                                            │
# │    accent      → $HL_ACCENT (themed dynamic color)                          │
# │    glow        → accent + heavy shadow bloom                                │
# │    minimal     → 1px rgba(255,255,255,0.12) (barely visible)               │
# │    none        → border_size=0                                              │
# │    gradient    → requires pre-rendered border-PNG (generated by ash)       │
# └─────────────────────────────────────────────────────────────────────────────┘

# ════════════════════════════════════════════════════════════════════════════════
# ▓▓▓▓▓▓▓▓▓▓▓▓▓  VARIANT 1: CLASSIC-CIRCLE (Default — circular + accent)  ▓▓▓▓▓
# ════════════════════════════════════════════════════════════════════════════════
# The standard avatar presentation used across all default layouts.
# Three stacked elements:
#   [1] Circular avatar image with accent-colored border (82px)
#   [2] Username in bold primary color
#   [3] Session info: shell + DE version (subtle, muted)
#
# The accent border creates a visual ring that:
#   (a) Defines the boundary of the circular crop cleanly
#   (b) Ties the avatar to the current theme color
#   (c) Provides clear visual anchor for the auth section

# ── [1] Avatar Image ──────────────────────────────────────────────────────────
# Resolution order handled by fallback-avatar.sh which writes the best
# available source to ~/.cache/hyprlock/avatar-resolved.png on session start.
# Direct ~/.face path used here with fallback_path for resilience.

image {
    monitor      =
    path         = $HOME/.cache/hyprlock/avatar-resolved.png
    size         = 82
    rounding     = -1
    border_size  = 3
    border_color = $HL_ACCENT
    position     = 0, -52
    halign       = center
    valign       = center
    shadow_passes    = 3
    shadow_size      = 8
    shadow_color     = rgba(0,0,0,0.50)
    shadow_boost     = 1.3
    zoom             = 1.0
    rotate           = 0
}

# ── [2] Username ──────────────────────────────────────────────────────────────
# $USER injected directly by hyprlock — zero subprocess cost.
# Bold weight makes username clearly readable against any background.
# Positioned 50px below avatar center (82/2 + 9px gap = ~50px from image edge).

label {
    monitor      =
    text         = $USER
    font_family  = Noto Sans Bold
    font_size    = 16
    color        = $HL_FG_PRIMARY
    position     = 0, -100
    halign       = center
    valign       = center
    shadow_passes    = 2
    shadow_size      = 3
    shadow_color     = rgba(0,0,0,0.45)
    shadow_boost     = 1.1
    rotate           = 0
}

# ── [3] Session Metadata ──────────────────────────────────────────────────────
# Shows current login session context: shell + Hyprland version.
# "󰊠  fish  •  Hyprland 0.45.2"
# Reads Hyprland version from hyprctl version --json.
# Ultra-subtle (FG_DISABLED) — for power users who want session context.

label {
    monitor      =
    text         = cmd[update:0] bash -c '
        shell=$(basename "$SHELL");
        hypr_ver=$(hyprctl version -j 2>/dev/null | grep -oP "\"version\":\s*\"\K[^\"]+");
        echo "󰊠  $shell  •  Hyprland ${hypr_ver:-?}"'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 10
    color        = $HL_FG_DISABLED
    position     = 0, -118
    halign       = center
    valign       = center
    shadow_passes    = 0
    rotate           = 0
}

