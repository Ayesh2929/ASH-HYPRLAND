# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  WIDGET ARCHITECTURE                                                         │
# │                                                                              │
# │  This file defines the CLOCK widget module for hyprlock.                    │
# │  It is sourced by layout files — never used as a standalone config.         │
# │                                                                              │
# │  VARIANT SYSTEM:                                                             │
# │  Only ONE variant block should be active at a time.                         │
# │  Select via: ash config set hyprlock.clock_variant <name>                   │
# │  The ash theme engine comments/uncomments the appropriate source = line      │
# │  in your active layout file when switching variants.                         │
# │                                                                              │
# │  AVAILABLE VARIANTS:                                                         │
# │  ┌─────────────────────┬────────────────────────────────────────────────┐  │
# │  │ VARIANT             │ DESCRIPTION                                    │  │
# │  ├─────────────────────┼────────────────────────────────────────────────┤  │
# │  │ split-hero          │ HH : MM at 96pt, seconds badge, neon glow      │  │
# │  │ split-thin          │ HH : MM at 112pt, Thin weight, editorial       │  │
# │  │ mono-compact        │ HH:MM:SS in one label, monospace ticker        │  │
# │  │ analog-unicode      │ Unicode clock face glyph + digital sub         │  │
# │  │ word-clock          │ "twenty two thirty four" spelled out           │  │
# │  │ binary-clock        │ Binary representation of H/M/S                 │  │
# │  │ fuzzy-time          │ "Half past ten", "Quarter to three"            │  │
# │  │ world-clock         │ 3-timezone simultaneous display                │  │
# │  └─────────────────────┴────────────────────────────────────────────────┘  │
# │                                                                              │
# │  COLOR VARIABLES (all from colors.conf):                                    │
# │    $HL_CLOCK_HRS_HEX   — hour digit color (Pango hex, no #)                │
# │    $HL_CLOCK_MIN_HEX   — minute digit color                                │
# │    $HL_CLOCK_SEC_HEX   — seconds color                                      │
# │    $HL_CLOCK_SEP_HEX   — separator colon color                             │
# │    $HL_CLOCK_FORMAT    — "12h" or "24h"                                    │
# │    $HL_FG_PRIMARY      — primary rgba() for direct color= use              │
# │    $HL_FG_MUTED        — muted rgba() for secondary elements               │
# │    $HL_ACCENT          — accent rgba() for highlights                      │
# └─────────────────────────────────────────────────────────────────────────────┘

# ════════════════════════════════════════════════════════════════════════════════
# ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓  VARIANT 1: SPLIT-HERO  ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓
# ════════════════════════════════════════════════════════════════════════════════
# The default flagship variant used in default.conf and dual-monitor.conf.
# Three-element split: Hours | Colon | Minutes at 96pt with 32pt seconds badge.
# Colon blinks: even seconds ON, odd seconds OFF — classic digital clock pulse.
# Accent shadow creates a subtle neon bloom behind digits in dark themes.
#
# Layout (center-relative coordinates):
#   Hours  → x=-96  y=182  (left of center)
#   Colon  → x=0    y=186  (center, slightly lower baseline optically)
#   Mins   → x=96   y=182  (right of center)
#   Secs   → x=198  y=152  (right of mins, raised for superscript feel)
#   AM/PM  → x=199  y=197  (below secs, only in 12h mode)

# ── Split-Hero: Hours ─────────────────────────────────────────────────────────
label {
    monitor      =
    # 12h mode: date +'%I' strips leading zero via %-I
    # 24h mode: date +'%H' always 2 digits (zero-padded)
    # Format detection via $HL_CLOCK_FORMAT variable from colors.conf
    text         = cmd[update:1000] bash -c '[[ "$HL_CLOCK_FORMAT" == "12h" ]] && date +"%-I" || date +"%H"'
    font_family  = JetBrainsMono Nerd Font Bold
    font_size    = 96
    color        = $HL_FG_PRIMARY
    position     = -96, 182
    halign       = center
    valign       = center
    # Layered shadow: depth shadow (black) + accent bloom (themed color)
    # Two shadow_passes renders one shadow — for dual shadows use two label
    # elements offset by 1px (advanced technique, commented here for reference)
    shadow_passes    = 3
    shadow_size      = 10
    shadow_color     = rgba(0,0,0,0.60)
    shadow_boost     = 1.2
    shadow_x_offset  = 0
    shadow_y_offset  = 3
    rotate           = 0
}

# ── Split-Hero: Blinking Colon ────────────────────────────────────────────────
# Blink algorithm: even second → ":" | odd second → " " (space, same width)
# Space used instead of empty string to prevent layout shift on blink.
# Monospace font ensures space = same advance width as colon glyph.

label {
    monitor      =
    text         = cmd[update:1000] bash -c '[[ $(($(date +%S) % 2)) -eq 0 ]] && echo ":" || echo " "'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 80
    color        = $HL_FG_MUTED
    position     = 0, 186
    halign       = center
    valign       = center
    shadow_passes    = 2
    shadow_size      = 6
    shadow_color     = rgba(0,0,0,0.50)
    shadow_boost     = 1.1
    rotate           = 0
}

# ── Split-Hero: Minutes ───────────────────────────────────────────────────────
label {
    monitor      =
    text         = cmd[update:1000] date +'%M'
    font_family  = JetBrainsMono Nerd Font Bold
    font_size    = 96
    color        = $HL_FG_PRIMARY
    position     = 96, 182
    halign       = center
    valign       = center
    shadow_passes    = 3
    shadow_size      = 10
    shadow_color     = rgba(0,0,0,0.60)
    shadow_boost     = 1.2
    shadow_x_offset  = 0
    shadow_y_offset  = 3
    rotate           = 0
}

# ── Split-Hero: Seconds Badge ─────────────────────────────────────────────────
# Raised superscript position — creates visual depth between elements.
# Uses $HL_FG_MUTED to be clearly subordinate to hours/minutes.
# Updates every second for constant visible animation (motion = alive feel).

label {
    monitor      =
    text         = cmd[update:1000] date +'%S'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 32
    color        = $HL_FG_MUTED
    position     = 198, 152
    halign       = center
    valign       = center
    shadow_passes    = 2
    shadow_size      = 4
    shadow_color     = rgba(0,0,0,0.40)
    shadow_boost     = 1.0
    rotate           = 0
}

# ── Split-Hero: AM/PM Badge ───────────────────────────────────────────────────
# Conditionally rendered: only outputs text in 12h mode.
# Returns empty string in 24h mode → label invisible (zero-width render).
# Positioned as a superscript above seconds for compact vertical stacking.

label {
    monitor      =
    text         = cmd[update:3600000] bash -c '[[ "$HL_CLOCK_FORMAT" == "12h" ]] && date +"%p" || echo ""'
    font_family  = JetBrainsMono Nerd Font
    font_size    = 12
    color        = $HL_FG_DISABLED
    position     = 199, 197
    halign       = center
    valign       = center
    shadow_passes    = 0
    rotate           = 0
}

