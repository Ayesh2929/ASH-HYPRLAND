# ─────────────────────────────────────────────────────────────────────────────
#
#  1. ASH color engine extracts palette from wallpaper or preset theme
#  2. Colors are written to this file via color-engine/templates/dunst.template
#  3. dunst reads @variable references defined here at runtime
#  4. Changing theme → ash apply → colors regenerated → dunst reloaded (< 50ms)
#
