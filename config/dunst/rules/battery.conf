    timeout                  = 8
    icon_position            = left
    max_icon_size            = 44

[battery_ups_low]
    appname                  = "nut"
    summary                  = "UPS*Low Battery*"
    urgency                  = critical
    background               = "#000000ff"
    foreground               = "#f38ba8ff"
    frame_color              = "#f38ba8ff"
    highlight                = "#f38ba8ff"
    format                   = "<span foreground='#f38ba8'>💀⚡</span> <b>UPS CRITICAL</b>\n<span foreground='#f38ba8' weight='bold' size='small'>%b — SHUTDOWN IMMINENT</span>"
    timeout                  = 0
    min_icon_size            = 48
    max_icon_size            = 48
    script                   = "~/.config/dunst/scripts/dunst-handler.sh"

[battery_ups_overload]
    appname                  = "nut"
    summary                  = "UPS*Overload*"
    urgency                  = critical
    background               = "#000000ff"
    foreground               = "#f38ba8ff"
    frame_color              = "#f38ba8ff"
    highlight                = "#f38ba8ff"
    format                   = "<span foreground='#f38ba8'>💥</span> <b>UPS OVERLOADED</b>\n<span foreground='#f38ba8' weight='bold' size='small'>%b — REDUCE LOAD IMMEDIATELY</span>"
    timeout                  = 0
    min_icon_size            = 48
    max_icon_size            = 48
    script                   = "~/.config/dunst/scripts/dunst-handler.sh"

[battery_ups_bypass]
    appname                  = "nut"
    summary                  = "UPS*Bypass*"
    urgency                  = normal
    background               = "#1e1e2eff"
    foreground               = "#cdd6f4ff"
    frame_color              = "#f9e2afcc"
    highlight                = "#f9e2afff"
    format                   = "<span foreground='#f9e2af'>⚠️⚡</span> <b>UPS Bypass Mode</b>\n<span foreground='#9399b2' size='small'>%b — no surge protection</span>"
    timeout                  = 0
    max_icon_size            = 48

[battery_ups_test_done]
    appname                  = "nut"
    summary                  = "UPS Self*Test*"
    urgency                  = low
    background               = "#1e1e2ee6"
    foreground               = "#cdd6f4cc"
    frame_color              = "#a6e3a1cc"
    format                   = "<span foreground='#a6e3a1' size='small'>✅ UPS self-test passed</span>\n<span foreground='#9399b2' size='x-small'>%b</span>"
    timeout                  = 5
    icon_position            = off


