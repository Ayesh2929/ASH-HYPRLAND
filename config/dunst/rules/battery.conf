# ║  🔌  UPS — Uninterruptible Power Supply                                     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

[battery_ups_on_battery]
    appname                  = "nut"
    summary                  = "UPS*On Battery*"
    urgency                  = critical
    background               = "#11111bff"
    foreground               = "#cdd6f4ff"
    frame_color              = "#f38ba8ff"
    highlight                = "#f38ba8ff"
    format                   = "<span foreground='#f38ba8'>⚡🔋</span> <b>UPS — Power Failure</b>\n<span foreground='#f38ba8' size='small'>%b — running on UPS battery</span>"
    timeout                  = 0
    icon_position            = left
    min_icon_size            = 48
    max_icon_size            = 48
    script                   = "~/.config/dunst/scripts/dunst-handler.sh"

[battery_ups_power_restored]
    appname                  = "nut"
    summary                  = "UPS*Power Restored*"
    urgency                  = normal
    background               = "#1e1e2eff"
    foreground               = "#cdd6f4ff"
    frame_color              = "#a6e3a1cc"
    highlight                = "#a6e3a1ff"
