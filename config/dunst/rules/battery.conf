[battery_suppress_high_level]
    appname                  = "battery"
    summary                  = "Battery*80%*"
    skip_display             = true

[battery_suppress_very_high]
    appname                  = "battery"
    summary                  = "Battery*90%*"
    skip_display             = true

[battery_suppress_internal_events]
    appname                  = "battery"
    summary                  = "Device*Changed*"
