# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🔋 ASH DOTFILES v5.0 OMEGA — DUNST BATTERY NOTIFICATION RULES             ║
# ║  Smart thresholds • Power profiles • Thermal • UPS • Full lifecycle        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📁 Location  : ~/.config/dunst/rules/battery.conf
# 📦 Requires  : dunst ≥ 1.11.0, upower, power-profiles-daemon, tlp (optional)
# 🔗 Loaded by : dunstrc → include = ~/.config/dunst/rules/
# 🎨 Colors    : ASH battery semantic palette
# 📡 Priority  : battery-domain — context-aware thresholds
#
# Battery Color Doctrine:
#   🟢 Green   (#a6e3a1) — full, charging, healthy, good levels (> 50%)
#   🔵 Blue    (#89b4fa) — informational, plugged in, moderate levels
#   🟡 Yellow  (#f9e2af) — warning, low power (20–30%), needs attention
#   🟠 Peach   (#fab387) — very low, urgent (10–20%), act soon
#   🔴 Red     (#f38ba8) — critical (< 10%), emergency, shutdown risk
#   🟣 Mauve   (#cba6f7) — power profiles, performance modes
#   🩵 Sky     (#89dceb) — temperature, thermal events
#
# Alert Thresholds (configurable via ash config set):
#   ✅ Full          = 100%
#   ✅ Near Full     = 90–99% (stop charging reminder)
#   ℹ️  High          = 70–89% (informational)
#   ⚠️  Medium        = 40–69% (normal usage zone)
#   ⚠️  Low           = 20–39% (warning, plug in soon)
#   🟠 Very Low      = 10–19% (urgent, save work)
#   🔴 Critical      = 5–9%   (emergency shutdown soon)
#   💀 Emergency     = < 5%   (imminent shutdown)
#
# ─────────────────────────────────────────────────────────────────────────────


# ╔══════════════════════════════════════════════════════════════════════════════╗
