# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🔔 ASH DOTFILES v5.0 OMEGA — DUNST URGENCY NORMAL RULES                   ║
# ║  Balanced • Informative • Action-ready • Perfectly visible                 ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📁 Location  : ~/.config/dunst/rules/urgency-normal.conf
# 📦 Requires  : dunst ≥ 1.11.0
# 🔗 Loaded by : dunstrc → include = ~/.config/dunst/rules/
# 🎨 Colors    : sourced from ~/.config/dunst/colors.conf
# 📡 Priority  : middle — overrides low, overridden by critical
#
# Philosophy:
#   Normal notifications are the standard communication layer.
#   They must be clearly visible, contain actionable information,
#   carry enough context, and leave gracefully after 6 seconds.
#   Icons, colors, and typography are tuned for instant comprehension.
#
# ─────────────────────────────────────────────────────────────────────────────


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🔔  BASE NORMAL URGENCY — Global foundation rule                           ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

[urgency_normal_base]
    urgency                  = normal
    background               = "#1e1e2eF2"
    foreground               = "#cdd6f4ff"
    frame_color              = "#585b70ff"
    highlight                = "#cba6f7ff"
    timeout                  = 6
    format                   = "<b>%s</b>\n<span alpha='90%%'>%b</span>"
    icon_position            = left
    min_icon_size            = 32
    max_icon_size            = 48
    corner_radius            = 12
    separator_color          = "#45475aff"


