# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🌐 ASH DOTFILES v5.0 OMEGA — DUNST NETWORK NOTIFICATION RULES             ║
# ║  WiFi • Ethernet • VPN • Bluetooth • DNS • Firewall • Proxy • Tor          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📁 Location  : ~/.config/dunst/rules/network.conf
# 📦 Requires  : dunst ≥ 1.11.0, NetworkManager, iwd, wireguard, nftables
# 🔗 Loaded by : dunstrc → include = ~/.config/dunst/rules/
# 🎨 Colors    : ASH semantic network palette
# 📡 Priority  : network-domain — overrides urgency base rules
#
# Network Color Doctrine:
#   🟢 Green   (#a6e3a1) — connected, online, success, secure
#   🔵 Blue    (#89b4fa) — info, status, scanning, transferring
#   🟡 Yellow  (#f9e2af) — weak signal, degraded, warning
#   🔴 Red     (#f38ba8) — disconnected, failed, breach, critical
#   🟣 Mauve   (#cba6f7) — VPN, encrypted, privacy, secure tunnel
#   🩵 Teal    (#94e2d5) — Bluetooth, wireless audio
#   🔘 Sky     (#89dceb) — DNS, cloud, internet connectivity
#
# Domain Coverage:
#   01. WiFi         — scan, connect, disconnect, auth, signal strength
#   02. Ethernet     — cable, link up/down, speed negotiation
#   03. VPN          — WireGuard, OpenVPN, NordVPN, Mullvad, ProtonVPN
#   04. Bluetooth    — scan, pair, connect, audio, HID devices
#   05. DNS          — resolution, failure, DNSSEC, DoH/DoT
#   06. Firewall     — nftables, ufw, iptables rules, blocked connections
#   07. Proxy        — HTTP/SOCKS5, pac file, system proxy changes
#   08. Tor          — circuit, hidden service, connection events
#   09. Hotspot      — AP mode, client connect/disconnect
#   10. Traffic      — bandwidth alerts, download complete, upload done
#   11. Ping / Latency — high latency warnings, packet loss
#   12. Port Scanner — nmap results
#   13. NetworkManager — device events, profile changes
#
# ─────────────────────────────────────────────────────────────────────────────


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  📶  WIFI — Connection lifecycle                                             ║
