# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  💬 ASH DOTFILES v5.0 OMEGA — DUNST DISCORD NOTIFICATION RULES             ║
# ║  Rich presence • Smart filtering • Per-event styling • Zero noise          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📁 Location  : ~/.config/dunst/rules/discord.conf
# 📦 Requires  : dunst ≥ 1.11.0, Discord, BetterDiscord (optional)
# 🔗 Loaded by : dunstrc → include = ~/.config/dunst/rules/
# 🎨 Colors    : Discord Blurple palette + ASH dynamic theme accents
# 📡 Priority  : app-specific — overrides urgency base rules
#
# Discord Color Doctrine:
#   🟣 Blurple  (#5865f2) — brand identity, DMs, primary actions
#   🟢 Green    (#57f287) — online, voice connected, positive events
#   🔴 Red      (#ed4245) — calls, critical, danger zones
#   🟡 Yellow   (#fee75c) — mentions, warnings, highlights
#   ⚫ Dark     (#2b2d31) — background base (Discord dark theme)
#   ⚪ White    (#ffffff) — text on dark backgrounds
#
# Rule Hierarchy (highest → lowest priority):
#   1. Incoming Call       (critical, timeout=0)
#   2. Direct Mention      (normal, timeout=8)
#   3. Direct Message      (normal, timeout=7)
#   4. Friend Request      (normal, timeout=10)
#   5. Server Mention      (normal, timeout=6)
#   6. Server Message      (low,    timeout=4)
#   7. Status Updates      (low,    timeout=2)
#   8. Bot Messages        (low,    timeout=3)
#
# ─────────────────────────────────────────────────────────────────────────────


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  📞  VOICE & CALLS — Highest priority, never auto-dismiss                   ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

[discord_incoming_call]
    appname                  = "discord"
    summary                  = "Incoming Call"
    urgency                  = critical
    background               = "#111214ff"
    foreground               = "#ffffffff"
    frame_color              = "#57f287ff"
    highlight                = "#57f287ff"
    format                   = "<span foreground='#57f287' size='large'>📞</span> <b>Incoming Call</b>\n<span foreground='#b9bbbe' size='small'>%b</span>"
    timeout                  = 0
    icon_position            = left
    min_icon_size            = 48
    max_icon_size            = 48
    corner_radius            = 14
    script                   = "~/.config/dunst/scripts/dunst-handler.sh"

[discord_group_call]
