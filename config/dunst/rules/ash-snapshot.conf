# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  💾 ASH DOTFILES v5.0 OMEGA — DUNST ASH SNAPSHOT NOTIFICATION RULES        ║
# ║  Create • Restore • Diff • Export • Import • Auto • Pin • Verify • Encrypt ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📁 Location  : ~/.config/dunst/rules/ash-snapshot.conf
# 📦 Requires  : dunst ≥ 1.11.0, ash-cli v5.0+, rsync, tar, gpg (opt)
# 🔗 Loaded by : dunstrc → include = ~/.config/dunst/rules/
# 🎨 Colors    : ASH snapshot semantic palette
# 📡 Priority  : ash-snapshot-domain — system state management
#
# Snapshot Color Doctrine:
#   🔵 Blue    (#89b4fa) — create, save, checkpoint, info
#   🟢 Green   (#a6e3a1) — success, verified, restored, intact
#   🟡 Yellow  (#f9e2af) — diff, warning, partial, needs attention
#   🟣 Mauve   (#cba6f7) — export, import, sync, share
#   🟠 Peach   (#fab387) — auto-snapshot, scheduled events
#   🔴 Red     (#f38ba8) — error, corrupt, restore failed, critical
#   🩵 Sky     (#89dceb) — encrypt, secure, protected, verified
#   🔘 Gray    (#585b70) — delete, prune, cleanup, archived
#
# Snapshot Types:
#   ✅ Manual     — user-triggered snapshots
#   ⏰ Auto       — systemd timer scheduled snapshots
#   📌 Pinned     — user-marked important snapshots
#   🏷️  Tagged    — labeled with user description
#   ☁️  Cloud     — synced to remote storage
#   🔐 Encrypted  — GPG-encrypted snapshots
#   🔄 Incremental — delta-only snapshots
#   📸 Pre-change — pre-theme/plugin/update snapshots
#
# What a snapshot captures:
#   • All config files (hypr, waybar, rofi, kitty, fish, nvim, etc.)
#   • Current theme + color palette
#   • Active plugins + states
#   • Wallpaper selection
#   • Mode settings
#   • ASH CLI configuration
#   • User profiles
#
# ─────────────────────────────────────────────────────────────────────────────


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  💾  SNAPSHOT CREATE — Manual creation events                               ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

[ash_snapshot_creating]
    appname                  = "ash-snapshot"
    summary                  = "Creating*Snapshot*"
    urgency                  = low
    background               = "#1e1e2ef0"
    foreground               = "#cdd6f4cc"
    frame_color              = "#89b4facc"
    highlight                = "#89b4faff"
    format                   = "<span foreground='#89b4fa' size='small'>💾 Creating snapshot…</span>\n<span foreground='#9399b2' size='x-small'>%b</span>"
    timeout                  = 4
    icon_position            = off
    corner_radius            = 10

