# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🔊 ASH DOTFILES v5.0 OMEGA — DUNST VOLUME NOTIFICATION RULES              ║
# ║  OSD • PipeWire • PulseAudio • ALSA • Microphone • Bluetooth Audio        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📁 Location  : ~/.config/dunst/rules/volume.conf
# 📦 Requires  : dunst ≥ 1.11.0, pipewire, wireplumber, pamixer, pactl
# 🔗 Loaded by : dunstrc → include = ~/.config/dunst/rules/
# 🎨 Colors    : ASH volume semantic palette + progress bar integration
# 📡 Priority  : volume-domain — OSD-style, minimal footprint
#
# Volume Color Doctrine:
#   🟢 Green   (#a6e3a1) — normal levels (1–79%), good audio zone
#   🔵 Blue    (#89b4fa) — device changes, informational events
#   🟡 Yellow  (#f9e2af) — high volume (80–99%), hearing protection zone
#   🔴 Red     (#f38ba8) — max volume (100%), muted state indicator
#   🟣 Mauve   (#cba6f7) — microphone, recording, input events
#   🩵 Teal    (#94e2d5) — Bluetooth audio, wireless speakers
#   🔘 Gray    (#585b70) — OSD background, neutral states
#
# OSD Design Philosophy:
#   Volume notifications are ephemeral UI — they should appear instantly,
#   display clear progress bars, and vanish within 2 seconds.
#   They must never stack, never demand interaction, and
#   always reflect the true system audio state.
#
# ─────────────────────────────────────────────────────────────────────────────


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🔇  MUTED STATES                                                            ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

[volume_muted]
    appname                  = "volume"
    summary                  = "Muted"
    urgency                  = low
    background               = "#181825F5"
    foreground               = "#9399b2ff"
    frame_color              = "#f38ba8cc"
    highlight                = "#f38ba8ff"
    format                   = "<span foreground='#f38ba8' size='large'>🔇</span>  <b>Muted</b>"
    timeout                  = 2
    icon_position            = off
    corner_radius            = 14
    separator_color          = "#313244ff"

[volume_muted_device]
    appname                  = "volume"
    summary                  = "Device Muted*"
    urgency                  = low
    background               = "#181825F5"
    foreground               = "#9399b2ff"
    frame_color              = "#f38ba8cc"
    highlight                = "#f38ba8ff"
    format                   = "<span foreground='#f38ba8' size='small'>🔇 %s</span>\n<span foreground='#6c7086' size='x-small'>%b</span>"
    timeout                  = 2
    icon_position            = off
    corner_radius            = 12

[volume_unmuted]
    appname                  = "volume"
    summary                  = "Unmuted"
    urgency                  = low
    background               = "#181825F5"
    foreground               = "#cdd6f4ff"
    frame_color              = "#a6e3a1cc"
    highlight                = "#a6e3a1ff"
    format                   = "<span foreground='#a6e3a1' size='large'>🔊</span>  <b>Unmuted</b>\n<span foreground='#9399b2' size='small'>%b</span>"
    timeout                  = 2
    icon_position            = off
    corner_radius            = 14
    progress_bar             = true

[volume_system_muted]
    appname                  = "volume"
    summary                  = "System Muted"
    urgency                  = low
    background               = "#181825F5"
    foreground               = "#9399b2ff"
    frame_color              = "#f38ba8cc"
    highlight                = "#f38ba8ff"
    format                   = "<span foreground='#f38ba8'>🔇</span> <b>System Muted</b>"
    timeout                  = 2
    icon_position            = off
    corner_radius            = 12


