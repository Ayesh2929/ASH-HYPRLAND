# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🎨 ASH DOTFILES v5.0 OMEGA — DUNST ASH THEME ENGINE NOTIFICATION RULES    ║
# ║  Apply • Generate • AI • Wallpaper • Hot-Reload • Color • Store • Sync     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📁 Location  : ~/.config/dunst/rules/ash-theme.conf
# 📦 Requires  : dunst ≥ 1.11.0, ash-cli v5.0+, swww, waybar, hyprctl
# 🔗 Loaded by : dunstrc → include = ~/.config/dunst/rules/
# 🎨 Colors    : ASH theme palette — dynamic, matches current accent
# 📡 Priority  : ash-domain — first-party events, highest brand fidelity
#
# ASH Theme Color Doctrine:
#   🟣 Mauve   (#cba6f7) — theme apply, brand identity, accent change
#   🟢 Green   (#a6e3a1) — success, applied, synced, validated
#   🔵 Blue    (#89b4fa) — info, loading, generating, AI processing
#   🟡 Yellow  (#f9e2af) — warning, validation issue, compatibility
#   🔴 Red     (#f38ba8) — error, failed, corrupt, rollback needed
#   🌅 Rosewater (#f5e0dc) — wallpaper, visual, color palette
#   🩵 Sky     (#89dceb) — AI, generative, smart features
#   🔘 Overlay (#6c7086) — minimal, muted, background events
#
# Theme Event Categories:
#   01. Theme Apply          — instant feedback on theme change
#   02. Wallpaper            — wallpaper set/change/slideshow
#   03. Color Engine         — palette extract/generate/harmonize
#   04. Hot Reload           — live config refresh events
#   05. Mode Switch          — game/work/focus/cinema/present/battery
#   06. AI Generation        — ollama, mood, weather, music-based
#   07. Store                — browse/download/upload/rate
#   08. Validation           — schema check, contrast, WCAG
#   09. Sync                 — cloud sync, multi-device
#   10. Plugin Integration   — theme-aware plugin events
#   11. Schedule             — time-based, auto theme rotation
#   12. Export/Import        — share, migrate, backup themes
#
# ─────────────────────────────────────────────────────────────────────────────


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🎨  THEME APPLY — Core theme change events                                 ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

[ash_theme_apply_start]
    appname                  = "ash-theme"
    summary                  = "Applying*Theme*"
    urgency                  = low
    background               = "#1e1e2ef0"
    foreground               = "#cdd6f4cc"
    frame_color              = "#cba6f7cc"
    highlight                = "#cba6f7ff"
    format                   = "<span foreground='#cba6f7' size='small'>🎨 Applying theme…</span>\n<span foreground='#9399b2' size='x-small'>%b</span>"
    timeout                  = 3
    icon_position            = off
    corner_radius            = 10

[ash_theme_applied]
    appname                  = "ash-theme"
    summary                  = "Theme Applied*"
    urgency                  = normal
    background               = "#1e1e2eff"
    foreground               = "#cdd6f4ff"
    frame_color              = "#cba6f7cc"
    highlight                = "#cba6f7ff"
    format                   = "<span foreground='#cba6f7' size='large'>🎨</span>  <b>%s</b>\n<span foreground='#9399b2' size='small'>%b</span>"
    timeout                  = 4
    icon_position            = left
    min_icon_size            = 44
    max_icon_size            = 56
    corner_radius            = 14
    script                   = "~/.config/dunst/scripts/dunst-handler.sh"

