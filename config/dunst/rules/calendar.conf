# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  📅 ASH DOTFILES v5.0 OMEGA — DUNST CALENDAR NOTIFICATION RULES            ║
# ║  Events • Reminders • Deadlines • Recurring • Multi-Calendar • Birthdays   ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📁 Location  : ~/.config/dunst/rules/calendar.conf
# 📦 Requires  : dunst ≥ 1.11.0, khal, calcurse, gnome-calendar, vdirsyncer
#               gcalcli, remind, todoman
# 🔗 Loaded by : dunstrc → include = ~/.config/dunst/rules/
# 🎨 Colors    : ASH calendar temporal urgency palette
# 📡 Priority  : calendar-domain — time-critical, escalating urgency
#
# Calendar Color Doctrine — Time to Event:
#   🟣 Mauve   (#cba6f7) — 24h+      upcoming, plan ahead
#   🔵 Blue    (#89b4fa) — 2–24h     tomorrow, this evening
#   🟢 Green   (#a6e3a1) — 1–2h      this afternoon, get ready
#   🟡 Yellow  (#f9e2af) — 30–60min  approaching, prepare now
#   🟠 Peach   (#fab387) — 15–30min  soon, final prep
#   🔴 Red     (#f38ba8) — 0–15min   imminent, happening now
#   💀 Critical            overdue, missed, emergency
#
# Time Reference Scale:
#   ⏰ 24h+ ahead      = low urgency, informational preview
#   ⏰ 2–24h ahead     = low urgency, day planning
#   ⏰ 1–2h ahead      = normal urgency, prepare soon
#   ⏰ 30–60min ahead  = normal urgency, wrap up current task
#   ⏰ 15–30min ahead  = normal urgency, final warning
#   ⏰ 0–15min ahead   = critical urgency, act now
#   ⏰ Overdue/now     = critical urgency, max visibility
#
# Calendar Sources Covered:
#   ✅ khal          — CLI calendar (CalDAV)
#   ✅ calcurse      — terminal calendar
#   ✅ gnome-calendar — GNOME calendar daemon
#   ✅ gcalcli       — Google Calendar CLI
#   ✅ remind        — advanced reminder system
#   ✅ todoman       — task manager (RFC 5545)
#   ✅ vdirsyncer    — CalDAV/CardDAV sync
#   ✅ ash-calendar  — ASH integrated calendar
#
# ─────────────────────────────────────────────────────────────────────────────


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  📆  UPCOMING EVENTS — 24h+ in advance                                     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

[calendar_tomorrow]
    appname                  = "calendar"
    summary                  = "*Tomorrow*"
    urgency                  = low
    background               = "#1e1e2eE6"
    foreground               = "#bac2deff"
    frame_color              = "#cba6f7cc"
    highlight                = "#cba6f7ff"
    format                   = "<span foreground='#cba6f7'>📅</span>  <b>Tomorrow</b>\n<span foreground='#9399b2' size='small'>%b</span>"
    timeout                  = 8
    icon_position            = left
    min_icon_size            = 32
    max_icon_size            = 44
    corner_radius            = 12

