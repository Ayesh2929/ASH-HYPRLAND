# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🚨 ASH DOTFILES v5.0 OMEGA — DUNST URGENCY CRITICAL RULES                 ║
# ║  Maximum visibility • Never auto-dismiss • Demands immediate action        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📁 Location  : ~/.config/dunst/rules/urgency-critical.conf
# 📦 Requires  : dunst ≥ 1.11.0
# 🔗 Loaded by : dunstrc → include = ~/.config/dunst/rules/
# 🎨 Colors    : sourced from ~/.config/dunst/colors.conf
# 📡 Priority  : highest — overrides ALL other rules unconditionally
#
# Philosophy:
#   Critical notifications represent system emergencies, security events,
#   hardware failures, and data loss risks. They must be:
#   • IMPOSSIBLE to miss — maximum contrast, solid backgrounds
#   • PERSISTENT — timeout = 0 means never auto-dismiss
#   • ACTIONABLE — scripts trigger alerts, logs, and sounds
#   • ACCESSIBLE — WCAG AAA contrast ratios enforced
#
# Critical Color Doctrine:
#   🔴 Red   (#f38ba8) — hardware failure, security breach, auth failure
#   🟠 Orange (#fab387) — disk full, resource exhaustion, overheating
#   🟡 Yellow (#f9e2af) — warnings elevated to critical (rare)
#   🔵 Blue   (#89b4fa) — security lock, data protection
#
# ─────────────────────────────────────────────────────────────────────────────


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🚨  BASE CRITICAL URGENCY — Global foundation rule                         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

[urgency_critical_base]
    urgency                  = critical
    background               = "#1e1e2eff"
    foreground               = "#cdd6f4ff"
    frame_color              = "#f38ba8ff"
    highlight                = "#f38ba8ff"
    timeout                  = 0
    format                   = "⚠ <b>%s</b>\n<span alpha='95%%'>%b</span>"
    icon_position            = left
    min_icon_size            = 48
    max_icon_size            = 48
    corner_radius            = 12
    separator_color          = "#f38ba8ff"


