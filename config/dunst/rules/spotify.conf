    summary                  = "Shuffle Off"
    urgency                  = low
    background               = "#121212d0"
    foreground               = "#727272cc"
    frame_color              = "#282828aa"
    format                   = "<span size='x-small' alpha='70%%'>🔀 Shuffle disabled</span>"
    timeout                  = 2
    icon_position            = off

[spotify_repeat_track]
    appname                  = "Spotify"
    summary                  = "Repeat Track"
    urgency                  = low
    background               = "#121212e0"
    foreground               = "#b3b3b3cc"
    frame_color              = "#1db954aa"
    format                   = "<span foreground='#1db954' size='small'>🔂 Repeat: Track</span>"
