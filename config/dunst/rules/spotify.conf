# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🎵 ASH DOTFILES v5.0 OMEGA — DUNST SPOTIFY NOTIFICATION RULES             ║
# ║  Now Playing • Smart media events • Rich track metadata • Zero spam        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📁 Location  : ~/.config/dunst/rules/spotify.conf
# 📦 Requires  : dunst ≥ 1.11.0, Spotify, Spicetify (optional), playerctl
# 🔗 Loaded by : dunstrc → include = ~/.config/dunst/rules/
# 🎨 Colors    : Spotify brand palette + ASH dynamic accents
# 📡 Priority  : app-specific — overrides urgency base rules
#
# Spotify Color Doctrine:
#   🟢 Green   (#1db954) — Spotify brand, playing state, success
#   ⚫ Dark    (#121212) — Spotify background (deepest black)
#   🔘 Surface (#282828) — card backgrounds, popups
#   ⚪ White   (#ffffff) — primary text
#   🔘 Gray    (#b3b3b3) — secondary text, meta info
#   🟣 Purple  (#cba6f7) — ASH accent overlay for special events
#
# Rule Priority (highest → lowest):
#   1. Explicit / Parental Advisory (normal, special handling)
#   2. Now Playing (normal, rich format)
#   3. Podcast Episode (normal, medium visibility)
#   4. Playlist change (low)
#   5. Volume / device change (low, OSD style)
#   6. Friend activity (low, minimal)
#   7. Ads (suppressed entirely)
#
# ─────────────────────────────────────────────────────────────────────────────


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🎵  NOW PLAYING — Core track notification                                  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

[spotify_now_playing]
    appname                  = "Spotify"
    summary                  = "Now Playing"
    urgency                  = low
    background               = "#121212ff"
    foreground               = "#ffffffff"
    frame_color              = "#1db954cc"
    highlight                = "#1db954ff"
    format                   = "<span foreground='#1db954'>▶</span> <b>%s</b>\n<span foreground='#b3b3b3' size='small'>%b</span>"
    timeout                  = 4
    icon_position            = left
    min_icon_size            = 48
    max_icon_size            = 56
    corner_radius            = 12
    separator_color          = "#282828ff"

[spotify_track_change]
    appname                  = "Spotify"
    summary                  = "*–*"
    urgency                  = low
    background               = "#121212ff"
    foreground               = "#ffffffff"
    frame_color              = "#1db954cc"
    highlight                = "#1db954ff"
    format                   = "<span foreground='#1db954'>🎵</span> <b>%s</b>\n<span foreground='#b3b3b3' size='small'>%b</span>"
    timeout                  = 4
    icon_position            = left
    min_icon_size            = 48
    max_icon_size            = 56
    corner_radius            = 12

[spotify_track_long]
    appname                  = "Spotify"
    summary                  = "Now Playing*"
    urgency                  = low
    background               = "#121212ff"
    foreground               = "#ffffffff"
    frame_color              = "#1db954cc"
    highlight                = "#1db954ff"
    format                   = "<span foreground='#1db954'>▶</span> <b>%s</b>\n<span foreground='#b3b3b3' size='small'>%b</span>"
    timeout                  = 4
    icon_position            = left
    max_icon_size            = 56
    ellipsize                = end

[spotify_track_explicit]
    appname                  = "Spotify"
    summary                  = "*🅴*"
    urgency                  = low
    background               = "#121212ff"
    foreground               = "#ffffffff"
    frame_color              = "#1db954cc"
    highlight                = "#1db954ff"
    format                   = "<span foreground='#1db954'>▶</span> <b>%s</b> <span foreground='#b3b3b3' size='x-small'>🅴</span>\n<span foreground='#b3b3b3' size='small'>%b</span>"
    timeout                  = 4
    icon_position            = left
    max_icon_size            = 56


# ╔══════════════════════════════════════════════════════════════════════════════╗
