# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🎤  PLAYERCTL (MPRIS) — Generic media player fallback                     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

[playerctl_track_change]
    appname                  = "playerctl"
    urgency                  = low
    background               = "#1e1e2eff"
    foreground               = "#cdd6f4ff"
    frame_color              = "#a6e3a1cc"
    highlight                = "#a6e3a1ff"
    format                   = "<span foreground='#a6e3a1'>🎵</span> <b>%s</b>\n<span foreground='#9399b2' size='small'>%b</span>"
    timeout                  = 4
    icon_position            = left
    max_icon_size            = 48
    corner_radius            = 12

[playerctl_paused]
    appname                  = "playerctl"
    summary                  = "Paused"
    urgency                  = low
    background               = "#1e1e2ee0"
    foreground               = "#9399b2cc"
    frame_color              = "#45475acc"
    format                   = "<span size='small' alpha='70%%'>⏸ Paused — %b</span>"
    timeout                  = 2
    icon_position            = off

[playerctl_stopped]
    appname                  = "playerctl"
    summary                  = "Stopped"
    urgency                  = low
    background               = "#1e1e2ed0"
    foreground               = "#6c7086cc"
    frame_color              = "#313244aa"
    format                   = "<span size='x-small' alpha='60%%'>⏹ Playback stopped</span>"
    timeout                  = 2
    icon_position            = off


