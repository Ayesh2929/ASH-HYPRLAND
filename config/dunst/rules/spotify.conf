    summary                  = "Repeat Context"
    urgency                  = low
    background               = "#121212e0"
    foreground               = "#b3b3b3cc"
    frame_color              = "#1db954aa"
    format                   = "<span foreground='#1db954' size='small'>🔁 Repeat: Playlist</span>"
