# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🔕 ASH DOTFILES v5.0 OMEGA — DUNST URGENCY LOW RULES                      ║
# ║  Whisper-quiet • Non-intrusive • Graceful degradation                      ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📁 Location  : ~/.config/dunst/rules/urgency-low.conf
# 📦 Requires  : dunst ≥ 1.11.0
# 🔗 Loaded by : dunstrc → include = ~/.config/dunst/rules/
# 🎨 Colors    : sourced from ~/.config/dunst/colors.conf
# 📡 Priority  : lowest — all other rules override this
#
# Philosophy:
#   Low-urgency notifications are informational whispers.
#   They should never demand attention, never interrupt flow,
#   and vanish gracefully before the user even notices.
#   Opacity, size, and duration are all tuned to minimal footprint.
#
# ─────────────────────────────────────────────────────────────────────────────


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🌑  BASE LOW URGENCY — Global foundation rule                              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

[urgency_low_base]
    urgency                  = low
    background               = "#1e1e2eD9"
    foreground               = "#9399b2ff"
    frame_color              = "#313244ff"
    highlight                = "#585b70ff"
    timeout                  = 4
    format                   = "<span size='small' alpha='85%%'><b>%s</b></span>\n<span size='x-small' alpha='70%%'>%b</span>"
    icon_position            = left
    min_icon_size            = 24
    max_icon_size            = 36
    corner_radius            = 10
    separator_color          = "#313244ff"


