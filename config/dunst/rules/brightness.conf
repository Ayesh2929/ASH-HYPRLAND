# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ☀️ ASH DOTFILES v5.0 OMEGA — DUNST BRIGHTNESS NOTIFICATION RULES          ║
# ║  OSD • Adaptive • Night Light • HDR • Multi-Monitor • Color Profiles       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📁 Location  : ~/.config/dunst/rules/brightness.conf
# 📦 Requires  : dunst ≥ 1.11.0, brightnessctl, ddcutil, wlr-randr, gammastep
# 🔗 Loaded by : dunstrc → include = ~/.config/dunst/rules/
# 🎨 Colors    : ASH brightness semantic palette — warm to cool spectrum
# 📡 Priority  : brightness-domain — OSD-style, ultra-minimal footprint
#
# Brightness Color Doctrine:
#   ⚫ Deep    (#1e1e2e) — 0–9%   pitch dark, emergency dim
#   🔘 Surface (#313244) — 10–19% very dim, night reading
#   🔵 Blue    (#89b4fa) — 20–39% low, ambient, comfortable night
#   🟢 Green   (#a6e3a1) — 40–69% standard, ideal working range
#   🟡 Yellow  (#f9e2af) — 70–84% bright, outdoor use
#   🟠 Peach   (#fab387) — 85–94% very bright, direct sunlight
#   🔴 Red     (#f38ba8) — 95–100% maximum, eye strain warning
#   🌙 Mauve   (#cba6f7) — night light, blue filter, color temp
#   🌅 Rosewater (#f5e0dc) — warm tones, sunset, cozy mode
#
# OSD Design Philosophy:
#   Brightness OSD must be instantaneous and silent.
#   Progress bars communicate levels better than numbers.
#   Night light and color temperature changes get special treatment.
#   Multi-monitor adjustments shown per-display.
#
# ─────────────────────────────────────────────────────────────────────────────


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🌑  PITCH DARK — 0–9% Emergency dim states                                ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

[brightness_zero]
    appname                  = "brightness"
    summary                  = "Brightness*0%*"
    urgency                  = low
    background               = "#11111bFF"
    foreground               = "#585b70ff"
    frame_color              = "#1e1e2eff"
    highlight                = "#313244ff"
    format                   = "<span foreground='#313244' size='large'>🌑</span>  <b>Off</b>\n<span foreground='#45475a' size='x-small'>▁░░░░░░░░░░</span>"
    timeout                  = 2
    icon_position            = off
    corner_radius            = 14
    progress_bar             = true
    separator_color          = "#1e1e2eff"

[brightness_5]
    appname                  = "brightness"
    summary                  = "Brightness*5%*"
    urgency                  = low
    background               = "#11111bFF"
    foreground               = "#6c7086ff"
