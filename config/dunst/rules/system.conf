# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ⚙️ ASH DOTFILES v5.0 OMEGA — DUNST SYSTEM NOTIFICATION RULES              ║
# ║  Hardware • Services • Security • Power • Storage • Network • Kernel       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📁 Location  : ~/.config/dunst/rules/system.conf
# 📦 Requires  : dunst ≥ 1.11.0, systemd, udev, udisks2, NetworkManager
# 🔗 Loaded by : dunstrc → include = ~/.config/dunst/rules/
# 🎨 Colors    : ASH semantic color system
# 📡 Priority  : system-level — second highest after critical
#
# System Color Doctrine:
#   ✅ Green  (#a6e3a1) — success, connected, mounted, healthy
#   ⚠️  Yellow (#f9e2af) — warning, degraded, needs attention
#   ❌ Red    (#f38ba8) — failure, critical, immediate action
#   ℹ️  Blue  (#89b4fa) — informational, status updates
#   🔒 Mauve  (#cba6f7) — security, authentication, privacy
#   🖥️  Teal  (#94e2d5) — hardware, devices, peripherals
#
# Covered System Domains:
#   01. Session Management (login/logout/lock/unlock/suspend/resume)
#   02. Hardware Devices (USB, audio, display, input)
#   03. Storage (mount/unmount/format/encrypt/SMART)
#   04. Services (systemd start/stop/fail/restart)
#   05. Authentication (polkit/sudo/PAM/GPG/SSH)
#   06. Package Management (pacman/paru/yay/flatpak/snap)
#   07. Kernel & Boot (dmesg, kernel messages, GRUB)
#   08. Power Management (CPU governor, performance profiles)
#   09. Clipboard (cliphist events)
#   10. Printing (CUPS)
#   11. Accessibility (a11y state changes)
#   12. Timezone & Locale
#   13. Cron / Scheduled Tasks
#   14. ASH System Events
#
# ─────────────────────────────────────────────────────────────────────────────


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🔐  SESSION MANAGEMENT                                                      ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

[system_session_login]
    appname                  = "system"
    summary                  = "Welcome*"
