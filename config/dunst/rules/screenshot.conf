# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  📸 ASH DOTFILES v5.0 OMEGA — DUNST SCREENSHOT NOTIFICATION RULES          ║
# ║  Capture • OCR • Annotate • Upload • Record • GIF • Color Pick            ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📁 Location  : ~/.config/dunst/rules/screenshot.conf
# 📦 Requires  : dunst ≥ 1.11.0, grimblast, grim, slurp, swappy, tesseract
#               wf-recorder, satty, hyprpicker, jq, xdg-open, wl-clipboard
# 🔗 Loaded by : dunstrc → include = ~/.config/dunst/rules/
# 🎨 Colors    : ASH screenshot semantic palette
# 📡 Priority  : screenshot-domain — action-ready notifications
#
# Screenshot Color Doctrine:
#   🟢 Green   (#a6e3a1) — saved, success, ready, uploaded, copied
#   🔵 Blue    (#89b4fa) — info, processing, OCR, annotating
#   🟣 Mauve   (#cba6f7) — color pick, special captures, AI processing
#   🟡 Yellow  (#f9e2af) — warning, pending, waiting
#   🔴 Red     (#f38ba8) — error, failed, permission denied, recording
#   🩵 Sky     (#89dceb) — GIF, animation, video captures
#   🟠 Peach   (#fab387) — upload, sharing, public link
#
# Tool Coverage:
#   ✅ grimblast    — primary screenshot tool (wayland native)
#   ✅ grim         — raw wayland screenshot
#   ✅ slurp        — area selection
#   ✅ swappy       — annotation tool
#   ✅ satty        — modern annotation tool
#   ✅ tesseract    — OCR text extraction
#   ✅ hyprpicker   — color picker
#   ✅ wf-recorder  — screen recording
#   ✅ gpu-screen-recorder — high-performance recording
#   ✅ obs-studio   — professional recording/streaming
#   ✅ flameshot    — cross-platform alternative
#   ✅ ash-shot     — ASH unified screenshot CLI
#
# ─────────────────────────────────────────────────────────────────────────────


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  📸  FULL SCREEN CAPTURES                                                    ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

[screenshot_full_saved]
    appname                  = "screenshot"
    summary                  = "Screenshot Saved*"
    urgency                  = low
    background               = "#1e1e2eFF"
    foreground               = "#cdd6f4ff"
    frame_color              = "#a6e3a1cc"
    highlight                = "#a6e3a1ff"
    format                   = "<span foreground='#a6e3a1' size='large'>📸</span>  <b>Screenshot Saved</b>\n<span foreground='#9399b2' size='small'>%b</span>"
    timeout                  = 5
    icon_position            = left
    min_icon_size            = 48
    max_icon_size            = 64
    corner_radius            = 14
    script                   = "~/.config/dunst/scripts/open-action.sh"

[screenshot_full_copied]
    appname                  = "screenshot"
