# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🐳 ASH DOTFILES v5.0 OMEGA — DUNST DOCKER NOTIFICATION RULES              ║
# ║  Containers • Images • Volumes • Networks • Compose • Swarm • Registry     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 📁 Location  : ~/.config/dunst/rules/docker.conf
# 📦 Requires  : dunst ≥ 1.11.0, docker ≥ 24.0, docker-compose, podman (opt)
# 🔗 Loaded by : dunstrc → include = ~/.config/dunst/rules/
# 🎨 Colors    : Docker brand palette + ASH semantic system
# 📡 Priority  : docker-domain — container-lifecycle aware
#
# Docker Color Doctrine:
#   🔵 Blue    (#89b4fa) — Docker brand, info, running, pulling
#   🟢 Green   (#a6e3a1) — started, healthy, success, pushed, built
#   🟡 Yellow  (#f9e2af) — warning, stopping, degraded, pending
#   🟠 Peach   (#fab387) — restarting, retrying, paused, slow
#   🔴 Red     (#f38ba8) — stopped, failed, crashed, error, killed
#   🟣 Mauve   (#cba6f7) — images, registry, Swarm, orchestration
#   🩵 Teal    (#94e2d5) — networks, volumes, storage, compose
#   🔘 Sky     (#89dceb) — Podman, containerd, alternative runtimes
#
# Domain Coverage:
#   01. Container Lifecycle  — create/start/stop/kill/restart/remove
#   02. Container Health     — healthy/unhealthy/health-check
#   03. Image Management     — pull/push/build/tag/remove/prune
#   04. Volume Operations    — create/mount/backup/prune
#   05. Network Events       — create/connect/disconnect/prune
#   06. Docker Compose       — up/down/scale/restart/build
#   07. Docker Swarm         — node join/leave, service deploy
#   08. Registry             — login/push/pull/auth events
#   09. Resource Limits      — OOM, CPU throttle, memory warn
#   10. Security             — vulnerability scan, secret leak
#   11. Podman               — drop-in compatible rules
#   12. System Events        — daemon start/stop, prune, stats
#
# ─────────────────────────────────────────────────────────────────────────────


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🐳  DOCKER DAEMON                                                           ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

[docker_daemon_started]
    appname                  = "docker"
    summary                  = "Docker*Started*"
    urgency                  = normal
    background               = "#1e1e2eff"
    foreground               = "#cdd6f4ff"
    frame_color              = "#89b4facc"
    highlight                = "#89b4faff"
    format                   = "<span foreground='#89b4fa' size='large'>🐳</span>  <b>Docker Started</b>\n<span foreground='#9399b2' size='small'>%b — daemon ready</span>"
    timeout                  = 4
    icon_position            = left
    min_icon_size            = 40
    max_icon_size            = 52
    corner_radius            = 12

[docker_daemon_stopped]
    appname                  = "docker"
    summary                  = "Docker*Stopped*"
    urgency                  = normal
    background               = "#1e1e2eff"
    foreground               = "#cdd6f4ff"
    frame_color              = "#f9e2afcc"
    highlight                = "#f9e2afff"
    format                   = "<span foreground='#f9e2af'>🐳</span>  <b>Docker Stopped</b>\n<span foreground='#9399b2' size='small'>%b</span>"
    timeout                  = 5
    icon_position            = left
    max_icon_size            = 48

[docker_daemon_crashed]
    appname                  = "docker"
    summary                  = "Docker*Crashed*"
    urgency                  = critical
    background               = "#11111bff"
    foreground               = "#cdd6f4ff"
    frame_color              = "#f38ba8ff"
    highlight                = "#f38ba8ff"
    format                   = "<span foreground='#f38ba8' size='large'>🐳💥</span>  <b>Docker Daemon Crashed</b>\n<span foreground='#f38ba8' size='small' weight='bold'>%b — restart: systemctl start docker</span>"
    timeout                  = 0
    icon_position            = left
    min_icon_size            = 56
    max_icon_size            = 64
    corner_radius            = 14
    script                   = "~/.config/dunst/scripts/dunst-handler.sh"

[docker_daemon_restarted]
    appname                  = "docker"
    summary                  = "Docker*Restarted*"
    urgency                  = normal
    background               = "#1e1e2eff"
    foreground               = "#cdd6f4ff"
    frame_color              = "#89b4facc"
    highlight                = "#89b4faff"
    format                   = "<span foreground='#89b4fa'>🔄🐳</span>  <b>Docker Restarted</b>\n<span foreground='#9399b2' size='small'>%b</span>"
    timeout                  = 4
    max_icon_size            = 48

[docker_system_prune_done]
    appname                  = "docker"
    summary                  = "System*Pruned*"
    urgency                  = low
    background               = "#1e1e2eee"
    foreground               = "#cdd6f4cc"
    frame_color              = "#a6e3a1cc"
    highlight                = "#a6e3a1ff"
    format                   = "<span foreground='#a6e3a1'>🧹🐳</span>  <b>System Pruned</b>\n<span foreground='#9399b2' size='small'>%b freed</span>"
    timeout                  = 6
    max_icon_size            = 44

[docker_system_df]
    appname                  = "docker"
    summary                  = "Disk*Usage*"
    urgency                  = low
    background               = "#1e1e2eee"
    foreground               = "#cdd6f4cc"
    frame_color              = "#89b4facc"
    format                   = "<span foreground='#89b4fa' size='small'>📊 Docker disk: %b</span>"
    timeout                  = 5
    icon_position            = off

[docker_context_switched]
    appname                  = "docker"
    summary                  = "Context*Switched*"
    urgency                  = low
    background               = "#1e1e2eee"
    foreground               = "#cdd6f4cc"
    frame_color              = "#89b4facc"
    highlight                = "#89b4faff"
    format                   = "<span foreground='#89b4fa' size='small'>🔀 Context: %b</span>"
    timeout                  = 3
    icon_position            = off


