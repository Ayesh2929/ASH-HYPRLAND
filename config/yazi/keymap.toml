# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 — YAZI KEYMAP ULTRA                                    ║
# ║                                                                            ║
# ║  Premium vim-style keybindings with ASH extensions                        ║
# ║  Philosophy: hjkl navigation + leader-key commands + fzf integration      ║
# ║                                                                            ║
# ║  Key Notation:                                                             ║
# ║  <C-x>  = Ctrl+x     <A-x> = Alt+x      <S-x> = Shift+x                 ║
# ║  <Esc>  = Escape     <Enter> = Enter     <Tab> = Tab                      ║
# ║  <Up>/<Down>/<Left>/<Right> = Arrow keys                                  ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🗂️  MANAGER — File browser keybindings
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[manager]

keymap = [

    # ── Navigation — Vim motions ────────────────────────────────────────────

    { on = "k",         run = "arrow -1",           desc = "Move cursor up" },
    { on = "j",         run = "arrow 1",            desc = "Move cursor down" },
    { on = "<Up>",      run = "arrow -1",           desc = "Move cursor up" },
    { on = "<Down>",    run = "arrow 1",            desc = "Move cursor down" },

    # Page navigation
    { on = "<C-u>",     run = "arrow -50%",         desc = "Scroll up half page" },
    { on = "<C-d>",     run = "arrow 50%",          desc = "Scroll down half page" },
    { on = "<C-b>",     run = "arrow -100%",        desc = "Scroll up full page" },
    { on = "<C-f>",     run = "arrow 100%",         desc = "Scroll down full page" },
    { on = "<PageUp>",  run = "arrow -100%",        desc = "Page up" },
    { on = "<PageDown>",run = "arrow 100%",         desc = "Page down" },

    # Jump to top/bottom
    { on = "g",         run = "arrow -99999999",    desc = "Jump to top" },
    { on = "G",         run = "arrow 99999999",     desc = "Jump to bottom" },
    { on = "<Home>",    run = "arrow -99999999",    desc = "Jump to top" },
    { on = "<End>",     run = "arrow 99999999",     desc = "Jump to bottom" },

    # ── Directory Navigation ────────────────────────────────────────────────

    # Enter directory / open file
    { on = "l",         run = ["entry", "open"],    desc = "Enter dir or open file" },
    { on = "<Right>",   run = ["entry", "open"],    desc = "Enter dir or open file" },
    { on = "<Enter>",   run = ["entry", "open"],    desc = "Enter dir or open file" },

    # Go back to parent
    { on = "h",         run = "leave",              desc = "Go to parent directory" },
    { on = "<Left>",    run = "leave",              desc = "Go to parent directory" },
    { on = "<Backspace>",run = "leave",             desc = "Go to parent directory" },

    # ── Common Directories ──────────────────────────────────────────────────

    { on = ["~"],       run = "cd ~",              desc = "Go to home directory" },
    { on = ["/"],       run = "cd /",              desc = "Go to root" },
    { on = ["."],       run = "cd .",              desc = "Go to current dir" },

    # ASH quick navigation
    { on = ["g", "h"], run = "cd ~",               desc = "Go home" },
    { on = ["g", "c"], run = "cd ~/.config",       desc = "Go to config" },
    { on = ["g", "d"], run = "cd ~/Downloads",     desc = "Go to downloads" },
    { on = ["g", "D"], run = "cd ~/Documents",     desc = "Go to documents" },
    { on = ["g", "p"], run = "cd ~/Projects",      desc = "Go to projects" },
    { on = ["g", "P"], run = "cd ~/Pictures",      desc = "Go to pictures" },
    { on = ["g", "v"], run = "cd ~/Videos",        desc = "Go to videos" },
    { on = ["g", "m"], run = "cd ~/Music",         desc = "Go to music" },
    { on = ["g", "t"], run = "cd /tmp",            desc = "Go to /tmp" },
    { on = ["g", "r"], run = "cd /",               desc = "Go to root" },
    { on = ["g", "a"], run = "cd ~/.config/ash",   desc = "Go to ASH config" },
    { on = ["g", "n"], run = "cd ~/.config/nvim",  desc = "Go to Neovim config" },

    # ── History Navigation ──────────────────────────────────────────────────

    { on = "<A-Left>",  run = "back",              desc = "Go back in history" },
    { on = "<A-Right>", run = "forward",           desc = "Go forward in history" },
    { on = "<A-h>",     run = "back",              desc = "Go back in history" },
    { on = "<A-l>",     run = "forward",           desc = "Go forward in history" },

    # ── Tab Management ──────────────────────────────────────────────────────

    { on = "t",         run = "tab_create --current",  desc = "New tab (current dir)" },
    { on = "T",         run = "tab_create",             desc = "New tab (home)" },
    { on = "W",         run = "tab_close",              desc = "Close current tab" },

    # Tab switching
    { on = "<Tab>",     run = "tab_switch 1 --relative",  desc = "Next tab" },
    { on = "<S-Tab>",   run = "tab_switch -1 --relative", desc = "Previous tab" },
    { on = "1",         run = "tab_switch 0",             desc = "Switch to tab 1" },
    { on = "2",         run = "tab_switch 1",             desc = "Switch to tab 2" },
    { on = "3",         run = "tab_switch 2",             desc = "Switch to tab 3" },
    { on = "4",         run = "tab_switch 3",             desc = "Switch to tab 4" },
    { on = "5",         run = "tab_switch 4",             desc = "Switch to tab 5" },
    { on = "6",         run = "tab_switch 5",             desc = "Switch to tab 6" },
    { on = "7",         run = "tab_switch 6",             desc = "Switch to tab 7" },
    { on = "8",         run = "tab_switch 7",             desc = "Switch to tab 8" },
    { on = "9",         run = "tab_switch 8",             desc = "Switch to tab 9" },

    # Move tab
    { on = ["{"],       run = "tab_swap -1",              desc = "Move tab left" },
    { on = ["}"],       run = "tab_swap 1",               desc = "Move tab right" },

    # ── Selection ───────────────────────────────────────────────────────────

    # Select current + move down
    { on = "<Space>",   run = ["toggle", "arrow 1"],      desc = "Toggle selection" },
    { on = "v",         run = "visual_mode",               desc = "Enter visual mode" },
    { on = "V",         run = "select_all --state=true",   desc = "Select all" },
    { on = "<C-a>",     run = "select_all --state=true",   desc = "Select all" },
    { on = "<C-r>",     run = "select_all --state=false",  desc = "Invert selection" },
    { on = "u",         run = "select_all --state=false",  desc = "Unselect all" },

    # ── File Operations ─────────────────────────────────────────────────────

    # Open
    { on = "o",         run = "open",                      desc = "Open file(s)" },
    { on = "O",         run = "open --interactive",        desc = "Open with... (choose app)" },

    # Create
    { on = "a",         run = "create",                    desc = "Create file" },
    { on = "A",         run = "create --dir",              desc = "Create directory" },

    # Rename
    { on = "r",         run = "rename --cursor=before_ext",desc = "Rename (before ext)" },
    { on = "R",         run = "rename --empty",            desc = "Rename (clear name)" },
    { on = ["c", "w"],  run = "rename --cursor=start",     desc = "Change filename" },

    # Yank (copy path/file)
    { on = "y",         run = "yank",                      desc = "Copy file(s)" },
    { on = "Y",         run = "yank --cut",                desc = "Cut file(s)" },
    { on = "p",         run = "paste",                     desc = "Paste file(s)" },
    { on = "P",         run = "paste --force",             desc = "Paste (overwrite)" },
    { on = "-",         run = "link",                      desc = "Symlink file(s)" },
    { on = "_",         run = "link --relative",           desc = "Relative symlink" },

    # Delete
    { on = "d",         run = "remove",                    desc = "Move to trash" },
    { on = "D",         run = "remove --permanently",      desc = "Delete permanently ⚠️" },
    { on = "x",         run = "remove",                    desc = "Move to trash" },

    # ── Copy Path to Clipboard ──────────────────────────────────────────────

    { on = ["y", "p"],  run = "copy path",                 desc = "Copy path" },
    { on = ["y", "d"],  run = "copy dirname",              desc = "Copy directory" },
    { on = ["y", "f"],  run = "copy filename",             desc = "Copy filename" },
    { on = ["y", "n"],  run = "copy stem",                 desc = "Copy stem (no ext)" },

    # ── View / Display ──────────────────────────────────────────────────────

    # Toggle hidden files
    { on = ".",         run = "toggle_hidden",             desc = "Toggle hidden files" },
    { on = "<C-h>",     run = "toggle_hidden",             desc = "Toggle hidden files" },

    # Sort options
    { on = [",", "m"],  run = "sort mtime --dir-first",    desc = "Sort by modified" },
    { on = [",", "M"],  run = "sort mtime --dir-first --reverse", desc = "Sort by modified (reverse)" },
    { on = [",", "c"],  run = "sort btime --dir-first",    desc = "Sort by created" },
    { on = [",", "e"],  run = "sort extension --dir-first",desc = "Sort by extension" },
    { on = [",", "a"],  run = "sort alphabetical --dir-first", desc = "Sort alphabetically" },
    { on = [",", "n"],  run = "sort natural --dir-first",  desc = "Sort naturally" },
    { on = [",", "s"],  run = "sort size --dir-first",     desc = "Sort by size" },
    { on = [",", "r"],  run = "sort --reverse",            desc = "Toggle reverse sort" },

    # Line mode
    { on = ["m", "s"],  run = "linemode size",             desc = "Show file size" },
    { on = ["m", "p"],  run = "linemode permissions",      desc = "Show permissions" },
    { on = ["m", "o"],  run = "linemode owner",            desc = "Show owner" },
    { on = ["m", "m"],  run = "linemode mtime",            desc = "Show modified time" },
    { on = ["m", "n"],  run = "linemode none",             desc = "Hide line info" },

    # ── Search ──────────────────────────────────────────────────────────────

    # fzf-style search via jump-to-char plugin
    { on = "f",         run = "plugin jump-to-char",       desc = "Jump to char" },
    { on = "F",         run = "plugin jump-to-char --args='--smart-case'", desc = "Jump to char (smart case)" },

    # Filter files
    { on = "s",         run = "plugin smart-filter",       desc = "Smart filter" },
    { on = "S",         run = "filter --smart",            desc = "Filter files" },

    # Search recursively
    { on = "/",         run = "search fd",                 desc = "Search files (fd)" },
    { on = "?",         run = "search rg",                 desc = "Search contents (rg)" },
    { on = "<C-s>",     run = "search fd",                 desc = "Search files" },
    { on = "n",         run = "find_arrow",                desc = "Next search result" },
    { on = "N",         run = "find_arrow --previous",     desc = "Previous search result" },

    # ── Bulk Operations ─────────────────────────────────────────────────────

    # Shell command
    { on = "!",         run = "shell --block",             desc = "Run shell command (block)" },
    { on = "|",         run = "shell --interactive",       desc = "Run shell interactively" },
    { on = [":", "s"],  run = "shell",                     desc = "Run shell command" },

    # Suspend yazi (go to shell, fg to return)
    { on = "<C-z>",     run = "suspend",                   desc = "Suspend yazi" },

    # ── Bulk Rename ─────────────────────────────────────────────────────────
    { on = "b",         run = "bulk-rename",               desc = "Bulk rename selected" },

    # ── ASH Integration ─────────────────────────────────────────────────────

    # Open terminal in current directory
    { on = ["<leader>", "t"],
      run = 'shell "kitty --single-instance -d \"$@\" &" --confirm',
      desc = "Open Kitty here" },

    # Copy to clipboard (using wl-copy)
    { on = ["<leader>", "c"],
      run = 'shell "wl-copy < \"$0\""',
      desc = "Copy file content to clipboard" },

    # Open with Neovim
    { on = ["<leader>", "e"],
      run = 'shell "nvim \"$@\""',
      desc = "Edit in Neovim" },

    # Extract archive
    { on = ["<leader>", "x"],
      run = 'shell "ouch decompress \"$@\""',
      desc = "Extract archive" },

    # Compress selection
    { on = ["<leader>", "z"],
      run = 'shell "ouch compress \"$@\" archive.zip"',
      desc = "Compress selection" },

    # Show disk usage
    { on = ["<leader>", "u"],
      run = 'shell "dust \"$@\" | less"',
      desc = "Show disk usage (dust)" },

    # Open git UI in current directory
    { on = ["<leader>", "g"],
      run = 'shell "kitty --single-instance -d \"$@\" -- lazygit &" --confirm',
      desc = "Open lazygit here" },

    # Set as wallpaper via ASH
    { on = ["<leader>", "w"],
      run = 'shell "ash wallpaper set \"$0\""',
      desc = "Set as wallpaper (ASH)" },

    # Apply as theme wallpaper
    { on = ["<leader>", "W"],
      run = 'shell "ash wallpaper set \"$0\" && ash theme ai-wallpaper"',
      desc = "Set wallpaper + extract theme" },

    # ── Misc ────────────────────────────────────────────────────────────────

    # Refresh / reload
    { on = "<C-l>",     run = ["escape", "reload"],        desc = "Reload & clear selection" },
    { on = "<F5>",      run = "reload",                    desc = "Reload" },

    # Escape / cancel
    { on = "<Esc>",     run = ["escape", "close"],         desc = "Cancel / Exit visual" },
    { on = "q",         run = "quit",                      desc = "Quit yazi" },
    { on = "Q",         run = "quit --no-cwd-file",        desc = "Quit (no cwd save)" },

    # ── Plugin: Git Status ──────────────────────────────────────────────────

    { on = ["g", "s"],  run = "plugin git --args='status'",  desc = "Git status" },

    # ── Plugin: Full Border ─────────────────────────────────────────────────
    # (Auto-applied via init.lua)
]

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📝  INPUT — Text input widget keybindings
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[input]

keymap = [

    # ── Confirm / Cancel ────────────────────────────────────────────────────
    { on = "<Enter>",    run = "close --submit",    desc = "Submit input" },
    { on = "<Esc>",      run = "close",             desc = "Cancel" },
    { on = "<C-c>",      run = "close",             desc = "Cancel" },

    # ── Cursor Movement ──────────────────────────────────────────────────────
    { on = "<Left>",     run = "move -1",           desc = "Move left" },
    { on = "<Right>",    run = "move 1",            desc = "Move right" },
    { on = "<C-b>",      run = "move -1",           desc = "Move left (vim)" },
    { on = "<C-f>",      run = "move 1",            desc = "Move right (vim)" },
    { on = "<Home>",     run = "move -999",         desc = "Move to start" },
    { on = "<End>",      run = "move 999",          desc = "Move to end" },
    { on = "<C-a>",      run = "move -999",         desc = "Move to start" },
    { on = "<C-e>",      run = "move 999",          desc = "Move to end" },

    # Word movement
    { on = "<A-b>",      run = "backward",          desc = "Move word left" },
    { on = "<A-f>",      run = "forward",           desc = "Move word right" },

    # ── Editing ─────────────────────────────────────────────────────────────
    { on = "<Backspace>",run = "backspace",         desc = "Delete char before" },
    { on = "<Delete>",   run = "delete",            desc = "Delete char after" },
    { on = "<C-u>",      run = "kill-line",         desc = "Delete to line start" },
    { on = "<C-k>",      run = "kill-line-end",     desc = "Delete to line end" },
    { on = "<C-w>",      run = "backspace --word",  desc = "Delete word before" },
    { on = "<A-d>",      run = "delete --word",     desc = "Delete word after" },

    # Paste from clipboard
    { on = "<C-v>",      run = "paste",             desc = "Paste from clipboard" },
    { on = "<C-y>",      run = "paste",             desc = "Paste from clipboard" },

    # ── History ─────────────────────────────────────────────────────────────
    { on = "<Up>",       run = "arrow -1",          desc = "Previous in history" },
    { on = "<Down>",     run = "arrow 1",           desc = "Next in history" },
    { on = "<C-p>",      run = "arrow -1",          desc = "Previous in history" },
    { on = "<C-n>",      run = "arrow 1",           desc = "Next in history" },

    # ── Completion ──────────────────────────────────────────────────────────
    { on = "<Tab>",      run = "complete",          desc = "Trigger completion" },
    { on = "<S-Tab>",    run = "complete --back",   desc = "Complete backwards" },
]

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔍  COMPLETION — Autocomplete widget keybindings
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[completion]

keymap = [
    { on = "<Tab>",      run = ["close --submit", "close_input --submit"], desc = "Accept" },
    { on = "<Enter>",    run = ["close --submit", "close_input --submit"], desc = "Accept" },
    { on = "<Esc>",      run = "close",             desc = "Cancel completion" },
    { on = "<C-c>",      run = "close",             desc = "Cancel completion" },
    { on = "<Up>",       run = "arrow -1",          desc = "Previous suggestion" },
    { on = "<Down>",     run = "arrow 1",           desc = "Next suggestion" },
    { on = "<C-p>",      run = "arrow -1",          desc = "Previous suggestion" },
    { on = "<C-n>",      run = "arrow 1",           desc = "Next suggestion" },
    { on = "<S-Tab>",    run = "arrow -1",          desc = "Previous suggestion" },
    { on = "<C-k>",      run = "arrow -1",          desc = "Previous suggestion" },
    { on = "<C-j>",      run = "arrow 1",           desc = "Next suggestion" },
]

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔎  SELECT — Multi-select widget keybindings
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[select]

keymap = [
    { on = "<Enter>",    run = "close --submit",    desc = "Confirm selection" },
    { on = "<Esc>",      run = "close",             desc = "Cancel" },
    { on = "<C-c>",      run = "close",             desc = "Cancel" },
    { on = "k",          run = "arrow -1",          desc = "Move up" },
    { on = "j",          run = "arrow 1",           desc = "Move down" },
    { on = "<Up>",       run = "arrow -1",          desc = "Move up" },
    { on = "<Down>",     run = "arrow 1",           desc = "Move down" },
    { on = "<C-u>",      run = "arrow -50%",        desc = "Page up" },
    { on = "<C-d>",      run = "arrow 50%",         desc = "Page down" },
    { on = "G",          run = "arrow 99999999",    desc = "Jump to bottom" },
    { on = "g",          run = "arrow -99999999",   desc = "Jump to top" },
]

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🗓️  TASKS — Task manager keybindings
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[tasks]

keymap = [
    { on = "<Esc>",      run = "close",             desc = "Close task manager" },
    { on = "q",          run = "close",             desc = "Close task manager" },
    { on = "w",          run = "inspect",           desc = "Inspect task" },
    { on = "x",          run = "cancel",            desc = "Cancel task" },
    { on = "k",          run = "arrow -1",          desc = "Previous task" },
    { on = "j",          run = "arrow 1",           desc = "Next task" },
    { on = "<Up>",       run = "arrow -1",          desc = "Previous task" },
    { on = "<Down>",     run = "arrow 1",           desc = "Next task" },
]