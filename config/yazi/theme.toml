# ║                                                                            ║
# ║  Base: Catppuccin Mocha — Auto-updated by ASH theme engine               ║
# ║  Icons: Nerd Fonts v3 required                                            ║
# ║  Colors: Format hex #rrggbb                                               ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎨  COLOR PALETTE — Catppuccin Mocha
#  ASH token: {{COLOR_*}} — replaced on theme change
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[flavor]
# Base palette (can reference custom flavor files in flavors/ dir)
# "catppuccin-mocha" | "catppuccin-latte" | "tokyonight" | ...
# ASH engine switches this via template substitution

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📋  MANAGER — File listing area
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[manager]

# Folder / directory color
folder_fg = "#89b4fa"           # Catppuccin Blue — classic dir blue

# Symbolic link — distinct teal
symlink_fg = "#94e2d5"          # Catppuccin Teal

# Executable — bright green
exec_fg    = "#a6e3a1"          # Catppuccin Green

# Named pipe / socket — yellow-orange
fifo_fg    = "#f9e2af"          # Catppuccin Yellow

# Device files (block/char) — red/orange
device_fg  = "#f38ba8"          # Catppuccin Red

# Orphaned symlink — red (broken links)
orphan_fg  = "#f38ba8"          # Catppuccin Red

# Hidden files — dimmed text
hidden_fg  = "#6c7086"          # Catppuccin Overlay0

# Regular text color
tab_active_fg   = "#cba6f7"     # Catppuccin Mauve — active tab
tab_active_bg   = "#313244"     # Catppuccin Surface0
tab_inactive_fg = "#7f849c"     # Catppuccin Overlay1
tab_inactive_bg = "#181825"     # Catppuccin Mantle
tab_width       = 1

# Border style for panels
border_fg = "#313244"           # Catppuccin Surface0

# ── Selection highlight ────────────────────────────────────────────────────
selection_fg = "#cdd6f4"        # Text — readable on selection
selection_bg = "#45475a"        # Surface1 — subtle selection

# ── Hovered item ──────────────────────────────────────────────────────────
hovered_fg = "#1e1e2e"          # Base — inverted for hover
hovered_bg = "#cba6f7"          # Mauve — accent hover

# ── Yanked / marked files ─────────────────────────────────────────────────
yanked_fg  = "#f9e2af"          # Yellow — marked for copy
yanked_bg  = "reset"

# ── Marker / cut indicator ────────────────────────────────────────────────
marker_selected_fg  = "#a6e3a1" # Green dot — selected
marker_copied_fg    = "#f9e2af" # Yellow dot — copied
marker_cut_fg       = "#f38ba8" # Red dot — cut

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📊  STATUS BAR — Bottom status line
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[status]

# Separator between status sections
separator_open  = ""           # Powerline right arrow
separator_close = ""           # Powerline left arrow
separator_style = { fg = "#45475a", bg = "#181825" }

# ── Mode indicators ────────────────────────────────────────────────────────

# Normal mode
normal_main  = { fg = "#1e1e2e", bg = "#89b4fa", bold = true }
normal_alt   = { fg = "#cdd6f4", bg = "#313244" }

# Select / Visual mode
select_main  = { fg = "#1e1e2e", bg = "#a6e3a1", bold = true }
select_alt   = { fg = "#a6e3a1", bg = "#313244" }

# Filter mode
filter_main  = { fg = "#1e1e2e", bg = "#f9e2af", bold = true }
filter_alt   = { fg = "#f9e2af", bg = "#313244" }

# Permission indicators (rwxrwxrwx)
perm_type    = { fg = "#89b4fa" }   # file/dir type char
perm_read    = { fg = "#a6e3a1" }   # r = green
perm_write   = { fg = "#fab387" }   # w = orange/peach
perm_exec    = { fg = "#f38ba8" }   # x = red
perm_sep     = { fg = "#6c7086" }   # separator

# ── File info section ──────────────────────────────────────────────────────
progress_label  = { bold = true, fg = "#cdd6f4" }
progress_normal = { fg = "#89b4fa", bg = "#181825" }
progress_error  = { fg = "#f38ba8", bg = "#181825" }

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  👁️  PREVIEW — Preview pane styling
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[preview]

# Hovered file highlight in preview
hovered_fg = "#cdd6f4"
hovered_bg = "#313244"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📝  INPUT — Text input dialog
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[input]

border_fg    = "#cba6f7"        # Mauve border for active input
title_fg     = "#cba6f7"        # Mauve title
value_fg     = "#cdd6f4"        # Text value color
selected_fg  = "#1e1e2e"        # Selected text fg
selected_bg  = "#cba6f7"        # Selected text bg — mauve

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔔  NOTIFY — Toast notification styling
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[notify]

title_info  = { fg = "#89b4fa", bold = true }   # Blue — info
title_warn  = { fg = "#f9e2af", bold = true }   # Yellow — warning
title_error = { fg = "#f38ba8", bold = true }   # Red — error

icon_info   = "󰋽 "                              # Info icon
icon_warn   = "󰀦 "                              # Warning icon
icon_error  = "󰅚 "                              # Error icon

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ✅  SELECT — Multi-select dialog
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[select]

border_fg   = "#cba6f7"         # Mauve border
title_fg    = "#cba6f7"         # Mauve title
active_fg   = "#cba6f7"         # Active item — mauve
inactive_fg = "#7f849c"         # Inactive items — muted

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📂  FILE TYPE ICONS — Nerd Fonts v3
#  Format: { fg = "#color" } for colored icons
#          { bold = true } for bold text
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[filetype]

# ── Rules: Match by extension or MIME type ────────────────────────────────

rules = [

    # ── Code — Programming languages ───────────────────────────────────────

    # Rust 
    { mime = "text/x-rust",             fg = "#fab387" },
    { name = "*.rs",                    fg = "#fab387" },

    # Python 
    { name = "*.py",                    fg = "#89b4fa" },
    { name = "*.pyw",                   fg = "#89b4fa" },
    { name = "*.pyc",                   fg = "#6c7086" },

    # JavaScript / TypeScript 
    { name = "*.js",                    fg = "#f9e2af" },
    { name = "*.mjs",                   fg = "#f9e2af" },
    { name = "*.cjs",                   fg = "#f9e2af" },
    { name = "*.ts",                    fg = "#89b4fa" },
    { name = "*.tsx",                   fg = "#74c7ec" },
    { name = "*.jsx",                   fg = "#74c7ec" },

    # Go 
    { name = "*.go",                    fg = "#74c7ec" },

    # C / C++ 
    { name = "*.c",                     fg = "#89b4fa" },
    { name = "*.h",                     fg = "#89b4fa" },
    { name = "*.cpp",                   fg = "#89b4fa" },
    { name = "*.cc",                    fg = "#89b4fa" },
    { name = "*.cxx",                   fg = "#89b4fa" },
    { name = "*.hpp",                   fg = "#89b4fa" },
    { name = "*.hxx",                   fg = "#89b4fa" },

    # Java / Kotlin / Scala 
    { name = "*.java",                  fg = "#fab387" },
    { name = "*.kt",                    fg = "#cba6f7" },
    { name = "*.kts",                   fg = "#cba6f7" },
    { name = "*.scala",                 fg = "#f38ba8" },

    # Shell 
    { name = "*.sh",                    fg = "#a6e3a1" },
    { name = "*.bash",                  fg = "#a6e3a1" },
    { name = "*.zsh",                   fg = "#a6e3a1" },
    { name = "*.fish",                  fg = "#89dceb" },
    { name = "*.nu",                    fg = "#a6e3a1" },

    # Lua 
    { name = "*.lua",                   fg = "#89b4fa" },

    # Ruby 
    { name = "*.rb",                    fg = "#f38ba8" },
    { name = "*.gemspec",               fg = "#f38ba8" },

    # PHP 
    { name = "*.php",                   fg = "#cba6f7" },

    # Swift 
    { name = "*.swift",                 fg = "#fab387" },

    # Haskell / Elixir / Zig 
    { name = "*.hs",                    fg = "#cba6f7" },
    { name = "*.ex",                    fg = "#cba6f7" },
    { name = "*.exs",                   fg = "#cba6f7" },
    { name = "*.zig",                   fg = "#fab387" },

    # Nix 
    { name = "*.nix",                   fg = "#89b4fa" },

    # Julia 
    { name = "*.jl",                    fg = "#cba6f7" },

    # R 
    { name = "*.r",                     fg = "#89b4fa" },
    { name = "*.R",                     fg = "#89b4fa" },

    # ── Web ────────────────────────────────────────────────────────────────

    { name = "*.html",                  fg = "#fab387" },
    { name = "*.htm",                   fg = "#fab387" },
    { name = "*.css",                   fg = "#89b4fa" },
    { name = "*.scss",                  fg = "#f5c2e7" },
    { name = "*.sass",                  fg = "#f5c2e7" },
    { name = "*.less",                  fg = "#89b4fa" },
    { name = "*.vue",                   fg = "#a6e3a1" },
    { name = "*.svelte",                fg = "#fab387" },
    { name = "*.astro",                 fg = "#fab387" },
    { name = "*.graphql",               fg = "#f38ba8" },
    { name = "*.gql",                   fg = "#f38ba8" },
    { name = "*.wasm",                  fg = "#cba6f7" },

    # ── Config / Data ──────────────────────────────────────────────────────

    { name = "*.toml",                  fg = "#fab387" },
    { name = "*.yaml",                  fg = "#f38ba8" },
    { name = "*.yml",                   fg = "#f38ba8" },
    { name = "*.json",                  fg = "#f9e2af" },
    { name = "*.json5",                 fg = "#f9e2af" },
    { name = "*.jsonc",                 fg = "#f9e2af" },
    { name = "*.xml",                   fg = "#fab387" },
    { name = "*.ini",                   fg = "#a6adc8" },
    { name = "*.cfg",                   fg = "#a6adc8" },
    { name = "*.conf",                  fg = "#a6adc8" },
    { name = "*.env",                   fg = "#f9e2af" },
    { name = "*.env.*",                 fg = "#f9e2af" },
    { name = "*.dotenv",                fg = "#f9e2af" },

    # ── Build / CI ────────────────────────────────────────────────────────

    { name = "Makefile",                fg = "#a6e3a1" },
    { name = "makefile",                fg = "#a6e3a1" },
    { name = "Dockerfile",              fg = "#89b4fa" },
    { name = "*.dockerfile",            fg = "#89b4fa" },
    { name = "docker-compose.yml",      fg = "#89b4fa" },
    { name = "docker-compose.yaml",     fg = "#89b4fa" },
    { name = "*.cmake",                 fg = "#89b4fa" },
    { name = "CMakeLists.txt",          fg = "#89b4fa" },
    { name = "*.gradle",                fg = "#a6e3a1" },
    { name = "*.tf",                    fg = "#cba6f7" },
    { name = "*.tfvars",                fg = "#cba6f7" },

    # ── Documents ─────────────────────────────────────────────────────────

    { name = "*.md",                    fg = "#cdd6f4" },
    { name = "*.mdx",                   fg = "#cdd6f4" },
    { name = "*.markdown",              fg = "#cdd6f4" },
    { name = "*.org",                   fg = "#a6e3a1" },
    { name = "*.rst",                   fg = "#f9e2af" },
    { name = "*.txt",                   fg = "#cdd6f4" },
    { name = "*.pdf",                   fg = "#f38ba8" },
    { name = "*.doc",                   fg = "#89b4fa" },
    { name = "*.docx",                  fg = "#89b4fa" },
    { name = "*.odt",                   fg = "#89b4fa" },
    { name = "*.xls",                   fg = "#a6e3a1" },
    { name = "*.xlsx",                  fg = "#a6e3a1" },
    { name = "*.ppt",                   fg = "#fab387" },
    { name = "*.pptx",                  fg = "#fab387" },
    { name = "*.tex",                   fg = "#a6e3a1" },
    { name = "*.epub",                  fg = "#f38ba8" },

    # ── Images ────────────────────────────────────────────────────────────

    { mime = "image/png",               fg = "#f5c2e7" },
    { mime = "image/jpeg",              fg = "#f5c2e7" },
    { mime = "image/gif",               fg = "#f5c2e7" },
    { mime = "image/webp",              fg = "#f5c2e7" },
    { mime = "image/svg+xml",           fg = "#fab387" },
    { mime = "image/avif",              fg = "#f5c2e7" },
    { mime = "image/*",                 fg = "#f5c2e7" },
    { name = "*.xcf",                   fg = "#f5c2e7" },
    { name = "*.kra",                   fg = "#f5c2e7" },
    { name = "*.psd",                   fg = "#89b4fa" },
    { name = "*.ai",                    fg = "#fab387" },

    # ── Video ─────────────────────────────────────────────────────────────

    { mime = "video/mp4",               fg = "#cba6f7" },
    { mime = "video/webm",              fg = "#cba6f7" },
    { mime = "video/x-matroska",        fg = "#cba6f7" },
    { mime = "video/*",                 fg = "#cba6f7" },
    { name = "*.mkv",                   fg = "#cba6f7" },
    { name = "*.mp4",                   fg = "#cba6f7" },
    { name = "*.avi",                   fg = "#cba6f7" },
    { name = "*.mov",                   fg = "#cba6f7" },
    { name = "*.webm",                  fg = "#cba6f7" },
    { name = "*.flv",                   fg = "#cba6f7" },
    { name = "*.gif",                   fg = "#f5c2e7" },

    # ── Audio ─────────────────────────────────────────────────────────────

    { mime = "audio/mpeg",              fg = "#89b4fa" },
    { mime = "audio/flac",              fg = "#89b4fa" },
    { mime = "audio/ogg",               fg = "#89b4fa" },
    { mime = "audio/*",                 fg = "#89b4fa" },
    { name = "*.mp3",                   fg = "#89b4fa" },
    { name = "*.flac",                  fg = "#89b4fa" },
    { name = "*.ogg",                   fg = "#89b4fa" },
    { name = "*.wav",                   fg = "#89b4fa" },
    { name = "*.opus",                  fg = "#89b4fa" },
    { name = "*.aac",                   fg = "#89b4fa" },

    # ── Archives ──────────────────────────────────────────────────────────

    { mime = "application/zip",         fg = "#f9e2af" },
    { mime = "application/x-tar",       fg = "#f9e2af" },
    { mime = "application/gzip",        fg = "#f9e2af" },
    { mime = "application/x-7z-compressed", fg = "#f9e2af" },
    { name = "*.zip",                   fg = "#f9e2af" },
    { name = "*.tar",                   fg = "#f9e2af" },
    { name = "*.tar.gz",                fg = "#f9e2af" },
    { name = "*.tar.xz",                fg = "#f9e2af" },
    { name = "*.tar.bz2",               fg = "#f9e2af" },
    { name = "*.tar.zst",               fg = "#f9e2af" },
    { name = "*.7z",                    fg = "#f9e2af" },
    { name = "*.rar",                   fg = "#f9e2af" },
    { name = "*.gz",                    fg = "#f9e2af" },
    { name = "*.xz",                    fg = "#f9e2af" },
    { name = "*.zst",                   fg = "#f9e2af" },
    { name = "*.bz2",                   fg = "#f9e2af" },
    { name = "*.deb",                   fg = "#f38ba8" },
    { name = "*.rpm",                   fg = "#f38ba8" },
    { name = "*.pkg.tar.zst",           fg = "#f9e2af" },
