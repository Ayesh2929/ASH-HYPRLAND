# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🖥️  VIDEO OUTPUT — Vulkan / OpenGL rendering pipeline
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── GPU API ───────────────────────────────────────────────────────────────────
# "gpu-next" = modern libplacebo-based renderer (RECOMMENDED for Wayland)
# "gpu"      = legacy OpenGL renderer (fallback)
vo=gpu-next

# GPU API backend
# "vulkan"   = best performance on AMD/Intel (Wayland native)
# "opengl"   = most compatible (if Vulkan unavailable)
# "auto"     = auto-select
gpu-api=vulkan

# Specific Vulkan device (leave empty for auto-select)
# vulkan-device=AMD RADV NAVI21

# Target display color space
# "bt.2020-pq" = HDR10 | "srgb" = standard SDR | "auto" = detect
target-colorspace-hint=yes

# ── Scaling Algorithms ────────────────────────────────────────────────────────
# Upscale: bilinear | bicubic | lanczos | ewa_lanczos | ewa_lanczossharp
# ewa_lanczossharp = highest quality, GPU intensive
# spline36 = good quality/performance balance
scale=ewa_lanczossharp

# Downscale (when video > display resolution)
dscale=mitchell

# Chroma upscale (4:2:0 → 4:4:4)
# "ewa_lanczos" = high quality chroma reconstruction
cscale=ewa_lanczos

# Linear light scaling (better quality at cost of speed)
linear-downscaling=yes
linear-upscaling=no

# Anti-aliasing / ringing reduction
scale-antiring=0.7
dscale-antiring=0.7
cscale-antiring=0.7

# ── Luma / Chroma ─────────────────────────────────────────────────────────────
# Correct rendering with proper sigmoidization prevents ringing
sigmoid-upscaling=yes

# ── Debanding ─────────────────────────────────────────────────────────────────
# Reduces color banding artifacts in gradients
# Especially visible in anime and compressed video
deband=yes
deband-iterations=4
deband-threshold=48
deband-range=16
deband-grain=48

# ── Dithering ─────────────────────────────────────────────────────────────────
# Reduces banding when bit-depth converting (10-bit → 8-bit display)
dither-depth=auto
dither=fruit

# ── Color Management ──────────────────────────────────────────────────────────
# ICC profile for color-accurate display (auto-detect display profile)
# icc-profile-auto=yes

# Color gamut clipping
gamut-mapping-mode=saturation

# HDR tone mapping
tone-mapping=bt.2446a
tone-mapping-param=0.0
hdr-compute-peak=yes

# ── Frame Timing ──────────────────────────────────────────────────────────────
# Video sync mode for smooth playback
# "display-resample" = best for fixed-frame displays
# "audio"            = audio-driven (most accurate timing)
video-sync=display-resample
video-sync-max-video-change=5

# Interpolation for smooth motion (requires display-resample)
# Reduces judder on 24fps content on 60Hz/144Hz displays
interpolation=yes
tscale=oversample

# ── OpenGL-specific ───────────────────────────────────────────────────────────
# opengl-es=no

# ── Wayland-specific ──────────────────────────────────────────────────────────
# Force Wayland (should be auto-detected via GDK_BACKEND/WAYLAND_DISPLAY)
# gpu-context=waylandvk

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ⚡  HARDWARE DECODING — GPU-accelerated video decoding
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Hardware decode API
# "auto-safe" = auto-select safe HW decoder (recommended)
# "auto"      = try all HW decoders
# "vaapi"     = VA-API (AMD/Intel on Linux)
# "nvdec"     = NVIDIA NVDEC
# "vulkan"    = Vulkan video decode (very new, may be unstable)
# "no"        = software decode only
hwdec=auto-safe

# Allow hardware decode for copy-back formats
# (some effects/filters require software copy)
hwdec-codecs=all

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔊  AUDIO — PipeWire + High Quality Processing
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Audio Output ──────────────────────────────────────────────────────────────
# "pipewire" = native PipeWire (best for Wayland/modern Linux)
# "pulse"    = PulseAudio compatibility layer
# "alsa"     = direct ALSA
ao=pipewire

# Audio device (empty = system default)
# audio-device=pipewire/sink_name

# ── Resampling ────────────────────────────────────────────────────────────────
# SoX resampler: highest quality audio resampling
# Ensures proper rate conversion when audio rate != device rate
audio-resample-filter-size=16
audio-resample-cutoff=0.0

# ── Volume & Dynamic Range ────────────────────────────────────────────────────
# Default volume (100 = unity gain)
volume=100

# Maximum volume boost (150% = +3.5dB headroom)
volume-max=150

# Audio normalization via MPV's dynamic loudness filter
# Prevents clipping on loud content, boosts quiet content
# af=loudnorm=I=-16:TP=-1.5:LRA=11

# Audio delay fine-tuning (milliseconds, negative = earlier)
audio-delay=0.0

# ── Audio Channels ────────────────────────────────────────────────────────────
# Upmix stereo content to 5.1 for surround systems (disable for stereo)
# audio-channels=stereo

# ── PipeWire-specific ─────────────────────────────────────────────────────────
# Target PipeWire sample rate
# pipewire-buffer=2048

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📝  SUBTITLES — Premium rendering engine
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Font Settings ─────────────────────────────────────────────────────────────
# Primary subtitle font (uses system fonts via fontconfig)
# Premium: Inter for clean readability
sub-font=Inter
sub-font-size=42

# ── Border & Shadow ───────────────────────────────────────────────────────────
# Bold border for readability on bright backgrounds
sub-border-size=2.5
sub-border-color=0.0/0.0/0.0/0.85

# Drop shadow for depth
sub-shadow-offset=2
sub-shadow-color=0.0/0.0/0.0/0.6

# ── Colors ────────────────────────────────────────────────────────────────────
# Catppuccin Text white (#cdd6f4) for subtitle text
sub-color=0.804/0.839/0.957/1.0

# Background box (improves readability on complex backgrounds)
sub-back-color=0.0/0.0/0.0/0.0

# ── Position & Margins ────────────────────────────────────────────────────────
# Bottom margin from screen edge (pixels)
sub-margin-y=36
sub-margin-x=100

# Scale with window size
sub-scale=1.0
sub-scale-by-window=yes
sub-scale-with-window=yes

# ── Ass/SSA Rendering ─────────────────────────────────────────────────────────
# Respect ASS subtitle styles from the file
ass-style-overrides=
ass-hinting=none
ass-line-spacing=0
ass-shaper=complex

# ── Subtitle Seeking ──────────────────────────────────────────────────────────
# Demux on subtitle-only streams for external SRT/ASS
sub-auto=fuzzy
sub-file-paths=sub:subs:subtitles:Subs:Subtitles:Sub

# Preferred subtitle languages (comma-separated)
slang=en,eng,english

# ── External Subtitle Encoding ────────────────────────────────────────────────
sub-codepage=utf-8

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎛️  OSD — On-Screen Display (Catppuccin Mocha themed)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── OSD Bar ───────────────────────────────────────────────────────────────────
# Duration OSD shows for key events (ms)
osd-duration=2000

# OSD level: 0=none | 1=volume+seek | 2=+chapter | 3=+time
osd-level=1

# ── OSD Font ──────────────────────────────────────────────────────────────────
osd-font=Inter
osd-font-size=36
osd-bold=yes

# ── OSD Colors — Catppuccin Mocha palette ─────────────────────────────────────
# Text — Catppuccin Text #cdd6f4
osd-color=0.804/0.839/0.957/1.0

# Border — Catppuccin Crust #11111b (near-black)
osd-border-color=0.067/0.067/0.106/0.92

# Border thickness
osd-border-size=2

# Shadow
osd-shadow-color=0.067/0.067/0.106/0.85
osd-shadow-offset=1

# ── Progress Bar ──────────────────────────────────────────────────────────────
# Bar dimensions
osd-bar-w=85
osd-bar-h=2.8

# Bar position (0=top, 100=bottom)
osd-bar-align-y=0.95
osd-bar-align-x=0

# ── Status Line Format ────────────────────────────────────────────────────────
# Shown when pressing 'i' (show-progress)
osd-playing-msg=
osd-status-msg=${time-pos} / ${duration}${?percent-pos: (${percent-pos}%)}${?chapter:  • ${chapter}}

# ── Seek Bar Alignment ────────────────────────────────────────────────────────
osd-msg1=

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🖼️  WINDOW — Display and windowing behavior
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Window Title ──────────────────────────────────────────────────────────────
# Format: "mpv — filename [resolution]"
title=${media-title} — ${filename} [${video-params/w}×${video-params/h}]

# ── Window Geometry ───────────────────────────────────────────────────────────
# Default window size (can be overridden per-profile)
# geometry=1280x720
# autofit=80%
# autofit-larger=1920x1080

# Keep window on top
# ontop=yes

# Save window position between sessions
save-position-on-quit=yes

# ── Decorations ───────────────────────────────────────────────────────────────
# Borderless (Hyprland handles window chrome)
border=yes

# Keep aspect ratio when resizing
keepaspect=yes
keepaspect-window=yes

# ── Fullscreen ────────────────────────────────────────────────────────────────
# Start in fullscreen
# fullscreen=yes

# ── Background ────────────────────────────────────────────────────────────────
# Window background when no video — Catppuccin Base #1e1e2e
background=0.118/0.118/0.180/1.0

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ⚙️  PLAYBACK — Core playback behavior
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Seeking ───────────────────────────────────────────────────────────────────
# Seek mode: "exact" = frame-accurate | "fast" = keyframe | "default"
hr-seek=yes
hr-seek-framedrop=yes

# ── Loop ──────────────────────────────────────────────────────────────────────
# Loop file: no | inf | N (times)
loop-file=no
loop-playlist=no

# ── Pause ─────────────────────────────────────────────────────────────────────
# Pause on start
# pause=yes

# ── Playlist ──────────────────────────────────────────────────────────────────
# Auto-load adjacent files into playlist
autocreate-playlist=filter

# ── Audio / Video Language Preference ────────────────────────────────────────
alang=en,eng,english,jpn,ja,japanese
slang=en,eng,english

# ── Deinterlacing ────────────────────────────────────────────────────────────
# Only deinterlace when content is actually interlaced
deinterlace=auto

# ── Speed ────────────────────────────────────────────────────────────────────
# Playback speed (1.0 = normal)
speed=1.0

# ── Frame Drop ───────────────────────────────────────────────────────────────
# Drop frames to maintain sync (use sparingly)
framedrop=vo

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  💾  CACHE — Buffering for smooth streaming
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Enable cache
cache=yes

# Disk cache (MiB)
cache-on-disk=yes
# cache-dir=/tmp/mpv-cache

# RAM cache (MiB) — 512MB for comfortable streaming
cache-default=512

# Seconds to buffer before playback
cache-secs=10

# Pause when cache runs out (vs stuttering)
cache-pause=yes
cache-pause-wait=3

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🌐  NETWORK — Streaming configuration
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Network timeout (seconds)
network-timeout=30

# User agent for HTTP requests
user-agent=Mozilla/5.0 (X11; Linux x86_64; rv:109.0) Gecko/20100101 Firefox/115.0

# Referrer URL (for sites that check)
# referrer=https://www.youtube.com

# TLS verification
tls-verify=yes

# ── yt-dlp Integration ────────────────────────────────────────────────────────
# Use yt-dlp for stream extraction (YouTube, Twitch, etc.)
script-opts-append=ytdl_hook-ytdl_path=yt-dlp
script-opts-append=ytdl_hook-use_manifests=no

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📸  SCREENSHOTS — High-quality capture
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Screenshot format: "png" | "jpg" | "webp"
screenshot-format=png

# PNG compression level (0=none, 9=max) — 7 = good balance
screenshot-png-compression=7

# JPEG/WebP quality
screenshot-jpeg-quality=92
screenshot-webp-lossless=yes

# Screenshot directory
screenshot-directory=~/Pictures/mpv

# Filename pattern — includes timestamp and media title
screenshot-template=%F_%P_%n

# Whether to include subtitles in screenshot
screenshot-tag-colorspace=yes

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎭  PROFILES — Context-specific settings
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Anime Profile ─────────────────────────────────────────────────────────────
# Optimized for 2D animation content
[anime]
profile-desc=Anime: optimized for 2D animation
# Better deband settings for flat colors
deband=yes
deband-iterations=4
deband-threshold=64
deband-range=16
deband-grain=8
# Reduce ringing on crisp edges
scale=ewa_lanczossharp
scale-antiring=0.8
# Sharper look for cel animation
sharpen=0

# ── Low-end Profile ───────────────────────────────────────────────────────────
# For weaker hardware or background playback
[low-end]
profile-desc=Low-end: CPU-friendly settings
hwdec=auto
scale=bilinear
dscale=bilinear
cscale=bilinear
deband=no
interpolation=no
video-sync=audio
vo=gpu

# ── High-quality Profile ──────────────────────────────────────────────────────
# Maximum quality, high GPU load
[high-quality]
profile-desc=High-quality: maximum quality settings
scale=ewa_lanczossharp
dscale=mitchell
cscale=ewa_lanczos
scale-antiring=0.8
deband=yes
deband-iterations=4
deband-threshold=64
deband-range=16
deband-grain=64
sigmoid-upscaling=yes
correct-downscaling=yes

# ── Protocol-based Auto-Profiles ──────────────────────────────────────────────
[protocol.http]
profile-desc=HTTP streaming settings
# Lower quality for network streams to reduce buffering
cache=yes
cache-pause=yes

[protocol.https]
profile=protocol.http

[protocol.ytdl]
profile-desc=yt-dlp stream settings
cache=yes

# ── Extension-based Auto-Profiles ─────────────────────────────────────────────
[extension.gif]
profile-desc=GIF files
loop-file=inf
osd-level=0

[extension.mp3]
profile-desc=Audio files
video=no
force-window=no
osd-level=0

[extension.flac]
profile=extension.mp3

[extension.ogg]
profile=extension.mp3

[extension.wav]
profile=extension.mp3

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔌  SCRIPTS — Loaded scripts configuration
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Script options via script-opts
# Format: script_name-option=value

# ── autosubsync options ────────────────────────────────────────────────────────
script-opts-append=autosubsync-autoload=no
script-opts-append=autosubsync-ffsubsync_path=ffsubsync
script-opts-append=autosubsync-alass_path=alass
script-opts-append=autosubsync-prefer_alass=yes

# ── quality-menu options ──────────────────────────────────────────────────────
script-opts-append=quality_menu-auto_select=yes
script-opts-append=quality_menu-ytdl_path=yt-dlp
script-opts-append=quality_menu-start_level=1080p60
script-opts-append=quality_menu-selected_color=00ff00
script-opts-append=quality_menu-osd_color=cba6f7

# ── thumbnail options ─────────────────────────────────────────────────────────
script-opts-append=thumbnail-enabled=yes
script-opts-append=thumbnail-thumbnail_width=288
script-opts-append=thumbnail-thumbnail_height=162
script-opts-append=thumbnail-spawn_first=yes
script-opts-append=thumbnail-network=yes
script-opts-append=thumbnail-remote_direct_stream=yes

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔧  MISCELLANEOUS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Console / Log ─────────────────────────────────────────────────────────────
# Log level: "no" | "fatal" | "error" | "warn" | "info" | "v" | "debug"
msg-level=all=warn

# ── Input ─────────────────────────────────────────────────────────────────────
# Allow keyboard media keys
input-media-keys=yes

# Grab keyboard focus when window appears
input-focus-follows-mouse=yes

# Right-click context menu (mpv.conf-based, limited)
# input-right-click-modifier=none

# ── Terminal / REPL ───────────────────────────────────────────────────────────
# Rich terminal output
term-osd-bar=yes
term-osd-bar-chars=[━━ ]
term-status-msg=${time-pos} / ${duration} (${percent-pos}%)

# ── IPC Socket ────────────────────────────────────────────────────────────────
# Enables external control via socket
# ash-cli integration uses this for media control
input-ipc-server=/tmp/mpv-socket

# ── Watch Later ───────────────────────────────────────────────────────────────
# Remember playback position
save-position-on-quit=yes
watch-later-options=start,vid,aid,sid

# Watch later directory
# watch-later-dir=~/.local/share/mpv/watch_later