# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🔥 ASH DOTFILES v5.0 OMEGA — PIP CONFIG ULTRA                             ║
# ║  🐍 Package index • Mirrors • Cache • Security • Performance                ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# Locations pip reads this file from:
#   Linux:  ~/.config/pip/pip.conf  (XDG) or ~/.pip/pip.conf
#   macOS:  ~/Library/Application Support/pip/pip.conf
#   Global: /etc/pip.conf or /etc/xdg/pip/pip.conf
#
# Override per-project with: .pip/pip.conf or PIP_* environment variables

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🌐  GLOBAL SETTINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[global]

# ── Index ──────────────────────────────────────────────────────────────────────
# Primary package index
index-url = https://pypi.org/simple/

# Additional package indexes (searched in order)
# Useful for private/corporate packages
# extra-index-url =
#     https://private.example.com/simple/
#     https://corp.example.com/pypi/simple/

# Find links — local directory or URL for packages
# find-links =
#     /home/user/packages
#     https://packages.example.com/

# ── Cache ──────────────────────────────────────────────────────────────────────
# Wheel cache directory (avoids re-downloading packages)
cache-dir = ~/.cache/pip

# ── Timeouts ───────────────────────────────────────────────────────────────────
# Connection timeout (seconds)
timeout = 60

# ── Retries ────────────────────────────────────────────────────────────────────
# Number of retries on download failure
retries = 5

# ── SSL ────────────────────────────────────────────────────────────────────────
# Verify SSL certificates (NEVER set to false in production)
# cert = /path/to/custom-ca-bundle.pem

# ── Trusted hosts ──────────────────────────────────────────────────────────────
# Skip SSL verification for specific hosts (use with caution)
# trusted-host =
#     private.example.com
#     corp.example.com

# ── Progress ──────────────────────────────────────────────────────────────────
# Progress bar style: off | on | pretty | emoji | ascii | bar
progress-bar = pretty

# ── Verbosity ─────────────────────────────────────────────────────────────────
# Verbosity level: 0 (quiet) to 3 (debug)
# verbose = 0
# quiet = 0

# ── Color output ──────────────────────────────────────────────────────────────
# Colored output (auto | always | never)
# color = auto

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📦  INSTALL SETTINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[install]

# ── User installs ──────────────────────────────────────────────────────────────
# Install to user site-packages (~/.local/lib/python/site-packages)
# Avoids needing root/sudo for installs
# (Note: use virtual environments instead for project isolation)
user = false

# ── Upgrade strategy ──────────────────────────────────────────────────────────
# upgrade-strategy: eager | only-if-needed
upgrade-strategy = only-if-needed

# ── Build isolation ────────────────────────────────────────────────────────────
# Build packages in isolated environment (PEP 517)
# Prevents build system pollution
# isolated = true

# ── Pre-releases ──────────────────────────────────────────────────────────────
# Install pre-release versions
pre = false

# ── Compile .pyc files ────────────────────────────────────────────────────────
compile = true

# ── Strip extras ──────────────────────────────────────────────────────────────
# Which extras to install (default: all required)
# no-deps = false

# ── Prefix ────────────────────────────────────────────────────────────────────
# Root path for install (useful for Docker images)
# root = /

# ── Target ────────────────────────────────────────────────────────────────────
# Install into this directory (overrides --prefix and --user)
# target = /path/to/install/dir

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔒  SECURITY SETTINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[security]

# Require hashes for all packages (supply chain security)
# Enable this for production environments
# require-hashes = true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔍  FREEZE SETTINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[freeze]
# Don't include locally installed editable packages in freeze output
# all = false

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📋  LIST SETTINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[list]
# Output format: columns | freeze | json | tree
format = columns

# Show outdated packages with latest version
# (use: pip list --outdated)

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔎  SEARCH SETTINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[search]
# Index to search (default: PyPI)
index = https://pypi.org/pypi

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔧  WHEEL SETTINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[wheel]
# Wheel build directory
# wheel-dir = ~/.cache/pip/wheels

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📡  DOWNLOAD SETTINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[download]
# Default download directory
# dest = ~/Downloads/pip