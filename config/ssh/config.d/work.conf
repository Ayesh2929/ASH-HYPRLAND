# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  🔥 ASH DOTFILES v5.0 — SSH WORK HOSTS                                     ║
# ║  💼 Corporate • Staging • Production • CI/CD • Bastion                      ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔑  WORK IDENTITY (override global)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# All work hosts use the work SSH key
Host *.work.example.com work-* staging-* prod-* bastion
    IdentityFile                        ~/.ssh/id_ed25519_work
    IdentitiesOnly                      yes
    User                                your-username
    ServerAliveInterval                 60
    ServerAliveCountMax                 5

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🛡️  BASTION / JUMP HOST
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Primary bastion host (jump server)
Host bastion
    HostName                            bastion.work.example.com
    User                                your-username
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_work
    IdentitiesOnly                      yes
    ForwardAgent                        yes
    ServerAliveInterval                 30
    ServerAliveCountMax                 10
    # No multiplexing on bastion (security)
    ControlMaster                       no

# Secondary bastion (DR region)
Host bastion-dr
    HostName                            bastion-dr.work.example.com
    User                                your-username
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_work
    IdentitiesOnly                      yes
    ForwardAgent                        yes
    ControlMaster                       no

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🧪  DEVELOPMENT ENVIRONMENT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Dev cluster (via bastion)
Host work-dev
    HostName                            dev.internal.example.com
    User                                your-username
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_work
    IdentitiesOnly                      yes
    ProxyJump                           bastion
    ForwardAgent                        yes

# Dev Kubernetes API server (via bastion)
Host work-k8s-dev
    HostName                            k8s-dev.internal.example.com
    User                                your-username
    Port                                6443
    IdentityFile                        ~/.ssh/id_ed25519_work
    IdentitiesOnly                      yes
    ProxyJump                           bastion
    LocalForward                        6443 k8s-dev.internal.example.com:6443
    ExitOnForwardFailure                yes

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🧪  STAGING ENVIRONMENT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

Host staging-app-*
    User                                your-username
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_work
    IdentitiesOnly                      yes
    ProxyJump                           bastion
    ForwardAgent                        no
    ServerAliveInterval                 60

Host staging-db-*
    User                                your-username
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_work
    IdentitiesOnly                      yes
    ProxyJump                           bastion
    ForwardAgent                        no
    # DB tunnel example: ssh -L 5432:localhost:5432 staging-db-01
    LocalForward                        5432 localhost:5432

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🚀  PRODUCTION ENVIRONMENT (high security)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

Host prod-*
    User                                your-username
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_work_prod
    IdentitiesOnly                      yes
    ProxyJump                           bastion
    ForwardAgent                        no
    # Strict for production
    StrictHostKeyChecking               yes
    ServerAliveInterval                 30
    ServerAliveCountMax                 3
    # No multiplexing in prod (security + auditability)
    ControlMaster                       no
    # Log everything for prod
    LogLevel                            INFO

Host prod-app-01
    HostName                            prod-app-01.internal.example.com
    User                                your-username
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_work_prod
    IdentitiesOnly                      yes
    ProxyJump                           bastion

Host prod-app-02
    HostName                            prod-app-02.internal.example.com
    User                                your-username
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_work_prod
    IdentitiesOnly                      yes
    ProxyJump                           bastion

Host prod-db-primary
    HostName                            prod-db-primary.internal.example.com
    User                                your-username
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_work_prod
    IdentitiesOnly                      yes
    ProxyJump                           bastion
    # Postgres forward
    LocalForward                        15432 localhost:5432

Host prod-db-replica
    HostName                            prod-db-replica.internal.example.com
    User                                your-username
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_work_prod
    IdentitiesOnly                      yes
    ProxyJump                           bastion
    # Replica forward
    LocalForward                        15433 localhost:5432

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ☁️  CLOUD PROVIDERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# AWS EC2 (via SSM — no direct SSH needed, but keeping for compatibility)
Host *.amazonaws.com
    User                                ec2-user
    IdentityFile                        ~/.ssh/id_ed25519_aws
    IdentitiesOnly                      yes
    ServerAliveInterval                 30
    # Use SSM proxy for AWS:
    # ProxyCommand sh -c "aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters 'portNumber=%p'"

# AWS EC2 via SSM (no direct port)
Host i-* mi-*
    User                                ec2-user
    IdentityFile                        ~/.ssh/id_ed25519_aws
    IdentitiesOnly                      yes
    ProxyCommand                        sh -c "aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters 'portNumber=%p'"

# GCP Compute Engine
Host *.googleapis.com
    User                                your-username
    IdentityFile                        ~/.ssh/id_ed25519_gcp
    IdentitiesOnly                      yes
    # Use gcloud compute ssh for GCP IAP:
    # ProxyCommand gcloud compute start-iap-tunnel %h %p --listen-on-stdin --project=PROJECT

# DigitalOcean
Host *.do.example.com
    User                                your-username
    IdentityFile                        ~/.ssh/id_ed25519_work
    IdentitiesOnly                      yes

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔄  CI/CD SERVICES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# GitLab CI deploy key
Host deploy-gitlab
    HostName                            gitlab.com
    User                                git
    IdentityFile                        ~/.ssh/id_ed25519_deploy
    IdentitiesOnly                      yes

# Internal GitLab instance
Host gitlab.work.example.com
    User                                git
    IdentityFile                        ~/.ssh/id_ed25519_work
    IdentitiesOnly                      yes
    ProxyJump                           bastion

# Work GitHub Enterprise
Host github.work.example.com
    User                                git
    IdentityFile                        ~/.ssh/id_ed25519_work
    IdentitiesOnly                      yes