# ║  🔥 ASH DOTFILES v5.0 — SSH PERSONAL HOSTS                                 ║
# ║  🏠 Home lab • Personal VPS • Self-hosted services                          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🏠  HOME LAB — Local network
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Primary homelab server (Raspberry Pi / NAS / mini PC)
Host homelab
    HostName                            192.168.1.100
    User                                ash
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_homelab
    IdentitiesOnly                      yes
    ForwardAgent                        yes
    # Faster for local network
    Compression                         no
    ServerAliveInterval                 30
    ServerAliveCountMax                 5

# Raspberry Pi cluster
Host rpi1
    HostName                            192.168.1.101
    User                                pi
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_homelab
    IdentitiesOnly                      yes
    Compression                         no

Host rpi2
    HostName                            192.168.1.102
    User                                pi
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_homelab
    IdentitiesOnly                      yes
    Compression                         no

Host rpi3
    HostName                            192.168.1.103
    User                                pi
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_homelab
    IdentitiesOnly                      yes
    Compression                         no

# NAS / Synology / TrueNAS
Host nas
    HostName                            192.168.1.200
    User                                admin
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_homelab
    IdentitiesOnly                      yes
    Compression                         no

# Router / pfSense / OpenWrt
Host router
    HostName                            192.168.1.1
    User                                root
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_homelab
    IdentitiesOnly                      yes
    StrictHostKeyChecking               no
    Compression                         no

# k3s homelab master
Host k3s-master
    HostName                            192.168.1.110
    User                                ash
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_homelab
    IdentitiesOnly                      yes
    ForwardAgent                        yes
    Compression                         no

# k3s homelab workers (wildcard)
Host k3s-worker-*
    User                                ash
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_homelab
    IdentitiesOnly                      yes
    Compression                         no
    ProxyJump                           k3s-master

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ☁️  PERSONAL VPS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Primary VPS (Hetzner / DigitalOcean / Vultr / etc.)
Host vps
    HostName                            YOUR_VPS_IP
    User                                ash
    Port                                2222
    IdentityFile                        ~/.ssh/id_ed25519_vps
    IdentitiesOnly                      yes
    ForwardAgent                        no
    ServerAliveInterval                 60
    ServerAliveCountMax                 3

# Backup VPS
Host vps-backup
    HostName                            YOUR_BACKUP_VPS_IP
    User                                ash
    Port                                2222
    IdentityFile                        ~/.ssh/id_ed25519_vps
    IdentitiesOnly                      yes

# Personal domain / web server
Host web
    HostName                            YOUR_WEB_SERVER_IP
    User                                ash
    Port                                2222
    IdentityFile                        ~/.ssh/id_ed25519_vps
    IdentitiesOnly                      yes
    # Port forward for dev: ssh -L 8080:localhost:80 web
    LocalForward                        0.0.0.0:8080 localhost:80

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔒  TUNNELS & PORT FORWARDS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# SSH tunnel to home lab from anywhere (via VPS)
Host homelab-tunnel
    HostName                            YOUR_VPS_IP
    User                                ash
    Port                                2222
    IdentityFile                        ~/.ssh/id_ed25519_vps
    IdentitiesOnly                      yes
    # Forward homelab SSH through VPS
    LocalForward                        2222 192.168.1.100:22
    ExitOnForwardFailure                yes

# Reverse tunnel (homelab behind NAT → accessible via VPS)
# Run on homelab: ssh -R 2222:localhost:22 vps-reverse
Host vps-reverse
    HostName                            YOUR_VPS_IP
    User                                ash
    Port                                2222
    IdentityFile                        ~/.ssh/id_ed25519_vps
    IdentitiesOnly                      yes
    RemoteForward                       2222 localhost:22
    ExitOnForwardFailure                yes

# SOCKS proxy through VPS (for browsing)
Host vps-socks
    HostName                            YOUR_VPS_IP
    User                                ash
    Port                                2222
    IdentityFile                        ~/.ssh/id_ed25519_vps
    IdentitiesOnly                      yes
    DynamicForward                      1080
    ExitOnForwardFailure                yes

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎮  GAMING SERVERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

Host gameserver
    HostName                            YOUR_GAME_SERVER_IP
    User                                ash
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_vps
    IdentitiesOnly                      yes
    ServerAliveInterval                 30