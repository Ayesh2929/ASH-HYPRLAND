# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🗃️  MANAGED SERVICES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Managed Postgres (via SSH tunnel)
Host db-tunnel
    HostName                            YOUR_DB_BASTION_IP
    User                                ash
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_servers
    IdentitiesOnly                      yes
    LocalForward                        5432 db.internal.example.com:5432
    ExitOnForwardFailure                yes
    ServerAliveInterval                 30

# Managed Redis
Host redis-tunnel
    HostName                            YOUR_REDIS_BASTION_IP
    User                                ash
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_servers
    IdentitiesOnly                      yes
    LocalForward                        6379 redis.internal.example.com:6379
    ExitOnForwardFailure                yes

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🔄  REVERSE TUNNELS & PERSISTENT SERVICES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Persistent reverse tunnel (for accessing home from anywhere)
# Run: ssh -fNT reverse-tunnel
Host reverse-tunnel
    HostName                            YOUR_VPS_IP
    User                                ash
    Port                                2222
    IdentityFile                        ~/.ssh/id_ed25519_servers
    IdentitiesOnly                      yes
    RemoteForward                       19922 localhost:22
    ServerAliveInterval                 30
    ServerAliveCountMax                 3
    ExitOnForwardFailure                yes

# SOCKS5 proxy server (browse through server)
Host socks-proxy
    HostName                            YOUR_VPS_IP
    User                                ash
    Port                                2222
    IdentityFile                        ~/.ssh/id_ed25519_servers
    IdentitiesOnly                      yes
    DynamicForward                      127.0.0.1:9050
    ServerAliveInterval                 30

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🌐  SFTP / FILE TRANSFER HOSTS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

Host sftp-backup
    HostName                            backup.example.com
    User                                backup-user
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_backup
    IdentitiesOnly                      yes
    # Subsystem is an sshd_config directive, not valid in ssh_config
    # Subsystem                         sftp /usr/lib/openssh/sftp-server

# Rsync.net
Host rsync.net
    User                                YOUR_RSYNC_USER
    IdentityFile                        ~/.ssh/id_ed25519_backup
    IdentitiesOnly                      yes

# BorgBase
Host *.repo.borgbase.com
    User                                YOUR_BORGBASE_USER
    IdentityFile                        ~/.ssh/id_ed25519_backup
    IdentitiesOnly                      yes

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🐳  CONTAINER / KUBERNETES HOSTS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Remote Docker host
Host docker-remote
    HostName                            YOUR_DOCKER_HOST_IP
    User                                ash
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_servers
    IdentitiesOnly                      yes
    # Forward Docker socket
    LocalForward                        2375 /var/run/docker.sock

# Kubernetes API via SSH tunnel
Host k8s-tunnel
    HostName                            YOUR_K8S_BASTION_IP
    User                                ash
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_servers
    IdentitiesOnly                      yes
    LocalForward                        6443 k8s-api.internal.example.com:6443
    ExitOnForwardFailure                yes