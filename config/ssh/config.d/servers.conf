# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🗄️  DEDICATED / BARE METAL
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Primary dedicated server (Hetzner / OVH / Kimsufi)
Host dedi-01
    HostName                            YOUR_DEDI_IP
    User                                root
    Port                                2222
    IdentityFile                        ~/.ssh/id_ed25519_servers
    IdentitiesOnly                      yes
    ServerAliveInterval                 60
    ServerAliveCountMax                 5
    ForwardAgent                        no
    LogLevel                            INFO

# Secondary / backup dedicated
Host dedi-02
    HostName                            YOUR_DEDI_2_IP
    User                                root
    Port                                2222
    IdentityFile                        ~/.ssh/id_ed25519_servers
    IdentitiesOnly                      yes
    ServerAliveInterval                 60

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
