# Hetzner cloud servers
Host hetzner-*
    User                                ash
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_servers
    IdentitiesOnly                      yes
    ServerAliveInterval                 60

Host hetzner-web
    HostName                            YOUR_HETZNER_WEB_IP
    User                                ash
    Port                                22
    IdentityFile                        ~/.ssh/id_ed25519_servers
    IdentitiesOnly                      yes

Host hetzner-db
