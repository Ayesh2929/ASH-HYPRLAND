# ── Default Colors ────────────────────────────────────────────────────────────

# Main background — Catppuccin Base
set default-bg                  "#1e1e2e"

# Main foreground — Catppuccin Text
set default-fg                  "#cdd6f4"

# ── Statusbar ─────────────────────────────────────────────────────────────────

# Statusbar background — Catppuccin Mantle (slightly darker than base)
set statusbar-fg                "#cdd6f4"
set statusbar-bg                "#181825"

# ── Inputbar ──────────────────────────────────────────────────────────────────

# Command input bar (at bottom when typing :command)
set inputbar-fg                 "#cdd6f4"
set inputbar-bg                 "#313244"

# ── Notifications ─────────────────────────────────────────────────────────────

# Normal notification
set notification-fg             "#cdd6f4"
set notification-bg             "#313244"

# Warning notification — Catppuccin Yellow
set notification-warning-fg     "#f9e2af"
set notification-warning-bg     "#313244"

# Error notification — Catppuccin Red
set notification-error-fg       "#f38ba8"
set notification-error-bg       "#313244"

# ── Completion Menu ───────────────────────────────────────────────────────────

# Completion popup background — Catppuccin Surface0
set completion-fg               "#cdd6f4"
set completion-bg               "#313244"

# Completion group headers — Catppuccin Overlay1
set completion-group-fg         "#7f849c"
set completion-group-bg         "#1e1e2e"

# Completion highlighted item — Catppuccin Mauve
set completion-highlight-fg     "#1e1e2e"
set completion-highlight-bg     "#cba6f7"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  📄  DOCUMENT COLORS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Recolor (Dark Mode Conversion) ────────────────────────────────────────────
# When recolor is enabled, document colors are replaced:
# - White/light backgrounds → recolor-darkcolor
# - Black/dark text → recolor-lightcolor

# Document background color (replaces white)
# Catppuccin Base — comfortable dark reading background
set recolor-darkcolor           "#1e1e2e"

# Document foreground/text color (replaces black)
# Catppuccin Text — high contrast readable text
set recolor-lightcolor          "#cdd6f4"

# ── Search Highlighting ───────────────────────────────────────────────────────

# Search result highlight background — Catppuccin Yellow (warm, visible)
set highlight-color             "#f9e2af40"

# Active/focused search match — Catppuccin Peach (distinct from others)
set highlight-active-color      "#fab38780"

# ── Selection ─────────────────────────────────────────────────────────────────

# Text selection color — Catppuccin Mauve with transparency
set selection-clipboard         clipboard

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
