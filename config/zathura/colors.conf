# Index panel background — Catppuccin Mantle
set index-fg                    "#cdd6f4"
set index-bg                    "#181825"

# Index active item (current page) — Catppuccin Mauve accent
set index-active-fg             "#1e1e2e"
set index-active-bg             "#cba6f7"

