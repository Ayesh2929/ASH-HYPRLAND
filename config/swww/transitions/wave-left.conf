#!/usr/bin/env bash
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — SWWW TRANSITION PRESET: WAVE-LEFT               ║
# ║  Sinusoidal wipe sweep rightward — organic, fluid, ocean-motion aesthetic  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  PRESET OVERVIEW                                                             │
# │                                                                              │
# │  TYPE:      wave  (sinusoidal boundary wipe)                                │
# │  ANGLE:     0°    (wave sweeps left-to-right, LTR forward direction)        │
# │  CHARACTER: Fluid, organic, oceanic, rhythmic — nature in motion            │
# │  BEST FOR:  Nature themes, ocean wallpapers, lofi/chill setups, any theme  │
# │             where rigidity of a linear wipe would feel harsh               │
# │  GPU COST:  Low-Medium — sinusoidal boundary computed per scanline          │
# │                                                                              │
# │  VISUAL DESCRIPTION:                                                         │
# │  Unlike a straight-edge wipe, the wave transition uses a sinusoidal curve   │
# │  as the dividing boundary between old and new wallpaper.                   │
# │  The undulating boundary sweeps from the LEFT edge to the RIGHT edge,      │
# │  creating the visual impression of a wave washing across the screen.       │
# │  The boundary oscillates vertically as it advances horizontally.           │
# │                                                                              │
# │  WAVE GEOMETRY DIAGRAM:                                                      │
# │  ╔══════════════════════════════════════════════════════════════════╗        │
# │  ║  NEW  │╲    OLD   OLD   OLD   OLD   OLD   OLD   OLD   OLD       ║        │
# │  ║  NEW  │ ╰╮  OLD   OLD   OLD   OLD   OLD   OLD   OLD   OLD       ║        │
# │  ║  NEW  │  ╰─╮ OLD  OLD   OLD   OLD   OLD   OLD   OLD   OLD       ║        │
# │  ║  NEW  │    ╰╮OLD  OLD   OLD   OLD   OLD   OLD   OLD   OLD       ║        │
# │  ║  NEW  │     ╰─╮   OLD   OLD   OLD   OLD   OLD   OLD   OLD       ║        │
# │  ║  NEW  │       ╰╮  OLD   OLD   OLD   OLD   OLD   OLD   OLD       ║        │
# │  ║  NEW  │        ╰─╮ OLD  OLD   OLD   OLD   OLD   OLD   OLD       ║        │
# │  ║  NEW  │          ╰╮     OLD   OLD   OLD   OLD   OLD   OLD       ║        │
# │  ║  NEW  │           ╰─╮   OLD   OLD   OLD   OLD   OLD   OLD       ║        │
# │  ╚══════════════════════════════════════════════════════════════════╝        │
# │  ↑ wave boundary (sinusoidal) sweeps rightward →→→                         │
# │                                                                              │
# │  WAVE PARAMETERS (SWWW_WAVE):                                               │
# │  Format: "width,height"                                                     │
# │    width  = horizontal wavelength (px) — how wide each wave cycle is       │
# │    height = vertical amplitude (px) — how tall the wave peaks are           │
# │                                                                              │
# │  WAVE CHARACTER GUIDE:                                                       │
# │  ┌──────────────┬────────────┬──────────────────────────────────────────┐  │
# │  │ WAVE SETTING │ CHARACTER  │ BEST FOR                                  │  │
# │  ├──────────────┼────────────┼──────────────────────────────────────────┤  │
# │  │ "10,10"      │ Ripple     │ Soft rain, subtle texture, quiet change  │  │
# │  │ "20,20"      │ Gentle     │ General use, most themes                 │  │
# │  │ "40,60"      │ Ocean      │ Nature themes, water wallpapers          │  │
# │  │ "80,120"     │ Dramatic   │ Stormy seas, large dramatic changes      │  │
# │  │ "200,40"     │ Wide swell │ Long rolling swells, panoramic themes    │  │
# │  │ "15,180"     │ Tall spike │ Jagged lightning-bolt boundary           │  │
# │  └──────────────┴────────────┴──────────────────────────────────────────┘  │
# │                                                                              │
# │  RELATIONSHIP TO WIPE-RIGHT:                                                │
# │  wave-left uses angle=0° (same direction as wipe-right) but replaces       │
# │  the straight wipe boundary with a sinusoidal curve.                       │
# │  The "left" in the name refers to the wave origin (left edge of screen).   │
# └─────────────────────────────────────────────────────────────────────────────┘

set -euo pipefail

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 01 — PRESET IDENTITY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

readonly PRESET_NAME="wave-left"
readonly PRESET_VERSION="5.0.0"
readonly PRESET_DESCRIPTION="Sinusoidal wave sweep left-to-right — fluid, organic, oceanic motion"
readonly PRESET_CATEGORY="organic"
readonly PRESET_GPU_COST="low-medium"
readonly PRESET_TAGS="wave,sinusoidal,organic,fluid,ocean,nature,rhythm,sweep,ltr"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 02 — CORE TRANSITION PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

TRANSITION_TYPE="wave"

# ── Direction: 0° = wave sweeps left-to-right ────────────────────────────────
# The wave boundary originates at the left edge and sweeps rightward.
# Each vertical scanline of the wave is offset by a sine function.
TRANSITION_ANGLE=0

# ── Wave geometry: width=40px per cycle, height=60px amplitude ───────────────
# Default: medium ocean wave — visible, organic, not distracting.
# "40,60" creates ~1.5 full wavelengths across a 1080px display height,
# with 60px of vertical oscillation giving clear wave identity.
# Adjusted by variants to match their aesthetic context.
TRANSITION_WAVE="40,60"

TRANSITION_STEP=2
TRANSITION_DURATION=1.4
TRANSITION_FPS=60

# ── Bezier: ease-out for wave — fast initial energy, gentle coast ─────────────
# Waves in nature accelerate quickly then coast: a wave "arrives" at speed
# but "spreads" across shore gradually. ease-out captures this perfectly.
# The wave boundary rushes in from the left then decelerates as it
# approaches the right edge — matching real coastal wave physics.
TRANSITION_BEZIER="0.0,0.0,0.58,1.0"

TRANSITION_POS="0.5,0.5"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 03 — RENDERING PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

RESIZE_MODE="crop"
FILTER="Lanczos3"
FORMAT="xrgb"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 04 — VARIANT DEFINITIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  VARIANT: instant     → No animation                                        │
# │  VARIANT: ripple      → Tight small-amplitude wave "raindrops on water"    │
# │  VARIANT: default     → 1.4s medium ocean wave ← base config              │
# │  VARIANT: ocean       → 1.8s large dramatic ocean swell                   │
# │  VARIANT: tsunami     → 1.0s massive amplitude fast wave — dramatic        │
# │  VARIANT: gentle      → 2.0s small-amplitude slow gentle ripple            │
# │  VARIANT: storm       → 0.8s chaotic high-amplitude storm wave             │
# │  VARIANT: swell       → 2.5s wide-wavelength long rolling swell            │
# │  VARIANT: cinematic   → 3.0s slow sweeping cinematic ocean                 │
# │  VARIANT: lightning   → 0.5s jagged tall-spike wave — electric            │
# │  VARIANT: silk        → 1.6s ultra-smooth narrow wave — fabric motion     │
# └─────────────────────────────────────────────────────────────────────────────┘

apply_variant() {
    local variant="${1:-default}"

    case "$variant" in

        # ── Instant: zero-frame swap ──────────────────────────────────────────
        instant)
            TRANSITION_DURATION=0.0
            TRANSITION_STEP=255
            TRANSITION_FPS=10
            TRANSITION_BEZIER="0.0,0.0,1.0,1.0"
            TRANSITION_WAVE="1,1"
            TRANSITION_ANGLE=0
            VARIANT_DESCRIPTION="Zero-duration instant swap — no wave rendering"
            ;;

        # ── Ripple: 1.0s tight raindrops-on-water effect ─────────────────────
        # Very small wavelength (10px) and amplitude (10px).
        # Creates a dense ripple texture — like rain disturbing a still pond.
        # The wave boundary appears as a fine textured edge rather than a
        # distinct oscillation.
        ripple)
            TRANSITION_DURATION=1.0
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.58,1.0"
            TRANSITION_WAVE="10,10"
            TRANSITION_ANGLE=0
            VARIANT_DESCRIPTION="1.0s tight ripple wave — rain-on-water texture (10x10 wave)"
            ;;

        # ── Default: 1.4s medium ocean wave ──────────────────────────────────
        default | "")
            TRANSITION_DURATION=1.4
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.58,1.0"
            TRANSITION_WAVE="40,60"
            TRANSITION_ANGLE=0
            VARIANT_DESCRIPTION="1.4s medium ocean wave — balanced organic sweep (40x60 wave)"
            ;;

        # ── Ocean: 1.8s large dramatic swell ─────────────────────────────────
        # Larger wavelength (60px) and higher amplitude (90px).
        # Creates clearly visible ocean-like crests and troughs.
        # The wave boundary is unmistakably wave-like — no ambiguity.
        # Best for ocean, coastal, aquatic, and nature themes.
        ocean)
            TRANSITION_DURATION=1.8
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_WAVE="60,90"
            TRANSITION_ANGLE=0
            VARIANT_DESCRIPTION="1.8s large ocean swell — dramatic visible wave crests (60x90 wave)"
            ;;

        # ── Tsunami: 1.0s massive amplitude fast wave ─────────────────────────
        # Maximum amplitude (150px) with medium wavelength (50px).
        # The wave boundary has massive vertical range — almost violent.
        # Fast duration (1.0s) creates a sense of unstoppable force.
        # Use for dramatic, impactful theme changes on neon/storm themes.
        tsunami)
            TRANSITION_DURATION=1.0
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.3,1.0"
            TRANSITION_WAVE="50,150"
            TRANSITION_ANGLE=0
            VARIANT_DESCRIPTION="1.0s massive tsunami wave — violent amplitude, unstoppable force (50x150)"
            ;;

        # ── Gentle: 2.0s small-amplitude slow ripple ─────────────────────────
        # Small amplitude (25px), wide wavelength (50px).
        # The wave is subtle — barely distinguishable from a straight wipe
        # at high speed, but clearly organic at this 2.0s pace.
        # Perfect for focus mode where subtle movement doesn't distract.
        gentle)
            TRANSITION_DURATION=2.0
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_WAVE="50,25"
            TRANSITION_ANGLE=0
            VARIANT_DESCRIPTION="2.0s gentle whisper wave — subtle organic boundary, non-distracting (50x25)"
            ;;

        # ── Storm: 0.8s chaotic high-amplitude wave ───────────────────────────
        # Small wavelength (20px) creates rapid oscillations.
        # High amplitude (100px) makes the wave visually chaotic.
        # Fast speed (0.8s) gives it a turbulent, violent energy.
        # Excellent for storm, lightning, glitch, and cyberpunk themes.
        storm)
            TRANSITION_DURATION=0.8
            TRANSITION_STEP=3
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.3,1.0"
            TRANSITION_WAVE="20,100"
            TRANSITION_ANGLE=0
            VARIANT_DESCRIPTION="0.8s storm wave — chaotic rapid oscillations, turbulent energy (20x100)"
            ;;

        # ── Swell: 2.5s wide-wavelength rolling swell ────────────────────────
        # Very wide wavelength (200px) — barely one complete cycle across screen.
        # Moderate amplitude (50px) — the boundary undulates gently and slowly.
        # Creates the impression of a deep-ocean swell rather than a surface wave.
        # The wave is so wide it almost looks like a gentle S-curve sweep.
        swell)
            TRANSITION_DURATION=2.5
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_WAVE="200,50"
            TRANSITION_ANGLE=0
            VARIANT_DESCRIPTION="2.5s deep ocean swell — wide wavelength, slow rolling motion (200x50)"
            ;;

        # ── Cinematic: 3.0s slow sweeping ocean wave ──────────────────────────
        # The ultimate slow-wave reveal. Full 3.0s duration.
        # Large wave (80x100) visible and majestic at this pace.
        # Feels like watching the tide come in — inevitable and beautiful.
        cinematic)
            TRANSITION_DURATION=3.0
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_WAVE="80,100"
            TRANSITION_ANGLE=0
            VARIANT_DESCRIPTION="3.0s cinematic ocean tide — slow majestic wave reveal (80x100)"
            ;;

        # ── Lightning: 0.5s jagged tall-spike wave ────────────────────────────
        # Extreme amplitude (200px!) with tiny wavelength (15px).
        # At 15px wavelength, the wave oscillates ~72 times across 1080px height.
        # With 200px amplitude, the boundary produces jagged spikes.
        # At 0.5s speed, these spikes flash across the screen like lightning.
        # Unique visual: the boundary appears as a jagged electricity-bolt edge.
        lightning)
            TRANSITION_DURATION=0.5
            TRANSITION_STEP=4
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.2,1.0"
            TRANSITION_WAVE="15,200"
            TRANSITION_ANGLE=0
            VARIANT_DESCRIPTION="0.5s lightning bolt wave — jagged extreme spikes flash across screen (15x200)"
            ;;

        # ── Silk: 1.6s ultra-smooth narrow wave ──────────────────────────────
        # Medium amplitude (35px) with wider wavelength (80px).
        # Smooth bezier (ease-in-out) creates a silky, fabric-like motion.
        # The wave boundary feels like a silk curtain billowing in wind.
        # Perfect for minimal, clean, premium aesthetic themes.
        silk)
            TRANSITION_DURATION=1.6
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_WAVE="80,35"
            TRANSITION_ANGLE=0
            VARIANT_DESCRIPTION="1.6s silk-fabric wave — smooth billowing fabric motion (80x35)"
            ;;

        *)
            echo "wave-left.conf: unknown variant '${variant}'. Using default." >&2
            apply_variant "default"
            ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 05 — COMMAND BUILDER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

build_swww_cmd() {
    local wallpaper="${1:?wallpaper path required}"
    local monitor="${2:-}"

    local -a cmd=(
        swww img
        "$wallpaper"
        --transition-type     "$TRANSITION_TYPE"
        --transition-step     "$TRANSITION_STEP"
        --transition-fps      "$TRANSITION_FPS"
        --transition-angle    "$TRANSITION_ANGLE"
        --transition-wave     "$TRANSITION_WAVE"
        --transition-bezier   "$TRANSITION_BEZIER"
        --resize              "$RESIZE_MODE"
        --filter              "$FILTER"
    )

    if [[ "${TRANSITION_DURATION:-0}" != "0" \
       && "${TRANSITION_DURATION:-0}" != "0.0" ]]; then
        cmd+=(--transition-duration "$TRANSITION_DURATION")
    fi

    [[ -n "$monitor" ]] && cmd+=(--outputs "$monitor")

    echo "${cmd[@]}"
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 06 — THEME CATEGORY RECOMMENDATIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# The ash theme engine reads this function to select the best wave variant
# for the currently active theme category automatically.

recommend_for_theme() {
    local theme_category="${1:-dark}"

    case "$theme_category" in
        nature|ocean|forest)   echo "ocean"     ;;
        neon|cyberpunk|storm)  echo "storm"      ;;
        minimal|zen|monochrome)echo "gentle"     ;;
        anime|pastel|lofi)     echo "ripple"     ;;
        space|galaxy|nebula)   echo "swell"      ;;
        cinema|present|stream) echo "cinematic"  ;;
        retro|vaporwave)       echo "lightning"  ;;
        dark|light|*)          echo "default"    ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 07 — MODE OVERRIDES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

apply_mode_override() {
    local mode="${1:-default}"
    case "$mode" in
        game)    apply_variant "instant"   ;;
        battery) apply_variant "ripple";
                 TRANSITION_FPS=30; FILTER="Bilinear" ;;
        focus)   apply_variant "gentle"    ;;
        cinema)  apply_variant "cinematic" ;;
        present) apply_variant "cinematic" ;;
        stream)  apply_variant "ocean"     ;;
        work)    apply_variant "gentle"    ;;
        *)       apply_variant "default"   ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 08 — SELF-APPLY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

if [[ "${BASH_SOURCE[0]}" == "${0}" ]]; then
    wallpaper="${1:-}"
    variant="${2:-default}"
    monitor="${3:-}"

    if [[ -z "$wallpaper" ]]; then
        cat <<-USAGE
		Usage: wave-left.conf <wallpaper_path> [variant] [monitor]

		Variants:
		  instant    Zero-duration swap (no wave)
		  ripple     1.0s rain-on-water tight ripple    (10×10 wave)
		  default    1.4s medium ocean wave [DEFAULT]   (40×60 wave)
		  ocean      1.8s large dramatic swell           (60×90 wave)
		  tsunami    1.0s massive amplitude fast wave    (50×150 wave)
		  gentle     2.0s subtle non-distracting wave    (50×25 wave)
		  storm      0.8s chaotic turbulent wave          (20×100 wave)
		  swell      2.5s deep rolling ocean swell        (200×50 wave)
		  cinematic  3.0s slow majestic tide              (80×100 wave)
		  lightning  0.5s jagged electric spike wave      (15×200 wave)
		  silk       1.6s smooth fabric billowing wave    (80×35 wave)

		Examples:
		  wave-left.conf ~/wall.jpg
		  wave-left.conf ~/wall.jpg ocean
		  wave-left.conf ~/wall.jpg storm DP-1
		USAGE
        exit 1
    fi

    apply_variant "$variant"
    cmd=$(build_swww_cmd "$wallpaper" "$monitor")
    echo "→ Executing: $cmd"
    eval "$cmd"
fi

