#!/usr/bin/env bash
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — SWWW TRANSITION PRESET: WIPE-UP                 ║
# ║  Bottom-to-top upward reveal — ascending, elevating, morning-energy        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  PRESET OVERVIEW                                                             │
# │                                                                              │
# │  TYPE:      wipe  (directional edge sweep)                                  │
# │  ANGLE:     90°   (bottom edge → top edge)                                  │
# │  CHARACTER: Ascending, elevating, uplifting — vertical momentum             │
# │  BEST FOR:  Morning wallpaper changes, mode upgrades, energetic themes      │
# │  GPU COST:  Low — single scanline boundary per frame                        │
# │                                                                              │
# │  VISUAL DESCRIPTION:                                                         │
# │  A horizontal dividing line sweeps from the BOTTOM edge of the monitor to   │
# │  the TOP edge. Below the line: incoming new wallpaper (rising up).          │
# │  Above the line: outgoing old wallpaper (being pushed up and off screen).  │
# │  The upward motion creates an "ascending" or "sunrise" visual metaphor.    │
# │                                                                              │
# │  SWEEP DIRECTION DIAGRAM:                                                    │
# │  ╔═══════════════════════════════════════════════════╗                      │
# │  ║ OLD  OLD  OLD  OLD  OLD  OLD  OLD  OLD  OLD  OLD  ║  ← top of screen    │
# │  ║ OLD  OLD  OLD  OLD  OLD  OLD  OLD  OLD  OLD  OLD  ║                     │
# │  ║ ─────────────────────────────────────────────────║  ← sweep boundary   │
# │  ║ NEW  NEW  NEW  NEW  NEW  NEW  NEW  NEW  NEW  NEW  ║  (moves upward ↑)   │
# │  ╠═══════════════════════════════════════════════════╣                      │
# │  ║ NEW  NEW  NEW  NEW  NEW  NEW  NEW  NEW  NEW  NEW  ║  ← complete         │
# │  ╚═══════════════════════════════════════════════════╝  bottom of screen ↓  │
# │                                                                              │
# │  PSYCHOLOGICAL ASSOCIATIONS:                                                 │
# │  ↑ Up   = progress, growth, morning, elevation, positivity, beginning       │
# │  The wipe-up transition psychologically signals "something new is rising".  │
# │  Ideal for: morning automation, theme "upgrades", positive mode changes.    │
# │                                                                              │
# │  UNIQUE TO WIPE-UP:                                                          │
# │  • "rise" variant: extremely slow (5s) — mimics literal sunrise             │
# │  • "scroll" variant: paired with slide type for scroll-like motion          │
# │  • "curtain" variant: fast top + slow bottom = theatrical curtain-up        │
# └─────────────────────────────────────────────────────────────────────────────┘

set -euo pipefail

readonly PRESET_NAME="wipe-up"
readonly PRESET_VERSION="5.0.0"
readonly PRESET_DESCRIPTION="Bottom-to-top upward wipe — ascending reveal, morning energy"
readonly PRESET_CATEGORY="directional"
readonly PRESET_GPU_COST="low"
readonly PRESET_TAGS="directional,vertical,ascending,upward,morning,elevation,wipe"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 02 — CORE TRANSITION PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

TRANSITION_TYPE="wipe"

# ── Angle: 90° = bottom edge sweeps to top edge ───────────────────────────────
# In swww's coordinate system:
#   90° = wipe moving northward (bottom-to-top)
# The horizontal sweep line originates at the bottom of the display
# and advances upward, revealing the new wallpaper below.
TRANSITION_ANGLE=90

TRANSITION_STEP=2
TRANSITION_DURATION=1.0
TRANSITION_FPS=60

# ── Bezier: expo-out for upward wipe ─────────────────────────────────────────
# expo-out creates a "launch" feel: the sweep accelerates immediately
# (simulating something rising rapidly) then decelerates at the top.
# More energetic than ease-out-cubic — appropriate for vertical motion
# which psychologically implies energy and momentum.
#
# Curve: 0.16,1.0,0.3,1.0
# Extremely fast at 0% → very gradual deceleration → smooth landing at 100%
# x1=0.16 (early acceleration)  y1=1.0 (nearly instant full speed)
# x2=0.3  (late deceleration)   y2=1.0 (smooth end)
TRANSITION_BEZIER="0.16,1.0,0.3,1.0"

TRANSITION_POS="0.5,1.0"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 03 — RENDERING PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

RESIZE_MODE="crop"
FILTER="Lanczos3"
FORMAT="xrgb"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 04 — VARIANT DEFINITIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  VARIANT: instant    → No animation                                         │
# │  VARIANT: fast       → 0.5s energetic upward wipe                          │
# │  VARIANT: default    → 1.0s balanced expo-out sweep ← base config         │
# │  VARIANT: smooth     → 1.5s premium vertical sweep                         │
# │  VARIANT: slow       → 2.0s deliberate ascent                              │
# │  VARIANT: rise       → 5.0s ultra-slow sunrise pace                        │
# │  VARIANT: cinematic  → 2.5s theatrical vertical reveal                     │
# │  VARIANT: diagonal   → 60° diagonal upward wipe                            │
# │  VARIANT: sharp      → Linear bezier vertical shutter                      │
# │  VARIANT: elastic    → Spring-loaded upward wipe with overshoot            │
# └─────────────────────────────────────────────────────────────────────────────┘

apply_variant() {
    local variant="${1:-default}"

    case "$variant" in

        instant)
            TRANSITION_DURATION=0.0
            TRANSITION_STEP=255
            TRANSITION_FPS=10
            TRANSITION_BEZIER="0.0,0.0,1.0,1.0"
            TRANSITION_ANGLE=90
            VARIANT_DESCRIPTION="Zero-duration instant swap"
            ;;

        fast)
            TRANSITION_DURATION=0.5
            TRANSITION_STEP=3
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.3,1.0"
            TRANSITION_ANGLE=90
            VARIANT_DESCRIPTION="0.5s energetic upward wipe — rapid ascending reveal"
            ;;

        default | "")
            TRANSITION_DURATION=1.0
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.16,1.0,0.3,1.0"
            TRANSITION_ANGLE=90
            VARIANT_DESCRIPTION="1.0s expo-out upward wipe — energetic default"
            ;;

        smooth)
            TRANSITION_DURATION=1.5
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.16,1.0,0.3,1.0"
            TRANSITION_ANGLE=90
            VARIANT_DESCRIPTION="1.5s smooth upward sweep — premium vertical transition"
            ;;

        slow)
            TRANSITION_DURATION=2.0
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_ANGLE=90
            VARIANT_DESCRIPTION="2.0s deliberate ascent — emphasizes the rising motion"
            ;;

        # ── Rise: 5.0s ultra-slow sunrise ────────────────────────────────────
        # Designed to mimic the pace of an actual sunrise.
        # Used by ash morning automation (triggered at civil dawn).
        # 5 seconds at 30fps: minimal GPU load, maximum atmospheric effect.
        # Ease-in-out: dark wallpaper fades in slowly, brightens at end.
        rise)
            TRANSITION_DURATION=5.0
            TRANSITION_STEP=1
            TRANSITION_FPS=30
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_ANGLE=90
            VARIANT_DESCRIPTION="5.0s ultra-slow sunrise rise — matches actual dawn pace"
            ;;

        # ── Cinematic: 2.5s theatrical vertical reveal ────────────────────────
        # Asymmetric ease: quick initial rise, very gradual completion.
        # Creates tension then resolution — theatrical storytelling motion.
        cinematic)
            TRANSITION_DURATION=2.5
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.16,1.0,0.58,1.0"
            TRANSITION_ANGLE=90
            VARIANT_DESCRIPTION="2.5s cinematic vertical reveal — theatrical upward sweep"
            ;;

        # ── Diagonal: 60° upper-left diagonal wipe ───────────────────────────
        # 60° = between vertical (90°) and horizontal-right (0°).
        # Creates an upward-rightward diagonal — dynamic and energetic.
        # More interesting than pure vertical for aesthetic-focused setups.
        diagonal)
            TRANSITION_DURATION=1.2
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.58,1.0"
            TRANSITION_ANGLE=60
            VARIANT_DESCRIPTION="1.2s diagonal wipe at 60° — upward-right diagonal reveal"
            ;;

        # ── Sharp: vertical shutter ───────────────────────────────────────────
        # Linear constant-speed sweep — like a physical camera shutter.
        # No deceleration = very mechanical, decisive character.
        sharp)
            TRANSITION_DURATION=0.7
            TRANSITION_STEP=4
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,1.0,1.0"
            TRANSITION_ANGLE=90
            VARIANT_DESCRIPTION="0.7s linear vertical shutter — mechanical upward reveal"
            ;;

        # ── Elastic: spring-loaded upward wipe ───────────────────────────────
        # The sweep overshoots the top edge then snaps back.
        # Gives a "bouncy" spring physical sensation.
        # Best for playful themes (pastel, anime, lofi aesthetics).
        elastic)
            TRANSITION_DURATION=1.6
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.68,-0.6,0.32,1.6"
            TRANSITION_ANGLE=90
            VARIANT_DESCRIPTION="1.6s elastic spring wipe — overshoot upward and settle"
            ;;

        *)
            echo "wipe-up.conf: unknown variant '${variant}'. Using default." >&2
            apply_variant "default"
            ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 05 — COMMAND BUILDER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

build_swww_cmd() {
    local wallpaper="${1:?wallpaper path required}"
    local monitor="${2:-}"

    local -a cmd=(
        swww img
        "$wallpaper"
        --transition-type     "$TRANSITION_TYPE"
        --transition-step     "$TRANSITION_STEP"
        --transition-fps      "$TRANSITION_FPS"
        --transition-angle    "$TRANSITION_ANGLE"
        --transition-bezier   "$TRANSITION_BEZIER"
        --resize              "$RESIZE_MODE"
        --filter              "$FILTER"
    )

    if [[ "${TRANSITION_DURATION:-0}" != "0" && "${TRANSITION_DURATION:-0}" != "0.0" ]]; then
        cmd+=(--transition-duration "$TRANSITION_DURATION")
    fi

    if [[ -n "$monitor" ]]; then
        cmd+=(--outputs "$monitor")
    fi

    echo "${cmd[@]}"
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 06 — MODE OVERRIDES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

apply_mode_override() {
    local mode="${1:-default}"

    case "$mode" in
        game)    apply_variant "instant"   ;;
        battery) apply_variant "fast";
                 TRANSITION_FPS=30; FILTER="Bilinear" ;;
        focus)   apply_variant "slow"      ;;
        cinema)  apply_variant "cinematic" ;;
        present) apply_variant "cinematic" ;;
        stream)  apply_variant "smooth"    ;;
        work)    apply_variant "default"   ;;
        morning) apply_variant "rise"      ;;
        *)       apply_variant "default"   ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 07 — SELF-APPLY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

if [[ "${BASH_SOURCE[0]}" == "${0}" ]]; then
    wallpaper="${1:-}"
    variant="${2:-default}"
    monitor="${3:-}"

    if [[ -z "$wallpaper" ]]; then
        echo "Usage: wipe-up.conf <wallpaper_path> [variant] [monitor]"
        echo "Variants: instant fast default smooth slow rise cinematic diagonal sharp elastic"
        exit 1
    fi

    apply_variant "$variant"
    cmd=$(build_swww_cmd "$wallpaper" "$monitor")
    echo "→ Executing: $cmd"
    eval "$cmd"
fi

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  END: transitions/wipe-up.conf  •  10 variants  •  ASH v5.0 OMEGA          ║
