#!/usr/bin/env bash
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — SWWW TRANSITION PRESET: FADE                    ║
# ║  Cinematic crossfade — the timeless, universally elegant transition         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  PRESET OVERVIEW                                                             │
# │                                                                              │
# │  TYPE:      simple (simultaneous whole-screen crossfade)                    │
# │  CHARACTER: Gentle, professional, universally appropriate                   │
# │  BEST FOR:  Theme changes, slideshow rotation, focus/work modes             │
# │  GPU COST:  Low — single-pass alpha blend, no geometry transform            │
# │                                                                              │
# │  VISUAL DESCRIPTION:                                                         │
# │  The outgoing wallpaper uniformly fades out while the incoming wallpaper    │
# │  simultaneously fades in. Both images rendered at complementary opacity     │
# │  values (out_α + in_α = 1.0) throughout the transition duration.           │
# │  No positional movement — pure luminance/alpha blending operation.          │
# │                                                                              │
# │  EASING CURVE: ease-out-expo                                                │
# │  ╭──────────────────────────────────────────────────────╮                  │
# │  │ opacity                                               │                  │
# │  │ 1.0 ┤╮                                  ╭────────── │                  │
# │  │ 0.8 ┤ ╰╮                              ╭╯            │                  │
# │  │ 0.6 ┤  ╰─╮                          ╭╯              │                  │
# │  │ 0.4 ┤    ╰──╮                    ╭─╯                │                  │
# │  │ 0.2 ┤      ╰────╮          ╭────╯                   │                  │
# │  │ 0.0 ┤           ╰──────────╯                         │                  │
# │  │     ├──────────────────────────────── time           │                  │
# │  │       old_wallpaper     new_wallpaper                 │                  │
# │  ╰──────────────────────────────────────────────────────╯                  │
# │                                                                              │
# │  USAGE                                                                       │
# │    # Source in setter.sh to get all variables:                              │
# │    source ~/.config/swww/transitions/fade.conf                              │
# │                                                                              │
# │    # Direct command construction:                                            │
# │    swww img "$wallpaper" \                                                  │
# │      --transition-type   "$TRANSITION_TYPE"   \                             │
# │      --transition-step   "$TRANSITION_STEP"   \                             │
# │      --transition-duration "$TRANSITION_DURATION" \                         │
# │      --transition-fps    "$TRANSITION_FPS"    \                             │
# │      --transition-bezier "$TRANSITION_BEZIER" \                             │
# │      --resize            "$RESIZE_MODE"       \                             │
# │      --filter            "$FILTER"                                           │
# │                                                                              │
# │    # Via ash engine (recommended):                                           │
# │    ash wallpaper set <path> --transition fade                               │
# │    ash wallpaper set <path> --transition fade --variant slow               │
# │    ash wallpaper set <path> --transition fade --variant instant            │
# └─────────────────────────────────────────────────────────────────────────────┘

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 01 — PRESET IDENTITY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

readonly PRESET_NAME="fade"
readonly PRESET_VERSION="5.0.0"
readonly PRESET_DESCRIPTION="Smooth crossfade — simultaneous opacity blend across entire display"
readonly PRESET_CATEGORY="blend"
readonly PRESET_GPU_COST="low"
readonly PRESET_TAGS="elegant,professional,universal,smooth,blend"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 02 — CORE TRANSITION PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Transition type ───────────────────────────────────────────────────────────
# "simple" = whole-screen simultaneous crossfade.
# Note: swww also has "fade" as a distinct type — "simple" is the purest
# crossfade implementation with no positional component whatsoever.
TRANSITION_TYPE="simple"

# ── Step: pixels of alpha progress per rendered frame ────────────────────────
# With type=simple, step controls how many "alpha units" (out of 255)
# advance per frame. Lower = smoother, higher = faster.
# At 60fps: step=2 → ~128 frames → ~2.1s total
# At 60fps: step=3 → ~85 frames  → ~1.4s total
# DURATION overrides this when set > 0 (ash sets DURATION for consistency).
TRANSITION_STEP=2

# ── Duration: total animation time in seconds (float) ────────────────────────
# Overrides STEP calculation. ash wallpaper engine uses this for consistency
# across different display refresh rates.
# 1.2s = premium feel — unhurried but not slow.
# Tested optimal range: 0.8s (fast) to 2.5s (cinematic).
TRANSITION_DURATION=1.2

# ── FPS: animation frame rate ─────────────────────────────────────────────────
# 60fps = standard smooth animation. Matches most displays.
# The ash battery mode overrides this to 30fps automatically.
TRANSITION_FPS=60

# ── Bezier: easing curve control points ──────────────────────────────────────
# "ease-out-cubic": fast initial fade, decelerates to smooth landing.
# x1=0.0, y1=0.0 → starts at full velocity
# x2=0.58, y2=1.0 → sharp deceleration toward end
# Creates the perception of a "soft landing" — the new image settles in
# gently rather than snapping to full opacity.
#
# Visual curve shape:
# velocity  ██████╮
#           ████╮ │
#           ██╮ │ │
#           ╮ │ │ │
# 0  ───────────────── time
# [fast start]  [gentle end]
TRANSITION_BEZIER="0.0,0.0,0.58,1.0"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 03 — RENDERING PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Image resize mode ─────────────────────────────────────────────────────────
# crop = scale to fill, crop overflow. Best for photography wallpapers.
RESIZE_MODE="crop"

# ── Pixel filter algorithm ────────────────────────────────────────────────────
# Lanczos3 = highest quality resampling. Ideal for fade since GPU cost
# of the blend itself is minimal — worth spending quality budget on filter.
FILTER="Lanczos3"

# ── Image format ─────────────────────────────────────────────────────────────
# xrgb = 32-bit RGB, native GPU order. Best performance on all architectures.
FORMAT="xrgb"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 04 — VARIANT DEFINITIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Variants allow a single transition preset to have multiple speed/style modes.
# Selected via: ash wallpaper set <path> --transition fade --variant <name>
# The apply_variant() function below overrides base parameters.

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  VARIANT: instant  → Zero-delay swap (performance / battery critical)       │
# │  VARIANT: fast     → 0.4s rapid fade (game mode exit, urgent changes)      │
# │  VARIANT: default  → 1.2s balanced fade (base config above)                │
# │  VARIANT: slow     → 2.0s meditative fade (focus mode, morning ritual)     │
# │  VARIANT: cinematic→ 3.0s film-dissolve (presentation, streaming)          │
# │  VARIANT: breathing→ 4.0s breathing-pace fade (meditation, ambient)        │
# └─────────────────────────────────────────────────────────────────────────────┘

apply_variant() {
    local variant="${1:-default}"

    case "$variant" in

        # ── Instant: no animation ─────────────────────────────────────────────
        # Zero frames rendered — single buffer swap.
        # Use: battery critical, game mode, rapid prototyping.
        instant)
            TRANSITION_DURATION=0.0
            TRANSITION_STEP=255
            TRANSITION_FPS=10
            TRANSITION_BEZIER="0.0,0.0,1.0,1.0"
            VARIANT_DESCRIPTION="Zero-duration instant swap — no GPU animation"
            ;;

        # ── Fast: 0.4s snappy fade ────────────────────────────────────────────
        # Barely perceptible fade — acknowledges change without delay.
        # Use: frequent wallpaper rotations, gaming adjacent workflows.
        fast)
            TRANSITION_DURATION=0.4
            TRANSITION_STEP=4
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.4,1.0"
            VARIANT_DESCRIPTION="0.4s rapid fade — quick acknowledgment of change"
            ;;

        # ── Default: 1.2s balanced ────────────────────────────────────────────
        default | "")
            TRANSITION_DURATION=1.2
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.58,1.0"
            VARIANT_DESCRIPTION="1.2s balanced fade — premium daily driver"
            ;;

        # ── Slow: 2.0s meditative ─────────────────────────────────────────────
        # Gentle, unhurried. Transition is noticeable and pleasant.
        # Use: focus mode, early morning, evening wind-down.
        slow)
            TRANSITION_DURATION=2.0
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            VARIANT_DESCRIPTION="2.0s gentle fade — unhurried, meditative quality"
            ;;

        # ── Cinematic: 3.0s film dissolve ─────────────────────────────────────
        # Film-quality dissolve with ease-in-out symmetrical curve.
        # Mimics professional video cross-dissolve transition.
        # Use: presentation mode, streaming, desktop showcase.
        cinematic)
            TRANSITION_DURATION=3.0
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            VARIANT_DESCRIPTION="3.0s cinematic film-dissolve — professional presentation quality"
            ;;

        # ── Breathing: 4.0s ambient pace ──────────────────────────────────────
        # Matches human breathing rhythm (~15 breaths/min = 4s cycle).
        # The wallpaper seems to breathe rather than change.
        # Use: meditation timer, ambient display, lofi/chill setups.
        breathing)
            TRANSITION_DURATION=4.0
            TRANSITION_STEP=1
            TRANSITION_FPS=30
            TRANSITION_BEZIER="0.45,0.0,0.55,1.0"
            VARIANT_DESCRIPTION="4.0s breathing-pace fade — ambient, meditative display"
            ;;

        *)
            echo "fade.conf: unknown variant '${variant}'. Using default." >&2
            apply_variant "default"
            ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 05 — COMMAND BUILDER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Build swww img command array ──────────────────────────────────────────────
# Usage: build_swww_cmd <wallpaper_path> [monitor]
# Outputs: complete swww img command ready for eval or "${cmd[@]}" execution.
build_swww_cmd() {
    local wallpaper="${1:?wallpaper path required}"
    local monitor="${2:-}"

    local -a cmd=(
        swww img
        "$wallpaper"
        --transition-type     "$TRANSITION_TYPE"
        --transition-step     "$TRANSITION_STEP"
        --transition-fps      "$TRANSITION_FPS"
        --transition-bezier   "$TRANSITION_BEZIER"
        --resize              "$RESIZE_MODE"
        --filter              "$FILTER"
    )

    # Duration only appended when non-zero (0 = use step-based timing)
    if [[ "${TRANSITION_DURATION:-0}" != "0" && "${TRANSITION_DURATION:-0}" != "0.0" ]]; then
        cmd+=(--transition-duration "$TRANSITION_DURATION")
    fi

    # Monitor targeting (empty = all monitors)
    if [[ -n "$monitor" ]]; then
        cmd+=(--outputs "$monitor")
    fi

    echo "${cmd[@]}"
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 06 — MODE OVERRIDES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ash mode system calls apply_mode_override() when a mode is active.
# Allows the fade transition to adapt to system context automatically.

apply_mode_override() {
    local mode="${1:-default}"

    case "$mode" in
        game)       apply_variant "instant"   ;;
        battery)    apply_variant "fast";
                    TRANSITION_FPS=30
                    FILTER="Bilinear"
                    ;;
        focus)      apply_variant "slow"      ;;
        cinema)     apply_variant "cinematic" ;;
        present)    apply_variant "cinematic" ;;
        stream)     apply_variant "slow"      ;;
        work)       apply_variant "default"   ;;
        *)          apply_variant "default"   ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 07 — SELF-APPLY (when executed directly)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Allows: fade.conf /path/to/wallpaper.jpg [variant] [monitor]

if [[ "${BASH_SOURCE[0]}" == "${0}" ]]; then
    wallpaper="${1:-}"
    variant="${2:-default}"
    monitor="${3:-}"

    if [[ -z "$wallpaper" ]]; then
        echo "Usage: fade.conf <wallpaper_path> [variant] [monitor]"
        echo "Variants: instant fast default slow cinematic breathing"
        exit 1
    fi

    apply_variant "$variant"
    cmd=$(build_swww_cmd "$wallpaper" "$monitor")
    echo "→ Executing: $cmd"
    eval "$cmd"
fi

