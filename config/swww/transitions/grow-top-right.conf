#!/usr/bin/env bash
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — SWWW TRANSITION PRESET: GROW-TOP-RIGHT          ║
# ║  Radial expansion from top-right corner — RTL, completion, notification    ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  PRESET OVERVIEW                                                             │
# │                                                                              │
# │  TYPE:      grow  (radial expansion from origin point)                      │
# │  POSITION:  1.0,0.0  (top-right corner of monitor)                         │
# │  CHARACTER: RTL-natural, notification-origin, arriving, top-status energy   │
# │  BEST FOR:  RTL language setups, notification-driven changes, status bar    │
# │  GPU COST:  Medium — full diagonal arc from top-right to bottom-left        │
# │                                                                              │
# │  VISUAL DESCRIPTION:                                                         │
# │  The new wallpaper emerges from the top-right corner as an expanding arc   │
# │  that sweeps down-left, mirroring grow-top-left on the opposite axis.      │
# │  For RTL language users (Arabic, Hebrew, Persian) this is the natural      │
# │  "reading start" position — the equivalent of grow-top-left for LTR users. │
# │                                                                              │
# │  CORNER EXPANSION DIAGRAM:                                                   │
# │  Frame 0%           Frame 40%          Frame 70%          Frame 100%        │
# │  ┌─────────┐        ┌─────────┐        ┌─────────┐        ┌─────────┐      │
# │  │OLD OLD ✦│        │O ╭─ NEW✦│        │  ╭─────✦│        │NEW NEW  │      │
# │  │OLD OLD  │        │O ╰╮ NEW │        │ ╭╯ NEW  │        │NEW NEW  │      │
# │  │OLD OLD  │        │OLD OLD  │        │╭╯ NEW   │        │NEW NEW  │      │
# │  │OLD OLD  │        │OLD OLD  │        │NEW  OLD │        │NEW NEW  │      │
# │  │OLD OLD  │        │OLD OLD  │        │NEW  OLD │        │NEW NEW  │      │
# │  └─────────┘        └─────────┘        └─────────┘        └─────────┘      │
# │  ✦ = origin (1.0,0.0) — top-right pixel                                    │
# │                                                                              │
# │  WAYBAR/STATUS BAR ALIGNMENT:                                                │
# │  The top-right corner aligns with where system notifications, clock,       │
# │  and status indicators typically appear in Waybar/other status bars.       │
# │  This makes grow-top-right feel like changes "originate from the system".  │
# │                                                                              │
# │  UNIQUE VARIANTS:                                                            │
# │  • notification → 0.45s rapid grow matching notification popup timing      │
# │  • status-bar   → paired with Waybar top-right module position             │
# │  • mirror       → mirror of grow-top-left (perfect axis symmetry)          │
# └─────────────────────────────────────────────────────────────────────────────┘

set -euo pipefail

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 01 — PRESET IDENTITY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

readonly PRESET_NAME="grow-top-right"
readonly PRESET_VERSION="5.0.0"
readonly PRESET_DESCRIPTION="Radial grow from top-right corner — RTL, notification-origin, status bar energy"
readonly PRESET_CATEGORY="radial"
readonly PRESET_GPU_COST="medium"
readonly PRESET_TAGS="radial,grow,corner,top-right,rtl,notification,status,asymmetric"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 02 — CORE TRANSITION PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

TRANSITION_TYPE="grow"

# ── Position: top-right corner ────────────────────────────────────────────────
# 1.0,0.0 = 100% from left (rightmost pixel), 0% from top (top pixel).
# swww maps (1.0,0.0) to the top-right corner of the monitor.
# Same stability note as grow-top-left: use 0.99,0.01 if corner causes issues.
TRANSITION_POS="1.0,0.0"

TRANSITION_STEP=2
TRANSITION_DURATION=1.3
TRANSITION_FPS=60

# ── Bezier: expo-out matching grow-top-left for symmetric pairing ─────────────
# Using identical bezier to grow-top-left ensures that left↔right mirror pairs
# feel completely symmetrical in character and tempo.
# The arc from top-right to bottom-left should feel identical in speed and
# "character" to top-left→bottom-right, just mirrored.
TRANSITION_BEZIER="0.16,1.0,0.3,1.0"

TRANSITION_ANGLE=0

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 03 — RENDERING PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

RESIZE_MODE="crop"
FILTER="CatmullRom"
FORMAT="xrgb"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 04 — VARIANT DEFINITIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  VARIANT: instant      → No animation                                       │
# │  VARIANT: fast         → 0.6s rapid top-right burst                        │
# │  VARIANT: default      → 1.3s expo-out corner grow ← base config          │
# │  VARIANT: smooth       → 1.8s ease-in-out expansion                        │
# │  VARIANT: slow         → 2.5s deliberate reveal                            │
# │  VARIANT: notification → 0.45s notification-timed burst                    │
# │  VARIANT: status-bar   → 0.8s status-bar-position aligned grow             │
# │  VARIANT: cinematic    → 3.0s dramatic corner reveal                       │
# │  VARIANT: elastic      → 1.5s spring bounce from corner                    │
# │  VARIANT: mirror       → Perfect mirror of grow-top-left default           │
# │  VARIANT: sharp        → 0.9s linear constant arc                          │
# └─────────────────────────────────────────────────────────────────────────────┘

apply_variant() {
    local variant="${1:-default}"

    case "$variant" in

        instant)
            TRANSITION_DURATION=0.0
            TRANSITION_STEP=255
            TRANSITION_FPS=10
            TRANSITION_BEZIER="0.0,0.0,1.0,1.0"
            TRANSITION_POS="1.0,0.0"
            VARIANT_DESCRIPTION="Zero-duration instant swap"
            ;;

        fast)
            TRANSITION_DURATION=0.6
            TRANSITION_STEP=3
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.3,1.0"
            TRANSITION_POS="1.0,0.0"
            VARIANT_DESCRIPTION="0.6s rapid top-right corner burst"
            ;;

        default | "")
            TRANSITION_DURATION=1.3
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.16,1.0,0.3,1.0"
            TRANSITION_POS="1.0,0.0"
            VARIANT_DESCRIPTION="1.3s expo-out grow from top-right — symmetric with grow-top-left"
            ;;

        smooth)
            TRANSITION_DURATION=1.8
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_POS="1.0,0.0"
            VARIANT_DESCRIPTION="1.8s smooth ease-in-out top-right expansion"
            ;;

        slow)
            TRANSITION_DURATION=2.5
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_POS="1.0,0.0"
            VARIANT_DESCRIPTION="2.5s deliberate top-right to bottom-left diagonal reveal"
            ;;

        # ── Notification: 0.45s notification-speed burst ──────────────────────
        # Designed to match the timing of a dunst/swaync notification popup.
        # When a notification appears in the top-right, the wallpaper can
        # change with matching speed — creating a coordinated UX moment.
        # Used by: ash notification-driven wallpaper change hooks.
        notification)
            TRANSITION_DURATION=0.45
            TRANSITION_STEP=6
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.2,1.0"
            TRANSITION_POS="1.0,0.0"
            VARIANT_DESCRIPTION="0.45s notification-speed burst — matches dunst popup timing"
            ;;

        # ── Status-bar: waybar-aligned grow ───────────────────────────────────
        # Slightly longer than notification — matches the visual weight of
        # a Waybar module update or mode indicator change.
        # The 0.8s duration feels like a "system response" to user action.
        # Top-right position aligns with where Waybar typically shows
        # the active theme, mode indicator, and notification count.
        status_bar | status-bar)
            TRANSITION_DURATION=0.8
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.4,1.0"
            TRANSITION_POS="1.0,0.0"
            VARIANT_DESCRIPTION="0.8s status-bar-aligned grow — matches Waybar update visual weight"
            ;;

        # ── Cinematic: 3.0s dramatic right-to-left diagonal reveal ────────────
        cinematic)
            TRANSITION_DURATION=3.0
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.25,0.1,0.58,1.0"
            TRANSITION_POS="1.0,0.0"
            VARIANT_DESCRIPTION="3.0s cinematic top-right to bottom-left diagonal reveal"
            ;;

        # ── Elastic: spring bounce ────────────────────────────────────────────
        elastic)
            TRANSITION_DURATION=1.5
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.68,-0.6,0.32,1.6"
            TRANSITION_POS="1.0,0.0"
            VARIANT_DESCRIPTION="1.5s elastic spring bounce from top-right corner"
            ;;

        # ── Mirror: perfect axis-symmetric match to grow-top-left default ─────
        # Identical parameters to grow-top-left's default variant.
        # Only the TRANSITION_POS differs (1.0,0.0 vs 0.0,0.0).
        # Ensures perfect left↔right aesthetic symmetry when pairing presets.
        # Used by: multi-monitor setups where monitors use mirrored transitions.
        mirror)
            TRANSITION_DURATION=1.3
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.16,1.0,0.3,1.0"
            TRANSITION_POS="1.0,0.0"
            VARIANT_DESCRIPTION="1.3s perfect mirror of grow-top-left — identical params, opposite corner"
            ;;

        # ── Sharp: constant-rate arc ──────────────────────────────────────────
        sharp)
            TRANSITION_DURATION=0.9
            TRANSITION_STEP=3
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,1.0,1.0"
            TRANSITION_POS="1.0,0.0"
            VARIANT_DESCRIPTION="0.9s linear constant-rate corner arc — mechanical precision"
            ;;

        *)
            echo "grow-top-right.conf: unknown variant '${variant}'. Using default." >&2
            apply_variant "default"
            ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 05 — COMMAND BUILDER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

build_swww_cmd() {
    local wallpaper="${1:?wallpaper path required}"
    local monitor="${2:-}"

    local -a cmd=(
        swww img
        "$wallpaper"
        --transition-type     "$TRANSITION_TYPE"
        --transition-step     "$TRANSITION_STEP"
        --transition-fps      "$TRANSITION_FPS"
        --transition-pos      "$TRANSITION_POS"
        --transition-bezier   "$TRANSITION_BEZIER"
        --resize              "$RESIZE_MODE"
        --filter              "$FILTER"
    )

    if [[ "${TRANSITION_DURATION:-0}" != "0" \
       && "${TRANSITION_DURATION:-0}" != "0.0" ]]; then
        cmd+=(--transition-duration "$TRANSITION_DURATION")
    fi

    [[ -n "$monitor" ]] && cmd+=(--outputs "$monitor")

    echo "${cmd[@]}"
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 06 — MODE OVERRIDES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

apply_mode_override() {
    local mode="${1:-default}"
    case "$mode" in
        game)    apply_variant "instant"      ;;
        battery) apply_variant "fast";
                 TRANSITION_FPS=30; FILTER="Bilinear" ;;
        focus)   apply_variant "smooth"       ;;
        cinema)  apply_variant "cinematic"    ;;
        present) apply_variant "cinematic"    ;;
        stream)  apply_variant "status-bar"   ;;
        work)    apply_variant "default"      ;;
        *)       apply_variant "default"      ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 07 — SELF-APPLY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

if [[ "${BASH_SOURCE[0]}" == "${0}" ]]; then
    wallpaper="${1:-}"
    variant="${2:-default}"
    monitor="${3:-}"

    if [[ -z "$wallpaper" ]]; then
        cat <<-USAGE
		Usage: grow-top-right.conf <wallpaper_path> [variant] [monitor]

		Variants:
		  instant      Zero-duration swap
		  fast         0.6s rapid corner burst
		  default      1.3s expo-out grow from top-right [DEFAULT]
		  smooth       1.8s ease-in-out expansion
		  slow         2.5s deliberate diagonal reveal
		  notification 0.45s notification-speed burst
		  status-bar   0.8s waybar-aligned grow
		  cinematic    3.0s dramatic diagonal reveal
		  elastic      1.5s spring bounce from corner
		  mirror       1.3s perfect grow-top-left mirror
		  sharp        0.9s linear constant-rate arc

		Examples:
		  grow-top-right.conf ~/wall.jpg
		  grow-top-right.conf ~/wall.jpg notification
		  grow-top-right.conf ~/wall.jpg cinematic HDMI-A-1
		USAGE
        exit 1
    fi

    apply_variant "$variant"
    cmd=$(build_swww_cmd "$wallpaper" "$monitor")
    echo "→ Executing: $cmd"
    eval "$cmd"
fi

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  END: transitions/grow-top-right.conf  •  11 variants  •  ASH v5.0 OMEGA   ║
# ╚══════════════════════════════════════════════════════════════════════════════╝