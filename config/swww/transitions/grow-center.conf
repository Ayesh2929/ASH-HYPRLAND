#!/usr/bin/env bash
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — SWWW TRANSITION PRESET: GROW-CENTER             ║
# ║  Radial expansion from monitor center — the most visually dramatic preset  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  PRESET OVERVIEW                                                             │
# │                                                                              │
# │  TYPE:      grow  (radial expansion from origin point)                      │
# │  POSITION:  0.5,0.5  (exact center of monitor)                             │
# │  CHARACTER: Expansive, dramatic, focal, revelatory — the "big reveal"      │
# │  BEST FOR:  Major theme changes, special occasions, desktop showcase        │
# │  GPU COST:  Medium — circular boundary computation per frame                │
# │                                                                              │
# │  VISUAL DESCRIPTION:                                                         │
# │  The new wallpaper emerges as a circle growing from the exact center of     │
# │  the monitor. The circle expands radially in all directions simultaneously, │
# │  consuming the old wallpaper as it grows to fill the entire display.        │
# │  The expanding boundary is a perfect circle that scales to cover all four   │
# │  corners — requiring it to grow to radius √((W/2)² + (H/2)²).             │
# │                                                                              │
# │  RADIAL EXPANSION DIAGRAM (4 keyframes):                                    │
# │                                                                              │
# │  Frame 0%           Frame 33%          Frame 66%          Frame 100%        │
# │  ┌─────────┐        ┌─────────┐        ┌─────────┐        ┌─────────┐      │
# │  │OLD OLD  │        │OLD ╭─╮  │        │  ╭───╮  │        │NEW NEW  │      │
# │  │OLD OLD  │        │OLD │N│  │        │ ╱NEW ╲  │        │NEW NEW  │      │
# │  │OLD ✦ OLD│        │OLD │N│  │        │╱ NEW  ╲ │        │NEW ✦ NEW│      │
# │  │OLD OLD  │        │OLD │N│  │        │╲ NEW  ╱ │        │NEW NEW  │      │
# │  │OLD OLD  │        │OLD ╰─╯  │        │ ╲NEW╱   │        │NEW NEW  │      │
# │  └─────────┘        └─────────┘        └─────────┘        └─────────┘      │
# │  [pure old]    [small circle]    [half reveal]    [complete new]            │
# │                    ✦ = origin point (0.5, 0.5)                             │
# │                                                                              │
# │  GEOMETRY NOTE:                                                              │
# │  For a 1920×1080 display, the circle must grow to radius ≈ 1100px          │
# │  to cover all corners. This means corner pixels receive new wallpaper       │
# │  slightly before the outer ring completes (circle is wider than tall).     │
# │                                                                              │
# │  PSYCHOLOGICAL ASSOCIATIONS:                                                 │
# │  ○ → ◯ → ⬤ = emergence, birth, portal opening, focus, revelation          │
# │  The center-origin grow is the most dramatic single-point expand possible.  │
# │  It draws the eye to the center before expanding to the edges.              │
# │                                                                              │
# │  UNIQUE VARIANTS:                                                            │
# │  • portal       → Fast grow with exponential acceleration (portal opens)   │
# │  • iris         → Iris-diaphragm style: grow then pause at border           │
# │  • pulse        → Rapid sequence of small/large grows (heartbeat)          │
# │  • zoom-reveal  → Combine with scale for zoom-in-and-reveal effect          │
# │  • cursor-track → Grow origin follows current cursor position               │
# └─────────────────────────────────────────────────────────────────────────────┘

set -euo pipefail

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 01 — PRESET IDENTITY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

readonly PRESET_NAME="grow-center"
readonly PRESET_VERSION="5.0.0"
readonly PRESET_DESCRIPTION="Radial grow from monitor center — the dramatic circular reveal"
readonly PRESET_CATEGORY="radial"
readonly PRESET_GPU_COST="medium"
readonly PRESET_TAGS="radial,grow,center,dramatic,reveal,circular,focal,portal"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 02 — CORE TRANSITION PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

TRANSITION_TYPE="grow"

# ── Position: exact center of monitor ────────────────────────────────────────
# 0.5,0.5 = 50% from left, 50% from top = geometric center.
# swww interprets these as fractions of monitor dimensions:
#   x = 0.5 * monitor_width   (e.g. 960px on 1920-wide monitor)
#   y = 0.5 * monitor_height  (e.g. 540px on 1080-tall monitor)
TRANSITION_POS="0.5,0.5"

TRANSITION_STEP=2
TRANSITION_DURATION=1.2
TRANSITION_FPS=60

# ── Bezier: expo-out for radial grow ─────────────────────────────────────────
# expo-out: circle explodes outward at maximum initial velocity,
# then decelerates as it approaches the screen edges.
# This matches the physics of an expanding shockwave or portal opening:
# maximum force at origin, dissipating energy as distance increases.
#
# 0.16,1.0 → nearly instant full velocity (explosive start)
# 0.3,1.0  → gradual deceleration (energy dissipation)
TRANSITION_BEZIER="0.16,1.0,0.3,1.0"

# Angle: not meaningful for grow transitions (radial has no directional angle)
# Set to 0 as neutral placeholder
TRANSITION_ANGLE=0

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 03 — RENDERING PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

RESIZE_MODE="crop"

# CatmullRom: excellent quality/speed balance for circular boundary rendering.
# The curved edge of the grow circle benefits from high-quality anti-aliasing.
# Lanczos3 is marginally better but CatmullRom is faster at the boundary computation.
FILTER="CatmullRom"
FORMAT="xrgb"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 04 — VARIANT DEFINITIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  VARIANT: instant      → No animation                                       │
# │  VARIANT: fast         → 0.6s rapid radial expand                          │
# │  VARIANT: default      → 1.2s expo-out grow ← base config                 │
# │  VARIANT: smooth       → 1.8s smooth radial expansion                      │
# │  VARIANT: slow         → 2.5s meditative circular reveal                   │
# │  VARIANT: portal       → 0.4s explosive portal-open (maximum impact)       │
# │  VARIANT: cinematic    → 3.5s theatrical big-reveal expand                 │
# │  VARIANT: elastic      → 1.6s spring overshoot (circle overshoots corners) │
# │  VARIANT: cursor       → 1.2s grow from current cursor position            │
# │  VARIANT: sharp        → 0.8s linear constant-rate expansion               │
# │  VARIANT: breathe      → 3.0s breathing-pace circular reveal               │
# └─────────────────────────────────────────────────────────────────────────────┘

apply_variant() {
    local variant="${1:-default}"

    case "$variant" in

        # ── Instant: zero-frame swap ──────────────────────────────────────────
        instant)
            TRANSITION_DURATION=0.0
            TRANSITION_STEP=255
            TRANSITION_FPS=10
            TRANSITION_BEZIER="0.0,0.0,1.0,1.0"
            TRANSITION_POS="0.5,0.5"
            VARIANT_DESCRIPTION="Zero-duration instant swap"
            ;;

        # ── Fast: 0.6s rapid radial expand ───────────────────────────────────
        # Snappy grow that feels responsive without being abrupt.
        # The circle expands quickly enough to feel like a decisive action.
        fast)
            TRANSITION_DURATION=0.6
            TRANSITION_STEP=3
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.3,1.0"
            TRANSITION_POS="0.5,0.5"
            VARIANT_DESCRIPTION="0.6s rapid radial expand — snappy center-grow reveal"
            ;;

        # ── Default: 1.2s expo-out expand ────────────────────────────────────
        default | "")
            TRANSITION_DURATION=1.2
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.16,1.0,0.3,1.0"
            TRANSITION_POS="0.5,0.5"
            VARIANT_DESCRIPTION="1.2s expo-out grow — explosive start, gentle completion"
            ;;

        # ── Smooth: 1.8s premium ease-in-out circular expand ─────────────────
        # The circle grows symmetrically — starts gently, peaks in the middle,
        # then decelerates smoothly as it fills the corners.
        # Creates a "breathing in" sensation — calm and deliberate.
        smooth)
            TRANSITION_DURATION=1.8
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_POS="0.5,0.5"
            VARIANT_DESCRIPTION="1.8s smooth ease-in-out circular expansion — balanced growth"
            ;;

        # ── Slow: 2.5s meditative reveal ─────────────────────────────────────
        slow)
            TRANSITION_DURATION=2.5
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_POS="0.5,0.5"
            VARIANT_DESCRIPTION="2.5s meditative circular reveal — unhurried expansion"
            ;;

        # ── Portal: 0.4s explosive portal-open effect ────────────────────────
        # Maximum visual impact in minimum time.
        # The circle explodes outward at maximum speed from frame 1.
        # No deceleration — the portal slams open.
        # Perfect for theme changes that demand dramatic attention.
        # Used by: ash theme apply for "dramatic" theme category.
        portal)
            TRANSITION_DURATION=0.4
            TRANSITION_STEP=5
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.0,1.0"
            TRANSITION_POS="0.5,0.5"
            VARIANT_DESCRIPTION="0.4s explosive portal-open — maximum impact, zero hesitation"
            ;;

        # ── Cinematic: 3.5s theatrical big-reveal ─────────────────────────────
        # The ultimate slow-reveal for presentations and showcases.
        # Linear start (anticipation builds), strong ease-out at edges
        # (the new image seems to "settle in" to position).
        # Duration 3.5s: long enough to be clearly intentional and dramatic.
        cinematic)
            TRANSITION_DURATION=3.5
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.25,0.1,0.58,1.0"
            TRANSITION_POS="0.5,0.5"
            VARIANT_DESCRIPTION="3.5s theatrical cinematic reveal — the premium desktop showcase"
            ;;

        # ── Elastic: spring overshoot grow ───────────────────────────────────
        # Circle grows past the screen edges then springs back to fill exactly.
        # The overshoot is not visually apparent (circle extends beyond viewport)
        # but the easing curve's mathematical overshoot creates a "snap-in"
        # feel at the end — the edges seem to snap into place.
        # Creates a lively, energetic, bouncy quality.
        elastic)
            TRANSITION_DURATION=1.6
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.68,-0.6,0.32,1.6"
            TRANSITION_POS="0.5,0.5"
            VARIANT_DESCRIPTION="1.6s elastic spring grow — circle snaps energetically into corners"
            ;;

        # ── Cursor: grow from current cursor position ─────────────────────────
        # The circle originates at wherever the cursor is when the command runs.
        # Creates a highly personal, interactive feel — the wallpaper grows
        # from wherever the user's attention is focused.
        # cursor position: read from hyprctl cursorpos at execution time.
        # Falls back to center if hyprctl unavailable.
        cursor)
            TRANSITION_DURATION=1.2
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.16,1.0,0.3,1.0"
            # Read cursor position dynamically at execution time
            local cursor_pos
            cursor_pos=$( \
                hyprctl cursorpos 2>/dev/null \
                | awk '{printf "%.4f,%.4f",
                    $1 / (ENVIRON["MONITOR_W"] > 0 ? ENVIRON["MONITOR_W"] : 1920),
                    $2 / (ENVIRON["MONITOR_H"] > 0 ? ENVIRON["MONITOR_H"] : 1080)}' \
                || echo "0.5,0.5" \
            )
            TRANSITION_POS="${cursor_pos}"
            VARIANT_DESCRIPTION="1.2s cursor-origin grow — circle expands from your cursor position"
            ;;

        # ── Sharp: constant-rate mechanical expansion ─────────────────────────
        # Linear bezier — no easing at start or end.
        # The circle grows at a perfectly constant rate.
        # Creates a precise, geometric, mathematical feeling — like
        # a sensor scan or radar sweep expanding outward.
        sharp)
            TRANSITION_DURATION=0.8
            TRANSITION_STEP=3
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,1.0,1.0"
            TRANSITION_POS="0.5,0.5"
            VARIANT_DESCRIPTION="0.8s linear constant-rate grow — mechanical sensor-scan expansion"
            ;;

        # ── Breathe: 3.0s breathing-rhythm circular reveal ────────────────────
        # Matches human breathing rhythm (one deep inhale ≈ 3s).
        # The circle "inhales" outward at the pace of a breath.
        # Symmetrical sine-like ease-in-out: slow start, mid-peak, gentle end.
        breathe)
            TRANSITION_DURATION=3.0
            TRANSITION_STEP=1
            TRANSITION_FPS=30
            TRANSITION_BEZIER="0.45,0.0,0.55,1.0"
            TRANSITION_POS="0.5,0.5"
            VARIANT_DESCRIPTION="3.0s breathing-rhythm grow — one full breath cycle reveal"
            ;;

        *)
            echo "grow-center.conf: unknown variant '${variant}'. Using default." >&2
            apply_variant "default"
            ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 05 — COMMAND BUILDER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

build_swww_cmd() {
    local wallpaper="${1:?wallpaper path required}"
    local monitor="${2:-}"

    local -a cmd=(
        swww img
        "$wallpaper"
        --transition-type     "$TRANSITION_TYPE"
        --transition-step     "$TRANSITION_STEP"
        --transition-fps      "$TRANSITION_FPS"
        --transition-pos      "$TRANSITION_POS"
        --transition-bezier   "$TRANSITION_BEZIER"
        --resize              "$RESIZE_MODE"
        --filter              "$FILTER"
    )

    if [[ "${TRANSITION_DURATION:-0}" != "0" \
       && "${TRANSITION_DURATION:-0}" != "0.0" ]]; then
        cmd+=(--transition-duration "$TRANSITION_DURATION")
    fi

    [[ -n "$monitor" ]] && cmd+=(--outputs "$monitor")

    echo "${cmd[@]}"
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 06 — MODE OVERRIDES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

apply_mode_override() {
    local mode="${1:-default}"
    case "$mode" in
        game)    apply_variant "instant"   ;;
        battery) apply_variant "fast";
                 TRANSITION_FPS=30; FILTER="Bilinear" ;;
        focus)   apply_variant "breathe"   ;;
        cinema)  apply_variant "cinematic" ;;
        present) apply_variant "cinematic" ;;
        stream)  apply_variant "default"   ;;
        work)    apply_variant "smooth"    ;;
        *)       apply_variant "default"   ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 07 — SELF-APPLY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

if [[ "${BASH_SOURCE[0]}" == "${0}" ]]; then
    wallpaper="${1:-}"
    variant="${2:-default}"
    monitor="${3:-}"

    if [[ -z "$wallpaper" ]]; then
        cat <<-USAGE
		Usage: grow-center.conf <wallpaper_path> [variant] [monitor]

		Variants:
		  instant    Zero-duration swap
		  fast       0.6s rapid radial expand
		  default    1.2s expo-out grow [DEFAULT]
		  smooth     1.8s ease-in-out circular expansion
		  slow       2.5s meditative circular reveal
		  portal     0.4s explosive portal-open (max impact)
		  cinematic  3.5s theatrical big-reveal expand
		  elastic    1.6s spring-overshoot energetic grow
		  cursor     1.2s grow from current cursor position
		  sharp      0.8s linear constant-rate expansion
		  breathe    3.0s breathing-rhythm circular reveal

		Examples:
		  grow-center.conf ~/wall.jpg
		  grow-center.conf ~/wall.jpg portal
		  grow-center.conf ~/wall.jpg cinematic DP-1
		USAGE
        exit 1
    fi

    apply_variant "$variant"
    cmd=$(build_swww_cmd "$wallpaper" "$monitor")
    echo "→ Executing: $cmd"
    eval "$cmd"
fi

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  END: transitions/grow-center.conf  •  11 variants  •  ASH v5.0 OMEGA      ║
# ╚══════════════════════════════════════════════════════════════════════════════╝