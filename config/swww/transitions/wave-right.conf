#!/usr/bin/env bash
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — SWWW TRANSITION PRESET: WAVE-RIGHT              ║
# ║  Sinusoidal sweep right-to-left — retreating tide, RTL organic motion      ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  PRESET OVERVIEW                                                             │
# │                                                                              │
# │  TYPE:      wave  (sinusoidal boundary wipe)                                │
# │  ANGLE:     180°  (wave sweeps right-to-left, retreating motion)            │
# │  CHARACTER: Retreating tide, RTL organic, wave washing back to sea          │
# │  BEST FOR:  RTL language setups, "undo" theme changes, evening modes,      │
# │             pairing with wave-left for mirrored ocean-cycle animations     │
# │  GPU COST:  Low-Medium — sinusoidal boundary per scanline                   │
# │                                                                              │
# │  DESIGN CONTRAST:                                                            │
# │  wave-left  (0°)   → approaching wave — new content arrives                │
# │  wave-right (180°) → retreating tide — old content washes away             │
# │                                                                              │
# │  PAIRED ANIMATIONS:                                                          │
# │  The ash slideshow engine can alternate wave-left and wave-right            │
# │  to create a "breathing" or "ocean pulse" effect — the wallpaper            │
# │  changes feel like successive waves coming in and going out.                │
# │  Set SWWW_SLIDESHOW_TRANSITION="wave-left,wave-right" in swww.conf         │
# │  to activate alternating pair mode.                                         │
# │                                                                              │
# │  UNIQUE VARIANTS:                                                            │
# │  • undertow    → Pulls strongly from right like a rip current               │
# │  • receding    → Ultra-slow retreating tide metaphor                        │
# │  • backwash    → Short fast reversal — water running back down beach        │
# └─────────────────────────────────────────────────────────────────────────────┘

set -euo pipefail

readonly PRESET_NAME="wave-right"
readonly PRESET_VERSION="5.0.0"
readonly PRESET_DESCRIPTION="Sinusoidal wave sweep right-to-left — retreating tide, RTL organic motion"
readonly PRESET_CATEGORY="organic"
readonly PRESET_GPU_COST="low-medium"
readonly PRESET_TAGS="wave,sinusoidal,organic,fluid,rtl,retreating,tide,backward,mirror"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 02 — CORE TRANSITION PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

TRANSITION_TYPE="wave"

# ── Direction: 180° = wave sweeps right-to-left ──────────────────────────────
TRANSITION_ANGLE=180

# ── Wave geometry: same default as wave-left for symmetric pairing ────────────
TRANSITION_WAVE="40,60"

TRANSITION_STEP=2
TRANSITION_DURATION=1.4
TRANSITION_FPS=60

# ── Bezier: ease-out matching wave-left for identical temporal feel ───────────
# A retreating wave moves at the same speed as an incoming wave.
# Same bezier as wave-left ensures perfect visual symmetry when alternating.
TRANSITION_BEZIER="0.0,0.0,0.58,1.0"

TRANSITION_POS="0.5,0.5"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 03 — RENDERING PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

RESIZE_MODE="crop"
FILTER="Lanczos3"
FORMAT="xrgb"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 04 — VARIANT DEFINITIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  VARIANT: instant     → No animation                                        │
# │  VARIANT: ripple      → Tight right-to-left ripple                         │
# │  VARIANT: default     → 1.4s mirrored ocean wave ← base config            │
# │  VARIANT: ocean       → 1.8s large retreating swell                        │
# │  VARIANT: undertow    → 1.0s powerful right-pull rip-current wave          │
# │  VARIANT: gentle      → 2.0s subtle retreating ripple                      │
# │  VARIANT: backwash    → 0.6s rapid water-running-down-beach reversal       │
# │  VARIANT: receding    → 3.5s ultra-slow tide retreating                   │
# │  VARIANT: storm       → 0.8s turbulent rightward chaos                     │
# │  VARIANT: cinematic   → 3.0s slow dramatic oceanic retreat                 │
# │  VARIANT: mirror      → Exact mirror of wave-left default                  │
# └─────────────────────────────────────────────────────────────────────────────┘

apply_variant() {
    local variant="${1:-default}"

    case "$variant" in

        instant)
            TRANSITION_DURATION=0.0
            TRANSITION_STEP=255
            TRANSITION_FPS=10
            TRANSITION_BEZIER="0.0,0.0,1.0,1.0"
            TRANSITION_WAVE="1,1"
            TRANSITION_ANGLE=180
            VARIANT_DESCRIPTION="Zero-duration instant swap"
            ;;

        # ── Ripple: tight right-to-left ripple ───────────────────────────────
        ripple)
            TRANSITION_DURATION=1.0
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.58,1.0"
            TRANSITION_WAVE="10,10"
            TRANSITION_ANGLE=180
            VARIANT_DESCRIPTION="1.0s tight right-to-left ripple — retreating rain texture (10×10)"
            ;;

        default | "")
            TRANSITION_DURATION=1.4
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.58,1.0"
            TRANSITION_WAVE="40,60"
            TRANSITION_ANGLE=180
            VARIANT_DESCRIPTION="1.4s retreating ocean wave — mirror of wave-left (40×60)"
            ;;

        # ── Ocean: large retreating swell ─────────────────────────────────────
        ocean)
            TRANSITION_DURATION=1.8
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_WAVE="60,90"
            TRANSITION_ANGLE=180
            VARIANT_DESCRIPTION="1.8s large retreating swell — dramatic backward ocean sweep (60×90)"
            ;;

        # ── Undertow: powerful rip-current wave ───────────────────────────────
        # Fast (1.0s) + high amplitude (120px) + medium wave (35px).
        # Simulates a powerful rip current pulling strongly rightward.
        # Creates a sense of force and urgency in the rightward direction.
        undertow)
            TRANSITION_DURATION=1.0
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.2,1.0"
            TRANSITION_WAVE="35,120"
            TRANSITION_ANGLE=180
            VARIANT_DESCRIPTION="1.0s undertow rip-current — powerful right-pull forced wave (35×120)"
            ;;

        # ── Gentle: subtle retreating ripple ─────────────────────────────────
        gentle)
            TRANSITION_DURATION=2.0
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_WAVE="50,25"
            TRANSITION_ANGLE=180
            VARIANT_DESCRIPTION="2.0s gentle retreating ripple — subtle rightward wash (50×25)"
            ;;

        # ── Backwash: rapid short water-running-back reversal ─────────────────
        # Very fast (0.6s) with medium wave.
        # Mimics water rushing back down a beach after a wave breaks:
        # quick, energetic, brief rightward motion.
        # Ideal as a "response" animation after a wave-left completes.
        backwash)
            TRANSITION_DURATION=0.6
            TRANSITION_STEP=4
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.8,1.0"
            TRANSITION_WAVE="30,50"
            TRANSITION_ANGLE=180
            VARIANT_DESCRIPTION="0.6s backwash — rapid water-running-back-down-beach motion (30×50)"
            ;;

        # ── Receding: 3.5s ultra-slow retreating tide ─────────────────────────
        # Extremely slow — the wave pulls back so gradually it seems permanent.
        # Wide wavelength (150px) creates a deep swell impression.
        # Used by ash evening automation when paired with wave-left morning rise.
        receding)
            TRANSITION_DURATION=3.5
            TRANSITION_STEP=1
            TRANSITION_FPS=24
            TRANSITION_BEZIER="0.42,0.0,0.68,1.0"
            TRANSITION_WAVE="150,60"
            TRANSITION_ANGLE=180
            VARIANT_DESCRIPTION="3.5s ultra-slow receding tide — imperceptible retreat pace (150×60)"
            ;;

        # ── Storm: turbulent rightward chaos ──────────────────────────────────
        storm)
            TRANSITION_DURATION=0.8
            TRANSITION_STEP=3
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.3,1.0"
            TRANSITION_WAVE="20,100"
            TRANSITION_ANGLE=180
            VARIANT_DESCRIPTION="0.8s storm wave rightward — chaotic turbulent retreat (20×100)"
            ;;

        # ── Cinematic: slow dramatic oceanic retreat ──────────────────────────
        cinematic)
            TRANSITION_DURATION=3.0
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_WAVE="80,100"
            TRANSITION_ANGLE=180
            VARIANT_DESCRIPTION="3.0s cinematic oceanic retreat — slow majestic rightward sweep (80×100)"
            ;;

        # ── Mirror: exact axis-symmetric pair of wave-left default ────────────
        # Identical parameters to wave-left default but angle=180.
        # Used for perfect alternation in slideshow pairs.
        mirror)
            TRANSITION_DURATION=1.4
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.58,1.0"
            TRANSITION_WAVE="40,60"
            TRANSITION_ANGLE=180
            VARIANT_DESCRIPTION="1.4s perfect mirror of wave-left — identical params, opposite direction"
            ;;

        *)
            echo "wave-right.conf: unknown variant '${variant}'. Using default." >&2
            apply_variant "default"
            ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 05 — COMMAND BUILDER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

build_swww_cmd() {
    local wallpaper="${1:?wallpaper path required}"
    local monitor="${2:-}"

    local -a cmd=(
        swww img
        "$wallpaper"
        --transition-type     "$TRANSITION_TYPE"
        --transition-step     "$TRANSITION_STEP"
        --transition-fps      "$TRANSITION_FPS"
        --transition-angle    "$TRANSITION_ANGLE"
        --transition-wave     "$TRANSITION_WAVE"
        --transition-bezier   "$TRANSITION_BEZIER"
        --resize              "$RESIZE_MODE"
        --filter              "$FILTER"
    )

    if [[ "${TRANSITION_DURATION:-0}" != "0" \
       && "${TRANSITION_DURATION:-0}" != "0.0" ]]; then
        cmd+=(--transition-duration "$TRANSITION_DURATION")
    fi

    [[ -n "$monitor" ]] && cmd+=(--outputs "$monitor")

    echo "${cmd[@]}"
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 06 — MODE OVERRIDES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

apply_mode_override() {
    local mode="${1:-default}"
    case "$mode" in
        game)    apply_variant "instant"   ;;
        battery) apply_variant "ripple";
                 TRANSITION_FPS=30; FILTER="Bilinear" ;;
        focus)   apply_variant "gentle"    ;;
        cinema)  apply_variant "cinematic" ;;
        present) apply_variant "cinematic" ;;
        evening) apply_variant "receding"  ;;
        *)       apply_variant "default"   ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 07 — SELF-APPLY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

if [[ "${BASH_SOURCE[0]}" == "${0}" ]]; then
    wallpaper="${1:-}"
    variant="${2:-default}"
    monitor="${3:-}"

    if [[ -z "$wallpaper" ]]; then
        cat <<-USAGE
		Usage: wave-right.conf <wallpaper_path> [variant] [monitor]

		Variants:
		  instant    Zero-duration swap
		  ripple     1.0s tight right-to-left ripple      (10×10)
		  default    1.4s retreating ocean wave [DEFAULT] (40×60)
		  ocean      1.8s large retreating swell           (60×90)
		  undertow   1.0s powerful rip-current wave        (35×120)
		  gentle     2.0s subtle retreating ripple         (50×25)
		  backwash   0.6s water-running-back rapid reversal (30×50)
		  receding   3.5s ultra-slow retreating tide       (150×60)
		  storm      0.8s turbulent rightward chaos         (20×100)
		  cinematic  3.0s slow dramatic oceanic retreat     (80×100)
		  mirror     1.4s exact wave-left axis mirror

		Examples:
		  wave-right.conf ~/wall.jpg
		  wave-right.conf ~/wall.jpg undertow
		  wave-right.conf ~/wall.jpg receding eDP-1
		USAGE
        exit 1
    fi

    apply_variant "$variant"
    cmd=$(build_swww_cmd "$wallpaper" "$monitor")
    echo "→ Executing: $cmd"
    eval "$cmd"
fi

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  END: transitions/wave-right.conf  •  11 variants  •  ASH v5.0 OMEGA       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝