#!/usr/bin/env bash
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — SWWW TRANSITION PRESET: WIPE-LEFT               ║
# ║  Right-to-left directional reveal — RTL language natural flow              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  PRESET OVERVIEW                                                             │
# │                                                                              │
# │  TYPE:      wipe  (directional edge sweep)                                  │
# │  ANGLE:     180°  (right edge → left edge)                                  │
# │  CHARACTER: Decisive, directional, purposeful backward motion               │
# │  BEST FOR:  "Previous" navigation, RTL language setups, undo-feel changes   │
# │  GPU COST:  Low — single scanline boundary per frame                        │
# │                                                                              │
# │  VISUAL DESCRIPTION:                                                         │
# │  A vertical dividing line sweeps from the RIGHT edge of the monitor to the  │
# │  LEFT edge. To the right of the line: incoming new wallpaper.               │
# │  To the left of the line: outgoing old wallpaper.                           │
# │  The sweep motion feels like turning a page backwards — RTL navigation.    │
# │                                                                              │
# │  SWEEP DIRECTION DIAGRAM:                                                    │
# │  ╔═══════════════════════════════════════════════════╗                      │
# │  ║ OLD  OLD  │ NEW  NEW  NEW  NEW  NEW  NEW  NEW  ║  ← start state         │
# │  ║ OLD  OLD  │ NEW  NEW  NEW  NEW  NEW  NEW  NEW  ║                         │
# │  ╠═══════════════════════════════════════════════════╣                      │
# │  ║ OLD  │ NEW  NEW  NEW  NEW  NEW  NEW  NEW  NEW  ║  ← mid-transition       │
# │  ║ OLD  │ NEW  NEW  NEW  NEW  NEW  NEW  NEW  NEW  ║  (sweep leftward)       │
# │  ╠═══════════════════════════════════════════════════╣                      │
# │  ║ NEW  NEW  NEW  NEW  NEW  NEW  NEW  NEW  NEW   ║  ← complete             │
# │  ╚═══════════════════════════════════════════════════╝                      │
# │  Time →→→  [dividing line moves LEFT across screen]                         │
# │                                                                              │
# │  ANGLE REFERENCE:                                                            │
# │    0°   = left-to-right wipe (→)  [see wipe-right.conf]                    │
# │    90°  = bottom-to-top wipe (↑)  [see wipe-up.conf]                       │
# │    180° = right-to-left wipe (←) ← THIS PRESET                            │
# │    270° = top-to-bottom wipe (↓)  [see wipe-down.conf]                     │
# │                                                                              │
# │  USAGE                                                                       │
# │    ash wallpaper set <path> --transition wipe-left                          │
# │    ash wallpaper set <path> --transition wipe-left --variant fast           │
# └─────────────────────────────────────────────────────────────────────────────┘

set -euo pipefail

readonly PRESET_NAME="wipe-left"
readonly PRESET_VERSION="5.0.0"
readonly PRESET_DESCRIPTION="Right-to-left directional wipe — backwards page-turn reveal"
readonly PRESET_CATEGORY="directional"
readonly PRESET_GPU_COST="low"
readonly PRESET_TAGS="directional,rtl,decisive,wipe,sweep,backward"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 02 — CORE TRANSITION PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

TRANSITION_TYPE="wipe"

# ── Angle: 180° = right edge sweeps to left edge ──────────────────────────────
# 180° maps to a rightward-origin sweep moving toward the left.
# The wipe boundary begins at x=monitor_width and advances to x=0.
TRANSITION_ANGLE=180

# ── Step: pixels per frame the dividing line advances ────────────────────────
# At 1920px wide display: step=2 → 960 frames at 60fps → 16s (too slow)
# swww scales step relative to image dimensions automatically.
# step=2 with duration=1.0s is the recommended pairing.
TRANSITION_STEP=2

# ── Duration: 1.0s matches wipe-right for UI consistency ─────────────────────
# Left and right wipes should feel identical in speed — only direction differs.
# 1.0s is the "standard" for directional wipes in the ash preset library.
TRANSITION_DURATION=1.0

TRANSITION_FPS=60

# ── Bezier: ease-out for wipe transitions ────────────────────────────────────
# The sweep line starts fast (immediate visual feedback) and decelerates
# smoothly to rest. Avoids the abrupt "slam" of linear easing.
# 0.0,0.0 → origin: immediate maximum velocity
# 0.58,1.0 → control: sharp deceleration in final 30% of animation
TRANSITION_BEZIER="0.0,0.0,0.58,1.0"

# ── Position: not used for wipe (angle determines direction) ──────────────────
# Position is relevant for grow/outer transitions, not wipe.
# Set to center as neutral placeholder (has no effect on wipe behavior).
TRANSITION_POS="0.5,0.5"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 03 — RENDERING PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

RESIZE_MODE="crop"
FILTER="Lanczos3"
FORMAT="xrgb"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 04 — VARIANT DEFINITIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  VARIANT: instant   → No animation                                          │
# │  VARIANT: fast      → 0.5s sharp wipe                                      │
# │  VARIANT: default   → 1.0s balanced wipe ← base config                    │
# │  VARIANT: slow      → 1.8s deliberate sweep                                │
# │  VARIANT: cinematic → 2.5s dramatic theatrical sweep                       │
# │  VARIANT: diagonal  → 135° diagonal wipe (upper-right to lower-left)       │
# │  VARIANT: sharp     → Linear bezier (no easing) — mechanical feel          │
# │  VARIANT: elastic   → Overshoot bezier — wipe bounces slightly at end      │
# └─────────────────────────────────────────────────────────────────────────────┘

apply_variant() {
    local variant="${1:-default}"

    case "$variant" in

        instant)
            TRANSITION_DURATION=0.0
            TRANSITION_STEP=255
            TRANSITION_FPS=10
            TRANSITION_BEZIER="0.0,0.0,1.0,1.0"
            VARIANT_DESCRIPTION="Zero-duration instant swap"
            ;;

        fast)
            TRANSITION_DURATION=0.5
            TRANSITION_STEP=3
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.4,1.0"
            TRANSITION_ANGLE=180
            VARIANT_DESCRIPTION="0.5s sharp leftward wipe — snappy backward navigation"
            ;;

        default | "")
            TRANSITION_DURATION=1.0
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.58,1.0"
            TRANSITION_ANGLE=180
            VARIANT_DESCRIPTION="1.0s balanced rightward-to-left wipe — default speed"
            ;;

        slow)
            TRANSITION_DURATION=1.8
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_ANGLE=180
            VARIANT_DESCRIPTION="1.8s deliberate sweep — emphasizes the backward motion"
            ;;

        # ── Cinematic: 2.5s theatrical curtain-left effect ───────────────────
        # Like a theater curtain drawing from right to left.
        # Symmetrical ease-in-out gives dramatic weight to start and end.
        cinematic)
            TRANSITION_DURATION=2.5
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_ANGLE=180
            VARIANT_DESCRIPTION="2.5s theatrical curtain-close sweep — dramatic, weighty"
            ;;

        # ── Diagonal: 135° upper-right to lower-left ─────────────────────────
        # Wipe boundary travels diagonally — more dynamic than cardinal directions.
        # 135° = between right (180°) and up (90°) = upper-right origin.
        diagonal)
            TRANSITION_DURATION=1.2
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.58,1.0"
            TRANSITION_ANGLE=135
            VARIANT_DESCRIPTION="1.2s diagonal wipe at 135° — upper-right to lower-left reveal"
            ;;

        # ── Sharp: mechanical linear sweep ───────────────────────────────────
        # No easing — constant velocity boundary sweep.
        # Feels like a physical shutter or sliding panel.
        # Useful for tech/cyberpunk themes where mechanical motion fits.
        sharp)
            TRANSITION_DURATION=0.8
            TRANSITION_STEP=3
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,1.0,1.0"
            TRANSITION_ANGLE=180
            VARIANT_DESCRIPTION="0.8s linear-bezier mechanical sweep — no easing"
            ;;

        # ── Elastic: overshoot wipe with bounce ───────────────────────────────
        # The sweep boundary overshoots the target and snaps back.
        # Creates a "spring" or "rubber band" physical feel.
        # Not all versions of swww support y>1.0 bezier — graceful fallback.
        elastic)
            TRANSITION_DURATION=1.4
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.68,-0.6,0.32,1.6"
            TRANSITION_ANGLE=180
            VARIANT_DESCRIPTION="1.4s elastic-spring wipe — overshoot and settle"
            ;;

        *)
            echo "wipe-left.conf: unknown variant '${variant}'. Using default." >&2
            apply_variant "default"
            ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 05 — COMMAND BUILDER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

build_swww_cmd() {
    local wallpaper="${1:?wallpaper path required}"
    local monitor="${2:-}"

    local -a cmd=(
        swww img
        "$wallpaper"
        --transition-type     "$TRANSITION_TYPE"
        --transition-step     "$TRANSITION_STEP"
        --transition-fps      "$TRANSITION_FPS"
        --transition-angle    "$TRANSITION_ANGLE"
        --transition-bezier   "$TRANSITION_BEZIER"
        --resize              "$RESIZE_MODE"
        --filter              "$FILTER"
    )

    if [[ "${TRANSITION_DURATION:-0}" != "0" && "${TRANSITION_DURATION:-0}" != "0.0" ]]; then
        cmd+=(--transition-duration "$TRANSITION_DURATION")
    fi

    if [[ -n "$monitor" ]]; then
        cmd+=(--outputs "$monitor")
    fi

    echo "${cmd[@]}"
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 06 — MODE OVERRIDES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

apply_mode_override() {
    local mode="${1:-default}"

    case "$mode" in
        game)    apply_variant "instant"  ;;
        battery) apply_variant "fast";
                 TRANSITION_FPS=30; FILTER="Bilinear" ;;
        focus)   apply_variant "slow"     ;;
        cinema)  apply_variant "cinematic";;
        present) apply_variant "cinematic";;
        stream)  apply_variant "default"  ;;
        *)       apply_variant "default"  ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 07 — SELF-APPLY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

if [[ "${BASH_SOURCE[0]}" == "${0}" ]]; then
    wallpaper="${1:-}"
    variant="${2:-default}"
    monitor="${3:-}"

    if [[ -z "$wallpaper" ]]; then
        echo "Usage: wipe-left.conf <wallpaper_path> [variant] [monitor]"
        echo "Variants: instant fast default slow cinematic diagonal sharp elastic"
        exit 1
    fi

    apply_variant "$variant"
    cmd=$(build_swww_cmd "$wallpaper" "$monitor")
    echo "→ Executing: $cmd"
    eval "$cmd"
fi

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  END: transitions/wipe-left.conf  •  8 variants  •  ASH v5.0 OMEGA         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝