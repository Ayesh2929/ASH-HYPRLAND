#!/usr/bin/env bash
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — SWWW TRANSITION PRESET: GROW-TOP-LEFT           ║
# ║  Radial expansion from top-left corner — reading-start, beginning energy   ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  PRESET OVERVIEW                                                             │
# │                                                                              │
# │  TYPE:      grow  (radial expansion from origin point)                      │
# │  POSITION:  0.0,0.0  (top-left corner of monitor)                          │
# │  CHARACTER: Creative, originating, reading-start energy, fresh beginning   │
# │  BEST FOR:  Morning startup, creative workflows, "new" theme introductions  │
# │  GPU COST:  Medium — arc covers full diagonal from corner to corner         │
# │                                                                              │
# │  VISUAL DESCRIPTION:                                                         │
# │  The new wallpaper bursts from the top-left corner as an expanding arc.    │
# │  The corner origin creates an asymmetric expansion — the circle grows       │
# │  downward and rightward simultaneously, revealing the new image through     │
# │  a quarter-circle sweep that fills the screen diagonally.                  │
# │                                                                              │
# │  CORNER EXPANSION DIAGRAM:                                                   │
# │  Frame 0%           Frame 40%          Frame 70%          Frame 100%        │
# │  ┌─────────┐        ┌─────────┐        ┌─────────┐        ┌─────────┐      │
# │  │✦ OLD OLD│        │✦ NEW╮ O │        │✦─────╮  │        │NEW NEW  │      │
# │  │OLD OLD  │        │OLD ╰╮ O │        │NEW   ╰╮ │        │NEW NEW  │      │
# │  │OLD OLD  │        │OLD OLD  │        │NEW    ╰╮│        │NEW NEW  │      │
# │  │OLD OLD  │        │OLD OLD  │        │NEW  OLD │        │NEW NEW  │      │
# │  │OLD OLD  │        │OLD OLD  │        │NEW  OLD │        │NEW NEW  │      │
# │  └─────────┘        └─────────┘        └─────────┘        └─────────┘      │
# │  ✦ = origin (0.0,0.0) — top-left pixel                                     │
# │                                                                              │
# │  GEOMETRY NOTE:                                                              │
# │  Corner origin means the circle only needs to cover ¾ of the usual         │
# │  center-grow radius. The diagonal distance from top-left corner to          │
# │  bottom-right corner = √(W² + H²) ≈ 2202px on 1920×1080.                 │
# │  The circle must reach this full diagonal to complete the reveal.           │
# │  This makes corner grows ~73% larger radius than center grows.             │
# │                                                                              │
# │  PSYCHOLOGICAL ASSOCIATIONS:                                                 │
# │  Top-left = reading start, story beginning, fresh page, 始 (beginning)     │
# │  In most cultures using LTR scripts, the top-left is the natural start.   │
# │  This origin point feels like a "new chapter" or "new beginning".          │
# └─────────────────────────────────────────────────────────────────────────────┘

set -euo pipefail

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 01 — PRESET IDENTITY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

readonly PRESET_NAME="grow-top-left"
readonly PRESET_VERSION="5.0.0"
readonly PRESET_DESCRIPTION="Radial grow from top-left corner — beginning, creation, reading-start energy"
readonly PRESET_CATEGORY="radial"
readonly PRESET_GPU_COST="medium"
readonly PRESET_TAGS="radial,grow,corner,top-left,beginning,creative,asymmetric"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 02 — CORE TRANSITION PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

TRANSITION_TYPE="grow"

# ── Position: top-left corner ─────────────────────────────────────────────────
# 0.0,0.0 = exact top-left pixel of the monitor.
# swww maps (0.0,0.0) to the pixel at monitor origin — no offset applied.
# Note: Some versions of swww may treat 0.0 as "auto" — using 0.01,0.01
#       as a micro-offset avoids potential edge cases while staying at corner.
TRANSITION_POS="0.0,0.0"

TRANSITION_STEP=2
TRANSITION_DURATION=1.3
TRANSITION_FPS=60

# ── Bezier: expo-out — matches creative, energetic corner origin ───────────────
# Corner-origin grows feel most natural with expo-out:
# The arc "leaps" from the corner at maximum velocity (the corner is "charged")
# then decelerates as it reaches the far diagonal corner (bottom-right).
# The far corner receiving the last pixels creates a natural "completion" moment.
TRANSITION_BEZIER="0.16,1.0,0.3,1.0"

TRANSITION_ANGLE=0

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 03 — RENDERING PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

RESIZE_MODE="crop"
FILTER="CatmullRom"
FORMAT="xrgb"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 04 — VARIANT DEFINITIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  VARIANT: instant    → No animation                                         │
# │  VARIANT: fast       → 0.6s rapid corner burst                             │
# │  VARIANT: default    → 1.3s expo-out corner grow ← base config            │
# │  VARIANT: smooth     → 1.8s smooth asymmetric expansion                    │
# │  VARIANT: slow       → 2.5s deliberate diagonal reveal                     │
# │  VARIANT: spark      → 0.35s near-instant spark from corner                │
# │  VARIANT: cinematic  → 3.0s dramatic corner-to-corner reveal               │
# │  VARIANT: elastic    → 1.5s spring bounce from corner                      │
# │  VARIANT: diagonal   → Shifts origin slightly inward for soft-corner look  │
# │  VARIANT: sharp      → 0.9s linear constant-rate corner arc                │
# └─────────────────────────────────────────────────────────────────────────────┘

apply_variant() {
    local variant="${1:-default}"

    case "$variant" in

        instant)
            TRANSITION_DURATION=0.0
            TRANSITION_STEP=255
            TRANSITION_FPS=10
            TRANSITION_BEZIER="0.0,0.0,1.0,1.0"
            TRANSITION_POS="0.0,0.0"
            VARIANT_DESCRIPTION="Zero-duration instant swap"
            ;;

        # ── Fast: 0.6s rapid corner burst ────────────────────────────────────
        fast)
            TRANSITION_DURATION=0.6
            TRANSITION_STEP=3
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.3,1.0"
            TRANSITION_POS="0.0,0.0"
            VARIANT_DESCRIPTION="0.6s rapid corner burst — energetic top-left origin expand"
            ;;

        default | "")
            TRANSITION_DURATION=1.3
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.16,1.0,0.3,1.0"
            TRANSITION_POS="0.0,0.0"
            VARIANT_DESCRIPTION="1.3s expo-out grow from top-left — creative beginning energy"
            ;;

        # ── Smooth: 1.8s ease-in-out ──────────────────────────────────────────
        smooth)
            TRANSITION_DURATION=1.8
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_POS="0.0,0.0"
            VARIANT_DESCRIPTION="1.8s smooth asymmetric corner expansion — balanced diagonal reveal"
            ;;

        # ── Slow: 2.5s deliberate diagonal ───────────────────────────────────
        slow)
            TRANSITION_DURATION=2.5
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_POS="0.0,0.0"
            VARIANT_DESCRIPTION="2.5s deliberate corner-to-corner diagonal reveal"
            ;;

        # ── Spark: 0.35s near-instant spark effect ────────────────────────────
        # The fastest visible grow — like a spark igniting from the corner.
        # The arc sweeps to the far corner so fast it appears as a single
        # expanding flash. Maximum impact, maximum brevity.
        spark)
            TRANSITION_DURATION=0.35
            TRANSITION_STEP=8
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.1,1.0"
            TRANSITION_POS="0.0,0.0"
            VARIANT_DESCRIPTION="0.35s spark ignition — fastest visible corner grow effect"
            ;;

        # ── Cinematic: 3.0s dramatic corner-to-corner reveal ─────────────────
        # Slow enough to be clearly intentional and visually impressive.
        # The diagonal path from top-left to bottom-right traces the
        # full viewport diagonal — maximum screen real estate used.
        cinematic)
            TRANSITION_DURATION=3.0
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.25,0.1,0.58,1.0"
            TRANSITION_POS="0.0,0.0"
            VARIANT_DESCRIPTION="3.0s cinematic corner-to-corner diagonal reveal"
            ;;

        # ── Elastic: spring bounce from corner ────────────────────────────────
        elastic)
            TRANSITION_DURATION=1.5
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.68,-0.6,0.32,1.6"
            TRANSITION_POS="0.0,0.0"
            VARIANT_DESCRIPTION="1.5s elastic spring — bouncy energetic corner burst"
            ;;

        # ── Diagonal: near-corner soft origin ────────────────────────────────
        # Shifts origin 5% inward from corner.
        # Avoids the mathematical singularity at 0,0 on some swww versions.
        # Visually nearly identical to true corner but more stable.
        diagonal)
            TRANSITION_DURATION=1.3
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.16,1.0,0.3,1.0"
            TRANSITION_POS="0.05,0.05"
            VARIANT_DESCRIPTION="1.3s near-corner grow with 5% inset origin — stable corner effect"
            ;;

        # ── Sharp: constant-rate corner arc ───────────────────────────────────
        sharp)
            TRANSITION_DURATION=0.9
            TRANSITION_STEP=3
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,1.0,1.0"
            TRANSITION_POS="0.0,0.0"
            VARIANT_DESCRIPTION="0.9s linear constant-rate corner arc — mechanical precision"
            ;;

        *)
            echo "grow-top-left.conf: unknown variant '${variant}'. Using default." >&2
            apply_variant "default"
            ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 05 — COMMAND BUILDER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

build_swww_cmd() {
    local wallpaper="${1:?wallpaper path required}"
    local monitor="${2:-}"

    local -a cmd=(
        swww img
        "$wallpaper"
        --transition-type     "$TRANSITION_TYPE"
        --transition-step     "$TRANSITION_STEP"
        --transition-fps      "$TRANSITION_FPS"
        --transition-pos      "$TRANSITION_POS"
        --transition-bezier   "$TRANSITION_BEZIER"
        --resize              "$RESIZE_MODE"
        --filter              "$FILTER"
    )

    if [[ "${TRANSITION_DURATION:-0}" != "0" \
       && "${TRANSITION_DURATION:-0}" != "0.0" ]]; then
        cmd+=(--transition-duration "$TRANSITION_DURATION")
    fi

    [[ -n "$monitor" ]] && cmd+=(--outputs "$monitor")

    echo "${cmd[@]}"
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 06 — MODE OVERRIDES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

apply_mode_override() {
    local mode="${1:-default}"
    case "$mode" in
        game)    apply_variant "instant"   ;;
        battery) apply_variant "fast";
                 TRANSITION_FPS=30; FILTER="Bilinear" ;;
        focus)   apply_variant "smooth"    ;;
        cinema)  apply_variant "cinematic" ;;
        present) apply_variant "cinematic" ;;
        stream)  apply_variant "default"   ;;
        work)    apply_variant "smooth"    ;;
        *)       apply_variant "default"   ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 07 — SELF-APPLY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

if [[ "${BASH_SOURCE[0]}" == "${0}" ]]; then
    wallpaper="${1:-}"
    variant="${2:-default}"
    monitor="${3:-}"

    if [[ -z "$wallpaper" ]]; then
        cat <<-USAGE
		Usage: grow-top-left.conf <wallpaper_path> [variant] [monitor]

		Variants:
		  instant    Zero-duration swap
		  fast       0.6s rapid corner burst
		  default    1.3s expo-out corner grow [DEFAULT]
		  smooth     1.8s ease-in-out expansion
		  slow       2.5s deliberate diagonal reveal
		  spark      0.35s near-instant spark ignition
		  cinematic  3.0s dramatic diagonal reveal
		  elastic    1.5s spring bounce from corner
		  diagonal   1.3s near-corner (5% inset) stable origin
		  sharp      0.9s linear constant-rate arc

		Examples:
		  grow-top-left.conf ~/wall.jpg
		  grow-top-left.conf ~/wall.jpg spark
		  grow-top-left.conf ~/wall.jpg cinematic eDP-1
		USAGE
        exit 1
    fi

    apply_variant "$variant"
    cmd=$(build_swww_cmd "$wallpaper" "$monitor")
    echo "→ Executing: $cmd"
    eval "$cmd"
fi

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  END: transitions/grow-top-left.conf  •  10 variants  •  ASH v5.0 OMEGA    ║
