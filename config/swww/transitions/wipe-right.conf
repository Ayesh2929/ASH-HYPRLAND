#!/usr/bin/env bash
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — SWWW TRANSITION PRESET: WIPE-RIGHT              ║
# ║  Left-to-right directional reveal — LTR natural forward page-turn          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  PRESET OVERVIEW                                                             │
# │                                                                              │
# │  TYPE:      wipe  (directional edge sweep)                                  │
# │  ANGLE:     0°    (left edge → right edge)                                  │
# │  CHARACTER: Forward, progressive, confident — the default "next" motion     │
# │  BEST FOR:  Theme changes, "next" navigation, LTR language default          │
# │  GPU COST:  Low — single scanline boundary per frame                        │
# │                                                                              │
# │  VISUAL DESCRIPTION:                                                         │
# │  A vertical dividing line sweeps from the LEFT edge of the monitor to the   │
# │  RIGHT edge. To the left of the line: incoming new wallpaper.               │
# │  To the right of the line: outgoing old wallpaper.                          │
# │  Feels like turning a page forward — the natural "next" gesture for LTR.   │
# │                                                                              │
# │  SWEEP DIRECTION DIAGRAM:                                                    │
# │  ╔═══════════════════════════════════════════════════╗                      │
# │  ║ NEW  │ OLD  OLD  OLD  OLD  OLD  OLD  OLD  OLD  ║  ← start state         │
# │  ║ NEW  │ OLD  OLD  OLD  OLD  OLD  OLD  OLD  OLD  ║                         │
# │  ╠═══════════════════════════════════════════════════╣                      │
# │  ║ NEW  NEW  NEW  NEW  NEW  │ OLD  OLD  OLD  OLD  ║  ← mid-transition       │
# │  ║ NEW  NEW  NEW  NEW  NEW  │ OLD  OLD  OLD  OLD  ║  (sweep rightward)      │
# │  ╠═══════════════════════════════════════════════════╣                      │
# │  ║ NEW  NEW  NEW  NEW  NEW  NEW  NEW  NEW  NEW   ║  ← complete             │
# │  ╚═══════════════════════════════════════════════════╝                      │
# │  Time →→→  [dividing line moves RIGHT across screen]                        │
# │                                                                              │
# │  THIS IS THE DEFAULT TRANSITION used by ash theme apply for most themes.   │
# │  All other directional wipes are variants of this fundamental preset.       │
# └─────────────────────────────────────────────────────────────────────────────┘

set -euo pipefail

readonly PRESET_NAME="wipe-right"
readonly PRESET_VERSION="5.0.0"
readonly PRESET_DESCRIPTION="Left-to-right directional wipe — forward page-turn reveal (system default)"
readonly PRESET_CATEGORY="directional"
readonly PRESET_GPU_COST="low"
readonly PRESET_TAGS="directional,ltr,forward,decisive,wipe,sweep,default"
readonly PRESET_IS_DEFAULT=true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 02 — CORE TRANSITION PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

TRANSITION_TYPE="wipe"

# ── Angle: 0° = left edge sweeps to right edge ────────────────────────────────
# In swww's coordinate system:
#   0°  = wipe in direction of 0° (East / rightward sweep)
# The new wallpaper is revealed from the left, pushing the old one right.
TRANSITION_ANGLE=0

TRANSITION_STEP=2
TRANSITION_DURATION=1.0
TRANSITION_FPS=60

# ── Bezier: ease-out-cubic ────────────────────────────────────────────────────
# Identical to wipe-left for symmetric feel across left/right pairs.
# Fast initial sweep gives immediate visual feedback of direction.
# Deceleration provides smooth landing when sweep reaches right edge.
TRANSITION_BEZIER="0.0,0.0,0.58,1.0"

TRANSITION_POS="0.5,0.5"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 03 — RENDERING PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

RESIZE_MODE="crop"
FILTER="Lanczos3"
FORMAT="xrgb"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 04 — VARIANT DEFINITIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Wipe-right has the richest variant set as it is the primary system transition.
# Extended with theme-type variants that set angle + duration together.

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  VARIANT: instant    → No animation                                         │
# │  VARIANT: fast       → 0.5s snappy wipe                                    │
# │  VARIANT: default    → 1.0s system default ← base config                  │
# │  VARIANT: smooth     → 1.5s premium smooth                                 │
# │  VARIANT: slow       → 2.0s deliberate sweep                               │
# │  VARIANT: cinematic  → 3.0s theatrical curtain-open                        │
# │  VARIANT: diagonal   → 45° diagonal wipe (lower-left to upper-right)       │
# │  VARIANT: sharp      → Linear bezier mechanical sweep                      │
# │  VARIANT: elastic    → Overshoot spring wipe                               │
# │  VARIANT: stagger    → Staggered multi-monitor wipe (sets delay)           │
# └─────────────────────────────────────────────────────────────────────────────┘

apply_variant() {
    local variant="${1:-default}"

    case "$variant" in

        instant)
            TRANSITION_DURATION=0.0
            TRANSITION_STEP=255
            TRANSITION_FPS=10
            TRANSITION_BEZIER="0.0,0.0,1.0,1.0"
            TRANSITION_ANGLE=0
            VARIANT_DESCRIPTION="Zero-duration instant swap"
            ;;

        fast)
            TRANSITION_DURATION=0.5
            TRANSITION_STEP=3
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.4,1.0"
            TRANSITION_ANGLE=0
            VARIANT_DESCRIPTION="0.5s rapid leftward-to-right wipe — snappy forward navigation"
            ;;

        default | "")
            TRANSITION_DURATION=1.0
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.58,1.0"
            TRANSITION_ANGLE=0
            VARIANT_DESCRIPTION="1.0s system default — the standard ash wipe-right"
            ;;

        # ── Smooth: premium 1.5s with expo easing ────────────────────────────
        # The "best looking" wipe for most aesthetic setups.
        # expo-out bezier: extremely fast start, very gradual deceleration.
        # Makes the new wallpaper seem to "rush in" confidently.
        smooth)
            TRANSITION_DURATION=1.5
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.16,1.0,0.3,1.0"
            TRANSITION_ANGLE=0
            VARIANT_DESCRIPTION="1.5s smooth expo-out wipe — premium aesthetic quality"
            ;;

        slow)
            TRANSITION_DURATION=2.0
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_ANGLE=0
            VARIANT_DESCRIPTION="2.0s deliberate sweep — emphasizes the forward motion"
            ;;

        # ── Cinematic: 3.0s theatrical curtain-open ───────────────────────────
        # Like a theater curtain drawing from left to right.
        # Linear start with ease-out landing = old film projector feel.
        cinematic)
            TRANSITION_DURATION=3.0
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.25,0.1,0.25,1.0"
            TRANSITION_ANGLE=0
            VARIANT_DESCRIPTION="3.0s theatrical curtain-open sweep — cinematic reveal"
            ;;

        # ── Diagonal: 45° lower-left to upper-right ───────────────────────────
        # Diagonal wipe creates more visual dynamism than horizontal.
        # 45° = northeast direction (lower-left origin, upper-right terminus).
        diagonal)
            TRANSITION_DURATION=1.3
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.58,1.0"
            TRANSITION_ANGLE=45
            VARIANT_DESCRIPTION="1.3s diagonal wipe at 45° — lower-left to upper-right reveal"
            ;;

        sharp)
            TRANSITION_DURATION=0.8
            TRANSITION_STEP=3
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,1.0,1.0"
            TRANSITION_ANGLE=0
            VARIANT_DESCRIPTION="0.8s linear-bezier mechanical sweep — no easing"
            ;;

        elastic)
            TRANSITION_DURATION=1.4
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.68,-0.6,0.32,1.6"
            TRANSITION_ANGLE=0
            VARIANT_DESCRIPTION="1.4s elastic-spring wipe — overshoot and settle"
            ;;

        # ── Stagger: multi-monitor sequential reveal ──────────────────────────
        # Same as default but signals to ash setter to stagger monitor starts.
        # The delay variable is read by wallpaper-engine/setter.sh.
        stagger)
            TRANSITION_DURATION=1.0
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.58,1.0"
            TRANSITION_ANGLE=0
            SWWW_STAGGER_DELAY_MS=200
            VARIANT_DESCRIPTION="1.0s staggered wipe — monitors start sequentially (200ms apart)"
            ;;

        *)
            echo "wipe-right.conf: unknown variant '${variant}'. Using default." >&2
            apply_variant "default"
            ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 05 — COMMAND BUILDER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

build_swww_cmd() {
    local wallpaper="${1:?wallpaper path required}"
    local monitor="${2:-}"

    local -a cmd=(
        swww img
        "$wallpaper"
        --transition-type     "$TRANSITION_TYPE"
        --transition-step     "$TRANSITION_STEP"
        --transition-fps      "$TRANSITION_FPS"
        --transition-angle    "$TRANSITION_ANGLE"
        --transition-bezier   "$TRANSITION_BEZIER"
        --resize              "$RESIZE_MODE"
        --filter              "$FILTER"
    )

    if [[ "${TRANSITION_DURATION:-0}" != "0" && "${TRANSITION_DURATION:-0}" != "0.0" ]]; then
        cmd+=(--transition-duration "$TRANSITION_DURATION")
    fi

    if [[ -n "$monitor" ]]; then
        cmd+=(--outputs "$monitor")
    fi

    echo "${cmd[@]}"
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 06 — MODE OVERRIDES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

apply_mode_override() {
    local mode="${1:-default}"

    case "$mode" in
        game)    apply_variant "instant"   ;;
        battery) apply_variant "fast";
                 TRANSITION_FPS=30; FILTER="Bilinear" ;;
        focus)   apply_variant "slow"      ;;
        cinema)  apply_variant "cinematic" ;;
        present) apply_variant "cinematic" ;;
        stream)  apply_variant "smooth"    ;;
        work)    apply_variant "default"   ;;
        *)       apply_variant "default"   ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 07 — SELF-APPLY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

if [[ "${BASH_SOURCE[0]}" == "${0}" ]]; then
    wallpaper="${1:-}"
    variant="${2:-default}"
    monitor="${3:-}"

    if [[ -z "$wallpaper" ]]; then
        echo "Usage: wipe-right.conf <wallpaper_path> [variant] [monitor]"
        echo "Variants: instant fast default smooth slow cinematic diagonal sharp elastic stagger"
        exit 1
    fi

    apply_variant "$variant"
    cmd=$(build_swww_cmd "$wallpaper" "$monitor")
    echo "→ Executing: $cmd"
    eval "$cmd"
fi

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  END: transitions/wipe-right.conf  •  10 variants  •  ASH v5.0 OMEGA       ║
