#!/usr/bin/env bash
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — SWWW TRANSITION PRESET: RANDOM                  ║
# ║  Intelligent stochastic transition engine — weighted, context-aware, never ║
# ║  repeating the same transition twice in a row                              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  PRESET OVERVIEW                                                             │
# │                                                                              │
# │  TYPE:      meta-preset (orchestrates all other transition presets)         │
# │  CHARACTER: Surprising, varied, discovery — every change is unique         │
# │  BEST FOR:  Slideshow rotation, daily desktop variety, aesthetic discovery  │
# │  GPU COST:  Varies — weighted toward lower-cost transitions by default      │
# │                                                                              │
# │  ARCHITECTURE:                                                               │
# │  Unlike other presets that call `swww img` directly, random.conf is a      │
# │  META-PRESET that selects and delegates to another preset file.            │
# │  It sources the selected preset's .conf file and calls build_swww_cmd().   │
# │                                                                              │
# │  SELECTION SYSTEM:                                                           │
# │  Four-layer weighted selection hierarchy:                                   │
# │                                                                              │
# │  Layer 1: MODE FILTER                                                        │
# │    Excludes transitions inappropriate for current ash mode.                 │
# │    (e.g. battery mode only allows instant/fast/fade transitions)            │
# │                                                                              │
# │  Layer 2: THEME AFFINITY WEIGHTS                                             │
# │    Transitions are weighted based on active theme category:                 │
# │    • nature/ocean themes → wave transitions preferred                      │
# │    • neon/cyberpunk → wipe and outer transitions preferred                 │
# │    • minimal → fade and simple transitions preferred                       │
# │    • anime/pastel → grow-center with spring variants                       │
# │                                                                              │
# │  Layer 3: NO-REPEAT GUARD                                                    │
# │    Reads last used transition from state file.                              │
# │    Guarantees different transition each time (no consecutive duplicates).   │
# │                                                                              │
# │  Layer 4: VARIANT SELECTION                                                  │
# │    Once a transition TYPE is selected, picks an appropriate variant.        │
# │    Variants weighted toward "default" with occasional special picks.        │
# │                                                                              │
# │  STATE FILE:                                                                 │
# │    ~/.cache/ash/state/last-transition.json                                  │
# │    { "type": "wipe-right", "variant": "default", "ts": "2025-01-15T..." }  │
# └─────────────────────────────────────────────────────────────────────────────┘

set -euo pipefail

readonly PRESET_NAME="random"
readonly PRESET_VERSION="5.0.0"
readonly PRESET_DESCRIPTION="Intelligent stochastic transition — weighted, context-aware, no-repeat guaranteed"
readonly PRESET_CATEGORY="meta"
readonly PRESET_GPU_COST="varies"
readonly PRESET_TAGS="random,meta,variety,stochastic,weighted,intelligent,discovery"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 01 — CONFIGURATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

readonly TRANSITIONS_DIR="$(dirname "${BASH_SOURCE[0]}")"
readonly STATE_FILE="${XDG_CACHE_HOME:-$HOME/.cache}/ash/state/last-transition.json"
readonly ASH_STATE="${XDG_CACHE_HOME:-$HOME/.cache}/ash/state"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 02 — TRANSITION POOL & WEIGHT DEFINITIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Base weight table: higher weight = more likely to be selected.
# Total weight pool = 100 (percentages). Normalised at runtime.
# Format: "transition_name:base_weight"
# Weights modified by theme affinity and mode filters.

declare -A BASE_WEIGHTS=(
    [fade]=15           # Universal — always appropriate
    [wipe-right]=18     # System default — most natural forward motion
    [wipe-left]=8       # Backward — less common but valuable variety
    [wipe-up]=8         # Vertical — good for morning/ascending mood
    [wipe-down]=8       # Vertical — good for evening/descending mood
    [grow-center]=10    # Dramatic — premium visual impact
    [grow-top-left]=5   # Corner — creative, asymmetric variety
    [grow-top-right]=5  # Corner — RTL/notification aligned
    [wave-left]=8       # Organic — nature feel
    [wave-right]=5      # Organic — retreating, less common
    [outer]=6           # Inverse grow — cinematic, unique
)

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 03 — THEME AFFINITY MODIFIERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Theme categories boost certain transition weights multiplicatively.
# A weight of 1.0 = no change. 2.0 = doubled probability. 0.5 = halved.

declare -A THEME_AFFINITY_NATURE=(
    [wave-left]=3.0 [wave-right]=2.5 [grow-center]=1.5
    [fade]=1.2 [wipe-up]=1.5 [outer]=0.5
)

declare -A THEME_AFFINITY_NEON=(
    [wipe-right]=2.0 [outer]=2.5 [grow-center]=2.0
    [wave-left]=0.5 [wave-right]=0.3 [fade]=1.5
)

declare -A THEME_AFFINITY_MINIMAL=(
    [fade]=3.0 [wipe-right]=2.0 [wipe-left]=1.5
    [grow-center]=0.5 [wave-left]=0.3 [outer]=0.8
)

declare -A THEME_AFFINITY_ANIME=(
    [grow-center]=3.0 [wave-left]=2.0 [fade]=1.5
    [outer]=2.0 [wipe-up]=1.8 [grow-top-left]=2.0
)

declare -A THEME_AFFINITY_SPACE=(
    [outer]=3.0 [grow-center]=2.5 [fade]=2.0
    [wave-left]=0.5 [wipe-down]=2.0
)

declare -A THEME_AFFINITY_DARK=(
    [wipe-right]=1.2 [fade]=1.1 [outer]=1.3
    [grow-center]=1.1
)

declare -A THEME_AFFINITY_RETRO=(
    [wipe-right]=2.5 [wipe-left]=2.5 [wipe-up]=2.0
    [wipe-down]=2.0 [fade]=1.5 [wave-left]=0.5
)

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 04 — VARIANT PROBABILITY TABLES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# For each transition type, defines variant selection probabilities.
# Format: "variant:weight" pairs. Weights are relative (not absolute %).
# "default" always has highest weight — most transitions use their base config.
# Special variants are occasionally surfaced for pleasant surprise.

declare -A VARIANT_WEIGHTS_FADE=(
    [default]=60 [slow]=15 [fast]=10 [cinematic]=8 [breathing]=7
)

declare -A VARIANT_WEIGHTS_WIPE_RIGHT=(
    [default]=50 [smooth]=20 [slow]=10 [fast]=8 [cinematic]=7 [diagonal]=5
)

declare -A VARIANT_WEIGHTS_WIPE_LEFT=(
    [default]=55 [slow]=15 [fast]=10 [cinematic]=10 [diagonal]=7 [elastic]=3
)

declare -A VARIANT_WEIGHTS_WIPE_UP=(
    [default]=50 [smooth]=15 [slow]=10 [fast]=8 [cinematic]=8 [rise]=5 [elastic]=4
)

declare -A VARIANT_WEIGHTS_WIPE_DOWN=(
    [default]=50 [smooth]=15 [slow]=10 [cinematic]=8 [nightfall]=7 [gravity]=7 [curtain]=3
)

declare -A VARIANT_WEIGHTS_GROW_CENTER=(
    [default]=45 [smooth]=20 [slow]=10 [fast]=8 [portal]=5 [cinematic]=7 [elastic]=5
)

declare -A VARIANT_WEIGHTS_GROW_TOP_LEFT=(
    [default]=50 [smooth]=15 [slow]=10 [cinematic]=12 [fast]=8 [elastic]=5
)

declare -A VARIANT_WEIGHTS_GROW_TOP_RIGHT=(
    [default]=50 [smooth]=15 [slow]=10 [cinematic]=12 [fast]=8 [mirror]=5
)

declare -A VARIANT_WEIGHTS_WAVE_LEFT=(
    [default]=40 [ocean]=20 [gentle]=15 [swell]=10 [silk]=8 [ripple]=7
)

declare -A VARIANT_WEIGHTS_WAVE_RIGHT=(
    [default]=45 [ocean]=15 [gentle]=15 [swell]=10 [mirror]=10 [receding]=5
)

declare -A VARIANT_WEIGHTS_OUTER=(
    [default]=45 [smooth]=20 [iris-close]=15 [slow]=10 [cinematic]=5 [drain]=5
)

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 05 — MODE FILTER (excludes inappropriate transitions)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Returns a space-separated list of ALLOWED transition names for current mode.
_get_mode_allowed_transitions() {
    local mode="${1:-default}"

    case "$mode" in
        game)
            # Game mode: only instant (handled at variant level)
            # Return all but they'll all use instant variant
            echo "fade wipe-right"
            ;;
        battery)
            # Battery: fast light transitions only, no medium/heavy GPU cost
            echo "fade wipe-right wipe-left"
            ;;
        focus)
            # Focus: gentle, non-distracting transitions
            echo "fade wipe-right wipe-left wipe-up wipe-down wave-left"
            ;;
        cinema|present)
            # Cinema/present: premium cinematic only
            echo "fade wipe-right outer grow-center wipe-up wave-left"
            ;;
        stream)
            # Stream: visually interesting but not too chaotic
            echo "fade wipe-right wipe-up grow-center wave-left outer"
            ;;
        *)
            # Default/all other modes: full pool
            echo "fade wipe-right wipe-left wipe-up wipe-down grow-center grow-top-left grow-top-right wave-left wave-right outer"
            ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 06 — STATE MANAGEMENT (no-repeat guard)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Read last used transition type from state file ────────────────────────────
_get_last_transition() {
    [[ ! -f "$STATE_FILE" ]] && echo "" && return 0

    local last
    last=$(grep -oP '"type":\s*"\K[^"]+' "$STATE_FILE" 2>/dev/null | head -1)
    echo "${last:-}"
}

# ── Write selected transition to state file ───────────────────────────────────
_write_transition_state() {
    local type="${1:-}"
    local variant="${2:-default}"

    mkdir -p "$(dirname "$STATE_FILE")"
    cat > "$STATE_FILE" <<-JSON
	{
	  "type": "${type}",
	  "variant": "${variant}",
	  "selected_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
	  "preset": "random"
	}
	JSON
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 07 — WEIGHTED RANDOM SELECTION ENGINE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Read active theme category from ash state ─────────────────────────────────
_get_theme_category() {
    local theme_file="${ASH_STATE}/current-theme.json"
    [[ ! -f "$theme_file" ]] && echo "dark" && return 0

    local category
    category=$(grep -oP '"category":\s*"\K[^"]+' "$theme_file" 2>/dev/null | head -1)
    echo "${category:-dark}"
}

# ── Read active ash mode ──────────────────────────────────────────────────────
_get_active_mode() {
    local mode_file="${ASH_STATE}/current-mode.json"
    [[ ! -f "$mode_file" ]] && echo "default" && return 0

    local mode
    mode=$(grep -oP '"mode":\s*"\K[^"]+' "$mode_file" 2>/dev/null | head -1)
    echo "${mode:-default}"
}

# ── Apply theme affinity multipliers to base weights ─────────────────────────
# Returns: associative array name (caller evaluates it)
_apply_theme_affinity() {
    local -n weights_ref=$1
    local category="${2:-dark}"

    # Select affinity table based on theme category
    local -n affinity_ref
    case "$category" in
        nature|ocean|forest|rainforest) affinity_ref=THEME_AFFINITY_NATURE ;;
        neon|cyberpunk|synthwave)       affinity_ref=THEME_AFFINITY_NEON   ;;
        minimal|zen|monochrome)         affinity_ref=THEME_AFFINITY_MINIMAL ;;
        anime|pastel|lofi)              affinity_ref=THEME_AFFINITY_ANIME   ;;
        space|galaxy|nebula)            affinity_ref=THEME_AFFINITY_SPACE   ;;
        retro|vaporwave|8bit)           affinity_ref=THEME_AFFINITY_RETRO   ;;
        *)                              affinity_ref=THEME_AFFINITY_DARK    ;;
    esac

    # Apply multipliers
    local key
    for key in "${!affinity_ref[@]}"; do
        if [[ -n "${weights_ref[$key]+set}" ]]; then
            local base="${weights_ref[$key]}"
            local mult="${affinity_ref[$key]}"
            # Integer multiplication with bash (multiply base × mult, keep integer)
            weights_ref[$key]=$(echo "$base $mult" | awk '{printf "%d", $1 * $2}')
        fi
    done
}

# ── Weighted random selection from associative array ─────────────────────────
# Usage: _weighted_random_select "assoc_array_name" "exclude_key"
# Returns: selected key
_weighted_random_select() {
    local -n pool_ref=$1
    local exclude="${2:-}"

    # Build total weight (excluding the excluded key)
    local total=0
    local key
    for key in "${!pool_ref[@]}"; do
        [[ "$key" == "$exclude" ]] && continue
        total=$(( total + pool_ref[$key] ))
    done

    [[ $total -le 0 ]] && echo "" && return 0

    # Generate random value in range [0, total)
    local rand=$(( RANDOM % total ))

    # Walk through pool to find selected key
    local cumulative=0
    for key in "${!pool_ref[@]}"; do
        [[ "$key" == "$exclude" ]] && continue
        cumulative=$(( cumulative + pool_ref[$key] ))
        if [[ $cumulative -gt $rand ]]; then
            echo "$key"
            return 0
        fi
    done

    # Fallback: return first non-excluded key
    for key in "${!pool_ref[@]}"; do
        [[ "$key" == "$exclude" ]] && continue
        echo "$key"
        return 0
    done

    echo "fade"
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 08 — VARIANT SELECTION ENGINE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Select variant for the chosen transition type ─────────────────────────────
# Uses per-transition variant weight tables defined in Section 04.
_select_variant() {
    local transition="${1:-fade}"
    local mode="${2:-default}"

    # Game/battery modes always use fast/instant variants
    case "$mode" in
        game)    echo "instant" && return 0 ;;
        battery) echo "fast"    && return 0 ;;
    esac

    # Select variant weight table for this transition type
    local table_name
    table_name="VARIANT_WEIGHTS_${transition//-/_}"
    table_name="${table_name^^}"

    # Check if table exists (bash nameref validation)
    if ! declare -p "$table_name" &>/dev/null 2>&1; then
        echo "default"
        return 0
    fi

    local -n variant_table="$table_name"
    _weighted_random_select variant_table ""
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 09 — MAIN SELECTION ORCHESTRATOR
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Select the best transition for current context ────────────────────────────
# Returns: "transition_name variant_name" space-separated pair
select_transition() {
    local mode variant selected

    # Step 1: Determine context
    mode=$(_get_active_mode)
    local theme_category
    theme_category=$(_get_theme_category)
    local last_transition
    last_transition=$(_get_last_transition)

    # Step 2: Get mode-allowed transition pool
    local -a allowed_transitions
    read -ra allowed_transitions <<< "$(_get_mode_allowed_transitions "$mode")"

    # Step 3: Build weighted pool from base weights, filtered to allowed set
    declare -A working_weights=()
    local t
    for t in "${allowed_transitions[@]}"; do
        if [[ -n "${BASE_WEIGHTS[$t]+set}" ]]; then
            working_weights[$t]="${BASE_WEIGHTS[$t]}"
        fi
    done

    # Step 4: Apply theme affinity multipliers
    _apply_theme_affinity working_weights "$theme_category"

    # Step 5: Weighted random selection with no-repeat guard
    selected=$(_weighted_random_select working_weights "$last_transition")

    # Fallback: if empty result (all weights zero / pool empty), use fade
    [[ -z "$selected" ]] && selected="fade"

    # Step 6: Select variant for chosen transition
    variant=$(_select_variant "$selected" "$mode")
    [[ -z "$variant" ]] && variant="default"

    echo "$selected $variant"
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 10 — EXECUTION ENGINE (sources and delegates to chosen preset)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

execute_random() {
    local wallpaper="${1:?wallpaper path required}"
    local monitor="${2:-}"
    local dry_run="${3:-}"  # "--dry-run" to preview without applying

    # Select transition and variant
    local selection
    selection=$(select_transition)
    local selected_type
    selected_type=$(echo "$selection" | cut -d' ' -f1)
    local selected_variant
    selected_variant=$(echo "$selection" | cut -d' ' -f2)

    # Locate the chosen preset's .conf file
    local preset_file="${TRANSITIONS_DIR}/${selected_type}.conf"

    if [[ ! -f "$preset_file" ]]; then
        echo "random.conf: preset file not found: ${preset_file}" >&2
        echo "random.conf: falling back to fade.conf" >&2
        preset_file="${TRANSITIONS_DIR}/fade.conf"
        selected_type="fade"
        selected_variant="default"
    fi

    # Log selection
    echo "🎲  random selected: ${selected_type}  variant: ${selected_variant}"

    # Dry-run mode: show what would be executed without applying
    if [[ "$dry_run" == "--dry-run" ]]; then
        echo "   Dry run — would execute: ${preset_file} ${wallpaper} ${selected_variant} ${monitor}"
        return 0
    fi

    # Source the selected preset to load its functions and parameters
    # shellcheck source=/dev/null
    source "$preset_file"

    # Apply the selected variant
    apply_variant "$selected_variant"

    # Build and execute the swww command
    local cmd
    cmd=$(build_swww_cmd "$wallpaper" "$monitor")
    echo "→ Executing: $cmd"
    eval "$cmd"

    # Save state for no-repeat guard on next invocation
    _write_transition_state "$selected_type" "$selected_variant"
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 11 — UTILITY COMMANDS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Preview: show what would be selected without executing ────────────────────
preview_selection() {
    local n="${1:-5}"
    echo "🎲  Random transition preview (${n} selections):"
    echo "   Context: theme=$(   _get_theme_category) mode=$(_get_active_mode)"
    echo "   ─────────────────────────────────────────"

    local last=""
    for (( i=1; i<=n; i++ )); do
        local selection
        selection=$(select_transition)
        local t; t=$(echo "$selection" | cut -d' ' -f1)
        local v; v=$(echo "$selection" | cut -d' ' -f2)
        echo "   ${i}. ${t}  (variant: ${v})"
        # Simulate no-repeat by temporarily updating state
        _write_transition_state "$t" "$v" 2>/dev/null || true
    done
    echo "   ─────────────────────────────────────────"
}

# ── Stats: show current weight distribution ───────────────────────────────────
show_weights() {
    local mode variant
    mode=$(_get_active_mode)
    local theme
    theme=$(_get_theme_category)

    echo "📊  Weight distribution for theme=${theme} mode=${mode}:"
    echo "   ─────────────────────────────────────────────"

    local -a allowed
    read -ra allowed <<< "$(_get_mode_allowed_transitions "$mode")"

    declare -A weights=()
    local t
    for t in "${allowed[@]}"; do
        [[ -n "${BASE_WEIGHTS[$t]+set}" ]] && weights[$t]="${BASE_WEIGHTS[$t]}"
    done

    _apply_theme_affinity weights "$theme"

    local total=0
    for t in "${!weights[@]}"; do
        total=$(( total + weights[$t] ))
    done

    # Sort and display
    for t in $(for k in "${!weights[@]}"; do echo "${weights[$k]} $k"; done | sort -rn | awk '{print $2}'); do
        local w="${weights[$t]}"
        local pct
        pct=$(awk "BEGIN{printf \"%.1f\", $w/$total*100}")
        local bar_len
        bar_len=$(awk "BEGIN{printf \"%d\", $w/$total*30}")
        local bar
        bar=$(printf "%.0s█" $(seq 1 "$bar_len" 2>/dev/null) || true)
        printf "   %-18s %s %5.1f%%\n" "$t" "${bar}$(printf "%.0s░" $(seq 1 $((30-bar_len)) 2>/dev/null) || true)" "$pct"
    done
    echo "   ─────────────────────────────────────────────"
    echo "   Total pool weight: ${total}"
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 12 — SELF-APPLY (direct execution)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

if [[ "${BASH_SOURCE[0]}" == "${0}" ]]; then
    subcmd="${1:-}"

    case "$subcmd" in

        # ── Standard use: apply random transition to wallpaper ────────────────
        --apply | "")
            wallpaper="${2:-${1:-}}"
            monitor="${3:-}"

            # Handle positional: random.conf /path/to/wall.jpg [monitor]
            if [[ "$subcmd" != "--apply" ]]; then
                wallpaper="${1:-}"
                monitor="${2:-}"
            fi

            if [[ -z "$wallpaper" ]]; then
                cat <<-USAGE
				Usage: random.conf <wallpaper_path> [monitor]
				       random.conf --preview [count]
				       random.conf --weights
				       random.conf --dry-run <wallpaper_path>

				Examples:
				  random.conf ~/wall.jpg
				  random.conf ~/wall.jpg DP-1
				  random.conf --preview 10
				  random.conf --weights
				  random.conf --dry-run ~/wall.jpg
				USAGE
                exit 1
            fi

            execute_random "$wallpaper" "$monitor"
            ;;

        # ── Dry run: show what would execute without applying ─────────────────
        --dry-run)
            wallpaper="${2:-}"
            monitor="${3:-}"
            [[ -z "$wallpaper" ]] && echo "Usage: random.conf --dry-run <wallpaper_path>" && exit 1
            execute_random "$wallpaper" "$monitor" "--dry-run"
            ;;

        # ── Preview: show N random selections without executing ───────────────
        --preview)
            count="${2:-5}"
            preview_selection "$count"
            ;;

        # ── Weights: show current probability distribution ────────────────────
        --weights | --stats)
            show_weights
            ;;

        # ── Last: show last selected transition ───────────────────────────────
        --last)
            if [[ -f "$STATE_FILE" ]]; then
                echo "Last transition:"
                cat "$STATE_FILE"
            else
                echo "No transition history found at: $STATE_FILE"
            fi
            ;;

        # ── Reset: clear state file (next call has no exclusion) ──────────────
        --reset)
            rm -f "$STATE_FILE"
            echo "✓ Transition state reset — no exclusion on next selection"
            ;;

        *)
            # Treat first arg as wallpaper path (convenience shorthand)
            execute_random "$subcmd" "${2:-}"
            ;;
    esac
fi

