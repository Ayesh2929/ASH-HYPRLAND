#!/usr/bin/env bash
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — SWWW TRANSITION PRESET: OUTER                   ║
# ║  Radial shrink-outward — the dramatic inverse of grow, closing portal      ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  PRESET OVERVIEW                                                             │
# │                                                                              │
# │  TYPE:      outer  (inverse radial — old image shrinks outward)             │
# │  POSITION:  0.5,0.5  (center origin for outer boundary)                    │
# │  CHARACTER: Convergence, revelation, zoom-in, closing iris, spotlight      │
# │  BEST FOR:  Dramatic reveals, cinema mode, focus-ending transitions,       │
# │             "zoom out" wallpaper transitions, presentation endings          │
# │  GPU COST:  Medium — circular boundary shrinking toward origin point        │
# │                                                                              │
# │  VISUAL DESCRIPTION:                                                         │
# │  OUTER is the exact inverse of GROW.                                        │
# │  In GROW: new wallpaper expands from a point outward (circle grows).       │
# │  In OUTER: old wallpaper shrinks toward a point from outside (circle       │
# │            contracts inward, revealing new wallpaper at the perimeter).    │
# │                                                                              │
# │  The old wallpaper remains as a shrinking island in the center.            │
# │  The new wallpaper is visible at all points outside the shrinking circle.  │
# │  As the circle contracts to a point, it disappears and only new remains.   │
# │                                                                              │
# │  OUTER CONTRACTION DIAGRAM (4 keyframes):                                   │
# │                                                                              │
# │  Frame 0%           Frame 33%          Frame 66%          Frame 100%        │
# │  ┌─────────┐        ┌─────────┐        ┌─────────┐        ┌─────────┐      │
# │  │OLD OLD  │        │NEW ╭─╮  │        │  ╭───╮  │        │NEW NEW  │      │
# │  │OLD OLD  │        │NEW │O│  │        │ ╱OLD ╲  │        │NEW NEW  │      │
# │  │OLD ✦ OLD│        │NEW │O│  │        │╱ OLD  ╲ │        │NEW ✦ NEW│      │
# │  │OLD OLD  │        │NEW │O│  │        │╲ OLD  ╱ │        │NEW NEW  │      │
# │  │OLD OLD  │        │NEW ╰─╯  │        │ ╲OLD╱   │        │NEW NEW  │      │
# │  └─────────┘        └─────────┘        └─────────┘        └─────────┘      │
# │  [old fills] [new outside ring]  [new majority]    [all new]               │
# │  ✦ = center origin — circle contracts TOWARD this point                    │
# │                                                                              │
# │  GROW vs OUTER COMPARISON:                                                   │
# │  GROW:  new circle EXPANDS from point → fills screen                       │
# │  OUTER: old circle CONTRACTS to point → new revealed outside-in            │
# │                                                                              │
# │  PSYCHOLOGICAL READING:                                                      │
# │  GROW  = emergence, portal opening, focus expanding                        │
# │  OUTER = convergence, spotlight narrowing, closing chapter, iris closing   │
# │                                                                              │
# │  UNIQUE VARIANTS:                                                            │
# │  • iris-close   → Camera iris closing — perfect circle contracts            │
# │  • spotlight    → Grows from corner (spotlight moving away from subject)    │
# │  • implode      → Very fast, explosive implosion into center               │
# │  • drain        → Spiral-like drain metaphor (origin bottom-center)        │
# └─────────────────────────────────────────────────────────────────────────────┘

set -euo pipefail

readonly PRESET_NAME="outer"
readonly PRESET_VERSION="5.0.0"
readonly PRESET_DESCRIPTION="Radial shrink-outward — old wallpaper contracts to center, new revealed outside-in"
readonly PRESET_CATEGORY="radial"
readonly PRESET_GPU_COST="medium"
readonly PRESET_TAGS="outer,radial,inverse,shrink,convergence,iris,spotlight,closing,dramatic"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 02 — CORE TRANSITION PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

TRANSITION_TYPE="outer"

# ── Position: center — the point toward which the old image contracts ─────────
# The outer boundary shrinks toward this origin point.
# Center (0.5,0.5) gives a symmetrical circular iris-close effect.
TRANSITION_POS="0.5,0.5"

TRANSITION_STEP=2
TRANSITION_DURATION=1.2
TRANSITION_FPS=60

# ── Bezier: ease-in for outer (opposite of grow's ease-out) ──────────────────
# For outer transitions, ease-in creates a more dramatic visual:
# The contraction starts slowly (building tension) then accelerates
# as the old image is squeezed toward the center point.
# The final compression feels like the old wallpaper being "sucked in".
#
# Compare with grow which uses ease-out (fast start, slow end).
# Outer's ease-in (slow start, fast end) is the temporal inverse —
# creating a complementary pair when alternated.
TRANSITION_BEZIER="0.42,0.0,1.0,1.0"

TRANSITION_ANGLE=0

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 03 — RENDERING PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

RESIZE_MODE="crop"
FILTER="CatmullRom"
FORMAT="xrgb"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 04 — VARIANT DEFINITIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  VARIANT: instant     → No animation                                        │
# │  VARIANT: fast        → 0.6s rapid outer contraction                       │
# │  VARIANT: default     → 1.2s ease-in center outer ← base config           │
# │  VARIANT: smooth      → 1.8s smooth symmetric outer contraction            │
# │  VARIANT: slow        → 2.5s deliberate closing convergence                │
# │  VARIANT: iris-close  → 1.0s perfect camera iris diaphragm close           │
# │  VARIANT: implode     → 0.4s explosive implosion into center               │
# │  VARIANT: spotlight   → 2.0s spotlight withdrawing (bottom-center origin)  │
# │  VARIANT: drain       → 2.2s drain metaphor (bottom-center sink)           │
# │  VARIANT: cinematic   → 3.5s theatrical closing iris reveal                │
# │  VARIANT: elastic     → 1.6s spring bounce inward                         │
# └─────────────────────────────────────────────────────────────────────────────┘

apply_variant() {
    local variant="${1:-default}"

    case "$variant" in

        instant)
            TRANSITION_DURATION=0.0
            TRANSITION_STEP=255
            TRANSITION_FPS=10
            TRANSITION_BEZIER="0.0,0.0,1.0,1.0"
            TRANSITION_POS="0.5,0.5"
            VARIANT_DESCRIPTION="Zero-duration instant swap"
            ;;

        # ── Fast: 0.6s rapid contraction ─────────────────────────────────────
        fast)
            TRANSITION_DURATION=0.6
            TRANSITION_STEP=3
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.8,1.0"
            TRANSITION_POS="0.5,0.5"
            VARIANT_DESCRIPTION="0.6s rapid outer contraction — quick wallpaper squeeze to center"
            ;;

        default | "")
            TRANSITION_DURATION=1.2
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,1.0,1.0"
            TRANSITION_POS="0.5,0.5"
            VARIANT_DESCRIPTION="1.2s ease-in center outer — building tension, accelerating close"
            ;;

        # ── Smooth: symmetric ease-in-out outer ───────────────────────────────
        smooth)
            TRANSITION_DURATION=1.8
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_POS="0.5,0.5"
            VARIANT_DESCRIPTION="1.8s smooth ease-in-out outer — graceful symmetric contraction"
            ;;

        # ── Slow: 2.5s deliberate convergence ────────────────────────────────
        slow)
            TRANSITION_DURATION=2.5
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_POS="0.5,0.5"
            VARIANT_DESCRIPTION="2.5s deliberate outer convergence — slow closing spotlight"
            ;;

        # ── Iris-close: 1.0s perfect camera aperture diaphragm ───────────────
        # Mimics a camera iris diaphragm closing.
        # ease-in-out (0.42,0,0.58,1) gives it a mechanical iris feel:
        # the iris starts slow (springs need initial force), peaks speed
        # in the middle, then slows as it reaches fully closed.
        # The center origin creates a perfect circular iris effect.
        iris_close | iris-close)
            TRANSITION_DURATION=1.0
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_POS="0.5,0.5"
            VARIANT_DESCRIPTION="1.0s camera iris diaphragm close — mechanical aperture contraction"
            ;;

        # ── Implode: 0.4s explosive implosion ────────────────────────────────
        # Maximum speed — the old wallpaper implodes in an instant.
        # Uses an extreme ease-in bezier: virtually zero speed at start,
        # then exponential acceleration into the center.
        # Creates a visual "singularity" or "black hole" suck.
        # Excellent for dramatic mode changes (exiting game mode, etc).
        implode)
            TRANSITION_DURATION=0.4
            TRANSITION_STEP=5
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.7,0.0,1.0,0.4"
            TRANSITION_POS="0.5,0.5"
            VARIANT_DESCRIPTION="0.4s explosive implosion — zero speed then instant acceleration to center"
            ;;

        # ── Spotlight: 2.0s spotlight withdrawing from subject ────────────────
        # Bottom-center origin: like a spotlight on a stage withdrawing upward.
        # The "stage" (new wallpaper) is revealed from the outer edges first,
        # while the spotlight (old wallpaper) shrinks toward bottom center.
        # Creates a theatrical "end of performance" mood.
        spotlight)
            TRANSITION_DURATION=2.0
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.68,1.0"
            TRANSITION_POS="0.5,0.85"
            VARIANT_DESCRIPTION="2.0s spotlight withdrawal — old wallpaper shrinks to bottom-center stage"
            ;;

        # ── Drain: 2.2s water draining down sink metaphor ────────────────────
        # Origin at bottom-center (0.5,1.0) — the "drain" position.
        # The old wallpaper spirals toward the bottom drain point.
        # Not literally a spiral (swww is circular) but the bottom-origin
        # creates the visual impression of water being pulled downward.
        # Excellent for ocean, water, rain, and nature themes.
        drain)
            TRANSITION_DURATION=2.2
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.68,0.0,0.9,0.5"
            TRANSITION_POS="0.5,1.0"
            VARIANT_DESCRIPTION="2.2s drain metaphor — old wallpaper contracts toward bottom drain point"
            ;;

        # ── Cinematic: 3.5s theatrical closing iris ───────────────────────────
        # The slowest and most dramatic outer preset.
        # 3.5 seconds allows the entire contraction to be clearly witnessed.
        # The audience "watches" the old wallpaper close like a final curtain.
        # Used for ending presentation sequences, sleep-mode transitions.
        cinematic)
            TRANSITION_DURATION=3.5
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_POS="0.5,0.5"
            VARIANT_DESCRIPTION="3.5s cinematic closing iris — theatrical final-curtain outer reveal"
            ;;

        # ── Elastic: spring inward bounce ────────────────────────────────────
        elastic)
            TRANSITION_DURATION=1.6
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.68,-0.6,0.32,1.6"
            TRANSITION_POS="0.5,0.5"
            VARIANT_DESCRIPTION="1.6s elastic spring inward — old image bounces as it contracts"
            ;;

        *)
            echo "outer.conf: unknown variant '${variant}'. Using default." >&2
            apply_variant "default"
            ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 05 — COMMAND BUILDER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

build_swww_cmd() {
    local wallpaper="${1:?wallpaper path required}"
    local monitor="${2:-}"

    local -a cmd=(
        swww img
        "$wallpaper"
        --transition-type     "$TRANSITION_TYPE"
        --transition-step     "$TRANSITION_STEP"
        --transition-fps      "$TRANSITION_FPS"
        --transition-pos      "$TRANSITION_POS"
        --transition-bezier   "$TRANSITION_BEZIER"
        --resize              "$RESIZE_MODE"
        --filter              "$FILTER"
    )

    if [[ "${TRANSITION_DURATION:-0}" != "0" \
       && "${TRANSITION_DURATION:-0}" != "0.0" ]]; then
        cmd+=(--transition-duration "$TRANSITION_DURATION")
    fi

    [[ -n "$monitor" ]] && cmd+=(--outputs "$monitor")

    echo "${cmd[@]}"
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 06 — MODE OVERRIDES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

apply_mode_override() {
    local mode="${1:-default}"
    case "$mode" in
        game)    apply_variant "instant"    ;;
        battery) apply_variant "fast";
                 TRANSITION_FPS=30; FILTER="Bilinear" ;;
        focus)   apply_variant "smooth"     ;;
        cinema)  apply_variant "cinematic"  ;;
        present) apply_variant "cinematic"  ;;
        stream)  apply_variant "iris-close" ;;
        night)   apply_variant "spotlight"  ;;
        *)       apply_variant "default"    ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 07 — SELF-APPLY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

if [[ "${BASH_SOURCE[0]}" == "${0}" ]]; then
    wallpaper="${1:-}"
    variant="${2:-default}"
    monitor="${3:-}"

    if [[ -z "$wallpaper" ]]; then
        cat <<-USAGE
		Usage: outer.conf <wallpaper_path> [variant] [monitor]

		Variants:
		  instant    Zero-duration swap
		  fast       0.6s rapid outer contraction
		  default    1.2s ease-in center outer [DEFAULT]
		  smooth     1.8s symmetric ease-in-out contraction
		  slow       2.5s deliberate closing convergence
		  iris-close 1.0s camera aperture diaphragm close
		  implode    0.4s explosive singularity implosion
		  spotlight  2.0s stage spotlight withdrawal (bottom-center)
		  drain      2.2s water-drain metaphor (bottom-center sink)
		  cinematic  3.5s theatrical closing-iris final curtain
		  elastic    1.6s spring-bounce inward contraction

		Examples:
		  outer.conf ~/wall.jpg
		  outer.conf ~/wall.jpg iris-close
		  outer.conf ~/wall.jpg cinematic DP-1
		USAGE
        exit 1
    fi

    apply_variant "$variant"
    cmd=$(build_swww_cmd "$wallpaper" "$monitor")
    echo "→ Executing: $cmd"
    eval "$cmd"
fi

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  END: transitions/outer.conf  •  11 variants  •  ASH v5.0 OMEGA            ║
# ╚══════════════════════════════════════════════════════════════════════════════╝