#!/usr/bin/env bash
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ASH DOTFILES v5.0 OMEGA — SWWW TRANSITION PRESET: WIPE-DOWN               ║
# ║  Top-to-bottom descending reveal — gravity, dusk, closing, settling        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  PRESET OVERVIEW                                                             │
# │                                                                              │
# │  TYPE:      wipe  (directional edge sweep)                                  │
# │  ANGLE:     270°  (top edge → bottom edge)                                  │
# │  CHARACTER: Descending, gravitational, closing, evening-energy              │
# │  BEST FOR:  Evening wallpaper changes, mode downgrades, calm transitions    │
# │  GPU COST:  Low — single scanline boundary per frame                        │
# │                                                                              │
# │  VISUAL DESCRIPTION:                                                         │
# │  A horizontal dividing line sweeps from the TOP edge of the monitor to the  │
# │  BOTTOM edge. Above the line: incoming new wallpaper (falling down).        │
# │  Below the line: outgoing old wallpaper (being displaced downward).        │
# │  Creates a "curtain-close", "nightfall", or "gravity" visual metaphor.     │
# │                                                                              │
# │  SWEEP DIRECTION DIAGRAM:                                                    │
# │  ╔══════════════════════════════════════════════════════╗                   │
# │  ║ NEW  NEW  NEW  NEW  NEW  NEW  NEW  NEW  NEW  NEW     ║ ← top             │
# │  ║ ─────────────────────────────────────────────────── ║ ← sweep boundary  │
# │  ║ OLD  OLD  OLD  OLD  OLD  OLD  OLD  OLD  OLD  OLD     ║   (moves down ↓)  │
# │  ║ OLD  OLD  OLD  OLD  OLD  OLD  OLD  OLD  OLD  OLD     ║                   │
# │  ╠══════════════════════════════════════════════════════╣                   │
# │  ║ NEW  NEW  NEW  NEW  NEW  NEW  NEW  NEW  NEW  NEW     ║ ← complete        │
# │  ╚══════════════════════════════════════════════════════╝ ← bottom          │
# │                                                                              │
# │  PSYCHOLOGICAL ASSOCIATIONS:                                                 │
# │  ↓ Down = completion, rest, evening, gravity, closing, settling             │
# │  The wipe-down transition psychologically signals "the day is closing".     │
# │  Ideal for: evening automation, mode downgrades, sleep/rest routines.       │
# │                                                                              │
# │  COMPLEMENTARY PAIR:                                                         │
# │  wipe-up   ↑ = new day, ascension, start     (morning)                     │
# │  wipe-down ↓ = end of day, descent, close    (evening)                     │
# │  ash theme scheduler uses this pairing for time-of-day automation.         │
# │                                                                              │
# │  UNIQUE VARIANTS:                                                            │
# │  • nightfall  → 6s ultra-slow dusk simulation                              │
# │  • gravity    → exponential acceleration (falls faster as it drops)         │
# │  • curtain    → asymmetric bezier: hesitant start, definitive close         │
# └─────────────────────────────────────────────────────────────────────────────┘

set -euo pipefail

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 01 — PRESET IDENTITY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

readonly PRESET_NAME="wipe-down"
readonly PRESET_VERSION="5.0.0"
readonly PRESET_DESCRIPTION="Top-to-bottom descending wipe — gravity, dusk, closing reveal"
readonly PRESET_CATEGORY="directional"
readonly PRESET_GPU_COST="low"
readonly PRESET_TAGS="directional,vertical,descending,downward,evening,gravity,closing,wipe"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 02 — CORE TRANSITION PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

TRANSITION_TYPE="wipe"

# ── Angle: 270° = top edge sweeps to bottom edge ──────────────────────────────
# In swww coordinate system:
#   270° = wipe moving southward (top-to-bottom)
# The horizontal sweep line originates at the top of the display
# and advances downward, revealing the new wallpaper above.
TRANSITION_ANGLE=270

TRANSITION_STEP=2
TRANSITION_DURATION=1.0
TRANSITION_FPS=60

# ── Bezier: ease-in-out for downward wipe ────────────────────────────────────
# Symmetrical ease-in-out mirrors the feeling of gravity:
# the sweep starts slowly (hesitant, like something tipping over an edge),
# accelerates through the middle (free fall), then slows to land gently.
# This matches real-world gravitational motion physics.
#
# Curve shape:
# velocity  ╮     ╭───╮     ╭
#           │   ╭╯   ╰╮   ╰
#           ╰───╯       ╰───
# [slow start] [fast mid] [gentle end]
TRANSITION_BEZIER="0.42,0.0,0.58,1.0"

# Position: bottom-center origin for grow operations (not used by wipe)
TRANSITION_POS="0.5,0.0"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 03 — RENDERING PARAMETERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

RESIZE_MODE="crop"
FILTER="Lanczos3"
FORMAT="xrgb"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 04 — VARIANT DEFINITIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  VARIANT: instant    → No animation                                         │
# │  VARIANT: fast       → 0.5s sharp downward wipe                            │
# │  VARIANT: default    → 1.0s gravity ease-in-out ← base config             │
# │  VARIANT: smooth     → 1.5s premium descending sweep                       │
# │  VARIANT: slow       → 2.0s deliberate downward reveal                     │
# │  VARIANT: nightfall  → 6.0s ultra-slow dusk simulation                    │
# │  VARIANT: gravity    → 0.8s exponential acceleration (free-fall physics)  │
# │  VARIANT: curtain    → 1.8s hesitant start → definitive close              │
# │  VARIANT: cinematic  → 2.5s theatrical downward reveal                     │
# │  VARIANT: diagonal   → 225° diagonal wipe (upper-left to lower-right)      │
# │  VARIANT: sharp      → Linear bezier — mechanical shutter-down             │
# └─────────────────────────────────────────────────────────────────────────────┘

apply_variant() {
    local variant="${1:-default}"

    case "$variant" in

        # ── Instant: zero-frame swap ──────────────────────────────────────────
        instant)
            TRANSITION_DURATION=0.0
            TRANSITION_STEP=255
            TRANSITION_FPS=10
            TRANSITION_BEZIER="0.0,0.0,1.0,1.0"
            TRANSITION_ANGLE=270
            VARIANT_DESCRIPTION="Zero-duration instant buffer swap — no GPU animation cost"
            ;;

        # ── Fast: 0.5s sharp descending wipe ─────────────────────────────────
        # Snappy downward motion — like a sudden heavy rain beginning.
        # ease-out: immediate velocity, gentle landing at bottom edge.
        fast)
            TRANSITION_DURATION=0.5
            TRANSITION_STEP=3
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,0.58,1.0"
            TRANSITION_ANGLE=270
            VARIANT_DESCRIPTION="0.5s rapid top-to-bottom wipe — quick descending reveal"
            ;;

        # ── Default: 1.0s gravity ease-in-out ────────────────────────────────
        default | "")
            TRANSITION_DURATION=1.0
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_ANGLE=270
            VARIANT_DESCRIPTION="1.0s gravity-physics ease-in-out — natural downward motion"
            ;;

        # ── Smooth: 1.5s premium sweep ────────────────────────────────────────
        # expo-out gives a "heavy drape" quality:
        # the curtain moves quickly at first then slows under its own weight.
        smooth)
            TRANSITION_DURATION=1.5
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.16,1.0,0.3,1.0"
            TRANSITION_ANGLE=270
            VARIANT_DESCRIPTION="1.5s smooth descending sweep — premium weighted motion"
            ;;

        # ── Slow: 2.0s deliberate descent ────────────────────────────────────
        slow)
            TRANSITION_DURATION=2.0
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_ANGLE=270
            VARIANT_DESCRIPTION="2.0s deliberate descent — meditative closing motion"
            ;;

        # ── Nightfall: 6.0s ultra-slow dusk simulation ────────────────────────
        # Designed to match the pace of actual dusk (perceptible light change).
        # Used by ash evening automation (triggered at civil dusk).
        # 6 seconds at 24fps = cinematic frame rate, minimal GPU load.
        # Ease-in: starts imperceptibly slowly, then accelerates as night falls.
        # The slow start makes it feel like darkness is "creeping in".
        nightfall)
            TRANSITION_DURATION=6.0
            TRANSITION_STEP=1
            TRANSITION_FPS=24
            TRANSITION_BEZIER="0.42,0.0,0.68,1.0"
            TRANSITION_ANGLE=270
            VARIANT_DESCRIPTION="6.0s ultra-slow dusk simulation — imperceptibly slow start, matches sunset pace"
            ;;

        # ── Gravity: 0.8s exponential free-fall acceleration ──────────────────
        # Simulates actual gravitational physics:
        # objects accelerate as they fall (v = gt, distance = ½gt²).
        # bezier 0.0,0.0,1.0,0.0 = ease-in extreme:
        # slow start (like tipping), rapid acceleration to high terminal velocity.
        # Does NOT decelerate at the end — snaps to bottom like impact.
        # Creates a visceral "dropped" or "fallen" sensation.
        gravity)
            TRANSITION_DURATION=0.8
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,1.0,0.0"
            TRANSITION_ANGLE=270
            VARIANT_DESCRIPTION="0.8s free-fall physics — exponential acceleration, no deceleration at bottom"
            ;;

        # ── Curtain: hesitant start → definitive close ────────────────────────
        # Mimics a theater curtain's motion:
        # The curtain starts slowly (takes effort to begin moving),
        # then commits and closes decisively.
        # Asymmetric bezier: long ease-in, very short ease-out.
        # x1=0.7 y1=0.0 → very slow start
        # x2=0.9 y2=1.0 → sharp final acceleration
        curtain)
            TRANSITION_DURATION=1.8
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.7,0.0,0.9,1.0"
            TRANSITION_ANGLE=270
            VARIANT_DESCRIPTION="1.8s curtain-close motion — hesitant start, decisive finish"
            ;;

        # ── Cinematic: 2.5s theatrical descent ───────────────────────────────
        cinematic)
            TRANSITION_DURATION=2.5
            TRANSITION_STEP=1
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_ANGLE=270
            VARIANT_DESCRIPTION="2.5s theatrical top-to-bottom reveal — dramatic closing sweep"
            ;;

        # ── Diagonal: 225° lower-left diagonal wipe ──────────────────────────
        # 225° = between south (270°) and west (180°).
        # The sweep travels diagonally down-left — dynamic directional energy.
        # Creates a "storm sweeping in" or "shadow falling" visual metaphor.
        diagonal)
            TRANSITION_DURATION=1.2
            TRANSITION_STEP=2
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.42,0.0,0.58,1.0"
            TRANSITION_ANGLE=225
            VARIANT_DESCRIPTION="1.2s diagonal wipe at 225° — downward-left diagonal sweep"
            ;;

        # ── Sharp: mechanical vertical shutter ────────────────────────────────
        # No easing — constant speed from top to bottom.
        # Like a camera shutter or industrial blind closing.
        sharp)
            TRANSITION_DURATION=0.7
            TRANSITION_STEP=4
            TRANSITION_FPS=60
            TRANSITION_BEZIER="0.0,0.0,1.0,1.0"
            TRANSITION_ANGLE=270
            VARIANT_DESCRIPTION="0.7s linear shutter-down — mechanical constant-speed descent"
            ;;

        *)
            echo "wipe-down.conf: unknown variant '${variant}'. Using default." >&2
            apply_variant "default"
            ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 05 — COMMAND BUILDER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

build_swww_cmd() {
    local wallpaper="${1:?wallpaper path required}"
    local monitor="${2:-}"

    local -a cmd=(
        swww img
        "$wallpaper"
        --transition-type     "$TRANSITION_TYPE"
        --transition-step     "$TRANSITION_STEP"
        --transition-fps      "$TRANSITION_FPS"
        --transition-angle    "$TRANSITION_ANGLE"
        --transition-bezier   "$TRANSITION_BEZIER"
        --resize              "$RESIZE_MODE"
        --filter              "$FILTER"
    )

    if [[ "${TRANSITION_DURATION:-0}" != "0" \
       && "${TRANSITION_DURATION:-0}" != "0.0" ]]; then
        cmd+=(--transition-duration "$TRANSITION_DURATION")
    fi

    [[ -n "$monitor" ]] && cmd+=(--outputs "$monitor")

    echo "${cmd[@]}"
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 06 — MODE OVERRIDES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

apply_mode_override() {
    local mode="${1:-default}"
    case "$mode" in
        game)    apply_variant "instant"   ;;
        battery) apply_variant "fast";
                 TRANSITION_FPS=30; FILTER="Bilinear" ;;
        focus)   apply_variant "slow"      ;;
        cinema)  apply_variant "cinematic" ;;
        present) apply_variant "cinematic" ;;
        stream)  apply_variant "smooth"    ;;
        evening) apply_variant "nightfall" ;;
        night)   apply_variant "nightfall" ;;
        *)       apply_variant "default"   ;;
    esac
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 07 — SELF-APPLY (direct execution)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

if [[ "${BASH_SOURCE[0]}" == "${0}" ]]; then
    wallpaper="${1:-}"
    variant="${2:-default}"
    monitor="${3:-}"

    if [[ -z "$wallpaper" ]]; then
        cat <<-USAGE
		Usage: wipe-down.conf <wallpaper_path> [variant] [monitor]

		Variants:
		  instant    Zero-duration swap (no GPU cost)
		  fast       0.5s sharp downward wipe
		  default    1.0s gravity ease-in-out [DEFAULT]
		  smooth     1.5s weighted descending sweep
		  slow       2.0s deliberate descent
		  nightfall  6.0s ultra-slow dusk simulation
		  gravity    0.8s free-fall physics acceleration
		  curtain    1.8s hesitant-start theatrical close
		  cinematic  2.5s dramatic top-to-bottom reveal
		  diagonal   1.2s diagonal 225° downward sweep
		  sharp      0.7s linear constant-speed shutter

		Examples:
		  wipe-down.conf ~/wall.jpg
		  wipe-down.conf ~/wall.jpg nightfall
		  wipe-down.conf ~/wall.jpg gravity eDP-1
		USAGE
        exit 1
    fi

    apply_variant "$variant"
    cmd=$(build_swww_cmd "$wallpaper" "$monitor")
    echo "→ Executing: $cmd"
    eval "$cmd"
fi

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  END: transitions/wipe-down.conf  •  11 variants  •  ASH v5.0 OMEGA        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝