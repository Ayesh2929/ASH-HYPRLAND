# ── Log level ─────────────────────────────────────────────────────────────────
# Controls verbosity of ash wallpaper engine logging.
# Options: error | warn | info | debug | trace
## type: enum(error,warn,info,debug,trace) default: "warn"
SWWW_LOG_LEVEL="warn"

# ── Log file ──────────────────────────────────────────────────────────────────
## type: path
SWWW_LOG_FILE="${XDG_STATE_HOME:-$HOME/.local/state}/ash/logs/wallpaper-engine.log"

# ── Log rotation ──────────────────────────────────────────────────────────────
## type: int default: 5242880 (5MB)
SWWW_LOG_MAX_BYTES=5242880

# ── Enable timing metrics ─────────────────────────────────────────────────────
# When true: logs execution time for each wallpaper operation.
# Used by ash benchmark system to track performance regressions.
## type: bool default: false
SWWW_LOG_TIMING=false

