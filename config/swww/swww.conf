# HOW THIS FILE IS USED
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# swww itself does not read a config file directly — all configuration is
# passed as CLI flags to `swww img` and environment variables to `swww-daemon`.
#
# This file serves as the SINGLE SOURCE OF TRUTH read by the ASH wallpaper
# engine (ash-cli/engines/wallpaper-engine/setter.sh) which:
#   1. Sources this file (bash source)
#   2. Reads all SWWW_* variables
#   3. Constructs the `swww img` command with appropriate flags
#   4. Manages the swww-daemon lifecycle
#
# BASH SOURCING: this file uses Bash variable assignment syntax.
# All variables prefixed SWWW_ are namespaced to prevent collision.
# Comments beginning with ## are parsed by the ash doctor for validation.

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 01 — DAEMON SETTINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Controls the swww-daemon process behavior.
# Daemon is started by ash session init (scripts/system/session-init.sh).
# Restart policy: daemon auto-restarts via systemd user service if it crashes.

# ── Format: image format for internal rendering pipeline ──────────────────────
# swww-daemon decodes wallpaper images into this pixel format for rendering.
#
# Options:
#   xrgb    — 32-bit RGB (no alpha). Fastest. Recommended for most setups.
#   xbgr    — 32-bit BGR (byte-swapped). Use if colors appear wrong on AMD.
#   rgb     — 24-bit packed RGB. Slightly smaller memory footprint.
#   bgr     — 24-bit packed BGR.
#
# Performance notes:
#   • xrgb is GPU-native order on most Wayland compositors → zero conversion
#   • On NVIDIA: xrgb or xbgr depending on driver version (test if uncertain)
#   • On AMD/Intel: xrgb universally correct
#   • Memory: 4K image @ xrgb = 8MB RAM per monitor in daemon
#
## type: enum(xrgb,xbgr,rgb,bgr) required: true
SWWW_FORMAT="xrgb"

# ── No resize: skip GPU resize when image matches monitor resolution exactly ──
# When true: if wallpaper dimensions exactly match monitor resolution,
# skip the resize step entirely. Minor performance win on exact-match configs.
# When false: always run resize pipeline (safer for multi-monitor setups).
## type: bool default: false
SWWW_NO_RESIZE=false

# ── Daemon socket path ────────────────────────────────────────────────────────
# Path to the Unix domain socket used for IPC between swww and swww-daemon.
# Default: /run/user/$UID/swww-daemon.socket
# Leave empty to use swww's default (recommended).
# Override only if running multiple swww instances (unusual).
## type: path optional: true
SWWW_SOCKET_PATH=""

# ── Wait for daemon timeout ───────────────────────────────────────────────────
# Milliseconds to wait for swww-daemon to start before aborting.
# Increase on slow systems or if you see "daemon not running" errors.
## type: int default: 5000 min: 1000 max: 30000
SWWW_DAEMON_WAIT_MS=5000

# ── Pre-clear monitor on daemon start ─────────────────────────────────────────
# When true: clears all monitors to black/solid color before first wallpaper.
# Prevents flash of unstyled content (FOUC) during compositor startup.
# Pre-clear color matches $HL_SURFACE_0 from current theme (injected by ash).
## type: bool default: true
SWWW_PRECLEAR_ON_START=true

# ── Pre-clear color (RRGGBB hex, no #) ───────────────────────────────────────
# Color shown during the brief window between daemon start and first wallpaper.
# Set by ash theme engine to match theme background color.
# This value is overwritten on each theme change.
## type: hex_color default: "111117"
SWWW_PRECLEAR_COLOR="111117"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 02 — DEFAULT TRANSITION ENGINE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# The transition system defines how wallpaper changes are animated.
# These defaults are used by `swww img` when no override is specified.
#
# TRANSITION TYPE REFERENCE:
# ┌──────────────┬─────────────────────────────────────────────────────────────┐
# │ TYPE         │ DESCRIPTION                                                 │
# ├──────────────┼─────────────────────────────────────────────────────────────┤
# │ none         │ Instant swap — no animation, zero GPU cost                  │
# │ simple       │ Linear crossfade (whole screen simultaneously)              │
# │ fade         │ Smooth crossfade with easing curve                          │
# │ wipe         │ Directional wipe reveal (left/right/up/down)               │
# │ slide        │ New image slides in from edge (directional)                 │
# │ grow         │ New image grows from a point (center or corner)            │
# │ outer        │ Old image shrinks outward revealing new image below         │
# │ wave         │ Wipe with sinusoidal wave edge (horizontal or vertical)    │
# │ random       │ Randomly selects a transition type each application         │
# └──────────────┴─────────────────────────────────────────────────────────────┘

# ── Transition type ───────────────────────────────────────────────────────────
# The animation style for all wallpaper changes unless overridden per-command.
# Recommendation: "wipe" for polished daily use, "fade" for elegance,
#   "none" for maximum performance, "random" for variety.
## type: enum(none,simple,fade,wipe,slide,grow,outer,wave,random) required: true
SWWW_TRANSITION_TYPE="wipe"

# ── Transition step ───────────────────────────────────────────────────────────
# Controls animation speed — pixels of progress per frame.
# Higher = faster transition (fewer total frames rendered).
# Lower = slower, smoother transition (more frames rendered).
#
# Relationship: duration ≈ (1.0 / step) * fps_factor
# Typical values:
#   1    → very slow, cinematic (~3s at 60fps)
#   2    → smooth, premium (~1.5s at 60fps)  ← recommended default
#   3    → standard (~1s at 60fps)
#   5    → fast (~0.6s at 60fps)
#   10   → very fast (~0.3s at 60fps)
#   255  → nearly instant
#
## type: int default: 2 min: 1 max: 255
SWWW_TRANSITION_STEP=2

# ── Transition duration ───────────────────────────────────────────────────────
# Total animation duration in seconds (float).
# This takes precedence over STEP — swww calculates step automatically
# to achieve the target duration at current display refresh rate.
# Set to 0 to use STEP-based timing instead.
#
# Recommended: 0.8–1.5 for most use cases.
# Set to 0 if you prefer precise STEP control.
## type: float default: 1.0 min: 0.0 max: 10.0
SWWW_TRANSITION_DURATION=1.0

# ── Transition FPS ────────────────────────────────────────────────────────────
# Target framerate for transition animation rendering.
# Should match your display refresh rate for buttery smoothness.
# Values above display refresh rate are clamped by compositor.
#
# Common values: 60, 120, 144, 165, 240
# Performance note: 120fps transitions use 2× GPU load vs 60fps.
# Battery recommendation: cap at 60fps when on AC, 30fps on battery.
# This value is dynamically overridden by ash battery-saver mode.
## type: int default: 60 min: 1 max: 360
SWWW_TRANSITION_FPS=60

# ── Transition angle ──────────────────────────────────────────────────────────
# Direction angle in degrees for directional transitions (wipe, slide, wave).
# 0° = left→right  |  90° = bottom→top  |  180° = right→left  |  270° = top→bottom
# Intermediate angles (e.g. 45°) create diagonal directions.
#
# Semantic presets (used by ash transition presets):
#   0   → wipe-right (most natural for LTR reading languages)
#   90  → wipe-up (upward reveal — dramatic)
#   180 → wipe-left
#   270 → wipe-down
#   45  → diagonal wipe (cinematic)
## type: int default: 0 min: 0 max: 360
SWWW_TRANSITION_ANGLE=0

# ── Transition position ───────────────────────────────────────────────────────
# Origin point for grow/outer/wave transitions.
# Format: "x,y" where x and y are:
#   Floating point 0.0–1.0  → relative to monitor dimensions
#   Integer pixels           → absolute pixel coordinates
#
# Named positions (translated by ash to numeric pairs):
#   center      → "0.5,0.5"   (default — grow from center)
#   top-left    → "0.0,0.0"
#   top-center  → "0.5,0.0"
#   top-right   → "1.0,0.0"
#   center-left → "0.0,0.5"
#   center-right→ "1.0,0.5"
#   bottom-left → "0.0,1.0"
#   bottom-center→"0.5,1.0"
#   bottom-right→ "1.0,1.0"
#   cursor      → reads cursor position at transition start (most dynamic)
## type: position default: "0.5,0.5"
SWWW_TRANSITION_POS="0.5,0.5"

# ── Transition bezier curve ───────────────────────────────────────────────────
# CSS-style cubic bezier easing for transition acceleration profile.
# Format: "x1,y1,x2,y2" — the two control points of the cubic bezier curve.
# All values: 0.0–1.0
#
# EASING CURVE PRESETS:
# ┌───────────────────┬──────────────────────────────────────────────────────┐
# │ PRESET NAME       │ VALUES          │ CHARACTER                          │
# ├───────────────────┼─────────────────┼────────────────────────────────────┤
# │ linear            │ 0.0,0.0,1.0,1.0 │ Constant speed, mechanical feel    │
# │ ease              │ 0.25,0.1,0.25,1 │ CSS default — gentle acceleration  │
# │ ease-in           │ 0.42,0,1.0,1.0  │ Slow start, fast finish            │
# │ ease-out          │ 0,0,0.58,1.0    │ Fast start, slow finish ← default  │
# │ ease-in-out       │ 0.42,0,0.58,1.0 │ Gentle both ends (sine-like)       │
# │ snap              │ 0.1,0.9,0.2,1.0 │ Snappy spring feel                 │
# │ elastic           │ 0.68,-0.6,0.32,1.6│ Overshoots then settles          │
# │ cinematic         │ 0.16,1,0.3,1    │ Film-like acceleration curve       │
# │ expo-out          │ 0.16,1,0.3,1    │ Exponential deceleration           │
# └───────────────────┴─────────────────┴────────────────────────────────────┘
#
# Current: ease-out → starts quickly, decelerates smoothly.
# Provides that "premium software" feel — fast response, gentle landing.
## type: bezier default: "0.0,0.0,0.58,1.0"
SWWW_TRANSITION_BEZIER="0.0,0.0,0.58,1.0"

# ── Transition wave geometry ──────────────────────────────────────────────────
# Controls the sine wave shape for "wave" transition type only.
# Format: "width,height" in pixels
#
# width  → horizontal wavelength (pixels per full wave cycle)
# height → wave amplitude (maximum vertical displacement in pixels)
#
# Aesthetic guide:
#   "20,20"   → tight ripple, fast wave
#   "80,40"   → standard ocean wave
#   "200,80"  → long, slow rolling wave (cinematic)
#   "50,200"  → tall amplitude, dramatic vertical motion
## type: wave_dimensions default: "20,20"
SWWW_TRANSITION_WAVE="20,20"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 03 — IMAGE RENDERING & SCALING
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Resize mode ───────────────────────────────────────────────────────────────
# Controls how wallpaper images are scaled to fit monitor dimensions.
#
# Options:
#   no        → No scaling. Image centered, letterboxed if smaller than monitor.
#   crop      → Scale to fill, crop edges to fit. No letterboxing. (most used)
#   fit       → Scale to fit entirely. Letterboxes if aspect ratio differs.
#   stretch   → Stretch to exactly fill monitor. May distort aspect ratio.
#
# Recommendation: "crop" for photography/art wallpapers (fills screen cleanly)
#   "fit" for illustrations with important edge content
#   "no" for exact-size wallpapers (rare)
## type: enum(no,crop,fit,stretch) required: true
SWWW_RESIZE_MODE="crop"

# ── Fill color for letterboxing ───────────────────────────────────────────────
# Color used to fill letterbox bars when RESIZE_MODE="fit" or "no".
# Format: RRGGBB hex (no #).
# Set to match your theme's background color for seamless appearance.
# Dynamically updated by ash theme engine on theme change.
## type: hex_color default: "000000"
SWWW_FILL_COLOR="000000"

# ── Filter algorithm ──────────────────────────────────────────────────────────
# Pixel sampling algorithm used when scaling images.
#
# Options and their trade-offs:
# ┌────────────────┬──────────────────────────────────────────────────────────┐
# │ FILTER         │ QUALITY    │ SPEED   │ BEST FOR                          │
# ├────────────────┼────────────┼─────────┼───────────────────────────────────┤
# │ Nearest        │ Low        │ Fastest │ Pixel art, retro aesthetics       │
# │ Bilinear       │ Medium     │ Fast    │ General use, good enough           │
# │ CatmullRom     │ High       │ Medium  │ Photography, smooth gradients     │
# │ Mitchell       │ High       │ Medium  │ Sharpening preference             │
# │ Lanczos3       │ Highest    │ Slow    │ Maximum quality, large upscales   │
# └────────────────┴────────────┴─────────┴───────────────────────────────────┘
#
# Recommendation: "Lanczos3" for 4K monitors and art wallpapers.
#   "CatmullRom" for balance of quality and speed.
#   "Bilinear" for performance-constrained setups.
## type: enum(Nearest,Bilinear,CatmullRom,Mitchell,Lanczos3) required: true
SWWW_FILTER="Lanczos3"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 04 — MULTI-MONITOR CONFIGURATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Controls behavior when multiple displays are connected.
# Monitor names: DP-1, HDMI-A-1, eDP-1 etc. (from `hyprctl monitors`)

# ── Transition synchronization ────────────────────────────────────────────────
# When true: all monitors start their transitions simultaneously.
# When false: each monitor transitions independently (staggers by index).
#
# Synchronized: gives a cohesive, unified desktop aesthetic.
# Independent: interesting when monitors have different wallpapers.
## type: bool default: true
SWWW_SYNC_MONITORS=true

# ── Stagger delay (ms) ────────────────────────────────────────────────────────
# When SYNC_MONITORS=false: milliseconds between each monitor's transition start.
# Creates a cascading reveal effect across monitors.
# 0 = all start immediately (functionally same as sync=true but without sync guarantee).
## type: int default: 150 min: 0 max: 2000
SWWW_STAGGER_DELAY_MS=150

# ── Per-monitor wallpaper mode ────────────────────────────────────────────────
# Controls whether each monitor can have an independent wallpaper.
#
# Modes:
#   same       → All monitors show identical wallpaper (default)
#   themed     → Primary follows theme, secondary shows complementary image
#   independent → Each monitor managed separately by ash profiles
#   panorama   → One wide image spanning multiple monitors (requires stitching)
#
# "themed" mode reads SECONDARY_WALLPAPER_DIR for secondary monitor images.
# "independent" mode reads per-monitor config from ash profile system.
## type: enum(same,themed,independent,panorama) default: "same"
SWWW_MONITOR_MODE="same"

# ── Primary monitor identifier ────────────────────────────────────────────────
# Auto-detected by ash monitor system on session start.
# Written to: ~/.cache/ash/state/monitors.json
# Override here if auto-detection is incorrect.
# Empty = use first connected monitor as primary.
## type: string optional: true
SWWW_PRIMARY_MONITOR=""

# ── Secondary monitor identifier ─────────────────────────────────────────────
## type: string optional: true
SWWW_SECONDARY_MONITOR=""

# ── Secondary monitor wallpaper directory ────────────────────────────────────
# Used when MONITOR_MODE="themed" — source directory for secondary display.
# ash wallpaper engine picks a contextually matching image from this dir.
## type: path optional: true
SWWW_SECONDARY_WALLPAPER_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/ash/wallpapers/secondary"

# ── Panorama monitor order ────────────────────────────────────────────────────
# Used when MONITOR_MODE="panorama".
# Comma-separated monitor names in physical left-to-right order.
# ash stitches wallpaper image to span all monitors in this order.
# Example: "DP-1,HDMI-A-1,DP-2"
## type: string optional: true
SWWW_PANORAMA_MONITOR_ORDER=""

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 05 — SLIDESHOW ENGINE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# The ash slideshow system (ash-cli/engines/wallpaper-engine/slideshow.sh)
# reads these settings to manage automatic wallpaper rotation.
# Controlled by: ash-wallpaper-slideshow.service + ash-wallpaper-slideshow.timer

# ── Slideshow enabled ─────────────────────────────────────────────────────────
## type: bool default: false
SWWW_SLIDESHOW_ENABLED=false

# ── Slideshow interval ────────────────────────────────────────────────────────
# Seconds between automatic wallpaper changes.
# Common values: 300 (5min), 600 (10min), 1800 (30min), 3600 (1hr), 86400 (daily)
# The ash scheduler adjusts this in focus/game modes (disables/slows slideshow).
## type: int default: 900 min: 30 max: 86400
SWWW_SLIDESHOW_INTERVAL=900

# ── Slideshow source directory ────────────────────────────────────────────────
# Directory containing wallpaper images for slideshow rotation.
# Supports: jpg, jpeg, png, webp, gif, bmp
# Subdirectories: included recursively when RECURSIVE=true.
## type: path default: "$HOME/Pictures/Wallpapers"
SWWW_SLIDESHOW_DIR="${HOME}/Pictures/Wallpapers"

# ── Slideshow order ───────────────────────────────────────────────────────────
# How the next wallpaper is selected from the slideshow directory.
#
# Options:
#   sequential  → Alphabetical order, loops at end
#   random      → Random selection (may repeat)
#   shuffle     → True shuffle (no repeats until all shown)
#   recent      → Most recently modified files first
#   rated       → Highest-rated first (reads .ash-ratings.json)
#   ai-mood     → AI selects based on current mood/time/weather
## type: enum(sequential,random,shuffle,recent,rated,ai-mood) default: "shuffle"
SWWW_SLIDESHOW_ORDER="shuffle"

# ── Recursive directory scan ──────────────────────────────────────────────────
## type: bool default: true
SWWW_SLIDESHOW_RECURSIVE=true

# ── Slideshow transition override ─────────────────────────────────────────────
# Transition type used specifically during slideshow rotations.
# Can differ from the interactive TRANSITION_TYPE for aesthetic variety.
# "inherit" = use SWWW_TRANSITION_TYPE (no override).
## type: enum(inherit,none,simple,fade,wipe,slide,grow,outer,wave,random) default: "fade"
SWWW_SLIDESHOW_TRANSITION="fade"

# ── Slideshow pause in modes ──────────────────────────────────────────────────
# Comma-separated list of ash modes during which slideshow pauses.
# Prevents jarring wallpaper changes during focused work or gaming.
## type: string default: "game,focus,cinema,present,stream"
SWWW_SLIDESHOW_PAUSE_MODES="game,focus,cinema,present,stream"

# ── Slideshow time-of-day filtering ───────────────────────────────────────────
# When true: restricts wallpaper categories by time of day.
# Morning (05–11): prefers bright/nature wallpapers
# Afternoon (12–17): prefers vibrant/colorful wallpapers
# Evening (18–21): prefers warm/sunset/cozy wallpapers
# Night (22–04): prefers dark/space/minimal wallpapers
# Reads wallpaper tags from .ash-metadata.json sidecar files.
## type: bool default: false
SWWW_SLIDESHOW_TIME_FILTER=false

# ── Slideshow history file ────────────────────────────────────────────────────
# Records wallpaper history for shuffle de-duplication and undo.
## type: path default: "$HOME/.cache/ash/history/wallpapers/"
SWWW_SLIDESHOW_HISTORY_FILE="${XDG_CACHE_HOME:-$HOME/.cache}/ash/history/wallpaper-slideshow.log"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 06 — PERFORMANCE PROFILES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ash mode system overrides these values dynamically.
# Base values here are the "balanced" profile defaults.
# Profile switching: ash mode game / ash mode focus / ash mode battery

# ── Active performance profile ────────────────────────────────────────────────
# Written by ash mode system when a mode is activated.
# Read by setter.sh to select appropriate transition parameters.
#
# Profiles:
#   balanced    → Default — good quality, reasonable GPU cost
#   performance → Maximum quality, higher GPU cost, no compromises
#   battery     → Reduced FPS, faster step, lower filter quality
#   game        → Instant transitions (none), zero GPU impact
#   cinema      → Maximum quality, cinematic transitions, high GPU
## type: enum(balanced,performance,battery,game,cinema) default: "balanced"
SWWW_PERF_PROFILE="balanced"

# ── Profile: BALANCED (default) ───────────────────────────────────────────────
SWWW_PROFILE_BALANCED_TRANSITION="wipe"
SWWW_PROFILE_BALANCED_STEP=2
SWWW_PROFILE_BALANCED_DURATION=1.0
SWWW_PROFILE_BALANCED_FPS=60
SWWW_PROFILE_BALANCED_FILTER="Lanczos3"
SWWW_PROFILE_BALANCED_BEZIER="0.0,0.0,0.58,1.0"

# ── Profile: PERFORMANCE (high-end systems) ───────────────────────────────────
# Higher FPS, smoother animation, best filter quality.
# Suitable for: dedicated GPU, 120Hz+ monitors, desktop systems.
SWWW_PROFILE_PERFORMANCE_TRANSITION="wipe"
SWWW_PROFILE_PERFORMANCE_STEP=1
SWWW_PROFILE_PERFORMANCE_DURATION=1.2
SWWW_PROFILE_PERFORMANCE_FPS=120
SWWW_PROFILE_PERFORMANCE_FILTER="Lanczos3"
SWWW_PROFILE_PERFORMANCE_BEZIER="0.16,1.0,0.3,1.0"

# ── Profile: BATTERY SAVER ────────────────────────────────────────────────────
# Reduced animation quality to minimize GPU/CPU wake time.
# swww-daemon consumes ~0% CPU when idle — only transitions cost power.
# Short transitions = less GPU active time = measurable battery savings.
SWWW_PROFILE_BATTERY_TRANSITION="fade"
SWWW_PROFILE_BATTERY_STEP=5
SWWW_PROFILE_BATTERY_DURATION=0.4
SWWW_PROFILE_BATTERY_FPS=30
SWWW_PROFILE_BATTERY_FILTER="Bilinear"
SWWW_PROFILE_BATTERY_BEZIER="0.0,0.0,1.0,1.0"

# ── Profile: GAME MODE ────────────────────────────────────────────────────────
# Instant wallpaper swap — zero animation, zero GPU cost during gaming.
# swww daemon still runs for hot-reload capability on mode exit.
SWWW_PROFILE_GAME_TRANSITION="none"
SWWW_PROFILE_GAME_STEP=255
SWWW_PROFILE_GAME_DURATION=0.0
SWWW_PROFILE_GAME_FPS=10
SWWW_PROFILE_GAME_FILTER="Bilinear"
SWWW_PROFILE_GAME_BEZIER="0.0,0.0,1.0,1.0"

# ── Profile: CINEMA MODE ──────────────────────────────────────────────────────
# Maximum quality cinematic transitions for presentations and streaming.
# Slow, dramatic animations — visual quality over performance.
SWWW_PROFILE_CINEMA_TRANSITION="outer"
SWWW_PROFILE_CINEMA_STEP=1
SWWW_PROFILE_CINEMA_DURATION=2.5
SWWW_PROFILE_CINEMA_FPS=60
SWWW_PROFILE_CINEMA_FILTER="Lanczos3"
SWWW_PROFILE_CINEMA_BEZIER="0.42,0.0,0.58,1.0"

# ── Profile: FOCUS MODE ───────────────────────────────────────────────────────
# Gentle, non-distracting transitions for deep work sessions.
# Simple crossfade — changes wallpaper smoothly without breaking concentration.
SWWW_PROFILE_FOCUS_TRANSITION="simple"
SWWW_PROFILE_FOCUS_STEP=2
SWWW_PROFILE_FOCUS_DURATION=2.0
SWWW_PROFILE_FOCUS_FPS=30
SWWW_PROFILE_FOCUS_FILTER="CatmullRom"
SWWW_PROFILE_FOCUS_BEZIER="0.42,0.0,0.58,1.0"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 07 — CACHE SYSTEM
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# The ash wallpaper engine maintains several caches for:
#   • hyprlock (lock screen wallpaper rendering)
#   • Color extraction (pywal/matugen wallpaper-to-palette)
#   • Thumbnail previews (rofi wallpaper picker)
#   • Blur variants (for hyprlock background layer)

# ── Cache root directory ──────────────────────────────────────────────────────
## type: path
SWWW_CACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/ash/wallpaper"

# ── hyprlock cache path ───────────────────────────────────────────────────────
# The currently active wallpaper is copied/linked here for hyprlock to read.
# hyprlock.conf background.path references this exact path.
# Updated atomically (tmp file → move) to prevent hyprlock reading partial file.
## type: path
SWWW_HYPRLOCK_CACHE="${XDG_CACHE_HOME:-$HOME/.cache}/hyprlock/wallpaper-cache.png"

# ── Thumbnail cache directory ─────────────────────────────────────────────────
# Pre-generated thumbnails for rofi wallpaper picker (fast preview loading).
# Thumbnail size: 320×180px (16:9) or 320×200px (16:10).
# Generated by: ash wallpaper pick (triggers thumbnail generation if missing).
## type: path
SWWW_THUMBNAIL_CACHE="${XDG_CACHE_HOME:-$HOME/.cache}/ash/wallpaper/thumbnails"

# ── Thumbnail dimensions ──────────────────────────────────────────────────────
## type: int default: 320
SWWW_THUMBNAIL_WIDTH=320
## type: int default: 180
SWWW_THUMBNAIL_HEIGHT=180

# ── Blur cache directory ──────────────────────────────────────────────────────
# Pre-blurred variants of wallpapers for hyprlock background.
# Pre-blurring avoids hyprlock computing blur on-demand during lock.
# Blur intensity levels: light(σ=8), medium(σ=16), heavy(σ=32).
## type: path
SWWW_BLUR_CACHE="${XDG_CACHE_HOME:-$HOME/.cache}/ash/wallpaper/blurred"

# ── Blur pre-generation ───────────────────────────────────────────────────────
# When true: automatically pre-generates blurred variant when wallpaper changes.
# Adds ~200ms overhead per wallpaper change but makes hyprlock instant.
# Requires: imagemagick (convert) or ffmpeg.
## type: bool default: true
SWWW_PREGENERATE_BLUR=true

# ── Blur sigma level ──────────────────────────────────────────────────────────
# Gaussian blur radius for pre-generated hyprlock background.
# Higher = more blurred = more processing time.
# Matches hyprlock.conf background.blur_size setting.
## type: int default: 20 min: 1 max: 100
SWWW_BLUR_SIGMA=20

# ── Color extraction cache ────────────────────────────────────────────────────
# When wallpaper changes, ash extracts a color palette for dynamic theming.
# Extracted colors written to: SWWW_COLOR_CACHE_DIR/<wallpaper_hash>.json
# Prevents re-extraction on wallpaper re-application (lookup by hash).
## type: path
SWWW_COLOR_CACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/ash/wallpaper/colors"

# ── Maximum cache size (MB) ───────────────────────────────────────────────────
# ash cleanup timer (ash-cleanup.timer) enforces this limit.
# Oldest cache entries are pruned first when limit is exceeded.
# Thumbnails + blurred + original copies: ~5MB per wallpaper.
## type: int default: 512 min: 64 max: 8192
SWWW_CACHE_MAX_MB=512

# ── Cache retention days ──────────────────────────────────────────────────────
# Wallpapers not accessed within this many days are removed from cache.
# 0 = never auto-remove.
## type: int default: 30 min: 0 max: 365
SWWW_CACHE_RETENTION_DAYS=30

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 08 — WALLPAPER LIBRARY SETTINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Primary wallpaper library ─────────────────────────────────────────────────
# Root directory for ash managed wallpaper collection.
# Organized into subdirectories by category (dark/, light/, nature/, etc.)
## type: path
SWWW_LIBRARY_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/ash/wallpapers"

# ── Supported image formats ───────────────────────────────────────────────────
# Comma-separated list of file extensions to include in library scans.
# swww supports: jpg, jpeg, png, gif, pnm, tga, tiff, webp, bmp, farbfeld
## type: string
SWWW_SUPPORTED_FORMATS="jpg,jpeg,png,webp,gif,bmp,tiff"

# ── Minimum resolution filter ─────────────────────────────────────────────────
# Images below this resolution are excluded from random/slideshow selection.
# Prevents low-quality images from appearing (e.g. thumbnails accidentally in library).
# Format: "WIDTHxHEIGHT"
## type: resolution default: "1920x1080"
SWWW_MIN_RESOLUTION="1920x1080"

# ── Aspect ratio preference ───────────────────────────────────────────────────
# Filter slideshow/random selection by aspect ratio.
# "any"       → No filtering (show all)
# "16:9"      → Standard widescreen
# "16:10"     → Laptop common ratio
# "21:9"      → Ultrawide
# "32:9"      → Super ultrawide
# "4:3"       → Legacy (rarely useful)
# "auto"      → Detect from connected monitors and match
## type: string default: "auto"
SWWW_ASPECT_RATIO_FILTER="auto"

# ── Favorite wallpapers file ──────────────────────────────────────────────────
# JSON file listing wallpaper paths marked as favorites.
# Managed by: ash wallpaper favorite / ash wallpaper unfavorite
## type: path
SWWW_FAVORITES_FILE="${XDG_DATA_HOME:-$HOME/.local/share}/ash/favorites/wallpapers.json"

# ── Ratings file ──────────────────────────────────────────────────────────────
# JSON file storing 1–5 star ratings per wallpaper path.
# Used by slideshow "rated" order mode.
## type: path
SWWW_RATINGS_FILE="${XDG_DATA_HOME:-$HOME/.local/share}/ash/wallpapers/.ash-ratings.json"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 09 — AI WALLPAPER GENERATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Settings for ash AI wallpaper generation system.
# Generator: ash-cli/engines/wallpaper-engine/ai-generator.sh
# Backend: Local Stable Diffusion (automatic1111 API) or remote API.

# ── AI generation enabled ─────────────────────────────────────────────────────
## type: bool default: false
SWWW_AI_GENERATION_ENABLED=false

# ── Generation backend ────────────────────────────────────────────────────────
# Options:
#   automatic1111  → Local AUTOMATIC1111 WebUI API (http://127.0.0.1:7860)
#   comfyui        → Local ComfyUI API (http://127.0.0.1:8188)
#   openai-dall-e  → OpenAI DALL-E 3 API (requires OPENAI_API_KEY)
#   replicate      → Replicate API (requires REPLICATE_API_TOKEN)
## type: enum(automatic1111,comfyui,openai-dall-e,replicate) default: "automatic1111"
SWWW_AI_BACKEND="automatic1111"

# ── API endpoint ──────────────────────────────────────────────────────────────
## type: url default: "http://127.0.0.1:7860"
SWWW_AI_API_ENDPOINT="http://127.0.0.1:7860"

# ── Default generation resolution ────────────────────────────────────────────
# Target image dimensions. Must match your display resolution for best results.
# Format: "WIDTHxHEIGHT"
## type: resolution default: "1920x1080"
SWWW_AI_RESOLUTION="1920x1080"

# ── Default model checkpoint ─────────────────────────────────────────────────
# Stable Diffusion model name (automatic1111) or model ID (replicate).
## type: string default: "dreamshaper_8.safetensors"
SWWW_AI_MODEL="dreamshaper_8.safetensors"

# ── Generation steps ─────────────────────────────────────────────────────────
## type: int default: 28 min: 10 max: 150
SWWW_AI_STEPS=28

# ── CFG scale ────────────────────────────────────────────────────────────────
## type: float default: 7.0 min: 1.0 max: 30.0
SWWW_AI_CFG_SCALE=7.0

# ── Output directory for AI-generated wallpapers ─────────────────────────────
## type: path
SWWW_AI_OUTPUT_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/ash/wallpapers/generated"

# ── Auto-apply after generation ───────────────────────────────────────────────
# When true: immediately sets generated wallpaper as active after generation.
## type: bool default: true
SWWW_AI_AUTO_APPLY=true

# ── Base prompt prefixes (prepended to all generation requests) ───────────────
# Provides consistent quality boosting tokens for all AI generations.
# Ash AI engine appends theme-specific and mood-specific tokens.
## type: string
SWWW_AI_PROMPT_PREFIX="masterpiece, best quality, ultra detailed, 8k resolution, stunning wallpaper, cinematic lighting"

# ── Negative prompt (always applied) ─────────────────────────────────────────
## type: string
SWWW_AI_NEGATIVE_PROMPT="low quality, blurry, watermark, signature, text, logo, people, faces, nsfw, ugly, deformed"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 10 — WALLPAPER SOURCES & DOWNLOADERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Settings for ash wallpaper download sources.
# Downloader scripts: ash-cli/engines/wallpaper-engine/sources/

# ── Wallhaven integration ─────────────────────────────────────────────────────
# https://wallhaven.cc — largest curated wallpaper database.
# API key required for NSFW content (optional for SFW).
## type: bool default: true
SWWW_SOURCE_WALLHAVEN_ENABLED=true
## type: string optional: true (API key from https://wallhaven.cc/settings/account)
SWWW_SOURCE_WALLHAVEN_API_KEY=""
## type: string default: "111" (1=General, second 1=Anime, third 0=NSFW off)
SWWW_SOURCE_WALLHAVEN_PURITY="110"
## type: string default: "100" (1=General)
SWWW_SOURCE_WALLHAVEN_CATEGORIES="111"
## type: enum(date_added,relevance,random,views,favorites,toplist) default: "toplist"
SWWW_SOURCE_WALLHAVEN_SORTING="toplist"

# ── Unsplash integration ──────────────────────────────────────────────────────
# https://unsplash.com — professional photography.
# Requires free API key from https://unsplash.com/developers
## type: bool default: false
SWWW_SOURCE_UNSPLASH_ENABLED=false
## type: string optional: true
SWWW_SOURCE_UNSPLASH_ACCESS_KEY=""
## type: string default: "nature,architecture,minimal"
SWWW_SOURCE_UNSPLASH_QUERY="nature,architecture,minimal"
## type: enum(landscape,portrait,squarish) default: "landscape"
SWWW_SOURCE_UNSPLASH_ORIENTATION="landscape"

# ── Reddit wallpaper source ───────────────────────────────────────────────────
# Fetches top-rated posts from wallpaper subreddits.
# No API key required for public subreddits.
## type: bool default: false
SWWW_SOURCE_REDDIT_ENABLED=false
## type: string default: "wallpapers,EarthPorn,spaceporn,DesignPorn"
SWWW_SOURCE_REDDIT_SUBREDDITS="wallpapers,EarthPorn,spaceporn,DesignPorn"
## type: enum(hot,top,new) default: "top"
SWWW_SOURCE_REDDIT_SORT="top"
## type: enum(day,week,month,year,all) default: "week"
SWWW_SOURCE_REDDIT_TIMEFRAME="week"
## type: int default: 1920 (minimum image width in pixels)
SWWW_SOURCE_REDDIT_MIN_WIDTH=1920

# ── Download directory ────────────────────────────────────────────────────────
## type: path
SWWW_DOWNLOAD_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/ash/wallpapers/downloads"

# ── Maximum download size (MB) ────────────────────────────────────────────────
## type: int default: 50 min: 1 max: 500
SWWW_DOWNLOAD_MAX_SIZE_MB=50

# ── Download on metered connections ──────────────────────────────────────────
# When false: skips wallpaper downloads when on mobile/metered network.
# ash network monitor detects metered connections via NetworkManager.
## type: bool default: false
SWWW_DOWNLOAD_ON_METERED=false

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 11 — EVENT HOOKS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Commands executed at various points in the wallpaper change lifecycle.
# Scripts receive the new wallpaper path as $1 argument.
# Empty string = hook disabled.

# ── Pre-change hook ───────────────────────────────────────────────────────────
# Runs BEFORE `swww img` is called.
# Use case: save current state, send notification, pre-warm color extraction.
## type: command optional: true
SWWW_HOOK_PRE_CHANGE="${XDG_CONFIG_HOME:-$HOME/.config}/hyprlock/scripts/../../../scripts/hooks/pre-theme-change.sh"

# ── Post-change hook ──────────────────────────────────────────────────────────
# Runs AFTER `swww img` completes successfully.
# Use case: update hyprlock cache, extract colors, send notification, update waybar.
# This is the primary integration point for the ash color extraction pipeline.
## type: command optional: true
SWWW_HOOK_POST_CHANGE="bash -c 'source ${XDG_CONFIG_HOME:-$HOME/.config}/ash-cli/engines/wallpaper-engine/setter.sh && _post_wallpaper_change \"\$1\"' --"

# ── On-apply notification ─────────────────────────────────────────────────────
# When true: sends a desktop notification when wallpaper changes.
# Uses dunst/swaync via notify-send.
## type: bool default: false
SWWW_NOTIFY_ON_CHANGE=false

# ── Notification body ─────────────────────────────────────────────────────────
# {wallpaper} → replaced with wallpaper filename
# {path}      → replaced with full path
## type: string
SWWW_NOTIFY_BODY="Wallpaper changed to {wallpaper}"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION 12 — STATE TRACKING
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# The ash wallpaper engine writes state files for:
#   • Session restore (re-apply last wallpaper on login)
#   • History tracking (undo, slideshow shuffle de-dup)
#   • Analytics (most-used wallpapers, time-based preferences)
#   • Cross-tool integration (hyprlock, waybar, rofi read these)

# ── Current wallpaper state file ─────────────────────────────────────────────
# Written on every wallpaper change. Contains absolute path to active wallpaper.
# Read by: hyprlock scripts, waybar modules, rofi picker, hyprlock color conf.
## type: path
SWWW_STATE_CURRENT_FILE="${XDG_CACHE_HOME:-$HOME/.cache}/ash/state/current-wallpaper.txt"

# ── Session restore on login ──────────────────────────────────────────────────
# When true: re-applies last wallpaper from STATE_CURRENT_FILE at login.
# Managed by: scripts/system/session-init.sh
## type: bool default: true
SWWW_RESTORE_ON_LOGIN=true

# ── History file ──────────────────────────────────────────────────────────────
# Append-only log of wallpaper changes: timestamp|path|mode
## type: path
SWWW_HISTORY_FILE="${XDG_DATA_HOME:-$HOME/.local/share}/ash/history/wallpapers/wallpaper-history.log"

# ── History max entries ───────────────────────────────────────────────────────
## type: int default: 500 min: 10 max: 10000
SWWW_HISTORY_MAX_ENTRIES=500

# ── Collection metadata file ──────────────────────────────────────────────────
# Written by ash wallpaper system with collection name for hyprlock display.
## type: path
