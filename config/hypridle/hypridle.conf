# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# GLOBAL CONFIGURATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    # Lock command — integrates with ASH lock engine
    lock_cmd = pidof hyprlock || ~/.config/hypridle/scripts/lock-session.sh

    # Unlock command — runs after hyprlock exits
    # (handled internally by lock-session.sh via wait loop)
    # unlock_cmd =

    # Before sleep command — runs before systemd suspend
    before_sleep_cmd = ~/.config/hypridle/scripts/lock-session.sh --no-blur --grace 0

    # After sleep command — runs after system resumes from suspend
    after_sleep_cmd  = ~/.config/hypridle/scripts/undim-screen.sh --force && \
                       hyprctl dispatch dpms on

    # Ignore D-Bus inhibitors (false = respect them — recommended)
    ignore_dbus_inhibit = false

    # Ignore systemd-inhibit (false = respect them — recommended)
    ignore_systemd_inhibit = false
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  ⏱️  IDLE TIMELINE — CASCADING TIMEOUT LADDER                           │
# │                                                                          │
# │  0s ──────────────────────────────────────────────────────────────────  │
# │  60s    → 🔔 Idle hint notify (optional)                                │
# │  90s    → 🎵 Media auto-pause warning                                   │
# │  120s   → 🌅 Screen dim BEGIN (smooth to 15%)                           │
# │  180s   → 🌙 Screen dim DEEP (smooth to 5%)                             │
# │  240s   → 🔒 Session LOCK (hyprlock)                                    │
# │  300s   → 📺 DPMS off (display power save)                              │
# │  600s   → 💤 System SUSPEND                                             │
# │  On-AC  → 900s suspend (laptop) or 1200s (desktop)                     │
# │  Battery → 300s suspend (aggressive power save)                         │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# STAGE 0 — IDLE AWARENESS (60s)
# First signal that user may be stepping away
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 60

    # Send idle-hint to logind/portals (enables system-level idle detection)
    # Also updates ASH status for waybar module
    on-timeout = systemd-cat -t ash-hypridle echo "idle-stage:awareness" && \
                 loginctl session-status 2>/dev/null | grep -q "Active" && \
                 hyprctl keyword misc:key_press_enables_dpms true || true

    # Reset idle hint on user activity
    on-resume  = hyprctl keyword misc:key_press_enables_dpms true || true
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# STAGE 1 — NOTIFICATION CENTER CLOSE (90s)
# Close swaync panel if left open accidentally
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 90

    # Close notification center panel if open
    on-timeout = swaync-client --close-panel 2>/dev/null || true

    # No resume action needed — panel stays closed
    on-resume  =
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# STAGE 2 — SCREEN DIM BEGIN (120s)
# Smooth brightness fade to 15% — gentle eye protection
# Easing: ease-in | Duration: 3000ms | Steps: 60
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 120

    on-timeout = ~/.config/hypridle/scripts/dim-screen.sh \
                     --level    15    \
                     --duration 3000  \
                     --steps    60    \
                     --easing   ease-in-out

    on-resume  = ~/.config/hypridle/scripts/undim-screen.sh \
                     --duration 1500  \
                     --steps    45    \
                     --easing   ease-out
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# STAGE 3 — SCREEN DIM DEEP (180s)
# Further dim to near-black — pre-lock visual cue
# Easing: ease-in | Duration: 2000ms | Warm gamma shift
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 180

    on-timeout = ~/.config/hypridle/scripts/dim-screen.sh \
                     --level    5     \
                     --duration 2000  \
                     --steps    40    \
                     --easing   ease-in \
                     --gamma    0.90 0.85 0.75

    on-resume  = ~/.config/hypridle/scripts/undim-screen.sh \
                     --duration 1200  \
                     --steps    36    \
                     --easing   ease-out-expo
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# STAGE 4 — SESSION LOCK (240s)
# Full hyprlock activation with security hardening
# Clipboard clear, GPG lock, SSH agent lock, screenshare kill
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 240

    on-timeout = ~/.config/hypridle/scripts/lock-session.sh

    # Post-unlock: restore brightness, DPMS, media, notify waybar
    on-resume  = ~/.config/hypridle/scripts/undim-screen.sh --force && \
                 pkill -SIGRTMIN+6 waybar 2>/dev/null || true
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# STAGE 5 — DPMS OFF / DISPLAY POWER SAVE (300s)
# Turn off all monitor backlights to save power
# Hyprland DPMS → hardware power save state
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 300

    # Turn off all monitors via Hyprland DPMS
    on-timeout = hyprctl dispatch dpms off && \
                 pkill -SIGRTMIN+4 waybar 2>/dev/null || true

    # Re-enable displays on any activity
    on-resume  = hyprctl dispatch dpms on  && \
                 pkill -SIGRTMIN+4 waybar 2>/dev/null || true
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# STAGE 6 — KEYBOARD BACKLIGHT OFF (330s)
# Laptop keyboard backlight power save
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 330

    # Turn off keyboard backlight (laptop only — harmless on desktop)
    on-timeout = brightnessctl \
                     --device='*::kbd_backlight' \
                     set 0 -q 2>/dev/null || true

    # Restore keyboard backlight to 50% on wakeup
    on-resume  = brightnessctl \
                     --device='*::kbd_backlight' \
                     set 50% -q 2>/dev/null || true
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# STAGE 7 — SYSTEM SUSPEND (600s)
# Full RAM suspend with comprehensive pre-suspend checklist
# Battery check → mode selection → filesystem sync → network save
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 600

    on-timeout = ~/.config/hypridle/scripts/suspend.sh \
                     --smart  \
                     --reason idle

    # Post-resume: full restore sequence handled inside suspend.sh
    on-resume  = hyprctl dispatch dpms on && \
                 ~/.config/hypridle/scripts/undim-screen.sh --force && \
                 pkill -SIGRTMIN+10 waybar 2>/dev/null || true
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  🔋  BATTERY-ADAPTIVE LISTENERS                                          │
# │  These fire at shorter intervals when running on battery power           │
# │  Battery detection: /sys/class/power_supply/BAT*/status                  │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Battery-aware dim (fires at 90s on battery, redundant on AC but harmless)
listener {
    timeout  = 90

    # Only acts when on battery — checks status via cat
    on-timeout = bash -c \
        'status=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -1); \
         [[ "$status" == "Discharging" ]] && \
         ~/.config/hypridle/scripts/dim-screen.sh \
             --level    10 \
             --duration 2000 \
             --steps    40 \
             --easing   ease-in || true'

    on-resume  = bash -c \
        'status=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -1); \
         [[ "$status" == "Discharging" ]] && \
         ~/.config/hypridle/scripts/undim-screen.sh || true'
}

# Battery-aware suspend (fires at 300s on battery only)
listener {
    timeout  = 300

    on-timeout = bash -c \
        'status=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -1); \
         cap=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); \
         [[ "$status" == "Discharging" && "${cap:-100}" -lt 30 ]] && \
         ~/.config/hypridle/scripts/suspend.sh \
             --smart \
             --reason battery-idle || true'

    on-resume  = hyprctl dispatch dpms on 2>/dev/null || true
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  🎭  ASH MODE INTEGRATION                                                │
# │  Adapt idle behavior based on current ASH system mode                    │
# │  Modes: default | focus | work | game | cinema | stream | battery        │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Focus mode: extended dim timeout (no dim for 20 minutes)
listener {
    timeout  = 1200

    on-timeout = bash -c \
        'mode=$(jq -r ".mode // \"default\"" \
            "${XDG_CACHE_HOME:-$HOME/.cache}/ash/state/current-mode.json" \
            2>/dev/null); \
         [[ "$mode" == "focus" ]] && \
         ~/.config/hypridle/scripts/dim-screen.sh \
             --level    20 \
             --duration 4000 \
             --steps    60 \
             --easing   ease-in-out || true'

    on-resume  = bash -c \
        'mode=$(jq -r ".mode // \"default\"" \
            "${XDG_CACHE_HOME:-$HOME/.cache}/ash/state/current-mode.json" \
            2>/dev/null); \
         [[ "$mode" == "focus" ]] && \
         ~/.config/hypridle/scripts/undim-screen.sh || true'
}

# Game mode: DPMS inhibit — prevent screen off during gameplay
listener {
    timeout  = 600

    on-timeout = bash -c \
        'mode=$(jq -r ".mode // \"default\"" \
            "${XDG_CACHE_HOME:-$HOME/.cache}/ash/state/current-mode.json" \
            2>/dev/null); \
         [[ "$mode" == "game" ]] && \
         hyprctl dispatch dpms on 2>/dev/null || true'

    on-resume  =
}

# Cinema mode: prevent DPMS during movies/shows
listener {
    timeout  = 180

    on-timeout = bash -c \
        'mode=$(jq -r ".mode // \"default\"" \
            "${XDG_CACHE_HOME:-$HOME/.cache}/ash/state/current-mode.json" \
            2>/dev/null); \
         if [[ "$mode" == "cinema" ]]; then \
             hyprctl dispatch dpms on 2>/dev/null; \
         fi'

    on-resume  =
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  📺  MEDIA PLAYER INTEGRATION                                            │
# │  Detect active media playback and prevent idle actions                   │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Reset idle timer when media is actively playing (via playerctl)
listener {
    timeout  = 30

    on-timeout = bash -c \
        'status=$(playerctl status 2>/dev/null | head -1); \
         if [[ "$status" == "Playing" ]]; then \
             hyprctl dispatch dpms on 2>/dev/null || true; \
         fi'

    on-resume  =
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  🌙  NIGHT LIGHT AUTO-SCHEDULE                                           │
# │  Enable night light at configurable time via idle hook                   │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Circadian check — enable night light when idle during evening hours
listener {
    timeout  = 300

    on-timeout = bash -c \
        'hour=$(date +%H); \
         nl_state=$(cat "${XDG_CACHE_HOME:-$HOME/.cache}/ash/night-light.state" \
             2>/dev/null || echo "off"); \
         if (( hour >= 20 || hour <= 6 )) && [[ "$nl_state" != "on" ]]; then \
             ~/.config/swaync/scripts/night-light-on.sh \
                 --silent 2>/dev/null || true; \
         fi'

    on-resume  =
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  📊  WAYBAR IDLE INDICATOR                                               │
# │  Signal waybar to update idle status module                              │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Update waybar idle module on first idle detection
listener {
    timeout  = 60

    on-timeout = bash -c \
        'echo "idle" > "${XDG_RUNTIME_DIR:-/tmp}/ash/idle.state" && \
         pkill -SIGRTMIN+12 waybar 2>/dev/null || true'

    on-resume  = bash -c \
        'echo "active" > "${XDG_RUNTIME_DIR:-/tmp}/ash/idle.state" && \
         pkill -SIGRTMIN+12 waybar 2>/dev/null || true'
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  🔊  AUDIO AUTO-MUTE ON IDLE                                             │
# │  Mute microphone after extended idle (privacy hardening)                 │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 180

    # Mute microphone after 3 min idle (privacy)
    on-timeout = pactl set-source-mute @DEFAULT_SOURCE@ 1 2>/dev/null || true

    # Unmute on resume
    on-resume  = pactl set-source-mute @DEFAULT_SOURCE@ 0 2>/dev/null || true
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  🖥️  MULTI-MONITOR SUPPORT                                               │
# │  Apply DPMS per-monitor for heterogeneous setups                         │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# External monitor DPMS (slightly earlier than primary for power savings)
listener {
    timeout  = 270

    on-timeout = bash -c \
        'hyprctl monitors -j 2>/dev/null | \
         jq -r ".[] | select(.name != \"eDP-1\") | .name" | \
         while read mon; do \
             hyprctl dispatch dpms off "$mon" 2>/dev/null || true; \
         done'

    on-resume  = bash -c \
        'hyprctl monitors -j 2>/dev/null | \
         jq -r ".[].name" | \
         while read mon; do \
             hyprctl dispatch dpms on "$mon" 2>/dev/null || true; \
         done'
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  🐳  DOCKER CONTAINER SUSPEND PREP                                       │
# │  Gracefully checkpoint containers before system suspend                  │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 570

    # 30s before suspend — checkpoint/pause containers
    on-timeout = bash -c \
        'if command -v docker &>/dev/null; then \
             running=$(docker ps -q 2>/dev/null); \
             if [[ -n "$running" ]]; then \
                 echo "$running" | \
                 xargs -I{} docker pause {} 2>/dev/null || true; \
                 echo "$running" > \
                     "${XDG_RUNTIME_DIR:-/tmp}/ash/docker-paused.list"; \
             fi; \
         fi'

    # Resume containers after wakeup
    on-resume  = bash -c \
        'list="${XDG_RUNTIME_DIR:-/tmp}/ash/docker-paused.list"; \
         if [[ -f "$list" ]]; then \
             cat "$list" | \
             xargs -I{} docker unpause {} 2>/dev/null || true; \
             rm -f "$list"; \
         fi'
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  🔵  BLUETOOTH AUTO-MANAGE                                               │
# │  Disconnect BT devices on extended idle to save power + prevent          │
# │  accidental audio routing during lock                                    │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 540

    # Disconnect BT audio devices when idle for 9 minutes
    on-timeout = bash -c \
        'bluetoothctl devices Connected 2>/dev/null | \
         while read _ mac _; do \
             [[ -n "$mac" ]] && \
             bluetoothctl disconnect "$mac" 2>/dev/null || true; \
         done; \
         echo "disconnected" > \
             "${XDG_RUNTIME_DIR:-/tmp}/ash/bt-idle.state"'

    # Reconnect trusted devices on wakeup
    on-resume  = bash -c \
        'state_file="${XDG_RUNTIME_DIR:-/tmp}/ash/bt-idle.state"; \
         [[ -f "$state_file" ]] && \
         bluetoothctl devices Paired 2>/dev/null | \
         while read _ mac _; do \
             [[ -n "$mac" ]] && \
             bluetoothctl connect "$mac" 2>/dev/null || true; \
         done; \
         rm -f "$state_file"'
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  📡  NETWORK IDLE OPTIMIZATIONS                                          │
# │  Reduce network polling when idle to save power (laptop mode)            │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 300

    # Reduce NetworkManager scanning interval while idle (battery save)
    on-timeout = bash -c \
        'bat_status=$(cat /sys/class/power_supply/BAT*/status \
             2>/dev/null | head -1); \
         [[ "$bat_status" == "Discharging" ]] && \
         nmcli radio wifi off 2>/dev/null || true'

    # Restore WiFi when active
    on-resume  = bash -c \
        'bat_status=$(cat /sys/class/power_supply/BAT*/status \
             2>/dev/null | head -1); \
         [[ "$bat_status" == "Discharging" ]] && \
         nmcli radio wifi on 2>/dev/null || true'
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  🎨  HYPRLAND COMPOSITOR TWEAKS                                          │
# │  Reduce compositor overhead during idle to save GPU power                │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 150

    # Disable expensive compositor effects when idle
    on-timeout = bash -c \
        'hyprctl keyword animations:enabled false 2>/dev/null || true && \
         hyprctl keyword decoration:blur:enabled false 2>/dev/null || true && \
         hyprctl keyword decoration:shadow:enabled false 2>/dev/null || true && \
         echo "tweaked" > "${XDG_RUNTIME_DIR:-/tmp}/ash/compositor-idle.state"'

    # Restore full compositor effects on activity
    on-resume  = bash -c \
        'state="${XDG_RUNTIME_DIR:-/tmp}/ash/compositor-idle.state"; \
         [[ -f "$state" ]] && \
         hyprctl keyword animations:enabled true 2>/dev/null || true && \
         hyprctl keyword decoration:blur:enabled true 2>/dev/null || true && \
         hyprctl keyword decoration:shadow:enabled true 2>/dev/null || true && \
         rm -f "$state"'
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  💾  FILESYSTEM SYNC ON IDLE                                             │
# │  Flush write caches to prevent data loss during unexpected power loss     │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 120

    # Sync dirty pages to disk when idle
    on-timeout = bash -c \
        'sync 2>/dev/null; \
         echo "idle-sync: $(date -Iseconds)" >> \
             "${XDG_CACHE_HOME:-$HOME/.cache}/ash/logs/idle-sync.log" \
             2>/dev/null || true'

    on-resume  =
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  📋  CLIPBOARD SECURITY TIMER                                            │
# │  Auto-clear clipboard after extended idle (sensitive data protection)    │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 600

    # Clear clipboard after 10 minutes idle
    on-timeout = bash -c \
        'if command -v wl-copy &>/dev/null; then \
             echo -n "" | wl-copy 2>/dev/null || true; \
             echo -n "" | wl-copy --primary 2>/dev/null || true; \
         fi; \
         if command -v cliphist &>/dev/null; then \
             cliphist wipe 2>/dev/null || true; \
         fi'

    on-resume  =
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  📸  IDLE SCREENSHOT / ANALYTICS                                         │
# │  Record idle sessions for ASH analytics dashboard                        │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 60

    # Record idle session start timestamp
    on-timeout = bash -c \
        'ts=$(date +%s); \
         mkdir -p "${XDG_CACHE_HOME:-$HOME/.cache}/ash"; \
         echo "$ts" > \
             "${XDG_CACHE_HOME:-$HOME/.cache}/ash/idle-start.tmp"'

    # Record session duration to analytics
    on-resume  = bash -c \
        'tmp="${XDG_CACHE_HOME:-$HOME/.cache}/ash/idle-start.tmp"; \
         if [[ -f "$tmp" ]]; then \
             start=$(cat "$tmp"); \
             dur=$(( $(date +%s) - start )); \
             date_key=$(date "+%Y-%m-%d"); \
             analytics="${XDG_CACHE_HOME:-$HOME/.cache}/ash/idle-analytics.json"; \
             [[ ! -f "$analytics" ]] && echo "{}" > "$analytics"; \
             if command -v jq &>/dev/null; then \
                 jq --arg d "$date_key" \
                    --argjson dur "$dur" \
                    ".sessions[\$d] = ((.sessions[\$d] // 0) + \$dur)" \
                    "$analytics" > "${analytics}.tmp" && \
                 mv "${analytics}.tmp" "$analytics"; \
             fi; \
             rm -f "$tmp"; \
         fi'
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  🌡️  THERMAL MANAGEMENT                                                  │
# │  Apply power saving governor when idle to reduce heat and power          │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 180

    # Switch to powersave CPU governor when idle
    on-timeout = bash -c \
        'if command -v powerprofilesctl &>/dev/null; then \
             powerprofilesctl set power-saver 2>/dev/null || true; \
             echo "$(powerprofilesctl get)" > \
                 "${XDG_RUNTIME_DIR:-/tmp}/ash/cpu-profile-before-idle"; \
         elif [[ -f /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor ]]; then \
             cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor > \
                 "${XDG_RUNTIME_DIR:-/tmp}/ash/cpu-governor-backup" \
                 2>/dev/null || true; \
             echo "powersave" | \
             tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor \
                 2>/dev/null || true; \
         fi'

    # Restore performance profile on activity
    on-resume  = bash -c \
        'profile_file="${XDG_RUNTIME_DIR:-/tmp}/ash/cpu-profile-before-idle"; \
         gov_file="${XDG_RUNTIME_DIR:-/tmp}/ash/cpu-governor-backup"; \
         if command -v powerprofilesctl &>/dev/null; then \
             if [[ -f "$profile_file" ]]; then \
                 prev=$(cat "$profile_file"); \
                 powerprofilesctl set "${prev:-balanced}" 2>/dev/null || true; \
                 rm -f "$profile_file"; \
             else \
                 powerprofilesctl set balanced 2>/dev/null || true; \
             fi; \
         elif [[ -f "$gov_file" ]]; then \
             gov=$(cat "$gov_file"); \
             echo "${gov:-performance}" | \
             tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor \
                 2>/dev/null || true; \
             rm -f "$gov_file"; \
         fi'
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  🔔  SWAYNC DND AUTO-ENABLE                                              │
# │  Enable Do Not Disturb when screen locks — disable on unlock             │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 240

    # Enable DND when session locks (same timeout as lock stage)
    on-timeout = swaync-client --dnd-on 2>/dev/null || true

    # Disable DND when user returns
    on-resume  = swaync-client --dnd-off 2>/dev/null || true
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  🖱️  INPUT DEVICE POWER MANAGEMENT                                       │
# │  Manage USB/Bluetooth input device power states                          │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 400

    # Enable USB autosuspend for HID devices when idle
    on-timeout = bash -c \
        'for device in /sys/bus/usb/devices/*/power/autosuspend_delay_ms; do \
             echo "1000" > "$device" 2>/dev/null || true; \
         done; \
         for device in /sys/bus/usb/devices/*/power/control; do \
             echo "auto" > "$device" 2>/dev/null || true; \
         done'

    # Restore USB power control to 'on' for responsiveness
    on-resume  = bash -c \
        'for device in /sys/bus/usb/devices/*/power/control; do \
             echo "on" > "$device" 2>/dev/null || true; \
         done'
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  🎯  POMODORO SESSION INTEGRATION                                         │
# │  Prevent idle during active Pomodoro work sessions                       │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 120

    # Check if Pomodoro session is active before dimming
    on-timeout = bash -c \
        'pomodoro_state="${XDG_RUNTIME_DIR:-/tmp}/ash/pomodoro.state"; \
         if [[ -f "$pomodoro_state" ]]; then \
             phase=$(cat "$pomodoro_state" 2>/dev/null); \
             if [[ "$phase" == "work" ]]; then \
                 hyprctl dispatch dpms on 2>/dev/null || true; \
                 exit 0; \
             fi; \
         fi'

    on-resume  =
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  🔐  GPG AGENT CACHE EXPIRY                                              │
# │  Clear GPG passphrase cache on idle for security                         │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 600

    # Expire GPG agent cache after 10 minutes idle
    on-timeout = bash -c \
        'if command -v gpg-connect-agent &>/dev/null; then \
             gpg-connect-agent reloadagent /bye 2>/dev/null || true; \
         fi'

    on-resume  =
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  ♿  ACCESSIBILITY IDLE HINT                                              │
# │  Extended timeouts for accessibility needs (triggered by ash config)     │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 3600

    # Extended timeout — fires after 1hr for accessibility mode check
    on-timeout = bash -c \
        'mode=$(jq -r ".mode // \"default\"" \
            "${XDG_CACHE_HOME:-$HOME/.cache}/ash/state/current-mode.json" \
            2>/dev/null || echo "default"); \
         if [[ "$mode" == "accessibility" ]]; then \
             notify-send \
                 --urgency=low \
                 --expire-time=10000 \
                 "󰛓  Eye Break Reminder" \
                 "You have been active for 1 hour. Take a break!" \
                 2>/dev/null || true; \
         fi'

    on-resume  =
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  🛑  HYPRLAND IDLE HINT D-BUS                                            │
# │  Proper xdg-desktop-portal idle hint for screensaver inhibitor support   │
# └─────────────────────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

listener {
    timeout  = 60

    # Set idle hint via logind D-Bus for portal compatibility
    on-timeout = bash -c \
        'if command -v gdbus &>/dev/null; then \
             gdbus call \
                 --session \
                 --dest org.freedesktop.login1 \
                 --object-path /org/freedesktop/login1/session/auto \
                 --method org.freedesktop.login1.Session.SetIdleHint \
                 true 2>/dev/null || true; \
         fi'

    on-resume  = bash -c \
        'if command -v gdbus &>/dev/null; then \
             gdbus call \
                 --session \
                 --dest org.freedesktop.login1 \
                 --object-path /org/freedesktop/login1/session/auto \
                 --method org.freedesktop.login1.Session.SetIdleHint \
                 false 2>/dev/null || true; \
         fi'
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
#  📊  COMPLETE IDLE TIMELINE SUMMARY
#  ────────────────────────────────────────────────────────────────────────
#   30s  │ Media playing check → DPMS on if Playing
#   60s  │ Idle awareness + D-Bus hint + Waybar update + Analytics start
#   90s  │ SwayNC panel close + Battery dim (10% if discharging)
#  120s  │ Screen DIM (15%) + FS sync + Compositor tweaks + Pomodoro check
#  150s  │ Compositor effects reduced (blur/shadow/animation off)
#  180s  │ Screen DIM DEEP (5%) + Mic mute + CPU powersave + Circadian NL
#  240s  │ Session LOCK (hyprlock) + DND on
#  270s  │ External monitor DPMS off
#  300s  │ Primary DPMS off + Network save + Battery suspend (low bat)
#  330s  │ Keyboard backlight off
#  400s  │ USB autosuspend enabled
#  540s  │ Bluetooth devices disconnected
#  570s  │ Docker containers paused
#  600s  │ System SUSPEND (smart mode) + Clipboard clear + GPG cache clear
#  1200s │ Focus mode special dim
#  3600s │ Accessibility break reminder
#  ────────────────────────────────────────────────────────────────────────
#
#  🔄  RESUME SEQUENCE (reverse cascade)
#  ────────────────────────────────────────────────────────────────────────
#  ALL   │ Waybar signal → idle.state = active
#  DPMS  │ hyprctl dispatch dpms on (all monitors)
#  BT    │ Reconnect trusted BT devices
#  NET   │ nmcli radio wifi on (if was discharging)
#  CPU   │ powerprofilesctl set balanced (restore)
#  USB   │ /sys power/control = on
#  MEDIA │ playerctl play (was playing before)
#  MIC   │ pactl source unmute
#  DND   │ swaync-client --dnd-off
#  COMP  │ animations/blur/shadow restored
#  DIM   │ undim-screen.sh --force (restore exact brightness)
#  DOCKER│ docker unpause (all paused containers)
#  ────────────────────────────────────────────────────────────────────────
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━