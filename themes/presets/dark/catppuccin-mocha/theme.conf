# ══════════════════════════════════════════════════════════════════════════════
# §01  COLOR FORMAT REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
#  Hyprland accepts these color formats in $variable = VALUE:
#
#  rgb(RRGGBB)          — hex triplet, no alpha     e.g. rgb(1e1e2e)
#  rgba(RRGGBBAA)       — hex with alpha (00-ff)    e.g. rgba(1e1e2ecc)
#  rgba(RRGGBBAA)       — used in col.* properties
#  0xAARRGGBB           — legacy format (avoid)
#
#  Color gradient syntax (for borders, groupbar):
#  $var $var2 ANGLE deg — e.g. $colorAccent $colorBlue 45deg
#  rgba(hex) rgba(hex) ANGLEdeg
#
#  ALPHA values (hex):
#  ff = 100%    e6 = 90%    cc = 80%    b3 = 70%
#  99 = 60%    80 = 50%    66 = 40%    4d = 30%
#  33 = 20%    1a = 10%    0d = 5%     00 = 0%
#
# ══════════════════════════════════════════════════════════════════════════════
# §02  CATPPUCCIN MOCHA — BASE PALETTE
#      Full palette definition — all 26 colors
#      Source: https://github.com/catppuccin/catppuccin
# ══════════════════════════════════════════════════════════════════════════════

# ── Background layer (darkest → lightest) ─────────────────────────────────────
$colorCrust         = rgb(11111b)    # #11111b  — deepest background
$colorMantle        = rgb(181825)    # #181825  — secondary background
$colorBase          = rgb(1e1e2e)    # #1e1e2e  — primary background
$colorSurface0      = rgb(313244)    # #313244  — surface / inactive element
$colorSurface1      = rgb(45475a)    # #45475a  — raised surface
$colorSurface2      = rgb(585b70)    # #585b70  — elevated surface

# ── Overlay layer (subdued text / icons) ──────────────────────────────────────
$colorOverlay0      = rgb(6c7086)    # #6c7086  — comments, disabled
$colorOverlay1      = rgb(7f849c)    # #7f849c  — subtle text
$colorOverlay2      = rgb(9399b2)    # #9399b2  — muted text

# ── Text layer ────────────────────────────────────────────────────────────────
$colorSubtext0      = rgb(a6adc8)    # #a6adc8  — secondary text
$colorSubtext1      = rgb(bac2de)    # #bac2de  — body text
$colorText          = rgb(cdd6f4)    # #cdd6f4  — primary text

# ── Accent palette (all named colors) ────────────────────────────────────────
$colorRosewater     = rgb(f5e0dc)    # #f5e0dc  — rosewater
$colorFlamingo      = rgb(f2cdcd)    # #f2cdcd  — flamingo
$colorPink          = rgb(f5c2e7)    # #f5c2e7  — pink
$colorMauve         =