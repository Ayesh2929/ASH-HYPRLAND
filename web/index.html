<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#1e1e2e" />
    <meta name="description" content="ASH Dotfiles v5.0 OMEGA — theme, plugin and snapshot control surface." />
    <link rel="icon" type="image/svg+xml" href="/ash-logo.svg" />
    <title>ASH OMEGA — Control Surface</title>
    <script>
      // Paint the stored theme before first frame so there is no flash of the
      // wrong palette. Kept inline and dependency-free on purpose.
      (function () {
        try {
          var t = localStorage.getItem('ash-theme') || 'mocha'
          document.documentElement.dataset.theme = t
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
